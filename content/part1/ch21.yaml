            r: "main verb: that, there is no one who can prevent"
          - {s: "dijo don Quijote", r: "speech tag: said Don Quijote"}
        forms:
          - {w: "hay", f: "haber used alone: 'there is'."}
          - {w: "la quite", f: "quit- + -e → quitar (to take away), present subjunctive, he, with 'la' (it). Subjunctive because no such person exists ('no hay quien'). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. The 'la' is feminine though 'eso' is neuter; Cervantes may be thinking of 'la doncella' or 'la esposa'."}
  - sentences:
      - es: "— Pues, como eso sea —respondió Sancho—, no hay sino encomendarnos a Dios, y dejar correr la suerte por donde mejor lo encaminare."
        literal: "— Well, as that be —answered Sancho—, not there-is but to-commend-ourselves to God, and let run the luck through where better it should-direct."
        ormsby: "“Then since that may be,” said Sancho, “there is nothing for it but to commend ourselves to God, and let fortune take what course it will.”"
        vocab:
          - {w: "como eso sea", d: "as long as that is so, provided that"}
          - {w: "encomendarse a Dios", d: "to commend oneself to God"}
          - {w: "dejar correr", d: "to let run, let take its course"}
          - {w: "encaminar", d: "to direct, guide"}
        diagram:
          - s: "no hay sino encomendarnos a Dios, y dejar correr la suerte"
            r: "main verb: there is nothing to do but commend ourselves to God and let luck run"
            under:
              - {s: "como eso sea", r: "condition: provided that is so"}
              - {s: "por donde mejor lo encaminare", r: "where: wherever it best directs things"}
          - {s: "respondió Sancho", r: "speech tag: Sancho answered"}
        forms:
          - {w: "sea", f: "ser (to be), present subjunctive, it, after 'como' (provided that). sea, seas, sea, seamos, seáis, sean."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "encomendarnos", f: "infinitive encomendar (to commend) + nos (ourselves), after 'no hay sino'."}
          - {w: "lo encaminare", f: "encamin- + -are → encaminar (to direct), future subjunctive, it, with 'lo' (it, things). The future subjunctive of -ar verbs: -are, -ares, -are, -áremos, -areis, -aren. Modern 'encamine'."}
  - sentences:
      - es: "— Hágalo Dios —respondió don Quijote— como yo deseo y tú, Sancho, has menester; y ruin sea quien por ruin se tiene."
        literal: "— May-do-it God —answered Don Quijote— as I desire and you, Sancho, have need; and mean be who for mean himself holds."
        ormsby: "“God guide it according to my wishes and thy wants,” said Don Quixote, “and mean be he who thinks himself mean.”"
        ormsby_note: "Proverb 210."
        vocab:
          - {w: "hágalo Dios", d: "God grant it, may God do it"}
          - {w: "haber menester", d: "to need (old)"}
          - {w: "ruin", d: "base, mean, low"}
          - {w: "ruin sea quien por ruin se tiene", d: "proverb: let him be base who thinks himself base, i.e. a man is what he believes himself to be"}
        diagram:
          - s: "Hágalo Dios"
            r: "main verb 1, wish: may God do it"
            under:
              - {s: "como yo deseo y tú, Sancho, has menester", r: "how: as I wish and you, Sancho, need"}
          - {s: "respondió don Quijote", r: "speech tag: Don Quijote answered"}
          - s: "y ruin sea"
            r: "main verb 2, wish: and base be"
            under:
              - {s: "quien por ruin se tiene", r: "who: whoever thinks himself base"}
        forms:
          - {w: "Hágalo", f: "hag- + -a → hacer (to do), present subjunctive as a wish, he (God), with 'lo' (it) on the end and an accent added. haga, hagas, haga, hagamos, hagáis, hagan."}
          - {w: "deseo", f: "dese- + -o → desear (to wish), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "has menester", f: "has, present of haber, you (tú), in the old phrase 'haber menester' (to need). he, has, ha, hemos, habéis, han."}
          - {w: "sea", f: "ser (to be), present subjunctive as a wish, he. sea, seas, sea, seamos, seáis, sean."}
          - {w: "se tiene", f: "tien- + -e → tenerse (to consider oneself), present, he. tengo, tienes, tiene, tenemos, tenéis, tienen."}
  - sentences:
      - es: "— Sea par Dios —dijo Sancho—, que yo cristiano viejo soy, y para ser conde esto me basta."
        literal: "— Be-it by God —said Sancho—, for I Christian old am, and for being count this to-me suffices."
        ormsby: "“In God’s name let him be so,” said Sancho: “I am an old Christian, and to fit me for a count that’s enough.”"
        ormsby_note: "Proverb 61."
        vocab:
          - {w: "par Dios", d: "by God (a rustic form of 'por Dios')"}
          - {w: "cristiano viejo", d: "'old Christian': one with no Jewish or Moorish ancestry, a status that mattered greatly in Cervantes' Spain"}
          - {w: "conde", d: "count"}
          - {w: "bastar", d: "to be enough"}
        diagram:
          - {s: "Sea par Dios", r: "main verb 1, wish: so be it, by God"}
          - {s: "dijo Sancho", r: "speech tag: said Sancho"}
          - {s: "que yo cristiano viejo soy", r: "reason ('que' = for): I am an old Christian"}
          - s: "y para ser conde esto me basta"
            r: "main verb 2: and for being a count this is enough for me"
        forms:
          - {w: "Sea", f: "ser (to be), present subjunctive as a wish, it: 'so be it'. sea, seas, sea, seamos, seáis, sean."}
          - {w: "soy", f: "ser (to be), present, I. soy, eres, es, somos, sois, son. The verb comes last for emphasis."}
          - {w: "me basta", f: "bast- + -a → bastar (to suffice), present, it, with 'me' (for me). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
        note: "'Old Christian' meant pure Christian descent, with no converted Jews or Moors among one's ancestors; peasants often boasted of it as their only nobility. Sancho thinks it qualifies him for a title."
  - sentences:
      - es: "— Y aun te sobra —dijo don Quijote—; y cuando no lo fueras, no hacía nada al caso, porque, siendo yo el rey, bien te puedo dar nobleza, sin que la compres ni me sirvas con nada."
        literal: "— And even to-you is-left-over —said Don Quijote—; and when not it you-were, not it-made nothing to-the case, because, being I the king, well to-you I-can give nobility, without that it you-buy nor me you-serve with anything."
        ormsby: "“And more than enough for thee,” said Don Quixote; “and even wert thou not, it would make no difference, because I being the king can easily give thee nobility without purchase or service rendered by thee,"
        vocab:
          - {w: "sobrar", d: "to be more than enough"}
          - {w: "cuando no", d: "even if not"}
          - {w: "no hacer al caso", d: "to make no difference"}
          - {w: "nobleza", d: "nobility"}
