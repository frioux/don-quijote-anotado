          - {w: "fantasma", d: "phantom, apparition; feminine here ('aquella fantasma'), as it often was in old Spanish; modern 'el fantasma'"}
          - {w: "no tener otro remedio", d: "to have no other way out, no choice"}
          - {w: "guardarse de", d: "to protect oneself from"}
