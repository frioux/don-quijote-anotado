              - s: "cuán poco se gana y granjea de andar buscando estas aventuras"
                r: "what I considered: how little is gained by going after these adventures"
                under:
                  - {s: "que vuestra merced busca por estos desiertos y encrucijadas de caminos", r: "describes 'aventuras': that your worship seeks in these wilds and crossroads"}
                  - s: "donde ... no hay quien las vea ni sepa"
                    r: "describes 'desiertos': where there is no one to see or know of them"
                    under:
