  - sentences:
      - es: "— ¡Defiéndete, cautiva criatura, o entriégame de tu voluntad lo que con tanta razón se me debe!"
        literal: "— Defend-yourself, wretched creature, or hand-over-to-me of your will that which with so-much reason itself to-me is-owed!"
        ormsby: "“Defend thyself, miserable being, or yield me of thine own accord that which is so reasonably my due.”"
        vocab:
          - {w: "cautivo", d: "here: wretched, miserable (literally 'captive'); a stock insult in the romances"}
          - {w: "criatura", d: "creature"}
          - {w: "entriégame", d: "= entrégame, hand over to me; the ie is an old stressed form of entregar"}
          - {w: "de tu voluntad", d: "of your own free will"}
          - {w: "deberse", d: "to be owed; 'se me debe' = is owed to me"}
        diagram:
          - {s: "¡Defiéndete", r: "command 1: defend yourself"}
          - {s: "cautiva criatura", r: "address: wretched creature"}
          - s: "o entriégame de tu voluntad"
            r: "command 2: or hand over to me of your own will"
            under:
              - {s: "lo que con tanta razón se me debe!", r: "object: what is so rightly owed to me"}
        forms:
          - {w: "Defiéndete", f: "defiende, the command of defender (to defend) for tú, + te (yourself), with an accent added. The stem e becomes ie when stressed: defiendo, defiendes, defiende, defendemos, defendéis, defienden."}
          - {w: "cautiva", f: "cautiv- + -a → cautivo (wretched), feminine to match 'criatura', though the barber is a man."}
          - {w: "entriégame", f: "entriega, an old command of entregar (to hand over) for tú (modern 'entrega'), + me (to me), with an accent added. Old Spanish diphthongized the stressed e of this verb: entriego, entriegas, entriega."}
          - {w: "tu", f: "'your' (for tú), no accent; 'tú' with the accent is 'you'."}
          - {w: "se me debe", f: "deb- + -e → deber (to owe), present, it, with 'se' (passive: is owed) and 'me' (to me). The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
        note: "The challenge is the formula of the romances: the knight demands surrender of the prize before striking. Here it is bellowed at a barber in the rain."
  - sentences:
      - es: "El barbero, que, tan sin pensarlo ni temerlo, vio venir aquella fantasma sobre sí, no tuvo otro remedio, para poder guardarse del golpe de la lanza, si no fue el dejarse caer del asno abajo;"
        literal: "The barber, who, so without thinking-it nor fearing-it, saw come that phantom upon himself, not had other remedy, in-order to-be-able to-guard-himself from-the blow of the lance, if not it-was the letting-himself fall from-the donkey down;"
