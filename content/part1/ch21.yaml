      - es: "Y cuando él vio que el pobre caballero llegaba cerca, sin ponerse con él en razones, a todo correr de Rocinante le enristró con el lanzón bajo, llevando intención de pasarle de parte a parte; mas cuando a él llegaba, sin detener la furia de su carrera, le dijo:"
