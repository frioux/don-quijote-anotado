          - {w: "granjear", d: "to earn, gain, profit"}
          - {w: "desierto", d: "wilderness, empty country (not only sandy desert)"}
          - {w: "encrucijada", d: "crossroads"}
          - {w: "ya que", d: "here: even if, granted that (not 'since')"}
          - {w: "eligrosas", d: "a misprint in the Gutenberg text for 'peligrosas', dangerous"}
          - {w: "no hay quien", d: "there is no one who"}
        diagram:
          - {s: "Digo, pues, señor", r: "main verb: I say, then, sir"}
          - {s: "respondió Sancho", r: "speech tag: Sancho answered"}
          - s: "he considerado"
            r: "what I say: I have been considering"
            under:
