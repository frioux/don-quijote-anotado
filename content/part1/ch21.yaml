summary: |
  It begins to rain. Sancho would like to shelter in the fulling mills, but Don Quijote now loathes them, so they take another road. Soon Don Quijote sees a horseman with something on his head that shines like gold, and declares that it is the enchanted helmet of Mambrino, which he has sworn to win. Sancho sees only a man on a grey donkey with something shiny on his head. The narrator explains: a village barber, riding to bleed one patient and shave another, has put his brass shaving basin on his head to keep the rain off his new hat.

  Don Quijote charges at full gallop with his pike lowered. The terrified barber throws himself off his donkey and runs away faster than the wind, leaving the basin behind. Don Quijote puts it on, finds it fits badly, and decides that someone ignorant of its value must have melted down half of the enchanted golden helmet. He will have it repaired by a blacksmith; meanwhile something is better than nothing. Sancho can hardly keep from laughing. He would like to keep the barber's donkey too, but Don Quijote rules that knights do not take the horses of the defeated; he does allow Sancho to swap the pack-saddles, which Sancho does at once.

  Riding on wherever Rocinante chooses, Sancho asks leave to speak and suggests they take service with some emperor at war, where their deeds would be seen and written down. Don Quijote replies that a knight must first win fame on the roads, and then tells the whole story of how a knight-errant becomes a king: he arrives at a court, falls in love with the princess, wins the king's war, marries her (abducting her if need be), turns out to be a king's son, and inherits the throne, marrying his squire to the princess's lady-in-waiting.

  Sancho is delighted and looks forward to being a count. Don Quijote worries that he cannot prove royal blood, but reflects that lineages rise and fall. Sancho boasts of having once been a beadle in a confraternity and plans to keep a barber to shave his beard and ride behind him, as he once saw an equerry follow a little grandee at court. Then Don Quijote raises his eyes and sees what the next chapter will tell.
context: |
  Barbers and basins. The village barber was also the village surgeon: he shaved, pulled teeth and let blood, and the brass basin, with a half-moon notch cut in its rim to fit under the customer's chin, was the sign of his trade. Small villages had no barber or apothecary and shared one with a larger neighbor, as here. Money appears in Sancho's valuation: a 'real de a ocho', the silver piece of eight (about 1s. 8d. in Ormsby's day, he notes), was a good deal for a brass bowl. Status runs through the second half of the chapter: Don Quijote is an 'hidalgo de solar conocido' entitled to the five hundred sueldos, an old legal mark of gentility that Ormsby explains in a note; Sancho is an 'old Christian', of untainted descent, and a former confraternity beadle; and a shaggy beard is what would give away a peasant made count.

  Chivalric sources. Mambrino is a Moorish king from Boiardo and Ariosto whose enchanted helmet was won by Rinaldo; Don Quijote swore in Chapter 10 to win such a helmet. His long speech is, as Ormsby says, an admirable epitome of a typical romance of chivalry with no extravagant caricature, every incident having authority in the books: the hero of unknown birth, the princess at the window grille, the dwarf and the lady with an adventure no one else can achieve, the war won for the king, the lineage revealed. The Knight of the Sun is the hero of the Espejo de príncipes y caballeros. Cervantes lets the knight tell it almost entirely in the future tense, and the verbs pile up faster and faster until the whole war is one sentence.

  The narrator's games. The narrator steps in to give the true account of the 'helmet' before the charge, so the reader watches Don Quijote's reading of the world against the facts. He also slips learned jokes into small things: Sancho's swap of pack-saddles is called 'mutatio caparum', the cardinals' ceremonial change of hoods (Ormsby calls the application audacious), and the improved donkey is 'mejorado en tercio y quinto', a phrase from the law of inheritance. Breakfast 'cuts' their choler and melancholy, a joke on humoral medicine.

  Law, religion and learning. Don Quijote reasons like a jurist: spoils are lawful only in a just war, and in a doubtful case permission is granted pending better information. The beaver fable comes from Pliny and the bestiaries. Helen of Troy and Vulcan forging arms for Mars show the knight's classical reading. Sancho's 'old Christian' boast reflects the obsession with 'limpieza de sangre' (purity of blood) in Spain. Ormsby suggests the tiny grandee Sancho saw at court was the Duke of Osuna.

  Names and jokes. Sancho calls Mambrino 'Martino', which Ormsby notes is a blunder; he says 'litado' for 'dictado' (title), which Ormsby renders 'tittle'. 'Malandantes pensamientos' puns on 'caballero andante': an ill-errant knight. Sancho strings proverbs together (marjoram, Villadiego, a 'salto de mata', which Ormsby explains originally meant a bolt after slaughter), and Ormsby numbers each in his notes; Don Quijote has just declared all proverbs true.

  Reading Cervantes' Spanish. This chapter is rich in old forms: f- for h- in the romance pastiche and in Sancho's speech (fermosa, fablar, face, furto, ferido); archaic spellings (mesmo, ansí, agora, escuridad, estraño, acidente, recebir, sospiro, subjeto, propriedad, decendencia, ligítima, disignio, malenconía, encantamento, estranjero, sesto); fused forms (della, dello, deste, déstos, dél, dellos); -rl- turned into -ll- (mirallos, trocalle, roballa, llevalla, entregalle, tenelle); and many pronouns hung on the verb (Dígolo, Dejóse, vínosele, Ríome, Vase, échase, traspásasele, Respondiéronme). Watch for the old split future with the pronoun inside ('Levantarse han', 'prometérselo ha'), the perfect with ser ('se es ido'), the future subjunctive everywhere (acertare, pudiere, fuere, quisieres, llevare, dijeren), the -ra form used as a conditional (quisiera, diera, pudiera, hubiera vuelto), and false friends: ocasión (cause), sucesos (events), discreto (wise), empresa (shield device), descubrir (to catch sight of). One typo in the Gutenberg text, 'asaduras.along', is kept as is.
