          - {s: "dijo don Quijote", r: "speech tag: said Don Quijote"}
          - s: "no hacía nada al caso"
            r: "main verb 2 (after 'y'): it would make no difference"
            under:
              - {s: "cuando no lo fueras", r: "condition: even if you were not"}
              - s: "porque, siendo yo el rey, bien te puedo dar nobleza"
                r: "why: because, as king, I can give you nobility"
                under:
                  - {s: "sin que la compres ni me sirvas con nada", r: "how: without your buying it or paying for it with service"}
        forms:
          - {w: "te sobra", f: "sobr- + -a → sobrar (to be left over), present, it, with 'te' (for you). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "fueras", f: "fu- + -eras → ser (to be), imperfect subjunctive (-ra form), you: 'if you were'. fuera, fueras, fuera, fuéramos, fuerais, fueran."}
          - {w: "hacía", f: "hac- + -ía → hacer (to make), imperfect, it, used as a conditional: 'it would make'. The imperfect of -er verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "siendo", f: "gerund of ser (to be): 'being'."}
          - {w: "puedo", f: "pued- + -o → poder (to be able), present, I. puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "compres, sirvas", f: "compr- + -es → comprar (to buy), sirv- + -as → servir (to serve), present subjunctive, you, after 'sin que'. comprar: compre, compres, compre, compremos, compréis, compren; servir: sirva, sirvas, sirva, sirvamos, sirváis, sirvan."}
