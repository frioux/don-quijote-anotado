          - {w: "hubiera vuelto, hubiera hecho", f: "hub- + -iera → haber (to have), imperfect subjunctive (-ra form), I, + vuelto and hecho, the irregular participles of volver (to return) and hacer (to do): 'I would have returned', 'would have done'. haber: hubiera, hubieras, hubiera, hubiéramos, hubierais, hubieran. The -ra pluperfect subjunctive stands for the conditional perfect 'habría vuelto'."}
