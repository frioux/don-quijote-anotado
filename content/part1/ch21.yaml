  - sentences:
      - es: "— Eso no hay quien la quite —dijo don Quijote."
        literal: "— That not there-is who it take-away —said Don Quijote."
        ormsby: "“Nobody can object to that,” said Don Quixote."
        vocab:
          - {w: "no hay quien lo quite", d: "nobody can prevent it, no one can take that away"}
        diagram:
