          - {w: "venció", f: "venc- + -ió → vencer (to vanquish), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "gigantazo", f: "gigante (giant) + -azo, the augmentative suffix: 'great hulking giant'."}
          - {w: "desencantó", f: "desencant- + -ó → desencantar (to disenchant), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
