      - es: "Así que, de mano en mano, irán pregonando tus hechos, y luego, al alboroto de los muchachos y de la demás gente, se parará a las fenestras de su real palacio el rey de aquel reino, y así como vea al caballero, conociéndole por las armas o por la empresa del escudo, forzosamente ha de decir: «¡Ea, sus!"
