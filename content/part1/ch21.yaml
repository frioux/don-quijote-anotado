  - sentences:
      - es: "Cortada, pues, la cólera, y aun la malenconía, subieron a caballo, y, sin tomar determinado camino, por ser muy de caballeros andantes el no tomar ninguno cierto, se pusieron a caminar por donde la voluntad de Rocinante quiso, que se llevaba tras sí la de su amo, y aun la del asno, que siempre le seguía por dondequiera que guiaba, en buen amor y compañía."
        literal: "Cut, then, the choler, and even the melancholy, they-climbed on horseback, and, without taking determined road, for being very of knights errant the not taking any certain, themselves they-put to travel through where the will of Rocinante wanted, which itself carried behind itself that of his master, and even that of-the donkey, which always him followed through wherever that he-led, in good love and company."
        ormsby: "and, all anger and gloom removed, they mounted and, without taking any fixed road (not to fix upon any being the proper thing for true knights-errant), they set out, guided by Rocinante’s will, which carried along with it that of his master, not to say that of the ass, which always followed him wherever he led, lovingly and sociably;"
        vocab:
          - {w: "cortar la cólera", d: "to cut off one's anger; 'cortar la cólera' was also a medical phrase for breaking a fast to settle the bile, so breakfast has 'cut' their choler"}
          - {w: "cólera", d: "choler, anger; one of the four humors, yellow bile"}
