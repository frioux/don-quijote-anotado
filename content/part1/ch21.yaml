  - sentences:
      - es: "— No dices mal, Sancho —respondió don Quijote—; mas, antes que se llegue a ese término, es menester andar por el mundo, como en aprobación, buscando las aventuras, para que, acabando algunas, se cobre nombre y fama tal que, cuando se fuere a la corte de algún gran monarca, ya sea el caballero conocido por sus obras;"
        literal: "— Not you-say badly, Sancho —answered Don Quijote—; but, before that itself one-reach to that end, it-is necessary to-go through the world, as in probation, seeking the adventures, so that, finishing some, itself one-acquire name and fame such that, when itself one-should-go to the court of some great monarch, already be the knight known by his works;"
        ormsby: "“Thou speakest not amiss, Sancho,” answered Don Quixote, “but before that point is reached it is requisite to roam the world, as it were on probation, seeking adventures, in order that, by achieving some, name and fame may be acquired, such that when he betakes himself to the court of some great monarch the knight may be already known by his deeds,"
        vocab:
          - {w: "no dices mal", d: "you don't speak amiss, you have a point"}
          - {w: "antes que", d: "before; takes the subjunctive"}
          - {w: "término", d: "point, stage, goal"}
          - {w: "es menester", d: "it is necessary"}
          - {w: "en aprobación", d: "on probation, as a trial, like a novice before taking vows"}
          - {w: "cobrar nombre y fama", d: "to win a name and fame"}
          - {w: "monarca", d: "monarch"}
          - {w: "obras", d: "deeds, works"}
        diagram:
          - {s: "No dices mal, Sancho", r: "main verb 1: you don't speak amiss, Sancho"}
          - {s: "respondió don Quijote", r: "speech tag: Don Quijote answered"}
          - s: "es menester andar por el mundo"
            r: "main verb 2 (after 'mas'): one must roam the world"
            under:
              - {s: "antes que se llegue a ese término", r: "when: before that point is reached"}
              - {s: "como en aprobación, buscando las aventuras", r: "how: as if on probation, seeking adventures"}
              - s: "para que, acabando algunas, se cobre nombre y fama tal"
                r: "purpose: so that, by achieving some, such a name and fame are won"
                under:
                  - s: "que ... ya sea el caballero conocido por sus obras"
                    r: "result of 'tal': that the knight is already known by his deeds"
                    under:
                      - {s: "cuando se fuere a la corte de algún gran monarca", r: "when: when he goes to the court of some great king"}
        forms:
          - {w: "dices", f: "dic- + -es → decir (to say), present, you (tú). digo, dices, dice, decimos, decís, dicen."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "se llegue", f: "llegu- + -e → llegar (to arrive), present subjunctive, with 'se' for 'one reaches'; the u keeps the g hard. Subjunctive after 'antes que'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "buscando, acabando", f: "gerunds of buscar (to seek) and acabar (to finish, achieve)."}
          - {w: "se cobre", f: "cobr- + -e → cobrar (to win), present subjunctive, with 'se' making it passive: 'is won'. Subjunctive after 'para que'. Same -e subjunctive."}
