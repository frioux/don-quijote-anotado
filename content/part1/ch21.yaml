part: 1
chapter: 21
title_es: "Capítulo XXI. Que trata de la alta aventura y rica ganancia del yelmo de Mambrino, con otras cosas sucedidas a nuestro invencible caballero"
title_en: "Which treats of the exalted adventure and rich prize of Mambrino's helmet, together with other things that happened to our invincible knight"
paragraphs:
  - sentences:
      - es: "En esto, comenzó a llover un poco, y quisiera Sancho que se entraran en el molino de los batanes;"
        literal: "In this, it-began to rain a little, and would-have-wished Sancho that they-go-into in the mill of the fulling-hammers;"
        ormsby: "It now began to rain a little, and Sancho was for going into the fulling mills,"
        vocab:
          - {w: "en esto", d: "at this point, meanwhile"}
          - {w: "quisiera", d: "the -ra form of querer used as a softened past: 'would have liked'; modern 'habría querido'"}
          - {w: "entrarse en", d: "to go into, take shelter in"}
          - {w: "molino de los batanes", d: "the fulling mill: water-driven hammers that pound cloth; the source of the terrifying noise of the last chapter"}
        diagram:
          - s: "comenzó a llover un poco"
            r: "main verb 1: it began to rain a little"
            under:
              - {s: "En esto", r: "when: at this point"}
          - s: "quisiera Sancho"
            r: "main verb 2 (after 'y'): Sancho would have liked"
            under:
              - {s: "que se entraran en el molino de los batanes", r: "what he wanted: for them to go into the fulling mill"}
        forms:
          - {w: "comenzó", f: "comenz- + -ó → comenzar (to begin), preterite, it. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. 'comenzar a' + infinitive = to begin to."}
          - {w: "quisiera", f: "quis- + -iera → querer (to want), imperfect subjunctive (-ra form), he: 'would have liked'. Built on the preterite quisieron: quisiera, quisieras, quisiera, quisiéramos, quisierais, quisieran. Cervantes uses the -ra form as a polite or unreal past where modern Spanish says 'habría querido'."}
          - {w: "se entraran", f: "entr- + -aran → entrarse (to go in), imperfect subjunctive (-ra form), they, with 'se'. Subjunctive because it is what Sancho wanted ('quisiera que'). The -ra imperfect subjunctive of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran."}
      - es: "mas habíales cobrado tal aborrecimiento don Quijote, por la pesada burla, que en ninguna manera quiso entrar dentro;"
        literal: "but had-to-them taken such loathing Don Quijote, for the heavy joke, that in no manner he-wanted to-enter inside;"
        ormsby: "but Don Quixote had taken such an abhorrence to them on account of the late joke that he would not enter them on any account;"
        vocab:
          - {w: "mas", d: "but (literary, no accent; 'más' with the accent is 'more')"}
          - {w: "cobrar aborrecimiento a", d: "to take a loathing to, come to hate"}
          - {w: "aborrecimiento", d: "loathing, abhorrence"}
          - {w: "pesada burla", d: "a heavy, cruel joke; 'pesado' = heavy, tiresome"}
          - {w: "en ninguna manera", d: "in no way, on no account; modern 'de ninguna manera'"}
        diagram:
          - s: "habíales cobrado tal aborrecimiento don Quijote"
            r: "main verb (after 'mas'): Don Quijote had taken such a loathing to them"
            under:
              - {s: "por la pesada burla", r: "why: because of the cruel joke"}
              - s: "que en ninguna manera quiso entrar dentro"
                r: "result of 'tal': that he refused to go inside"
        forms:
          - {w: "habíales cobrado", f: "hab- + -ía → haber (to have), imperfect, he, + cobrado, the participle of cobrar (to take, acquire): the pluperfect 'had taken', with 'les' (to them, the mills) stuck on the end of 'había'; modern 'les había cobrado'. Cervantes hangs the pronoun on a verb that opens its clause. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "tal", f: "'such', one form for both genders; it sets up the result clause 'que ... quiso'."}
          - {w: "quiso", f: "quis- + -o → querer (to want), preterite, he: 'he wanted', here with a negative 'in no way' = he refused. Irregular: quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "entrar", f: "infinitive (to enter) after 'quiso'."}
      - es: "y así, torciendo el camino a la derecha mano, dieron en otro como el que habían llevado el día de antes."
        literal: "and so, twisting the road to the right hand, they-hit on another like the [one] that they-had taken the day of before."
        ormsby: "so turning aside to right they came upon another road, different from that which they had taken the night before."
        vocab:
          - {w: "torcer el camino", d: "to turn off the road, change direction"}
          - {w: "a la derecha mano", d: "to the right hand; the adjective before the noun is a poetic order, modern 'a mano derecha'"}
          - {w: "dar en", d: "to hit upon, come upon"}
          - {w: "llevar un camino", d: "to follow, take a road"}
          - {w: "el día de antes", d: "the day before"}
        diagram:
          - s: "dieron en otro"
            r: "main verb (after 'y así'): they came upon another road"
            under:
              - {s: "torciendo el camino a la derecha mano", r: "how: turning off to the right"}
              - s: "como el que habían llevado el día de antes"
                r: "describes 'otro': like the one they had taken the day before"
        forms:
          - {w: "torciendo", f: "gerund of torcer (to twist, turn): 'turning'."}
          - {w: "derecha", f: "derech- + -a → derecho (right), feminine to match 'mano', which is feminine though it ends in -o."}
          - {w: "dieron", f: "d- + -ieron → dar (to give; 'dar en' = to hit upon), preterite, they. dar takes -er/-ir endings in the preterite: di, diste, dio, dimos, disteis, dieron."}
          - {w: "habían llevado", f: "hab- + -ían → haber (to have), imperfect, they, + llevado, the participle of llevar (to carry, follow): the pluperfect 'they had taken'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
        note: "Ormsby's 'different from' is an interpretation; the Spanish says the new road was 'like' the one of the day before. Either way, they leave the fulling mills behind."
  - sentences:
      - es: "De allí a poco, descubrió don Quijote un hombre a caballo, que traía en la cabeza una cosa que relumbraba como si fuera de oro, y aún él apenas le hubo visto, cuando se volvió a Sancho y le dijo:"
        literal: "From there to little, discovered Don Quijote a man on horseback, who was-carrying on the head a thing that gleamed as if it-were of gold, and even he scarcely him had seen, when he-turned to Sancho and to-him said:"
        ormsby: "Shortly afterwards Don Quixote perceived a man on horseback who wore on his head something that shone like gold, and the moment he saw him he turned to Sancho and said:"
        vocab:
          - {w: "de allí a poco", d: "shortly afterwards, a little later"}
          - {w: "descubrir", d: "to catch sight of, make out (not 'discover')"}
          - {w: "traer", d: "here: to wear, carry on oneself"}
          - {w: "relumbrar", d: "to gleam, glitter"}
          - {w: "apenas ... cuando", d: "scarcely ... when; the 'aún' (even) stresses how fast he reacted"}
          - {w: "hubo visto", d: "the preterite of haber + participle (past anterior): 'had seen', used after 'apenas'; literary even then"}
        diagram:
          - s: "descubrió don Quijote un hombre a caballo"
            r: "main verb 1: Don Quijote caught sight of a man on horseback"
            under:
              - {s: "De allí a poco", r: "when: shortly afterwards"}
              - s: "que traía en la cabeza una cosa"
                r: "describes 'hombre': who wore something on his head"
                under:
                  - {s: "que relumbraba como si fuera de oro", r: "describes 'cosa': that shone as if it were gold"}
          - s: "se volvió a Sancho y le dijo"
            r: "main verb 2: he turned to Sancho and said to him"
            under:
              - {s: "aún él apenas le hubo visto, cuando", r: "when: the moment he had seen him"}
        forms:
          - {w: "descubrió", f: "descubr- + -ió → descubrir (to catch sight of), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "traía", f: "tra- + -ía → traer (to carry, wear), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "relumbraba", f: "relumbr- + -aba → relumbrar (to gleam), imperfect, it. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), it: 'as if it were'. 'como si' always takes the imperfect subjunctive. ser: fuera, fueras, fuera, fuéramos, fuerais, fueran."}
          - {w: "le hubo visto", f: "hub- + -o → haber (to have), preterite, he, + visto, the participle of ver (to see): 'had seen', the past anterior used after 'apenas'. haber's preterite: hube, hubiste, hubo, hubimos, hubisteis, hubieron. 'le' = him (leísmo, 'le' for a male object where the grammar books want 'lo')."}
          - {w: "se volvió", f: "volv- + -ió → volverse (to turn around), preterite, he, with 'se'. Same -ió preterite."}
          - {w: "le dijo", f: "dij- + -o → decir (to say), preterite, he, with 'le' (to him). Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Paréceme, Sancho, que no hay refrán que no sea verdadero, porque todos son sentencias sacadas de la mesma experiencia, madre de las ciencias todas, especialmente aquel que dice: \"Donde una puerta se cierra, otra se abre\"."
        literal: "— It-seems-to-me, Sancho, that not there-is proverb that not be true, because all are maxims drawn from the same experience, mother of the sciences all, especially that [one] which says: \"Where one door itself closes, another itself opens\"."
        ormsby: "“I think, Sancho, there is no proverb that is not true, all being maxims drawn from experience itself, the mother of all the sciences, especially that one that says, ‘Where one door shuts, another opens.’"
        ormsby_note: "Proverb 194."
        vocab:
          - {w: "parecerle a uno", d: "to seem to one; 'paréceme' = it seems to me, I think"}
          - {w: "refrán", d: "proverb, saying"}
          - {w: "sentencia", d: "maxim, wise saying (not a legal sentence here)"}
          - {w: "sacado de", d: "drawn from, taken from"}
          - {w: "mesma", d: "= misma: 'la mesma experiencia' = experience itself"}
          - {w: "las ciencias todas", d: "all the sciences; 'todas' after the noun is emphatic"}
          - {w: "Donde una puerta se cierra, otra se abre", d: "'Where one door shuts, another opens': a proverb still current"}
        diagram:
          - s: "Paréceme"
            r: "main verb: it seems to me"
            under:
              - s: "que no hay refrán"
                r: "what seems to me: that there is no proverb"
                under:
                  - {s: "que no sea verdadero", r: "describes 'refrán': that is not true"}
                  - s: "porque todos son sentencias sacadas de la mesma experiencia"
                    r: "why: because they are all maxims drawn from experience"
                    under:
                      - {s: "madre de las ciencias todas", r: "describes 'experiencia': mother of all the sciences"}
              - s: "especialmente aquel que dice"
                r: "singled out: especially the one that says"
                under:
                  - {s: "Donde una puerta se cierra, otra se abre", r: "the proverb: where one door shuts, another opens"}
        forms:
          - {w: "Paréceme", f: "parec- + -e → parecer (to seem), present, it, with 'me' (to me) stuck on the end; modern 'me parece'. Cervantes hangs the pronoun on a verb that opens its clause. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "hay", f: "haber used alone: 'there is'; one unchanging form in the present."}
          - {w: "sea", f: "ser (to be), present subjunctive, it: 'that is not true'. Subjunctive because the proverb is denied to exist ('no hay refrán que'). ser: sea, seas, sea, seamos, seáis, sean."}
          - {w: "sacadas", f: "participle of sacar (to draw out), feminine plural to match 'sentencias'."}
          - {w: "mesma", f: "= misma, feminine to match 'experiencia'."}
          - {w: "aquel", f: "'that one' (far from both speakers), masculine singular for 'refrán'."}
          - {w: "dice", f: "dic- + -e → decir (to say), present, it. digo, dices, dice, decimos, decís, dicen."}
          - {w: "se cierra, se abre", f: "cierr- + -a → cerrar (to close), abr- + -e → abrir (to open), present, it, with 'se': the 'se' makes the verb passive or reflexive, 'shuts' and 'opens' with no agent. cerrar changes e to ie when stressed: cierro, cierras, cierra, cerramos, cerráis, cierran."}
        note: "Don Quijote's view that all proverbs are true is the theme of a running joke: Sancho will pour them out by the dozen, and his master will scold him for it."
      - es: "Dígolo porque si anoche nos cerró la ventura la puerta de la que buscábamos, engañándonos con los batanes, ahora nos abre de par en par otra, para otra mejor y más cierta aventura;"
        literal: "I-say-it because if last-night to-us closed the fortune the door of the [one] that we-sought, deceiving-us with the fulling-hammers, now to-us it-opens wide-open another, for another better and more certain adventure;"
        ormsby: "I say so because if last night fortune shut the door of the adventure we were looking for against us, cheating us with the fulling mills, it now opens wide another one for another better and more certain adventure,"
        vocab:
          - {w: "anoche", d: "last night"}
          - {w: "ventura", d: "fortune, luck; also 'adventure' in the old sense"}
          - {w: "la de la que buscábamos", d: "'the [door] of the [adventure] we were looking for': 'la que' stands for 'la aventura que'"}
          - {w: "engañar", d: "to deceive, trick"}
          - {w: "de par en par", d: "wide open (of a door)"}
          - {w: "cierto", d: "here: sure, certain to happen"}
        diagram:
          - s: "Dígolo"
            r: "main verb: I say it"
            under:
              - s: "porque si anoche nos cerró la ventura la puerta"
                r: "why, condition: because if last night fortune shut the door on us"
                under:
                  - {s: "de la que buscábamos", r: "which door: of the adventure we were seeking"}
                  - {s: "engañándonos con los batanes", r: "how it cheated us: with the fulling mills"}
              - s: "ahora nos abre de par en par otra"
                r: "result: now it opens another wide to us"
                under:
                  - {s: "para otra mejor y más cierta aventura", r: "for what: for another better and surer adventure"}
        forms:
          - {w: "Dígolo", f: "dig- + -o → decir (to say), present, I, with 'lo' (it) stuck on the end; modern 'lo digo'. Cervantes hangs the pronoun on a verb that opens its clause. decir: digo, dices, dice, decimos, decís, dicen."}
          - {w: "nos cerró", f: "cerr- + -ó → cerrar (to close), preterite, it (fortune), with 'nos' (on us, to us). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "buscábamos", f: "busc- + -ábamos → buscar (to seek), imperfect, we. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "engañándonos", f: "engañando, the gerund of engañar (to deceive), + nos (us), with an accent added."}
          - {w: "nos abre", f: "abr- + -e → abrir (to open), present, it, with 'nos' (to us). The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "otra", f: "otr- + -a → otro (another), feminine to match 'puerta' understood, then 'aventura'."}
          - {w: "mejor", f: "comparative of bueno (good): 'better'; one form for both genders."}
      - es: "que si yo no acertare a entrar por ella, mía será la culpa, sin que la pueda dar a la poca noticia de batanes ni a la escuridad de la noche."
        literal: "for if I not should-manage to enter through it, mine will-be the blame, without that it I-can give to the little knowledge of fulling-hammers nor to the darkness of the night."
        ormsby: "and if I do not contrive to enter it, it will be my own fault, and I cannot lay it to my ignorance of fulling mills, or the darkness of the night."
        vocab:
          - {w: "que", d: "here: for, because, linking to what was just said"}
          - {w: "acertar a", d: "to manage to, succeed in"}
          - {w: "acertare", d: "future subjunctive of acertar: 'if I should manage'; modern 'acierto'"}
          - {w: "culpa", d: "blame, fault"}
          - {w: "dar la culpa a", d: "to lay the blame on"}
          - {w: "noticia", d: "here: knowledge, acquaintance (not 'news')"}
          - {w: "escuridad", d: "= oscuridad, darkness"}
        diagram:
          - s: "mía será la culpa"
            r: "main verb (after 'que', for): the blame will be mine"
            under:
              - {s: "si yo no acertare a entrar por ella", r: "condition: if I fail to get through it"}
              - s: "sin que la pueda dar"
                r: "and not: without my being able to lay it"
                under:
                  - {s: "a la poca noticia de batanes ni a la escuridad de la noche", r: "on what: on ignorance of fulling mills or the dark"}
        forms:
          - {w: "acertare", f: "acert- + -are → acertar (to manage, hit the mark), future subjunctive, I: 'if I should manage'. The future subjunctive of -ar verbs: -are, -ares, -are, -áremos, -areis, -aren. Cervantes uses it after 'si' for an open future; modern Spanish uses the present 'acierto'."}
          - {w: "entrar", f: "infinitive (to enter) after 'acertar a'."}
          - {w: "mía", f: "'mine', the stressed possessive, feminine to match 'culpa'; put first for emphasis."}
          - {w: "será", f: "ser (to be), future, it: 'will be'. seré, serás, será, seremos, seréis, serán."}
          - {w: "la pueda dar", f: "pued- + -a → poder (to be able), present subjunctive, I, with 'la' (it, the blame) before it. Subjunctive after 'sin que'. The stem o becomes ue when stressed: pueda, puedas, pueda, podamos, podáis, puedan."}
          - {w: "poca", f: "poc- + -a → poco (little), feminine to match 'noticia'."}
          - {w: "escuridad", f: "= oscuridad; Cervantes writes 'escuro' for 'oscuro'."}
      - es: "Digo esto porque, si no me engaño, hacia nosotros viene uno que trae en su cabeza puesto el yelmo de Mambrino, sobre que yo hice el juramento que sabes."
        literal: "I-say this because, if not myself I-deceive, towards us comes one who carries on his head put the helmet of Mambrino, about which I made the oath that you-know."
        ormsby: "I say this because, if I mistake not, there comes towards us one who wears on his head the helmet of Mambrino, concerning which I took the oath thou rememberest.”"
        vocab:
          - {w: "si no me engaño", d: "if I am not mistaken"}
          - {w: "traer puesto", d: "to have on, be wearing"}
          - {w: "yelmo", d: "helmet (the full knight's helmet)"}
          - {w: "Mambrino", d: "a Moorish king in Boiardo's Orlando innamorato and Ariosto's Orlando furioso, whose enchanted golden helmet made its wearer invulnerable; Rinaldo won it from him"}
          - {w: "sobre que", d: "about which, concerning which; modern 'sobre el cual'"}
          - {w: "juramento", d: "oath, vow"}
        diagram:
          - s: "Digo esto"
            r: "main verb: I say this"
            under:
              - s: "porque, si no me engaño, hacia nosotros viene uno"
                r: "why: because, unless I am wrong, someone is coming towards us"
                under:
                  - s: "que trae en su cabeza puesto el yelmo de Mambrino"
                    r: "describes 'uno': who is wearing the helmet of Mambrino"
                    under:
                      - s: "sobre que yo hice el juramento"
                        r: "describes 'yelmo': about which I swore the oath"
                        under:
                          - {s: "que sabes", r: "describes 'juramento': that you know of"}
        forms:
          - {w: "Digo", f: "dig- + -o → decir (to say), present, I. digo, dices, dice, decimos, decís, dicen."}
          - {w: "me engaño", f: "engañ- + -o → engañarse (to be mistaken), present, I, with 'me'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "viene", f: "vien- + -e → venir (to come), present, he. Irregular: vengo, vienes, viene, venimos, venís, vienen."}
          - {w: "trae", f: "tra- + -e → traer (to carry, wear), present, he. traigo, traes, trae, traemos, traéis, traen."}
          - {w: "puesto", f: "irregular participle of poner (to put): 'put on'; masculine to match 'yelmo'."}
          - {w: "hice", f: "hic- + -e → hacer (to make), preterite, I. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "sabes", f: "sab- + -es → saber (to know), present, you (tú). sé, sabes, sabe, sabemos, sabéis, saben."}
        note: "The oath was sworn in Chapter 10, after the fight with the Biscayan broke his helmet: Don Quijote vowed, like the Marquis of Mantua, to live as a penitent until he won a helmet as good as Mambrino's from some knight."
  - sentences:
      - es: "— Mire vuestra merced bien lo que dice, y mejor lo que hace —dijo Sancho—, que no querría que fuesen otros batanes que nos acabasen de abatanar y aporrear el sentido."
        literal: "— Look your mercy well [at] that which you-say, and better [at] that which you-do —said Sancho—, for not I-would-want that they-be other fulling-hammers that us finish of fulling and beating the sense."
        ormsby: "“Mind what you say, your worship, and still more what you do,” said Sancho, “for I don’t want any more fulling mills to finish off fulling and knocking our senses out.”"
        vocab:
          - {w: "mirar bien", d: "to look carefully at, mind"}
          - {w: "vuestra merced", d: "your worship, your grace: the polite address, the ancestor of 'usted'; it takes the he/she form of the verb"}
          - {w: "acabar de", d: "here: to finish off doing; 'nos acabasen de abatanar' = finish fulling us"}
          - {w: "abatanar", d: "to full, pound cloth in a fulling mill; Sancho makes a joke verb from 'batán'"}
          - {w: "aporrear", d: "to club, beat"}
          - {w: "sentido", d: "sense, wits"}
        diagram:
          - s: "Mire vuestra merced bien lo que dice, y mejor lo que hace"
            r: "main verb, command: mind what you say and, more, what you do"
          - {s: "dijo Sancho", r: "speech tag: said Sancho"}
          - s: "que no querría"
            r: "reason ('que' = for): I would not want"
            under:
              - s: "que fuesen otros batanes"
                r: "what I would not want: for them to be more fulling mills"
                under:
                  - {s: "que nos acabasen de abatanar y aporrear el sentido", r: "describes 'batanes': that would finish beating the sense out of us"}
        forms:
          - {w: "Mire", f: "mir- + -e → mirar (to look), present subjunctive used as a polite command, you (vuestra merced, which takes the he/she form): 'look'. The -ar command for usted: -e, -en."}
          - {w: "dice, hace", f: "dic- + -e → decir (to say), hac- + -e → hacer (to do), present, you (vuestra merced). decir: digo, dices, dice, decimos, decís, dicen; hacer: hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "querría", f: "querr- + -ía → querer (to want), conditional, I: 'I would want'. Irregular stem querr-: querría, querrías, querría, querríamos, querríais, querrían."}
          - {w: "fuesen", f: "fu- + -esen → ser (to be), imperfect subjunctive (-se form), they. Subjunctive after 'no querría que'. ser: fuese, fueses, fuese, fuésemos, fueseis, fuesen."}
          - {w: "nos acabasen", f: "acab- + -asen → acabar (to finish), imperfect subjunctive (-se form), they, with 'nos' (us). Subjunctive because the mills are only feared, not real. The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
