          - {w: "injuria", d: "injury, wrong, insult"}
          - {w: "sábete que", d: "know then that; 'saber' with a reflexive 'te' for emphasis"}
          - {w: "ser de pechos nobles", d: "to be the mark of noble hearts; 'pecho' = breast, as the seat of courage"}
          - {w: "hacer caso de", d: "to pay attention to, take notice of"}
          - {w: "niñería", d: "childish trifle"}
