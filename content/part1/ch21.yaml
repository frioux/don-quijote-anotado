          - {w: "eres", f: "ser (to be), present, you (tú). soy, eres, es, somos, sois, son."}
          - {w: "oyendo", f: "gerund of oír (to hear); the i of -iendo becomes y between vowels."}
          - {w: "olvidas", f: "olvid- + -as → olvidar (to forget), present, you (tú). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "te han hecho", f: "han, present of haber (to have), they, + hecho, the irregular participle of hacer (to do): the perfect 'they have done', with 'te' (to you). haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "sábete", f: "sabe, the command of saber (to know) for tú, + te (yourself), with an accent added: 'know for yourself'."}
