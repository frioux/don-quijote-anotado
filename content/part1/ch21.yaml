          - {w: "aquella", f: "'that', feminine to match 'fantasma', which Cervantes treats as feminine."}
          - {w: "sí", f: "'himself' after a preposition ('sobre sí'); the accent tells it from 'si' (if)."}
          - {w: "tuvo", f: "tuv- + -o → tener (to have), preterite, he. Irregular: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron."}
          - {w: "guardarse", f: "infinitive guardar (to protect) + se, after 'poder'."}
