        forms:
          - {w: "Digo", f: "dig- + -o → decir (to say), present, I. digo, dices, dice, decimos, decís, dicen."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "he considerado", f: "he, present of haber (to have), I, + considerado, the participle of considerar (to consider): the perfect 'I have considered'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "se gana y granjea", f: "gan- + -a → ganar (to gain), granje- + -a → granjear (to earn), present, with 'se' for 'one gains'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
