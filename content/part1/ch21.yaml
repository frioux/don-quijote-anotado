          - {w: "informado", f: "participle of informar (to inform), masculine for the speaker."}
          - {w: "digo", f: "decir (to say), present, I. digo, dices, dice, decimos, decís, dicen."}
          - {w: "los trueques", f: "trueq- + -es → trocar (to swap), present subjunctive, you (tú), with 'los' (them, the trappings): the stem o becomes ue when stressed and c becomes qu before e. trueque, trueques, trueque, troquemos, troquéis, truequen. Subjunctive after 'digo que' used as permission."}
