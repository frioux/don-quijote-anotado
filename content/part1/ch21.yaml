  - sentences:
      - es: "— Digo, pues, señor —respondió Sancho—, que, de algunos días a esta parte, he considerado cuán poco se gana y granjea de andar buscando estas aventuras que vuestra merced busca por estos desiertos y encrucijadas de caminos, donde, ya que se venzan y acaben las más eligrosas, no hay quien las vea ni sepa;"
        literal: "— I-say, then, sir —answered Sancho—, that, from some days to this part, I-have considered how little itself is-gained and earned from going seeking these adventures that your mercy seeks through these wildernesses and crossings of roads, where, even-though themselves be-overcome and finished the most dangerous, not there-is who them see nor know;"
        ormsby: "“Well then, señor,” returned Sancho, “I say that for some days past I have been considering how little is got or gained by going in search of these adventures that your worship seeks in these wilds and crossroads, where, even if the most perilous are victoriously achieved, there is no one to see or know of them,"
