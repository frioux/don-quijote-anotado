  - sentences:
      - es: "— No sé nada —respondió Sancho—; mas, a fe que si yo pudiera hablar tanto como solía, que quizá diera tales razones que vuestra merced viera que se engañaba en lo que dice."
        literal: "— Not I-know nothing —answered Sancho—; but, by faith that if I could speak as-much as I-used-to, that perhaps I-would-give such reasons that your mercy would-see that yourself you-deceived in that which you-say."
        ormsby: "“I don’t know,” replied Sancho, “but, faith, if I might speak as I used, perhaps I could give such reasons that your worship would see you were mistaken in what you say.”"
        vocab:
          - {w: "no sé nada", d: "I don't know anything; the double negative is normal Spanish"}
          - {w: "a fe que", d: "in faith, truly; a mild oath"}
          - {w: "soler", d: "to be in the habit of; 'como solía' = as I used to"}
          - {w: "dar razones", d: "to give arguments, reasons"}
          - {w: "engañarse", d: "to be mistaken"}
        diagram:
          - {s: "No sé nada", r: "main verb 1: I know nothing"}
          - {s: "respondió Sancho", r: "speech tag: Sancho answered"}
          - s: "quizá diera tales razones"
            r: "main verb 2 (after 'mas, a fe que'): perhaps I would give such arguments"
            under:
              - s: "si yo pudiera hablar tanto como solía"
                r: "condition: if I could talk as much as I used to"
              - s: "que vuestra merced viera"
                r: "result of 'tales': that your worship would see"
                under:
                  - {s: "que se engañaba en lo que dice", r: "what you would see: that you were wrong in what you say"}
        forms:
          - {w: "sé", f: "saber (to know), present, I. Irregular: sé, sabes, sabe, sabemos, sabéis, saben. The accent tells it from 'se'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "pudiera", f: "pud- + -iera → poder (to be able), imperfect subjunctive (-ra form), I: 'if I could'. Built on the preterite pudieron: pudiera, pudieras, pudiera, pudiéramos, pudierais, pudieran. Subjunctive after 'si' for an unreal condition."}
          - {w: "solía", f: "sol- + -ía → soler (to be used to), imperfect, I. The imperfect of -er verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "diera", f: "d- + -iera → dar (to give), imperfect subjunctive (-ra form), I, used as a conditional: 'I would give'. Built on the preterite dieron: diera, dieras, diera, diéramos, dierais, dieran. Cervantes uses the -ra form where modern Spanish says 'daría'."}
          - {w: "tales", f: "plural of 'tal' (such) to match 'razones'."}
          - {w: "viera", f: "v- + -iera → ver (to see), imperfect subjunctive (-ra form), you (vuestra merced), again for 'would see'. viera, vieras, viera, viéramos, vierais, vieran."}
          - {w: "se engañaba", f: "engañ- + -aba → engañarse (to be mistaken), imperfect, you (vuestra merced). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
        note: "The stray 'que' after 'a fe que si ... solía' repeats the first 'que' after the long 'if' clause; Cervantes often restarts a sentence this way in speech."
