  - sentences:
      - es: "Y luego, habilitado con aquella licencia, hizo mutatio caparum y puso su jumento a las mil lindezas, dejándole mejorado en tercio y quinto."
        literal: "And at-once, authorized with that licence, he-made mutatio caparum and put his donkey at the thousand prettinesses, leaving-it improved in third and fifth."
        ormsby: "and forthwith, fortified by this licence, he effected the mutatio capparum, rigging out his beast to the ninety-nines and making quite another thing of it."
        ormsby_note: "The mutatio capparum was the change of hoods authorized by the Roman ceremonial, when the cardinals exchanged the fur-lined hoods worn in winter for lighter ones of silk. There is a certain audacity of humor in the application of the phrase here."
        vocab:
          - {w: "luego", d: "here: at once"}
          - {w: "habilitado", d: "authorized, empowered"}
          - {w: "licencia", d: "licence, permission"}
          - {w: "mutatio caparum", d: "Latin, 'the changing of capes': the cardinals' ceremonial switch from winter to summer hoods, applied to a donkey's harness"}
          - {w: "poner a las mil lindezas", d: "to rig out beautifully, dress up to the nines"}
          - {w: "mejorado en tercio y quinto", d: "improved 'by a third and a fifth': the legal phrase for the portion of an estate a parent could leave to a favored heir; so 'vastly improved'"}
        diagram:
          - s: "hizo mutatio caparum"
            r: "main verb 1 (after 'Y luego'): he performed the 'change of capes'"
            under:
              - {s: "habilitado con aquella licencia", r: "on what footing: authorized by that licence"}
          - s: "y puso su jumento a las mil lindezas"
            r: "main verb 2: and rigged out his donkey to the nines"
            under:
              - {s: "dejándole mejorado en tercio y quinto", r: "result: leaving it improved by a third and a fifth"}
        forms:
          - {w: "habilitado", f: "participle of habilitar (to authorize), masculine for Sancho."}
          - {w: "aquella", f: "'that', feminine to match 'licencia'."}
          - {w: "hizo", f: "hiz- + -o → hacer (to make), preterite, he. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "puso", f: "pus- + -o → poner (to put), preterite, he. Irregular: puse, pusiste, puso, pusimos, pusisteis, pusieron."}
          - {w: "dejándole", f: "dejando, the gerund of dejar (to leave), + le (it, the donkey; leísmo), with an accent added."}
          - {w: "mejorado", f: "participle of mejorar (to improve), masculine to match 'jumento'."}
        note: "'Mejorar en tercio y quinto' is inheritance law: a testator could favor one child with the third and the fifth of the estate beyond the equal shares. The narrator's two learned jokes, one ecclesiastical, one legal, dress up Sancho's theft of a barber's pack-saddle."
      - es: "Hecho esto, almorzaron de las sobras del real que del acémila despojaron, bebieron del agua del arroyo de los batanes, sin volver la cara a mirallos: tal era el aborrecimiento que les tenían por el miedo en que les habían puesto."
