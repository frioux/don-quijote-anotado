  - sentences:
      - es: "— Yo me tengo en cuidado el apartarme —replicó Sancho—, mas quiera Dios, torno a decir, que orégano sea, y no batanes."
        literal: "— I myself hold in care the moving-myself-aside —replied Sancho—, but may-wish God, I-return to say, that marjoram it-be, and not fulling-hammers."
        ormsby: "“I will take care to stand aside,” said Sancho; “but God grant, I say once more, that it may be marjoram and not fulling mills.”"
        ormsby_note: "Proverb 160. In full, \"Plegue a Dios que orégano sea, y no se nos vuelva alcaravea.\", \"Pray God it may prove wild marjoram, and not turn out caraway on us.\" Shelton and Jervas not knowing the proverb have mistranslated the passage; the latter shirks the difficulty, and the former translates orégano \"a purchase of gold.\""
        vocab:
          - {w: "tenerse en cuidado", d: "to take care of, make it one's business; 'yo me tengo en cuidado el apartarme' = I'll see to it that I stand aside"}
          - {w: "quiera Dios que", d: "God grant that, please God"}
          - {w: "tornar a decir", d: "to say again; 'tornar a' + infinitive = to do again, modern 'volver a'"}
          - {w: "orégano", d: "wild marjoram; from the proverb 'please God it be marjoram and not turn into caraway', i.e. may it turn out well"}
        diagram:
          - s: "Yo me tengo en cuidado el apartarme"
            r: "main verb 1: I will see to standing aside myself"
          - {s: "replicó Sancho", r: "speech tag: Sancho retorted"}
          - s: "mas quiera Dios"
            r: "main verb 2, a wish: but God grant"
            under:
              - {s: "torno a decir", r: "aside: I say again"}
              - {s: "que orégano sea, y no batanes", r: "what I wish: that it be marjoram and not fulling mills"}
        forms:
          - {w: "me tengo", f: "teng- + -o → tener (to have, hold), present, I, with 'me' (for myself). Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "el apartarme", f: "the infinitive apartar (to move aside) + me (myself), used as a noun with the article 'el': 'the stepping aside'."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "quiera", f: "quier- + -a → querer (to want), present subjunctive as a wish, he (God): 'may God will'. The stem e becomes ie when stressed: quiera, quieras, quiera, queramos, queráis, quieran."}
          - {w: "torno", f: "torn- + -o → tornar (to return; 'tornar a' = to do again), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "sea", f: "ser (to be), present subjunctive, it, after 'quiera Dios que'. sea, seas, sea, seamos, seáis, sean. The noun 'orégano' is put before the verb for emphasis."}
        note: "Sancho's proverb hopes a thing will turn out to be wholesome marjoram rather than a disappointment; he means 'may this be a real adventure and not another fulling-mill fiasco'."
  - sentences:
      - es: "— Ya os he dicho, hermano, que no me mentéis, ni por pienso, más eso de los batanes —dijo don Quijote—; que voto..., y no digo más, que os batanee el alma."
        literal: "— Already to-you I-have said, brother, that not to-me you-mention, not even for thought, more that of the fulling-hammers —said Don Quijote—; for I-vow..., and not I-say more, that to-you I-full the soul."
        ormsby: "“I have told thee, brother, on no account to mention those fulling mills to me again,” said Don Quixote, “or I vow, and I say no more, I’ll full the soul out of you.”"
        vocab:
          - {w: "os", d: "'you' (object), the 'vos' form; Don Quijote switches from 'tú' to 'vos' in anger, as to an inferior stranger"}
          - {w: "hermano", d: "brother; a cool, distancing address here"}
          - {w: "mentar", d: "to mention, name"}
          - {w: "ni por pienso", d: "not even in thought, on no account"}
          - {w: "eso de los batanes", d: "that business of the fulling mills"}
          - {w: "voto a...", d: "I swear by...; he cuts the oath short ('voto..., y no digo más')"}
          - {w: "batanear", d: "to pound like a fulling mill; another coinage from 'batán'"}
        diagram:
          - s: "Ya os he dicho, hermano"
            r: "main verb: I have already told you, brother"
            under:
              - {s: "que no me mentéis, ni por pienso, más eso de los batanes", r: "what I told you: not to mention those fulling mills to me again, on any account"}
          - {s: "dijo don Quijote", r: "speech tag: said Don Quijote"}
          - s: "que voto..., y no digo más"
            r: "threat ('que' = for): I swear..., and I say no more"
            under:
              - {s: "que os batanee el alma", r: "what I swear: that I will pound your soul"}
        forms:
          - {w: "os he dicho", f: "he, present of haber (to have), I, + dicho, the irregular participle of decir (to say): the perfect 'I have said', with 'os' (to you, the vos form). haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "me mentéis", f: "ment- + -éis → mentar (to mention), present subjunctive, you (vos, which takes the vosotros form), with 'me' (to me): 'that you not mention'. Subjunctive after 'he dicho que' as a command. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "digo", f: "decir (to say), present, I. digo, dices, dice, decimos, decís, dicen."}
          - {w: "os batanee", f: "batane- + -e → batanear (to pound like a fulling mill), present subjunctive, I, with 'os' (to you): 'that I may pound'. Subjunctive because it hangs on the oath 'voto ... que'. Same -e subjunctive of -ar verbs."}
        note: "Don Quijote drops the familiar 'tú' and addresses Sancho with 'vos' and 'hermano', the tone of a master putting a servant in his place. He also turns Sancho's own joke-verb back on him."
