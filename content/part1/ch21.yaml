      - es: "Si ya no es que la doncella tercera, que ha de ser su mujer, se sale con la infanta, y él pasa con ella su mala ventura, hasta que el cielo ordene otra cosa; porque bien podrá, creo yo, desde luego dársela su señor por ligítima esposa."
