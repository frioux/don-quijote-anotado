  - sentences:
      - es: "— Pase por burlas, pues la venganza no puede pasar en veras; pero yo sé de qué calidad fueron las veras y las burlas, y sé también que no se me caerán de la memoria, como nunca se quitarán de las espaldas."
        literal: "— Let-it-pass for jokes, since the vengeance not can pass in earnest; but I know of what quality were the earnests and the jokes, and I-know also that not themselves to-me they-will-fall from the memory, as never themselves they-will-remove from the shoulders."
        ormsby: "“Let it pass for a jest as it cannot be revenged in earnest, but I know what sort of jest and earnest it was, and I know it will never be rubbed out of my memory any more than off my shoulders."
        vocab:
          - {w: "pasar por", d: "to pass for, count as; 'pase por burlas' = let it count as a joke"}
          - {w: "burlas y veras", d: "jest and earnest: a set pair"}
          - {w: "calidad", d: "quality, kind"}
          - {w: "caérsele a uno de la memoria", d: "to slip from one's memory"}
          - {w: "espaldas", d: "back, shoulders (plural in Spanish)"}
        diagram:
          - s: "Pase por burlas"
            r: "main verb 1, a concession: let it pass for a joke"
            under:
              - {s: "pues la venganza no puede pasar en veras", r: "why: since revenge cannot be taken in earnest"}
          - s: "pero yo sé"
            r: "main verb 2: but I know"
            under:
              - {s: "de qué calidad fueron las veras y las burlas", r: "what I know: what kind of earnest and jest they were"}
          - s: "y sé también"
            r: "main verb 3: and I also know"
            under:
              - s: "que no se me caerán de la memoria"
                r: "what I know: that they will not slip from my memory"
                under:
                  - {s: "como nunca se quitarán de las espaldas", r: "comparison: any more than they will leave my shoulders"}
        forms:
          - {w: "Pase", f: "pas- + -e → pasar (to pass), present subjunctive as a concession, it: 'let it pass'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "puede", f: "pued- + -e → poder (to be able), present, it. puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "sé", f: "saber (to know), present, I. Irregular: sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "fueron", f: "ser (to be), preterite, they. fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "se me caerán", f: "caer (to fall) + -án: future, they, with 'se' (off) and 'me' (from me). The future is the whole infinitive + -é, -ás, -á, -emos, -éis, -án."}
          - {w: "se quitarán", f: "quitar (to remove) + -án: future, they, with 'se' (themselves): 'will come off'. Same future."}
        note: "Sancho's 'as little from my memory as from my shoulders' says the blanketing still aches; his wit is in the parallel."
