      - es: "«Éste es —dirán— el que venció en singular batalla al gigantazo Brocabruno de la Gran Fuerza; el que desencantó al Gran Mameluco de Persia del largo encantamento en que había estado casi novecientos años»."
        literal: "«This is —they-will-say— the [one] who vanquished in single battle the giant-huge Brocabruno of the Great Strength; the [one] who disenchanted the Great Mameluke of Persia from-the long enchantment in which he-had been almost nine-hundred years»."
