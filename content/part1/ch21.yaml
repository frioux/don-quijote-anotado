        ormsby_note: "Literally \"at the Court\", la Corte. No doubt Pedro Telloz Giron, third Duke of Osuna, afterwards Viceroy in Sicily and Naples; \"a little man, but of great fame and fortunes,\" as Howell, writing twenty years later, calls him."
