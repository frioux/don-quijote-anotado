  - sentences:
      - es: "— En eso no estoy muy cierto —respondió don Quijote—; y, en caso de duda, hasta estar mejor informado, digo que los trueques, si es que tienes dellos necesidad estrema."
        literal: "— In that not I-am very certain —answered Don Quijote—; and, in case of doubt, until being better informed, I-say that them you-swap, if it-is that you-have of-them necessity extreme."
