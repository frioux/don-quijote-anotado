  - sentences:
      - es: "— Ahí entra bien también —dijo Sancho— lo que algunos desalmados dicen: \"No pidas de grado lo que puedes tomar por fuerza\"; aunque mejor cuadra decir: \"Más vale salto de mata que ruego de hombres buenos\"."
        literal: "— There enters well also —said Sancho— that which some soulless-ones say: \"Not ask of good-will that which you-can take by force\"; although better fits to-say: \"More is-worth leap of slaughter than plea of men good\"."
        ormsby: "“It comes to this, too,” said Sancho, “what some naughty people say, ‘Never ask as a favour what thou canst take by force;’ though it would fit better to say, ‘A clear escape is better than good men’s prayers.’"
        ormsby_note: "Proverb 107. Proverb 212. \"Mas vale salto de mata que ruego de hombres buenos.\" Mata is here an old equivalent of matanza = \"slaughter;\" in modern Spanish the word means a bush or hedge, in consequence of which the proverb is generally misunderstood and mistranslated."
        vocab:
          - {w: "desalmado", d: "heartless, wicked person (literally 'soulless')"}
