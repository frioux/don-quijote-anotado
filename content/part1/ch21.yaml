      - es: "Venía sobre un asno pardo, como Sancho dijo, y ésta fue la ocasión que a don Quijote le pareció caballo rucio rodado, y caballero, y yelmo de oro; que todas las cosas que veía, con mucha facilidad las acomodaba a sus desvariadas caballerías y malandantes pensamientos."
