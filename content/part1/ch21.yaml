  - sentences:
      - es: "— Mal cristiano eres, Sancho —dijo, oyendo esto, don Quijote—, porque nunca olvidas la injuria que una vez te han hecho; pues sábete que es de pechos nobles y generosos no hacer caso de niñerías."
        literal: "— Bad Christian you-are, Sancho —said, hearing this, Don Quijote—, because never you-forget the injury that one time to-you they-have done; then know-yourself that it-is of breasts noble and generous not to-make case of childishnesses."
        ormsby: "“Thou art a bad Christian, Sancho,” said Don Quixote on hearing this, “for once an injury has been done thee thou never forgettest it: but know that it is the part of noble and generous hearts not to attach importance to trifles."
