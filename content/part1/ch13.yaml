        forms:
          - {w: "me dijo", f: "dij- + -o → decir (to say), preterite, he, with 'me' (to me). Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "vio", f: "vi- + -o → ver (to see), preterite, he. vi, viste, vio, vimos, visteis, vieron."}
          - {w: "a aquella enemiga", f: "the 'a' marking a person as object; aquella (that), feminine to match 'enemiga'."}
          - {w: "fue", f: "ser (to be), preterite, it. ser's preterite is irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "le declaró", f: "declar- + -ó → declarar (to declare), preterite, he, with 'le' (to her). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
