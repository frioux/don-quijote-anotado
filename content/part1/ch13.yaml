  - sentences:
      - es: "— Con todo eso —dijo el caminante—, me parece, si mal no me acuerdo, haber leído que don Galaor, hermano del valeroso Amadís de Gaula, nunca tuvo dama señalada a quien pudiese encomendarse; y, con todo esto, no fue tenido en menos, y fue un muy valiente y famoso caballero."
        literal: "— With all that —said the traveler—, to-me it-seems, if badly not I-remember, to-have read that Don Galaor, brother of-the valorous Amadís de Gaula, never had lady marked-out to whom he-might commend-himself; and, with all this, not was held in less, and was a very valiant and famous knight."
        ormsby: "“Nevertheless,” said the traveller, “if I remember rightly, I think I have read that Don Galaor, the brother of the valiant Amadís of Gaul, never had any special lady to whom he might commend himself, and yet he was not the less esteemed, and was a very stout and famous knight.”"
        vocab:
