          - {w: "le acabó de desengañar y desdeñar", f: "acab- + -ó → acabar (to finish; 'acabar de' = to finally do), preterite, she, with 'le' (him). Same -ar preterite."}
          - {w: "puso", f: "pus- + -o → poner (to put), preterite, he. Irregular: puse, pusiste, puso, pusimos, pusisteis, pusieron."}
        note: "Ambrosio speaks as if Grisóstomo killed himself; the dark hints of suicide explain why the village priests objected to his burial in the hills."
