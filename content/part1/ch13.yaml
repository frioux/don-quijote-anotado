          - {w: "armado", f: "participle of armar (to arm), masculine for Don Quijote: 'armed'."}
          - {w: "pacífica", f: "pacífic- + -a → pacífico (peaceful), feminine to match 'tierra'."}
          - {w: "respondió", f: "respond- + -ió → responder (to reply), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
  - sentences:
      - es: "— La profesión de mi ejercicio no consiente ni permite que yo ande de otra manera."
        literal: "— The profession of my exercise not consents nor permits that I go in other manner."
        ormsby: "“The pursuit of my calling does not allow or permit me to go in any other fashion;"
        vocab:
          - {w: "profesión", d: "profession, in the religious sense of the vows one takes on entering an order; Don Quijote speaks of knight-errantry as an order he has professed"}
          - {w: "ejercicio", d: "calling, occupation, practice"}
          - {w: "consentir", d: "to allow, permit"}
          - {w: "andar", d: "to go about"}
        diagram:
          - s: "no consiente ni permite"
            r: "main verb: does not allow or permit"
            under:
              - {s: "La profesión de mi ejercicio", r: "subject: the profession of my calling"}
              - {s: "que yo ande de otra manera", r: "what it does not allow: that I go about any other way"}
        forms:
          - {w: "consiente", f: "consient- + -e → consentir (to allow), present, it. The stem e becomes ie when stressed: consiento, consientes, consiente, consentimos, consentís, consienten."}
          - {w: "permite", f: "permit- + -e → permitir (to permit), present, it. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "ande", f: "and- + -e → andar (to go about), present subjunctive, I. Subjunctive because it is what is not allowed ('no consiente que'). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
      - es: "El buen paso, el regalo y el reposo, allá se inventó para los blandos cortesanos; mas el trabajo, la inquietud y las armas sólo se inventaron e hicieron para aquellos que el mundo llama caballeros andantes, de los cuales yo, aunque indigno, soy el menor de todos."
        literal: "The good pace, the comfort and the repose, over-there was-invented for the soft courtiers; but the toil, the unrest and the arms only were-invented and made for those whom the world calls knights errant, of whom I, although unworthy, am the least of all."
        ormsby: "easy life, enjoyment, and repose were invented for soft courtiers, but toil, unrest, and arms were invented and made for those alone whom the world calls knights-errant, of whom I, though unworthy, am the least of all.”"
        vocab:
          - {w: "el buen paso", d: "the easy life, taking things gently; literally 'the good pace'"}
          - {w: "regalo", d: "comfort, luxury, pampering (false friend: not 'gift')"}
          - {w: "reposo", d: "rest, repose"}
          - {w: "allá", d: "over there, somewhere else; dismissive, 'let them have it'"}
          - {w: "blando", d: "soft, effeminate"}
          - {w: "cortesano", d: "courtier"}
          - {w: "inquietud", d: "restlessness, unrest, hardship"}
          - {w: "indigno", d: "unworthy"}
          - {w: "el menor de todos", d: "the least of all; echoes St Paul calling himself 'the least of the apostles'"}
        diagram:
          - s: "se inventó"
            r: "main verb 1: was invented"
            under:
              - {s: "El buen paso, el regalo y el reposo", r: "subject: ease, comfort and rest"}
              - {s: "allá", r: "where: over there, elsewhere"}
              - {s: "para los blandos cortesanos", r: "for whom: for soft courtiers"}
          - s: "sólo se inventaron e hicieron"
            r: "main verb 2 (after 'mas'): were invented and made only"
            under:
              - {s: "el trabajo, la inquietud y las armas", r: "subject: toil, unrest and arms"}
              - s: "para aquellos"
                r: "for whom: for those"
                under:
                  - s: "que el mundo llama caballeros andantes"
                    r: "describes 'aquellos': whom the world calls knights-errant"
                    under:
                      - {s: "de los cuales yo, aunque indigno, soy el menor de todos", r: "describes the knights: of whom I, unworthy, am the least"}
        forms:
          - {w: "buen", f: "bueno (good) clipped before a masculine singular noun ('paso'), like un, algún, ningún, gran."}
          - {w: "se inventó", f: "invent- + -ó → inventar (to invent), preterite, it, with the passive 'se': 'was invented'. Singular although three things are named, agreeing with the idea as a whole. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "blandos", f: "bland- + -os → blando (soft), masculine plural to match 'cortesanos'."}
          - {w: "se inventaron e hicieron", f: "invent- + -aron → inventar, preterite, they (same -ar preterite), and hic- + -ieron → hacer (to make), preterite, they (hice, hiciste, hizo, hicimos, hicisteis, hicieron), both with the passive 'se': 'were invented and made'."}
          - {w: "e", f: "'y' (and) becomes 'e' before a word beginning with the i sound ('hicieron')."}
          - {w: "llama", f: "llam- + -a → llamar (to call), present, it (el mundo). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "indigno", f: "in- (not) + digno (worthy), masculine for Don Quijote."}
          - {w: "soy", f: "ser (to be), present, I. soy, eres, es, somos, sois, son."}
          - {w: "el menor", f: "menor, the irregular comparative of pequeño (small): with the article, 'the least, the smallest'."}
  - sentences:
      - es: "Apenas le oyeron esto, cuando todos le tuvieron por loco; y, por averiguarlo más y ver qué género de locura era el suyo, le tornó a preguntar Vivaldo que qué quería decir \"caballeros andantes\"."
        literal: "Scarcely him they-heard this, when all him held for mad; and, for ascertaining-it more and seeing what kind of madness was his, him turned to ask Vivaldo that what meant to-say 'knights errant'."
        ormsby: "The instant they heard this all set him down as mad, and the better to settle the point and discover what kind of madness his was, Vivaldo proceeded to ask him what knights-errant meant."
        vocab:
          - {w: "apenas ... cuando", d: "scarcely ... when; the 'cuando' clause carries the main event"}
          - {w: "tener por loco", d: "to take for a madman, set down as mad"}
          - {w: "por + infinitive", d: "in order to; 'por averiguarlo' = to find out"}
          - {w: "averiguar", d: "to find out, ascertain"}
          - {w: "género", d: "kind, sort"}
          - {w: "locura", d: "madness"}
          - {w: "tornar a + infinitive", d: "to do again; here 'went on to ask'"}
          - {w: "que qué", d: "the first 'que' introduces the reported question, the second asks it: 'asked him what'"}
          - {w: "querer decir", d: "to mean"}
        diagram:
          - s: "le tuvieron por loco"
            r: "main verb 1: they took him for mad"
            under:
              - {s: "Apenas le oyeron esto, cuando", r: "when: the moment they heard him say this"}
              - {s: "todos", r: "subject: all of them"}
          - s: "le tornó a preguntar"
            r: "main verb 2 (after 'y'): went on to ask him"
            under:
              - {s: "por averiguarlo más y ver qué género de locura era el suyo", r: "why: to settle it further and see what kind of madness his was"}
              - {s: "Vivaldo", r: "subject"}
              - {s: "que qué quería decir", r: "what he asked: what 'caballeros andantes' meant"}
        forms:
          - {w: "le oyeron", f: "o- + -yeron → oír (to hear), preterite, they, with 'le' (him). The i of the ending becomes y between vowels: oí, oíste, oyó, oímos, oísteis, oyeron."}
          - {w: "le tuvieron", f: "tuv- + -ieron → tener (to hold), preterite, they, with 'le' (him); 'tener por' = to take for. Irregular stem: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron."}
          - {w: "averiguarlo", f: "averiguar (to find out) + lo (it), the pronoun hung on the infinitive; 'por' + infinitive = in order to."}
          - {w: "era", f: "ser (to be), imperfect, it. ser's imperfect is irregular: era, eras, era, éramos, erais, eran."}
          - {w: "el suyo", f: "suyo (his) with the article, standing for 'su género de locura': 'his'."}
          - {w: "le tornó a preguntar", f: "torn- + -ó → tornar (to turn; 'tornar a' + infinitive = to do again), preterite, he, with 'le' (him). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "quería decir", f: "quer- + -ía → querer (to want), imperfect, it, + decir: 'querer decir' = to mean. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
  - sentences:
      - es: "— ¿No han vuestras mercedes leído —respondió don Quijote— los anales e historias de Ingalaterra, donde se tratan las famosas fazañas del rey Arturo, que continuamente en nuestro romance castellano llamamos el rey Artús, de quien es tradición antigua y común en todo aquel reino de la Gran Bretaña que este rey no murió, sino que, por arte de encantamento, se convirtió en cuervo, y que, andando los tiempos, ha de volver a reinar y a cobrar su reino y cetro;"
        literal: "— Not have your graces read —replied Don Quijote— the annals and histories of England, where are-treated the famous exploits of-the king Arthur, whom continually in our Romance Castilian we-call the king Artús, of whom it-is tradition ancient and common in all that kingdom of the Great Britain that this king not died, but that, by art of enchantment, he-turned-himself into raven, and that, going-along the times, he-has to return to reign and to recover his kingdom and scepter;"
        ormsby: "“Have not your worships,” replied Don Quixote, “read the annals and histories of England, in which are recorded the famous deeds of King Arthur, whom we in our popular Castilian invariably call King Artus, with regard to whom it is an ancient tradition, and commonly received all over that kingdom of Great Britain, that this king did not die, but was changed by magic art into a raven, and that in process of time he is to return to reign and recover his kingdom and sceptre;"
        vocab:
          - {w: "vuestras mercedes", d: "your graces, the polite 'you' in the plural; it later shrank into 'ustedes'"}
          - {w: "anales", d: "annals, year-by-year chronicles"}
          - {w: "Ingalaterra", d: "= Inglaterra, England; the old form with an extra syllable"}
          - {w: "tratarse", d: "to be dealt with, be recounted"}
          - {w: "fazaña", d: "= hazaña, exploit, feat; the f- spelling of the old romances, which Don Quijote affects"}
          - {w: "el rey Arturo, el rey Artús", d: "King Arthur; 'Artús' is the form the Spanish ballads and romances of chivalry used"}
          - {w: "continuamente", d: "always, habitually"}
          - {w: "romance castellano", d: "the Castilian vernacular; 'romance' here is the common tongue as opposed to Latin (it also means 'ballad')"}
          - {w: "la Gran Bretaña", d: "Great Britain"}
          - {w: "por arte de encantamento", d: "by magic art; 'encantamento' = encantamiento, enchantment"}
          - {w: "cuervo", d: "raven, crow"}
          - {w: "andando los tiempos", d: "in the course of time, as time goes on"}
          - {w: "haber de", d: "to be to, be destined to; 'ha de volver' = he is to return"}
          - {w: "cobrar", d: "to recover, get back"}
          - {w: "cetro", d: "scepter"}
        diagram:
          - s: "¿No han vuestras mercedes leído"
            r: "main verb: have your graces not read"
            under:
              - {s: "respondió don Quijote", r: "speech tag"}
              - s: "los anales e historias de Ingalaterra"
                r: "object: the annals and histories of England"
                under:
                  - s: "donde se tratan las famosas fazañas del rey Arturo"
