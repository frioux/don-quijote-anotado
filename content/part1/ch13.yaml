      - es: "que sus cabellos son oro, su frente campos elíseos, sus cejas arcos del cielo, sus ojos soles, sus mejillas rosas, sus labios corales, perlas sus dientes, alabastro su cuello, mármol su pecho, marfil sus manos, su blancura nieve, y las partes que a la vista humana encubrió la honestidad son tales, según yo pienso y entiendo, que sólo la discreta consideración puede encarecerlas, y no compararlas."
