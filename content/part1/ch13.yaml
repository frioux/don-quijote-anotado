  - sentences:
      - es: "Nunca fuera caballero de damas tan bien servido como fuera Lanzarote cuando de Bretaña vino;"
        literal: "Never was knight by ladies so well served as was Lancelot when from Brittany he-came;"
        ormsby: "“O never surely was there knight / So served by hand of dame, / As served was he Sir Lancelot hight / When he from Britain came—"
        ormsby_match: false
        vocab:
          - {w: "fuera", d: "here simply 'was': the -ra form keeps its old pluperfect meaning in ballads"}
          - {w: "de damas", d: "by ladies; 'de' marks the doer, where modern Spanish uses 'por'"}
          - {w: "Bretaña", d: "Brittany (the ballad means Lancelot's homeland), though Ormsby's 'Britain' is also possible"}
        diagram:
          - s: "Nunca fuera caballero"
            r: "main verb: never was there a knight"
            under:
              - {s: "de damas tan bien servido", r: "describes 'caballero': so well served by ladies"}
              - s: "como fuera Lanzarote"
                r: "comparison: as Lancelot was"
                under:
                  - {s: "cuando de Bretaña vino", r: "when: when he came from Brittany"}
        forms:
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), he, used twice here as a plain past 'was'. The -ra form began as a Latin pluperfect ('had been'), and ballads keep that old sense. fuera, fueras, fuera, fuéramos, fuerais, fueran."}
          - {w: "servido", f: "participle of servir (to serve), masculine to match 'caballero'."}
          - {w: "vino", f: "vin- + -o → venir (to come), preterite, he. Irregular: vine, viniste, vino, vinimos, vinisteis, vinieron."}
        ormsby_note: "The ballad (Cancionero de Romances, Antwerp, S.A., and Duran, No. 352) is that parodied by Don Quixote in Chapter II. 'Britain' is, of course, Brittany; Lancelot's father, King Ban, was a Breton. The idea of the 'go-between' is derived from an Italian source, but the name Quintañona is Spanish; it means simply an old woman, one who has a quintal, or hundredweight of years on her back. The transformation of Arthur into a raven is also a Southern addition to the Arthurian legend. Cervantes ridicules the story in Persiles and Sigismunda."
        note: "Don Quijote sang this ballad about himself at the inn, putting his own name and village in place of Lancelot's. Here he quotes it straight, as evidence."
