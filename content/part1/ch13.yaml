  - sentences:
      - es: "— Aunque el mío es de los Cachopines de Laredo —respondió el caminante—, no le osaré yo poner con el del Toboso de la Mancha, puesto que, para decir verdad, semejante apellido hasta ahora no ha llegado a mis oídos."
        literal: "— Although the mine is of the Cachopines of Laredo —replied the traveler—, not it will-dare I to-put with that of El Toboso of La Mancha, granted that, to tell truth, such surname until now not has arrived to my ears."
        ormsby: "“Although mine is of the Cachopins of Laredo,” said the traveller, “I will not venture to compare it with that of El Toboso of La Mancha, though, to tell the truth, no such surname has until now ever reached my ears.”"
        vocab:
          - {w: "el mío", d: "mine (my lineage)"}
          - {w: "Cachopines de Laredo", d: "a family of Laredo, a port near Santander; 'cachopín' also meant a Spaniard back from the Indies, so the boast is a mild joke"}
          - {w: "osar", d: "to dare"}
          - {w: "poner con", d: "to set beside, compare with"}
          - {w: "puesto que", d: "although (false friend: in modern Spanish it means 'since')"}
          - {w: "apellido", d: "surname, family name"}
        diagram:
          - s: "no le osaré yo poner con el del Toboso de la Mancha"
            r: "main verb: I will not dare compare it with that of El Toboso"
            under:
              - {s: "Aunque el mío es de los Cachopines de Laredo", r: "concession: although mine is of the Cachopines of Laredo"}
              - {s: "respondió el caminante", r: "speech tag"}
              - {s: "puesto que, para decir verdad, semejante apellido hasta ahora no ha llegado a mis oídos", r: "concession 2: although, to be honest, no such name has reached my ears"}
        forms:
          - {w: "el mío", f: "'mine', for 'mi linaje'."}
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "respondió", f: "respond- + -ió → responder (to reply), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "le osaré", f: "osar- + -é → osar (to dare), future, I, with 'le' (it, my lineage, 'le' for a masculine thing). The future adds -é, -ás, -á, -emos, -éis, -án to the infinitive."}
          - {w: "ha llegado", f: "ha = haber, present, it (he, has, ha, hemos, habéis, han), + llegado, the participle of llegar (to arrive): 'has reached'."}
          - {w: "mis", f: "plural to match 'oídos'."}
        ormsby_note: "Cachopín, or Gachupín, a word of Indian origin, and applied to Spaniards living in or returned from the Indies. Laredo is a seaport close to Santander, where also the Cachopins were numerous, as appears from a quaint inscription on one of the houses quoted by Bowle."
