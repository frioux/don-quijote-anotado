      - es: "Allí me dijo él que vio la vez primera a aquella enemiga mortal del linaje humano, y allí fue también donde la primera vez le declaró su pensamiento, tan honesto como enamorado, y allí fue la última vez donde Marcela le acabó de desengañar y desdeñar, de suerte que puso fin a la tragedia de su miserable vida."
        literal: "There to-me said he that he-saw the time first [to] that enemy mortal of-the lineage human, and there was also where the first time to-her he-declared his thought, as chaste as loving, and there was the last time where Marcela him finished of disillusioning and disdaining, of sort that he-put end to the tragedy of his miserable life."
        ormsby: "Here it was, he told me, that he saw for the first time that mortal enemy of the human race, and here, too, for the first time he declared to her his passion, as honourable as it was devoted, and here it was that at last Marcela ended by scorning and rejecting him so as to bring the tragedy of his wretched life to a close;"
        vocab:
