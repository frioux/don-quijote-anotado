          - {w: "honesto", d: "chaste, honorable (false friend)"}
          - {w: "desengañar", d: "to undeceive, disillusion; to tell plainly there is no hope"}
          - {w: "desdeñar", d: "to scorn, disdain"}
          - {w: "de suerte que", d: "so that, in such a way that"}
