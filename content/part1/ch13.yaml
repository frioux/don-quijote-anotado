summary: |
  At dawn five of the goatherds wake Don Quijote to take him to Grisóstomo's burial. On the way they meet six shepherds in black sheepskins and garlands of cypress and oleander, and two gentlemen on horseback with servants, all bound for the funeral. One of the gentlemen, Vivaldo, asks Don Quijote why he goes about armed in so peaceful a country.

  Don Quijote explains that he is a knight-errant and lectures them on King Arthur, said to have been turned into a raven, the Round Table, Lancelot and Guinevere, Amadís and his descendants and the other heroes of chivalry. The travelers see at once that he is mad, and Vivaldo, to pass the time, draws him out. He says the knight's calling is as strict as a Carthusian monk's; Don Quijote answers that knights carry out by arms what monks pray for, and suffer more. Vivaldo objects that knights commend themselves to their ladies rather than to God, and asks whether every knight must have a lady. Don Quijote insists that a knight without a lady would be a bastard and a thief who climbed over the wall.

  Asked about his own lady, Don Quijote names Dulcinea of El Toboso, describes her beauty with every conventional comparison of the poets (golden hair, coral lips, pearl teeth), and claims for her a lineage that will found the noblest houses of the future. Only Sancho believes him, though he wonders why he has never heard of a princess in El Toboso.

  Twenty shepherds arrive carrying Grisóstomo's body on a bier strewn with flowers, books and papers, and begin digging the grave by a rock at the foot of the mountain. Grisóstomo's friend Ambrosio says this is where Grisóstomo first saw Marcela and where she finally rejected him, delivers a eulogy, and announces that he will burn the papers as Grisóstomo ordered. Vivaldo argues that Augustus did not burn Virgil's Aeneid, takes some of the papers, and, with Ambrosio's permission, begins to read aloud the last of them, the 'Song of Despair'.
context: |
  Travelers and shepherds. The two gentlemen on horseback with servants on foot are well-off hidalgos or caballeros on a journey; their courteous greeting and their easy curiosity about a madman show the manners of the class Don Quijote claims to belong to. The shepherds in black sheepskins and garlands of cypress, yew and oleander are dressed for mourning, but with the symbolic plants of pastoral literature. The bier carried on poles, the grave dug at the foot of a rock instead of in a churchyard, and the papers laid around the body are all part of a funeral that is half real and half literary.

  The books. Don Quijote's account of chivalry is a compressed history of the romances: the Arthurian legend (with the Spanish additions Ormsby points out, Arthur turned into a raven and the duenna Quintañona as go-between), the ballad of Lancelot he parodied in chapter 2, Amadís de Gaula and his line, Felixmarte de Hircania, Tirant lo Blanc, and Belianís de Grecia. Vivaldo's objections are the ones moralists actually made: that knights pray to their ladies as to gods, and that the ladies are idolized. Don Quijote's reply about a knight without a lady being a thief who climbs over the wall borrows the Gospel image of the sheepfold (John 10:1). The final verse, 'nadie las mueva', comes from Ariosto's Orlando Furioso, which, Ormsby notes, only glosses Zerbino's inscription. The chapter then turns fully to pastoral, the other fashionable fiction, with its lovesick shepherd-poet and cruel shepherdess.

  The narrator's games. The travelers 'finish satisfying themselves' that Don Quijote is mad and decide to enjoy it, an audience for the first time; the narrator notes that even the goatherds can see his madness, and that only Sancho believes him, because he knows him too well to suspect a lie. Dulcinea's portrait is the full Petrarchan catalogue, comic because she is a village girl. Ormsby notes that the 'high mountains' near the village are imaginary and that Hartzenbusch fussed about whether El Toboso is 'near'.

  Religion and the will. The comparison of knights and monks (Carthusians, the strictest order) puts knight-errantry on the level of a religious vocation: Don Quijote speaks of 'profession', of having 'professed' as a 'sinner', and calls knights 'ministers of God on earth'. Grisóstomo's wish to be buried in the hills and to have his writings burned raises two issues: the Church's objection to unconsecrated burial, hinting at suicide, and whether an unreasonable will should be obeyed. Vivaldo cites the famous case of Virgil, who asked that the Aeneid be burned and was overruled by Augustus.

  Names. Vivaldo and Ambrosio are ordinary names. Dulcinea comes from 'dulce', sweet. The family names Don Quijote rejects for her are real great houses of Rome, Catalonia, Valencia, Aragón, Castile and Portugal. The traveler's 'Cachopines de Laredo' is, as Ormsby explains, a family of a port near Santander, and 'cachopín' also meant a Spaniard back from the Indies: a modest boast, gently ironic.

  Reading Cervantes' Spanish. The chapter mixes the narrator's plain style, Don Quijote's high oratory and Ambrosio's funeral rhetoric (balanced phrases like 'Quiso bien, fue aborrecido; adoró, fue desdeñado'). Archaisms continue: mesmo, ansí, asimesmo, estrañeza, estremo, proprio, priesa, yelos, Ingalaterra, Portogal, habemos (for hemos), vee (for ve), fazañas and fechos (the f- of the romances), trujeron for trajeron; -rl- becoming -ll- (decille, ponello, acometella, oíllo, remedialla); contractions with 'de' (dellos, della, dél, desta, deste, desto); pronouns hung on the verb (Paréceme, Preguntóles, comenzóse, síguese, Recibiéronse, Oyólo); vos commands (Mirá, haced, leelde); the -ra form as a conditional (hiciera, fuera, quedaran, tuviera); the future subjunctive (hiciéremos, deparare, fuere, tardare); and the preterite anterior 'no hubieron andado ... cuando'. Watch for false friends: discreto (wise), honesto (chaste), admiración (astonishment), regalo (comfort), puesto que (although), calidad (rank), generoso (noble), ocasión (cause).
