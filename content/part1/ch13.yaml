  - sentences:
      - es: "En estas pláticas iban, cuando vieron que, por la quiebra que dos altas montañas hacían, bajaban hasta veinte pastores, todos con pellicos de negra lana vestidos y coronados con guirnaldas, que, a lo que después pareció, eran cuál de tejo y cuál de ciprés."
        literal: "In these talks they-were-going, when they-saw that, through the gap that two high mountains made, were-coming-down up-to twenty shepherds, all with sheepskin-jackets of black wool dressed and crowned with garlands, which, to what afterward appeared, were some of yew and some of cypress."
        ormsby: "They were going along conversing in this way, when they saw descending a gap between two high mountains some twenty shepherds, all clad in sheepskins of black wool, and crowned with garlands which, as afterwards appeared, were, some of them of yew, some of cypress."
        vocab:
          - {w: "quiebra", d: "gap, cleft, pass between hills"}
          - {w: "hasta veinte", d: "about twenty, as many as twenty"}
          - {w: "pellico", d: "shepherd's sheepskin jacket"}
          - {w: "lana", d: "wool"}
          - {w: "a lo que después pareció", d: "as later appeared"}
          - {w: "cuál ... cuál", d: "some ... others"}
          - {w: "tejo", d: "yew, a tree of graveyards and mourning"}
          - {w: "ciprés", d: "cypress, the tree of mourning"}
        diagram:
          - s: "En estas pláticas iban"
            r: "main verb 1: they were going along in this talk"
          - s: "cuando vieron"
            r: "main verb 2: when they saw"
            under:
              - s: "que ... bajaban hasta veinte pastores"
                r: "what they saw: that some twenty shepherds were coming down"
                under:
                  - {s: "por la quiebra que dos altas montañas hacían", r: "where: through the gap between two high mountains"}
                  - {s: "todos con pellicos de negra lana vestidos", r: "describes 'pastores': all dressed in black wool jackets"}
                  - s: "y coronados con guirnaldas"
                    r: "describes 'pastores' 2: and crowned with garlands"
                    under:
                      - {s: "que, a lo que después pareció, eran cuál de tejo y cuál de ciprés", r: "describes 'guirnaldas': which, as later appeared, were some yew and some cypress"}
        forms:
          - {w: "iban", f: "ir (to go), imperfect, they. Irregular: iba, ibas, iba, íbamos, ibais, iban."}
          - {w: "vieron", f: "v- + -ieron → ver (to see), preterite, they. vi, viste, vio, vimos, visteis, vieron."}
          - {w: "hacían", f: "hac- + -ían → hacer (to make), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "bajaban", f: "baj- + -aban → bajar (to come down), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "altas", f: "alt- + -as → alto (high), feminine plural to match 'montañas'."}
          - {w: "negra", f: "negr- + -a → negro (black), feminine to match 'lana', placed before the noun."}
          - {w: "vestidos, coronados", f: "participles of vestir (to dress) and coronar (to crown), masculine plural to match 'pastores'; 'vestidos' comes last, Latin fashion."}
          - {w: "pareció", f: "parec- + -ió → parecer (to appear), preterite, it. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "eran", f: "ser (to be), imperfect, they. era, eras, era, éramos, erais, eran."}
        ormsby_note: "It is hardly necessary to observe that these high mountains in the neighborhood of Argamasilla are purely imaginary. The nearest that could by any stretch of courtesy be called high would be those of the Toledo Sierra some sixty or seventy miles distant."
