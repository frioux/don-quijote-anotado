          - {w: "se lo contó", f: "cont- + -ó → contar (to tell), preterite, he, with 'se' (to them) and 'lo' (it). 'se' stands for 'les': le / les turn into 'se' before lo / la / los / las. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
