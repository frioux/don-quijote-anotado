          - {w: "cuyo", f: "cuy- + -o → cuyo (whose), masculine to match 'entierro', the thing possessed, not the possessor."}
          - {w: "iban", f: "ir (to go), imperfect, they. Irregular: iba, ibas, iba, íbamos, ibais, iban."}
      - es: "Finalmente, él contó todo lo que Pedro a don Quijote había contado."
