  - sentences:
      - es: "— Mirá bien, Ambrosio, si es éste el lugar que Grisóstomo dijo, ya que queréis que tan puntualmente se cumpla lo que dejó mandado en su testamento."
        literal: "— Look well, Ambrosio, if is this the place that Grisóstomo said, since you-want that so punctually be-fulfilled that which he-left ordered in his testament."
        ormsby: "“Observe carefully, Ambrosio if this is the place Chrysostom spoke of, since you are anxious that what he directed in his will should be so strictly complied with.”"
        vocab:
          - {w: "mirá", d: "= mirad, look (vosotros command); the final -d dropped, a colloquial form"}
          - {w: "ya que", d: "since, seeing that"}
          - {w: "puntualmente", d: "exactly, to the letter"}
          - {w: "cumplirse", d: "to be carried out, fulfilled"}
          - {w: "dejar mandado", d: "to leave instructions, order (for after one's death)"}
          - {w: "testamento", d: "will, last testament"}
        diagram:
          - s: "Mirá bien, Ambrosio,"
            r: "main verb: look carefully, Ambrosio"
            under:
              - {s: "si es éste el lugar que Grisóstomo dijo", r: "what to check: whether this is the place Grisóstomo named"}
              - s: "ya que queréis"
                r: "why: since you want"
                under:
                  - {s: "que tan puntualmente se cumpla lo que dejó mandado en su testamento", r: "what you want: that his will be carried out to the letter"}
        forms:
          - {w: "Mirá", f: "mirad, the vosotros command of mirar (to look), with the -d dropped and the stress kept: 'look!'. Here addressed to one man, Ambrosio, as 'vos'."}
          - {w: "éste", f: "este (this) with an accent because it stands alone as a pronoun; modern spelling drops the accent."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "queréis", f: "quer- + -éis → querer (to want), present, you (vos / vosotros). quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "se cumpla", f: "cumpl- + -a → cumplir (to fulfill), present subjunctive, it, with passive 'se'. Subjunctive after 'queréis que'. The present subjunctive of -er and -ir verbs: -a, -as, -a, -amos, -áis, -an."}
          - {w: "dejó mandado", f: "dej- + -ó → dejar (to leave), preterite, he (the -ar preterite: -é, -aste, -ó, -amos, -asteis, -aron), + mandado, the participle of mandar: 'left ordered'."}
        note: "The shepherds address each other as 'vos', the old familiar-polite form, with the vosotros verb endings. 'Mirá' for 'mirad' was a rustic or colloquial form."
  - sentences:
