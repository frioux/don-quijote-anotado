          - {w: "habían encontrado", f: "hab- + -ían → haber (to have), imperfect, they (había, habías, había, habíamos, habíais, habían), + encontrado, the participle of encontrar (to meet): the pluperfect 'had met'."}
          - {w: "haberles visto", f: "haber (to have), infinitive, + les (them) + visto, the irregular participle of ver (to see): 'having seen them'. After 'por' = because of. The pronoun hangs on haber, not on the participle."}
          - {w: "aquel tan triste traje", f: "aquel (that), masculine to match 'traje'; 'tan' (so) sits before the adjective."}
