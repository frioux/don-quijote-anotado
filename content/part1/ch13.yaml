          - {w: "le dijo", f: "dij- + -o → decir (to say), preterite, he, with 'le' (to him). Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Paréceme, señor caballero andante, que vuestra merced ha profesado una de las más estrechas profesiones que hay en la tierra, y tengo para mí que aun la de los frailes cartujos no es tan estrecha."
        literal: "— It-seems-to-me, sir knight errant, that your grace has professed one of the most strict professions that there-are on the earth, and I-hold for myself that even that of the friars Carthusian not is so strict."
        ormsby: "“It seems to me, Señor Knight-errant, that your worship has made choice of one of the most austere professions in the world, and I imagine even that of the Carthusian monks is not so austere.”"
        vocab:
          - {w: "vuestra merced", d: "your grace, the polite 'you'; it later shrank into 'usted' and takes the 'he/she' form of the verb"}
          - {w: "profesar", d: "to take vows in, enter (an order)"}
          - {w: "estrecho", d: "strict, austere; literally narrow"}
          - {w: "tener para sí", d: "to be privately of the opinion, to imagine"}
          - {w: "aun", d: "even (no accent; 'aún' with the accent = still)"}
          - {w: "frailes cartujos", d: "Carthusian monks, the strictest order: silence, solitude in cells, fasting"}
        diagram:
          - s: "Paréceme, señor caballero andante,"
            r: "main verb 1: it seems to me, sir knight"
            under:
              - s: "que vuestra merced ha profesado una de las más estrechas profesiones"
                r: "what seems: that you have entered one of the strictest professions"
                under:
                  - {s: "que hay en la tierra", r: "describes 'profesiones': that exist on earth"}
          - s: "tengo para mí"
            r: "main verb 2 (after 'y'): I am of the opinion"
            under:
              - {s: "que aun la de los frailes cartujos no es tan estrecha", r: "what I think: that even the Carthusians' is not so strict"}
        forms:
          - {w: "Paréceme", f: "parec- + -e + me → parecer (to seem), present, it, with 'me' (to me) stuck on the end. Cervantes hangs pronouns on the end of a verb that opens its clause; modern 'me parece'. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "ha profesado", f: "ha = haber (to have), present, he (he, has, ha, hemos, habéis, han), + profesado, the participle of profesar: 'has professed'. 'vuestra merced' means 'you' but takes the 'he' form of the verb."}
          - {w: "estrechas", f: "estrech- + -as → estrecho (strict), feminine plural to match 'profesiones'."}
          - {w: "hay", f: "haber's special present form, 'there is, there are'; it never changes."}
          - {w: "tengo", f: "tener (to hold), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "mí", f: "'me' after a preposition ('para mí'); the accent tells it from 'mi' (my)."}
          - {w: "la de", f: "'la' stands for 'la profesión': 'that of the Carthusians'."}
          - {w: "cartujos", f: "cartuj- + -os → cartujo (Carthusian), masculine plural to match 'frailes'."}
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "estrecha", f: "estrech- + -a → estrecho, feminine to match 'la' (profesión)."}
  - sentences:
      - es: "— Tan estrecha bien podía ser —respondió nuestro don Quijote—, pero tan necesaria en el mundo no estoy en dos dedos de ponello en duda."
        literal: "— So strict well it-could be —replied our Don Quijote—, but so necessary in the world not I-am within two fingers of putting-it in doubt."
        ormsby: "“As austere it may perhaps be,” replied our Don Quixote, “but so necessary for the world I am very much inclined to doubt."
        vocab:
          - {w: "bien podía ser", d: "it may well be, that could well be"}
          - {w: "nuestro don Quijote", d: "the narrator's affectionate 'our Don Quijote'"}
          - {w: "estar en dos dedos de", d: "to be within two fingers of, within a hair's breadth of"}
          - {w: "ponello", d: "= ponerlo, to put it; -rl- becomes -ll- when a pronoun hangs on the infinitive"}
          - {w: "poner en duda", d: "to call into question, doubt"}
        diagram:
          - s: "bien podía ser"
            r: "main verb 1: it may well be"
            under:
              - {s: "Tan estrecha", r: "what it may be: so strict"}
          - {s: "respondió nuestro don Quijote", r: "speech tag"}
          - s: "no estoy en dos dedos de ponello en duda"
            r: "main verb 2 (after 'pero'): I am (not) two fingers from doubting it"
            under:
              - {s: "tan necesaria en el mundo", r: "what is in doubt: that it is so necessary to the world"}
        forms:
          - {w: "estrecha, necesaria", f: "feminine, matching 'profesión' understood from Vivaldo's remark."}
          - {w: "podía", f: "pod- + -ía → poder (to be able), imperfect, it: 'could'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "respondió", f: "respond- + -ió → responder (to reply), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "nuestro", f: "nuestr- + -o → nuestro (our), masculine for Don Quijote."}
          - {w: "estoy", f: "estar (to be), present, I. estoy, estás, está, estamos, estáis, están."}
          - {w: "ponello", f: "poner (to put) + lo (it): the r of the infinitive turns into l before the pronoun; modern 'ponerlo'."}
        note: "The second half is famously tangled: 'no estoy en dos dedos de ponello en duda' says literally that he is not close to doubting it, while the sense (and Ormsby) requires that he is. Editors either treat the 'no' as a slip or as one of Cervantes' loose negatives."
