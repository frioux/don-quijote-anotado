  - sentences:
      - es: "Cesó esta plática y comenzóse otra, preguntando el que se llamaba Vivaldo a don Quijote qué era la ocasión que le movía a andar armado de aquella manera por tierra tan pacífica. A lo cual respondió don Quijote:"
        literal: "Ceased this talk and began-itself another, asking the [one] who called-himself Vivaldo [to] Don Quijote what was the occasion that him moved to go armed in that manner through land so peaceful. To which replied Don Quijote:"
        ormsby: "This conversation dropped, and another was commenced by him who was called Vivaldo asking Don Quixote what was the reason that led him to go armed in that fashion in a country so peaceful. To which Don Quixote replied,"
        vocab:
          - {w: "cesar", d: "to cease, come to an end"}
          - {w: "plática", d: "talk, conversation"}
          - {w: "ocasión", d: "reason, cause"}
          - {w: "mover a", d: "to move, prompt (someone) to"}
          - {w: "andar armado", d: "to go about armed"}
          - {w: "pacífico", d: "peaceful, at peace"}
          - {w: "a lo cual", d: "to which"}
        diagram:
          - s: "Cesó"
            r: "main verb 1: ended"
            under:
              - {s: "esta plática", r: "subject: this talk"}
          - s: "y comenzóse otra"
            r: "main verb 2: and another began"
            under:
              - s: "preguntando el que se llamaba Vivaldo a don Quijote"
                r: "how: the one called Vivaldo asking Don Quijote"
                under:
                  - s: "qué era la ocasión"
                    r: "what he asked: what the reason was"
                    under:
                      - {s: "que le movía a andar armado de aquella manera por tierra tan pacífica", r: "describes 'ocasión': that made him go armed like that through so peaceful a land"}
          - s: "respondió"
            r: "main verb 3 (new sentence): replied"
            under:
              - {s: "A lo cual", r: "to what: to which"}
              - {s: "don Quijote", r: "subject"}
        forms:
          - {w: "Cesó", f: "ces- + -ó → cesar (to cease), preterite, it. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "comenzóse", f: "comenz- + -ó + se → comenzarse (to begin), preterite, it, with 'se' stuck on the end. Cervantes hangs pronouns on the end of a verb that opens its clause; modern 'se comenzó'. Same -ar preterite."}
          - {w: "preguntando", f: "gerund of preguntar (to ask): 'asking'; its subject, 'el que se llamaba Vivaldo', follows it."}
          - {w: "se llamaba", f: "llam- + -aba → llamarse (to be called), imperfect, he, with 'se'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "era", f: "ser (to be), imperfect, it. ser's imperfect is irregular: era, eras, era, éramos, erais, eran."}
