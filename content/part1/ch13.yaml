  - sentences:
      - es: "Por estas razones que dijo, acabaron de enterarse los caminantes que era don Quijote falto de juicio, y del género de locura que lo señoreaba, de lo cual recibieron la mesma admiración que recibían todos aquellos que de nuevo venían en conocimiento della."
        literal: "Through these reasonings that he-said, finished of informing-themselves the travelers that was Don Quijote lacking of judgment, and of-the kind of madness that him lorded-over, of which they-received the same wonder that received all those who of new came into knowledge of-it."
        ormsby: "By these words of his the travellers were able to satisfy themselves of Don Quixote's being out of his senses and of the form of madness that overmastered him, at which they felt the same astonishment that all felt on first becoming acquainted with it;"
        vocab:
          - {w: "razones", d: "words, speech, arguments (not 'reasons' here)"}
          - {w: "acabar de enterarse", d: "to be finally satisfied, fully make sure"}
          - {w: "falto de juicio", d: "out of his senses, lacking judgment"}
          - {w: "señorear", d: "to lord it over, master, hold sway over"}
          - {w: "admiración", d: "astonishment, wonder (false friend: not 'admiration')"}
          - {w: "de nuevo", d: "here 'newly, for the first time', not 'again'"}
          - {w: "venir en conocimiento de", d: "to come to know, become acquainted with"}
          - {w: "della", d: "= de ella, of it (the madness)"}
        diagram:
          - s: "acabaron de enterarse"
            r: "main verb 1: they finished satisfying themselves"
            under:
              - {s: "Por estas razones que dijo", r: "why: by these words of his"}
              - {s: "los caminantes", r: "subject: the travelers"}
              - {s: "que era don Quijote falto de juicio", r: "what they learned, 1: that Don Quijote was out of his senses"}
              - s: "y del género de locura"
                r: "what they learned, 2: and of the kind of madness"
                under:
                  - {s: "que lo señoreaba", r: "describes 'locura': that ruled him"}
          - s: "recibieron la mesma admiración"
            r: "main verb 2: they felt the same astonishment"
            under:
              - {s: "de lo cual", r: "at what: at which"}
              - s: "que recibían todos aquellos"
                r: "describes 'admiración': that all those felt"
                under:
                  - {s: "que de nuevo venían en conocimiento della", r: "describes 'aquellos': who first came to know of it"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "acabaron de enterarse", f: "acab- + -aron → acabar (to finish; 'acabar de' + infinitive = to finish doing), preterite, they, + enterarse (to find out) with 'se' hung on the infinitive. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "era", f: "ser (to be), imperfect, he. ser's imperfect is irregular: era, eras, era, éramos, erais, eran."}
          - {w: "falto", f: "falt- + -o → falto (lacking), masculine for Don Quijote; 'falto de' = short of."}
          - {w: "lo señoreaba", f: "señore- + -aba → señorear (to rule over), imperfect, it (la locura), with 'lo' (him). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "recibieron", f: "recib- + -ieron → recibir (to receive), preterite, they. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "mesma", f: "= misma (same), feminine to match 'admiración'."}
          - {w: "recibían, venían", f: "recib- + -ían → recibir and ven- + -ían → venir (to come), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "della", f: "de + ella (of it, the locura)."}
      - es: "Y Vivaldo, que era persona muy discreta y de alegre condición, por pasar sin pesadumbre el poco camino que decían que les faltaba, al llegar a la sierra del entierro, quiso darle ocasión a que pasase más adelante con sus disparates. Y así, le dijo:"
        literal: "And Vivaldo, who was person very discreet and of cheerful condition, for passing without heaviness the little road that they-said that to-them was-lacking, on arriving at the mountain of-the burial, wanted to-give-him occasion to that he-should-pass more forward with his absurdities. And so, to-him he-said:"
        ormsby: "and Vivaldo, who was a person of great shrewdness and of a lively temperament, in order to beguile the short journey which they said was required to reach the mountain, the scene of the burial, sought to give him an opportunity of going on with his absurdities. So he said to him,"
        vocab:
          - {w: "discreto", d: "shrewd, intelligent, witty (false friend: not 'discreet')"}
          - {w: "condición", d: "temperament, disposition"}
          - {w: "pesadumbre", d: "heaviness, tedium; also sorrow"}
          - {w: "faltar", d: "to remain, be still to go: 'el camino que les faltaba' = the road they still had before them"}
          - {w: "sierra", d: "mountain range, hills"}
          - {w: "dar ocasión a que", d: "to give an opening for, make it possible that"}
          - {w: "pasar adelante con", d: "to go on with, continue"}
          - {w: "disparate", d: "absurdity, piece of nonsense"}
