part: 1
chapter: 13
title_es: "Capítulo XIII. Donde se da fin al cuento de la pastora Marcela, con otros sucesos"
title_en: "In which is ended the story of the shepherdess Marcela, with other incidents"
paragraphs:
  - sentences:
      - es: "Mas, apenas comenzó a descubrirse el día por los balcones del oriente, cuando los cinco de los seis cabreros se levantaron y fueron a despertar a don Quijote, y a decille si estaba todavía con propósito de ir a ver el famoso entierro de Grisóstomo, y que ellos le harían compañía."
        literal: "But, scarcely began to reveal-itself the day through the balconies of-the east, when the five of the six goatherds rose and went to wake [to] Don Quijote, and to tell-him if he-was still with purpose of going to see the famous burial of Grisóstomo, and that they him would-keep company."
        ormsby: "But hardly had day begun to show itself through the balconies of the east, when five of the six goatherds came to rouse Don Quixote and tell him that if he was still of a mind to go and see the famous burial of Chrysostom they would bear him company."
        vocab:
          - {w: "mas", d: "but (literary; no accent, unlike 'más' = more)"}
          - {w: "apenas ... cuando", d: "scarcely ... when; the 'cuando' clause carries the main event"}
          - {w: "descubrirse", d: "to show itself, be revealed; of daylight, to break"}
          - {w: "los balcones del oriente", d: "the balconies of the east: a mock-poetic dawn, the kind of phrase the romances of chivalry loved"}
          - {w: "cabrero", d: "goatherd"}
          - {w: "decille", d: "= decirle, to tell him; Cervantes often turns -rl- into -ll- when a pronoun hangs on an infinitive"}
          - {w: "estar con propósito de", d: "to intend to, be minded to"}
          - {w: "entierro", d: "burial, funeral"}
          - {w: "hacer compañía", d: "to keep company, go along with"}
        diagram:
          - s: "se levantaron"
            r: "main verb 1: they got up"
            under:
              - {s: "los cinco de los seis cabreros", r: "subject: five of the six goatherds"}
              - {s: "apenas comenzó a descubrirse el día por los balcones del oriente, cuando", r: "when: as soon as day began to break"}
          - s: "y fueron a despertar a don Quijote"
            r: "main verb 2: and went to wake Don Quijote"
            under:
              - s: "y a decille"
                r: "purpose 2: and to tell him"
                under:
                  - {s: "si estaba todavía con propósito de ir a ver el famoso entierro de Grisóstomo", r: "what they asked: whether he still meant to go to the burial"}
                  - {s: "y que ellos le harían compañía", r: "what they said: and that they would go with him"}
        forms:
          - {w: "comenzó", f: "comenz- + -ó → comenzar (to begin), preterite, it (the day). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "descubrirse", f: "infinitive of descubrir (to reveal) + se (itself), after 'comenzó a': 'began to show itself'."}
          - {w: "se levantaron", f: "levant- + -aron → levantarse (to get up), preterite, they, with 'se' (themselves). Same -ar preterite."}
          - {w: "fueron", f: "ir (to go), preterite, they. ir borrows ser's preterite: fui, fuiste, fue, fuimos, fuisteis, fueron. 'fueron a despertar' = went to wake."}
          - {w: "decille", f: "decir (to tell) + le (to him): the r of the infinitive turns into l before the pronoun; modern 'decirle'."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "harían", f: "har- + -ían → hacer (to do, make), conditional, they: 'would keep (him company)'. The conditional uses the future stem (here the irregular har-) with -ía, -ías, -ía, -íamos, -íais, -ían."}
      - es: "Don Quijote, que otra cosa no deseaba, se levantó y mandó a Sancho que ensillase y enalbardase al momento, lo cual él hizo con mucha diligencia, y con la mesma se pusieron luego todos en camino."
        literal: "Don Quijote, who other thing not desired, rose and ordered [to] Sancho that he-should-saddle and should-put-the-packsaddle-on at-the moment, which he did with much speed, and with the same they-put-themselves then all on road."
        ormsby: "Don Quixote, who desired nothing better, rose and ordered Sancho to saddle and pannel at once, which he did with all despatch, and with the same they all set out forthwith."
        vocab:
          - {w: "otra cosa no deseaba", d: "wanted nothing else, nothing better"}
          - {w: "ensillar", d: "to saddle (Rocinante gets the saddle)"}
          - {w: "enalbardar", d: "to put the packsaddle ('albarda') on (the donkey)"}
          - {w: "al momento", d: "at once"}
          - {w: "diligencia", d: "speed, promptness (not modern 'diligence' = carefulness)"}
          - {w: "con la mesma", d: "with the same (speed); 'mesma' = misma"}
          - {w: "luego", d: "at once, straight away; in old Spanish 'luego' means immediately, not 'later'"}
          - {w: "ponerse en camino", d: "to set out, take the road"}
        diagram:
          - s: "se levantó"
            r: "main verb 1: he got up"
            under:
              - s: "Don Quijote"
                r: "subject"
                under:
                  - {s: "que otra cosa no deseaba", r: "describes Don Quijote: who wanted nothing else"}
          - s: "y mandó a Sancho"
            r: "main verb 2: and ordered Sancho"
            under:
              - {s: "que ensillase y enalbardase al momento", r: "what he ordered: to saddle and pannel at once"}
              - {s: "lo cual él hizo con mucha diligencia", r: "comment: which Sancho did very quickly"}
          - s: "se pusieron luego todos en camino"
            r: "main verb 3 (after 'y'): they all set out at once"
            under:
              - {s: "con la mesma", r: "how: with the same speed"}
        forms:
          - {w: "deseaba", f: "dese- + -aba → desear (to desire), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "se levantó", f: "levant- + -ó → levantarse (to get up), preterite, he, with 'se' (himself). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "mandó", f: "mand- + -ó → mandar (to order), preterite, he. Same -ar preterite."}
          - {w: "ensillase y enalbardase", f: "ensill- + -ase → ensillar (to saddle) and enalbard- + -ase → enalbardar (to put the packsaddle on), imperfect subjunctive (-se form), he. Subjunctive because it is what was ordered ('mandó que'); imperfect because the ordering is past. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "hizo", f: "hic- + -o → hacer (to do), preterite, he. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron (c becomes z before o)."}
          - {w: "la mesma", f: "= la misma (the same), feminine because it stands for 'la mesma diligencia'."}
          - {w: "se pusieron", f: "pus- + -ieron → ponerse (to put oneself), preterite, they, with 'se'. Irregular stem: puse, pusiste, puso, pusimos, pusisteis, pusieron. 'ponerse en camino' = to set out."}
          - {w: "todos", f: "tod- + -os → todo (all), masculine plural: 'all of them', the subject placed after the verb."}
      - es: "Y no hubieron andado un cuarto de legua, cuando, al cruzar de una senda, vieron venir hacia ellos hasta seis pastores, vestidos con pellicos negros y coronadas las cabezas con guirnaldas de ciprés y de amarga adelfa."
        literal: "And not they-had walked a quarter of league, when, at-the crossing of a path, they-saw come toward them up-to six shepherds, dressed with sheepskin-jackets black and crowned the heads with garlands of cypress and of bitter oleander."
        ormsby: "They had not gone a quarter of a league when at the meeting of two paths they saw coming towards them some six shepherds dressed in black sheepskins and with their heads crowned with garlands of cypress and bitter oleander."
        vocab:
          - {w: "no hubieron andado ... cuando", d: "they had hardly gone ... when"}
          - {w: "legua", d: "league, about 5.5 km, roughly an hour's walk"}
          - {w: "al cruzar de una senda", d: "where a path crossed theirs; 'senda' = path, track"}
          - {w: "hasta", d: "here 'about, as many as' (hasta seis = some six), not 'until'"}
          - {w: "pastor", d: "shepherd (the goatherds are 'cabreros'; these are shepherds proper)"}
          - {w: "pellico", d: "shepherd's jacket of sheepskin with the fleece on"}
          - {w: "coronado", d: "crowned, wreathed"}
          - {w: "guirnalda", d: "garland, wreath"}
          - {w: "ciprés", d: "cypress, the tree of mourning and cemeteries"}
          - {w: "amarga adelfa", d: "bitter oleander, a poisonous shrub with bitter leaves; emblem of bitterness and unhappy love"}
        diagram:
          - s: "vieron venir hacia ellos hasta seis pastores"
            r: "main verb: they saw some six shepherds coming toward them"
            under:
              - {s: "Y no hubieron andado un cuarto de legua, cuando", r: "when: before they had gone a quarter of a league"}
              - {s: "al cruzar de una senda", r: "where: where a path crossed"}
              - {s: "vestidos con pellicos negros", r: "describes 'pastores': dressed in black sheepskin jackets"}
              - {s: "y coronadas las cabezas con guirnaldas de ciprés y de amarga adelfa", r: "describes 'pastores' 2: their heads wreathed with cypress and oleander"}
        forms:
          - {w: "hubieron andado", f: "hub- + -ieron → haber (to have), preterite, they (hube, hubiste, hubo, hubimos, hubisteis, hubieron), + andado, the participle of andar (to walk): the preterite anterior 'had walked', used after 'apenas', 'no ... cuando' for an action barely finished. Modern Spanish says 'habían andado'."}
          - {w: "al cruzar", f: "a + el + the infinitive of cruzar (to cross), used as a noun: 'at the crossing'."}
          - {w: "vieron", f: "v- + -ieron → ver (to see), preterite, they. vi, viste, vio, vimos, visteis, vieron."}
          - {w: "venir", f: "infinitive of venir (to come) after a verb of seeing: 'saw come' = saw coming."}
          - {w: "vestidos", f: "participle of vestir (to dress), masculine plural to match 'pastores'."}
          - {w: "coronadas", f: "participle of coronar (to crown), feminine plural to match 'cabezas': an absolute phrase, 'their heads crowned'."}
          - {w: "amarga", f: "amarg- + -a → amargo (bitter), feminine to match 'adelfa', placed before the noun for effect."}
      - es: "Traía cada uno un grueso bastón de acebo en la mano."
        literal: "Carried each one a thick staff of holly in the hand."
        ormsby: "Each of them carried a stout holly staff in his hand,"
        vocab:
          - {w: "traer", d: "here to carry, bear (not 'bring')"}
          - {w: "grueso", d: "thick, stout"}
          - {w: "bastón", d: "staff, walking stick"}
          - {w: "acebo", d: "holly"}
          - {w: "en la mano", d: "in his hand: Spanish uses the article where English uses the possessive"}
        diagram:
          - s: "Traía"
            r: "main verb: carried"
            under:
              - {s: "cada uno", r: "subject: each one"}
              - {s: "un grueso bastón de acebo", r: "object: a stout holly staff"}
              - {s: "en la mano", r: "where: in his hand"}
        forms:
          - {w: "Traía", f: "tra- + -ía → traer (to carry), imperfect, he (each one). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían. The verb opens the sentence and the subject follows."}
          - {w: "cada uno", f: "cada (each) never changes; 'uno' = one, standing for each shepherd."}
          - {w: "grueso", f: "grues- + -o → grueso (thick), masculine to match 'bastón', placed before the noun."}
      - es: "Venían con ellos, asimesmo, dos gentiles hombres de a caballo, muy bien aderezados de camino, con otros tres mozos de a pie que los acompañaban."
        literal: "Came with them, likewise, two gentle men of on horse, very well fitted-out of road, with other three lads of on foot who them accompanied."
        ormsby: "and along with them there came two men of quality on horseback in handsome travelling dress, with three servants on foot accompanying them."
        vocab:
          - {w: "asimesmo", d: "= asimismo, likewise, also"}
          - {w: "gentil hombre", d: "gentleman, man of quality; 'gentil' = well-born, noble"}
          - {w: "de a caballo", d: "on horseback, mounted"}
          - {w: "aderezado de camino", d: "fitted out for the road, in travelling dress"}
          - {w: "mozo", d: "lad, young man; here a servant"}
          - {w: "de a pie", d: "on foot"}
        diagram:
          - s: "Venían"
            r: "main verb: came"
            under:
              - {s: "con ellos, asimesmo", r: "with whom: along with them, too"}
              - s: "dos gentiles hombres de a caballo"
                r: "subject: two gentlemen on horseback"
                under:
                  - {s: "muy bien aderezados de camino", r: "describes them: in fine travelling dress"}
              - s: "con otros tres mozos de a pie"
                r: "with whom: with three servants on foot"
                under:
                  - {s: "que los acompañaban", r: "describes 'mozos': who accompanied them"}
        forms:
          - {w: "Venían", f: "ven- + -ían → venir (to come), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "gentiles", f: "gentil + -es, plural to match 'hombres'."}
          - {w: "aderezados", f: "participle of aderezar (to fit out), masculine plural to match 'hombres'."}
          - {w: "los acompañaban", f: "acompañ- + -aban → acompañar (to accompany), imperfect, they, with 'los' (them, the gentlemen). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
      - es: "En llegándose a juntar, se saludaron cortésmente, y, preguntándose los unos a los otros dónde iban, supieron que todos se encaminaban al lugar del entierro; y así, comenzaron a caminar todos juntos."
        literal: "On drawing-near to join, they-greeted-each-other courteously, and, asking-each-other the ones to the others where they-were-going, they-learned that all were-heading to-the place of-the burial; and so, they-began to walk all together."
        ormsby: "Courteous salutations were exchanged on meeting, and inquiring one of the other which way each party was going, they learned that all were bound for the scene of the burial, so they went on all together."
        vocab:
          - {w: "en + gerund", d: "'en llegándose' = on arriving, as soon as they came up; an old way of saying 'as soon as'"}
          - {w: "llegarse", d: "to come up, draw near"}
          - {w: "juntarse", d: "to join, meet up"}
          - {w: "cortésmente", d: "courteously"}
          - {w: "los unos a los otros", d: "one another, each other"}
          - {w: "encaminarse a", d: "to head for, make for"}
          - {w: "y así", d: "and so"}
        diagram:
          - s: "se saludaron"
            r: "main verb 1: they greeted one another"
            under:
              - {s: "En llegándose a juntar", r: "when: as they came together"}
              - {s: "cortésmente", r: "how: courteously"}
          - s: "supieron"
            r: "main verb 2 (after 'y'): they learned"
            under:
              - {s: "preguntándose los unos a los otros dónde iban", r: "how: by asking one another where they were going"}
              - {s: "que todos se encaminaban al lugar del entierro", r: "what they learned: that all were bound for the burial place"}
          - s: "comenzaron a caminar todos juntos"
            r: "main verb 3 (after 'y así'): they all began to walk together"
        forms:
          - {w: "llegándose", f: "llegando, the gerund of llegarse (to draw near), + se, with an accent added. 'En' + gerund = 'on doing, as soon as'."}
          - {w: "se saludaron", f: "salud- + -aron → saludarse (to greet each other), preterite, they, with reciprocal 'se' (each other). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "cortésmente", f: "cortés (courteous) + -mente = courteously; adverbs in -mente keep the adjective's own accent."}
          - {w: "preguntándose", f: "preguntando, the gerund of preguntar (to ask), + se (each other), accent added."}
          - {w: "iban", f: "ir (to go), imperfect, they. Irregular: iba, ibas, iba, íbamos, ibais, iban."}
          - {w: "supieron", f: "sup- + -ieron → saber (to know), preterite, they: 'they found out' (the preterite of saber means to learn). Irregular: supe, supiste, supo, supimos, supisteis, supieron."}
          - {w: "se encaminaban", f: "encamin- + -aban → encaminarse (to head for), imperfect, they, with 'se'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "comenzaron", f: "comenz- + -aron → comenzar (to begin), preterite, they. Same -ar preterite."}
          - {w: "juntos", f: "junt- + -os → junto (together), masculine plural to match 'todos'."}
  - sentences:
      - es: "Uno de los de a caballo, hablando con su compañero, le dijo:"
        literal: "One of those of on horse, speaking with his companion, to-him said:"
        ormsby: "One of those on horseback addressing his companion said to him,"
        vocab:
          - {w: "los de a caballo", d: "those on horseback, the riders"}
          - {w: "compañero", d: "companion, fellow traveler"}
        diagram:
          - s: "le dijo:"
            r: "main verb: said to him"
            under:
              - {s: "Uno de los de a caballo", r: "subject: one of the riders"}
              - {s: "hablando con su compañero", r: "how: speaking to his companion"}
        forms:
          - {w: "hablando", f: "gerund of hablar (to speak): 'speaking', telling how he said it."}
          - {w: "le dijo", f: "dij- + -o → decir (to say), preterite, he, with 'le' (to him). Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Paréceme, señor Vivaldo, que habemos de dar por bien empleada la tardanza que hiciéremos en ver este famoso entierro, que no podrá dejar de ser famoso, según estos pastores nos han contado estrañezas, ansí del muerto pastor como de la pastora homicida."
        literal: "— It-seems-to-me, Señor Vivaldo, that we-have to give for well spent the delay that we-may-make in seeing this famous burial, which not will-be-able to-fail of being famous, according-as these shepherds to-us have told strangenesses, both of-the dead shepherd as of the shepherdess homicide."
        ormsby: "“It seems to me, Señor Vivaldo, that we may reckon as well spent the delay we shall incur in seeing this remarkable funeral, for remarkable it cannot but be judging by the strange things these shepherds have told us, of both the dead shepherd and homicide shepherdess.”"
        vocab:
          - {w: "parecerle a uno", d: "to seem to one; 'paréceme' = it seems to me, I think"}
          - {w: "habemos de", d: "= hemos de, we must, we are to; 'habemos' is the old form of 'hemos'"}
          - {w: "dar por bien empleado", d: "to count as well spent, think worthwhile"}
          - {w: "tardanza", d: "delay"}
          - {w: "no poder dejar de ser", d: "cannot fail to be, must be"}
          - {w: "según", d: "judging by, according to what"}
          - {w: "estrañeza", d: "= extrañeza, strange thing, oddity"}
          - {w: "ansí ... como", d: "= así ... como, both ... and"}
          - {w: "homicida", d: "murderous, killer (as an adjective); Marcela is blamed for Grisóstomo's death"}
        diagram:
          - s: "Paréceme, señor Vivaldo,"
            r: "main verb: it seems to me"
            under:
              - s: "que habemos de dar por bien empleada la tardanza"
                r: "what seems: that we must count the delay well spent"
                under:
                  - s: "que hiciéremos en ver este famoso entierro"
                    r: "describes 'tardanza': that we may incur in seeing this famous burial"
                    under:
                      - s: "que no podrá dejar de ser famoso"
                        r: "describes 'entierro': which cannot fail to be famous"
                        under:
                          - s: "según estos pastores nos han contado estrañezas"
                            r: "why: judging by the strange things these shepherds have told us"
                            under:
                              - {s: "ansí del muerto pastor como de la pastora homicida", r: "about whom: both the dead shepherd and the killer shepherdess"}
        forms:
          - {w: "Paréceme", f: "parec- + -e + me → parecer (to seem), present, it, with 'me' (to me) stuck on the end. Cervantes hangs pronouns on the end of a verb that opens its clause; modern 'me parece'. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "habemos de", f: "old form of hemos: haber (to have), present, we. he, has, ha, habemos (modern hemos), habéis, han. 'haber de' + infinitive = must, are to."}
          - {w: "bien empleada", f: "participle of emplear (to spend, use), feminine to match 'tardanza'."}
          - {w: "hiciéremos", f: "hic- + -iéremos → hacer (to make), future subjunctive, we: 'that we may make'. Built on the preterite stem: hiciere, hicieres, hiciere, hiciéremos, hiciereis, hicieren. Used after a relative for an open future; modern Spanish says 'hagamos'."}
          - {w: "podrá", f: "podr- + -á → poder (to be able), future, it. Irregular stem podr-: podré, podrás, podrá, podremos, podréis, podrán."}
          - {w: "nos han contado", f: "han = haber, present, they (he, has, ha, hemos, habéis, han), + contado, the participle of contar (to tell): 'have told us'."}
          - {w: "muerto", f: "irregular participle of morir (to die), used as an adjective before 'pastor': the dead shepherd."}
          - {w: "homicida", f: "one form for both genders (like 'suicida'); here with the feminine 'pastora'."}
  - sentences:
      - es: "— Así me lo parece a mí —respondió Vivaldo—; y no digo yo hacer tardanza de un día, pero de cuatro la hiciera a trueco de verle."
        literal: "— So to-me it seems to me —replied Vivaldo—; and not say I to-make delay of one day, but of four it I-would-make in exchange for seeing-it."
        ormsby: "“So I think too,” replied Vivaldo, “and I would delay not to say a day, but four, for the sake of seeing it.”"
        vocab:
          - {w: "así me lo parece a mí", d: "so it seems to me too; 'a mí' doubles 'me' for emphasis"}
          - {w: "no digo yo ... pero", d: "I don't say ... but even; old 'pero' where modern Spanish uses 'sino'"}
          - {w: "hacer tardanza", d: "to delay, lose time"}
          - {w: "a trueco de", d: "in exchange for, for the sake of; 'trueco' = trueque, barter"}
        diagram:
          - s: "me lo parece"
            r: "main verb 1: it seems to me"
            under:
              - {s: "Así", r: "how: so, the same"}
              - {s: "a mí", r: "to whom, repeating 'me' for emphasis"}
          - {s: "respondió Vivaldo", r: "speech tag"}
          - s: "la hiciera"
            r: "main verb 2 (after 'y'): I would make it (the delay)"
            under:
              - {s: "no digo yo hacer tardanza de un día, pero de cuatro", r: "how long: not of one day, I say, but of four"}
              - {s: "a trueco de verle", r: "why: for the sake of seeing it"}
        forms:
          - {w: "me lo parece", f: "parec- + -e → parecer (to seem), present, it, with 'me' (to me) and 'lo' (so). The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "respondió", f: "respond- + -ió → responder (to reply), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "digo", f: "decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "la hiciera", f: "hic- + -iera → hacer (to make), imperfect subjunctive (-ra form), I, used as a conditional: 'I would make it'. 'la' = la tardanza. Built on the preterite stem: hiciera, hicieras, hiciera, hiciéramos, hicierais, hicieran. Modern Spanish says 'la haría'."}
