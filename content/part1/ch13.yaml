          - {w: "demasiada", f: "demasiad- + -a → demasiado (excessive), feminine to match 'falta'."}
      - es: "Sólo Sancho Panza pensaba que cuanto su amo decía era verdad, sabiendo él quién era y habiéndole conocido desde su nacimiento;"
        literal: "Only Sancho Panza thought that all-that his master said was truth, knowing he who he-was and having-him known since his birth;"
        ormsby: "Sancho Panza alone thought that what his master said was the truth, knowing who he was and having known him from his birth;"
        vocab:
          - {w: "cuanto", d: "all that, everything that"}
          - {w: "amo", d: "master (of a servant)"}
          - {w: "nacimiento", d: "birth"}
        diagram:
          - s: "pensaba"
            r: "main verb: thought"
            under:
              - {s: "Sólo Sancho Panza", r: "subject: only Sancho Panza"}
              - {s: "que cuanto su amo decía era verdad", r: "what he thought: that everything his master said was true"}
              - {s: "sabiendo él quién era y habiéndole conocido desde su nacimiento", r: "why: knowing who he was and having known him since birth"}
        forms:
          - {w: "pensaba", f: "pens- + -aba → pensar (to think), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "decía", f: "dec- + -ía → decir (to say), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "era", f: "ser (to be), imperfect, it / he. ser's imperfect is irregular: era, eras, era, éramos, erais, eran."}
          - {w: "sabiendo", f: "gerund of saber (to know): 'knowing', with its subject 'él' after it."}
          - {w: "habiéndole conocido", f: "habiendo, the gerund of haber, + le (him) + conocido, the participle of conocer (to know): 'having known him', accent added."}
        note: "The joke is double-edged: Sancho believes his master precisely because he knows him, a neighbor of long standing, and so cannot imagine him lying."
      - es: "y en lo que dudaba algo era en creer aquello de la linda Dulcinea del Toboso, porque nunca tal nombre ni tal princesa había llegado jamás a su noticia, aunque vivía tan cerca del Toboso."
