          - s: "quiso darle ocasión"
            r: "main verb 1: wanted to give him an opening"
            under:
              - s: "Vivaldo"
                r: "subject"
                under:
                  - {s: "que era persona muy discreta y de alegre condición", r: "describes Vivaldo: who was shrewd and cheerful"}
              - s: "por pasar sin pesadumbre el poco camino"
                r: "why: to pass the short road pleasantly"
                under:
                  - {s: "que decían que les faltaba, al llegar a la sierra del entierro", r: "describes 'camino': that they said remained before reaching the hill of the burial"}
              - {s: "a que pasase más adelante con sus disparates", r: "opening for what: to go on with his absurdities"}
          - s: "le dijo:"
            r: "main verb 2 (new sentence, after 'Y así'): he said to him"
        forms:
          - {w: "era", f: "ser (to be), imperfect, he. ser's imperfect is irregular: era, eras, era, éramos, erais, eran."}
          - {w: "discreta", f: "discret- + -a → discreto (shrewd), feminine to match 'persona', even though Vivaldo is a man."}
          - {w: "pasar", f: "infinitive of pasar (to pass) after 'por' = in order to."}
          - {w: "decían", f: "dec- + -ían → decir (to say), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "les faltaba", f: "falt- + -aba → faltar (to be lacking, remain), imperfect, it (el camino), with 'les' (to them). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "al llegar", f: "a + el + the infinitive of llegar (to arrive): 'on reaching'."}
          - {w: "quiso", f: "quis- + -o → querer (to want), preterite, he. Irregular: quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "darle", f: "dar (to give) + le (to him), the pronoun hung on the infinitive."}
          - {w: "pasase", f: "pas- + -ase → pasar (to go on), imperfect subjunctive (-se form), he. Subjunctive after 'ocasión a que' (an opening for something not yet done). The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
