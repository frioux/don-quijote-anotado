      - es: "Después se vino a entender que el haberse mudado de traje no había sido por otra cosa que por andarse por estos despoblados en pos de aquella pastora Marcela que nuestro zagal nombró denantes, de la cual se había enamorado el pobre difunto de Grisóstomo.» Y quiéroos decir agora, porque es bien que lo sepáis, quién es esta rapaza;"
