      - es: "quizá, y aun sin quizá, no habréis oído semejante cosa en todos los días de vuestra vida, aunque viváis más años que sarna."
        literal: "perhaps, and even without perhaps, not you-will-have heard [a] similar thing in all the days of your life, even-if you-live more years than itch."
        ormsby: "perhaps, and even without any perhaps, you will not have heard anything like it all the days of your life, though you should live more years than sarna.”"
        vocab:
          - {w: "quizá", d: "perhaps"}
          - {w: "semejante", d: "such, like it, similar"}
          - {w: "sarna", d: "itch, scabies; 'más viejo que la sarna' = as old as the hills"}
