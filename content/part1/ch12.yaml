            r: "main verb 1: they were amazed"
            under:
              - {s: "Cuando los del lugar vieron tan de improviso vestidos de pastores a los dos escolares", r: "when: when the villagers saw the two students so suddenly in shepherd's dress"}
          - s: "y no podían adivinar la causa"
            r: "main verb 2: and could not guess the reason"
            under:
              - {s: "que les había movido a hacer aquella tan estraña mudanza", r: "describes 'causa': that had moved them to make so strange a change"}
        forms:
          - {w: "vieron", f: "vi- + -eron → ver (to see), preterite, they. vi, viste, vio, vimos, visteis, vieron."}
          - {w: "vestidos", f: "participle of vestir (to dress), masculine plural to match 'escolares'."}
          - {w: "quedaron", f: "qued- + -aron → quedar (to be left), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "admirados", f: "participle of admirar (to amaze), masculine plural to match the villagers."}
          - {w: "podían", f: "pod- + -ían → poder (to be able), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "les había movido", f: "había, imperfect of haber, it, + movido, the participle of mover (to move), with 'les' (them): 'had moved them'. Same había, habías, había, habíamos, habíais, habían."}
          - {w: "aquella tan estraña", f: "aquella (that), feminine to match 'mudanza'; estraña is the old spelling of extraña (strange)."}
      - es: "Ya en este tiempo era muerto el padre de nuestro Grisóstomo, y él quedó heredado en mucha cantidad de hacienda, ansí en muebles como en raíces, y en no pequeña cantidad de ganado, mayor y menor, y en gran cantidad de dineros;"
