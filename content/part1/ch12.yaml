  - sentences:
      - es: "— Estéril o estil —respondió Pedro—, todo se sale allá."
        literal: "— Sterile or estil —answered Pedro—, all itself comes-out there."
        ormsby: "“Sterility or estility,” answered Pedro, “it is all the same in the end."
        vocab:
          - {w: "salirse allá", d: "'todo se sale allá' = it all comes to the same thing"}
        diagram:
          - s: "todo se sale allá"
            r: "main verb: it all comes to the same"
            under:
              - {s: "Estéril o estil", r: "topic: 'estéril' or 'estil'"}
              - {s: "respondió Pedro", r: "speech tag"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "se sale", f: "sal- + -e → salirse (to come out), present, it, with 'se'. salir in the present: salgo, sales, sale, salimos, salís, salen."}
      - es: "«Y digo que con esto que decía se hicieron su padre y sus amigos, que le daban crédito, muy ricos, porque hacían lo que él les aconsejaba, diciéndoles:"
        literal: "«And I-say that with this that he-said made-themselves his father and his friends, who to-him gave credit, very rich, because they-did that which he to-them advised, saying-to-them:"
        ormsby: "And I can tell you that by this his father and friends who believed him grew very rich because they did as he advised them, bidding them"
        vocab:
          - {w: "hacerse rico", d: "to become rich, grow rich"}
          - {w: "dar crédito a", d: "to believe, trust"}
          - {w: "aconsejar", d: "to advise"}
        diagram:
          - s: "Y digo"
            r: "main verb: and I tell you"
            under:
              - s: "que con esto que decía se hicieron su padre y sus amigos ... muy ricos"
                r: "what I say: that by what he said his father and friends grew very rich"
                under:
                  - {s: "que le daban crédito", r: "describes 'amigos': who believed him"}
                  - s: "porque hacían lo que él les aconsejaba"
                    r: "why: because they did what he advised them"
                    under:
                      - {s: "diciéndoles:", r: "how: telling them"}
        forms:
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "decía", f: "dec- + -ía → decir (to say), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "se hicieron", f: "hic- + -ieron → hacerse (to become), preterite, they. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "sus", f: "'his', plural to match 'amigos', not the owner."}
          - {w: "le daban", f: "d- + -aban → dar (to give), imperfect, they, with 'le' (to him). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "hacían", f: "hac- + -ían → hacer (to do), imperfect, they. Same -ía imperfect."}
          - {w: "les aconsejaba", f: "aconsej- + -aba → aconsejar (to advise), imperfect, he, with 'les' (them). Same -aba imperfect."}
          - {w: "diciéndoles", f: "diciendo, the gerund of decir (to tell), + les (to them), with an accent added to keep the stress on 'cien'."}
      - es: "“Sembrad este año cebada, no trigo; en éste podéis sembrar garbanzos y no cebada; el que viene será de guilla de aceite; los tres siguientes no se cogerá gota”.»"
        literal: "“Sow this year barley, not wheat; in this-one you-can sow chickpeas and not barley; the [one] that comes will-be of bumper-crop of oil; the three following not will-be-gathered [a] drop”.»"
        ormsby: "‘sow barley this year, not wheat; this year you may sow pulse and not barley; the next there will be a full oil crop, and the three following not a drop will be got.’ ”"
        vocab:
          - {w: "sembrar", d: "to sow"}
          - {w: "cebada", d: "barley"}
          - {w: "trigo", d: "wheat"}
          - {w: "garbanzos", d: "chickpeas, a staple of the Spanish stew"}
          - {w: "el que viene", d: "next year, 'the one that is coming'"}
          - {w: "guilla", d: "bumper crop, plentiful harvest; 'de guilla de aceite' = a big year for olive oil"}
          - {w: "coger", d: "to harvest, gather"}
          - {w: "no ... gota", d: "not a drop, nothing at all"}
        diagram:
          - s: "Sembrad este año cebada, no trigo"
            r: "advice 1 (a command): sow barley this year, not wheat"
          - s: "en éste podéis sembrar garbanzos y no cebada"
            r: "advice 2: in this (other) year you can sow chickpeas and not barley"
          - s: "el que viene será de guilla de aceite"
            r: "forecast 1: next year will be a bumper year for oil"
          - s: "los tres siguientes no se cogerá gota"
            r: "forecast 2: the three after it, not a drop will be harvested"
        forms:
          - {w: "Sembrad", f: "command to you all (vosotros) of sembrar (to sow): the infinitive with its final -r turned into -d."}
          - {w: "este, éste", f: "este (this), masculine to match 'año'; written 'éste' with the accent when it stands alone as a pronoun ('this one')."}
          - {w: "podéis", f: "pod- + -éis → poder (to be able), present, you all. puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "viene", f: "vien- + -e → venir (to come), present, it. vengo, vienes, viene, venimos, venís, vienen."}
          - {w: "será", f: "ser (to be), future, it. seré, serás, será, seremos, seréis, serán."}
          - {w: "siguientes", f: "siguiente (following) + -s, plural to match the understood 'años'."}
          - {w: "se cogerá", f: "coger (to harvest) + -á, future, it, with passive 'se': 'will be harvested'. The future adds to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
        ormsby_note: "'Pulse', garbanzos, or chickpeas, one of the invariable constituents of the olla or puchero, and therefore an important crop in Spain."
        note: "Gutenberg marks this advice with doubled single quotes inside Pedro's «»; it is a quotation inside a quotation. Almanacs of the time sold exactly this kind of harvest forecast, worked out from the stars."
  - sentences:
      - es: "— Esa ciencia se llama astrología —dijo don Quijote."
        literal: "— That science itself-calls astrology —said Don Quijote."
        ormsby: "“That science is called astrology,” said Don Quixote."
        vocab:
          - {w: "astrología", d: "astrology; then a respected learned art, used to forecast weather and harvests"}
        diagram:
          - s: "Esa ciencia se llama astrología"
            r: "main verb: that science is called astrology"
            under:
              - {s: "dijo don Quijote", r: "speech tag"}
        forms:
          - {w: "Esa", f: "esa (that), feminine to match 'ciencia'."}
          - {w: "se llama", f: "llam- + -a → llamarse (to be called), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
        note: "The Church condemned 'judicial' astrology, which claimed to foretell people's fates, but allowed 'natural' astrology, which forecast weather, harvests and the right times for medicine; Grisóstomo's forecasts are of the permitted kind."
  - sentences:
      - es: "— No sé yo cómo se llama —replicó Pedro—, mas sé que todo esto sabía, y aún más."
        literal: "— Not know I how it-is-called —replied Pedro—, but I-know that all this he-knew, and even more."
        ormsby: "“I do not know what it is called,” replied Pedro, “but I know that he knew all this and more besides."
        vocab:
          - {w: "replicar", d: "to reply, answer back"}
          - {w: "mas", d: "but"}
          - {w: "aún más", d: "and even more, more besides"}
        diagram:
          - s: "No sé yo"
            r: "main verb 1: I don't know"
            under:
              - {s: "cómo se llama", r: "what: what it is called"}
              - {s: "replicó Pedro", r: "speech tag"}
          - s: "mas sé"
            r: "main verb 2: but I know"
            under:
              - {s: "que todo esto sabía, y aún más", r: "what: that he knew all this and more"}
        forms:
          - {w: "sé", f: "saber (to know), present, I; the accent tells it from 'se'. sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "sabía", f: "sab- + -ía → saber (to know), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
      - es: "«Finalmente, no pasaron muchos meses, después que vino de Salamanca, cuando un día remaneció vestido de pastor, con su cayado y pellico, habiéndose quitado los hábitos largos que como escolar traía;"
        literal: "«Finally, not passed many months, after that he-came from Salamanca, when one day he-turned-up dressed as shepherd, with his crook and sheepskin-jacket, having-himself taken-off the gowns long that as student he-wore;"
        ormsby: "But, to make an end, not many months had passed after he returned from Salamanca, when one day he appeared dressed as a shepherd with his crook and sheepskin, having put off the long gown he wore as a scholar;"
        vocab:
          - {w: "finalmente", d: "in short, to make an end"}
          - {w: "después que", d: "after (modern 'después de que')"}
          - {w: "remanecer", d: "to turn up suddenly, reappear unexpectedly"}
          - {w: "cayado", d: "shepherd's crook"}
          - {w: "pellico", d: "shepherd's sheepskin jacket"}
          - {w: "quitarse", d: "to take off (clothes)"}
          - {w: "hábitos largos", d: "the long gown that university students wore"}
          - {w: "escolar", d: "student, scholar"}
          - {w: "traer", d: "here 'to wear'"}
        diagram:
          - s: "no pasaron muchos meses"
            r: "main verb: not many months passed"
            under:
              - {s: "Finalmente", r: "in short"}
              - {s: "después que vino de Salamanca", r: "when: after he came from Salamanca"}
              - s: "cuando un día remaneció vestido de pastor"
                r: "when what happened: when one day he turned up dressed as a shepherd"
                under:
                  - {s: "con su cayado y pellico", r: "with what: with his crook and sheepskin jacket"}
                  - s: "habiéndose quitado los hábitos largos"
                    r: "having taken off the long gown"
                    under:
                      - {s: "que como escolar traía", r: "describes 'hábitos': that he wore as a student"}
        forms:
          - {w: "pasaron", f: "pas- + -aron → pasar (to pass), preterite, they (the months). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "muchos", f: "much- + -os → mucho (many), masculine plural to match 'meses'."}
          - {w: "vino", f: "vin- + -o → venir (to come), preterite, he. Irregular: vine, viniste, vino, vinimos, vinisteis, vinieron."}
          - {w: "remaneció", f: "remanec- + -ió → remanecer (to turn up), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "vestido", f: "participle of vestir (to dress), masculine to match 'he': 'dressed'."}
          - {w: "habiéndose quitado", f: "habiendo, the gerund of haber, + se (himself) + quitado, the participle of quitar (to take off): 'having taken off'. The accent keeps the stress on 'bien'."}
          - {w: "largos", f: "larg- + -os → largo (long; false friend, not 'large'), masculine plural to match 'hábitos'."}
          - {w: "traía", f: "tra- + -ía → traer (to wear), imperfect, he. traía, traías, traía, traíamos, traíais, traían."}
      - es: "y juntamente se vistió con él de pastor otro su grande amigo, llamado Ambrosio, que había sido su compañero en los estudios."
        literal: "and jointly dressed-himself with him as shepherd another his great friend, called Ambrosio, who had been his companion in the studies."
        ormsby: "and at the same time his great friend, Ambrosio by name, who had been his companion in his studies, took to the shepherd’s dress with him."
        vocab:
          - {w: "juntamente", d: "together, at the same time"}
          - {w: "otro su grande amigo", d: "another, a great friend of his; old Spanish could stack 'otro' and a possessive"}
        diagram:
          - s: "y juntamente se vistió con él de pastor"
            r: "main verb: and at the same time dressed as a shepherd with him"
            under:
              - s: "otro su grande amigo, llamado Ambrosio"
                r: "subject: another, his great friend, named Ambrosio"
                under:
                  - {s: "que había sido su compañero en los estudios", r: "describes 'Ambrosio': who had studied with him"}
        forms:
          - {w: "se vistió", f: "vist- + -ió → vestirse (to dress), preterite, he, with 'se' (himself). The stem e becomes i in this form: me vestí, te vestiste, se vistió, nos vestimos, os vestisteis, se vistieron."}
          - {w: "grande", f: "full form of gran; here it is not clipped before 'amigo', an older usage."}
          - {w: "llamado", f: "participle of llamar (to call), masculine to match 'amigo'."}
          - {w: "había sido", f: "había, imperfect of haber, he, + sido, the participle of ser: 'had been'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
      - es: "Olvidábaseme de decir como Grisóstomo, el difunto, fue grande hombre de componer coplas; tanto, que él hacía los villancicos para la noche del Nacimiento del Señor, y los autos para el día de Dios, que los representaban los mozos de nuestro pueblo, y todos decían que eran por el cabo."
        literal: "Was-forgetting-itself-to-me of to-say how Grisóstomo, the deceased, was great man of composing verses; so-much, that he made the carols for the night of-the Birth of-the Lord, and the plays for the day of God, which them performed the lads of our town, and all said that they-were by the end."
        ormsby: "I forgot to say that Chrysostom, who is dead, was a great man for writing verses, so much so that he made carols for Christmas Eve, and plays for Corpus Christi, which the young men of our village acted, and all said they were excellent."
        vocab:
          - {w: "olvidársele a uno", d: "to slip one's mind; 'olvidábaseme' = it was slipping my mind, I forgot"}
          - {w: "como", d: "here 'that' (= que), after a verb of saying"}
          - {w: "difunto", d: "deceased, the late"}
          - {w: "grande hombre de", d: "a great one for, very good at"}
          - {w: "copla", d: "verse, popular song or poem"}
          - {w: "villancico", d: "Christmas carol; originally any rustic song"}
          - {w: "la noche del Nacimiento del Señor", d: "Christmas Eve, the night of the Lord's birth"}
          - {w: "auto", d: "short religious play, especially the 'auto sacramental' for Corpus Christi"}
          - {w: "el día de Dios", d: "Corpus Christi, the feast of the Eucharist, celebrated with processions and plays"}
          - {w: "representar", d: "to perform, act (a play)"}
          - {w: "por el cabo", d: "first-rate, excellent; literally 'by the end', to the utmost"}
        diagram:
          - s: "Olvidábaseme de decir"
            r: "main verb: I forgot to say"
            under:
              - s: "como Grisóstomo, el difunto, fue grande hombre de componer coplas"
                r: "what I forgot: that Grisóstomo, now dead, was a great one for making verses"
                under:
                  - s: "tanto, que él hacía los villancicos para la noche del Nacimiento del Señor, y los autos para el día de Dios"
                    r: "result: so much that he wrote the Christmas carols and the Corpus Christi plays"
                    under:
                      - {s: "que los representaban los mozos de nuestro pueblo", r: "describes 'autos': which the village lads performed"}
                      - {s: "y todos decían que eran por el cabo", r: "and everyone said they were first-rate"}
        forms:
          - {w: "Olvidábaseme", f: "olvid- + -aba + se + me → olvidarse (to be forgotten), imperfect, it, with 'se' and 'me' (to me) stuck on the end: 'it was slipping my mind'. Cervantes hangs pronouns on a verb that opens its clause; modern 'se me olvidaba'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, he. fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "grande", f: "full form, not clipped to 'gran' before 'hombre', an older usage."}
          - {w: "componer", f: "infinitive (to compose) after 'de'."}
          - {w: "hacía", f: "hac- + -ía → hacer (to make), imperfect, he: 'used to write'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "del", f: "de + el: 'of the'."}
          - {w: "los representaban", f: "represent- + -aban → representar (to perform), imperfect, they, with 'los' (them) repeating 'que': 'which the lads performed'. Same -aba imperfect: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "decían", f: "dec- + -ían → decir (to say), imperfect, they. Same -ía imperfect."}
          - {w: "eran", f: "ser (to be), imperfect, they. era, eras, era, éramos, erais, eran."}
        ormsby_note: "'Plays', autos, religious allegorical dramas."
      - es: "Cuando los del lugar vieron tan de improviso vestidos de pastores a los dos escolares, quedaron admirados, y no podían adivinar la causa que les había movido a hacer aquella tan estraña mudanza."
