  - sentences:
      - es: "— Perdonad, amigo —dijo don Quijote—; que por haber tanta diferencia de sarna a Sarra os lo dije; pero vos respondistes muy bien, porque vive más sarna que Sarra; y proseguid vuestra historia, que no os replicaré más en nada."
        literal: "— Pardon, friend —said Don Quijote—; for because-of there-being so-much difference from itch to Sarra to-you it I-said; but you answered very well, because lives more itch than Sarra; and continue your story, for not to-you I-will-reply more in anything."
        ormsby: "“Pardon me, friend,” said Don Quixote; “but, as there is such a difference between sarna and Sarra, I told you of it; however, you have answered very rightly, for sarna lives longer than Sarra: so continue your story, and I will not object any more to anything.”"
