        ormsby: "“I say then, my dear sir,” said the goatherd, “that in our village there was a farmer even richer than the father of Chrysostom, who was named Guillermo, and upon whom God bestowed, over and above great wealth, a daughter at whose birth her mother died, the most respected woman there was in this neighbourhood;"
