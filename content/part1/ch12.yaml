              - {s: "y en no pequeña cantidad de ganado, mayor y menor", r: "to what, 2: to no small number of livestock, large and small"}
              - {s: "y en gran cantidad de dineros", r: "to what, 3: to a lot of money"}
        forms:
          - {w: "era muerto", f: "era, imperfect of ser, + muerto, the participle of morir (to die): 'had died, was dead'. ser in the imperfect: era, eras, era, éramos, erais, eran."}
          - {w: "nuestro", f: "'our', masculine to match 'Grisóstomo': friendly, 'our Grisóstomo'."}
          - {w: "quedó heredado", f: "qued- + -ó → quedar (to be left), preterite, he, + heredado, the participle of heredar (to inherit): 'was left heir'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "mucha", f: "much- + -a → mucho, feminine to match 'cantidad'."}
          - {w: "ansí", f: "old form of así."}
          - {w: "pequeña", f: "pequeñ- + -a → pequeño (small), feminine to match 'cantidad'."}
          - {w: "gran", f: "grande clipped before a singular noun ('cantidad')."}
      - es: "de todo lo cual quedó el mozo señor desoluto, y en verdad que todo lo merecía, que era muy buen compañero y caritativo y amigo de los buenos, y tenía una cara como una bendición."
        literal: "of all the which remained the youth lord desolute, and in truth that all it he-deserved, for he-was very good companion and charitable and friend of the good, and he-had a face like a blessing."
        ormsby: "of all of which the young man was left dissolute owner, and indeed he was deserving of it all, for he was a very good comrade, and kindhearted, and a friend of worthy folk, and had a countenance like a benediction."
        vocab:
          - {w: "señor", d: "here 'owner, master'"}
          - {w: "desoluto", d: "Pedro's blunder for 'absoluto' (outright, sole); it sounds like 'disoluto', dissolute"}
          - {w: "en verdad que", d: "truly, indeed"}
          - {w: "caritativo", d: "charitable, kind to the poor"}
          - {w: "los buenos", d: "good people, decent folk"}
          - {w: "como una bendición", d: "'like a blessing': lovely, a joy to look at"}
