summary: |
  While Don Quijote and Sancho are still with the goatherds, a lad who brings them provisions from the village arrives with news: Grisóstomo, a rich young gentleman who studied at Salamanca and then took to dressing as a shepherd, has died that morning, it is said for love of Marcela, a rich girl who roams the hills as a shepherdess. He has left orders to be buried out in the fields, at the foot of the rock by the Cork-oak Spring where he first saw her, and the village clergy object, but his friend Ambrosio insists that every wish be carried out. The burial will be the next day, and all the goatherds but one, who has a splinter in his foot, plan to go.

  Don Quijote asks the goatherd Pedro to tell him more. Pedro explains that Grisóstomo was learned in the stars and forecast eclipses and harvests, wrote carols and Corpus Christi plays, and inherited a fortune, and that he and his friend Ambrosio turned shepherd to follow Marcela. Pedro keeps mangling learned words (cris for eclipse, estil for estéril, sarna for Sarra) and Don Quijote keeps correcting him, until Pedro protests and the knight promises to stop.

  Pedro then tells Marcela's story. Her mother died giving birth to her and her father soon after, leaving her rich and in the care of her uncle, a good priest who refused to marry her off against her will. Suitors came from far around, but she always said she was too young to marry. Then she suddenly turned shepherdess and took to the hills with her flock. Many young men followed her in shepherd's dress; she treats them all kindly but, as soon as any of them declares his love, even with marriage in mind, she sends him packing. The hills ring with their laments, and the beech trees are carved with her name. Pedro urges Don Quijote to attend the burial.

  Don Quijote promises to go and thanks Pedro for the tale. The goatherd advises him to sleep under cover for the sake of his wounded ear. Sancho, tired of all the talk, gets his master into Pedro's hut, where Don Quijote spends the night thinking of Dulcinea, like Marcela's lovers, while Sancho sleeps soundly between Rocinante and the donkey.
context: |
  Village life. The goatherds' world is a real one: provisions brought out from the village by a lad, flocks minded in turns, gossip passed from mouth to mouth in 'corrillos', and a parish priest whose reputation depends on what the neighbors say. Wealth is counted the old way, in movable goods, land, large and small livestock and cash. A rich orphan girl was placed with a guardian who managed her property until she married, which is why Pedro praises the uncle for not delaying her marriage for profit. Respectable girls were kept secluded at home, so Marcela's choice to go out to the hills alone is shocking even though, as Pedro insists, her conduct is blameless.

  The pastoral romance. With Grisóstomo and Marcela the book turns from the romances of chivalry to the other fashionable fiction of the age, the pastoral novel: Montemayor's Diana (1559), its sequels, and Cervantes' own Galatea (1585). In those books educated young men and women dress as shepherds, carve names on beech trees, sing laments and die of love. Cervantes brings that literary world into a real Castilian landscape, where it is reported by a real goatherd who cannot pronounce 'eclipse'. Marcela, the beautiful, free, unattainable shepherdess, is the type of the pastoral heroine.

  Pedro as narrator. The chapter is almost entirely Pedro's monologue, and Cervantes plays with it. Pedro blunders over learned words (cris, estil, desoluto, sarna for Sarra), Don Quijote corrects him, and Pedro answers back that it all comes to the same. Yet, as Ormsby notes, Cervantes ends up putting fine, long-winded rhetoric into Pedro's mouth (the balanced 'here one sighs, there another laments' passage), and Ormsby also defends Sancho's impatience with the 'epidemic of verbosity' around Grisóstomo's corpse, which he blames on the literary fashion of the day. Pedro's « » quotations and his slips between the past and the vivid present are those of real oral storytelling.

  Religion and science. Burial outside consecrated ground, 'como si fuera moro', and other unspecified wishes that 'look pagan' alarm the village clergy, since a Christian was buried in or beside the church. Grisóstomo's knowledge of 'the science of the stars' is natural astrology, then a respectable branch of learning that forecast eclipses, weather and harvests, as almanacs did; the Church condemned only judicial astrology, which claimed to read people's fates. The Christmas 'villancicos' and the 'autos' for Corpus Christi (Ormsby: religious allegorical dramas) were standard parish entertainments, often written by local clerics or students. The night air ('el sereno') was believed to inflame wounds.

  Names. Grisóstomo is the Spanish form of Chrysostom, 'golden-mouthed', the name of the great Greek preacher, apt for a student-poet. Marcela, Guillermo 'el rico', Ambrosio and Pedro are ordinary names, with the village habit of a nickname tacked on. The 'sarna / Sarra' joke turns on the proverb 'más viejo que la sarna', older than the itch (Ormsby's note), which Don Quijote mistakes for Sarah, Abraham's long-lived wife.

  Reading Cervantes' Spanish. This chapter is the speech of a villager, so it is full of rustic and old forms: mesmo, asimesmo, ansí, agora, denantes, adevinar, sospirar, escurecerse, estender, estraño, estremado, escusa, acidente; 'del aldea' with the old masculine article before a stressed a-; contractions with 'de' (dellos, dél, déste); pronouns attached to conjugated verbs (Olvidábaseme, quiéroos, Guardábala, agradézcoos, Hízolo, hételo); old verb endings for 'vos' (respondistes, estuviésedes, veríades) and the old imperfect 'vía' for 'veía'; 'haber de' + infinitive for 'must, will' (se han de cumplir, ha de ser); the perfect with ser ('era muerto'); and two adverbs sharing one -mente ('cortés y amigablemente'). Watch for false friends: puesto que (although), honestidad (chastity), condición (temperament), opinión (reputation), diligencia (step, measure), curiosidad (interest), luego (at once), largo (long).
