        ormsby_note: "Mas viejo que sarna (Proverb 250), 'older than itch', is a very old popular phrase. Don Quixote, either not knowing it or else not recognizing it in the form in which Pedro puts it, supposes him to mean Sarah the wife of Abraham. Though Cervantes tries to observe dramatic propriety by making Pedro blunder, in the end he puts into his mouth language as fine and words as long as Don Quixote's."
