      - es: "— «Digo, pues, señor mío de mi alma —dijo el cabrero—, que en nuestra aldea hubo un labrador aún más rico que el padre de Grisóstomo, el cual se llamaba Guillermo, y al cual dio Dios, amén de las muchas y grandes riquezas, una hija, de cuyo parto murió su madre, que fue la más honrada mujer que hubo en todos estos contornos."
