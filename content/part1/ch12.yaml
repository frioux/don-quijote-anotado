  - sentences:
      - es: "— «Principalmente, decían que sabía la ciencia de las estrellas, y de lo que pasan, allá en el cielo, el sol y la luna; porque puntualmente nos decía el cris del sol y de la luna.»"
        literal: "— «Principally, they-said that he-knew the science of the stars, and of that which go-through, there in the sky, the sun and the moon; because punctually to-us he-told the cris of-the sun and of the moon.»"
        ormsby: "“Above all, they said, he was learned in the science of the stars and of what went on yonder in the heavens and the sun and the moon, for he told us of the cris of the sun and moon to exact time.”"
        vocab:
          - {w: "principalmente", d: "above all, chiefly"}
          - {w: "la ciencia de las estrellas", d: "the science of the stars: astronomy and astrology, not yet separated"}
          - {w: "pasar", d: "here 'to go through, undergo': 'lo que pasan el sol y la luna' = what the sun and moon go through"}
          - {w: "allá en el cielo", d: "up there in the sky"}
          - {w: "puntualmente", d: "exactly, to the minute"}
          - {w: "cris", d: "Pedro's garbling of 'eclipse' (then often said 'eclís')"}
        diagram:
          - s: "decían"
            r: "main verb: they said"
            under:
              - {s: "Principalmente", r: "above all"}
              - s: "que sabía la ciencia de las estrellas"
                r: "what they said: that he knew the science of the stars"
                under:
                  - {s: "y de lo que pasan, allá en el cielo, el sol y la luna", r: "and what: and of what the sun and moon go through up in the sky"}
              - s: "porque puntualmente nos decía"
                r: "why (they said so): because he told us exactly"
                under:
                  - {s: "el cris del sol y de la luna", r: "what he told: the 'cris' (eclipse) of the sun and moon"}
        forms:
          - {w: "decían", f: "dec- + -ían → decir (to say), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "sabía", f: "sab- + -ía → saber (to know), imperfect, he. Same -ía imperfect."}
          - {w: "pasan", f: "pas- + -an → pasar (to go through), present, they: plural because its subject is 'el sol y la luna', which comes after the verb. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "nos decía", f: "dec- + -ía → decir (to tell), imperfect, he, with 'nos' (us). Same -ía imperfect."}
        note: "The «» marks Pedro's own words as his story begins. His half-learned blunders (cris for eclipse, estil for estéril, sarna for Sarra) are the running joke of the chapter: Don Quijote cannot help correcting them."
