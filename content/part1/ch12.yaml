          - {w: "labrador", d: "farmer, peasant who works his own land (not a dog)"}
          - {w: "amén de", d: "besides, over and above"}
          - {w: "parto", d: "childbirth; 'de cuyo parto murió su madre' = whose mother died giving birth to her"}
