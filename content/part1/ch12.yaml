          - s: "La del Señor no me falte"
            r: "main verb: may the Lord's (grace) not fail me"
            under:
              - {s: "que es la que hace al caso", r: "why: for that is the one that matters"}
        forms:
          - {w: "falte", f: "falt- + -e → faltar (to be lacking), present subjunctive, it, for a wish: 'may it not fail me'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "hace", f: "hac- + -e → hacer (to make, do), present, it. hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "al", f: "a + el: 'to the'."}
        note: "Ormsby adds 'said Pedro', which the Spanish leaves out."
      - es: "«Y en lo demás sabréis que, aunque el tío proponía a la sobrina y le decía las calidades de cada uno en particular, de los muchos que por mujer la pedían, rogándole que se casase y escogiese a su gusto, jamás ella respondió otra cosa sino que por entonces no quería casarse, y que, por ser tan muchacha, no se sentía hábil para poder llevar la carga del matrimonio."
        literal: "«And in the rest you-will-know that, although the uncle proposed to the niece and to-her told the qualities of each one in particular, of the many who for wife her asked, begging-her that she-should-marry and choose to her taste, never she answered other thing but that for then not she-wanted to-marry, and that, for being so girl, not herself she-felt able for to-be-able to-carry the burden of-the marriage."
        ormsby: "To proceed; you must know that though the uncle put before his niece and described to her the qualities of each one in particular of the many who had asked her in marriage, begging her to marry and make a choice according to her own taste, she never gave any other answer than that she had no desire to marry just yet, and that being so young she did not think herself fit to bear the burden of matrimony."
        vocab:
          - {w: "en lo demás", d: "as for the rest, to go on"}
          - {w: "proponer", d: "to put forward, propose (a match)"}
          - {w: "calidades", d: "qualities, rank and merits"}
