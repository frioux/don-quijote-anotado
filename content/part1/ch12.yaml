          - {w: "raíces", d: "'roots': real estate, land and houses"}
          - {w: "ganado mayor y menor", d: "large stock (cattle, horses, mules) and small stock (sheep, goats)"}
          - {w: "dineros", d: "money; the plural was usual then"}
        diagram:
