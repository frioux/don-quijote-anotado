        ormsby: "“May that of the Lord not be wanting to me,” said Pedro; “that is the one to have."
        vocab:
          - {w: "la del Señor", d: "the Lord's (grace): Pedro puns on 'gracia', charm and divine grace"}
          - {w: "faltar", d: "to be lacking, fail"}
          - {w: "hacer al caso", d: "to be what matters, be to the point"}
