      - es: "Y no lo atribuyas a virtud y a poca curiosidad mía, sino a que no me deja andar el garrancho que el otro día me pasó este pie."
        literal: "And not it attribute to virtue and to little curiosity mine, but to that not me lets walk the splinter that the other day to-me pierced this foot."
        ormsby: "and don’t suppose it is virtue or want of curiosity in me; it is that the splinter that ran into my foot the other day will not let me walk.”"
        vocab:
          - {w: "atribuir", d: "to attribute, put down to"}
          - {w: "curiosidad", d: "wish to see, interest; 'poca curiosidad' = lack of interest"}
          - {w: "sino", d: "but rather (after a negative)"}
          - {w: "garrancho", d: "splinter, sharp broken stick or thorn"}
          - {w: "pasar", d: "here 'to pierce, go right through'"}
        diagram:
          - s: "Y no lo atribuyas"
            r: "main verb: and don't put it down"
            under:
              - {s: "a virtud y a poca curiosidad mía", r: "to what (not): to virtue or lack of interest on my part"}
              - s: "sino a que no me deja andar el garrancho"
                r: "to what (but): to the fact that the splinter won't let me walk"
                under:
                  - {s: "que el otro día me pasó este pie", r: "describes 'garrancho': that went through this foot of mine the other day"}
        forms:
          - {w: "atribuyas", f: "atribuy- + -as → atribuir (to attribute), present subjunctive, you (tú). A negative command uses the present subjunctive: 'no lo atribuyas' = don't put it down. -uir verbs add y: atribuya, atribuyas, atribuya, atribuyamos, atribuyáis, atribuyan."}
          - {w: "poca", f: "poc- + -a → poco (little), feminine to match 'curiosidad'."}
          - {w: "mía", f: "mío (mine), feminine to match 'curiosidad', placed after the noun: 'my lack of interest'."}
          - {w: "deja", f: "dej- + -a → dejar (to let), present, it (the splinter). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "andar", f: "infinitive (to walk) after 'deja': 'lets me walk'."}
          - {w: "me pasó", f: "pas- + -ó → pasar (to pierce), preterite, it, with 'me' (on me): 'went through my foot'. Spanish uses the pronoun, not 'my', for parts of the body. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
