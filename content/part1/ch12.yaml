              - {s: "en todos los días de vuestra vida", r: "when: in all the days of your life"}
              - {s: "aunque viváis más años que sarna", r: "concession: even if you live longer than the itch"}
        forms:
          - {w: "habréis oído", f: "habr- + -éis → haber, future, you (vos), + oído, the participle of oír (to hear): future perfect 'you will have heard'. haber in the future: habré, habrás, habrá, habremos, habréis, habrán."}
