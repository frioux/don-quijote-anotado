        ormsby: "“The sarna lives long enough,” answered Pedro; “and if, señor, you must go finding fault with words at every step, we shall not make an end of it this twelvemonth.”"
        vocab:
          - {w: "harto", d: "plenty, quite enough, a good long while"}
          - {w: "si es que", d: "if it is the case that"}
          - {w: "andar + gerund", d: "to keep on doing, go about doing"}
          - {w: "zaherir", d: "to carp at, find fault with"}
          - {w: "a cada paso", d: "at every step, at every turn"}
