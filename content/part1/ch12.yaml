part: 1
chapter: 12
title_es: "Capítulo XII. De lo que contó un cabrero a los que estaban con don Quijote"
title_en: "Of what a goatherd related to those with Don Quixote"
paragraphs:
  - sentences:
      - es: "Estando en esto, llegó otro mozo de los que les traían del aldea el bastimento, y dijo:"
        literal: "Being in this, arrived another lad of those who to-them brought from-the village the provisions, and said:"
        ormsby: "Just then another young man, one of those who fetched their provisions from the village, came up and said,"
        vocab:
          - {w: "estar en esto", d: "to be at this point; 'estando en esto' = just then, while this was going on"}
          - {w: "mozo", d: "lad, young man; also a servant or farmhand"}
          - {w: "del aldea", d: "= de la aldea, from the village; old Spanish used 'el' before a feminine noun beginning with a stressed a- (el aldea, el agua, el alma)"}
          - {w: "bastimento", d: "provisions, supplies, victuals"}
        diagram:
          - s: "llegó"
            r: "main verb 1: arrived"
            under:
              - {s: "Estando en esto", r: "when: while this was going on"}
              - s: "otro mozo"
                r: "subject: another lad"
                under:
                  - {s: "de los que les traían del aldea el bastimento", r: "describes 'mozo': one of those who brought them provisions from the village"}
          - {s: "y dijo:", r: "main verb 2: and said"}
        forms:
          - {w: "Estando", f: "gerund of estar (to be): 'being'. 'Estando en esto' is a set phrase for 'at that moment'."}
          - {w: "llegó", f: "lleg- + -ó → llegar (to arrive), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "les traían", f: "tra- + -ían → traer (to bring), imperfect, they, with 'les' (to them, the goatherds): 'used to bring them'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "del aldea", f: "de + el before 'aldea', a feminine noun starting with a stressed a-; modern Spanish says 'de la aldea'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— ¿Sabéis lo que pasa en el lugar, compañeros?"
        literal: "— Do-you-know that which happens in the village, companions?"
        ormsby: "“Do you know what is going on in the village, comrades?”"
        vocab:
          - {w: "lugar", d: "village, small town (the usual sense in this book), not 'place'"}
          - {w: "compañero", d: "companion, mate, comrade"}
        diagram:
          - s: "Sabéis"
            r: "main verb: do you (all) know"
            under:
              - {s: "lo que pasa en el lugar", r: "object: what is happening in the village"}
              - {s: "compañeros", r: "the people addressed"}
        forms:
          - {w: "Sabéis", f: "sab- + -éis → saber (to know), present, you all (vosotros): 'do you know'. saber in the present: sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "pasa", f: "pas- + -a → pasar (to happen), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
  - sentences:
      - es: "— ¿Cómo lo podemos saber? —respondió uno dellos."
        literal: "— How it can-we know? —answered one of-them."
        ormsby: "“How could we know it?” replied one of them."
        vocab:
          - {w: "dellos", d: "= de ellos, 'of them'; Cervantes fuses 'de' with él, ella, ellos, este (dél, della, dellos, deste)"}
        diagram:
          - s: "lo podemos saber"
            r: "main verb 1: can we know it"
            under:
              - {s: "Cómo", r: "how"}
          - s: "respondió"
            r: "main verb 2: answered"
            under:
              - {s: "uno dellos", r: "subject: one of them"}
        forms:
          - {w: "lo podemos saber", f: "pod- + -emos → poder (to be able), present, we, + saber (to know), with 'lo' (it) in front of the pair: 'can we know it'. poder in the present: puedo, puedes, puede, podemos, podéis, pueden; the stem o becomes ue only when stressed, so not in 'podemos'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "dellos", f: "de + ellos (of them)."}
  - sentences:
      - es: "— Pues sabed —prosiguió el mozo— que murió esta mañana aquel famoso pastor estudiante llamado Grisóstomo, y se murmura que ha muerto de amores de aquella endiablada moza de Marcela, la hija de Guillermo el rico, aquélla que se anda en hábito de pastora por esos andurriales."
        literal: "— Well know —continued the lad— that died this morning that famous shepherd student called Grisóstomo, and it-is-murmured that he-has died of loves of that devilish wench of Marcela, the daughter of Guillermo the rich, that-one who goes-about in habit of shepherdess through those out-of-the-way-places."
        ormsby: "“Well, then, you must know,” continued the young man, “this morning that famous student-shepherd called Chrysostom died, and it is rumoured that he died of love for that devil of a village girl the daughter of Guillermo the Rich, she that wanders about the wolds here in the dress of a shepherdess.”"
        vocab:
          - {w: "pues", d: "well, then; opens a reply"}
          - {w: "proseguir", d: "to continue, go on"}
          - {w: "pastor estudiante", d: "student-shepherd: a university man who has taken to dressing as a shepherd"}
          - {w: "Grisóstomo", d: "Chrysostom, 'golden-mouth', the name of a famous fourth-century preacher, St John Chrysostom; here the dead student-shepherd"}
          - {w: "murmurarse", d: "to be rumoured, whispered about"}
          - {w: "morir de amores", d: "to die of love"}
          - {w: "endiablado", d: "devilish, confounded, bedevilled"}
          - {w: "moza", d: "girl, wench, lass"}
          - {w: "esa moza de Marcela", d: "that girl Marcela; the 'de' links a noun of judgment to a name, as in 'el bueno de Sancho', 'el pobre de Grisóstomo'"}
          - {w: "el rico", d: "'the rich man', a village nickname tacked on to the name"}
          - {w: "andarse", d: "to go about, wander"}
          - {w: "hábito", d: "dress, garb, costume; also a religious habit"}
          - {w: "andurriales", d: "byways, out-of-the-way places, wilds"}
        diagram:
          - s: "sabed"
            r: "main verb: know (a command)"
            under:
              - {s: "prosiguió el mozo", r: "speech tag: the lad went on"}
              - {s: "que murió esta mañana aquel famoso pastor estudiante llamado Grisóstomo", r: "what to know, 1: that the famous student-shepherd Grisóstomo died this morning"}
              - s: "y se murmura"
                r: "what to know, 2: and it is rumoured"
                under:
                  - s: "que ha muerto de amores de aquella endiablada moza de Marcela"
                    r: "what is rumoured: that he died of love for that devilish girl Marcela"
                    under:
                      - {s: "la hija de Guillermo el rico", r: "describes 'Marcela': Guillermo the Rich's daughter"}
                      - {s: "aquélla que se anda en hábito de pastora por esos andurriales", r: "describes 'Marcela', 2: the one who roams the wilds dressed as a shepherdess"}
        forms:
          - {w: "sabed", f: "sab- + -ed → saber (to know), command to you all (vosotros): 'know'. The vosotros command is the infinitive with its final -r turned into -d: sabed, decid, mirad."}
          - {w: "prosiguió", f: "prosigu- + -ió → proseguir (to continue), preterite, he. The stem e becomes i in this form: proseguí, proseguiste, prosiguió, proseguimos, proseguisteis, prosiguieron."}
          - {w: "murió", f: "mur- + -ió → morir (to die), preterite, he. The stem o becomes u in this form: morí, moriste, murió, morimos, moristeis, murieron."}
          - {w: "llamado", f: "participle of llamar (to call), masculine to match 'pastor': 'called'."}
          - {w: "se murmura", f: "murmur- + -a → murmurar (to whisper), present, it, with 'se' making it impersonal: 'it is whispered'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "ha muerto", f: "ha, present of haber (to have), he, + muerto, the irregular participle of morir (to die): 'has died'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "endiablada", f: "endiablad- + -a → endiablado (devilish), feminine to match 'moza'."}
          - {w: "aquélla", f: "aquella (that) used alone as a pronoun, 'that one', with the accent the old spelling gave to pronouns; modern spelling writes 'aquella'."}
          - {w: "se anda", f: "and- + -a → andarse (to go about), present, she, with 'se' (herself). Same -ar present: -o, -as, -a, -amos, -áis, -an."}
  - sentences:
      - es: "— Por Marcela dirás —dijo uno."
        literal: "— For Marcela you-will-say —said one."
        ormsby: "“You mean Marcela?” said one."
        vocab:
          - {w: "por ... dirás", d: "'you must mean ...': literally 'for X you will say'; the future used for a guess at what someone means"}
        diagram:
          - s: "dirás"
            r: "main verb: you will say, i.e. you mean"
            under:
              - {s: "Por Marcela", r: "what: Marcela (not just 'that girl')"}
          - s: "dijo uno"
            r: "speech tag: said one"
        forms:
          - {w: "dirás", f: "dir- + -ás → decir (to say), future, you (tú): 'you will say', here 'you mean'. The future uses the shortened stem dir-: diré, dirás, dirá, diremos, diréis, dirán."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Por ésa digo —respondió el cabrero—. Y es lo bueno, que mandó en su testamento que le enterrasen en el campo, como si fuera moro, y que sea al pie de la peña donde está la fuente del alcornoque;"
        literal: "— For that-one I-say —answered the goatherd—. And it-is the good [part], that he-ordered in his will that him they-should-bury in the field, as if he-were [a] Moor, and that it-be at-the foot of the crag where is the spring of-the cork-oak;"
        ormsby: "“Her I mean,” answered the goatherd; “and the best of it is, he has directed in his will that he is to be buried in the fields like a Moor, and at the foot of the rock where the Cork-tree spring is,"
        vocab:
          - {w: "por ésa digo", d: "that's the one I mean; literally 'for that one I say'"}
          - {w: "cabrero", d: "goatherd"}
          - {w: "lo bueno", d: "the best of it, the remarkable part"}
          - {w: "mandar", d: "to order, direct; in a will, to leave instructions"}
          - {w: "testamento", d: "will, last testament"}
          - {w: "enterrar", d: "to bury"}
          - {w: "en el campo", d: "in the open country, i.e. not in a churchyard"}
          - {w: "moro", d: "Moor, Muslim; Muslims were not buried in consecrated Christian ground"}
          - {w: "peña", d: "crag, large rock"}
          - {w: "fuente", d: "spring, fountain"}
          - {w: "alcornoque", d: "cork oak; 'la fuente del alcornoque' is a local place name, 'Cork-oak Spring'"}
        diagram:
          - s: "Por ésa digo"
            r: "main verb 1: that's the one I mean"
            under:
              - {s: "respondió el cabrero", r: "speech tag: the goatherd answered"}
          - s: "Y es lo bueno"
            r: "main verb 2: and the best of it is"
            under:
              - s: "que mandó en su testamento"
                r: "what the best of it is: that he directed in his will"
                under:
                  - s: "que le enterrasen en el campo"
                    r: "what he ordered, 1: that they bury him in the open country"
                    under:
                      - {s: "como si fuera moro", r: "how: as if he were a Moor"}
                  - s: "y que sea al pie de la peña"
                    r: "what he ordered, 2: and that it be at the foot of the crag"
                    under:
                      - {s: "donde está la fuente del alcornoque", r: "describes 'peña': where the Cork-oak Spring is"}
        forms:
          - {w: "ésa", f: "esa (that), feminine to match the girl, used alone as a pronoun and so written with an accent in the old spelling."}
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "mandó", f: "mand- + -ó → mandar (to order), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "le enterrasen", f: "enterr- + -asen → enterrar (to bury), imperfect subjunctive (-se form), they, with 'le' (him). Subjunctive because it is what he ordered ('mandó que'). The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), he: 'as if he were'. 'como si' always takes the imperfect subjunctive: fuera, fueras, fuera, fuéramos, fuerais, fueran."}
          - {w: "sea", f: "ser (to be), present subjunctive, it: 'that it be'. sea, seas, sea, seamos, seáis, sean. The present tense here slips in because the will still holds now."}
          - {w: "está", f: "est- + -á → estar (to be), present, it. estoy, estás, está, estamos, estáis, están."}
          - {w: "del", f: "de + el: 'of the'."}
        note: "Christians were buried in consecrated ground in or beside the parish church; asking to be buried out in the fields, 'like a Moor', was a scandal to the clergy."
      - es: "porque, según es fama, y él dicen que lo dijo, aquel lugar es adonde él la vio la vez primera."
        literal: "because, according-to [what] is report, and he they-say that it he-said, that place is where he her saw the time first."
        ormsby: "because, as the story goes (and they say he himself said so), that was the place where he first saw her."
        vocab:
          - {w: "según es fama", d: "as the story goes, as people say; 'fama' = report, rumour, not only 'fame'"}
          - {w: "adonde", d: "where; in Cervantes 'adonde' is often plain 'donde', with no idea of motion"}
          - {w: "la vez primera", d: "the first time (modern order: la primera vez)"}
        diagram:
          - s: "aquel lugar es"
            r: "main verb (after 'porque'): that place is"
            under:
              - {s: "según es fama", r: "source 1: as the story goes"}
              - {s: "y él dicen que lo dijo", r: "source 2: and they say he said so himself"}
              - {s: "adonde él la vio la vez primera", r: "what it is: where he first saw her"}
        forms:
          - {w: "dicen", f: "dic- + -en → decir (to say), present, they (people in general): 'they say'. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "él dicen que lo dijo", f: "'él' is pulled to the front for emphasis: 'and he, they say, said so'. dijo: dij- + -o → decir, preterite, he (dije, dijiste, dijo, dijimos, dijisteis, dijeron)."}
          - {w: "aquel", f: "aquel (that), masculine to match 'lugar'."}
          - {w: "la vio", f: "vi- + -o → ver (to see), preterite, he, with 'la' (her). ver in the preterite: vi, viste, vio, vimos, visteis, vieron."}
      - es: "Y también mandó otras cosas, tales, que los abades del pueblo dicen que no se han de cumplir, ni es bien que se cumplan, porque parecen de gentiles."
        literal: "And also he-ordered other things, such, that the abbots of-the town say that not they-are to be-fulfilled, nor is-it well that they-be-fulfilled, because they-seem of gentiles."
        ormsby: "And he has also left other directions which the clergy of the village say should not and must not be obeyed because they savour of paganism."
        vocab:
          - {w: "tales, que", d: "of such a kind that"}
          - {w: "abad", d: "here the village priest, the clergy; in parts of Castile and Galicia the parish priest was called 'abad'"}
          - {w: "haber de", d: "+ infinitive: to have to, must; 'no se han de cumplir' = they are not to be carried out"}
          - {w: "cumplir", d: "to carry out, fulfil (an order or a will)"}
          - {w: "no es bien que", d: "it is not right that"}
          - {w: "gentiles", d: "gentiles, heathens, pagans; 'parecer de gentiles' = to look like pagan practice"}
        diagram:
          - s: "Y también mandó otras cosas"
            r: "main verb: and he also ordered other things"
            under:
              - s: "tales, que los abades del pueblo dicen"
                r: "result: of such a kind that the village clergy say"
                under:
                  - {s: "que no se han de cumplir", r: "what they say, 1: that they are not to be carried out"}
                  - {s: "ni es bien que se cumplan", r: "what they say, 2: nor is it right that they be carried out"}
                  - {s: "porque parecen de gentiles", r: "why: because they look pagan"}
        forms:
          - {w: "mandó", f: "mand- + -ó → mandar (to order), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "otras", f: "otr- + -as → otro (other), feminine plural to match 'cosas'; never with 'un' in front."}
          - {w: "dicen", f: "dic- + -en → decir (to say), present, they. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "se han de cumplir", f: "han, present of haber, they, + de + cumplir (to carry out), with 'se' making it passive: 'they are to be carried out'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "se cumplan", f: "cumpl- + -an → cumplir (to carry out), present subjunctive, they, passive 'se'. Subjunctive after 'no es bien que'. The present subjunctive of -er and -ir verbs: -a, -as, -a, -amos, -áis, -an."}
          - {w: "parecen", f: "parec- + -en → parecer (to seem), present, they. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (but 'parezco' for I)."}
      - es: "A todo lo cual responde aquel gran su amigo Ambrosio, el estudiante, que también se vistió de pastor con él, que se ha de cumplir todo, sin faltar nada, como lo dejó mandado Grisóstomo, y sobre esto anda el pueblo alborotado;"
        literal: "To all the which answers that great his friend Ambrosio, the student, who also dressed-himself as shepherd with him, that it-is to be-fulfilled all, without lacking nothing, as it left ordered Grisóstomo, and over this goes the town in-uproar;"
        ormsby: "To all which his great friend Ambrosio the student, he who, like him, also went dressed as a shepherd, replies that everything must be done without any omission according to the directions left by Chrysostom, and about this the village is all in commotion;"
        vocab:
          - {w: "lo cual", d: "which (referring to a whole idea)"}
          - {w: "aquel gran su amigo", d: "that great friend of his; old Spanish could put a demonstrative and a possessive together before a noun"}
          - {w: "vestirse de", d: "to dress as, put on the clothes of"}
          - {w: "sin faltar nada", d: "without leaving anything out"}
          - {w: "dejar mandado", d: "to leave as an instruction, leave ordered"}
          - {w: "andar alborotado", d: "to be in an uproar, in a stir"}
        diagram:
          - s: "responde"
            r: "main verb 1: replies"
            under:
              - {s: "A todo lo cual", r: "to what: to all of which"}
              - s: "aquel gran su amigo Ambrosio, el estudiante"
                r: "subject: his great friend Ambrosio, the student"
                under:
                  - {s: "que también se vistió de pastor con él", r: "describes 'Ambrosio': who also dressed as a shepherd along with him"}
              - s: "que se ha de cumplir todo, sin faltar nada"
                r: "what he replies: that everything must be carried out, with nothing left out"
                under:
                  - {s: "como lo dejó mandado Grisóstomo", r: "how: as Grisóstomo left it ordered"}
          - s: "anda el pueblo alborotado"
            r: "main verb 2 (after 'y'): the village is in an uproar"
            under:
              - {s: "sobre esto", r: "about what: about this"}
        forms:
          - {w: "responde", f: "respond- + -e → responder (to answer), present, he. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "gran", f: "grande clipped before a singular noun ('amigo'): 'great'."}
          - {w: "se vistió", f: "vist- + -ió → vestirse (to dress), preterite, he, with 'se' (himself). The stem e becomes i in this form: me vestí, te vestiste, se vistió, nos vestimos, os vestisteis, se vistieron."}
          - {w: "se ha de cumplir", f: "ha, present of haber, it, + de + cumplir (to carry out), passive 'se': 'it is to be carried out'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "faltar", f: "infinitive (to be missing) after 'sin'."}
          - {w: "lo dejó mandado", f: "dej- + -ó → dejar (to leave), preterite, he, + mandado, the participle of mandar (to order), with 'lo' (it): 'left it ordered'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "anda", f: "and- + -a → andar (to go about), present, it (the village); with an adjective it means 'is': 'anda alborotado'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "alborotado", f: "participle of alborotar (to stir up), masculine to match 'pueblo'."}
      - es: "mas, a lo que se dice, en fin se hará lo que Ambrosio y todos los pastores sus amigos quieren;"
        literal: "but, to that which is-said, in end will-be-done that which Ambrosio and all the shepherds his friends want;"
        ormsby: "however, report says that, after all, what Ambrosio and all the shepherds his friends desire will be done,"
        vocab:
          - {w: "mas", d: "but (without an accent; 'más' is 'more')"}
          - {w: "a lo que se dice", d: "from what people say"}
          - {w: "en fin", d: "in the end, after all"}
        diagram:
          - s: "se hará"
            r: "main verb (after 'mas'): will be done"
            under:
              - {s: "a lo que se dice", r: "source: from what people say"}
              - {s: "en fin", r: "when: in the end"}
              - {s: "lo que Ambrosio y todos los pastores sus amigos quieren", r: "subject: what Ambrosio and all his shepherd friends want"}
        forms:
          - {w: "se dice", f: "dic- + -e → decir (to say), present, it, with impersonal 'se': 'it is said'. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "se hará", f: "har- + -á → hacer (to do), future, it, with passive 'se': 'will be done'. The future uses the shortened stem har-: haré, harás, hará, haremos, haréis, harán."}
          - {w: "sus", f: "'his', plural to match 'amigos', not the owner."}
          - {w: "quieren", f: "quier- + -en → querer (to want), present, they. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
      - es: "y mañana le vienen a enterrar con gran pompa adonde tengo dicho."
        literal: "and tomorrow him they-come to bury with great pomp where I-have said."
        ormsby: "and tomorrow they are coming to bury him with great ceremony where I said."
        vocab:
          - {w: "venir a", d: "+ infinitive: to come to (do something)"}
          - {w: "pompa", d: "pomp, ceremony"}
          - {w: "tengo dicho", d: "= he dicho, I have said; 'tener' + participle stresses that the thing is said and done"}
        diagram:
          - s: "le vienen a enterrar"
            r: "main verb: they are coming to bury him"
            under:
