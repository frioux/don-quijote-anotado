          - {w: "podía", f: "pod- + -ía → poder (to be able), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "ésta", f: "'this one', feminine to match 'bacía'; written with an accent when it stands alone as a pronoun."}
          - {w: "he dicho", f: "he → haber (to have), present, I, + dicho, the irregular participle of decir (to say): 'I have said'. haber in the present: he, has, ha, hemos, habéis, han."}
