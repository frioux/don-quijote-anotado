  - sentences:
      - es: "— No hay para qué se dé cuenta aquí de mis cosas: yo soy libre, y volveré si me diere gusto, y si no, ninguno de vosotros me ha de hacer fuerza."
        literal: "— Not there-is for what itself may-give account here of my things: I am free, and I-will-return if to-me it-may-give pleasure, and if not, none of you me has to do force."
        ormsby: "“There is no need to make my affairs public here; I am free, and I will return if I please; and if not, none of you shall compel me.”"
        vocab:
          - {w: "no hay para qué", d: "there is no reason to, no need to"}
          - {w: "dar cuenta de", d: "to give an account of, explain"}
          - {w: "mis cosas", d: "my affairs"}
          - {w: "dar gusto", d: "to please; 'si me diere gusto' = if I please"}
          - {w: "hacer fuerza a", d: "to force, compel (someone)"}
          - {w: "haber de", d: "+ infinitive, shall, must, is to"}
        diagram:
          - s: "No hay para qué"
            r: "main verb 1: there is no reason"
            under:
              - {s: "se dé cuenta aquí de mis cosas", r: "for what: for an account of my affairs to be given here"}
          - {s: "yo soy libre", r: "main verb 2: I am free"}
          - s: "y volveré"
            r: "main verb 3: and I will return"
            under:
              - {s: "si me diere gusto", r: "condition: if I please"}
          - s: "me ha de hacer fuerza"
            r: "main verb 4: shall force me"
            under:
              - {s: "y si no", r: "condition: and if not"}
              - {s: "ninguno de vosotros", r: "subject: none of you"}
        forms:
          - {w: "hay", f: "from haber (to have), used impersonally: 'there is'."}
          - {w: "se dé", f: "d- + -é → dar (to give), present subjunctive, it, with 'se' making it passive: 'be given'. dar in the present subjunctive: dé, des, dé, demos, deis, den (the accent tells 'dé' from 'de', of)."}
          - {w: "soy", f: "ser (to be), present, I. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "volveré", f: "volver- + -é → volver (to return), future, I. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "diere", f: "d- + -iere → dar (to give), future subjunctive, it: 'if it should give me pleasure'. dar in the future subjunctive: diere, dieres, diere, diéremos, diereis, dieren. Cervantes uses the future subjunctive after 'si', 'cuando', 'lo que' for an open future; modern Spanish says 'si me da gusto'."}
          - {w: "ninguno", f: "'none, no one', the full form standing alone (it clips to 'ningún' only before a masculine noun)."}
          - {w: "ha de hacer", f: "h- + -a → haber (to have), present, he, + de + hacer (to do): 'haber de' = shall, must. haber in the present: he, has, ha, hemos, habéis, han."}
  - sentences:
      - es: "— Harásela a vuestra merced la razón —respondió el hombre—; y, cuando ella"
        literal: "— Will-do-it-to-you to your grace the reason —answered the man—; and, when it"
        ormsby: "“Reason will compel your worship,” said the man, “and if it"
        vocab:
          - {w: "vuestra merced", d: "your worship, your grace: the polite 'you', which takes the he/she form of the verb (modern 'usted' comes from it)"}
          - {w: "hacer fuerza", d: "to compel; '-la' here stands for the 'fuerza' (force) Don Luis has just mentioned"}
          - {w: "la razón", d: "reason, good sense"}
          - {w: "cuando", d: "here 'if, even if' (with the subjunctive that follows)"}
        diagram:
          - s: "Harásela"
            r: "main verb: will do it (the forcing) to you"
            under:
              - {s: "a vuestra merced", r: "to whom: to your worship (repeating the 'se')"}
              - {s: "la razón", r: "subject: reason"}
              - {s: "respondió el hombre", r: "speech tag: the man answered"}
              - {s: "y, cuando ella", r: "condition begins: and if it (reason), the sentence goes on in the next paragraph"}
        forms:
          - {w: "Harásela", f: "har- + -á + se + la → hacer (to do), future, it (reason), with 'se' (to you) and 'la' (it, the force) stuck on the end; modern 'Se la hará'. 'se' stands for 'le' (to you) before 'la'. Irregular future stem har-: haré, harás, hará, haremos, haréis, harán. Cervantes hangs pronouns on a conjugated verb that opens the sentence."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "ella", f: "'it', feminine because it stands for 'la razón'."}
        note: "The servant turns Don Luis's 'none of you shall force me' back on him: reason will do the forcing. The Gutenberg text breaks the paragraph in mid-sentence after 'cuando ella'; the reply runs on into the next line."
