                          - {s: "a quien don Quijote quitó el yelmo de Mambrino", r: "describes 'barbero': from whom Don Quijote took Mambrino's helmet"}
                          - s: "y Sancho Panza los aparejos del asno"
                            r: "describes 'barbero', 2: and (from whom) Sancho took the ass's trappings; 'quitó' is understood"
                            under:
                              - {s: "que trocó con los del suyo", r: "describes 'aparejos': which he swapped for those of his own ass"}
        forms:
          - {w: "estaban", f: "est- + -aban → estar (to be), imperfect, they (the guests). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "le habían pagado", f: "habí- + -an → haber (to have), imperfect, they, + pagado, the participle of pagar (to pay): the pluperfect, 'they had paid'. haber in the imperfect: había, habías, había, habíamos, habíais, habían. 'le' = to him, the innkeeper."}
          - {w: "quiso", f: "quis- + -o → querer (to want), preterite, he (the innkeeper): 'he asked for'. Irregular: quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "aguardaban", f: "aguard- + -aban → aguardar (to await), imperfect, they (the servants). Same -aba imperfect."}
          - {w: "duerme", f: "duerm- + -e → dormir (to sleep), present, he (the devil). The stem o becomes ue when stressed: duermo, duermes, duerme, dormimos, dormís, duermen."}
          - {w: "ordenó", f: "orden- + -ó → ordenar (to arrange, ordain), preterite, he (the devil). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "mesmo", f: "old form of mismo (same), masculine to match 'punto'."}
          - {w: "entró", f: "entr- + -ó → entrar (to enter), preterite, he (the barber). Same -ar preterite. After 'ordenó que' modern Spanish would put the subjunctive 'entrase'; Cervantes uses the plain preterite because it really happened."}
          - {w: "quitó", f: "quit- + -ó → quitar (to take away), preterite, he (Don Quijote, and again understood for Sancho). Same -ar preterite."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
          - {w: "trocó", f: "troc- + -ó → trocar (to swap), preterite, he (Sancho). Same -ar preterite."}
          - {w: "los del suyo", f: "'those of his own': 'los' stands for 'aparejos', and 'suyo' is masculine to match 'asno' understood (Sancho's own ass)."}
        note: "The barber is the one whose brass shaving basin Don Quijote seized as 'Mambrino's helmet' in chapter 21; Sancho then swapped the barber's donkey's trappings for his own ass's worn ones. The barber now walks into the inn where both basin and packsaddle are."
      - es: "el cual barbero, llevando su jumento a la caballeriza, vio a Sancho Panza que estaba aderezando no sé qué de la albarda, y así como la vio la conoció, y se atrevió a arremeter a Sancho, diciendo:"
