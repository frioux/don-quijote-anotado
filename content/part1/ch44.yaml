  - sentences:
      - es: "Ya a esta sazón habían acudido a la porfía todos los más que en la venta estaban, especialmente Cardenio, don Fernando, sus camaradas, el oidor, el cura, el barbero y don Quijote, que ya le pareció que no había necesidad de guardar más el castillo."
        literal: "Already at this season had come-running to the quarrel all the most who in the inn were, especially Cardenio, Don Fernando, his comrades, the judge, the priest, the barber and Don Quijote, who already to-him it-seemed that not there-was need of guarding more the castle."
        ormsby: "By this time most of those in the inn had been attracted by the dispute, but particularly Cardenio, Don Fernando, his companions, the Judge, the curate, the barber, and Don Quixote; for he now considered there was no necessity for mounting guard over the castle any longer."
        vocab:
          - {w: "a esta sazón", d: "at this point, by this time ('sazón' = season, right moment)"}
          - {w: "acudir", d: "to come running, hasten (to a place)"}
          - {w: "porfía", d: "wrangle, stubborn dispute"}
          - {w: "todos los más", d: "nearly all, most of them"}
          - {w: "camarada", d: "companion, comrade"}
          - {w: "oidor", d: "judge of a royal high court (Audiencia); literally 'hearer'"}
          - {w: "cura", d: "parish priest"}
          - {w: "que ya le pareció", d: "who now thought (literally 'who to him it now seemed'): a loose 'que' + 'le' standing for 'to whom'"}
        diagram:
          - s: "habían acudido"
            r: "main verb: had come running"
            under:
              - {s: "Ya a esta sazón", r: "when: by this time"}
              - {s: "a la porfía", r: "where to: to the quarrel"}
              - s: "todos los más"
                r: "subject: nearly everyone"
                under:
                  - {s: "que en la venta estaban", r: "describes 'los más': who were in the inn"}
              - s: "especialmente Cardenio, don Fernando, sus camaradas, el oidor, el cura, el barbero y don Quijote"
                r: "subject, named: especially these"
                under:
                  - s: "que ya le pareció"
                    r: "describes 'don Quijote': who now thought"
                    under:
                      - {s: "que no había necesidad de guardar más el castillo", r: "what he thought: that there was no need to guard the castle any longer"}
        forms:
          - {w: "habían acudido", f: "hab- + -ían → haber (to have), imperfect, they, + acudido, the participle of acudir (to come running): the pluperfect 'had come running'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "estaban", f: "est- + -aban → estar (to be), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "sus", f: "plural to match 'camaradas', not the owner: 'his companions' (Don Fernando's)."}
          - {w: "pareció", f: "parec- + -ió → parecer (to seem), preterite, it. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron. 'le pareció' = it seemed to him."}
          - {w: "había", f: "hab- + -ía → haber (to have; here 'there to be'), imperfect, used impersonally: 'there was'. Same imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "guardar", f: "infinitive of guardar (to guard), after 'necesidad de'."}
        note: "Don Quijote had spent the night mounted on Rocinante, keeping guard over the 'castle' (the inn); that is how Maritornes tricked him into the window and left him hanging by the wrist. Now that he is down, his self-imposed watch is over."
