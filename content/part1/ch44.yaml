          - s: "Apretáronle"
            r: "main verb: they pressed him"
            under:
              - {s: "entonces", r: "when: then"}
              - {s: "los criados", r: "subject: the servants"}
              - s: "diciéndole"
                r: "how: telling him"
                under:
                  - {s: "que en ningún modo volverían sin él", r: "what they said, 1: that they would on no account go back without him"}
                  - s: "y que le llevarían"
                    r: "what they said, 2: and that they would take him"
                    under:
                      - {s: "quisiese o no quisiese", r: "condition: whether he wanted to or not"}
        forms:
          - {w: "Apretáronle", f: "apret- + -aron + le → apretar (to press), preterite, they, with 'le' (him) stuck on the end; modern 'le apretaron'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. Cervantes hangs the pronoun on a conjugated verb that opens the sentence."}
          - {w: "diciéndole", f: "gerund of decir (to say) + le (to him), accent added to keep the stress."}
          - {w: "ningún", f: "ninguno (no) clipped before a masculine singular noun ('modo'), like un, algún, buen."}
          - {w: "volverían", f: "volver- + -ían → volver (to return), conditional, they: 'they would return', the future seen from the past. The conditional adds -ía, -ías, -ía, -íamos, -íais, -ían to the whole infinitive."}
          - {w: "le llevarían", f: "llevar- + -ían → llevar (to take, carry), conditional, they. Same conditional endings on the infinitive. 'le' (him) as a direct object for a male person is leísmo, normal in Cervantes."}
          - {w: "quisiese", f: "quis- + -iese → querer (to want), imperfect subjunctive (-se form), he. Built on the preterite quisieron: quisiese, quisieses, quisiese, quisiésemos, quisieseis, quisiesen. Doubled with 'o no' it means 'whether he liked it or not'."}
  - sentences:
