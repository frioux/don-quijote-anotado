          - {w: "impedir", d: "to prevent, stand in the way of"}
          - {w: "mesmo", d: "= mismo, same, very (old form)"}
          - {w: "haber de", d: "to be going to, must: 'ha de ser' = shall be"}
          - {w: "esposa", d: "wife (also 'bride, betrothed')"}
