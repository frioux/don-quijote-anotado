          - s: "¿Qué niñerías son éstas"
            r: "main verb 1: what childish nonsense is this"
            under:
              - {s: "señor don Luis", r: "addressed"}
          - s: "o qué causas tan poderosas"
            r: "main clause 2 ('son' understood): or what causes so powerful"
