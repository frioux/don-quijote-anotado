  - sentences:
      - es: "Calló, en diciendo esto, el enamorado mancebo, y el oidor quedó en oírle suspenso, confuso y admirado, así de haber oído el modo y la discreción con que don Luis le había descubierto su pensamiento, como de verse en punto que no sabía el que poder tomar en tan repentino y no esperado negocio;"
        literal: "Fell-silent, on saying this, the enamoured youth, and the judge remained on hearing-him astonished, confused and amazed, as-much from having heard the manner and the good-sense with which Don Luis to-him had uncovered his thought, as from seeing-himself in point that not he-knew the [course] that to-be-able to-take in so sudden and not expected business;"
        ormsby: "With this the love-smitten youth was silent, while the Judge, after hearing him, was astonished, perplexed, and surprised, as well at the manner and intelligence with which Don Luis had confessed the secret of his heart, as at the position in which he found himself, not knowing what course to take in a matter so sudden and unexpected."
        vocab:
          - {w: "en diciendo", d: "on saying, as soon as he had said ('en' + gerund = immediately after)"}
          - {w: "enamorado", d: "in love, enamoured"}
          - {w: "mancebo", d: "youth, young man (literary)"}
          - {w: "suspenso", d: "astonished, at a loss (false friend: not 'suspended' or 'suspense')"}
          - {w: "admirado", d: "amazed, astonished (false friend: not 'admiring')"}
          - {w: "así ... como", d: "both ... and, as much ... as"}
          - {w: "discreción", d: "good sense, intelligence, wit (false friend: more than 'discretion')"}
          - {w: "descubrir el pensamiento", d: "to reveal one's intention, open one's heart"}
          - {w: "en punto que", d: "in such a situation that"}
          - {w: "repentino", d: "sudden"}
          - {w: "negocio", d: "matter, affair (not only 'business')"}
        diagram:
          - s: "Calló"
            r: "main verb 1: fell silent"
            under:
              - {s: "en diciendo esto", r: "when: as soon as he said this"}
              - {s: "el enamorado mancebo", r: "subject: the young man in love"}
          - s: "el oidor quedó"
            r: "main verb 2 (after 'y'): the judge was left"
            under:
              - {s: "en oírle", r: "when: on hearing him"}
              - {s: "suspenso, confuso y admirado", r: "how: astonished, confused and amazed"}
              - s: "así de haber oído el modo y la discreción"
                r: "why, 1: both at having heard the manner and good sense"
                under:
                  - {s: "con que don Luis le había descubierto su pensamiento", r: "describes 'modo y discreción': with which Don Luis had revealed his intentions to him"}
              - s: "como de verse en punto"
                r: "why, 2: and at finding himself in a position"
                under:
                  - {s: "que no sabía el que poder tomar en tan repentino y no esperado negocio", r: "describes 'punto': where he did not know what course to take in so sudden and unexpected a matter"}
        forms:
          - {w: "Calló", f: "call- + -ó → callar (to fall silent), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. The verb comes first and the subject 'el enamorado mancebo' after it."}
          - {w: "diciendo", f: "gerund of decir (to say), the e of the stem turning to i: 'saying'. After 'en' it means 'as soon as (he said)'."}
          - {w: "quedó", f: "qued- + -ó → quedar (to remain, be left), preterite, he. Same -ar preterite. With an adjective it means 'was left, ended up' (astonished)."}
          - {w: "oírle", f: "oír (to hear) + le (him), the pronoun hung on the infinitive after 'en'; 'le' for a male person where modern standard Spanish prefers 'lo' (leísmo)."}
          - {w: "suspenso, confuso, admirado", f: "masculine singular to match 'oidor'; 'admirado' is the participle of admirar (to amaze)."}
          - {w: "haber oído", f: "infinitive of haber (to have) + oído, the participle of oír (to hear): the perfect infinitive, 'having heard', after 'de'."}
          - {w: "había descubierto", f: "hab- + -ía → haber (to have), imperfect, he: había, habías, había, habíamos, habíais, habían; + descubierto, the irregular participle of descubrir (to uncover): the pluperfect, 'had revealed'."}
          - {w: "verse", f: "ver (to see) + se (himself), the pronoun hung on the infinitive after 'de': 'seeing himself, finding himself'."}
          - {w: "sabía", f: "sab- + -ía → saber (to know), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "el que poder tomar", f: "'the [course] that [he] could take': 'el que' with 'partido' (course) understood, followed by a bare infinitive 'poder tomar' (to be able to take), an old construction; modern 'qué partido tomar'."}
          - {w: "tan repentino y no esperado", f: "repentin- + -o → repentino (sudden), and esperado, the participle of esperar (to expect), both masculine to match 'negocio'; 'tan' (so) goes before the adjective."}
      - es: "y así, no respondió otra cosa sino que se sosegase por entonces, y entretuviese a sus criados, que por aquel día no le volviesen, porque se tuviese tiempo para considerar lo que mejor a todos estuviese."
        literal: "and so, not he-answered other thing but that himself he-should-calm for then, and should-keep-occupied [to] his servants, that for that day not him they-should-return, so-that itself might-be-had time to consider that which best for all might-suit."
        ormsby: "All the answer, therefore, he gave him was to bid him to make his mind easy for the present, and arrange with his servants not to take him back that day, so that there might be time to consider what was best for all parties."
        vocab:
