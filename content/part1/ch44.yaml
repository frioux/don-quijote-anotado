          - {w: "sosegarse", d: "to calm down, be easy"}
          - {w: "por entonces", d: "for the time being"}
          - {w: "entretener", d: "to keep (someone) occupied, put off, hold off (false friend: not 'to entertain' here)"}
          - {w: "volver", d: "here transitive, 'to take back, return (someone)'"}
          - {w: "estar bien a", d: "to suit, be good for; 'lo que mejor a todos estuviese' = what would be best for everyone"}
        diagram:
          - s: "no respondió otra cosa"
            r: "main verb: he answered nothing else"
            under:
              - {s: "y así", r: "linking: and so"}
              - s: "sino que se sosegase por entonces"
                r: "except, 1: that he should calm down for now"
              - s: "y entretuviese a sus criados"
                r: "except, 2: and should hold off his servants"
                under:
                  - {s: "que por aquel día no le volviesen", r: "how to hold them off: so that they would not take him back that day"}
              - s: "porque se tuviese tiempo"
                r: "why: so that there would be time"
                under:
                  - {s: "para considerar lo que mejor a todos estuviese", r: "time for what: to consider what would be best for everyone"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "se sosegase", f: "soseg- + -ase → sosegarse (to calm down), imperfect subjunctive (-se form), he, with 'se'. The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. Subjunctive because it reports advice in the past."}
          - {w: "entretuviese", f: "entretuv- + -iese → entretener (to hold off), imperfect subjunctive (-se form), he. Built on the preterite entretuvieron (like tener → tuvieron): entretuviese, entretuvieses, entretuviese, entretuviésemos, entretuvieseis, entretuviesen."}
          - {w: "volviesen", f: "volv- + -iesen → volver (to take back), imperfect subjunctive (-se form), they (the servants): volviese, volvieses, volviese, volviésemos, volvieseis, volviesen."}
          - {w: "le", f: "'him' (Don Luis), used for a male person where modern standard Spanish prefers 'lo' (leísmo)."}
          - {w: "se tuviese", f: "tuv- + -iese → tener (to have), imperfect subjunctive (-se form), it, with 'se' making it impersonal: 'so that time might be had'. tuviese, tuvieses, tuviese, tuviésemos, tuvieseis, tuviesen. 'porque' + subjunctive = so that (purpose), not 'because'."}
          - {w: "estuviese", f: "estuv- + -iese → estar (to be), imperfect subjunctive (-se form), it: estuviese, estuvieses, estuviese, estuviésemos, estuvieseis, estuviesen. In 'estar bien a' (to suit): 'what might best suit everyone'."}
