          - {w: "conoció", f: "conoc- + -ió → conocer (to know, recognize), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "era", f: "ser (to be), imperfect, he. Irregular: era, eras, era, éramos, erais, eran."}
