          - {w: "prestar paciencia", d: "to be patient, submit quietly ('lend patience')"}
          - {w: "dar la vuelta", d: "to turn back, go back"}
          - {w: "vuestra merced", d: "'your worship', the polite 'you', taking the 'he/she' verb form (modern 'usted' comes from it)"}
          - {w: "si ya ... no", d: "unless"}
          - {w: "gustar", d: "here 'to wish, want, be pleased (that)'"}
          - {w: "darla al otro mundo", d: "to make the journey ('la vuelta') to the other world: to die. A pun on 'dar la vuelta' just before"}
          - {w: "pena", d: "grief, sorrow (not 'penalty')"}
