          - {w: "ninguna", f: "ningun- + -a → ninguno (no, none), feminine to match 'manera'."}
          - {w: "lo podía hacer", f: "pod- + -ía → poder (to be able), imperfect, he, + hacer (to do). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían. 'lo' (it) sits before the whole group; modern Spanish also says 'podía hacerlo'."}
