  - sentences:
      - es: "Y sin decir más se fue a poner de hinojos ante Dorotea, pidiéndole con palabras caballerescas y andantescas que la su grandeza fuese servida de darle licencia de acorrer y socorrer al castellano de aquel castillo, que estaba puesto en una grave mengua."
        literal: "And without saying more himself he-went to put [himself] on knees before Dorotea, asking-her with words knightly and errantly that the her greatness might-be served to give-him leave to aid and succour [to] the castellan of that castle, who was put in a grave plight."
        ormsby: "and without saying anything more he went and knelt before Dorothea, requesting her Highness in knightly and errant phrase to be pleased to grant him permission to aid and succour the castellan of that castle, who now stood in grievous jeopardy."
        vocab:
          - {w: "de hinojos", d: "on one's knees, kneeling (an old, formal word; modern 'de rodillas')"}
          - {w: "caballeresco", d: "knightly, chivalrous"}
          - {w: "andantesco", d: "knight-errantish: a word coined for comic effect from 'andante' (errant), as in 'caballero andante'"}
          - {w: "la su grandeza", d: "'the your greatness', i.e. 'your Highness': the old article-plus-possessive ('la su'), already archaic in 1605 and kept for the language of chivalry"}
          - {w: "ser servido de", d: "to be pleased to, deign to (a courtly formula: 'sea servido de' = please be so kind as to)"}
          - {w: "acorrer", d: "= socorrer, to help, aid (an archaic word from the books of chivalry); paired here with its modern equivalent"}
          - {w: "castellano", d: "castellan, the governor of a castle (not 'Castilian' here): Don Quijote's name for the innkeeper"}
          - {w: "mengua", d: "need, straits, plight; also dishonour, shame"}
        diagram:
          - s: "se fue a poner de hinojos"
            r: "main verb: he went and knelt"
            under:
