                    r: "what he asked: that her Highness be pleased"
                    under:
                      - s: "de darle licencia"
                        r: "pleased to what: to give him permission"
                        under:
                          - s: "de acorrer y socorrer al castellano de aquel castillo"
                            r: "permission for what: to aid and succour the castellan of that castle"
                            under:
                              - {s: "que estaba puesto en una grave mengua", r: "describes 'castellano': who was in grave straits"}
        forms:
          - {w: "se fue a poner", f: "fu- + -e → irse (to go off), preterite, he, with 'se': fui, fuiste, fue, fuimos, fuisteis, fueron (the same forms as the preterite of ser, to be); + a + poner (to put): 'he went to put himself'. The 'se' at the front belongs to 'ponerse' (to put oneself) as well as to 'irse'."}
          - {w: "pidiéndole", f: "gerund of pedir (to ask), the e of the stem turning to i (pidiendo), + le (her) stuck on the end, with an accent added to keep the stress: 'asking her'."}
          - {w: "caballerescas y andantescas", f: "caballeresc- + -as, andantesc- + -as → caballeresco (knightly), andantesco (knight-errantish), feminine plural to match 'palabras'. The suffix -esco makes 'in the style of'."}
          - {w: "la su", f: "article + possessive together ('the your'), an old construction; modern Spanish uses only 'su'."}
          - {w: "fuese servida", f: "fu- + -ese → ser (to be), imperfect subjunctive (-se form), she: fuese, fueses, fuese, fuésemos, fueseis, fuesen; + servida, the participle of servir (to serve), feminine to match 'la su grandeza': 'that she be pleased'. Subjunctive after 'pidiéndole que' (asking her to) because it reports a request."}
          - {w: "darle", f: "dar (to give) + le (him), the pronoun hung on the infinitive after 'de'."}
          - {w: "al", f: "a + el: the personal 'a' that marks a human object ('socorrer al castellano') joined to the article 'el'."}
          - {w: "estaba puesto", f: "est- + -aba → estar (to be), imperfect, he: estaba, estabas, estaba, estábamos, estabais, estaban; + puesto, the irregular participle of poner (to put), masculine to match 'castellano': 'was placed, found himself'."}
        note: "Don Quijote kneels to Dorotea as Princess Micomicona to ask leave to break his vow and help the innkeeper, whom he calls the castellan, since for him the inn is a castle. His 'caballerescas y andantescas' language is the narrator's mockery of the archaic style of the romances."
