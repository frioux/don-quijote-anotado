  - sentences:
      - es: "— Señores, así esta albarda es mía como la muerte que debo a Dios, y así la conozco como si la hubiera parido; y ahí está mi asno en el establo, que no me dejará mentir; si no, pruébensela, y si no le viniere pintiparada, yo quedaré por infame."
        literal: "— Sirs, so this packsaddle is mine as the death that I-owe to God, and so it I-know as if it I-had given-birth-to; and there is my ass in the stable, who not me will-let lie; if not, try-it-on-him, and if not to-him it-should-come exactly-fitting, I shall-remain as infamous."
        ormsby: "“Gentlemen, this packsaddle is mine as surely as I owe God a death, and I know it as well as if I had given birth to it, and here is my ass in the stable who will not let me lie; only try it, and if it does not fit him like a glove, call me a rascal;"
        vocab:
          - {w: "así ... como", d: "as surely ... as, as much ... as"}
          - {w: "la muerte que debo a Dios", d: "'the death I owe God': everyone owes God a death, a proverbial way of saying 'as sure as death'"}
          - {w: "parir", d: "to give birth to"}
          - {w: "establo", d: "stable"}
          - {w: "si no", d: "otherwise, if you don't believe me"}
          - {w: "probar", d: "here 'to try on'"}
          - {w: "venir pintiparado", d: "to fit exactly, fit like a glove"}
          - {w: "quedar por", d: "to be held as, stand as"}
          - {w: "infame", d: "a disgraced man, a scoundrel"}
        diagram:
          - s: "así esta albarda es mía"
            r: "main clause 1: this packsaddle is as surely mine"
            under:
              - {s: "Señores", r: "who is addressed: gentlemen"}
              - {s: "como la muerte que debo a Dios", r: "compared with: as the death I owe God"}
          - s: "así la conozco"
            r: "main clause 2 (after 'y'): I know it as well"
            under:
              - {s: "como si la hubiera parido", r: "compared with: as if I had given birth to it"}
          - s: "ahí está mi asno"
            r: "main clause 3 (after 'y'): there is my ass"
            under:
              - {s: "en el establo", r: "where: in the stable"}
              - {s: "que no me dejará mentir", r: "describes 'asno': who won't let me lie"}
          - s: "pruébensela"
            r: "main clause 4: try it on him"
            under:
              - {s: "si no", r: "condition: if you don't believe me"}
          - s: "yo quedaré por infame"
            r: "main clause 5 (after 'y'): I'll stand as a scoundrel"
            under:
              - {s: "si no le viniere pintiparada", r: "condition: if it doesn't fit him exactly"}
        forms:
          - {w: "es", f: "ser (to be), present, it. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "mía", f: "'mine', feminine to match 'albarda'."}
          - {w: "debo", f: "deb- + -o → deber (to owe), present, I. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "conozco", f: "conozc- + -o → conocer (to know), present, I; the I-form adds z: conozco, conoces, conoce, conocemos, conocéis, conocen."}
          - {w: "hubiera parido", f: "hubier- + -a → haber (to have), imperfect subjunctive (-ra form), I, + parido, the participle of parir (to give birth): 'as if I had given birth to (it)', subjunctive after 'como si'. haber in the -ra form: hubiera, hubieras, hubiera, hubiéramos, hubierais, hubieran."}
          - {w: "está", f: "est- + -á → estar (to be), present, he (the ass). Irregular: estoy, estás, está, estamos, estáis, están."}
          - {w: "dejará", f: "dejar- + -á → dejar (to let), future, he (the ass). The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "pruébensela", f: "prueb- + -en + se + la → probar (to try on), present subjunctive used as a command, they (the gentlemen, 'vuestras mercedes', who take the they-form). The stem o becomes ue when stressed: pruebe, pruebes, pruebe, probemos, probéis, prueben. 'se' is 'le' (on him, the ass) turned into 'se' before 'la' (it, the packsaddle); pronouns hang on the end of a command."}
          - {w: "viniere", f: "vin- + -iere → venir (to come), future subjunctive, it: 'if it should not fit him'. Built on the preterite vinieron: viniere, vinieres, viniere, viniéremos, viniereis, vinieren. Cervantes uses it after 'si' for an open future; modern Spanish says 'si no le viene'."}
          - {w: "pintiparada", f: "pintiparad- + -a → pintiparado (fitting exactly), feminine to match 'albarda'."}
          - {w: "quedaré", f: "quedar- + -é → quedar (to remain), future, I. Same future endings: -é, -ás, -á, -emos, -éis, -án."}
