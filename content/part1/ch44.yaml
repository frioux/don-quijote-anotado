  - sentences:
      - es: "Y, en tanto que le hacía esta y otras preguntas, oyeron grandes voces a la puerta de la venta, y era la causa dellas que dos huéspedes que aquella noche habían alojado en ella, viendo a toda la gente ocupada en saber lo que los cuatro buscaban, habían intentado a irse sin pagar lo que debían;"
        literal: "And, while that to-him he-was-making this and other questions, they-heard great shouts at the door of the inn, and was the cause of-them that two guests who that night had lodged in it, seeing [to] all the people occupied in knowing that which the four were-seeking, had attempted to go-off without paying that which they-owed;"
        ormsby: "But while he was questioning him they heard a loud outcry at the gate of the inn, the cause of which was that two of the guests who had passed the night there, seeing everybody busy about finding out what it was the four men wanted, had conceived the idea of going off without paying what they owed;"
        vocab:
          - {w: "en tanto que", d: "while"}
          - {w: "hacer preguntas", d: "to ask questions"}
          - {w: "voces", d: "shouts, cries (not only 'voices')"}
          - {w: "dellas", d: "= de ellas, of them (old contraction)"}
          - {w: "huésped", d: "guest, lodger"}
          - {w: "alojar", d: "to lodge, put up (here intransitive: to stay the night)"}
          - {w: "intentar a", d: "to try to; modern Spanish drops the 'a'"}
          - {w: "deber", d: "here 'to owe'"}
        diagram:
          - s: "oyeron grandes voces"
            r: "main verb 1: they heard loud shouts"
            under:
              - {s: "en tanto que le hacía esta y otras preguntas", r: "when: while he was asking him this and other questions"}
              - {s: "a la puerta de la venta", r: "where: at the inn door"}
          - s: "y era la causa dellas"
            r: "main verb 2: and the cause of them was"
            under:
              - s: "que dos huéspedes ... habían intentado a irse sin pagar lo que debían"
                r: "what the cause was: that two guests had tried to slip off without paying what they owed"
                under:
                  - {s: "que aquella noche habían alojado en ella", r: "describes 'huéspedes': who had lodged there that night"}
                  - s: "viendo a toda la gente ocupada"
                    r: "why: seeing everyone busy"
                    under:
                      - {s: "en saber lo que los cuatro buscaban", r: "busy with what: finding out what the four were after"}
        forms:
          - {w: "hacía", f: "hac- + -ía → hacer (to make, ask), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "esta", f: "est- + -a → este (this), feminine to match 'pregunta(s)'."}
          - {w: "oyeron", f: "o- + -yeron → oír (to hear), preterite, they. The i of the ending becomes y between vowels: oí, oíste, oyó, oímos, oísteis, oyeron."}
          - {w: "era", f: "ser (to be), imperfect, it. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "dellas", f: "= de + ellas, 'of them' (the shouts, 'voces', feminine)."}
          - {w: "habían alojado, habían intentado", f: "hab- + -ían → haber (to have), imperfect, they, + alojado (alojar, to lodge) and intentado (intentar, to try): the pluperfect 'had lodged', 'had tried'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "viendo", f: "gerund of ver (to see): 'seeing'."}
          - {w: "ocupada", f: "ocup- + -ada → ocupar (to occupy), participle used as an adjective, feminine singular to match 'gente' (people, grammatically singular)."}
          - {w: "buscaban", f: "busc- + -aban → buscar (to look for), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "irse", f: "ir (to go) + se: 'to go off, slip away'."}
          - {w: "debían", f: "deb- + -ían → deber (to owe), imperfect, they. Same -ía imperfect as 'hacía': debía, debías, debía, debíamos, debíais, debían."}
      - es: "mas el ventero, que atendía más a su negocio que a los ajenos, les asió al salir de la puerta y pidió su paga, y les afeó su mala intención con tales palabras, que les movió a que le respondiesen con los puños;"
        literal: "but the innkeeper, who attended more to his business than to those of-others, them seized at-the going-out of the door and asked-for his pay, and to-them he-reproached their bad intention with such words, that them he-moved to that him they-should-answer with the fists;"
        ormsby: "but the landlord, who minded his own affairs more than other people’s, caught them going out of the gate and demanded his reckoning, abusing them for their dishonesty with such language that he drove them to reply with their fists,"
        vocab:
          - {w: "mas", d: "but (literary; no accent, unlike 'más' = more)"}
          - {w: "atender a", d: "to attend to, mind"}
          - {w: "ajeno", d: "belonging to others, other people's"}
          - {w: "asir", d: "to seize, grab"}
          - {w: "al salir", d: "as they were going out"}
          - {w: "paga", d: "payment, what is owed"}
          - {w: "afear", d: "to reproach, censure (literally 'to make ugly')"}
          - {w: "puño", d: "fist"}
        diagram:
          - s: "les asió"
            r: "main verb 1: he grabbed them"
            under:
              - s: "el ventero"
                r: "subject: the innkeeper"
                under:
                  - {s: "que atendía más a su negocio que a los ajenos", r: "describes 'ventero': who minded his own business more than other people's"}
              - {s: "al salir de la puerta", r: "when: as they went out of the door"}
          - {s: "y pidió su paga", r: "main verb 2: and demanded his payment"}
          - s: "y les afeó su mala intención"
            r: "main verb 3: and reproached them for their bad intent"
            under:
              - s: "con tales palabras"
                r: "how: with such words"
                under:
                  - s: "que les movió"
                    r: "result: that he drove them"
                    under:
                      - {s: "a que le respondiesen con los puños", r: "to what: to answer him with their fists"}
        forms:
          - {w: "atendía", f: "atend- + -ía → atender (to attend), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "ajenos", f: "masculine plural to match 'negocios' understood: 'other people's (affairs)'."}
          - {w: "les asió", f: "as- + -ió → asir (to seize), preterite, he. asir in the preterite: así, asiste, asió, asimos, asisteis, asieron. 'les' (them) as a direct object for male persons is leísmo, normal in Cervantes."}
          - {w: "al salir", f: "al (a + el) + infinitive = 'on doing, as one does': 'as they were going out'."}
          - {w: "pidió", f: "pid- + -ió → pedir (to ask for), preterite, he. The e of the stem turns to i in some forms: pedí, pediste, pidió, pedimos, pedisteis, pidieron."}
          - {w: "afeó", f: "afe- + -ó → afear (to reproach), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "tales", f: "plural of tal (such), to match 'palabras'."}
          - {w: "movió", f: "mov- + -ió → mover (to move, drive), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "respondiesen", f: "respond- + -iesen → responder (to answer), imperfect subjunctive (-se form), they. The -se imperfect subjunctive of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen. Subjunctive after 'mover a que' (drive someone to)."}
      - es: "y así, le comenzaron a dar tal mano, que el pobre ventero tuvo necesidad de dar voces y pedir socorro."
        literal: "and so, to-him they-began to give such hand, that the poor innkeeper had need of giving shouts and asking-for help."
        ormsby: "and so they began to lay on him in such a style that the poor man was forced to cry out, and call for help."
        vocab:
          - {w: "dar una mano a alguien", d: "to give someone a drubbing, a beating; 'tal mano' = such a beating"}
          - {w: "dar voces", d: "to shout, cry out"}
          - {w: "socorro", d: "help, aid"}
        diagram:
          - s: "le comenzaron a dar tal mano"
            r: "main verb: they began to give him such a beating"
            under:
              - {s: "y así", r: "linking: and so"}
              - {s: "que el pobre ventero tuvo necesidad de dar voces y pedir socorro", r: "result: that the poor innkeeper had to shout and call for help"}
        forms:
          - {w: "comenzaron", f: "comenz- + -aron → comenzar (to begin), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (comencé, z → c before e). 'comenzar a' + infinitive = begin to."}
          - {w: "le", f: "'to him', indirect object: they gave a beating to him."}
          - {w: "pobre", f: "before the noun 'pobre' means 'poor, pitiable'; after it ('ventero pobre') it would mean 'penniless'."}
          - {w: "tuvo", f: "tuv- + -o → tener (to have), preterite, he. Irregular: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron."}
          - {w: "dar, pedir", f: "infinitives of dar (to give) and pedir (to ask for), after 'necesidad de'."}
      - es: "La ventera y su hija no vieron a otro más desocupado para poder socorrerle que a don Quijote, a quien la hija de la ventera dijo:"
        literal: "The innkeeper's-wife and her daughter not saw [to] another more unoccupied to be-able to-help-him than [to] Don Quijote, to whom the daughter of the innkeeper's-wife said:"
        ormsby: "The landlady and her daughter could see no one more free to give aid than Don Quixote, and to him the daughter said,"
        vocab:
          - {w: "ventera", d: "landlady, the innkeeper's wife"}
          - {w: "desocupado", d: "free, idle, with nothing to do"}
          - {w: "socorrer", d: "to help, come to the aid of"}
        diagram:
          - s: "no vieron"
            r: "main verb: did not see"
            under:
              - {s: "La ventera y su hija", r: "subject: the landlady and her daughter"}
              - s: "a otro más desocupado"
                r: "object: anyone else more free"
                under:
                  - {s: "para poder socorrerle", r: "purpose: to be able to help him"}
              - s: "que a don Quijote"
                r: "comparison: than Don Quijote"
                under:
                  - {s: "a quien la hija de la ventera dijo:", r: "describes 'don Quijote': to whom the landlady's daughter said"}
        forms:
          - {w: "vieron", f: "v- + -ieron → ver (to see), preterite, they. Irregular: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "a otro", f: "the personal 'a' before a person as direct object; also in 'a don Quijote'."}
          - {w: "desocupado", f: "des- (un-) + ocupado, the participle of ocupar (to occupy): 'unoccupied, free', masculine to match 'otro'."}
          - {w: "socorrerle", f: "socorrer (to help) + le (him, the innkeeper), the pronoun hung on the infinitive after 'poder'. 'le' for a male person as direct object is leísmo, normal in Cervantes."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, she. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
        note: "The scene is comic because the one 'unoccupied' person is the knight who, as the next lines show, will refuse to help on chivalric grounds."
  - sentences:
      - es: "— Socorra vuestra merced, señor caballero, por la virtud que Dios le dio, a mi pobre padre, que dos malos hombres le están moliendo como a cibera."
        literal: "— May-succour your grace, sir knight, by the virtue that God to-you gave, [to] my poor father, for two bad men him are grinding like [they grind] grist."
        ormsby: "“Sir knight, by the virtue God has given you, help my poor father, for two wicked men are beating him to a mummy.”"
        vocab:
          - {w: "socorrer", d: "to help, come to the aid of, succour"}
          - {w: "vuestra merced", d: "'your grace', the polite 'you' of the period (modern 'usted' comes from it); takes a 'he/she' verb"}
          - {w: "virtud", d: "here 'power, strength' (the old sense of Latin 'virtus'), as well as 'virtue'"}
          - {w: "moler", d: "to grind; figuratively, to beat black and blue ('moler a palos')"}
          - {w: "cibera", d: "grist: the grain put into a mill to be ground; 'moler como a cibera' = to grind someone to powder"}
        diagram:
          - s: "Socorra"
            r: "main verb: help (polite command)"
            under:
              - {s: "vuestra merced", r: "subject: your grace"}
              - {s: "señor caballero", r: "who she is talking to: sir knight"}
              - s: "por la virtud"
                r: "by what she pleads: by the power"
                under:
                  - {s: "que Dios le dio", r: "describes 'virtud': that God gave you"}
              - s: "a mi pobre padre"
                r: "object: my poor father"
                under:
                  - {s: "que dos malos hombres le están moliendo como a cibera", r: "why: for two bad men are grinding him like grist"}
        forms:
          - {w: "Socorra", f: "socorr- + -a → socorrer (to help), present subjunctive, he/she (vuestra merced): 'help!', the polite command. The present subjunctive of -er and -ir verbs: -a, -as, -a, -amos, -áis, -an. 'Vuestra merced' takes the he/she form, as 'usted' does today."}
          - {w: "le dio", f: "di- + -o → dar (to give), preterite, he (God). Irregular: di, diste, dio, dimos, disteis, dieron. 'le' = to you (vuestra merced), the polite 'you' taking a 'him/her' pronoun."}
          - {w: "le están moliendo", f: "est- + -án → estar (to be), present, they: estoy, estás, está, estamos, estáis, están; + moliendo, the gerund of moler (to grind): 'they are grinding', an action going on right now. 'le' = him (her father), used for a male person where modern standard Spanish prefers 'lo' (leísmo)."}
          - {w: "como a cibera", f: "the personal 'a' that marks a human object ('a mi pobre padre') is repeated in the comparison: 'as [one grinds] grist'."}
        note: "The innkeeper's daughter appeals to Don Quijote in his own language of knighthood ('señor caballero', 'la virtud que Dios le dio'), as a damsel in distress would."
  - sentences:
      - es: "A lo cual respondió don Quijote, muy de espacio y con mucha flema:"
        literal: "To that which answered Don Quijote, very at leisure and with much phlegm:"
        ormsby: "To which Don Quixote very deliberately and phlegmatically replied,"
        vocab:
          - {w: "a lo cual", d: "to which"}
          - {w: "de espacio", d: "slowly, at leisure (modern 'despacio')"}
          - {w: "flema", d: "phlegm: calm, unhurried coolness; in humoral medicine, phlegm is the cold, sluggish humour"}
        diagram:
          - s: "respondió"
            r: "main verb: answered"
            under:
              - {s: "A lo cual", r: "to what: to which (the daughter's plea)"}
              - {s: "don Quijote", r: "subject"}
              - {s: "muy de espacio y con mucha flema", r: "how: very slowly and with great calm"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "lo cual", f: "neuter 'lo' + cual: 'which', referring to the whole plea just made rather than to one noun."}
          - {w: "mucha", f: "much- + -a → mucho (much), feminine to match 'flema'."}
        note: "The comedy is in the contrast: the innkeeper is being beaten at the door while the knight answers slowly and ceremoniously."
  - sentences:
      - es: "— Fermosa doncella, no ha lugar por ahora vuestra petición, porque estoy impedido de entremeterme en otra aventura en tanto que no diere cima a una en que mi palabra me ha puesto."
        literal: "— Beautiful damsel, not has place for now your petition, because I-am prevented from meddling-myself in another adventure while that not I-may-give summit to one in which my word me has put."
        ormsby: "“Fair damsel, at the present moment your request is inopportune, for I am debarred from involving myself in any adventure until I have brought to a happy conclusion one to which my word has pledged me;"
        vocab:
          - {w: "fermosa", d: "= hermosa, beautiful: the old f- form, used by Don Quijote to sound like the books of chivalry"}
          - {w: "doncella", d: "damsel, maiden"}
          - {w: "no ha lugar", d: "'it has no place', a legal formula for rejecting a petition: 'request denied' (modern 'no ha lugar' still used in courts)"}
          - {w: "impedido", d: "prevented, barred"}
          - {w: "entremeterse", d: "to meddle, get involved (modern 'entrometerse')"}
          - {w: "en tanto que", d: "while, as long as; with 'no', 'until'"}
          - {w: "dar cima a", d: "to bring to completion, finish (literally 'give top to')"}
        diagram:
          - s: "no ha lugar"
            r: "main verb: there is no place for (it is denied)"
            under:
              - {s: "Fermosa doncella", r: "who he is talking to: fair damsel"}
              - {s: "por ahora", r: "when: for now"}
              - {s: "vuestra petición", r: "subject: your request"}
              - s: "porque estoy impedido"
                r: "why: because I am barred"
                under:
                  - {s: "de entremeterme en otra aventura", r: "barred from what: from getting involved in another adventure"}
                  - s: "en tanto que no diere cima a una"
                    r: "until: as long as I have not finished one"
                    under:
                      - {s: "en que mi palabra me ha puesto", r: "describes 'una': which my word has put me in"}
        forms:
          - {w: "ha", f: "h- + -a → haber (to have), present, it. Irregular: he, has, ha, hemos, habéis, han. Here not a helper verb but the old 'haber' meaning 'to have', in the legal formula 'no ha lugar'."}
          - {w: "Fermosa", f: "= hermosa (beautiful), feminine to match 'doncella'; the medieval f- that became h- in modern Spanish."}
          - {w: "estoy impedido", f: "est- + -oy → estar (to be), present, I: estoy, estás, está, estamos, estáis, están; + impedido, the participle of impedir (to prevent): 'I am prevented'."}
          - {w: "entremeterme", f: "entremeter (to meddle) + me (myself), the pronoun hung on the infinitive after 'de'."}
          - {w: "diere", f: "di- + -ere → dar (to give), future subjunctive, I: 'until I shall have given'. Built on the preterite dieron: diere, dieres, diere, diéremos, diereis, dieren. Cervantes uses the future subjunctive after 'si', 'cuando', 'en tanto que' for an open future; modern Spanish uses the present subjunctive 'dé'."}
          - {w: "me ha puesto", f: "h- + -a → haber (to have), present, it: he, has, ha, hemos, habéis, han; + puesto, the irregular participle of poner (to put): the present perfect, 'has put me'."}
        note: "Don Quijote has promised Princess Micomicona (Dorotea in disguise) to undertake no other adventure until he has restored her to her kingdom, so by the rules of chivalry he cannot help the innkeeper without her leave."
      - es: "Mas lo que yo podré hacer por serviros es lo que ahora diré:"
        literal: "But that which I will-be-able to-do for to-serve-you is that which now I-will-say:"
        ormsby: "but that which I can do for you is what I will now mention:"
        vocab:
          - {w: "mas", d: "but (without accent; 'más' with accent = more)"}
          - {w: "servir", d: "to serve, do a service to"}
        diagram:
          - s: "es"
            r: "main verb: is"
            under:
              - s: "Mas lo"
                r: "subject: but that"
                under:
                  - {s: "que yo podré hacer por serviros", r: "describes 'lo': what I will be able to do to serve you"}
              - s: "lo"
                r: "what it is: that"
                under:
                  - {s: "que ahora diré", r: "describes 'lo': what I will now say"}
        forms:
          - {w: "podré", f: "podr- + -é → poder (to be able), future, I. Irregular stem podr-: podré, podrás, podrá, podremos, podréis, podrán."}
          - {w: "serviros", f: "servir (to serve) + os (you, plural or polite), the pronoun hung on the infinitive after 'por'."}
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "diré", f: "dir- + -é → decir (to say), future, I. Irregular stem dir-: diré, dirás, dirá, diremos, diréis, dirán."}
          - {w: "lo que", f: "neuter 'lo' + que: 'what, that which', for an idea rather than a named thing."}
      - es: "corred y decid a vuestro padre que se entretenga en esa batalla lo mejor que pudiere, y que no se deje vencer en ningún modo, en tanto que yo pido licencia a la princesa Micomicona para poder socorrerle en su cuita;"
        literal: "run and tell to your father that himself he-may-keep-going in that battle the best that he-may-be-able, and that not himself he-may-let to-defeat in no way, while that I ask leave to the princess Micomicona to be-able to-succour-him in his distress;"
        ormsby: "run and tell your father to stand his ground as well as he can in this battle, and on no account to allow himself to be vanquished, while I go and request permission of the Princess Micomicona to enable me to succour him in his distress;"
        vocab:
          - {w: "entretenerse", d: "to hold out, keep oneself going (false friend: not 'to entertain oneself' here)"}
          - {w: "lo mejor que pudiere", d: "as best he can"}
          - {w: "dejarse vencer", d: "to let oneself be beaten"}
          - {w: "en ningún modo", d: "on no account, in no way"}
          - {w: "licencia", d: "permission, leave (false friend: not a 'licence' document)"}
          - {w: "cuita", d: "trouble, distress, affliction (an old word, typical of the books of chivalry)"}
        diagram:
          - s: "corred y decid a vuestro padre"
            r: "main verbs: run and tell your father"
            under:
              - s: "que se entretenga en esa batalla"
                r: "what to tell him, 1: to hold out in that battle"
                under:
                  - {s: "lo mejor que pudiere", r: "how: as best he can"}
              - {s: "y que no se deje vencer en ningún modo", r: "what to tell him, 2: and on no account to let himself be beaten"}
              - s: "en tanto que yo pido licencia a la princesa Micomicona"
                r: "while: while I ask Princess Micomicona's leave"
                under:
                  - {s: "para poder socorrerle en su cuita", r: "why: so as to be able to help him in his distress"}
        forms:
          - {w: "corred, decid", f: "corr- + -ed → correr (to run) and dec- + -id → decir (to say), imperative, you (vosotros, plural or very formal): 'run!', 'tell!'. The vosotros imperative swaps the final -r of the infinitive for -d: corred, decid, amad."}
          - {w: "se entretenga", f: "entreteng- + -a → entretenerse (to hold out), present subjunctive, he, with 'se' (himself); subjunctive after 'decid que' because it reports a command. tener and its compounds in the present subjunctive: tenga, tengas, tenga, tengamos, tengáis, tengan."}
          - {w: "pudiere", f: "pud- + -iere → poder (to be able), future subjunctive, he: 'as best he may be able'. Built on the preterite pudieron: pudiere, pudieres, pudiere, pudiéremos, pudiereis, pudieren. Cervantes uses the future subjunctive after 'que', 'si', 'cuando' for an open future; modern Spanish uses the present subjunctive 'pueda'."}
          - {w: "se deje", f: "dej- + -e → dejarse (to let oneself), present subjunctive, he, also after 'decid que'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "ningún", f: "ninguno (no, none) clipped before a masculine singular noun ('modo'), like un, buen, algún. Spanish keeps the double negative: 'no ... en ningún modo'."}
          - {w: "pido", f: "pid- + -o → pedir (to ask for), present, I. The e of the stem becomes i when stressed: pido, pides, pide, pedimos, pedís, piden."}
          - {w: "socorrerle", f: "socorrer (to help) + le (him), the pronoun hung on the infinitive; 'le' for a male person where modern standard Spanish prefers 'lo' (leísmo)."}
