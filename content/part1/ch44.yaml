        literal: "Already was Don Quijote in-front, with much contentment of seeing how well himself defended and attacked his squire, and held-him from there forward as man of worth, and proposed in his heart of to-arm-him knight on the first occasion that itself to-him might-offer, for seeming-to-him that would-be in him well employed the order of the chivalry."
        ormsby: "Don Quixote was standing by at the time, highly pleased to see his squire’s stoutness, both offensive and defensive, and from that time forth he reckoned him a man of mettle, and in his heart resolved to dub him a knight on the first opportunity that presented itself, feeling sure that the order of chivalry would be fittingly bestowed upon him."
