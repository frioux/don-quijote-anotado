          - {w: "se puede esperar", f: "pued- + -e → poder (to be able), present, it, with impersonal 'se', + esperar (to expect): 'can be expected'. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "queda", f: "qued- + -a → quedar (to remain, be left), present, he. Same -ar present: quedo, quedas, queda, quedamos, quedáis, quedan."}
