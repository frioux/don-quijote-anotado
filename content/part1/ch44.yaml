          - s: "Limpióse el mozo los soñolientos ojos"
            r: "main verb 1: the lad rubbed his sleepy eyes"
          - s: "y miró de espacio al que le tenía asido"
            r: "main verb 2: and looked slowly at the man holding him"
          - s: "y luego conoció"
            r: "main verb 3: and at once recognized"
