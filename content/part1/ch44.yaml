  - sentences:
      - es: "Ya estaban todos los cuatro que venían a buscar a don Luis dentro de la venta y rodeados dél, persuadiéndole que luego, sin detenerse un punto, volviese a consolar a su padre."
        literal: "Already were all the four who were-coming to seek [to] Don Luis inside of the inn and surrounded of-him, persuading-him that at-once, without stopping-himself a moment, he-should-return to console [to] his father."
        ormsby: "All the four who had come in quest of Don Luis had now come into the inn and surrounded him, urging him to return and console his father at once and without a moment’s delay."
        vocab:
          - {w: "rodeados dél", d: "standing round him, having him surrounded (literally 'surrounded of him')"}
          - {w: "dél", d: "= de él, of him (old contraction)"}
          - {w: "persuadir que", d: "to urge, press someone to"}
          - {w: "luego", d: "at once, immediately (the old sense; not 'later')"}
          - {w: "detenerse", d: "to stop, delay"}
          - {w: "un punto", d: "a moment, an instant"}
          - {w: "volver a consolar", d: "here 'go back to console' (not 'console again')"}
        diagram:
          - s: "Ya estaban"
            r: "main verb: they were now"
            under:
              - s: "todos los cuatro"
                r: "subject: all four"
                under:
                  - {s: "que venían a buscar a don Luis", r: "describes 'los cuatro': who had come looking for Don Luis"}
              - {s: "dentro de la venta", r: "where: inside the inn"}
              - {s: "y rodeados dél", r: "how: and round about him"}
              - s: "persuadiéndole"
                r: "how: urging him"
                under:
                  - s: "que luego ... volviese a consolar a su padre"
                    r: "what they urged: that he go back at once to console his father"
                    under:
                      - {s: "sin detenerse un punto", r: "how: without a moment's delay"}
        forms:
          - {w: "estaban", f: "est- + -aban → estar (to be), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "venían", f: "ven- + -ían → venir (to come), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "a don Luis", f: "the personal 'a': Spanish puts 'a' before a direct object that is a person. Same with 'a su padre'."}
          - {w: "rodeados", f: "rode- + -ados → rodear (to surround), participle, masculine plural to match 'los cuatro'."}
          - {w: "dél", f: "= de + él, 'of him'."}
          - {w: "persuadiéndole", f: "gerund of persuadir (to persuade) + le (him), accent added to keep the stress. 'le' for a male person as direct object is leísmo, normal in Cervantes."}
          - {w: "detenerse", f: "detener (to stop) + se (himself), infinitive after 'sin'."}
          - {w: "volviese", f: "volv- + -iese → volver (to go back), imperfect subjunctive (-se form), he. The -se imperfect subjunctive of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen. Subjunctive because it is what they urge him to do."}
      - es: "Él respondió que en ninguna manera lo podía hacer hasta dar fin a un negocio en que le iba la vida, la honra y el alma."
