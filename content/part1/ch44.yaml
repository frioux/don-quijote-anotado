                  - {s: "como la saeta al blanco, o como el marinero al norte", r: "how: like the arrow to the target, or the sailor to the North Star"}
        forms:
          - {w: "dejé", f: "dej- + -é → dejar (to leave), preterite, I. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "me puse", f: "pus- + -e → ponerse (to put on oneself), preterite, I, with 'me'. Irregular: puse, pusiste, puso, pusimos, pusisteis, pusieron."}
          - {w: "seguirla", f: "seguir (to follow) + la (her), the pronoun hung on the infinitive after 'para'."}
          - {w: "fuese", f: "fu- + -ese → ir (to go), imperfect subjunctive (-se form), she: fuese, fueses, fuese, fuésemos, fueseis, fuesen (the same forms as for ser, to be). Subjunctive after 'dondequiera que' (wherever), because the place is unknown."}
