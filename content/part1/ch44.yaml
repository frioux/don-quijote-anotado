          - {w: "son éstas", f: "son: ser (to be), present, they (soy, eres, es, somos, sois, son); éstas: este (this), feminine plural to match 'niñerías', with the accent once used on the pronoun."}
          - {w: "poderosas", f: "poder (power) + -oso → poderoso (powerful), feminine plural to match 'causas'."}
          - {w: "os hayan movido", f: "hay- + -an → haber (to have), present subjunctive, they (the causes), + movido, the participle of mover (to move): the perfect subjunctive 'may have moved'. haber in the present subjunctive: haya, hayas, haya, hayamos, hayáis, hayan. Subjunctive because the judge doubts any cause could be strong enough. 'os' = you (the judge speaks to Luis as 'vos')."}
          - {w: "desta", f: "= de + esta, 'of this'."}
