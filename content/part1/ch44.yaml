          - {w: "efetuar", f: "old spelling of efectuar (to carry out), infinitive after 'quisiera'."}
          - {w: "del cual", f: "de + el cual: 'of whom', masculine to match 'padre'; a heavier relative than 'que', used after a comma."}
          - {w: "sabía, pretendía", f: "sab- + -ía → saber (to know), imperfect, he (the judge), and pretend- + -ía → pretender (to aim at), imperfect, he (Don Luis's father). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "a su hijo", f: "the personal 'a' that marks a human object: 'hacer (to make) ... a su hijo' = to make his son."}
        note: "A 'título' was a titled noble (conde, marqués, duque), the top rank of the nobility. A rich father might hope to get his son such a title, or a marriage into a titled family; a judge's daughter, however respectable, was a lesser match."
  - sentences:
      - es: "Ya a esta sazón estaban en paz los huéspedes con el ventero, pues, por persuasión y buenas razones de don Quijote, más que por amenazas, le habían pagado todo lo que él quiso, y los criados de don Luis aguardaban el fin de la plática del oidor y la resolución de su amo, cuando el demonio, que no duerme, ordenó que en aquel mesmo punto entró en la venta el barbero a quien don Quijote quitó el yelmo de Mambrino y Sancho Panza los aparejos del asno, que trocó con los del suyo;"
        literal: "Already at this season were in peace the guests with the innkeeper, since, by persuasion and good reasons of Don Quijote, more than by threats, him they-had paid all that which he wanted, and the servants of Don Luis were-awaiting the end of the talk of-the judge and the resolution of their master, when the devil, who not sleeps, ordained that at that same point entered into the inn the barber from whom Don Quijote took the helmet of Mambrino and Sancho Panza the trappings of-the ass, which he-swapped with those of-the his-own;"
        ormsby: "The guests had by this time made peace with the landlord, for, by persuasion and Don Quixote’s fair words more than by threats, they had paid him what he demanded, and the servants of Don Luis were waiting for the end of the conversation with the Judge and their master’s decision, when the devil, who never sleeps, contrived that the barber, from whom Don Quixote had taken Mambrino’s helmet, and Sancho Panza the trappings of his ass in exchange for those of his own, should at this instant enter the inn;"
        vocab:
          - {w: "a esta sazón", d: "by this time, at this point ('sazón' = season, right moment)"}
          - {w: "huésped", d: "guest, lodger; here the travellers staying at the inn"}
          - {w: "razones", d: "words, arguments (not 'reasons' only)"}
          - {w: "amenaza", d: "threat"}
          - {w: "plática", d: "talk, conversation"}
          - {w: "oidor", d: "judge of an 'audiencia', one of the king's high courts; here Doña Clara's father"}
          - {w: "el demonio, que no duerme", d: "'the devil, who never sleeps', a proverbial phrase for mischief arriving at the worst moment"}
          - {w: "mesmo", d: "= mismo, same (old form)"}
          - {w: "punto", d: "moment, instant ('en aquel mesmo punto' = at that very moment)"}
          - {w: "yelmo", d: "helmet, the closed helmet of a knight"}
          - {w: "Mambrino", d: "a Moorish king in the Italian chivalric poems (Boiardo, Ariosto) whose enchanted helmet the hero Rinaldo won"}
          - {w: "aparejos", d: "harness, trappings of a pack animal"}
          - {w: "trocar", d: "to swap, exchange"}
        diagram:
          - s: "Ya a esta sazón estaban en paz los huéspedes con el ventero"
            r: "main verb 1: by now the guests were at peace with the innkeeper"
            under:
              - {s: "pues, por persuasión y buenas razones de don Quijote, más que por amenazas, le habían pagado todo lo que él quiso", r: "why: since, persuaded by Don Quijote's fair words rather than by threats, they had paid him all he asked"}
          - s: "y los criados de don Luis aguardaban"
            r: "main verb 2: and Don Luis's servants were waiting for"
            under:
              - {s: "el fin de la plática del oidor y la resolución de su amo", r: "object: the end of the judge's talk and their master's decision"}
              - s: "cuando el demonio"
