          - {w: "iba", f: "ir (to go), imperfect, it. Irregular: iba, ibas, iba, íbamos, ibais, iban. Singular although three nouns follow: the verb agrees with the nearest, 'la vida'."}
      - es: "Apretáronle entonces los criados, diciéndole que en ningún modo volverían sin él, y que le llevarían, quisiese o no quisiese."
        literal: "Pressed-him then the servants, saying-to-him that in no way they-would-return without him, and that him they-would-take, he-might-wish or not he-might-wish."
        ormsby: "The servants pressed him, saying that most certainly they would not return without him, and that they would take him away whether he liked it or not."
