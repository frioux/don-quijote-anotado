            r: "main verb: let it come, hand over"
            under:
              - {s: "mi bacía y mi albarda", r: "subject: my basin and my packsaddle"}
              - s: "con todos mis aparejos"
                r: "with what: with all my trappings"
                under:
                  - {s: "que me robastes", r: "describes 'aparejos': which you stole from me"}
        forms:
          - {w: "Venga", f: "veng- + -a → venir (to come), present subjunctive, it: 'let it come', a command. venir in the present subjunctive: venga, vengas, venga, vengamos, vengáis, vengan. Singular although two things follow: the verb agrees with the nearest one."}
          - {w: "mis", f: "mi (my) made plural to match 'aparejos', not the owner."}
          - {w: "me robastes", f: "rob- + -astes → robar (to rob), preterite, you (vos), with 'me' (from me). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron; in Cervantes' day the 'you' plural/vos ending was often -astes instead of -asteis."}
  - sentences:
