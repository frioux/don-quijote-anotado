  - sentences:
      - es: "— Deténgome —dijo don Quijote— porque no me es lícito poner mano a la espada contra gente escuderil; pero llamadme aquí a mi escudero Sancho, que a él toca y atañe esta defensa y venganza."
        literal: "— I-hold-myself-back —said Don Quijote— because not to-me it-is lawful to-put hand to the sword against people squirely; but call-me here [to] my squire Sancho, for to him touches and pertains this defence and vengeance."
        ormsby: "“I hesitate,” said Don Quixote, “because it is not lawful for me to draw sword against persons of squirely condition; but call my squire Sancho to me; for this defence and vengeance are his affair and business.”"
        vocab:
          - {w: "detenerse", d: "to stop, hold back"}
          - {w: "lícito", d: "lawful, permitted"}
          - {w: "escuderil", d: "squirely, of the rank of squires (i.e. not knights); a comic, rare adjective from 'escudero'"}
          - {w: "tocar a", d: "to fall to, be the business of ('a él toca' = it is up to him)"}
          - {w: "atañer", d: "to concern, pertain to (formal, legal-sounding; mostly in the he/it forms)"}
        diagram:
          - s: "Deténgome"
            r: "main verb 1: I am holding back"
            under:
              - {s: "dijo don Quijote", r: "speech tag: said Don Quijote"}
              - s: "porque no me es lícito"
                r: "why: because it is not lawful for me"
                under:
                  - {s: "poner mano a la espada contra gente escuderil", r: "what is not lawful: to draw my sword against people of squire's rank"}
          - s: "pero llamadme aquí a mi escudero Sancho"
            r: "main verb 2: but call my squire Sancho here for me"
            under:
              - {s: "que a él toca y atañe esta defensa y venganza", r: "why: for this defence and revenge are his business"}
        forms:
          - {w: "Deténgome", f: "deteng- + -o + me → detenerse (to hold back), present, I, with 'me' stuck on the end and an accent added: modern 'me detengo'. Like tener (to have): detengo, detienes, detiene, detenemos, detenéis, detienen. Cervantes hangs the pronoun on a verb that opens the sentence, as was the rule in his day."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son. 'no me es lícito' = it is not lawful for me."}
          - {w: "llamadme", f: "llam- + -ad + me → llamar (to call), imperative, you (vosotras, the women), with 'me' (for me) stuck on the end. The vosotros imperative swaps the final -r of the infinitive for -d: llamad, corred, decid."}
          - {w: "toca, atañe", f: "toc- + -a → tocar (to fall to) and atañ- + -e → atañer (to pertain), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an; of -er verbs: -o, -es, -e, -emos, -éis, -en. Singular although the subject is 'defensa y venganza', treated as one thing."}
          - {w: "esta", f: "est- + -a → este (this), feminine to match 'defensa'."}
        note: "By the laws of chivalry a knight did not fight men who were not knights; Don Quijote laid down the same rule after the beating by the Yanguesan carriers (chapter 15): against such people, Sancho must do the fighting. It is a convenient excuse here."
  - sentences:
      - es: "Esto pasaba en la puerta de la venta, y en ella andaban las puñadas y mojicones muy en su punto, todo en daño del ventero y en rabia de Maritornes, la ventera y su hija, que se desesperaban de ver la cobardía de don Quijote, y de lo mal que lo pasaba su marido, señor y padre."
        literal: "This was-happening at the door of the inn, and in it were-going the punches and cuffs very at their point, all to harm of-the innkeeper and to rage of Maritornes, the innkeeper's-wife and her daughter, who themselves were-despairing to see the cowardice of Don Quijote, and of how badly that it was-faring their husband, master and father."
        ormsby: "Thus matters stood at the inn-gate, where there was a very lively exchange of fisticuffs and punches, to the sore damage of the landlord and to the wrath of Maritornes, the landlady, and her daughter, who were furious when they saw the pusillanimity of Don Quixote, and the hard treatment their master, husband and father was undergoing."
        vocab:
          - {w: "puñada", d: "punch, blow with the fist ('puño')"}
          - {w: "mojicón", d: "a punch in the face, a cuff"}
          - {w: "andar", d: "here 'to be going on, be flying about' (of blows)"}
          - {w: "en su punto", d: "at its height, in full swing"}
          - {w: "en daño de", d: "to the harm of"}
          - {w: "desesperarse", d: "to be in despair, be beside oneself (with anger or frustration)"}
          - {w: "cobardía", d: "cowardice"}
          - {w: "pasarlo mal", d: "to have a bad time, fare badly"}
        diagram:
          - s: "Esto pasaba en la puerta de la venta"
            r: "main verb 1: this was happening at the inn door"
          - s: "andaban las puñadas y mojicones"
            r: "main verb 2 (after 'y'): punches and cuffs were flying"
            under:
              - {s: "en ella", r: "where: in it (the doorway)"}
              - {s: "muy en su punto", r: "how: in full swing"}
              - s: "todo en daño del ventero y en rabia de Maritornes, la ventera y su hija"
                r: "result: all to the innkeeper's harm and the rage of the three women"
                under:
                  - s: "que se desesperaban"
                    r: "describes the women: who were beside themselves"
                    under:
                      - {s: "de ver la cobardía de don Quijote", r: "why, 1: at seeing Don Quijote's cowardice"}
                      - {s: "y de lo mal que lo pasaba su marido, señor y padre", r: "why, 2: and at how badly their husband, master and father was faring"}
        forms:
          - {w: "pasaba", f: "pas- + -aba → pasar (to happen), imperfect, it. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "andaban", f: "and- + -aban → andar (to go about), imperfect, they (the blows). Same -aba imperfect."}
          - {w: "mojicones", f: "mojicón + -es → plural; the accent drops because the stress now falls regularly on the next-to-last syllable."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
          - {w: "se desesperaban", f: "desesper- + -aban → desesperarse (to despair), imperfect, they, with 'se'. Same -aba imperfect."}
          - {w: "lo mal que", f: "neuter 'lo' + adverb + que: 'how badly'. 'lo' before an adjective or adverb makes 'how (much)': lo mal que = how badly."}
          - {w: "lo pasaba", f: "pas- + -aba → pasarlo (to fare), imperfect, he, in the set phrase 'pasarlo mal' (to have a bad time); the 'lo' is a fixed, empty 'it'. Same -aba imperfect."}
          - {w: "su marido, señor y padre", f: "'su' serves all three: the landlady's husband, Maritornes' master, the daughter's father."}
  - sentences:
      - es: "Pero dejémosle aquí, que no faltará quien le socorra, o si no, sufra y calle el que se atreve a más de a lo que sus fuerzas le prometen, y volvámonos atrás cincuenta pasos, a ver qué fue lo que don Luis respondió al oidor, que le dejamos aparte, preguntándole la causa de su venida a pie y de tan vil traje vestido."
        literal: "But let-us-leave-him here, for not will-be-lacking who him may-succour, or if not, let-him-suffer and let-him-be-silent he who himself dares to more than to that which his strengths to-him promise, and let-us-turn-ourselves back fifty paces, to see what was that which Don Luis answered to-the judge, who him we-left apart, asking-him the cause of his coming on foot and of so vile dress dressed."
        ormsby: "But let us leave him there; for he will surely find someone to help him, and if not, let him suffer and hold his tongue who attempts more than his strength allows him to do; and let us go back fifty paces to see what Don Luis said in reply to the Judge whom we left questioning him privately as to his reasons for coming on foot and so meanly dressed."
        vocab:
          - {w: "no faltará quien", d: "'there will be no lack of someone who', i.e. someone is sure to"}
          - {w: "sufra y calle", d: "'let him suffer and keep quiet', a proverbial saying: he who takes on more than he can handle must bear the consequences"}
          - {w: "atreverse a", d: "to dare, venture on"}
          - {w: "volver atrás", d: "to go back"}
          - {w: "oidor", d: "a judge of a royal appeal court (audiencia); literally 'hearer'"}
          - {w: "aparte", d: "aside, apart (in private)"}
          - {w: "venida", d: "coming, arrival"}
          - {w: "vil", d: "base, mean, lowly (of clothes: shabby, below his rank)"}
          - {w: "traje", d: "dress, outfit, clothes"}
        diagram:
          - s: "Pero dejémosle aquí"
            r: "main verb 1: but let us leave him here"
            under:
              - {s: "que no faltará quien le socorra", r: "why: for someone is sure to help him"}
          - s: "o si no, sufra y calle"
            r: "main verb 2: or if not, let him suffer and keep quiet"
            under:
              - {s: "el que se atreve a más de a lo que sus fuerzas le prometen", r: "subject: whoever takes on more than his strength allows"}
          - s: "y volvámonos atrás cincuenta pasos"
            r: "main verb 3: and let us go back fifty paces"
            under:
              - s: "a ver qué fue lo"
                r: "why: to see what it was"
                under:
                  - s: "que don Luis respondió al oidor"
                    r: "describes 'lo': that Don Luis answered the judge"
                    under:
                      - s: "que le dejamos aparte"
                        r: "describes 'oidor': whom we left aside with him"
                        under:
                          - s: "preguntándole la causa"
                            r: "how we left him: asking him the reason"
                            under:
                              - {s: "de su venida a pie y de tan vil traje vestido", r: "describes 'causa': for his coming on foot and dressed in such mean clothes"}
        forms:
          - {w: "dejémosle", f: "dej- + -emos + le → dejar (to leave), present subjunctive, we: 'let us leave him', with 'le' (him) stuck on the end and an accent added. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. A 'let us' command always takes its pronouns on the end. 'le' for a male person where modern standard Spanish prefers 'lo' (leísmo)."}
          - {w: "faltará", f: "faltar- + -á → faltar (to be lacking), future, it. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "socorra", f: "socorr- + -a → socorrer (to help), present subjunctive, he (the someone). The present subjunctive of -er and -ir verbs: -a, -as, -a, -amos, -áis, -an. Subjunctive because 'quien' is someone not yet known."}
          - {w: "sufra, calle", f: "sufr- + -a → sufrir (to suffer) and call- + -e → callar (to be silent), present subjunctive, he: 'let him suffer and keep quiet', a wish or command for a third person. -ir verbs: -a, -as, -a, -amos, -áis, -an; -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "se atreve", f: "atrev- + -e → atreverse (to dare), present, he, with 'se'. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "prometen", f: "promet- + -en → prometer (to promise), present, they (his strengths). Same -er present."}
          - {w: "volvámonos", f: "volv- + -amos + nos → volverse (to turn back), present subjunctive, we: 'let us go back'. The final -s of -amos drops before 'nos' (volvamos + nos → volvámonos), with an accent added. The present subjunctive of -er verbs: -a, -as, -a, -amos, -áis, -an."}
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, it. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "dejamos", f: "dej- + -amos → dejar (to leave), preterite, we: 'we left'. In -ar verbs the 'we' form is the same in the present and the preterite; the sense decides. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "preguntándole", f: "gerund of preguntar (to ask) + le (him), with an accent added to keep the stress: 'asking him'."}
          - {w: "vestido", f: "participle of vestir (to dress), masculine to match Don Luis: 'dressed (in so mean a dress)'."}
        note: "The narrator steps forward like a storyteller managing several threads at once, abandoning the innkeeper mid-fight and 'going back fifty paces' to Don Luis, a mock version of the way the romances of chivalry break off one thread to take up another."
      - es: "A lo cual el mozo, asiéndole fuertemente de las manos, como en señal de que algún gran dolor le apretaba el corazón, y derramando lágrimas en grande abundancia, le dijo:"
        literal: "To that which the youth, seizing-him strongly by the hands, as in sign of that some great pain to-him was-squeezing the heart, and shedding tears in great abundance, to-him said:"
        ormsby: "To which the youth, pressing his hand in a way that showed his heart was troubled by some great sorrow, and shedding a flood of tears, made answer:"
        vocab:
          - {w: "mozo", d: "youth, young man (also 'servant, lad')"}
          - {w: "asir de", d: "to seize by, grip by"}
          - {w: "en señal de", d: "as a sign of"}
          - {w: "apretar", d: "to squeeze, press, grip; of grief, to weigh on"}
          - {w: "derramar lágrimas", d: "to shed tears"}
        diagram:
          - s: "le dijo"
            r: "main verb: said to him"
            under:
              - {s: "A lo cual", r: "to what: to which"}
              - {s: "el mozo", r: "subject: the youth (Don Luis)"}
              - s: "asiéndole fuertemente de las manos"
                r: "how, 1: gripping him tightly by the hands"
                under:
                  - {s: "como en señal de que algún gran dolor le apretaba el corazón", r: "how: as a sign that some great grief was squeezing his heart"}
              - {s: "y derramando lágrimas en grande abundancia", r: "how, 2: and shedding floods of tears"}
        forms:
          - {w: "asiéndole", f: "gerund of asir (to seize), + le (him) stuck on the end, with an accent added: 'seizing him'."}
          - {w: "fuertemente", f: "fuerte + -mente → fuerte (strong) made into an adverb, 'strongly, tightly'."}
          - {w: "algún gran", f: "alguno (some) and grande (great) both clipped before the masculine singular noun 'dolor'. Before a vowel, as in 'grande abundancia', Cervantes keeps the full 'grande'."}
          - {w: "apretaba", f: "apret- + -aba → apretar (to squeeze), imperfect, it (grief). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "derramando", f: "gerund of derramar (to shed): 'shedding'. -ar verbs take -ando."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Señor mío, yo no sé deciros otra cosa sino que desde el punto que quiso el cielo y facilitó nuestra vecindad que yo viese a mi señora doña Clara, hija vuestra y señora mía, desde aquel instante la hice dueño de mi voluntad;"
        literal: "— Sir mine, I not know-how to-tell-you other thing but that from the moment that willed the heaven and made-easy our neighbourhood that I might-see [to] my lady doña Clara, daughter yours and lady mine, from that instant her I-made owner of my will;"
        ormsby: "“Señor, I have no more to tell you than that from the moment when, through heaven’s will and our being near neighbours, I first saw Doña Clara, your daughter and my lady, from that instant I made her the mistress of my will,"
        vocab:
          - {w: "señor mío", d: "'my lord', 'sir' (a respectful address; the possessive after the noun is more emphatic)"}
          - {w: "no sé deciros otra cosa sino", d: "I can tell you nothing except; 'saber' + infinitive = to know how to, be able to"}
          - {w: "desde el punto que", d: "from the moment that"}
          - {w: "facilitar", d: "to make possible, make easy"}
          - {w: "vecindad", d: "being neighbours, neighbourhood: their houses are next to each other"}
          - {w: "doña", d: "title of respect for a lady of good family, used with the first name"}
          - {w: "dueño de mi voluntad", d: "'owner of my will', i.e. mistress of my heart: the love-poetry language of surrender. 'dueño' stays masculine even of a woman in this phrase"}
        diagram:
          - s: "yo no sé deciros otra cosa"
            r: "main verb 1: I can tell you nothing else"
            under:
              - {s: "Señor mío", r: "who he is talking to: my lord (the judge)"}
              - s: "sino que"
                r: "except: but that"
                under:
                  - s: "la hice dueño de mi voluntad"
                    r: "what he tells: I made her mistress of my will"
                    under:
                      - s: "desde el punto"
                        r: "when: from the moment"
                        under:
                          - s: "que quiso el cielo y facilitó nuestra vecindad"
                            r: "describes 'punto': when heaven willed and our being neighbours made it possible"
                            under:
                              - s: "que yo viese a mi señora doña Clara"
                                r: "what heaven willed: that I should see my lady Doña Clara"
                                under:
                                  - {s: "hija vuestra y señora mía", r: "describes 'doña Clara': your daughter and my lady"}
                      - {s: "desde aquel instante", r: "when, repeated: from that very instant"}
        forms:
          - {w: "sé", f: "saber (to know), present, I. Irregular: sé, sabes, sabe, sabemos, sabéis, saben. With an infinitive it means 'know how to, be able to'; the accent tells it from the pronoun 'se'."}
          - {w: "deciros", f: "decir (to say) + os (to you), the pronoun hung on the infinitive. He uses 'os' (vos) for the judge, a respectful 'you' between gentlemen."}
          - {w: "quiso", f: "quis- + -o → querer (to want, will), preterite, it (heaven). Irregular: quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "facilitó", f: "facilit- + -ó → facilitar (to make possible), preterite, it (our neighbourhood). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "viese", f: "v- + -iese → ver (to see), imperfect subjunctive (-se form), I: viese, vieses, viese, viésemos, vieseis, viesen. Subjunctive after 'quiso ... que' (willed that), in the past."}
          - {w: "a mi señora", f: "the personal 'a' that marks a human object: 'viese a ... doña Clara'."}
          - {w: "hija vuestra, señora mía", f: "the long possessives 'vuestra' (your) and 'mía' (my), placed after the noun and agreeing with it (feminine): more emphatic than 'vuestra hija', 'mi señora'."}
          - {w: "hice", f: "hic- + -e → hacer (to make), preterite, I. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
        note: "Don Luis is the young man disguised as a muleteer who sang the love songs to Doña Clara, the judge's daughter, in the night (chapter 43). He now asks her father for her hand, in the elaborate language of courtly love."
      - es: "y si la vuestra, verdadero señor y padre mío, no lo impide, en este mesmo día ha de ser mi esposa."
        literal: "and if the yours, true lord and father mine, not it prevents, on this same day she-has to be my wife."
