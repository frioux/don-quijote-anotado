          - {w: "dar fin a", d: "to finish, bring to an end"}
          - {w: "negocio", d: "matter, affair (not only a business deal)"}
          - {w: "irle a uno algo en", d: "to have something at stake in; 'le iba la vida' = his life was at stake"}
