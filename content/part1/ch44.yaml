  - sentences:
      - es: "— ¿Qué niñerías son éstas, señor don Luis, o qué causas tan poderosas, que os hayan movido a venir desta manera, y en este traje, que dice tan mal con la calidad vuestra?"
        literal: "— What childishnesses are these, sir Don Luis, or what causes so powerful, that you may-have moved to come of-this manner, and in this dress, that says so badly with the quality yours?"
