  - sentences:
      - es: "— ¡Aquí del rey y de la justicia, que, sobre cobrar mi hacienda, me quiere matar este ladrón salteador de caminos!"
        literal: "— Here of-the king and of the justice, for, over recovering my property, me wants to-kill this thief robber of roads!"
        ormsby: "“Here, in the name of the king and justice!” he cried, “this thief and highwayman wants to kill me for trying to recover my property.”"
        vocab:
          - {w: "¡Aquí del rey y de la justicia!", d: "the standard cry for help, calling bystanders and officers to come in the king's name"}
          - {w: "sobre", d: "here 'over, because of'"}
          - {w: "cobrar", d: "to recover, get back (not only 'to charge')"}
          - {w: "hacienda", d: "property, belongings"}
          - {w: "salteador de caminos", d: "highwayman, robber on the roads"}
        diagram:
          - s: "me quiere matar"
            r: "main verb: wants to kill me"
            under:
              - {s: "Aquí del rey y de la justicia", r: "cry for help: help, in the name of the king and the law!"}
              - {s: "sobre cobrar mi hacienda", r: "why: over my getting back my property"}
              - {s: "este ladrón salteador de caminos", r: "subject: this thieving highwayman"}
        forms:
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
          - {w: "cobrar", f: "infinitive of cobrar (to recover), after 'sobre'."}
          - {w: "me quiere matar", f: "quier- + -e → querer (to want), present, he, + matar (to kill), with 'me' placed before the whole group (modern Spanish also allows 'quiere matarme'). The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "este", f: "'this', masculine singular to match 'ladrón'."}
        note: "The barber does what a wronged party should: he raises the hue and cry in the king's name, making a matter of law out of a packsaddle."
  - sentences:
      - es: "— Mentís —respondió Sancho—, que yo no soy salteador de caminos; que en buena guerra ganó mi señor don Quijote estos despojos."
        literal: "— You-lie —answered Sancho—, for I not am robber of roads; for in good war won my lord Don Quijote these spoils."
        ormsby: "“You lie,” said Sancho, “I am no highwayman; it was in fair war my master Don Quixote won these spoils.”"
        vocab:
          - {w: "mentís", d: "'you lie': giving someone the lie was a grave insult, the classic cause of a duel"}
          - {w: "salteador de caminos", d: "highwayman, robber on the roads"}
          - {w: "en buena guerra", d: "in fair war, by the laws of war"}
          - {w: "despojos", d: "spoils, booty taken from a defeated enemy"}
        diagram:
          - s: "Mentís"
            r: "main verb: you lie"
            under:
