                  - {s: "verdadero señor y padre mío", r: "who he is talking to: my true lord and father"}
                  - {s: "no lo impide", r: "condition, the verb: does not prevent it"}
              - {s: "en este mesmo día", r: "when: this very day"}
        forms:
          - {w: "la vuestra", f: "article + long possessive, 'yours', feminine because it stands for 'voluntad' (will), the last word of the previous phrase."}
          - {w: "impide", f: "impid- + -e → impedir (to prevent), present, it (your will). The e of the stem becomes i when stressed: impido, impides, impide, impedimos, impedís, impiden."}
          - {w: "lo", f: "neuter 'it': the whole idea of the marriage."}
          - {w: "mesmo", f: "= mismo (same), masculine to match 'día'; the old form."}
          - {w: "ha de ser", f: "h- + -a → haber (to have), present, she: he, has, ha, hemos, habéis, han; + de + ser (to be): 'haber de' + infinitive = shall, is to. 'She is to be my wife.'"}
        note: "Calling the judge 'father' already is a bold lover's move: he speaks as if the marriage were settled."
      - es: "Por ella dejé la casa de mi padre, y por ella me puse en este traje, para seguirla dondequiera que fuese, como la saeta al blanco, o como el marinero al norte."
        literal: "For her I-left the house of my father, and for her myself I-put in this dress, to follow-her wherever that she-might-go, like the arrow to-the target, or like the sailor to-the north."
