  - sentences:
      - es: "— Aquí no hay que hacer otra cosa, señor don Luis, sino prestar paciencia y dar la vuelta a casa, si ya vuestra merced no gusta que su padre y mi señor la dé al otro mundo, porque no se puede esperar otra cosa de la pena con que queda por vuestra ausencia."
        literal: "— Here not there-is to do other thing, sir don Luis, but lend patience and give the turn to home, if already your grace not likes that your father and my lord it may-give to-the other world, because not itself can expect other thing from the grief with which he-remains through your absence."
        ormsby: "“There is nothing for it now, Señor Don Luis, but to submit quietly and return home, unless it is your wish that my lord, your father, should take his departure for the other world, for nothing else can be the consequence of the grief he is in at your absence.”"
        vocab:
