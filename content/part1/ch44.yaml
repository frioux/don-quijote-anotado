summary: |
  Don Quijote's bellowing wakes the inn. Maritornes slips into the hayloft and unties the halter, and he drops to the ground in front of the innkeeper and the four horsemen. Without a word he mounts Rocinante, takes up shield and lance, and challenges to single combat anyone who says he was rightly enchanted, provided Princess Micomicona allows it. The innkeeper tells the travellers he is mad, and they ask instead after a boy of about fifteen dressed as a mule-boy. Seeing the judge's coach, they set a guard on the gate and search the inn. Don Quijote, ignored, is furious, but his promise to the princess forbids any new adventure.

  One of the men finds the boy asleep beside a muleteer and seizes him: he is Don Luis, the singer of the night before, and the men are his father's servants, sent to bring him home. Don Luis refuses to go until he has settled a matter on which his life, honour and soul depend. The muleteer reports what he has heard, Cardenio and the others gather, Clara nearly faints on learning who has come, and the judge, recognising his neighbour's son, takes him aside. Don Luis tells him he has loved Clara since he first saw her, followed her in disguise, and asks to be accepted as his son-in-law, trusting that time will win over his own father. The judge, who sees what a good match it would be but would rather have the father's consent, asks him to keep his servants waiting for a day.

  Meanwhile two guests try to slip away without paying and are beating the innkeeper at the gate. His daughter begs Don Quijote to help; he answers gravely that he must first ask the princess's leave, goes and kneels to Dorotea for it, and then stops at the gate: he may not draw his sword on men below the rank of knight, and calls for Sancho. In the end the guests pay, won over more by Don Quijote's arguments than by threats.

  Then the barber whose basin and packsaddle were taken earlier walks into the inn, sees Sancho mending the packsaddle, and falls on him as a thief. Sancho bloodies his mouth, and the whole inn gathers. The barber swears the packsaddle and a new brass basin are his; Don Quijote, delighted with his squire's fighting and resolved to knight him one day, separates them and declares that the basin is the helmet of Mambrino, won in fair war, and that the packsaddle's change from a horse's trappings is one of the usual transformations of chivalry. Sancho has the 'helmet' brought, dubs it a 'baciyelmo', a basin-helmet, and recalls that it saved his master from the stones of the galley slaves.
context: |
  Rank, money and marriage. The four horsemen are servants of a rich Aragonese gentleman whose son has run away dressed as a mule-boy. The muleteer's first piece of news is that the man called the boy 'don': in Cervantes' Spain that title still marked real rank, and a 'don' asleep among muleteers is a scandal in itself. The judge, an 'oidor' (a judge of one of the royal high courts, the audiencias) on his way to a post in the Indies, sees at once that the match would suit his daughter; but Don Luis's father wants to 'hacer de título' his son, to marry him into the titled nobility of counts and marquises, a step above a judge's family. Marriage against a father's wishes was a serious matter for both families, which is why the judge wants the father's consent and Don Luis counts on time instead.

  The inn's own business runs alongside. Two guests try to leave without paying, and the innkeeper, 'who minded his own business more than other people's', is beaten for asking. Don Quijote's refusal to fight them rests on a rule he has stated before in the book: a knight may not lay hands on a sword against men who are not knights; that work belongs to his squire. He also cannot start a new adventure while bound by the boon he granted Princess Micomicona (Dorotea in her role), so he goes down on his knees to ask her leave in high chivalric language, the way knights in the romances ask a lady's permission.

  The narrator's games. 'Let us leave him here ... and go back fifty paces' is the interlaced storytelling of the romances of chivalry and of Ariosto, which keep several threads running and drop one at its most exciting point to pick up another. Here the joke is that the thread dropped is a man being punched at a gate, and the narrator abandons him with a proverb: let him who takes on more than his strength allows suffer in silence. 'The devil, who never sleeps' is a proverbial phrase for the mischance that brings the barber in at the worst moment.

  The basin and the packsaddle. The barber is the one Don Quijote attacked earlier on the road, taking his brass shaving basin for the enchanted helmet of Mambrino, a Moorish king in the Italian romances of Boiardo and Ariosto whose helmet Rinaldo won; Sancho took the barber's donkey trappings in exchange for his own. Now the stolen property walks back into the story, and the question of what a thing really is (basin or helmet, packsaddle or horse-trappings) becomes a public dispute in front of a judge, a priest and a crowd of witnesses. Don Quijote's answer is his usual one: such transformations happen in chivalry. Sancho, caught between his master and the evidence, coins 'baciyelmo', basin-helmet, and calls Mambrino 'Malino', a slip that sounds like 'maligno', the Evil One. The stones he remembers are those the galley slaves threw after Don Quijote freed them.

  Reading Cervantes' Spanish. The chapter is full of old spellings and forms: efeto (efecto), efetuar (efectuar), mesmo (mismo), recebir (recibir), disignio (designio), ligítimo (legítimo), encantamento (encantamiento), agora (ahora), do (donde), trujo (trajo), and the 'vosotros' preterites distes and robastes for disteis and robasteis. The contractions dél, della, dellos, deste and desta run through it, as does 'el albarda' for 'la albarda'. Don Quijote reaches for the language of the romances when he plays the knight: fermosa doncella, cuita, acorrer, de hinojos, la su grandeza, rieto, and armalle with -rl- turned into -ll-; to the innkeeper's daughter he answers with the lawcourt formula 'no ha lugar'. Pronouns hang on the end of verbs that open a clause (Preguntáronle, Limpióse, Apretáronle, Muévenos, Miróle, conocióle, Besóle, túvole). The future subjunctive marks open possibilities (dijere, quisiere, ordenare, diere, bastare, pudiere, gustare, hubieren enviado), the -ra form serves as a conditional (hallara, embistiera, hiciera, diera, pudiera), and 'haber de' means 'to be bound to'. Watch the false friends: voces (shouts), luego (at once), entretenerse (to hold out), entretener (to keep someone occupied), virtud (power), ofender (to strike), and escudo (a gold coin as well as a shield).
