          - {w: "vuestras mercedes", d: "'your worships', the polite plural 'you', which takes the they-form of the verb"}
          - {w: "con qué cara", d: "'with what face': with what nerve, how dare he"}
          - {w: "escudero", d: "squire; here the barber, whom Don Quijote takes for the beaten knight's squire"}
        diagram:
          - s: "Miren vuestras mercedes"
            r: "main verb: look, your worships"
            under:
              - s: "con qué cara podía decir este escudero"
                r: "what to look at: with what nerve this squire could say"
                under:
                  - {s: "que ésta es bacía", r: "what he said: that this is a basin"}
                  - {s: "y no el yelmo que yo he dicho", r: "and not: and not the helmet I have said it is"}
