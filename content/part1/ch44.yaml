  - sentences:
      - es: "— ¡Pardiez, señor —dijo Sancho—, si no tenemos otra prueba de nuestra intención que la que vuestra merced dice, tan bacía es el yelmo de Malino como el jaez deste buen hombre albarda!"
        literal: "— By-God, sir —said Sancho—, if not we-have other proof of our claim than that which your worship says, as-much basin is the helmet of Malino as the trappings of-this good man packsaddle!"
        ormsby: "“Egad, master,” said Sancho, “if we have no other proof of our case than what your worship puts forward, Mambrino’s helmet is just as much a basin as this good fellow’s caparison is a packsaddle.”"
        vocab:
          - {w: "pardiez", d: "egad, by heaven: a softened 'por Dios'"}
          - {w: "intención", d: "here 'case, claim', in the legal sense"}
          - {w: "vuestra merced", d: "'your worship', the polite 'you', which takes the he-form of the verb"}
          - {w: "tan ... como", d: "as much ... as"}
          - {w: "Malino", d: "Sancho's garbling of 'Mambrino'; 'malino' was also a popular form of 'maligno', the Evil One"}
          - {w: "jaez", d: "the trappings of a horse, caparison"}
          - {w: "deste", d: "= de este, of this (old contraction)"}
        diagram:
          - s: "tan bacía es el yelmo de Malino"
            r: "main verb: Malino's helmet is just as much a basin"
            under:
              - {s: "Pardiez, señor", r: "exclamation and address: egad, sir"}
              - {s: "dijo Sancho", r: "speaker"}
              - s: "si no tenemos otra prueba de nuestra intención"
                r: "condition: if we have no other proof of our case"
                under:
                  - {s: "que la que vuestra merced dice", r: "than what: than the one your worship gives"}
              - {s: "como el jaez deste buen hombre albarda", r: "compared with: as this good fellow's caparison is a packsaddle ('es' understood)"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "tenemos", f: "ten- + -emos → tener (to have), present, we. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "nuestra", f: "nuestr- + -a → nuestro (our), feminine to match 'intención'."}
          - {w: "la que", f: "'the one that': 'la' stands for 'prueba' (proof)."}
          - {w: "dice", f: "dic- + -e → decir (to say), present, he: 'vuestra merced' takes the he-form. decir in the present: digo, dices, dice, decimos, decís, dicen."}
          - {w: "es", f: "ser (to be), present, it. Irregular: soy, eres, es, somos, sois, son. It serves twice: '(es) albarda' at the end is understood."}
          - {w: "deste", f: "de + este (this), the old contraction, masculine to match 'hombre'."}
        note: "Sancho's comparison cuts against his master: the trappings plainly are a packsaddle, so by the same measure the helmet is plainly a basin. Ormsby quietly corrects 'Malino' to 'Mambrino'."
  - sentences:
      - es: "— Haz lo que te mando —replicó don Quijote—, que no todas las cosas deste castillo han de ser guiadas por encantamento."
        literal: "— Do that which to-you I-order —replied Don Quijote—, for not all the things of-this castle have to be guided by enchantment."
        ormsby: "“Do as I bid thee,” said Don Quixote; “it cannot be that everything in this castle goes by enchantment.”"
        vocab:
          - {w: "replicar", d: "to reply, retort"}
          - {w: "deste", d: "= de este, of this (old contraction)"}
          - {w: "castillo", d: "castle: Don Quijote's name for the inn"}
          - {w: "haber de", d: "must, have to, be bound to"}
          - {w: "encantamento", d: "= encantamiento, enchantment (old form)"}
        diagram:
          - s: "Haz"
            r: "main verb: do (a command)"
            under:
              - {s: "lo que te mando", r: "object: what I order you"}
              - {s: "replicó don Quijote", r: "speaker"}
              - {s: "que no todas las cosas deste castillo han de ser guiadas por encantamento", r: "why: for not everything in this castle has to go by enchantment"}
        forms:
          - {w: "Haz", f: "hacer (to do), imperative, you (tú). One of the short irregular tú commands: haz, pon, ten, ven, di, sal."}
          - {w: "te mando", f: "mand- + -o → mandar (to order), present, I, with 'te' (to you): he speaks to Sancho as tú. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "deste", f: "de + este (this), the old contraction, masculine to match 'castillo'."}
          - {w: "han de ser guiadas", f: "han → haber (to have), present, they: he, has, ha, hemos, habéis, han. 'haber de' + infinitive = must, are to. 'ser guiadas' is the passive, 'be guided': ser (to be) + guiadas, the participle of guiar (to guide), feminine plural to match 'cosas'."}
        note: "A rare moment of doubt: Don Quijote, who blamed enchanters for the strange things of this inn on his first visit, now insists that not everything here can be enchantment, so the helmet must be real."
