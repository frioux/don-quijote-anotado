        vocab:
          - {w: "niñería", d: "childish prank, piece of foolishness"}
          - {w: "desta", d: "= de esta, of this (old contraction)"}
          - {w: "traje", d: "dress, outfit, costume"}
          - {w: "decir mal con", d: "to go badly with, be unsuited to"}
          - {w: "calidad", d: "rank, social standing (false friend: not 'quality')"}
