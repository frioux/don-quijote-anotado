  - sentences:
      - es: "— ¿Qué habéis de querer, o qué ha de ordenar el cielo, fuera de consentir en volveros?; porque no ha de ser posible otra cosa."
        literal: "— What have-you to want, or what has to ordain the heaven, outside of consenting in returning-yourself?; because not has to be possible other thing."
        ormsby: "“What can you please or heaven order,” said the other, “except to agree to go back? Anything else is impossible.”"
        vocab:
          - {w: "haber de", d: "to be going to, must, be bound to; '¿qué habéis de querer?' = what could you possibly want?"}
          - {w: "fuera de", d: "apart from, except"}
          - {w: "consentir en", d: "to agree to, consent to"}
          - {w: "volverse", d: "to go back, return"}
        diagram:
          - s: "¿Qué habéis de querer"
            r: "main verb 1: what can you want"
          - s: "o qué ha de ordenar el cielo"
            r: "main verb 2: or what can heaven ordain"
            under:
              - {s: "fuera de consentir en volveros?", r: "except: other than agreeing to go back"}
          - s: "porque no ha de ser posible otra cosa"
            r: "main verb 3 (reason): because nothing else will be possible"
        forms:
          - {w: "habéis de querer", f: "hab- + -éis → haber (to have), present, you (vos), + de + querer (to want): 'haber de' = to be bound to. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "ha de ordenar", f: "ha (haber, to have, present, it: he, has, ha, hemos, habéis, han) + de + ordenar (to ordain): 'is heaven to ordain'."}
          - {w: "consentir", f: "infinitive of consentir (to agree), after 'fuera de'."}
          - {w: "volveros", f: "volver (to go back) + os (yourself), the pronoun hung on the infinitive after 'en'; 'os' goes with 'vos'."}
          - {w: "ha de ser", f: "ha (haber, to have, present, it) + de + ser (to be): 'will be, can be'. haber in the present: he, has, ha, hemos, habéis, han."}
        note: "Ormsby adds 'said the other' to show the speaker; the Spanish has no speech tag. It is the servant answering don Luis."
