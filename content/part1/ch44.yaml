          - {w: "quisiere", f: "quis- + -iere → querer (to want), future subjunctive, I: 'as I may wish'. Built on the preterite quisieron: quisiere, quisieres, quisiere, quisiéremos, quisiereis, quisieren. Cervantes uses the future subjunctive after 'como', 'si', 'lo que' for an open future; modern Spanish uses the present subjunctive 'quiera'."}
