  - sentences:
      - es: "— Por cierto, señor don Luis, que responde bien a quien vos sois el hábito que tenéis, y que dice bien la cama en que os hallo al regalo con que vuestra madre os crió."
        literal: "— Indeed, sir don Luis, that answers well to who you are the dress that you-have, and that says well the bed in which you I-find to-the pampering with which your mother you reared."
        ormsby: "“It becomes you well indeed, Señor Don Luis, to be in the dress you wear, and well the bed in which I find you agrees with the luxury in which your mother reared you.”"
        vocab:
          - {w: "por cierto", d: "indeed, to be sure (here ironic)"}
          - {w: "responder a", d: "to correspond to, be in keeping with"}
          - {w: "hábito", d: "dress, clothes (not 'habit' in the sense of custom)"}
          - {w: "decir bien con", d: "to go well with, suit, match ('dice bien ... al regalo')"}
          - {w: "regalo", d: "comfort, luxury, pampering (false friend: here not 'gift')"}
          - {w: "criar", d: "to bring up, rear"}
          - {w: "vos", d: "'you', said to one person, with the plural verb forms ('vos sois', 'tenéis'); here a servant speaking respectfully to his master's son"}
        diagram:
          - s: "responde bien"
            r: "main verb 1: corresponds well"
            under:
              - {s: "Por cierto", r: "how: indeed (ironic)"}
              - {s: "a quien vos sois", r: "to what: to who you are"}
              - s: "el hábito"
                r: "subject: the clothes"
                under:
                  - {s: "que tenéis", r: "describes 'hábito': that you have on"}
          - s: "y que dice bien la cama"
            r: "main verb 2: and the bed matches well"
            under:
              - {s: "en que os hallo", r: "describes 'cama': in which I find you"}
              - s: "al regalo"
                r: "with what: the comfort"
                under:
                  - {s: "con que vuestra madre os crió", r: "describes 'regalo': in which your mother brought you up"}
        forms:
          - {w: "responde", f: "respond- + -e → responder (to answer, correspond), present, it (the dress). The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "sois", f: "ser (to be), present, you (vos). Irregular: soy, eres, es, somos, sois, son. With 'vos' the plural form is used even for one person."}
          - {w: "tenéis", f: "ten- + -éis → tener (to have), present, you (vos). Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "dice", f: "dic- + -e → decir (to say), present, it (the bed): 'decir bien con' = to suit. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "os", f: "'you' as object, the pronoun that goes with 'vos'."}
          - {w: "hallo", f: "hall- + -o → hallar (to find), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "al", f: "a + el: 'to the (comfort)'."}
          - {w: "crió", f: "cri- + -ó → criar (to bring up), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
        note: "Pure irony: the son of a rich noble house is found in mule-boy's clothes on a mule-boy's straw bed. The opening 'que' simply introduces the remark, as in spoken Spanish."
  - sentences:
      - es: "Limpióse el mozo los soñolientos ojos y miró de espacio al que le tenía asido, y luego conoció que era criado de su padre, de que recibió tal sobresalto, que no acertó o no pudo hablarle palabra por un buen espacio. Y el criado prosiguió diciendo:"
        literal: "Wiped-himself the lad the sleepy eyes and looked slowly at-the [one] who him had gripped, and at-once he-recognized that he-was servant of his father, from which he-received such [a] start, that not he-managed or not he-could speak-to-him word for a good space. And the servant continued saying:"
        ormsby: "The youth rubbed his sleepy eyes and stared for a while at him who held him, but presently recognised him as one of his father’s servants, at which he was so taken aback that for some time he could not find or utter a word; while the servant went on to say,"
        vocab:
          - {w: "limpiarse los ojos", d: "to wipe or rub one's eyes"}
          - {w: "soñoliento", d: "sleepy, drowsy"}
          - {w: "de espacio", d: "slowly, at length (modern 'despacio')"}
          - {w: "tener asido", d: "to have hold of, keep gripped ('asir' = to seize)"}
          - {w: "luego", d: "at once, immediately (not 'later')"}
          - {w: "conocer", d: "here 'to recognize'"}
          - {w: "criado", d: "servant (false friend: not 'created')"}
          - {w: "sobresalto", d: "start, sudden fright"}
          - {w: "acertar a", d: "to manage to, succeed in (doing)"}
          - {w: "por un buen espacio", d: "for a good while"}
          - {w: "proseguir", d: "to go on, continue (speaking)"}
