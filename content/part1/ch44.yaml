            under:
              - {s: "diciendo:", r: "how: saying (the next paragraph)"}
        forms:
          - {w: "Limpióse", f: "limpi- + -ó + se → limpiarse (to wipe oneself), preterite, he, with 'se' stuck on the end; modern 'se limpió'. Cervantes hangs the pronoun on a verb that opens the sentence. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. With 'se', Spanish says 'wiped himself the eyes' where English says 'his eyes'."}
