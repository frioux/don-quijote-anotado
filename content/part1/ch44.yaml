part: 1
chapter: 44
title_es: "Capítulo XLIV. Donde se prosiguen los inauditos sucesos de la venta"
title_en: "In which are continued the unheard-of adventures of the inn"
paragraphs:
  - sentences:
      - es: "En efeto, fueron tantas las voces que don Quijote dio, que, abriendo de presto las puertas de la venta, salió el ventero, despavorido, a ver quién tales gritos daba, y los que estaban fuera hicieron lo mesmo."
        literal: "In effect, were so-many the shouts that Don Quijote gave, that, opening quickly the doors of the inn, came-out the innkeeper, terrified, to see who such cries was-giving, and those who were outside did the same."
        ormsby: "So loud, in fact, were the shouts of Don Quixote, that the landlord opening the gate of the inn in all haste, came out in dismay, and ran to see who was uttering such cries, and those who were outside joined him."
        vocab:
          - {w: "en efeto", d: "= en efecto, in fact, indeed (old spelling 'efeto' for 'efecto')"}
          - {w: "voces", d: "shouts, cries (not only 'voices'); 'dar voces' = to shout"}
          - {w: "de presto", d: "quickly, in haste (old-fashioned)"}
          - {w: "ventero", d: "innkeeper, landlord of a 'venta' (a roadside inn)"}
          - {w: "despavorido", d: "terrified, in a fright"}
          - {w: "dar gritos", d: "to cry out, shout"}
          - {w: "mesmo", d: "= mismo, same (old form); 'hacer lo mesmo' = to do the same"}
        diagram:
          - s: "fueron tantas las voces"
            r: "main verb 1: so many were the shouts"
            under:
              - {s: "En efeto", r: "linking: in fact"}
              - {s: "que don Quijote dio", r: "describes 'voces': that Don Quijote gave"}
              - s: "que, abriendo de presto las puertas de la venta, salió el ventero"
                r: "result: that the innkeeper came out, flinging open the doors"
                under:
                  - {s: "despavorido", r: "how: terrified"}
                  - {s: "a ver quién tales gritos daba", r: "why: to see who was shouting so"}
          - s: "y los que estaban fuera hicieron lo mesmo"
            r: "main verb 2 (still part of the result): and those outside did the same"
        forms:
          - {w: "efeto", f: "old spelling of efecto (effect): Cervantes often drops the c before t (efeto, perfeto, dotor)."}
          - {w: "fueron", f: "fue- + -ron → ser (to be), preterite, they: 'were'. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron. The subject 'las voces' comes after the verb."}
          - {w: "tantas", f: "tant- + -as → tanto (so many), feminine plural to match 'voces'; it sets up the result clause 'que ...'."}
          - {w: "dio", f: "di- + -o → dar (to give), preterite, he. Irregular: di, diste, dio, dimos, disteis, dieron. 'dar voces' = to shout."}
          - {w: "abriendo", f: "abr- + -iendo → gerund of abrir (to open): 'opening'."}
          - {w: "salió", f: "sal- + -ió → salir (to go out), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "despavorido", f: "participle of despavorir (to terrify), used as an adjective, masculine to match 'el ventero'."}
          - {w: "tales", f: "plural of tal (such), to match 'gritos'; placed before the verb for emphasis: 'quién tales gritos daba' = who was giving such cries."}
          - {w: "daba", f: "d- + -aba → dar (to give), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "estaban", f: "est- + -aban → estar (to be), imperfect, they. Same -aba imperfect: estaba, estabas, estaba, estábamos, estabais, estaban."}
          - {w: "hicieron", f: "hic- + -ieron → hacer (to do), preterite, they. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "mesmo", f: "= mismo (same); 'lo mesmo' with neuter 'lo' = the same thing."}
        note: "At the end of the previous chapter Maritornes tied Don Quijote's wrist to the hayloft window while he stood on Rocinante; at dawn four horsemen arrived, Rocinante moved, and he was left dangling by one arm and bellowing."
      - es: "Maritornes, que ya había despertado a las mismas voces, imaginando lo que podía ser, se fue al pajar y desató, sin que nadie lo viese, el cabestro que a don Quijote sostenía, y él dio luego en el suelo, a vista del ventero y de los caminantes, que, llegándose a él, le preguntaron qué tenía, que tales voces daba."
        literal: "Maritornes, who already had awakened at the same shouts, imagining that which it-could be, herself went to-the hayloft and untied, without that anyone it might-see, the halter that Don Quijote was-holding-up, and he gave at-once on the ground, in sight of-the innkeeper and of the travellers, who, drawing-themselves-near to him, him asked what he-had, that such shouts he-was-giving."
        ormsby: "Maritornes, who had been by this time roused up by the same outcry, suspecting what it was, ran to the loft and, without anyone seeing her, untied the halter by which Don Quixote was suspended, and down he came to the ground in the sight of the landlord and the travellers, who approaching asked him what was the matter with him that he shouted so."
        vocab:
          - {w: "Maritornes", d: "the Asturian serving-girl of the inn, who played the trick of tying Don Quijote up"}
          - {w: "pajar", d: "hayloft, straw loft"}
          - {w: "desatar", d: "to untie"}
          - {w: "cabestro", d: "halter, a rope for leading a beast; here the rope round his wrist"}
          - {w: "dar en el suelo", d: "to fall to the ground, hit the ground"}
          - {w: "luego", d: "at once, immediately (the usual sense in Cervantes, not 'later')"}
          - {w: "a vista de", d: "in sight of, before the eyes of"}
          - {w: "caminante", d: "traveller, wayfarer"}
          - {w: "llegarse a", d: "to come up to, approach"}
          - {w: "¿qué tiene?", d: "what is the matter with him?"}
        diagram:
          - s: "se fue al pajar"
            r: "main verb 1: Maritornes went off to the hayloft"
            under:
              - {s: "Maritornes", r: "subject"}
              - {s: "que ya había despertado a las mismas voces", r: "describes 'Maritornes': who had already woken at the same shouts"}
              - {s: "imaginando lo que podía ser", r: "how: guessing what it might be"}
          - s: "y desató"
            r: "main verb 2: and untied"
            under:
              - {s: "sin que nadie lo viese", r: "how: without anyone seeing it"}
              - s: "el cabestro"
                r: "object: the halter"
                under:
                  - {s: "que a don Quijote sostenía", r: "describes 'cabestro': that was holding Don Quijote up"}
          - s: "y él dio luego en el suelo"
            r: "main verb 3: and he at once hit the ground"
            under:
              - s: "a vista del ventero y de los caminantes"
                r: "where: in sight of the innkeeper and travellers"
                under:
                  - s: "que, llegándose a él, le preguntaron"
                    r: "describes 'caminantes': who came up and asked him"
                    under:
                      - {s: "qué tenía", r: "what they asked: what was the matter"}
                      - {s: "que tales voces daba", r: "why they asked: since he was shouting so"}
        forms:
          - {w: "había despertado", f: "hab- + -ía → haber (to have), imperfect, she, + despertado, participle of despertar (to wake): the pluperfect, 'had woken'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "mismas", f: "mism- + -as → mismo (same), feminine plural to match 'voces'."}
          - {w: "imaginando", f: "imagin- + -ando → gerund of imaginar (to imagine): 'guessing'."}
          - {w: "podía", f: "pod- + -ía → poder (to be able), imperfect, it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "se fue", f: "fu- + -e → irse (to go off), preterite, she, with 'se'. ir in the preterite: fui, fuiste, fue, fuimos, fuisteis, fueron (the same forms as ser)."}
          - {w: "al", f: "a + el, 'to the'."}
          - {w: "desató", f: "desat- + -ó → desatar (to untie), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "viese", f: "vi- + -ese → ver (to see), imperfect subjunctive (-se form), anyone: required after 'sin que' (without). viese, vieses, viese, viésemos, vieseis, viesen."}
          - {w: "a don Quijote sostenía", f: "sosten- + -ía → sostener (to hold up), imperfect, it (the halter). Same -ía imperfect: sostenía, sostenías, sostenía, sosteníamos, sosteníais, sostenían. The object comes first with personal 'a' (used before a person), the verb last."}
          - {w: "dio", f: "di- + -o → dar (to give), preterite, he: 'dar en el suelo' = to hit the ground. Irregular: di, diste, dio, dimos, disteis, dieron."}
          - {w: "del", f: "de + el, 'of the'."}
          - {w: "llegándose", f: "lleg- + -ando + se → gerund of llegarse (to come near), with 'se' hung on the end; accent added to keep the stress."}
          - {w: "preguntaron", f: "pregunt- + -aron → preguntar (to ask), preterite, they. Same -ar preterite: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, he: '¿qué tenía?' = what was wrong with him. Same -ía imperfect."}
          - {w: "daba", f: "d- + -aba → dar (to give), imperfect, he: 'voces daba' = he was shouting. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
      - es: "Él, sin responder palabra, se quitó el cordel de la muñeca, y, levantándose en pie, subió sobre Rocinante, embrazó su adarga, enristró su lanzón, y, tomando buena parte del campo, volvió a medio galope, diciendo:"
        literal: "He, without answering word, himself took-off the cord from the wrist, and, raising-himself on foot, climbed upon Rocinante, braced his shield, couched his big-lance, and, taking good part of-the field, came-back at half gallop, saying:"
        ormsby: "He without replying a word took the rope off his wrist, and rising to his feet leaped upon Rocinante, braced his buckler on his arm, put his lance in rest, and making a considerable circuit of the plain came back at a half-gallop exclaiming:"
        vocab:
          - {w: "sin responder palabra", d: "without answering a word"}
          - {w: "cordel", d: "cord, thin rope"}
          - {w: "muñeca", d: "wrist (also 'doll')"}
          - {w: "levantarse en pie", d: "to get to one's feet"}
          - {w: "Rocinante", d: "Don Quijote's bony old horse"}
          - {w: "embrazar", d: "to put (a shield) on one's arm, brace a shield"}
          - {w: "adarga", d: "an oval leather shield of Moorish origin"}
          - {w: "enristrar", d: "to couch a lance, set it in the rest ('ristre') for a charge"}
          - {w: "lanzón", d: "a big lance, or a short thick pike; '-ón' makes it large"}
          - {w: "tomar del campo", d: "to take ground, ride off a distance to get room for a charge (a jousting term)"}
          - {w: "a medio galope", d: "at a half-gallop, a canter"}
        diagram:
          - s: "se quitó el cordel de la muñeca"
            r: "main verb 1: he took the cord off his wrist"
            under:
              - {s: "Él", r: "subject of all the verbs"}
              - {s: "sin responder palabra", r: "how: without a word"}
          - s: "subió sobre Rocinante"
            r: "main verb 2: he got up on Rocinante"
            under:
              - {s: "levantándose en pie", r: "first: getting to his feet"}
          - {s: "embrazó su adarga", r: "main verb 3: he braced his shield"}
          - {s: "enristró su lanzón", r: "main verb 4: he couched his lance"}
          - s: "volvió a medio galope"
            r: "main verb 5: he came back at a half-gallop"
            under:
              - {s: "tomando buena parte del campo", r: "first: riding off a good way across the field"}
              - {s: "diciendo:", r: "how: saying (the next paragraph)"}
        forms:
          - {w: "responder", f: "infinitive of responder (to answer), after 'sin' (without)."}
          - {w: "se quitó", f: "quit- + -ó → quitarse (to take off oneself), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. With 'se', 'the cord off himself'."}
          - {w: "levantándose", f: "levant- + -ando + se → gerund of levantarse (to get up), 'se' hung on the end, accent added."}
          - {w: "subió", f: "sub- + -ió → subir (to climb), preterite, he. The preterite of -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "embrazó, enristró", f: "embraz- + -ó → embrazar (to brace a shield) and enristr- + -ó → enristrar (to couch a lance), both preterite, he. Same -ar preterite: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "lanzón", f: "lanz- + -ón → lanza (lance) with the augmentative '-ón', 'big lance'; the word turns masculine."}
          - {w: "tomando", f: "tom- + -ando → gerund of tomar (to take): 'taking'."}
          - {w: "volvió", f: "volv- + -ió → volver (to come back), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "diciendo", f: "gerund of decir (to say): the e of the stem turns to i, 'saying'."}
  - sentences:
      - es: "— Cualquiera que dijere que yo he sido con justo título encantado, como mi señora la princesa Micomicona me dé licencia para ello, yo le desmiento, le rieto y desafío a singular batalla."
        literal: "— Whoever that may-say that I have been with just title enchanted, provided-that my lady the princess Micomicona me may-give leave for it, I him give-the-lie, him I-challenge and defy to single battle."
        ormsby: "“Whoever shall say that I have been enchanted with just cause, provided my lady the Princess Micomicona grants me permission to do so, I give him the lie, challenge him and defy him to single combat.”"
        vocab:
          - {w: "cualquiera que", d: "whoever, anyone who"}
          - {w: "con justo título", d: "rightfully, with just cause (a legal phrase: 'with good title')"}
          - {w: "encantado", d: "enchanted, put under a spell"}
          - {w: "como", d: "here 'provided that, as long as' (with the subjunctive)"}
          - {w: "Micomicona", d: "the name of the African princess of the kingdom of Micomicón, a part Dorotea is playing to lure Don Quijote home"}
          - {w: "licencia", d: "leave, permission (not a 'licence' document)"}
          - {w: "desmentir", d: "to give the lie, call someone a liar: the formal insult that led to a duel"}
          - {w: "rieto", d: "old form of 'reto', I challenge, from 'retar'; a formal knightly challenge"}
          - {w: "desafiar", d: "to defy, challenge to combat"}
          - {w: "singular batalla", d: "single combat, a duel between two"}
        diagram:
          - s: "yo le desmiento, le rieto y desafío a singular batalla"
            r: "main verbs: I give him the lie, challenge and defy him to single combat"
            under:
              - s: "Cualquiera"
                r: "the 'him' of 'le', put first: anyone"
                under:
                  - {s: "que dijere que yo he sido con justo título encantado", r: "describes 'Cualquiera': who may say that I was rightly enchanted"}
              - {s: "como mi señora la princesa Micomicona me dé licencia para ello", r: "condition: provided my lady the princess gives me leave"}
        forms:
          - {w: "Cualquiera", f: "cual (which) + quiera (from querer, to want): 'whichever, whoever'."}
          - {w: "dijere", f: "dij- + -ere → decir (to say), future subjunctive, he: 'whoever may say'. Built on the preterite dijeron: dijere, dijeres, dijere, dijéremos, dijereis, dijeren. Cervantes uses the future subjunctive after 'cualquiera que', 'si', 'lo que' for an open future; modern Spanish uses the present subjunctive 'diga'."}
          - {w: "he sido", f: "he (haber, to have, present, I) + sido (participle of ser, to be): the present perfect, 'I have been'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "encantado", f: "participle of encantar (to enchant), masculine to match 'yo'; with 'he sido' it makes a passive, 'I have been enchanted'."}
          - {w: "dé", f: "d- + -é → dar (to give), present subjunctive, she: subjunctive after 'como' meaning 'provided that'. dé, des, dé, demos, deis, den."}
          - {w: "desmiento", f: "desmient- + -o → desmentir (to give the lie), present, I. The stem e becomes ie when stressed: desmiento, desmientes, desmiente, desmentimos, desmentís, desmienten."}
          - {w: "rieto", f: "old present, I, of retar (to challenge): modern 'reto'. The medieval verb was 'reptar' with a stressed 'ie' stem; the modern forms are reto, retas, reta, retamos, retáis, retan."}
          - {w: "desafío", f: "desafí- + -o → desafiar (to defy), present, I. desafío, desafías, desafía, desafiamos, desafiáis, desafían (the í carries the stress)."}
          - {w: "le", f: "'him', the indirect-object pronoun picking up 'Cualquiera'; Spanish repeats the person already named with a pronoun before the verb."}
        note: "The 'como' clause is comically misplaced: Don Quijote means that he will fight anyone who says he was enchanted, as soon as Micomicona releases him from his promise not to undertake other adventures, but it reads as if he needed her leave to be enchanted. The 'desmentir' and the 'reto' were the formal steps of a challenge to a duel."
  - sentences:
      - es: "Admirados se quedaron los nuevos caminantes de las palabras de don Quijote, pero el ventero les quitó de aquella admiración, diciéndoles que era don Quijote, y que no había que hacer caso dél, porque estaba fuera de juicio."
        literal: "Amazed themselves remained the new travellers at the words of Don Quijote, but the innkeeper them took-away from that amazement, telling-them that he-was Don Quijote, and that not there-was [reason] to make case of-him, because he-was out of judgment."
        ormsby: "The newly arrived travellers were amazed at the words of Don Quixote; but the landlord removed their surprise by telling them who he was, and not to mind him as he was out of his senses."
        vocab:
          - {w: "admirado", d: "amazed, astonished (not 'admired')"}
          - {w: "quedarse", d: "to be left, remain; 'admirados se quedaron' = they were left amazed"}
          - {w: "admiración", d: "amazement, wonder (false friend: not 'admiration')"}
          - {w: "quitar de", d: "to take (someone) out of (a state); here, to clear up their amazement"}
          - {w: "no hay que", d: "there is no need to, one must not"}
          - {w: "hacer caso de", d: "to pay attention to, take notice of"}
          - {w: "dél", d: "= de él, of him (old contraction)"}
          - {w: "fuera de juicio", d: "out of his mind, mad"}
        diagram:
          - s: "Admirados se quedaron los nuevos caminantes"
            r: "main verb 1: the new travellers were left amazed"
            under:
              - {s: "de las palabras de don Quijote", r: "why: at Don Quijote's words"}
          - s: "pero el ventero les quitó de aquella admiración"
            r: "main verb 2: but the innkeeper cleared up their amazement"
            under:
              - s: "diciéndoles"
                r: "how: telling them"
                under:
                  - {s: "que era don Quijote", r: "what he told them, 1: that it was Don Quijote"}
                  - {s: "y que no había que hacer caso dél", r: "what he told them, 2: that they need not pay him any attention"}
                  - {s: "porque estaba fuera de juicio", r: "why: because he was out of his mind"}
        forms:
          - {w: "Admirados", f: "admir- + -ados → participle of admirar (to amaze), masculine plural to match 'caminantes'; put first for emphasis."}
          - {w: "se quedaron", f: "qued- + -aron → quedarse (to be left), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "nuevos", f: "nuev- + -os → nuevo (new, newly arrived), masculine plural to match 'caminantes'."}
          - {w: "quitó", f: "quit- + -ó → quitar (to take away), preterite, he. Same -ar preterite."}
          - {w: "aquella", f: "aquel (that) in the feminine, to match 'admiración'."}
          - {w: "diciéndoles", f: "gerund of decir (to say) + les (to them) hung on the end; accent added to keep the stress on 'cién'."}
          - {w: "era", f: "ser (to be), imperfect, he. Irregular: era, eras, era, éramos, erais, eran. Reported speech: 'he said it was Don Quijote'."}
          - {w: "había que", f: "hab- + -ía → haber (to have), imperfect, used impersonally, + que + infinitive: 'one had to'; with 'no', 'there was no need to'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "dél", f: "de + él, 'of him', run together as Cervantes often writes."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
  - sentences:
      - es: "Preguntáronle al ventero si acaso había llegado a aquella venta un muchacho de hasta edad de quince años, que venía vestido como mozo de mulas, de tales y tales señas, dando las mesmas que traía el amante de doña Clara."
        literal: "They-asked-him to-the innkeeper if perhaps had arrived at that inn a boy of up-to age of fifteen years, who came dressed as lad of mules, of such and such marks, giving the same that bore the lover of doña Clara."
        ormsby: "They then asked the landlord if by any chance a youth of about fifteen years of age had come to that inn, one dressed like a muleteer, and of such and such an appearance, describing that of Doña Clara’s lover."
        vocab:
          - {w: "acaso", d: "by any chance, perhaps"}
          - {w: "de hasta edad de", d: "of about the age of, up to the age of"}
          - {w: "mozo de mulas", d: "mule boy, muleteer's lad, a servant who looks after mules"}
          - {w: "de tales y tales señas", d: "of such and such a description; 'señas' = distinguishing marks, description"}
          - {w: "mesmo", d: "= mismo, same (old form)"}
          - {w: "traer", d: "to bring; here 'to wear, have about him' (the marks he bore)"}
          - {w: "doña Clara", d: "the daughter of the judge (oidor) who arrived at the inn the night before; her young lover sang beneath her window disguised as a mule boy"}
        diagram:
          - s: "Preguntáronle al ventero"
            r: "main verb: they asked the innkeeper"
            under:
              - s: "si acaso había llegado a aquella venta un muchacho"
                r: "what they asked: whether a boy had by chance come to that inn"
                under:
                  - {s: "de hasta edad de quince años", r: "describes 'muchacho': about fifteen years old"}
                  - {s: "que venía vestido como mozo de mulas", r: "describes 'muchacho': who was dressed as a mule boy"}
                  - {s: "de tales y tales señas", r: "describes 'muchacho': of such and such a description"}
              - s: "dando las mesmas"
                r: "how: giving the same marks"
                under:
                  - {s: "que traía el amante de doña Clara", r: "describes 'mesmas': that doña Clara's lover had"}
        forms:
          - {w: "Preguntáronle", f: "pregunt- + -aron + le → preguntar (to ask), preterite, they, with 'le' (to him) stuck on the end; modern 'le preguntaron'. Cervantes hangs the pronoun on a verb that opens the clause. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. 'le' and 'al ventero' name the same person: Spanish doubles the indirect object."}
          - {w: "al", f: "a + el: 'a' marks the person asked."}
          - {w: "había llegado", f: "hab- + -ía → haber (to have), imperfect, he, + llegado, participle of llegar (to arrive): pluperfect, 'had arrived'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "aquella", f: "aquel (that) in the feminine, to match 'venta'."}
