          - {w: "de improviso", d: "unexpectedly, without warning"}
          - {w: "vituperio", d: "insult, abuse"}
          - {w: "asir de", d: "to grab hold of, seize"}
          - {w: "mojicón", d: "a punch in the face, a cuff"}
          - {w: "bañar", d: "to bathe, drench"}
