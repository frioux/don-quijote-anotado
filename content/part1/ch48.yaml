      - es: "Y ¿es posible que sea vuestra merced tan duro de celebro, y tan falto de meollo, que no eche de ver que es pura verdad la que le digo, y que en esta su prisión y desgracia tiene más parte la malicia que el encanto?"
        literal: "And is it possible that may-be your grace so hard of brain, and so lacking of marrow, that not you-may-notice that it-is pure truth that which to-you I-tell, and that in this your imprisonment and misfortune has more part the malice than the enchantment?"
        ormsby: "and is it possible that your worship is so thick of skull and so short of brains that you cannot see that what I say is the simple truth, and that malice has more to do with your imprisonment and misfortune than enchantment?"
        vocab:
          - {w: "duro de celebro", d: "thick-headed, slow-witted; 'celebro' = cerebro, brain (old form)"}
          - {w: "falto de", d: "lacking in, short of"}
          - {w: "meollo", d: "marrow, brains; figuratively good sense"}
          - {w: "echar de ver", d: "to notice, realize"}
          - {w: "desgracia", d: "misfortune (not 'disgrace')"}
          - {w: "tener parte en", d: "to have a share in, be responsible for"}
          - {w: "malicia", d: "malice, ill will; also cunning"}
          - {w: "encanto", d: "enchantment, spell (here not 'charm')"}
        diagram:
          - s: "Y ¿es posible"
            r: "main verb: and is it possible"
            under:
              - s: "que sea vuestra merced tan duro de celebro, y tan falto de meollo"
                r: "what is possible: that your grace is so thick-headed and so short of brains"
                under:
                  - s: "que no eche de ver"
                    r: "result: that you do not notice"
                    under:
                      - s: "que es pura verdad la"
                        r: "what you don't notice, 1: that it is the plain truth"
                        under:
                          - {s: "que le digo", r: "describes 'la': which I tell you"}
                      - {s: "y que en esta su prisión y desgracia tiene más parte la malicia que el encanto?", r: "what you don't notice, 2: that malice has more to do with this imprisonment than enchantment"}
        forms:
          - {w: "es", f: "es → ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "sea", f: "se- + -a → ser (to be), present subjunctive, you (vuestra merced), after 'es posible que'. sea, seas, sea, seamos, seáis, sean."}
          - {w: "celebro", f: "old form of cerebro (brain), with r and l swapped."}
          - {w: "eche", f: "ech- + -e → echar (to throw), present subjunctive, you (vuestra merced), in a result clause after 'tan ... que'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. 'echar de ver' = to notice."}
          - {w: "la que le digo", f: "la = 'the one' (the truth, 'verdad'); digo → decir (to say), present, I: digo, dices, dice, decimos, decís, dicen; le = 'to you' (vuestra merced)."}
          - {w: "esta su prisión", f: "esta (this), feminine to match 'prisión', + su (your): Cervantes can put a demonstrative and a possessive together before a noun, 'this imprisonment of yours'."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, it (malice). Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
        note: "Sancho gives his master's own word back to him: it is 'malicia' (the priest and barber's scheming), not 'encanto', that has put him in the cage."
