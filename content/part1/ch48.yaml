      - es: "Y que esto sea verdad véase por muchas e infinitas comedias que ha compuesto un felicísimo ingenio destos reinos, con tanta gala, con tanto donaire, con tan elegante verso, con tan buenas razones, con tan graves sentencias y, finalmente, tan llenas de elocución y alteza de estilo, que tiene lleno el mundo de su fama."
        literal: "And that this be truth let-it-be-seen by many and infinite plays that has composed a most-fortunate wit of-these kingdoms, with so-much elegance, with so-much grace, with such elegant verse, with such good arguments, with such weighty maxims and, finally, so full of eloquence and loftiness of style, that he-has full the world of his fame."
        ormsby: "And that this is the truth may be seen by the countless plays that a most fertile wit of these kingdoms has written, with so much brilliancy, so much grace and gaiety, such polished versification, such choice language, such profound reflections, and in a word, so rich in eloquence and elevation of style, that he has filled the world with his fame;"
        ormsby_note: "The fertile wit was, of course, Lope de Vega, at whom, in particular, this criticism is aimed; and Cervantes shows great adroitness in the mode in which he has conducted his attack. There is hardly anything, however, which he says that Lope does not admit with cynical candor in the Arte Nuevo de Hacer Comedias, where he insists upon the right of the public to have nonsense if it prefers it, inasmuch as it pays. This chapter has a peculiar interest, not only as showing the views of Cervantes, but as furnishing an explanation of the bitter feeling with which he was unquestionably regarded by Lope and Lope's school; a feeling that found expression a few years later in the attack made upon him by Avellaneda. Cervantes himself shortly afterwards in his comedies violated nearly all the principles he lays down here, and in the second act of the Rufian Dichoso solemnly reads his recantation. Much of what he says here is almost identical with what Sir Philip Sidney had said in the Apologie for Poetrie."
