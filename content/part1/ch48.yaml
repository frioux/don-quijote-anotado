part: 1
chapter: 48
title_es: "Capítulo XLVIII. Donde prosigue el canónigo la materia de los libros de caballerías, con otras cosas dignas de su ingenio"
title_en: "In which the canon pursues the subject of the books of chivalry, with other matters worthy of his wit"
paragraphs:
  - sentences:
      - es: "— Así es como vuestra merced dice, señor canónigo —dijo el cura—, y por esta causa son más dignos de reprehensión los que hasta aquí han compuesto semejantes libros sin tener advertencia a ningún buen discurso, ni al arte y reglas por donde pudieran guiarse y hacerse famosos en prosa, como lo son en verso los dos príncipes de la poesía griega y latina."
        literal: "— So it-is as your grace says, sir canon —said the priest—, and for this cause are more worthy of reprehension those who until here have composed such books without having heed to any good reasoning, nor to-the art and rules by where they-might guide-themselves and make-themselves famous in prose, as it are in verse the two princes of the poetry Greek and Latin."
        ormsby: "“It is as you say, señor canon,” said the curate; “and for that reason those who have hitherto written books of the sort deserve all the more censure for writing without paying any attention to good taste or the rules of art, by which they might guide themselves and become as famous in prose as the two princes of Greek and Latin poetry are in verse.”"
        vocab:
          - {w: "canónigo", d: "canon: a priest attached to a cathedral chapter, usually a learned man; this one met the party on the road in the previous chapter"}
          - {w: "cura", d: "parish priest (Ormsby's 'curate')"}
          - {w: "reprehensión", d: "= reprensión, censure, rebuke (old Latinate spelling)"}
          - {w: "hasta aquí", d: "up to now, hitherto"}
          - {w: "semejante", d: "such, of that kind (before a noun)"}
          - {w: "tener advertencia a", d: "to pay heed to, take into account"}
          - {w: "discurso", d: "reasoning, good judgment (false friend: not a 'speech' here)"}
          - {w: "por donde", d: "by which, through which"}
          - {w: "los dos príncipes de la poesía griega y latina", d: "Homer and Virgil, the two models of epic poetry"}
        diagram:
          - s: "— Así es"
            r: "main verb 1: it is so"
            under:
              - {s: "como vuestra merced dice, señor canónigo", r: "how: as your grace says, sir canon"}
          - {s: "—dijo el cura—", r: "speech tag: said the priest"}
          - s: "son más dignos de reprehensión"
            r: "main verb 2 (after 'y'): are more deserving of censure"
            under:
              - {s: "por esta causa", r: "why: for this reason"}
              - s: "los que hasta aquí han compuesto semejantes libros"
                r: "subject: those who have written such books until now"
                under:
                  - s: "sin tener advertencia a ningún buen discurso, ni al arte y reglas"
                    r: "how: without paying heed to good judgment, or to the art and rules"
                    under:
                      - s: "por donde pudieran guiarse y hacerse famosos en prosa"
                        r: "describes 'arte y reglas': by which they could guide themselves and become famous in prose"
                        under:
                          - {s: "como lo son en verso los dos príncipes de la poesía griega y latina", r: "comparison: as the two princes of Greek and Latin poetry are in verse"}
        forms:
          - {w: "dice", f: "dic- + -e → decir (to say), present, you (vuestra merced takes the 'he/she' form). Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "esta", f: "est- + -a → este (this), feminine to match 'causa'."}
          - {w: "son", f: "ser (to be), present, they. soy, eres, es, somos, sois, son."}
          - {w: "dignos", f: "dign- + -os → digno (worthy), masculine plural to match 'los que' (those who)."}
          - {w: "han compuesto", f: "han, from haber (to have), present, they: he, has, ha, hemos, habéis, han; + compuesto, the irregular participle of componer (to compose): the present perfect, 'have composed'."}
          - {w: "semejantes", f: "semejante (such) + -s, plural to match 'libros'."}
          - {w: "ningún buen", f: "ninguno (no, any) and bueno (good) clipped before a masculine singular noun ('discurso'), like un, algún, gran."}
          - {w: "al", f: "a + el, the contraction modern Spanish still makes."}
          - {w: "pudieran", f: "pud- + -ieran → poder (to be able), imperfect subjunctive (-ra form), they: 'they could'. Built on the preterite pudieron: pudiera, pudieras, pudiera, pudiéramos, pudierais, pudieran."}
          - {w: "guiarse, hacerse", f: "guiar (to guide) and hacer (to make) + se (themselves), the pronoun hung on each infinitive after 'pudieran': 'guide themselves, make themselves (famous)'."}
          - {w: "famosos", f: "famos- + -os → famoso (famous), masculine plural to match the writers."}
          - {w: "lo son", f: "lo stands for 'famosos': 'as they are (famous)'. Spanish repeats an adjective after ser (to be) with the neuter pronoun 'lo'. son = ser (to be), present, they: soy, eres, es, somos, sois, son."}
          - {w: "griega y latina", f: "griego (Greek) and latino (Latin), feminine to match 'poesía'."}
        note: "The canon has just attacked the romances of chivalry in the previous chapter and sketched the good one that could be written by the rules of art. 'The rules' are those of the Italian critics who, following Aristotle and Horace, held up Homer and Virgil as models."
  - sentences:
      - es: "— Yo, a lo menos —replicó el canónigo—, he tenido cierta tentación de hacer un libro de caballerías, guardando en él todos los puntos que he significado; y si he de confesar la verdad, tengo escritas más de cien hojas."
        literal: "— I, at the least —replied the canon—, have had certain temptation of making a book of chivalries, keeping in it all the points that I-have signified; and if I-have to confess the truth, I-have written more than a-hundred leaves."
        ormsby: "“I myself, at any rate,” said the canon, “was once tempted to write a book of chivalry in which all the points I have mentioned were to be observed; and if I must own the truth I have more than a hundred sheets written;"
        vocab:
          - {w: "a lo menos", d: "at least, at any rate (modern 'al menos')"}
          - {w: "replicar", d: "to reply, answer back"}
          - {w: "cierto", d: "before a noun: 'a certain, some'; after it: 'true, sure'"}
          - {w: "libro de caballerías", d: "romance of chivalry, the kind of book that drove Don Quijote mad"}
          - {w: "guardar", d: "to keep, observe (rules)"}
          - {w: "significar", d: "to point out, state, explain (not only 'to mean')"}
          - {w: "haber de", d: "to have to, must: 'si he de confesar' = if I must confess"}
          - {w: "hoja", d: "leaf, sheet of paper"}
        diagram:
          - s: "Yo"
            r: "subject: I"
            under:
              - {s: "a lo menos", r: "at least"}
          - {s: "—replicó el canónigo—", r: "speech tag: the canon replied"}
          - s: "he tenido cierta tentación"
            r: "main verb 1: I have had a certain temptation"
            under:
              - s: "de hacer un libro de caballerías"
                r: "what temptation: to write a book of chivalry"
                under:
                  - s: "guardando en él todos los puntos"
                    r: "how: keeping in it all the points"
                    under:
                      - {s: "que he significado", r: "describes 'puntos': that I have pointed out"}
          - s: "tengo escritas más de cien hojas"
            r: "main verb 2 (after 'y'): I have more than a hundred sheets written"
            under:
              - {s: "si he de confesar la verdad", r: "condition: if I must confess the truth"}
        forms:
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (repliqué, with c → qu before e)."}
          - {w: "he tenido", f: "he, from haber (to have), present, I: he, has, ha, hemos, habéis, han; + tenido, the participle of tener (to have): the present perfect, 'I have had'."}
          - {w: "cierta", f: "ciert- + -a → cierto (a certain), feminine to match 'tentación'."}
          - {w: "guardando", f: "gerund of guardar (to keep): 'keeping, observing'."}
          - {w: "él", f: "'it', masculine because it stands for 'un libro'; the accented él is the pronoun, unaccented el the article."}
          - {w: "he significado", f: "he, from haber (to have), present, I: he, has, ha, hemos, habéis, han; + significado, the participle of significar (to point out): 'I have pointed out'."}
          - {w: "he de confesar", f: "he, from haber (to have), present, I (he, has, ha, hemos, habéis, han), + de + infinitive confesar (to confess): 'haber de' means 'must, have to'."}
          - {w: "tengo escritas", f: "teng- + -o → tener (to have), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen. With a participle it means 'I have (them) written', and the participle escrito (from escribir, to write) agrees with the object: escritas, feminine plural to match 'hojas'."}
        note: "The canon is the classic Renaissance critic: he condemns the romances of chivalry but admits he has started one himself, written by the rules. Many scholars hear Cervantes himself in his voice."
      - es: "Y para hacer la experiencia de si correspondían a mi estimación, las he comunicado con hombres apasionados desta leyenda, dotos y discretos, y con otros ignorantes, que sólo atienden al gusto de oír disparates, y de todos he hallado una agradable aprobación;"
        literal: "And to make the experiment of whether they-corresponded to my estimation, them I-have communicated with men passionate of-this reading, learned and discreet, and with others ignorant, who only attend to-the pleasure of hearing nonsense, and from all I-have found an agreeable approval;"
        ormsby: "and to try if it came up to my own opinion of it, I showed them to persons who were fond of this kind of reading, to learned and intelligent men as well as to ignorant people who cared for nothing but the pleasure of listening to nonsense, and from all I obtained flattering approval;"
        vocab:
          - {w: "hacer la experiencia de", d: "to make the test of, try out (whether)"}
          - {w: "corresponder a", d: "to live up to, match"}
          - {w: "estimación", d: "esteem; here his own opinion of the work"}
          - {w: "comunicar con", d: "to share with, show to"}
          - {w: "apasionado de", d: "fond of, a devotee of"}
          - {w: "desta", d: "= de esta, of this (old contraction)"}
          - {w: "leyenda", d: "reading, something to be read (from Latin 'legenda'); not 'legend' here"}
          - {w: "doto", d: "= docto, learned (old spelling dropping the c)"}
          - {w: "discreto", d: "intelligent, judicious, of good sense (false friend: not 'discreet')"}
          - {w: "atender a", d: "to care for, pay attention to"}
          - {w: "disparate", d: "piece of nonsense, absurdity"}
          - {w: "hallar", d: "to find, meet with"}
          - {w: "aprobación", d: "approval"}
        diagram:
          - s: "las he comunicado"
            r: "main verb 1: I have shown them (the sheets)"
            under:
              - s: "para hacer la experiencia"
                r: "why: to make the test"
                under:
                  - {s: "de si correspondían a mi estimación", r: "of what: whether they lived up to my opinion of them"}
              - s: "con hombres apasionados desta leyenda, dotos y discretos"
                r: "with whom 1: with learned, intelligent men who love this reading"
              - s: "y con otros ignorantes"
                r: "with whom 2: and with ignorant people"
                under:
                  - {s: "que sólo atienden al gusto de oír disparates", r: "describes 'otros': who care only for the pleasure of hearing nonsense"}
          - s: "he hallado una agradable aprobación"
            r: "main verb 2 (after 'y'): I have found pleasant approval"
            under:
              - {s: "de todos", r: "from whom: from all of them"}
        forms:
          - {w: "correspondían", f: "correspond- + -ían → corresponder (to match), imperfect, they (the sheets). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "las he comunicado", f: "las (them, feminine plural for 'hojas') + he, from haber (to have), present, I: he, has, ha, hemos, habéis, han; + comunicado, the participle of comunicar (to share): 'I have shown them'. The participle does not agree with the object after haber."}
          - {w: "apasionados", f: "participle of apasionar (to fill with passion), masculine plural to match 'hombres'."}
          - {w: "desta", f: "de + esta (of this): Cervantes fuses 'de' with these pronouns; modern 'de esta'."}
          - {w: "dotos", f: "= doctos (learned), masculine plural to match 'hombres'."}
          - {w: "atienden", f: "atiend- + -en → atender (to attend to), present, they. The stem e becomes ie when stressed: atiendo, atiendes, atiende, atendemos, atendéis, atienden."}
          - {w: "al", f: "a + el, the contraction modern Spanish still makes."}
          - {w: "oír", f: "infinitive of oír (to hear), after 'de'."}
          - {w: "he hallado", f: "he, from haber (to have), present, I: he, has, ha, hemos, habéis, han; + hallado, the participle of hallar (to find): 'I have found'."}
      - es: "pero, con todo esto, no he proseguido adelante, así por parecerme que hago cosa ajena de mi profesión, como por ver que es más el número de los simples que de los prudentes;"
        literal: "but, with all this, not I-have continued forward, as-much for seeming-to-me that I-do thing alien from my profession, as for seeing that is more the number of the simple than of the prudent;"
        ormsby: "nevertheless I proceeded no farther with it, as well because it seemed to me an occupation inconsistent with my profession, as because I perceived that the fools are more numerous than the wise;"
        vocab:
          - {w: "con todo esto", d: "for all that, nevertheless"}
          - {w: "proseguir adelante", d: "to go on further, carry on"}
          - {w: "así por ... como por", d: "as much because ... as because, both because ... and because"}
          - {w: "ajeno de", d: "foreign to, out of keeping with"}
          - {w: "profesión", d: "calling; for a canon, the clerical state"}
          - {w: "simple", d: "simple-minded, foolish (as a noun: a simpleton)"}
          - {w: "prudente", d: "wise, sensible"}
        diagram:
          - s: "no he proseguido adelante"
            r: "main verb: I have not carried on"
            under:
              - {s: "pero, con todo esto", r: "linking: but for all that"}
              - s: "así por parecerme"
                r: "why 1: both because it seems to me"
                under:
                  - {s: "que hago cosa ajena de mi profesión", r: "what seems: that I am doing something out of keeping with my calling"}
              - s: "como por ver"
                r: "why 2: and because I see"
                under:
                  - {s: "que es más el número de los simples que de los prudentes", r: "what I see: that the fools outnumber the wise"}
        forms:
          - {w: "he proseguido", f: "he, from haber (to have), present, I: he, has, ha, hemos, habéis, han; + proseguido, the participle of proseguir (to continue): 'I have (not) continued'."}
          - {w: "parecerme", f: "parecer (to seem) + me (to me), the pronoun hung on the infinitive after 'por': 'because it seems to me'."}
          - {w: "hago", f: "hag- + -o → hacer (to do), present, I. Irregular: hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "ajena", f: "ajen- + -a → ajeno (foreign to), feminine to match 'cosa'."}
          - {w: "ver", f: "infinitive of ver (to see), after 'por': 'because of seeing'."}
          - {w: "es más el número", f: "es, from ser (to be), present, it: soy, eres, es, somos, sois, son; 'es más el número de ... que de ...' = the number of ... is greater than of ...; the subject 'el número' comes after the verb."}
      - es: "y que, puesto que es mejor ser loado de los pocos sabios que burlado de los muchos necios, no quiero sujetarme al confuso juicio del desvanecido vulgo, a quien por la mayor parte toca leer semejantes libros."
        literal: "and that, granted that it-is better to-be praised by the few wise than mocked by the many fools, not I-want to-subject-myself to-the confused judgment of-the vain common-people, to whom for the greater part it-falls to-read such books."
        ormsby: "and, though it is better to be praised by the wise few than applauded by the foolish many, I have no mind to submit myself to the stupid judgment of the silly public, to whom the reading of such books falls for the most part."
        ormsby_note: "In the original it is burlado, \"scoffed at,\" which makes no sense. Hartzenbusch suggests vitoreado, but I think alabado is the more likely word and suits the context better."
        vocab:
          - {w: "puesto que", d: "here 'although, granted that' (false friend: in Cervantes it rarely means 'since')"}
          - {w: "loado", d: "praised (from 'loar', a literary word for alabar)"}
          - {w: "burlado", d: "mocked, scoffed at; Ormsby thinks the sense needs 'applauded' and that the printer erred"}
          - {w: "necio", d: "fool, foolish"}
          - {w: "sujetarse a", d: "to submit oneself to"}
          - {w: "desvanecido", d: "vain, empty-headed, conceited"}
          - {w: "vulgo", d: "the common people, the mob, the general public (scornful)"}
          - {w: "por la mayor parte", d: "for the most part, mostly"}
          - {w: "tocar a uno", d: "to fall to someone, be someone's lot or business"}
        diagram:
          - s: "no quiero sujetarme al confuso juicio del desvanecido vulgo"
            r: "main verb (after 'y que', still part of the reason he stopped): I do not want to submit to the muddled judgment of the vain public"
            under:
              - s: "puesto que es mejor ser loado de los pocos sabios"
                r: "concession: although it is better to be praised by the few wise"
                under:
                  - {s: "que burlado de los muchos necios", r: "comparison: than mocked by the many fools"}
              - {s: "a quien por la mayor parte toca leer semejantes libros", r: "describes 'vulgo': whose business it mostly is to read such books"}
        forms:
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "loado, burlado", f: "participles of loar (to praise) and burlar (to mock) after 'ser' (to be): the passive, 'be praised, be mocked'. 'de' marks the agent, where modern Spanish uses 'por'."}
          - {w: "quiero", f: "quier- + -o → querer (to want), present, I. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "sujetarme", f: "sujetar (to subject) + me (myself), the pronoun hung on the infinitive after 'quiero'."}
          - {w: "al, del", f: "a + el and de + el, the contractions modern Spanish still makes."}
          - {w: "confuso", f: "confus- + -o → confuso (confused), masculine to match 'juicio'; set before the noun for emphasis."}
          - {w: "desvanecido", f: "participle of desvanecer (to make vain, to fade) used as an adjective, masculine to match 'vulgo'."}
          - {w: "toca", f: "toc- + -a → tocar (to fall to), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "a quien", f: "'to whom': 'quien' refers to 'vulgo', a collective; old Spanish uses 'quien' freely for things and groups too."}
        note: "As printed, the line says it is better to be praised by the wise few than 'mocked' by the many fools, which is a truism; the sense the argument needs is 'applauded', hence Ormsby's emendation."
      - es: "Pero lo que más me le quitó de las manos, y aun del pensamiento, de acabarle, fue un argumento que hice conmigo mesmo, sacado de las comedias que ahora se representa, diciendo:"
        literal: "But that which most from-me it took-away from the hands, and even from-the thought, of finishing-it, was an argument that I-made with-myself same, drawn from the plays that now are-acted, saying:"
        ormsby: "“But what most of all made me hold my hand and even abandon all idea of finishing it was an argument I put to myself taken from the plays that are acted nowadays, which was in this wise:"
        vocab:
          - {w: "quitar de las manos", d: "to take out of one's hands, make one drop (a task)"}
          - {w: "aun", d: "even"}
          - {w: "argumento", d: "line of reasoning, argument (also 'plot' of a play)"}
          - {w: "conmigo mesmo", d: "= conmigo mismo, with myself; 'mesmo' is the old form of 'mismo'"}
          - {w: "comedia", d: "any play for the public stage, comic or not (false friend: not only 'comedy')"}
          - {w: "representar", d: "to perform, act (a play)"}
        diagram:
          - s: "fue un argumento"
            r: "main verb: was an argument"
            under:
              - s: "Pero lo que más me le quitó de las manos, y aun del pensamiento, de acabarle"
                r: "subject: but what most made me give up finishing it, in deed and even in thought"
              - {s: "que hice conmigo mesmo", r: "describes 'argumento': that I made with myself"}
              - s: "sacado de las comedias"
                r: "describes 'argumento': drawn from the plays"
                under:
                  - {s: "que ahora se representa", r: "describes 'comedias': that are acted now"}
              - {s: "diciendo:", r: "how: saying (to myself) as follows"}
        forms:
          - {w: "me le quitó", f: "quit- + -ó → quitar (to take away), preterite, it, with 'me' (from me) and 'le' (it, the book). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. 'le' for a masculine thing as direct object is leísmo, where modern Spanish says 'lo': 'me lo quitó'."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
          - {w: "acabarle", f: "acabar (to finish) + le (it, the book), the pronoun hung on the infinitive after 'de'; 'le' for a thing is leísmo, modern 'acabarlo'."}
          - {w: "fue", f: "ser (to be), preterite, it. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "hice", f: "hic- + -e → hacer (to make), preterite, I. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "conmigo mesmo", f: "conmigo = con + mí, the special fused form 'with me'; mesmo = mismo (self), masculine to match the speaker."}
          - {w: "sacado", f: "participle of sacar (to draw out), masculine to match 'argumento'."}
          - {w: "se representa", f: "represent- + -a → representar (to perform), present, it, with 'se' making it passive: 'is performed'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. The text has the singular although the subject 'comedias' is plural; modern Spanish needs 'se representan'."}
          - {w: "diciendo", f: "gerund of decir (to say): 'saying'."}
      - es: "«Si estas que ahora se usan, así las imaginadas como las de historia, todas o las más son conocidos disparates y cosas que no llevan pies ni cabeza, y, con todo eso, el vulgo las oye con gusto, y las tiene y las aprueba por buenas, estando tan lejos de serlo, y los autores que las componen y los actores que las representan dicen que así han de ser, porque así las quiere el vulgo, y no de otra manera;"
        literal: "«If these that now are-in-use, as-much the imagined as those of history, all or the most are known nonsenses and things that not carry feet nor head, and, with all that, the common-people them hears with pleasure, and them holds and them approves as good, being so far from being-it, and the authors who them compose and the actors who them perform say that so they-have to be, because so them wants the common-people, and not of other manner;"
        ormsby: "if those that are now in vogue, as well those that are pure invention as those founded on history, are, all or most of them, downright nonsense and things that have neither head nor tail, and yet the public listens to them with delight, and regards and cries them up as perfection when they are so far from it; and if the authors who write them, and the players who act them, say that this is what they must be, for the public wants this and will have nothing else;"
        vocab:
          - {w: "usarse", d: "to be in fashion, be the custom"}
          - {w: "así ... como", d: "both ... and, as well ... as"}
          - {w: "las imaginadas", d: "the invented ones, plays with made-up plots"}
          - {w: "las de historia", d: "history plays, plays on historical subjects"}
          - {w: "las más", d: "most of them"}
          - {w: "conocido", d: "obvious, plain, well-known"}
          - {w: "no llevar pies ni cabeza", d: "to have neither head nor tail, make no sense (modern 'no tener ni pies ni cabeza')"}
          - {w: "con todo eso", d: "for all that, even so"}
