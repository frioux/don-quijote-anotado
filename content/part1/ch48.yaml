          - s: "es el lugar"
            r: "main verb: is the place"
            under:
              - {s: "Aquí", r: "where: here"}
              - {s: "señor licenciado", r: "addressed: sir licentiate (the priest)"}
              - s: "que yo dije"
                r: "describes 'lugar': that I said"
                under:
                  - s: "que era bueno"
                    r: "what I said: was good"
                    under:
                      - s: "para que ... tuviesen los bueyes fresco y abundoso pasto"
                        r: "purpose: so that the oxen might have fresh, plentiful grazing"
                        under:
                          - {s: "sesteando nosotros", r: "when: while we take our midday rest"}
        forms:
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "dije", f: "dij- + -e → decir (to say), preterite, I. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "era", f: "ser (to be), imperfect, it: era, eras, era, éramos, erais, eran. Reported speech after 'dije' moves into the imperfect."}
          - {w: "sesteando", f: "gerund of sestear (to rest at midday), with its own subject 'nosotros': 'while we rest'."}
          - {w: "tuviesen", f: "tuv- + -iesen → tener (to have), imperfect subjunctive (-se form), they (the oxen): tuviese, tuvieses, tuviese, tuviésemos, tuvieseis, tuviesen. Subjunctive after 'para que' (so that)."}
