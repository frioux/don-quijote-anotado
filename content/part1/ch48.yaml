              - s: "y así se vea en los brazos de mi señora Dulcinea"
                r: "plea 2: and so may you find yourself in Dulcinea's arms"
                under:
                  - {s: "cuando menos se piense", r: "when: when you least expect it"}
        forms:
          - {w: "dígame", f: "dig- + -a + me → decir (to tell), present subjunctive, you (vuestra merced), with 'me' stuck on the end: a polite command. diga, digas, diga, digamos, digáis, digan. A positive command carries its pronoun on the end, with an accent to keep the stress."}
          - {w: "saque", f: "saqu- + -e → sacar (to take out), present subjunctive, he (God): a wish. c becomes qu before e. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "desta", f: "de + esta (of this): Cervantes fuses 'de' with these demonstratives."}
          - {w: "se vea", f: "ve- + -a → verse (to see oneself), present subjunctive, you (vuestra merced), with 'se': a wish. ver (to see) in the present subjunctive: vea, veas, vea, veamos, veáis, vean."}
          - {w: "se piense", f: "piens- + -e → pensar (to think), present subjunctive, you (vuestra merced), with 'se': in a 'cuando' clause about the future. The stem e becomes ie when stressed: piense, pienses, piense, pensemos, penséis, piensen."}
