                r: "why / contrast: since the play ought to be"
                under:
                  - {s: "según le parece a Tulio", r: "according to Cicero's view"}
                  - {s: "espejo de la vida humana, ejemplo de las costumbres y imagen de la verdad", r: "what it ought to be: a mirror of life, a model of manners, an image of truth"}
              - {s: "espejos de disparates, ejemplos de necedades e imágenes de lascivia", r: "what they are: mirrors of nonsense, models of folly, images of lewdness"}
        forms:
          - {w: "habiendo de ser", f: "habiendo, gerund of haber (to have), + de + ser (to be): 'haber de' + infinitive means 'to have to'; as a gerund, 'since it has to be'."}
          - {w: "parece", f: "parec- + -e → parecer (to seem), present, it: 'it seems to him'. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (parecer has 'parezco' for I)."}
          - {w: "le ... a Tulio", f: "'le' announces 'a Tulio' in advance, a doubled indirect object Spanish uses all the time: 'as it seems to him, to Tully'."}
          - {w: "se representan", f: "represent- + -an → representar (to perform), present, they, with 'se' making it passive: 'are performed'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "son", f: "ser (to be), present, they: soy, eres, es, somos, sois, son."}
          - {w: "e imágenes", f: "'y' (and) becomes 'e' before a word beginning with the i sound."}
          - {w: "espejos, imágenes", f: "plurals: espejo → espejos; imagen → imágenes, the accent added to keep the stress on 'ma'."}
        note: "The neat triple ('mirror of life, model of manners, image of truth') is the classic Renaissance definition of comedy, quoted from Donatus in the name of Cicero; the priest turns each term upside down."
      - es: "Porque, ¿qué mayor disparate puede ser en el sujeto que tratamos que salir un niño en mantillas en la primera cena del primer acto, y en la segunda salir ya hecho hombre barbado?"
