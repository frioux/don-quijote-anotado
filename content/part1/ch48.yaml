  - sentences:
      - es: "— Pregunta lo que quisieres, hijo Sancho —respondió don Quijote—, que yo te satisfaré y responderé a toda tu voluntad."
        literal: "— Ask that which you-may-wish, son Sancho —answered Don Quijote—, for I you will-satisfy and will-answer to all your will."
