          - {w: "licenciado", d: "licentiate, holder of a university degree; the priest's title"}
          - {w: "sestear", d: "to take the midday rest, the siesta (from 'sexta', the sixth hour, noon)"}
          - {w: "buey", d: "ox; the cart with the cage is drawn by oxen"}
          - {w: "abundoso", d: "= abundante, plentiful (old form)"}
          - {w: "pasto", d: "grazing, pasture"}
