  - sentences:
      - es: "— En materia ha tocado vuestra merced, señor canónigo —dijo a esta sazón el cura—, que ha despertado en mí un antiguo rancor que tengo con las comedias que agora se usan, tal, que iguala al que tengo con los libros de caballerías;"
        literal: "— On [a] matter has touched your grace, sir canon —said at this moment the priest—, which has awakened in me an old rancor that I-have with the plays that now are-in-use, such, that it-equals that which I-have with the books of chivalries;"
        ormsby: "“You have touched upon a subject, señor canon,” observed the curate here, “that has awakened an old enmity I have against the plays in vogue at the present day, quite as strong as that which I bear to the books of chivalry;"
        vocab:
          - {w: "tocar en", d: "to touch on, raise (a subject)"}
          - {w: "a esta sazón", d: "at this point, just then; 'sazón' = season, right moment"}
          - {w: "rancor", d: "= rencor, grudge, rancour (old form)"}
          - {w: "comedia", d: "a play of any kind, not only a comedy: the usual word for a three-act stage play in Golden Age Spain"}
          - {w: "agora", d: "= ahora, now (old form)"}
          - {w: "usarse", d: "to be in fashion, be current; 'que se usan' = that are in vogue"}
          - {w: "igualar", d: "to equal, match"}
        diagram:
          - s: "En materia ha tocado vuestra merced"
            r: "main verb: you have touched on a subject"
            under:
              - {s: "señor canónigo", r: "addressed to: sir canon"}
              - {s: "dijo a esta sazón el cura", r: "speech tag: said the priest at this point"}
              - s: "que ha despertado en mí un antiguo rancor"
                r: "describes 'materia': which has woken an old grudge in me"
                under:
                  - s: "que tengo con las comedias"
                    r: "describes 'rancor': that I have against the plays"
                    under:
                      - {s: "que agora se usan", r: "describes 'comedias': that are in fashion now"}
                  - s: "tal,"
                    r: "describes 'rancor': such a grudge"
                    under:
                      - s: "que iguala al"
                        r: "result: that it equals the one"
                        under:
                          - {s: "que tengo con los libros de caballerías", r: "describes 'al': that I have against the books of chivalry"}
        forms:
          - {w: "ha tocado", f: "h- + -a → haber (to have), present, you (vuestra merced takes the 'he/she' form), + tocado, participle of tocar (to touch): the present perfect, 'you have touched'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "ha despertado", f: "ha (haber (to have), present, it: he, has, ha, hemos, habéis, han) + despertado, participle of despertar (to awaken): 'which has awakened'."}
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "se usan", f: "us- + -an → usar (to use), present, they, with 'se' making it passive: 'are used', i.e. are in vogue. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "iguala", f: "igual- + -a → igualar (to equal), present, it (the grudge). Same -ar present: igualo, igualas, iguala, igualamos, igualáis, igualan."}
          - {w: "al", f: "a + el, 'the one', standing for 'el rancor': it equals the grudge that I have."}
        note: "The priest, who burned Don Quijote's library in chapter 6, now attacks the popular theatre of the day as he attacked the romances of chivalry. 'Comedia' was the name for any full-length play, comic or serious."
      - es: "porque, habiendo de ser la comedia, según le parece a Tulio, espejo de la vida humana, ejemplo de las costumbres y imagen de la verdad, las que ahora se representan son espejos de disparates, ejemplos de necedades e imágenes de lascivia."
        literal: "because, having to be the play, according-to [what] to-him seems to Tully, mirror of the life human, example of the customs and image of the truth, those that now are-performed are mirrors of nonsense, examples of follies and images of lewdness."
        ormsby: "for while the drama, according to Tully, should be the mirror of human life, the model of manners, and the image of the truth, those which are presented nowadays are mirrors of nonsense, models of folly, and images of lewdness."
        vocab:
          - {w: "haber de", d: "to have to, be meant to; 'habiendo de ser' = since it ought to be"}
          - {w: "Tulio", d: "Tully, i.e. Marcus Tullius Cicero, the Roman orator; the definition of comedy as 'a mirror of life' was attributed to him in the Renaissance (it comes down through the grammarian Donatus)"}
          - {w: "costumbres", d: "customs, manners, morals"}
          - {w: "disparate", d: "piece of nonsense, absurdity"}
          - {w: "necedad", d: "foolishness, folly (from 'necio', fool)"}
          - {w: "lascivia", d: "lewdness, lust"}
        diagram:
          - s: "las que ahora se representan son"
            r: "main verb: the ones performed now are"
            under:
