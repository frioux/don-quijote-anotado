          - {w: "coloquio", d: "conversation, dialogue"}
          - {w: "canónigo", d: "canon, a priest of a cathedral chapter (here the canon of Toledo)"}
          - {w: "cura", d: "parish priest"}
          - {w: "adelantarse", d: "to go ahead, come forward"}
