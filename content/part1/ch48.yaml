        ormsby: "“Leave off conjuring me,” said Don Quixote, “and ask what thou wouldst know; I have already told thee I will answer with all possible precision.”"
        vocab:
          - {w: "acabar de", d: "to finish, stop (doing): 'acaba de conjurarme' = stop adjuring me"}
          - {w: "conjurar", d: "to adjure, call on someone solemnly by oaths (not 'conjure up')"}
          - {w: "puntualidad", d: "precision, exactness (not 'being on time')"}
