          - {w: "este", f: "est- + -e → este (this), masculine to match 'punto'."}
          - {w: "llegaban", f: "lleg- + -aban → llegar (to arrive), imperfect, they: 'were reaching'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "adelantándose", f: "gerund of adelantar (to move forward) + se (himself), with an accent added to keep the stress: 'going ahead'. The gerund with its own subject ('el barbero') works as a 'when' clause."}
          - {w: "llegó", f: "lleg- + -ó → llegar (to arrive), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (llegué, with g → gu before e)."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "al", f: "a + el, the contraction modern Spanish still makes."}
        note: "The party is taking Don Quijote home caged on an ox-cart, with the priest and the barber masked; the canon of Toledo met them on the road in the previous chapter."
  - sentences:
