        forms:
          - {w: "mayor", f: "comparative of grande (big): 'greater', the same for masculine and feminine; 'que' then means 'than'."}
          - {w: "puede", f: "pued- + -e → poder (to be able), present, it. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "tratamos", f: "trat- + -amos → tratar (to treat, discuss), present, we. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "salir un niño", f: "infinitive of salir (to come out) used as a noun, with its own subject after it: 'for a child to come on'."}
