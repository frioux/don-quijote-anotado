                        under:
                          - {s: "como vuestra merced las profesa", r: "comparison: as your grace does"}
                          - {s: "debajo de título de caballeros andantes", r: "how: under the title of knights-errant"}
        forms:
          - {w: "pido", f: "pid- + -o → pedir (to ask for), present, I. The stem e becomes i when stressed: pido, pides, pide, pedimos, pedís, piden."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (repliqué, with c → qu before e)."}
          - {w: "quiero", f: "quier- + -o → querer (to want), present, I. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "diga", f: "dig- + -a → decir (to tell), present subjunctive, you (vuestra merced), after 'quiero ... que'. diga, digas, diga, digamos, digáis, digan."}
          - {w: "ninguna", f: "ningun- + -a → ninguno (no, none), feminine to match 'cosa', placed after it; with 'sin' it means 'anything at all'."}
          - {w: "se espera", f: "esper- + -a → esperar (to expect), present, it, with 'se': passive, 'it is expected'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "han de decir", f: "han (haber (to have), present, they: he, has, ha, hemos, habéis, han) + de + decir (to tell): 'haber de' + infinitive = must, are to. 'la' = it, the truth."}
          - {w: "dicen", f: "dic- + -en → decir (to tell), present, they. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "profesan, profesa", f: "profes- + -an / -a → profesar (to profess), present, they / you (vuestra merced). Same -ar present."}
