          - {w: "responderé", f: "responder- + -é → responder (to answer), future, I. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "te, tu", f: "te = 'you' (object), tu = 'your': Don Quijote speaks to Sancho with tú, as master to servant."}
      - es: "Y en lo que dices que aquellos que allí van y vienen con nosotros son el cura y el barbero, nuestros compatriotos y conocidos, bien podrá ser que parezca que son ellos mesmos; pero que lo sean realmente y en efeto, eso no lo creas en ninguna manera."
        literal: "And in that which you-say that those who there go and come with us are the priest and the barber, our fellow-countrymen and acquaintances, well it-will-be-able to-be that it-may-seem that they-are they themselves; but that it they-may-be really and in effect, that not it believe in no manner."
        ormsby: "As to what thou sayest, that these who accompany us yonder are the curate and the barber, our neighbours and acquaintances, it is very possible that they may seem to be those same persons; but that they are so in reality and in fact, believe it not on any account;"
        vocab:
          - {w: "en lo que dices", d: "as to what you say"}
          - {w: "ir y venir", d: "to go and come, i.e. travel along"}
          - {w: "compatriotos", d: "= compatriotas, fellow-countrymen, neighbours (Cervantes' masculine form)"}
          - {w: "conocidos", d: "acquaintances"}
          - {w: "bien podrá ser", d: "it may very well be"}
          - {w: "mesmos", d: "= mismos, themselves, the same (old form)"}
          - {w: "en efeto", d: "= en efecto, in fact, actually (old spelling)"}
          - {w: "en ninguna manera", d: "in no way, on no account"}
        diagram:
          - s: "bien podrá ser"
            r: "main verb 1: it may well be"
            under:
              - s: "en lo que dices"
                r: "about what: as to what you say"
                under:
