          - {s: "respondió don Quijote", r: "speech tag: answered Don Quijote"}
        forms:
          - {w: "Pregunta", f: "pregunt- + -a → preguntar (to ask), imperative, you (tú). The tú imperative of -ar verbs is the same as the he form of the present: pregunta, habla, mira."}
