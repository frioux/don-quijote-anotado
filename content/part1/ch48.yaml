              - s: "cuando, adelantándose el barbero, llegó a ellos"
                r: "when: when the barber, going on ahead, came up to them"
                under:
                  - {s: "adelantándose el barbero", r: "how: the barber going ahead"}
              - {s: "y dijo al cura:", r: "when, 2: and said to the priest"}
