summary: |
  Riding beside the ox-cart in which Don Quijote is being carried home in a cage, the priest agrees with the canon of Toledo that the authors of books of chivalry deserve blame for ignoring the rules of art. The canon confesses that he once began a book of chivalry himself and wrote more than a hundred sheets, which readers both wise and ignorant praised. He gave it up because the work did not suit his profession, and because he saw what happened to the plays of the day: the public applauds nonsense, the actors and authors say that nonsense is what sells, and a well-made book would only make him 'the tailor of El Campillo', who worked for nothing and supplied the thread. He tells how he once reminded an actor of three tragedies that kept the rules and earned more than thirty later plays, and named other good plays besides, without convincing him.

  The priest takes up the theme with an old grudge against the new comedies. A play should be, as Cicero said, a mirror of human life, but these show a baby in the first act and a bearded man in the second, cowardly youths and brave old men, a play that wanders through Europe, Asia and Africa, history jumbled across centuries, and false miracles in religious plays. Foreigners who keep the rules call the Spanish barbarous. Good plays would entertain better than bad ones and teach as well. The poets are not wholly to blame, since plays have become goods the actors buy, and even the most gifted playwright of the kingdom bends to the actors' taste. The priest proposes a learned censor at Court to approve every play before it is staged, and another, or the same man, to examine new books of chivalry, for the bow cannot always be bent and people need honest recreation.

  The barber rides up to say they have reached the meadow where the oxen can graze while the party rests through the heat of the day. The canon, taken with the valley, the priest's conversation and the story of Don Quijote, decides to stay with them; his servants tell him the sumpter mule already carries enough food, so only barley need be fetched from the inn.

  Meanwhile Sancho, finding himself alone with his master, tells Don Quijote that the two masked figures are really the priest and the barber of their village, and that he is not enchanted but tricked. Don Quijote replies that enchanters can take any shape they like and that his enchantment surpasses any he has read of. Sancho, after a long string of oaths and preambles, finally asks his question: since he was caged, has his master felt the need to relieve himself? Don Quijote, once he understands, answers that he has, many times, and needs to right now.
context: |
  The canon and the stage. This chapter continues the literary conversation begun in the previous one, and moves from books of chivalry to the theatre, the most popular entertainment of Cervantes' Spain. Public plays ('comedias') were staged in the corrales, open courtyards in the towns, by companies of professional actors whose manager ('autor de comedias') bought plays outright from the poets. That is why the canon and the priest keep saying that plays have become 'mercadería vendible': the actors, not the learned, decide what gets written. The two men speak for the classical rules taught by Italian critics after Aristotle's Poetics: one action, a short span of time, one place, decorum of character (kings act like kings, servants like servants) and verisimilitude. Every abuse the priest lists, the baby who is a bearded man in the next act, the play that tours three continents, Charlemagne's age mixed with Heraclius and Godfrey of Bouillon, breaks one of these rules.

  Lope de Vega. The 'felicísimo ingenio destos reinos' who has filled the world with his fame is, as Ormsby notes, Lope de Vega, the great and prolific playwright of the age, whose new style of comedy ignored the unities and gave the public what it paid for. Ormsby points out that Lope later said much the same thing himself, with frank cynicism, in his verse treatise the Arte nuevo de hacer comedias, and that this chapter helps explain the coolness between the two writers. Cervantes praises Lope's craft and blames his compliance in the same breath. The three tragedies the canon recalls are, Ormsby says, by Lupercio Leonardo de Argensola; La Numancia is Cervantes' own tragedy on the Roman siege of the Celtiberian city, so he slips his own work into the list of good plays. Ormsby also notes how much of the argument matches Sir Philip Sidney's Apologie for Poetrie, written in England around 1580.

  Censorship and religion. The priest's proposal of a learned examiner at Court, whose seal and signature every play would need before any local magistrate let it be staged, reflects real anxieties of the time: theatres were sometimes closed, actors punished for giving offence to great families, and moralists argued about whether the theatre should be allowed at all. Books already needed a licence from the Royal Council to be printed, so the priest is asking for the stage and for chivalric romance what the press already had. The 'comedias divinas' he attacks are religious plays, saints' lives and the like, where stage machinery ('apariencias') produced miracles that the audience came to see.

  The narrator's games and the comic turn. As often in Don Quijote, the learned debate is set in the most unlikely place, beside a madman in a cage on an ox-cart, and it is cut off by the barber announcing a good spot for the oxen to graze. The talk of decorum and verisimilitude then gives way to the least decorous question in the book: Sancho, after a parody of the solemn oaths of chivalric romance, asks whether his master has needed to relieve himself. The point is serious in its way, since the romances never mention that enchanted knights eat, drink or relieve themselves, and Sancho means to prove by this bodily fact that his master is not enchanted at all.

  Names and allusions. Tulio is Cicero (Marcus Tullius Cicero), to whom tradition credited the definition of comedy as a mirror of life. King Pepin and Charlemagne are Frankish kings of the eighth and ninth centuries; Heraclius the Byzantine emperor said to have carried the True Cross back into Jerusalem in the seventh century; Godfrey of Bouillon a leader of the First Crusade who took Jerusalem in 1099. Theseus found his way out of the Cretan labyrinth with Ariadne's thread. 'El sastre del cantillo' is a proverb Ormsby reads as 'the tailor of El Campillo, who stitched for nothing and found the thread'. 'Así son ellos como yo soy turco' ('they are that as much as I am a Turk') is a flat denial. 'Hacer aguas mayores o menores' is the polite phrase for defecating and urinating, which Ormsby softens to 'going anywhere'.

  Reading Cervantes' Spanish. The chapter is full of old spellings: desta, deste, dél, dellas (de + the pronoun), mesmo (mismo), agora (ahora), ansí (así), dotos (doctos), reprehensión, rancor (rencor), rectórico (retórico), estranjeros, oprobrio (oprobio), inconvinientes, escurecer (oscurecer), efeto (efecto), celebro (cerebro), compatriotos, trujesen (trajesen), aquestos (estos), escusa (excusa), Válame (Válgame). Infinitives with a pronoun turn -rl- into -ll-: representallas, castigallos, llevalle. Pronouns hang on clause-opening verbs (Acuérdome, síguese, véase, llévense). The future subjunctive marks open possibilities (quisieres, escuchare, tuviere, careciere), the -ra form serves as a conditional (pudieran, fueran), 'haber de' means 'must, be going to', 'ha pocos años' means 'a few years ago', and 'tengo escritas más de cien hojas' shows tener with a participle that agrees with its object. Listen too for the forms of address: the canon and priest use vuestra merced with each other and vosotros commands (Decidme, mirad) to the actor, Sancho addresses his master as vuestra merced, and Don Quijote answers him with tú.
