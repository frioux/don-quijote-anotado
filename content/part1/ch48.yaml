      - es: "y que las que llevan traza y siguen la fábula como el arte pide, no sirven sino para cuatro discretos que las entienden, y todos los demás se quedan ayunos de entender su artificio, y que a ellos les está mejor ganar de comer con los muchos, que no opinión con los pocos, deste modo vendrá a ser un libro, al cabo de haberme quemado las cejas por guardar los preceptos referidos, y vendré a ser el sastre del cantillo»."
        literal: "and that those that carry plan and follow the plot as the art asks, not they-serve except for four discreet-ones who them understand, and all the rest remain fasting of understanding their artifice, and that to them to-them it-is better to-earn of eating with the many, than not reputation with the few, of-this mode will-come to be a book, at-the end of having-burned-myself the eyebrows for keeping the precepts referred, and I-will-come to be the tailor of-the corner»."
        ormsby: "and that those that go by rule and work out a plot according to the laws of art will only find some half-dozen intelligent people to understand them, while all the rest remain blind to the merit of their composition; and that for themselves it is better to get bread from the many than praise from the few; then my book will fare the same way, after I have burnt off my eyebrows in trying to observe the principles I have spoken of, and I shall be ‘the tailor of El Campillo.’"
        ormsby_note: "Alluding to the proverb (216) El sastre del Campillo, que cosia de balde y ponia el hilo, \"The tailor of El Campillo, who stitched for nothing and found the thread.\" In the original it is \"del cantillo\" and the Marquis of Santillana gives the proverb in this form; but in the Picara Justina, in Quevedo, and most other authorities it is given as above. \"Cantillo\" is unmeaning, while \"Campillo,\" or \"El Campillo\" is the name of nearly a score of places in Spain. Anyone versed in proverbial literature will see that this is one of the class of quasi-local proverbs to which so many of the Spanish belong, e.g. \"the squire of Guadalajara,\" \"the abbot of Zarzuela,\" \"the smith of Arganda,\" \"the doctors of Valencia,\" and that peculiarly humorous one, which ought by right to be Scottish, \"The piper of Bujalance, (who got) one maravedi to strike up and ten to leave off.\""
