      - es: "Si no, dígame, así Dios le saque desta tormenta, y así se vea en los brazos de mi señora Dulcinea cuando menos se piense..."
        literal: "If not, tell-me, so God you may-take-out of-this storm, and so yourself you-may-see in the arms of my lady Dulcinea when least yourself you-may-think..."
