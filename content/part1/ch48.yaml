          - s: "Acaba de conjurarme"
            r: "main verb 1: stop adjuring me"
          - {s: "dijo don Quijote", r: "speech tag: said Don Quijote"}
          - s: "y pregunta"
            r: "main verb 2: and ask"
            under:
              - {s: "lo que quisieres", r: "object: whatever you like"}
              - s: "que ya te he dicho"
                r: "why: for I have already told you"
                under:
                  - {s: "que te responderé con toda puntualidad", r: "what I told: that I will answer you exactly"}
        forms:
          - {w: "Acaba", f: "acab- + -a → acabar (to finish), imperative, you (tú). The tú imperative of -ar verbs is the same as the he form of the present: acaba, pregunta, mira."}
          - {w: "conjurarme", f: "conjurar (to adjure) + me, the pronoun hung on the infinitive after 'de'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "pregunta", f: "pregunt- + -a → preguntar (to ask), imperative, you (tú), the same form as the he present."}
          - {w: "quisieres", f: "quis- + -ieres → querer (to want), future subjunctive, you (tú): 'whatever you may want'. Built on the preterite quisieron: quisiere, quisieres, quisiere, quisiéremos, quisiereis, quisieren. Cervantes uses it after 'lo que', 'si', 'donde' for an open future; modern Spanish uses the present subjunctive 'quieras'."}
          - {w: "he dicho", f: "he (haber (to have), present, I: he, has, ha, hemos, habéis, han) + dicho, irregular participle of decir (to tell): 'I have told'."}
          - {w: "responderé", f: "responder- + -é → responder (to answer), future, I. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
  - sentences:
      - es: "— Eso pido —replicó Sancho—; y lo que quiero saber es que me diga, sin añadir ni quitar cosa ninguna, sino con toda verdad, como se espera que la han de decir y la dicen todos aquellos que profesan las armas, como vuestra merced las profesa, debajo de título de caballeros andantes..."
        literal: "— That I-ask —replied Sancho—; and that which I-want to-know is that me you-may-tell, without adding nor taking-away thing none, but with all truth, as itself is-expected that it have to tell and it tell all those who profess the arms, as your grace them professes, under title of knights errant..."
        ormsby: "“That is what I want,” said Sancho; “and what I would know, and have you tell me, without adding or leaving out anything, but telling the whole truth as one expects it to be told, and as it is told, by all who profess arms, as your worship professes them, under the title of knights-errant—”"
        vocab:
          - {w: "eso pido", d: "that's what I'm asking for"}
          - {w: "replicar", d: "to reply, answer back"}
          - {w: "añadir ni quitar", d: "add or take away (the double negative with 'sin')"}
          - {w: "profesar las armas", d: "to follow the profession of arms, be a soldier or knight"}
          - {w: "debajo de título de", d: "under the title of, as"}
