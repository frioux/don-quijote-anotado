                      - {s: "son el cura y el barbero", r: "verb: are the priest and the barber"}
                      - {s: "nuestros compatriotos y conocidos", r: "describes 'cura y barbero': our neighbours and acquaintances"}
              - {s: "que parezca que son ellos mesmos", r: "what may be: that it seems they are those very men"}
          - s: "eso no lo creas"
            r: "main verb 2 (after 'pero'): don't believe that"
            under:
              - {s: "que lo sean realmente y en efeto", r: "what not to believe: that they really and truly are"}
              - {s: "en ninguna manera", r: "how: on no account"}
        forms:
          - {w: "dices", f: "dic- + -es → decir (to say), present, you (tú). Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "van y vienen", f: "van → ir (to go): voy, vas, va, vamos, vais, van; vienen → venir (to come): vengo, vienes, viene, venimos, venís, vienen; present, they."}
          - {w: "son", f: "son → ser (to be), present, they. soy, eres, es, somos, sois, son."}
          - {w: "nuestros", f: "nuestr- + -os → nuestro (our), masculine plural to match 'compatriotos'."}
          - {w: "podrá", f: "podr- + -á → poder (to be able), future, it. Irregular stem podr-: podré, podrás, podrá, podremos, podréis, podrán."}
          - {w: "parezca", f: "parezc- + -a → parecer (to seem), present subjunctive, it, after 'podrá ser que'. The present subjunctive of -er verbs: -a, -as, -a, -amos, -áis, -an; c becomes zc: parezca, parezcas, parezca, parezcamos, parezcáis, parezcan."}
          - {w: "mesmos", f: "= mismos (themselves), masculine plural to match 'ellos'."}
          - {w: "sean", f: "se- + -an → ser (to be), present subjunctive, they, after 'que' when the fact is denied. sea, seas, sea, seamos, seáis, sean."}
          - {w: "efeto", f: "old spelling of efecto (effect), with the c dropped as it was in speech."}
          - {w: "no lo creas", f: "cre- + -as → creer (to believe), present subjunctive, you (tú): a negative command takes the subjunctive. crea, creas, crea, creamos, creáis, crean. 'lo' repeats 'eso' (that)."}
          - {w: "ninguna", f: "ningun- + -a → ninguno (no, none), feminine to match 'manera'; Spanish keeps the double negative 'no ... ninguna'."}
      - es: "Lo que has de creer y entender es que si ellos se les parecen, como dices, debe de ser que los que me han encantado habrán tomado esa apariencia y semejanza;"
