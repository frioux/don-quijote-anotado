      - es: "que, según las muestras, o vosotros habéis fecho, o vos han fecho, algún desaguisado, y conviene y es menester que yo lo sepa, o bien para castigaros del mal que fecistes, o bien para vengaros del tuerto que vos ficieron."
        literal: "for, according-to the signs, either you have done, or to-you they-have done, some outrage, and it-is-fitting and it-is necessary that I it may-know, either well to punish-you for-the evil that you-did, or well to avenge-you of-the wrong that to-you they-did."
        ormsby: "for, to judge by appearances, either ye have done some wrong or some wrong has been done to you, and it is fitting and necessary that I should know, either that I may chastise you for the evil ye have done, or else that I may avenge you for the injury that has been inflicted upon you.”"
        vocab:
          - {w: "según las muestras", d: "by the look of things"}
          - {w: "fecho", d: "old form of hecho: done (the f- of the chivalry books)"}
          - {w: "vos", d: "old form of 'os': you, to you (as object)"}
          - {w: "desaguisado", d: "outrage, wrong, injury (an old chivalric word)"}
          - {w: "convenir", d: "to be fitting, proper"}
          - {w: "menester", d: "necessary; 'es menester' = it is necessary"}
          - {w: "tuerto", d: "a wrong, injury (old noun); as an adjective 'crooked', 'one-eyed'"}
          - {w: "fecistes, ficieron", d: "old forms of hicisteis, hicieron: you did, they did"}
        diagram:
          - s: "o vosotros habéis fecho, o vos han fecho, algún desaguisado"
            r: "main verb 1 (after 'que', for): either you have done, or someone has done to you, some outrage"
            under:
              - {s: "según las muestras", r: "by the look of things"}
          - s: "conviene y es menester"
            r: "main verb 2 (after 'y'): it is fitting and necessary"
            under:
              - s: "que yo lo sepa"
                r: "what is necessary: that I know it"
                under:
                  - {s: "o bien para castigaros del mal que fecistes", r: "purpose 1: either to punish you for the evil you did"}
                  - {s: "o bien para vengaros del tuerto que vos ficieron", r: "purpose 2: or to avenge you for the wrong done to you"}
        forms:
          - {w: "habéis fecho", f: "habéis, the present of haber (to have), you (vosotros), + fecho = hecho, the participle of hacer (to do): 'you have done'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "han fecho", f: "han, the present of haber, they (someone), + fecho: 'they have done'. Same haber present."}
          - {w: "conviene", f: "convien- + -e → convenir (to be fitting), present, it, built like venir: vengo, vienes, viene, venimos, venís, vienen."}
          - {w: "sepa", f: "saber (to know), present subjunctive, I, after 'es menester que'. sepa, sepas, sepa, sepamos, sepáis, sepan."}
          - {w: "castigaros, vengaros", f: "castigar (to punish) and vengar (to avenge) + os (you), infinitives after 'para'. The -r stays before 'os' on an infinitive."}
          - {w: "fecistes", f: "= hicisteis, hacer (to do), preterite, you (vosotros), in the old form with f- and the old ending -istes. Modern: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "ficieron", f: "= hicieron, hacer (to do), preterite, they, with the old f-. Same irregular preterite: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
        note: "Don Quijote slips into the archaic Spanish of the romances of chivalry: f- for h- (fecho, fecistes, ficieron) and 'vos' for 'os'. 'Facer un tuerto' (to do a wrong) and 'desfacer agravios' are the knight-errant's formulas."
