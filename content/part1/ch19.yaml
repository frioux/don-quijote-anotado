  - sentences:
      - es: "— Olvidábaseme de decir que advierta vuestra merced que queda descomulgado por haber puesto las manos violentamente en cosa sagrada: juxta illud: Si quis suadente diabolo, etc."
        literal: "— Was-forgetting-itself-to-me of to-say that may-note your grace that you-remain excommunicated for having put the hands violently on thing sacred: juxta illud: Si quis suadente diabolo, etc."
        ormsby: "“Remember that you stand excommunicated for having laid violent hands on a holy thing, juxta illud, si quis, suadente diabolo.”"
        ormsby_match: false
        vocab:
          - {w: "olvidársele a uno", d: "to slip one's mind, forget"}
          - {w: "advertir", d: "to note, take notice (also 'to warn')"}
          - {w: "descomulgado", d: "old form of excomulgado: excommunicated"}
          - {w: "juxta illud", d: "Latin: 'according to that (canon)'"}
          - {w: "Si quis suadente diabolo", d: "Latin: 'If anyone, at the devil's prompting ...', the opening of the church canon that excommunicates anyone who lays violent hands on a cleric"}
        diagram:
          - s: "Olvidábaseme de decir"
            r: "main verb: I forgot to say"
            under:
              - s: "que advierta vuestra merced"
                r: "what: that your grace should note"
                under:
                  - s: "que queda descomulgado"
                    r: "what to note: that you stand excommunicated"
                    under:
                      - {s: "por haber puesto las manos violentamente en cosa sagrada", r: "why: for laying violent hands on a sacred thing"}
              - {s: "juxta illud: Si quis suadente diabolo, etc.", r: "Latin authority: according to the canon 'If anyone, at the devil's prompting...'"}
        forms:
          - {w: "Olvidábaseme", f: "olvid- + -aba + se + me → olvidarse (to be forgotten), imperfect, it, with 'se' and 'me' (by me) stuck on the end; modern 'se me olvidaba'. Cervantes hangs the pronouns on a verb that opens the clause. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "advierta", f: "adviert- + -a → advertir (to note), present subjunctive, you (vuestra merced). The stem e becomes ie: advierta, adviertas, advierta, advirtamos, advirtáis, adviertan."}
          - {w: "queda", f: "qued- + -a → quedar (to remain), present, you (vuestra merced). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "haber puesto", f: "haber + puesto, the irregular participle of poner (to put): 'having put', after 'por'."}
          - {w: "violentamente", f: "violenta (violent) + -mente: 'violently'."}
        note: "The canon 'Si quis suadente diabolo', from the Second Lateran Council (1139), made excommunication automatic for anyone who struck a cleric. The bachelor quotes it like a lawyer."
