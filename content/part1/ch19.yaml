  - sentences:
      - es: "Estaba una hacha ardiendo en el suelo, junto al primero que derribó la mula, a cuya luz le pudo ver don Quijote; y, llegándose a él, le puso la punta del lanzón en el rostro, diciéndole que se rindiese; si no, que le mataría. A lo cual respondió el caído:"
        literal: "Was a torch burning on the ground, next to-the first [one] that threw-down the mule, at whose light him could see Don Quijote; and, drawing-near to him, to-him he-put the point of-the pike in the face, telling-him that he-should-surrender; if not, that him he-would-kill. To which answered the fallen-one:"
        ormsby: "A burning torch lay on the ground near the first man whom the mule had thrown, by the light of which Don Quixote perceived him, and coming up to him he presented the point of the lance to his face, calling on him to yield himself prisoner, or else he would kill him; to which the prostrate man replied,"
