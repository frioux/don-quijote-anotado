  - sentences:
      - es: "— Harto rendido estoy, pues no me puedo mover, que tengo una pierna quebrada; suplico a vuestra merced, si es caballero cristiano, que no me mate; que cometerá un gran sacrilegio, que soy licenciado y tengo las primeras órdenes."
        literal: "— Plenty surrendered I-am, since not myself I-can move, for I-have a leg broken; I-beg [to] your grace, if you-are knight Christian, that not me you-kill; for you-will-commit a great sacrilege, for I-am licentiate and I-have the first orders."
        ormsby: "“I am prisoner enough as it is; I cannot stir, for one of my legs is broken: I entreat you, if you be a Christian gentleman, not to kill me, which will be committing grave sacrilege, for I am a licentiate and I hold first orders.”"
        vocab:
          - {w: "harto", d: "here an adverb: quite, plenty, more than enough"}
          - {w: "quebrado", d: "broken"}
          - {w: "suplicar", d: "to beg, entreat"}
          - {w: "licenciado", d: "licentiate: holder of the university degree between bachelor and doctor"}
          - {w: "primeras órdenes", d: "first (minor) orders: the lowest grades of clergy, below subdeacon; enough to make him a churchman"}
        diagram:
          - s: "Harto rendido estoy"
            r: "main verb 1: I am surrendered enough"
            under:
              - {s: "pues no me puedo mover", r: "why: since I can't move"}
              - {s: "que tengo una pierna quebrada", r: "why: for I have a broken leg"}
          - s: "suplico a vuestra merced"
            r: "main verb 2: I beg your grace"
            under:
              - {s: "si es caballero cristiano", r: "condition: if you are a Christian knight"}
              - {s: "que no me mate", r: "what I beg: not to kill me"}
              - s: "que cometerá un gran sacrilegio"
                r: "why: for you will commit a great sacrilege"
                under:
                  - {s: "que soy licenciado y tengo las primeras órdenes", r: "why: since I am a licentiate and in first orders"}
        forms:
          - {w: "estoy", f: "estar (to be), present, I. estoy, estás, está, estamos, estáis, están."}
          - {w: "puedo", f: "pued- + -o → poder (can), present, I. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "quebrada", f: "quebr- + -ada → quebrar (to break), past participle, feminine to match 'pierna'."}
          - {w: "suplico", f: "suplic- + -o → suplicar (to beg), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "mate", f: "mat- + -e → matar (to kill), present subjunctive, you (vuestra merced), after 'suplico que'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "cometerá", f: "cometer- + -á → cometer (to commit), future, you (vuestra merced). The future endings on the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "gran", f: "grande (great) clipped before a singular noun."}
          - {w: "soy", f: "ser (to be), present, I. soy, eres, es, somos, sois, son."}
        note: "Striking a cleric was sacrilege and brought automatic excommunication under canon law; the man in minor orders is quick to claim that protection."
