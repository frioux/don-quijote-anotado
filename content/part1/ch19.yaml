        ormsby: "“Unlucky me!” answered Sancho; “if this adventure happens to be one of phantoms, as I am beginning to think it is, where shall I find the ribs to bear it?”"
        vocab:
          - {w: "¡Desdichado de mí!", d: "poor me! woe is me!"}
          - {w: "acaso", d: "perhaps, by chance; 'si acaso' = if by any chance"}
          - {w: "costilla", d: "rib"}
