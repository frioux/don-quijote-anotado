  - sentences:
      - es: "— Si acaso quisieren saber esos señores quién ha sido el valeroso que tales los puso, diráles vuestra merced que es el famoso don Quijote de la Mancha, que por otro nombre se llama el Caballero de la Triste Figura."
        literal: "— If perhaps they-should-want to know those gentlemen who has been the valiant-one who such them put, will-tell-them your grace that he-is the famous Don Quijote of La Mancha, who by other name himself calls the Knight of the Sad Figure."
        ormsby: "“If by chance these gentlemen should want to know who was the hero that served them so, your worship may tell them that he is the famous Don Quixote of La Mancha, otherwise called the Knight of the Rueful Countenance.”"
        ormsby_note: "It has been frequently objected that figura does not mean the face or countenance, but the whole figure; but no matter what dictionaries may say, it is plain from what follows that Sancho applies the word here to his master's face, made haggard by short commons and loss of teeth, and uses it as synonymous with cara; and that Don Quixote himself never could have contemplated painting a full-length on his shield, but merely a face. As a matter of fact, however, the dictionaries do not support the objection. The two best, that of the Academy and of Vicente Salvá, explain figura as the 'external form of a body,' and add that it is commonly used for the face alone, por solo el rostro."
        vocab:
          - {w: "acaso", d: "perhaps, by chance"}
          - {w: "valeroso", d: "valiant; here as a noun, 'the valiant one'"}
          - {w: "ponerlos tales", d: "to leave them in such a state"}
          - {w: "por otro nombre", d: "otherwise called, alias"}
          - {w: "el Caballero de la Triste Figura", d: "the Knight of the Sad Countenance (or Sorry Figure): 'figura' is both the face and the whole look; 'triste' is sad, and also sorry, wretched"}
        diagram:
          - s: "diráles vuestra merced"
            r: "main verb: your grace will tell them"
            under:
              - s: "Si acaso quisieren saber esos señores"
                r: "condition: if those gentlemen should want to know"
                under:
                  - {s: "quién ha sido el valeroso que tales los puso", r: "what: who was the hero that left them so"}
              - s: "que es el famoso don Quijote de la Mancha"
                r: "what to tell: that he is the famous Don Quijote of La Mancha"
                under:
                  - {s: "que por otro nombre se llama el Caballero de la Triste Figura", r: "describes him: otherwise called the Knight of the Sad Countenance"}
        forms:
          - {w: "quisieren", f: "quis- + -ieren → querer (to want), future subjunctive, they, after 'si' for an open future; modern 'quieren'. The future subjunctive of -er and -ir verbs: -iere, -ieres, -iere, -iéremos, -iereis, -ieren."}
          - {w: "ha sido", f: "ha, the present of haber, + sido, the participle of ser: 'has been'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "puso", f: "poner (to put), preterite, he. Irregular: puse, pusiste, puso, pusimos, pusisteis, pusieron."}
          - {w: "diráles", f: "dir- + -á + les → decir (to tell), future, you (vuestra merced), with 'les' (to them) stuck on the end; modern 'les dirá'. Short stem dir-: diré, dirás, dirá, diremos, diréis, dirán."}
          - {w: "se llama", f: "llam- + -a → llamarse (to be called), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
        note: "Sancho coins the most famous of Don Quijote's titles. Knights of the romances took such names from an emblem (the Knight of the Burning Sword); Sancho takes it from his master's battered, toothless face."
  - sentences:
      - es: "Con esto, se fue el bachiller; y don Quijote preguntó a Sancho que qué le había movido a llamarle el Caballero de la Triste Figura, más entonces que nunca."
