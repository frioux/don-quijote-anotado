summary: |
  Riding on after the disasters at the inn, Sancho suggests that all their misfortunes are a punishment for Don Quijote's broken oath not to eat at table until he has won a helmet like 'Malandrino's'. Don Quijote admits he forgot it, blames Sancho for not reminding him, and promises to make amends. Night falls on the highway; they have no food, since Sancho's saddlebags were taken at the inn.

  In the dark they see a crowd of lights coming towards them like moving stars. Sancho shakes with fear; Don Quijote's hair stands on end, but he takes heart. They make out some twenty men in white surplices on mules, carrying torches and murmuring, followed by a litter draped in black and six mourners. Don Quijote decides the litter carries a wounded or murdered knight whom he must avenge, blocks the road, and demands an account. When the riders refuse and ride on, he seizes a mule, which throws its rider, then charges the procession and routs everyone. The unarmed priests flee across the field with their torches, and the mourners, tangled in their gowns, are beaten without resistance.

  The fallen rider, his leg broken and pinned under his mule, turns out to be Alonso López, a bachelor in minor orders from Alcobendas. He explains that he and eleven priests were carrying the bones of a gentleman who died of fever in Baeza to his tomb in Segovia. Don Quijote, finding that God was the killer, says there is nothing to avenge, and introduces himself as the righter of wrongs. The bachelor answers that he has been made crooked from straight. Sancho meanwhile loots the priests' provision mule, then helps get the bachelor out and onto his mule, and tells him to report that the deed was done by Don Quijote, the Knight of the Sad Countenance.

  Don Quijote asks Sancho why he chose that name; Sancho says it is the face his master now has, haggard and missing teeth. Don Quijote decides the enchanter writing his history must have inspired it, and resolves to have a sad face painted on his shield. The bachelor returns to warn him he is excommunicated for striking a cleric; Don Quijote replies that he used a pike, not his hands, and that the Cid was excommunicated too. Sancho talks him out of inspecting the corpse, and they ride into a hidden valley, where they eat breakfast, lunch, snack and supper all at once from the priests' stores. But they have nothing to drink.
context: |
  Funerals, clergy and roads. The procession is a real practice: a body buried provisionally ('depositado') where a man died was later dug up and carried to the family tomb, and the journey was made by night, with torches and chanting priests in surplices. Ormsby explains 'encamisados' as maskers who wore shirts over their clothes on festival nights, and the narrator compares the fleeing priests to such maskers. The 'camino real', as Ormsby notes, was a main road between cities and the capital, where one could expect inns. Mules, not horses, were the mount of clergy and lawyers. The narrator's aside that the priests 'seldom let themselves go short' is a common joke of the time about well-fed clergy, and the provision mule bears it out.

  Chivalry and its parody. Don Quijote reads the scene as a page from his books: a bier with a slain knight, a vengeance reserved for him alone. His challenge slips into the archaic language of the romances (fecho, fecistes, vos, desaguisado, tuerto). The new name is the chapter's great invention. Knights of the romances were known by the device on their shield, and Don Quijote lists some: the Burning Sword (Amadís of Greece), the Unicorn, the Maidens, the Phoenix, the Griffin, Death. Sancho reverses the custom by naming his master from his face, and Don Quijote then plans the device to match the name. Ormsby's long note defends 'Countenance' for 'figura', which the dictionaries gloss as the outward form of a body and, commonly, the face alone.

  The narrator's games. The adventure, says the narrator, really did look like one 'without any artifice', a wink after the windmills and sheep. He ends the chapter on a cliffhanger. The bachelor leaves and comes back again to deliver his parting words, and the early editions differ here: Ormsby's text has the narrator confess that he forgot to report them. The wordplay belongs to the bachelor, who turns Don Quijote's formulas on him: made 'tuerto' (crooked, lame; also 'a wrong') from 'derecho' (straight; also 'right'), as Ormsby notes, the 'agravio' redressed leaving him 'agraviado', and the 'caballero andante' giving him 'mala andanza'.

  Law, religion and medicine. Striking a cleric brought automatic excommunication under the canon 'Si quis suadente diabolo' (Second Lateran Council, 1139), which the bachelor quotes. Don Quijote's defence that he laid on a pike, not hands, is a lawyer's quibble, and he cites the ballad (Ormsby names it, 'A concilio dentro en Roma') in which the Cid smashes the French king's chair before the Pope and is excommunicated. Earlier, Don Quijote speaks of 'composición', the church and legal practice of paying to compound for a penalty or a broken vow, and Sancho is unsure he is clear of guilt 'de participantes', as an accomplice. Sancho shakes like an 'azogado', a man poisoned by the mercury used in mining, and his teeth chatter as in quartan fever.

  Names. 'Malandrino' is Sancho's mangling of Mambrino, the Moorish king of the Italian epics whose enchanted helmet Don Quijote swore to win; 'malandrín' means 'rogue', and Sancho later calls the bachelor a 'malandante', an unlucky man. Alonso López from Alcobendas is a plain, ordinary name, and his comic demotion from licentiate to bachelor shows the man under the lance. Baeza, a university town near Úbeda, and Segovia far to the north make the journey long; commentators since Pellicer have linked it to the night removal of Saint John of the Cross's body from Úbeda to Segovia in 1593. The 'Caballero de la Triste Figura' became the name the world knows Don Quijote by.

  Reading Cervantes' Spanish. The archaic f- for h- stands out when Don Quijote talks like a romance (fecho, fecistes, ficieron, ferido, desfaciendo, folgar). Old spellings: mesmo, asimesmo, escuro, escuridad, estraño, esgremir, entomecer, priesa, escusar, descomulgado, yerba, denantes. Old vosotros endings in -ades and -ábades (veníades, semejábades, aguardábades, érades). Contractions with 'de': desta, deste, della, desa, estotro. Pronouns attached to verbs that open a clause (Paréceme, Pasmóse, Figurósele, Sintióse, Díjole, Olvidábaseme, sucedióles, Rióse). The -ra subjunctive as a conditional (hiciera, acometiera, Quisiera, ¡Hablara yo!), the future subjunctive (quisiere, quisieren, miraren), and 'en + gerund' for 'as soon as' (en viéndolas, en pudiendo). False friends: desgracia (misfortune), discurso (reasoning), composición (settlement), derrota (route), curarse de (to bother), admirado (amazed), luego (at once), hacha (torch).
