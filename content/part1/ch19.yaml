  - sentences:
      - es: "Rióse don Quijote del donaire de Sancho, pero, con todo, propuso de llamarse de aquel nombre en pudiendo pintar su escudo, o rodela, como había imaginado."
        literal: "Laughed Don Quijote at-the wit of Sancho, but, with all, he-resolved of calling-himself by that name on being-able to-paint his shield, or round-shield, as he-had imagined."
        ormsby: "Don Quixote laughed at Sancho’s pleasantry; nevertheless he resolved to call himself by that name, and have his shield or buckler painted as he had devised."
        vocab:
          - {w: "reírse de", d: "to laugh at"}
          - {w: "donaire", d: "wit, witty remark"}
          - {w: "con todo", d: "even so, all the same"}
          - {w: "proponer de", d: "to resolve to, intend to"}
          - {w: "en + gerund", d: "as soon as, on (doing): 'en pudiendo' = as soon as he could"}
          - {w: "rodela", d: "round shield, buckler"}
        diagram:
          - s: "Rióse don Quijote"
            r: "main verb 1: Don Quijote laughed"
            under:
              - {s: "del donaire de Sancho", r: "at what: at Sancho's wit"}
          - s: "propuso de llamarse de aquel nombre"
            r: "main verb 2 (after 'pero'): he resolved to call himself by that name"
            under:
              - {s: "con todo", r: "all the same"}
              - {s: "en pudiendo pintar su escudo, o rodela", r: "when: as soon as he could paint his shield or buckler"}
              - {s: "como había imaginado", r: "as he had planned"}
        forms:
          - {w: "Rióse", f: "ri- + -ó + se → reírse (to laugh), preterite, he, with 'se' stuck on the end; modern 'se rió'. Cervantes hangs the pronoun on a verb that opens the clause. reí, reíste, rió, reímos, reísteis, rieron."}
          - {w: "propuso", f: "proponer (to resolve), preterite, he, built like poner: puse, pusiste, puso, pusimos, pusisteis, pusieron."}
          - {w: "llamarse", f: "llamar (to call) + se (himself), infinitive after 'de'."}
          - {w: "pudiendo", f: "gerund of poder (can), irregular stem pud-."}
          - {w: "había imaginado", f: "había, the imperfect of haber, he, + imaginado, the participle of imaginar: 'had planned'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
