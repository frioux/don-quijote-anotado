  - sentences:
      - es: "— No sé cómo pueda ser eso de enderezar tuertos —dijo el bachiller—, pues a mí de derecho me habéis vuelto tuerto, dejándome una pierna quebrada, la cual no se verá derecha en todos los días de su vida;"
        literal: "— Not I-know how may be that of straightening wrongs —said the bachelor—, since [to] me from straight me you-have turned crooked, leaving-me a leg broken, the which not itself will-see straight in all the days of its life;"
        ormsby: "“I do not know how that about righting wrongs can be,” said the bachelor, “for from straight you have made me crooked, leaving me with a broken leg that will never see itself straight again all the days of its life;"
        ormsby_note: "A quibble on the words derecho and tuerto which mean 'straight' and 'crooked,' as well as 'right' and 'wrong.'"
        vocab:
          - {w: "eso de", d: "that business of"}
          - {w: "derecho", d: "straight; also 'right, just'"}
          - {w: "tuerto", d: "crooked, twisted; as a noun 'a wrong'; also 'one-eyed'"}
          - {w: "volver", d: "here: to turn into, make"}
        diagram:
          - s: "No sé"
            r: "main verb 1: I don't know"
            under:
              - {s: "cómo pueda ser eso de enderezar tuertos", r: "what: how this business of righting wrongs can be"}
              - {s: "dijo el bachiller", r: "speech tag"}
          - s: "pues a mí de derecho me habéis vuelto tuerto"
            r: "why: since you have turned me from straight to crooked"
            under:
              - s: "dejándome una pierna quebrada"
                r: "how: leaving me a broken leg"
                under:
                  - {s: "la cual no se verá derecha en todos los días de su vida", r: "describes 'pierna': which will never be straight again"}
        forms:
          - {w: "sé", f: "saber (to know), present, I, with the accent to tell it from 'se'. sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "pueda", f: "pued- + -a → poder (can), present subjunctive, it, used because he doubts it. The stem o becomes ue: pueda, puedas, pueda, podamos, podáis, puedan."}
          - {w: "habéis vuelto", f: "habéis, the present of haber, you (vosotros), + vuelto, the irregular participle of volver (to turn): 'you have turned'. haber in the present: he, has, ha, hemos, habéis, han."}
