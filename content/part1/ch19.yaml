          - s: "don Quijote preguntó a Sancho"
            r: "main verb 2 (after 'y'): Don Quijote asked Sancho"
            under:
              - {s: "que qué le había movido a llamarle el Caballero de la Triste Figura", r: "what he asked: what had moved him to call him the Knight of the Sad Countenance"}
              - {s: "más entonces que nunca", r: "when: then, rather than at any other time"}
        forms:
          - {w: "se fue", f: "fu- + -e → irse (to go off), preterite, he. ir borrows ser's preterite: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "preguntó", f: "pregunt- + -ó → preguntar (to ask), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "que qué", f: "'que' introduces the reported question and 'qué' (with accent) is the question word: Cervantes keeps both, modern Spanish drops the first."}
          - {w: "había movido", f: "había, the imperfect of haber, it, + movido, the participle of mover (to move): 'had moved'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
