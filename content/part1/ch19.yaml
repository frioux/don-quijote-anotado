part: 1
chapter: 19
title_es: "Capítulo XIX. De las discretas razones que Sancho pasaba con su amo, y de la aventura que le sucedió con un cuerpo muerto, con otros acontecimientos famosos"
title_en: "Of the shrewd discourse which Sancho held with his master, and of the adventure that befell him with a dead body, together with other notable occurrences"
paragraphs:
  - sentences:
      - es: "— Paréceme, señor mío, que todas estas desventuras que estos días nos han sucedido, sin duda alguna han sido pena del pecado cometido por vuestra merced contra la orden de su caballería, no habiendo cumplido el juramento que hizo de no comer pan a manteles ni con la reina folgar, con todo aquello que a esto se sigue y vuestra merced juró de cumplir, hasta quitar aquel almete de Malandrino, o como se llama el moro, que no me acuerdo bien."
        literal: "— It-seems-to-me, lord mine, that all these misfortunes that these days to-us have happened, without doubt any have been punishment of-the sin committed by your grace against the order of your chivalry, not having fulfilled the oath that you-made of not eating bread at tablecloths nor with the queen to-take-pleasure, with all that which to this follows and your grace swore to fulfil, until taking that helmet of Malandrino, or however is-called the Moor, for not I-remember well."
        ormsby: "“It seems to me, señor, that all these mishaps that have befallen us of late have been without any doubt a punishment for the offence committed by your worship against the order of chivalry in not keeping the oath you made not to eat bread off a tablecloth or embrace the queen, and all the rest of it that your worship swore to observe until you had taken that helmet of Malandrino’s, or whatever the Moor is called, for I do not very well remember.”"
        vocab:
          - {w: "desventura", d: "misfortune, mishap"}
          - {w: "pena", d: "here: punishment, penalty (not 'sorrow')"}
          - {w: "vuestra merced", d: "'your grace', the polite address; the ancestor of modern 'usted', so it takes a he/she verb"}
          - {w: "comer pan a manteles", d: "to eat bread at a laid table, i.e. to dine properly; part of the oath from the ballad of the Marquis of Mantua"}
          - {w: "folgar", d: "old form of holgar: to take one's pleasure, to lie with; Sancho garbles the oath"}
          - {w: "almete", d: "helmet with a visor (armet)"}
          - {w: "Malandrino", d: "Sancho's garbling of Mambrino, the Moorish king of Boiardo and Ariosto whose enchanted helmet made the wearer invulnerable"}
          - {w: "acordarse", d: "to remember"}
        diagram:
          - s: "Paréceme"
            r: "main verb: it seems to me"
            under:
              - {s: "señor mío", r: "address: sir"}
              - s: "que todas estas desventuras ... han sido pena del pecado"
                r: "what seems: that all these misfortunes have been the punishment for the sin"
                under:
                  - {s: "que estos días nos han sucedido", r: "describes 'desventuras': that have befallen us these days"}
                  - {s: "sin duda alguna", r: "how sure: without any doubt"}
                  - s: "cometido por vuestra merced contra la orden de su caballería"
                    r: "describes 'pecado': committed by you against your order of chivalry"
                    under:
                      - s: "no habiendo cumplido el juramento"
                        r: "how: by not having kept the oath"
                        under:
                          - {s: "que hizo de no comer pan a manteles ni con la reina folgar", r: "describes 'juramento': that you made, not to dine at table nor take pleasure with the queen"}
                          - {s: "con todo aquello que a esto se sigue y vuestra merced juró de cumplir", r: "and: with everything that follows and that you swore to keep"}
                          - {s: "hasta quitar aquel almete de Malandrino", r: "until when: until taking that helmet of 'Malandrino'"}
                          - {s: "o como se llama el moro, que no me acuerdo bien", r: "aside: or whatever the Moor is called, since I don't remember well"}
        forms:
          - {w: "Paréceme", f: "parec- + -e + me → parecer (to seem), present, it, with 'me' (to me) stuck on the end; modern 'me parece'. Cervantes hangs the pronoun on a verb that opens the clause. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "mío", f: "'mine', the full possessive placed after the noun: 'señor mío' = my lord, sir."}
          - {w: "han sucedido", f: "han, the present of haber (to have), they, + sucedido, the participle of suceder (to happen): 'have happened'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "han sido", f: "han + sido, the participle of ser (to be): 'have been'. Same haber present: he, has, ha, hemos, habéis, han."}
          - {w: "cometido", f: "comet- + -ido → cometer (to commit), past participle used as an adjective, masculine to match 'pecado'."}
          - {w: "habiendo cumplido", f: "habiendo, the gerund of haber (to have), + cumplido, the participle of cumplir (to fulfil): 'having fulfilled'."}
          - {w: "hizo", f: "hacer (to make), preterite, you (vuestra merced takes the he/she form). Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "folgar", f: "= holgar (to take pleasure), infinitive after 'de no'; the old f- that modern Spanish turned into h-."}
          - {w: "se sigue", f: "sigu- + -e → seguirse (to follow), present, it. The stem e becomes i: sigo, sigues, sigue, seguimos, seguís, siguen."}
          - {w: "juró", f: "jur- + -ó → jurar (to swear), preterite, you (vuestra merced). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "se llama", f: "llam- + -a → llamarse (to be called), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "me acuerdo", f: "acuerd- + -o → acordarse (to remember), present, I. The stem o becomes ue when stressed: acuerdo, acuerdas, acuerda, acordamos, acordáis, acuerdan."}
        note: "In chapter 10 Don Quijote swore, like the Marquis of Mantua in the ballad, not to eat bread at table nor lie with his wife until he had won a helmet as good as the one the Biscayan spoiled. Sancho's 'Malandrino' (malandrín = rogue) for Mambrino and 'la reina' for 'su mujer' are his own improvements."
  - sentences:
      - es: "— Tienes mucha razón, Sancho —dijo don Quijote—; mas, para decirte verdad, ello se me había pasado de la memoria;"
        literal: "— You-have much reason, Sancho —said Don Quijote—; but, to tell-you truth, it itself to-me had passed from the memory;"
        ormsby: "“Thou art very right, Sancho,” said Don Quixote, “but to tell the truth, it had escaped my memory;"
        vocab:
          - {w: "tener razón", d: "to be right"}
          - {w: "mas", d: "but (literary; no accent, unlike 'más' = more)"}
          - {w: "pasársele a uno de la memoria", d: "to slip one's mind"}
        diagram:
          - s: "Tienes mucha razón"
            r: "main verb 1: you are quite right"
            under:
              - {s: "Sancho", r: "address"}
              - {s: "dijo don Quijote", r: "speech tag"}
          - s: "ello se me había pasado"
            r: "main verb 2 (after 'mas'): it had slipped from me"
            under:
              - {s: "para decirte verdad", r: "aside: to tell you the truth"}
              - {s: "de la memoria", r: "from where: from my memory"}
        forms:
          - {w: "Tienes", f: "tien- + -es → tener (to have), present, you (tú). Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "dijo", f: "decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "decirte", f: "decir (to tell) + te (you): infinitive after 'para', with the pronoun stuck on the end."}
          - {w: "se me había pasado", f: "había, the imperfect of haber (to have), it, + pasado, the participle of pasar (to pass): pluperfect 'had passed'. 'se' makes it happen by itself, 'me' says to whom: 'it had slipped my mind'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
      - es: "y también puedes tener por cierto que por la culpa de no habérmelo tú acordado en tiempo te sucedió aquello de la manta;"
        literal: "and also you-can hold for certain that for the fault of not having-to-me-it you reminded in time to-you happened that of the blanket;"
        ormsby: "and likewise thou mayest rely upon it that the affair of the blanket happened to thee because of thy fault in not reminding me of it in time;"
        vocab:
          - {w: "tener por cierto", d: "to take as certain, be sure"}
          - {w: "acordar algo a alguien", d: "to remind someone of something"}
          - {w: "en tiempo", d: "in time, at the right moment"}
          - {w: "aquello de la manta", d: "that business of the blanket: Sancho's tossing in a blanket at the inn (chapter 17)"}
        diagram:
          - s: "puedes tener por cierto"
            r: "main verb: you can be sure"
            under:
              - s: "que ... te sucedió aquello de la manta"
                r: "what: that the blanket business happened to you"
                under:
                  - {s: "por la culpa de no habérmelo tú acordado en tiempo", r: "why: through your fault in not reminding me in time"}
        forms:
          - {w: "puedes", f: "pued- + -es → poder (can), present, you. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "habérmelo ... acordado", f: "haber (to have) + me (to me) + lo (it), then acordado, the participle of acordar (to remind): 'having reminded me of it', a perfect infinitive after 'de no'. The subject 'tú' sits in the middle."}
          - {w: "sucedió", f: "suced- + -ió → suceder (to happen), preterite, it. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
      - es: "pero yo haré la enmienda, que modos hay de composición en la orden de la caballería para todo."
        literal: "but I will-make the amends, for ways there-are of settlement in the order of the chivalry for everything."
        ormsby: "but I will make amends, for there are ways of compounding for everything in the order of chivalry.”"
        vocab:
          - {w: "hacer la enmienda", d: "to make amends, atone"}
          - {w: "composición", d: "false friend: a settlement, compounding (paying to be let off a penalty), not 'composition'"}
        diagram:
          - s: "yo haré la enmienda"
            r: "main verb (after 'pero'): I will make amends"
            under:
              - s: "que modos hay de composición"
                r: "why: for there are ways of settling"
                under:
                  - {s: "en la orden de la caballería", r: "where: in the order of chivalry"}
                  - {s: "para todo", r: "for what: for everything"}
        forms:
          - {w: "haré", f: "har- + -é → hacer (to do), future, I. Short stem har-: haré, harás, hará, haremos, haréis, harán."}
          - {w: "hay", f: "the special present of haber (there is / there are); the object 'modos' comes before it."}
        note: "'Composición' was a legal and church term: a payment by which one compounded for a fine or a broken vow. Don Quijote treats the code of chivalry like canon law, with dispensations for a fee."
  - sentences:
      - es: "— Pues, ¿juré yo algo, por dicha? —respondió Sancho."
        literal: "— Well, swore I something, by chance? —answered Sancho."
        ormsby: "“Why! have I taken an oath of some sort, then?” said Sancho."
        vocab:
          - {w: "por dicha", d: "by chance, perhaps (old; modern 'por ventura', 'acaso')"}
        diagram:
          - s: "juré yo algo"
            r: "main verb: did I swear anything?"
            under:
              - {s: "Pues", r: "opener: well, why"}
              - {s: "por dicha", r: "perhaps"}
              - {s: "respondió Sancho", r: "speech tag"}
        forms:
          - {w: "juré", f: "jur- + -é → jurar (to swear), preterite, I. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
  - sentences:
      - es: "— No importa que no hayas jurado —dijo don Quijote—: basta que yo entiendo que de participantes no estás muy seguro, y, por sí o por no, no será malo proveernos de remedio."
        literal: "— Not it-matters that not you-have sworn —said Don Quijote—: it-suffices that I understand that of participants not you-are very safe, and, for yes or for no, not it-will-be bad to-provide-ourselves with remedy."
        ormsby: "“It makes no matter that thou hast not taken an oath,” said Don Quixote; “suffice it that I see thou art not quite clear of complicity; and whether or no, it will not be ill done to provide ourselves with a remedy.”"
        vocab:
          - {w: "bastar", d: "to be enough, suffice"}
          - {w: "de participantes", d: "as an accomplice, from complicity; the canon-law phrase for those who share in an excommunicated person's guilt"}
          - {w: "por sí o por no", d: "just in case, whether or no"}
          - {w: "proveerse de", d: "to provide oneself with"}
        diagram:
          - s: "No importa"
            r: "main verb 1: it doesn't matter"
            under:
              - {s: "que no hayas jurado", r: "what doesn't matter: that you have not sworn"}
              - {s: "dijo don Quijote", r: "speech tag"}
          - s: "basta"
            r: "main verb 2: it is enough"
            under:
              - {s: "que yo entiendo que de participantes no estás muy seguro", r: "what is enough: that I see you are not safe from being an accomplice"}
          - s: "no será malo"
            r: "main verb 3 (after 'y'): it won't be bad"
            under:
              - {s: "por sí o por no", r: "just in case"}
              - {s: "proveernos de remedio", r: "what: to provide ourselves with a remedy"}
        forms:
          - {w: "importa", f: "import- + -a → importar (to matter), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "hayas jurado", f: "hayas, the present subjunctive of haber (to have), you, + jurado (sworn): 'that you have sworn'. Subjunctive after 'no importa que'. haber in the present subjunctive: haya, hayas, haya, hayamos, hayáis, hayan."}
          - {w: "entiendo", f: "entiend- + -o → entender (to understand), present, I. The stem e becomes ie when stressed: entiendo, entiendes, entiende, entendemos, entendéis, entienden."}
          - {w: "estás", f: "estar (to be), present, you. estoy, estás, está, estamos, estáis, están."}
          - {w: "será", f: "ser- + -á → ser (to be), future, it. The future endings on the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "proveernos", f: "proveer (to provide) + nos (ourselves): infinitive used as the subject of 'será'."}
  - sentences:
      - es: "— Pues si ello es así —dijo Sancho—, mire vuestra merced no se le torne a olvidar esto, como lo del juramento; quizá les volverá la gana a las fantasmas de solazarse otra vez conmigo, y aun con vuestra merced si le ven tan pertinaz."
        literal: "— Well if it is so —said Sancho—, look your grace not itself to-you turn to forget this, like that of-the oath; perhaps to-them will-return the desire to the phantoms of amusing-themselves another time with-me, and even with your grace if you they-see so stubborn."
        ormsby: "“In that case,” said Sancho, “mind that your worship does not forget this as you did the oath; perhaps the phantoms may take it into their heads to amuse themselves once more with me; or even with your worship if they see you so obstinate.”"
        vocab:
          - {w: "tornar a", d: "to do again (old; modern 'volver a')"}
          - {w: "lo del juramento", d: "that business of the oath"}
          - {w: "volverle a uno la gana de", d: "to get the urge again to"}
          - {w: "fantasma", d: "phantom; Cervantes makes it feminine here ('las fantasmas')"}
          - {w: "solazarse", d: "to amuse oneself, have fun"}
          - {w: "pertinaz", d: "stubborn, obstinate"}
        diagram:
          - s: "mire vuestra merced"
            r: "main verb 1: mind, your grace"
            under:
              - {s: "Pues si ello es así", r: "condition: well, if that is so"}
              - {s: "dijo Sancho", r: "speech tag"}
              - s: "no se le torne a olvidar esto"
                r: "what to mind: that you don't forget this again ('que' left out)"
                under:
                  - {s: "como lo del juramento", r: "like: as with the oath"}
          - s: "quizá les volverá la gana a las fantasmas"
            r: "main verb 2: perhaps the phantoms will get the urge again"
            under:
              - {s: "de solazarse otra vez conmigo", r: "the urge: to have fun with me again"}
              - {s: "y aun con vuestra merced si le ven tan pertinaz", r: "and even with you, if they see you so stubborn"}
        forms:
          - {w: "mire", f: "mir- + -e → mirar (to look), present subjunctive used as a polite command to vuestra merced: 'mind'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "se le torne a olvidar", f: "torn- + -e → tornar (to turn), present subjunctive, it, + a + olvidar: 'that it slip your mind again'. 'se le olvida' = it gets forgotten by you. Same -e subjunctive."}
          - {w: "volverá", f: "volver- + -á → volver (to return), future, it. The future endings on the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "solazarse", f: "solazar (to amuse) + se (themselves), infinitive after 'de'."}
          - {w: "conmigo", f: "con + mí fused into one word: 'with me'."}
          - {w: "ven", f: "ve- + -n → ver (to see), present, they. veo, ves, ve, vemos, veis, ven."}
        note: "Sancho still believes the blanket-tossing and the beating at the inn (chapters 16-17) were the work of enchanted phantoms, as Don Quijote told him."
  - sentences:
      - es: "En estas y otras pláticas les tomó la noche en mitad del camino, sin tener ni descubrir donde aquella noche se recogiesen; y lo que no había de bueno en ello era que perecían de hambre; que, con la falta de las alforjas, les faltó toda la despensa y matalotaje."
        literal: "In these and other talks them took the night in middle of-the road, without having nor discovering where that night they-might-take-shelter; and that which not there-was of good in it was that they-were-perishing of hunger; for, with the lack of the saddlebags, to-them was-lacking all the larder and provisions."
        ormsby: "While engaged in this and other talk, night overtook them on the road before they had reached or discovered any place of shelter; and what made it still worse was that they were dying of hunger, for with the loss of the alforjas they had lost their entire larder and commissariat;"
        vocab:
          - {w: "plática", d: "talk, conversation"}
          - {w: "tomarle a uno la noche", d: "for night to overtake one"}
          - {w: "recogerse", d: "to take shelter, put up for the night"}
          - {w: "lo que no había de bueno", d: "what was not good about it, the bad part"}
          - {w: "perecer de hambre", d: "to be dying of hunger"}
          - {w: "alforjas", d: "saddlebags; Sancho's were stolen at the inn (chapter 17)"}
          - {w: "despensa", d: "larder, store of food"}
          - {w: "matalotaje", d: "provisions, supplies for a journey (a sailor's word)"}
        diagram:
          - s: "les tomó la noche"
            r: "main verb 1: night overtook them"
            under:
              - {s: "En estas y otras pláticas", r: "when: during this and other talk"}
              - {s: "en mitad del camino", r: "where: in the middle of the road"}
              - {s: "sin tener ni descubrir donde aquella noche se recogiesen", r: "how: without having or finding anywhere to shelter that night"}
          - s: "lo que no había de bueno en ello era"
            r: "main verb 2 (after 'y'): the bad part of it was"
            under:
              - {s: "que perecían de hambre", r: "what: that they were dying of hunger"}
          - s: "les faltó toda la despensa y matalotaje"
            r: "main verb 3 (after 'que', for): they lacked all their larder and provisions"
            under:
              - {s: "con la falta de las alforjas", r: "why: with the loss of the saddlebags"}
        forms:
          - {w: "tomó", f: "tom- + -ó → tomar (to take), preterite, it (the night). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "se recogiesen", f: "recog- + -iesen → recogerse (to take shelter), imperfect subjunctive (-se form), they. Subjunctive because the place is only hoped for. The -se imperfect subjunctive of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen."}
          - {w: "había", f: "hab- + -ía → haber, imperfect, used alone as 'there was'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "perecían", f: "perec- + -ían → perecer (to perish), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "faltó", f: "falt- + -ó → faltar (to be lacking), preterite, it; 'les faltó' = they lacked. Same -ar preterite."}
      - es: "Y, para acabar de confirmar esta desgracia, les sucedió una aventura que, sin artificio alguno, verdaderamente lo parecía."
        literal: "And, to finish of confirming this misfortune, to-them happened an adventure that, without artifice any, truly it seemed."
        ormsby: "and to complete the misfortune they met with an adventure which without any invention had really the appearance of one."
        vocab:
          - {w: "acabar de", d: "to finish doing, complete"}
          - {w: "desgracia", d: "misfortune (false friend: not 'disgrace')"}
          - {w: "artificio", d: "contrivance, invention; 'sin artificio alguno' = without anything made up"}
        diagram:
          - s: "les sucedió una aventura"
            r: "main verb: an adventure befell them"
            under:
              - {s: "para acabar de confirmar esta desgracia", r: "purpose: to round off this misfortune"}
              - {s: "que, sin artificio alguno, verdaderamente lo parecía", r: "describes 'aventura': which, without any invention, truly looked like one"}
        forms:
          - {w: "sucedió", f: "suced- + -ió → suceder (to happen), preterite, it. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "alguno", f: "after the noun and with 'sin', 'alguno' means 'any at all', a strong negative."}
          - {w: "lo parecía", f: "parec- + -ía → parecer (to seem), imperfect, it; 'lo' stands for 'aventura': 'it really looked like one'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
        note: "A wink from the narrator: after windmills, sheep and an inn taken for a castle, this time the adventure really does look like an adventure, with no help from Don Quijote's imagination."
      - es: "Y fue que la noche cerró con alguna escuridad; pero, con todo esto, caminaban, creyendo Sancho que, pues aquel camino era real, a una o dos leguas, de buena razón, hallaría en él alguna venta."
        literal: "And it-was that the night closed with some darkness; but, with all this, they-were-walking, believing Sancho that, since that road was royal, at one or two leagues, of good reason, he-would-find on it some inn."
        ormsby: "It so happened that the night closed in somewhat darkly, but for all that they pushed on, Sancho feeling sure that as the road was the king’s highway they might reasonably expect to find some inn within a league or two."
        ormsby_note: "Camino real, one of the main roads connecting the provinces or chief cities with the capital."
        vocab:
          - {w: "escuridad", d: "old form of oscuridad: darkness"}
          - {w: "con todo esto", d: "for all that, nevertheless"}
          - {w: "pues", d: "here: since, because"}
          - {w: "camino real", d: "royal road, highway: a main road kept up by the crown"}
          - {w: "legua", d: "league, about three miles; roughly an hour's walk"}
          - {w: "de buena razón", d: "by all reason, reasonably"}
          - {w: "venta", d: "roadside inn"}
        diagram:
          - {s: "Y fue", r: "main verb 1: and it happened"}
          - {s: "que la noche cerró con alguna escuridad", r: "what happened: that night fell rather dark"}
          - s: "caminaban"
            r: "main verb 2 (after 'pero'): they kept walking"
            under:
