  - sentences:
      - es: "— No sé yo cómo puede ser eso; que en verdad que, a lo que yo entiendo, no hay mejor letrado en el mundo, y que tengo ahí dos o tres dellos, con otros papeles, que verdaderamente me han dado la vida, no sólo a mí, sino a otros muchos."
        literal: "— Not know I how can be that; for in truth that, to that which I understand, not there-is better learned-one in the world, and that I-have there two or three of-them, with other papers, which truly to-me have given the life, not only to me, but to others many."
        ormsby: "“I cannot understand how that can be, for in truth to my mind there is no better reading in the world, and I have here two or three of them, with other writings that are the very life, not only of myself but of plenty more;"
        vocab:
          - {w: "a lo que yo entiendo", d: "as far as I can tell, in my opinion"}
          - {w: "letrado", d: "a man of letters, lawyer; the innkeeper uses it loosely for 'reading matter', and some editors read 'letura' (reading)"}
          - {w: "dellos", d: "= de ellos, 'of them'; Cervantes fuses 'de' with él, ella, ellos, este"}
          - {w: "papeles", d: "papers, manuscripts"}
          - {w: "dar la vida", d: "to give life, revive, be a joy to"}
          - {w: "otros muchos", d: "many others (old word order)"}
        diagram:
          - s: "No sé yo"
            r: "main verb: I don't know"
            under:
              - {s: "cómo puede ser eso", r: "what: how that can be"}
          - s: "que en verdad que ... no hay mejor letrado en el mundo"
            r: "why, 1: for truly there is no better reading in the world"
            under:
              - {s: "a lo que yo entiendo", r: "aside: as far as I can tell"}
          - s: "y que tengo ahí dos o tres dellos, con otros papeles"
            r: "why, 2: and I have two or three of them here, with other papers"
            under:
              - {s: "que verdaderamente me han dado la vida, no sólo a mí, sino a otros muchos", r: "describes them: that have truly given life to me and to many others"}
        forms:
          - {w: "sé", f: "saber (to know), present, I. Irregular: sé, sabes, sabe, sabemos, sabéis, saben. The accent tells it from 'se'."}
          - {w: "puede", f: "pued- + -e → poder (can), present, it. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "entiendo", f: "entiend- + -o → entender (to understand), present, I. The stem e becomes ie when stressed: entiendo, entiendes, entiende, entendemos, entendéis, entienden."}
          - {w: "hay", f: "the present of haber used alone: 'there is, there are'."}
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "dellos", f: "de + ellos (of them)."}
          - {w: "han dado", f: "h- + -an → haber, present, they, + dado, the participle of dar (to give): the present perfect 'have given'. he, has, ha, hemos, habéis, han."}
          - {w: "verdaderamente", f: "verdader- + -a + -mente → verdadero (true) + -mente: 'truly'. The -mente adverb is built on the feminine."}
      - es: "Porque, cuando es tiempo de la siega, se recogen aquí, las fiestas, muchos segadores, y siempre hay algunos que saben leer, el cual coge uno destos libros en las manos, y rodeámonos dél más de treinta, y estámosle escuchando con tanto gusto que nos quita mil canas;"
        literal: "Because, when it-is time of the harvest, gather-themselves here, the feast-days, many reapers, and always there-are some who know-how to-read, the which takes one of-these books in the hands, and surround-ourselves of-him more than thirty, and we-are-him listening with so-much pleasure that from-us it-takes a-thousand gray-hairs;"
        ormsby: "for when it is harvest-time, the reapers flock here on holidays, and there is always one among them who can read and who takes up one of these books, and we gather round him, thirty or more of us, and stay listening to him with a delight that makes our grey hairs grow young again."
        ormsby_note: "Literally, \"Rids us of a thousand gray hairs.\""
        vocab:
          - {w: "siega", d: "harvest, reaping of grain"}
          - {w: "recogerse", d: "to gather, take shelter, come in for the night"}
          - {w: "las fiestas", d: "on feast days, holidays (no preposition needed)"}
          - {w: "segador", d: "reaper, harvester"}
          - {w: "el cual", d: "who, the one who; here it refers back to 'algunos' as if it were singular"}
          - {w: "coger", d: "to take, pick up"}
          - {w: "rodearse de", d: "to gather round; 'rodeámonos dél' = we gather round him"}
          - {w: "quitar canas", d: "to take away gray hairs, make one young again"}
        diagram:
          - s: "se recogen aquí"
            r: "main verb 1: gather here"
            under:
              - {s: "cuando es tiempo de la siega", r: "when: at harvest time"}
              - {s: "las fiestas", r: "when: on holidays"}
              - {s: "muchos segadores", r: "subject: many reapers"}
          - s: "y siempre hay algunos"
            r: "main verb 2: and there are always some"
            under:
              - {s: "que saben leer", r: "describes 'algunos': who can read"}
          - {s: "el cual coge uno destos libros en las manos", r: "main verb 3: and he takes one of these books in his hands"}
          - s: "y rodeámonos dél"
            r: "main verb 4: and we gather round him"
            under:
              - {s: "más de treinta", r: "subject: more than thirty of us"}
          - s: "y estámosle escuchando"
            r: "main verb 5: and we sit listening to him"
            under:
              - s: "con tanto gusto"
                r: "how: with such pleasure"
                under:
                  - {s: "que nos quita mil canas", r: "result: that it takes a thousand gray hairs off us"}
        forms:
          - {w: "se recogen", f: "recog- + -en → recogerse (to gather), present, they. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "saben", f: "sab- + -en → saber (to know how), present, they. sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "coge", f: "cog- + -e → coger (to take), present, he. Same -er present."}
          - {w: "destos", f: "de + estos (of these)."}
          - {w: "rodeámonos", f: "rode- + -amos + nos → rodearse (to gather round), present, we, with 'nos' stuck on the end; the -s of -amos drops before 'nos'. Cervantes hangs pronouns on a conjugated verb that opens its clause; modern 'nos rodeamos'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
