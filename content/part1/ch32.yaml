part: 1
chapter: 32
title_es: "Capítulo XXXII. Que trata de lo que sucedió en la venta a toda la cuadrilla de don Quijote"
title_en: "Which treats of what befell Don Quixote's party at the inn"
paragraphs:
  - sentences:
      - es: "Acabóse la buena comida, ensillaron luego, y, sin que les sucediese cosa digna de contar, llegaron otro día a la venta, espanto y asombro de Sancho Panza; y, aunque él quisiera no entrar en ella, no lo pudo huir."
        literal: "Finished-itself the good meal, they-saddled at-once, and, without that to-them should-happen [a] thing worthy of telling, they-arrived [the] other day at the inn, fright and terror of Sancho Panza; and, although he would-have-wanted not to-enter into it, not it he-could flee."
        ormsby: "Their dainty repast being finished, they saddled at once, and without any adventure worth mentioning they reached next day the inn, the object of Sancho Panza’s fear and dread; but though he would have rather not entered it, there was no help for it."
        vocab:
          - {w: "acabarse", d: "to come to an end, be finished"}
          - {w: "ensillar", d: "to saddle (from 'silla', saddle)"}
          - {w: "luego", d: "at once, straight away (its usual sense in Cervantes), not 'later'"}
          - {w: "digno de contar", d: "worth telling"}
          - {w: "otro día", d: "the next day (not 'another day')"}
          - {w: "venta", d: "roadside inn; the same inn where Sancho was tossed in a blanket"}
          - {w: "espanto y asombro", d: "fright and terror; 'asombro' here is still 'fright', not just 'amazement'"}
          - {w: "huir", d: "to flee; 'no lo pudo huir' = he could not avoid it"}
        diagram:
          - s: "Acabóse"
            r: "main verb 1: was finished"
            under:
              - {s: "la buena comida", r: "subject: the good meal"}
          - {s: "ensillaron luego", r: "main verb 2: they saddled at once"}
          - s: "llegaron otro día a la venta"
            r: "main verb 3 (after 'y'): they reached the inn the next day"
            under:
              - {s: "sin que les sucediese cosa digna de contar", r: "how: without anything worth telling happening to them"}
              - {s: "espanto y asombro de Sancho Panza", r: "describes 'venta': Sancho's terror"}
          - s: "no lo pudo huir"
            r: "main verb 4 (after 'y'): he could not avoid it"
            under:
              - {s: "aunque él quisiera no entrar en ella", r: "concession: although he would have liked not to go in"}
        forms:
          - {w: "Acabóse", f: "acab- + -ó + se → acabarse (to come to an end), preterite, it, with 'se' stuck on the end. Cervantes hangs pronouns on the end of a conjugated verb that opens its clause; modern Spanish says 'se acabó'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "ensillaron", f: "ensill- + -aron → ensillar (to saddle), preterite, they. Same -ar preterite."}
          - {w: "sucediese", f: "suced- + -iese → suceder (to happen), imperfect subjunctive (-se form), it. Subjunctive after 'sin que' (without). The -se form of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen."}
          - {w: "digna", f: "dign- + -a → digno (worthy), feminine to match 'cosa'."}
          - {w: "llegaron", f: "lleg- + -aron → llegar (to arrive), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "quisiera", f: "quis- + -iera → querer (to want), imperfect subjunctive (-ra form), he: here 'would have liked'. quisiera, quisieras, quisiera, quisiéramos, quisierais, quisieran. Cervantes often uses the -ra form where modern Spanish says 'habría querido'."}
          - {w: "pudo", f: "pud- + -o → poder (to be able), preterite, he. Irregular stem: pude, pudiste, pudo, pudimos, pudisteis, pudieron."}
      - es: "La ventera, ventero, su hija y Maritornes, que vieron venir a don Quijote y a Sancho, les salieron a recebir con muestras de mucha alegría, y él las recibió con grave continente y aplauso, y díjoles que le aderezasen otro mejor lecho que la vez pasada;"
        literal: "The innkeeper's-wife, innkeeper, his daughter and Maritornes, who saw coming [to] Don Quijote and [to] Sancho, to-them went-out to receive with shows of much joy, and he them received with grave countenance and approval, and told-them that for-him they-should-prepare another better bed than the time past;"
        ormsby: "The landlady, the landlord, their daughter, and Maritornes, when they saw Don Quixote and Sancho coming, went out to welcome them with signs of hearty satisfaction, which Don Quixote received with dignity and gravity, and bade them make up a better bed for him than the last time:"
        vocab:
          - {w: "ventera, ventero", d: "the innkeeper's wife and the innkeeper; 'venta' = inn"}
          - {w: "Maritornes", d: "the ugly Asturian serving-girl of the inn, from Chapter 16"}
          - {w: "salir a recebir", d: "to go out to meet, welcome; 'recebir' is the old spelling of 'recibir'"}
          - {w: "muestras", d: "signs, shows, tokens"}
          - {w: "continente", d: "bearing, countenance, demeanor (false friend: not 'continent')"}
          - {w: "aplauso", d: "approval, satisfaction (not clapping)"}
          - {w: "aderezar", d: "to prepare, make ready (a bed, a meal)"}
          - {w: "lecho", d: "bed (literary word for 'cama')"}
          - {w: "la vez pasada", d: "last time"}
        diagram:
          - s: "les salieron a recebir"
            r: "main verb 1: went out to welcome them"
            under:
              - s: "La ventera, ventero, su hija y Maritornes"
                r: "subject: the four people of the inn"
                under:
                  - {s: "que vieron venir a don Quijote y a Sancho", r: "describes the subject: who saw Don Quijote and Sancho coming"}
              - {s: "con muestras de mucha alegría", r: "how: with signs of great joy"}
          - s: "él las recibió"
            r: "main verb 2 (after 'y'): he received them"
            under:
              - {s: "con grave continente y aplauso", r: "how: with a grave face and approval"}
          - s: "y díjoles"
            r: "main verb 3: and told them"
            under:
              - {s: "que le aderezasen otro mejor lecho que la vez pasada", r: "what he told them: to make him a better bed than last time"}
        forms:
          - {w: "vieron", f: "vi- + -eron → ver (to see), preterite, they. ver's preterite: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "salieron", f: "sal- + -ieron → salir (to go out), preterite, they. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "recebir", f: "old spelling of recibir (to receive), infinitive after 'salir a'. A few lines later Cervantes writes 'recibió' with the modern vowel; the spelling of the time was not fixed."}
          - {w: "las recibió", f: "recib- + -ió → recibir (to receive), preterite, he, with 'las' (them, the women). Same -ir preterite."}
          - {w: "díjoles", f: "dij- + -o + les → decir (to say, tell), preterite, he, with 'les' (to them) stuck on the end. Cervantes hangs pronouns on a conjugated verb that opens its clause; modern 'les dijo'. decir's preterite: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "aderezasen", f: "aderez- + -asen → aderezar (to prepare), imperfect subjunctive (-se form), they. Subjunctive because it is an order reported after 'decir que'. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "pasada", f: "pas- + -ada → participle of pasar (to pass), feminine to match 'vez': 'last'."}
      - es: "a lo cual le respondió la huéspeda que como la pagase mejor que la otra vez, que ella se la daría de príncipes."
        literal: "to which to-him answered the hostess that provided-that her he-paid better than the other time, that she to-him it would-give of princes."
        ormsby: "to which the landlady replied that if he paid better than he did the last time she would give him one fit for a prince."
        vocab:
          - {w: "huéspeda", d: "here 'hostess, landlady' (the innkeeper's wife); 'huésped' can mean both host and guest"}
          - {w: "como", d: "with the subjunctive, 'provided that, if', not 'as' or 'how'"}
          - {w: "de príncipes", d: "fit for princes"}
        diagram:
          - s: "le respondió"
            r: "main verb: answered him"
            under:
              - {s: "a lo cual", r: "to what: to which"}
              - {s: "la huéspeda", r: "subject: the landlady"}
              - s: "que ella se la daría de príncipes"
                r: "what she answered: that she would give him one fit for princes"
                under:
                  - {s: "como la pagase mejor que la otra vez", r: "condition: provided he paid for it better than last time"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, she. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "pagase", f: "pag- + -ase → pagar (to pay), imperfect subjunctive (-se form), he. Subjunctive after 'como' meaning 'provided that'. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "que ... que", f: "the second 'que' repeats the first after the interruption ('como ... vez'); speech reported in Cervantes often does this."}
          - {w: "se la daría", f: "dar- + -ía → dar (to give), conditional, she: 'would give'. 'la' = it (the cama, bed); 'se' = to him, because 'le' becomes 'se' before 'la'. The conditional adds to the infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
      - es: "Don Quijote dijo que sí haría, y así, le aderezaron uno razonable en el mismo caramanchón de marras, y él se acostó luego, porque venía muy quebrantado y falto de juicio."
        literal: "Don Quijote said that yes he-would-do, and so, for-him they-prepared one reasonable in the same garret of yore, and he lay-himself-down at-once, because he-came very broken and short of wits."
        ormsby: "Don Quixote said he would, so they made up a tolerable one for him in the same garret as before; and he lay down at once, being sorely shaken and in want of sleep."
        vocab:
          - {w: "sí haría", d: "that he would indeed; 'sí' stresses the answer"}
          - {w: "razonable", d: "decent, tolerable"}
          - {w: "caramanchón", d: "garret, attic room (= camaranchón); the loft where he slept in Chapter 16"}
          - {w: "de marras", d: "of old, the one we know of, the same as before"}
          - {w: "acostarse", d: "to go to bed, lie down"}
          - {w: "quebrantado", d: "broken, battered, worn out"}
          - {w: "falto de juicio", d: "short of wits, out of his senses"}
        diagram:
          - s: "Don Quijote dijo"
            r: "main verb 1: Don Quijote said"
            under:
              - {s: "que sí haría", r: "what he said: that he would"}
          - s: "le aderezaron uno razonable"
            r: "main verb 2 (after 'y así'): they made him a decent one"
            under:
              - {s: "en el mismo caramanchón de marras", r: "where: in the same garret as before"}
          - s: "y él se acostó luego"
            r: "main verb 3: and he lay down at once"
            under:
              - {s: "porque venía muy quebrantado y falto de juicio", r: "why: because he arrived very battered and out of his wits"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. decir's preterite: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "haría", f: "har- + -ía → hacer (to do), conditional, he: 'he would (do so)'. Irregular stem har-: haría, harías, haría, haríamos, haríais, harían."}
          - {w: "aderezaron", f: "aderez- + -aron → aderezar (to prepare), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "uno", f: "the full form of 'un' used alone, standing for 'lecho' (bed): 'one'."}
          - {w: "se acostó", f: "acost- + -ó → acostarse (to lie down), preterite, he, with 'se' (himself). Same -ar preterite."}
          - {w: "venía", f: "ven- + -ía → venir (to come), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "quebrantado, falto", f: "quebrantado is the participle of quebrantar (to break), masculine to match 'él'; falto (lacking) is an adjective, also masculine."}
        note: "Ormsby reads 'falto de juicio' as 'in want of sleep'; the Spanish says 'short of wits', the narrator's usual dig at the knight's madness."
  - sentences:
      - es: "No se hubo bien encerrado, cuando la huéspeda arremetió al barbero, y, asiéndole de la barba, dijo:"
        literal: "Not himself he-had well shut-in, when the hostess charged at-the barber, and, seizing-him by the beard, said:"
        ormsby: "No sooner was the door shut upon him than the landlady made at the barber, and seizing him by the beard, said:"
        vocab:
          - {w: "no ... bien ... cuando", d: "no sooner ... than"}
          - {w: "encerrarse", d: "to shut oneself in"}
          - {w: "arremeter a", d: "to rush at, attack"}
          - {w: "asir de", d: "to seize by, grab hold of"}
          - {w: "barba", d: "beard; here the false beard the barber made from the landlady's ox-tail in Chapter 27"}
        diagram:
          - s: "No se hubo bien encerrado"
            r: "time clause: he had hardly shut himself in"
          - s: "cuando la huéspeda arremetió al barbero"
            r: "main verb 1: when the landlady went for the barber"
          - s: "dijo:"
            r: "main verb 2 (after 'y'): she said"
            under:
              - {s: "asiéndole de la barba", r: "how: grabbing him by the beard"}
        forms:
          - {w: "se hubo ... encerrado", f: "hub- + -o → haber, preterite, he, + encerrado, the participle of encerrar (to shut in): the past anterior, 'had shut himself in', used after 'no bien', 'apenas', 'cuando'. haber's preterite: hube, hubiste, hubo, hubimos, hubisteis, hubieron."}
          - {w: "arremetió", f: "arremet- + -ió → arremeter (to charge), preterite, she. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "al", f: "a + el; the 'a' marks a person as the object."}
          - {w: "asiéndole", f: "asiendo, the gerund of asir (to seize), + le (him), accent added to keep the stress. 'le' for a male person as object is Castilian leísmo; strict grammar wants 'lo'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, she. dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Para mi santiguada, que no se ha aún de aprovechar más de mi rabo para su barba, y que me ha de volver mi cola; que anda lo de mi marido por esos suelos, que es vergüenza; digo, el peine, que solía yo colgar de mi buena cola."
        literal: "— By my sign-of-the-cross, that not himself he-has yet to make-use more of my tail for his beard, and that to-me he-has to return my tail; for goes the [thing] of my husband along those floors, which is shame; I-say, the comb, which used I to-hang from my good tail."
        ormsby: "“By my faith you are not going to make a beard of my tail any longer; you must give me back tail, for it is a shame the way that thing of my husband’s goes tossing about on the floor; I mean the comb that I used to stick in my good tail.”"
        vocab:
          - {w: "para mi santiguada", d: "a mild oath, 'by my faith', literally 'by the cross I sign on myself'"}
          - {w: "aprovecharse de", d: "to make use of, take advantage of"}
          - {w: "rabo, cola", d: "tail; here the dyed ox-tail she kept her husband's comb in, which the barber wore as a beard"}
          - {w: "haber de", d: "to have to, must; 'me ha de volver' = he must give me back"}
          - {w: "andar por esos suelos", d: "to be lying about on the floor, kicked around"}
          - {w: "lo de mi marido", d: "my husband's thing; she means the comb, and the phrase sounds rude, so she corrects herself"}
          - {w: "peine", d: "comb"}
          - {w: "soler", d: "to be in the habit of, used to"}
        diagram:
          - {s: "Para mi santiguada", r: "oath: by my faith"}
          - s: "que no se ha aún de aprovechar más de mi rabo para su barba"
            r: "what she swears, 1: he shall not use my tail for his beard any longer"
          - {s: "y que me ha de volver mi cola", r: "what she swears, 2: and he must give my tail back"}
          - s: "que anda lo de mi marido por esos suelos"
            r: "why: for my husband's thing lies about on the floor"
            under:
              - {s: "que es vergüenza", r: "comment: which is a shame"}
          - s: "digo, el peine"
            r: "correction: I mean, the comb"
            under:
              - {s: "que solía yo colgar de mi buena cola", r: "describes 'peine': that I used to hang on my good tail"}
        forms:
          - {w: "mi", f: "'my', one form for both genders (mi, mis)."}
          - {w: "se ha ... de aprovechar", f: "h- + -a → haber, present, he, + 'de' + infinitive: 'he is to make use, he shall'. haber in the present: he, has, ha, hemos, habéis, han. 'se' goes with aprovecharse (to make use of)."}
          - {w: "me ha de volver", f: "the same 'ha de' + infinitive: 'he must give back to me'; volver (to return, give back)."}
          - {w: "anda", f: "and- + -a → andar (to go about), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "esos", f: "es- + -os → ese (that), masculine plural to match 'suelos'."}
          - {w: "digo", f: "dig- + -o → decir (to say), present, I: 'I mean'. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "solía", f: "sol- + -ía → soler (to be used to), imperfect, I: 'I used to'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
        note: "The joke is the landlady's slip: 'lo de mi marido' (my husband's thing) suggests something indecent until she adds 'I mean, the comb'. The ox-tail was lent in Chapter 27 for the barber's disguise."
  - sentences:
      - es: "No se la quería dar el barbero, aunque ella más tiraba, hasta que el licenciado le dijo que se la diese, que ya no era menester más usar de aquella industria, sino que se descubriese y mostrase en su misma forma, y dijese a don Quijote que cuando le despojaron los ladrones galeotes se habían venido a aquella venta huyendo;"
        literal: "Not to-her it wanted to-give the barber, although she more pulled, until the licentiate to-him said that to-her it he-should-give, for now not was necessary more to-use of that trick, but that he-should-uncover-himself and show-himself in his same form, and should-tell [to] Don Quijote that when him stripped the thieves galley-slaves they-had come to that inn fleeing;"
        ormsby: "But for all she tugged at it the barber would not give it up until the licentiate told him to let her have it, as there was now no further occasion for that stratagem, because he might declare himself and appear in his own character, and tell Don Quixote that he had fled to this inn when those thieves the galley slaves robbed him;"
        vocab:
          - {w: "tirar", d: "to pull, tug"}
          - {w: "licenciado", d: "licentiate, holder of a university degree; here the priest (Pero Pérez)"}
          - {w: "ser menester", d: "to be necessary"}
          - {w: "industria", d: "trick, scheme, stratagem (false friend: not 'industry')"}
          - {w: "descubrirse", d: "to reveal oneself, take off a disguise"}
          - {w: "en su misma forma", d: "as himself, in his own shape"}
          - {w: "despojar", d: "to strip, rob"}
          - {w: "galeote", d: "galley slave, convict condemned to row in the king's galleys (the ones Don Quijote freed in Chapter 22)"}
        diagram:
          - s: "No se la quería dar"
            r: "main verb: would not give it to her"
            under:
              - {s: "el barbero", r: "subject: the barber"}
              - {s: "aunque ella más tiraba", r: "concession: however hard she pulled"}
              - s: "hasta que el licenciado le dijo"
                r: "until: until the priest told him"
                under:
                  - {s: "que se la diese", r: "what he told him, 1: to give it to her"}
                  - s: "que ya no era menester más usar de aquella industria"
                    r: "why: since that trick was no longer needed"
                  - {s: "sino que se descubriese y mostrase en su misma forma", r: "what he told him, 2: but to reveal himself as himself"}
                  - s: "y dijese a don Quijote"
                    r: "what he told him, 3: and to tell Don Quijote"
                    under:
                      - {s: "que cuando le despojaron los ladrones galeotes se habían venido a aquella venta huyendo", r: "what to tell him: that when the galley slaves robbed him, they had fled to this inn"}
        forms:
          - {w: "se la quería dar", f: "quer- + -ía → querer (to want), imperfect, he, + dar (to give): 'would not give'. 'la' = it (the tail); 'se' = to her, because 'le' becomes 'se' before 'la'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "tiraba", f: "tir- + -aba → tirar (to pull), imperfect, she. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "dijo", f: "dij- + -o → decir (to say, tell), preterite, he. dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "diese", f: "di- + -ese → dar (to give), imperfect subjunctive (-se form), he. Subjunctive because it reports an order ('dijo que'). diese, dieses, diese, diésemos, dieseis, diesen."}
          - {w: "era", f: "ser (to be), imperfect, it. era, eras, era, éramos, erais, eran."}
          - {w: "se descubriese y mostrase, dijese", f: "descubr- + -iese → descubrirse (to reveal oneself), mostr- + -ase → mostrarse (to show oneself), dij- + -ese → decir (to tell), imperfect subjunctive (-se form), he, still after 'dijo que'. The -se form: -ase, -ases, -ase, -ásemos, -aseis, -asen for -ar verbs; -iese, -ieses, -iese, -iésemos, -ieseis, -iesen for -er and -ir verbs; decir has dijese."}
          - {w: "despojaron", f: "despoj- + -aron → despojar (to rob), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "se habían venido", f: "hab- + -ían → haber, imperfect, they, + venido, the participle of venir (to come), with 'se': the pluperfect 'they had come away'. The pluperfect is the imperfect of haber + participle: había, habías, había, habíamos, habíais, habían."}
          - {w: "huyendo", f: "gerund of huir (to flee): 'fleeing'; the i between vowels becomes y."}
        note: "In Chapter 29 the priest told Don Quijote that he and the barber had been robbed on the road by the galley slaves the knight had freed. Now the barber can drop his disguise as the princess's squire and appear as himself."
      - es: "y que si preguntase por el escudero de la princesa, le dirían que ella le había enviado adelante a dar aviso a los de su reino como ella iba y llevaba consigo el libertador de todos."
        literal: "and that if he-should-ask for the squire of the princess, to-him they-would-say that she him had sent ahead to give notice to those of her kingdom how she was-going and was-bringing with-herself the liberator of all."
        ormsby: "and should he ask for the princess’s squire, they could tell him that she had sent him on before her to give notice to the people of her kingdom that she was coming, and bringing with her the deliverer of them all."
        vocab:
          - {w: "preguntar por", d: "to ask about, ask after"}
          - {w: "escudero", d: "squire; the part the barber played in the Micomicona plot"}
          - {w: "dar aviso", d: "to give notice, warn"}
          - {w: "como", d: "here 'that', introducing what the message says"}
          - {w: "consigo", d: "with herself, with her"}
