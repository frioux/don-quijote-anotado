      - es: "El primer libro que abrió vio que era Don Cirongilio de Tracia; y el otro, de Felixmarte de Hircania; y el otro, la Historia del Gran Capitán Gonzalo Hernández de Córdoba, con la vida de Diego García de Paredes."
        literal: "The first book that he-opened he-saw that it-was Don Cirongilio of Thrace; and the other, of Felixmarte of Hircania; and the other, the History of-the Great Captain Gonzalo Hernández of Córdoba, with the life of Diego García de Paredes."
        ormsby: "The first that he opened he found to be “Don Cirongilio of Thrace,” and the second “Don Felixmarte of Hircania,” and the other the “History of the Great Captain Gonzalo Hernández de Cordova, with the Life of Diego García de Paredes.”"
        ormsby_note: "Don Cirongilio de Tracia was by Bernado de Vargas and appeared at Seville in 1545. The title of the third is Crónica del Gran Capitan Gonzalo Hernández de Cordoba y Aguilar, to which is added the life of Diego García de Paredes, written by himself. It appeared at Saragossa in 1559. Gonzalo, the reader need hardly be reminded, was the brilliant general whose services against the Moors at Granada and the French in Naples were so ungratefully repaid by Ferdinand. García de Paredes was Gonzalo's companion-in-arms in both campaigns. His battered corselet in the Armería at Madrid is as good as a ballad."
        vocab:
          - {w: "Don Cirongilio de Tracia", d: "hero of a romance of chivalry by Bernardo de Vargas (Seville, 1545)"}
          - {w: "Felixmarte de Hircania", d: "hero of a romance of chivalry by Melchor de Ortega (Valladolid, 1556); one of the books burned from Don Quijote's library in Chapter 6"}
          - {w: "el Gran Capitán", d: "Gonzalo Fernández de Córdoba (1453-1515), the general who won Naples for Spain; a real man, not a romance hero"}
          - {w: "Diego García de Paredes", d: "a real soldier from Trujillo (1468-1533), famous for his strength, who served under the Great Captain"}
        diagram:
          - s: "vio"
            r: "main verb: he saw"
            under:
              - s: "El primer libro"
                r: "topic, placed first: the first book"
                under:
                  - {s: "que abrió", r: "describes 'libro': that he opened"}
              - {s: "que era Don Cirongilio de Tracia", r: "what he saw: that it was Don Cirongilio of Thrace"}
              - {s: "y el otro, de Felixmarte de Hircania", r: "what he saw, 2 (verb understood): and the next, of Felixmarte of Hircania"}
              - {s: "y el otro, la Historia del Gran Capitán Gonzalo Hernández de Córdoba, con la vida de Diego García de Paredes", r: "what he saw, 3: and the other, the History of the Great Captain with the life of Diego García de Paredes"}
        forms:
          - {w: "primer", f: "primero (first) clipped before a masculine singular noun ('libro'), like buen, gran, algún."}
          - {w: "abrió", f: "abr- + -ió → abrir (to open), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "vio", f: "ver (to see), preterite, he. vi, viste, vio, vimos, visteis, vieron."}
          - {w: "era", f: "ser (to be), imperfect, it. era, eras, era, éramos, erais, eran."}
          - {w: "Gran", f: "grande (great) clipped before a singular noun ('Capitán')."}
        note: "Felixmarte de Hircania, by Melchor de Ortega (1556), was one of the romances the priest threw out of Don Quijote's library in Chapter 6. The case holds two fantastic romances and one chronicle of a real general, and the argument that follows turns on the difference."
