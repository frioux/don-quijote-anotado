          - {w: "semejante", d: "similar, of that sort"}
          - {w: "compostura", d: "composition, made-up thing, invention"}
          - {w: "ingenios ociosos", d: "idle wits, writers with nothing better to do"}
          - {w: "efeto", d: "= efecto, purpose, effect; old spelling"}
          - {w: "entretener el tiempo", d: "to pass the time, beguile the hours"}
