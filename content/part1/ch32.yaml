  - sentences:
      - es: "— Así me parece a mí —respondió Cardenio—, porque, según da indicio, él tiene por cierto que todo lo que estos libros cuentan pasó ni más ni menos que lo escriben, y no le harán creer otra cosa frailes descalzos."
        literal: "— So to-me it-seems to me —answered Cardenio—, because, according-as he-gives sign, he holds for certain that all that which these books tell happened neither more nor less than it they-write, and not him will-make believe other thing friars barefoot."
        ormsby: "“I think so,” said Cardenio, “for, as he shows, he accepts it as a certainty that everything those books relate took place exactly as it is written down; and the barefooted friars themselves would not persuade him to the contrary.”"
        vocab:
          - {w: "según da indicio", d: "as he shows, judging by the signs"}
          - {w: "tener por cierto", d: "to hold as certain, be sure"}
          - {w: "ni más ni menos que", d: "exactly as"}
          - {w: "frailes descalzos", d: "barefoot friars (strict reformed orders, famous preachers); 'not even the barefoot friars' = no one could convince him"}
        diagram:
          - s: "Así me parece a mí"
            r: "main verb: that's how it seems to me"
            under:
              - {s: "respondió Cardenio", r: "speech tag: Cardenio answered"}
          - s: "él tiene por cierto"
            r: "why (after 'porque'): he holds it certain"
            under:
