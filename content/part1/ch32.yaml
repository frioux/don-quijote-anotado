      - es: "— Mirad, hermano —tornó a decir el cura—, que no hubo en el mundo Felixmarte de Hircania, ni don Cirongilio de Tracia, ni otros caballeros semejantes que los libros de caballerías cuentan, porque todo es compostura y ficción de ingenios ociosos, que los compusieron para el efeto que vos decís de entretener el tiempo, como lo entretienen leyéndolos vuestros segadores;"
