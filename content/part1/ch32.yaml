  - sentences:
      - es: "— Pues bien puede leella su reverencia, porque le hago saber que algunos huéspedes que aquí la han leído les ha contentado mucho, y me la han pedido con muchas veras;"
        literal: "— Well well can read-it your reverence, because to-you I-make know that some guests who here it have read to-them it-has pleased much, and from-me it they-have asked with many earnestnesses;"
        ormsby: "“Then your reverence will do well to read it, for I can tell you that some guests who have read it here have been much pleased with it, and have begged it of me very earnestly;"
        vocab:
          - {w: "su reverencia", d: "your reverence, the polite address to a priest (takes a he-form verb)"}
          - {w: "hacer saber", d: "to inform, let know"}
          - {w: "huésped", d: "here 'guest' (the same word also means 'host')"}
          - {w: "contentar", d: "to please, satisfy"}
          - {w: "con muchas veras", d: "very earnestly, in all seriousness"}
        diagram:
          - s: "Pues bien puede leella su reverencia"
            r: "main verb: well, your reverence may well read it"
          - s: "porque le hago saber"
            r: "why: because I tell you"
            under:
              - s: "que algunos huéspedes ... les ha contentado mucho"
                r: "what I tell you, 1: that some guests were much pleased by it"
                under:
                  - {s: "que aquí la han leído", r: "describes 'huéspedes': who have read it here"}
              - {s: "y me la han pedido con muchas veras", r: "what I tell you, 2: and have asked me for it in earnest"}
        forms:
          - {w: "puede", f: "pued- + -e → poder (can), present, you (su reverencia takes the he-form). puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "leella", f: "leer (to read) + la (it), with -rl- turned into -ll-: leerla → leella."}
          - {w: "hago", f: "hag- + -o → hacer (to make; 'hacer saber' = to let know), present, I. hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "han leído, han pedido", f: "han (haber, present, they: he, has, ha, hemos, habéis, han) + leído, the participle of leer (to read), and pedido, of pedir (to ask for): 'have read', 'have asked for'."}
          - {w: "ha contentado", f: "ha (haber, present, it) + contentado, the participle of contentar (to please): 'it has pleased'. The sentence starts with 'algunos huéspedes' as subject and switches to 'les' (to them) halfway, as people do in speech."}
          - {w: "me la", f: "me (from me) + la (it, the novela); 'pedir algo a alguien' = to ask someone for something."}
      - es: "mas yo no se la he querido dar, pensando volvérsela a quien aquí dejó esta maleta olvidada con estos libros y esos papeles;"
        literal: "but I not to-them it have wanted to-give, thinking to-return-it-to-him to whom here left this case forgotten with these books and those papers;"
        ormsby: "but I would not give it, meaning to return it to the person who forgot the valise, books, and papers here,"
        vocab:
          - {w: "pensar", d: "here 'to intend, mean to'"}
          - {w: "dejar olvidado", d: "to leave behind, forget"}
        diagram:
          - s: "mas yo no se la he querido dar"
            r: "main verb: but I have not been willing to give it to them"
            under:
              - s: "pensando volvérsela"
                r: "why: meaning to return it"
                under:
                  - {s: "a quien aquí dejó esta maleta olvidada con estos libros y esos papeles", r: "to whom: to whoever left this case here forgotten, with these books and papers"}
        forms:
          - {w: "se la he querido dar", f: "he (haber, present, I: he, has, ha, hemos, habéis, han) + querido, the participle of querer (to want), + dar (to give): 'I have not wanted to give'. 'la' = it; 'se' = to them, because 'les' becomes 'se' before 'la'."}
          - {w: "pensando", f: "gerund of pensar (to intend)."}
          - {w: "volvérsela", f: "volver (to return) + se (to him) + la (it), accent added to keep the stress. 'se' stands for 'le' before 'la'."}
          - {w: "dejó", f: "dej- + -ó → dejar (to leave), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "olvidada", f: "participle of olvidar (to forget), feminine to match 'maleta'."}
          - {w: "estos, esos", f: "estos (these) and esos (those), masculine plural to match 'libros' and 'papeles'."}
      - es: "que bien puede ser que vuelva su dueño por aquí algún tiempo, y, aunque sé que me han de hacer falta los libros, a fe que se los he de volver: que, aunque ventero, todavía soy cristiano."
        literal: "for well can be that may-return its owner by here some time, and, although I-know that to-me they-will make lack the books, by faith that to-him them I-have to return: for, although innkeeper, still I-am Christian."
        ormsby: "for maybe he will return here some time or other; and though I know I shall miss the books, faith I mean to return them; for though I am an innkeeper, still I am a Christian.”"
        vocab:
          - {w: "bien puede ser que", d: "it may well be that"}
          - {w: "dueño", d: "owner"}
          - {w: "algún tiempo", d: "some time or other"}
          - {w: "hacer falta", d: "to be missed, needed; 'me han de hacer falta' = I shall miss them"}
          - {w: "a fe que", d: "by my faith, truly"}
          - {w: "todavía", d: "here 'still, all the same'"}
        diagram:
          - s: "que bien puede ser"
            r: "reason, 1: for it may well be"
            under:
              - {s: "que vuelva su dueño por aquí algún tiempo", r: "what may be: that its owner comes back this way some day"}
          - s: "a fe que se los he de volver"
            r: "main verb (after 'y'): by my faith, I'm going to give them back to him"
            under:
              - {s: "aunque sé que me han de hacer falta los libros", r: "concession: though I know I'll miss the books"}
          - s: "que ... todavía soy cristiano"
            r: "reason, 2: for I'm still a Christian"
            under:
              - {s: "aunque ventero", r: "concession: although an innkeeper"}
        forms:
          - {w: "puede", f: "pued- + -e → poder (can), present, it. puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "vuelva", f: "vuelv- + -a → volver (to return), present subjunctive, he, after 'puede ser que' (it may be that). The stem o becomes ue when stressed: vuelva, vuelvas, vuelva, volvamos, volváis, vuelvan."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun ('tiempo')."}
          - {w: "sé", f: "saber (to know), present, I. sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "han de hacer", f: "han (haber, present, they: he, has, ha, hemos, habéis, han) + 'de' + hacer: 'they are going to (be missed)'."}
          - {w: "se los he de volver", f: "he (haber, present, I) + 'de' + volver (to return): 'I am to give back'. 'los' = them (the books); 'se' = to him, because 'le' becomes 'se' before 'los'."}
          - {w: "soy", f: "ser (to be), present, I. soy, eres, es, somos, sois, son."}
        note: "Innkeepers had a proverbial reputation for thieving and cheating travelers, hence 'although an innkeeper, still a Christian'."
  - sentences:
      - es: "— Vos tenéis mucha razón, amigo —dijo el cura—, mas, con todo eso, si la novela me contenta, me la habéis de dejar trasladar."
        literal: "— You have much reason, friend —said the priest—, but, with all that, if the novella me pleases, to-me it you-have to let copy."
        ormsby: "“You are very right, friend,” said the curate; “but for all that, if the novel pleases me you must let me copy it.”"
        vocab:
          - {w: "tener razón", d: "to be right"}
          - {w: "con todo eso", d: "for all that, nevertheless"}
          - {w: "contentar", d: "to please"}
          - {w: "trasladar", d: "here 'to copy, transcribe' (also 'to move, translate')"}
        diagram:
          - s: "Vos tenéis mucha razón"
            r: "main verb 1: you are quite right"
            under:
              - {s: "amigo", r: "who is addressed: friend"}
              - {s: "dijo el cura", r: "speech tag: said the priest"}
          - s: "me la habéis de dejar trasladar"
            r: "main verb 2 (after 'mas, con todo eso'): you must let me copy it"
            under:
              - {s: "si la novela me contenta", r: "condition: if the story pleases me"}
        forms:
          - {w: "tenéis", f: "ten- + -éis → tener (to have), present, you (vos takes the plural ending). tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "mucha", f: "much- + -a → mucho (much), feminine to match 'razón'."}
          - {w: "contenta", f: "content- + -a → contentar (to please), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "habéis de dejar", f: "habéis (haber, present, you (vos): he, has, ha, hemos, habéis, han) + 'de' + dejar (to let): 'you must let'."}
        note: "Before printing was cheap, copying out a manuscript by hand was the normal way to get a text one liked."
