          - {w: "había acontecido", f: "hab- + -ía → haber, imperfect, it, + acontecido, the participle of acontecer (to happen): the pluperfect 'had happened'. había, habías, había, habíamos, habíais, habían."}
          - {w: "mirando", f: "gerund of mirar (to look)."}
