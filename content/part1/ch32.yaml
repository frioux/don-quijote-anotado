  - sentences:
      - es: "A la mitad desta plática se halló Sancho presente, y quedó muy confuso y pensativo de lo que había oído decir que ahora no se usaban caballeros andantes, y que todos los libros de caballerías eran necedades y mentiras, y propuso en su corazón de esperar en lo que paraba aquel viaje de su amo, y que si no salía con la felicidad que él pensaba, determinaba de dejalle y volverse con su mujer y sus hijos a su acostumbrado trabajo."
        literal: "At the middle of-this talk found-himself Sancho present, and remained very confused and thoughtful from that which he-had heard say that now not were-in-use knights errant, and that all the books of chivalries were follies and lies, and he-resolved in his heart to wait [to see] in what was-ending that journey of his master, and that if not it-came-out with the happiness that he was-thinking, he-was-determined to leave-him and return-himself with his wife and his children to his accustomed work."
        ormsby: "Sancho had made his appearance in the middle of this conversation, and he was very much troubled and cast down by what he heard said about knights-errant being now no longer in vogue, and all books of chivalry being folly and lies; and he resolved in his heart to wait and see what came of this journey of his master’s, and if it did not turn out as happily as his master expected, he determined to leave him and go back to his wife and children and his ordinary labour."
        vocab:
          - {w: "plática", d: "talk, conversation"}
          - {w: "hallarse presente", d: "to be present, happen to be there"}
          - {w: "pensativo", d: "thoughtful, worried"}
          - {w: "necedad", d: "foolishness, nonsense"}
          - {w: "proponer en su corazón", d: "to resolve in one's heart, make up one's mind"}
          - {w: "parar en", d: "to end up in, come to"}
          - {w: "salir con", d: "to turn out with, end in"}
          - {w: "felicidad", d: "good fortune, success (not only 'happiness')"}
          - {w: "determinar de", d: "to resolve to, decide to"}
          - {w: "dejalle", d: "= dejarle, to leave him; old -rl- becoming -ll-"}
          - {w: "acostumbrado", d: "usual, accustomed"}
        diagram:
          - s: "se halló Sancho presente"
            r: "main verb 1: Sancho was there"
            under:
              - {s: "A la mitad desta plática", r: "when: in the middle of this talk"}
          - s: "y quedó muy confuso y pensativo"
            r: "main verb 2: and was left very confused and worried"
            under:
              - s: "de lo que había oído decir"
                r: "why: by what he had heard said"
                under:
                  - {s: "que ahora no se usaban caballeros andantes", r: "what he heard, 1: that knights-errant were not in use now"}
                  - {s: "y que todos los libros de caballerías eran necedades y mentiras", r: "what he heard, 2: and that all books of chivalry were nonsense and lies"}
          - s: "y propuso en su corazón"
            r: "main verb 3: and resolved in his heart"
            under:
              - {s: "de esperar en lo que paraba aquel viaje de su amo", r: "what he resolved, 1: to wait and see how his master's journey ended"}
              - s: "y que ... determinaba de dejalle y volverse con su mujer y sus hijos a su acostumbrado trabajo"
                r: "what he resolved, 2: and that he was determined to leave him and go back to his wife, children and usual work"
                under:
                  - {s: "si no salía con la felicidad que él pensaba", r: "condition: if it did not turn out as well as he expected"}
        forms:
          - {w: "desta", f: "de + esta (of this)."}
          - {w: "se halló", f: "hall- + -ó → hallarse (to find oneself, be), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "quedó", f: "qued- + -ó → quedar (to be left), preterite, he. Same -ar preterite."}
          - {w: "confuso, pensativo", f: "masculine to match Sancho."}
          - {w: "había oído", f: "hab- + -ía → haber, imperfect, he, + oído, the participle of oír (to hear): the pluperfect 'had heard'. había, habías, había, habíamos, habíais, habían."}
          - {w: "se usaban", f: "us- + -aban → usarse (to be in use), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "eran", f: "ser (to be), imperfect, they. era, eras, era, éramos, erais, eran."}
          - {w: "propuso", f: "propus- + -o → proponer (to resolve), preterite, he. Built like poner: propuse, propusiste, propuso, propusimos, propusisteis, propusieron."}
          - {w: "paraba, pensaba, determinaba", f: "par- + -aba → parar (to end up), pens- + -aba → pensar (to think, expect), determin- + -aba → determinar (to resolve), imperfect, it / he / he. Same -aba imperfect."}
          - {w: "salía", f: "sal- + -ía → salir (to turn out), imperfect, it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "dejalle", f: "dejar (to leave) + le (him), with -rl- turned into -ll-: dejarle → dejalle."}
          - {w: "volverse", f: "volver (to return) + se: 'to go back'."}
          - {w: "acostumbrado", f: "participle of acostumbrar (to be used to), masculine to match 'trabajo', placed before the noun."}
  - sentences:
      - es: "Llevábase la maleta y los libros el ventero, mas el cura le dijo: — Esperad, que quiero ver qué papeles son esos que de tan buena letra están escritos."
        literal: "Was-carrying-off-for-himself the case and the books the innkeeper, but the priest to-him said: — Wait, for I-want to-see what papers are those that of such good hand are written."
        ormsby: "The landlord was carrying away the valise and the books, but the curate said to him, “Wait; I want to see what those papers are that are written in such a good hand.”"
        vocab:
          - {w: "llevarse", d: "to take away, carry off"}
          - {w: "maleta", d: "case, valise"}
          - {w: "mas", d: "but (without accent)"}
          - {w: "de tan buena letra", d: "in such a fine hand"}
        diagram:
          - s: "Llevábase la maleta y los libros"
            r: "main verb 1: was carrying off the case and the books"
            under:
              - {s: "el ventero", r: "subject, at the end: the innkeeper"}
          - s: "mas el cura le dijo:"
            r: "main verb 2: but the priest said to him"
            under:
              - s: "Esperad"
                r: "what he said (command): wait"
                under:
                  - s: "que quiero ver qué papeles son esos"
                    r: "why: for I want to see what papers those are"
                    under:
                      - {s: "que de tan buena letra están escritos", r: "describes 'papeles': that are written in such a fine hand"}
        forms:
          - {w: "Llevábase", f: "llev- + -aba + se → llevarse (to carry off), imperfect, he, with 'se' stuck on the end. Cervantes hangs pronouns on a conjugated verb that opens its clause; modern 'se llevaba'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "Esperad", f: "esper- + -ad → esperar (to wait), command, you (vos). The vos command ends in -ad, -ed, -id."}
          - {w: "quiero", f: "quier- + -o → querer (to want), present, I. quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "están escritos", f: "están (estar, present, they: estoy, estás, está, estamos, estáis, están) + escritos, the irregular participle of escribir (to write), masculine plural to match 'papeles'."}
  - sentences:
      - es: "Sacólos el huésped, y, dándoselos a leer, vio hasta obra de ocho pliegos escritos de mano, y al principio tenían un título grande que decía: Novela del curioso impertinente."
        literal: "Took-them-out the host, and, giving-them-to-him to read, he-saw up-to work of eight sheets written by hand, and at-the beginning they-had a title large that said: Novel of-the curious-man impertinent."
        ormsby: "The landlord taking them out handed them to him to read, and he perceived they were a work of about eight sheets of manuscript, with, in large letters at the beginning, the title of “Novel of the Ill-advised Curiosity.”"
        ormsby_note: "Curious Impertinent, Shelton's barbarous translation of Curioso Impertinente, is something worse than nonsense, for Curioso is here a substantive. There is, of course, no concise English translation for the title; the nearest approach to one would be, perhaps, The Inquisitive Man Who Had No Business to Be So."
        vocab:
          - {w: "hasta obra de", d: "about, some (an approximate number)"}
          - {w: "pliego", d: "sheet of paper, folded to make several pages"}
          - {w: "novela", d: "short story, novella, in the Italian manner (false friend: not a long 'novel')"}
          - {w: "curioso", d: "here a noun: 'the inquisitive man', one who pries"}
          - {w: "impertinente", d: "meddling, out of place, uncalled for (not just 'rude')"}
        diagram:
          - s: "Sacólos el huésped"
            r: "main verb 1: the host took them out"
          - s: "vio hasta obra de ocho pliegos escritos de mano"
            r: "main verb 2 (after 'y'): he (the priest) saw some eight handwritten sheets"
            under:
              - {s: "dándoselos a leer", r: "when: the host giving them to him to read"}
          - s: "y al principio tenían un título grande"
            r: "main verb 3: and at the start they had a large title"
            under:
              - {s: "que decía: Novela del curioso impertinente", r: "describes 'título': that read 'The Novel of the Ill-Advised Curiosity'"}
        forms:
          - {w: "Sacólos", f: "sac- + -ó + los → sacar (to take out), preterite, he, with 'los' (them, the papers) stuck on the end. Cervantes hangs pronouns on a conjugated verb that opens its clause; modern 'los sacó'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "dándoselos", f: "dando, the gerund of dar (to give), + se (to him) + los (them), accent added. 'se' stands for 'le', which becomes 'se' before lo, la, los, las."}
          - {w: "vio", f: "ver (to see), preterite, he. vi, viste, vio, vimos, visteis, vieron."}
          - {w: "escritos", f: "irregular participle of escribir (to write), masculine plural to match 'pliegos'."}
          - {w: "tenían, decía", f: "ten- + -ían → tener (to have), they; dec- + -ía → decir (to say), it; imperfect. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
      - es: "Leyó el cura para sí tres o cuatro renglones y dijo:"
        literal: "Read the priest to himself three or four lines and said:"
        ormsby: "The curate read three or four lines to himself, and said,"
        vocab:
          - {w: "para sí", d: "to himself, silently"}
          - {w: "renglón", d: "line (of writing)"}
        diagram:
          - s: "Leyó el cura"
            r: "main verb 1: the priest read"
            under:
              - {s: "para sí", r: "how: to himself"}
              - {s: "tres o cuatro renglones", r: "object: three or four lines"}
          - {s: "y dijo:", r: "main verb 2: and said"}
        forms:
          - {w: "Leyó", f: "le- + -yó → leer (to read), preterite, he: the i of -ió turns to y between vowels. leí, leíste, leyó, leímos, leísteis, leyeron."}
          - {w: "sí", f: "'himself' after a preposition; the accent tells it from 'si' (if)."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Cierto que no me parece mal el título desta novela, y que me viene voluntad de leella toda."
        literal: "— Certain that not to-me seems bad the title of-this novella, and that to-me comes will of reading-it all."
        ormsby: "“I must say the title of this novel does not seem to me a bad one, and I feel an inclination to read it all.”"
        vocab:
          - {w: "cierto que", d: "certainly, I must say"}
          - {w: "parecer mal", d: "to seem bad, displease"}
          - {w: "venirle a uno voluntad de", d: "to feel like, get the urge to"}
          - {w: "leella", d: "= leerla, to read it; old -rl- becoming -ll-"}
        diagram:
          - s: "Cierto que no me parece mal el título desta novela"
            r: "main verb 1: I must say the title of this story doesn't seem bad to me"
          - s: "y que me viene voluntad"
            r: "main verb 2: and I feel the wish"
            under:
              - {s: "de leella toda", r: "to do what: to read it all"}
        forms:
          - {w: "parece", f: "parec- + -e → parecer (to seem), present, it. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (but parezco for 'I')."}
          - {w: "desta", f: "de + esta (of this)."}
          - {w: "viene", f: "vien- + -e → venir (to come), present, it. Irregular: vengo, vienes, viene, venimos, venís, vienen."}
          - {w: "leella", f: "leer (to read) + la (it, the novela), with -rl- turned into -ll-: leerla → leella."}
          - {w: "toda", f: "tod- + -a → todo (all), feminine to match 'novela'."}
