          - {w: "estando", f: "gerund of estar (to be): 'being (present)', with its own subjects after it."}
          - {w: "estraña", f: "estrañ- + -a → estraño (= extraño, strange), feminine to match 'locura'."}
          - {w: "habían hallado", f: "hab- + -ían → haber, imperfect, they, + hallado, the participle of hallar (to find): the pluperfect 'had found'. había, habías, había, habíamos, habíais, habían."}
      - es: "La huéspeda les contó lo que con él y con el arriero les había acontecido, y, mirando si acaso estaba allí Sancho, como no le viese, contó todo lo de su manteamiento, de que no poco gusto recibieron."
