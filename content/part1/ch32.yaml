          - {w: "parece", f: "parec- + -e → parecer (to seem), present, it. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (but parezco for 'I')."}
          - {w: "da", f: "dar (to give), present, he. doy, das, da, damos, dais, dan."}
          - {w: "tiene", f: "tien- + -e → tener (to hold), present, he. tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "cuentan, escriben", f: "cuent- + -an → contar (to tell), escrib- + -en → escribir (to write), present, they (the books). contar: cuento, cuentas, cuenta, contamos, contáis, cuentan; escribir: escribo, escribes, escribe, escribimos, escribís, escriben."}
