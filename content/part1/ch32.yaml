        ormsby: "“And then, what do you say to the good Cirongilio of Thrace, that was so stout and bold; as may be seen in the book, where it is related that as he was sailing along a river there came up out of the midst of the water against him a fiery serpent, and he, as soon as he saw it, flung himself upon it and got astride of its scaly shoulders, and squeezed its throat with both hands with such force that the serpent, finding he was throttling it, had nothing for it but to let itself sink to the bottom of the river, carrying with it the knight who would not let go his hold;"
