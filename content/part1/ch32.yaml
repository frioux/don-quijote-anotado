summary: |
  Don Quijote's party rides back to the inn where Sancho was tossed in a blanket. The innkeeper's family and Maritornes welcome them; Don Quijote asks for a better bed than last time, the landlady promises one fit for a prince if he pays better, and the exhausted knight goes straight to sleep in the same garret. The landlady at once seizes the barber by his false beard and demands her ox-tail back; the priest tells the barber he can drop his disguise, and the props are returned. Everyone admires Dorotea's beauty and Cardenio's fine figure, and the innkeeper serves a decent dinner.

  At table the company talks of Don Quijote's madness, and the priest blames the books of chivalry. The innkeeper protests: there is no better reading, and at harvest time thirty reapers gather round whoever can read and listen with delight. His wife likes the readings because they keep him from scolding her, Maritornes loves the scenes of ladies embraced under orange trees, and the daughter likes the knights' laments for their cruel ladies, who, she says, should simply marry them.

  The innkeeper brings out an old case left behind by a traveler, holding Don Cirongilio de Tracia, Felixmarte de Hircania and a chronicle of the Great Captain with the life of Diego García de Paredes. The priest wants to burn the first two; the innkeeper would rather burn his own son, and offers the true chronicle instead. When the priest explains that the romances are fictions written to pass the time, the innkeeper answers with proverbs and points out that the Royal Council licensed them. Dorotea whispers to Cardenio that the innkeeper is almost a second Don Quijote. Sancho, overhearing that knights-errant are out of fashion and the books are lies, privately resolves that if this journey goes badly he will go home to his wife and children.

  In the case the priest also finds a manuscript, 'The Novel of the Ill-Advised Curiosity'. The innkeeper says he means to return everything to its owner, since he is a Christian even if he is an innkeeper. Cardenio, Dorotea, the barber and Sancho all want to hear it, and the priest begins to read it aloud.
context: |
  The inn and its people. The inn is the same one where Don Quijote was beaten by the muleteer and Sancho tossed in a blanket, and the narrator lets each of its people show what popular reading means to them. Roadside inns were the crossroads of Spanish life, full of carriers, travelers and seasonal workers, and innkeepers had a proverbial name for cheating and theft, which is why this one insists he is 'still a Christian'. The harvest scene is real: in an age when most laborers could not read, books were heard rather than read, and a single literate reaper would read aloud to thirty listeners on feast days. Each listener here takes something different from the same books: battles for the husband, an escape from scolding for the wife, love scenes for Maritornes, sentimental laments for the daughter.

  The books in the case. Ormsby identifies them: Don Cirongilio de Tracia by Bernardo de Vargas (Seville, 1545), Felixmarte de Hircania by Melchor de Ortega (1556), and the Crónica del Gran Capitán (Saragossa, 1559) with the life of Diego García de Paredes. Gonzalo Fernández de Córdoba, the Great Captain, won the war of Granada and the kingdom of Naples for Ferdinand and Isabella; García de Paredes, his companion, was a real soldier famous for his strength. The joke is that the innkeeper reverses every judgment: he would burn the true history and save the absurd romances, since a man who stops a millwheel is nothing beside one who cuts five giants in half with one blow. Ormsby notes that neither of Paredes' feats appears in the memoir itself, so even the 'true history' is touched with legend.

  The narrator's games. The chapter is a second trial of books, echoing the burning of Don Quijote's library in Chapter 6: the barber again offers to carry the books to the yard, and the priest wishes for the housekeeper and niece. Dorotea's remark that the innkeeper could 'play the second part of Don Quijote' points at a reader who believes print as the knight does. The innkeeper's argument (the Royal Council licensed the books, so they must be true) was a real problem for moralists of the time, and the priest's answer, that fiction is tolerated like chess and billiards to occupy the idle, is the standard defense. He also hints that he could explain what a good romance of chivalry should be. Finally the chapter leads into a story within the story: 'El curioso impertinente', an Italian-style novella found in a forgotten case, which the priest reads aloud over the next chapters. Ormsby notes that the title has no neat English form; 'curioso' is a noun, 'the inquisitive man', and 'impertinente' means meddling and uncalled for.

  Religion and law. The innkeeper's question whether his books are 'heretics or phlegmatics' turns on burning: the Inquisition burned heretics and schismatics, and the barber corrects his word to 'cismáticos'. 'Flemático' comes from phlegm, one of the four humors of old medicine. The license of the Consejo Real was printed at the front of every Castilian book. The 'frailes descalzos', the strict barefoot friars, were the most persuasive preachers of the day, which is why Cardenio says not even they could change the innkeeper's mind.

  Names. Maese Nicolás is the barber, 'maese' being the title of a master craftsman. The landlady is called 'la ventera' and 'la huéspeda', and the innkeeper 'el ventero' and 'el huésped': 'huésped' means both host and guest, and Cervantes uses it both ways in this chapter. Hétores, Aquiles and Roldanes are pluralized heroes, 'men like Hector, Achilles and Roland'.

  Reading Cervantes' Spanish. This chapter is almost all talk, and the speech of the innkeeper's household is full of popular forms: oaths (para mi santiguada, en mi ánima, a buena fe, por Dios), proverbs (a otro perro con ese hueso, saber cuántas son cinco, dónde aprieta el zapato, dar papilla, dos higas), the old 'oyo' for 'oigo', and 'tantas de cosas'. The usual archaisms continue: mesmo, agora, recebir, estraño, efeto, coronista, Estremadura, encantamento, aquesos, una puente; fusions with 'de' (dellos, destos, desta, dese, desotros, dél); -rl- becoming -ll- (despertalle, oíllo, respondelle, llevallos, remediallo, dejalle, leella); pronouns attached to verbs that open a clause (Acabóse, díjoles, Espantáronse, rodeámonos, estámosle, Llevábase, Sacólos); the -ra subjunctive as a conditional (quisiera, hiciera, dijera, leyera, pusieran); and the old vos form 'remediárades'. Watch for false friends: industria (trick), continente (bearing), novela (short story), curioso (inquisitive), impertinente (meddling), luego (at once or then), and 'otro día' (the next day).
