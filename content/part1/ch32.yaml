      - es: "Y, cuando llegaron allá bajo, se halló en unos palacios y en unos jardines tan lindos que era maravilla; y luego la sierpe se volvió en un viejo anciano, que le dijo tantas de cosas que no hay más que oír."
        literal: "And, when they-arrived there below, he found-himself in some palaces and in some gardens so pretty that it-was marvel; and then the serpent turned-itself into an old aged-man, who to-him said so-many of things that not there-is more to hear."
