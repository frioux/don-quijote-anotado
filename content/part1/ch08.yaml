          - {w: "encantador", d: "enchanter, magician"}
          - {w: "hurtar", d: "to steal; here 'to abduct'"}
          - {w: "es menester", d: "it is necessary"}
          - {w: "deshacer tuertos", d: "to right wrongs, the knight-errant's calling; 'tuerto' (literally 'twisted') is the old word for a wrong"}
          - {w: "a todo mi poderío", d: "with all my might"}
