          - {w: "cauto", d: "wary, cautious"}
          - {w: "en alto", d: "raised high"}
          - {w: "abrir por medio", d: "to split down the middle"}
          - {w: "ansimesmo", d: "= asimismo, likewise (archaic form)"}
          - {w: "aforrado", d: "lined, padded (as a garment is lined): he wears the cushion like a lining"}
          - {w: "circunstantes", d: "bystanders, those present"}
          - {w: "colgado de", d: "hanging on, in suspense over"}
          - {w: "suceder", d: "to happen; a false friend, not 'to succeed'"}
          - {w: "tamaño", d: "old: so great, such huge (today a noun, 'size')"}
          - {w: "amenazarse", d: "to threaten each other"}
