              - {s: "a todo mi poderío", r: "how: with all my might"}
        forms:
          - {w: "aquellos", f: "aquell- + -os → 'those', masculine plural to match 'bultos'."}
          - {w: "parecen", f: "parec- + -en → parecer (old: to appear), present, they. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (the I form is parezco)."}
          - {w: "deben de ser", f: "deb- + -en → deber (must), present, they, + 'de' + ser: 'must be' (a guess). Same -er present."}
          - {w: "son", f: "ser (to be), present, they: soy, eres, es, somos, sois, son."}
          - {w: "algunos", f: "algun- + -os → alguno (some), masculine plural."}
          - {w: "llevan hurtada", f: "llev- + -an → llevar (to carry), present, they, + hurtada (participle of hurtar, to steal), feminine to match 'princesa': 'carry [her] abducted'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "alguna", f: "algun- + -a → alguno (some), feminine to match 'princesa'."}
          - {w: "deshacer", f: "des- + hacer (to do): 'to undo', infinitive as the subject of 'es menester'."}
          - {w: "este", f: "'this', masculine singular to match 'tuerto'."}
  - sentences:
      - es: "— Peor será esto que los molinos de viento —dijo Sancho—."
        literal: "— Worse will-be this than the mills of wind —said Sancho—."
        ormsby: "“This will be worse than the windmills,” said Sancho."
        vocab:
          - {w: "peor", d: "worse"}
        diagram:
          - s: "Peor será esto"
            r: "main verb: this will be worse"
            under:
              - {s: "que los molinos de viento", r: "than what: than the windmills"}
          - {s: "dijo Sancho", r: "frame"}
        forms:
          - {w: "Peor", f: "the comparative of malo (bad): 'worse'; one form for both genders."}
          - {w: "será", f: "ser + -á → ser (to be), future, it. The future is the whole infinitive + -é, -ás, -á, -emos, -éis, -án."}
          - {w: "esto", f: "neuter 'this [business]', pointing at an idea, not a noun."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
      - es: "Mire, señor, que aquéllos son frailes de San Benito, y el coche debe de ser de alguna gente pasajera."
        literal: "Look, sir, that those-ones are friars of Saint Benedict, and the coach must be of some people passing."
        ormsby: "“Look, señor; those are friars of St. Benedict, and the coach plainly belongs to some travellers:"
        vocab:
          - {w: "deber de + infinitive", d: "must (a guess)"}
          - {w: "gente pasajera", d: "travellers, people passing through"}
        diagram:
          - s: "Mire, señor"
            r: "main verb (polite command): look, sir"
            under:
              - {s: "que aquéllos son frailes de San Benito", r: "what to see, 1: those are Benedictine friars"}
              - {s: "y el coche debe de ser de alguna gente pasajera", r: "what to see, 2: and the coach must belong to some travellers"}
        forms:
          - {w: "Mire", f: "mir- + -e → mirar (to look), present subjunctive, you (vuestra merced), used as a polite command. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "aquéllos", f: "'those ones', masculine plural pronoun; the older spelling accents the pronoun."}
          - {w: "son", f: "ser (to be), present, they: soy, eres, es, somos, sois, son."}
          - {w: "debe de ser", f: "deb- + -e → deber (must), present, it, + 'de' + ser: 'must be'. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "alguna gente pasajera", f: "feminine singular: 'gente' is a feminine singular noun even though it means 'people'."}
      - es: "Mire que digo que mire bien lo que hace, no sea el diablo que le engañe."
        literal: "Look that I-say that you-look well what you-do, not may-be the devil who you deceives."
        ormsby: "I tell you to mind well what you are about and don’t let the devil mislead you.”"
        vocab:
          - {w: "no sea que", d: "lest, in case; here 'no sea el diablo que' = in case it is the devil who"}
          - {w: "engañar", d: "to deceive, trick"}
        diagram:
          - s: "Mire"
            r: "main verb (polite command): look"
            under:
              - s: "que digo"
                r: "what to note: that I am telling you"
                under:
                  - {s: "que mire bien lo que hace", r: "what I tell you: to watch what you're doing"}
              - {s: "no sea el diablo que le engañe", r: "lest: in case it's the devil deceiving you"}
        forms:
          - {w: "Mire ... mire", f: "mir- + -e → mirar (to look), present subjunctive, you (vuestra merced): first as a polite command, then after 'digo que' as a reported instruction. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "digo", f: "dig- + -o → decir (to say), present, I: digo, dices, dice, decimos, decís, dicen."}
          - {w: "hace", f: "hac- + -e → hacer (to do), present, you (vuestra merced): hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "sea", f: "se- + -a → ser (to be), present subjunctive, it: sea, seas, sea, seamos, seáis, sean. 'no sea que' = lest."}
          - {w: "le engañe", f: "engañ- + -e → engañar (to deceive), present subjunctive, he (the devil); 'le' = you (vuestra merced), 'le' used for a man. Same -e subjunctive endings."}
  - sentences:
      - es: "— Ya te he dicho, Sancho —respondió don Quijote—, que sabes poco de achaque de aventuras; lo que yo digo es verdad, y ahora lo verás."
        literal: "— Already to-you I-have said, Sancho —answered Don Quijote—, that you-know little of matter of adventures; what I say is truth, and now it you-will-see."
        ormsby: "“I have told thee already, Sancho,” replied Don Quixote, “that on the subject of adventures thou knowest little. What I say is the truth, as thou shalt see presently.”"
        vocab:
          - {w: "achaque", d: "usually 'ailment'; 'de achaque de' = in the matter of"}
        diagram:
          - s: "Ya te he dicho, Sancho"
            r: "main verb 1: I've told you already, Sancho"
            under:
              - {s: "que sabes poco de achaque de aventuras", r: "what I've told you: you know little about adventures"}
          - {s: "respondió don Quijote", r: "frame"}
          - {s: "lo que yo digo es verdad", r: "main clause 2: what I say is true"}
          - {s: "y ahora lo verás", r: "main verb 3: and now you'll see it"}
        forms:
          - {w: "te he dicho", f: "he (haber), present, I, + dicho (irregular participle of decir, to say), with 'te' (to you) before it: 'I have told you'. haber's present: he, has, ha, hemos, habéis, han."}
          - {w: "sabes", f: "sab- + -es → saber (to know), present, you: sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "digo", f: "dig- + -o → decir (to say), present, I: digo, dices, dice, decimos, decís, dicen."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "verás", f: "ver + -ás → ver (to see), future, you. The future is the whole infinitive + -é, -ás, -á, -emos, -éis, -án."}
  - sentences:
      - es: "Y, diciendo esto, se adelantó y se puso en la mitad del camino por donde los frailes venían, y, en llegando tan cerca que a él le pareció que le podrían oír lo que dijese, en alta voz dijo:"
        literal: "And, saying this, he-advanced himself and put-himself in the middle of-the road along where the friars came, and, on arriving so near that to him to-him it-seemed that him they-would-be-able to-hear what he-might-say, in high voice he-said:"
        ormsby: "So saying, he advanced and posted himself in the middle of the road along which the friars were coming, and as soon as he thought they had come near enough to hear what he said, he cried aloud,"
        vocab:
          - {w: "adelantarse", d: "to go forward, step out ahead"}
          - {w: "en la mitad de", d: "in the middle of"}
          - {w: "en llegando", d: "on arriving, as soon as they came"}
          - {w: "en alta voz", d: "aloud"}
        diagram:
          - s: "se adelantó"
            r: "main verb 1: he went forward"
            under:
              - {s: "Y, diciendo esto", r: "when: saying this"}
          - s: "y se puso en la mitad del camino"
            r: "main verb 2: and planted himself in the middle of the road"
            under:
              - {s: "por donde los frailes venían", r: "describes 'camino': along which the friars were coming"}
          - s: "en alta voz dijo:"
            r: "main verb 3: he said aloud"
            under:
              - s: "en llegando tan cerca"
                r: "when: on their coming so close"
                under:
                  - s: "que a él le pareció"
                    r: "result: that it seemed to him"
                    under:
                      - {s: "que le podrían oír lo que dijese", r: "what seemed: that they could hear what he said"}
        forms:
          - {w: "diciendo", f: "dic- + -iendo → gerund of decir (to say), stem e changed to i."}
          - {w: "se adelantó", f: "adelant- + -ó → adelantarse (to go forward), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "se puso", f: "pus- + -o → ponerse (to place oneself), preterite, he. Irregular: puse, pusiste, puso, pusimos, pusisteis, pusieron."}
          - {w: "del", f: "de + el."}
          - {w: "venían", f: "ven- + -ían → venir (to come), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "llegando", f: "lleg- + -ando → gerund of llegar (to arrive); 'en' + gerund = as soon as."}
          - {w: "a él le pareció", f: "parec- + -ió → parecer (to seem), preterite, it, with 'le' (to him), doubled by 'a él' for emphasis. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "le podrían oír", f: "podr- + -ían → poder (to be able), conditional, they, + oír (to hear); 'le' = him, hung before the conjugated verb. Irregular stem podr-: podría, podrías, podría, podríamos, podríais, podrían."}
          - {w: "dijese", f: "dij- + -ese → decir (to say), imperfect subjunctive (-se form), he: dijese, dijeses, dijese, dijésemos, dijeseis, dijesen (the same as dijera). Subjunctive because his words are still to come."}
          - {w: "dijo", f: "dij- + -o → decir, preterite, he: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Gente endiablada y descomunal, dejad luego al punto las altas princesas que en ese coche lleváis forzadas; si no, aparejaos a recebir presta muerte, por justo castigo de vuestras malas obras."
        literal: "— People bedeviled and monstrous, leave at-once on-the point the high princesses that in that coach you-carry forced; if not, prepare-yourselves to receive swift death, as just punishment of your bad deeds."
        ormsby: "“Devilish and unnatural beings, release instantly the highborn princesses whom you are carrying off by force in this coach, else prepare to meet a speedy death as the just punishment of your evil deeds.”"
        vocab:
          - {w: "endiablado", d: "devilish, possessed"}
          - {w: "descomunal", d: "monstrous, enormous, unnatural"}
          - {w: "luego al punto", d: "at once, this instant ('luego' meant 'immediately' in Cervantes' day)"}
          - {w: "alto", d: "high; of people, high-born"}
          - {w: "forzado", d: "taken by force, captive"}
          - {w: "aparejarse", d: "to get ready, prepare"}
          - {w: "recebir", d: "= recibir, to receive (old spelling)"}
          - {w: "presto", d: "swift, quick"}
          - {w: "castigo", d: "punishment"}
          - {w: "obras", d: "deeds, works"}
        diagram:
          - s: "dejad luego al punto las altas princesas"
            r: "main verb 1 (command): release the high-born princesses at once"
            under:
              - {s: "Gente endiablada y descomunal", r: "whom he addresses: devilish and monstrous people"}
              - {s: "que en ese coche lleváis forzadas", r: "describes 'princesas': whom you carry captive in that coach"}
          - s: "aparejaos a recebir presta muerte"
            r: "main verb 2 (command): prepare to receive swift death"
            under:
              - {s: "si no", r: "condition: otherwise"}
              - {s: "por justo castigo de vuestras malas obras", r: "why: as just punishment for your evil deeds"}
        forms:
          - {w: "endiablada, descomunal", f: "feminine singular to agree with 'gente' (people), a feminine singular noun, though he is speaking to two men."}
          - {w: "dejad", f: "dej- + -ad → dejar (to leave, release), command to 'vosotros' (you all): the infinitive with its -r turned into -d (dejad, id, venid)."}
          - {w: "altas", f: "alt- + -as → alto (high-born), feminine plural to match 'princesas'."}
          - {w: "lleváis", f: "llev- + -áis → llevar (to carry), present, you (plural). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "forzadas", f: "forz- + -adas → participle of forzar (to force), feminine plural to match 'princesas'."}
          - {w: "aparejaos", f: "aparejad + os → aparejarse (to get ready), command to 'vosotros' with 'os' (yourselves) on the end; the -d of the command drops before -os."}
          - {w: "recebir", f: "old spelling of recibir (to receive), infinitive after 'a'."}
          - {w: "presta", f: "prest- + -a → presto (swift), feminine to match 'muerte'."}
          - {w: "vuestras", f: "vuestr- + -as → 'your' (plural owners), feminine plural to match 'obras'."}
  - sentences:
