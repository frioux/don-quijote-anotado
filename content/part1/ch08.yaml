          - {w: "quedaron", f: "qued- + -aron → quedar (to remain, be left), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "admirados", f: "admir- + -ados → participle of admirar (to astonish), masculine plural to match 'frailes'."}
          - {w: "las cuales", f: "'which', feminine plural to match 'razones': el cual, la cual, los cuales, las cuales."}
          - {w: "respondieron", f: "respond- + -ieron → responder (to answer), preterite, they. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
  - sentences:
      - es: "— Señor caballero, nosotros no somos endiablados ni descomunales, sino dos religiosos de San Benito que vamos nuestro camino, y no sabemos si en este coche vienen, o no, ningunas forzadas princesas."
        literal: "— Sir knight, we not are bedeviled nor monstrous, but two religious of Saint Benedict who go our road, and not we-know if in this coach come, or not, any forced princesses."
        ormsby: "“Señor Caballero, we are not devilish or unnatural, but two brothers of St. Benedict following our road, nor do we know whether or not there are any captive princesses coming in this coach.”"
        vocab:
          - {w: "religioso", d: "member of a religious order, monk or friar"}
          - {w: "ir su camino", d: "to go one's way"}
          - {w: "ningunos", d: "any (plural of ninguno, no longer used in the plural)"}
        diagram:
          - s: "nosotros no somos endiablados ni descomunales"
            r: "main verb 1: we are not devilish or monstrous"
            under:
              - {s: "Señor caballero", r: "whom they address: sir knight"}
              - s: "sino dos religiosos de San Benito"
                r: "what they are instead: two Benedictine monks"
                under:
                  - {s: "que vamos nuestro camino", r: "describes 'religiosos': who are going our way"}
          - s: "y no sabemos"
            r: "main verb 2: and we don't know"
            under:
              - {s: "si en este coche vienen, o no, ningunas forzadas princesas", r: "what they don't know: whether any captive princesses are in this coach or not"}
        forms:
          - {w: "somos", f: "ser (to be), present, we: soy, eres, es, somos, sois, son."}
          - {w: "endiablados ni descomunales", f: "masculine plural: the friars turn his feminine 'gente endiablada y descomunal' back on themselves as men."}
          - {w: "vamos", f: "ir (to go), present, we: voy, vas, va, vamos, vais, van. 'que vamos' (we), not 'que van': the verb agrees with 'nosotros'."}
          - {w: "sabemos", f: "sab- + -emos → saber (to know), present, we: sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "vienen", f: "vien- + -en → venir (to come), present, they: vengo, vienes, viene, venimos, venís, vienen."}
          - {w: "ningunas forzadas", f: "feminine plural to match 'princesas'; 'ninguno' is used only in the singular today."}
  - sentences:
      - es: "— Para conmigo no hay palabras blandas, que ya yo os conozco, fementida canalla —dijo don Quijote."
        literal: "— For with-me not there-are words soft, for already I you know, false rabble —said Don Quijote."
        ormsby: "“No soft words with me, for I know you, lying rabble,” said Don Quixote,"
        vocab:
          - {w: "para conmigo", d: "with me, toward me"}
          - {w: "blando", d: "soft"}
          - {w: "fementido", d: "false, treacherous, forsworn (from 'fe mentida', lied faith); a word from the romances"}
          - {w: "canalla", d: "rabble, riffraff"}
        diagram:
          - s: "no hay palabras blandas"
            r: "main verb: there are no soft words"
            under:
              - {s: "Para conmigo", r: "toward whom: with me"}
              - {s: "que ya yo os conozco", r: "loose 'que' = 'for': I know you already"}
              - {s: "fementida canalla", r: "whom he addresses: treacherous rabble"}
          - {s: "dijo don Quijote", r: "frame"}
        forms:
          - {w: "conmigo", f: "con + mí fused into one word: 'with me' (also contigo, consigo)."}
          - {w: "hay", f: "haber, the special present form 'there is / there are'; it never changes."}
          - {w: "os conozco", f: "conozc- + -o → conocer (to know), present, I, with 'os' (you, plural). Verbs in -cer add z in the I form only: conozco, conoces, conoce, conocemos, conocéis, conocen."}
          - {w: "fementida", f: "fementid- + -a → fementido (treacherous), feminine to match 'canalla'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "Y, sin esperar más respuesta, picó a Rocinante y, la lanza baja, arremetió contra el primero fraile, con tanta furia y denuedo que, si el fraile no se dejara caer de la mula, él le hiciera venir al suelo mal de su grado, y aun malferido, si no cayera muerto."
        literal: "And, without waiting more answer, he-spurred to Rocinante and, the lance low, charged against the first friar, with such fury and daring that, if the friar not himself had-let fall from the mule, he him would-have-made come to-the ground bad of his will, and even badly-wounded, if not he-had-fallen dead."
        ormsby: "and without waiting for a reply he spurred Rocinante and with levelled lance charged the first friar with such fury and determination, that, if the friar had not flung himself off the mule, he would have brought him to the ground against his will, and sore wounded, if not killed outright."
        vocab:
          - {w: "picar", d: "to spur (a horse)"}
          - {w: "la lanza baja", d: "lance lowered, levelled for the charge"}
          - {w: "denuedo", d: "daring, boldness"}
          - {w: "dejarse caer", d: "to let oneself fall, drop"}
          - {w: "mal de su grado", d: "against his will"}
          - {w: "malferido", d: "badly wounded ('ferido' = herido, with the old f-)"}
        diagram:
          - s: "picó a Rocinante"
            r: "main verb 1: he spurred Rocinante"
            under:
              - {s: "Y, sin esperar más respuesta", r: "how: without waiting for any further answer"}
          - s: "arremetió contra el primero fraile"
            r: "main verb 2 (after 'y'): charged the first friar"
            under:
              - {s: "la lanza baja", r: "how: lance lowered"}
              - s: "con tanta furia y denuedo"
                r: "how: with such fury and daring"
                under:
                  - s: "que, si el fraile no se dejara caer de la mula, él le hiciera venir al suelo mal de su grado"
                    r: "result: that, had the friar not dropped off his mule, he would have brought him down against his will"
                    under:
                      - {s: "y aun malferido, si no cayera muerto", r: "and badly wounded too, if not dead"}
        forms:
          - {w: "esperar", f: "infinitive (to wait for) after 'sin' (without)."}
          - {w: "picó", f: "pic- + -ó → picar (to spur), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (the I form is 'piqué', qu keeping the hard c)."}
          - {w: "a Rocinante", f: "the personal 'a', used before a named animal as before a person."}
          - {w: "baja", f: "baj- + -a → bajo (low), feminine to match 'lanza': an absolute phrase, 'with the lance low'."}
          - {w: "arremetió", f: "arremet- + -ió → arremeter (to charge), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "primero", f: "modern Spanish clips it to 'primer' before a masculine noun; Cervantes often keeps the full form."}
          - {w: "tanta", f: "tant- + -a → tanto, feminine to match 'furia'; 'tanta ... que' = so much ... that."}
          - {w: "se dejara", f: "dej- + -ara → dejar (to let), imperfect subjunctive (-ra form), he: 'had [not] let himself'. dejara, dejaras, dejara, dejáramos, dejarais, dejaran. After 'si' the -ra form is the counterfactual."}
          - {w: "le hiciera", f: "hic- + -iera → hacer (to make), imperfect subjunctive (-ra form), he, used as a conditional: 'would have made'. hiciera, hicieras, hiciera, hiciéramos, hicierais, hicieran. Cervantes uses the -ra form where modern Spanish says 'habría hecho'. 'le' = him: Castilian uses 'le' for a male direct object (leísmo)."}
          - {w: "venir", f: "infinitive (to come) after 'hacer': 'made [him] come'."}
          - {w: "al", f: "a + el."}
          - {w: "malferido", f: "mal + ferido, the old form of herido (participle of herir, to wound)."}
          - {w: "cayera", f: "cay- + -era → caer (to fall), imperfect subjunctive (-ra form), he: cayera, cayeras, cayera, cayéramos, cayerais, cayeran. After 'si' it is the counterfactual."}
      - es: "El segundo religioso, que vio del modo que trataban a su compañero, puso piernas al castillo de su buena mula, y comenzó a correr por aquella campaña, más ligero que el mesmo viento."
        literal: "The second religious, who saw of-the way that they-treated to his companion, put legs to-the castle of his good mule, and began to run over that countryside, more light than the same wind."
        ormsby: "The second brother, seeing how his comrade was treated, drove his heels into his castle of a mule and made off across the country faster than the wind."
        vocab:
          - {w: "del modo que", d: "the way in which, how"}
          - {w: "tratar", d: "to treat, handle"}
          - {w: "poner piernas a", d: "to spur with the legs, drive one's heels into"}
          - {w: "castillo", d: "castle; here the huge mule"}
          - {w: "campaña", d: "open country, a plain; a false friend, not 'campaign'"}
          - {w: "ligero", d: "light; swift"}
          - {w: "el mesmo viento", d: "the wind itself ('mesmo' = mismo)"}
        diagram:
          - s: "puso piernas al castillo de su buena mula"
            r: "main verb 1: dug his legs into his castle of a mule"
            under:
              - s: "El segundo religioso"
                r: "subject: the second monk"
                under:
                  - {s: "que vio del modo que trataban a su compañero", r: "describes him: who saw how they were treating his companion"}
          - s: "y comenzó a correr por aquella campaña"
            r: "main verb 2: and began to run across that country"
            under:
              - {s: "más ligero que el mesmo viento", r: "how: faster than the wind itself"}
        forms:
          - {w: "vio", f: "vi- + -o → ver (to see), preterite, he: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "trataban", f: "trat- + -aban → tratar (to treat), imperfect, they (unnamed people). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "puso", f: "pus- + -o → poner (to put), preterite, he. Irregular: puse, pusiste, puso, pusimos, pusisteis, pusieron."}
          - {w: "al", f: "a + el."}
          - {w: "buena", f: "buen- + -a → bueno (good), feminine to match 'mula'."}
          - {w: "comenzó", f: "comenz- + -ó → comenzar (to begin), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "aquella", f: "aquell- + -a → 'that', feminine to match 'campaña'."}
          - {w: "ligero", f: "masculine singular: it describes the monk, working almost as an adverb ('swiftly')."}
          - {w: "mesmo", f: "old spelling of mismo; after the article, 'the ... itself'."}
  - sentences:
      - es: "Sancho Panza, que vio en el suelo al fraile, apeándose ligeramente de su asno, arremetió a él y le comenzó a quitar los hábitos."
        literal: "Sancho Panza, who saw on the ground the friar, dismounting-himself lightly from his donkey, rushed at him and from-him began to remove the habits."
        ormsby: "Sancho Panza, when he saw the friar on the ground, dismounting briskly from his ass, rushed towards him and began to strip off his gown."
        vocab:
          - {w: "apearse", d: "to dismount, get down"}
          - {w: "ligeramente", d: "nimbly, quickly"}
          - {w: "arremeter a", d: "to rush at"}
          - {w: "hábitos", d: "a friar's habit, robes (plural in Spanish)"}
        diagram:
          - s: "arremetió a él"
            r: "main verb 1: rushed at him"
            under:
              - s: "Sancho Panza"
                r: "subject"
                under:
                  - {s: "que vio en el suelo al fraile", r: "describes Sancho: who saw the friar on the ground"}
              - {s: "apeándose ligeramente de su asno", r: "how: nimbly getting off his donkey"}
          - {s: "y le comenzó a quitar los hábitos", r: "main verb 2: and began to strip off his habit"}
        forms:
          - {w: "vio", f: "vi- + -o → ver (to see), preterite, he: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "al fraile", f: "a + el: the personal 'a' before a person as object."}
          - {w: "apeándose", f: "ape- + -ando + se → gerund of apearse (to dismount), 'se' on the end, accent added."}
          - {w: "ligeramente", f: "ligera + -mente → adverb from ligero (light, quick), like English -ly (feminine form + -mente)."}
          - {w: "arremetió", f: "arremet- + -ió → arremeter (to rush), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "le comenzó a quitar", f: "comenz- + -ó → comenzar (to begin), preterite, he, + 'a' + quitar (to take off); 'le' (from him) belongs to quitar but sits before the conjugated verb. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
      - es: "Llegaron en esto dos mozos de los frailes y preguntáronle que por qué le desnudaba."
        literal: "Arrived at this two lads of the friars and asked-him that why him he-was-stripping."
        ormsby: "At that instant the friars muleteers came up and asked what he was stripping him for."
        vocab:
          - {w: "mozo", d: "lad, young servant; here the mule-boys"}
          - {w: "desnudar", d: "to strip, undress"}
        diagram:
          - s: "Llegaron"
            r: "main verb 1: arrived"
            under:
              - {s: "en esto", r: "when: just then"}
              - {s: "dos mozos de los frailes", r: "subject: two of the friars' servants"}
          - s: "y preguntáronle"
            r: "main verb 2: and asked him"
            under:
              - {s: "que por qué le desnudaba", r: "what they asked: why he was stripping him"}
        forms:
          - {w: "Llegaron", f: "lleg- + -aron → llegar (to arrive), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "preguntáronle", f: "pregunt- + -aron + le → preguntar (to ask), preterite, they, with 'le' (him) on the end: modern 'le preguntaron'. Cervantes hangs pronouns on a conjugated verb that opens its clause, here right after 'y'. Same -ar preterite."}
          - {w: "que por qué", f: "an old 'que' that introduces the reported question, then 'por qué' (why), accented because it asks."}
          - {w: "le desnudaba", f: "desnud- + -aba → desnudar (to strip), imperfect, he: 'was stripping'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. 'le' = him: Castilian uses 'le' for a male direct object (leísmo)."}
      - es: "Respondióles Sancho que aquello le tocaba a él ligítimamente, como despojos de la batalla que su señor don Quijote había ganado."
        literal: "Answered-them Sancho that that to-him belonged to him legitimately, as spoils of the battle that his lord Don Quijote had won."
        ormsby: "Sancho answered them that this fell to him lawfully as spoil of the battle which his lord Don Quixote had won."
        vocab:
          - {w: "tocarle a uno", d: "to belong to someone, be someone's due"}
          - {w: "ligítimamente", d: "= legítimamente, lawfully (old or rustic vowel)"}
          - {w: "despojos", d: "spoils of war"}
        diagram:
          - s: "Respondióles Sancho"
            r: "main verb: Sancho answered them"
            under:
              - s: "que aquello le tocaba a él ligítimamente"
                r: "what he answered: that it was rightfully his"
                under:
                  - s: "como despojos de la batalla"
                    r: "as what: as spoils of the battle"
                    under:
                      - {s: "que su señor don Quijote había ganado", r: "describes 'batalla': that his master Don Quijote had won"}
        forms:
          - {w: "Respondióles", f: "respond- + -ió + les → responder (to answer), preterite, he, with 'les' (to them) on the end: modern 'les respondió'. Cervantes hangs pronouns on a conjugated verb that opens its clause. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "aquello", f: "neuter 'that [stuff]': the habit."}
          - {w: "le tocaba a él", f: "toc- + -aba → tocar (to belong to), imperfect, it, with 'le' (to him), doubled by 'a él' for emphasis. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "ligítimamente", f: "ligítima + -mente → adverb, the old spelling of legítimamente."}
          - {w: "había ganado", f: "había (haber) + ganado (participle of ganar, to win): pluperfect, he: 'had won'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
        note: "The victor's right to the loser's arms, horse and clothes was a real custom of war and of the romances. Sancho applies it, with perfect logic, to a monk's habit."
      - es: "Los mozos, que no sabían de burlas, ni entendían aquello de despojos ni batallas, viendo que ya don Quijote estaba desviado de allí, hablando con las que en el coche venían, arremetieron con Sancho y dieron con él en el suelo;"
        literal: "The lads, who not knew of jokes, nor understood that of spoils nor battles, seeing that already Don Quijote was moved-aside from there, talking with the-ones who in the coach came, charged with Sancho and gave with him on the ground;"
        ormsby: "The muleteers, who had no idea of a joke and did not understand all this about battles and spoils, seeing that Don Quixote was some distance off talking to the travellers in the coach, fell upon Sancho, knocked him down,"
        vocab:
          - {w: "saber de burlas", d: "to understand jokes"}
          - {w: "aquello de", d: "that business of, all that talk of"}
          - {w: "desviado", d: "moved away, off to one side"}
          - {w: "arremeter con", d: "to fall upon, set upon"}
          - {w: "dar con alguien en el suelo", d: "to knock someone to the ground"}
        diagram:
          - s: "arremetieron con Sancho"
            r: "main verb 1: fell upon Sancho"
            under:
              - s: "Los mozos"
                r: "subject: the servants"
                under:
                  - {s: "que no sabían de burlas", r: "describes them: who knew nothing of jokes"}
                  - {s: "ni entendían aquello de despojos ni batallas", r: "describes them: nor understood that talk of spoils and battles"}
              - s: "viendo que ya don Quijote estaba desviado de allí"
                r: "when: seeing that Don Quijote had moved off"
                under:
                  - {s: "hablando con las que en el coche venían", r: "what he was doing: talking to the women in the coach"}
          - {s: "y dieron con él en el suelo", r: "main verb 2: and knocked him to the ground"}
        forms:
          - {w: "sabían", f: "sab- + -ían → saber (to know), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "entendían", f: "entend- + -ían → entender (to understand), imperfect, they. Same -ía imperfect."}
          - {w: "viendo", f: "vi- + -endo → gerund of ver (to see)."}
          - {w: "estaba desviado", f: "est- + -aba → estar (to be), imperfect, he, + desviado (participle of desviar, to move aside): 'was off to one side'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "las que", f: "'the women who': feminine plural article as a pronoun + 'que'."}
          - {w: "venían", f: "ven- + -ían → venir (to come), imperfect, they. Same -ía imperfect."}
          - {w: "arremetieron", f: "arremet- + -ieron → arremeter (to charge), preterite, they. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "dieron", f: "dar (to give; 'dar con ... en el suelo' = to throw down), preterite, they: di, diste, dio, dimos, disteis, dieron."}
      - es: "y, sin dejarle pelo en las barbas, le molieron a coces y le dejaron tendido en el suelo sin aliento ni sentido."
        literal: "and, without leaving-him hair in the beard, him they-ground with kicks and him they-left stretched on the ground without breath nor sense."
        ormsby: "and leaving hardly a hair in his beard, belaboured him with kicks and left him stretched breathless and senseless on the ground;"
        vocab:
          - {w: "barbas", d: "beard (often plural in older Spanish)"}
          - {w: "moler a coces", d: "to kick black and blue; 'moler' = to grind, 'coz' = kick"}
          - {w: "tendido", d: "stretched out, lying flat"}
          - {w: "aliento", d: "breath"}
          - {w: "sentido", d: "consciousness, senses"}
        diagram:
          - s: "le molieron a coces"
            r: "main verb 1: they kicked him black and blue"
            under:
              - {s: "y, sin dejarle pelo en las barbas", r: "how: without leaving him a hair in his beard"}
          - s: "y le dejaron tendido en el suelo"
            r: "main verb 2: and left him stretched out on the ground"
            under:
              - {s: "sin aliento ni sentido", r: "how: breathless and senseless"}
        forms:
          - {w: "dejarle", f: "dejar (to leave) + le (to him), infinitive after 'sin'."}
          - {w: "le molieron", f: "mol- + -ieron → moler (to grind), preterite, they. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron. 'le' = him: Castilian uses 'le' for a male direct object (leísmo)."}
          - {w: "coces", f: "coz + -es → plural; z becomes c before e."}
          - {w: "le dejaron", f: "dej- + -aron → dejar (to leave), preterite, they, 'le' = him. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "tendido", f: "tend- + -ido → participle of tender (to stretch out), masculine to match Sancho."}
        note: "Pulling out a man's beard was a grave insult in Spain, a sign of utter defeat."
      - es: "Y, sin detenerse un punto, tornó a subir el fraile, todo temeroso y acobardado y sin color en el rostro;"
        literal: "And, without stopping-himself a point, returned to mount the friar, all fearful and cowed and without color in the face;"
        ormsby: "and without any more delay helped the friar to mount, who, trembling, terrified, and pale,"
        vocab:
          - {w: "detenerse", d: "to stop, linger"}
          - {w: "un punto", d: "a moment"}
          - {w: "tornar a subir", d: "to mount again, get back on"}
          - {w: "temeroso", d: "fearful"}
          - {w: "acobardado", d: "cowed, frightened (from 'cobarde', coward)"}
          - {w: "sin color", d: "pale, white as a sheet"}
        diagram:
          - s: "tornó a subir el fraile"
            r: "main verb: the friar got back on his mule"
            under:
              - {s: "Y, sin detenerse un punto", r: "how: without stopping a moment"}
              - {s: "todo temeroso y acobardado y sin color en el rostro", r: "describes the friar: all fearful and cowed and pale"}
        forms:
          - {w: "detenerse", f: "detener (to stop) + se, infinitive after 'sin'."}
          - {w: "tornó", f: "torn- + -ó → tornar (to return; + a + infinitive = to do again), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "todo", f: "'all, entirely', agreeing with the friar (masculine singular) even though it works as an adverb."}
          - {w: "temeroso", f: "tem(er) (to fear) + -oso: 'fearful', masculine."}
          - {w: "acobardado", f: "acobard- + -ado → participle of acobardar (to frighten), masculine."}
        note: "Ormsby has the servants help the friar mount; the Spanish only says the friar got back on, and the subject of 'tornó' is the friar."
      - es: "y, cuando se vio a caballo, picó tras su compañero, que un buen espacio de allí le estaba aguardando, y esperando en qué paraba aquel sobresalto;"
        literal: "and, when himself he-saw on horse, he-spurred after his companion, who a good space from there him was awaiting, and waiting in what ended that alarm;"
        ormsby: "as soon as he found himself in the saddle, spurred after his companion, who was standing at a distance looking on, watching the result of the onslaught;"
        vocab:
          - {w: "verse a caballo", d: "to find oneself mounted"}
          - {w: "picar tras", d: "to spur after"}
          - {w: "un buen espacio", d: "a good way off"}
          - {w: "aguardar", d: "to wait for"}
          - {w: "parar en", d: "to end in, come to"}
          - {w: "sobresalto", d: "sudden alarm, fright"}
        diagram:
          - s: "picó tras su compañero"
            r: "main verb: he spurred after his companion"
            under:
              - {s: "cuando se vio a caballo", r: "when: once he was in the saddle"}
              - {s: "que un buen espacio de allí le estaba aguardando", r: "describes 'compañero': who was waiting for him a good way off"}
              - {s: "y esperando en qué paraba aquel sobresalto", r: "describes 'compañero': and waiting to see how the alarm would end"}
        forms:
          - {w: "se vio", f: "vi- + -o → ver (to see), preterite, he, with 'se': 'saw himself' = found himself. ver's preterite: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "picó", f: "pic- + -ó → picar (to spur), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "buen", f: "bueno clipped before a masculine singular noun ('espacio')."}
          - {w: "le estaba aguardando", f: "est- + -aba → estar (to be), imperfect, he, + aguardando (gerund of aguardar, to wait for): 'was waiting for him'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. 'le' = him: Castilian uses 'le' for a male direct object (leísmo)."}
          - {w: "esperando", f: "esper- + -ando → gerund of esperar (to wait)."}
          - {w: "qué", f: "accented because it asks, even inside another sentence: 'in what [it would end]'."}
          - {w: "paraba", f: "par- + -aba → parar (to stop; 'parar en' = to end in), imperfect, it. Same -aba imperfect."}
      - es: "y, sin querer aguardar el fin de todo aquel comenzado suceso, siguieron su camino, haciéndose más cruces que si llevaran al diablo a las espaldas."
        literal: "and, without wanting to-await the end of all that begun event, they-followed their road, making-themselves more crosses than if they-carried the devil at the backs."
        ormsby: "then, not caring to wait for the end of the affair just begun, they pursued their journey making more crosses than if they had the devil after them."
        vocab:
          - {w: "suceso", d: "event, affair; a false friend, not 'success'"}
          - {w: "comenzado", d: "begun, just started"}
          - {w: "hacerse cruces", d: "to cross oneself over and over (in fear or amazement)"}
          - {w: "a las espaldas", d: "on one's back, right behind"}
        diagram:
          - s: "siguieron su camino"
            r: "main verb: they went on their way"
            under:
              - {s: "y, sin querer aguardar el fin de todo aquel comenzado suceso", r: "how: not wanting to wait for the end of the affair"}
              - s: "haciéndose más cruces"
                r: "how: crossing themselves more"
                under:
                  - {s: "que si llevaran al diablo a las espaldas", r: "than what: than if they had the devil on their backs"}
        forms:
          - {w: "querer", f: "infinitive (to want) after 'sin'."}
          - {w: "comenzado", f: "comenz- + -ado → participle of comenzar (to begin), used as an adjective before the noun."}
          - {w: "siguieron", f: "sigu- + -ieron → seguir (to follow), preterite, they. The stem e becomes i in the he and they forms: seguí, seguiste, siguió, seguimos, seguisteis, siguieron."}
          - {w: "haciéndose", f: "hac- + -iendo + se → gerund of hacer (to make) + 'se' (on themselves), accent added."}
          - {w: "llevaran", f: "llev- + -aran → llevar (to carry), imperfect subjunctive (-ra form), they: 'if they were carrying'. llevara, llevaras, llevara, lleváramos, llevarais, llevaran. 'que si' / 'como si' always takes the imperfect subjunctive."}
