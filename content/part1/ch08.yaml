  - sentences:
      - es: "— ¡Oh señora de mi alma, Dulcinea, flor de la fermosura, socorred a este vuestro caballero, que, por satisfacer a la vuestra mucha bondad, en este riguroso trance se halla!"
        literal: "— Oh lady of my soul, Dulcinea, flower of the beauty, succor to this your knight, who, for satisfying to the your much goodness, in this harsh crisis himself finds!"
        ormsby: "“O lady of my soul, Dulcinea, flower of beauty, come to the aid of this your knight, who, in fulfilling his obligations to your beauty, finds himself in this extreme peril.”"
        vocab:
          - {w: "flor de la fermosura", d: "flower of beauty; 'fermosura' = hermosura with the old f-"}
          - {w: "socorrer", d: "to help, come to the aid of"}
          - {w: "satisfacer a", d: "to satisfy, do justice to"}
          - {w: "bondad", d: "goodness, kindness"}
          - {w: "trance", d: "critical moment, peril"}
        diagram:
          - s: "socorred a este vuestro caballero"
            r: "main verb (command): help this knight of yours"
            under:
              - {s: "¡Oh señora de mi alma, Dulcinea, flor de la fermosura", r: "whom he addresses: O lady of my soul, Dulcinea, flower of beauty"}
              - {s: "que, por satisfacer a la vuestra mucha bondad, en este riguroso trance se halla!", r: "describes 'caballero': who is in this peril for the sake of your great goodness"}
        forms:
          - {w: "socorred", f: "socorr- + -ed → socorrer (to help), command to vos / vosotros: the infinitive with -r turned into -d."}
          - {w: "este vuestro", f: "demonstrative + possessive side by side, 'this your', the courtly antique style. vuestro is the possessive of 'vos'."}
          - {w: "satisfacer", f: "infinitive (to satisfy) after 'por'; conjugated like hacer (satisfago, satisfice)."}
          - {w: "la vuestra mucha bondad", f: "archaic article + possessive + mucha (great), all feminine to match 'bondad'."}
          - {w: "riguroso", f: "rigur- + -oso → 'harsh', masculine to match 'trance'."}
          - {w: "se halla", f: "hall- + -a → hallarse (to find oneself), present, he, put last in the high style. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
  - sentences:
      - es: "El decir esto, y el apretar la espada, y el cubrirse bien de su rodela, y el arremeter al vizcaíno, todo fue en un tiempo, llevando determinación de aventurarlo todo a la de un golpe solo."
        literal: "The saying this, and the gripping the sword, and the covering-himself well with his round-shield, and the charging at-the Biscayan, all was in one time, carrying determination of risking-it all to the [fortune] of one blow alone."
        ormsby: "To say this, to lift his sword, to shelter himself well behind his buckler, and to assail the Biscayan was the work of an instant, determined as he was to venture all upon a single blow."
        vocab:
          - {w: "apretar", d: "to grip, clench"}
          - {w: "en un tiempo", d: "at one and the same moment"}
          - {w: "aventurar", d: "to risk, stake"}
          - {w: "a la de un golpe solo", d: "on the chance of a single blow ('la' stands for a word like 'suerte', chance)"}
        diagram:
          - s: "todo fue en un tiempo"
            r: "main verb: it was all at the same moment"
            under:
              - {s: "El decir esto", r: "subject 1: saying this"}
              - {s: "y el apretar la espada", r: "subject 2: gripping his sword"}
              - {s: "y el cubrirse bien de su rodela", r: "subject 3: covering himself well with his shield"}
              - {s: "y el arremeter al vizcaíno", r: "subject 4: charging the Biscayan"}
              - s: "llevando determinación de aventurarlo todo"
                r: "how: resolved to stake everything"
                under:
                  - {s: "a la de un golpe solo", r: "on what: on a single blow"}
        forms:
          - {w: "El decir, el apretar, el cubrirse, el arremeter", f: "infinitives used as nouns with 'el': 'the saying, the gripping, the covering oneself, the charging'. Any infinitive can be a noun."}
          - {w: "fue", f: "ser (to be), preterite, it: fui, fuiste, fue, fuimos, fuisteis, fueron. Singular because 'todo' sums up the four actions."}
          - {w: "llevando", f: "llev- + -ando → gerund of llevar (to carry): 'carrying [the resolve]'."}
          - {w: "aventurarlo", f: "aventurar (to risk) + lo (it), with 'todo' doubling the 'lo'."}
          - {w: "la de", f: "'that of': 'la' stands for a feminine noun left unsaid, like 'suerte' (chance)."}
          - {w: "al", f: "a + el."}
  - sentences:
      - es: "El vizcaíno, que así le vio venir contra él, bien entendió por su denuedo su coraje, y determinó de hacer lo mesmo que don Quijote;"
        literal: "The Biscayan, who thus him saw come against him, well understood by his daring his courage, and determined of doing the same as Don Quijote;"
        ormsby: "The Biscayan, seeing him come on in this way, was convinced of his courage by his spirited bearing, and resolved to follow his example,"
        vocab:
          - {w: "denuedo", d: "boldness, daring"}
          - {w: "coraje", d: "courage; also 'fury'"}
