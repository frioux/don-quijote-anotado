          - {w: "en + gerund", d: "on doing, as soon as: 'en diciendo esto' = the moment he said this"}
          - {w: "encomendarse a", d: "to commend oneself to, put oneself in the hands of"}
          - {w: "de todo corazón", d: "with all one's heart"}
          - {w: "trance", d: "critical moment, peril"}
          - {w: "socorrer", d: "to help, come to the aid of"}
          - {w: "rodela", d: "round shield, buckler"}
          - {w: "ristre", d: "lance-rest, a hook on the breastplate that takes the butt of the couched lance"}
          - {w: "arremeter", d: "to charge, rush at"}
          - {w: "a todo el galope", d: "at full gallop"}
          - {w: "embestir con", d: "to charge into, ram"}
