          - {w: "le respondió", f: "respond- + -ió → responder (to answer), preterite, he, with 'le' (to him). Same -ió preterite."}
        note: "'Understood him very well' is a dry joke: the Biscayan's speech barely hangs together."
  - sentences:
      - es: "— Si fueras caballero, como no lo eres, ya yo hubiera castigado tu sandez y atrevimiento, cautiva criatura."
        literal: "— If you-were knight, as not it you-are, already I would-have punished your foolishness and insolence, captive creature."
        ormsby: "“If thou wert a knight, as thou art none, I should have already chastised thy folly and rashness, miserable creature.”"
        vocab:
          - {w: "caballero", d: "knight; also 'gentleman', which is how the Biscayan will take it"}
          - {w: "castigar", d: "to punish"}
          - {w: "sandez", d: "foolishness, stupidity"}
          - {w: "atrevimiento", d: "insolence, daring"}
          - {w: "cautivo", d: "captive; also, in older Spanish, 'wretched, miserable'"}
        diagram:
          - s: "ya yo hubiera castigado tu sandez y atrevimiento"
            r: "main verb: I would already have punished your folly and insolence"
            under:
              - {s: "Si fueras caballero", r: "condition: if you were a knight"}
              - {s: "como no lo eres", r: "aside: as you are not"}
              - {s: "cautiva criatura", r: "whom he addresses: wretched creature"}
        forms:
          - {w: "fueras", f: "fu- + -eras → ser (to be), imperfect subjunctive (-ra form), you: fuera, fueras, fuera, fuéramos, fuerais, fueran. After 'si' it is the counterfactual."}
          - {w: "lo eres", f: "ser (to be), present, you: soy, eres, es, somos, sois, son; 'lo' stands for 'caballero'."}
          - {w: "hubiera castigado", f: "hub- + -iera → haber, imperfect subjunctive (-ra form), I, + castigado (participle of castigar, to punish), used as a conditional: 'I would have punished'. hubiera, hubieras, hubiera, hubiéramos, hubierais, hubieran. Cervantes uses the -ra form where modern Spanish says 'habría castigado'."}
          - {w: "tu", f: "'your' (tú), no accent; the pronoun 'tú' has one."}
          - {w: "cautiva", f: "cautiv- + -a → cautivo (wretched), feminine to match 'criatura'."}
        note: "Don Quijote means that a knight may only fight a knight, so the man is beneath his sword. The Biscayan hears 'caballero' as 'gentleman' and takes it as a slur on his birth."
  - sentences:
      - es: "A lo cual replicó el vizcaíno:"
        literal: "To which replied the Biscayan:"
        ormsby: "To which the Biscayan returned,"
        vocab:
          - {w: "replicar", d: "to retort, answer back"}
        diagram:
          - s: "replicó el vizcaíno:"
