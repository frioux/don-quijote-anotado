  - sentences:
      - es: "Venía, pues, como se ha dicho, don Quijote contra el cauto vizcaíno, con la espada en alto, con determinación de abrirle por medio, y el vizcaíno le aguardaba ansimesmo levantada la espada y aforrado con su almohada, y todos los circunstantes estaban temerosos y colgados de lo que había de suceder de aquellos tamaños golpes con que se amenazaban;"
        literal: "Came, then, as itself has said, Don Quijote against the wary Biscayan, with the sword on high, with determination of opening-him through middle, and the Biscayan him was-awaiting likewise raised the sword and lined with his cushion, and all the bystanders were fearful and hanging on what had to happen from those so-great blows with which themselves they-threatened;"
        ormsby: "On, then, as aforesaid, came Don Quixote against the wary Biscayan, with uplifted sword and a firm intention of splitting him in half, while on his side the Biscayan waited for him sword in hand, and under the protection of his cushion; and all present stood trembling, waiting in suspense the result of blows such as threatened to fall,"
