  - sentences:
      - es: "— Yo me acuerdo haber leído que un caballero español, llamado Diego Pérez de Vargas, habiéndosele en una batalla roto la espada, desgajó de una encina un pesado ramo o tronco, y con él hizo tales cosas aquel día, y machacó tantos moros, que le quedó por sobrenombre Machuca, y así él como sus decendientes se llamaron, desde aquel día en adelante, Vargas y Machuca."
        literal: "— I myself remember to-have read that a knight Spanish, called Diego Pérez de Vargas, having-itself-to-him in a battle broken the sword, tore from an evergreen-oak a heavy bough or trunk, and with it he-did such things that day, and pounded so-many Moors, that to-him remained for surname Machuca, and as-well he as his descendants called-themselves, from that day onward, Vargas y Machuca."
        ormsby: "“I remember having read how a Spanish knight, Diego Pérez de Vargas by name, having broken his sword in battle, tore from an oak a ponderous bough or branch, and with it did such things that day, and pounded so many Moors, that he got the surname of Machuca, and he and his descendants from that day forth were called Vargas y Machuca."
        vocab:
          - {w: "acordarse", d: "to remember; Cervantes drops the usual 'de' before the infinitive"}
          - {w: "Diego Pérez de Vargas", d: "a Castilian knight of the 13th century, hero of a ballad about the siege of Jerez"}
          - {w: "desgajar", d: "to tear off, wrench off (a branch)"}
          - {w: "encina", d: "holm oak, the evergreen oak of the Spanish plains"}
          - {w: "ramo", d: "branch, bough"}
          - {w: "tronco", d: "trunk; here a thick bough, a club"}
          - {w: "machacar", d: "to pound, crush"}
          - {w: "moros", d: "Moors, the Muslims of Spain and North Africa"}
          - {w: "quedarle a uno por sobrenombre", d: "to be left with (a name) as a byname"}
          - {w: "Machuca", d: "'Pounder', from machucar / machacar, to pound"}
          - {w: "así ... como", d: "both ... and"}
          - {w: "decendientes", d: "= descendientes, descendants (old spelling)"}
          - {w: "desde ... en adelante", d: "from ... onward"}
        diagram:
          - s: "Yo me acuerdo haber leído"
            r: "main verb: I remember having read"
            under:
              - s: "que un caballero español"
                r: "what I read: that a Spanish knight ..."
                under:
                  - {s: "llamado Diego Pérez de Vargas", r: "describes 'caballero': called Diego Pérez de Vargas"}
                  - {s: "habiéndosele en una batalla roto la espada", r: "when: his sword having broken in a battle"}
                  - {s: "desgajó de una encina un pesado ramo o tronco", r: "his verb 1: tore a heavy bough off an oak"}
                  - {s: "y con él hizo tales cosas aquel día", r: "his verb 2: and did such things with it that day"}
                  - s: "y machacó tantos moros"
                    r: "his verb 3: and pounded so many Moors"
                    under:
                      - {s: "que le quedó por sobrenombre Machuca", r: "result: that he was left with the byname Machuca"}
              - {s: "y así él como sus decendientes se llamaron, desde aquel día en adelante, Vargas y Machuca", r: "what I read, 2: both he and his descendants were called Vargas y Machuca from then on"}
        forms:
          - {w: "me acuerdo", f: "acuerd- + -o → acordarse (to remember), present, I, with 'me'. The stem o becomes ue when stressed: me acuerdo, te acuerdas, se acuerda, nos acordamos, os acordáis, se acuerdan."}
          - {w: "haber leído", f: "haber + leído (participle of leer, to read): the perfect infinitive, 'to have read'."}
          - {w: "llamado", f: "llam- + -ado → participle of llamar (to call): 'called', masculine to match 'caballero'."}
          - {w: "habiéndosele ... roto", f: "habiendo (gerund of haber) + se + le + roto (irregular participle of romper, to break): 'the sword having broken on him'. 'se' makes the sword break by itself; 'le' shows whom it happened to."}
          - {w: "desgajó", f: "desgaj- + -ó → desgajar (to tear off), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "pesado", f: "pes- + -ado → 'heavy', masculine to match 'ramo'."}
          - {w: "hizo", f: "hacer (to do), preterite, he. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "tales", f: "tal + -es → plural to match 'cosas': 'such'."}
          - {w: "machacó", f: "machac- + -ó → machacar (to pound), preterite, he. Same -ar preterite (the I form is 'machaqué', qu keeping the hard c)."}
          - {w: "tantos", f: "tant- + -os → tanto, masculine plural to match 'moros'; 'tantos ... que' = so many ... that."}
          - {w: "le quedó", f: "qued- + -ó → quedar (to remain), preterite, it, with 'le' (to him): 'remained to him'. Same -ar preterite."}
          - {w: "decendientes", f: "old spelling of descendientes."}
          - {w: "se llamaron", f: "llam- + -aron → llamarse (to be called), preterite, they. Same -ar preterite."}
        ormsby_note: "From machucar or machacar, 'to pound.' The feat referred to by Don Quixote was performed at the siege of Jerez under Alfonso X in 1264, and is the subject of a spirited ballad which Lockhart has treated with even more than his usual freedom."
