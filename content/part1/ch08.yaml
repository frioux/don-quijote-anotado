          - {w: "grandes", f: "grande + -s → plural to match 'aspas'."}
          - {w: "comenzaron", f: "comenz- + -aron → comenzar (to begin), preterite, they. Same -ar preterite."}
          - {w: "moverse", f: "mover (to move) + se, the infinitive after 'comenzar a', with 'se' on the end: 'to move themselves'."}
          - {w: "lo cual visto", f: "an absolute participle: visto (irregular participle of ver, to see) + 'lo cual' (which): 'which having been seen'. The subject of 'dijo' is Don Quijote."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Pues, aunque mováis más brazos que los del gigante Briareo, me lo habéis de pagar."
        literal: "— Well, although you-move more arms than those of-the giant Briareus, to-me it you-have to pay."
        ormsby: "“Though ye flourish more arms than the giant Briareus, ye have to reckon with me.”"
        vocab:
          - {w: "pues", d: "well then (a connective)"}
          - {w: "Briareo", d: "Briareus, a giant of Greek myth with a hundred arms and fifty heads"}
          - {w: "haber de + infinitive", d: "to have to, shall"}
          - {w: "me lo habéis de pagar", d: "you'll pay me for it (a standard threat)"}
        diagram:
          - s: "me lo habéis de pagar"
            r: "main verb: you shall pay me for it"
            under:
              - {s: "Pues", r: "opener: well then"}
              - s: "aunque mováis más brazos"
                r: "concession: even if you move more arms"
                under:
                  - {s: "que los del gigante Briareo", r: "than whose: than the giant Briareus's"}
        forms:
          - {w: "mováis", f: "mov- + -áis → mover (to move), present subjunctive, you (plural). The present subjunctive of -er verbs: -a, -as, -a, -amos, -áis, -an; the stem o becomes ue where stressed (mueva, muevas, mueva, movamos, mováis, muevan). Subjunctive after 'aunque' = even if."}
          - {w: "los del", f: "'those of the': 'los' stands for 'brazos'; del = de + el."}
          - {w: "me lo", f: "me (to me) + lo (it), both before the conjugated verb, the 'to whom' pronoun first."}
          - {w: "habéis de pagar", f: "hab- + -éis → haber, present, you (plural), + 'de' + the infinitive pagar (to pay): 'you shall pay'. haber's present: he, has, ha, hemos, habéis, han. 'haber de' + infinitive = must, shall."}
  - sentences:
      - es: "Y, en diciendo esto, y encomendándose de todo corazón a su señora Dulcinea, pidiéndole que en tal trance le socorriese, bien cubierto de su rodela, con la lanza en el ristre, arremetió a todo el galope de Rocinante y embistió con el primero molino que estaba delante;"
        literal: "And, on saying this, and commending-himself of all heart to his lady Dulcinea, asking-her that in such crisis him she-should-succor, well covered of his round-shield, with the lance in the rest, he-charged at all the gallop of Rocinante and rammed with the first mill that was in-front;"
        ormsby: "So saying, and commending himself with all his heart to his lady Dulcinea, imploring her to support him in such a peril, with lance in rest and covered by his buckler, he charged at Rocinante’s fullest gallop and fell upon the first mill that stood in front of him;"
