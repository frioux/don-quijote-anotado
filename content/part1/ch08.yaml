          - {w: "lo mesmo", f: "neuter 'lo' + mesmo (= mismo): 'the same thing'."}
      - es: "y así, le aguardó bien cubierto de su almohada, sin poder rodear la mula a una ni a otra parte;"
        literal: "and so, him he-awaited well covered with his cushion, without being-able to-turn the mule to one nor to other side;"
