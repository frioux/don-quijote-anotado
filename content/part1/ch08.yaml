          - {w: "detener las riendas", d: "to rein in"}
          - {w: "quedar admirado", d: "to be astonished; 'admirar' means 'to amaze' more than 'to admire'"}
          - {w: "así ... como", d: "both ... and"}
          - {w: "figura", d: "appearance, figure"}
          - {w: "razones", d: "words, speech"}
        diagram:
