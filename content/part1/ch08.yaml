part: 1
chapter: 8
title_es: "Capítulo VIII. Del buen suceso que el valeroso don Quijote tuvo en la espantable y jamás imaginada aventura de los molinos de viento, con otros sucesos dignos de felice recordación"
title_en: "Of the good fortune which the valiant Don Quixote had in the terrible and undreamt-of adventure of the windmills, with other occurrences worthy to be fitly recorded"
paragraphs:
  - sentences:
      - es: "En esto, descubrieron treinta o cuarenta molinos de viento que hay en aquel campo; y, así como don Quijote los vio, dijo a su escudero:"
        literal: "In this, they-discovered thirty or forty mills of wind that there-are in that plain; and, as-soon as Don Quijote them saw, he-said to his squire:"
        ormsby: "At this point they came in sight of thirty or forty windmills that there are on that plain, and as soon as Don Quixote saw them he said to his squire,"
        vocab:
          - {w: "en esto", d: "at this point, just then"}
          - {w: "descubrir", d: "to discover; here 'to come in sight of'"}
          - {w: "molino de viento", d: "windmill (molino = mill, viento = wind)"}
          - {w: "campo", d: "here: open country, plain (the Campo de Montiel / Campo de Criptana country of La Mancha)"}
          - {w: "así como", d: "as soon as"}
          - {w: "escudero", d: "squire, a knight's attendant (from 'escudo', shield, which he carried)"}
        diagram:
          - s: "descubrieron"
            r: "main verb 1: they came in sight of; 'they' (Don Quijote and Sancho) is in the ending"
            under:
              - {s: "En esto", r: "when: at this point"}
              - s: "treinta o cuarenta molinos de viento"
                r: "object: thirty or forty windmills"
                under:
                  - {s: "que hay en aquel campo", r: "describes 'molinos': that there are on that plain"}
          - s: "dijo"
            r: "main verb 2 (after 'y'): he said"
            under:
              - {s: "así como don Quijote los vio", r: "when: as soon as Don Quijote saw them"}
              - {s: "a su escudero", r: "to whom: to his squire"}
        forms:
          - {w: "descubrieron", f: "descubr- + -ieron → descubrir (to discover, come in sight of), preterite, they. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "hay", f: "haber (there to be), the special present form 'there is / there are'; it never changes. Present, not past: the narrator speaks as if the mills still stand there for the reader to visit."}
          - {w: "aquel", f: "'that' (far off), masculine singular to match 'campo': aquel, aquella, aquellos, aquellas."}
          - {w: "los vio", f: "vi- + -o → ver (to see), preterite, he, with 'los' (them: the mills) before it. ver's preterite: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular stem: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "su", f: "'his'; the possessive agrees with the thing owned ('escudero', singular), never with the owner: su, sus."}
        ormsby_note: "These famous windmills had not been very long set up, and owed their existence to the failure of water-power in the Zancara, an affluent of the Guadiana, about thirty years before Don Quixote was written. They are scattered over the plain between Alcázar de S. Juan and Villaharta."
  - sentences:
      - es: "— La ventura va guiando nuestras cosas mejor de lo que acertáramos a desear, porque ves allí, amigo Sancho Panza, donde se descubren treinta, o pocos más, desaforados gigantes, con quien pienso hacer batalla y quitarles a todos las vidas, con cuyos despojos comenzaremos a enriquecer;"
        literal: "— The fortune goes guiding our things better than what we-might-have-managed to desire, because you-see there, friend Sancho Panza, where show-themselves thirty, or few more, lawless giants, with whom I-intend to-make battle and to-take-from-them to all the lives, with whose spoils we-will-begin to get-rich;"
        ormsby: "“Fortune is arranging matters for us better than we could have shaped our desires ourselves, for look there, friend Sancho Panza, where thirty or more monstrous giants present themselves, all of whom I mean to engage in battle and slay, and with whose spoils we shall begin to make our fortunes;"
        vocab:
          - {w: "ventura", d: "fortune, luck; also 'adventure'"}
          - {w: "ir + gerund", d: "to be gradually doing: 'va guiando' = is steering along"}
          - {w: "mejor de lo que", d: "better than (what)"}
          - {w: "acertar a", d: "to manage to, succeed in"}
          - {w: "desaforado", d: "huge, monstrous; literally 'outside the fuero (law)', so lawless and outrageous"}
          - {w: "con quien", d: "with whom; Cervantes uses 'quien' for plurals too, where modern Spanish says 'quienes'"}
          - {w: "pensar + infinitive", d: "to intend to, mean to"}
          - {w: "hacer batalla", d: "to do battle"}
          - {w: "quitar la vida", d: "to take the life, to kill"}
          - {w: "despojos", d: "spoils, booty taken from the defeated"}
          - {w: "enriquecer", d: "to grow rich (also 'to make rich')"}
        diagram:
          - s: "La ventura va guiando nuestras cosas"
            r: "main verb: fortune is steering our affairs"
            under:
              - {s: "mejor de lo que acertáramos a desear", r: "how: better than we could have managed to wish"}
              - s: "porque ves allí, amigo Sancho Panza"
                r: "why: for you see there, friend Sancho"
                under:
                  - s: "donde se descubren treinta, o pocos más, desaforados gigantes"
                    r: "what he sees: where thirty-odd huge giants show themselves"
                    under:
                      - {s: "con quien pienso hacer batalla y quitarles a todos las vidas", r: "describes 'gigantes': whom I mean to fight and kill, every one"}
                      - {s: "con cuyos despojos comenzaremos a enriquecer", r: "describes 'gigantes': with whose spoils we'll start getting rich"}
        forms:
          - {w: "va guiando", f: "v- + -a → ir (to go), present, it, + guiando, the gerund of guiar (to guide): 'is steering along'. ir's present: voy, vas, va, vamos, vais, van. ir + gerund = an action unfolding step by step."}
          - {w: "nuestras", f: "nuestr- + -as → 'our', feminine plural to match 'cosas': nuestro, nuestra, nuestros, nuestras."}
          - {w: "acertáramos", f: "acert- + -áramos → acertar (to manage to), imperfect subjunctive (-ra form), we. Built on the preterite acertaron: acertara, acertaras, acertara, acertáramos, acertarais, acertaran. Here the -ra form does the job of a conditional: 'than we would have managed to wish'."}
          - {w: "ves", f: "v- + -es → ver (to see), present, you (tú): veo, ves, ve, vemos, veis, ven. Master says 'tú' to servant; Sancho will answer with 'vuestra merced'."}
          - {w: "se descubren", f: "descubr- + -en → descubrir (to uncover), present, they, with 'se': 'show themselves'. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "desaforados", f: "desaforad- + -os → desaforado (monstrous), masculine plural to match 'gigantes', placed before the noun for emphasis."}
          - {w: "pienso", f: "piens- + -o → pensar (to think; + infinitive = to intend), present, I. The stem e becomes ie when stressed: pienso, piensas, piensa, pensamos, pensáis, piensan."}
          - {w: "quitarles", f: "quitar (to take away) + les (from them), infinitive after 'pienso'. 'a todos' repeats the 'les' for emphasis: 'from them, from all of them'."}
          - {w: "cuyos", f: "cuy- + -os → 'whose', masculine plural to match 'despojos', the thing owned, not the giants: cuyo, cuya, cuyos, cuyas."}
          - {w: "comenzaremos", f: "comenzar + -emos → comenzar (to begin), future, we. The future is the whole infinitive + -é, -ás, -á, -emos, -éis, -án."}
          - {w: "enriquecer", f: "infinitive (to get rich) after 'comenzar a'."}
      - es: "que ésta es buena guerra, y es gran servicio de Dios quitar tan mala simiente de sobre la faz de la tierra."
        literal: "for this is good war, and it-is great service of God to-remove so bad seed from over the face of the earth."
        ormsby: "for this is righteous warfare, and it is God’s good service to sweep so evil a breed from off the face of the earth.”"
        vocab:
          - {w: "que", d: "here a loose 'for, since', linking to the previous sentence"}
          - {w: "buena guerra", d: "a just war, lawful warfare; a term of law and theology"}
          - {w: "servicio de Dios", d: "service to God"}
          - {w: "simiente", d: "seed; here 'breed, race'"}
          - {w: "de sobre", d: "from off, from the top of"}
          - {w: "faz", d: "face, surface (literary; the everyday word is 'cara')"}
        diagram:
          - {s: "ésta es buena guerra", r: "main clause 1, after a loose 'que' (for): this is a just war"}
          - s: "es gran servicio de Dios"
            r: "main clause 2 (after 'y'): it is a great service to God"
            under:
              - {s: "quitar tan mala simiente de sobre la faz de la tierra", r: "subject: to remove so evil a breed from the face of the earth"}
        forms:
          - {w: "ésta", f: "est- + -a → 'this [one]', feminine pronoun standing for 'guerra'; the older spelling puts an accent on the pronoun."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "gran", f: "grande clipped before a singular noun; before the noun it means 'great', after it 'big'."}
          - {w: "quitar", f: "infinitive (to remove) used as the subject of 'es': 'to remove [them] is a great service'."}
          - {w: "tan mala", f: "tan (so) + mal- + -a → malo (bad), feminine to match 'simiente'."}
        note: "'Buena guerra' was the technical term for a just war, one a Christian could fight with a clear conscience. Don Quijote dresses up an attack on windmills as a crusade."
  - sentences:
      - es: "— ¿Qué gigantes? —dijo Sancho Panza."
        literal: "— What giants? —said Sancho Panza."
        ormsby: "“What giants?” said Sancho Panza."
        vocab:
          - {w: "¿qué ...?", d: "before a noun: 'what ...?, which ...?'"}
        diagram:
          - s: "dijo"
            r: "main verb: said"
            under:
              - {s: "¿Qué gigantes?", r: "what he said"}
              - {s: "Sancho Panza", r: "subject"}
        forms:
          - {w: "Qué", f: "'what'; question words carry an accent (qué, quién, cuál, dónde)."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular stem: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Aquellos que allí ves —respondió su amo— de los brazos largos, que los suelen tener algunos de casi dos leguas."
        literal: "— Those that there you-see —answered his master— of the arms long, for them are-wont to-have some of almost two leagues."
        ormsby: "“Those thou seest there,” answered his master, “with the long arms, and some have them nearly two leagues long.”"
        vocab:
          - {w: "amo", d: "master (of a servant)"}
          - {w: "de los brazos largos", d: "with the long arms, the long-armed ones"}
          - {w: "soler + infinitive", d: "to usually do, be in the habit of"}
          - {w: "legua", d: "league, about 5.5 km, roughly an hour's walk"}
        diagram:
          - s: "respondió su amo"
            r: "frame: his master answered"
          - s: "Aquellos"
            r: "what he answered: 'those', the giants; the verb 'are' is understood"
            under:
              - {s: "que allí ves", r: "describes 'Aquellos': that you see there"}
              - {s: "de los brazos largos", r: "describes 'Aquellos': with the long arms"}
              - {s: "que los suelen tener algunos de casi dos leguas", r: "loose 'que' = 'for': some of them have them nearly two leagues long"}
        forms:
          - {w: "Aquellos", f: "aquell- + -os → 'those' (far off), masculine plural for the giants: aquel, aquella, aquellos, aquellas."}
          - {w: "ves", f: "v- + -es → ver (to see), present, you (tú): veo, ves, ve, vemos, veis, ven."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "largos", f: "larg- + -os → largo (long), masculine plural to match 'brazos'. A false friend: 'largo' is long, not large."}
          - {w: "los suelen tener", f: "suel- + -en → soler (to be in the habit of), present, they, + the infinitive tener (to have); 'los' (them: the arms) sits before the pair. The stem o becomes ue when stressed: suelo, sueles, suele, solemos, soléis, suelen."}
          - {w: "algunos", f: "algun- + -os → alguno (some), masculine plural: 'some of them' (the giants)."}
  - sentences:
      - es: "— Mire vuestra merced —respondió Sancho— que aquellos que allí se parecen no son gigantes, sino molinos de viento, y lo que en ellos parecen brazos son las aspas, que, volteadas del viento, hacen andar la piedra del molino."
        literal: "— Look your grace —answered Sancho— that those that there show-themselves not are giants, but mills of wind, and what in them seem arms are the sails, which, turned by-the wind, make go the stone of-the mill."
        ormsby: "“Look, your worship,” said Sancho; “what we see there are not giants but windmills, and what seem to be their arms are the sails that turned by the wind make the millstone go.”"
        vocab:
          - {w: "vuestra merced", d: "'your grace', the polite address of a servant to a master; it takes 'he/she' verb forms and later shrank to 'usted'"}
          - {w: "parecerse", d: "old sense: to appear, be visible (today 'to look like')"}
          - {w: "sino", d: "but rather, after a negative"}
          - {w: "aspas", d: "the sails of a windmill, its cross-shaped arms"}
          - {w: "voltear", d: "to turn, spin"}
          - {w: "del viento", d: "by the wind; 'de' marks the doer after a participle in older Spanish"}
          - {w: "andar", d: "to walk; of machinery, to go, run"}
          - {w: "piedra del molino", d: "millstone"}
        diagram:
          - s: "Mire vuestra merced"
            r: "main verb (polite command): look, your grace"
            under:
              - {s: "que aquellos que allí se parecen no son gigantes, sino molinos de viento", r: "what to see, 1: those that show there are not giants but windmills"}
              - s: "y lo que en ellos parecen brazos son las aspas"
                r: "what to see, 2: what look like arms on them are the sails"
                under:
                  - {s: "que, volteadas del viento, hacen andar la piedra del molino", r: "describes 'aspas': which, turned by the wind, drive the millstone"}
          - {s: "respondió Sancho", r: "frame: Sancho answered"}
        forms:
          - {w: "Mire", f: "mir- + -e → mirar (to look), present subjunctive, he/she (vuestra merced), used as a polite command. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. 'vuestra merced' takes 'he/she' forms, like modern usted."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "se parecen", f: "parec- + -en → parecer (to seem), with 'se' in the old sense 'to appear, show up', present, they. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (the I form is irregular: parezco)."}
          - {w: "son", f: "ser (to be), present, they: soy, eres, es, somos, sois, son."}
          - {w: "parecen", f: "the same verb without 'se': 'seem'. Plural to agree with 'brazos', the thing they seem to be."}
          - {w: "volteadas", f: "volte- + -adas → participle of voltear (to spin), feminine plural to match 'aspas'."}
          - {w: "hacen andar", f: "hac- + -en → hacer (to make), present, they, + the infinitive andar (to go): 'make [the stone] go'. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (the I form is irregular: hago)."}
          - {w: "del", f: "de + el."}
        note: "The pronouns carry the social order: Don Quijote calls Sancho 'tú', Sancho calls his master 'vuestra merced'."
  - sentences:
      - es: "— Bien parece —respondió don Quijote— que no estás cursado en esto de las aventuras: ellos son gigantes; y si tienes miedo, quítate de ahí, y ponte en oración en el espacio que yo voy a entrar con ellos en fiera y desigual batalla."
        literal: "— Well it-seems —answered Don Quijote— that not you-are versed in this of the adventures: they are giants; and if you-have fear, remove-yourself from there, and put-yourself in prayer in the space that I go to enter with them in fierce and unequal battle."
        ormsby: "“It is easy to see,” replied Don Quixote, “that thou art not used to this business of adventures; those are giants; and if thou art afraid, away with thee out of this and betake thyself to prayer while I engage them in fierce and unequal combat.”"
        vocab:
          - {w: "bien parece", d: "it is plain, it is easy to see"}
          - {w: "cursado en", d: "practised in, versed in (from 'cursar', to study)"}
          - {w: "esto de", d: "this business of"}
          - {w: "tener miedo", d: "to be afraid"}
          - {w: "quitarse de ahí", d: "to get out of the way"}
          - {w: "ponerse en oración", d: "to start praying"}
          - {w: "en el espacio que", d: "during the time that, while"}
          - {w: "fiero", d: "fierce, savage"}
          - {w: "desigual", d: "unequal (he means: one against thirty)"}
        diagram:
          - s: "Bien parece"
            r: "main verb 1: it is plain"
            under:
              - {s: "que no estás cursado en esto de las aventuras", r: "what is plain: you are not versed in adventures"}
          - {s: "respondió don Quijote", r: "frame"}
          - {s: "ellos son gigantes", r: "main clause 2: they are giants"}
          - s: "quítate de ahí"
            r: "main verb 3 (command): get out of the way"
            under:
              - {s: "y si tienes miedo", r: "condition: if you are afraid"}
          - s: "y ponte en oración"
            r: "main verb 4 (command): and start praying"
            under:
              - s: "en el espacio"
                r: "when: during the time"
                under:
                  - {s: "que yo voy a entrar con ellos en fiera y desigual batalla", r: "describes 'espacio': that I go into fierce, unequal battle with them"}
        forms:
          - {w: "parece", f: "parec- + -e → parecer (to seem), present, it. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (the I form is irregular: parezco)."}
          - {w: "estás", f: "estar (to be), present, you (tú): estoy, estás, está, estamos, estáis, están."}
          - {w: "cursado", f: "curs- + -ado → participle of cursar (to study, attend), used as an adjective: 'versed'; masculine to match Sancho."}
          - {w: "son", f: "ser (to be), present, they: soy, eres, es, somos, sois, son."}
          - {w: "tienes", f: "tien- + -es → tener (to have), present, you: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "quítate", f: "quit- + -a + te → quitarse (to take oneself off), command to 'tú' with 'te' on the end; the accent keeps the stress on 'quí-'. The tú command is the same as the he/she present (quita). Pronouns always attach to the end of a positive command."}
          - {w: "ponte", f: "pon + te → ponerse (to put oneself), the short irregular tú command 'pon' + 'te'. The irregular short tú commands: pon, ten, ven, sal, haz, di, ve, sé."}
          - {w: "voy a entrar", f: "v- + -oy → ir (to go), present, I, + 'a' + the infinitive entrar (to go in): 'I am going to go in'. ir's present: voy, vas, va, vamos, vais, van."}
          - {w: "fiera y desigual", f: "fier- + -a → fiero (fierce), feminine to match 'batalla'; 'desigual' has one form for both genders."}
  - sentences:
      - es: "Y, diciendo esto, dio de espuelas a su caballo Rocinante, sin atender a las voces que su escudero Sancho le daba, advirtiéndole que, sin duda alguna, eran molinos de viento, y no gigantes, aquellos que iba a acometer."
        literal: "And, saying this, he-gave of spurs to his horse Rocinante, without attending to the shouts that his squire Sancho to-him gave, warning-him that, without doubt any, they-were mills of wind, and not giants, those that he-was-going to attack."
        ormsby: "So saying, he gave the spur to his steed Rocinante, heedless of the cries his squire Sancho sent after him, warning him that most certainly they were windmills and not giants he was going to attack."
        vocab:
          - {w: "dar de espuelas", d: "to spur, set spurs to (a horse)"}
          - {w: "atender a", d: "to pay attention to, heed (not 'to attend')"}
          - {w: "voces", d: "shouts, cries; 'voz' is both 'voice' and 'shout'"}
          - {w: "advertir", d: "to warn, point out"}
          - {w: "sin duda alguna", d: "without any doubt"}
          - {w: "acometer", d: "to attack, charge"}
        diagram:
          - s: "dio de espuelas"
            r: "main verb: he spurred"
            under:
              - {s: "Y, diciendo esto", r: "when: saying this"}
              - {s: "a su caballo Rocinante", r: "whom: his horse Rocinante"}
              - s: "sin atender a las voces"
                r: "how: not heeding the shouts"
                under:
                  - {s: "que su escudero Sancho le daba", r: "describes 'voces': that his squire Sancho was giving him"}
                  - s: "advirtiéndole"
                    r: "describes Sancho's shouting: warning him"
                    under:
                      - {s: "que, sin duda alguna, eran molinos de viento, y no gigantes, aquellos que iba a acometer", r: "the warning: those he was about to attack were windmills, not giants"}
        forms:
          - {w: "diciendo", f: "dic- + -iendo → gerund of decir (to say), with the stem vowel e changed to i: 'saying'."}
          - {w: "dio", f: "dar (to give), preterite, he; 'dar de espuelas' = to spur. Irregular: di, diste, dio, dimos, disteis, dieron."}
          - {w: "atender", f: "infinitive (to heed) after 'sin' (without)."}
          - {w: "voces", f: "voz + -es → plural; z becomes c before e."}
          - {w: "le daba", f: "d- + -aba → dar (to give), imperfect, he (Sancho), with 'le' (to him): 'kept giving him'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "advirtiéndole", f: "advirt- + -iendo + le → gerund of advertir (to warn), stem e changed to i, + 'le' (him) on the end; the accent keeps the stress on '-tién-'."}
          - {w: "eran", f: "ser (to be), imperfect, they. ser's imperfect is irregular: era, eras, era, éramos, erais, eran."}
          - {w: "alguna", f: "algun- + -a → alguno, feminine to match 'duda'; after the noun in a negative phrase it means 'at all': 'sin duda alguna'."}
          - {w: "iba a acometer", f: "ib- + -a → ir (to go), imperfect, he, + 'a' + the infinitive acometer (to attack): 'he was about to attack'. ir's imperfect is irregular: iba, ibas, iba, íbamos, ibais, iban."}
      - es: "Pero él iba tan puesto en que eran gigantes, que ni oía las voces de su escudero Sancho ni echaba de ver, aunque estaba ya bien cerca, lo que eran; antes, iba diciendo en voces altas:"
        literal: "But he went so set on that they-were giants, that neither he-heard the shouts of his squire Sancho nor threw of seeing, although he-was already well near, what they-were; rather, he-went saying in voices high:"
        ormsby: "He, however, was so positive they were giants that he neither heard the cries of Sancho, nor perceived, near as he was, what they were, but made at them shouting,"
        vocab:
          - {w: "ir puesto en", d: "to be set on, fixed in the belief that"}
          - {w: "ni ... ni", d: "neither ... nor"}
