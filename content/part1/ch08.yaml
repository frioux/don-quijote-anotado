          - s: "Levantóse"
            r: "main verb 1: rose"
            under:
              - {s: "en esto", r: "when: just then"}
              - {s: "un poco de viento", r: "subject: a little wind"}
          - {s: "las grandes aspas comenzaron a moverse", r: "main clause 2 (after 'y'): the great sails began to move"}
          - s: "dijo:"
            r: "main verb 3: he said"
