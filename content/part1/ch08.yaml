  - sentences:
      - es: "— ¿Yo no caballero? Juro a Dios tan mientes como cristiano."
        literal: "— I not knight? I-swear to God as-much you-lie as Christian."
        ormsby: "“I no gentleman!—I swear to God thou liest as I am Christian:"
        vocab:
          - {w: "¿Yo no caballero?", d: "I, no gentleman? (he leaves out the verb 'soy')"}
          - {w: "juro a Dios", d: "I swear to God"}
          - {w: "tan mientes como cristiano", d: "his broken version of 'mientes, tan cierto como soy cristiano': you lie, as sure as I'm a Christian"}
        diagram:
          - {s: "¿Yo no caballero?", r: "question with no verb: I, not a gentleman?"}
          - s: "Juro a Dios"
            r: "main verb: I swear to God"
            under:
              - {s: "tan mientes como cristiano", r: "what he swears: you lie as surely as [I am a] Christian"}
        forms:
          - {w: "caballero", f: "here 'gentleman', the sense the Biscayan hears."}
          - {w: "Juro", f: "jur- + -o → jurar (to swear), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "mientes", f: "mient- + -es → mentir (to lie), present, you. The stem e becomes ie when stressed: miento, mientes, miente, mentimos, mentís, mienten."}
          - {w: "tan ... como", f: "'as ... as'; he leaves out 'yo soy' before 'cristiano', and 'tan' lands on the wrong word."}
        ormsby_note: "Caballero means 'gentleman' as well as knight, and the peppery Biscayan assumes that Don Quixote has used the word in the former sense."
        note: "Biscayans claimed that every native of Vizcaya was noble by birth, so denying he was a caballero was a deadly insult. 'Cristiano' matters too: Basques prided themselves on being 'old Christians', with no Jewish or Moorish ancestry."
      - es: "Si lanza arrojas y espada sacas, ¡el agua cuán presto verás que al gato llevas!"
        literal: "If lance you-throw and sword you-draw, the water how soon you-will-see that to-the cat you-carry!"
        ormsby: "if thou droppest lance and drawest sword, soon shalt thou see thou art carrying water to the cat:"
        vocab:
          - {w: "arrojar", d: "to throw (down)"}
          - {w: "sacar la espada", d: "to draw one's sword"}
          - {w: "cuán", d: "how (before an adjective or adverb, in exclamations)"}
          - {w: "presto", d: "soon, quickly"}
          - {w: "llevar el gato al agua", d: "to carry the cat to the water: to win a hard struggle, come out on top. He garbles it into 'carry the water to the cat'"}
        diagram:
          - s: "¡el agua cuán presto verás"
            r: "main verb: how soon you'll see"
            under:
              - {s: "Si lanza arrojas y espada sacas", r: "condition: if you throw down your lance and draw your sword"}
              - {s: "que al gato llevas!", r: "what you'll see: that you carry [the water] to the cat; 'el agua' is the object, put first"}
        forms:
          - {w: "arrojas", f: "arroj- + -as → arrojar (to throw down), present, you. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "sacas", f: "sac- + -as → sacar (to draw), present, you. Same -ar present. The objects come before their verbs and lose their articles: 'lanza arrojas' for 'arrojas la lanza'."}
          - {w: "cuán", f: "short for cuánto before an adjective or adverb; accented in an exclamation."}
          - {w: "verás", f: "ver + -ás → ver (to see), future, you. The future is the whole infinitive + -é, -ás, -á, -emos, -éis, -án."}
          - {w: "al gato", f: "a + el: 'to the cat'."}
          - {w: "llevas", f: "llev- + -as → llevar (to carry), present, you. Same -ar present."}
        ormsby_note: "Quien ha de llevar el gato al agua? (Proverb 102.) 'Who will carry the cat to the water?' is a proverbial way of indicating an apparently insuperable difficulty. Between rage and ignorance the Biscayan, it will be seen, inverts the phrase."
      - es: "Vizcaíno por tierra, hidalgo por mar, hidalgo por el diablo; y mientes que mira si otra dices cosa."
        literal: "Biscayan by land, gentleman by sea, gentleman by the devil; and you-lie that look if other you-say thing."
        ormsby: "Biscayan on land, hidalgo at sea, hidalgo at the devil, and look, if thou sayest otherwise thou liest.”"
        vocab:
          - {w: "por tierra, por mar", d: "by land, by sea: every way you look at it"}
          - {w: "hidalgo", d: "gentleman, a member of the minor nobility"}
          - {w: "por el diablo", d: "in spite of the devil, damn it all"}
          - {w: "mira", d: "look! mind! (a warning)"}
          - {w: "otra dices cosa", d: "= dices otra cosa, you say anything else; he splits the phrase around the verb"}
        diagram:
          - {s: "Vizcaíno por tierra, hidalgo por mar, hidalgo por el diablo", r: "statement with no verb: [I am] a Biscayan by land, a gentleman by sea, a gentleman in spite of the devil"}
          - s: "y mientes"
            r: "main verb: and you lie"
            under:
              - {s: "que mira", r: "loose 'que' + command: look"}
              - {s: "si otra dices cosa", r: "condition: if you say anything else"}
        forms:
          - {w: "mientes", f: "mient- + -es → mentir (to lie), present, you. The stem e becomes ie when stressed: miento, mientes, miente, mentimos, mentís, mienten."}
          - {w: "mira", f: "mir- + -a → mirar (to look), command to 'tú', the same as the he/she present: 'look!'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "dices", f: "dic- + -es → decir (to say), present, you: digo, dices, dice, decimos, decís, dicen."}
          - {w: "otra ... cosa", f: "otr- + -a → otro (other), feminine to match 'cosa'; he splits the phrase around the verb. Correct order: 'y mira que mientes si dices otra cosa'."}
        note: "The Biscayan's refrain is 'I am a gentleman whatever you say'. His claim rests on the Basques' collective nobility, and his speech is a jumble of it."
  - sentences:
      - es: "— ¡Ahora lo veredes, dijo Agrajes! —respondió don Quijote."
        literal: "— Now it you-will-see, said Agrajes! —answered Don Quijote."
        ormsby: "“ ‘ “You will see presently,” said Agrajes,’ ” replied Don Quixote;"
        vocab:
          - {w: "veredes", d: "= veréis, you will see (old -edes ending)"}
          - {w: "Agrajes", d: "cousin and companion of Amadís de Gaula; 'Ahora lo veredes, dijo Agrajes' became a proverbial threat"}
        diagram:
          - s: "respondió don Quijote"
            r: "main verb: Don Quijote answered"
            under:
              - {s: "¡Ahora lo veredes, dijo Agrajes!", r: "what he answered: a proverbial threat from the romances, quoted whole, 'said Agrajes' included"}
        forms:
          - {w: "veredes", f: "ver + -edes → ver (to see), future, you (plural or vos), in its medieval form: modern 'veréis'. The future is the whole infinitive + -é, -ás, -á, -emos, -éis (old -edes), -án."}
          - {w: "lo", f: "'it': what is coming to you."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he (Agrajes): dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
        ormsby_note: "Agrajes was the cousin and companion of Amadís of Gaul. The phrase quoted above (Proverb 4) became a popular one, and is introduced as such among others of the same sort by Quevedo in the vision of the 'Visita de los Chistes.' It is hard to say why it should have been fixed on Agrajes, who does not seem to use it as often as others, Amadís himself for instance."
  - sentences:
