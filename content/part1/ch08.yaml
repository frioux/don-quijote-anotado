  - sentences:
      - es: "— La vuestra fermosura, señora mía, puede facer de su persona lo que más le viniere en talante, porque ya la soberbia de vuestros robadores yace por el suelo, derribada por este mi fuerte brazo;"
        literal: "— The your beauty, lady mine, can do with its person what most to-it may-come in desire, because already the pride of your robbers lies along the ground, felled by this my strong arm;"
        ormsby: "“Your beauty, lady mine,” said he, “may now dispose of your person as may be most in accordance with your pleasure, for the pride of your ravishers lies prostrate on the ground through this strong arm of mine;"
        vocab:
          - {w: "la vuestra fermosura", d: "your beauty, the romance formula for addressing a lady; 'fermosura' is hermosura with the old f-, and the article before 'vuestra' is antique"}
          - {w: "facer", d: "= hacer, to do (old f- for h-)"}
          - {w: "venir en talante", d: "to please, suit one's fancy ('talante' = mood, will)"}
          - {w: "soberbia", d: "pride, arrogance"}
          - {w: "robador", d: "robber, abductor"}
          - {w: "yacer", d: "to lie (as the dead or defeated lie)"}
          - {w: "derribar", d: "to knock down, fell"}
        diagram:
          - s: "puede facer de su persona"
            r: "main verb 1: may do with her person"
            under:
              - {s: "La vuestra fermosura", r: "subject: your beauty (i.e. you)"}
              - {s: "señora mía", r: "whom he addresses: my lady"}
              - {s: "lo que más le viniere en talante", r: "object: whatever most pleases her"}
          - s: "porque ya la soberbia de vuestros robadores yace por el suelo"
            r: "why: because the pride of your abductors now lies on the ground"
            under:
              - {s: "derribada por este mi fuerte brazo", r: "describes 'soberbia': felled by this strong arm of mine"}
        forms:
          - {w: "La vuestra", f: "vuestr- + -a → 'your', the possessive of 'vos' (the courtly address to one person), feminine to match 'fermosura'. The article before a possessive ('la vuestra') is archaic."}
          - {w: "fermosura", f: "hermosura with the old initial f-."}
          - {w: "mía", f: "mí- + -a → mío (my), feminine; placed after the noun it is emphatic: 'lady mine'."}
          - {w: "puede", f: "pued- + -e → poder (to be able), present, it (your beauty). The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "facer", f: "the old form of hacer (to do), infinitive after 'puede'."}
          - {w: "su persona", f: "'her person': he speaks to 'your beauty' in the third person, so the possessive is 'su'."}
          - {w: "viniere", f: "vin- + -iere → venir (to come), future subjunctive, it: 'whatever may come'. Built on the preterite vinieron: viniere, vinieres, viniere, viniéremos, viniereis, vinieren. Dead today except in legal language; it marks an open future case."}
          - {w: "vuestros", f: "vuestr- + -os → 'your', masculine plural to match 'robadores'."}
          - {w: "yace", f: "yac- + -e → yacer (to lie), present, it. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (the I form is irregular: yazco or yazgo)."}
          - {w: "derribada", f: "derrib- + -ada → participle of derribar (to fell), feminine to match 'soberbia'."}
          - {w: "este mi", f: "demonstrative + possessive side by side, 'this my', a courtly antique turn."}
      - es: "y, porque no penéis por saber el nombre de vuestro libertador, sabed que yo me llamo don Quijote de la Mancha, caballero andante y aventurero, y cautivo de la sin par y hermosa doña Dulcinea del Toboso;"
        literal: "and, so-that not you-suffer for knowing the name of your liberator, know that I myself call Don Quijote of La Mancha, knight errant and adventurer, and captive of the without equal and beautiful lady Dulcinea of El Toboso;"
        ormsby: "and lest you should be pining to know the name of your deliverer, know that I am called Don Quixote of La Mancha, knight-errant and adventurer, and captive to the peerless and beautiful lady Dulcinea del Toboso:"
        vocab:
          - {w: "porque + subjunctive", d: "so that, in order that"}
          - {w: "penar", d: "to suffer, pine"}
          - {w: "libertador", d: "deliverer, rescuer"}
          - {w: "aventurero", d: "adventurer, seeker of adventures"}
          - {w: "cautivo", d: "captive; the courtly lover is his lady's prisoner"}
          - {w: "sin par", d: "peerless, without equal"}
          - {w: "doña", d: "lady, the title for a woman of rank (feminine of 'don')"}
        diagram:
          - s: "sabed"
            r: "main verb (command): know"
            under:
              - {s: "y, porque no penéis por saber el nombre de vuestro libertador", r: "purpose: so that you do not pine to know your rescuer's name"}
              - s: "que yo me llamo don Quijote de la Mancha"
                r: "what to know: that I am called Don Quijote de la Mancha"
                under:
                  - {s: "caballero andante y aventurero", r: "describes him, 1: knight-errant and adventurer"}
                  - {s: "y cautivo de la sin par y hermosa doña Dulcinea del Toboso", r: "describes him, 2: and captive of the peerless Dulcinea"}
        forms:
          - {w: "penéis", f: "pen- + -éis → penar (to pine), present subjunctive, you (vos). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. 'porque' + subjunctive = so that."}
          - {w: "saber", f: "infinitive (to know) after 'por'."}
          - {w: "vuestro", f: "'your', the possessive of 'vos', masculine to match 'libertador'."}
          - {w: "sabed", f: "sab- + -ed → saber (to know), command to vos / vosotros: the infinitive with -r turned into -d."}
          - {w: "me llamo", f: "llam- + -o → llamarse (to be called), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "andante", f: "and(ar) + -ante → 'wandering'; caballero andante = knight-errant."}
          - {w: "hermosa", f: "hermos- + -a → hermoso (beautiful), feminine to match Dulcinea; here in the modern h- spelling."}
      - es: "y, en pago del beneficio que de mí habéis recebido, no quiero otra cosa sino que volváis al Toboso, y que de mi parte os presentéis ante esta señora y le digáis lo que por vuestra libertad he fecho."
        literal: "and, in payment of-the benefit that from me you-have received, not I-want other thing but that you-return to-the Toboso, and that on my part yourself you-present before this lady and to-her you-tell what for your liberty I-have done."
        ormsby: "and in return for the service you have received of me I ask no more than that you should return to El Toboso, and on my behalf present yourself before that lady and tell her what I have done to set you free.”"
        vocab:
          - {w: "en pago de", d: "in return for"}
          - {w: "beneficio", d: "service, favor done"}
          - {w: "recebir", d: "= recibir, to receive (old spelling)"}
          - {w: "de mi parte", d: "on my behalf"}
          - {w: "presentarse ante", d: "to present oneself before"}
          - {w: "fecho", d: "= hecho, done (old f- for h-)"}
        diagram:
          - s: "no quiero otra cosa"
            r: "main verb: I want nothing else"
            under:
              - s: "y, en pago del beneficio"
                r: "in return for what: the favor"
                under:
                  - {s: "que de mí habéis recebido", r: "describes 'beneficio': that you have received from me"}
              - {s: "sino que volváis al Toboso", r: "except: that you go back to El Toboso"}
              - {s: "y que de mi parte os presentéis ante esta señora", r: "and that you present yourself before this lady on my behalf"}
              - s: "y le digáis"
                r: "and tell her"
                under:
                  - {s: "lo que por vuestra libertad he fecho", r: "what to tell: what I have done to free you"}
        forms:
          - {w: "del", f: "de + el."}
          - {w: "habéis recebido", f: "habéis (haber), present, you (vos), + recebido (old spelling of recibido, participle of recibir, to receive): 'you have received'. haber's present: he, has, ha, hemos, habéis, han."}
          - {w: "quiero", f: "quier- + -o → querer (to want), present, I. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "volváis", f: "volv- + -áis → volver (to return), present subjunctive, you (vos): vuelva, vuelvas, vuelva, volvamos, volváis, vuelvan. Subjunctive after 'quiero que'."}
          - {w: "os presentéis", f: "present- + -éis → presentarse (to present oneself), present subjunctive, you, with 'os'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "le digáis", f: "dig- + -áis → decir (to tell), present subjunctive, you, with 'le' (to her). Built on the irregular 'digo': diga, digas, diga, digamos, digáis, digan."}
          - {w: "he fecho", f: "he (haber), present, I, + fecho, the old form of hecho (participle of hacer, to do): 'I have done'. he, has, ha, hemos, habéis, han."}
        note: "Sending a rescued lady or a beaten enemy to kneel before one's own lady is exactly what knights do in the romances. This lady is heading for Seville, in the opposite direction."
  - sentences:
