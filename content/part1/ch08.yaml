  - sentences:
      - es: "— ¡Válame Dios! —dijo Sancho—. ¿No le dije yo a vuestra merced que mirase bien lo que hacía, que no eran sino molinos de viento, y no lo podía ignorar sino quien llevase otros tales en la cabeza?"
        literal: "— May-God help-me! —said Sancho—. Not to-you told I to your grace that you-should-look well what you-were-doing, that not they-were but mills of wind, and not it could be-unaware-of except who might-carry others such in the head?"
        ormsby: "“God bless me!” said Sancho, “did I not tell your worship to mind what you were about, for they were only windmills? and no one could have made any mistake about it but one who had something of the same kind in his head.”"
        vocab:
          - {w: "¡Válame Dios!", d: "= ¡Válgame Dios!, God help me! (a common exclamation)"}
          - {w: "vuestra merced", d: "'your grace', the polite address; takes 'he/she' verb forms"}
          - {w: "mirar bien lo que hace", d: "to watch what one is doing"}
          - {w: "no ... sino", d: "nothing but, only"}
          - {w: "ignorar", d: "to be unaware of, not know; a false friend, not 'to ignore'"}
          - {w: "otros tales", d: "others like them"}
        diagram:
          - {s: "¡Válame Dios!", r: "exclamation: God help me"}
          - {s: "dijo Sancho", r: "frame"}
          - s: "¿No le dije yo a vuestra merced"
            r: "main verb: didn't I tell your worship"
            under:
              - {s: "que mirase bien lo que hacía", r: "what I told you, 1: to watch what you were doing"}
              - {s: "que no eran sino molinos de viento", r: "what I told you, 2: that they were only windmills"}
              - s: "y no lo podía ignorar"
                r: "what I told you, 3: and no one could miss it"
                under:
                  - {s: "sino quien llevase otros tales en la cabeza", r: "except: someone with others like them in his head"}
        forms:
          - {w: "Válame", f: "val- + -a + me → valer (to help, protect), present subjunctive, he (God), with 'me' on the end: 'may God help me'. A wish uses the present subjunctive. Standard 'válgame' is built on 'valgo': valga, valgas, valga, valgamos, valgáis, valgan; 'válame' is the older, popular form."}
          - {w: "le dije", f: "dij- + -e → decir (to tell), preterite, I, with 'le' (to you: vuestra merced takes 'le'). Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "mirase", f: "mir- + -ase → mirar (to look), imperfect subjunctive (-se form), you (vuestra merced): 'that you should look'. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. Subjunctive because it reports an instruction."}
          - {w: "hacía", f: "hac- + -ía → hacer (to do), imperfect, you. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "eran", f: "ser (to be), imperfect, they: era, eras, era, éramos, erais, eran."}
          - {w: "podía", f: "pod- + -ía → poder (to be able), imperfect, one. Same -ía imperfect."}
          - {w: "llevase", f: "llev- + -ase → llevar (to carry), imperfect subjunctive (-se form), he: 'who might carry'. Same -ase endings. Subjunctive because 'quien' means anyone at all."}
        note: "Sancho's jibe: only someone with windmills in his own head, that is a madman, could have mistaken them."
