  - sentences:
      - es: "— Non fuyades, cobardes y viles criaturas, que un solo caballero es el que os acomete."
        literal: "— Not flee, cowards and vile creatures, for one lone knight is the-one who you attacks."
        ormsby: "“Fly not, cowards and vile beings, for a single knight attacks you.”"
        vocab:
          - {w: "non", d: "archaic 'no', the language of the old romances"}
          - {w: "fuyades", d: "archaic form of 'huyáis', (do not) flee; old f- for h- and old -ades for -áis"}
          - {w: "cobarde", d: "coward"}
          - {w: "vil", d: "base, vile, low-born"}
          - {w: "criatura", d: "creature"}
          - {w: "acometer", d: "to attack, charge"}
        diagram:
          - s: "Non fuyades"
            r: "main verb (negative command): do not flee"
            under:
              - {s: "cobardes y viles criaturas", r: "whom he addresses: cowards and vile creatures"}
              - s: "que un solo caballero es"
                r: "why: for a single knight is"
                under:
                  - {s: "el que os acomete", r: "what he is: the one attacking you"}
        forms:
          - {w: "Non", f: "the old form of 'no'."}
          - {w: "fuyades", f: "fuy- + -ades → huir (to flee), present subjunctive, you (plural), in its medieval form: modern 'no huyáis'. The present subjunctive of huir: huya, huyas, huya, huyamos, huyáis, huyan. A negative command always uses the present subjunctive."}
          - {w: "viles", f: "vil + -es → plural to match 'criaturas'; one form for both genders."}
          - {w: "solo", f: "'single, lone' before the noun (after it, 'alone')."}
          - {w: "el que", f: "'the one who': the article used as a pronoun + 'que'."}
          - {w: "os acomete", f: "acomet- + -e → acometer (to attack), present, he, with 'os' (you, plural) before it. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
        note: "When he speaks as a knight, Don Quijote switches into the fake-medieval Spanish of the romances (non, fuyades), as if a modern man said 'flee ye not'."
