              - s: "un escudero"
                r: "subject: a squire"
                under:
                  - {s: "de los que el coche acompañaban", r: "which one: one of those escorting the coach"}
                  - {s: "que era vizcaíno", r: "describes him: who was a Biscayan"}
        forms:
          - {w: "decía", f: "dec- + -ía → decir (to say), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "escuchaba", f: "escuch- + -aba → escuchar (to listen to), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "acompañaban", f: "acompañ- + -aban → acompañar (to escort), imperfect, they, with the verb put last. Same -aba imperfect."}
          - {w: "era", f: "ser (to be), imperfect, he: era, eras, era, éramos, erais, eran."}
      - es: "el cual, viendo que no quería dejar pasar el coche adelante, sino que decía que luego había de dar la vuelta al Toboso, se fue para don Quijote y, asiéndole de la lanza, le dijo, en mala lengua castellana y peor vizcaína, desta manera:"
        literal: "the which, seeing that not he-wanted to-let pass the coach ahead, but that he-said that at-once it-had to give the turn to-the Toboso, went-himself toward Don Quijote and, seizing-him by the lance, to-him said, in bad tongue Castilian and worse Biscayan, of-this manner:"
        ormsby: "and, perceiving that he would not allow the coach to go on, but was saying it must return at once to El Toboso, he made at him, and seizing his lance addressed him in bad Castilian and worse Biscayan after his fashion,"
        vocab:
          - {w: "el cual", d: "who, which (a weightier relative than 'que')"}
          - {w: "dejar pasar", d: "to let go by, let through"}
          - {w: "adelante", d: "onward, ahead"}
          - {w: "luego", d: "at once (its old meaning; today 'later')"}
          - {w: "dar la vuelta", d: "to turn back"}
          - {w: "irse para", d: "to head for, make for"}
          - {w: "asir de", d: "to seize by, grab by"}
          - {w: "lengua", d: "tongue, language"}
          - {w: "desta", d: "= de esta, of this"}
        diagram:
          - s: "se fue para don Quijote"
            r: "main verb 1: made for Don Quijote"
            under:
              - {s: "el cual", r: "subject: who (the Biscayan)"}
              - s: "viendo que no quería dejar pasar el coche adelante"
                r: "why: seeing he would not let the coach go on"
                under:
                  - {s: "sino que decía que luego había de dar la vuelta al Toboso", r: "but was saying it must turn back at once to El Toboso"}
          - s: "le dijo"
            r: "main verb 2 (after 'y'): said to him"
            under:
              - {s: "asiéndole de la lanza", r: "how: seizing him by the lance"}
              - {s: "en mala lengua castellana y peor vizcaína", r: "how: in bad Castilian and worse Basque"}
              - {s: "desta manera:", r: "how: in this way"}
        forms:
          - {w: "el cual", f: "'who', masculine singular to match the escudero: el cual, la cual, los cuales, las cuales."}
          - {w: "viendo", f: "vi- + -endo → gerund of ver (to see)."}
          - {w: "quería", f: "quer- + -ía → querer (to want), imperfect, he (Don Quijote). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "dejar pasar", f: "dejar (to let) + the infinitive pasar (to pass): 'to let [the coach] go'."}
          - {w: "decía", f: "dec- + -ía → decir (to say), imperfect, he. Same -ía imperfect."}
          - {w: "había de dar", f: "había (haber), imperfect, it, + 'de' + dar (to give; 'dar la vuelta' = to turn back): 'had to turn back'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "se fue", f: "fu- + -e → irse (to go off), preterite, he: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "asiéndole", f: "as- + -iendo + le → gerund of asir (to grab) + 'le' (him), accent added."}
          - {w: "le dijo", f: "dij- + -o → decir, preterite, he, with 'le' (to him): dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "mala ... peor vizcaína", f: "feminine to match 'lengua'; peor (worse) is the comparative of malo."}
          - {w: "desta", f: "de + esta (of this)."}
        ormsby_note: "In the humurous tract The Book of All Things, and Many More, Quevedo mentions as the chief characteristic of the Biscayan dialect that it changes the first person of the verb into the second. This may be observed in the specimen given here: another example of Biscayan will be found in Cervantes' interlude of the Viscaino Fingido."
  - sentences:
      - es: "— Anda, caballero que mal andes; por el Dios que crióme, que, si no dejas coche, así te matas como estás ahí vizcaíno."
        literal: "— Go, knight who badly you-may-go; by the God who created-me, that, if not you-leave coach, so yourself you-kill as you-are there Biscayan."
        ormsby: "“Begone, caballero, and ill go with thee; by the God that made me, unless thou quittest coach, slayest thee as art here a Biscayan.”"
        vocab:
          - {w: "anda", d: "go on! get going! (a brusque command)"}
          - {w: "que mal andes", d: "may you fare badly, bad luck to you (a curse)"}
          - {w: "criar", d: "old: to create (today 'to raise, breed')"}
          - {w: "crióme", d: "= me crió, created me; he hangs the pronoun on the wrong side of the verb"}
          - {w: "dejas coche", d: "= dejas el coche; he drops the article"}
          - {w: "así te matas como estás ahí vizcaíno", d: "his broken version of 'así te mato como estoy aquí vizcaíno': as surely as I'm a Biscayan here, I'll kill you. He swaps 'I' and 'you' throughout"}
        diagram:
          - s: "Anda, caballero"
            r: "main verb 1 (command): go on, knight"
            under:
              - {s: "que mal andes", r: "curse: may you fare badly"}
          - s: "así te matas"
            r: "main verb 2: literally 'you kill yourself'; he means 'I kill you'"
            under:
              - {s: "por el Dios que crióme", r: "oath: by the God who created me"}
              - {s: "si no dejas coche", r: "condition: if you don't leave the coach"}
              - {s: "como estás ahí vizcaíno", r: "as surely as: literally 'as you are there Biscayan'; he means 'as I am here a Biscayan'"}
        forms:
          - {w: "Anda", f: "and- + -a → andar (to go, walk), command to 'tú', the same as the he/she present: 'get going'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "andes", f: "and- + -es → andar (to go), present subjunctive, you: 'may you go [badly]'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. A wish or curse uses the present subjunctive."}
          - {w: "crióme", f: "cri- + -ó + me → criar (old: to create), preterite, he, with 'me' on the end. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. Castilian never hangs a pronoun on a verb after 'que'; correct is 'que me crió'."}
          - {w: "dejas", f: "dej- + -as → dejar (to leave), present, you. Same -ar present: -o, -as, -a, -amos, -áis, -an."}
          - {w: "te matas", f: "mat- + -as → matar (to kill), present, you, with 'te': literally 'you kill yourself'. He means 'te mato' (I kill you): the Biscayan turns 'I' into 'you'."}
          - {w: "estás", f: "estar (to be), present, you: estoy, estás, está, estamos, estáis, están. He means 'estoy' (I am)."}
          - {w: "ahí", f: "'there, where you are'; he means 'aquí' (here, where I am)."}
        note: "The stage Basque of Golden Age comedy swaps 'I' and 'you', drops articles and puts words in the wrong order. What he means is: 'Go, knight, and bad luck go with you; by the God who made me, if you don't leave the coach, I'll kill you as sure as I'm a Biscayan.'"
