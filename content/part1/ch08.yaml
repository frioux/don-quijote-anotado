          - {w: "cubierto", f: "irregular participle of cubrir (to cover), masculine to match Don Quijote."}
          - {w: "arremetió", f: "arremet- + -ió → arremeter (to charge), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "embistió", f: "embist- + -ió → embestir (to ram), preterite, he; the stem e becomes i in the he and they forms: embestí, embestiste, embistió, embestimos, embestisteis, embistieron."}
          - {w: "primero", f: "modern Spanish clips it to 'primer' before a masculine noun; Cervantes often keeps the full form."}
          - {w: "estaba", f: "est- + -aba → estar (to be, of position), imperfect, it. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
