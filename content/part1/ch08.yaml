summary: |
  Don Quijote and Sancho come in sight of thirty or forty windmills on the plain. Don Quijote declares them giants, waves off Sancho's protest that they are mills, and charges the nearest one, commending himself to Dulcinea. A gust turns the sail, which shatters his lance and throws horse and rider across the field. Don Quijote explains that the enchanter Frestón, who stole his library, turned the giants into mills to rob him of the glory.

  On the road to Puerto Lápice he mourns his lance, recalls the knight Diego Pérez de Vargas, who won the name Machuca by clubbing Moors with an oak bough, and makes himself a new lance from a dead branch. He refuses to complain of his bruises, since knights-errant never do; Sancho reserves the right to complain of everything. Sancho eats and drinks happily on his donkey and sleeps soundly, while his master stays awake all night thinking of Dulcinea, as the books require. Near Puerto Lápice Don Quijote warns Sancho never to fight knights on his behalf.

  Two Benedictine monks come along on large mules, followed by a coach carrying a Biscayan lady on her way to Seville. Don Quijote takes the monks for enchanters carrying off a princess and charges; one monk drops off his mule and the other flees. Sancho starts stripping the fallen monk as lawful spoils, and the monks' servants beat him senseless and pull out his beard. Don Quijote tells the lady to go to El Toboso and present herself to Dulcinea.

  One of the lady's squires, a Biscayan who speaks broken Castilian, grabs his lance and challenges him. Don Quijote draws his sword; the Biscayan, stuck on a tired hired mule, takes a cushion from the coach as a shield. The Biscayan lands a great blow on Don Quijote's shoulder, and the two raise their swords for the decisive stroke while the lady and her maids pray to every shrine in Spain. At that moment the narrator breaks off: the author's text ends here, and the 'second author' promises to tell how he found the rest.
context: |
  The windmills. Windmills were new to La Mancha, as Ormsby notes: they had been built only a generation earlier, when the rivers failed as a power source. To a man living in the romances they were strange enough to be giants. The image of the knight tilting at windmills became the emblem of the whole book, and 'luchar contra molinos de viento' is still the Spanish idiom for fighting imaginary enemies.

  Enchanters. Don Quijote's explanation is the one the romances hand him: every hero has a wizard who hates him and changes the look of things. Frestón (Fristón), whom he blamed in Chapter 7 for the vanished library, lets him keep the giants and lose the battle without admitting he was wrong. From here on 'encantadores' can explain away any failure.

  Knights, squires and gentlemen. The rules Don Quijote lays down (a squire may fight commoners but not knights, a knight may not complain of wounds, a knight fasts on memories of his lady) are taken seriously from the romances. 'Caballero' meant both 'knight' and 'gentleman', and the Biscayan takes the second sense. Natives of Vizcaya claimed that all of them were hidalgos by birth, and Basques boasted of being 'old Christians', with no Jewish or Moorish blood. That is why 'Yo no caballero?' and 'tan mientes como cristiano' are his answer to an insult.

  The Biscayan's Spanish. Golden Age comedy had a stock Basque character who spoke broken Castilian. As Ormsby notes, quoting Quevedo, he swaps 'I' for 'you' ('te matas' for 'te mato', 'estás ahí' for 'estoy aquí'), drops articles ('dejas coche'), hangs pronouns in the wrong place ('que crióme') and scrambles set phrases, turning 'llevar el gato al agua' (to win a hard fight) into carrying the water to the cat. Don Quijote answers with 'Ahora lo veredes, dijo Agrajes', a proverbial threat quoted, attribution and all, from the Amadís.

  Monks, travellers and roads. Benedictine monks rode big mules and wore dust masks and parasols on the road; the lady is going to Seville, where all sailings to the Americas left, to join a husband with a post in the Indies. Puerto Lápice was a stopping place on the royal highway from Madrid to Andalusia. Stripping a beaten enemy was an old right of war, and Sancho applies it to a monk's habit; pulling out a man's beard was the worst of insults.

  The narrator's trick. The chapter ends on a cliffhanger in mid-stroke. Ormsby notes that romance writers such as Montalvo broke off in just this way and then 'found' the rest in some archive. Cervantes adds a 'segundo autor' who goes looking for the lost papers. The volume of 1605 was divided into four parts, so the 'second part' promised here begins with the next chapter.

  Reading Cervantes' Spanish. This chapter adds the romance archaisms Don Quijote uses when he speaks as a knight: 'non fuyades' for 'no huyáis', 'fermosura' and 'facer' and 'fecho' with the old f-, 'veredes' with the old -edes ending, and 'la vuestra fermosura' with an article before the possessive. Everyday archaisms continue: mesmo, ansí, ansimesmo, recebir, dellos, desta, deste, and the rustic spellings Sancho and the narrator give him (obedicido, ligítimamente, decendientes, preceto). The future subjunctive appears in open conditions (si vieres, si fueren, lo que tocare, quien quisiere, lo que le viniere), a tense now found only in legal Spanish. Pronouns still hang on the end of a verb that opens its clause (Levantóse, Díjole, Respondióle, hallóla, afligiósele, avínole, preguntáronle), and 'le' is used for 'him' where modern grammar wants 'lo'. The -ra subjunctive often does the work of the conditional (si no se dejara caer, le hiciera venir; le abriera hasta la cintura).
