        diagram:
          - s: "bien entendió por su denuedo su coraje"
            r: "main verb 1: clearly understood his courage from his boldness"
            under:
              - s: "El vizcaíno"
                r: "subject: the Biscayan"
                under:
                  - {s: "que así le vio venir contra él", r: "describes him: who saw him coming at him like that"}
          - {s: "y determinó de hacer lo mesmo que don Quijote", r: "main verb 2: and resolved to do the same as Don Quijote"}
        forms:
