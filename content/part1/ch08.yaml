  - sentences:
      - es: "Pero está el daño de todo esto que en este punto y término deja pendiente el autor desta historia esta batalla, disculpándose que no halló más escrito destas hazañas de don Quijote de las que deja referidas."
        literal: "But is the harm of all this that at this point and end leaves hanging the author of-this history this battle, excusing-himself that not he-found more written of-these deeds of Don Quijote than those that he-leaves related."
        ormsby: "But it spoils all, that at this point and crisis the author of the history leaves this battle impending, giving as excuse that he could find nothing more written about these achievements of Don Quixote than what has been already set forth."
        vocab:
          - {w: "el daño está en que", d: "the trouble is that, what spoils it all is that"}
          - {w: "en este punto y término", d: "at this very point"}
          - {w: "pendiente", d: "hanging, unresolved"}
          - {w: "historia", d: "history and story at once"}
          - {w: "disculparse", d: "to excuse oneself"}
          - {w: "hazaña", d: "feat, exploit"}
          - {w: "dejar referido", d: "to have related, have told"}
        diagram:
          - s: "está el daño de todo esto"
            r: "main verb (after 'Pero'): the trouble with all this is"
            under:
              - s: "que en este punto y término deja pendiente el autor desta historia esta batalla"
                r: "what the trouble is: that the author of this history leaves this battle hanging at this very point"
                under:
                  - s: "disculpándose"
                    r: "how: excusing himself"
                    under:
                      - {s: "que no halló más escrito destas hazañas de don Quijote de las que deja referidas", r: "the excuse: he found nothing more written about these deeds than he has told"}
        forms:
          - {w: "está", f: "estar (to be), present, it: estoy, estás, está, estamos, estáis, están."}
          - {w: "deja", f: "dej- + -a → dejar (to leave), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "desta, destas", f: "de + esta, de + estas (of this, of these)."}
          - {w: "disculpándose", f: "disculp- + -ando + se → gerund of disculparse (to excuse oneself), accent added."}
          - {w: "halló", f: "hall- + -ó → hallar (to find), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "escrito", f: "irregular participle of escribir (to write): 'written'."}
          - {w: "las que", f: "'those that', feminine plural standing for 'hazañas'."}
          - {w: "deja referidas", f: "dejar + referidas (participle of referir, to relate), feminine plural to match 'hazañas': 'has [left] told'."}
        ormsby_note: "The abrupt suspension of the narrative and the reason assigned are in imitation of devices of the chivalry-romance writers. Montalvo, for instance, breaks off in the ninety-eighth chapter of Esplandián, and in the next gives an account of the discovery of the sequel, very much as Cervantes has done here and in the next chapter."
