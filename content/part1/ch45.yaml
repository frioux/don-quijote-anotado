                  - {s: "allí dejara la vida", r: "result: he would have left his life there"}
                  - {s: "antes que don Quijote la presa", r: "when: before Don Quijote let go his grip"}
        forms:
          - {w: "viéndose", f: "gerund of ver (to see) + se (himself), with an accent added to keep the stress: 'seeing himself'."}
          - {w: "tratar", f: "infinitive of tratar (to treat) after 'verse': 'seeing himself treated'. 'de' marks the doer, like English 'by'."}
          - {w: "aquel", f: "'that', masculine singular to match 'villano malandrín'; aquel, aquella, aquellos, aquellas."}
          - {w: "puesta", f: "irregular participle of poner (to put), feminine to match 'la cólera': an absolute participle, 'his anger being put'."}
          - {w: "crujiéndole", f: "gerund of crujir (to creak) + le (to him), accent added: 'the bones creaking on him'. 'le' shows whose bones they are."}
          - {w: "pudo", f: "pud- + -o → poder (to be able), preterite, he. Irregular: pude, pudiste, pudo, pudimos, pudisteis, pudieron."}
          - {w: "asió", f: "as- + -ió → asir (to seize), preterite, he. The preterite of -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "al", f: "a + el: the personal 'a' before a human object ('el cuadrillero'), fused with the article."}
