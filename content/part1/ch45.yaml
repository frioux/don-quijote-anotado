          - s: "el uno sirva de rey Agramante"
            r: "main verb 2 (after 'y'): let the one play King Agramante"
            under:
              - {s: "y el otro de rey Sobrino", r: "and the other King Sobrino"}
          - {s: "pónganos en paz", r: "main verb 3 (after 'y'): make peace among us"}
          - s: "porque por Dios Todopoderoso que es gran bellaquería"
            r: "why: because, by God Almighty, it is a great disgrace"
            under:
              - s: "que tanta gente principal"
                r: "what is a disgrace: that so many people of rank"
                under:
                  - {s: "como aquí estamos", r: "describes 'gente': as we who are here"}
                  - {s: "se mate por causas tan livianas", r: "should kill one another over such trifles"}
        forms:
          - {w: "Venga", f: "veng- + -a → venir (to come), present subjunctive, you (vuestra merced takes the 'he/she' form), used as a polite command. venga, vengas, venga, vengamos, vengáis, vengan."}
          - {w: "sirva", f: "sirv- + -a → servir (to serve), present subjunctive, he ('el uno'), as a command: 'let the one serve as'. The stem e becomes i: sirva, sirvas, sirva, sirvamos, sirváis, sirvan."}
          - {w: "pónganos", f: "pong- + -a + nos → poner (to put), present subjunctive, you (vuestra merced, singular even after two subjects, matching the nearer), as a polite command, with 'nos' (us) stuck on the end. ponga, pongas, ponga, pongamos, pongáis, pongan."}
          - {w: "Todopoderoso", f: "todo (all) + poderoso (powerful, from poder, power, with the suffix -oso): 'Almighty'."}
          - {w: "gran", f: "grande (great) clipped to 'gran' before a singular noun ('bellaquería')."}
          - {w: "tanta", f: "tant- + -a → tanto (so much, so many), feminine singular to match 'gente', a collective noun."}
          - {w: "estamos", f: "est- + -amos → estar (to be), present, we: estoy, estás, está, estamos, estáis, están. 'como aquí estamos' = as (many as) we are here."}
          - {w: "se mate", f: "mat- + -e → matarse (to kill each other), present subjunctive, it ('gente', singular), after 'es gran bellaquería que' (a judgement takes the subjunctive). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "livianas", f: "livian- + -as → liviano (light, trivial), feminine plural to match 'causas'."}
        note: "In Ariosto it is Agramante and Sobrino who settle the quarrels of their champions; Don Quijote casts the judge as the king and the priest as his wise old counsellor."
