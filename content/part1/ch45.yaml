        forms:
          - {w: "cesaban", f: "ces- + -aban → cesar (to cease), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "ayudasen", f: "ayud- + -asen → ayudar (to help), imperfect subjunctive (-se form), they (the bystanders): subjunctive because it reports a request. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "dársele", f: "dar (to give) + se + le: 'to give him to them'. Before 'lo/le' the pronoun 'les' (to them) becomes 'se'; here 'le' is leísmo, used for 'him' (the prisoner) where modern Spanish prefers 'lo': modern 'dárselo'."}
          - {w: "atado y entregado", f: "participles of atar (to tie) and entregar (to hand over), masculine singular to match 'le' (Don Quijote)."}
          - {w: "convenía", f: "conven- + -ía → convenir (to suit, be required), imperfect, it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "cuya", f: "'whose', feminine singular to match 'parte' (the thing owned), not the owner."}
