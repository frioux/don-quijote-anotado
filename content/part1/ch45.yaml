      - es: "Venga, pues, vuestra merced, señor oidor, y vuestra merced, señor cura, y el uno sirva de rey Agramante, y el otro de rey Sobrino, y pónganos en paz; porque por Dios Todopoderoso que es gran bellaquería que tanta gente principal como aquí estamos se mate por causas tan livianas."
        literal: "Come, then, your worship, sir judge, and your worship, sir priest, and the one serve as king Agramante, and the other as king Sobrino, and put-us in peace; because by God Almighty that it-is great knavery that so-much people of-rank as here we-are itself may-kill for causes so light."
        ormsby: "Come then, you, Señor Judge, and you, señor curate; let the one represent King Agramante and the other King Sobrino, and make peace among us; for by God Almighty it is a sorry business that so many persons of quality as we are should slay one another for such trifling cause.”"
