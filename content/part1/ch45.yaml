  - sentences:
      - es: "— Tanto monta —dijo el criado—, que el caso no consiste en eso, sino en si es o no es albarda, como vuestras mercedes dicen."
        literal: "— So-much it-amounts —said the servant—, for the case not consists in that, but in whether it-is or not is packsaddle, as your worships say."
        ormsby: "“It is all the same,” said the servant; “that is not the point; but whether it is or is not a packsaddle, as your worships say.”"
        vocab:
          - {w: "tanto monta", d: "it comes to the same thing, it makes no difference"}
          - {w: "consistir en", d: "to lie in, depend on"}
        diagram:
          - s: "Tanto monta"
            r: "main verb 1: it is all the same"
            under:
              - {s: "dijo el criado", r: "speech tag: said the servant"}
          - s: "que el caso no consiste en eso"
            r: "why (after 'que', for): the point does not lie in that"
            under:
              - s: "sino en si es o no es albarda"
                r: "but in: whether it is or is not a packsaddle"
                under:
                  - {s: "como vuestras mercedes dicen", r: "as your worships say"}
        forms:
          - {w: "monta", f: "mont- + -a → montar (to amount to), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "consiste", f: "consist- + -e → consistir (to consist), present, it. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "dicen", f: "dic- + -en → decir (to say), present, they. decir in the present: digo, dices, dice, decimos, decís, dicen."}
        note: "'Tanto monta' was famous as the motto of the Catholic Monarchs, 'Tanto monta, monta tanto, Isabel como Fernando': it is all one, Isabella or Ferdinand."
  - sentences:
      - es: "Oyendo esto uno de los cuadrilleros que habían entrado, que había oído la pendencia y quistión, lleno de cólera y de enfado, dijo:"
        literal: "Hearing this one of the troopers who had entered, who had heard the quarrel and dispute, full of rage and of annoyance, said:"
        ormsby: "On hearing this one of the newly arrived officers of the Brotherhood, who had been listening to the dispute and controversy, unable to restrain his anger and impatience, exclaimed,"
        vocab:
          - {w: "cuadrillero", d: "officer of the Santa Hermandad, the rural police who hunted highwaymen; they went in 'cuadrillas' (squads)"}
          - {w: "pendencia", d: "quarrel, brawl"}
          - {w: "quistión", d: "= cuestión, dispute, argument (old spelling)"}
          - {w: "cólera", d: "anger, rage"}
          - {w: "enfado", d: "annoyance, irritation"}
        diagram:
          - s: "dijo:"
            r: "main verb: said"
            under:
              - {s: "Oyendo esto", r: "when: hearing this"}
              - s: "uno de los cuadrilleros"
                r: "subject: one of the troopers"
                under:
                  - {s: "que habían entrado", r: "describes 'cuadrilleros': who had come in"}
                  - {s: "que había oído la pendencia y quistión", r: "describes 'uno': who had heard the quarrel and dispute"}
                  - {s: "lleno de cólera y de enfado", r: "describes 'uno': full of anger and annoyance"}
        forms:
          - {w: "Oyendo", f: "gerund of oír (to hear): 'hearing'. The i between vowels becomes y: oyendo."}
          - {w: "habían entrado", f: "hab- + -ían → haber (to have), imperfect, they, + entrado, participle of entrar (to enter): pluperfect, 'had come in'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "había oído", f: "había → haber (to have), imperfect, he (same imperfect: había, habías, había, habíamos, habíais, habían), + oído, participle of oír (to hear): 'had heard'."}
          - {w: "lleno", f: "llen- + -o → lleno (full), masculine to match 'uno'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
        note: "The three travellers who arrived earlier, and who 'looked like cuadrilleros', now come into the action. The Santa Hermandad was the royal rural police that dealt with crimes on the roads."
  - sentences:
      - es: "— Tan albarda es como mi padre; y el que otra cosa ha dicho o dijere debe de estar hecho uva."
        literal: "— As-much packsaddle it-is as my father; and he who other thing has said or may-say must be made grape."
        ormsby: "“It is a packsaddle as sure as my father is my father, and whoever has said or will say anything else must be drunk.”"
        vocab:
          - {w: "tan ... como mi padre", d: "as surely as my father (is my father): a rough way of saying 'as sure as anything'"}
          - {w: "deber de", d: "must (probability): 'debe de estar' = he must be"}
          - {w: "estar hecho uva", d: "to be drunk ('to be turned into a grape'), full of wine"}
