          - {w: "dejara", f: "dej- + -ara → dejar (to leave), imperfect subjunctive (-ra form), he (the officer), used as a conditional: 'he would have left'. The -ra form of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran."}
        note: "The sentence ends with a neat balance: the officer would have let go his life before Don Quijote let go his grip, 'la vida' against 'la presa', with the second verb left out."
