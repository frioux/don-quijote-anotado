  - sentences:
      - es: "— ¡Favor a la Santa Hermandad! Y, para que se vea que lo pido de veras, léase este mandamiento, donde se contiene que se prenda a este salteador de caminos."
        literal: "— Help to the Holy Brotherhood! And, so that it-may-be-seen that it I-ask in earnest, let-be-read this warrant, where it-is-contained that one-should-arrest [to] this robber of roads."
        ormsby: "“Help for the Holy Brotherhood! and that you may see I demand it in earnest, read this warrant which says this highwayman is to be arrested.”"
        vocab:
          - {w: "¡Favor a la Santa Hermandad!", d: "the officers' formal call for aid: 'help in the name of the Holy Brotherhood!'; anyone who heard it was bound by law to assist"}
          - {w: "Santa Hermandad", d: "the Holy Brotherhood, the rural police force of Castile, set up by the Catholic Monarchs to deal with crime on the roads and in open country"}
          - {w: "de veras", d: "in earnest, seriously"}
          - {w: "mandamiento", d: "warrant, written order of arrest (not 'commandment' here)"}
          - {w: "prender", d: "to arrest, seize (not 'to light', which is 'encender' in this sense)"}
          - {w: "salteador de caminos", d: "highwayman, road robber; from 'saltear', to waylay"}
        diagram:
          - s: "¡Favor a la Santa Hermandad!"
            r: "exclamation: the officer's cry for help"
          - s: "léase este mandamiento"
            r: "main verb: let this warrant be read"
            under:
              - s: "para que se vea"
                r: "why: so that it may be seen"
                under:
                  - {s: "que lo pido de veras", r: "what is seen: that I ask for it in earnest"}
              - s: "donde se contiene"
                r: "describes 'mandamiento': where it is written"
                under:
                  - {s: "que se prenda a este salteador de caminos", r: "what is written: that this highwayman is to be arrested"}
        forms:
          - {w: "se vea", f: "ve- + -a → ver (to see), present subjunctive, it, with 'se' making it passive: 'it may be seen'. Subjunctive after 'para que' (so that). ver in the present subjunctive: vea, veas, vea, veamos, veáis, vean."}
          - {w: "pido", f: "pid- + -o → pedir (to ask for), present, I. The stem e becomes i when stressed: pido, pides, pide, pedimos, pedís, piden."}
          - {w: "léase", f: "le- + -a + se → leer (to read), present subjunctive, it, with 'se' stuck on the end: 'let it be read'. leer in the present subjunctive: lea, leas, lea, leamos, leáis, lean. A subjunctive opening a sentence gives a command, and the pronoun must then hang on the end; the 'se' makes it passive."}
          - {w: "este", f: "est- + -e → este (this), masculine singular to match 'mandamiento'; also 'este salteador'."}
          - {w: "se contiene", f: "contien- + -e → contener (to contain), present, it, with 'se': 'it is contained, it is written'. Like tener (to have): contengo, contienes, contiene, contenemos, contenéis, contienen."}
          - {w: "se prenda", f: "prend- + -a → prender (to arrest), present subjunctive, with impersonal 'se': 'that one arrest, that he be arrested'. Subjunctive because it reports an order. The present subjunctive of -er verbs: -a, -as, -a, -amos, -áis, -an. The 'a' before 'este salteador' is the personal 'a' used before a human object."}
        note: "The warrant was issued because Don Quijote freed the chain of galley slaves in chapter 22; Sancho feared then that the Holy Brotherhood would come after them."
  - sentences:
      - es: "Tomó el mandamiento el cura, y vio como era verdad cuanto el cuadrillero decía, y cómo convenía con las señas con don Quijote;"
        literal: "Took the warrant the priest, and saw how was truth all-that the officer said, and how it-agreed with the marks with Don Quijote;"
        ormsby: "The curate took the warrant and saw that what the officer said was true, and that it agreed with Don Quixote’s appearance,"
        vocab:
          - {w: "cuanto", d: "all that, everything that ('cuanto ... decía' = all that he said)"}
          - {w: "cuadrillero", d: "officer of the Holy Brotherhood (they patrolled in 'cuadrillas', squads)"}
          - {w: "convenir con", d: "to agree with, match"}
          - {w: "señas", d: "description, distinguishing marks (in a warrant: height, beard, face)"}
        diagram:
          - s: "Tomó el mandamiento el cura"
            r: "main verb 1: the priest took the warrant"
          - s: "y vio"
            r: "main verb 2: and saw"
            under:
              - s: "como era verdad"
                r: "what he saw, 1: that it was true"
                under:
                  - {s: "cuanto el cuadrillero decía", r: "subject of 'era': all that the officer said"}
              - s: "y cómo convenía"
                r: "what he saw, 2: and how it matched"
                under:
                  - {s: "con las señas con don Quijote", r: "how: the description with Don Quijote"}
        forms:
          - {w: "Tomó", f: "tom- + -ó → tomar (to take), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. The subject 'el cura' comes after the verb and its object."}
          - {w: "vio", f: "vi- + -o → ver (to see), preterite, he. Irregular: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "era", f: "ser (to be), imperfect, it. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "decía", f: "dec- + -ía → decir (to say), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "convenía", f: "conven- + -ía → convenir (to agree), imperfect, it (the warrant). Same -ía imperfect."}
        note: "Officers carried warrants with written descriptions instead of portraits, so the identification depends on matching words to a face, which is what makes the next sentence comic."
      - es: "el cual, viéndose tratar mal de aquel villano malandrín, puesta la cólera en su punto y crujiéndole los huesos de su cuerpo, como mejor pudo él, asió al cuadrillero con entrambas manos de la garganta, que, a no ser socorrido de sus compañeros, allí dejara la vida antes que don Quijote la presa."
        literal: "the which, seeing-himself treated badly by that peasant scoundrel, put the anger at its point and creaking-to-him the bones of his body, as best could he, seized [to] the officer with both hands by the throat, so-that, at not to-be helped by his companions, there he-would-have-left the life before that Don Quijote the grip."
        ormsby: "who, on his part, when he found himself roughly handled by this rascally clown, worked up to the highest pitch of wrath, and all his joints cracking with rage, with both hands seized the officer by the throat with all his might, so that had he not been helped by his comrades he would have yielded up his life ere Don Quixote released his hold."
