          - s: "Tan albarda es como mi padre"
            r: "main verb 1: it is as much a packsaddle as my father (is my father)"
          - s: "debe de estar hecho uva"
            r: "main verb 2 (after 'y'): must be drunk"
            under:
              - {s: "el que otra cosa ha dicho o dijere", r: "subject: whoever has said or shall say otherwise"}
        forms:
          - {w: "ha dicho", f: "ha → haber (to have), present, he: he, has, ha, hemos, habéis, han; + dicho, irregular participle of decir (to say): 'has said'."}
          - {w: "dijere", f: "dij- + -ere → decir (to say), future subjunctive, he: 'whoever shall say'. Built on the preterite dijeron: dijere, dijeres, dijere, dijéremos, dijereis, dijeren. Cervantes uses it after 'el que', 'si', 'donde' for an open future; modern Spanish uses the present subjunctive 'diga'."}
          - {w: "debe", f: "deb- + -e → deber (must), present, he. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "hecho", f: "irregular participle of hacer (to make): 'made, turned into'."}
