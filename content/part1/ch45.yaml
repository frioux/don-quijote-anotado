  - sentences:
      - es: "— El caso es, buen hombre, que ya yo estoy cansado de tomar tantos pareceres, porque veo que a ninguno pregunto lo que deseo saber que no me diga que es disparate el decir que ésta sea albarda de jumento, sino jaez de caballo, y aun de caballo castizo;"
        literal: "— The case is, good man, that already I am tired of taking so-many opinions, because I-see that to none I-ask that which I-desire to-know who not to-me may-say that it-is nonsense the saying that this may-be packsaddle of donkey, but trappings of horse, and even of horse thoroughbred;"
        ormsby: "“The fact is, my good fellow, that I am tired collecting such a number of opinions, for I find that there is not one of whom I ask what I desire to know, who does not tell me that it is absurd to say that this is the packsaddle of an ass, and not the caparison of a horse, nay, of a thoroughbred horse;"
        vocab:
          - {w: "el caso es que", d: "the fact is that"}
          - {w: "buen hombre", d: "my good fellow: a condescending way to address a commoner"}
          - {w: "parecer", d: "as a noun: opinion, view"}
          - {w: "disparate", d: "absurdity, nonsense"}
          - {w: "albarda", d: "packsaddle, the padded saddle of a donkey or mule"}
          - {w: "jumento", d: "donkey, ass"}
          - {w: "jaez", d: "harness, trappings, caparison of a horse (usually rich and ornamented)"}
          - {w: "castizo", d: "of good breed, thoroughbred; today 'pure, authentic'"}
        diagram:
          - s: "El caso es"
            r: "main verb: the fact is"
            under:
              - {s: "buen hombre", r: "addressed to: the barber"}
              - s: "que ya yo estoy cansado de tomar tantos pareceres"
                r: "what the fact is: that I am tired of collecting so many opinions"
                under:
                  - s: "porque veo"
                    r: "why: because I see"
                    under:
                      - s: "que a ninguno pregunto lo que deseo saber"
                        r: "what I see: that there is no one I ask what I want to know"
                        under:
                          - s: "que no me diga"
                            r: "describes 'ninguno': who does not tell me"
                            under:
                              - s: "que es disparate el decir"
                                r: "what they tell me: that it is nonsense to say"
                                under:
                                  - {s: "que ésta sea albarda de jumento", r: "what it is nonsense to say: that this is a donkey's packsaddle"}
                                  - {s: "sino jaez de caballo, y aun de caballo castizo", r: "and not: but a horse's trappings, and a thoroughbred's at that"}
        forms:
          - {w: "estoy cansado", f: "est- + -oy → estar (to be), present, I: estoy, estás, está, estamos, estáis, están; + cansado, participle of cansar (to tire) used as an adjective, masculine to match 'yo': 'I am tired'."}
          - {w: "veo", f: "ve- + -o → ver (to see), present, I. ver in the present: veo, ves, ve, vemos, veis, ven."}
          - {w: "pregunto, deseo", f: "pregunt- + -o → preguntar (to ask) and dese- + -o → desear (to desire), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "diga", f: "dig- + -a → decir (to say), present subjunctive, he: 'who does not tell me'. Subjunctive because 'ninguno' (no one) is not a real person who exists. decir in the present subjunctive: diga, digas, diga, digamos, digáis, digan."}
          - {w: "el decir", f: "infinitive of decir (to say) used as a noun with 'el': 'the saying, to say'."}
          - {w: "sea", f: "ser (to be), present subjunctive, it: subjunctive because the statement is called nonsense. sea, seas, sea, seamos, seáis, sean."}
          - {w: "ésta", f: "est- + -a → este (this), feminine to match the understood 'albarda'; the accent marks it as a pronoun ('this one')."}
        note: "Don Fernando's 'secret ballot' only polled the people in on the joke, so the result is unanimous. He speaks like a judge giving a verdict."
      - es: "y así, habréis de tener paciencia, porque, a vuestro pesar y al de vuestro asno, éste es jaez y no albarda, y vos habéis alegado y probado muy mal de vuestra parte."
        literal: "and so, you-will-have to have patience, because, to your sorrow and to-the [sorrow] of your ass, this is trappings and not packsaddle, and you have pleaded and proved very badly on your part."
        ormsby: "so you must submit, for, in spite of you and your ass, this is a caparison and no packsaddle, and you have stated and proved your case very badly.”"
        vocab:
          - {w: "haber de", d: "must, to have to: 'habréis de tener' = you will have to have"}
          - {w: "a vuestro pesar", d: "in spite of you, to your regret"}
          - {w: "alegar", d: "to plead, allege (a legal term)"}
          - {w: "probar", d: "to prove; here in the legal sense, to prove one's case"}
          - {w: "de vuestra parte", d: "on your side, for your side of the case"}
        diagram:
          - s: "habréis de tener paciencia"
            r: "main verb 1: you will have to be patient"
            under:
              - {s: "y así", r: "linking: and so"}
              - s: "porque"
                r: "why: because"
                under:
                  - {s: "a vuestro pesar y al de vuestro asno", r: "how: in spite of you and your donkey"}
                  - {s: "éste es jaez y no albarda", r: "the reason, 1: this is trappings and not a packsaddle"}
                  - {s: "y vos habéis alegado y probado muy mal de vuestra parte", r: "the reason, 2: and you have pleaded and proved your side very badly"}
        forms:
          - {w: "habréis", f: "habr- + -éis → haber (to have), future, you (vosotros, but here said politely to one man, 'vos'). haber in the future: habré, habrás, habrá, habremos, habréis, habrán. 'haber de' + infinitive = must."}
          - {w: "al", f: "a + el, here 'el' standing for 'el pesar': 'and to that (the sorrow) of your ass'."}
          - {w: "vuestro", f: "the possessive of 'vos': Don Fernando addresses the barber as 'vos', the familiar-to-condescending form used to an inferior."}
          - {w: "éste", f: "este (this), masculine to match 'jaez'; the accent marks it as a pronoun."}
          - {w: "habéis alegado, probado", f: "hab- + -éis → haber (to have), present, you (vos), + the participles of alegar (to plead) and probar (to prove): the present perfect, 'you have pleaded and proved'. haber in the present: he, has, ha, hemos, habéis, han."}
        note: "Don Fernando parodies the language of a law court: 'alegar y probar' (to plead and prove) is the formula for a party's case before a judge."
  - sentences:
      - es: "— No la tenga yo en el cielo —dijo el sobrebarbero— si todos vuestras mercedes no se engañan, y que así parezca mi ánima ante Dios como ella me parece a mí albarda, y no jaez; pero allá van leyes..., etcétera; y no digo más;"
        literal: "— Not it may-have I in the heaven —said the over-barber— if all your worships not themselves deceive, and that so may-appear my soul before God as it to-me appears to me packsaddle, and not trappings; but there go laws..., etcetera; and not I-say more;"
        ormsby: "“May I never share heaven,” said the poor barber, “if your worships are not all mistaken; and may my soul appear before God as that appears to me a packsaddle and not a caparison; but, ‘laws go,’—I say no more;"
        ormsby_note: "Proverb 204. \"Laws go as kings like:\" a very old proverb, said to owe its origin to the summary manner in which Alfonso VI at Toledo settled the question as to which of the rival rituals, the French or the Musarabic, was to be adopted. It was agreed to try them by the test of fire, and the latter came out victorious, on which the king, who favored the other, flung it back into the flames."
        vocab:
          - {w: "no la tenga yo en el cielo", d: "may I never have it (my place, my share) in heaven: an oath, 'la' is an understood 'parte' or 'gloria'"}
          - {w: "sobrebarbero", d: "'the over-barber, the extra barber': Cervantes' joke name for the second barber"}
          - {w: "engañarse", d: "to be mistaken, deceive oneself"}
          - {w: "ánima", d: "soul (old and church form of 'alma')"}
          - {w: "allá van leyes ...", d: "the proverb 'allá van leyes do quieren reyes': laws go where kings want them, i.e. the powerful decide"}
        diagram:
          - s: "No la tenga yo en el cielo"
            r: "main verb 1 (an oath): may I not have my place in heaven"
            under:
              - {s: "dijo el sobrebarbero", r: "speech tag: said the other barber"}
              - {s: "si todos vuestras mercedes no se engañan", r: "condition: if you are not all mistaken"}
          - s: "y que así parezca mi ánima ante Dios"
            r: "main verb 2 (a wish): and may my soul appear before God just so"
            under:
              - {s: "como ella me parece a mí albarda, y no jaez", r: "how: as surely as it looks to me like a packsaddle, not trappings"}
          - {s: "pero allá van leyes..., etcétera", r: "main clause 3: but 'there go laws', etc. (the proverb cut short)"}
          - {s: "y no digo más", r: "main verb 4: and I say no more"}
        forms:
          - {w: "tenga", f: "teng- + -a → tener (to have), present subjunctive, I: a wish or oath, 'may I (not) have'. tener in the present subjunctive: tenga, tengas, tenga, tengamos, tengáis, tengan."}
          - {w: "se engañan", f: "engañ- + -an → engañarse (to be mistaken), present, they (your worships), with 'se' (themselves). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "todos vuestras mercedes", f: "'todos' is masculine because it means the men present, though 'vuestras mercedes' is grammatically feminine: agreement by sense."}
          - {w: "parezca", f: "parezc- + -a → parecer (to appear), present subjunctive, it (my soul): 'may it appear'. parecer adds -zc- before a and o: parezca, parezcas, parezca, parezcamos, parezcáis, parezcan."}
          - {w: "parece", f: "parec- + -e → parecer (to seem), present, it: 'it seems (to me)'. parezco, pareces, parece, parecemos, parecéis, parecen."}
          - {w: "van", f: "v- + -an → ir (to go), present, they (the laws). ir in the present: voy, vas, va, vamos, vais, van."}
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. decir in the present: digo, dices, dice, decimos, decís, dicen."}
        note: "The full proverb is 'allá van leyes do quieren reyes': the barber means that the powerful will have their way whatever the truth. He breaks off with 'etcétera' because finishing it would be insulting."
      - es: "y en verdad que no estoy borracho: que no me he desayunado, si de pecar no."
