        note: "In canto 27 of Ariosto's Orlando Furioso the Saracen champions in Agramante's camp quarrel all at once over a sword, a horse, a shield-device and a lady, until King Agramante and old King Sobrino make peace. Don Quijote sees the inn's brawl as the same scene."
