part: 1
chapter: 45
title_es: "Capítulo XLV. Donde se acaba de averiguar la duda del yelmo de Mambrino y de la albarda, y otras aventuras sucedidas, con toda verdad"
title_en: "In which the doubtful question of Mambrino’s helmet and the packsaddle is finally settled, with other adventures that occurred in truth and earnest"
paragraphs:
  - sentences:
      - es: "— ¿Qué les parece a vuestras mercedes, señores —dijo el barbero—, de lo que afirman estos gentiles hombres, pues aún porfían que ésta no es bacía, sino yelmo?"
        literal: "— What to-you seems to your graces, sirs —said the barber—, of that which affirm these gentle men, since still they-insist that this not is basin, but helmet?"
        ormsby: "“What do you think now, gentlemen,” said the barber, “of what these gentles say, when they want to make out that this is a helmet?”"
        vocab:
          - {w: "¿qué les parece?", d: "what do you think? (literally 'what does it seem to you?')"}
          - {w: "vuestras mercedes", d: "your worships, your graces: the polite 'you' (plural), taking a 'they' verb; it became modern 'ustedes'"}
          - {w: "gentiles hombres", d: "gentlemen (modern 'gentilhombres'); said here with some irony"}
          - {w: "porfiar", d: "to insist stubbornly, keep on arguing"}
          - {w: "bacía", d: "barber's basin, a shallow brass bowl with a notch cut in the rim for the customer's neck"}
          - {w: "yelmo", d: "helmet (of a knight), a closed helmet; Don Quijote takes the basin for the enchanted helmet of Mambrino"}
        diagram:
          - s: "¿Qué les parece"
            r: "main verb: what does it seem to you"
            under:
              - {s: "a vuestras mercedes, señores", r: "to whom: to your worships, gentlemen"}
              - {s: "—dijo el barbero—", r: "aside: said the barber"}
              - s: "de lo"
                r: "about what: about that"
                under:
                  - {s: "que afirman estos gentiles hombres", r: "describes 'lo': which these gentlemen claim"}
              - s: "pues aún porfían"
                r: "why I ask: since they still insist"
                under:
                  - {s: "que ésta no es bacía, sino yelmo", r: "what they insist: that this is not a basin but a helmet"}
        forms:
          - {w: "parece", f: "parec- + -e → parecer (to seem), present, it: 'it seems'. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (first person 'parezco', with z added)."}
          - {w: "les", f: "'to you' (plural), the indirect object pronoun that goes with 'vuestras mercedes', which takes 'they' forms; repeated by 'a vuestras mercedes'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "afirman", f: "afirm- + -an → afirmar (to affirm), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "porfían", f: "porfí- + -an → porfiar (to insist), present, they; the i takes an accent when stressed. porfío, porfías, porfía, porfiamos, porfiáis, porfían."}
          - {w: "estos", f: "est- + -os → este (this), masculine plural to match 'gentiles hombres'."}
          - {w: "ésta", f: "'this one', feminine to match 'bacía'; the accent marks it as a pronoun standing alone (old spelling rule)."}
          - {w: "es", f: "es- → ser (to be), present, it. Irregular: soy, eres, es, somos, sois, son."}
        note: "The quarrel goes back to chapter 21, when Don Quijote took this barber's brass basin from him on the road, believing it to be the golden helmet of Mambrino, and Sancho swapped packsaddles with the barber's ass. Now the barber has turned up at the inn and wants his things back."
  - sentences:
      - es: "— Y quien lo contrario dijere —dijo don Quijote—, le haré yo conocer que miente, si fuere caballero, y si escudero, que remiente mil veces."
        literal: "— And who the contrary may-say —said Don Quijote—, to-him I-will-make I know that he-lies, if he-be knight, and if squire, that he-re-lies a-thousand times."
        ormsby: "“And whoever says the contrary,” said Don Quixote, “I will let him know he lies if he is a knight, and if he is a squire that he lies again a thousand times.”"
        vocab:
          - {w: "lo contrario", d: "the opposite, the contrary"}
          - {w: "hacer conocer", d: "to make (someone) know, prove to him"}
          - {w: "mentir", d: "to lie; 'mentir' was the gravest insult, the formula for a challenge to a duel"}
          - {w: "rementir", d: "to lie again, lie twice over: a word Don Quijote coins with 're-' for the lesser man"}
          - {w: "escudero", d: "squire, a knight's attendant"}
        diagram:
          - s: "le haré yo conocer"
            r: "main verb: I will make him know"
            under:
              - {s: "Y quien lo contrario dijere", r: "whom: whoever says the opposite (picked up again by 'le')"}
              - {s: "—dijo don Quijote—", r: "aside: said Don Quijote"}
              - s: "que miente"
                r: "what he will know, 1: that he lies"
                under:
                  - {s: "si fuere caballero", r: "condition: if he is a knight"}
              - s: "y si escudero"
                r: "condition 2: and if a squire"
                under:
                  - {s: "que remiente mil veces", r: "what he will know, 2: that he lies a thousand times over"}
        forms:
          - {w: "dijere", f: "dij- + -ere → decir (to say), future subjunctive, he: 'whoever may say'. Built on the preterite dijeron: dijere, dijeres, dijere, dijéremos, dijereis, dijeren. Cervantes uses it after 'quien', 'si', 'lo que' for an open future; modern Spanish uses the present subjunctive 'diga'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "le", f: "'to him', picking up 'quien lo contrario dijere' that opens the sentence: Spanish repeats the person with a pronoun."}
          - {w: "haré", f: "har- + -é → hacer (to make), future, I. Irregular stem har-: haré, harás, hará, haremos, haréis, harán. 'hacer conocer' = to make (him) know."}
          - {w: "miente, remiente", f: "mient- + -e → mentir (to lie) and rementir (to lie again), present, he. The stem e becomes ie when stressed: miento, mientes, miente, mentimos, mentís, mienten."}
          - {w: "fuere", f: "fu- + -ere → ser (to be), future subjunctive, he: 'if he be'. fuere, fueres, fuere, fuéremos, fuereis, fueren; modern Spanish says 'si es'."}
        note: "To give someone 'the lie' was the formal insult that demanded a duel between gentlemen. A squire is not worth a duel, so Don Quijote, by the logic of rank, makes his lie worse instead: he lies 'a thousand times'."
  - sentences:
      - es: "Nuestro barbero, que a todo estaba presente, como tenía tan bien conocido el humor de don Quijote, quiso esforzar su desatino y llevar adelante la burla para que todos riesen, y dijo, hablando con el otro barbero:"
        literal: "Our barber, who at all was present, as he-had so well known the humour of Don Quijote, wanted to-strengthen his folly and to-carry forward the joke so-that all might-laugh, and he-said, speaking with the other barber:"
        ormsby: "Our own barber, who was present at all this, and understood Don Quixote’s humour so thoroughly, took it into his head to back up his delusion and carry on the joke for the general amusement; so addressing the other barber he said:"
        vocab:
          - {w: "nuestro barbero", d: "our barber: Master Nicolás, the barber of Don Quijote's village, who came with the priest to bring him home"}
          - {w: "tener conocido", d: "to know well, have found out ('tener' + participle stresses a state reached)"}
          - {w: "humor", d: "temperament, the bent of his mind (from the four humours), here his madness; not 'humour' as in jokes"}
          - {w: "esforzar", d: "to strengthen, encourage, back up"}
          - {w: "desatino", d: "folly, nonsense, madness"}
          - {w: "llevar adelante", d: "to carry on, keep going"}
          - {w: "burla", d: "joke, trick, hoax"}
        diagram:
          - s: "quiso esforzar su desatino y llevar adelante la burla"
            r: "main verb 1: wanted to back up his folly and carry on the joke"
            under:
              - s: "Nuestro barbero"
                r: "subject: our barber"
                under:
                  - {s: "que a todo estaba presente", r: "describes 'barbero': who was there for all of it"}
              - {s: "como tenía tan bien conocido el humor de don Quijote", r: "why: since he knew Don Quijote's madness so well"}
              - {s: "para que todos riesen", r: "purpose: so that everyone would laugh"}
          - s: "y dijo"
            r: "main verb 2: and said"
            under:
              - {s: "hablando con el otro barbero:", r: "how: speaking to the other barber"}
        forms:
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "conocido", f: "conoc- + -ido → conocer (to know), participle after 'tenía', agreeing with 'humor': 'had (it) well known'."}
          - {w: "quiso", f: "quis- + -o → querer (to want), preterite, he. Irregular: quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "riesen", f: "ri- + -esen → reír (to laugh), imperfect subjunctive (-se form), they, after 'para que' (so that). riese, rieses, riese, riésemos, rieseis, riesen."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "hablando", f: "habl- + -ando → hablar (to speak), gerund: 'speaking'."}
  - sentences:
      - es: "— Señor barbero, o quien sois, sabed que yo también soy de vuestro oficio, y tengo más ha de veinte años carta de examen, y conozco muy bien de todos los instrumentos de la barbería, sin que le falte uno;"
        literal: "— Sir barber, or whoever you-are, know that I also am of your trade, and I-have more [than] it-has of twenty years letter of examination, and I-know very well of all the instruments of the barbering, without that to-it may-be-lacking one;"
        ormsby: "“Señor barber, or whatever you are, you must know that I belong to your profession too, and have had a licence to practise for more than twenty years, and I know the implements of the barber craft, every one of them, perfectly well;"
        vocab:
          - {w: "o quien sois", d: "or whoever you are"}
          - {w: "oficio", d: "trade, craft"}
          - {w: "más ha de veinte años", d: "for more than twenty years; 'ha' = hace (ago, for)"}
          - {w: "carta de examen", d: "certificate of examination, a licence to practise a trade (barbers, who also bled and pulled teeth, had to pass an exam)"}
          - {w: "conocer de", d: "to be expert in, know about"}
          - {w: "barbería", d: "the barber's craft (also the shop)"}
          - {w: "sin que le falte uno", d: "without missing a single one"}
        diagram:
          - s: "sabed"
            r: "main verb: know! (said to the other barber)"
            under:
              - {s: "Señor barbero, o quien sois", r: "addressed: master barber, or whoever you are"}
              - {s: "que yo también soy de vuestro oficio", r: "what to know, 1: that I too am of your trade"}
              - s: "y tengo"
                r: "what to know, 2: and I have"
                under:
                  - {s: "más ha de veinte años", r: "how long: for over twenty years"}
                  - {s: "carta de examen", r: "object: a trade licence"}
              - s: "y conozco muy bien de todos los instrumentos de la barbería"
                r: "what to know, 3: and I know all the barber's tools well"
                under:
                  - {s: "sin que le falte uno", r: "how: without missing one"}
        forms:
          - {w: "sois", f: "so- + -is → ser (to be), present, you (vos, one person addressed politely as 'ye'). soy, eres, es, somos, sois, son."}
          - {w: "sabed", f: "sab- + -ed → saber (to know), imperative, you (vos): 'know!'. The vos/vosotros imperative swaps the final -r of the infinitive for -d: hablad, sabed, decid."}
          - {w: "soy", f: "ser (to be), present, I. soy, eres, es, somos, sois, son."}
          - {w: "vuestro", f: "'your', the possessive that goes with vos; masculine to match 'oficio'."}
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "ha", f: "= hace, 'ago, for (a time)': the old use of haber (to have) for elapsed time; 'ha' is its present, it: he, has, ha, hemos, habéis, han."}
          - {w: "conozco", f: "conozc- + -o → conocer (to know), present, I; a z is added before c: conozco, conoces, conoce, conocemos, conocéis, conocen."}
          - {w: "falte", f: "falt- + -e → faltar (to be missing), present subjunctive, it, after 'sin que' (without). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
        note: "Master Nicolás speaks to the stranger with 'vos' and 'vuestro', the familiar-to-equal form, not the deferential 'vuestra merced'. Barbers in Cervantes' Spain also bled, cupped and drew teeth, and were examined and licensed for it."
      - es: "y ni más ni menos fui un tiempo en mi mocedad soldado, y sé también qué es yelmo, y qué es morrión, y celada de encaje, y otras cosas tocantes a la milicia, digo, a los géneros de armas de los soldados;"
        literal: "and neither more nor less I-was a time in my youth soldier, and I-know also what is helmet, and what is morion, and sallet of fitting, and other things touching to the soldiery, I-say, to the kinds of arms of the soldiers;"
        ormsby: "and I was likewise a soldier for some time in the days of my youth, and I know also what a helmet is, and a morion, and a headpiece with a visor, and other things pertaining to soldiering, I meant to say to soldiers’ arms;"
        vocab:
          - {w: "ni más ni menos", d: "likewise, just the same"}
          - {w: "mocedad", d: "youth (literary; from 'mozo', young man)"}
          - {w: "morrión", d: "morion, an open infantry helmet with a crest and upturned brim"}
          - {w: "celada de encaje", d: "a sallet (helmet) that fits into the gorget or breastplate; 'encaje' = fitting, socket"}
          - {w: "tocante a", d: "touching on, concerning"}
          - {w: "milicia", d: "soldiering, the military art (not 'militia')"}
          - {w: "digo", d: "I mean, that is to say (self-correction)"}
          - {w: "géneros", d: "kinds, sorts"}
        diagram:
          - s: "fui un tiempo en mi mocedad soldado"
            r: "main verb 1: I was a soldier for a time in my youth"
            under:
              - {s: "y ni más ni menos", r: "linking: and likewise"}
          - s: "y sé también"
            r: "main verb 2: and I also know"
            under:
              - {s: "qué es yelmo, y qué es morrión, y celada de encaje", r: "what I know: what a helmet is, a morion, a fitted sallet"}
              - s: "y otras cosas"
                r: "what I know, 2: and other things"
                under:
                  - {s: "tocantes a la milicia", r: "describes 'cosas': concerning soldiering"}
                  - {s: "digo, a los géneros de armas de los soldados", r: "correction: I mean, the kinds of soldiers' arms"}
        forms:
          - {w: "fui", f: "fu- + -i → ser (to be), preterite, I. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron (the same forms serve for ir, to go)."}
          - {w: "sé", f: "saber (to know), present, I, with the accent to tell it from 'se'. sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "tocantes", f: "toc- + -ante + -s → tocar (to touch), present participle used as an adjective ('touching, concerning'), plural to match 'cosas'."}
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
        note: "The barber's correction is a small joke: 'milicia' could suggest he knows the whole art of war, so he narrows it down to the kinds of arms, which is all he needs to rule on a helmet."
      - es: "y digo, salvo mejor parecer, remitiéndome siempre al mejor entendimiento, que esta pieza que está aquí delante y que este buen señor tiene en las manos, no sólo no es bacía de barbero, pero está tan lejos de serlo como está lejos lo blanco de lo negro y la verdad de la mentira;"
        literal: "and I-say, saving better opinion, referring-myself always to-the better understanding, that this piece which is here in-front and which this good gentleman holds in the hands, not only not is basin of barber, but is so far from being-it as is far the white from the black and the truth from the lie;"
        ormsby: "and I say, saving better opinions and always with submission to sounder judgments, that this piece we have now before us, which this worthy gentleman has in his hands, not only is no barber’s basin, but is as far from being one as white is from black, and truth from falsehood;"
        vocab:
          - {w: "salvo mejor parecer", d: "saving a better opinion, with all due respect (a lawyer's formula)"}
          - {w: "remitirse a", d: "to defer to, submit to"}
          - {w: "entendimiento", d: "understanding, judgment"}
          - {w: "pieza", d: "piece, object, item"}
          - {w: "no sólo ... pero", d: "not only ... but (modern 'sino')"}
          - {w: "lo blanco de lo negro", d: "white from black: 'lo' + adjective makes an abstract noun"}
        diagram:
          - s: "y digo"
            r: "main verb: and I say"
            under:
              - {s: "salvo mejor parecer", r: "hedge: with all respect to better opinions"}
              - {s: "remitiéndome siempre al mejor entendimiento", r: "hedge 2: always deferring to sounder judgment"}
              - s: "que esta pieza"
                r: "what I say: that this object"
                under:
                  - {s: "que está aquí delante", r: "describes 'pieza', 1: which is here in front"}
                  - {s: "y que este buen señor tiene en las manos", r: "describes 'pieza', 2: which this good gentleman has in his hands"}
                  - {s: "no sólo no es bacía de barbero", r: "what is said of it, 1: not only is not a barber's basin"}
                  - s: "pero está tan lejos de serlo"
                    r: "what is said of it, 2: but is as far from being one"
                    under:
                      - {s: "como está lejos lo blanco de lo negro y la verdad de la mentira", r: "comparison: as white is from black, and truth from lies"}
        forms:
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "remitiéndome", f: "remit- + -iendo + me → remitirse (to defer), gerund with 'me' (myself) on the end; the accent is added to keep the stress."}
          - {w: "al", f: "a + el, the contraction modern Spanish still makes."}
          - {w: "está", f: "est- + -á → estar (to be), present, it. estoy, estás, está, estamos, estáis, están."}
          - {w: "tiene", f: "tien- + -e → tener (to hold), present, he. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "buen", f: "bueno (good) clipped before a masculine singular noun ('señor'), like un, gran, algún."}
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "serlo", f: "ser (to be) + lo ('it', standing for 'bacía de barbero'), infinitive after 'de': 'from being one'."}
        note: "The barber parodies legal and academic hedging ('saving better opinion') to make his absurd verdict sound weighty. The joke for the reader: he is the man who knows best that it is a basin."
      - es: "también digo que éste, aunque es yelmo, no es yelmo entero."
        literal: "also I-say that this-one, although it-is helmet, not is helmet whole."
        ormsby: "I say, moreover, that this, although it is a helmet, is not a complete helmet.”"
        vocab:
          - {w: "entero", d: "whole, complete"}
        diagram:
          - s: "también digo"
            r: "main verb: I also say"
            under:
              - s: "que éste"
                r: "what I say: that this one"
                under:
                  - {s: "aunque es yelmo", r: "concession: though it is a helmet"}
                  - {s: "no es yelmo entero", r: "what is said: is not a complete helmet"}
        forms:
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "éste", f: "'this one', masculine now, because he is thinking of it as 'yelmo'; the accent marks the pronoun."}
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "entero", f: "masculine to match 'yelmo'."}
  - sentences:
      - es: "— No, por cierto —dijo don Quijote—, porque le falta la mitad, que es la babera."
        literal: "— No, for certain —said Don Quijote—, because to-it is-lacking the half, which is the beaver."
        ormsby: "“Certainly not,” said Don Quixote, “for half of it is wanting, that is to say the beaver.”"
        vocab:
          - {w: "por cierto", d: "certainly, to be sure (not 'by the way', its usual modern sense)"}
          - {w: "faltar", d: "to be missing, be lacking: 'le falta' = it lacks"}
          - {w: "babera", d: "beaver: the piece of armour covering the chin and mouth, below the visor"}
        diagram:
          - s: "No, por cierto"
            r: "main answer: certainly not"
            under:
              - {s: "—dijo don Quijote—", r: "aside: said Don Quijote"}
              - s: "porque le falta la mitad"
                r: "why: because half of it is missing"
                under:
                  - {s: "que es la babera", r: "describes 'mitad': which is the beaver"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "le falta", f: "falt- + -a → faltar (to be missing), present, it, with 'le' (to it, the helmet): 'it is missing half'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. The thing missing ('la mitad') is the subject."}
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
        note: "Don Quijote explained the basin's shape in chapter 21: some heathen who did not know its worth melted down half the gold helmet and made the rest into something like a barber's basin."
  - sentences:
      - es: "— Así es —dijo el cura, que ya había entendido la intención de su amigo el barbero."
        literal: "— So it-is —said the priest, who already had understood the intention of his friend the barber."
        ormsby: "“It is quite true,” said the curate, who saw the object of his friend the barber;"
        vocab:
          - {w: "así es", d: "that's so, quite right"}
          - {w: "cura", d: "parish priest (Ormsby's 'curate'): Pero Pérez, the priest of Don Quijote's village"}
          - {w: "intención", d: "intention, purpose, what he was up to"}
        diagram:
          - s: "Así es"
            r: "main verb: so it is"
            under:
              - s: "—dijo el cura"
                r: "aside: said the priest"
                under:
                  - {s: "que ya había entendido la intención de su amigo el barbero", r: "describes 'cura': who had already caught what his friend the barber was up to"}
        forms:
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
