          - {w: "contraria", f: "contrari- + -a → contrario (contrary), feminine to match 'cosa'."}
      - es: "porque, ¡voto a tal! —y arrojóle redondo—, que no me den a mí a entender cuantos hoy viven en el mundo al revés de que ésta no sea bacía de barbero y ésta albarda de asno."
        literal: "because, I-vow to such! —and he-hurled-it round—, that not to-me may-give to me to understand as-many-as today live in the world the reverse of that this not may-be basin of barber and this packsaddle of ass."
        ormsby: "for I swear by”—and here he rapped out a round oath—“all the people in the world will not make me believe that this is not a barber’s basin and that a jackass’s packsaddle.”"
        vocab:
          - {w: "¡voto a tal!", d: "'I swear by ...!': 'tal' (such-and-such) replaces the name of God or a saint, a polite blank for an oath"}
          - {w: "arrojarlo redondo", d: "to hurl it out whole, i.e. to say the oath in full: the narrator prints 'tal' but tells us he swore the real word"}
          - {w: "dar a entender", d: "to make (someone) believe"}
          - {w: "al revés de", d: "the opposite of"}
        diagram:
          - s: "porque"
            r: "why: for (giving his reason)"
            under:
              - {s: "¡voto a tal!", r: "oath: I swear by ...!"}
              - {s: "y arrojóle redondo", r: "narrator's aside: and he swore it out in full"}
              - s: "que no me den a mí a entender"
                r: "main verb: that they shall not make me believe"
                under:
                  - {s: "cuantos hoy viven en el mundo", r: "subject: all those alive in the world today"}
                  - {s: "al revés de que ésta no sea bacía de barbero y ésta albarda de asno", r: "object: the opposite of (the fact) that this is a barber's basin and this an ass's packsaddle"}
        forms:
          - {w: "voto", f: "vot- + -o → votar (to vow, swear), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "arrojóle", f: "arroj- + -ó + le → arrojar (to hurl), preterite, he, with 'le' (it, the oath) stuck on the end; modern 'lo arrojó'. 'le' for a thing is leísmo, common in Cervantes. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. Cervantes hangs the pronoun on a verb that opens its clause."}
          - {w: "den", f: "d- + -en → dar (to give), present subjunctive, they: 'que no me den a entender' = may they not make me believe. dar in the present subjunctive: dé, des, dé, demos, deis, den."}
          - {w: "viven", f: "viv- + -en → vivir (to live), present, they. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "no sea", f: "sea → ser (to be), present subjunctive, it: sea, seas, sea, seamos, seáis, sean. The 'no' is a redundant negative after 'al revés de que': the sense is 'that this is a basin'."}
        note: "Printers and polite narrators replaced blasphemous oaths with 'tal'; here the narrator tells us the man actually 'hurled it out round', that is, swore the full oath."
  - sentences:
      - es: "— Bien podría ser de borrica —dijo el cura."
        literal: "— Well it-could be of she-ass —said the priest."
        ormsby: "“It might easily be a she-ass’s,” observed the curate."
        vocab:
          - {w: "borrica", d: "she-ass, female donkey"}
        diagram:
          - s: "Bien podría ser de borrica"
            r: "main verb: it could well be a she-ass's"
            under:
              - {s: "dijo el cura", r: "speech tag: said the priest"}
        forms:
          - {w: "podría", f: "podr- + -ía → poder (to be able), conditional, it: 'it could'. Irregular stem podr-: podría, podrías, podría, podríamos, podríais, podrían."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
