      - es: "Y, en la mitad deste caos, máquina y laberinto de cosas, se le representó en la memoria de don Quijote que se veía metido de hoz y de coz en la discordia del campo de Agramante; y así dijo, con voz que atronaba la venta:"
        literal: "And, in the middle of-this chaos, machine and labyrinth of things, itself to-him presented in the memory of Don Quijote that himself he-saw put by sickle and by kick in the discord of-the camp of Agramante; and so he-said, with voice that was-thundering the inn:"
        ormsby: "and in the midst of all this chaos, complication, and general entanglement, Don Quixote took it into his head that he had been plunged into the thick of the discord of Agramante’s camp; and, in a voice that shook the inn like thunder, he cried out:"
        ormsby_note: "V Orlando Furioso, canto xxvii. Agramante was the leader of the Mohammedan kings and princes assembled at the siege of Paris, of whom Sobrino was one."
        vocab:
          - {w: "deste", d: "= de este, of this (old contraction)"}
          - {w: "máquina", d: "here a great mass, a vast tangle of things (not 'machine')"}
          - {w: "representársele a uno", d: "to come into someone's mind, appear to someone"}
          - {w: "de hoz y de coz", d: "headlong, up to the neck ('by sickle and by kick'): completely"}
          - {w: "campo de Agramante", d: "Agramante's camp: in Ariosto's Orlando Furioso, the Saracen camp before Paris where Agramante's own knights fall to quarrelling; proverbial for total confusion"}
          - {w: "atronar", d: "to deafen, make thunder, shake with noise"}
        diagram:
          - s: "se le representó en la memoria de don Quijote"
            r: "main verb 1: it came into Don Quijote's mind"
            under:
              - {s: "en la mitad deste caos, máquina y laberinto de cosas", r: "where: in the midst of this chaos, tangle and maze of things"}
              - s: "que se veía metido de hoz y de coz"
                r: "what came to mind: that he found himself plunged headlong"
                under:
                  - {s: "en la discordia del campo de Agramante", r: "where: into the discord of Agramante's camp"}
          - s: "y así dijo"
            r: "main verb 2: and so he said"
            under:
              - {s: "con voz que atronaba la venta:", r: "how: in a voice that made the inn thunder"}
        forms:
          - {w: "deste", f: "de + este (of this): Cervantes fuses 'de' with these pronouns."}
          - {w: "se le representó", f: "represent- + -ó → representarse (to appear), preterite, it, with 'se' and 'le' (to him). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "se veía", f: "ve- + -ía → verse (to see oneself, find oneself), imperfect, he. ver in the imperfect: veía, veías, veía, veíamos, veíais, veían."}
          - {w: "metido", f: "participle of meter (to put in), masculine to match Don Quijote: 'put, plunged'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "atronaba", f: "atron- + -aba → atronar (to make thunder), imperfect, it (the voice). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
        note: "In Ariosto's Orlando Furioso (cantos 26-27) the knights in the Saracen camp quarrel over a sword, a horse, a shield-device and a lady, until King Agramante has to step in to settle the quarrels. Don Quijote sees the same chaos in the inn."
  - sentences:
      - es: "— ¡Ténganse todos; todos envainen; todos se sosieguen; óiganme todos, si todos quieren quedar con vida!"
        literal: "— Hold-yourselves all; all sheathe; all calm-yourselves; hear-me all, if all you-want to-remain with life!"
        ormsby: "“Hold all, let all sheathe their swords, let all be calm and attend to me as they value their lives!”"
        vocab:
          - {w: "tenerse", d: "to stop, hold back; '¡ténganse!' = stop! hold!"}
          - {w: "envainar", d: "to sheathe (a sword); from 'vaina', scabbard"}
          - {w: "sosegarse", d: "to calm down, be quiet"}
          - {w: "quedar con vida", d: "to stay alive, come out alive"}
        diagram:
          - {s: "¡Ténganse todos", r: "command 1: everyone stop"}
          - {s: "todos envainen", r: "command 2: everyone sheathe your swords"}
          - {s: "todos se sosieguen", r: "command 3: everyone calm down"}
          - s: "óiganme todos"
            r: "command 4: everyone listen to me"
            under:
              - {s: "si todos quieren quedar con vida", r: "condition: if you all want to stay alive"}
        forms:
          - {w: "Ténganse", f: "teng- + -an + se → tenerse (to hold oneself back), present subjunctive, they (addressed as ustedes, 'you all'), used as a command, with 'se' stuck on the end: a polite or third-person command puts the pronoun after the verb. tener in the present subjunctive: tenga, tengas, tenga, tengamos, tengáis, tengan."}
          - {w: "envainen", f: "envain- + -en → envainar (to sheathe), present subjunctive, they (you all), as a command. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "se sosieguen", f: "sosieg- + -uen → sosegarse (to calm down), present subjunctive, they (you all), as a command: the stem e becomes ie when stressed, and g becomes gu before e. sosiegue, sosiegues, sosiegue, soseguemos, soseguéis, sosieguen. Here 'se' comes before the verb because the subject 'todos' opens the clause."}
          - {w: "óiganme", f: "oig- + -an + me → oír (to hear), present subjunctive, they (you all), as a command, with 'me' stuck on the end: 'hear me'. oír in the present subjunctive: oiga, oigas, oiga, oigamos, oigáis, oigan."}
          - {w: "quieren", f: "quier- + -en → querer (to want), present, they (you all). The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
        note: "Don Quijote addresses the brawlers in the third person plural (the ustedes form), as a herald or captain would; the repeated 'todos' gives the cry its rhythm."
  - sentences:
      - es: "A cuya gran voz, todos se pararon, y él prosiguió diciendo:"
        literal: "At whose great voice, all themselves stopped, and he continued saying:"
        ormsby: "All paused at his mighty voice, and he went on to say,"
        vocab:
          - {w: "a cuya gran voz", d: "at whose loud shout; 'cuyo' links back to Don Quijote's cry"}
          - {w: "pararse", d: "to stop, come to a halt"}
          - {w: "proseguir", d: "to continue, go on (with a speech)"}
        diagram:
          - s: "todos se pararon"
            r: "main verb 1: everyone stopped"
            under:
              - {s: "A cuya gran voz", r: "when / why: at his loud shout"}
          - s: "y él prosiguió"
            r: "main verb 2: and he went on"
            under:
              - {s: "diciendo:", r: "how: saying (what follows)"}
        forms:
          - {w: "cuya", f: "cuy- + -a → cuyo (whose), feminine to match the thing owned, 'voz', not the owner (Don Quijote)."}
          - {w: "gran", f: "grande (great, loud) clipped to 'gran' before a singular noun ('voz')."}
          - {w: "se pararon", f: "par- + -aron → pararse (to stop), preterite, they, with 'se'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "prosiguió", f: "prosigu- + -ió → proseguir (to continue), preterite, he: the stem e becomes i in this person. proseguí, proseguiste, prosiguió, proseguimos, proseguisteis, prosiguieron."}
          - {w: "diciendo", f: "gerund of decir (to say), with the stem e changed to i: 'saying'."}
  - sentences:
      - es: "— ¿No os dije yo, señores, que este castillo era encantado, y que alguna región de demonios debe de habitar en él?"
        literal: "— Not to-you said I, sirs, that this castle was enchanted, and that some region of demons must dwell in it?"
        ormsby: "“Did I not tell you, sirs, that this castle was enchanted, and that a legion or so of devils dwelt in it?"
        vocab:
          - {w: "región de demonios", d: "a host, a whole tribe of devils; Ormsby reads it as 'legion', which may be the joke"}
          - {w: "deber de", d: "must (probability): 'debe de habitar' = must be dwelling"}
          - {w: "habitar", d: "to dwell, live"}
        diagram:
          - s: "¿No os dije yo"
            r: "main verb: did I not tell you"
            under:
              - {s: "señores", r: "who he speaks to: sirs"}
              - {s: "que este castillo era encantado", r: "what I told you, 1: that this castle was enchanted"}
              - s: "y que alguna región de demonios debe de habitar"
                r: "what I told you, 2: and that some host of devils must live"
                under:
                  - {s: "en él", r: "where: in it (the castle)"}
        forms:
          - {w: "os", f: "'to you' (vosotros), the plural familiar object pronoun, here to the whole company."}
          - {w: "dije", f: "dij- + -e → decir (to say), preterite, I. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "este", f: "este (this), masculine singular to match 'castillo'."}
          - {w: "era", f: "ser (to be), imperfect, it. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "encantado", f: "encant- + -ado → encantar (to enchant), participle used as an adjective, masculine to match 'castillo'."}
          - {w: "alguna", f: "algun- + -a → alguno (some), feminine to match 'región'."}
          - {w: "debe de habitar", f: "deb- + -e → deber (must), present, it (the host), + de + habitar (to dwell): 'deber de' marks a guess, 'must be dwelling'. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "él", f: "'it', masculine because it stands for 'castillo'; with the accent it is the pronoun, not the article 'el'."}
        note: "He did say so earlier, when he refused to judge the packsaddle question because everything in this castle goes by enchantment. Now the brawl seems to prove him right."
      - es: "En confirmación de lo cual, quiero que veáis por vuestros ojos cómo se ha pasado aquí y trasladado entre nosotros la discordia del campo de Agramante."
        literal: "In confirmation of that which, I-want that you-see through your eyes how itself has passed here and transferred among us the discord of-the camp of Agramante."
        ormsby: "In proof whereof I call upon you to behold with your own eyes how the discord of Agramante’s camp has come hither, and been transferred into the midst of us."
        vocab:
          - {w: "en confirmación de lo cual", d: "in proof of which"}
          - {w: "por vuestros ojos", d: "with your own eyes"}
          - {w: "pasarse", d: "to move over, come across"}
          - {w: "trasladarse", d: "to be moved, transferred"}
          - {w: "discordia", d: "discord, strife"}
          - {w: "campo", d: "here 'camp' (of an army), not 'field'"}
          - {w: "Agramante", d: "Agramante, the Saracen king of Africa who besieges Paris in Boiardo's and Ariosto's Orlando poems; his camp falls into a famous brawl among his own champions"}
        diagram:
          - s: "quiero"
            r: "main verb: I want"
            under:
              - {s: "En confirmación de lo cual", r: "why: in proof of this"}
              - s: "que veáis por vuestros ojos"
                r: "what I want: that you see with your own eyes"
