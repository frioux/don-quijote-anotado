  - sentences:
      - es: "— ¡Vive el Señor, que es verdad cuanto mi amo dice de los encantos deste castillo, pues no es posible vivir una hora con quietud en él!"
        literal: "— Lives the Lord, that is truth all-that my master says of the enchantments of-this castle, since not is possible to-live one hour with quiet in it!"
        ormsby: "“By the Lord, it is quite true what my master says about the enchantments of this castle, for it is impossible to live an hour in peace in it!”"
        vocab:
          - {w: "¡Vive el Señor!", d: "'as the Lord lives!', an oath: by the Lord!"}
          - {w: "encanto", d: "enchantment, spell"}
          - {w: "deste", d: "= de este, of this (old contraction)"}
          - {w: "quietud", d: "peace, quiet"}
        diagram:
          - s: "¡Vive el Señor"
            r: "oath: as the Lord lives"
          - s: "que es verdad"
            r: "main verb: it is true"
            under:
              - s: "cuanto mi amo dice"
                r: "subject: all that my master says"
                under:
                  - {s: "de los encantos deste castillo", r: "about what: about the enchantments of this castle"}
              - s: "pues no es posible"
                r: "why: since it is not possible"
                under:
                  - {s: "vivir una hora con quietud en él", r: "what is impossible: to live one hour in peace in it"}
        forms:
          - {w: "Vive", f: "viv- + -e → vivir (to live), present, he (the Lord): 'the Lord lives'. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "que", f: "after an oath, 'que' introduces what is sworn to; English leaves it out."}
          - {w: "dice", f: "dic- + -e → decir (to say), present, he. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "deste", f: "de + este (of this): Cervantes fuses 'de' with these pronouns; masculine to match 'castillo'."}
          - {w: "él", f: "'it', masculine because it stands for 'castillo'; the accent marks the pronoun, not the article 'el'."}
        note: "Sancho, who knows the inn is an inn, now accepts his master's word that it is enchanted: the blanket-tossing of chapter 17 happened here, and now there is a brawl every hour."
  - sentences:
      - es: "Don Fernando despartió al cuadrillero y a don Quijote, y, con gusto de entrambos, les desenclavijó las manos, que el uno en el collar del sayo del uno, y el otro en la garganta del otro, bien asidas tenían;"
        literal: "Don Fernando separated [to] the officer and [to] Don Quijote, and, with liking of both, to-them he-unpegged the hands, which the one on the collar of-the coat of-the one, and the other on the throat of-the other, well gripped they-had;"
        ormsby: "Don Fernando parted the officer and Don Quixote, and to their mutual contentment made them relax the grip by which they held, the one the coat collar, the other the throat of his adversary;"
        vocab:
          - {w: "despartir", d: "to part, separate (people fighting)"}
          - {w: "con gusto de entrambos", d: "to the satisfaction of both; 'entrambos' = ambos, both (old form)"}
          - {w: "desenclavijar", d: "to unclench, prise apart; literally 'to unpeg', from 'clavija', a peg"}
          - {w: "collar", d: "collar (of a garment)"}
          - {w: "sayo", d: "loose coat or smock, a working man's outer garment"}
          - {w: "asido", d: "gripped, clutched (participle of 'asir', to seize)"}
        diagram:
          - s: "Don Fernando despartió"
            r: "main verb 1: Don Fernando separated"
            under:
              - {s: "al cuadrillero y a don Quijote", r: "object: the officer and Don Quijote"}
          - s: "les desenclavijó las manos"
            r: "main verb 2 (after 'y'): he unclenched their hands"
            under:
              - {s: "con gusto de entrambos", r: "how: to the satisfaction of both"}
              - s: "que ... bien asidas tenían"
                r: "describes 'manos': which they had tightly clenched"
                under:
                  - {s: "el uno en el collar del sayo del uno", r: "where, 1: the one (Don Quijote) on the collar of the other's coat"}
                  - {s: "y el otro en la garganta del otro", r: "where, 2: and the other (the officer) on the other's throat"}
        forms:
          - {w: "despartió", f: "despart- + -ió → despartir (to separate), preterite, he. The preterite of -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "al", f: "a + el: the personal 'a' before a human object, fused with the article; repeated in 'a don Quijote'."}
          - {w: "les desenclavijó", f: "desenclavij- + -ó → desenclavijar (to unclench), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. 'les' (from them) shows whose hands: Spanish uses the pronoun plus 'las manos' where English says 'their hands'."}
          - {w: "entrambos", f: "old form of ambos (both), masculine plural for the two men."}
          - {w: "asidas", f: "as- + -idas → asir (to grip), participle, feminine plural to match 'manos'."}
          - {w: "tenían", f: "ten- + -ían → tener (to have), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían. 'tener' + an agreeing participle stresses the state: 'they had them gripped tight'."}
        note: "The 'el uno ... el otro' is a little tangled, as Ormsby's version shows: one man held the other's coat collar, the other held his opponent's throat."
      - es: "pero no por esto cesaban los cuadrilleros de pedir su preso, y que les ayudasen a dársele atado y entregado a toda su voluntad, porque así convenía al servicio del rey y de la Santa Hermandad, de cuya parte de nuevo les pedían socorro y favor para hacer aquella prisión de aquel robador y salteador de sendas y de carreras."
        literal: "but not for this ceased the officers from asking-for their prisoner, and that they them should-help to give-it-to-them tied and handed-over at all their will, because so it-suited [to]-the service of-the king and of the Holy Brotherhood, on whose part anew them they-asked aid and help to make that arrest of that robber and waylayer of paths and of highways."
        ormsby: "for all this, however, the officers did not cease to demand their prisoner and call on them to help, and deliver him over bound into their power, as was required for the service of the King and of the Holy Brotherhood, on whose behalf they again demanded aid and assistance to effect the capture of this robber and footpad of the highways."
        vocab:
