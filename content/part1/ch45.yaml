          - {w: "prisión", d: "arrest, capture (not only 'prison')"}
          - {w: "robador", d: "robber (old word, modern 'ladrón')"}
          - {w: "salteador de sendas y de carreras", d: "waylayer of paths and highroads: a mock-legal doubling of 'salteador de caminos'"}
        diagram:
          - s: "pero no por esto cesaban los cuadrilleros"
