          - {w: "de espacio", d: "slowly (modern 'despacio')"}
          - {w: "lector", d: "reader"}
          - {w: "cotejar", d: "to compare, check one thing against another"}
          - {w: "rostro", d: "face"}
          - {w: "sin duda alguna", d: "without any doubt; 'alguna' after the noun means 'any at all'"}
          - {w: "rezar", d: "here 'to say, state' (of a document); usually 'to pray'"}
