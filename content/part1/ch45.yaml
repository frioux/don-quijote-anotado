  - sentences:
      - es: "— ¡Válame Dios! —dijo a esta sazón el barbero burlado—; ¿que es posible que tanta gente honrada diga que ésta no es bacía, sino yelmo?"
        literal: "— God help-me! —said at this moment the barber mocked—; that is possible that so-much people honourable may-say that this not is basin, but helmet?"
        ormsby: "“God bless me!” exclaimed their butt the barber at this; “is it possible that such an honourable company can say that this is not a basin but a helmet?"
        vocab:
          - {w: "¡válame Dios!", d: "God help me! (válame = modern 'valga me', 'may God protect me')"}
          - {w: "a esta sazón", d: "at this moment, just then"}
          - {w: "burlado", d: "mocked, made a fool of, the butt of the joke"}
          - {w: "¿que es posible ...?", d: "can it be that ...? (the opening 'que' adds astonishment)"}
          - {w: "gente honrada", d: "respectable people"}
        diagram:
          - {s: "¡Válame Dios!", r: "exclamation: God help me"}
          - {s: "—dijo a esta sazón el barbero burlado—", r: "aside: said the mocked barber at this point"}
          - s: "¿que es posible"
            r: "main verb: can it be possible"
            under:
              - s: "que tanta gente honrada diga"
                r: "what is possible: that so many respectable people say"
                under:
                  - {s: "que ésta no es bacía, sino yelmo", r: "what they say: that this is not a basin but a helmet"}
        forms:
          - {w: "Válame", f: "val- + -a + me → valer (to protect, help), present subjunctive, he (God), with 'me' (me) on the end: a wish, 'may God help me'. Contracted from 'válgame': valga, valgas, valga, valgamos, valgáis, valgan."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "esta", f: "est- + -a → este (this), feminine to match 'sazón'."}
          - {w: "burlado", f: "burl- + -ado → burlar (to mock), participle used as an adjective, masculine to match 'barbero'."}
          - {w: "tanta", f: "tant- + -a → tanto (so much), feminine singular to match 'gente', a singular noun for many people."}
          - {w: "diga", f: "dig- + -a → decir (to say), present subjunctive, it ('gente', singular), after 'es posible que'. diga, digas, diga, digamos, digáis, digan."}
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
      - es: "Cosa parece ésta que puede poner en admiración a toda una Universidad, por discreta que sea."
        literal: "Thing seems this that can put in amazement to all a University, however wise that it-may-be."
        ormsby: "Why, this is a thing that would astonish a whole university, however wise it might be!"
        vocab:
          - {w: "poner en admiración", d: "to astonish, fill with wonder; 'admiración' = amazement (false friend)"}
          - {w: "Universidad", d: "university; the learned body of doctors, as at Salamanca or Alcalá"}
          - {w: "por ... que sea", d: "however ... it may be"}
          - {w: "discreto", d: "wise, sensible, clever (false friend: not 'discreet')"}
        diagram:
          - s: "Cosa parece ésta"
            r: "main verb: this seems a thing"
            under:
              - s: "que puede poner en admiración a toda una Universidad"
                r: "describes 'cosa': that can astonish a whole university"
                under:
                  - {s: "por discreta que sea", r: "concession: however wise it may be"}
        forms:
          - {w: "parece", f: "parec- + -e → parecer (to seem), present, it. parezco, pareces, parece, parecemos, parecéis, parecen."}
          - {w: "ésta", f: "'this one', feminine to match 'cosa'; the accent marks it as a pronoun."}
          - {w: "puede", f: "pued- + -e → poder (to be able), present, it. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "discreta", f: "discret- + -a → discreto (wise), feminine to match 'Universidad'."}
          - {w: "sea", f: "ser (to be), present subjunctive, it, after 'por ... que' (however). sea, seas, sea, seamos, seáis, sean."}
      - es: "Basta: si es que esta bacía es yelmo, también debe de ser esta albarda jaez de caballo, como este señor ha dicho."
        literal: "It-is-enough: if it-is that this basin is helmet, also must be this packsaddle trappings of horse, as this gentleman has said."
        ormsby: "That will do; if this basin is a helmet, why, then the packsaddle must be a horse’s caparison, as this gentleman has said.”"
        vocab:
          - {w: "basta", d: "enough! that settles it"}
          - {w: "si es que", d: "if it is the case that"}
          - {w: "deber de", d: "must (probability): 'debe de ser' = it must be"}
          - {w: "albarda", d: "packsaddle, the stuffed pad saddle of a donkey"}
          - {w: "jaez", d: "trappings, caparison: the ornamented harness of a horse"}
        diagram:
          - {s: "Basta:", r: "exclamation: that's enough"}
          - s: "también debe de ser esta albarda jaez de caballo"
            r: "main verb: this packsaddle must also be a horse's trappings"
            under:
              - {s: "si es que esta bacía es yelmo", r: "condition: if this basin is a helmet"}
              - {s: "como este señor ha dicho", r: "how: as this gentleman has said"}
        forms:
          - {w: "Basta", f: "bast- + -a → bastar (to be enough), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "debe", f: "deb- + -e → deber (must), present, it. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "esta", f: "est- + -a → este (this), feminine to match 'bacía' and 'albarda'."}
          - {w: "ha dicho", f: "ha (haber (to have), present, he: he, has, ha, hemos, habéis, han) + dicho, the irregular participle of decir (to say): 'has said'."}
        note: "In the previous chapter Don Quijote said that Sancho had taken the 'jaeces' (trappings) from the horse of the beaten coward, and that enchantment must have turned them into a packsaddle; 'este señor' is Don Quijote. The barber's logic: one absurdity entails the other."
  - sentences:
      - es: "— A mí albarda me parece —dijo don Quijote—, pero ya he dicho que en eso no me entremeto."
        literal: "— To me packsaddle to-me it-seems —said Don Quijote—, but already I-have said that in that not myself I-meddle."
        ormsby: "“To me it looks like a packsaddle,” said Don Quixote; “but I have already said that with that question I do not concern myself.”"
        vocab:
          - {w: "entremeterse", d: "to meddle, interfere (modern 'entrometerse')"}
        diagram:
          - s: "A mí albarda me parece"
            r: "main verb 1: to me it seems a packsaddle"
            under:
              - {s: "—dijo don Quijote—", r: "aside: said Don Quijote"}
          - s: "pero ya he dicho"
            r: "main verb 2: but I have already said"
            under:
              - {s: "que en eso no me entremeto", r: "what I said: that I do not meddle in that"}
        forms:
          - {w: "A mí ... me", f: "'a mí' and 'me' both mean 'to me': Spanish doubles the pronoun for emphasis, 'to ME it seems'."}
          - {w: "parece", f: "parec- + -e → parecer (to seem), present, it. parezco, pareces, parece, parecemos, parecéis, parecen."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "he dicho", f: "he (haber (to have), present, I: he, has, ha, hemos, habéis, han) + dicho, the irregular participle of decir (to say): 'I have said'."}
          - {w: "me entremeto", f: "entremet- + -o → entremeterse (to meddle), present, I, with 'me' (myself). The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
        note: "In the previous chapter Don Quijote said he would not meddle in the matter of the packsaddle, only that the basin was Mambrino's helmet. The comedy is that the madman calls it a packsaddle while the sane men are about to vote it a horse's caparison."
  - sentences:
      - es: "— De que sea albarda o jaez —dijo el cura— no está en más de decirlo el señor don Quijote; que en estas cosas de la caballería todos estos señores y yo le damos la ventaja."
        literal: "— Of that it-be packsaddle or trappings —said the priest— not it-lies in more than to-say-it the señor Don Quijote; for in these things of the chivalry all these gentlemen and I to-him give the advantage."
        ormsby: "“As to whether it be packsaddle or caparison,” said the curate, “it is only for Señor Don Quixote to say; for in these matters of chivalry all these gentlemen and I bow to his authority.”"
        vocab:
          - {w: "no está en más de", d: "depends only on, rests entirely with"}
          - {w: "que", d: "here 'for, since', giving the reason"}
          - {w: "dar la ventaja", d: "to yield, concede superiority, bow to someone's authority"}
        diagram:
          - s: "no está en más de decirlo el señor don Quijote"
            r: "main verb 1: it rests only on Don Quijote saying it"
            under:
              - {s: "De que sea albarda o jaez", r: "about what: whether it is a packsaddle or trappings"}
              - {s: "—dijo el cura—", r: "aside: said the priest"}
          - s: "le damos la ventaja"
            r: "main verb 2 (after 'que', for): we yield to him"
            under:
              - {s: "en estas cosas de la caballería", r: "where: in these matters of chivalry"}
              - {s: "todos estos señores y yo", r: "subject: all these gentlemen and I"}
        forms:
          - {w: "sea", f: "ser (to be), present subjunctive, it, after 'de que' (as to whether). sea, seas, sea, seamos, seáis, sean."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "está", f: "est- + -á → estar (to be), present, it. estoy, estás, está, estamos, estáis, están."}
          - {w: "decirlo", f: "decir (to say) + lo (it), the pronoun hung on the infinitive after 'de'; its subject 'el señor don Quijote' follows."}
          - {w: "estas, estos", f: "este (this): estas feminine plural to match 'cosas', estos masculine plural to match 'señores'."}
          - {w: "damos", f: "d- + -amos → dar (to give), present, we. doy, das, da, damos, dais, dan."}
  - sentences:
      - es: "— Por Dios, señores míos —dijo don Quijote—, que son tantas y tan estrañas las cosas que en este castillo, en dos veces que en él he alojado, me han sucedido, que no me atreva a decir afirmativamente ninguna cosa de lo que acerca de lo que en él se contiene se preguntare, porque imagino que cuanto en él se trata va por vía de encantamento."
        literal: "— By God, sirs mine —said Don Quijote—, that are so-many and so strange the things that in this castle, in two times that in it I-have lodged, to-me have happened, that not myself I-may-dare to say affirmatively no thing of that which about that which in it itself contains itself may-be-asked, because I-imagine that whatever in it itself is-dealt goes by way of enchantment."
        ormsby: "“By God, gentlemen,” said Don Quixote, “so many strange things have happened to me in this castle on the two occasions on which I have sojourned in it, that I will not venture to assert anything positively in reply to any question touching anything it contains; for it is my belief that everything that goes on within it goes by enchantment."
        vocab:
          - {w: "por Dios ... que", d: "by God (an oath; 'que' introduces what is sworn)"}
          - {w: "estraño", d: "= extraño, strange (old spelling)"}
          - {w: "alojar", d: "to lodge, stay"}
          - {w: "suceder", d: "to happen"}
          - {w: "atreverse a", d: "to dare to, venture to"}
          - {w: "afirmativamente", d: "positively, with certainty"}
          - {w: "acerca de", d: "about, concerning"}
          - {w: "contenerse", d: "to be contained"}
          - {w: "cuanto", d: "all that, whatever"}
          - {w: "tratarse", d: "to be done, go on"}
          - {w: "por vía de", d: "by way of, by means of"}
          - {w: "encantamento", d: "= encantamiento, enchantment (old form)"}
        diagram:
          - s: "son tantas y tan estrañas las cosas"
            r: "main verb: the things are so many and so strange"
            under:
              - {s: "Por Dios, señores míos", r: "oath: by God, gentlemen"}
              - {s: "—dijo don Quijote—", r: "aside: said Don Quijote"}
              - s: "que en este castillo ... me han sucedido"
                r: "describes 'cosas': that have happened to me in this castle"
                under:
                  - {s: "en dos veces que en él he alojado", r: "when: on the two occasions I have stayed in it"}
              - s: "que no me atreva a decir afirmativamente ninguna cosa"
                r: "result: that I may not dare to state anything for certain"
                under:
                  - s: "de lo que ... se preguntare"
                    r: "about what: of whatever may be asked"
                    under:
                      - {s: "acerca de lo que en él se contiene", r: "about what: concerning what the castle contains"}
              - s: "porque imagino"
                r: "why: because I imagine"
                under:
                  - {s: "que cuanto en él se trata va por vía de encantamento", r: "what I imagine: that all that goes on in it is done by enchantment"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "son", f: "ser (to be), present, they. soy, eres, es, somos, sois, son."}
          - {w: "tantas, estrañas", f: "feminine plural to match 'cosas'; 'tantas' sets up the result clause 'que no me atreva ...'."}
          - {w: "he alojado", f: "he (haber (to have), present, I: he, has, ha, hemos, habéis, han) + alojado, the participle of alojar (to lodge): 'I have lodged'."}
          - {w: "han sucedido", f: "han (haber (to have), present, they: he, has, ha, hemos, habéis, han) + sucedido, the participle of suceder (to happen): 'have happened'."}
          - {w: "atreva", f: "atrev- + -a → atreverse (to dare), present subjunctive, I, with 'me'. The present subjunctive of -er and -ir verbs: -a, -as, -a, -amos, -áis, -an. Odd after a result clause, where modern Spanish says 'no me atrevo'."}
          - {w: "contiene", f: "contien- + -e → contener (to contain), present, it, with 'se' (is contained). Like tener: contengo, contienes, contiene, contenemos, contenéis, contienen."}
          - {w: "preguntare", f: "pregunt- + -are → preguntar (to ask), future subjunctive, it, with 'se' (may be asked). The future subjunctive of -ar verbs: -are, -ares, -are, -áremos, -areis, -aren. Cervantes uses it after 'lo que', 'si', 'quien' for an open future; modern Spanish says 'se pregunte'."}
          - {w: "imagino", f: "imagin- + -o → imaginar (to imagine), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "se trata", f: "trat- + -a → tratar (to deal with), present, it, with 'se': 'is done, goes on'. Same -ar present."}
          - {w: "va", f: "ir (to go), present, it. voy, vas, va, vamos, vais, van."}
          - {w: "él", f: "'it', masculine because it stands for 'este castillo'."}
      - es: "La primera vez me fatigó mucho un moro encantado que en él hay, y a Sancho no le fue muy bien con otros sus secuaces; y anoche estuve colgado deste brazo casi dos horas, sin saber cómo ni cómo no vine a caer en aquella desgracia."
        literal: "The first time me troubled much a Moor enchanted that in it there-is, and to Sancho not to-him it-went very well with others his followers; and last-night I-was hanging from-this arm almost two hours, without knowing how nor how-not I-came to fall into that misfortune."
