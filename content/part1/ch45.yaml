  - sentences:
      - es: "Y, alzando el lanzón, que nunca le dejaba de las manos, le iba a descargar tal golpe sobre la cabeza, que, a no desviarse el cuadrillero, se le dejara allí tendido."
        literal: "And, raising the pike, which never it he-let-go from the hands, on-him he-was-going to unload such blow upon the head, that, had not dodged-himself the trooper, him to-him it-would-have-left there stretched-out."
        ormsby: "and lifting his pike, which he had never let out of his hand, he delivered such a blow at his head that, had not the officer dodged it, it would have stretched him at full length."
        vocab:
          - {w: "lanzón", d: "a short thick pike or lance ('-ón' = big)"}
          - {w: "descargar un golpe", d: "to deal, let fly a blow"}
          - {w: "a no + infinitive", d: "if not for, had ... not: 'a no desviarse el cuadrillero' = had the trooper not dodged"}
          - {w: "desviarse", d: "to dodge, step aside"}
          - {w: "tendido", d: "stretched out, laid flat"}
        diagram:
          - s: "le iba a descargar tal golpe"
            r: "main verb: he was about to deal him such a blow"
            under:
              - s: "alzando el lanzón"
                r: "how: raising the pike"
                under:
                  - {s: "que nunca le dejaba de las manos", r: "describes 'lanzón': which he never let out of his hands"}
              - {s: "sobre la cabeza", r: "where: on the head"}
              - s: "que"
                r: "result: that"
                under:
                  - {s: "a no desviarse el cuadrillero", r: "condition: had the trooper not dodged"}
                  - {s: "se le dejara allí tendido", r: "result: it would have left him laid out there"}
        forms:
          - {w: "alzando", f: "gerund of alzar (to raise): 'raising'."}
          - {w: "dejaba", f: "dej- + -aba → dejar (to let go), imperfect, he; 'le' (it, the pike) is leísmo, 'le' used for a thing. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "iba a descargar", f: "ib- + -a → ir (to go), imperfect, he: iba, ibas, iba, íbamos, ibais, iban; + a + descargar (to unload, deal): 'was going to deal, was about to deal'."}
          - {w: "desviarse", f: "desviar (to turn aside) + se (himself), infinitive after 'a no'."}
          - {w: "dejara", f: "dej- + -ara → dejar (to leave), imperfect subjunctive (-ra form), it (the blow), used as a conditional: 'would have left'. dejara, dejaras, dejara, dejáramos, dejarais, dejaran."}
          - {w: "se le", f: "'se' here makes the result happen of itself and 'le' is 'him': 'it would have left him'."}
          - {w: "tendido", f: "participle of tender (to stretch out), masculine to match 'le' (the trooper)."}
