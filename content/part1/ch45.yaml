      - es: "El ventero tornó a reforzar la voz, pidiendo favor a la Santa Hermandad: de modo que toda la venta era llantos, voces, gritos, confusiones, temores, sobresaltos, desgracias, cuchilladas, mojicones, palos, coces y efusión de sangre."
