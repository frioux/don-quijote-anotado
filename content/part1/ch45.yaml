          - {w: "secuaz", d: "follower, henchman"}
          - {w: "anoche", d: "last night"}
          - {w: "colgado", d: "hanging, hung up"}
          - {w: "deste", d: "= de este, from this (old contraction)"}
          - {w: "sin saber cómo ni cómo no", d: "without knowing how or how not, i.e. without knowing how at all"}
          - {w: "venir a", d: "to end up, come to (do something)"}
          - {w: "desgracia", d: "misfortune, mishap (not 'disgrace')"}
        diagram:
          - s: "me fatigó mucho un moro encantado"
            r: "main verb 1: an enchanted Moor gave me much trouble"
            under:
              - {s: "La primera vez", r: "when: the first time"}
