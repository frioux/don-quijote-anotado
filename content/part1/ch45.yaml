              - {s: "que, sin duda alguna, era el que el mandamiento rezaba", r: "what he found: that he was the man the warrant described"}
        forms:
          - {w: "poniéndosele", f: "gerund of poner (to put) + se (himself) + le (to it, the warrant), accent added: 'setting himself to (read) it'."}
          - {w: "era", f: "ser (to be), imperfect, he. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "buen", f: "bueno (good) clipped to 'buen' before a masculine singular noun ('lector')."}
          - {w: "leía, ponía", f: "le- + -ía → leer (to read) and pon- + -ía → poner (to put), imperfect, he: repeated action. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "iba cotejando", f: "ib- + -a → ir (to go), imperfect, he: iba, ibas, iba, íbamos, ibais, iban; + cotejando, gerund of cotejar (to compare): 'ir' + gerund = kept on comparing, gradually."}
          - {w: "halló", f: "hall- + -ó → hallar (to find), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "rezaba", f: "rez- + -aba → rezar (to state), imperfect, it (the warrant). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
        note: "A comic picture of a barely literate officer spelling out his warrant word by word, looking up at Don Quijote after each one."
      - es: "Y, apenas se hubo certificado, cuando, recogiendo su pergamino, en la izquierda tomó el mandamiento, y con la derecha asió a don Quijote del cuello fuertemente, que no le dejaba alentar, y a grandes voces decía:"
        literal: "And, scarcely himself he-had made-certain, when, gathering-up his parchment, in the left he-took the warrant, and with the right he-seized to Don Quijote by-the neck strongly, so-that not him he-let breathe, and at great voices he-was-saying:"
