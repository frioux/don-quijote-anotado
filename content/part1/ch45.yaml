  - sentences:
      - es: "Desta manera se apaciguó aquella máquina de pendencias, por la autoridad de Agramante y prudencia del rey Sobrino;"
        literal: "Of-this manner itself calmed that machine of quarrels, by the authority of Agramante and prudence of-the king Sobrino;"
        ormsby: "Thus by the authority of Agramante and the wisdom of King Sobrino all this complication of disputes was arranged;"
        vocab:
          - {w: "desta manera", d: "= de esta manera, in this way, thus"}
          - {w: "apaciguarse", d: "to calm down, be settled"}
          - {w: "máquina", d: "a great mass, a heap, a tangle (not 'machine')"}
          - {w: "pendencia", d: "quarrel, brawl"}
          - {w: "Agramante, Sobrino", d: "the Saracen king and his wise old counsellor in Ariosto's Orlando Furioso, who make peace among their quarrelling champions; here the judge and the priest"}
          - {w: "prudencia", d: "wisdom, good sense"}
        diagram:
          - s: "se apaciguó aquella máquina de pendencias"
            r: "main verb: that whole tangle of quarrels was calmed"
            under:
              - {s: "Desta manera", r: "how: in this way"}
              - {s: "por la autoridad de Agramante y prudencia del rey Sobrino", r: "by what: by Agramante's authority and King Sobrino's wisdom"}
        forms:
          - {w: "Desta", f: "de + esta (of this): Cervantes fuses 'de' with these pronouns."}
          - {w: "se apaciguó", f: "apacigu- + -ó → apaciguarse (to calm down), preterite, it, with 'se'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (apacigüé, with ü before e)."}
          - {w: "aquella", f: "aquell- + -a → aquel (that), feminine to match 'máquina'."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
        note: "The narrator takes up Don Quijote's casting: the judge and the priest really have played Agramante and Sobrino, and the mock-epic tone continues into the next sentence."
      - es: "pero, viéndose el enemigo de la concordia y el émulo de la paz menospreciado y burlado, y el poco fruto que había granjeado de haberlos puesto a todos en tan confuso laberinto, acordó de probar otra vez la mano, resucitando nuevas pendencias y desasosiegos."
        literal: "but, seeing-himself the enemy of the concord and the rival of the peace scorned and mocked, and the little fruit that he-had gained from having-them put all in so confused labyrinth, he-resolved to try another time the hand, reviving new quarrels and unrests."
        ormsby: "but the enemy of concord and hater of peace, feeling himself slighted and made a fool of, and seeing how little he had gained after having involved them all in such an elaborate entanglement, resolved to try his hand once more by stirring up fresh quarrels and disturbances."
        vocab:
          - {w: "el enemigo de la concordia", d: "the enemy of concord: the Devil, who sows discord"}
          - {w: "émulo", d: "rival, adversary (literary)"}
          - {w: "menospreciado", d: "scorned, slighted"}
          - {w: "burlado", d: "mocked, made a fool of, cheated of his aim"}
          - {w: "granjear", d: "to gain, earn"}
          - {w: "laberinto", d: "labyrinth, tangle"}
          - {w: "acordar de", d: "to resolve to (old use with 'de')"}
          - {w: "probar la mano", d: "to try one's hand"}
          - {w: "resucitar", d: "to revive, stir up again (literally 'to raise from the dead')"}
          - {w: "desasosiego", d: "unrest, disturbance"}
        diagram:
          - s: "acordó de probar otra vez la mano"
            r: "main verb (after 'pero'): he resolved to try his hand again"
            under:
              - s: "viéndose"
                r: "why: seeing himself"
                under:
                  - {s: "el enemigo de la concordia y el émulo de la paz", r: "subject of the whole sentence: the enemy of concord and foe of peace (the Devil)"}
                  - {s: "menospreciado y burlado", r: "how he saw himself: scorned and cheated"}
                  - s: "y el poco fruto"
                    r: "what he saw, 2: and the little profit"
                    under:
                      - {s: "que había granjeado de haberlos puesto a todos en tan confuso laberinto", r: "describes 'fruto': that he had won by putting them all in such a tangle"}
              - {s: "resucitando nuevas pendencias y desasosiegos", r: "how: by stirring up new quarrels and troubles"}
        forms:
          - {w: "viéndose", f: "gerund of ver (to see) + se (himself), accent added to keep the stress: 'seeing himself'."}
          - {w: "menospreciado y burlado", f: "participles of menospreciar (to scorn) and burlar (to mock), masculine singular to match 'el enemigo'."}
          - {w: "había granjeado", f: "hab- + -ía → haber (to have), imperfect, he: había, habías, había, habíamos, habíais, habían; + granjeado, participle of granjear (to gain): the pluperfect, 'had gained'."}
          - {w: "haberlos puesto", f: "haber (to have) + los (them), infinitive after 'de', + puesto, irregular participle of poner (to put): 'having put them'. 'a todos' repeats 'los' for emphasis."}
          - {w: "acordó", f: "acord- + -ó → acordar (to resolve), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "resucitando", f: "gerund of resucitar (to revive): 'by reviving'."}
          - {w: "nuevas", f: "nuev- + -as → nuevo (new), feminine plural to match 'pendencias' (the nearer noun)."}
        note: "In Ariosto it is Discord herself, sent by the archangel Michael, who stirs up Agramante's camp; Cervantes gives the job to the Devil, 'the enemy of concord'."
  - sentences:
      - es: "Es, pues, el caso que los cuadrilleros se sosegaron, por haber entreoído la calidad de los que con ellos se habían combatido, y se retiraron de la pendencia, por parecerles que, de cualquiera manera que sucediese, habían de llevar lo peor de la batalla;"
        literal: "It-is, then, the case that the troopers themselves calmed, for having half-heard the rank of those who with them themselves had fought, and themselves withdrew from the quarrel, for seeming-to-them that, of whatever manner that it-might-turn-out, they-had to carry the worst of the battle;"
        ormsby: "It came about in this wise: the officers were pacified on learning the rank of those with whom they had been engaged, and withdrew from the contest, considering that whatever the result might be they were likely to get the worst of the battle;"
        vocab:
          - {w: "es el caso que", d: "the fact is that, it so happened that"}
          - {w: "sosegarse", d: "to calm down"}
          - {w: "entreoír", d: "to half-hear, overhear"}
          - {w: "calidad", d: "rank, social standing (false friend)"}
          - {w: "combatirse con", d: "to fight with"}
          - {w: "retirarse", d: "to withdraw, pull back"}
          - {w: "de cualquiera manera que", d: "however it might turn out, in whatever way"}
          - {w: "llevar lo peor", d: "to get the worst of it"}
        diagram:
          - s: "Es, pues, el caso"
            r: "main verb: the fact is, then"
            under:
              - s: "que los cuadrilleros se sosegaron"
                r: "what the fact is, 1: that the troopers calmed down"
                under:
                  - s: "por haber entreoído la calidad de los"
                    r: "why: because they had overheard the rank of those"
                    under:
                      - {s: "que con ellos se habían combatido", r: "describes 'los': who had fought with them"}
              - s: "y se retiraron de la pendencia"
                r: "what the fact is, 2: and withdrew from the brawl"
                under:
                  - s: "por parecerles"
                    r: "why: because it seemed to them"
                    under:
                      - {s: "que, de cualquiera manera que sucediese, habían de llevar lo peor de la batalla", r: "what seemed: that however it turned out, they would get the worst of the fight"}
        forms:
          - {w: "se sosegaron", f: "soseg- + -aron → sosegarse (to calm down), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (sosegué, with gu before e)."}
          - {w: "haber entreoído", f: "haber (to have), infinitive after 'por' (because of), + entreoído, participle of entreoír (to half-hear): 'having overheard'."}
          - {w: "se habían combatido", f: "hab- + -ían → haber (to have), imperfect, they: había, habías, había, habíamos, habíais, habían; + combatido, participle of combatir (to fight): the pluperfect, 'had fought'."}
          - {w: "se retiraron", f: "retir- + -aron → retirarse (to withdraw), preterite, they. Same -ar preterite."}
          - {w: "parecerles", f: "parecer (to seem) + les (to them), infinitive after 'por': 'because it seemed to them'."}
          - {w: "cualquiera", f: "cualquiera (whatever, any), full form before 'manera'; modern Spanish clips it to 'cualquier' before a noun."}
          - {w: "sucediese", f: "suced- + -iese → suceder (to turn out), imperfect subjunctive (-se form), it, after 'de cualquiera manera que' (however it might happen). sucediese, sucedieses, sucediese, sucediésemos, sucedieseis, sucediesen."}
          - {w: "habían de llevar", f: "hab- + -ían → haber (to have), imperfect, they: había, habías, había, habíamos, habíais, habían; + de + llevar (to carry, get): 'haber de' = be bound to, 'they were bound to get'."}
        note: "Fighting gentlemen of rank like Don Fernando was risky for mere troopers, whatever the rights of the case."
      - es: "pero uno dellos, que fue el que fue molido y pateado por don Fernando, le vino a la memoria que, entre algunos mandamientos que traía para prender a algunos delincuentes, traía uno contra don Quijote, a quien la Santa Hermandad había mandado prender, por la libertad que dio a los galeotes, y como Sancho, con mucha razón, había temido."
        literal: "but one of-them, who was the-one who was ground and trampled by Don Fernando, to-him came to the memory that, among some warrants that he-carried to arrest to some delinquents, he-carried one against Don Quijote, whom the Holy Brotherhood had ordered to-arrest, for the freedom that he-gave to the galley-slaves, and as Sancho, with much reason, had feared."
        ormsby: "but one of them, the one who had been thrashed and kicked by Don Fernando, recollected that among some warrants he carried for the arrest of certain delinquents, he had one against Don Quixote, whom the Holy Brotherhood had ordered to be arrested for setting the galley slaves free, as Sancho had, with very good reason, apprehended."
        vocab:
          - {w: "dellos", d: "= de ellos, of them"}
          - {w: "molido", d: "beaten black and blue (literally 'ground', as in a mill)"}
          - {w: "pateado", d: "kicked, trampled"}
          - {w: "venirle a la memoria", d: "to come to mind, to remember"}
          - {w: "mandamiento", d: "warrant, writ (here not 'commandment')"}
          - {w: "prender", d: "to arrest, seize"}
          - {w: "Santa Hermandad", d: "the Holy Brotherhood, the rural police force set up by the Catholic Monarchs to deal with highway crime"}
          - {w: "galeote", d: "galley slave, convict sentenced to row in the galleys"}
        diagram:
          - s: "le vino a la memoria"
            r: "main verb (after 'pero'): it came to his mind"
            under:
              - s: "uno dellos"
                r: "who remembered: one of them"
                under:
                  - {s: "que fue el que fue molido y pateado por don Fernando", r: "describes 'uno': the one who was beaten and kicked by Don Fernando"}
              - s: "que, entre algunos mandamientos"
                r: "what came to mind: that, among some warrants"
                under:
                  - {s: "que traía para prender a algunos delincuentes", r: "describes 'mandamientos': that he carried to arrest some criminals"}
                  - s: "traía uno contra don Quijote"
                    r: "verb of what came to mind: he carried one against Don Quijote"
                    under:
                      - {s: "a quien la Santa Hermandad había mandado prender", r: "describes 'don Quijote': whom the Brotherhood had ordered arrested"}
                      - {s: "por la libertad que dio a los galeotes", r: "why: for freeing the galley slaves"}
                      - {s: "y como Sancho, con mucha razón, había temido", r: "comment: just as Sancho had, with good reason, feared"}
        forms:
          - {w: "dellos", f: "de + ellos (of them): Cervantes fuses 'de' with the pronoun."}
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, he. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron. The second 'fue molido' is passive: 'was beaten'."}
          - {w: "molido y pateado", f: "participles of moler (to grind) and patear (to kick), masculine singular to match 'el que'."}
          - {w: "le vino", f: "vin- + -o → venir (to come), preterite, it, with 'le' (to him): 'it came to him'. Irregular: vine, viniste, vino, vinimos, vinisteis, vinieron. The sentence starts with 'uno dellos' as if it were the subject, then switches to 'le vino': a loose but common construction."}
          - {w: "traía", f: "tra- + -ía → traer (to carry), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "había mandado", f: "hab- + -ía → haber (to have), imperfect, it: había, habías, había, habíamos, habíais, habían; + mandado, participle of mandar (to order): the pluperfect, 'had ordered'. Same for 'había temido', from temer (to fear)."}
          - {w: "dio", f: "di- + -o → dar (to give), preterite, he. Irregular: di, diste, dio, dimos, disteis, dieron."}
        note: "Don Quijote freed the chain of galley slaves in chapter 22, and Sancho warned him then, and again later, that the Holy Brotherhood would be after them."
  - sentences:
      - es: "Imaginando, pues, esto, quiso certificarse si las señas que de don Quijote traía venían bien, y, sacando del seno un pergamino, topó con el que buscaba;"
        literal: "Imagining, then, this, he-wanted to-make-certain-himself if the marks that of Don Quijote he-carried came well, and, taking-out from-the bosom a parchment, he-hit with the-one that he-was-seeking;"
