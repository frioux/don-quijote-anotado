  - sentences:
      - es: "— Aquí no hay más que hacer, sino que cada uno tome lo que es suyo, y a quien Dios se la dio, San Pedro se la bendiga."
        literal: "— Here not there-is more to do, but that each one may-take that which is his, and to whom God it to-him gave, Saint Peter it to-him may-bless."
        ormsby: "“There is no more to be done now than for each to take what belongs to him, and to whom God has given it, may St. Peter add his blessing.”"
        vocab:
          - {w: "no hay más que hacer sino", d: "there is nothing left to do but"}
          - {w: "a quien Dios se la dio, San Pedro se la bendiga", d: "proverb: to whom God gave it, may St Peter bless it; let each keep what fortune gave him"}
        diagram:
          - s: "Aquí no hay más que hacer"
            r: "main verb: there is nothing more to do here"
            under:
              - s: "sino que cada uno tome"
                r: "except: but that each one take"
                under:
                  - {s: "lo que es suyo", r: "object: what is his"}
          - s: "San Pedro se la bendiga"
            r: "main verb 2 (after 'y', a wish): may St Peter bless it for him"
            under:
              - {s: "a quien Dios se la dio", r: "to whom: whoever God gave it to"}
        forms:
          - {w: "hay", f: "from haber (there to be), present: 'there is'. The form 'hay' is used for both 'there is' and 'there are'."}
          - {w: "tome", f: "tom- + -e → tomar (to take), present subjunctive, he (each one): subjunctive after 'que' giving a wish or order. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "suyo", f: "the long form of 'su' (his), standing after the verb: 'is his'."}
          - {w: "se la dio", f: "dio → dar (to give), preterite, he (God): di, diste, dio, dimos, disteis, dieron. 'se' is 'le' (to him) changed to 'se' before 'la' (it): le + la → se la."}
          - {w: "se la bendiga", f: "bendig- + -a → bendecir (to bless), present subjunctive, he (St Peter), a wish: 'may he bless it for him'. Like decir: bendiga, bendigas, bendiga, bendigamos, bendigáis, bendigan. 'se la' as in 'se la dio' (le → se before la)."}
        note: "St Peter, keeper of the keys of heaven, confirms what God has given. Don Quijote is quietly telling everyone to keep what they have, which means he keeps the 'helmet'."
