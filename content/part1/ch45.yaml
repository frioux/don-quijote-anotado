        vocab:
          - {w: "certificarse", d: "to make sure, satisfy oneself"}
          - {w: "señas", d: "description, distinguishing marks (of a wanted man)"}
          - {w: "venir bien", d: "to fit, match"}
          - {w: "seno", d: "bosom; the fold of the shirt or doublet at the chest, used as a pocket"}
          - {w: "pergamino", d: "parchment"}
          - {w: "topar con", d: "to come upon, find"}
