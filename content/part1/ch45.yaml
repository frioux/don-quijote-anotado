  - sentences:
      - es: "— Venid acá, gente soez y malnacida: ¿saltear de caminos llamáis al dar libertad a los encadenados, soltar los presos, acorrer a los miserables, alzar los caídos, remediar los menesterosos?"
        literal: "— Come here, people vile and ill-born: highway-robbery of roads you-call [to]-the giving freedom to the chained, releasing the prisoners, succouring [to] the wretched, raising the fallen, relieving the needy?"
        ormsby: "“Come now, base, ill-born brood; call ye it highway robbery to give freedom to those in bondage, to release the captives, to succour the miserable, to raise up the fallen, to relieve the needy?"
        vocab:
          - {w: "venid acá", d: "come here: a rhetorical 'now look here', not a real invitation"}
          - {w: "soez", d: "vile, base, coarse"}
          - {w: "malnacido", d: "ill-born, low-born: a class insult"}
          - {w: "saltear (de caminos)", d: "to rob on the highway, waylay travellers"}
          - {w: "encadenado", d: "chained man: the galley slaves he freed"}
          - {w: "acorrer", d: "= socorrer, to help, succour (old form)"}
          - {w: "menesteroso", d: "needy, poor"}
        diagram:
          - s: "Venid acá"
            r: "main verb 1: come here"
            under:
              - {s: "gente soez y malnacida", r: "who is addressed: vile, low-born rabble"}
          - s: "¿saltear de caminos llamáis"
            r: "main verb 2: do you call (it) highway robbery"
            under:
              - s: "al dar libertad a los encadenados"
                r: "object: giving freedom to the chained"
                under:
                  - {s: "soltar los presos", r: "and: releasing the prisoners"}
                  - {s: "acorrer a los miserables", r: "and: succouring the wretched"}
                  - {s: "alzar los caídos", r: "and: raising the fallen"}
                  - {s: "remediar los menesterosos?", r: "and: relieving the needy"}
        forms:
          - {w: "Venid", f: "ven- + -id → venir (to come), imperative, you (vosotros, the officers): 'come!'. The vosotros imperative swaps the final -r of the infinitive for -d: venid, mirad, decid."}
          - {w: "malnacida", f: "mal (badly) + nacida, participle of nacer (to be born), feminine to match 'gente'; 'gente' is feminine singular even when it means many people."}
          - {w: "llamáis", f: "llam- + -áis → llamar (to call), present, you (vosotros). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "al dar", f: "a + el + infinitive: the infinitive used as a noun, 'the giving'; 'llamar X a Y' = to call Y X."}
          - {w: "encadenados, caídos", f: "participles of encadenar (to chain) and caer (to fall), used as nouns with 'los': 'the chained', 'the fallen'."}
          - {w: "soltar, acorrer, alzar, remediar", f: "infinitives used as nouns in a list after 'al dar': soltar (to release), acorrer (to succour), alzar (to raise), remediar (to relieve)."}
        note: "Don Quijote's list is the knight's creed of the romances: free the captive, help the wretched, raise the fallen, relieve the needy. To him the galley slaves of chapter 22 were simply captives in chains."
      - es: "¡Ah gente infame, digna por vuestro bajo y vil entendimiento que el cielo no os comunique el valor que se encierra en la caballería andante, ni os dé a entender el pecado e ignorancia en que estáis en no reverenciar la sombra, cuanto más la asistencia, de cualquier caballero andante!"
        literal: "Ah people infamous, worthy for your low and vile understanding that the heaven not to-you may-communicate the worth that itself-shuts-in in the chivalry errant, nor to-you may-give to understand the sin and ignorance in which you-are in not revering the shadow, how-much more the presence, of any knight errant!"
        ormsby: "Infamous beings, who by your vile grovelling intellects deserve that heaven should not make known to you the virtue that lies in knight-errantry, or show you the sin and ignorance in which ye lie when ye refuse to respect the shadow, not to say the presence, of any knight-errant!"
