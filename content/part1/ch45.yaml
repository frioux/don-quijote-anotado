summary: |
  The quarrel over the barber's basin and packsaddle goes on at the inn. The barber who owns them appeals to the company, and Master Nicolás, the village barber, decides to keep the joke going: as a man of his trade and an old soldier, he declares that the basin is no basin but a helmet, though not a whole one. The priest, Cardenio, Don Fernando and his friends all agree, and the wretched owner cries out that a whole university would be amazed. Don Quijote, who calls the packsaddle a packsaddle, says the castle is so enchanted that he will not judge, and Don Fernando gravely takes a secret vote and announces that it is a horse's caparison.

  The outsiders who are not in on the joke, Don Luis's servants and three newly arrived officers of the Holy Brotherhood, cannot believe it. One officer swears it is a packsaddle and that anyone who says otherwise must be drunk; Don Quijote calls him a liar and smashes his pike on the ground missing the man's head. A general brawl breaks out: the innkeeper, himself a member of the Brotherhood, sides with the officers, the barber and Sancho fight over the packsaddle, Don Luis punches a servant, Don Fernando tramples an officer, and the women scream and faint. Don Quijote, thinking himself in the discord of Agramante's camp, roars for peace and calls on the judge and the priest to play kings Agramante and Sobrino. Peace returns; the packsaddle stays a caparison, the basin a helmet and the inn a castle.

  The judge, the priest and Don Fernando settle the affair of Don Luis: Don Fernando tells the servants who he is and offers to take the young man to Andalusia, and three of them ride home to tell his father while the fourth stays behind with him.

  Then the devil, unhappy with the peace, stirs up new trouble. The officer whom Don Fernando beat remembers that he carries a warrant against Don Quijote for freeing the galley slaves. He reads it slowly, comparing the description with Don Quijote's face, seizes him by the throat and calls for help in the name of the Brotherhood. Don Quijote grabs him by the throat in turn, the inn erupts again, and once Don Fernando has parted them, Don Quijote laughs and lectures the officers: knights-errant are exempt from every law and tax, and it is folly to arrest a man who frees the captive and relieves the needy.
context: |
  The basin and the packsaddle. The quarrel goes back to chapter 21, where Don Quijote took a travelling barber's brass basin for the enchanted helmet of Mambrino, a Moorish king of the Italian romances of Boiardo and Ariosto, whose enchanted helmet Reinaldos (Rinaldo) won, and Sancho swapped his own ass's trappings for the barber's better ones. In chapter 44 that barber walked into the inn and recognised his property. Here the joke changes hands: it is no longer Don Quijote who turns basins into helmets but the sane people around him, who vote the packsaddle into a caparison for their own amusement, while Don Quijote, of all people, says it looks like a packsaddle to him.

  The Holy Brotherhood. The Santa Hermandad was a rural police force reorganised by the Catholic Monarchs in the 1470s to deal with crime on the roads and in open country. Its officers, the 'cuadrilleros', went about in squads ('cuadrillas'), carried a staff of office (the 'varilla' the innkeeper runs to fetch), and could summon any bystander to help with an arrest by calling for 'favor a la Santa Hermandad'. They had a poor reputation, which Don Quijote exploits when he calls them 'ladrones en cuadrilla'. Their warrant goes back to chapter 22, when Don Quijote freed the chain of galley slaves and Sancho feared the Brotherhood would pursue them.

  Taxes and privileges. Don Quijote's tirade at the end is built from the real law of Castile. Hidalgos were exempt from the 'pecho', the direct tax that marked a commoner, and proved it with an 'ejecutoria' won in the courts; nobles and clergy had their own 'fueros' or jurisdictions; and everyone paid the 'alcabala' (sales tax), tolls and ferry fares. 'Chapín de la reina' was a levy raised on a royal marriage, and 'moneda forera' an old tribute in recognition of the king's lordship. Don Quijote claims for knights-errant more privileges than any patent of nobility. His question about castellans who make a knight pay his 'escote' is a sly reminder that he left this very inn without paying in chapter 17.

  Ariosto and the discord of Agramante. In the Orlando Furioso (canto 27, as Ormsby notes) the Saracen champions besieging Paris fall to quarrelling among themselves over a sword, a horse, a shield-device and a lady, until King Agramante, their leader, and King Sobrino try to make peace. Don Quijote's 'sword, horse, eagle, helmet' maps that quarrel onto the inn. The narrator keeps up the joke: peace is restored 'by the authority of Agramante and the prudence of King Sobrino', and the 'enemy of concord' (the devil, as in the Furioso, where Discord is sent to Agramante's camp) at once stirs up a new fight.

  The narrator's games. The chapter title promises that the doubt about the helmet will be 'finally settled, with all truth', and the settling is a fixed vote. The barber's protest, 'allá van leyes', is a proverb, which Ormsby explains: 'laws go as kings like', so the powerful decide. The muddle of the main brawl is told in a single breathless list of verbs, and the officer reads his warrant slowly, word by word, comparing the written description with Don Quijote's face.

  Reading Cervantes' Spanish. The chapter is full of old forms: deste, desta, destos, dellos (de + este, esta, estos, ellos), agora (ahora), efeto (efecto), estraño (extraño), difinitiva and difinición (definitiva, definición), quistión (cuestión), frasis (frase), esento and esención (exento, exención), premática (pragmática), secutoria (ejecutoria), acorrer (socorrer), entrambos (ambos), and infinitives with -rl- turned into -ll- (dalle, dejalle). The future subjunctive appears for open futures and conditions (dijere, fuere, resultare, preguntare); the -ra form serves as a conditional (ayudara, dejara); pronouns hang on verbs that open a clause (Reíase, léase, arrojóle); and 'haber de' means 'to have to'. False friends to watch: mandamiento (warrant), prender (to arrest), prisión (arrest), razones (words), ignorar (not to know), asistencia (presence), ejercicio (calling), luego (at once).
