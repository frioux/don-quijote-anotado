          - {w: "servir de", d: "to serve as, play the part of"}
          - {w: "Sobrino", d: "King Sobrino, the old and wise Saracen king in Ariosto who helps Agramante calm his quarrelling knights"}
          - {w: "poner en paz", d: "to make peace between, reconcile"}
          - {w: "bellaquería", d: "knavery, a disgraceful thing"}
          - {w: "gente principal", d: "people of rank, persons of quality"}
          - {w: "liviano", d: "light, trivial"}
        diagram:
          - s: "Venga"
