        forms:
          - {w: "Imaginando", f: "gerund of imaginar (to imagine): 'imagining, thinking'."}
          - {w: "quiso", f: "quis- + -o → querer (to want), preterite, he. Irregular: quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "certificarse", f: "certificar (to certify) + se (himself), the pronoun hung on the infinitive after 'quiso'."}
          - {w: "traía", f: "tra- + -ía → traer (to carry), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "venían", f: "ven- + -ían → venir (to come), imperfect, they (the marks). Same -ía imperfect: venía, venías, venía, veníamos, veníais, venían."}
          - {w: "sacando", f: "gerund of sacar (to take out): 'taking out'."}
          - {w: "topó", f: "top- + -ó → topar (to come upon), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "buscaba", f: "busc- + -aba → buscar (to look for), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
      - es: "y, poniéndosele a leer de espacio, porque no era buen lector, a cada palabra que leía ponía los ojos en don Quijote, y iba cotejando las señas del mandamiento con el rostro de don Quijote, y halló que, sin duda alguna, era el que el mandamiento rezaba."
        literal: "and, putting-himself-to-it to read slowly, because not he-was good reader, at each word that he-read he-put the eyes on Don Quijote, and he-went comparing the marks of-the warrant with the face of Don Quijote, and he-found that, without doubt any, he-was the-one whom the warrant stated."
        ormsby: "and setting himself to read it deliberately, for he was not a quick reader, as he made out each word he fixed his eyes on Don Quixote, and went on comparing the description in the warrant with his face, and discovered that beyond all doubt he was the person described in it."
        vocab:
