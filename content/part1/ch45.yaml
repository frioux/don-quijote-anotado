  - sentences:
      - es: "— Si ya no es que esto sea burla pesada, no me puedo persuadir que hombres de tan buen entendimiento como son, o parecen, todos los que aquí están, se atrevan a decir y afirmar que ésta no es bacía, ni aquélla albarda;"
        literal: "— If already not it-is that this may-be joke heavy, not myself I-can persuade that men of such good understanding as are, or seem, all those who here are, may-dare to say and affirm that this not is basin, nor that-one packsaddle;"
        ormsby: "“Unless, indeed, this is a deliberate joke, I cannot bring myself to believe that men so intelligent as those present are, or seem to be, can venture to declare and assert that this is not a basin, and that not a packsaddle;"
        vocab:
          - {w: "si ya no es que", d: "unless (it is that)"}
          - {w: "burla pesada", d: "a practical joke, a joke in poor taste ('heavy joke')"}
          - {w: "persuadirse", d: "to bring oneself to believe, be convinced"}
          - {w: "entendimiento", d: "understanding, intelligence"}
          - {w: "atreverse a", d: "to dare to"}
          - {w: "bacía", d: "barber's basin, a shallow bowl with a notch for the neck"}
        diagram:
          - s: "no me puedo persuadir"
            r: "main verb: I cannot bring myself to believe"
            under:
              - {s: "Si ya no es que esto sea burla pesada", r: "condition: unless this is a practical joke"}
              - s: "que hombres de tan buen entendimiento"
                r: "what I cannot believe: that men of such good sense"
                under:
                  - {s: "como son, o parecen, todos los que aquí están", r: "describes 'hombres': as all those here are, or seem to be"}
                  - s: "se atrevan a decir y afirmar"
                    r: "verb of the 'que' clause: should dare to say and assert"
                    under:
                      - {s: "que ésta no es bacía, ni aquélla albarda", r: "what they assert: that this is not a basin, nor that a packsaddle"}
        forms:
          - {w: "es", f: "es → ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "sea", f: "ser (to be), present subjunctive, it: subjunctive after 'si ya no es que' (unless). sea, seas, sea, seamos, seáis, sean."}
          - {w: "puedo", f: "pued- + -o → poder (to be able), present, I. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "me puedo persuadir", f: "persuadir (to persuade) with 'me' (myself) put before 'puedo'; modern Spanish also says 'no puedo persuadirme'."}
          - {w: "parecen, están", f: "parec- + -en → parecer (to seem), present, they: parezco, pareces, parece, parecemos, parecéis, parecen. est- + -án → estar (to be), present, they: estoy, estás, está, estamos, estáis, están."}
          - {w: "se atrevan", f: "atrev- + -an → atreverse (to dare), present subjunctive, they, with 'se': subjunctive because he refuses to believe it. The present subjunctive of -er verbs: -a, -as, -a, -amos, -áis, -an."}
          - {w: "ésta, aquélla", f: "este (this) and aquel (that), feminine to match 'bacía' and 'albarda'; accented as pronouns."}
      - es: "mas, como veo que lo afirman y lo dicen, me doy a entender que no carece de misterio el porfiar una cosa tan contraria de lo que nos muestra la misma verdad y la misma experiencia;"
        literal: "but, as I-see that it they-affirm and it they-say, myself I-give to understand that not lacks of mystery the insisting a thing so contrary of that which to-us shows the same truth and the same experience;"
