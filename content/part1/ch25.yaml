      - es: "y, en acabándola, llamó a Sancho y le dijo que se la quería leer, porque la tomase de memoria, si acaso se le perdiese por el camino, porque de su desdicha todo se podía temer. A lo cual respondió Sancho:"
        literal: "and, on finishing-it, he-called [to] Sancho and to-him said that to-him it he-wanted to-read, so-that it he-might-take by memory, if perhaps itself to-him it-got-lost on the road, because from his misfortune everything itself could fear. To which answered Sancho:"
        ormsby: "and when he had finished it he called to Sancho, saying he wished to read it to him, so that he might commit it to memory, in case of losing it on the road; for with evil fortune like his anything might be apprehended. To which Sancho replied,"
        vocab:
          - {w: "en + gerund", d: "as soon as, on (doing)"}
          - {w: "tomar de memoria", d: "to learn by heart"}
          - {w: "si acaso", d: "in case, if by chance"}
          - {w: "desdicha", d: "misfortune, bad luck"}
          - {w: "a lo cual", d: "to which"}
