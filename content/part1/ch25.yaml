  - sentences:
      - es: "— Contra cuerdos y contra locos está obligado cualquier caballero andante a volver por la honra de las mujeres, cualesquiera que sean, cuanto más por las reinas de tan alta guisa y pro como fue la reina Madásima, a quien yo tengo particular afición por sus buenas partes;"
        literal: "— Against sane-men and against madmen is obliged any knight errant to turn for the honor of the women, whichever that they-be, how-much more for the queens of such high manner and worth as was the queen Madásima, to whom I have particular affection for her good qualities;"
        ormsby: "“Against men in their senses or against madmen,” said Don Quixote, “every knight-errant is bound to stand up for the honour of women, whoever they may be, much more for queens of such high degree and dignity as Queen Madasima, for whom I have a particular regard on account of her amiable qualities;"
        vocab:
          - {w: "cuerdo", d: "sane, sensible (opposite of 'loco')"}
          - {w: "caballero andante", d: "knight-errant"}
          - {w: "cualesquiera que sean", d: "whoever they may be (plural of 'cualquiera')"}
          - {w: "cuanto más", d: "how much more, all the more"}
          - {w: "de alta guisa y pro", d: "of high rank and worth; an old chivalric formula ('guisa' = manner, 'pro' = worth)"}
          - {w: "afición", d: "fondness, affection"}
          - {w: "partes", d: "qualities, gifts (of a person)"}
        diagram:
          - s: "está obligado cualquier caballero andante"
            r: "main verb: any knight-errant is bound"
            under:
              - {s: "Contra cuerdos y contra locos", r: "against whom: against the sane and the mad"}
              - s: "a volver por la honra de las mujeres"
                r: "to do what: to stand up for women's honor"
                under:
                  - {s: "cualesquiera que sean", r: "describes 'mujeres': whoever they are"}
              - s: "cuanto más por las reinas de tan alta guisa y pro"
                r: "all the more: for queens of such high rank"
                under:
                  - s: "como fue la reina Madásima"
                    r: "as: as Queen Madásima was"
                    under:
                      - {s: "a quien yo tengo particular afición por sus buenas partes", r: "describes 'Madásima': for whom I have a special fondness for her good qualities"}
        forms:
          - {w: "está obligado", f: "est- + -á → estar (to be), present, he, + obligado, the participle of obligar (to oblige): 'is bound'. estar: estoy, estás, está, estamos, estáis, están."}
          - {w: "cualquier", f: "cualquiera (any) clipped before a singular noun ('caballero')."}
          - {w: "cualesquiera", f: "the plural of cualquiera: the plural goes in the middle, cual → cuales."}
          - {w: "sean", f: "se- + -an → ser (to be), present subjunctive, they: sea, seas, sea, seamos, seáis, sean."}
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, she: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I: tengo, tienes, tiene, tenemos, tenéis, tienen."}
        note: "There is no speech tag in the Spanish; Ormsby adds 'said Don Quixote'."
      - es: "porque, fuera de haber sido fermosa, además fue muy prudente y muy sufrida en sus calamidades, que las tuvo muchas;"
        literal: "because, outside of having been beautiful, besides she-was very prudent and very long-suffering in her calamities, for them she-had many;"
        ormsby: "for, besides being extremely beautiful, she was very wise, and very patient under her misfortunes, of which she had many;"
        vocab:
          - {w: "fuera de", d: "apart from, besides"}
          - {w: "fermosa", d: "old chivalric spelling of 'hermosa' (beautiful); the f- is the knightly archaism"}
          - {w: "sufrido", d: "long-suffering, patient"}
        diagram:
          - s: "fue muy prudente y muy sufrida"
            r: "main verb: she was very wise and very patient"
            under:
              - {s: "fuera de haber sido fermosa", r: "besides: apart from having been beautiful"}
              - s: "en sus calamidades"
                r: "where: in her misfortunes"
                under:
                  - {s: "que las tuvo muchas", r: "describes 'calamidades': for she had many"}
        forms:
          - {w: "haber sido", f: "infinitive haber + sido, the participle of ser (to be): 'having been', after 'fuera de'."}
          - {w: "fermosa", f: "= hermosa, feminine for Madásima."}
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, she: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "sufrida", f: "participle of sufrir (to suffer) used as an adjective, feminine: 'long-suffering'."}
          - {w: "las tuvo muchas", f: "tuv- + -o → tener (to have), preterite, she, with 'las' repeating 'calamidades': 'she had many of them'. tener: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron."}
      - es: "y los consejos y compañía del maestro Elisabat le fue y le fueron de mucho provecho y alivio para poder llevar sus trabajos con prudencia y paciencia."
        literal: "and the counsels and company of-the master Elisabat to-her was and to-her were of much profit and relief for to-be-able to-bear her troubles with prudence and patience."
        ormsby: "and the counsel and society of the Master Elisabad were a great help and support to her in enduring her afflictions with wisdom and resignation;"
        vocab:
