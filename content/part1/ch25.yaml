          - {w: "desagrade", f: "desagrad- + -e → desagradar (to displease), present subjunctive, it. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "vuestras", f: "'your' (vosotros), feminine plural to match 'ramas'."}
      - es: "¡Oh tú, escudero mío, agradable compañero en más prósperos y adversos sucesos, toma bien en la memoria lo que aquí me verás hacer, para que lo cuentes y recetes a la causa total de todo ello!"
        literal: "Oh you, squire mine, pleasant companion in more prosperous and adverse events, take well in the memory that which here me you-will-see do, so that it you-tell and recite to the cause total of all of-it!"
        ormsby: "Oh, thou, my squire, pleasant companion in my prosperous and adverse fortunes, fix well in thy memory what thou shalt see me do here, so that thou mayest relate and report it to the sole cause of all,”"
        vocab:
