          - {w: "venir a", d: "to end up (doing)"}
          - {w: "contentarse con", d: "to be satisfied with"}
          - {w: "sola", d: "here 'only, mere' ('sola la imitación' = the mere imitation)"}
          - {w: "de daño", d: "harmful, destructive"}
          - {w: "lloro", d: "weeping"}
          - {w: "sentimiento", d: "here grief, lament (not just 'feeling')"}
          - {w: "como el que más", d: "as much as anyone"}
