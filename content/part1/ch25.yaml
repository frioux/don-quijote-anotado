                    under:
                      - {s: "que mi asendereado corazón padece", r: "describes 'pena': that my harried heart suffers"}
        forms:
          - {w: "acrecentará", f: "acrecentar + -á, future, it. The future adds to the infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "moverán", f: "mover + -án, future, they. Same future endings."}
