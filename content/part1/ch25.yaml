          - {w: "celos", d: "jealousy (always plural)"}
          - {w: "aspereza", d: "rough, wild place"}
          - {w: "condición", d: "nature, temper (not 'condition')"}
          - {w: "ingrato", d: "ungrateful; in love poetry, a lady who does not return love"}
          - {w: "término y fin", d: "limit and end, i.e. the height, the ultimate"}
        diagram:
