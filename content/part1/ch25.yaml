  - sentences:
      - es: "— Por lo menos quiero, Sancho, y porque es menester ansí, quiero, digo, que me veas en cueros, y hacer una o dos docenas de locuras, que las haré en menos de media hora, porque, habiéndolas tú visto por tus ojos, puedas jurar a tu salvo en las demás que quisieres añadir;"
        literal: "— At-the least I-want, Sancho, and because it-is need so, I-want, I-say, that me you-see in skins, and to-do one or two dozens of follies, for them I-will-do in less than half hour, so-that, having-them you seen with your eyes, you-can swear at your safety in the rest that you-may-want to-add;"
        ormsby: "“At any rate, Sancho,” said Don Quixote, “I should like—and there is reason for it—I should like thee, I say, to see me stripped to the skin and performing a dozen or two of insanities, which I can get done in less than half an hour; for having seen them with thine own eyes, thou canst then safely swear to the rest that thou wouldst add;"
        vocab:
          - {w: "por lo menos", d: "at least"}
          - {w: "en cueros", d: "stark naked"}
          - {w: "docena", d: "dozen"}
          - {w: "a tu salvo", d: "safely, with a clear conscience"}
          - {w: "los demás", d: "the rest, the others"}
          - {w: "añadir", d: "to add"}
