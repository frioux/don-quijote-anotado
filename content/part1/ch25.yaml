          - {w: "quisieres", f: "quis- + -ieres → querer (to want), future subjunctive, you: 'wherever you may want'. The future subjunctive of -er and -ir verbs: -iere, -ieres, -iere, -iéremos, -iereis, -ieren."}
          - {w: "llevas", f: "llev- + -as → llevar (to carry), present, you. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "escrito", f: "irregular participle of escribir (to write)."}
          - {w: "igualó, costó", f: "igual- + -ó → igualar (to equal), cost- + -ó → costar (to cost), preterite, it. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
