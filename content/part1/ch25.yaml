  - sentences:
      - es: "— Libertad te da el que sin ella queda, ¡oh caballo tan estremado por tus obras cuan desdichado por tu suerte!"
        literal: "— Freedom to-you gives he who without it remains, oh horse as outstanding for your deeds as unfortunate for your luck!"
        ormsby: "“He gives thee freedom who is bereft of it himself, oh steed as excellent in deed as thou art unfortunate in thy lot;"
        vocab:
          - {w: "estremado", d: "old spelling of 'extremado': excellent, outstanding"}
          - {w: "tan ... cuan", d: "as ... as (literary 'tan ... como')"}
          - {w: "desdichado", d: "unfortunate, unhappy"}
        diagram:
          - s: "Libertad te da"
            r: "main verb: gives you freedom (object first)"
            under:
              - {s: "el que sin ella queda", r: "subject: he who is left without it"}
              - {s: "¡oh caballo tan estremado por tus obras cuan desdichado por tu suerte!", r: "address: oh horse as excellent in deeds as unlucky in fortune"}
        forms:
          - {w: "da", f: "dar (to give), present, he: doy, das, da, damos, dais, dan."}
          - {w: "queda", f: "qued- + -a → quedar (to remain), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "ella", f: "'it', standing for 'libertad' (feminine)."}
          - {w: "estremado, desdichado", f: "masculine to match 'caballo'."}
        note: "A paradox in the high style: the knight, now a prisoner of love and of his penance, sets his horse free."
      - es: "Vete por do quisieres, que en la frente llevas escrito que no te igualó en ligereza el Hipogrifo de Astolfo, ni el nombrado Frontino, que tan caro le costó a Bradamante."
        literal: "Go-yourself through where you-may-want, for on the forehead you-carry written that not you equaled in lightness the Hippogriff of Astolfo, nor the named Frontino, which so dear to-her cost to Bradamante."
