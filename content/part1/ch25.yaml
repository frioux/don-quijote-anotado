          - {w: "frente", d: "forehead"}
          - {w: "ligereza", d: "lightness, speed"}
          - {w: "Hipogrifo de Astolfo", d: "the hippogriff, a winged horse-griffin that the English knight Astolfo rides in Ariosto's Orlando furioso"}
          - {w: "nombrado", d: "famous, renowned"}
          - {w: "Frontino", d: "the horse of Ruggiero in Ariosto, which Bradamante (his beloved, a warrior maiden) lost and recovered at great cost"}
          - {w: "costar caro", d: "to cost dear"}
        diagram:
          - s: "Vete"
            r: "main verb: go"
            under:
