  - sentences:
      - es: "Mandará vuestra merced, por esta primera de pollinos, señora sobrina, dar a Sancho Panza, mi escudero, tres de los cinco que dejé en casa y están a cargo de vuestra merced."
        literal: "Will-order your mercy, by this first of donkey-colts, lady niece, to-give to Sancho Panza, my squire, three of the five that I-left at home and are in charge of your mercy."
        ormsby: "“Mistress Niece—By this first of ass-colts please pay to Sancho Panza, my squire, three of the five I left at home in your charge:"
        vocab:
          - {w: "mandará vuestra merced", d: "your grace will order: the formula of a bill of exchange ('please pay')"}
          - {w: "primera", d: "'first of exchange', the first copy of a bill of exchange; here 'first of donkeys'"}
          - {w: "pollino", d: "young donkey, ass-colt"}
          - {w: "a cargo de", d: "in the care of"}
        diagram:
          - s: "Mandará vuestra merced"
            r: "main verb: your grace will order"
            under:
              - {s: "por esta primera de pollinos", r: "by what: by this first bill of donkeys"}
              - {s: "señora sobrina", r: "address: madam niece"}
              - s: "dar a Sancho Panza, mi escudero, tres de los cinco"
                r: "what: to give Sancho Panza, my squire, three of the five"
                under:
                  - {s: "que dejé en casa y están a cargo de vuestra merced", r: "describes 'cinco': that I left at home, in your grace's care"}
        forms:
          - {w: "Mandará", f: "mandar + -á, future, she (vuestra merced): a polite future used as a request. The future adds to the infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "primera", f: "feminine to match an understood 'letra' (bill of exchange)."}
          - {w: "dejé", f: "dej- + -é → dejar (to leave), preterite, I. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "están", f: "est- + -án → estar (to be), present, they: estoy, estás, está, estamos, estáis, están."}
        note: "The order parodies a merchant's bill of exchange: 'pay by this first of exchange ... value received ... and with his receipt it will be well paid'. A bill was issued in duplicate (first and second), hence 'esta primera'."
      - es: "Los cuales tres pollinos se los mando librar y pagar por otros tantos aquí recebidos de contado, que consta, y con su carta de pago serán bien dados."
