summary: |
  Don Quijote leaves the goatherd and rides deeper into the Sierra Morena. Sancho, forbidden to chatter, begs leave to go home; his master lifts the ban, and Sancho at once asks why he quarrelled with the mad Cardenio over Queen Madásima. Don Quijote defends the queen's honor, Sancho answers with a string of proverbs, and Don Quijote tells him to hold his tongue.

  Don Quijote then reveals his plan. Amadís of Gaul, the model of all knights, did penance on the Peña Pobre under the name Beltenebros when his lady Oriana scorned him, and Roland went raving mad when he found that Angelica loved Medoro. Don Quijote will imitate them here, going mad for no reason at all, which is the beauty of it, until Sancho brings back Dulcinea's answer to a letter. Sancho doubts it all, since his master still calls a barber's basin Mambrino's helmet; Don Quijote explains that enchanters make the helmet look like a basin so that no one will steal it.

  At the foot of a lonely peak by a brook Don Quijote chooses his spot, calls on the woodland gods, the nymphs, Dulcinea, the trees and his squire, and unsaddles and frees Rocinante. Sancho will ride Rocinante to El Toboso. With no paper, Don Quijote writes the love letter and an order for three young donkeys (to make up for Sancho's stolen one) in Cardenio's notebook. When he names Dulcinea's parents, Sancho realizes she is Aldonza Lorenzo, a strapping, loud-voiced village girl he knows well, and says so with gusto. Don Quijote answers with the tale of the widow and the lay brother: for what he wants of her, Aldonza is as good as any princess, since poets invent their ladies anyway.

  Don Quijote reads both documents aloud. Sancho refuses to wait three days to watch the madness and sets off, marking the way with broom branches. He comes back after a hundred paces to see at least one mad act, and Don Quijote strips off his breeches and turns two somersaults in his shirt-tails, head down and heels up. Sancho turns Rocinante round, satisfied that he can swear his master is mad.
context: |
  Money, paper and class. The chapter is full of documents. With no paper in the mountains, the letter goes into Cardenio's notebook, to be copied out in a village by a schoolmaster or a sexton, never by a notary, whose cramped 'court hand' no one could read. The order for the donkeys is a parody of a merchant's bill of exchange ('pay by this first of exchange ... for value received ... and with his receipt it will be well paid'), and Don Quijote signs it with only his 'rúbrica', the flourish that, as Ormsby notes, is always part of a Spanish signature. Dulcinea, it turns out, is a peasant girl who throws the iron bar, shouts from the belfry, hackles flax and threshes grain on the threshing floor (Ormsby explains the 'trilla', a toothless harrow dragged over the corn). Her lineage does not matter, says Don Quijote, because no one will investigate it to grant her the habit of a military order: Ormsby notes that proof of hidalguía, noble and 'clean' blood, was required for orders such as Santiago.

  The books. The chapter is built on two famous madnesses of chivalric fiction. In Amadís de Gaula, Amadís, rejected by Oriana after a misunderstanding, retires as a hermit to the Peña Pobre, the 'Poor Rock', and calls himself Beltenebros, 'the fair one of darkness'; his penance is all tears and sighs. In Ariosto's Orlando furioso (canto 23), Orlando finds the names of Angelica and Medoro carved on the trees by a spring, tears off his armor and goes on a naked rampage. Don Quijote hesitates between the two models and in the end does a little of both. He invokes Astolfo's hippogriff and Ruggiero's horse Frontino, Mambrino's helmet from the same Italian poems, and the stock names of pastoral poetry (Amaryllis, Phyllis, Galatea), where Ormsby observes that Cervantes includes the heroine of his own pastoral novel, La Galatea. His theory of imitation, that Homer and Virgil painted heroes not as they were but as they ought to be, is a Renaissance commonplace taken from Aristotle's Poetics.

  The narrator's games and the lost donkey. The chapter shows the seams of the 1605 editions. In the second edition the theft of Sancho's donkey was inserted in chapter 23, but this chapter still sends Sancho off 'with his donkey', and then has him weep for it; Ormsby translates the reading in which Sancho has no ass. The date on the donkey order, 22 August (Ormsby has the twenty-seventh), never mentions a year. The comedy of the chapter turns on two kinds of make-believe: Don Quijote's idea that madness is finer without a cause, and Sancho's cheerful plan to report madness he has not seen; Don Quijote insists that his head-knocks be real, since faking them would be a lie.

  Religion and law. Sancho garbles the Latin of the Office of the Dead ('in hell there is no redemption') into 'nulla est retentio'. Don Quijote says that lying breaks the rules of chivalry 'pena de relasos', on pain of being treated as a relapsed heretic, whom the Inquisition handed over to be burned. He wants his head-knocks 'verdaderas, firmes y valederas', the formula of a legal deed, and Sancho counts the three days as 'pasadas en cosa juzgada', the legal 'res judicata'. Sancho fires off proverbs one after another, which Ormsby numbers from his list; he notes that this is the first of Sancho's volleys of proverbs.

  Names. Dulcinea's real name is Aldonza Lorenzo, daughter of Lorenzo Corchuelo and Aldonza Nogales: a village girl's name, with a surname taken from her father's first name. Sancho mangles Madásima into 'Magimasa', Elisabat into an 'abad' (abbot), and Aesop into 'Guisopete'. Don Quijote signs as 'El Caballero de la Triste Figura', the title Sancho gave him, and Sancho admires how well it fits.

  Reading Cervantes' Spanish. The letter to Dulcinea is written in the archaic language of the romances: 'ferido' and 'fermosura' with the old f-, and words already old in 1605 such as 'pro', 'afincamiento', 'maguer', 'asaz', 'cuita', 'acorrer'. Sancho imitates it with 'ficieron'. Elsewhere the usual archaisms continue: ansí, agora, mesmo, priesa, proprio, luengo, denantes, recebido, trujeres, trayo, contino, sospiro, conflito, perfeción, estremado; contractions with 'de' (dél, della, deste, desto, deso, esotra); -rl- turned into -ll- (hacello, procuralle, rompelle, dalle, decille, oílla, vella, escribilla, cumplilla); pronouns hung on a conjugated verb (Despidióse, Íbanse, llévola, quiérote, asegúrote, píntola, bástame); the old split future 'acabarse ha' for 'se acabará'; the -ra form as a conditional (fuera, pasara, dejara, comiera); and the future subjunctive everywhere (quisiere, anduviéremos, dijeren, imitare, oyere, gustares). Watch for false friends: discreto (wise), honesto (chaste), razones (words), trabajos (hardships), vicioso (lush), admirar (to amaze), trasladar (to copy), curarse (to dress one's wounds), luego (at once), puesto que (although).
