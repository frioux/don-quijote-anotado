      - es: "Cuanto más, que lo más acertado será, para que no me yerres y te pierdas, que cortes algunas retamas de las muchas que por aquí hay y las vayas poniendo de trecho a trecho, hasta salir a lo raso, las cuales te servirán de mojones y señales para que me halles cuando vuelvas, a imitación del hilo del laberinto de Teseo. — Así lo haré —respondió Sancho Panza."
        literal: "How-much more, that the most right will-be, so that not me you-miss and yourself you-lose, that you-cut some brooms of the many that around here there-are and them you-go putting from stretch to stretch, until to-come-out to the open, the which to-you will-serve as boundary-stones and signs so that me you-find when you-return, in imitation of-the thread of-the labyrinth of Theseus. — So it I-will-do —answered Sancho Panza."
        ormsby: "however, not to miss me and lose thyself, the best plan will be to cut some branches of the broom that is so abundant about here, and as thou goest to lay them at intervals until thou hast come out upon the plain; these will serve thee, after the fashion of the clue in the labyrinth of Theseus, as marks and signs for finding me on thy return.” “So I will,” said Sancho Panza,"
        vocab:
          - {w: "acertado", d: "wise, right"}
          - {w: "errar", d: "to miss, fail to find ('yerres' = you miss)"}
          - {w: "retama", d: "broom, a shrub with long green switches"}
          - {w: "de trecho a trecho", d: "at intervals, every so often"}
