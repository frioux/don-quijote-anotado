              - s: "que en la frente llevas escrito"
                r: "why: for you bear written on your forehead"
                under:
                  - s: "que no te igualó en ligereza el Hipogrifo de Astolfo, ni el nombrado Frontino"
                    r: "what is written: that neither Astolfo's hippogriff nor famous Frontino equaled you in speed"
                    under:
