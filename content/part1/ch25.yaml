  - sentences:
      - es: "— Vive Dios, señor Caballero de la Triste Figura, que no puedo sufrir ni llevar en paciencia algunas cosas que vuestra merced dice, y que por ellas vengo a imaginar que todo cuanto me dice de caballerías y de alcanzar reinos e imperios, de dar ínsulas y de hacer otras mercedes y grandezas, como es uso de caballeros andantes, que todo debe de ser cosa de viento y mentira, y todo pastraña, o patraña, o como lo llamáremos."
        literal: "— Lives God, sir Knight of the Sad Figure, that not I-can bear nor carry in patience some things that your mercy says, and that by them I-come to imagine that all as-much-as to-me he-says of chivalries and of to-reach kingdoms and empires, of to-give isles and of to-do other favors and grandeurs, as is custom of knights errant, that all must of to-be thing of wind and lie, and all 'pastraña', or humbug, or as it we-may-call."
        ormsby: "“By the living God, Sir Knight of the Rueful Countenance, I cannot endure or bear with patience some of the things that your worship says; and from them I begin to suspect that all you tell me about chivalry, and winning kingdoms and empires, and giving islands, and bestowing other rewards and dignities after the custom of knights-errant, must be all made up of wind and lies, and all pigments or figments, or whatever we may call them;"
        vocab:
          - {w: "¡vive Dios!", d: "as God lives! (an oath)"}
          - {w: "llevar en paciencia", d: "to bear patiently"}
          - {w: "venir a + infinitive", d: "to come to, end up (doing)"}
          - {w: "ínsula", d: "isle; an old, bookish word from the romances, which Sancho has taken up for the island he was promised"}
          - {w: "merced", d: "favor, reward"}
          - {w: "uso", d: "custom, practice"}
          - {w: "cosa de viento", d: "empty talk, hot air"}
          - {w: "patraña", d: "humbug, tall story; Sancho first says it wrong ('pastraña') and corrects himself"}
        diagram:
          - {s: "Vive Dios, señor Caballero de la Triste Figura", r: "oath and address: as God lives, Sir Knight of the Sad Countenance"}
          - s: "que no puedo sufrir ni llevar en paciencia algunas cosas"
            r: "main verb 1: I cannot bear or put up with some things"
            under:
              - {s: "que vuestra merced dice", r: "describes 'cosas': that your grace says"}
          - s: "y que por ellas vengo a imaginar"
            r: "main verb 2: and because of them I come to think"
            under:
              - s: "que todo cuanto me dice"
                r: "what: that everything you tell me"
                under:
                  - {s: "de caballerías y de alcanzar reinos e imperios, de dar ínsulas y de hacer otras mercedes y grandezas", r: "about what: about chivalry, winning kingdoms and empires, giving isles and other rewards"}
                  - {s: "como es uso de caballeros andantes", r: "as: as knights-errant usually do"}
              - {s: "que todo debe de ser cosa de viento y mentira, y todo pastraña, o patraña, o como lo llamáremos", r: "what I think it is: that it must all be wind and lies and humbug, or whatever we call it"}
        forms:
          - {w: "Vive", f: "viv- + -e → vivir (to live), present, he (God): 'as God lives'. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "puedo", f: "pued- + -o → poder (can), present, I. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "dice", f: "dic- + -e → decir (to say), present, he (vuestra merced): digo, dices, dice, decimos, decís, dicen."}
          - {w: "vengo", f: "veng- + -o → venir (to come), present, I: vengo, vienes, viene, venimos, venís, vienen."}
          - {w: "e", f: "'y' (and) becomes 'e' before a word starting with i ('imperios')."}
          - {w: "debe de ser", f: "deb- + -e → deber (must), present, it, + de + ser: 'it must be' (a guess). The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "llamáremos", f: "llam- + -áremos → llamar (to call), future subjunctive, we: 'whatever we may call it'. The future subjunctive of -ar verbs: -are, -ares, -are, -áremos, -areis, -aren."}
          - {w: "que todo", f: "the 'que' is repeated after the long interruption, as in speech; it picks up 'imaginar que'."}
        note: "Sancho stumbles over the word: 'pastraña, o patraña'. Ormsby imitates the slip with 'pigments or figments'."
      - es: "Porque quien oyere decir a vuestra merced que una bacía de barbero es el yelmo de Mambrino, y que no salga de este error en más de cuatro días, ¿qué ha de pensar, sino que quien tal dice y afirma debe de tener güero el juicio?"
        literal: "Because who may-hear to-say [to] your mercy that a basin of barber is the helmet of Mambrino, and that not he-come-out of this error in more than four days, what has-he to think, but that who such says and affirms must of to-have addled the judgment?"
        ormsby: "for what would anyone think that heard your worship calling a barber’s basin Mambrino’s helmet without ever seeing the mistake all this time, but that one who says and maintains such things must have his brains addled?"
        vocab:
          - {w: "bacía", d: "basin; a barber's basin, with a notch cut in the rim for the customer's neck"}
          - {w: "salir de un error", d: "to get out of a mistake, realize one is wrong"}
          - {w: "más de cuatro días", d: "a good many days, a long time (vague)"}
          - {w: "güero", d: "addled (of an egg that does not hatch); 'tener güero el juicio' = to have addled brains (modern 'huero')"}
        diagram:
          - s: "¿qué ha de pensar"
            r: "main verb: what is he to think ('Porque' = for)"
            under:
              - s: "quien oyere decir a vuestra merced"
                r: "subject: whoever hears your grace say"
                under:
                  - {s: "que una bacía de barbero es el yelmo de Mambrino", r: "what, 1: that a barber's basin is Mambrino's helmet"}
                  - {s: "y que no salga de este error en más de cuatro días", r: "what, 2: and that you don't see your mistake in days"}
              - s: "sino que quien tal dice y afirma debe de tener güero el juicio?"
                r: "but: except that whoever says and maintains it must have addled brains"
        forms:
          - {w: "oyere", f: "oy- + -ere → oír (to hear), future subjunctive, he: 'whoever may hear'. oír: oyere, oyeres, oyere, oyéremos, oyereis, oyeren; the i becomes y between vowels."}
          - {w: "salga", f: "salg- + -a → salir (to come out), present subjunctive, he (vuestra merced). salir: salga, salgas, salga, salgamos, salgáis, salgan."}
          - {w: "ha de pensar", f: "ha (haber, present, he) + de + pensar: 'is he to think'. haber: he, has, ha, hemos, habéis, han."}
          - {w: "dice y afirma", f: "dic- + -e → decir (to say), afirm- + -a → afirmar (to affirm), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "debe de tener", f: "deb- + -e → deber (must), present, he, + de + tener: 'he must have'."}
          - {w: "güero", f: "masculine to match 'juicio'; the adjective is placed before the noun it describes as a predicate: 'to have the judgment addled'."}
        ormsby_note: "In the original it is \"for more than four days,\" to which some commentators, Hartzenbusch among them, object, as not more than one day had passed since the encounter with the barber. But \"more than four\" is a very common phrase to express indefinitely a considerable number, and it is more probably used here vaguely by Sancho in the sense in which I have rendered it."
