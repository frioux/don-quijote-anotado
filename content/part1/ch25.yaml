      - es: "Y muchos piensan que hay tocinos y no hay estacas. Mas, ¿quién puede poner puertas al campo? Cuanto más, que de Dios dijeron."
        literal: "And many think that there-are bacon-sides and not there-are pegs. But, who can put doors to-the field? How-much more, that of God they-said."
        ormsby: "many think there are flitches where there are no hooks; but who can put gates to the open plain? moreover they said of God—”"
        vocab:
          - {w: "tocino", d: "side of bacon, flitch"}
          - {w: "estaca", d: "stake, peg (on which bacon hangs)"}
          - {w: "pensar que hay tocinos y no hay estacas", d: "proverb: to think there are flitches where there aren't even pegs to hang them on; to expect too much"}
          - {w: "poner puertas al campo", d: "proverb: to put doors on the open country, i.e. to try the impossible (here: to stop people talking)"}
          - {w: "de Dios dijeron", d: "start of the proverb 'de Dios dijeron, ¿qué no dirán de mí?': they spoke ill even of God; Sancho is cut off"}
        diagram:
          - s: "muchos piensan"
            r: "main verb 1: many think"
            under:
              - {s: "que hay tocinos y no hay estacas", r: "what: that there are flitches and there are no pegs"}
          - s: "¿quién puede poner puertas al campo?"
            r: "main verb 2 (after 'Mas'): who can put doors on the open country?"
          - s: "de Dios dijeron"
            r: "main verb 3 ('Cuanto más, que' = besides): they spoke of God"
        forms:
          - {w: "piensan", f: "piens- + -an → pensar (to think), present, they. The stem e becomes ie when stressed: pienso, piensas, piensa, pensamos, pensáis, piensan."}
          - {w: "hay", f: "the present of haber used alone: 'there is, there are'."}
          - {w: "puede", f: "pued- + -e → poder (can), present, he. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "al", f: "a + el (to the), contracted."}
          - {w: "dijeron", f: "dij- + -eron → decir (to say), preterite, they: dije, dijiste, dijo, dijimos, dijisteis, dijeron. 'they' is anyone: 'people said'."}
        ormsby_note: "Proverb 226: estacas, literally, stakes or pegs on which to hang them; expressive of unreasonable expectations. Proverb 195."
        note: "This is Sancho's first great string of proverbs, a habit that grows through the book. He leaves the last one unfinished; it means that gossip spares no one, not even God."
  - sentences:
      - es: "— ¡Válame Dios —dijo don Quijote—, y qué de necedades vas, Sancho, ensartando!"
        literal: "— May-avail-me God —said Don Quijote—, and what of stupidities you-go, Sancho, stringing!"
        ormsby: "“God bless me,” said Don Quixote, “what a set of absurdities thou art stringing together!"
        vocab:
          - {w: "¡válame Dios!", d: "God help me! (old form of 'válgame Dios')"}
          - {w: "qué de", d: "how many, what a lot of"}
          - {w: "necedad", d: "piece of foolishness, nonsense"}
          - {w: "ensartar", d: "to string together (beads on a thread); to reel off"}
        diagram:
          - {s: "¡Válame Dios", r: "exclamation: God help me"}
          - {s: "dijo don Quijote", r: "speech tag"}
          - s: "y qué de necedades vas, Sancho, ensartando!"
            r: "main verb: what a lot of nonsense you are stringing together, Sancho"
        forms:
          - {w: "Válame", f: "val- + -a + me → valer (to help, avail), present subjunctive, he (God), with 'me' on the end: 'may God help me'. An old form of 'válgame'; the accent is added when the pronoun is attached."}
          - {w: "vas ... ensartando", f: "vas, from ir (to go), present, you, + ensartando, the gerund of ensartar: 'you keep stringing'. ir: voy, vas, va, vamos, vais, van."}
          - {w: "necedades", f: "necedad (foolishness) + -es: nouns ending in a consonant add -es."}
      - es: "¿Qué va de lo que tratamos a los refranes que enhilas?"
        literal: "What goes from that which we-discuss to the proverbs that you-thread?"
        ormsby: "What has what we are talking about got to do with the proverbs thou art threading one after the other?"
        vocab:
          - {w: "¿qué va de ... a ...?", d: "what has ... got to do with ...? (literally 'what distance is there from ... to ...?')"}
          - {w: "tratar", d: "to discuss, deal with"}
          - {w: "refrán", d: "proverb, saying"}
          - {w: "enhilar", d: "to thread (a needle, beads); to string together"}
        diagram:
          - s: "¿Qué va"
            r: "main verb: what is the connection"
            under:
              - {s: "de lo que tratamos", r: "from what: from what we're discussing"}
              - s: "a los refranes"
                r: "to what: to the proverbs"
                under:
                  - {s: "que enhilas?", r: "describes 'refranes': that you string together"}
        forms:
          - {w: "va", f: "ir (to go), present, it: voy, vas, va, vamos, vais, van."}
          - {w: "tratamos", f: "trat- + -amos → tratar (to discuss), present, we. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "enhilas", f: "enhil- + -as → enhilar (to thread), present, you. Same -ar present."}
      - es: "Por tu vida, Sancho, que calles; y de aquí adelante, entremétete en espolear a tu asno, y deja de hacello en lo que no te importa."
        literal: "By your life, Sancho, that you-be-quiet; and from here forward, meddle-yourself in spurring [to] your ass, and leave off of doing-it in that which not to-you matters."
        ormsby: "for God’s sake hold thy tongue, Sancho, and henceforward keep to prodding thy ass and don’t meddle in what does not concern thee;"
        vocab:
          - {w: "por tu vida", d: "by your life, for heaven's sake (an earnest plea)"}
          - {w: "de aquí adelante", d: "from now on"}
          - {w: "entremeterse en", d: "to busy oneself with, meddle in; modern 'entrometerse'"}
          - {w: "espolear", d: "to spur, urge on"}
          - {w: "dejar de", d: "to stop, leave off (doing)"}
          - {w: "hacello", d: "old form of 'hacerlo' (to do it)"}
        diagram:
          - s: "que calles"
            r: "main verb 1: be quiet ('Por tu vida, Sancho' = I beg you)"
          - s: "entremétete"
            r: "main verb 2 (after 'y'): busy yourself"
            under:
              - {s: "de aquí adelante", r: "when: from now on"}
              - {s: "en espolear a tu asno", r: "with what: with spurring your donkey"}
          - s: "y deja de hacello"
            r: "main verb 3: and stop doing it"
            under:
              - {s: "en lo que no te importa", r: "where: in what is none of your business"}
        forms:
          - {w: "calles", f: "call- + -es → callar (to be quiet), present subjunctive, you, after an understood 'I beg': 'that you be quiet'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
