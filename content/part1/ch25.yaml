          - s: "llamó a Sancho"
            r: "main verb 1: he called Sancho"
            under:
              - {s: "en acabándola", r: "when: as soon as he finished it"}
          - s: "y le dijo"
            r: "main verb 2: and told him"
            under:
              - s: "que se la quería leer"
                r: "what: that he wanted to read it to him"
                under:
                  - {s: "porque la tomase de memoria", r: "purpose: so that he would learn it by heart"}
                  - {s: "si acaso se le perdiese por el camino", r: "condition: in case he lost it on the way"}
                  - {s: "porque de su desdicha todo se podía temer", r: "why: because with his bad luck anything could be feared"}
          - s: "respondió Sancho"
            r: "main verb 3: Sancho answered"
            under:
              - {s: "A lo cual", r: "to what: to which"}
