  - sentences:
      - es: "— No te dé pena ese cuidado —respondió don Quijote—, porque, aunque tuviera, no comiera otra cosa que las yerbas y frutos que este prado y estos árboles me dieren, que la fineza de mi negocio está en no comer y en hacer otras asperezas equivalentes."
