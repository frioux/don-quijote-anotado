          - {w: "vulgo", d: "the common people, the mob"}
          - {w: "manceba", d: "concubine, mistress"}
          - {w: "docientas", d: "old form of 'doscientas' (two hundred), feminine to match an understood 'veces'"}
        diagram:
          - s: "tomó ocasión el vulgo ignorante y mal intencionado"
            r: "main verb 1: the ignorant, ill-meaning mob took occasion"
            under:
              - {s: "de aquí", r: "from what: from this"}
