        ormsby: "“Let not that anxiety trouble thee,” replied Don Quixote, “for even if I had it I should not eat anything but the herbs and the fruits which this meadow and these trees may yield me; the beauty of this business of mine lies in not eating, and in performing other mortifications.”"
