      - es: "¡Oh vosotros, quienquiera que seáis, rústicos dioses que en este inhabitable lugar tenéis vuestra morada, oíd las quejas deste desdichado amante, a quien una luenga ausencia y unos imaginados celos han traído a lamentarse entre estas asperezas, y a quejarse de la dura condición de aquella ingrata y bella, término y fin de toda humana hermosura!"
        literal: "Oh you, whoever that you-may-be, rustic gods who in this uninhabitable place have your dwelling, hear the complaints of-this unhappy lover, whom a long absence and some imagined jealousies have brought to lament-himself among these roughnesses, and to complain-himself of the hard nature of that ungrateful and beautiful [one], limit and end of all human beauty!"
        ormsby: "Oh, ye rural deities, whoever ye be that haunt this lone spot, give ear to the complaint of a wretched lover whom long absence and brooding jealousy have driven to bewail his fate among these wilds and complain of the hard heart of that fair and ungrateful one, the end and limit of all human beauty!"
        vocab:
          - {w: "quienquiera que", d: "whoever"}
          - {w: "rústicos dioses", d: "country gods (fauns, Pan and the like)"}
          - {w: "inhabitable", d: "uninhabitable (not 'habitable')"}
          - {w: "morada", d: "dwelling, home"}
          - {w: "queja", d: "complaint, lament"}
