part: 1
chapter: 25
title_es: "Capítulo XXV. Que trata de las estrañas cosas que en Sierra Morena sucedieron al valiente caballero de la Mancha, y de la imitación que hizo a la penitencia de Beltenebros"
title_en: "Which treats of the strange things that happened to the stout knight of La Mancha in the Sierra Morena, and of his imitation of the penance of Beltenebros"
paragraphs:
  - sentences:
      - es: "Despidióse del cabrero don Quijote, y, subiendo otra vez sobre Rocinante, mandó a Sancho que le siguiese, el cual lo hizo, con su jumento, de muy mala gana."
        literal: "Took-leave-himself of-the goatherd Don Quijote, and, climbing another time upon Rocinante, he-ordered [to] Sancho that him he-should-follow, the which it did, with his donkey, of very bad will."
        ormsby: "Don Quixote took leave of the goatherd, and once more mounting Rocinante bade Sancho follow him, which he having no ass, did very discontentedly."
        ormsby_match: false
        vocab:
          - {w: "despedirse de", d: "to take leave of, say goodbye to"}
          - {w: "cabrero", d: "goatherd"}
          - {w: "subir sobre", d: "to get up on, mount (a horse)"}
          - {w: "el cual", d: "who, which (a formal relative pronoun); here 'and he'"}
          - {w: "jumento", d: "donkey, ass"}
          - {w: "de mala gana", d: "unwillingly, grudgingly (opposite 'de buena gana')"}
        diagram:
          - s: "Despidióse"
            r: "main verb 1: he took his leave"
            under:
              - {s: "del cabrero", r: "of whom: of the goatherd"}
              - {s: "don Quijote", r: "subject, after the verb"}
          - s: "mandó a Sancho"
            r: "main verb 2 (after 'y'): he ordered Sancho"
            under:
              - {s: "subiendo otra vez sobre Rocinante", r: "when: getting back on Rocinante"}
              - s: "que le siguiese"
                r: "what he ordered: that he follow him"
                under:
                  - {s: "el cual lo hizo, con su jumento, de muy mala gana", r: "describes 'Sancho': who did so, with his donkey, very grudgingly"}
        forms:
          - {w: "Despidióse", f: "despid- + -ió + se → despedirse (to take leave), preterite, he, with 'se' stuck on the end; modern 'se despidió'. Cervantes often hangs the pronoun on a verb that opens the clause. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron; the stem e becomes i in despidió."}
          - {w: "del", f: "de + el (of the), the one contraction modern Spanish keeps."}
          - {w: "subiendo", f: "gerund of subir (to climb, mount): 'getting up'."}
          - {w: "mandó", f: "mand- + -ó → mandar (to order), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "siguiese", f: "sigu- + -iese → seguir (to follow), imperfect subjunctive (-se form), he: 'that he should follow'. Subjunctive after an order in the past ('mandó que'). The -se imperfect subjunctive of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen; the stem e becomes i."}
          - {w: "hizo", f: "hacer (to do), preterite, he. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "muy mala", f: "mal- + -a → malo (bad), feminine to match 'gana'."}
        note: "Sancho's donkey has been stolen (chapter 23), yet here he follows 'with his donkey': the donkey's disappearance and return are a famous muddle between the two editions of 1605. Ormsby translates the reading in which Sancho has no ass."
      - es: "Íbanse poco a poco entrando en lo más áspero de la montaña, y Sancho iba muerto por razonar con su amo, y deseaba que él comenzase la plática, por no contravenir a lo que le tenía mandado; mas, no pudiendo sufrir tanto silencio, le dijo:"
        literal: "They-were-going-themselves little by little entering into the most rugged of the mountain, and Sancho went dead for to-talk with his master, and he-wished that he should-begin the talk, for not to-go-against [to] that which him he-had ordered; but, not being-able to-bear so-much silence, to-him he-said:"
        ormsby: "They proceeded slowly, making their way into the most rugged part of the mountain, Sancho all the while dying to have a talk with his master, and longing for him to begin, so that there should be no breach of the injunction laid upon him; but unable to keep silence so long he said to him:"
        vocab:
          - {w: "poco a poco", d: "little by little, slowly"}
          - {w: "áspero", d: "rough, rugged; 'lo más áspero' = the roughest part"}
          - {w: "ir muerto por", d: "to be dying to (do something)"}
          - {w: "razonar", d: "to talk, converse (not 'to reason')"}
          - {w: "plática", d: "talk, conversation"}
          - {w: "contravenir", d: "to go against, break (an order)"}
          - {w: "tener mandado", d: "to have ordered (an old perfect: 'le tenía mandado' = he had ordered him)"}
          - {w: "mas", d: "but (literary; no accent; 'más' is 'more')"}
          - {w: "sufrir", d: "to bear, put up with"}
        diagram:
          - s: "Íbanse poco a poco entrando"
            r: "main verb 1: they were gradually going in"
            under:
              - {s: "en lo más áspero de la montaña", r: "where: into the roughest part of the mountain"}
          - s: "Sancho iba muerto"
            r: "main verb 2 (after 'y'): Sancho was dying"
            under:
              - {s: "por razonar con su amo", r: "for what: to talk with his master"}
          - s: "deseaba"
            r: "main verb 3 (after 'y'): he wished"
            under:
              - {s: "que él comenzase la plática", r: "what: that he (Don Quijote) would begin the talk"}
              - {s: "por no contravenir a lo que le tenía mandado", r: "why: so as not to break what he had ordered him"}
          - s: "le dijo"
            r: "main verb 4 (after 'mas'): he said to him"
            under:
              - {s: "no pudiendo sufrir tanto silencio", r: "why: not being able to stand so much silence"}
        forms:
          - {w: "Íbanse", f: "ib- + -an + se → irse (to go along), imperfect, they, with 'se' stuck on the end; modern 'se iban'. ir is irregular in the imperfect: iba, ibas, iba, íbamos, ibais, iban. With the gerund 'entrando' it means 'they were going in'."}
          - {w: "entrando", f: "gerund of entrar (to enter)."}
          - {w: "iba", f: "ib- + -a → ir (to go), imperfect, he: iba, ibas, iba, íbamos, ibais, iban. 'iba muerto' = he went along dying (to talk)."}
          - {w: "muerto", f: "participle of morir (to die), used as an adjective: 'dead', i.e. dying with desire."}
          - {w: "deseaba", f: "dese- + -aba → desear (to wish), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "comenzase", f: "comenz- + -ase → comenzar (to begin), imperfect subjunctive (-se form), he. Subjunctive after a wish ('deseaba que'). The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "tenía mandado", f: "ten- + -ía → tener (to have), imperfect, he, + mandado, the participle of mandar (to order): 'he had ordered'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "pudiendo", f: "gerund of poder (to be able); the stem o becomes u: poder → pudiendo."}
          - {w: "dijo", f: "decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
        note: "After the fulling-mill adventure (chapter 20) Don Quijote had told Sancho to talk to him less; that order is the 'entredicho' (ban) they now argue about."
  - sentences:
      - es: "— Señor don Quijote, vuestra merced me eche su bendición y me dé licencia;"
        literal: "— Sir Don Quijote, your mercy me may-throw his blessing and me may-give leave;"
        ormsby: "“Señor Don Quixote, give me your worship’s blessing and dismissal,"
        vocab:
          - {w: "vuestra merced", d: "'your grace', the polite 'you'; takes he/she verb forms and 'su' for 'your' (modern 'usted')"}
          - {w: "echar la bendición", d: "to give one's blessing (as at a parting)"}
          - {w: "dar licencia", d: "to give leave, permission to go"}
        diagram:
          - s: "vuestra merced me eche su bendición"
            r: "main verb 1: may your grace give me your blessing"
          - s: "y me dé licencia"
            r: "main verb 2: and give me leave"
        forms:
          - {w: "eche", f: "ech- + -e → echar (to throw, give), present subjunctive, he (vuestra merced), used as a polite command. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "dé", f: "dar (to give), present subjunctive, he (vuestra merced): dé, des, dé, demos, deis, den. The accent tells it from 'de' (of)."}
          - {w: "su", f: "'your' when the 'you' is vuestra merced: the possessive of the polite form is 'su'."}
      - es: "que desde aquí me quiero volver a mi casa, y a mi mujer y a mis hijos, con los cuales, por lo menos, hablaré y departiré todo lo que quisiere;"
        literal: "for from here myself I-want to-return to my house, and to my wife and to my children, with the which, at-the least, I-will-talk and I-will-chat all that which I-may-want;"
        ormsby: "for I’d like to go home at once to my wife and children with whom I can at any rate talk and converse as much as I like;"
        vocab:
          - {w: "volverse", d: "to go back, return home"}
          - {w: "por lo menos", d: "at least"}
          - {w: "departir", d: "to chat, converse (old; not 'to depart')"}
        diagram:
          - s: "me quiero volver"
            r: "main verb: I want to go back ('que' = for)"
            under:
              - {s: "desde aquí", r: "from where: from here"}
              - s: "a mi casa, y a mi mujer y a mis hijos"
                r: "where to: home, to my wife and children"
                under:
                  - s: "con los cuales, por lo menos, hablaré y departiré"
                    r: "describes 'mujer' and 'hijos': with whom at least I will talk and chat"
                    under:
                      - {s: "todo lo que quisiere", r: "how much: all I like"}
        forms:
          - {w: "me quiero volver", f: "quier- + -o → querer (to want), present, I, + volver (to return) with 'me': 'I want to go back'. The pronoun can sit before 'quiero' or on the end of 'volver'. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "los cuales", f: "masculine plural relative ('whom') to match 'hijos' and the family."}
          - {w: "hablaré y departiré", f: "hablar (to talk) + -é, departir (to chat) + -é: future, I. The future adds to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "quisiere", f: "quis- + -iere → querer (to want), future subjunctive, I: 'whatever I may want'. The future subjunctive of -er and -ir verbs: -iere, -ieres, -iere, -iéremos, -iereis, -ieren. Cervantes uses it for an open future after 'lo que', 'si', 'cuando'; modern Spanish uses the present subjunctive 'quiera'."}
      - es: "porque querer vuestra merced que vaya con él por estas soledades, de día y de noche, y que no le hable cuando me diere gusto es enterrarme en vida."
        literal: "because to-want your mercy that I-go with him through these solitudes, by day and by night, and that not to-him I-speak when to-me it-may-give pleasure is to-bury-me in life."
        ormsby: "for to want me to go through these solitudes day and night and not speak to you when I have a mind is burying me alive."
        vocab:
          - {w: "soledad", d: "lonely place, wilderness (plural 'soledades')"}
          - {w: "de día y de noche", d: "by day and by night"}
          - {w: "dar gusto", d: "to please; 'cuando me diere gusto' = whenever I feel like it"}
          - {w: "enterrar en vida", d: "to bury alive"}
        diagram:
          - s: "es enterrarme en vida"
            r: "main verb: is burying me alive"
            under:
              - s: "querer vuestra merced"
                r: "subject: your grace's wanting"
                under:
                  - {s: "que vaya con él por estas soledades, de día y de noche", r: "what you want, 1: that I go with you through these wilds day and night"}
                  - s: "y que no le hable"
                    r: "what you want, 2: and that I not speak to you"
                    under:
                      - {s: "cuando me diere gusto", r: "when: whenever I feel like it"}
        forms:
          - {w: "querer", f: "infinitive (to want) used as a noun, with its own subject 'vuestra merced' after it: 'your grace's wanting'."}
          - {w: "vaya", f: "vay- + -a → ir (to go), present subjunctive, I. Subjunctive after 'querer que'. ir in the present subjunctive: vaya, vayas, vaya, vayamos, vayáis, vayan."}
          - {w: "él, le", f: "'him', meaning vuestra merced: the polite 'you' is spoken of in the he-forms, so 'con él' = with you, 'le hable' = I speak to you."}
          - {w: "hable", f: "habl- + -e → hablar (to speak), present subjunctive, I. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "diere", f: "d- + -iere → dar (to give), future subjunctive, it: 'whenever it may please me'. The future subjunctive of -er and -ir verbs (dar takes them too): -iere, -ieres, -iere, -iéremos, -iereis, -ieren; modern 'dé'."}
          - {w: "enterrarme", f: "enterrar (to bury) + me (me): the infinitive with the pronoun on the end."}
      - es: "Si ya quisiera la suerte que los animales hablaran, como hablaban en tiempos de Guisopete, fuera menos mal, porque departiera yo con mi jumento lo que me viniera en gana, y con esto pasara mi mala ventura;"
        literal: "If now should-want the luck that the animals should-talk, as they-talked in times of Guisopete, it-would-be less bad, because would-chat I with my donkey that which to-me might-come in desire, and with this I-would-pass my bad fortune;"
        ormsby: "If luck would have it that animals spoke as they did in the days of Guisopete, it would not be so bad, because I could talk to Rocinante about whatever came into my head, and so put up with my ill-fortune;"
        ormsby_match: false
        vocab:
          - {w: "si ya quisiera la suerte", d: "if only luck would have it"}
          - {w: "Guisopete", d: "Sancho's mangled name for Aesop (Isopete in old Spanish), the teller of fables in which animals talk"}
          - {w: "venir en gana", d: "to feel like; 'lo que me viniera en gana' = whatever came into my head"}
          - {w: "pasar", d: "here: to get through, endure"}
          - {w: "mala ventura", d: "bad luck, misfortune"}
        diagram:
          - s: "fuera menos mal"
            r: "main verb: it would be less bad"
            under:
              - s: "Si ya quisiera la suerte"
                r: "condition: if only luck would have it"
                under:
                  - {s: "que los animales hablaran", r: "what luck would want: that animals could talk"}
                  - {s: "como hablaban en tiempos de Guisopete", r: "how: as they did in Aesop's time"}
              - s: "porque departiera yo con mi jumento"
                r: "why, 1: because I could chat with my donkey"
                under:
                  - {s: "lo que me viniera en gana", r: "about what: whatever I felt like"}
              - {s: "y con esto pasara mi mala ventura", r: "why, 2: and so I'd get through my bad luck"}
        forms:
          - {w: "quisiera", f: "quis- + -iera → querer (to want), imperfect subjunctive (-ra form), it (la suerte), after 'si'. querer's irregular stem: quisiera, quisieras, quisiera, quisiéramos, quisierais, quisieran."}
          - {w: "hablaran", f: "habl- + -aran → hablar (to talk), imperfect subjunctive (-ra form), they. Subjunctive after 'quisiera que'. The -ra imperfect subjunctive of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran."}
          - {w: "hablaban", f: "habl- + -aban → hablar (to talk), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "fuera", f: "fu- + -era → ser (to be), -ra form used as a conditional: 'it would be'. ser: fuera, fueras, fuera, fuéramos, fuerais, fueran. Cervantes uses the -ra form where modern Spanish puts 'sería'."}
          - {w: "departiera, viniera, pasara", f: "departir (to chat), venir (to come), pasar (to get through), all -ra forms used as conditionals: 'I would chat', 'it might come', 'I would get through'. The -ra endings: -ara, -aras, -ara, -áramos, -arais, -aran for -ar verbs; -iera, -ieras, -iera, -iéramos, -ierais, -ieran for -er and -ir verbs (venir has the stem vin-)."}
        ormsby_note: "I.e. Aesop."
        note: "Ormsby has Sancho talk to Rocinante rather than his donkey; the Spanish says 'mi jumento', though the donkey has just been stolen, another trace of the muddle over the donkey."
      - es: "que es recia cosa, y que no se puede llevar en paciencia, andar buscando aventuras toda la vida y no hallar sino coces y manteamientos, ladrillazos y puñadas, y, con todo esto, nos hemos de coser la boca, sin osar decir lo que el hombre tiene en su corazón, como si fuera mudo."
        literal: "for it-is hard thing, and that not itself can be-carried in patience, to-go seeking adventures all the life and not to-find but kicks and blanketings, brick-blows and punches, and, with all this, ourselves we-have to sew the mouth, without daring to-say that which the man has in his heart, as if he-were mute."
        ormsby: "but it is a hard case, and not to be borne with patience, to go seeking adventures all one’s life and get nothing but kicks and blanketings, brickbats and punches, and with all this to have to sew up one’s mouth without daring to say what is in one’s heart, just as if one were dumb.”"
        vocab:
          - {w: "recio", d: "hard, tough, harsh"}
          - {w: "llevar en paciencia", d: "to bear patiently"}
          - {w: "coz", d: "kick (of an animal); plural 'coces'"}
          - {w: "manteamiento", d: "tossing in a blanket (what happened to Sancho at the inn, chapter 17)"}
          - {w: "ladrillazo", d: "blow from a brick (the suffix -azo = a blow with)"}
          - {w: "puñada", d: "punch"}
          - {w: "coserse la boca", d: "to sew up one's mouth, keep silent"}
          - {w: "osar", d: "to dare"}
          - {w: "el hombre", d: "here 'one', a person in general"}
          - {w: "mudo", d: "mute, dumb"}
        diagram:
          - s: "que es recia cosa, y que no se puede llevar en paciencia"
            r: "main verb: for it is a hard thing, not to be borne patiently"
            under:
              - {s: "andar buscando aventuras toda la vida", r: "subject, 1: to go looking for adventures all one's life"}
              - {s: "y no hallar sino coces y manteamientos, ladrillazos y puñadas", r: "subject, 2: and find nothing but kicks, blanketings, bricks and punches"}
          - s: "nos hemos de coser la boca"
            r: "main verb 2 (after 'y, con todo esto'): we have to sew our mouths shut"
            under:
              - s: "sin osar decir"
                r: "how: without daring to say"
                under:
                  - {s: "lo que el hombre tiene en su corazón", r: "what: what one has in one's heart"}
              - {s: "como si fuera mudo", r: "how: as if one were dumb"}
        forms:
          - {w: "se puede llevar", f: "pued- + -e → poder (can), present, it, + llevar (to bear), with 'se': 'it can be borne' (the 'se' makes it passive). The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "andar buscando", f: "andar (to go about) + buscando, the gerund of buscar (to look for): 'to go around looking for'."}
          - {w: "coces", f: "plural of coz (kick): z becomes c before -es."}
          - {w: "hemos de coser", f: "hemos, from haber, present, we, + de + infinitive: 'we have to sew'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, he (one). Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), he, after 'como si': 'as if he were'. ser: fuera, fueras, fuera, fuéramos, fuerais, fueran."}
  - sentences:
      - es: "— Ya te entiendo, Sancho —respondió don Quijote—: tú mueres porque te alce el entredicho que te tengo puesto en la lengua."
        literal: "— Now you I-understand, Sancho —answered Don Quijote—: you die for-that to-you I-may-lift the ban that on-you I-have put on the tongue."
        ormsby: "“I understand thee, Sancho,” replied Don Quixote; “thou art dying to have the interdict I placed upon thy tongue removed;"
        vocab:
          - {w: "morir por", d: "to be dying for, long to"}
          - {w: "alzar", d: "to lift, raise; here to lift (a ban)"}
          - {w: "entredicho", d: "interdict, ban; a Church term for a prohibition, used jokingly for the order to keep quiet"}
        diagram:
          - {s: "Ya te entiendo, Sancho", r: "main verb 1: I understand you now, Sancho"}
          - {s: "respondió don Quijote", r: "speech tag: Don Quijote answered"}
          - s: "tú mueres"
            r: "main verb 2: you are dying"
            under:
              - s: "porque te alce el entredicho"
                r: "for what: for me to lift the ban"
                under:
                  - {s: "que te tengo puesto en la lengua", r: "describes 'entredicho': that I have put on your tongue"}
        forms:
          - {w: "entiendo", f: "entiend- + -o → entender (to understand), present, I. The stem e becomes ie when stressed: entiendo, entiendes, entiende, entendemos, entendéis, entienden."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "mueres", f: "muer- + -es → morir (to die), present, you. The stem o becomes ue when stressed: muero, mueres, muere, morimos, morís, mueren."}
          - {w: "alce", f: "alc- + -e → alzar (to lift), present subjunctive, I: 'that I may lift'; 'porque' here means 'so that', which takes the subjunctive. z becomes c before e. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "tengo puesto", f: "teng- + -o → tener (to have), present, I, + puesto, the participle of poner (to put), agreeing with 'entredicho': 'I have put'. tener: tengo, tienes, tiene, tenemos, tenéis, tienen."}
      - es: "Dale por alzado y di lo que quisieres, con condición que no ha de durar este alzamiento más de en cuanto anduviéremos por estas sierras."
        literal: "Give-it as lifted and say that which you-may-want, with condition that not has to last this lifting more than in so-far-as we-may-walk through these mountains."
        ormsby: "consider it removed, and say what thou wilt while we are wandering in these mountains.”"
        vocab:
          - {w: "dar por", d: "to consider as, take as; 'dale por alzado' = consider it lifted"}
          - {w: "con condición que", d: "on condition that"}
          - {w: "alzamiento", d: "lifting (of the ban)"}
          - {w: "en cuanto", d: "while, as long as"}
          - {w: "sierra", d: "mountain range"}
        diagram:
          - s: "Dale por alzado"
            r: "main verb 1: consider it lifted"
          - s: "y di"
            r: "main verb 2: and say"
            under:
              - {s: "lo que quisieres", r: "object: whatever you like"}
              - s: "con condición que no ha de durar este alzamiento"
                r: "condition: as long as this lifting does not last"
                under:
                  - {s: "más de en cuanto anduviéremos por estas sierras", r: "how long: beyond the time we are in these mountains"}
        forms:
          - {w: "Dale", f: "da (imperative of dar, to give, for tú) + le (it, the ban): 'consider it'. The command form for tú is mostly the he-form of the present: da, habla, come."}
