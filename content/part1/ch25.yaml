  - sentences:
      - es: "— Éste es el lugar, ¡oh cielos!, que diputo y escojo para llorar la desventura en que vosotros mesmos me habéis puesto."
        literal: "— This is the place, oh heavens!, that I-appoint and I-choose for to-weep the misfortune in which you yourselves me have put."
        ormsby: "“This is the place, oh, ye heavens, that I select and choose for bewailing the misfortune in which ye yourselves have plunged me:"
        vocab:
          - {w: "diputar", d: "to appoint, designate (formal)"}
          - {w: "desventura", d: "misfortune"}
          - {w: "mesmos", d: "old form of 'mismos' (yourselves)"}
        diagram:
          - s: "Éste es el lugar"
            r: "main verb: this is the place"
            under:
              - {s: "¡oh cielos!", r: "address: oh heavens"}
              - s: "que diputo y escojo"
                r: "describes 'lugar': that I appoint and choose"
                under:
                  - s: "para llorar la desventura"
                    r: "purpose: to weep over the misfortune"
                    under:
                      - {s: "en que vosotros mesmos me habéis puesto", r: "describes 'desventura': into which you yourselves have put me"}
        forms:
          - {w: "diputo y escojo", f: "diput- + -o → diputar (to appoint), escoj- + -o → escoger (to choose), present, I; g becomes j before o. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an; of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "vosotros mesmos", f: "'you yourselves' (plural, to the heavens); mesmos = mismos."}
          - {w: "habéis puesto", f: "habéis, from haber, present, you (plural), + puesto, the irregular participle of poner (to put): 'you have put'. haber: he, has, ha, hemos, habéis, han."}
      - es: "Éste es el sitio donde el humor de mis ojos acrecentará las aguas deste pequeño arroyo, y mis continos y profundos sospiros moverán a la contina las hojas destos montaraces árboles, en testimonio y señal de la pena que mi asendereado corazón padece."
        literal: "This is the place where the humor of my eyes will-increase the waters of-this small stream, and my continual and deep sighs will-move at the continual the leaves of-these wild trees, in testimony and sign of the pain that my harried heart suffers."
        ormsby: "this is the spot where the overflowings of mine eyes shall swell the waters of yon little brook, and my deep and endless sighs shall stir unceasingly the leaves of these mountain trees, in testimony and token of the pain my persecuted heart is suffering."
        vocab:
          - {w: "humor", d: "fluid of the body; 'el humor de mis ojos' = my tears"}
          - {w: "acrecentar", d: "to increase, swell"}
          - {w: "deste, destos", d: "= de este, de estos (of this, of these)"}
          - {w: "contino", d: "old form of 'continuo' (continual); 'a la contina' = continually"}
          - {w: "sospiro", d: "old form of 'suspiro' (sigh)"}
          - {w: "montaraz", d: "of the mountains, wild"}
          - {w: "asendereado", d: "harried, worn out with troubles"}
          - {w: "padecer", d: "to suffer"}
        diagram:
          - s: "Éste es el sitio"
            r: "main verb: this is the place"
            under:
              - {s: "donde el humor de mis ojos acrecentará las aguas deste pequeño arroyo", r: "describes 'sitio', 1: where my tears will swell this little stream"}
              - s: "y mis continos y profundos sospiros moverán a la contina las hojas destos montaraces árboles"
                r: "describes 'sitio', 2: and my deep, endless sighs will keep stirring the leaves of these wild trees"
