      - es: "— Paréceme a mí —dijo Sancho— que los caballeros que lo tal ficieron fueron provocados y tuvieron causa para hacer esas necedades y penitencias, pero vuestra merced, ¿qué causa tiene para volverse loco?"
        literal: "— It-seems-to-me to me —said Sancho— that the knights who the such did were provoked and had cause for to-do those follies and penances, but your mercy, what cause has-he for to-turn-himself mad?"
        ormsby: "“It seems to me,” said Sancho, “that the knights who behaved in this way had provocation and cause for those follies and penances; but what cause has your worship for going mad?"
        vocab:
          - {w: "lo tal", d: "such a thing, that sort of thing"}
          - {w: "ficieron", d: "old chivalric form of 'hicieron' (they did); Sancho is aping his master's archaic f-"}
          - {w: "provocar", d: "to provoke"}
          - {w: "volverse loco", d: "to go mad"}
        diagram:
