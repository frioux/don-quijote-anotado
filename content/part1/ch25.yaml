              - s: "por haber vuelto por aquella mi señora"
                r: "why: for having stood up for that lady"
                under:
                  - {s: "que Dios cohonda", r: "describes 'señora': God confound her"}
        forms:
          - {w: "digo", f: "dig- + -o → decir (to say), present, I: digo, dices, dice, decimos, decís, dicen."}
          - {w: "había", f: "hab- + -ía → haber, imperfect, used alone as 'there was'. haber: había, habías, había, habíamos, habíais, habían."}
          - {w: "ayudara, encaminara", f: "ayudar (to help), encaminar (to direct), -ra form after 'si', it (la suerte): 'had helped', 'had sent'. The -ra endings of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran."}
