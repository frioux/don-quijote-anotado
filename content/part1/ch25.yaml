        forms:
          - {w: "seáis", f: "se- + -áis → ser (to be), present subjunctive, you (plural), after 'quienquiera que'. ser: sea, seas, sea, seamos, seáis, sean."}
          - {w: "tenéis", f: "ten- + -éis → tener (to have), present, you (plural): tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "oíd", f: "imperative of oír (to hear) for vosotros: 'hear!'. The vosotros command replaces the -r of the infinitive with -d: oír → oíd, hablar → hablad."}
          - {w: "han traído", f: "han, from haber, present, they, + traído, the participle of traer (to bring): 'have brought'. haber: he, has, ha, hemos, habéis, han."}
          - {w: "lamentarse, quejarse", f: "infinitives with 'se' on the end (to lament, to complain), after 'a'."}
          - {w: "ingrata y bella", f: "feminine adjectives used as a noun: 'that ungrateful, beautiful one'."}
      - es: "¡Oh vosotras, napeas y dríadas, que tenéis por costumbre de habitar en las espesuras de los montes, así los ligeros y lascivos sátiros, de quien sois, aunque en vano, amadas, no perturben jamás vuestro dulce sosiego, que me ayudéis a lamentar mi desventura, o, a lo menos, no os canséis de oílla!"
        literal: "Oh you, wood-nymphs and dryads, who have as custom of to-dwell in the thickets of the mountains, so the nimble and lustful satyrs, by whom you-are, although in vain, loved, not may-disturb ever your sweet calm, that me you-help to lament my misfortune, or, at the least, not yourselves you-tire of to-hear-it!"
        ormsby: "Oh, ye wood nymphs and dryads, that dwell in the thickets of the forest, so may the nimble wanton satyrs by whom ye are vainly wooed never disturb your sweet repose, help me to lament my hard fate or at least weary not at listening to it!"
        vocab:
