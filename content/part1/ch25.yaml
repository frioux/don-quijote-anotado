  - sentences:
      - es: "— Señor —respondió Sancho—, y ¿es buena regla de caballería que andemos perdidos por estas montañas, sin senda ni camino, buscando a un loco, el cual, después de hallado, quizá le vendrá en voluntad de acabar lo que dejó comenzado, no de su cuento, sino de la cabeza de vuestra merced y de mis costillas, acabándonoslas de romper de todo punto?"
        literal: "— Sir —answered Sancho—, and is-it good rule of chivalry that we-go-about lost through these mountains, without path nor road, seeking [to] a madman, the which, after of found, perhaps to-him will-come in will to finish that which he-left begun, not of his story, but of the head of your mercy and of my ribs, finishing-for-us-them of to-break of all point?"
        ormsby: "“Señor,” replied Sancho, “is it a good rule of chivalry that we should go astray through these mountains without path or road, looking for a madman who when he is found will perhaps take a fancy to finish what he began, not his story, but your worship’s head and my ribs, and end by breaking them altogether for us?”"
        vocab:
          - {w: "andar perdido", d: "to wander lost"}
          - {w: "senda", d: "path, track"}
          - {w: "venir en voluntad de", d: "to take a fancy to, feel like"}
          - {w: "dejar comenzado", d: "to leave half-done, leave unfinished"}
          - {w: "costilla", d: "rib"}
          - {w: "acabar de", d: "here: to finish (doing); 'acabar de romper' = to finish breaking"}
          - {w: "de todo punto", d: "completely, altogether"}
        diagram:
          - s: "¿es buena regla de caballería"
            r: "main verb: is it a good rule of chivalry"
            under:
              - {s: "respondió Sancho", r: "speech tag"}
              - s: "que andemos perdidos por estas montañas, sin senda ni camino"
                r: "subject: that we wander lost in these mountains without path or road"
                under:
                  - s: "buscando a un loco"
                    r: "how: looking for a madman"
                    under:
                      - s: "el cual, después de hallado, quizá le vendrá en voluntad"
                        r: "describes 'loco': who, once found, may take it into his head"
                        under:
                          - s: "de acabar lo que dejó comenzado"
                            r: "to do what: to finish what he left half-done"
                            under:
                              - {s: "no de su cuento, sino de la cabeza de vuestra merced y de mis costillas", r: "which thing: not his story but your head and my ribs"}
                              - {s: "acabándonoslas de romper de todo punto?", r: "how: finishing breaking them for us completely"}
        forms:
          - {w: "andemos", f: "and- + -emos → andar (to go about), present subjunctive, we, after 'es buena regla que'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "perdidos", f: "participle of perder (to lose), masculine plural for 'we': 'lost'."}
          - {w: "buscando", f: "gerund of buscar (to look for)."}
          - {w: "hallado", f: "participle of hallar (to find): 'después de hallado' = after [being] found."}
          - {w: "vendrá", f: "vendr- + -á → venir (to come), future, it. venir has the future stem vendr-: vendré, vendrás, vendrá, vendremos, vendréis, vendrán."}
          - {w: "dejó comenzado", f: "dej- + -ó → dejar (to leave), preterite, he, + comenzado, the participle of comenzar (to begin): 'he left begun'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "acabándonoslas", f: "acabando, the gerund of acabar (to finish), + nos (for us) + las (them, the ribs and head), with an accent added: three pieces in one word."}
