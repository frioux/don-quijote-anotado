          - {w: "ficieron", f: "= hicieron: fic- + -ieron → facer, the old form of hacer (to do), preterite, they: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "fueron provocados", f: "fueron (ser, to be, preterite, they) + provocados (participle of provocar, to provoke): passive 'were provoked'. ser: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "tuvieron", f: "tuv- + -ieron → tener (to have), preterite, they: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron."}
          - {w: "esas", f: "'those' (near you), feminine plural: ese, esa, esos, esas."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, he (vuestra merced): tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "volverse", f: "volver (to turn) + se: the infinitive with 'se' on the end, 'to go (mad)'."}
