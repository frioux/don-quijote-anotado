          - {w: "ha conducido", f: "ha (haber, present, it) + conducido, the participle of conducir (to lead): 'has led'. haber: he, has, ha, hemos, habéis, han."}
          - {w: "al que", f: "a + el que: 'to that which'."}
      - es: "¡Oh solitarios árboles, que desde hoy en adelante habéis de hacer compañía a mi soledad, dad indicio, con el blando movimiento de vuestras ramas, que no os desagrade mi presencia!"
        literal: "Oh solitary trees, which from today on you-have to make company to my solitude, give sign, with the soft movement of your branches, that not to-you displeases my presence!"
        ormsby: "Oh, lonely trees, that from this day forward shall bear me company in my solitude, give me some sign by the gentle movement of your boughs that my presence is not distasteful to you!"
