          - {w: "ayudéis", f: "ayud- + -éis → ayudar (to help), present subjunctive, you (plural), after an understood 'I beg that'. Same -e subjunctive endings."}
          - {w: "os canséis", f: "cans- + -éis → cansarse (to tire), present subjunctive, you (plural), with 'os' (yourselves): a negative command."}
          - {w: "oílla", f: "= oírla: oír + la, with -rl- turned into -ll-."}
      - es: "¡Oh Dulcinea del Toboso, día de mi noche, gloria de mi pena, norte de mis caminos, estrella de mi ventura, así el cielo te la dé buena en cuanto acertares a pedirle, que consideres el lugar y el estado a que tu ausencia me ha conducido, y que con buen término correspondas al que a mi fe se le debe!"
        literal: "Oh Dulcinea of Toboso, day of my night, glory of my pain, north of my roads, star of my fortune, so the heaven to-you it may-give good in as-much-as you-may-manage to ask-it, that you-consider the place and the state to which your absence me has led, and that with good manner you-respond to-that which to my faith itself to-it is-owed!"
        ormsby: "Oh, Dulcinea del Toboso, day of my night, glory of my pain, guide of my path, star of my fortune, so may Heaven grant thee in full all thou seekest of it, bethink thee of the place and condition to which absence from thee has brought me, and make that return in kindness that is due to my fidelity!"
        vocab:
