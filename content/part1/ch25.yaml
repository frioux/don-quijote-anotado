  - sentences:
      - es: "— ¿Ya no te he dicho —respondió don Quijote— que quiero imitar a Amadís, haciendo aquí del desesperado, del sandio y del furioso, por imitar juntamente al valiente don Roldán, cuando halló en una fuente las señales de que Angélica la Bella había cometido vileza con Medoro, de cuya pesadumbre se volvió loco y arrancó los árboles, enturbió las aguas de las claras fuentes, mató pastores, destruyó ganados, abrasó chozas, derribó casas, arrastró yeguas y hizo otras cien mil insolencias, dignas de eterno nombre y escritura?"
        literal: "— Already not to-you I-have said —answered Don Quijote— that I-want to-imitate [to] Amadís, making here of-the desperate, of-the witless and of-the furious, for to-imitate together [to]-the brave Don Roldán, when he-found in a spring the signs of that Angélica the Fair had committed vileness with Medoro, from whose grief himself he-turned mad and he-tore-up the trees, he-muddied the waters of the clear springs, he-killed shepherds, he-destroyed flocks, he-burned huts, he-knocked-down houses, he-dragged mares and he-did other hundred thousand outrages, worthy of eternal name and writing?"
        ormsby: "“Have I not told thee,” answered Don Quixote, “that I mean to imitate Amadís here, playing the victim of despair, the madman, the maniac, so as at the same time to imitate the valiant Don Roland, when at the fountain he had evidence of the fair Angelica having disgraced herself with Medoro and through grief thereat went mad, and plucked up trees, troubled the waters of the clear springs, slew shepherds, destroyed flocks, burned down huts, levelled houses, dragged mares after him, and perpetrated a hundred thousand other outrages worthy of everlasting renown and record?"
        vocab:
          - {w: "hacer del ...", d: "to play the ..., act the part of ...; 'haciendo del desesperado' = playing the desperate man"}
          - {w: "sandio", d: "witless, crazed"}
          - {w: "furioso", d: "raving mad; the word in the title Orlando furioso"}
          - {w: "juntamente", d: "at the same time, also"}
          - {w: "don Roldán", d: "Roland (Orlando), Charlemagne's paladin; in Ariosto's Orlando furioso (1532) he goes mad when he learns that Angelica loves Medoro"}
          - {w: "Angélica la Bella", d: "Angelica the Fair, the princess of Cathay whom Orlando loves in Ariosto's poem"}
          - {w: "Medoro", d: "a humble Moorish soldier whom Angelica nurses and marries; they carve their names on the trees by a spring"}
          - {w: "vileza", d: "base act, disgrace"}
          - {w: "pesadumbre", d: "grief, sorrow"}
          - {w: "enturbiar", d: "to muddy, cloud"}
          - {w: "abrasar", d: "to burn down"}
          - {w: "choza", d: "hut"}
          - {w: "yegua", d: "mare"}
          - {w: "insolencia", d: "outrage, wild deed"}
        diagram:
          - s: "¿Ya no te he dicho"
            r: "main verb: haven't I told you already"
            under:
              - {s: "respondió don Quijote", r: "speech tag"}
              - s: "que quiero imitar a Amadís"
                r: "what I told you: that I want to imitate Amadís"
                under:
                  - {s: "haciendo aquí del desesperado, del sandio y del furioso", r: "how: playing here the desperate, crazed and raving man"}
                  - s: "por imitar juntamente al valiente don Roldán"
                    r: "purpose: so as to imitate brave Roland as well"
                    under:
                      - s: "cuando halló en una fuente las señales"
                        r: "when: when he found at a spring the signs"
                        under:
                          - {s: "de que Angélica la Bella había cometido vileza con Medoro", r: "of what: that Angelica the Fair had disgraced herself with Medoro"}
                          - {s: "de cuya pesadumbre se volvió loco", r: "result: from grief at which he went mad"}
                          - {s: "y arrancó los árboles, enturbió las aguas de las claras fuentes, mató pastores, destruyó ganados, abrasó chozas, derribó casas, arrastró yeguas", r: "and then: tore up trees, muddied springs, killed shepherds, destroyed flocks, burned huts, knocked down houses, dragged mares"}
                          - s: "y hizo otras cien mil insolencias"
                            r: "and: did a hundred thousand other outrages"
                            under:
                              - {s: "dignas de eterno nombre y escritura?", r: "describes 'insolencias': worthy of eternal fame and record"}
        forms:
          - {w: "he dicho", f: "he, from haber, present, I, + dicho, the irregular participle of decir (to say): 'I have told'. haber: he, has, ha, hemos, habéis, han."}
          - {w: "quiero", f: "quier- + -o → querer (to want), present, I: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "haciendo", f: "gerund of hacer (to do; here to play the part)."}
          - {w: "del", f: "de + el, before an adjective used as a noun ('el desesperado' = the desperate man)."}
          - {w: "halló", f: "hall- + -ó → hallar (to find), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "había cometido", f: "hab- + -ía → haber, imperfect, she, + cometido, the participle of cometer (to commit): pluperfect, 'had committed'. haber: había, habías, había, habíamos, habíais, habían."}
          - {w: "cuya", f: "'whose', feminine to match 'pesadumbre' (the thing owned)."}
          - {w: "se volvió", f: "volv- + -ió → volverse (to become), preterite, he: 'he went (mad)'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "arrancó, enturbió, mató, destruyó, abrasó, derribó, arrastró", f: "seven preterites, he: arrancar (to tear up), enturbiar (to muddy), matar (to kill), destruir (to destroy), abrasar (to burn), derribar (to knock down), arrastrar (to drag). The -ar preterite: -é, -aste, -ó, -amos, -asteis, -aron; destruyó takes a y between vowels."}
          - {w: "hizo", f: "hacer (to do), preterite, he: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "dignas", f: "feminine plural to match 'insolencias'."}
        note: "In Orlando furioso, canto 23, Orlando finds Angelica's and Medoro's names carved on the trees and rocks by a spring and runs mad, stripping naked and wrecking the countryside."
      - es: "Y, puesto que yo no pienso imitar a Roldán, o Orlando, o Rotolando (que todos estos tres nombres tenía), parte por parte en todas las locuras que hizo, dijo y pensó, haré el bosquejo, como mejor pudiere, en las que me pareciere ser más esenciales."
        literal: "And, although I not think to-imitate [to] Roldán, or Orlando, or Rotolando (for all these three names he-had), part by part in all the follies that he-did, said and thought, I-will-make the sketch, as best I-may-be-able, in those that to-me may-seem to-be most essential."
        ormsby: "And though I have no intention of imitating Roland, or Orlando, or Rotolando (for he went by all these names), step by step in all the mad things he did, said, and thought, I will make a rough copy to the best of my power of all that seems to me most essential;"
        vocab:
          - {w: "puesto que", d: "although (in Cervantes)"}
          - {w: "pensar + infinitive", d: "to intend to"}
          - {w: "Rotolando", d: "Italian 'Rotolando', another form of Roland's name (Spanish Roldán, Italian Orlando)"}
          - {w: "parte por parte", d: "point by point, in every detail"}
          - {w: "locura", d: "mad act, folly"}
          - {w: "bosquejo", d: "sketch, outline"}
          - {w: "como mejor pudiere", d: "as best I can"}
        diagram:
          - s: "haré el bosquejo"
            r: "main verb: I will make a sketch"
            under:
              - s: "puesto que yo no pienso imitar a Roldán, o Orlando, o Rotolando"
                r: "concession: although I don't intend to imitate Roland"
                under:
                  - {s: "(que todos estos tres nombres tenía)", r: "aside: for he had all three names"}
                  - s: "parte por parte en todas las locuras"
                    r: "how: in every detail of all the mad things"
                    under:
                      - {s: "que hizo, dijo y pensó", r: "describes 'locuras': that he did, said and thought"}
              - {s: "como mejor pudiere", r: "how: as best I can"}
              - {s: "en las que me pareciere ser más esenciales", r: "in which: in those that seem to me most essential"}
        forms:
          - {w: "pienso", f: "piens- + -o → pensar (to intend), present, I. The stem e becomes ie when stressed: pienso, piensas, piensa, pensamos, pensáis, piensan."}
          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "hizo, dijo, pensó", f: "preterite, he: hacer (to do: hice, hiciste, hizo), decir (to say: dije, dijiste, dijo), pensar (to think: -é, -aste, -ó, -amos, -asteis, -aron)."}
          - {w: "haré", f: "har- + -é → hacer (to make), future, I. hacer has the future stem har-: haré, harás, hará, haremos, haréis, harán."}
          - {w: "pudiere", f: "pud- + -iere → poder (can), future subjunctive, I. The future subjunctive of -er and -ir verbs: -iere, -ieres, -iere, -iéremos, -iereis, -ieren; modern 'pueda'."}
          - {w: "pareciere", f: "parec- + -iere → parecer (to seem), future subjunctive, it. Same -iere endings; modern 'parezca'."}
          - {w: "esenciales", f: "esencial + -es, feminine plural to match 'las' (locuras)."}
      - es: "Y podrá ser que viniese a contentarme con sola la imitación de Amadís, que sin hacer locuras de daño, sino de lloros y sentimientos, alcanzó tanta fama como el que más."
        literal: "And it-will-be-able to-be that I-might-come to content-myself with only the imitation of Amadís, who without doing follies of harm, but of weepings and feelings, reached as-much fame as the one that most."
        ormsby: "but perhaps I shall content myself with the simple imitation of Amadís, who without giving way to any mischievous madness but merely to tears and sorrow, gained as much fame as the most famous.”"
        vocab:
