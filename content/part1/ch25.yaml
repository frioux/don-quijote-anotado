            under:
              - {s: "los consejos y compañía del maestro Elisabat", r: "subject: Master Elisabat's advice and company"}
              - {s: "de mucho provecho y alivio", r: "what they were: of great benefit and relief"}
              - {s: "para poder llevar sus trabajos con prudencia y paciencia", r: "for what: to bear her troubles with wisdom and patience"}
        forms:
          - {w: "le fue y le fueron", f: "fue (ser, to be, preterite, it) and fueron (ser, to be, preterite, they), with 'le' (to her). ser: fui, fuiste, fue, fuimos, fuisteis, fueron. Don Quijote pedantically gives the singular verb to 'compañía' and the plural to 'consejos'."}
          - {w: "del", f: "de + el (of the)."}
          - {w: "poder llevar", f: "two infinitives after 'para': 'to be able to bear'."}
      - es: "Y de aquí tomó ocasión el vulgo ignorante y mal intencionado de decir y pensar que ella era su manceba; y mienten, digo otra vez, y mentirán otras docientas, todos los que tal pensaren y dijeren."
        literal: "And from here took occasion the common-people ignorant and ill intentioned of to-say and to-think that she was his concubine; and they-lie, I-say another time, and they-will-lie another two-hundred, all those who such may-think and may-say."
        ormsby: "hence the ignorant and ill-disposed vulgar took occasion to say and think that she was his mistress; and they lie, I say it once more, and will lie two hundred times more, all who think and say so.”"
