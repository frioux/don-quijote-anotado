          - {w: "vestiduras", d: "garments, clothes"}
          - {w: "esparcir", d: "to scatter"}
          - {w: "darse de calabazadas", d: "to bang one's head (against something); 'calabaza' = gourd, i.e. the head"}
          - {w: "peña", d: "rock, crag"}
          - {w: "jaez", d: "sort, kind (literally a horse's harness)"}
          - {w: "admirar", d: "to amaze, astonish (not 'to admire')"}
