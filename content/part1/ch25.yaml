  - sentences:
      - es: "— Eso digo yo —dijo Sancho—: que no había para qué hacer cuenta de las palabras de un loco, porque si la buena suerte no ayudara a vuestra merced y encaminara el guijarro a la cabeza, como le encaminó al pecho, buenos quedáramos por haber vuelto por aquella mi señora, que Dios cohonda."
        literal: "— That say I —said Sancho—: that not there-was for what to-make account of the words of a madman, because if the good luck not had-helped [to] your mercy and had-guided the pebble to the head, as it it-guided to-the chest, fine we-would-have-been for having turned for that my lady, whom God confound."
        ormsby: "“That is what I say,” said Sancho; “there was no occasion for minding the words of a madman; for if good luck had not helped your worship, and he had sent that stone at your head instead of at your breast, a fine way we should have been in for standing up for my lady yonder, God confound her!"
        vocab:
          - {w: "no haber para qué", d: "there is no reason to, no point in"}
          - {w: "hacer cuenta de", d: "to take notice of, pay attention to"}
          - {w: "encaminar", d: "to direct, send on its way"}
          - {w: "buenos quedáramos", d: "ironic: we'd have been in a fine state"}
          - {w: "volver por", d: "to stand up for, defend"}
          - {w: "aquella mi señora", d: "'that lady of mine', said with irony of Queen Madásima"}
          - {w: "cohonder", d: "old form of 'confundir': to confound, destroy; 'que Dios cohonda' = God confound her"}
