  - sentences:
      - es: "— Ahí esta el punto —respondió don Quijote— y ésa es la fineza de mi negocio;"
        literal: "— There is the point —answered Don Quijote— and that is the fineness of my business;"
        ormsby: "“There is the point,” replied Don Quixote, “and that is the beauty of this business of mine;"
        vocab:
          - {w: "ahí está el punto", d: "that's the point, there's the rub"}
          - {w: "fineza", d: "fineness, subtlety, the refined touch"}
          - {w: "negocio", d: "affair, business (not just commerce)"}
        diagram:
          - {s: "Ahí esta el punto", r: "main verb 1: there's the point"}
          - {s: "respondió don Quijote", r: "speech tag"}
          - {s: "y ésa es la fineza de mi negocio", r: "main verb 2: and that is the subtlety of my business"}
        forms:
          - {w: "esta", f: "= está (estar, to be, present, it); the Gutenberg text drops the accent here. estar: estoy, estás, está, estamos, estáis, están."}
          - {w: "ésa", f: "'that one', feminine pronoun standing for the idea; old spelling with an accent."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
      - es: "que volverse loco un caballero andante con causa, ni grado ni gracias:"
        literal: "for to-turn-himself mad a knight errant with cause, neither thanks nor thanks:"
        ormsby: "no thanks to a knight-errant for going mad when he has cause;"
        vocab:
          - {w: "ni grado ni gracias", d: "no credit and no thanks, nothing to be thanked for (an old phrase)"}
        diagram:
          - s: "ni grado ni gracias"
            r: "main clause without a verb: no credit and no thanks ('que' = for)"
            under:
              - {s: "volverse loco un caballero andante con causa", r: "for what: for a knight-errant to go mad with a cause"}
        forms:
          - {w: "volverse", f: "volver (to turn) + se: infinitive used as a noun, with its own subject 'un caballero andante' after it: 'a knight's going mad'."}
      - es: "el toque está desatinar sin ocasión y dar a entender a mi dama que si en seco hago esto, ¿qué hiciera en mojado?"
        literal: "the touch is to-go-crazy without occasion and to-give to understand to my lady that if in dry I-do this, what would-I-do in wet?"
        ormsby: "the thing is to turn crazy without any provocation, and let my lady know, if I do this in the dry, what I would do in the moist;"
        vocab:
          - {w: "el toque está en", d: "the whole point lies in"}
          - {w: "desatinar", d: "to go crazy, lose one's wits"}
          - {w: "sin ocasión", d: "without cause"}
          - {w: "en seco ... en mojado", d: "'in the dry ... in the wet': if I do this without cause, what would I do with one?"}
        diagram:
          - s: "el toque está"
            r: "main verb: the point is"
            under:
              - {s: "desatinar sin ocasión", r: "what, 1: to go crazy without cause"}
              - s: "y dar a entender a mi dama"
                r: "what, 2: and to let my lady understand"
                under:
                  - s: "¿qué hiciera en mojado?"
                    r: "what: what I would do in the wet"
                    under:
                      - {s: "que si en seco hago esto", r: "condition: that if I do this in the dry"}
        forms:
          - {w: "está", f: "est- + -á → estar (to be), present, it: estoy, estás, está, estamos, estáis, están."}
          - {w: "hago", f: "hag- + -o → hacer (to do), present, I: hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "hiciera", f: "hic- + -iera → hacer (to do), -ra form used as a conditional, I: 'what would I do'. hacer: hiciera, hicieras, hiciera, hiciéramos, hicierais, hicieran."}
        ormsby_note: "Probably an allusion to the \"green tree\" and the \"dry.\""
        note: "Ormsby means Luke 23:31: 'if they do these things in a green tree, what shall be done in the dry?'"
      - es: "Cuanto más, que harta ocasión tengo en la larga ausencia que he hecho de la siempre señora mía Dulcinea del Toboso; que, como ya oíste decir a aquel pastor de marras, Ambrosio: quien está ausente todos los males tiene y teme."
        literal: "How-much more, that plenty occasion I-have in the long absence that I-have made from the always lady mine Dulcinea of Toboso; for, as already you-heard to-say to that shepherd of yore, Ambrosio: who is absent all the ills has and fears."
        ormsby: "moreover I have abundant cause in the long separation I have endured from my lady till death, Dulcinea del Toboso; for as thou didst hear that shepherd Ambrosio say the other day, in absence all ills are felt and feared;"
        vocab:
          - {w: "cuanto más que", d: "besides, moreover"}
          - {w: "harto", d: "plenty of, ample"}
          - {w: "la siempre señora mía", d: "my lady forever"}
          - {w: "de marras", d: "the one we know of, the one from the other day"}
          - {w: "Ambrosio", d: "the shepherd who buried his friend Grisóstomo (chapters 13-14)"}
          - {w: "quien está ausente todos los males tiene y teme", d: "a saying: the absent lover suffers every ill and fears every ill"}
        diagram:
          - s: "harta ocasión tengo"
            r: "main verb ('Cuanto más, que' = besides): I have plenty of cause"
            under:
              - s: "en la larga ausencia"
                r: "in what: in the long absence"
                under:
                  - {s: "que he hecho de la siempre señora mía Dulcinea del Toboso", r: "describes 'ausencia': that I have spent away from my lady forever, Dulcinea"}
              - s: "que, como ya oíste decir a aquel pastor de marras, Ambrosio"
                r: "for, as you heard that shepherd Ambrosio say"
                under:
                  - {s: "quien está ausente todos los males tiene y teme", r: "what he said: whoever is absent has and fears every ill"}
        forms:
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "he hecho", f: "he (haber, I) + hecho, the irregular participle of hacer: 'I have made'. haber: he, has, ha, hemos, habéis, han."}
          - {w: "oíste", f: "o- + -íste → oír (to hear), preterite, you: oí, oíste, oyó, oímos, oísteis, oyeron."}
          - {w: "oíste decir a", f: "'oír decir a' = to hear (someone) say; the speaker is marked with 'a'."}
          - {w: "tiene y teme", f: "tien- + -e → tener (to have), tem- + -e → temer (to fear), present, he; the verbs come last, in verse-like order. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
