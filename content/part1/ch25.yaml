      - es: "De mis viñas vengo, no sé nada; no soy amigo de saber vidas ajenas; que el que compra y miente, en su bolsa lo siente."
        literal: "From my vineyards I-come, not I-know nothing; not I-am friend of to-know lives of-others; for he who buys and lies, in his purse it feels."
