          - {w: "freno", d: "bridle, bit"}
          - {w: "silla", d: "saddle (silla de montar)"}
          - {w: "palmada", d: "slap with the open hand"}
          - {w: "ancas", d: "haunches, hindquarters, croup (of a horse)"}
