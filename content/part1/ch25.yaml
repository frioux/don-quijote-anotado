          - {s: "o, a lo menos, no os canséis de oílla!", r: "main verb 2: or at least don't tire of hearing it"}
        forms:
          - {w: "tenéis", f: "ten- + -éis → tener (to have), present, you (plural): tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "perturben", f: "perturb- + -en → perturbar (to disturb), present subjunctive, they: a wish, 'may they never disturb'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "de quien", f: "'by whom'; 'quien' serves for a plural here (old use), and 'de' marks the doer of the passive."}
