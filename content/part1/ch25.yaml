          - {w: "podía", f: "pod- + -ía → poder (can), imperfect, it, with 'se' (one): 'one could fear'. Same -ía imperfect."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
  - sentences:
      - es: "— Escríbala vuestra merced dos o tres veces ahí en el libro y démele, que yo le llevaré bien guardado, porque pensar que yo la he de tomar en la memoria es disparate: que la tengo tan mala que muchas veces se me olvida cómo me llamo."
        literal: "— Write-it your mercy two or three times there in the book and give-me-it, for I it will-carry well kept, because to-think that I it have to take in the memory is nonsense: for it I-have so bad that many times itself to-me forgets how myself I-call."
        ormsby: "“Write it two or three times there in the book and give it to me, and I will carry it very carefully, because to expect me to keep it in my memory is all nonsense, for I have such a bad one that I often forget my own name;"
        vocab:
          - {w: "disparate", d: "nonsense, absurdity"}
          - {w: "olvidársele a uno", d: "to slip one's mind; 'se me olvida' = I forget"}
        diagram:
          - {s: "Escríbala vuestra merced dos o tres veces ahí en el libro", r: "main verb 1: write it two or three times there in the book"}
          - s: "y démele"
            r: "main verb 2: and give it to me"
            under:
              - {s: "que yo le llevaré bien guardado", r: "why: for I'll carry it safely"}
          - s: "es disparate"
            r: "main verb 3 (after 'porque'): is nonsense"
            under:
              - {s: "pensar que yo la he de tomar en la memoria", r: "subject: to think that I'll learn it by heart"}
              - s: "que la tengo tan mala"
                r: "why: for mine (my memory) is so bad"
                under:
