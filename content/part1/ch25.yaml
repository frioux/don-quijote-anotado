        forms:
          - {w: "tomó", f: "tom- + -ó → tomar (to take), preterite, it (the mob). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "era", f: "ser (to be), imperfect, she: era, eras, era, éramos, erais, eran."}
          - {w: "mienten", f: "mient- + -en → mentir (to lie), present, they. The stem e becomes ie when stressed: miento, mientes, miente, mentimos, mentís, mienten."}
          - {w: "mentirán", f: "mentir + -án, future, they. The future adds to the infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "pensaren y dijeren", f: "pensar (to think) + -aren, decir (to say) with the stem dij- + -eren: future subjunctive, they, 'whoever may think and say'. The future subjunctive of -ar verbs: -are, -ares, -are, -áremos, -areis, -aren; of decir: dijere, dijeres, dijere, dijéremos, dijereis, dijeren."}
      - es: "— Ni yo lo digo ni lo pienso —respondió Sancho—: allá se lo hayan; con su pan se lo coman."
        literal: "— Neither I it say nor it think —answered Sancho—: there themselves it may-they-have; with their bread themselves it may-they-eat."
        ormsby: "“I neither say nor think so,” said Sancho; “let them look to it; with their bread let them eat it;"
        vocab:
          - {w: "allá se lo hayan", d: "let them sort it out themselves; that's their affair (proverbial)"}
          - {w: "con su pan se lo coman", d: "proverb: 'let them eat it with their bread', i.e. that is their business, not mine"}
        diagram:
          - s: "Ni yo lo digo ni lo pienso"
            r: "main verb 1: I neither say nor think it"
          - {s: "respondió Sancho", r: "speech tag"}
          - {s: "allá se lo hayan", r: "main verb 2: let them see to it"}
          - {s: "con su pan se lo coman", r: "main verb 3: let them eat it with their bread"}
        forms:
          - {w: "digo", f: "dig- + -o → decir (to say), present, I: digo, dices, dice, decimos, decís, dicen."}
          - {w: "pienso", f: "piens- + -o → pensar (to think), present, I. The stem e becomes ie when stressed: pienso, piensas, piensa, pensamos, pensáis, piensan."}
          - {w: "hayan", f: "hay- + -an → haber (to have; here to settle), present subjunctive, they: 'let them have it out'. haber: haya, hayas, haya, hayamos, hayáis, hayan."}
          - {w: "coman", f: "com- + -an → comer (to eat), present subjunctive, they, as a 'let them' command. The present subjunctive of -er verbs: -a, -as, -a, -amos, -áis, -an."}
          - {w: "se lo", f: "'se' (for themselves) + 'lo' (it): the reflexive 'se' with an object pronoun, in the fixed wording of the proverbs."}
