          - {w: "acabándola", f: "acabando, the gerund of acabar (to finish), + la (it), with an accent added."}
          - {w: "llamó", f: "llam- + -ó → llamar (to call), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "se la", f: "'se' (to him: le becomes se before la) + 'la' (it, the letter)."}
          - {w: "quería", f: "quer- + -ía → querer (to want), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "tomase, perdiese", f: "tom- + -ase → tomar (to take), perd- + -iese → perder (to lose): imperfect subjunctive (-se form), he and it. The -se endings: -ase, -ases, -ase, -ásemos, -aseis, -asen for -ar verbs; -iese, -ieses, -iese, -iésemos, -ieseis, -iesen for -er and -ir verbs."}
