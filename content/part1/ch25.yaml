              - {s: "¡Oh Dulcinea del Toboso, día de mi noche, gloria de mi pena, norte de mis caminos, estrella de mi ventura", r: "address: oh Dulcinea, day of my night, glory of my pain, guide of my roads, star of my fortune"}
              - s: "así el cielo te la dé buena"
