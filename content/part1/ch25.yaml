          - s: "Eso digo yo"
            r: "main verb: that's what I say"
            under:
              - {s: "dijo Sancho", r: "speech tag"}
              - {s: "que no había para qué hacer cuenta de las palabras de un loco", r: "what I say: that there was no reason to heed a madman's words"}
          - s: "buenos quedáramos"
            r: "main verb 2: we'd have been in a fine state"
            under:
              - s: "porque si la buena suerte no ayudara a vuestra merced"
