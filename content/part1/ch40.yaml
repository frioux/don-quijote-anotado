  - sentences:
      - es: "El verdadero Alá te guarde, señora mía, y aquella bendita Marién, que es la verdadera madre de Dios y es la que te ha puesto en corazón que te vayas a tierra de cristianos, porque te quiere bien."
        literal: "The true Allah you may-guard, lady mine, and that blessed Marién, who is the true mother of God and is the-one who to-you has put in heart that you-may-go-yourself to land of Christians, because you she-loves well."
        ormsby: "“The true Allah protect thee, Lady, and that blessed Marien who is the true mother of God, and who has put it into thy heart to go to the land of the Christians, because she loves thee."
        vocab:
          - {w: "Alá", d: "Allah, the Arabic name of God; the captive uses it so Zoraida will feel at home"}
          - {w: "guardar", d: "to keep, protect"}
          - {w: "señora mía", d: "my lady, the polite address"}
          - {w: "bendito", d: "blessed"}
          - {w: "Marién", d: "Maryam, Mary, the Virgin Mary, honored in Islam as the mother of Jesus; Zoraida calls her 'Lela Marién', Lady Mary"}
          - {w: "poner en corazón", d: "to put it into someone's heart, inspire"}
          - {w: "querer bien", d: "to love, wish well"}
        diagram:
          - s: "El verdadero Alá te guarde"
            r: "main verb: may the true Allah keep you"
            under:
              - {s: "señora mía", r: "addressed to: my lady"}
              - s: "y aquella bendita Marién"
                r: "subject 2: and that blessed Mary"
                under:
                  - {s: "que es la verdadera madre de Dios", r: "describes 'Marién': who is the true mother of God"}
                  - s: "y es la que te ha puesto en corazón"
                    r: "describes 'Marién', 2: and is the one who has put it in your heart"
                    under:
                      - {s: "que te vayas a tierra de cristianos", r: "what she put in your heart: that you go to the land of Christians"}
                      - {s: "porque te quiere bien", r: "why: because she loves you"}
        forms:
          - {w: "guarde", f: "guard- + -e → guardar (to keep), present subjunctive, he (Allah): 'may he keep', a wish. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. The verb is singular though it has two subjects (Allah and Mary): it agrees with the nearer one."}
          - {w: "mía", f: "'my', the long possessive after the noun, feminine to match 'señora'."}
          - {w: "bendita", f: "bendit- + -a → bendito, the old participle of bendecir (to bless) used as an adjective, feminine to match 'Marién'."}
          - {w: "es", f: "ser (to be), present, she. soy, eres, es, somos, sois, son."}
          - {w: "te ha puesto", f: "h- + -a → haber (to have, the helper verb), present, she, + puesto, the irregular participle of poner (to put), with 'te' (in you): 'has put'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "te vayas", f: "vay- + -as → irse (to go away), present subjunctive, you (tú), with 'te'. Subjunctive because it is what she inspires you to do. ir in the present subjunctive: vaya, vayas, vaya, vayamos, vayáis, vayan."}
          - {w: "quiere", f: "quier- + -e → querer (to love, want), present, she. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
        note: "The letter is written in Arabic in the familiar 'tú' form, and Ormsby renders it with 'thee' and 'thou'. Mary is honored in the Qur'an, so Zoraida can be a Muslim's daughter and Mary's devotee at once."
