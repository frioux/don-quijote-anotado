      - es: "Y, diciendo esto, sacó del pecho un crucifijo de metal, y con muchas lágrimas juró por el Dios que aquella imagen representaba, en quien él, aunque pecador y malo, bien y fielmente creía, de guardarnos lealtad y secreto en todo cuanto quisiésemos descubrirle, porque le parecía, y casi adevinaba que, por medio de aquella que aquel papel había escrito, había él y todos nosotros de tener libertad, y verse él en lo que tanto deseaba, que era reducirse al gremio de la Santa Iglesia, su madre, de quien como miembro podrido estaba dividido y apartado por su ignorancia y pecado."
