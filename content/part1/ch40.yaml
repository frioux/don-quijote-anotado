          - {w: "obligaban", f: "oblig- + -aban → obligar (to bind), imperfect, they (the pledges). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "encargase", f: "encarg- + -ase → encargar (to entrust), imperfect subjunctive (-se form), I: 'that I might entrust'. Subjunctive because the secret is not yet told. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
        note: "The captive and his comrades have just received, from a reed let down from a Moorish window, gold coins and a paper in Arabic that none of them can read; he needs a translator he can trust."
      - es: "porque suelen algunos renegados, cuando tienen intención de volverse a tierra de cristianos, traer consigo algunas firmas de cautivos principales, en que dan fe, en la forma que pueden, como el tal renegado es hombre de bien, y que siempre ha hecho bien a cristianos, y que lleva deseo de huirse en la primera ocasión que se le ofrezca."
