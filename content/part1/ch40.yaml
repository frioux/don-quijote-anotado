          - s: "yo me determiné"
            r: "main verb: I made up my mind"
            under:
              - {s: "En fin", r: "linking: at last"}
              - s: "de fiarme de un renegado, natural de Murcia"
                r: "to do what: to trust a renegade from Murcia"
                under:
