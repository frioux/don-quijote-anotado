  - sentences:
      - es: "»Y, puesto que a mí y a mis camaradas nos había parecido mejor lo de enviar por la barca a Mallorca, como la mora decía, no osamos contradecirle, temerosos que, si no hacíamos lo que él decía, nos había de descubrir y poner a peligro de perder las vidas, si descubriese el trato de Zoraida, por cuya vida diéramos todos las nuestras."
        literal: "»And, granted that to me and to my comrades to-us had seemed better the [matter] of sending for the boat to Majorca, as the Moorish-woman said, not we-dared to-contradict-him, fearful that, if not we-did that which he said, us he-had to uncover and to-put at danger of losing the lives, if he-should-uncover the dealing of Zoraida, for whose life we-would-give all [of us] the ours."
        ormsby: "But though to me and my comrades it had seemed a better plan to send to Majorca for the vessel, as the Moorish lady suggested, we did not dare to oppose him, fearing that if we did not do as he said he would denounce us, and place us in danger of losing all our lives if he were to disclose our dealings with Zoraida, for whose life we would have all given our own."
        vocab:
          - {w: "puesto que", d: "although (its usual sense in Cervantes; not 'since')"}
          - {w: "lo de", d: "the business of, the idea of; 'lo de enviar' = the plan of sending"}
          - {w: "barca", d: "boat, small vessel"}
          - {w: "Mallorca", d: "Majorca, the Spanish island in the Balearics, the nearest Christian land to Algiers"}
          - {w: "mora", d: "Moorish woman (here Zoraida)"}
          - {w: "osar", d: "to dare"}
          - {w: "contradecir", d: "to contradict, oppose"}
          - {w: "temeroso que", d: "fearful that; modern 'temeroso de que'"}
          - {w: "descubrir", d: "to denounce, give away (a person); to reveal (a secret)"}
          - {w: "poner a peligro de", d: "to put in danger of; modern 'poner en peligro'"}
          - {w: "trato", d: "dealings, secret arrangement (here the correspondence with Zoraida)"}
        diagram:
          - s: "no osamos contradecirle"
            r: "main verb: we did not dare to contradict him (the renegade)"
            under:
              - s: "puesto que a mí y a mis camaradas nos había parecido mejor lo de enviar por la barca a Mallorca"
                r: "concession: although the plan of sending to Majorca for the boat had seemed better to me and my comrades"
                under:
                  - {s: "como la mora decía", r: "how: as the Moorish lady said"}
              - s: "temerosos"
                r: "how: fearful"
                under:
                  - s: "que, si no hacíamos lo que él decía, nos había de descubrir y poner a peligro de perder las vidas"
                    r: "what we feared: that if we did not do as he said, he would denounce us and put our lives in danger"
                    under:
                      - s: "si descubriese el trato de Zoraida"
                        r: "condition: if he revealed the dealings with Zoraida"
                        under:
                          - {s: "por cuya vida diéramos todos las nuestras", r: "describes 'Zoraida': for whose life we would all have given ours"}
        forms:
          - {w: "nos había parecido", f: "hab- + -ía → haber (to have, the helper verb), imperfect, it, + parecido, the participle of parecer (to seem): pluperfect 'had seemed'. haber in the imperfect: había, habías, había, habíamos, habíais, habían. 'nos' = to us, repeating 'a mí y a mis camaradas'."}
          - {w: "decía", f: "dec- + -ía → decir (to say), imperfect, she (the Moorish lady), and again 'él decía', he (the renegade). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "osamos", f: "os- + -amos → osar (to dare), preterite, we. In -ar verbs the 'we' form is the same in present and preterite; here it is the preterite. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "contradecirle", f: "contradecir (to contradict) + le (him, the renegade), the pronoun hung on the infinitive after 'osamos'."}
          - {w: "temerosos", f: "temer (to fear) + the suffix -oso 'full of', masculine plural to match 'we' (the captives)."}
          - {w: "hacíamos", f: "hac- + -íamos → hacer (to do), imperfect, we. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "había de descubrir", f: "hab- + -ía → haber (to have), imperfect, he, + de + descubrir (to denounce): 'he was going to denounce, he would denounce'. haber in the imperfect: había, habías, había, habíamos, habíais, habían. 'poner' (to put) is the second infinitive hung on the same 'había de'."}
          - {w: "descubriese", f: "descubr- + -iese → descubrir (to reveal), imperfect subjunctive (-se form), he, in the 'if' clause. The -se form of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen."}
          - {w: "cuya", f: "cuyo (whose), feminine to match the thing owned, 'vida', not the owner Zoraida."}
          - {w: "diéramos", f: "d- + -iéramos → dar (to give), imperfect subjunctive (-ra form), we, used as a conditional: 'we would have given'. Built on the preterite dieron: diera, dieras, diera, diéramos, dierais, dieran. Cervantes often uses the -ra form where modern Spanish says 'daríamos'."}
          - {w: "las nuestras", f: "'ours', feminine plural to match 'vidas' understood: our lives."}
        note: "The renegade has just insisted on buying a boat in Algiers himself rather than letting one ransomed captive go to Spain for it, since freed captives seldom came back. The captives distrust him but cannot refuse: he knows their secret."
      - es: "Y así, determinamos de ponernos en las manos de Dios y en las del renegado, y en aquel mismo punto se le respondió a Zoraida, diciéndole que haríamos todo cuanto nos aconsejaba, porque lo había advertido tan bien como si Lela Marién se lo hubiera dicho, y que en ella sola estaba dilatar aquel negocio, o ponello luego por obra."
        literal: "And so, we-determined of putting-ourselves in the hands of God and in those of-the renegade, and at that same point itself to-her was-answered to Zoraida, saying-to-her that we-would-do all as-much-as us she-advised, because it she-had pointed-out so well as if Lela Marién to-her it had said, and that in her alone was to-delay that business, or to-put-it at-once to work."
