      - es: "Así como la vi, aunque no podía ver quién la ponía, mostré el papel, como dando a entender que pusiesen el hilo, pero ya venía puesto en la caña, al cual até el papel, y de allí a poco tornó a parecer nuestra estrella, con la blanca bandera de paz del atadillo."
