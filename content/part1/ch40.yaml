  - sentences:
      - es: "»Pues uno de los renegados que he dicho era este mi amigo, el cual tenía firmas de todas nuestras camaradas, donde le acreditábamos cuanto era posible; y si los moros le hallaran estos papeles, le quemaran vivo."
        literal: "»Well one of the renegades that I-have said was this my friend, the which had signatures of all our comrades, where him we-vouched-for as-much-as was possible; and if the Moors on-him had-found these papers, him they-would-have-burned alive."
        ormsby: "This friend of mine, then, was one of these renegades that I have described; he had certificates from all our comrades, in which we testified in his favour as strongly as we could; and if the Moors had found the papers they would have burned him alive."
        vocab:
          - {w: "camarada", d: "comrade; here feminine 'todas nuestras camaradas', the word being treated as feminine as it often was then"}
          - {w: "acreditar", d: "to vouch for, give credit to, recommend"}
          - {w: "cuanto era posible", d: "as much as possible, as strongly as we could"}
          - {w: "moro", d: "Moor: a Muslim of North Africa"}
          - {w: "hallar", d: "to find"}
        diagram:
          - s: "era este mi amigo"
            r: "main verb 1: this friend of mine was"
            under:
              - s: "Pues uno de los renegados"
                r: "what he was: well, one of the renegades"
                under:
                  - {s: "que he dicho", r: "describes 'renegados': that I have described"}
              - s: "el cual tenía firmas de todas nuestras camaradas"
                r: "describes 'amigo': who had signed papers from all our comrades"
                under:
                  - {s: "donde le acreditábamos cuanto era posible", r: "describes 'firmas': in which we vouched for him as strongly as we could"}
          - s: "le quemaran vivo"
            r: "main verb 2 (after 'y'): they would have burned him alive"
            under:
              - {s: "si los moros le hallaran estos papeles", r: "condition: if the Moors had found these papers on him"}
        forms:
          - {w: "he dicho", f: "he (haber (to have, the helper verb), present, I: he, has, ha, hemos, habéis, han) + dicho, the irregular participle of decir (to say): 'I have said'."}
          - {w: "era", f: "ser (to be), imperfect, he. ser's imperfect is irregular: era, eras, era, éramos, erais, eran."}
          - {w: "este mi amigo", f: "este (this) + mi (my) together before the noun, an older pattern; modern Spanish says 'este amigo mío'."}
          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "todas nuestras", f: "tod- + -as → todo (all) and nuestr- + -as → nuestro (our), feminine plural to match 'camaradas'."}
          - {w: "acreditábamos", f: "acredit- + -ábamos → acreditar (to vouch for), imperfect, we. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "hallaran", f: "hall- + -aran → hallar (to find), imperfect subjunctive (-ra form), they, in the 'if' clause: 'if they had found'. The -ra form of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran."}
          - {w: "quemaran", f: "quem- + -aran → quemar (to burn), imperfect subjunctive (-ra form), they, used as a conditional: 'they would have burned'. Same -ra endings: -ara, -aras, -ara, -áramos, -arais, -aran. Cervantes uses the -ra form in both halves of the condition; modern Spanish says 'si le hubieran hallado estos papeles, le habrían quemado'."}
          - {w: "le", f: "'him' as a direct object (leísmo: 'le' for a male person where modern grammar prefers 'lo'); in 'le hallaran' it means 'on him'."}
          - {w: "vivo", f: "viv- + -o → vivo (alive), masculine to match 'le' (the renegade)."}
        note: "To the Moors a renegade caught planning to return to Christendom was an apostate from Islam, and the captive takes it for granted that the penalty would be burning alive."
      - es: "Supe que sabía muy bien arábigo, y no solamente hablarlo, sino escribirlo; pero, antes que del todo me declarase con él, le dije que me leyese aquel papel, que acaso me había hallado en un agujero de mi rancho."
        literal: "I-learned that he-knew very well Arabic, and not only to-speak-it, but to-write-it; but, before that wholly myself I-might-declare with him, to-him I-said that to-me he-might-read that paper, which by-chance myself I-had found in a hole of my hut."
        ormsby: "I knew that he understood Arabic very well, and could not only speak but also write it; but before I disclosed the whole matter to him, I asked him to read for me this paper which I had found by accident in a hole in my cell."
        vocab:
          - {w: "arábigo", d: "Arabic (the language); modern 'árabe'"}
          - {w: "no solamente ... sino", d: "not only ... but also"}
          - {w: "antes que", d: "before (modern 'antes de que')"}
          - {w: "del todo", d: "completely, wholly"}
          - {w: "declararse con", d: "to open one's mind to, confide fully in"}
          - {w: "acaso", d: "by chance (here, not 'perhaps')"}
          - {w: "agujero", d: "hole"}
          - {w: "rancho", d: "the captives' quarters or cell in the bagnio (a soldiers' and sailors' word for a mess or berth)"}
        diagram:
          - s: "Supe"
            r: "main verb 1: I knew, I found out"
            under:
              - s: "que sabía muy bien arábigo"
                r: "what I knew: that he knew Arabic very well"
                under:
                  - {s: "y no solamente hablarlo, sino escribirlo", r: "how far: not only to speak it but to write it"}
          - s: "le dije"
            r: "main verb 2 (after 'pero'): I told him"
            under:
              - {s: "antes que del todo me declarase con él", r: "when: before I opened up to him completely"}
              - s: "que me leyese aquel papel"
                r: "what I told him: to read me that paper"
                under:
                  - {s: "que acaso me había hallado en un agujero de mi rancho", r: "describes 'papel': which I had found (I said) by chance in a hole in my quarters"}
        forms:
          - {w: "Supe", f: "sup- + -e → saber (to know, to find out), preterite, I: in the preterite saber means 'learned, found out'. Irregular: supe, supiste, supo, supimos, supisteis, supieron."}
          - {w: "sabía", f: "sab- + -ía → saber (to know), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "hablarlo, escribirlo", f: "hablar (to speak) and escribir (to write), each with 'lo' (it, Arabic) hung on the infinitive."}
          - {w: "me declarase", f: "declar- + -ase → declararse (to open one's mind), imperfect subjunctive (-se form), I, with 'me'. Subjunctive after 'antes que'. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "dije", f: "dij- + -e → decir (to say, to tell), preterite, I. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "leyese", f: "ley- + -ese → leer (to read), imperfect subjunctive (-se form), he: 'that he should read'; the i between vowels is written y. Subjunctive after 'le dije que' (I told him to), a request. leyese, leyeses, leyese, leyésemos, leyeseis, leyesen."}
          - {w: "me había hallado", f: "hab- + -ía → haber (to have, the helper verb), imperfect, I, + hallado, the participle of hallar (to find), with 'me' (for myself): 'I had found'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
        note: "The captive does not yet trust the renegade with the truth, so he pretends the paper is something he found lying about."
      - es: "Abrióle, y estuvo un buen espacio mirándole y construyéndole, murmurando entre los dientes."
        literal: "He-opened-it, and he-was a good space looking-at-it and construing-it, murmuring between the teeth."
        ormsby: "He opened it and remained some time examining it and muttering to himself as he translated it."
        vocab:
          - {w: "un buen espacio", d: "a good while, quite some time"}
          - {w: "construir", d: "to construe, work out the grammar and meaning of a text (a schoolroom word); usually 'to build'"}
          - {w: "murmurar entre los dientes", d: "to mutter under one's breath"}
        diagram:
          - s: "Abrióle"
            r: "main verb 1: he opened it"
          - s: "y estuvo un buen espacio"
            r: "main verb 2: and he spent a good while"
            under:
              - {s: "mirándole y construyéndole", r: "doing what: looking at it and construing it"}
              - {s: "murmurando entre los dientes", r: "how: muttering under his breath"}
        forms:
          - {w: "Abrióle", f: "abr- + -ió + le → abrir (to open), preterite, he, with 'le' (it, the paper) stuck on the end. Cervantes hangs pronouns on the end of a conjugated verb that opens its clause; modern Spanish says 'lo abrió', with 'lo' for a thing ('le' here is leísmo). The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "estuvo", f: "estuv- + -o → estar (to be), preterite, he. Irregular: estuve, estuviste, estuvo, estuvimos, estuvisteis, estuvieron. With a gerund it means 'spent time doing'."}
          - {w: "mirándole, construyéndole", f: "mirando, gerund of mirar (to look at), and construyendo, gerund of construir (to construe; i between vowels written y), each with 'le' (it) hung on; the accent keeps the stress where it was."}
          - {w: "murmurando", f: "gerund of murmurar (to mutter): 'muttering'."}
      - es: "Preguntéle si lo entendía; díjome que muy bien, y, que si quería que me lo declarase palabra por palabra, que le diese tinta y pluma, porque mejor lo hiciese."
        literal: "I-asked-him if it he-understood; he-told-me that very well, and, that if I-wanted that to-me it he-might-explain word for word, that to-him I-should-give ink and pen, so-that better it he-might-do."
        ormsby: "I asked him if he understood it, and he told me he did perfectly well, and that if I wished him to tell me its meaning word for word, I must give him pen and ink that he might do it more satisfactorily."
        vocab:
