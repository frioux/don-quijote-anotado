      - es: "»En fin, yo me determiné de fiarme de un renegado, natural de Murcia, que se había dado por grande amigo mío, y puesto prendas entre los dos, que le obligaban a guardar el secreto que le encargase;"
        literal: "»In end, I myself determined of to-trust-myself to a renegade, native of Murcia, who himself had given as great friend mine, and put pledges between the two, which him obliged to keep the secret that to-him I-might-entrust;"
