          - {w: "de nación", d: "by birth, by origin"}
          - {w: "hombre de bien", d: "an honest, decent man"}
          - {w: "llegar a", d: "to come to, end up (doing)"}
          - {w: "repartir", d: "to share out, divide"}
          - {w: "testamento", d: "will, testament"}
          - {w: "hijo heredero", d: "heir, one who inherits as a son does"}
          - {w: "cuantos", d: "all who, as many as"}
          - {w: "entrar a la parte", d: "to take a share, come in for a portion"}
          - {w: "los más hijos", d: "the other sons, all the sons (old use of 'más' = 'the rest')"}
          - {w: "difunto", d: "the deceased"}
        diagram:
          - s: "Era calabrés de nación"
            r: "main verb 1: he was Calabrian by birth"
          - {s: "y moralmente fue un hombre de bien", r: "main verb 2: and morally he was a decent man"}
          - s: "y trataba con mucha humanidad a sus cautivos"
            r: "main verb 3: and treated his captives very humanely"
            under:
              - {s: "que llegó a tener tres mil", r: "describes 'cautivos': of whom he came to have three thousand"}
              - s: "los cuales ... se repartieron"
                r: "describes 'cautivos': which were divided"
                under:
                  - {s: "después de su muerte", r: "when: after his death"}
                  - {s: "como él lo dejó en su testamento", r: "how: as he left it in his will"}
                  - s: "entre el Gran Señor"
                    r: "between whom, 1: the Sultan"
                    under:
                      - {s: "(que también es hijo heredero de cuantos mueren, y entra a la parte con los más hijos que deja el difunto)", r: "describes 'Gran Señor': who inherits from everyone who dies and takes a share with the dead man's children"}
