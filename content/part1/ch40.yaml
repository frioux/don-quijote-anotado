          - {w: "tanto ... que", f: "tant- + -o → tanto (so great), masculine to match 'valor', setting up the result clause 'que ...'."}
          - {w: "torpes", f: "torpe + -s, plural to match 'medios y caminos'."}
          - {w: "privados", f: "participle of privar (to be in favor), used as a noun: 'favorites', masculine plural."}
          - {w: "suben", f: "sub- + -en → subir (to rise), present, they. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "vino a ser", f: "vin- + -o → venir (to come), preterite, he, + a + ser (to be): 'came to be'. Irregular: vine, viniste, vino, vinimos, vinisteis, vinieron."}
          - {w: "tercero", f: "'third', in its full form; modern Spanish clips it to 'tercer' before a masculine noun."}
      - es: "Era calabrés de nación, y moralmente fue un hombre de bien, y trataba con mucha humanidad a sus cautivos, que llegó a tener tres mil, los cuales, después de su muerte, se repartieron, como él lo dejó en su testamento, entre el Gran Señor (que también es hijo heredero de cuantos mueren, y entra a la parte con los más hijos que deja el difunto) y entre sus renegados;"
        literal: "He-was Calabrian by nation, and morally he-was a man of good, and he-treated with much humanity [to] his captives, who he-came to have three thousand, which, after his death, were-shared-out, as he it left in his will, between the Great Lord (who also is son heir of as-many-as die, and enters to the share with the most sons that leaves the deceased) and between his renegades;"
        ormsby: "He was a Calabrian by birth, and a worthy man morally, and he treated his slaves with great humanity. He had three thousand of them, and after his death they were divided, as he directed by his will, between the Grand Signor (who is heir of all who die and shares with the children of the deceased) and his renegades."
