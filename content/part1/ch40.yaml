          - {w: "en fin", d: "at last, in the end"}
          - {w: "determinarse de", d: "to make up one's mind to, resolve to (modern 'determinarse a')"}
          - {w: "fiarse de", d: "to trust, confide in"}
          - {w: "renegado", d: "renegade: a Christian who has turned Muslim"}
          - {w: "natural de", d: "a native of, born in"}
          - {w: "Murcia", d: "city and kingdom in south-eastern Spain"}
          - {w: "darse por", d: "to declare oneself, pass oneself off as"}
          - {w: "prenda", d: "pledge, token of good faith; something given as security"}
          - {w: "encargar", d: "to entrust (a task or secret) to someone"}
