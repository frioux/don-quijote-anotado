      - es: "Ofrecímele de nuevo de ser su esposo, y, con esto, otro día que acaeció a estar solo el baño, en diversas veces, con la caña y el paño, nos dio dos mil escudos de oro, y un papel donde decía que el primer jumá, que es el viernes, se iba al jardín de su padre, y que antes que se fuese nos daría más dinero, y que si aquello no bastase, que se lo avisásemos, que nos daría cuanto le pidiésemos:"
