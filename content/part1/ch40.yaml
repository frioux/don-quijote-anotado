  - sentences:
      - es: "»Dimos luego quinientos escudos al renegado para comprar la barca;"
        literal: "»We-gave at-once five-hundred crowns to-the renegade to buy the boat;"
        ormsby: "We at once gave the renegade five hundred crowns to buy the vessel,"
        vocab:
          - {w: "luego", d: "at once, immediately (its usual sense in Cervantes)"}
          - {w: "escudo", d: "crown: a gold coin (literally 'shield', from the arms stamped on it)"}
          - {w: "renegado", d: "renegade: a Christian who has turned Muslim (here the one helping the captives)"}
          - {w: "barca", d: "boat, small vessel"}
        diagram:
          - s: "Dimos luego quinientos escudos"
            r: "main verb: we gave at once five hundred crowns"
            under:
              - {s: "al renegado", r: "to whom: to the renegade"}
              - {s: "para comprar la barca", r: "purpose: to buy the boat"}
        forms:
          - {w: "Dimos", f: "d- + -imos → dar (to give), preterite, we. dar takes -er endings in the preterite: di, diste, dio, dimos, disteis, dieron."}
          - {w: "quinientos", f: "'five hundred', irregular (not 'cincocientos'); it agrees in gender: quinientos escudos, quinientas doblas."}
          - {w: "al", f: "a + el, the contraction modern Spanish still makes."}
          - {w: "comprar", f: "comprar (to buy), infinitive after 'para' (in order to)."}
      - es: "con ochocientos me rescaté yo, dando el dinero a un mercader valenciano que a la sazón se hallaba en Argel, el cual me rescató del rey, tomándome sobre su palabra, dándola de que con el primer bajel que viniese de Valencia pagaría mi rescate;"
        literal: "with eight-hundred myself ransomed I, giving the money to a merchant Valencian who at the season himself found in Algiers, the which me ransomed from-the king, taking-me upon his word, giving-it of that with the first vessel that might-come from Valencia he-would-pay my ransom;"
        ormsby: "and with eight hundred I ransomed myself, giving the money to a Valencian merchant who happened to be in Algiers at the time, and who had me released on his word, pledging it that on the arrival of the first ship from Valencia he would pay my ransom;"
        vocab:
          - {w: "rescatarse", d: "to ransom oneself, buy one's freedom"}
          - {w: "mercader", d: "merchant, trader"}
          - {w: "valenciano", d: "from Valencia, the Spanish port city with regular trade to Algiers"}
          - {w: "a la sazón", d: "at that time, just then"}
          - {w: "hallarse", d: "to be (somewhere), find oneself"}
          - {w: "tomar sobre su palabra", d: "to take on one's word, stand surety for"}
          - {w: "dar la palabra de que", d: "to give one's word that, pledge that"}
          - {w: "bajel", d: "vessel, ship (literary)"}
          - {w: "rescate", d: "ransom"}
        diagram:
          - s: "con ochocientos me rescaté yo"
            r: "main verb: with eight hundred I ransomed myself"
            under:
              - s: "dando el dinero a un mercader valenciano"
                r: "how: giving the money to a Valencian merchant"
                under:
                  - {s: "que a la sazón se hallaba en Argel", r: "describes 'mercader': who was in Algiers at the time"}
                  - s: "el cual me rescató del rey"
                    r: "describes 'mercader', 2: who ransomed me from the king"
                    under:
                      - {s: "tomándome sobre su palabra", r: "how: taking me on his word"}
                      - s: "dándola"
                        r: "how: giving it (his word)"
                        under:
                          - s: "de que con el primer bajel"
                            r: "what he pledged: that with the first ship"
                            under:
                              - {s: "que viniese de Valencia", r: "describes 'bajel': that came from Valencia"}
                              - {s: "pagaría mi rescate", r: "he would pay my ransom"}
        forms:
          - {w: "ochocientos", f: "'eight hundred', agreeing with 'escudos' understood."}
          - {w: "me rescaté", f: "rescat- + -é → rescatarse (to ransom oneself), preterite, I, with 'me'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "dando", f: "gerund of dar (to give): 'giving'."}
          - {w: "se hallaba", f: "hall- + -aba → hallarse (to be, find oneself), imperfect, he, with 'se'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "el cual", f: "'who', masculine to match 'mercader'; a heavier relative than 'que', used after a comma."}
          - {w: "rescató", f: "rescat- + -ó → rescatar (to ransom), preterite, he. Same -ar preterite: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "del", f: "de + el: 'from the'."}
          - {w: "tomándome", f: "tomando, the gerund of tomar (to take), + me, with an accent added to keep the stress: 'taking me'."}
          - {w: "dándola", f: "dando, the gerund of dar (to give), + la (it, feminine for 'palabra'), accent added: 'giving it'."}
          - {w: "primer", f: "primero (first) clipped before a masculine singular noun ('bajel')."}
          - {w: "viniese", f: "vin- + -iese → venir (to come), imperfect subjunctive (-se form), it: 'that should come', an open future seen from the past. Built on the preterite vinieron: viniese, vinieses, viniese, viniésemos, vinieseis, viniesen."}
          - {w: "pagaría", f: "pagar- + -ía → pagar (to pay), conditional, he: 'he would pay'. The conditional adds -ía, -ías, -ía, -íamos, -íais, -ían to the whole infinitive."}
        note: "Merchants trading between Spain and Algiers often advanced or guaranteed ransoms, to be repaid when money came from home. The captive's ransom of eight hundred crowns is paid with Zoraida's gold, disguised as a sum arriving from Spain."
      - es: "porque si luego diera el dinero, fuera dar sospechas al rey que había muchos días que mi rescate estaba en Argel, y que el mercader, por sus granjerías, lo había callado."
        literal: "because if at-once he-had-given the money, it-would-be to-give suspicions to-the king that there-had-been many days that my ransom was in Algiers, and that the merchant, for his profits, it had kept-quiet."
        ormsby: "for if he had given the money at once it would have made the king suspect that my ransom money had been for a long time in Algiers, and that the merchant had for his own advantage kept it secret."
        vocab:
          - {w: "luego", d: "at once, immediately"}
          - {w: "dar sospechas", d: "to arouse suspicion"}
          - {w: "había muchos días que", d: "it had been many days since, for a long time; 'haber' = 'hacer' with time"}
          - {w: "granjería", d: "profit, gain, business advantage"}
          - {w: "callar", d: "to keep quiet about, keep secret"}
        diagram:
          - s: "fuera dar sospechas al rey"
            r: "main verb (after 'porque', explaining the last sentence): it would have aroused the king's suspicion"
            under:
              - {s: "si luego diera el dinero", r: "condition: if he had given the money at once"}
              - {s: "que había muchos días que mi rescate estaba en Argel", r: "what the king would suspect, 1: that my ransom had been in Algiers for a long time"}
              - s: "y que el mercader"
                r: "what the king would suspect, 2: and that the merchant"
                under:
                  - {s: "por sus granjerías", r: "why: for his own profit"}
                  - {s: "lo había callado", r: "had kept it quiet"}
        forms:
          - {w: "diera", f: "d- + -iera → dar (to give), imperfect subjunctive (-ra form), he, in the 'if' clause: 'if he had given'. Built on the preterite dieron: diera, dieras, diera, diéramos, dierais, dieran."}
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), it, used as a conditional: 'it would have been'. fuera, fueras, fuera, fuéramos, fuerais, fueran. Cervantes often uses the -ra form where modern Spanish says 'sería' or 'habría sido'."}
          - {w: "dar", f: "dar (to give), infinitive after 'fuera': 'would be to give', i.e. would give."}
          - {w: "había muchos días", f: "hab- + -ía → haber (to have; alone, 'there is'), imperfect, used alone with a time phrase: 'it had been many days'. haber in the imperfect: había, habías, había, habíamos, habíais, habían. Modern Spanish says 'hacía muchos días'."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, it (the ransom). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "lo había callado", f: "hab- + -ía → haber (to have, the helper verb), imperfect, he, + callado, the participle of callar (to keep quiet): pluperfect 'had kept it quiet'. Same imperfect: había, habías, había, habíamos, habíais, habían."}
        note: "The captive's master was the king of Algiers; had the merchant paid the whole ransom at once, the king would have guessed the money had been in the city for some time and that the merchant had hidden it to trade with."
      - es: "Finalmente, mi amo era tan caviloso que en ninguna manera me atreví a que luego se desembolsase el dinero."
        literal: "Finally, my master was so suspicious that in no manner myself I-dared to [have] that at-once itself might-be-paid-out the money."
        ormsby: "In fact my master was so difficult to deal with that I dared not on any account pay down the money at once."
        vocab:
          - {w: "amo", d: "master, owner"}
          - {w: "caviloso", d: "suspicious, given to brooding and suspicion; captious"}
          - {w: "en ninguna manera", d: "in no way, on no account"}
          - {w: "atreverse a", d: "to dare to"}
          - {w: "desembolsar", d: "to pay out, disburse (literally 'take out of the purse')"}
        diagram:
          - s: "mi amo era tan caviloso"
            r: "main verb: my master was so suspicious"
            under:
              - {s: "Finalmente", r: "linking: in short"}
              - s: "que en ninguna manera me atreví"
                r: "result: that on no account did I dare"
                under:
                  - {s: "a que luego se desembolsase el dinero", r: "what I did not dare: to have the money paid out at once"}
        forms:
          - {w: "Finalmente", f: "final + -mente, the adverb suffix: 'finally, in short'."}
          - {w: "era", f: "ser (to be), imperfect, he. ser's imperfect is irregular: era, eras, era, éramos, erais, eran."}
          - {w: "ninguna", f: "ningun- + -a → ninguno (no), feminine to match 'manera'."}
          - {w: "me atreví", f: "atrev- + -í → atreverse (to dare), preterite, I, with 'me'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "se desembolsase", f: "desembols- + -ase → desembolsar (to pay out), imperfect subjunctive (-se form), it, with passive 'se': 'that the money should be paid out'. Subjunctive after 'atreverse a que'. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
      - es: "El jueves antes del viernes que la hermosa Zoraida se había de ir al jardín, nos dio otros mil escudos y nos avisó de su partida, rogándome que, si me rescatase, supiese luego el jardín de su padre, y que en todo caso buscase ocasión de ir allá y verla."
        literal: "The Thursday before of-the Friday that the beautiful Zoraida herself had to go to-the garden, to-us she-gave another thousand crowns and us she-notified of her departure, begging-me that, if myself I-should-ransom, I-should-find-out at-once the garden of her father, and that in any case I-should-seek occasion of going there and to-see-her."
        ormsby: "The Thursday before the Friday on which the fair Zoraida was to go to the garden she gave us a thousand crowns more, and warned us of her departure, begging me, if I were ransomed, to find out her father’s garden at once, and by all means to seek an opportunity of going there to see her."
        vocab:
          - {w: "haber de", d: "to be going to, be due to; 'se había de ir' = she was to go"}
          - {w: "avisar de", d: "to let know about, inform of"}
          - {w: "partida", d: "departure"}
          - {w: "rogar", d: "to beg, entreat"}
          - {w: "saber", d: "here 'to find out, get to know'"}
          - {w: "en todo caso", d: "in any case, by all means"}
          - {w: "ocasión", d: "opportunity, chance"}
        diagram:
          - s: "nos dio otros mil escudos"
            r: "main verb 1: she gave us another thousand crowns"
            under:
              - s: "El jueves antes del viernes"
                r: "when: on the Thursday before the Friday"
                under:
                  - {s: "que la hermosa Zoraida se había de ir al jardín", r: "describes 'viernes': on which the fair Zoraida was to go to the garden"}
          - s: "y nos avisó de su partida"
            r: "main verb 2: and told us of her departure"
            under:
              - s: "rogándome"
                r: "how: begging me"
                under:
                  - s: "que, si me rescatase, supiese luego el jardín de su padre"
                    r: "what she begged, 1: that, if I was ransomed, I should find out her father's garden at once"
                  - {s: "y que en todo caso buscase ocasión de ir allá y verla", r: "what she begged, 2: and that by all means I should look for a chance to go there and see her"}
        forms:
          - {w: "del", f: "de + el: 'than the', 'before the'."}
          - {w: "hermosa", f: "hermos- + -a → hermoso (beautiful), feminine to match 'Zoraida', placed before the name as an epithet."}
          - {w: "se había de ir", f: "hab- + -ía → haber (to have), imperfect, she, + de + ir (to go) with 'se' (irse, to go off): 'she was to go'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "dio", f: "d- + -io → dar (to give), preterite, she. dar takes -er endings in the preterite: di, diste, dio, dimos, disteis, dieron."}
          - {w: "otros mil", f: "'another thousand': otro (other), masculine plural to match 'escudos'; no 'un' before 'otros'."}
          - {w: "avisó", f: "avis- + -ó → avisar (to inform), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "rogándome", f: "rogando, the gerund of rogar (to beg), + me, with an accent added to keep the stress: 'begging me'."}
          - {w: "me rescatase", f: "rescat- + -ase → rescatarse (to be ransomed, ransom oneself), imperfect subjunctive (-se form), I, in the 'if' clause. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "supiese", f: "sup- + -iese → saber (to find out), imperfect subjunctive (-se form), I, after 'rogar que' (to beg that). Built on the preterite supieron: supiese, supieses, supiese, supiésemos, supieseis, supiesen."}
          - {w: "buscase", f: "busc- + -ase → buscar (to look for), imperfect subjunctive (-se form), I, also after 'rogar que'. Same -ase subjunctive: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "verla", f: "ver (to see) + la (her), the pronoun hung on the infinitive after 'de ir allá y'."}
      - es: "Respondíle en breves palabras que así lo haría, y que tuviese cuidado de encomendarnos a Lela Marién, con todas aquellas oraciones que la cautiva le había enseñado."
        literal: "I-answered-her in brief words that so it I-would-do, and that she-should-have care of commending-us to Lela Marién, with all those prayers that the captive-woman to-her had taught."
        ormsby: "I answered in a few words that I would do so, and that she must remember to commend us to Lela Marien with all the prayers the captive had taught her."
        vocab:
          - {w: "en breves palabras", d: "in a few words, briefly"}
          - {w: "tener cuidado de", d: "to take care to, be sure to"}
          - {w: "encomendar a", d: "to commend to, entrust to (in prayer)"}
          - {w: "Lela Marién", d: "'Lady Mary', the Virgin Mary, as Zoraida calls her (Arabic 'lalla', lady, and 'Maryam')"}
          - {w: "oración", d: "prayer (not 'oration')"}
          - {w: "la cautiva", d: "the woman captive: the Christian slave who nursed Zoraida as a child and taught her the Christian prayers, now dead"}
        diagram:
          - s: "Respondíle"
            r: "main verb: I answered her"
            under:
              - {s: "en breves palabras", r: "how: in a few words"}
              - {s: "que así lo haría", r: "what I answered, 1: that I would do so"}
              - s: "y que tuviese cuidado de encomendarnos a Lela Marién"
                r: "what I answered, 2: and that she should be sure to commend us to Lady Mary"
                under:
                  - s: "con todas aquellas oraciones"
                    r: "with what: with all those prayers"
                    under:
                      - {s: "que la cautiva le había enseñado", r: "describes 'oraciones': that the woman captive had taught her"}
        forms:
          - {w: "Respondíle", f: "respond- + -í + le → responder (to answer), preterite, I, with 'le' (to her) stuck on the end. Cervantes hangs pronouns on the end of a conjugated verb that opens its clause; modern Spanish says 'le respondí'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "breves", f: "breve (short) + -s, plural to match 'palabras', placed before the noun."}
          - {w: "haría", f: "har- + -ía → hacer (to do), conditional, I: 'I would do'. Irregular stem har-: haría, harías, haría, haríamos, haríais, harían."}
          - {w: "tuviese", f: "tuv- + -iese → tener (to have), imperfect subjunctive (-se form), she: 'that she should take (care)', a request reported in the past. Built on the preterite tuvieron: tuviese, tuvieses, tuviese, tuviésemos, tuvieseis, tuviesen."}
          - {w: "encomendarnos", f: "encomendar (to commend) + nos (us), the pronoun hung on the infinitive after 'de'."}
          - {w: "aquellas", f: "aquell- + -as → aquel (that), feminine plural to match 'oraciones'."}
          - {w: "había enseñado", f: "hab- + -ía → haber (to have, the helper verb), imperfect, she, + enseñado, the participle of enseñar (to teach): pluperfect 'had taught'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
  - sentences:
      - es: "»Hecho esto, dieron orden en que los tres compañeros nuestros se rescatasen, por facilitar la salida del baño, y porque, viéndome a mí rescatado, y a ellos no, pues había dinero, no se alborotasen y les persuadiese el diablo que hiciesen alguna cosa en perjuicio de Zoraida;"
        literal: "»Done this, they-gave order in that the three companions ours themselves should-ransom, to make-easy the exit of-the bath, and so-that, seeing-me [to] me ransomed, and [to] them not, since there-was money, not themselves they-should-get-agitated and them should-persuade the devil that they-should-do some thing in harm of Zoraida;"
        ormsby: "This having been done, steps were taken to ransom our three comrades, so as to enable them to quit the baño, and lest, seeing me ransomed and themselves not, though the money was forthcoming, they should make a disturbance about it and the devil should prompt them to do something that might injure Zoraida;"
        vocab:
          - {w: "hecho esto", d: "this done, after this"}
          - {w: "dar orden en", d: "to arrange for, see to it that"}
          - {w: "compañero", d: "companion, comrade (here the three fellow captives in the plot)"}
          - {w: "rescatarse", d: "to be ransomed, buy one's freedom"}
          - {w: "facilitar", d: "to make easy, smooth the way for"}
          - {w: "salida", d: "way out, getting out"}
          - {w: "baño", d: "bagnio: the prison-barracks for slaves in Algiers (literally 'bath')"}
          - {w: "alborotarse", d: "to get agitated, make a fuss, cause a disturbance"}
          - {w: "persuadir", d: "to persuade, prompt, tempt"}
          - {w: "en perjuicio de", d: "to the harm of, against"}
        diagram:
          - s: "dieron orden"
            r: "main verb: they (we) arranged"
            under:
              - {s: "Hecho esto", r: "when: this done"}
              - s: "en que los tres compañeros nuestros se rescatasen"
                r: "what they arranged: that our three companions should be ransomed"
                under:
                  - {s: "por facilitar la salida del baño", r: "why, 1: to make it easier to get out of the bagnio"}
                  - s: "y porque ... no se alborotasen"
                    r: "why, 2: and so that they would not make a fuss"
                    under:
                      - {s: "viéndome a mí rescatado, y a ellos no", r: "when: seeing me ransomed and themselves not"}
                      - {s: "pues había dinero", r: "why they might: since there was money"}
                  - {s: "y les persuadiese el diablo que hiciesen alguna cosa en perjuicio de Zoraida", r: "why, 3 (still under 'porque no'): and so that the devil would not tempt them to do something to harm Zoraida"}
        forms:
          - {w: "Hecho", f: "irregular participle of hacer (to do), in the -o form that goes with neuter 'esto': an absolute phrase, 'this having been done'."}
          - {w: "dieron", f: "d- + -ieron → dar (to give), preterite, they (vague 'they', in fact the captive and his friends). dar takes -er endings in the preterite: di, diste, dio, dimos, disteis, dieron."}
          - {w: "nuestros", f: "nuestr- + -os → nuestro (our), the long possessive after the noun, masculine plural to match 'compañeros'."}
          - {w: "se rescatasen", f: "rescat- + -asen → rescatarse (to be ransomed), imperfect subjunctive (-se form), they, after 'dar orden en que'. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
          - {w: "viéndome", f: "viendo, the gerund of ver (to see), + me, with an accent added to keep the stress: 'seeing me'; 'a mí' repeats the 'me'."}
          - {w: "rescatado", f: "participle of rescatar (to ransom), masculine to match 'me' (the captive)."}
          - {w: "había", f: "hab- + -ía → haber (to have; alone, 'there is'), imperfect, used alone: 'there was'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "se alborotasen", f: "alborot- + -asen → alborotarse (to make a fuss), imperfect subjunctive (-se form), they, after 'porque' meaning 'so that'. Same -ase subjunctive: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "persuadiese", f: "persuad- + -iese → persuadir (to persuade), imperfect subjunctive (-se form), he (the devil), still governed by 'porque no'. The -se form of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen."}
          - {w: "hiciesen", f: "hic- + -iesen → hacer (to do), imperfect subjunctive (-se form), they, after 'persuadir que'. Built on the preterite hicieron: hiciese, hicieses, hiciese, hiciésemos, hicieseis, hiciesen."}
          - {w: "alguna", f: "algun- + -a → alguno (some), feminine to match 'cosa'."}
      - es: "que, puesto que el ser ellos quien eran me podía asegurar deste temor, con todo eso, no quise poner el negocio en aventura, y así, los hice rescatar por la misma orden que yo me rescaté, entregando todo el dinero al mercader, para que, con certeza y seguridad, pudiese hacer la fianza;"
        literal: "for, granted that the being they who they-were me could reassure of-this fear, with all that, not I-wanted to-put the business at risk, and so, them I-made to-ransom by the same order that I myself ransomed, handing-over all the money to-the merchant, so that, with certainty and security, he-might-be-able to-make the surety;"
        ormsby: "for though their position might be sufficient to relieve me from this apprehension, nevertheless I was unwilling to run any risk in the matter; and so I had them ransomed in the same way as I was, handing over all the money to the merchant so that he might with safety and confidence give security;"
        vocab:
          - {w: "puesto que", d: "although (its usual sense in Cervantes; not 'since')"}
          - {w: "el ser ellos quien eran", d: "their being who they were, i.e. their rank and character as gentlemen"}
          - {w: "asegurar de", d: "to reassure about, free from (a fear)"}
          - {w: "deste", d: "= de este, 'of this'"}
          - {w: "con todo eso", d: "nevertheless, all the same"}
          - {w: "poner en aventura", d: "to put at risk, hazard"}
          - {w: "negocio", d: "business, affair (here the escape)"}
          - {w: "por la misma orden", d: "in the same way, by the same arrangement ('orden' feminine here)"}
