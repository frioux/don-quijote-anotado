          - {w: "palabra por palabra", d: "word for word"}
          - {w: "tinta", d: "ink"}
          - {w: "pluma", d: "pen (a quill); also 'feather'"}
          - {w: "porque", d: "here 'so that, in order that' (with the subjunctive), not 'because'"}
        diagram:
