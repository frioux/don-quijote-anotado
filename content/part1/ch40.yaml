      - es: "Acaeció, pues, que un día, estando en un terrado de nuestra prisión con otros tres compañeros, haciendo pruebas de saltar con las cadenas, por entretener el tiempo, estando solos, porque todos los demás cristianos habían salido a trabajar, alcé acaso los ojos y vi que por aquellas cerradas ventanillas que he dicho parecía una caña, y al remate della puesto un lienzo atado, y la caña se estaba blandeando y moviéndose, casi como si hiciera señas que llegásemos a tomarla."
        literal: "It-happened, then, that one day, being on a flat-roof of our prison with other three companions, making trials of jumping with the chains, to pass the time, being alone, because all the other Christians had gone-out to work, I-raised by-chance the eyes and I-saw that through those closed little-windows that I-have said appeared a reed, and at-the end of-it put a cloth tied, and the reed itself was waving and moving-itself, almost as if it-made signs that we-should-come to take-it."
        ormsby: "It so happened, then, that as I was one day on the terrace of our prison with three other comrades, trying, to pass away the time, how far we could leap with our chains, we being alone, for all the other Christians had gone out to work, I chanced to raise my eyes, and from one of these little closed windows I saw a reed appear with a cloth attached to the end of it, and it kept waving to and fro, and moving as if making signs to us to come and take it."
