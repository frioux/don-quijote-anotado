          - {w: "al cual", f: "a + el cual (which), masculine to match 'hilo'."}
          - {w: "até", f: "at- + -é → atar (to tie), preterite, I. Same -ar preterite as 'mostré'."}
          - {w: "tornó", f: "torn- + -ó → tornar (to return, do again), preterite, it. Same -ar preterite: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "blanca", f: "blanc- + -a → blanco (white), feminine to match 'bandera', placed before the noun."}
          - {w: "atadillo", f: "atad- + -illo → atado (bundle, from the participle of atar (to tie)) + the diminutive suffix -illo."}
        note: "The 'white flag of peace' is the white cloth bundle tied to the reed, a playful image for a friendly signal from the window, as if from a fortress agreeing to a truce."
      - es: "Dejáronla caer, y alcé yo, y hallé en el paño, en toda suerte de moneda de plata y de oro, más de cincuenta escudos, los cuales cincuenta veces más doblaron nuestro contento y confirmaron la esperanza de tener libertad."
