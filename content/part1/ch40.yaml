  - sentences:
      - es: "»Aquella misma noche volvió nuestro renegado, y nos dijo que había sabido que en aquella casa vivía el mesmo moro que a nosotros nos habían dicho que se llamaba Agi Morato, riquísimo por todo estremo, el cual tenía una sola hija, heredera de toda su hacienda, y que era común opinión en toda la ciudad ser la más hermosa mujer de la Berbería;"
