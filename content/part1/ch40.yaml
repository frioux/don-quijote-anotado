        forms:
          - {w: "me determiné", f: "determin- + -é → determinarse (to resolve), preterite, I, with 'me' (myself). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "fiarme", f: "fiar (to trust) + me (myself) → fiarse (to trust in), the pronoun hung on the infinitive after 'de'."}
          - {w: "se había dado", f: "hab- + -ía → haber (to have, the helper verb), imperfect, he, + dado, the participle of dar (to give), with 'se' (himself): pluperfect 'had given himself out'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
