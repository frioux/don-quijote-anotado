summary: |
  At the inn, the gentleman who is Don Pedro de Aguilar's brother recites the two sonnets Don Pedro wrote: one for the soldiers who died defending La Goleta, the other for the three thousand who fell at the new fort near Tunis. The captive, glad to hear his old comrade is free and safe, takes up his story again.

  After the fall of La Goleta, the captive's master Uchalí died, and he passed to the cruel Venetian renegade Azán Agá, king of Algiers. There he lived in the bagnio, a prison for captives held to ransom, wearing a chain as a mark of rank. His master hanged, impaled and maimed captives almost daily; only one Spanish soldier, a certain Saavedra, escaped his cruelty despite repeated attempts to escape.

  One day, while the bagnio was empty, a reed with a knotted cloth appeared from a latticed window overlooking the prison yard. It was let fall only for the captive, and held ten gold coins. A white hand with bracelets showed at the window, then a little cross. Later the reed brought forty gold crowns and a letter in Arabic with a cross at the foot. The captive trusted a renegade from Murcia, who read it: the writer, daughter of the rich Agi Morato, had learned the Christian prayers from a slave woman and wished to go to Christian lands, see Lela Marién (the Virgin Mary) and marry the captive. The renegade swore on a crucifix to keep the secret, hoping to return to the Church through the escape.

  Letters and money passed by the reed. The renegade found out that the writer was Zoraida, the veiled woman now at the inn. Zoraida offered gold for the captive to ransom himself and his friends and to come for her at her father's garden by the Bab Azoun gate. The renegade warned against sending a freed captive to Spain for a boat, since such men rarely came back, and offered to buy one in Algiers himself. With Zoraida's two thousand crowns and more, the captive had himself and his three companions ransomed through a Valencian merchant, without telling the merchant their secret.
context: |
  Captivity in Algiers. Algiers was the greatest of the Barbary corsair ports, and thousands of Christian captives lived there as slaves. Those of rank were held 'de rescate', for ransom: they were kept in the bagnios, prison-barracks belonging to the ruler, the city or private owners, wore a chain as a mark of their value, and were spared the hardest labor unless their ransom was slow in coming. The rest, the 'chusma', rowed in the galleys or worked on public works. Ransom money came from families or from the redemptionist orders, the Trinitarians and Mercedarians, and was often handled by merchants who stood surety for it. The captive's account of all this, the hanging, impaling and ear-cropping included, is close to the eyewitness accounts of the time.

  Renegades. Many of the most powerful men in Algiers were Christian-born converts to Islam: Uchalí (Uluç Ali), a Calabrian galley slave who rose to be admiral of the Ottoman fleet, and Azán Agá, the Venetian Hasan Pasha who ruled Algiers from 1577 to 1580. Ormsby notes that 'Hassan Aga' should be Hassan Pacha. Renegades who wanted to go home carried certificates signed by captives of rank vouching for their good conduct, so that they could be received back into the Church; the captive notes that some used them honestly and others as insurance on raids. The renegade from Murcia, who reads Zoraida's letter and swears on a crucifix, is one of the honest ones, or says he is.

  Cervantes' own story. Cervantes was captured at sea in 1575 and spent five years as a captive in Algiers, much of it as a slave of Hasan Pasha. He made four escape attempts, took the blame for each, and was never punished, which is still not fully explained; he was ransomed by the Trinitarians in 1580. Ormsby notes that 'a certain Saavedra', the one soldier Azán Agá never beat, 'was of course Cervantes himself', and that the captive's refusal to give up hope is Cervantes' own. The narrator's game here is a bold one: the author steps into his own fiction as a minor character mentioned in passing by another.

  The Moorish romance. With the reed at the window, the white hand and the secret letters, the captive's tale turns into a love story of a kind Spanish readers knew well from the 'novela morisca', tales of noble Moors and Christians. Zoraida's faith is the heart of it: she calls the Virgin Mary 'Lela Marién', prays the Christian prayers a slave woman taught her, and yet signs off 'Alá te guarde'. Agi Morato is modelled on Hajji Murad, a real and very rich man of Algiers. The two sonnets at the start are written in the Petrarchan form of the period; Ormsby reports that the critic Clemencín thought little of them.

  Places and names. La Goleta was the fortress guarding Tunis, lost in 1574 together with the new fort the Italian engineer Fratino ('the little friar', as Ormsby notes) was building. La Pata was a fort near Oran, and Bab Azoun the south gate of Algiers. The cianíis are small Algerian gold coins; an escudo or 'crown' was a Spanish gold coin worth far more than a real. 'Zalema' (salaam), 'zalá' (prayer), 'jumá' (Friday), 'alcaide' (governor) and 'ajorca' (bangle) are Arabic words that had entered Spanish.

  Reading Cervantes' Spanish. The archaisms of the chapter: mesmo (mismo), esento (exento), vitoria (victoria), decender (descender), apriesa (aprisa), hecimos (hicimos), adevinar (adivinar), estremo, efeto, arábigo for árabe, 'la hambre' for 'el hambre', and fused forms like della, dél, desa, destos, deste. Pronouns hang on the end of verbs that open a clause (Llamábase, Pusiéronme, Volvióse, volvíme, Ofrecímele). The vosotros preterite still ends in -astes (obrastes, os levantastes), the -ra form serves as a conditional (dijera, fuera), the future subjunctive marks open futures (quisieres, tuviere), 'tengo dicho' stands for 'he dicho', and 'haber de' and 'deber de' carry future and probability. Zoraida's switch from 'vos' to 'tú' when she speaks of marriage is worth noticing. Watch the false friends: suceso (event), posibilidad (means), condición (nature), admiración (wonder), procurar (to try), solicitud (diligence), discurso (reasoning), puesto que (although), acaso (by chance).
