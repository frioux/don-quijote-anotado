  - sentences:
      - es: "»Escrito y cerrado este papel, aguardé dos días a que estuviese el baño solo, como solía, y luego salí al paso acostumbrado del terradillo, por ver si la caña parecía, que no tardó mucho en asomar."
        literal: "»Written and closed this paper, I-waited two days for that might-be the bath alone, as it-was-wont, and then I-went-out to-the walk accustomed of-the little-terrace, to see if the reed appeared, which not delayed much in peeping-out."
        ormsby: "The paper being written and folded I waited two days until the baño was empty as before, and immediately repaired to the usual walk on the terrace to see if there were any sign of the reed, which was not long in making its appearance."
        vocab:
          - {w: "cerrar", d: "to close; of a letter, to fold and seal"}
          - {w: "aguardar a que", d: "to wait until, wait for (something to happen)"}
          - {w: "baño", d: "bagnio: the prison-barracks for captives in Algiers (literally 'bath')"}
          - {w: "solo", d: "alone; here 'empty', with nobody about"}
          - {w: "soler", d: "to be in the habit of, usually be"}
          - {w: "luego", d: "at once, immediately (its usual sense in Cervantes)"}
          - {w: "paso", d: "walk, beat, the place one paces up and down"}
          - {w: "acostumbrado", d: "usual, customary"}
          - {w: "terradillo", d: "little flat roof, small terrace (diminutive of 'terrado')"}
          - {w: "parecer", d: "here 'to appear, show up' (= aparecer)"}
          - {w: "tardar en", d: "to take long to, be slow to"}
          - {w: "asomar", d: "to peep out, appear (at a window or edge)"}
