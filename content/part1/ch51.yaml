      - es: "Llámase mi competidor Anselmo, y yo Eugenio, porque vais con noticia de los nombres de las personas que en esta tragedia se contienen, cuyo fin aún está pendiente; pero bien se deja entender que será desastrado."
        literal: "Calls-himself my rival Anselmo, and I Eugenio, so-that you-may-go with knowledge of the names of the persons who in this tragedy themselves contain, whose end still is pending; but well itself lets understand that it-will-be disastrous."
        ormsby: "My rival is called Anselmo and I myself Eugenio—that you may know the names of the personages that figure in this tragedy, the end of which is still in suspense, though it is plain to see it must be disastrous."
        vocab:
          - {w: "competidor", d: "rival (in love), competitor"}
          - {w: "porque", d: "here 'so that' (purpose, with the subjunctive), not 'because'"}
          - {w: "ir con noticia de", d: "to go away knowing, be informed of"}
          - {w: "contenerse", d: "to be contained, figure (in a story)"}
          - {w: "pendiente", d: "pending, still undecided"}
          - {w: "dejarse entender", d: "to be easy to understand, be plain to see"}
          - {w: "desastrado", d: "disastrous, wretched, ill-fated"}
        diagram:
          - s: "Llámase mi competidor Anselmo"
            r: "main verb 1: my rival is called Anselmo"
          - s: "y yo Eugenio"
            r: "main verb 1 understood: and I [am called] Eugenio"
          - s: "porque vais con noticia de los nombres de las personas"
            r: "purpose: so that you go off knowing the names of the people"
            under:
              - s: "que en esta tragedia se contienen"
                r: "describes 'personas': who figure in this tragedy"
                under:
                  - {s: "cuyo fin aún está pendiente", r: "describes 'tragedia': whose end is still undecided"}
          - s: "pero bien se deja entender"
            r: "main verb 2: but it is plain to see"
            under:
              - {s: "que será desastrado", r: "what is plain: that it will be disastrous"}
        forms:
          - {w: "Llámase", f: "llam- + -a + se → llamarse (to be called), present, he, with 'se' stuck on the end; modern 'se llama'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. Cervantes hangs the pronoun on a conjugated verb that opens a sentence; the accent keeps the stress."}
          - {w: "vais", f: "va- + -is → ir (to go), here an old present subjunctive, you (vosotros), = modern 'vayáis', after 'porque' meaning 'so that'. Old subjunctive of ir (to go): vaya, vayas, vaya, vamos/vayamos, vais/vayáis, vayan."}
          - {w: "se contienen", f: "contien- + -en → contenerse (to be contained), present, they; built like tener (to have): contengo, contienes, contiene, contenemos, contenéis, contienen."}
          - {w: "cuyo", f: "'whose', masculine singular to match the thing owned, 'fin', not the owner ('tragedia')."}
          - {w: "está", f: "est- + -á → estar (to be), present, it: estoy, estás, está, estamos, estáis, están."}
          - {w: "se deja entender", f: "dej- + -a → dejar (to let), present, it, with 'se', + entender (to understand): 'it lets itself be understood', i.e. it is plain. Present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "será", f: "ser- + -á → ser (to be), future, it. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
        note: "Calling his own love story a 'tragedy' whose ending is still pending is a pastoral pose: the speaker is both a character and the narrator of his own sorrows, like the shepherds of the Grisóstomo and Marcela episode earlier in the book."
  - sentences:
      - es: "»En esta sazón, vino a nuestro pueblo un Vicente de la Rosa, hijo de un pobre labrador del mismo lugar; el cual Vicente venía de las Italias, y de otras diversas partes, de ser soldado."
        literal: "»At this season, came to our town a Vicente de la Rosa, son of a poor farmer of-the same place; the which Vicente was-coming from the Italies, and from other various parts, from being soldier."
        ormsby: "About this time there arrived in our town one Vicente de la Roca, the son of a poor peasant of the same town, the said Vicente having returned from service as a soldier in Italy and divers other parts."
        vocab:
          - {w: "en esta sazón", d: "at this time, just then; 'sazón' = season, moment (also ripeness)"}
          - {w: "un Vicente de la Rosa", d: "'a certain Vicente de la Rosa': 'un' before a name means someone not well known"}
          - {w: "labrador", d: "farmer, peasant who works the land"}
          - {w: "lugar", d: "village, place (very common in Cervantes for a small town)"}
          - {w: "el cual Vicente", d: "'the said Vicente, this Vicente': a legal-sounding way to pick up a name again"}
          - {w: "las Italias", d: "'the Italies': the Italian states (Naples, Sicily, Milan) where Spanish troops served; the plural is the usual old phrase"}
          - {w: "venir de ser soldado", d: "to come back from soldiering, from serving as a soldier"}
        diagram:
          - s: "vino"
            r: "main verb 1: came"
            under:
              - {s: "En esta sazón", r: "when: at this time"}
              - {s: "a nuestro pueblo", r: "where to: to our town"}
              - s: "un Vicente de la Rosa"
                r: "subject: a certain Vicente de la Rosa"
                under:
                  - {s: "hijo de un pobre labrador del mismo lugar", r: "describes 'Vicente': son of a poor farmer of the same village"}
          - s: "el cual Vicente venía"
            r: "main verb 2: this Vicente was coming"
            under:
              - {s: "de las Italias, y de otras diversas partes", r: "where from: from Italy and various other places"}
              - {s: "de ser soldado", r: "from what: from soldiering"}
        forms:
          - {w: "vino", f: "vin- + -o → venir (to come), preterite, he. Irregular: vine, viniste, vino, vinimos, vinisteis, vinieron. The subject 'un Vicente de la Rosa' comes after the verb."}
