      - es: "No sé yo el que tuvo Leandra; sólo sé que el padre nos entretuvo a entrambos con la poca edad de su hija y con palabras generales, que ni le obligaban, ni nos desobligaba tampoco."
        literal: "Not know I the [one] that had Leandra; only I-know that the father us put-off [—] both-of-us with the little age of his daughter and with words general, which neither him bound, nor us released either."
        ormsby: "I do not know which Leandra chose; I only know her father put us both off with the tender age of his daughter and vague words that neither bound him nor dismissed us."
        vocab:
          - {w: "el que tuvo Leandra", d: "which [choice/gusto] Leandra had, i.e. which of us she preferred"}
          - {w: "entretener", d: "to put off, keep waiting, string along (not 'to entertain')"}
          - {w: "entrambos", d: "= ambos, both (archaic)"}
          - {w: "poca edad", d: "youth, tender age"}
          - {w: "palabras generales", d: "vague words, noncommittal talk"}
          - {w: "obligar", d: "to bind, commit"}
          - {w: "desobligar", d: "to release from an obligation; here 'to dismiss, turn away'"}
        diagram:
          - s: "No sé yo"
            r: "main verb 1: I don't know"
            under:
