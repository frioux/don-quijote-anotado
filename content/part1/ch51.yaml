part: 1
chapter: 51
title_es: "Capítulo LI. Que trata de lo que contó el cabrero a todos los que llevaban a don Quijote"
title_en: "Which deals with what the goatherd told those who were carrying off Don Quixote"
paragraphs:
  - sentences:
      - es: "— «Tres leguas deste valle está una aldea que, aunque pequeña, es de las más ricas que hay en todos estos contornos;"
        literal: "— «Three leagues from-this valley is a village which, although small, is of the most rich that there-are in all these surroundings;"
        ormsby: "Three leagues from this valley there is a village which, though small, is one of the richest in all this neighbourhood,"
        vocab:
          - {w: "legua", d: "league, about three miles (5.5 km): roughly an hour's walk"}
          - {w: "deste", d: "= de este, from this (old contraction)"}
          - {w: "aldea", d: "village, hamlet (smaller than a 'pueblo' or 'villa')"}
          - {w: "ser de las más ricas", d: "to be one of the richest; 'de las' = among those"}
          - {w: "contornos", d: "surroundings, the neighbourhood around a place"}
        diagram:
          - s: "está una aldea"
            r: "main verb: there is a village"
            under:
              - {s: "Tres leguas deste valle", r: "where: three leagues from this valley"}
              - s: "que, aunque pequeña, es de las más ricas"
                r: "describes 'aldea': which is one of the richest"
                under:
                  - {s: "aunque pequeña", r: "concession: although small"}
                  - {s: "que hay en todos estos contornos", r: "describes 'las más ricas': that there are in all this neighbourhood"}
        forms:
          - {w: "deste", f: "= de + este (this), an old contraction like modern 'del'; modern Spanish writes 'de este'."}
          - {w: "está", f: "est- + -á → estar (to be), present, it: 'is (situated)'. estar is used for where a place lies: estoy, estás, está, estamos, estáis, están."}
          - {w: "pequeña", f: "pequeñ- + -a → pequeño (small), feminine to match 'aldea'; 'aunque pequeña' leaves out 'es' (although [it is] small)."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son. 'es de las más ricas' = it is [one] of the richest."}
          - {w: "las más ricas", f: "ric- + -as → rico (rich), feminine plural to match the 'aldeas' understood; 'las más' + adjective makes the superlative, 'the richest'."}
          - {w: "hay", f: "hay = 'there is, there are', the special present form of haber (to have) used for existence; it never changes for plural."}
          - {w: "estos", f: "est- + -os → este (this), masculine plural to match 'contornos'."}
        note: "The goatherd, Eugenio, who in the previous chapter scolded his runaway goat, begins the story he promised the canon, the priest and Don Quijote's escort. The opening «…» marks the whole tale as his speech; each later paragraph opens with » to show the quotation continues."
      - es: "en la cual había un labrador muy honrado, y tanto, que, aunque es anexo al ser rico el ser honrado, más lo era él por la virtud que tenía que por la riqueza que alcanzaba."
        literal: "in the which there-was a farmer very honoured, and so-much, that, although is annexed to-the being rich the being honoured, more it was he for the virtue that he-had than for the wealth that he-attained."
        ormsby: "and in it there lived a farmer, a very worthy man, and so much respected that, although to be so is the natural consequence of being rich, he was even more respected for his virtue than for the wealth he had acquired."
        vocab:
          - {w: "labrador", d: "farmer, a well-off peasant who works his own land (not 'labourer')"}
          - {w: "honrado", d: "respected, honoured; also honest, worthy. The sentence plays on both senses"}
          - {w: "y tanto, que", d: "and so much so that"}
          - {w: "anexo a", d: "attached to, going along with"}
          - {w: "alcanzar", d: "to attain, come to have; here 'the wealth he possessed'"}
        diagram:
          - s: "había un labrador muy honrado"
            r: "main verb: there was a very respected farmer"
            under:
              - {s: "en la cual", r: "where: in which (the village)"}
              - s: "y tanto, que"
                r: "describes 'honrado': and so much so that"
                under:
                  - {s: "aunque es anexo al ser rico el ser honrado", r: "concession: although being respected goes along with being rich"}
                  - s: "más lo era él"
                    r: "result: he was it (respected) more"
                    under:
                      - {s: "por la virtud que tenía", r: "why, 1: for the virtue he had"}
                      - {s: "que por la riqueza que alcanzaba", r: "than: than for the wealth he possessed"}
        forms:
          - {w: "la cual", f: "'which', feminine to match 'aldea'; the heavier relative used after a pause."}
          - {w: "había", f: "hab- + -ía → haber (to have), imperfect, used alone for 'there was'. The imperfect of -er verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "honrado", f: "honr- + -ado → honrar (to honour), participle used as an adjective, masculine to match 'labrador'."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son. Its subject 'el ser honrado' comes at the end."}
          - {w: "al ser rico, el ser honrado", f: "al = a + el; 'el ser' is the infinitive ser (to be) used as a noun with 'el': 'the being rich', 'the being respected'."}
          - {w: "lo era", f: "er- + -a → ser (to be), imperfect, he: era, eras, era, éramos, erais, eran (irregular). 'lo' stands for 'honrado': 'he was so'."}
          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, he. The imperfect of -er verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "alcanzaba", f: "alcanz- + -aba → alcanzar (to attain), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
        note: "In Golden Age Castile 'honra' was public standing, and money brought it almost automatically; the goatherd stresses that this farmer's standing came more from his character than from his wealth."
      - es: "Mas lo que le hacía más dichoso, según él decía, era tener una hija de tan estremada hermosura, rara discreción, donaire y virtud, que el que la conocía y la miraba se admiraba de ver las estremadas partes con que el cielo y la naturaleza la habían enriquecido."
        literal: "But that which him made more fortunate, according-to-what he said, was to-have a daughter of such extreme beauty, rare discretion, grace and virtue, that he who her knew and her looked-at himself marvelled at seeing the extreme gifts with which the heaven and the nature her had enriched."
        ormsby: "But what made him still more fortunate, as he said himself, was having a daughter of such exceeding beauty, rare intelligence, gracefulness, and virtue, that everyone who knew her and beheld her marvelled at the extraordinary gifts with which heaven and nature had endowed her."
        vocab:
          - {w: "mas", d: "but (literary; without accent, unlike 'más', more)"}
          - {w: "dichoso", d: "fortunate, happy, blessed"}
          - {w: "estremado", d: "= extremado, extreme, exceptional, outstanding (old spelling with s for x)"}
          - {w: "discreción", d: "good sense, intelligence, wit (false friend: not 'discretion' in the sense of keeping secrets)"}
          - {w: "donaire", d: "grace, charm, elegance"}
          - {w: "admirarse de", d: "to marvel at, be amazed at (not 'to admire')"}
          - {w: "partes", d: "qualities, gifts, endowments"}
          - {w: "enriquecer", d: "to enrich, endow"}
        diagram:
          - s: "era tener una hija"
            r: "main verb: was having a daughter"
            under:
              - s: "Mas lo"
                r: "subject: but the thing"
                under:
                  - {s: "que le hacía más dichoso", r: "describes 'lo': that made him happier"}
              - {s: "según él decía", r: "aside: as he used to say"}
              - s: "de tan estremada hermosura, rara discreción, donaire y virtud"
                r: "describes 'hija': of such great beauty, rare intelligence, grace and virtue"
                under:
                  - s: "que el que la conocía y la miraba se admiraba"
                    r: "result: that whoever knew her and saw her marvelled"
                    under:
                      - s: "de ver las estremadas partes"
                        r: "at what: at seeing the outstanding gifts"
                        under:
                          - {s: "con que el cielo y la naturaleza la habían enriquecido", r: "describes 'partes': with which heaven and nature had endowed her"}
        forms:
          - {w: "hacía", f: "hac- + -ía → hacer (to make), imperfect, it. The imperfect of -er verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "decía", f: "dec- + -ía → decir (to say), imperfect, he: 'as he used to say'. Same -ía imperfect."}
          - {w: "era", f: "er- + -a → ser (to be), imperfect, it. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "tener", f: "infinitive of tener (to have) used as a noun, the complement of 'era': 'was having'."}
          - {w: "estremada, estremadas", f: "estremad- + -a / -as → estremado (outstanding), old spelling of extremado; feminine to match 'hermosura', feminine plural to match 'partes'."}
          - {w: "conocía, miraba", f: "conoc- + -ía → conocer (to know) and mir- + -aba → mirar (to look at), imperfect, he ('whoever'). -er imperfect: -ía, -ías, -ía, -íamos, -íais, -ían; -ar imperfect: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "se admiraba", f: "admir- + -aba → admirarse (to marvel), imperfect, he, with 'se' (himself). Same -aba imperfect."}
          - {w: "habían enriquecido", f: "hab- + -ían → haber (to have), imperfect, they (heaven and nature), + enriquecido, participle of enriquecer (to enrich): the pluperfect, 'had endowed'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
      - es: "Siendo niña fue hermosa, y siempre fue creciendo en belleza, y en la edad de diez y seis años fue hermosísima."
        literal: "Being [a] girl she-was beautiful, and always she-went growing in beauty, and at the age of ten and six years she-was most-beautiful."
        ormsby: "As a child she was beautiful, she continued to grow in beauty, and at the age of sixteen she was most lovely."
        vocab:
          - {w: "ir + gerund", d: "to go on doing, keep doing, gradually: 'fue creciendo' = kept growing"}
          - {w: "diez y seis", d: "sixteen, written as three words (modern 'dieciséis')"}
          - {w: "hermosísimo", d: "most beautiful, extremely beautiful"}
        diagram:
          - s: "fue hermosa"
            r: "main verb 1: she was beautiful"
            under:
              - {s: "Siendo niña", r: "when: as a child"}
          - s: "y siempre fue creciendo"
            r: "main verb 2: and she kept growing"
            under:
              - {s: "en belleza", r: "in what: in beauty"}
          - s: "fue hermosísima"
            r: "main verb 3 (after 'y'): she was most beautiful"
            under:
              - {s: "en la edad de diez y seis años", r: "when: at sixteen"}
        forms:
          - {w: "Siendo", f: "gerund of ser (to be): 'being (a child)', i.e. when she was a child."}
          - {w: "fue", f: "fue → ser (to be), preterite, she: 'she was'. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron. The same forms serve as the preterite of ir (to go)."}
          - {w: "fue creciendo", f: "fue → ir (to go), preterite, she (fui, fuiste, fue, fuimos, fuisteis, fueron), + creciendo, gerund of crecer (to grow): 'she went on growing', ir + gerund for a gradual process."}
          - {w: "hermosa", f: "hermos- + -a → hermoso (beautiful), feminine to match the girl."}
          - {w: "hermosísima", f: "hermos- + -ísima → hermoso (beautiful) with the suffix -ísimo, 'very, most', feminine: 'extremely beautiful'."}
      - es: "La fama de su belleza se comenzó a estender por todas las circunvecinas aldeas, ¿qué digo yo por las circunvecinas no más, si se estendió a las apartadas ciudades, y aun se entró por las salas de los reyes, y por los oídos de todo género de gente;"
        literal: "The fame of her beauty itself began to spread through all the neighbouring villages, what say I through the neighbouring no more, if itself it-spread to the distant cities, and even itself entered through the halls of the kings, and through the ears of every kind of people;"
        ormsby: "The fame of her beauty began to spread abroad through all the villages around—but why do I say the villages around, merely, when it spread to distant cities, and even made its way into the halls of royalty and reached the ears of people of every class,"
        vocab:
          - {w: "estender", d: "= extender, to spread, extend (old spelling)"}
          - {w: "circunvecino", d: "neighbouring, surrounding (literary)"}
          - {w: "¿qué digo yo ...?", d: "'what am I saying ...?', a rhetorical self-correction to go higher"}
          - {w: "no más", d: "only, merely"}
          - {w: "si", d: "here 'when in fact', not 'if'"}
          - {w: "apartado", d: "remote, distant"}
          - {w: "entrarse por", d: "to make one's way into, penetrate"}
          - {w: "todo género de gente", d: "every kind of people, all sorts"}
        diagram:
          - s: "La fama de su belleza se comenzó a estender"
            r: "main verb 1: the fame of her beauty began to spread"
            under:
              - {s: "por todas las circunvecinas aldeas", r: "where: through all the neighbouring villages"}
          - s: "¿qué digo yo por las circunvecinas no más"
            r: "main verb 2, a question: why do I say only the neighbouring ones"
            under:
              - s: "si se estendió a las apartadas ciudades"
                r: "reason: when it spread to distant cities"
                under:
                  - {s: "y aun se entró por las salas de los reyes", r: "and, 2: and even got into the halls of kings"}
                  - {s: "y por los oídos de todo género de gente;", r: "and, 3: and into the ears of all sorts of people"}
        forms:
          - {w: "se comenzó a estender", f: "comenz- + -ó → comenzar (to begin), preterite, it, with 'se' (itself) placed before the whole group, + a + estender (to spread). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "circunvecinas", f: "circunvecin- + -as → circunvecino (neighbouring), feminine plural to match 'aldeas', placed before its noun."}
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "se estendió", f: "estend- + -ió → estenderse (to spread), preterite, it, with 'se'. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "apartadas", f: "apart- + -adas → apartar (to set apart), participle as adjective, feminine plural to match 'ciudades'."}
          - {w: "se entró", f: "entr- + -ó → entrarse (to make one's way in), preterite, it, with 'se'. Same -ó preterite."}
          - {w: "todo género", f: "tod- + -o → todo (every), masculine singular to match 'género': 'every kind'."}
      - es: "que, como a cosa rara, o como a imagen de milagros, de todas partes a verla venían?"
        literal: "who, as to [a] thing rare, or as to [an] image of miracles, from all parts to see-her came?"
        ormsby: "who came from all sides to see her as if to see something rare and curious, or some wonder-working image?"
        vocab:
          - {w: "como a", d: "as [people go] to, as if to"}
          - {w: "imagen de milagros", d: "a miracle-working image, a statue of a saint or the Virgin that pilgrims visit"}
          - {w: "de todas partes", d: "from everywhere, from all sides"}
        diagram:
          - s: "venían?"
            r: "carried-over clause: came (the people who heard of her; continues 'género de gente')"
            under:
              - {s: "que", r: "subject: who (the people)"}
              - {s: "como a cosa rara, o como a imagen de milagros", r: "how: as to a rare thing, or a wonder-working image"}
              - {s: "de todas partes", r: "where from: from everywhere"}
              - {s: "a verla", r: "why: to see her"}
        forms:
          - {w: "verla", f: "ver (to see) + la (her), the pronoun hung on the infinitive after 'a' (purpose after a verb of motion)."}
          - {w: "venían", f: "ven- + -ían → venir (to come), imperfect, they: 'they kept coming'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían. The verb is held to the very end of the clause for weight."}
        note: "Pilgrims travelled across Spain to famous images such as Our Lady of Guadalupe; comparing a girl to a miracle-working statue is a hyperbole the goatherd shares with the love poets."
      - es: "Guardábala su padre, y guardábase ella; que no hay candados, guardas ni cerraduras que mejor guarden a una doncella que las del recato proprio."
        literal: "Guarded-her her father, and guarded-herself she; for not there-are padlocks, guards nor locks that better may-guard a maiden than those of-the modesty own."
        ormsby: "Her father watched over her and she watched over herself; for there are no locks, or guards, or bolts that can protect a young girl better than her own modesty."
        vocab:
          - {w: "guardar", d: "to guard, watch over, keep safe"}
          - {w: "candado", d: "padlock"}
          - {w: "cerradura", d: "lock (on a door)"}
          - {w: "doncella", d: "maiden, unmarried young woman (implying virginity)"}
          - {w: "recato", d: "modesty, reserve, caution in behaviour"}
          - {w: "proprio", d: "= propio, own (old spelling)"}
        diagram:
          - s: "Guardábala su padre"
            r: "main verb 1: her father guarded her"
          - s: "y guardábase ella"
            r: "main verb 2: and she guarded herself"
          - s: "que no hay candados, guardas ni cerraduras"
            r: "why (que = for): for there are no padlocks, guards or locks"
            under:
              - s: "que mejor guarden a una doncella"
                r: "describes the locks: that can guard a maiden better"
                under:
                  - {s: "que las del recato proprio", r: "than: than those of her own modesty"}
        forms:
          - {w: "Guardábala", f: "guard- + -aba + la → guardar (to guard), imperfect, he, with 'la' (her) stuck on the end; modern 'la guardaba'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. Cervantes hangs the pronoun on a conjugated verb that opens a clause, and the accent is written to keep the stress."}
          - {w: "guardábase", f: "guard- + -aba + se → guardarse (to guard oneself), imperfect, she, with 'se' (herself) on the end after 'y'; modern 'se guardaba'. Same -aba imperfect."}
          - {w: "hay", f: "hay = 'there are', the special present of haber (to have) for existence; the same for singular and plural."}
          - {w: "guarden", f: "guard- + -en → guardar (to guard), present subjunctive, they: subjunctive because the locks are denied to exist ('no hay ... que'). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "las del recato", f: "las = 'those', feminine plural standing for 'guardas' / 'cerraduras'; del = de + el."}
          - {w: "proprio", f: "= propio (own), old spelling, masculine to match 'recato', placed after the noun."}
        note: "A commonplace of the period's moralists: no lock keeps a woman safe if her own modesty does not. The story will test it at once."
  - sentences:
      - es: "»La riqueza del padre y la belleza de la hija movieron a muchos, así del pueblo como forasteros, a que por mujer se la pidiesen;"
        literal: "»The wealth of-the father and the beauty of the daughter moved [—] many, as-well of-the town as outsiders, to that for wife to-him her they-should-ask;"
        ormsby: "The wealth of the father and the beauty of the daughter led many neighbours as well as strangers to seek her for a wife;"
        vocab:
          - {w: "mover a", d: "to move, prompt (someone) to do something"}
          - {w: "así ... como", d: "both ... and, as well ... as"}
          - {w: "forastero", d: "outsider, stranger, someone from another place"}
          - {w: "pedir por mujer", d: "to ask for (a woman's hand) in marriage; 'mujer' = wife"}
        diagram:
          - s: "movieron"
            r: "main verb: moved, prompted"
            under:
              - {s: "La riqueza del padre y la belleza de la hija", r: "subject: the father's wealth and the daughter's beauty"}
              - s: "a muchos"
                r: "object: many (men)"
                under:
                  - {s: "así del pueblo como forasteros", r: "describes 'muchos': both townsmen and outsiders"}
              - {s: "a que por mujer se la pidiesen", r: "to what: to ask him for her as a wife"}
        forms:
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
          - {w: "movieron", f: "mov- + -ieron → mover (to move), preterite, they (the wealth and the beauty). The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "a muchos", f: "'a' before a person object (the personal a); 'muchos' masculine plural, 'many men'."}
          - {w: "se la pidiesen", f: "pid- + -iesen → pedir (to ask for), imperfect subjunctive (-se form), they. Subjunctive after 'mover a que'. The -se imperfect subjunctive of -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen; the e of the stem turns to i (pidiese). 'se la' = le la: 'le' (to him, the father) becomes 'se' before 'la' (her)."}
      - es: "mas él, como a quien tocaba disponer de tan rica joya, andaba confuso, sin saber determinarse a quién la entregaría de los infinitos que le importunaban."
        literal: "but he, as [one] to whom it-fell to-dispose of such rich jewel, went confused, without knowing to-decide-himself to whom her he-would-hand-over of the infinite who him pestered."
        ormsby: "but he, as one might well be who had the disposal of so rich a jewel, was perplexed and unable to make up his mind to which of her countless suitors he should entrust her."
        vocab:
          - {w: "mas", d: "but (literary)"}
          - {w: "tocar a alguien", d: "to fall to someone, be someone's job or right"}
          - {w: "disponer de", d: "to dispose of, have the deciding of"}
          - {w: "joya", d: "jewel; here the daughter herself"}
          - {w: "andar", d: "with an adjective, 'to be, go about being': 'andaba confuso' = he was at a loss"}
          - {w: "determinarse", d: "to make up one's mind, decide"}
          - {w: "entregar", d: "to hand over, give (in marriage)"}
          - {w: "importunar", d: "to pester, press with requests"}
        diagram:
          - s: "andaba confuso"
            r: "main verb: was at a loss"
            under:
              - {s: "mas él", r: "subject: but he (the father)"}
              - {s: "como a quien tocaba disponer de tan rica joya", r: "why: as one whose part it was to dispose of so rich a jewel"}
              - s: "sin saber determinarse"
                r: "how: unable to decide"
                under:
                  - s: "a quién la entregaría"
                    r: "what to decide: to whom he would give her"
                    under:
                      - s: "de los infinitos"
                        r: "out of whom: out of the countless (suitors)"
                        under:
                          - {s: "que le importunaban", r: "describes 'infinitos': who pestered him"}
        forms:
          - {w: "tocaba", f: "toc- + -aba → tocar (to fall to), imperfect, it: 'it was his part'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "andaba", f: "and- + -aba → andar (to go about), imperfect, he. Same -aba imperfect."}
          - {w: "confuso", f: "masculine to match 'él', the father."}
          - {w: "determinarse", f: "determinar (to decide) + se (himself), the pronoun hung on the infinitive after 'saber' (to know how)."}
          - {w: "entregaría", f: "entregar- + -ía → entregar (to hand over), conditional, he: 'to whom he would give her'. The conditional adds -ía endings to the whole infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "importunaban", f: "importun- + -aban → importunar (to pester), imperfect, they. Same -aba imperfect: -aba, -abas, -aba, -ábamos, -abais, -aban. 'le' = him (the father)."}
      - es: "Y, entre los muchos que tan buen deseo tenían, fui yo uno, a quien dieron muchas y grandes esperanzas de buen suceso conocer que el padre conocía quien yo era, el ser natural del mismo pueblo, limpio en sangre, en la edad floreciente, en la hacienda muy rico y en el ingenio no menos acabado."
        literal: "And, among the many who such good desire had, was I one, to whom gave many and great hopes of good outcome to-know that the father knew who I was, the being native of-the same town, clean in blood, in the age flourishing, in the property very rich and in the wit no less accomplished."
        ormsby: "I was one among the many who felt a desire so natural, and, as her father knew who I was, and I was of the same town, of pure blood, in the bloom of life, and very rich in possessions, I had great hopes of success."
        vocab:
          - {w: "suceso", d: "outcome, result (false friend: not 'success'; 'buen suceso' = a happy outcome)"}
          - {w: "natural de", d: "native of, born in"}
          - {w: "limpio en sangre", d: "of 'clean blood', i.e. with no Jewish or Moorish ancestry (limpieza de sangre)"}
          - {w: "floreciente", d: "flourishing, in the bloom (of youth)"}
          - {w: "hacienda", d: "property, wealth, estate"}
          - {w: "ingenio", d: "wit, intelligence, talent"}
          - {w: "acabado", d: "accomplished, perfect, complete"}
        diagram:
          - s: "fui yo uno"
            r: "main verb: I was one"
            under:
              - s: "entre los muchos"
                r: "among whom: among the many"
                under:
                  - {s: "que tan buen deseo tenían", r: "describes 'muchos': who had so good a wish"}
              - s: "a quien dieron muchas y grandes esperanzas de buen suceso"
                r: "describes 'yo': to whom (these things) gave great hopes of success"
                under:
                  - s: "conocer que el padre conocía quien yo era"
                    r: "subject of 'dieron', 1: knowing that the father knew who I was"
                  - s: "el ser natural del mismo pueblo"
                    r: "subject of 'dieron', 2: being native of the same town"
                    under:
                      - {s: "limpio en sangre", r: "and: of pure blood"}
                      - {s: "en la edad floreciente", r: "and: in the bloom of youth"}
                      - {s: "en la hacienda muy rico", r: "and: very rich in property"}
                      - {s: "y en el ingenio no menos acabado", r: "and: no less accomplished in wit"}
        forms:
          - {w: "buen", f: "bueno (good) clipped before a masculine singular noun ('deseo', 'suceso'), like un, algún, gran."}
          - {w: "tenían", f: "ten- + -ían → tener (to have), imperfect, they. The imperfect of -er verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "fui", f: "fu- + -i → ser (to be), preterite, I: 'I was'. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "dieron", f: "d- + -ieron → dar (to give), preterite, they. Irregular, with -er/-ir endings: di, diste, dio, dimos, disteis, dieron. Its subjects are the infinitives that follow ('conocer ...', 'el ser natural ...')."}
          - {w: "muchas y grandes", f: "much- + -as → mucho (many) and grand- + -es → grande (great), feminine plural to match 'esperanzas'."}
          - {w: "conocer", f: "infinitive of conocer (to know) used as a noun subject: '[my] knowing that ...'."}
          - {w: "conocía", f: "conoc- + -ía → conocer (to know), imperfect, he (the father). Same -ía imperfect."}
          - {w: "era", f: "er- + -a → ser (to be), imperfect, I: 'who I was'. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "el ser natural", f: "'el' + infinitive ser (to be) makes a noun: 'the being native', i.e. the fact that I was a native."}
          - {w: "floreciente", f: "florec- + -iente → florecer (to flower), present participle used as an adjective: 'flourishing'."}
          - {w: "acabado", f: "acab- + -ado → acabar (to finish), participle used as an adjective, masculine to match 'yo': 'finished, accomplished'."}
        note: "These are exactly the qualities a father weighed in a match: same town, 'clean' (Old Christian) blood, youth, money and wit. Ormsby leaves out the last one, 'no less accomplished in wit', which the speaker modestly claims for himself."
      - es: "Con todas estas mismas partes la pidió también otro del mismo pueblo, que fue causa de suspender y poner en balanza la voluntad del padre, a quien parecía que con cualquiera de nosotros estaba su hija bien empleada;"
