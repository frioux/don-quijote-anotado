      - es: "»Duro se nos hizo de creer la continencia del mozo, pero ella lo afirmó con tantas veras, que fueron parte para que el desconsolado padre se consolase, no haciendo cuenta de las riquezas que le llevaban, pues le habían dejado a su hija con la joya que, si una vez se pierde, no deja esperanza de que jamás se cobre."
        literal: "»Hard itself to-us made of to-believe the continence of-the young-man, but she it affirmed with such-great earnestness, that they-were part for that the disconsolate father himself might-console, not making account of the riches that from-him they-were-taking, since to-him they-had left his daughter with the jewel which, if one time itself is-lost, not leaves hope of that ever itself may-be-recovered."
        ormsby: "It was not easy for us to credit the young man’s continence, but she asserted it with such earnestness that it helped to console her distressed father, who thought nothing of what had been taken since the jewel that once lost can never be recovered had been left to his daughter."
