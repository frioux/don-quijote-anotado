          - {w: "cualquiera", f: "'whichever, either', from cual + quiera (from querer, to want), used here as a pronoun."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, she: 'would be'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
