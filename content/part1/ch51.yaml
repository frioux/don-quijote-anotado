          - {w: "tuvo", f: "tuv- + -o → tener (to have), preterite, she. Irregular: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron."}
          - {w: "entretuvo", f: "entretuv- + -o → entretener (to put off), preterite, he; built like tener (to have): entretuve, entretuviste, entretuvo, entretuvimos, entretuvisteis, entretuvieron."}
          - {w: "nos ... a entrambos", f: "'nos' (us) doubled by 'a entrambos' (both of us); entrambos = ambos, an archaic form, masculine plural."}
          - {w: "poca", f: "poc- + -a → poco (little), feminine to match 'edad'."}
