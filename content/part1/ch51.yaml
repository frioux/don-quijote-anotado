      - es: "y, por salir desta confusión, determinó decírselo a Leandra, que así se llama la rica que en miseria me tiene puesto, advirtiendo que, pues los dos éramos iguales, era bien dejar a la voluntad de su querida hija el escoger a su gusto:"
        literal: "and, to get-out of-this confusion, he-determined to-say-it-to-her to Leandra, for thus herself calls the rich [girl] who in misery me has put, noting that, since the two we-were equal, it-was well to-leave to the will of his dear daughter the choosing at her pleasure:"
        ormsby: "so to escape from this state of perplexity he resolved to refer the matter to Leandra (for that is the name of the rich damsel who has reduced me to misery), reflecting that as we were both equal it would be best to leave it to his dear daughter to choose according to her inclination—"
        vocab:
          - {w: "desta", d: "= de esta, from this (old contraction)"}
          - {w: "determinar", d: "to decide, resolve"}
          - {w: "la rica que en miseria me tiene puesto", d: "a play on words: the rich girl who has made me poor (in misery)"}
          - {w: "advertir", d: "to notice, consider, reflect (not 'to advertise' or 'to warn' here)"}
          - {w: "pues", d: "here 'since'"}
          - {w: "era bien", d: "it was right, it was best"}
          - {w: "a su gusto", d: "as she pleased, to her liking"}
        diagram:
          - s: "determinó decírselo a Leandra"
            r: "main verb: he decided to put it to Leandra"
            under:
              - {s: "por salir desta confusión", r: "why: to get out of this quandary"}
              - s: "que así se llama la rica"
                r: "aside: for that is the name of the rich girl"
                under:
                  - {s: "que en miseria me tiene puesto", r: "describes 'la rica': who has put me in misery"}
              - s: "advirtiendo"
                r: "how: considering"
                under:
                  - {s: "pues los dos éramos iguales", r: "why: since the two of us were equal"}
                  - s: "era bien dejar a la voluntad de su querida hija"
                    r: "what he considered: it was right to leave to his dear daughter's will"
                    under:
                      - {s: "el escoger a su gusto:", r: "what to leave: the choosing as she liked"}
        forms:
          - {w: "desta", f: "= de + esta (this), old contraction; modern 'de esta'."}
          - {w: "determinó", f: "determin- + -ó → determinar (to decide), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "decírselo", f: "decir (to say) + se + lo: 'to say it to her'. 'le' (to her) becomes 'se' before 'lo' (it); the pronouns hang on the infinitive and an accent is added to keep the stress."}
          - {w: "se llama", f: "llam- + -a → llamarse (to be called), present, she: 'is called'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "me tiene puesto", f: "tien- + -e → tener (to have), present, she (tengo, tienes, tiene, tenemos, tenéis, tienen), + puesto, irregular participle of poner (to put): 'has me put', i.e. has left me. tener + participle stresses the lasting state; the participle stays masculine to match 'me' (the goatherd)."}
          - {w: "advirtiendo", f: "gerund of advertir (to consider); the e of the stem turns to i in the gerund: advertir → advirtiendo."}
          - {w: "éramos, era", f: "ser (to be), imperfect, we / it. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "dejar", f: "infinitive of dejar (to leave), subject of 'era bien'."}
          - {w: "querida", f: "quer- + -ida → querer (to love), participle used as an adjective, feminine to match 'hija': 'dear'."}
          - {w: "el escoger", f: "'el' + infinitive escoger (to choose) used as a noun: 'the choosing'."}
        note: "The heroine is finally named: Leandra, a name that may recall the Greek lovers Hero and Leander. Letting a daughter choose her own husband, rather than having the father decide, was the enlightened view the goatherd goes on to praise."
