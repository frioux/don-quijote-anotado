  - sentences:
      - es: "»Este soldado, pues, que aquí he pintado, este Vicente de la Rosa, este bravo, este galán, este músico, este poeta fue visto y mirado muchas veces de Leandra, desde una ventana de su casa que tenía la vista a la plaza."
        literal: "»This soldier, then, whom here I-have painted, this Vicente de la Rosa, this bravo, this gallant, this musician, this poet was seen and watched many times by Leandra, from a window of her house which had the view to the square."
        ormsby: "This soldier, then, that I have described, this Vicente de la Roca, this bravo, gallant, musician, poet, was often seen and watched by Leandra from a window of her house which looked out on the plaza."
        vocab:
          - {w: "pintar", d: "to paint; here to describe, portray in words"}
          - {w: "bravo", d: "swaggerer, bully, as a noun; as an adjective also 'brave' or 'fierce'"}
          - {w: "galán", d: "gallant, ladies' man, a young man who dresses up and courts women"}
          - {w: "visto y mirado de", d: "seen and watched by; Cervantes often uses 'de' where modern Spanish says 'por' for the agent of a passive"}
          - {w: "tener la vista a", d: "to look out on, overlook (of a window)"}
        diagram:
          - s: "fue visto y mirado"
            r: "main verb: was seen and watched"
            under:
              - s: "Este soldado"
                r: "subject: this soldier"
                under:
                  - {s: "que aquí he pintado", r: "describes 'soldado': whom I have described here"}
                  - {s: "este Vicente de la Rosa, este bravo, este galán, este músico, este poeta", r: "the same subject, named again five times"}
              - {s: "pues", r: "linking: then, so"}
              - {s: "muchas veces", r: "how often: many times"}
              - {s: "de Leandra", r: "by whom: by Leandra"}
              - s: "desde una ventana de su casa"
                r: "from where: from a window of her house"
                under:
                  - {s: "que tenía la vista a la plaza", r: "describes 'ventana': that looked out on the square"}
        forms:
          - {w: "Este, este", f: "est- + -e → este (this), masculine singular to match 'soldado', 'bravo', 'galán', and the rest; repeated five times for rhetorical effect."}
          - {w: "he pintado", f: "he → haber (to have), present, I: he, has, ha, hemos, habéis, han; + pintado, the participle of pintar (to paint, describe): the present perfect, 'I have described'."}
          - {w: "fue visto y mirado", f: "fu- + -e → ser (to be), preterite, he: fui, fuiste, fue, fuimos, fuisteis, fueron; + visto (irregular participle of ver (to see)) and mirado (participle of mirar (to watch)): the passive, 'he was seen and watched'. The participles are masculine singular to match 'soldado'."}
          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, it (the window). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
        note: "Here Cervantes calls the soldier 'Vicente de la Rosa'; a little later in the chapter he becomes 'Vicente de la Roca', one of Cervantes' many slips with names. Ormsby uses 'Roca' throughout."
      - es: "Enamoróla el oropel de sus vistosos trajes, encantáronla sus romances, que de cada uno que componía daba veinte traslados, llegaron a sus oídos las hazañas que él de sí mismo había referido, y, finalmente, que así el diablo lo debía de tener ordenado, ella se vino a enamorar dél, antes que en él naciese presunción de solicitalla."
        literal: "Made-her-fall-in-love the tinsel of his showy outfits, enchanted-her his ballads, for of each one that he-composed he-gave-out twenty copies, arrived to her ears the exploits which he about himself same had related, and, finally, for thus the devil it must have arranged, she herself came to fall-in-love of-him, before that in him might-be-born presumption of courting-her."
        ormsby: "The glitter of his showy attire took her fancy, his ballads bewitched her (for he gave away twenty copies of every one he made), the tales of his exploits which he told about himself came to her ears; and in short, as the devil no doubt had arranged it, she fell in love with him before the presumption of making love to her had suggested itself to him;"
