          - {w: "oropel", d: "tinsel, cheap gilt brass foil; hence showy glitter with nothing behind it"}
          - {w: "vistoso", d: "showy, eye-catching"}
          - {w: "traje", d: "outfit, suit of clothes"}
          - {w: "romance", d: "ballad, the popular Spanish verse form in eight-syllable lines (not 'romance' in the English sense)"}
          - {w: "traslado", d: "copy (of a written text); a false friend, not 'transfer'"}
          - {w: "referir", d: "to relate, tell (a story)"}
          - {w: "deber de tener ordenado", d: "must have arranged; 'deber de' = must (probability)"}
          - {w: "venir a + infinitive", d: "to end up doing, come to do"}
          - {w: "dél", d: "= de él, of him (old contraction)"}
          - {w: "presunción", d: "presumption, the bold idea"}
          - {w: "solicitar", d: "to court, woo, try to seduce; 'solicitalla' = solicitarla"}
