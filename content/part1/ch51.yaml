        forms:
          - {w: "Enamoróla", f: "enamor- + -ó + la → enamorar (to make fall in love), preterite, it (the tinsel), with 'la' (her) stuck on the end; modern 'la enamoró'. Cervantes hangs the pronoun on a conjugated verb that opens the clause. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "vistosos", f: "vistos- + -os → vistoso (showy), masculine plural to match 'trajes'."}
          - {w: "encantáronla", f: "encant- + -aron + la → encantar (to enchant), preterite, they (the ballads), with 'la' (her) stuck on the end, accent added; modern 'la encantaron'. The pronoun hangs on a verb that opens the clause. Same -ar preterite: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "componía, daba", f: "compon- + -ía → componer (to compose), imperfect, he; d- + -aba → dar (to give), imperfect, he: repeated habits, 'he used to compose, he used to give out'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "llegaron", f: "lleg- + -aron → llegar (to arrive), preterite, they (the exploits): llegué, llegaste, llegó, llegamos, llegasteis, llegaron."}
          - {w: "había referido", f: "hab- + -ía → haber (to have), imperfect, he: había, habías, había, habíamos, habíais, habían; + referido, the participle of referir (to relate): the pluperfect, 'he had told'."}
          - {w: "debía de tener ordenado", f: "deb- + -ía → deber (must), imperfect, it (the devil): debía, debías, debía, debíamos, debíais, debían; 'deber de' + infinitive gives a guess, 'must have'. tener ordenado = tener (to have) + ordenado, participle of ordenar (to arrange), agreeing with 'lo': 'to have it arranged'."}
          - {w: "se vino a enamorar", f: "vin- + -o → venir (to come), preterite, she: vine, viniste, vino, vinimos, vinisteis, vinieron; 'venir a' + infinitive = to end up doing; enamorarse (to fall in love), with 'se' placed before the whole group."}
          - {w: "dél", f: "= de él, 'of him', the old contraction; modern Spanish writes 'de él'."}
          - {w: "naciese", f: "nac- + -iese → nacer (to be born), imperfect subjunctive, -se form, it (the presumption), after 'antes que' (before). The -se form of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen."}
