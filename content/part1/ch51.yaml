        note: "Leandra ran off before anyone knew she loved Vicente, so no suitor ever saw her favour a rival: the jealousy the shepherds complain of is imaginary."
      - es: "No hay hueco de peña, ni margen de arroyo, ni sombra de árbol que no esté ocupada de algún pastor que sus desventuras a los aires cuente;"
        literal: "Not there-is hollow of rock, nor bank of stream, nor shade of tree that not may-be occupied by some shepherd who his misfortunes to the airs may-tell;"
        ormsby: "There is no nook among the rocks, no brookside, no shade beneath the trees that is not haunted by some shepherd telling his woes to the breezes;"
        vocab:
          - {w: "hueco", d: "hollow, nook, cleft"}
          - {w: "peña", d: "rock, crag"}
          - {w: "margen", d: "bank, edge (of a stream); feminine in this sense"}
          - {w: "arroyo", d: "stream, brook"}
          - {w: "ocupado de", d: "occupied by, taken up by"}
          - {w: "desventura", d: "misfortune, woe"}
          - {w: "a los aires", d: "to the winds, to the breezes: telling one's sorrows to nobody"}
        diagram:
          - s: "No hay"
            r: "main verb: there is not"
            under:
              - s: "hueco de peña, ni margen de arroyo, ni sombra de árbol"
                r: "what there is not: rock-hollow, stream-bank or tree-shade"
                under:
                  - s: "que no esté ocupada de algún pastor"
                    r: "describes them: that is not taken up by some shepherd"
                    under:
                      - {s: "que sus desventuras a los aires cuente", r: "describes 'pastor': who tells his woes to the winds"}
        forms:
          - {w: "No hay", f: "hay, 'there is', the special present form of haber (to have) used for existence; with 'no' and 'ni ... ni' it means 'there is no ..., nor ..., nor ...'."}
          - {w: "esté ocupada", f: "est- + -é → estar (to be), present subjunctive, it: esté, estés, esté, estemos, estéis, estén; + ocupada, participle of ocupar (to occupy), feminine to match the nearest noun 'sombra'. Subjunctive because the clause describes something said not to exist."}
          - {w: "algún", f: "alguno (some) clipped to 'algún' before a masculine singular noun ('pastor')."}
          - {w: "cuente", f: "cuent- + -e → contar (to tell), present subjunctive, he. The stem o becomes ue when stressed: cuente, cuentes, cuente, contemos, contéis, cuenten. Subjunctive because the shepherd is any shepherd at all; the verb is put last, in the poetic order 'sus desventuras a los aires cuente'."}
          - {w: "sus desventuras", f: "sus = plural to match 'desventuras', not the owner; 'his woes'."}
        note: "Rocks, streams and shady trees are the fixed scenery of pastoral poetry, where the lover pours out his grief to nature; Eugenio's valley has filled up with such singers."
      - es: "el eco repite el nombre de Leandra dondequiera que pueda formarse:"
        literal: "the echo repeats the name of Leandra wherever that it-may-be-able to-form-itself:"
        ormsby: "wherever there is an echo it repeats the name of Leandra;"
        vocab:
          - {w: "eco", d: "echo"}
          - {w: "dondequiera que", d: "wherever (takes the subjunctive)"}
          - {w: "formarse", d: "to be formed, arise"}
        diagram:
          - s: "el eco repite el nombre de Leandra"
            r: "main verb: the echo repeats Leandra's name"
            under:
              - {s: "dondequiera que pueda formarse", r: "where: wherever an echo can arise"}
        forms:
          - {w: "repite", f: "repit- + -e → repetir (to repeat), present, it. The e of the stem becomes i when stressed: repito, repites, repite, repetimos, repetís, repiten."}
          - {w: "pueda", f: "pued- + -a → poder (to be able), present subjunctive, it. The stem o becomes ue when stressed: pueda, puedas, pueda, podamos, podáis, puedan. Subjunctive after 'dondequiera que' (wherever)."}
          - {w: "formarse", f: "formar (to form) + se (itself), the pronoun hung on the infinitive after 'pueda'."}
        note: "The echo that sends back the beloved's name is an old pastoral device (Virgil's first Eclogue teaches the woods to resound 'Amaryllis'); Cervantes plays it straight here and lets the next sentence run it to excess."
      - es: "Leandra resuenan los montes, Leandra murmuran los arroyos, y Leandra nos tiene a todos suspensos y encantados, esperando sin esperanza y temiendo sin saber de qué tememos."
        literal: "Leandra resound the mountains, Leandra murmur the streams, and Leandra us has all suspended and enchanted, hoping without hope and fearing without knowing of what we-fear."
        ormsby: "the mountains ring with “Leandra,” “Leandra” murmur the brooks, and Leandra keeps us all bewildered and bewitched, hoping without hope and fearing without knowing what we fear."
        vocab:
          - {w: "resonar", d: "to resound, ring with"}
          - {w: "murmurar", d: "to murmur (of water); also to gossip"}
          - {w: "suspenso", d: "spellbound, in suspense, bewildered"}
          - {w: "encantado", d: "enchanted, bewitched"}
          - {w: "esperar sin esperanza", d: "to hope without hope: a play on 'esperar' (to hope, to wait) and 'esperanza' (hope), a favourite paradox of love poetry"}
        diagram:
          - {s: "Leandra resuenan los montes", r: "main verb 1: the mountains ring with 'Leandra'"}
          - {s: "Leandra murmuran los arroyos", r: "main verb 2: the streams murmur 'Leandra'"}
          - s: "y Leandra nos tiene a todos suspensos y encantados"
            r: "main verb 3: and Leandra keeps us all spellbound and bewitched"
            under:
              - {s: "esperando sin esperanza", r: "how, 1: hoping without hope"}
              - s: "y temiendo"
                r: "how, 2: and fearing"
                under:
                  - {s: "sin saber de qué tememos", r: "how: without knowing what we fear"}
        forms:
          - {w: "resuenan", f: "resuen- + -an → resonar (to resound), present, they (the mountains). The stem o becomes ue when stressed: resueno, resuenas, resuena, resonamos, resonáis, resuenan. 'Leandra' is the word they echo, put first for effect."}
          - {w: "murmuran", f: "murmur- + -an → murmurar (to murmur), present, they (the streams). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "tiene", f: "tien- + -e → tener (to have, keep), present, she (Leandra). Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen. 'Tener a alguien suspenso' = to keep someone spellbound."}
          - {w: "suspensos y encantados", f: "suspens- + -os → suspenso (spellbound) and encant- + -ados → encantar (to enchant), participle, both masculine plural to match 'nos ... todos'."}
          - {w: "esperando, temiendo", f: "gerunds: esper- + -ando → esperar (to hope), and tem- + -iendo → temer (to fear). -ar verbs take -ando, -er and -ir verbs -iendo."}
          - {w: "saber", f: "saber (to know), infinitive after 'sin'."}
          - {w: "tememos", f: "tem- + -emos → temer (to fear), present, we. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
      - es: "Entre estos disparatados, el que muestra que menos y más juicio tiene es mi competidor Anselmo, el cual, teniendo tantas otras cosas de que quejarse, sólo se queja de ausencia; y al son de un rabel, que admirablemente toca, con versos donde muestra su buen entendimiento, cantando se queja."
        literal: "Among these crazed-ones, the [one] who shows that less and more judgment he-has is my rival Anselmo, the which, having so-many other things of which to-complain-himself, only himself complains of absence; and to-the sound of a rebec, which admirably he-plays, with verses where he-shows his good understanding, singing himself he-complains."
        ormsby: "Of all this silly set the one that shows the least and also the most sense is my rival Anselmo, for having so many other things to complain of, he only complains of separation, and to the accompaniment of a rebeck, which he plays admirably, he sings his complaints in verses that show his ingenuity."
        vocab:
          - {w: "disparatado", d: "crazy, foolish; as a noun, a madman (from 'disparate', nonsense)"}
          - {w: "juicio", d: "judgment, sense, sanity"}
          - {w: "competidor", d: "rival (in love)"}
          - {w: "ausencia", d: "absence, separation from the beloved: in love poetry the classic grief"}
          - {w: "al son de", d: "to the sound of, accompanied by"}
          - {w: "rabel", d: "rebec, a small three-stringed bowed fiddle, the traditional instrument of shepherds"}
          - {w: "entendimiento", d: "understanding, intelligence, wit"}
        diagram:
          - s: "es mi competidor Anselmo"
            r: "main verb 1: is my rival Anselmo"
            under:
              - {s: "Entre estos disparatados", r: "among whom: among these madmen"}
              - s: "el que muestra"
                r: "subject: the one who shows"
                under:
                  - {s: "que menos y más juicio tiene", r: "what he shows: that he has both the least and the most sense"}
              - s: "el cual"
                r: "describes 'Anselmo': who"
                under:
                  - {s: "teniendo tantas otras cosas de que quejarse", r: "although: having so many other things to complain of"}
                  - {s: "sólo se queja de ausencia", r: "what he does: complains only of absence"}
          - s: "cantando se queja"
            r: "main verb 2 (after 'y'): he complains in song"
            under:
              - s: "al son de un rabel"
                r: "how: to the sound of a rebec"
                under:
                  - {s: "que admirablemente toca", r: "describes 'rabel': which he plays admirably"}
              - s: "con versos"
                r: "how: in verses"
                under:
                  - {s: "donde muestra su buen entendimiento", r: "describes 'versos': in which he shows his good wit"}
        forms:
          - {w: "estos disparatados", f: "est- + -os → este (these) and disparat- + -ados → disparatar (to talk nonsense), participle used as a noun, masculine plural: 'these madmen'."}
          - {w: "muestra", f: "muestr- + -a → mostrar (to show), present, he. The stem o becomes ue when stressed: muestro, muestras, muestra, mostramos, mostráis, muestran."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, he. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "es", f: "ser (to be), present, he: soy, eres, es, somos, sois, son."}
          - {w: "el cual", f: "'who, which', masculine to match 'Anselmo'; a heavier relative than 'que', used after a comma."}
          - {w: "teniendo", f: "gerund of tener (to have): 'having', here with the sense 'though he has'."}
          - {w: "de que quejarse", f: "quejar (to complain) + se (himself), infinitive after 'de que': 'things of which to complain'."}
          - {w: "se queja", f: "quej- + -a → quejarse (to complain), present, he, with 'se'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "al", f: "a + el, 'to the'."}
          - {w: "admirablemente", f: "admirable + -mente: the -mente suffix turns an adjective into an adverb, 'admirably'."}
          - {w: "toca", f: "toc- + -a → tocar (to play an instrument), present, he. Same -ar present: -o, -as, -a, -amos, -áis, -an."}
          - {w: "buen", f: "bueno (good) clipped to 'buen' before a masculine singular noun ('entendimiento')."}
          - {w: "cantando", f: "cant- + -ando → cantar (to sing), gerund, placed before the verb: 'singing, he complains', i.e. he sings his complaints."}
        note: "Anselmo shows the least sense because he still pines for Leandra, and the most because he blames only her absence, not her conduct. The rebec, a small bowed fiddle, was the shepherd's instrument of Spanish pastoral poetry."
      - es: "Yo sigo otro camino más fácil, y a mi parecer el más acertado, que es decir mal de la ligereza de las mujeres, de su inconstancia, de su doble trato, de sus promesas muertas, de su fe rompida, y, finalmente, del poco discurso que tienen en saber colocar sus pensamientos e intenciones que tienen.»"
        literal: "I follow another road more easy, and to my opinion the most fitting, which is to-say ill of the lightness of the women, of their inconstancy, of their double dealing, of their promises dead, of their faith broken, and, finally, of-the little reasoning that they-have in knowing-how to-place their thoughts and intentions that they-have.»"
        ormsby: "I follow another, easier, and to my mind wiser course, and that is to rail at the frivolity of women, at their inconstancy, their double dealing, their broken promises, their unkept pledges, and in short the want of reflection they show in fixing their affections and inclinations."
        vocab:
          - {w: "a mi parecer", d: "in my opinion"}
          - {w: "acertado", d: "wise, well-judged, right"}
          - {w: "decir mal de", d: "to speak ill of, rail at"}
          - {w: "ligereza", d: "fickleness, frivolity (literally 'lightness')"}
          - {w: "doble trato", d: "double dealing, two-facedness"}
          - {w: "promesas muertas", d: "dead promises, i.e. broken or empty ones"}
          - {w: "fe rompida", d: "broken faith, a broken pledge; 'rompida' is the old regular participle, modern 'rota'"}
          - {w: "discurso", d: "reasoning, judgment, reflection (false friend: not 'speech' here)"}
          - {w: "colocar", d: "to place, bestow; 'colocar sus pensamientos' = to fix their affections on someone"}
        diagram:
          - s: "Yo sigo otro camino más fácil"
            r: "main verb: I follow another, easier road"
            under:
              - {s: "y a mi parecer el más acertado", r: "describes 'camino', 2: and in my opinion the wisest"}
              - s: "que es decir mal"
                r: "describes 'camino': which is to speak ill"
                under:
                  - {s: "de la ligereza de las mujeres", r: "of what, 1: of women's fickleness"}
                  - {s: "de su inconstancia, de su doble trato, de sus promesas muertas, de su fe rompida", r: "of what, 2 to 5: inconstancy, double dealing, broken promises, broken faith"}
                  - s: "y, finalmente, del poco discurso"
                    r: "of what, 6: and finally of the poor judgment"
                    under:
                      - {s: "que tienen en saber colocar sus pensamientos e intenciones que tienen", r: "describes 'discurso': that they show in bestowing their affections"}
        forms:
          - {w: "sigo", f: "sig- + -o → seguir (to follow), present, I. The e of the stem becomes i when stressed, and gu becomes g before o: sigo, sigues, sigue, seguimos, seguís, siguen."}
          - {w: "el más acertado", f: "acert- + -ado → acertar (to hit the mark), participle used as an adjective; 'el más' before it makes the superlative, 'the wisest'. Masculine to match 'camino'."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "decir", f: "decir (to say), infinitive used as a noun after 'es': 'to speak ill'."}
          - {w: "sus promesas muertas", f: "sus = plural to match 'promesas', not the owner; muert- + -as → muerto (dead), feminine plural to match 'promesas'."}
          - {w: "rompida", f: "romp- + -ida → romper (to break), participle, feminine to match 'fe'. The old regular form 'rompido/rompida'; modern Spanish uses only the irregular 'roto/rota'."}
          - {w: "del", f: "de + el, 'of the'."}
          - {w: "tienen", f: "tien- + -en → tener (to have), present, they (the women). Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen. Used twice, the second time redundantly ('intentions that they have')."}
          - {w: "saber colocar", f: "saber (to know how) + colocar (to place), two infinitives: 'knowing how to place'. 'Saber' + infinitive means 'to know how to'."}
          - {w: "e", f: "'and', the form 'y' takes before a word starting with an i sound ('intenciones')."}
        note: "The closing » ends the story Eugenio has told in his own quoted voice since 'Tres leguas deste valle'; in the next sentence he turns back to his listeners. His railing against women is a set-piece of the misogynist tradition that the pastoral answered with its defences of women, as Marcela defended herself earlier in the book."
      - es: "Y ésta fue la ocasión, señores, de las palabras y razones que dije a esta cabra cuando aquí llegué;"
        literal: "And this was the occasion, sirs, of the words and speeches that I-said to this goat when here I-arrived;"
        ormsby: "This, sirs, was the reason of words and expressions I made use of to this goat when I came up just now;"
        vocab:
          - {w: "ocasión", d: "cause, reason (not only 'occasion')"}
          - {w: "razones", d: "words, remarks (old sense of 'razón', a thing said), not 'reasons'"}
          - {w: "cabra", d: "goat; the spotted she-goat he was scolding when he arrived"}
        diagram:
          - s: "Y ésta fue la ocasión"
            r: "main verb: and this was the reason"
            under:
              - {s: "señores", r: "addressed to: sirs (his listeners)"}
              - s: "de las palabras y razones"
                r: "the reason for what: for the words and remarks"
                under:
                  - {s: "que dije a esta cabra", r: "describes 'palabras': that I said to this goat"}
                  - {s: "cuando aquí llegué", r: "when: when I arrived here"}
        forms:
          - {w: "ésta", f: "ésta (this), feminine pronoun to match 'ocasión'; the old spelling writes the accent on the pronoun."}
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, it. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "dije", f: "dij- + -e → decir (to say), preterite, I. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "esta", f: "est- + -a → este (this), feminine to match 'cabra'."}
          - {w: "llegué", f: "llegu- + -é → llegar (to arrive), preterite, I; g becomes gu before e to keep the hard sound. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
        note: "The goatherd now steps out of his story to explain the scene at the end of the previous chapter, where he scolded his spotted goat as if she could understand him."
      - es: "que por ser hembra la tengo en poco, aunque es la mejor de todo mi apero."
        literal: "for for being female her I-hold in little, although she-is the best of all my stock."
        ormsby: "for as she is a female I have a contempt for her, though she is the best in all my fold."
        vocab:
          - {w: "que", d: "here 'for, since', giving the reason"}
          - {w: "por ser", d: "because of being, since she is"}
          - {w: "hembra", d: "female (of animals; of women it is blunt)"}
          - {w: "tener en poco", d: "to think little of, hold in contempt"}
          - {w: "apero", d: "a farm's stock and gear; here his flock, his herd"}
        diagram:
          - s: "la tengo en poco"
            r: "main verb (after 'que', for): I think little of her"
            under:
              - {s: "por ser hembra", r: "why: because she is a female"}
              - {s: "aunque es la mejor de todo mi apero", r: "concession: although she is the best of my whole herd"}
        forms:
          - {w: "ser", f: "ser (to be), infinitive after 'por': 'por ser' = because of being."}
          - {w: "la", f: "'her' (the goat), direct object, placed before the verb."}
          - {w: "tengo", f: "teng- + -o → tener (to hold), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "es", f: "ser (to be), present, she: soy, eres, es, somos, sois, son."}
          - {w: "la mejor", f: "mejor (better), with 'la' before it the superlative 'the best', feminine 'la' to match the goat; 'mejor' itself has one form for both genders."}
          - {w: "todo mi", f: "todo (all, whole) and mi (my), masculine singular to match 'apero'."}
        note: "The joke completes the previous chapter's scene: Eugenio scolds his best goat for being female, taking out on her his grudge against Leandra and all women."
      - es: "Ésta es la historia que prometí contaros; si he sido en el contarla prolijo, no seré en serviros corto: cerca de aquí tengo mi majada, y en ella tengo fresca leche y muy sabrosísimo queso, con otras varias y sazonadas frutas, no menos a la vista que al gusto agradables."
        literal: "This is the story that I-promised to-tell-you; if I-have been in the telling-it long-winded, not I-shall-be in serving-you short: near from here I-have my hut, and in it I-have fresh milk and very most-tasty cheese, with other various and ripe fruits, not less to the sight than to-the taste pleasing."
        ormsby: "This is the story I promised to tell you, and if I have been tedious in telling it, I will not be slow to serve you; my hut is close by, and I have fresh milk and dainty cheese there, as well as a variety of toothsome fruit, no less pleasing to the eye than to the palate."
        vocab:
          - {w: "prolijo", d: "long-winded, tedious (not 'prolific')"}
          - {w: "corto", d: "short; here slow, sparing, stingy: 'no seré corto' = I shall not hold back"}
          - {w: "majada", d: "a shepherd's hut and fold where the flock is penned at night"}
          - {w: "sabroso", d: "tasty, delicious"}
          - {w: "sazonado", d: "ripe, in season; also well-seasoned"}
          - {w: "agradable", d: "pleasing, pleasant"}
        diagram:
          - s: "Ésta es la historia"
            r: "main verb 1: this is the story"
            under:
              - {s: "que prometí contaros", r: "describes 'historia': that I promised to tell you"}
          - s: "no seré en serviros corto"
            r: "main verb 2: I shall not be slow in serving you"
            under:
              - {s: "si he sido en el contarla prolijo", r: "condition: if I have been long-winded in telling it"}
          - s: "cerca de aquí tengo mi majada"
            r: "main verb 3: near here I have my hut"
          - s: "y en ella tengo"
            r: "main verb 4: and in it I have"
            under:
              - {s: "fresca leche y muy sabrosísimo queso", r: "object: fresh milk and very tasty cheese"}
              - s: "con otras varias y sazonadas frutas"
                r: "object, 2: with other assorted, ripe fruits"
                under:
                  - {s: "no menos a la vista que al gusto agradables", r: "describes 'frutas': no less pleasing to the eye than to the taste"}
        forms:
          - {w: "Ésta", f: "ésta (this), feminine pronoun to match 'historia'; the old spelling writes the accent on the pronoun."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "prometí", f: "promet- + -í → prometer (to promise), preterite, I. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "contaros", f: "contar (to tell) + os (to you, plural), the pronoun hung on the infinitive after 'prometí'."}
          - {w: "he sido", f: "he (from haber, to have, present, I) + sido, the participle of ser (to be): the perfect, 'I have been'. haber (to have) in the present: he, has, ha, hemos, habéis, han."}
          - {w: "el contarla", f: "contar (to tell) + la (it, the story), the infinitive used as a noun with 'el': 'in the telling of it'."}
          - {w: "seré", f: "ser- + -é → ser (to be), future, I. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "serviros", f: "servir (to serve) + os (you, plural), the pronoun hung on the infinitive after 'en'."}
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "ella", f: "'it', feminine because it stands for 'mi majada'."}
          - {w: "muy sabrosísimo", f: "sabros- + -ísimo → sabroso (tasty) with the superlative suffix -ísimo ('most tasty'), and 'muy' (very) on top: a double intensifier, 'very most delicious', which standard Spanish avoids but rustic and playful speech used. Masculine to match 'queso'."}
          - {w: "otras varias y sazonadas", f: "otr- + -as → otro (other), vari- + -as → vario (assorted), sazon- + -adas → sazonar (to season, ripen), participle; all feminine plural to match 'frutas'."}
          - {w: "al", f: "a + el, 'to the'."}
          - {w: "agradables", f: "agradable (pleasing) + -s, plural to match 'frutas'; the adjective comes last, after the comparison 'no menos a la vista que al gusto'."}
        note: "Hospitality of milk, cheese and fruit is the classic rustic welcome of pastoral, going back to Virgil's shepherds, and it echoes the goatherds who fed Don Quijote acorns and cheese in Chapter 11."
summary: |
  The goatherd, Eugenio, tells his story to the canon, the priest and the others escorting the caged Don Quijote. In a rich village three leagues away lived a respected farmer whose daughter, Leandra, grew up so beautiful that her fame spread to distant cities and even to royal courts. Many sought her hand, among them Eugenio himself and another young man of the same town and the same advantages, Anselmo. Unable to choose, the father left the choice to Leandra, but put both suitors off with her youth and vague promises.

  Then Vicente de la Rosa, a farmhand's son carried off as a boy by a passing captain, came home after twelve years as a soldier. He dressed in gaudy finery that he cleverly recombined so that three suits looked like ten, sat under the poplar in the square telling of the battles he had fought and the Moors he had killed, showed wounds no one could see, called his equals 'vos', played the guitar and wrote endless ballads.

  Leandra watched him from her window, fell in love before he had even thought of courting her, and ran away with him, taking money and jewels from her father. Three days later the officers of the Holy Brotherhood found her in a mountain cave in her shift: Vicente had promised to marry her and take her to Naples, then robbed her of everything and left her, though, she insisted, with her honour intact. Her father shut her up in a convent in a nearby town.

  In despair Eugenio and Anselmo left the village to be herdsmen in this valley, and many other former suitors followed, turning the place into a new Arcadia where every shepherd praises or curses Leandra and the echo repeats her name. Anselmo sings of absence to his rebec; Eugenio rails against the fickleness of all women, which is why he scolded his she-goat. He ends by offering his listeners milk, cheese and fruit at his hut nearby.
context: |
  Village honour. The story turns on the values of a rich Castilian farming village. The father's 'honra' is public esteem, which wealth normally brings; a suitor's claims are his birth in the same town, his 'clean blood' (Old Christian descent, with no Jewish or Moorish ancestors, a requirement that ran through Spanish society), his youth, his property and his wit. A daughter's good name was the family's most precious possession, 'the jewel' the goatherd says was left to her, and a father whose daughter had been compromised could hide her in a convent until gossip died down. The officers who search the hills are the 'cuadrilleros' of the Santa Hermandad, the rural police whom Don Quijote and Sancho have already had reason to fear.

  The braggart soldier. Vicente de la Rosa is the 'miles gloriosus', the boastful soldier of Roman comedy, set in a Spanish village: back from Italy in the gaudy dress of the infantry, hung with trinkets and chains, claiming to have killed more Moors than live in Morocco and Tunis and to outdo famous champions such as Diego García de Paredes, the immensely strong soldier of the Italian wars. Addressing his equals as 'vos' was a deliberate slight in a society where forms of address marked rank exactly. Coming two chapters after Don Quijote's speech on the soldier's hard life, he is the other side of the coin: the soldier as a fraud. Ormsby notes that the names 'Gante y Luna' set beside García de Paredes in the original editions are not known as champions and that Garcilaso is a more likely reading.

  Pastoral. The last of the stories told in Part I returns to the pastoral world of Grisóstomo and Marcela: young men of means who dress as shepherds and goatherds to lament an unattainable woman, so many of them that the valley becomes 'the pastoral Arcadia', the ideal shepherds' land of Sannazaro's Arcadia and the Spanish pastoral romances. The conventions are all here: the echo repeating the beloved's name, the brooks and mountains that murmur it, the rebec, shepherds who sing their complaints in verse, the lover who complains of jealousy without ever having spoken to the lady. Cervantes lets the goatherd mock these extremes even as he takes part in them, and ends the tale with milk and cheese, a homely touch real pastoral rarely allows.

  The narrator's games. The tale is told aloud to an audience on the road, with Don Quijote listening from his cage. Eugenio apologizes for spending so long on Vicente's clothes, 'for they play a large part in this story', and calls his tale a tragedy whose end is still pending. His closing tirade against women's fickleness, and the she-goat he scolds 'because she is female', make the misogyny partly comic: he is a jilted lover, and the story records both Leandra's own claim that her honour was untouched and the village's harsher view that she sinned from wantonness, not ignorance.

  Names. Leandra and Eugenio (Greek 'well-born') are names in the style of the pastoral romances; Anselmo shares his name with the husband of the 'Curioso impertinente' read aloud at the inn earlier. The soldier is 'Vicente de la Rosa' at first and 'Vicente de la Roca' later in the same chapter, one of Cervantes' slips; Ormsby uses Roca throughout.

  Reading Cervantes' Spanish. The old spellings of this chapter: deste, desta, dél, dellas (de + este, esta, él, ellas), estremado (extremado), estender and estiende (extender), proprio (propio), vitoria (victoria), faciones (facciones), rencuentro (reencuentro), monesterio (monasterio), desparecer (desaparecer), entrambos (ambos), 'el aldea' and 'toda el aldea' for 'la aldea', and solicitalla, quitalle, where -rl- of the infinitive plus pronoun has become -ll-. Pronouns hang on the end of conjugated verbs that open a clause (Guardábala, Llámase, Llevóle, Enamoróla, encantáronla, tomáronse, Volviéronla, apocábase). The -se imperfect subjunctive runs through the story (pidiesen, hubiese visto, dejase, consolase, fuese), along with the old subjunctive 'vais' for 'vayáis', 'tener' + participle for a lasting result ('me tiene puesto', 'tengo dicho'), the absolute participle 'Encerrada Leandra', ir + gerund for gradual change ('fue creciendo', 'voy contando'), and the double intensifier 'muy sabrosísimo'. Watch the false friends: suceso (outcome, event), discreción (good sense), advertir (to consider), entretener (to put off), admirarse (to marvel), ejercicio (way of life), and porque meaning 'so that'.
