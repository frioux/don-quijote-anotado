part: 1
chapter: 14
title_es: "Capítulo XIV. Donde se ponen los versos desesperados del difunto pastor, con otros no esperados sucesos"
title_en: "Wherein are inserted the despairing verses of the dead shepherd, together with other incidents not looked for"
paragraphs:
  - sentences:
      - es: "Canción de Grisóstomo"
        literal: "Song of Grisóstomo"
        ormsby: "The Lay of Chrysostom"
        vocab:
          - {w: "canción", d: "song; here a 'canción' in the Italian manner, a canzone of long stanzas in eleven-syllable lines, the most ambitious form of Renaissance love poetry"}
          - {w: "Grisóstomo", d: "the student turned shepherd whose burial is under way; his name is Chrysostom, 'golden-mouthed', after the eloquent Church Father, a joke on a poet who dies of unanswered words"}
        diagram:
          - s: "Canción"
            r: "heading: a song, no verb"
            under:
              - {s: "de Grisóstomo", r: "whose: by Grisóstomo"}
        forms:
          - {w: "Canción", f: "noun, feminine, as every word in -ción is (la canción, las canciones). The Spanish word for the Italian 'canzone', a poem in long stanzas of eleven- and seven-syllable lines."}
          - {w: "de Grisóstomo", f: "'de' + a name marks the author: 'by Grisóstomo', as in 'una comedia de Lope'."}
        ormsby_note: "There is here a play upon the words desesperados, 'despairing,' and no esperados, 'not looked for:' many of the headings to the chapters contain some verbal conceit of this kind."
        note: "The chapter heading puns on 'versos desesperados' (despairing verses) and 'sucesos no esperados' (unlooked-for events). The song is the paper Vivaldo snatched from the fire in the previous chapter: Grisóstomo's farewell poem, read aloud over his open grave."
  - sentences:
      - es: "Ya que quieres, cruel, que se publique, de lengua en lengua y de una en otra gente, del áspero rigor tuyo la fuerza, haré que el mesmo infierno comunique al triste pecho mío un son doliente, con que el uso común de mi voz tuerza."
        literal: "Since you-want, cruel [one], that be-published, from tongue to tongue and from one to another people, of-the harsh rigor yours the force, I-will-make that the very hell communicate to-the sad breast mine a sound grieving, with which the use common of my voice I-may-twist."
        ormsby: "Since thou dost in thy cruelty desire / The ruthless rigour of thy tyranny / From tongue to tongue, from land to land proclaimed, / The very Hell will I constrain to lend / This stricken breast of mine deep notes of woe / To serve my need of fitting utterance."
        vocab:
          - {w: "ya que", d: "since, now that"}
          - {w: "cruel", d: "cruel one; the poem addresses Marcela throughout as 'cruel', the lover's standard name for an unyielding lady"}
          - {w: "publicarse", d: "to be made public, be proclaimed abroad"}
          - {w: "de lengua en lengua", d: "from tongue to tongue, from mouth to mouth"}
          - {w: "de una en otra gente", d: "from one nation to another; 'gente' here is 'people, nation'"}
          - {w: "áspero", d: "harsh, rough"}
          - {w: "rigor", d: "harshness, severity; in love poetry, the lady's refusal to love back"}
          - {w: "mesmo", d: "= mismo; 'el mesmo infierno' = hell itself"}
          - {w: "comunicar", d: "to impart, pass on, lend"}
          - {w: "son", d: "sound, tune (poetic)"}
          - {w: "doliente", d: "grieving, aching, sorrowful"}
          - {w: "torcer", d: "to twist, bend out of shape"}
          - {w: "uso común", d: "ordinary use, normal function"}
        diagram:
          - s: "haré"
            r: "main verb: I will make"
            under:
              - s: "Ya que quieres, cruel,"
                r: "reason: since you, cruel one, want"
                under:
                  - {s: "que se publique, de lengua en lengua y de una en otra gente, del áspero rigor tuyo la fuerza", r: "what you want: that the force of your harsh rigor be proclaimed from tongue to tongue and nation to nation"}
              - s: "que el mesmo infierno comunique al triste pecho mío un son doliente"
                r: "what I will make happen: that hell itself lend my sad breast a grieving sound"
                under:
                  - {s: "con que el uso común de mi voz tuerza", r: "describes 'son': with which I may twist my voice from its ordinary use"}
        forms:
          - {w: "quieres", f: "quier- + -es → querer (to want), present, you. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "se publique", f: "public- + -e, spelled -que to keep the hard c → publicar (to make public), present subjunctive, it, with 'se' making it passive: 'be proclaimed'. Subjunctive because it is what you want ('quieres que'). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "tuyo", f: "'yours' placed after the noun ('rigor tuyo'); before the noun it would be 'tu rigor'. The poem keeps putting possessives after the noun."}
          - {w: "haré", f: "har- + -é → hacer (to make), future, I. Irregular stem: haré, harás, hará, haremos, haréis, harán. 'hacer que' + subjunctive = to make something happen."}
          - {w: "mesmo", f: "= mismo (very, itself), masculine to match 'infierno'."}
          - {w: "comunique", f: "comunic- + -e, spelled -que → comunicar (to impart), present subjunctive, it (hell), after 'haré que'. Same -e subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "mío", f: "'mine' after the noun ('pecho mío'), poetic for 'mi pecho'."}
          - {w: "doliente", f: "dol- + -iente → doler (to ache): the old active participle in -nte used as an adjective, 'grieving' (like 'andante' from andar). One ending for both genders."}
          - {w: "tuerza", f: "tuerz- + -a → torcer (to twist), present subjunctive, I. The stem o becomes ue when stressed and c becomes z before a: tuerza, tuerzas, tuerza, torzamos, torzáis, tuerzan. Subjunctive because it states a purpose ('con que' = so that with it)."}
        ormsby_note: "The 'Lay of Chrysostom' must not be judged of by a translation. The original is not so much a piece of poetry, as a fantasia in rhyme and an experiment in versification. Whether Italian or Spanish, the canzone or canción is from its style hard to translate into our matter-of-fact English, but the difficulty here is increased by the peculiarly complex stanza and intricate system of interlaced rhymes which Cervantes adopted, as well as by the inimitable rhythm and harmony of the lines. One peculiarity, borrowed, it may be, from Garcilaso, is that of a line with a medial rhyme to the termination of the preceding line, which produces a cadence that falls upon the ear like that of waves upon a distant shore. It might be possible to imitate the arrangement of rhymes, but to imitate the effect or reproduce the melody in our consonantal language would be an utter impossibility."
        note: "The poem has eight stanzas of sixteen eleven-syllable lines and a five-line farewell. Gutenberg runs each stanza together as one paragraph; the rhymes (publique / comunique, esfuerza / tuerza) mark where the lines end. The internal rhyme Ormsby mentions is heard in 'que en mí se halla / para contalla' and 'en mi querella, / estar sin ella'."
      - es: "Y al par de mi deseo, que se esfuerza a decir mi dolor y tus hazañas, de la espantable voz irá el acento, y en él mezcladas, por mayor tormento, pedazos de las míseras entrañas."
        literal: "And at the pace of my desire, which strives to tell my pain and your deeds, of the frightful voice will-go the accent, and in it mixed, for greater torment, pieces of the wretched entrails."
        ormsby: "And as I strive to body forth the tale / Of all I suffer, all that thou hast done, / Forth shall the dread voice roll, and bear along / Shreds from my vitals torn for greater pain."
        vocab:
          - {w: "al par de", d: "alongside, keeping pace with"}
          - {w: "esforzarse a", d: "to strive to, make an effort to"}
          - {w: "hazaña", d: "deed, exploit; here bitter: her cruelties are her 'exploits'"}
          - {w: "espantable", d: "frightful, dreadful; the old form of 'espantoso'"}
          - {w: "acento", d: "voice, tone, utterance (poetic), not 'accent' in the modern sense"}
          - {w: "tormento", d: "torment"}
          - {w: "pedazo", d: "piece, shred"}
          - {w: "mísero", d: "wretched, miserable"}
          - {w: "entrañas", d: "entrails, innards; in old Spanish the seat of feeling, as English 'heart' or 'bowels of compassion'"}
        diagram:
          - s: "irá el acento"
            r: "main verb: the voice's utterance will go forth"
            under:
              - s: "Y al par de mi deseo"
                r: "how: keeping pace with my desire"
                under:
                  - {s: "que se esfuerza a decir mi dolor y tus hazañas", r: "describes 'deseo': which strives to tell my pain and your deeds"}
              - {s: "de la espantable voz", r: "whose utterance: of the frightful voice"}
              - {s: "y en él mezcladas, por mayor tormento, pedazos de las míseras entrañas", r: "second subject of 'irá': and, mixed into it for greater torment, shreds of my wretched entrails"}
        forms:
          - {w: "se esfuerza", f: "esfuerz- + -a → esforzarse (to strive), present, it (the desire), with 'se'. The stem o becomes ue when stressed: esfuerzo, esfuerzas, esfuerza, esforzamos, esforzáis, esfuerzan."}
          - {w: "tus", f: "'your' (for tú), plural to match 'hazañas', not the owner."}
          - {w: "espantable", f: "espant- + -able → from espantar (to frighten): 'frightful'; modern Spanish says espantoso. One ending for both genders."}
          - {w: "irá", f: "ir (to go), future, it. The future adds -é, -ás, -á, -emos, -éis, -án to the whole infinitive: iré, irás, irá, iremos, iréis, irán."}
          - {w: "él", f: "'it' (the acento), with the accent mark that tells it from 'el' (the)."}
          - {w: "mezcladas", f: "mezcl- + -adas → participle of mezclar (to mix), feminine plural. Strictly it should match 'pedazos' (masculine); the poet lets it agree with 'entrañas', the feminine noun the pieces are made of, a licence of the verse."}
          - {w: "mayor", f: "the comparative of grande (big): 'greater'. One ending for both genders."}
          - {w: "míseras", f: "míser- + -as → mísero (wretched), feminine plural to match 'entrañas'."}
      - es: "Escucha, pues, y presta atento oído, no al concertado son, sino al rüido que de lo hondo de mi amargo pecho, llevado de un forzoso desvarío, por gusto mío sale y tu despecho."
        literal: "Listen, then, and lend attentive ear, not to-the harmonious sound, but to-the noise that from the deep of my bitter breast, carried by a forced raving, for pleasure mine comes-out and your spite."
        ormsby: "Then listen, not to dulcet harmony, / But to a discord wrung by mad despair / Out of this bosom’s depths of bitterness, / To ease my heart and plant a sting in thine."
        vocab:
          - {w: "pues", d: "then, so (linking word, not 'because' here)"}
          - {w: "prestar oído", d: "to lend an ear, listen"}
          - {w: "atento", d: "attentive"}
          - {w: "concertado", d: "harmonious, well ordered, in tune"}
          - {w: "rüido", d: "= ruido, noise; the two dots make it three syllables (ru-í-do) for the meter"}
          - {w: "lo hondo", d: "the depths, the bottom"}
          - {w: "amargo", d: "bitter"}
          - {w: "llevado de", d: "carried along by, driven by"}
          - {w: "forzoso", d: "forced, unavoidable, that cannot be helped"}
          - {w: "desvarío", d: "raving, delirium, madness"}
          - {w: "por gusto mío", d: "for my own pleasure"}
          - {w: "despecho", d: "spite, vexation; 'por tu despecho' = to spite you"}
        diagram:
          - {s: "Escucha", r: "main verb 1: listen (a command to Marcela)"}
          - s: "y presta atento oído"
            r: "main verb 2: and lend an attentive ear"
            under:
              - {s: "no al concertado son", r: "not to what: not to a harmonious sound"}
              - s: "sino al rüido"
                r: "but to what: but to the noise"
                under:
                  - {s: "que de lo hondo de mi amargo pecho, llevado de un forzoso desvarío, por gusto mío sale y tu despecho", r: "describes 'rüido': which comes out of the depths of my bitter breast, driven by a raving I cannot help, for my pleasure and your spite"}
        forms:
          - {w: "Escucha", f: "escuch- + -a → escuchar (to listen), command, you (tú). The tú command of an -ar verb is the same as the he/she present: escucha; for -er and -ir verbs it ends in -e (come, vive)."}
          - {w: "presta", f: "prest- + -a → prestar (to lend), command, you. Same -a command."}
          - {w: "atento", f: "adjective (attentive), masculine to match 'oído', placed before the noun for emphasis."}
          - {w: "al", f: "a + el, twice ('al concertado son', 'al rüido')."}
          - {w: "concertado", f: "participle of concertar (to put in order, to tune) used as an adjective, masculine to match 'son'."}
          - {w: "rüido", f: "= ruido (noise). The dieresis on ü breaks the diphthong so the word counts as three syllables, ru-í-do, and the line reaches its eleven."}
          - {w: "llevado", f: "llev- + -ado → participle of llevar (to carry), masculine to match 'rüido'. 'de' marks the doer ('carried by a raving'), where modern Spanish uses 'por'."}
          - {w: "mío", f: "'mine' after the noun ('gusto mío'), poetic for 'mi gusto'."}
          - {w: "sale", f: "sal- + -e → salir (to come out), present, it (the noise). The present of -ir verbs: -o, -es, -e, -imos, -ís, -en; salir has 'salgo' for I."}
          - {w: "tu", f: "'your' (for tú), no accent; 'tú' with the accent is 'you'. 'tu despecho' hangs on the earlier 'por': for your spite."}
  - sentences:
      - es: "El rugir del león, del lobo fiero el temeroso aullido, el silbo horrendo de escamosa serpiente, el espantable baladro de algún monstruo, el agorero graznar de la corneja, y el estruendo del viento contrastado en mar instable;"
        literal: "The roaring of-the lion, of-the wolf fierce the fearsome howl, the hiss horrendous of scaly serpent, the frightful bellow of some monster, the ominous cawing of the crow, and the din of-the wind buffeted on sea unstable;"
        ormsby: "The lion’s roar, the fierce wolf’s savage howl, / The horrid hissing of the scaly snake, / The awesome cries of monsters yet unnamed, / The crow’s ill-boding croak, the hollow moan / Of wild winds wrestling with the restless sea,"
        vocab:
          - {w: "rugir", d: "to roar; 'el rugir' = the roaring, an infinitive used as a noun"}
          - {w: "fiero", d: "fierce, wild, savage"}
          - {w: "temeroso", d: "fearsome, fear-inspiring; today the word more often means 'fearful, timid'"}
          - {w: "aullido", d: "howl"}
          - {w: "silbo", d: "hiss, whistle"}
          - {w: "horrendo", d: "horrendous, hideous"}
          - {w: "escamoso", d: "scaly (from 'escama', a scale)"}
          - {w: "baladro", d: "screech, bellow; a rare word for the cry of a monster or wild beast"}
          - {w: "agorero", d: "ominous, ill-omened (from 'agüero', omen); the crow was a bird of bad omen"}
          - {w: "graznar", d: "to caw, croak"}
          - {w: "corneja", d: "crow"}
          - {w: "estruendo", d: "din, roar, crash"}
          - {w: "contrastado", d: "buffeted, fought against; 'contrastar' here is 'to resist, struggle with', not 'to contrast'"}
          - {w: "instable", d: "= inestable, unsteady, restless"}
        diagram:
          - {s: "El rugir del león", r: "subject 1 of a verb still to come: the whole stanza is a list of horrible sounds, and the verb that governs them, 'salgan' (let them come out), arrives only after the list; the lion's roar"}
          - {s: "del lobo fiero el temeroso aullido", r: "subject 2: the fearsome howl of the fierce wolf; the 'del' phrase comes before its noun"}
          - {s: "el silbo horrendo de escamosa serpiente", r: "subject 3: the hideous hiss of the scaly snake"}
          - {s: "el espantable baladro de algún monstruo", r: "subject 4: the frightful cry of some monster"}
          - {s: "el agorero graznar de la corneja", r: "subject 5: the ill-omened cawing of the crow"}
          - {s: "y el estruendo del viento contrastado en mar instable", r: "subject 6: and the din of the wind fighting the restless sea"}
        forms:
          - {w: "El rugir", f: "infinitive of rugir (to roar) with the article: 'the roaring'. Any infinitive can serve as a noun this way, and this stanza does it three times (el rugir, el graznar, el arrullar)."}
          - {w: "del", f: "de + el, the contraction, three times in this unit."}
          - {w: "fiero", f: "adjective (fierce) after its noun 'lobo', masculine."}
          - {w: "temeroso", f: "tem- + -eroso → from temer (to fear): 'full of fear', here in the active sense 'causing fear'. Masculine to match 'aullido'."}
          - {w: "escamosa", f: "escam- + -osa → escamoso (scaly), feminine to match 'serpiente'. No article before 'serpiente', a poetic shortcut."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun ('monstruo'), like un, ningún, buen, gran."}
          - {w: "agorero", f: "agüero (omen) + -ero: 'omen-bringing'. Masculine to match 'graznar', the infinitive-noun it describes."}
          - {w: "contrastado", f: "contrast- + -ado → participle of contrastar (to resist, strive against), masculine to match 'viento': the wind 'fought against' by the sea."}
          - {w: "instable", f: "the old form of inestable (unsteady), straight from Latin instabilis. One ending for both genders ('mar instable')."}
      - es: "del ya vencido toro el implacable bramido, y de la viuda tortolilla el sentible arrullar;"
        literal: "of-the already vanquished bull the implacable bellow, and of the widowed little-turtledove the feeling cooing;"
        ormsby: "The wrathful bellow of the vanquished bull, / The plaintive sobbing of the widowed dove,"
        vocab:
          - {w: "vencido", d: "vanquished, beaten; the bull already defeated in the ring"}
          - {w: "toro", d: "bull"}
          - {w: "implacable", d: "relentless, that cannot be appeased"}
          - {w: "bramido", d: "bellow, roar"}
          - {w: "viudo", d: "widowed; the turtledove was believed to mourn its lost mate forever, and so stood for faithful grief"}
          - {w: "tortolilla", d: "little turtledove ('tórtola' + the diminutive '-illa')"}
          - {w: "sentible", d: "feeling, heartfelt, plaintive; today 'sensible'"}
          - {w: "arrullar", d: "to coo; 'el arrullar' = the cooing"}
        diagram:
          - {s: "del ya vencido toro el implacable bramido", r: "subject 7 of the verb 'salgan' (let them come out) that closes the stanza's list of sounds: the relentless bellow of the already beaten bull"}
          - {s: "y de la viuda tortolilla el sentible arrullar", r: "subject 8: and the plaintive cooing of the widowed turtledove"}
        forms:
          - {w: "vencido", f: "venc- + -ido → participle of vencer (to defeat), masculine to match 'toro', with 'ya' (already) in front: 'the already-beaten bull'."}
          - {w: "implacable", f: "one ending for both genders: in- (not) + placar (to appease) + -able."}
          - {w: "viuda", f: "viud- + -a → viudo (widowed), feminine to match 'tortolilla'."}
          - {w: "tortolilla", f: "tórtola (turtledove) + -illa, the diminutive that adds tenderness: 'poor little turtledove'. The accent moves off tór- as the stress shifts to -i-."}
          - {w: "sentible", f: "sent- + -ible → from sentir (to feel): 'that feels'. One ending for both genders. Modern Spanish says 'sensible'."}
          - {w: "el ... arrullar", f: "infinitive of arrullar (to coo) with the article: 'the cooing', a noun made from a verb, like 'el rugir' earlier in the stanza."}
        ormsby_note: "'And the hoarse sobbing of the widowed dove.' (Drummond of Hawthornden)"
      - es: "el triste canto del envidiado búho, con el llanto de toda la infernal negra cuadrilla, salgan con la doliente ánima fuera, mezclados en un son, de tal manera que se confundan los sentidos todos, pues la pena cruel que en mí se halla para contalla pide nuevos modos."
        literal: "the sad song of-the envied owl, with the weeping of all the infernal black crew, let-them-come-out with the grieving soul outside, mixed in one sound, in such manner that be-confounded the senses all, since the pain cruel that in me is-found for telling-it asks-for new modes."
        ormsby: "The envied owl’s sad note, the wail of woe / That rises from the dreary choir of Hell, / Commingled in one sound, confusing sense, / Let all these come to aid my soul’s complaint, / For pain like mine demands new modes of song."
        vocab:
          - {w: "envidiado", d: "envied; legend said the other birds envied the owl for having alone witnessed the Crucifixion"}
          - {w: "búho", d: "owl (the eagle owl)"}
          - {w: "llanto", d: "weeping, wailing"}
          - {w: "infernal", d: "of hell"}
          - {w: "cuadrilla", d: "gang, crew, band (of people or devils)"}
          - {w: "salir fuera", d: "to come out; 'fuera' (outside) doubles the idea"}
          - {w: "ánima", d: "soul; = alma, the Latin-flavored form used in poetry and of souls in purgatory"}
          - {w: "de tal manera que", d: "in such a way that, so that"}
          - {w: "confundirse", d: "to be confounded, thrown into confusion"}
          - {w: "sentidos", d: "the senses"}
          - {w: "hallarse", d: "to be found, to be (in a place or state)"}
          - {w: "contalla", d: "= contarla, to tell it; old verse turns -rl- into -ll- for the rhyme"}
          - {w: "modos", d: "ways, manners; also musical modes, a pun Ormsby keeps with 'new modes of song'"}
        diagram:
          - s: "salgan"
            r: "main verb: let them come out (the whole list of sounds, from the lion's roar to the owl's song)"
            under:
              - {s: "el triste canto del envidiado búho", r: "last subject in the list: the sad song of the envied owl"}
              - {s: "con el llanto de toda la infernal negra cuadrilla", r: "together with: the wailing of the whole black crew of hell"}
              - {s: "con la doliente ánima fuera", r: "how: out along with my grieving soul"}
              - s: "mezclados en un son"
                r: "how: mixed into a single sound"
                under:
                  - {s: "de tal manera que se confundan los sentidos todos", r: "result: so that all the senses are confounded"}
              - s: "pues la pena cruel ... pide nuevos modos"
                r: "why: since the cruel pain demands new ways"
                under:
                  - {s: "que en mí se halla", r: "describes 'pena': that is in me"}
                  - {s: "para contalla", r: "new ways for what: for telling it"}
        forms:
          - {w: "envidiado", f: "envidi- + -ado → participle of envidiar (to envy), masculine to match 'búho'."}
          - {w: "infernal negra", f: "two adjectives stacked before 'cuadrilla': infernal has one ending, negr- + -a → negro (black) is feminine to match."}
          - {w: "salgan", f: "salg- + -an → salir (to come out), present subjunctive, they, used as a command to a third party: 'let them come out'. The subjunctive keeps the g of 'salgo': salga, salgas, salga, salgamos, salgáis, salgan."}
          - {w: "doliente", f: "dol- + -iente → from doler (to ache), the old active participle used as an adjective: 'grieving'. One ending for both genders ('la doliente ánima')."}
          - {w: "ánima", f: "feminine. Alone it takes 'el' like 'el alma' because it begins with a stressed a, but with an adjective in between ('la doliente ánima') the ordinary 'la' comes back."}
          - {w: "mezclados", f: "mezcl- + -ados → participle of mezclar (to mix), masculine plural, agreeing with the whole list of sounds: 'mixed'."}
          - {w: "se confundan", f: "confund- + -an → confundir (to confound), present subjunctive, they (the senses), with 'se' (be confounded). Subjunctive after 'de tal manera que' for a result that is willed. The present subjunctive of -er and -ir verbs: -a, -as, -a, -amos, -áis, -an."}
          - {w: "todos", f: "'all', placed after the noun ('los sentidos todos') for emphasis, masculine plural to match 'sentidos'."}
          - {w: "se halla", f: "hall- + -a → hallarse (to be found, to be), present, it (the pain). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
