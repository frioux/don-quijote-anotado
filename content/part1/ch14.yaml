        literal: "Oh, in the kingdom of love fierce tyrants jealousies, put-me an iron in these hands! Give-me, disdain, a twisted rope."
        ormsby: "Oh, thou fierce tyrant of the realms of love, / Oh, Jealousy! put chains upon these hands, / And bind me with thy strongest cord, Disdain."
