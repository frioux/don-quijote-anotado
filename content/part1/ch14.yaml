          - {w: "me han conducido", f: "han = haber, present, they (he, has, ha, hemos, habéis, han) + conducido, the participle of conducir (to lead): 'have led me'. The subject, 'sus desdenes', follows."}
          - {w: "sus desdenes", f: "sus = 'her', plural to match 'desdenes', not the owner. desdén makes its plural desdenes and loses the written accent."}
          - {w: "ofreceré", f: "ofrecer- + -é → ofrecer (to offer), future, I. The future adds -é, -ás, -á, -emos, -éis, -án to the infinitive: ofreceré, ofrecerás, ofrecerá, ofreceremos, ofreceréis, ofrecerán."}
