  - sentences:
      - es: "Tú, que con tantas sinrazones muestras la razón que me fuerza a que la haga a la cansada vida que aborrezco, pues ya ves que te da notorias muestras esta del corazón profunda llaga, de cómo, alegre, a tu rigor me ofrezco, si, por dicha, conoces que merezco que el cielo claro de tus bellos ojos en mi muerte se turbe, no lo hagas;"
