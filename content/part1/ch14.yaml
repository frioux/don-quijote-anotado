      - es: "¿O vienes a ufanarte en las crueles hazañas de tu condición, o a ver desde esa altura, como otro despiadado Nero, el incendio de su abrasada Roma, o a pisar, arrogante, este desdichado cadáver, como la ingrata hija al de su padre Tarquino?"
