      - es: "Tienen mis deseos por término estas montañas, y si de aquí salen, es a contemplar la hermosura del cielo, pasos con que camina el alma a su morada primera."
        literal: "Have my desires for limit these mountains, and if from here they-go-out, it-is to contemplate the beauty of-the sky, steps with which walks the soul to its dwelling first."
        ormsby: "my desires are bounded by these mountains, and if they ever wander hence it is to contemplate the beauty of the heavens, steps by which the soul travels to its primeval abode.”"
