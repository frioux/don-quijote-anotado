  - sentences:
      - es: "Y, en diciendo esto, sin querer oír respuesta alguna, volvió las espaldas y se entró por lo más cerrado de un monte que allí cerca estaba, dejando admirados, tanto de su discreción como de su hermosura, a todos los que allí estaban."
        literal: "And, on saying this, without wanting to-hear answer any, she-turned the backs and went-in through the most closed of a wood that there near was, leaving amazed, as-much by her wisdom as by her beauty, [to] all those who there were."
        ormsby: "With these words, and not waiting to hear a reply, she turned and passed into the thickest part of a wood that was hard by, leaving all who were there lost in admiration as much of her good sense as of her beauty."
        vocab:
          - {w: "en diciendo", d: "on saying, as soon as she had said"}
          - {w: "respuesta alguna", d: "any answer at all ('alguna' after the noun after a negative)"}
          - {w: "volver las espaldas", d: "to turn one's back, turn away"}
          - {w: "entrarse por", d: "to go into, make one's way into"}
          - {w: "lo más cerrado", d: "the thickest part"}
          - {w: "monte", d: "wood, scrubland (not 'mountain' here)"}
          - {w: "admirado", d: "amazed, astonished"}
          - {w: "discreción", d: "good sense, wit, intelligence (a false friend)"}
