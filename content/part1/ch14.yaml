  - sentences:
      - es: "Canción desesperada, no te quejes cuando mi triste compañía dejes; antes, pues que la causa do naciste con mi desdicha augmenta su ventura, aun en la sepultura no estés triste."
        literal: "Song desperate, not yourself complain when my sad company you-leave; rather, since the cause where you-were-born with my misfortune increases her fortune, even in the grave not be sad."
        ormsby: "Lay of despair, grieve not when thou art gone / Forth from this sorrowing heart: my misery / Brings fortune to the cause that gave thee birth; / Then banish sadness even in the tomb."
        vocab:
          - {w: "canción desesperada", d: "desperate song: the poet speaks to his own poem, as the Italian canzone always does in its closing stanza"}
          - {w: "quejarse", d: "to complain, lament"}
          - {w: "compañía", d: "company"}
          - {w: "pues que", d: "since (= puesto que in its modern sense)"}
          - {w: "do", d: "= donde, where (poetic)"}
          - {w: "desdicha", d: "misfortune, unhappiness"}
          - {w: "augmentar", d: "= aumentar, to increase (the Latin spelling)"}
          - {w: "ventura", d: "good fortune, happiness"}
          - {w: "sepultura", d: "grave, tomb"}
        diagram:
          - s: "no te quejes"
            r: "main verb 1: do not complain"
            under:
              - {s: "Canción desesperada,", r: "who is addressed: the song itself"}
              - {s: "cuando mi triste compañía dejes", r: "when: when you leave my sad company"}
          - s: "aun en la sepultura no estés triste"
            r: "main verb 2: even in the grave do not be sad"
            under:
              - {s: "antes", r: "rather: on the contrary"}
              - s: "pues que la causa do naciste con mi desdicha augmenta su ventura"
                r: "why: since the cause you were born of (Marcela) increases her happiness by my misfortune"
