        ormsby: "or is it to exult over the cruel work of thy humours that thou art come; or like another pitiless Nero to look down from that height upon the ruin of his Rome in embers; or in thy arrogance to trample on this ill-fated corpse, as the ungrateful daughter trampled on her father Tarquin’s?"
