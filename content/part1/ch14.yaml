          - {w: "vitoria", f: "= victoria. Cervantes' Spanish often drops the c of a Latin -ct- group (vitoria, efeto, perfeto)."}
          - {w: "vuestra", f: "'your' for vosotros (jealousy and disdain together), feminine to match 'memoria'."}
