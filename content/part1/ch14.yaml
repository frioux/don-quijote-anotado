  - sentences:
      - es: "— Ninguna persona, de cualquier estado y condición que sea, se atreva a seguir a la hermosa Marcela, so pena de caer en la furiosa indignación mía."
        literal: "— No person, of whatever estate and condition that he-be, let-dare to follow [to] the beautiful Marcela, under penalty of falling into the furious indignation mine."
        ormsby: "“Let no one, whatever his rank or condition, dare to follow the beautiful Marcela, under pain of incurring my fierce indignation."
