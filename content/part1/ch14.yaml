        note: "The opening » marks a new paragraph inside the same speech, the Spanish convention for continuing a quotation. Marcela speaks to the crowd as 'vosotros' throughout."
      - es: "Yo conozco, con el natural entendimiento que Dios me ha dado, que todo lo hermoso es amable; mas no alcanzo que, por razón de ser amado, esté obligado lo que es amado por hermoso a amar a quien le ama."
        literal: "I know, with the natural understanding that God to-me has given, that all the beautiful is lovable; but not I-reach that, by reason of being loved, be obliged that-which is loved for beautiful to love [to] whom it loves."
        ormsby: "By that natural understanding which God has given me I know that everything beautiful attracts love, but I cannot see how, by reason of being loved, that which is loved for its beauty is bound to love that which loves it;"
