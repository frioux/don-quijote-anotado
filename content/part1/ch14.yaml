          - {w: "ninguna", f: "ningun- + -a → ninguno (no, none), feminine to match 'cosa'. After 'no' Spanish doubles the negative: 'no vengo a ninguna cosa'."}
          - {w: "has dicho", f: "has = haber, present, you (he, has, ha, hemos, habéis, han) + dicho, the irregular participle of decir (to say): 'you have said'. Marcela returns Ambrosio's 'tú'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, she. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "mí misma", f: "mí (me, after a preposition, with the accent) + misma (myself), feminine for Marcela."}
          - {w: "van", f: "ir (to go, here 'to be'), present, they. voy, vas, va, vamos, vais, van."}
          - {w: "me culpan", f: "culp- + -an → culpar (to blame), present, they, with 'me'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. The verb closes the clause."}
        note: "Ormsby's 'Ambrosia' is a misprint for Ambrosio in his text. Marcela's speech that follows is a formal defence in the manner of a law-court or a schoolroom disputation, with premises, objections and conclusions."
