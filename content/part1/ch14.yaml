          - {w: "fieros tiranos", f: "fier- + -os → fiero (fierce), masculine plural to match 'tiranos', which is itself plural because 'celos' is plural."}
          - {w: "ponedme", f: "pon- + -ed + me → poner (to put), command, you all (vosotros), with 'me' (for me) stuck on the end. The vosotros command replaces the -r of the infinitive with -d: poned, dad, mirad. 'celos' is grammatically plural, so it is given a plural command."}
          - {w: "estas", f: "'these', feminine plural to match 'manos' (mano is feminine despite the -o)."}
