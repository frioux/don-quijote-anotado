      - es: "Ella ha mostrado con claras y suficientes razones la poca o ninguna culpa que ha tenido en la muerte de Grisóstomo, y cuán ajena vive de condescender con los deseos de ninguno de sus amantes, a cuya causa es justo que, en lugar de ser seguida y perseguida, sea honrada y estimada de todos los buenos del mundo, pues muestra que en él ella es sola la que con tan honesta intención vive."
        literal: "She has shown with clear and sufficient reasons the little or no blame that she-has had in the death of Grisóstomo, and how remote she-lives from yielding with the desires of none of her lovers, for which cause it-is just that, instead of being followed and persecuted, she-be honored and esteemed by all the good of-the world, since she-shows that in it she is alone the one who with such chaste intention lives."
        ormsby: "She has shown by clear and satisfactory arguments that little or no fault is to be found with her for the death of Chrysostom, and also how far she is from yielding to the wishes of any of her lovers, for which reason, instead of being followed and persecuted, she should in justice be honoured and esteemed by all the good people of the world, for she shows that she is the only woman in it that holds to such a virtuous resolution.”"
        vocab:
          - {w: "suficiente", d: "sufficient, convincing"}
          - {w: "ajeno de", d: "far from, remote from"}
          - {w: "condescender con", d: "to yield to, comply with"}
          - {w: "amante", d: "lover, suitor"}
          - {w: "a cuya causa", d: "for which reason"}
          - {w: "perseguir", d: "to pursue, persecute"}
          - {w: "estimado", d: "esteemed"}
          - {w: "de todos", d: "by everyone (old 'de' for the doer of a passive)"}
        diagram:
          - s: "Ella ha mostrado"
            r: "main verb: she has shown"
            under:
              - {s: "con claras y suficientes razones", r: "how: with clear and sufficient arguments"}
              - {s: "la poca o ninguna culpa que ha tenido en la muerte de Grisóstomo", r: "what, 1: how little or no blame she had in Grisóstomo's death"}
              - {s: "y cuán ajena vive de condescender con los deseos de ninguno de sus amantes", r: "what, 2: and how far she lives from yielding to any lover's wishes"}
              - s: "a cuya causa es justo"
                r: "result: for which reason it is right"
                under:
                  - {s: "que, en lugar de ser seguida y perseguida, sea honrada y estimada de todos los buenos del mundo", r: "what is right: that instead of being followed and hounded she be honored and esteemed by all good people"}
                  - {s: "pues muestra que en él ella es sola la que con tan honesta intención vive", r: "why: since she shows she is the only one in the world who lives with so chaste a purpose"}
        forms:
          - {w: "ha mostrado", f: "ha = haber, present, she (he, has, ha, hemos, habéis, han) + mostrado, the participle of mostrar (to show): 'has shown'."}
          - {w: "claras y suficientes", f: "clar- + -as (clear), feminine plural, and suficientes (one ending), both matching 'razones'."}
          - {w: "ha tenido", f: "ha + tenido, the participle of tener (to have): 'has had'."}
          - {w: "ajena", f: "ajen- + -a → ajeno (far from), feminine for Marcela."}
          - {w: "vive", f: "viv- + -e → vivir (to live), present, she. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "cuya", f: "'whose, which', agreeing with 'causa' (feminine), not with the owner."}
          - {w: "seguida y perseguida", f: "participles of seguir (to follow) and perseguir (to hound), feminine for Marcela: a play on the two words."}
          - {w: "sea honrada y estimada", f: "sea = ser, present subjunctive, she (sea, seas, sea, seamos, seáis, sean) + participles of honrar and estimar, feminine: the passive 'be honored and esteemed'. Subjunctive after 'es justo que'."}
          - {w: "muestra", f: "muestr- + -a → mostrar (to show), present, she. muestro, muestras, muestra, mostramos, mostráis, muestran."}
          - {w: "sola", f: "sol- + -a → solo (only, alone), feminine for Marcela."}
  - sentences:
      - es: "O ya que fuese por las amenazas de don Quijote, o porque Ambrosio les dijo que concluyesen con lo que a su buen amigo debían, ninguno de los pastores se movió ni apartó de allí hasta que, acabada la sepultura y abrasados los papeles de Grisóstomo, pusieron su cuerpo en ella, no sin muchas lágrimas de los circunstantes."
        literal: "Or whether it-were because-of the threats of Don Quijote, or because Ambrosio to-them said that they-should-finish with what to their good friend they-owed, none of the shepherds himself moved nor withdrew from there until, finished the grave and burned the papers of Grisóstomo, they-put his body in it, not without many tears of the bystanders."
        ormsby: "Whether it was because of the threats of Don Quixote, or because Ambrosio told them to fulfil their duty to their good friend, none of the shepherds moved or stirred from the spot until, having finished the grave and burned Chrysostom’s papers, they laid his body in it, not without many tears from those who stood by."
