              - {s: "a ninguna cosa de las que has dicho", r: "for what not: for none of the things you have said"}
              - {s: "respondió Marcela", r: "speech tag: Marcela answered"}
              - {s: "sino a volver por mí misma", r: "but for what: to stand up for myself"}
              - s: "y a dar a entender cuán fuera de razón van todos aquellos"
                r: "and for what: to make plain how unreasonable all those people are"
                under:
                  - {s: "que de sus penas y de la muerte de Grisóstomo me culpan", r: "describes 'aquellos': who blame me for their sorrows and for Grisóstomo's death"}
        forms:
