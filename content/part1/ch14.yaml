  - sentences:
      - es: "Mata un desdén, atierra la paciencia, o verdadera o falsa, una sospecha; matan los celos con rigor más fuerte; desconcierta la vida larga ausencia; contra un temor de olvido no aprovecha firme esperanza de dichosa suerte. En todo hay cierta, inevitable muerte;"
        literal: "Kills a disdain, knocks-down the patience, either true or false, a suspicion; kill the jealousies with rigor more strong; unsettles the life long absence; against a fear of oblivion not avails firm hope of happy fortune. In everything there-is certain, inevitable death;"
        ormsby: "Disdain hath power to kill, and patience dies / Slain by suspicion, be it false or true; / And deadly is the force of jealousy; / Long absence makes of life a dreary void; / No hope of happiness can give repose / To him that ever fears to be forgot; / And death, inevitable, waits in hall."
        vocab:
          - {w: "desdén", d: "disdain, scorn; the lady's coldness"}
          - {w: "aterrar", d: "to knock to the ground, lay low ('a' + 'tierra'); today usually 'to terrify'"}
          - {w: "sospecha", d: "suspicion"}
          - {w: "celos", d: "jealousy (always plural in Spanish)"}
          - {w: "desconcertar", d: "to unsettle, throw out of order"}
          - {w: "ausencia", d: "absence, separation from the beloved; one of the classic 'pains of love'"}
          - {w: "temor", d: "fear"}
          - {w: "olvido", d: "oblivion, being forgotten"}
          - {w: "aprovechar", d: "to avail, be of use"}
          - {w: "dichoso", d: "happy, fortunate"}
          - {w: "suerte", d: "fortune, lot"}
          - {w: "cierto", d: "sure, certain; before the noun here, 'a sure death'"}
        diagram:
          - s: "Mata un desdén"
            r: "main verb 1: a disdain kills; verb first, subject after, as in each clause of this list"
          - s: "atierra la paciencia, o verdadera o falsa, una sospecha"
            r: "main verb 2: a suspicion, true or false, lays patience low"
          - s: "matan los celos con rigor más fuerte"
            r: "main verb 3: jealousy kills with a stronger rigor"
          - s: "desconcierta la vida larga ausencia"
            r: "main verb 4: long absence unsettles life"
          - s: "contra un temor de olvido no aprovecha firme esperanza de dichosa suerte"
            r: "main verb 5: against a fear of being forgotten, firm hope of a happy lot is of no use"
          - s: "En todo hay cierta, inevitable muerte;"
            r: "main verb 6 (new sentence): in all of these there is a sure, inevitable death"
        forms:
          - {w: "Mata", f: "mat- + -a → matar (to kill), present, it (a disdain). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. The subject 'un desdén' comes after the verb."}
          - {w: "atierra", f: "atierr- + -a → aterrar (to knock down, from 'tierra'), present, it (a suspicion). The stem e becomes ie when stressed: atierro, atierras, atierra, aterramos, aterráis, atierran."}
          - {w: "verdadera, falsa", f: "verdader- + -a → verdadero (true), fals- + -a → falso (false), feminine to match 'sospecha'."}
          - {w: "matan", f: "mat- + -an → matar (to kill), present, they (los celos). Same -ar present."}
          - {w: "más fuerte", f: "'más' + adjective makes the comparative: 'stronger'. fuerte has one ending for both genders."}
          - {w: "desconcierta", f: "desconciert- + -a → desconcertar (to unsettle), present, it (absence). The stem e becomes ie when stressed: desconcierto, desconciertas, desconcierta, desconcertamos, desconcertáis, desconciertan. Its subject, 'larga ausencia', follows its object, 'la vida'."}
          - {w: "larga", f: "larg- + -a → largo (long), feminine to match 'ausencia'."}
          - {w: "no aprovecha", f: "aprovech- + -a → aprovechar (to avail), present, it (hope). Same -ar present. 'no aprovecha' = is no use."}
          - {w: "firme", f: "adjective (firm), one ending, before 'esperanza'."}
          - {w: "dichosa", f: "dichos- + -a → dichoso (happy), feminine to match 'suerte'."}
          - {w: "hay", f: "haber used alone: 'there is'. It never changes for number: 'hay muerte', 'hay muertes'."}
          - {w: "cierta, inevitable", f: "ciert- + -a → cierto (sure), feminine to match 'muerte'; inevitable has one ending. Both before the noun."}
        note: "The stanza lists the 'pains of love' catalogued by the Petrarchan tradition: disdain, suspicion, jealousy, absence and the fear of being forgotten. Each one, the poet says, can kill on its own; his miracle is to suffer all of them at once and live."
