summary: |
  At Grisóstomo's graveside, Vivaldo reads aloud the poem he saved from the fire: the 'Song of Grisóstomo', a long, despairing complaint addressed to the cruel Marcela. The poet calls on every horrible sound in nature and in hell to voice his pain, says that disdain, suspicion, jealousy and absence each kill, yet he lives on with all of them, and swears to give up hope. He tells Marcela not to weep for him but to make his death her feast, and summons the damned of the classical underworld to sing his funeral.

  Vivaldo objects that the poem's jealousy and suspicion do not fit Marcela's reputation for virtue. Ambrosio explains that Grisóstomo wrote it while he had gone away from her to see if absence would cure him, and that his jealousies were imagined. Marcela's only faults, he says, are being cruel, a little arrogant and very disdainful.

  Suddenly Marcela herself appears on the rock above the grave. Ambrosio calls her a basilisk and asks if she has come to gloat. She answers with a long, reasoned defence: beauty makes people love, but being loved creates no duty to love back; she did not choose her beauty; she was born free and chose the solitude of the fields; she warned Grisóstomo plainly, and his own stubbornness killed him. Let those who call her cruel leave her alone. Without waiting for an answer she walks off into the woods.

  When some of the young men start to follow her, Don Quijote, hand on sword, forbids anyone to pursue her. Grisóstomo is buried, his papers burned, and Ambrosio plans an epitaph blaming a beautiful ingrate. The travelers urge Don Quijote to come to Seville, the best city for adventures, but he says he must first clear these hills of robbers. They part, and Don Quijote decides to seek out Marcela and offer her his service, though things do not turn out as he expects. So ends the Second Part.
context: |
  Rich shepherds and real ones. Grisóstomo and Marcela are not peasants: he was a wealthy student from Salamanca, she a rich orphan, and both took up the shepherd's life by choice. Marcela says so herself ('tengo riquezas propias'), and her fortune is what lets her refuse to marry. The goatherds and travelers around the grave are the real countryside watching a literary one. A woman of her class was expected to marry or enter a convent; Marcela proposes a third way, a free life alone in the hills, and defends it in public.

  Pastoral and Petrarchan poetry. This chapter is Cervantes' fullest entry into the pastoral romance (Montemayor's Diana, his own Galatea), where shepherds die of unanswered love. Grisóstomo's song is an Italian-style 'canción' (canzone) of sixteen-line stanzas with interlaced rhymes; Ormsby calls it 'not so much a piece of poetry, as a fantasia in rhyme and an experiment in versification', and notes the internal rhyme borrowed from Garcilaso ('que en mí se halla / para contalla'). Its stock material is Petrarch's: the cruel fair one, the lover's living death, the catalogue of pains (disdain, suspicion, jealousy, absence, forgetting), the lover who is free because enslaved. The classical hell of Tantalus, Sisyphus, Tityus, Ixion, the Danaids and Cerberus comes from Virgil and Ovid. The epitaph turns to Spanish 'redondillas'.

  The narrator's games. The chapter heading puns on 'desesperados' and 'no esperados', as Ormsby notes. The poem expects to be judged by its truth, and Vivaldo immediately questions its facts; Ambrosio's defence of Marcela ends by conceding that she is cruel and disdainful; then Marcela arrives to argue her own case against the poem. Don Quijote, silent all chapter, wakes up only to defend a damsel who has just declared she needs no defence, and resolves to offer her his service. The last sentence closes the 'Second Part' of the 1605 book, keeping up the pretense of a 'true history'.

  Law, religion and philosophy. Marcela's speech is built like a legal or scholastic argument, with premises, objections and replies, and its ideas come from Neoplatonic love theory (León Hebreo): beauty causes love, but love must be free and cannot be owed. She ends with the Platonic ladder from the beauty of the heavens to the soul's first home. The poem hints throughout that Grisóstomo killed himself: he asks jealousy for a blade and disdain for a rope, and imagines his body refused a shroud. Suicides were denied Church burial, which is why his friends bury him in the open field. Ambrosio's hope that the corpse might bleed when Marcela appears recalls cruentation, the belief that a body bleeds in its murderer's presence. Ormsby notes that the owl was 'envied' because it alone witnessed the Crucifixion, and that Cervantes, following a ballad, made Tullia Tarquin's daughter when she was his wife.

  Names. Grisóstomo is Chrysostom, 'golden-mouthed', after the Church Father famed for eloquence: a fitting name for a poet who dies talking. Marcela recalls Marcella, a Roman lady who chose a life of chastity and study. Betis is the Roman name of the Guadalquivir; Tajo is the Tagus; Nero (Nerón) watched Rome burn. Basilisk, the serpent that kills with a look, is the stock insult for a beauty whose eyes slay.

  Reading Cervantes' Spanish. The poem is the hardest Spanish in the book so far: Latin word order with verbs last and subjects delayed (a whole stanza of subjects waits for 'salgan'), phrases pushed between article and noun ('la de amor antigua tiranía', 'esta del corazón profunda llaga'), infinitives used as nouns (el rugir, el graznar, el arrullar), commands to third parties in the subjunctive (venga, traya, canten, quéjese), and the dieresis that adds a syllable (rüido, Egïón). Old forms: mesmo, ansimismo, escuro, vitoria, instable, augmentar, reprehender, prosupuesto, escusado, traya (traiga), monstros, do (donde); -rl- becoming -ll- (contalla, hacello, vello, pedilla, escogella); contractions with 'de' (desta, deste, destas, desa, dellos, dél); 'tener de' for 'tener que'; 'quien' for things and plurals; the old ending -ades (amábades); the future subjunctive (llamare, admitiere, muriere); pronouns hung on opening verbs (Hízome, Puédese, Quiérote, entiéndase). Watch the false friends: puesto que (although), discreto (wise), honesto (chaste), condición (nature), industria (cunning), solicitar (to court), suceso (outcome), admiración (wonder), discurso (course).
