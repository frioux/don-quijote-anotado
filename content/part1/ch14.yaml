  - sentences:
      - es: "»Hízome el cielo, según vosotros decís, hermosa, y de tal manera que, sin ser poderosos a otra cosa, a que me améis os mueve mi hermosura; y, por el amor que me mostráis, decís, y aun queréis, que esté yo obligada a amaros."
        literal: "»Made-me the heaven, according-to you say, beautiful, and in such manner that, without being able to other thing, to that me you-love you moves my beauty; and, for the love that to-me you-show, you-say, and even you-want, that be I obliged to love-you."
        ormsby: "Heaven has made me, so you say, beautiful, and so much so that in spite of yourselves my beauty leads you to love me; and for the love you show me you say, and even urge, that I am bound to love you."
        vocab:
          - {w: "el cielo", d: "heaven (as the giver of gifts), not just 'the sky'"}
          - {w: "según", d: "according to, as"}
          - {w: "ser poderoso a", d: "to be able to; 'sin ser poderosos a otra cosa' = unable to do otherwise"}
          - {w: "mover a", d: "to move (someone) to, drive to"}
          - {w: "obligado a", d: "bound to, obliged to"}
