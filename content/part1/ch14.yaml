          - {w: "les dijo", f: "dij- + -o → decir (to say), preterite, he, with 'les' (to them). dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "concluyesen", f: "concluy- + -esen → concluir (to finish), imperfect subjunctive (-se form), they; a y is added between vowels. Subjunctive for a reported command. concluyese, concluyeses, concluyese, concluyésemos, concluyeseis, concluyesen."}
          - {w: "debían", f: "deb- + -ían → deber (to owe), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "se movió ni apartó", f: "mov- + -ió → moverse (to move), apart- + -ó → apartarse (to withdraw), preterite, he (none), with one 'se' covering both."}
