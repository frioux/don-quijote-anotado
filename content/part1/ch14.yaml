      - es: "Y algunos dieron muestras —de aquellos que de la poderosa flecha de los rayos de sus bellos ojos estaban heridos— de quererla seguir, sin aprovecharse del manifiesto desengaño que habían oído."
        literal: "And some gave signs —of those who by the powerful arrow of the rays of her beautiful eyes were wounded— of wanting-her to-follow, without profiting-themselves from-the manifest undeceiving that they-had heard."
