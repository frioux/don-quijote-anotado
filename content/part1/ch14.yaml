          - {w: "decís", f: "dec- + -ís → decir (to say), present, you all (vosotros). digo, dices, dice, decimos, decís, dicen."}
          - {w: "hermosa", f: "hermos- + -a → hermoso (beautiful), feminine for Marcela."}
          - {w: "poderosos", f: "poder- + -osos → poderoso (able, powerful), masculine plural for her suitors."}
