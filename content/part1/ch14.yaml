      - es: "Dinos presto a lo que vienes, o qué es aquello de que más gustas; que, por saber yo que los pensamientos de Grisóstomo jamás dejaron de obedecerte en vida, haré que, aun él muerto, te obedezcan los de todos aquellos que se llamaron sus amigos."
