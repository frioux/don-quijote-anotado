  - sentences:
      - es: "— No vengo, ¡oh Ambrosio!, a ninguna cosa de las que has dicho —respondió Marcela—, sino a volver por mí misma, y a dar a entender cuán fuera de razón van todos aquellos que de sus penas y de la muerte de Grisóstomo me culpan;"
        literal: "— Not I-come, oh Ambrosio!, to no thing of those that you-have said —responded Marcela—, but to stand-up for me myself, and to give to understand how outside of reason go all those who for their pains and for the death of Grisóstomo me blame;"
        ormsby: "“I come not, Ambrosia for any of the purposes thou hast named,” replied Marcela, “but to defend myself and to prove how unreasonable are all those who blame me for their sorrow and for Chrysostom’s death;"
        vocab:
          - {w: "volver por", d: "to stand up for, defend (someone's honor)"}
          - {w: "dar a entender", d: "to make clear, show"}
          - {w: "fuera de razón", d: "unreasonable, beyond reason"}
          - {w: "ir", d: "here 'to be' (in a state): 'van fuera de razón' = are wrong"}
          - {w: "penas", d: "sorrows, sufferings (of love)"}
          - {w: "culpar", d: "to blame"}
