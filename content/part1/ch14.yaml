  - sentences:
      - es: "— ¿Vienes a ver, por ventura, ¡oh fiero basilisco destas montañas!, si con tu presencia vierten sangre las heridas deste miserable a quien tu crueldad quitó la vida?"
        literal: "— Come-you to see, by chance, oh fierce basilisk of-these mountains!, if with your presence pour blood the wounds of-this wretch from whom your cruelty took the life?"
        ormsby: "“Art thou come, by chance, cruel basilisk of these mountains, to see if in thy presence blood will flow from the wounds of this wretched being thy cruelty has robbed of life;"
        vocab:
