          - {w: "esté", f: "est- + -é → estar (to be), present subjunctive, I. Subjunctive after 'queréis que'. esté, estés, esté, estemos, estéis, estén."}
          - {w: "obligada", f: "oblig- + -ada → participle of obligar (to oblige), feminine for Marcela."}
