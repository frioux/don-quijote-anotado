  - sentences:
      - es: "Pidió, en entrando, un aposento, y, como le dijeron que en la venta no le había, mostró recebir pesadumbre; y, llegándose a la que en el traje parecía mora, la apeó en sus brazos."
        literal: "He-asked, on entering, a room, and, as to-him they-said that in the inn not it there-was, he-showed to-receive grief; and, approaching-himself to the [one] who in the dress seemed Moorish, her he-set-down in his arms."
