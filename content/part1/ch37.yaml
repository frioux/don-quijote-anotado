      - es: "¡Voto... —y miró al cielo y apretó los dientes— que estoy por hacer un estrago en ti, que ponga sal en la mollera a todos cuantos mentirosos escuderos hubiere de caballeros andantes, de aquí adelante, en el mundo!"
