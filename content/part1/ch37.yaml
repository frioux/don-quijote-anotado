          - {w: "levantarse", d: "to get up"}
          - {w: "el buen recado", d: "the fine mess (ironic); 'recado' = errand, business"}
          - {w: "dama particular", d: "a private lady, an ordinary woman (not royalty)"}
          - {w: "caer en", d: "to grasp, realize, 'catch on to'"}
          - {w: "admirar", d: "false friend: to astonish (not 'to admire')"}
