          - {w: "cabecera", d: "head of the table, place of honor"}
          - {w: "puesto que", d: "false friend: although (not 'since')"}
          - {w: "rehusar", d: "to refuse"}
          - {w: "aguardador", d: "guardian, protector (an odd, old word)"}
