          - {w: "acabaste", f: "acab- + -aste → acabar (to finish), preterite, you (tú); 'acabar de decir' = to have just said. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "se había vuelto", f: "hab- + -ía → haber (imperfect, she) + vuelto, the irregular participle of volver (to turn): 'had turned'. había, habías, había, habíamos, habíais, habían."}
          - {w: "se llamaba", f: "llam- + -aba → llamarse (to be called), imperfect, she. -aba, -abas, -aba, -ábamos, -abais, -aban."}
