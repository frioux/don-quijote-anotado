          - {w: "verá", f: "ver- + -á → ver (to see), future, you. The future adds to the infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "ha hecho", f: "ha → haber (to have), present, you, + hecho, the irregular participle of hacer (to do). haber in the present: he, has, ha, hemos, habéis, han."}
