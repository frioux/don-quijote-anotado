      - es: "— No me maravillaría de nada deso —replicó don Quijote—, porque, si bien te acuerdas, la otra vez que aquí estuvimos te dije yo que todo cuanto aquí sucedía eran cosas de encantamento, y no sería mucho que ahora fuese lo mesmo."
