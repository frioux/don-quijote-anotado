      - es: "Y, como la hermosura tenga prerrogativa y gracia de reconciliar los ánimos y atraer las voluntades, luego se rindieron todos al deseo de servir y acariciar a la hermosa mora."
        literal: "And, as the beauty may-have privilege and grace of reconciling the spirits and attracting the wills, at-once themselves surrendered all to-the desire of serving and caressing [to] the beautiful Moorish-woman."
        ormsby: "And as it is the privilege and charm of beauty to win the heart and secure goodwill, all forthwith became eager to show kindness and attention to the lovely Moor."
