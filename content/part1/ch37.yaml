  - sentences:
      - es: "— Digo, en fin, alta y desheredada señora, que si por la causa que he dicho vuestro padre ha hecho este metamorfóseos en vuestra persona, que no le deis crédito alguno, porque no hay ningún peligro en la tierra por quien no se abra camino mi espada, con la cual, poniendo la cabeza de vuestro enemigo en tierra, os pondré a vos la corona de la vuestra en la cabeza en breves días."
        literal: "— I-say, in end, high and disinherited lady, that if for the cause that I-have said your father has made this metamorphosis in your person, that not to-it you-give credit any, because not there-is no danger on the earth through which not may-open-itself way my sword, with the which, putting the head of your enemy on ground, to-you I-will-put to you the crown of the yours on the head in brief days."
        ormsby: "“I say in conclusion, high and disinherited lady, that if your father has brought about this metamorphosis in your person for the reason I have mentioned, you ought not to attach any importance to it; for there is no peril on earth through which my sword will not force a way, and with it, before many days are over, I will bring your enemy’s head to the ground and place on yours the crown of your kingdom.”"
        vocab:
          - {w: "en fin", d: "in short, finally"}
          - {w: "desheredado", d: "disinherited"}
          - {w: "metamorfóseos", d: "Don Quijote's garbled 'metamorfosis' (from Ovid's Metamorphoses), made masculine"}
          - {w: "dar crédito a", d: "to give weight to, believe"}
          - {w: "abrirse camino", d: "to cut one's way through"}
          - {w: "en breves días", d: "in a few days"}
        diagram:
          - s: "Digo"
            r: "main verb: I say"
            under:
              - {s: "en fin, alta y desheredada señora", r: "opener and who is addressed"}
              - s: "que ... que no le deis crédito alguno"
                r: "what I say: that you give it no weight ('que' repeated after the condition)"
                under:
                  - {s: "si por la causa que he dicho vuestro padre ha hecho este metamorfóseos en vuestra persona", r: "condition: if your father has worked this change on you for the reason I gave"}
              - s: "porque no hay ningún peligro en la tierra"
                r: "why: because there is no danger on earth"
                under:
                  - s: "por quien no se abra camino mi espada"
                    r: "describes 'peligro': through which my sword will not cut its way"
                    under:
                      - s: "con la cual ... os pondré a vos la corona de la vuestra en la cabeza"
                        r: "describes 'espada': with which I will put on you the crown of your (land)"
                        under:
