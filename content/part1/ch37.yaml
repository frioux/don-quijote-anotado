summary: |
  At the inn, all the tangled love stories have come right: Dorotea has her don Fernando back, Cardenio his Luscinda, and the landlady has been promised payment for the damage. Only Sancho is glum, because the princess Micomicona has turned into plain Dorotea and with her goes his hope of a title. He wakes Don Quijote, who boasts of having cut off the giant's head; Sancho tells him the giant was a wineskin and the blood red wine. Don Quijote blames it all on enchantment, as he did with Sancho's blanket-tossing at this same inn.

  While Don Quijote dresses, the priest tells the newcomers about his madness. Don Fernando insists that Dorotea keep playing the princess so they can get him home. Don Quijote comes out in his dented barber's-basin helmet and solemnly assures the 'princess' that her magician father's spell need not worry her. Dorotea answers gracefully that she is the same as ever and still counts on his arm. Don Quijote turns on Sancho as a liar; Sancho holds firm about the wineskins, and Don Quijote ends by calling him a fool and asking his pardon.

  A traveler arrives dressed like a Christian just back from the land of the Moors, with a veiled Moorish woman on a donkey. There is no room, but the ladies take her in. The man, a former captive, explains that she understands no Spanish and wants to become a Christian, though she is not yet baptized. When she unveils, her beauty rivals Dorotea's and Luscinda's. Asked her name, he says Zoraida, but she cries 'No, not Zoraida: María!'

  At supper Don Quijote takes the head of the table and, as he once did with the goatherds, launches into a speech: the Discourse on Arms and Letters. He argues that arms take as much mind as letters, that their end, peace, is higher than the end of human letters, justice, and then begins comparing the hardships of the poor student, his hunger, cold and soup from convent doors, which he says fall short of a soldier's.
context: |
  Inns, captives and costume. The inn is crowded with gentry for the first time, and the social signs are sharp: the long table 'like a servants' hall', the place of honor at its head, the landlady's eye on her damages. The newcomer's blue coat, half-sleeves, yellow boots and Moorish cutlass mark him as a ransomed or escaped captive from Algiers, and the woman's 'almalafa' and veil as a Moor. Thousands of Spaniards were held for ransom in the Barbary ports; Cervantes himself was a captive in Algiers from 1575 to 1580, which is why the details, and the Arabic word 'macange', ring true. Ormsby glosses it as the colloquial negative 'ma-kan-shy'.

  Romance conventions. Dorotea goes on speaking as Princess Micomicona in the stately style of the chivalry books, and Don Quijote answers with vos-forms, 'metamorfóseos' and promises to win back her crown. The Discourse on Arms and Letters is a Renaissance commonplace: humanists debated whether the soldier or the scholar served the state better, and Castiglione's Courtier had made it fashionable. Don Quijote builds his case with scholastic method (the worth of a calling lies in its end) and with Scripture: the angels' 'peace on earth' (Luke 2:14) and Christ's 'Peace be to this house' and 'My peace I give you' (Luke 10:5, John 14:27).

  The narrator's games. Ormsby notes that Cervantes slips: the traveler is called 'the captive' before anyone has said he was one. The narrator also points out that while Don Quijote speaks of arms and letters, nobody could take him for a madman. His madness lives side by side with real eloquence, and the speech recalls his Golden Age speech to the goatherds in Chapter 11.

  Religion and law. The Moorish woman wants baptism, but an adult convert was normally instructed first; only danger of death allowed baptism at once. 'Letters' here means above all law: as Ormsby notes, 'letrado' means one devoted to jurisprudence, and 'to give each his own' is the Roman law definition of justice. 'Andar a la sopa', which Ormsby explains as living on the soup handed out at convent doors, was the lot of poor students and of the picaro.

  Names. 'Lela' is the Arabic title 'lalla', lady, and Zoraida probably comes from the Arabic word for the Pleiades; her insistence on 'María' announces her devotion to the Virgin. Sancho's 'señor Triste Figura' clips his master's own title, and Don Quijote's 'Sanchuelo' and 'bellacuelo' are scornful diminutives.

  Reading Cervantes' Spanish. The usual archaisms are here: mesmo, ansí, agora, priesa, recebir, estraño, estranjero, proprio, disignio, impidía, baptizar, captivo beside cautivo, malencónico, desparatado, vagamundo, circustantes. Contractions with 'de' (deso, dese, deste, della, dellas, dello) and -rl- turned into -ll- (pagalle, caminallas, ofrecelle, baptizalla, ejecutallos) are common. Pronouns hang on verbs that open a clause (Diole, Contóles, Ofrecióse, Abrazóla, sentáronse, acrecentóseles). The old vos endings appear (solíades, gustáredes, vístesos), the -ra subjunctive works as a conditional (creyera, gustara, hallara, juzgaran), and the future subjunctive is everywhere (quisiere, dijeren, fueren, hubiere, tuvieren, acomodáremos). Watch the false friends: suceso (outcome), discreto (wise), admirar (to astonish), puesto que (although), empresa (enterprise), crédito (good name).
