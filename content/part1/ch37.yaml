          - {w: "hicieron", f: "hic- + -ieron → hacer (to make), preterite, they. hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "escucharon", f: "escuch- + -aron → escuchar (to listen to), preterite, they. -é, -aste, -ó, -amos, -asteis, -aron."}
