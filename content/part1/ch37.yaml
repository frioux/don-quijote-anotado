  - sentences:
      - es: "— Levántese vuestra merced —dijo Sancho—, y verá el buen recado que ha hecho, y lo que tenemos que pagar; y verá a la reina convertida en una dama particular, llamada Dorotea, con otros sucesos que, si cae en ellos, le han de admirar."
        literal: "— Get-yourself-up your grace —said Sancho—, and you-will-see the good business that you-have done, and that which we-have to pay; and you-will-see [to] the queen turned into a lady private, called Dorotea, with other events that, if you-fall into them, you they-are to amaze."
        ormsby: "“Let your worship get up,” said Sancho, “and you will see the nice business you have made of it, and what we have to pay; and you will see the queen turned into a private lady called Dorothea, and other things that will astonish you, if you understand them.”"
