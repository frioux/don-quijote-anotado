      - es: "Si esto ha sido por orden del rey nigromante de vuestro padre, temeroso que yo no os diese la necesaria y debida ayuda, digo que no supo ni sabe de la misa la media, y que fue poco versado en las historias caballerescas, porque si él las hubiera leído y pasado tan atentamente y con tanto espacio como yo las pasé y leí, hallara a cada paso cómo otros caballeros de menor fama que la mía habían acabado cosas más dificultosas, no siéndolo mucho matar a un gigantillo, por arrogante que sea;"
        literal: "If this has been by order of-the king necromancer of your father, fearful that I not to-you might-give the necessary and due help, I-say that not he-knew nor knows of the mass the half, and that he-was little versed in the histories chivalric, because if he them had read and gone-through as attentively and with as-much leisure as I them went-through and read, he-would-find at each step how other knights of lesser fame than the mine had achieved things more difficult, not being-it much to-kill [to] a little-giant, for arrogant that he-may-be;"
