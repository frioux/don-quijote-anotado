  - sentences:
      - es: "— Yo soy el que tengo de serviros y acompañaros —respondió don Quijote—, y agradezco mucho la merced que se me hace y la buena opinión que de mí se tiene, la cual procuraré que salga verdadera, o me costará la vida, y aun más, si más costarme puede."
        literal: "— I am the [one] who I-have of serving-you and accompanying-you —answered don Quijote—, and I-thank much the favor that to-me is-done and the good opinion that of me is-held, the which I-will-try that it-may-come-out true, or to-me it-will-cost the life, and even more, if more cost-me it-can."
        ormsby: "“It is I who shall wait upon and accompany you,” said Don Quixote; “and I am much gratified by the favour that is bestowed upon me, and the good opinion entertained of me, which I shall strive to justify or it shall cost me my life, or even more, if it can possibly cost me more.”"
        vocab:
          - {w: "tener de", d: "to have to (old form of 'tener que')"}
          - {w: "agradecer", d: "to be grateful for, thank"}
          - {w: "procurar", d: "to try, strive"}
          - {w: "salir verdadero", d: "to prove true"}
