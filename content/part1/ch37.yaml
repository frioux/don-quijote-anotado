  - sentences:
      - es: "Preguntó don Fernando al captivo cómo se llamaba la mora, el cual respondió que lela Zoraida; y, así como esto oyó, ella entendió lo que le habían preguntado al cristiano, y dijo con mucha priesa, llena de congoja y donaire:"
        literal: "Asked don Fernando [to-]the captive how herself called the Moorish-woman, the which answered that lela Zoraida; and, as soon as this she-heard, she understood that which to-him they-had asked [to-]the Christian, and said with much haste, full of anguish and grace:"
        ormsby: "Don Fernando asked the captive what her name was, and he replied that it was Lela Zoraida; but the instant she heard him, she guessed what the Christian had asked, and said hastily, with some displeasure and energy,"
        vocab:
          - {w: "lela", d: "Arabic 'lalla', lady, a title of respect for a woman"}
          - {w: "Zoraida", d: "the Moorish woman's Arabic name (from Arabic 'thurayya', the Pleiades)"}
          - {w: "así como", d: "as soon as"}
          - {w: "priesa", d: "old form of prisa, haste"}
          - {w: "congoja", d: "anguish, distress"}
        diagram:
          - s: "Preguntó don Fernando al captivo"
            r: "main verb 1: don Fernando asked the captive"
            under:
              - {s: "cómo se llamaba la mora", r: "what: what the Moorish woman was called"}
              - {s: "el cual respondió que lela Zoraida", r: "describes 'captivo': who answered 'Lady Zoraida'"}
          - s: "ella entendió"
            r: "main verb 2: she understood"
            under:
