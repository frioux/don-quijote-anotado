  - sentences:
      - es: "— Por ella y por mí —respondió el captivo— os beso, señora mía, las manos, y estimo mucho y en lo que es razón la merced ofrecida; que en tal ocasión, y de tales personas como vuestro parecer muestra, bien se echa de ver que ha de ser muy grande."
