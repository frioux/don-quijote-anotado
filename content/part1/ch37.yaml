          - {w: "de media legua de andadura", d: "'half a league's walk long', a comic exaggeration of his long face"}
          - {w: "seco", d: "lean, gaunt (literally dry)"}
          - {w: "desigualdad de sus armas", d: "his mismatched armor"}
          - {w: "mesurado", d: "measured, dignified"}
          - {w: "continente", d: "bearing, demeanor"}
          - {w: "reposo", d: "calm, composure"}
