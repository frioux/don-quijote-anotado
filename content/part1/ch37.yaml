          - {w: "ha de ser", f: "ha → haber (present, it) + de + ser (to be): 'it must be'. he, has, ha, hemos, habéis, han."}
          - {w: "prosiga", f: "prosig- + -a → proseguir (to continue), present subjunctive, she, after 'quiero que'. The e becomes i: prosiga, prosigas, prosiga, prosigamos, prosigáis, prosigan."}
          - {w: "sea", f: "ser (to be), present subjunctive, it, after 'como' meaning 'provided that'. sea, seas, sea, seamos, seáis, sean."}
          - {w: "deste", f: "de + este fused: 'of this'."}
          - {w: "holgaré", f: "holgar + -é → holgar (to be glad), future, I. The future adds to the infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "se procure", f: "procur- + -e → procurar (to seek), present subjunctive, it, with impersonal 'se': 'be sought'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
