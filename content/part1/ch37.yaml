      - es: "Prosupuesta, pues, esta verdad, que el fin de la guerra es la paz, y que en esto hace ventaja al fin de las letras, vengamos ahora a los trabajos del cuerpo del letrado y a los del profesor de las armas, y véase cuáles son mayores."
