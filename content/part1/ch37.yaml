  - sentences:
      - es: "Salió, en esto, don Quijote, armado de todos sus pertrechos, con el yelmo, aunque abollado, de Mambrino en la cabeza, embrazado de su rodela y arrimado a su tronco o lanzón."
        literal: "Came-out, at this, don Quijote, armed with all his gear, with the helmet, although dented, of Mambrino on the head, [arm-]strapped with his round-shield and leaning on his trunk or big-lance."
        ormsby: "At this moment Don Quixote came out in full panoply, with Mambrino’s helmet, all dinted as it was, on his head, his buckler on his arm, and leaning on his staff or pike."
        vocab:
          - {w: "en esto", d: "at this moment, just then"}
          - {w: "pertrechos", d: "gear, equipment (military)"}
          - {w: "yelmo de Mambrino", d: "Mambrino's helmet: in Boiardo and Ariosto a magic golden helmet of the Moorish king Mambrino; Don Quijote's is a barber's brass basin he won in Chapter 21"}
          - {w: "abollado", d: "dented"}
          - {w: "embrazar", d: "to strap (a shield) on the arm; 'embrazado de' = with ... on his arm"}
          - {w: "rodela", d: "round shield, buckler"}
          - {w: "arrimarse a", d: "to lean on"}
          - {w: "lanzón", d: "short thick lance, pike (-ón makes it big)"}
