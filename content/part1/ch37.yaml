          - {w: "serviros, acompañaros", f: "servir (to serve), acompañar (to accompany) + os (you), infinitives after 'tengo de'."}
          - {w: "agradezco", f: "agradezc- + -o → agradecer (to thank), present, I; the c becomes zc before o. agradezco, agradeces, agradece, agradecemos, agradecéis, agradecen."}
