                  - {s: "y que en esto hace ventaja al fin de las letras", r: "which truth, 2: and in this it beats the end of letters"}
          - s: "y véase"
            r: "main verb 2: and let it be seen"
            under:
              - {s: "cuáles son mayores", r: "what: which are greater"}
        forms:
