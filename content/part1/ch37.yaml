  - sentences:
      - es: "— ¡Sí, sí: María; Zoraida macange! —que quiere decir no."
        literal: "— Yes, yes: María; Zoraida not! —which wants to-say no."
        ormsby: "“Yes, yes, Maria; Zoraida macange,” which means “not Zoraida.”"
        ormsby_note: "Properly ma-kan-shy, the common emphatic negative in popular Arabic, at least in the Barbary States."
        vocab:
          - {w: "macange", d: "Arabic for 'no, not' (Ormsby: 'ma-kan-shy')"}
          - {w: "querer decir", d: "to mean"}
        diagram:
          - {s: "¡Sí, sí: María; Zoraida macange!", r: "what she said: yes, María; not Zoraida"}
          - {s: "que quiere decir no", r: "narrator's gloss: which means 'no'"}
        forms:
          - {w: "quiere decir", f: "quier- + -e → querer (to want), present, it, + decir: 'querer decir' = to mean. quiero, quieres, quiere, queremos, queréis, quieren."}
        note: "Cervantes learned colloquial Arabic during his five years' captivity in Algiers, and he scatters authentic words through the captive's tale."
  - sentences:
      - es: "Ya en esto llegaba la noche, y, por orden de los que venían con don Fernando, había el ventero puesto diligencia y cuidado en aderezarles de cenar lo mejor que a él le fue posible."
