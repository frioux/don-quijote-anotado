        ormsby: "“Whoever told you, valiant Knight of the Rueful Countenance, that I had undergone any change or transformation did not tell you the truth, for I am the same as I was yesterday."
        vocab:
          - {w: "quienquiera que", d: "whoever"}
          - {w: "valeroso", d: "valiant, brave"}
          - {w: "mudarse", d: "to change"}
          - {w: "trocarse", d: "to be exchanged, transformed"}
          - {w: "lo cierto", d: "the truth"}
        diagram:
          - s: "no os dijo lo cierto"
            r: "main verb: did not tell you the truth"
            under:
              - s: "Quienquiera que os dijo"
                r: "subject: whoever told you"
                under:
                  - {s: "que yo me había mudado y trocado de mi ser", r: "what he told: that I had changed and been transformed"}
              - {s: "valeroso caballero de la Triste Figura", r: "who is addressed"}
              - {s: "porque la misma que ayer fui me soy hoy", r: "why: for I am today the same woman I was yesterday"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "me había mudado y trocado", f: "hab- + -ía → haber, imperfect, I, + the participles mudado (from mudarse, to change) and trocado (from trocarse, to be transformed): pluperfect 'I had changed'. había, habías, había, habíamos, habíais, habían."}
          - {w: "la misma", f: "mismo (same), feminine: Dorotea speaks of herself."}
          - {w: "fui", f: "ser (to be), preterite, I. fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "me soy", f: "soy → ser (to be), present, I, with an emphatic 'me': 'I am (still)'. soy, eres, es, somos, sois, son."}
      - es: "Verdad es que alguna mudanza han hecho en mí ciertos acaecimientos de buena ventura, que me la han dado la mejor que yo pudiera desearme, pero no por eso he dejado de ser la que antes y de tener los mesmos pensamientos de valerme del valor de vuestro valeroso e invenerable brazo que siempre he tenido."
        literal: "Truth it-is that some change have made in me certain happenings of good fortune, which to-me it have given the best that I could wish-myself, but not for that I-have ceased of being the [one] that before and of having the same thoughts of availing-myself of-the valor of your valiant and invincible arm that always I-have had."
        ormsby: "It is true that certain strokes of good fortune, that have given me more than I could have hoped for, have made some alteration in me; but I have not therefore ceased to be what I was before, or to entertain the same desire I have had all through of availing myself of the might of your valiant and invincible arm."
        vocab:
          - {w: "mudanza", d: "change"}
          - {w: "acaecimiento", d: "happening, event"}
          - {w: "buena ventura", d: "good fortune"}
          - {w: "dejar de", d: "to stop, cease"}
          - {w: "valerse de", d: "to avail oneself of, rely on"}
          - {w: "invenerable", d: "Dorotea's slip for 'invencible', invincible (perhaps a printer's error)"}
        diagram:
          - s: "Verdad es"
            r: "main clause 1: it is true"
            under:
