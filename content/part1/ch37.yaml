part: 1
chapter: 37
title_es: "Capítulo XXXVII. Que prosigue la historia de la famosa infanta Micomicona, con otras graciosas aventuras"
title_en: "In which is continued the story of the famous Princess Micomicona, with other droll adventures"
paragraphs:
  - sentences:
      - es: "Todo esto escuchaba Sancho, no con poco dolor de su ánima, viendo que se le desparecían e iban en humo las esperanzas de su ditado, y que la linda princesa Micomicona se le había vuelto en Dorotea, y el gigante en don Fernando, y su amo se estaba durmiendo a sueño suelto, bien descuidado de todo lo sucedido."
        literal: "All this was-listening-to Sancho, not with little pain of his soul, seeing that to-him were-disappearing and were-going in smoke the hopes of his title, and that the pretty princess Micomicona to-him had turned into Dorotea, and the giant into don Fernando, and his master was sleeping at sleep loose, well unaware of all the happened."
        ormsby: "To all this Sancho listened with no little sorrow at heart to see how his hopes of dignity were fading away and vanishing in smoke, and how the fair Princess Micomicona had turned into Dorothea, and the giant into Don Fernando, while his master was sleeping tranquilly, totally unconscious of all that had come to pass."
        vocab:
          - {w: "no con poco", d: "with no little, i.e. with much (understatement)"}
          - {w: "ánima", d: "soul; older and more emotional word than 'alma'"}
          - {w: "desparecer", d: "old form of desaparecer, to disappear"}
          - {w: "irse en humo", d: "to go up in smoke, come to nothing"}
          - {w: "ditado", d: "old form of dictado: title of rank, dignity (the countship or governorship Sancho hoped for)"}
          - {w: "Micomicona", d: "the invented princess of the kingdom of Micomicón that Dorotea has been playing to lure Don Quijote home"}
          - {w: "volverse en", d: "to turn into; modern 'volverse' or 'convertirse en'"}
          - {w: "a sueño suelto", d: "soundly, fast asleep (literally 'with loose sleep')"}
          - {w: "descuidado de", d: "unaware of, untroubled by"}
        diagram:
          - s: "Todo esto escuchaba Sancho"
            r: "main clause: Sancho was listening to all this"
            under:
              - {s: "no con poco dolor de su ánima", r: "how: with great grief"}
              - s: "viendo"
                r: "why: seeing"
                under:
                  - {s: "que se le desparecían e iban en humo las esperanzas de su ditado", r: "what he saw, 1: that his hopes of a title were vanishing in smoke"}
                  - {s: "y que la linda princesa Micomicona se le había vuelto en Dorotea, y el gigante en don Fernando", r: "what he saw, 2: that the princess had turned into Dorotea and the giant into don Fernando"}
                  - s: "y su amo se estaba durmiendo a sueño suelto"
                    r: "what he saw, 3: and that his master was fast asleep"
                    under:
                      - {s: "bien descuidado de todo lo sucedido", r: "describes 'su amo': quite unaware of all that had happened"}
        forms:
          - {w: "escuchaba", f: "escuch- + -aba → escuchar (to listen to), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "viendo", f: "gerund of ver (to see): 'seeing'."}
          - {w: "se le desparecían", f: "desparec- + -ían → desparecer (to disappear), imperfect, they (the hopes). 'se' goes with the verb; 'le' = on him, the one who loses them. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "iban", f: "ir (to go), imperfect, they. ir is irregular in the imperfect: iba, ibas, iba, íbamos, ibais, iban."}
          - {w: "e", f: "'y' (and) becomes 'e' before a word beginning with an i sound ('iban')."}
          - {w: "había vuelto", f: "hab- + -ía → haber (to have), imperfect, she, + vuelto, the irregular participle of volver (to turn): pluperfect 'had turned'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "se estaba durmiendo", f: "est- + -aba → estar (to be), imperfect, he, + durmiendo, the gerund of dormir (to sleep), with 'se': 'was sleeping away'. The o of dormir turns to u in the gerund. Same -aba imperfect."}
          - {w: "descuidado", f: "participle of descuidar (to neglect) used as an adjective, masculine to match 'amo'."}
          - {w: "lo sucedido", f: "lo + the participle of suceder (to happen): 'what had happened'. 'lo' + participle or adjective makes an abstract noun."}
      - es: "No se podía asegurar Dorotea si era soñado el bien que poseía."
        literal: "Not herself could assure Dorotea whether was dreamed the good-fortune that she-possessed."
        ormsby: "Dorothea was unable to persuade herself that her present happiness was not all a dream;"
        vocab:
          - {w: "asegurarse", d: "to make sure, be certain"}
          - {w: "el bien", d: "the good fortune, happiness"}
          - {w: "poseer", d: "to possess, have"}
        diagram:
          - s: "No se podía asegurar Dorotea"
            r: "main verb: Dorotea could not be sure"
            under:
              - s: "si era soñado el bien"
                r: "of what: whether the happiness was a dream"
                under:
                  - {s: "que poseía", r: "describes 'el bien': that she had"}
        forms:
          - {w: "se podía asegurar", f: "pod- + -ía → poder (to be able), imperfect, she, + the infinitive asegurar (to make sure); the 'se' of asegurarse has moved in front of 'podía'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "era", f: "ser (to be), imperfect, it. ser is irregular in the imperfect: era, eras, era, éramos, erais, eran."}
          - {w: "soñado", f: "participle of soñar (to dream), masculine to match 'el bien': 'dreamed'."}
          - {w: "poseía", f: "pose- + -ía → poseer (to possess), imperfect, she. Same -ía imperfect."}
      - es: "Cardenio estaba en el mismo pensamiento, y el de Luscinda corría por la misma cuenta."
        literal: "Cardenio was in the same thought, and that of Luscinda ran by the same account."
        ormsby: "Cardenio was in a similar state of mind, and Luscinda’s thoughts ran in the same direction."
        vocab:
          - {w: "correr por la misma cuenta", d: "to run the same way, be in the same case"}
        diagram:
          - s: "Cardenio estaba"
            r: "main verb 1: Cardenio was"
            under:
              - {s: "en el mismo pensamiento", r: "where: in the same frame of mind"}
          - s: "y el de Luscinda corría"
            r: "main verb 2: and Luscinda's (thought) ran"
            under:
              - {s: "por la misma cuenta", r: "how: the same way"}
        forms:
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "el de Luscinda", f: "'el' stands for 'el pensamiento' already named: 'that of Luscinda'."}
          - {w: "corría", f: "corr- + -ía → correr (to run), imperfect, it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "mismo, misma", f: "mismo (same), masculine to match 'pensamiento', feminine to match 'cuenta'."}
      - es: "Don Fernando daba gracias al cielo por la merced recebida y haberle sacado de aquel intricado laberinto, donde se hallaba tan a pique de perder el crédito y el alma;"
        literal: "Don Fernando was-giving thanks to-the heaven for the favor received and to-have-him taken-out of that intricate labyrinth, where himself he-found so on-the-point of losing the credit and the soul;"
        ormsby: "Don Fernando gave thanks to Heaven for the favour shown to him and for having been rescued from the intricate labyrinth in which he had been brought so near the destruction of his good name and of his soul;"
        vocab:
          - {w: "merced", d: "favor, grace"}
          - {w: "recebir", d: "old form of recibir, to receive"}
          - {w: "intricado", d: "old form of intrincado, tangled, intricate"}
          - {w: "laberinto", d: "labyrinth, maze"}
          - {w: "estar a pique de", d: "to be on the point of, in danger of"}
          - {w: "crédito", d: "good name, reputation (not money)"}
        diagram:
          - s: "Don Fernando daba gracias al cielo"
            r: "main verb: don Fernando gave thanks to heaven"
            under:
              - {s: "por la merced recebida", r: "why 1: for the favor received"}
              - s: "y haberle sacado de aquel intricado laberinto"
                r: "why 2: and for having taken him out of that labyrinth"
                under:
                  - {s: "donde se hallaba tan a pique de perder el crédito y el alma", r: "describes 'laberinto': where he was so close to losing his good name and his soul"}
        forms:
          - {w: "daba", f: "d- + -aba → dar (to give), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "al", f: "a + el fused: 'to the'."}
          - {w: "recebida", f: "participle of recebir (= recibir, to receive), feminine to match 'merced'."}
          - {w: "haberle sacado", f: "the infinitive haber (to have) + le (him) + sacado, the participle of sacar (to take out): 'having taken him out', the perfect infinitive, still after 'por'. The subject is heaven."}
          - {w: "se hallaba", f: "hall- + -aba → hallarse (to find oneself, be), imperfect, he. Same -aba imperfect."}
          - {w: "perder", f: "infinitive (to lose) after 'a pique de'."}
      - es: "y, finalmente, cuantos en la venta estaban, estaban contentos y gozosos del buen suceso que habían tenido tan trabados y desesperados negocios."
        literal: "and, finally, as-many-as in the inn were, were content and joyful of-the good outcome that had had such tangled and hopeless affairs."
        ormsby: "and in short everybody in the inn was full of contentment and satisfaction at the happy issue of such a complicated and hopeless business."
        vocab:
          - {w: "cuantos", d: "all those who, as many as"}
          - {w: "venta", d: "roadside inn"}
          - {w: "gozoso", d: "joyful"}
          - {w: "suceso", d: "false friend: outcome, event (not 'success'); 'buen suceso' = happy outcome"}
          - {w: "trabado", d: "tangled, knotted together"}
          - {w: "negocio", d: "affair, matter (not only business)"}
        diagram:
          - s: "estaban contentos y gozosos"
            r: "main verb (after 'y, finalmente'): were happy and joyful"
            under:
              - {s: "cuantos en la venta estaban", r: "subject: everyone who was in the inn"}
              - s: "del buen suceso"
                r: "about what: about the happy outcome"
                under:
                  - {s: "que habían tenido tan trabados y desesperados negocios", r: "describes 'suceso': that such tangled and hopeless affairs had had"}
        forms:
          - {w: "estaban", f: "est- + -aban → estar (to be), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "contentos y gozosos", f: "masculine plural to match 'cuantos', everyone in the inn."}
          - {w: "buen", f: "bueno (good) clipped before a masculine singular noun ('suceso')."}
          - {w: "habían tenido", f: "hab- + -ían → haber (to have), imperfect, they, + tenido, the participle of tener (to have): pluperfect 'had had'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "trabados y desesperados", f: "participles of trabar (to tangle) and desesperar (to despair) used as adjectives, masculine plural to match 'negocios'."}
  - sentences:
      - es: "Todo lo ponía en su punto el cura, como discreto, y a cada uno daba el parabién del bien alcanzado;"
        literal: "All it was-putting in its point the priest, as wise [man], and to each one he-gave the congratulation of-the good attained;"
        ormsby: "The curate as a sensible man made sound reflections upon the whole affair, and congratulated each upon his good fortune;"
        vocab:
          - {w: "poner en su punto", d: "to set right, put in its proper light"}
          - {w: "cura", d: "parish priest (Ormsby's 'curate')"}
          - {w: "discreto", d: "false friend: wise, sensible (not 'discreet')"}
          - {w: "parabién", d: "congratulation; 'dar el parabién' = to congratulate"}
          - {w: "alcanzar", d: "to attain, reach"}
        diagram:
          - s: "Todo lo ponía en su punto el cura"
            r: "main verb 1: the priest put everything in its proper light"
            under:
              - {s: "como discreto", r: "how: as a wise man"}
          - s: "y a cada uno daba el parabién"
            r: "main verb 2: and congratulated each one"
            under:
              - {s: "del bien alcanzado", r: "on what: on the happiness reached"}
        forms:
          - {w: "Todo lo", f: "'todo' as the object is repeated by 'lo': 'all of it'."}
          - {w: "ponía", f: "pon- + -ía → poner (to put), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "daba", f: "d- + -aba → dar (to give), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "del", f: "de + el fused: 'of the'."}
          - {w: "alcanzado", f: "participle of alcanzar (to attain), masculine to match 'bien'."}
      - es: "pero quien más jubilaba y se contentaba era la ventera, por la promesa que Cardenio y el cura le habían hecho de pagalle todos los daños e intereses que por cuenta de don Quijote le hubiesen venido."
        literal: "but who most was-rejoicing and was-pleased was the innkeeper's-wife, for the promise that Cardenio and the priest to-her had made of to-pay-her all the damages and interests that on account of don Quijote to-her might-have come."
        ormsby: "but the one that was in the highest spirits and good humour was the landlady, because of the promise Cardenio and the curate had given her to pay for all the losses and damage she had sustained through Don Quixote’s means."
        vocab:
          - {w: "jubilar", d: "to rejoice (old sense; today it means 'to retire')"}
          - {w: "contentarse", d: "to be pleased"}
          - {w: "ventera", d: "innkeeper's wife, landlady"}
          - {w: "pagalle", d: "= pagarle, to pay her"}
          - {w: "daños e intereses", d: "damages and losses, a legal formula"}
          - {w: "por cuenta de", d: "on account of, through"}
        diagram:
          - s: "era la ventera"
            r: "main verb (after 'pero'): was the landlady"
            under:
              - {s: "quien más jubilaba y se contentaba", r: "subject: the one who rejoiced most"}
              - s: "por la promesa"
                r: "why: because of the promise"
                under:
                  - {s: "que Cardenio y el cura le habían hecho", r: "describes 'promesa': that Cardenio and the priest had made her"}
                  - s: "de pagalle todos los daños e intereses"
                    r: "what promise: to pay her all damages and losses"
                    under:
                      - {s: "que por cuenta de don Quijote le hubiesen venido", r: "describes 'daños': that had come to her through Don Quijote"}
        forms:
          - {w: "jubilaba, se contentaba", f: "jubil- + -aba → jubilar (to rejoice), content- + -aba → contentarse (to be pleased), imperfect, she. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "era", f: "ser (to be), imperfect, she. ser is irregular in the imperfect: era, eras, era, éramos, erais, eran."}
          - {w: "habían hecho", f: "hab- + -ían → haber, imperfect, they, + hecho, the irregular participle of hacer (to make): pluperfect 'had made'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "pagalle", f: "pagar (to pay) + le (her): Cervantes often turns -rl- into -ll- in an infinitive with a pronoun; modern 'pagarle'."}
          - {w: "e", f: "'y' (and) becomes 'e' before a word beginning with an i sound ('intereses')."}
          - {w: "hubiesen venido", f: "hub- + -iesen → haber, imperfect subjunctive (-se form), they, + venido, the participle of venir (to come): 'might have come'. The subjunctive because the damages are not yet counted. haber in the -se form: hubiese, hubieses, hubiese, hubiésemos, hubieseis, hubiesen."}
      - es: "Sólo Sancho, como ya se ha dicho, era el afligido, el desventurado y el triste; y así, con malencónico semblante, entró a su amo, el cual acababa de despertar, a quien dijo:"
        literal: "Only Sancho, as already it-has-been said, was the afflicted [one], the unlucky [one] and the sad [one]; and so, with melancholy face, he-went-in to his master, the which had-just of waking, to whom he-said:"
        ormsby: "Sancho, as has been already said, was the only one who was distressed, unhappy, and dejected; and so with a long face he went in to his master, who had just awoke, and said to him:"
        vocab:
          - {w: "afligido", d: "grieved, distressed"}
          - {w: "desventurado", d: "unlucky, wretched"}
          - {w: "malencónico", d: "old form of melancólico, melancholy, gloomy"}
          - {w: "semblante", d: "face, expression"}
          - {w: "entrar a", d: "to go in to (see someone)"}
          - {w: "acabar de", d: "to have just (done something)"}
        diagram:
          - s: "Sólo Sancho ... era el afligido, el desventurado y el triste"
            r: "main clause 1: only Sancho was the sad one"
            under:
              - {s: "como ya se ha dicho", r: "aside: as has been said"}
          - s: "entró a su amo"
            r: "main verb 2 (after 'y así'): he went in to his master"
            under:
              - {s: "con malencónico semblante", r: "how: with a gloomy face"}
              - {s: "el cual acababa de despertar", r: "describes 'amo': who had just woken"}
              - {s: "a quien dijo:", r: "describes 'amo': to whom he said"}
        forms:
          - {w: "se ha dicho", f: "ha → haber (to have), present, it, + dicho, the irregular participle of decir (to say), with 'se' making it impersonal: 'it has been said'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "era", f: "ser (to be), imperfect, he. ser is irregular in the imperfect: era, eras, era, éramos, erais, eran."}
          - {w: "el afligido, el desventurado y el triste", f: "adjectives made into nouns by 'el': 'the grieving one, the unlucky one, the sad one'."}
          - {w: "entró", f: "entr- + -ó → entrar (to go in), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "acababa", f: "acab- + -aba → acabar (to finish), imperfect, he; 'acababa de despertar' = had just woken. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Bien puede vuestra merced, señor Triste Figura, dormir todo lo que quisiere, sin cuidado de matar a ningún gigante, ni de volver a la princesa su reino: que ya todo está hecho y concluido."
        literal: "— Well can your grace, sir Sad Figure, sleep all that which you-may-wish, without care of killing [to] no giant, nor of returning to the princess her kingdom: for already all is done and concluded."
        ormsby: "“Sir Rueful Countenance, your worship may as well sleep on as much as you like, without troubling yourself about killing any giant or restoring her kingdom to the princess; for that is all over and settled now.”"
        vocab:
          - {w: "vuestra merced", d: "your grace, your worship: the polite 'you', taking a verb in the he/she form (origin of modern 'usted')"}
          - {w: "Triste Figura", d: "Sancho clips Don Quijote's title, 'Caballero de la Triste Figura', Knight of the Sad (Rueful) Countenance, which Sancho himself gave him"}
          - {w: "sin cuidado de", d: "without worrying about"}
          - {w: "volver", d: "here: to give back, restore"}
          - {w: "concluido", d: "finished, settled"}
        diagram:
          - s: "Bien puede vuestra merced ... dormir"
            r: "main verb: your grace may well sleep"
            under:
              - {s: "señor Triste Figura", r: "who is addressed"}
              - {s: "todo lo que quisiere", r: "how much: as much as you like"}
              - {s: "sin cuidado de matar a ningún gigante, ni de volver a la princesa su reino", r: "how: without worrying about killing a giant or giving the princess back her kingdom"}
              - {s: "que ya todo está hecho y concluido", r: "why: for it is all done and settled"}
        forms:
          - {w: "puede", f: "pued- + -e → poder (to be able), present, you (vuestra merced takes the he/she form). The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "quisiere", f: "quis- + -iere → querer (to want), future subjunctive, you: 'whatever you may wish'; modern 'quiera'. The future subjunctive of -er and -ir verbs: -iere, -ieres, -iere, -iéremos, -iereis, -ieren, on the stem of the preterite (quis-)."}
          - {w: "ningún", f: "ninguno (no, any) clipped before a masculine singular noun ('gigante'); after 'sin' it means 'any'."}
          - {w: "matar, volver", f: "infinitives (to kill, to give back) after 'de'."}
          - {w: "está hecho y concluido", f: "est- + -á → estar (to be), present, it, + the participles hecho (from hacer, to do) and concluido (from concluir, to finish): 'is done and finished'. estar in the present: estoy, estás, está, estamos, estáis, están."}
  - sentences:
      - es: "— Eso creo yo bien —respondió don Quijote—, porque he tenido con el gigante la más descomunal y desaforada batalla que pienso tener en todos los días de mi vida;"
        literal: "— That believe I well —answered don Quijote—, because I-have had with the giant the most enormous and outrageous battle that I-think to-have in all the days of my life;"
        ormsby: "“I should think it was,” replied Don Quixote, “for I have had the most prodigious and stupendous battle with the giant that I ever remember having had all the days of my life;"
        vocab:
          - {w: "descomunal", d: "enormous, monstrous; a favorite word of the chivalry books"}
          - {w: "desaforado", d: "outrageous, beyond all measure"}
          - {w: "pensar tener", d: "here: to expect to have"}
        diagram:
          - s: "Eso creo yo bien"
            r: "main verb: I well believe that"
          - {s: "respondió don Quijote", r: "speech tag: answered Don Quijote"}
          - s: "porque he tenido con el gigante la más descomunal y desaforada batalla"
            r: "why: because I have had the most enormous battle with the giant"
            under:
              - {s: "que pienso tener en todos los días de mi vida", r: "describes 'batalla': that I expect to have in all my life"}
        forms:
          - {w: "creo", f: "cre- + -o → creer (to believe), present, I. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "he tenido", f: "he → haber (to have), present, I, + tenido, the participle of tener (to have): present perfect 'I have had'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "la más descomunal", f: "superlative: 'the most enormous'; 'la' agrees with 'batalla'."}
          - {w: "pienso", f: "piens- + -o → pensar (to think, intend), present, I. The stem e becomes ie when stressed: pienso, piensas, piensa, pensamos, pensáis, piensan."}
      - es: "y de un revés, ¡zas!, le derribé la cabeza en el suelo, y fue tanta la sangre que le salió, que los arroyos corrían por la tierra como si fueran de agua."
        literal: "and with a backstroke, whack!, to-him I-knocked-down the head on the ground, and was so-much the blood that from-him came-out, that the streams ran over the earth as if they-were of water."
        ormsby: "and with one backstroke—swish!—I brought his head tumbling to the ground, and so much blood gushed forth from him that it ran in rivulets over the earth like water.”"
        vocab:
          - {w: "revés", d: "backhand stroke (with a sword)"}
          - {w: "¡zas!", d: "whack! swish! (the sound of a blow)"}
