  - sentences:
      - es: "— No os dé mucha pena, señora mía, la incomodidad de regalo que aquí falta, pues es proprio de ventas no hallarse en ellas;"
        literal: "— Not to-you may-give much grief, lady mine, the lack of comfort that here is-missing, since it-is proper of inns not to-be-found in them;"
        ormsby: "“Do not be put out, señora, by the discomfort and want of luxuries here, for it is the way of roadside inns to be without them;"
        vocab:
          - {w: "dar pena", d: "to upset, trouble"}
