          - {w: "he dicho", f: "he → haber (present, I) + dicho, the irregular participle of decir: 'I have said'. he, has, ha, hemos, habéis, han."}
          - {w: "ha hecho", f: "ha → haber (present, he) + hecho, the irregular participle of hacer (to do): 'has worked'. Same haber present."}
          - {w: "deis", f: "d- + -eis → dar (to give), present subjunctive, you (vos), a polite command after 'digo que'. dé, des, dé, demos, deis, den."}
          - {w: "ningún", f: "ninguno (no) clipped before a masculine singular noun ('peligro')."}
