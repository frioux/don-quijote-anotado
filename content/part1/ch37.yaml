          - {w: "hace", f: "hac- + -e → hacer (to make), present, it. hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "vengamos", f: "veng- + -amos → venir (to come), present subjunctive, we: 'let us come'. venga, vengas, venga, vengamos, vengáis, vengan."}
