          - {w: "hacer ventaja a", d: "to surpass"}
          - {w: "letrado", d: "man of letters; here especially a law student or lawyer"}
          - {w: "profesor de las armas", d: "one who professes arms, a soldier (not a teacher)"}
        diagram:
