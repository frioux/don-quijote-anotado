        forms:
          - {w: "llegaba", f: "lleg- + -aba → llegar (to arrive), imperfect, it. -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "venían", f: "ven- + -ían → venir (to come), imperfect, they. -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "había ... puesto", f: "había → haber (imperfect, he) + puesto, the irregular participle of poner (to put), with the subject between them: pluperfect 'had put'. había, habías, había, habíamos, habíais, habían."}
          - {w: "aderezarles", f: "aderezar (to prepare) + les (for them), infinitive after 'en'."}
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, it. fui, fuiste, fue, fuimos, fuisteis, fueron."}
      - es: "Llegada, pues, la hora, sentáronse todos a una larga mesa, como de tinelo, porque no la había redonda ni cuadrada en la venta, y dieron la cabecera y principal asiento, puesto que él lo rehusaba, a don Quijote, el cual quiso que estuviese a su lado la señora Micomicona, pues él era su aguardador."
        literal: "Arrived, then, the hour, sat-themselves all at a long table, as of servants'-hall, because not it there-was round nor square in the inn, and they-gave the head and principal seat, although he it was-refusing, to don Quijote, the which wanted that might-be at his side the lady Micomicona, since he was her guardian."
        ormsby: "The hour therefore having arrived they all took their seats at a long table like a refectory one, for round or square table there was none in the inn, and the seat of honour at the head of it, though he was for refusing it, they assigned to Don Quixote, who desired the lady Micomicona to place herself by his side, as he was her protector."
