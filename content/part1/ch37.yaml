              - {s: "lo que le habían preguntado al cristiano", r: "what: what they had asked the Christian"}
          - s: "y dijo"
            r: "main verb 3: and said"
            under:
              - {s: "con mucha priesa", r: "how: in great haste"}
              - {s: "llena de congoja y donaire", r: "describes 'ella': full of distress and charm"}
        forms:
          - {w: "Preguntó", f: "pregunt- + -ó → preguntar (to ask), preterite, he. -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "se llamaba", f: "llam- + -aba → llamarse (to be called), imperfect, she. -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "respondió, entendió", f: "respond- + -ió → responder; entend- + -ió → entender (to understand), preterite. -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "oyó", f: "oy- + -ó → oír (to hear), preterite, she; the i becomes y between vowels. oí, oíste, oyó, oímos, oísteis, oyeron."}
          - {w: "habían preguntado", f: "hab- + -ían → haber (imperfect, they) + preguntado: pluperfect 'had asked'. había, habías, había, habíamos, habíais, habían."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, she. dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "llena", f: "lleno (full), feminine to match 'ella'."}
  - sentences:
      - es: "— ¡No, no Zoraida: María, María! —dando a entender que se llamaba María y no Zoraida."
        literal: "— No, not Zoraida: María, María! —giving to understand that herself she-called María and not Zoraida."
        ormsby: "“No, not Zoraida; Maria, Maria!” giving them to understand that she was called “Maria” and not “Zoraida.”"
        vocab:
          - {w: "dar a entender", d: "to make understood, indicate"}
        diagram:
          - {s: "¡No, no Zoraida: María, María!", r: "what she said: not Zoraida, María"}
          - s: "dando a entender"
            r: "how: making it understood"
            under:
              - {s: "que se llamaba María y no Zoraida", r: "what: that she was called María, not Zoraida"}
        forms:
          - {w: "dando", f: "gerund of dar (to give): 'dar a entender' = to make understood."}
          - {w: "se llamaba", f: "llam- + -aba → llamarse (to be called), imperfect, she. -aba, -abas, -aba, -ábamos, -abais, -aban."}
        note: "María is the name she wants as a Christian, after the Virgin Mary, whom she will be shown to revere in the captive's story."
  - sentences:
      - es: "Estas palabras, el grande afecto con que la mora las dijo, hicieron derramar más de una lágrima a algunos de los que la escucharon, especialmente a las mujeres, que de su naturaleza son tiernas y compasivas. Abrazóla Luscinda con mucho amor, diciéndole:"
        literal: "These words, the great feeling with which the Moorish-woman them said, made shed more than one tear to some of those who her heard, especially to the women, who of their nature are tender and compassionate. Embraced-her Luscinda with much love, saying-to-her:"
        ormsby: "These words, and the touching earnestness with which she uttered them, drew more than one tear from some of the listeners, particularly the women, who are by nature tenderhearted and compassionate. Luscinda embraced her affectionately, saying,"
        vocab:
          - {w: "afecto", d: "feeling, emotion"}
          - {w: "derramar", d: "to shed (tears)"}
          - {w: "compasivo", d: "compassionate"}
          - {w: "abrazar", d: "to embrace, hug"}
