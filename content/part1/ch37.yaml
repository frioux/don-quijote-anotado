                  - {s: "la desigualdad de sus armas", r: "what they saw, 2: his mismatched armor"}
                  - {s: "y su mesurado continente", r: "what they saw, 3: his dignified bearing"}
          - s: "y estuvieron callando"
            r: "main verb 2: and they stayed silent"
            under:
              - {s: "hasta ver lo que él decía", r: "until when: until they saw what he would say"}
          - s: "el cual ... dijo"
            r: "main verb 3: and he said"
            under:
              - {s: "con mucha gravedad y reposo", r: "how: with great gravity and calm"}
              - {s: "puestos los ojos en la hermosa Dorotea", r: "how: with his eyes fixed on the lovely Dorotea"}
        forms:
          - {w: "Suspendió", f: "suspend- + -ió → suspender (to astonish), preterite, it. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
