  - sentences:
      - es: "— No se le pregunta otra cosa ninguna —respondió Luscinda— sino ofrecelle por esta noche nuestra compañía y parte del lugar donde nos acomodáremos, donde se le hará el regalo que la comodidad ofreciere, con la voluntad que obliga a servir a todos los estranjeros que dello tuvieren necesidad, especialmente siendo mujer a quien se sirve."
