          - {w: "miró, apretó", f: "mir- + -ó → mirar (to look), apret- + -ó → apretar (to clench), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "estoy", f: "estar (to be), present, I. estoy, estás, está, estamos, estáis, están."}
          - {w: "ponga", f: "pong- + -a → poner (to put), present subjunctive, it (the havoc), in a clause of intended result. ponga, pongas, ponga, pongamos, pongáis, pongan."}
