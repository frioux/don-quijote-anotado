  - sentences:
      - es: "— No —dijo don Fernando—, no ha de ser así: que yo quiero que Dorotea prosiga su invención; que, como no sea muy lejos de aquí el lugar deste buen caballero, yo holgaré de que se procure su remedio."
        literal: "— No —said don Fernando—, not it-has to be so: for I want that Dorotea may-continue her invention; for, as-long-as not may-be very far from here the village of-this good gentleman, I will-be-glad of that may-be-sought his cure."
        ormsby: "“No,” said Don Fernando, “that must not be, for I want Dorothea to follow out this idea of hers; and if the worthy gentleman’s village is not very far off, I shall be happy if I can do anything for his relief.”"
        vocab:
          - {w: "haber de", d: "to have to, be going to"}
          - {w: "invención", d: "invention, made-up story"}
          - {w: "como", d: "here with the subjunctive: provided that, as long as"}
          - {w: "lugar", d: "village (common sense in Cervantes)"}
          - {w: "deste", d: "= de este, of this"}
          - {w: "holgar(se) de", d: "to be glad of"}
          - {w: "procurar", d: "to try to bring about, seek"}
