      - es: "Dime, ladrón vagamundo, ¿no me acabaste de decir ahora que esta princesa se había vuelto en una doncella que se llamaba Dorotea, y que la cabeza que entiendo que corté a un gigante era la puta que te parió, con otros disparates que me pusieron en la mayor confusión que jamás he estado en todos los días de mi vida?"
        literal: "Tell-me, thief vagabond, not to-me you-just-finished of saying now that this princess had turned into a maiden who herself called Dorotea, and that the head that I-understand that I-cut to a giant was the whore that you bore, with other nonsenses that me put in the greatest confusion that ever I-have been in all the days of my life?"
        ormsby: "Say, thief and vagabond, hast thou not just now told me that this princess had been turned into a maiden called Dorothea, and that the head which I am persuaded I cut off from a giant was the bitch that bore thee, and other nonsense that put me in the greatest perplexity I have ever been in all my life?"
