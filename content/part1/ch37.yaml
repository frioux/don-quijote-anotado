          - {w: "abollado", f: "participle of abollar (to dent), masculine to match 'yelmo'."}
          - {w: "lanzón", f: "lanza (lance) + -ón, the suffix that makes things big."}
      - es: "Suspendió a don Fernando y a los demás la estraña presencia de don Quijote, viendo su rostro de media legua de andadura, seco y amarillo, la desigualdad de sus armas y su mesurado continente, y estuvieron callando hasta ver lo que él decía, el cual, con mucha gravedad y reposo, puestos los ojos en la hermosa Dorotea, dijo:"
        literal: "Astonished [to] don Fernando and [to] the others the strange presence of don Quijote, seeing his face of half [a] league of walking, dry and yellow, the unevenness of his arms and his measured bearing, and they-were keeping-silent until seeing that which he was-saying, the which, with much gravity and calm, put the eyes on the beautiful Dorotea, said:"
        ormsby: "The strange figure he presented filled Don Fernando and the rest with amazement as they contemplated his lean yellow face half a league long, his armour of all sorts, and the solemnity of his deportment. They stood silent waiting to see what he would say, and he, fixing his eyes on the fair Dorothea, addressed her with great gravity and composure:"
