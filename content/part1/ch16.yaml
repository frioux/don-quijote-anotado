          - {w: "mirábanle", f: "mir- + -aban + le → mirar (to look at), imperfect, they, with 'le' (him) stuck on the end. Cervantes hangs pronouns on the end of a conjugated verb that opens its clause; modern Spanish says 'le miraban'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "admirábanse", f: "admir- + -aban + se → admirarse (to marvel), imperfect, they, with 'se' stuck on the end (the same pronoun rule; modern 'se admiraban'). Same -aba imperfect."}
          - {w: "parecíales", f: "parec- + -ía + les → parecer (to seem), imperfect, he, with 'les' (to them) stuck on the end; modern 'les parecía'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "se usaban", f: "us- + -aban → usarse (to be customary), imperfect, they (the men): 'were in use', i.e. the usual sort. Same -aba imperfect."}
      - es: "y, agradeciéndole con venteriles razones sus ofrecimientos, le dejaron;"
        literal: "and, thanking-him with innkeeperish words [for] his offerings, him they-left;"
        ormsby: "and thanking him in pothouse phrase for his civility they left him,"
        vocab:
          - {w: "agradecer", d: "to thank for: 'agradecerle sus ofrecimientos' = to thank him for his offers"}
          - {w: "venteril", d: "innkeeperish, of the inn: a word Cervantes coins from 'venta' for the women's rough-and-ready phrases"}
          - {w: "razones", d: "words, phrases"}
          - {w: "ofrecimiento", d: "offer of service, courtesy"}
        diagram:
          - s: "le dejaron"
            r: "main verb: they left him"
            under:
              - s: "agradeciéndole con venteriles razones sus ofrecimientos"
                r: "how: thanking him in innkeepers' language for his courtesies"
        forms:
          - {w: "agradeciéndole", f: "agradeciendo, the gerund of agradecer (to thank), + le (him), with an accent added to keep the stress on '-cien-'."}
          - {w: "venteriles", f: "venteril (of an innkeeper) + -es, plural to match 'razones'; the suffix -il makes an adjective from a noun, as in 'varonil', 'pueril'."}
          - {w: "sus", f: "plural to match 'ofrecimientos': 'his offers'."}
          - {w: "le dejaron", f: "dej- + -aron → dejar (to leave), preterite, they, with 'le' (him). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. 'le' for a man as direct object is Castilian leísmo."}
        note: "'Venteriles razones' sets the inn's plain speech against Don Quijote's courtly speech; the mismatch of two languages, high and low, is the comic engine of the whole scene."
      - es: "y la asturiana Maritornes curó a Sancho, que no menos lo había menester que su amo."
