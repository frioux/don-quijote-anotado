          - {w: "Tablante de Ricamonte", d: "a short Arthurian romance (Crónica de Tablante de Ricamonte y de Jofre), printed in 1513 and often reprinted; its hero Jofre fights the tyrant Tablante"}
          - {w: "aquel del otro libro", d: "the author of the other book"}
          - {w: "hechos", d: "deeds"}
          - {w: "conde Tomillas", d: "Count Tomillas, a figure of the Carolingian ballads about Montesinos; no book of his deeds is known"}
          - {w: "puntualidad", d: "exactness, minuteness of detail"}
