        note: "Inventories of wretched beds were a set piece of comic writing; the sheets are 'shield leather' and the blanket so threadbare that every thread can be counted. The mattress's lumps are 'bodoques', crossbow pellets."
      - es: "En esta maldita cama se acostó don Quijote, y luego la ventera y su hija le emplastaron de arriba abajo, alumbrándoles Maritornes, que así se llamaba la asturiana; y, como al bizmalle viese la ventera tan acardenalado a partes a don Quijote, dijo que aquello más parecían golpes que caída."
        literal: "In this cursed bed laid-himself-down Don Quijote, and then the innkeeper's-wife and her daughter him plastered from above downward, lighting-for-them Maritornes, who thus was-called the Asturian; and, as on-the plastering-him should-see the innkeeper's-wife so bruised in places [to] Don Quijote, she-said that that more seemed blows than fall."
        ormsby: "On this accursed bed Don Quixote stretched himself, and the hostess and her daughter soon covered him with plasters from top to toe, while Maritornes—for that was the name of the Asturian—held the light for them, and while plastering him, the hostess, observing how full of wheals Don Quixote was in some places, remarked that this had more the look of blows than of a fall."
        vocab:
          - {w: "maldito", d: "cursed, accursed, wretched"}
          - {w: "acostarse", d: "to lie down, go to bed"}
          - {w: "ventera", d: "innkeeper's wife, landlady"}
          - {w: "emplastar", d: "to cover with plasters ('emplastos', medicated dressings)"}
          - {w: "de arriba abajo", d: "from top to bottom, all over"}
          - {w: "alumbrar", d: "to light, hold the light for"}
          - {w: "Maritornes", d: "the servant's name, a rustic compound of Mari (María) and perhaps Tornes; it became the Spanish byword for a slatternly serving girl"}
          - {w: "al + infinitive", d: "on doing, while doing: 'al bizmalle' = while plastering him"}
          - {w: "bizmar", d: "to apply a 'bizma', a poultice of tow, pitch and herbs; the verb for dressing bruises"}
          - {w: "acardenalado", d: "black and blue, covered with bruises ('cardenales')"}
          - {w: "a partes", d: "in places, here and there"}
          - {w: "golpe", d: "blow"}
        diagram:
          - s: "se acostó"
            r: "main verb 1: lay down"
            under:
              - {s: "En esta maldita cama", r: "where: on this cursed bed"}
              - {s: "don Quijote", r: "subject"}
          - s: "y luego la ventera y su hija le emplastaron"
            r: "main verb 2: and then the hostess and her daughter plastered him"
            under:
              - {s: "de arriba abajo", r: "how: from top to toe"}
              - s: "alumbrándoles Maritornes"
                r: "while: Maritornes holding the light for them"
