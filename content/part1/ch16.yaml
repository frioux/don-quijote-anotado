                r: "than what: than that given by a lamp"
                under:
                  - {s: "que colgada en medio del portal ardía", r: "describes 'lámpara': which burned hanging in the middle of the gateway"}
        forms:
          - {w: "Toda, toda ella", f: "tod- + -a → todo (all), feminine to match 'venta' and 'ella' (the inn)."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, it. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "había", f: "hab- + -ía → haber, imperfect, used alone as 'there was' (the past of 'hay'). haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
