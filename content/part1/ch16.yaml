          - {w: "parecían", f: "parec- + -ían → parecer (to seem), imperfect, they: the verb agrees with 'golpes' (what it seemed like) rather than with 'aquello' (what was seen). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
