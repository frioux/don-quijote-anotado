  - sentences:
      - es: "— Don Quijote de la Mancha —respondió Sancho Panza—, y es caballero aventurero, y de los mejores y más fuertes que de luengos tiempos acá se han visto en el mundo."
        literal: "— Don Quijote of the Mancha —answered Sancho Panza—, and he-is knight adventurer, and of the best and most strong that from long times hither have-been seen in the world."
        ormsby: "“Don Quixote of La Mancha,” answered Sancho Panza, “and he is a knight-adventurer, and one of the best and stoutest that have been seen in the world this long time past.”"
        vocab:
          - {w: "caballero aventurero", d: "knight-adventurer, Sancho's version of 'caballero andante' (knight-errant); an 'aventurero' in real life was a soldier of fortune"}
          - {w: "de los mejores", d: "one of the best"}
          - {w: "fuerte", d: "strong, valiant"}
          - {w: "luengo", d: "long (archaic; modern 'largo'); 'de luengos tiempos acá' = for a long time past, this long while"}
          - {w: "acá", d: "hither, to here; after a time phrase, 'up to now'"}
        diagram:
          - s: "respondió"
            r: "main verb 1 (the speech tag): answered"
            under:
              - {s: "Don Quijote de la Mancha", r: "what he answered: the name"}
              - {s: "Sancho Panza", r: "subject"}
          - s: "y es caballero aventurero"
            r: "main verb 2: and he is a knight-adventurer"
            under:
              - s: "y de los mejores y más fuertes"
                r: "and one of the best and strongest"
                under:
                  - {s: "que de luengos tiempos acá se han visto en el mundo", r: "describes 'los mejores': that have been seen in the world this long while"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "es", f: "ser (to be), present, he. soy, eres, es, somos, sois, son. No article before a profession or rank: 'es caballero'."}
          - {w: "mejores", f: "mejor (better, best) + -es, plural to match 'los (caballeros)'."}
          - {w: "luengos", f: "lueng- + -os → luengo (long, archaic), masculine plural to match 'tiempos'."}
          - {w: "se han visto", f: "han = haber, present, they (he, has, ha, hemos, habéis, han), + visto, the irregular participle of ver (to see), with impersonal 'se': 'have been seen'."}
