          - {w: "honestidad", d: "chastity, virtue (a false friend: not 'honesty')"}
          - {w: "haberse de ver", d: "to be bound to find itself, be about to be"}
          - {w: "proponer en su corazón", d: "to resolve in one's heart"}
          - {w: "alevosía", d: "treachery, betrayal"}
          - {w: "Ginebra", d: "Guinevere, King Arthur's queen, famous for her adultery with Lancelot"}
          - {w: "Quintañona", d: "the duenna Quintañona, Guinevere's go-between in the Spanish ballads of Lancelot"}
