        note: "Guinevere and Quintañona come from the Spanish ballad of Lancelot, which Don Quijote loves to quote; choosing an adulteress and her go-between as the ultimate temptation is part of the joke."
  - sentences:
      - es: "Pensando, pues, en estos disparates, se llegó el tiempo y la hora —que para él fue menguada— de la venida de la asturiana, la cual, en camisa y descalza, cogidos los cabellos en una albanega de fustán, con tácitos y atentados pasos, entró en el aposento donde los tres alojaban en busca del arriero."
        literal: "Thinking, then, about these absurdities, arrived the time and the hour —which for him was unlucky— of the coming of the Asturian, who, in shift and barefoot, gathered the hairs in a hairnet of fustian, with silent and cautious steps, entered into the room where the three lodged in search of-the muleteer."
        ormsby: "While he was taken up with these vagaries, then, the time and the hour—an unlucky one for him—arrived for the Asturian to come, who in her smock, with bare feet and her hair gathered into a fustian coif, with noiseless and cautious steps entered the chamber where the three were quartered, in quest of the carrier;"
        vocab:
          - {w: "disparate", d: "absurdity, nonsense"}
          - {w: "llegarse", d: "to arrive, come round (of a time)"}
          - {w: "menguado", d: "unlucky, ill-fated; also 'diminished'"}
          - {w: "venida", d: "coming, arrival"}
          - {w: "camisa", d: "shift, chemise, the long undergarment slept in"}
          - {w: "descalzo", d: "barefoot"}
          - {w: "albanega", d: "hairnet, coif for gathering the hair (a word of Arabic origin)"}
          - {w: "fustán", d: "fustian, a coarse cotton cloth"}
          - {w: "tácito", d: "silent (Latinate)"}
          - {w: "atentado", d: "cautious, careful (old sense)"}
          - {w: "aposento", d: "room, chamber"}
          - {w: "en busca de", d: "in search of"}
        diagram:
          - s: "se llegó"
            r: "main verb 1: arrived"
            under:
              - {s: "Pensando, pues, en estos disparates", r: "while: as he thought about these absurdities"}
              - s: "el tiempo y la hora"
                r: "subject: the time and the hour"
                under:
                  - {s: "que para él fue menguada", r: "aside: which was an unlucky one for him"}
                  - {s: "de la venida de la asturiana", r: "of what: of the Asturian's coming"}
          - s: "la cual ... entró en el aposento"
            r: "main verb 2 (describing 'asturiana'): who entered the room"
            under:
