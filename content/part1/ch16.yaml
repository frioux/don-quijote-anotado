          - {w: "cogidos los cabellos", f: "an absolute participle: cogidos (participle of coger, to gather), masculine plural to match 'cabellos': 'her hair gathered'."}
          - {w: "tácitos y atentados", f: "masculine plural to match 'pasos'."}
          - {w: "entró", f: "entr- + -ó → entrar (to enter), preterite, she. Same -ar preterite."}
          - {w: "alojaban", f: "aloj- + -aban → alojar (to lodge), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
      - es: "Pero, apenas llegó a la puerta, cuando don Quijote la sintió, y, sentándose en la cama, a pesar de sus bizmas y con dolor de sus costillas, tendió los brazos para recebir a su fermosa doncella."
