      - es: "¡Bien haya mil veces el autor de Tablante de Ricamonte, y aquel del otro libro donde se cuenta los hechos del conde Tomillas; y con qué puntualidad lo describen todo!"
        literal: "Well may-have a-thousand times the author of Tablante de Ricamonte, and that [one] of-the other book where is-told the deeds of-the count Tomillas; and with what exactness it they-describe all!"
        ormsby: "A thousand blessings on the author of “Tablante de Ricamonte” and that of the other book in which the deeds of the Conde Tomillas are recounted; with what minuteness they describe everything!"
        ormsby_note: "Crónica de Tablante de Ricamonte, a romance of uncertain date and origin, based upon the Arthurian legend. The Conde Tomillas was a personage at the Court of Charlemagne mentioned in the Montesinos ballads, but no book of his deeds is known."
