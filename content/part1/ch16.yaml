summary: |
  Sancho brings his battered master, slung across the donkey, to an inn that Don Quijote takes for a castle, and explains the bruises as a fall from a rock. The innkeeper's kind wife and her pretty daughter plaster Don Quijote from head to foot in a garret that was once a hayloft, helped by Maritornes, a squat, one-eyed Asturian serving girl. The women notice that his bruises look more like blows than a fall, and Sancho, who also aches, tells them his master is a 'knight-adventurer': beaten one day, emperor the next.

  Don Quijote takes the hostess's hand and thanks her in the high style of the romances, saying that if he were not bound to his lady he would surrender to her daughter's eyes. The three women understand none of it. Maritornes has promised to spend the night with a muleteer from Arévalo who sleeps in the same loft, and the narrator stops to praise the historian Cide Hamete Benengeli for recording such trifles as the muleteer's bed.

  In the dark and silence, Don Quijote fancies that the lord's daughter has fallen in love with him and will come to his bed, and resolves to stay faithful to Dulcinea. When Maritornes creeps in, barefoot in her shift, looking for the muleteer, Don Quijote seizes her, sees sackcloth as silk, glass beads as pearls and her mane of hair as gold, and gently explains that his wounds and his loyalty to Dulcinea forbid him to accept her favors. The jealous muleteer punches him in the jaw and tramples his ribs until the bed collapses.

  The innkeeper wakes, lights a lamp and comes after Maritornes, who hides in Sancho's bed. Sancho, waking with a weight on top of him, lashes out, and a blind brawl follows: the muleteer beats Sancho, Sancho the girl, the girl Sancho, the innkeeper the girl. The lamp goes out. An officer of the Holy Brotherhood lodging at the inn bursts in, grabs the unconscious Don Quijote by the beard, decides he is dead and shouts for the gate to be shut. Everyone else slips back to bed; the officer goes to relight a lamp at the hearth.
context: |
  The inn and its people. The 'venta' was the roadside inn of Castile, a place of rough beds, shared lofts and stables where muleteers and travelers slept side by side. Muleteers ('arrieros') carried most of Spain's inland trade; the one here is rich, owning twelve good mules, and comes from Arévalo, a town of the carrying trade. Ormsby notes, after the scholar Pellicer, that many carriers were Moriscos, which gives an edge to the claim that the Moorish historian Cide Hamete was his relation. Maritornes belongs to a familiar type: the Asturian servant girl from the poor northern mountains who claimed noble blood because Asturias had never been conquered by the Moors. Her claim to be an hidalga 'brought low by misfortune' is that of every disguised lady in the romances.

  The parodied books. The night visit is a stock scene of chivalric romance: the princess who steals to the wounded knight's bed, and the knight who resists her out of loyalty to his lady. Don Quijote plays the role exactly, down to the courtly vocabulary (fermosa, habedes fecho, la sin par Dulcinea), and invokes Guinevere and her go-between Quintañona from the Spanish ballads of Lancelot. His description of Maritornes runs through the poetic catalogue of beauty (golden hair that outshines the sun, Orient pearls, sweet breath) while the narrator supplies the truth: a horse's mane, glass beads, yesterday's salad. Ormsby's notes identify Tablante de Ricamonte, a short Arthurian romance, and Count Tomillas, a figure from the Carolingian ballads of Montesinos, as the 'exact' histories the narrator mock-praises.

  The narrator's games. Cide Hamete Benengeli, the Arab historian 'found' in Chapter 9, is praised for recording the muleteer's bedding, a parody of the romances' claims to be true chronicles and of 'grave historians' who leave the substance in the inkwell. The irony shows in small slips too: as Ormsby's note points out, Sancho cannot sleep for pain and a few lines later is fast asleep. The final brawl is set to a nursery-tale chain ('the cat to the rat, the rat to the rope'), and the uproar is called 'harmony'.

  Medicine and law. The women treat the bruises with 'bizmas' and 'emplastos', poultices of tow soaked in pitch, wine and herbs, the standard remedy for a beating, which is why they at once suspect blows. The officer belongs to the Santa Hermandad, the rural police of the roads with summary powers, here the 'Old' brotherhood of Toledo; he carries a short staff and a tin box of warrants as signs of office, and his formula '¡Favor a la justicia!' obliged bystanders to help him.

  Names. Maritornes, a rustic compound of Mari (María), became proverbial in Spanish for an ugly, coarse servant girl. The punch lands on Don Quijote's 'quijadas' (jaws), an echo of his own original surname, Quijada. The bed is 'fementido' (faith-breaking), a romance word for a traitor, and the stable 'estrellado' (starry), because the stars show through its roof; Ormsby notes that this word puzzled earlier translators.

  Reading Cervantes' Spanish. The chapter sets two registers against each other: the archaic chivalric Spanish of Don Quijote (fermosa, fecho, ferido, furto with the old f-; habedes for habéis; yago for 'I lie'; pluguiera for 'would that it pleased') and the plain speech of the inn ('venteriles razones'), down to the innkeeper's '¡puta!'. The usual archaisms recur: asimesmo, ansimesmo, mesmo, proprio, recebir, estraño, escurecer, vidro, priesa, trujo for trajo, ascuras for a oscuras; contractions with 'de' (desta, deste, della, dél, desa); pronouns attached to verbs that open a clause (Tentóle, cuéntase, échase, mirábanle, estúvose, Retiróse, fuele); and -rl- turned to -ll- (bizmalle, tenella, dalle). Note 'vos' as the form for inferiors with its vosotros verbs (debistes, sois, sabed), the future subjunctive ('mientras la vida me durare'), the -ra form as a conditional ('fuera imposible', 'pudieran hacer vomitar'), and false friends: condición (temper), curar (to treat), curioso (careful), puntual (exact), honestidad (chastity), suceso (event), desgracia (misfortune), de industria (on purpose).
