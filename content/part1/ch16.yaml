  - sentences:
      - es: "Había el arriero concertado con ella que aquella noche se refocilarían juntos, y ella le había dado su palabra de que, en estando sosegados los huéspedes y durmiendo sus amos, le iría a buscar y satisfacerle el gusto en cuanto le mandase."
        literal: "Had the muleteer arranged with her that that night they-would-take-their-pleasure together, and she to-him had given her word of that, on being quieted the guests and sleeping her masters, him she-would-go to seek and satisfy-him the pleasure in whatever to-her he-should-command."
        ormsby: "The carrier had made an arrangement with her for recreation that night, and she had given him her word that when the guests were quiet and the family asleep she would come in search of him and meet his wishes unreservedly."
        vocab:
          - {w: "concertar", d: "to arrange, agree on"}
          - {w: "refocilarse", d: "to take one's pleasure, enjoy oneself (bodily); a plain word for sex"}
          - {w: "dar su palabra", d: "to give one's word"}
          - {w: "en + gerund", d: "as soon as, once: 'en estando sosegados' = once they were quiet"}
          - {w: "sosegado", d: "quiet, settled, at rest"}
          - {w: "huésped", d: "guest"}
          - {w: "amos", d: "masters, i.e. the innkeeper and his wife, her employers"}
          - {w: "ir a buscar", d: "to go and find, go in search of"}
          - {w: "satisfacer el gusto", d: "to satisfy someone's desire, give him his pleasure"}
          - {w: "en cuanto", d: "in whatever, in all that (here; elsewhere 'as soon as')"}
          - {w: "mandar", d: "to order, command"}
        diagram:
          - s: "Había el arriero concertado con ella"
            r: "main verb 1: the muleteer had arranged with her"
            under:
              - {s: "que aquella noche se refocilarían juntos", r: "what they arranged: that they would enjoy themselves together that night"}
          - s: "y ella le había dado su palabra"
            r: "main verb 2: and she had given him her word"
            under:
              - s: "de que, en estando sosegados los huéspedes y durmiendo sus amos, le iría a buscar"
                r: "what she promised: that once the guests were quiet and her masters asleep she would go find him"
                under:
                  - {s: "en estando sosegados los huéspedes y durmiendo sus amos", r: "when: once the guests were settled and her masters sleeping"}
                  - s: "y satisfacerle el gusto"
                    r: "and satisfy his desire"
                    under:
                      - {s: "en cuanto le mandase", r: "to what extent: in whatever he might ask"}
        forms:
          - {w: "Había ... concertado", f: "había (haber, imperfect, he: había, habías, había, habíamos, habíais, habían) + concertado, the participle of concertar (to arrange): the pluperfect 'had arranged'. The subject 'el arriero' sits between the two parts."}
          - {w: "se refocilarían", f: "refocilar (to refresh, give pleasure) + -ían → conditional, they, with 'se' (themselves): 'they would take their pleasure'. The conditional adds -ía, -ías, -ía, -íamos, -íais, -ían to the infinitive; it is the future seen from the past."}
          - {w: "le había dado", f: "había (haber, imperfect, she) + dado, the participle of dar (to give), with 'le' (to him): 'had given him'."}
          - {w: "su palabra", f: "'her word'; 'su' = her."}
          - {w: "en estando sosegados", f: "estando, the gerund of estar, + sosegados, the participle of sosegar (to quiet), masculine plural to match 'huéspedes'. 'en' + gerund = as soon as, once."}
          - {w: "durmiendo", f: "gerund of dormir (to sleep); the stem o turns to u: dormir → durmiendo."}
          - {w: "sus amos", f: "'her masters', plural to match 'amos': the innkeeper and his wife."}
          - {w: "le iría a buscar", f: "ir (to go) + -ía → conditional, she, with 'le' (him) and the infinitive buscar (to seek): 'would go to find him'. Same conditional endings."}
          - {w: "satisfacerle", f: "satisfacer (to satisfy) + le (to him), the pronoun hung on the infinitive; it shares the 'iría a' of the clause before."}
          - {w: "le mandase", f: "mand- + -ase → mandar (to command), imperfect subjunctive (-se form), he, with 'le' (to her): 'whatever he might order'. Subjunctive because it is an open future seen from the past. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
        note: "The narrator states the arrangement between the muleteer and Maritornes without euphemism, which makes Don Quijote's coming misreading of her visit all the funnier."
      - es: "Y cuéntase desta buena moza que jamás dio semejantes palabras que no las cumpliese, aunque las diese en un monte y sin testigo alguno;"
        literal: "And it-is-told of-this good girl that never she-gave such words that not them she-should-fulfill, although them she-should-give in a wood and without witness any;"
        ormsby: "And it is said of this good lass that she never made promises of the kind without fulfilling them, even though she made them in a forest and without any witness present,"
        vocab:
          - {w: "contarse de", d: "to be told of, be said about"}
          - {w: "desta", d: "= de esta, of this"}
          - {w: "jamás", d: "never"}
          - {w: "dar palabras", d: "to make promises"}
          - {w: "cumplir", d: "to keep (a promise), fulfill"}
          - {w: "monte", d: "wild wooded country, scrubland (not necessarily a mountain)"}
          - {w: "testigo", d: "witness"}
          - {w: "alguno", d: "after the noun in a negative sentence = 'any at all': 'sin testigo alguno' = without any witness whatever"}
        diagram:
          - s: "cuéntase"
            r: "main verb: it is told"
            under:
              - {s: "desta buena moza", r: "about whom: of this good girl"}
              - s: "que jamás dio semejantes palabras"
                r: "what is told: that she never made such promises"
                under:
                  - s: "que no las cumpliese"
                    r: "describes 'palabras': that she did not keep"
                  - {s: "aunque las diese en un monte y sin testigo alguno", r: "concession: even if she made them in the wilds with no witness"}
        forms:
          - {w: "cuéntase", f: "cuent- + -a + se → contar (to tell), present, it, with impersonal 'se' stuck on the end: 'it is told'. Cervantes hangs pronouns on the end of a clause-opening verb; modern Spanish says 'se cuenta'. The stem o becomes ue when stressed: cuento, cuentas, cuenta, contamos, contáis, cuentan."}
          - {w: "desta", f: "de + esta (of this)."}
          - {w: "dio", f: "dar (to give), preterite, she: 'gave'. Irregular and short: di, diste, dio, dimos, disteis, dieron."}
          - {w: "semejantes", f: "semejante (such) + -s, plural to match 'palabras'."}
          - {w: "las cumpliese", f: "cumpl- + -iese → cumplir (to fulfill), imperfect subjunctive (-se form), she, with 'las' (them, the promises). Subjunctive in a relative clause after a negative ('jamás dio ... que no'). The -se form of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen."}
          - {w: "las diese", f: "d- + -iese → dar (to give), imperfect subjunctive (-se form), she: 'even if she gave them'. dar in the -se form: diese, dieses, diese, diésemos, dieseis, diesen. Subjunctive after 'aunque' for a supposed case."}
        note: "The joke mimics the praise of a knight who keeps his word even unwitnessed; applied to Maritornes' assignations it is mock-heroic, and prepares the 'hidalga' of the next clause."
      - es: "porque presumía muy de hidalga, y no tenía por afrenta estar en aquel ejercicio de servir en la venta, porque decía ella que desgracias y malos sucesos la habían traído a aquel estado."
        literal: "because she-presumed much of noblewoman, and not she-held for affront to-be in that occupation of serving in the inn, because said she that misfortunes and bad happenings her had brought to that state."
        ormsby: "for she plumed herself greatly on being a lady and held it no disgrace to be in such an employment as servant in an inn, because, she said, misfortunes and ill-luck had brought her to that position."
        vocab:
          - {w: "presumir de", d: "to pride oneself on, lay claim to being: 'presumía de hidalga' = she gave herself out as a gentlewoman"}
          - {w: "hidalga", d: "gentlewoman, woman of the minor nobility; Asturians claimed that everyone from their mountains was an hidalgo"}
          - {w: "tener por afrenta", d: "to consider a disgrace"}
          - {w: "ejercicio", d: "occupation, employment"}
          - {w: "desgracia", d: "misfortune (not 'disgrace')"}
          - {w: "suceso", d: "happening, event; 'malos sucesos' = bad luck (not 'success')"}
          - {w: "estado", d: "state, condition, station in life"}
        diagram:
          - s: "presumía muy de hidalga"
            r: "main verb 1 (after 'porque'): she prided herself greatly on being a gentlewoman"
          - s: "y no tenía por afrenta"
            r: "main verb 2: and did not count it a disgrace"
            under:
              - {s: "estar en aquel ejercicio de servir en la venta", r: "what was no disgrace: to be in that line of work, serving in the inn"}
              - s: "porque decía ella"
                r: "why: because she said"
                under:
                  - {s: "que desgracias y malos sucesos la habían traído a aquel estado", r: "what she said: that misfortunes and bad luck had brought her to that state"}
        forms:
          - {w: "presumía", f: "presum- + -ía → presumir (to pride oneself), imperfect, she. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían. 'muy de hidalga': 'muy' strengthens the whole phrase, 'very much the gentlewoman'."}
          - {w: "hidalga", f: "hidalg- + -a → hidalgo, feminine: a gentlewoman."}
          - {w: "tenía", f: "ten- + -ía → tener (to hold), imperfect, she; 'tener por' = to regard as. Same -ía imperfect."}
          - {w: "aquel", f: "'that' (far off), masculine to match 'ejercicio' and, below, 'estado'."}
          - {w: "decía", f: "dec- + -ía → decir (to say), imperfect, she: 'she used to say'. Same -ía imperfect."}
          - {w: "malos", f: "mal- + -os → malo (bad), masculine plural to match 'sucesos'."}
          - {w: "la habían traído", f: "habían (haber, imperfect, they: había, habías, había, habíamos, habíais, habían) + traído, the participle of traer (to bring), with 'la' (her): the pluperfect 'had brought her'."}
        note: "Asturian servants were a stock type: poor mountaineers who claimed hidalgo blood because their region had never been under Moorish rule. Maritornes' claim to be a gentlewoman fallen on hard times parodies the noble ladies in disguise of the romances."
  - sentences:
      - es: "El duro, estrecho, apocado y fementido lecho de don Quijote estaba primero en mitad de aquel estrellado establo, y luego, junto a él, hizo el suyo Sancho, que sólo contenía una estera de enea y una manta, que antes mostraba ser de anjeo tundido que de lana."
        literal: "The hard, narrow, mean and false bed of Don Quijote was first in middle of that starry stable, and then, next to it, made his-own Sancho, which only contained a mat of bulrush and a blanket, which rather showed to-be of canvas shorn than of wool."
        ormsby: "The hard, narrow, wretched, rickety bed of Don Quixote stood first in the middle of this starlit stable, and close beside it Sancho made his, which merely consisted of a rush mat and a blanket that looked as if it was of threadbare canvas rather than of wool."
        ormsby_note: "Estrellado seems to have puzzled most of the translators. Shelton omits it, and Jervas renders it 'illustrious.'"
        vocab:
          - {w: "estrecho", d: "narrow"}
          - {w: "apocado", d: "mean, paltry, shrunken"}
          - {w: "fementido", d: "false, treacherous, perfidious; a word from the romances ('faith-lying'), applied here to a bed that will collapse"}
          - {w: "lecho", d: "bed (literary)"}
          - {w: "en mitad de", d: "in the middle of"}
          - {w: "estrellado", d: "starry, starlit: the roof of the loft let the stars through; also a pun on the 'estrella' (fate) of the ill-starred knight"}
          - {w: "establo", d: "stable"}
          - {w: "el suyo", d: "his own (bed)"}
          - {w: "estera", d: "mat"}
          - {w: "enea", d: "bulrush, cattail, the reed used to weave mats and chair seats"}
          - {w: "antes ... que", d: "rather ... than"}
          - {w: "anjeo", d: "coarse linen canvas, from Anjou in France"}
          - {w: "tundido", d: "shorn, with the nap cropped off; of a blanket, threadbare"}
        diagram:
          - s: "estaba"
            r: "main verb 1: was"
            under:
              - {s: "El duro, estrecho, apocado y fementido lecho de don Quijote", r: "subject: Don Quijote's hard, narrow, mean and treacherous bed"}
              - {s: "primero en mitad de aquel estrellado establo", r: "where: first, in the middle of that starlit stable"}
          - s: "hizo el suyo"
            r: "main verb 2 (after 'y luego'): made his own"
            under:
              - {s: "junto a él", r: "where: next to it"}
              - {s: "Sancho", r: "subject"}
              - s: "que sólo contenía una estera de enea y una manta"
                r: "describes 'el suyo': which held only a rush mat and a blanket"
                under:
                  - {s: "que antes mostraba ser de anjeo tundido que de lana", r: "describes 'manta': which looked more like shorn canvas than wool"}
        forms:
          - {w: "duro, estrecho, apocado y fementido", f: "four adjectives in a row, all masculine to match 'lecho'; apocado and fementido are participles (of apocar, to belittle, and of the old 'fe mentir', to break faith) used as adjectives."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, it. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "aquel estrellado", f: "aquel (that), masculine to match 'establo'; estrellad- + -o, the participle of estrellar used as an adjective, 'starry'."}
          - {w: "hizo", f: "hacer (to make), preterite, he. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "el suyo", f: "'his own': the stressed possessive with the article, masculine to match 'lecho'."}
          - {w: "contenía, mostraba", f: "conten- + -ía → contener (to contain), imperfect, it (the imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían); mostr- + -aba → mostrar (to show), imperfect, it (the -aba imperfect above). 'mostraba ser' = looked as if it were."}
          - {w: "tundido", f: "participle of tundir (to shear cloth), masculine to match 'anjeo'."}
        note: "'Estrellado establo' is a double joke: the loft is 'starry' because the stars show through the broken roof, and 'estrella' is also one's star or fate, so the stable is ill-starred like its guest. Ormsby's note records that earlier translators could not make sense of the word."
      - es: "Sucedía a estos dos lechos el del arriero, fabricado, como se ha dicho, de las enjalmas y todo el adorno de los dos mejores mulos que traía, aunque eran doce, lucios, gordos y famosos, porque era uno de los ricos arrieros de Arévalo, según lo dice el autor desta historia, que deste arriero hace particular mención, porque le conocía muy bien, y aun quieren decir que era algo pariente suyo."
        literal: "Followed [to] these two beds that of-the muleteer, built, as has-been said, of the pack-saddles and all the trappings of the two best mules that he-brought, although they-were twelve, sleek, fat and famous, because he-was one of the rich muleteers of Arévalo, according-as it says the author of-this history, who of-this muleteer makes particular mention, because him he-knew very well, and even they-want to-say that he-was somewhat relative his."
        ormsby: "Next to these two beds was that of the carrier, made up, as has been said, of the packsaddles and all the trappings of the two best mules he had, though there were twelve of them, sleek, plump, and in prime condition, for he was one of the rich carriers of Arevalo, according to the author of this history, who particularly mentions this carrier because he knew him very well, and they even say was in some degree a relation of his;"
        ormsby_note: "The carrier business, Pellicer points out, was extensively followed by the Moriscoes, as it afforded them an excuse for absenting themselves from Mass."
        vocab:
          - {w: "suceder a", d: "to follow, come after (in position); not 'to happen' here"}
          - {w: "fabricado", d: "built, made up"}
          - {w: "como se ha dicho", d: "as has been said"}
          - {w: "adorno", d: "trappings, harness and gear"}
          - {w: "mulo", d: "mule"}
          - {w: "traer", d: "to bring; of animals, to have with one, drive"}
          - {w: "lucio", d: "sleek, glossy-coated"}
          - {w: "famoso", d: "here 'splendid, first-rate', not 'famous'"}
          - {w: "Arévalo", d: "a town in Old Castile, between Ávila and Valladolid, a center of the carrying trade"}
          - {w: "hacer mención de", d: "to mention"}
          - {w: "quieren decir", d: "they say, it is claimed (literally 'they want to say')"}
          - {w: "algo pariente", d: "somewhat of a relative, some sort of relation"}
        diagram:
          - s: "Sucedía"
            r: "main verb: came next"
            under:
              - {s: "a estos dos lechos", r: "after what: after these two beds"}
              - s: "el del arriero"
                r: "subject: the muleteer's (bed)"
                under:
                  - s: "fabricado, como se ha dicho, de las enjalmas y todo el adorno de los dos mejores mulos"
                    r: "describes the bed: made, as was said, of the packsaddles and gear of his two best mules"
                    under:
                      - {s: "que traía", r: "describes 'mulos': that he had with him"}
                      - s: "aunque eran doce, lucios, gordos y famosos"
                        r: "concession: though there were twelve, sleek, fat and fine"
                        under:
                          - s: "porque era uno de los ricos arrieros de Arévalo"
                            r: "why: for he was one of the rich muleteers of Arévalo"
                            under:
                              - s: "según lo dice el autor desta historia"
                                r: "on whose word: as the author of this history says"
                                under:
                                  - s: "que deste arriero hace particular mención"
                                    r: "describes 'autor': who makes special mention of this muleteer"
                                    under:
                                      - {s: "porque le conocía muy bien", r: "why: because he knew him well"}
                                      - {s: "y aun quieren decir que era algo pariente suyo", r: "and they even say he was some relation of his"}
        forms:
          - {w: "Sucedía", f: "suced- + -ía → suceder (to follow), imperfect, it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "estos", f: "'these', masculine plural to match 'lechos'."}
          - {w: "el del", f: "el (the one) + de + el (of the): 'that of the muleteer'."}
          - {w: "fabricado", f: "participle of fabricar (to build), masculine to match 'el (lecho)'."}
          - {w: "se ha dicho", f: "ha = haber, present, it (he, has, ha, hemos, habéis, han), + dicho, the irregular participle of decir (to say), with impersonal 'se': 'has been said'."}
          - {w: "mejores", f: "mejor (better, best) + -es, plural to match 'mulos'."}
          - {w: "traía", f: "tra- + -ía → traer (to bring), imperfect, he. Same -ía imperfect."}
          - {w: "eran, era", f: "ser (to be), imperfect, they / he. ser's imperfect is irregular: era, eras, era, éramos, erais, eran."}
          - {w: "lucios, gordos y famosos", f: "masculine plural adjectives to match 'mulos' (or 'doce')."}
          - {w: "desta, deste", f: "de + esta (of this), de + este (of this): Cervantes fuses 'de' with the demonstratives."}
          - {w: "hace", f: "hac- + -e → hacer (to make), present, he. hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "le conocía", f: "conoc- + -ía → conocer (to know a person), imperfect, he, with 'le' (him). Same -ía imperfect."}
