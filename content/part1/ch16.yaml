      - es: "y, teniendo toda esta quimera, que él se había fabricado, por firme y valedera, se comenzó a acuitar y a pensar en el peligroso trance en que su honestidad se había de ver, y propuso en su corazón de no cometer alevosía a su señora Dulcinea del Toboso, aunque la mesma reina Ginebra con su dama Quintañona se le pusiesen delante."
        literal: "and, holding all this chimera, which he himself had built, for firm and valid, he-began to fret and to think on the perilous pass in which his chastity itself would-have to see, and resolved in his heart of not committing treachery to his lady Dulcinea of-the Toboso, though the very queen Guinevere with her lady Quintañona themselves to-him should-put in-front."
        ormsby: "and holding all this fantasy that he had constructed as solid fact, he began to feel uneasy and to consider the perilous risk which his virtue was about to encounter, and he resolved in his heart to commit no treason to his lady Dulcinea del Toboso, even though the queen Guinevere herself and the dame Quintañona should present themselves before him."
        vocab:
