      - es: "Y fue que él se imaginó haber llegado a un famoso castillo —que, como se ha dicho, castillos eran a su parecer todas las ventas donde alojaba—, y que la hija del ventero lo era del señor del castillo, la cual, vencida de su gentileza, se había enamorado dél y prometido que aquella noche, a furto de sus padres, vendría a yacer con él una buena pieza;"
        literal: "And it-was that he imagined-himself to-have arrived at a famous castle —for, as has-been said, castles were to his seeming all the inns where he-lodged—, and that the daughter of-the innkeeper it was of-the lord of-the castle, who, overcome by his gentility, had fallen-in-love with-him and promised that that night, by stealth from her parents, she-would-come to lie with him a good while;"
        ormsby: "which was that he fancied himself to have reached a famous castle (for, as has been said, all the inns he lodged in were castles to his eyes), and that the daughter of the innkeeper was daughter of the lord of the castle, and that she, won by his highbred bearing, had fallen in love with him, and had promised to come to his bed for a while that night without the knowledge of her parents;"
