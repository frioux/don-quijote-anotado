  - sentences:
      - es: "— Haga vuestra merced, señora, de manera que queden algunas estopas, que no faltará quien las haya menester; que también me duelen a mí un poco los lomos."
        literal: "— Make your worship, lady, in manner that may-remain some tow-wads, for not will-be-lacking [someone] who them may-have need-of; for also to-me hurt to me a little the loins."
        ormsby: "“Pray, señora,” he added, “manage to save some tow, as there will be no want of someone to use it, for my loins too are rather sore.”"
        vocab:
          - {w: "vuestra merced", d: "your worship, your grace: the polite 'you' of the time (it became 'usted'); Sancho uses it to everyone above him, even an innkeeper's wife"}
          - {w: "hacer de manera que", d: "to see to it that, manage that"}
          - {w: "quedar", d: "to be left over, remain"}
          - {w: "estopa", d: "tow, coarse flax fiber used to make the plasters"}
          - {w: "no faltará quien", d: "there will be no lack of someone who, someone is sure to"}
          - {w: "haber menester", d: "to need (old expression, = necesitar)"}
          - {w: "lomos", d: "loins, lower back"}
        diagram:
          - s: "Haga"
            r: "main verb: make, see to it (a polite command)"
            under:
              - {s: "vuestra merced", r: "subject: your worship"}
              - {s: "señora", r: "address: lady"}
              - s: "de manera que queden algunas estopas"
                r: "what to see to: that some tow is left over"
                under:
                  - {s: "que no faltará quien las haya menester", r: "why: for someone will be needing it"}
          - s: "que también me duelen a mí un poco los lomos"
            r: "main verb 2: for my loins hurt a little too"
        forms:
          - {w: "Haga", f: "hag- + -a → hacer (to make, do), present subjunctive used as a polite command, you (vuestra merced, which takes the he/she form): 'see to it'. hacer in the present subjunctive: haga, hagas, haga, hagamos, hagáis, hagan."}
          - {w: "vuestra", f: "'your', feminine to match 'merced'. Though 'vuestra merced' is one person, the verb that goes with it is the he/she form ('haga')."}
          - {w: "queden", f: "qued- + -en → quedar (to remain), present subjunctive, they (the 'estopas'). Subjunctive after 'de manera que' when it names a purpose. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "faltará", f: "faltar (to be lacking) + -á → future, it: 'there will not be lacking'. The future adds -é, -ás, -á, -emos, -éis, -án to the infinitive."}
          - {w: "las haya menester", f: "hay- + -a → haber, present subjunctive, he/she (haya, hayas, haya, hayamos, hayáis, hayan), + menester: 'haber menester' = to need; 'las' = them (the estopas). Subjunctive because 'quien' is an unknown someone."}
          - {w: "me duelen a mí", f: "duel- + -en → doler (to hurt), present, they (the 'lomos'): 'they hurt me'. The stem o becomes ue when stressed: duelo, dueles, duele, dolemos, doléis, duelen. 'me' is repeated as 'a mí' for emphasis: 'me too'."}
        note: "Sancho asks for the leftover tow because, though he 'did not fall', his back hurts too; the women catch the contradiction at once."
