      - es: "el gato al rato, el rato a la cuerda, la cuerda al palo, daba el arriero a Sancho, Sancho a la moza, la moza a él, el ventero a la moza, y todos menudeaban con tanta priesa que no se daban punto de reposo;"
        literal: "the cat to-the rat, the rat to the rope, the rope to-the stick, gave the muleteer to Sancho, Sancho to the girl, the girl to him, the innkeeper to the girl, and all rained-blows with such haste that not themselves they-gave point of rest;"
