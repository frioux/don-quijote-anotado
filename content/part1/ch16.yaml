        forms:
          - {w: "maravillosa", f: "maravillos- + -a → maravilloso (marvelous), feminine to match 'quietud'."}
          - {w: "traía", f: "tra- + -ía → traer (to carry), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "se cuentan", f: "cuent- + -an → contar (to tell), present, they, with passive 'se': 'are told'. The stem o becomes ue when stressed: cuento, cuentas, cuenta, contamos, contáis, cuentan."}
          - {w: "le trujo", f: "truj- + -o → traer (to bring), preterite, it, with 'le' (to him). The old preterite trujo for trajo: truje, trujiste, trujo, trujimos, trujisteis, trujeron. Singular though it has two subjects, treated as one cause."}
