  - sentences:
      - es: "Esta maravillosa quietud, y los pensamientos que siempre nuestro caballero traía de los sucesos que a cada paso se cuentan en los libros autores de su desgracia, le trujo a la imaginación una de las estrañas locuras que buenamente imaginarse pueden."
        literal: "This marvelous quiet, and the thoughts that always our knight carried of the events that at each step are-told in the books authors of his misfortune, to-him brought to the imagination one of the strange madnesses that well-enough to-imagine-themselves can."
        ormsby: "This strange stillness, and the thoughts, always present to our knight’s mind, of the incidents described at every turn in the books that were the cause of his misfortune, conjured up to his imagination as extraordinary a delusion as can well be conceived,"
        vocab:
          - {w: "quietud", d: "stillness, quiet"}
          - {w: "suceso", d: "event, incident (not 'success')"}
          - {w: "a cada paso", d: "at every step, constantly"}
          - {w: "autores de su desgracia", d: "authors (causes) of his misfortune: the books are blamed as if they were persons"}
          - {w: "trujo", d: "= trajo, brought (old preterite of traer)"}
          - {w: "estraño", d: "= extraño, strange"}
          - {w: "locura", d: "madness, mad fancy"}
          - {w: "buenamente", d: "easily, well, reasonably"}
        diagram:
          - s: "le trujo a la imaginación"
            r: "main verb: brought to his imagination"
            under:
              - {s: "Esta maravillosa quietud", r: "subject 1: this wonderful stillness"}
              - s: "y los pensamientos"
                r: "subject 2: and the thoughts"
                under:
                  - s: "que siempre nuestro caballero traía de los sucesos"
                    r: "describes 'pensamientos': that our knight always had about the events"
                    under:
                      - {s: "que a cada paso se cuentan en los libros autores de su desgracia", r: "describes 'sucesos': told at every turn in the books that caused his ruin"}
              - s: "una de las estrañas locuras"
