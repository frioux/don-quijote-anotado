  - sentences:
      - es: "— Creedme, fermosa señora, que os podéis llamar venturosa por haber alojado en este vuestro castillo a mi persona, que es tal, que si yo no la alabo, es por lo que suele decirse que la alabanza propria envilece; pero mi escudero os dirá quién soy."
        literal: "— Believe-me, beautiful lady, that yourselves you-can call fortunate for having lodged in this your castle [to] my person, which is such, that if I not it praise, it-is for that which is-wont to-be-said that the praise own debases; but my squire to-you will-tell who I-am."
        ormsby: "“Believe me, fair lady, you may call yourself fortunate in having in this castle of yours sheltered my person, which is such that if I do not myself praise it, it is because of what is commonly said, that self-praise debaseth; but my squire will inform you who I am."
        vocab:
          - {w: "creedme", d: "believe me (a command to 'vos')"}
          - {w: "fermosa", d: "= hermosa, beautiful; Don Quijote keeps the old f- of the romances (fermosura, fecho, ferido)"}
          - {w: "os", d: "you, to you (the object pronoun of 'vos'); Don Quijote addresses the hostess with the courtly 'vos'"}
          - {w: "venturoso", d: "fortunate, lucky"}
          - {w: "alojar", d: "to lodge, give shelter to"}
          - {w: "persona", d: "person; 'mi persona' = myself, in the grand style"}
          - {w: "alabar", d: "to praise"}
          - {w: "alabanza", d: "praise"}
          - {w: "proprio", d: "= propio, own; 'la alabanza propria' = self-praise"}
          - {w: "envilecer", d: "to debase, demean"}
          - {w: "escudero", d: "squire"}
        diagram:
          - s: "Creedme"
            r: "main verb 1: believe me"
            under:
              - {s: "fermosa señora", r: "address: fair lady"}
              - s: "que os podéis llamar venturosa"
                r: "what to believe: that you may call yourself fortunate"
                under:
                  - s: "por haber alojado en este vuestro castillo a mi persona"
                    r: "why: for having lodged my person in this castle of yours"
                    under:
                      - s: "que es tal"
                        r: "describes 'persona': which is such"
                        under:
                          - s: "que si yo no la alabo, es por lo que suele decirse"
                            r: "result: that if I do not praise it, it is because of the saying"
                            under:
                              - {s: "que la alabanza propria envilece", r: "the saying: that self-praise debases"}
          - s: "pero mi escudero os dirá"
            r: "main verb 2: but my squire will tell you"
            under:
              - {s: "quién soy", r: "what he will tell: who I am"}
        forms:
          - {w: "Creedme", f: "cre- + -ed → creer (to believe), command, you (vos), + me (me) stuck on the end. The vosotros command of -er verbs ends in -ed."}
          - {w: "fermosa", f: "= hermosa, feminine to match 'señora'. Old Spanish kept Latin f- where modern Spanish has a silent h-; Don Quijote uses it on purpose to sound like his books."}
          - {w: "os podéis llamar", f: "pod- + -éis → poder (to be able), present, you (vos), + the infinitive llamar (to call) with 'os' (yourself): 'you can call yourself'. puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "venturosa", f: "venturos- + -a → venturoso (fortunate), feminine to match 'señora'."}
          - {w: "haber alojado", f: "haber + alojado, the participle of alojar (to lodge): the perfect infinitive 'to have lodged', after 'por'."}
          - {w: "este vuestro castillo", f: "'this castle of yours': old Spanish could put a demonstrative and a possessive side by side; modern Spanish says 'este castillo vuestro'."}
          - {w: "a mi persona", f: "the 'a' that marks a person as the object: 'mi persona' is Don Quijote himself."}
          - {w: "es tal, que", f: "ser (to be), present, it (soy, eres, es, somos, sois, son); 'tal ... que' = such that."}
          - {w: "la alabo", f: "alab- + -o → alabar (to praise), present, I, with 'la' (it, 'mi persona'). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "suele decirse", f: "suel- + -e → soler (to be wont to), present, it (suelo, sueles, suele, solemos, soléis, suelen), + decirse, the infinitive with impersonal 'se': 'is usually said'."}
          - {w: "propria", f: "= propia (own), feminine to match 'alabanza'; the old spelling keeps the Latin r."}
          - {w: "envilece", f: "envilec- + -e → envilecer (to debase), present, it. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "os dirá", f: "dir- + -á → decir (to tell), future, he, with 'os' (to you). decir's future stem is irregular: diré, dirás, dirá, diremos, diréis, dirán."}
          - {w: "soy", f: "ser (to be), present, I. soy, eres, es, somos, sois, son."}
        note: "'La alabanza propia envilece' is a proverb; Ormsby lists it as number 6 in his collection of the book's proverbs. Don Quijote's speech is in the high style of the romances: 'fermosa', 'proprio', 'vos' with its verb forms, and 'mi persona' for 'me'."
      - es: "Sólo os digo que tendré eternamente escrito en mi memoria el servicio que me habedes fecho, para agradecéroslo mientras la vida me durare;"
        literal: "Only to-you I-say that I-will-have eternally written in my memory the service that to-me you-have done, in-order-to thank-you-for-it while the life to-me may-last;"
        ormsby: "I only tell you that I shall preserve forever inscribed on my memory the service you have rendered me in order to tender you my gratitude while life shall last me;"
        vocab:
          - {w: "tener escrito", d: "to keep written, have inscribed"}
          - {w: "eternamente", d: "forever"}
          - {w: "servicio", d: "service, kindness"}
          - {w: "habedes fecho", d: "= habéis hecho, you have done; two archaisms from the romances, 'habedes' for 'habéis' and 'fecho' for 'hecho'"}
          - {w: "agradecer", d: "to thank for, be grateful for"}
          - {w: "durar", d: "to last"}
        diagram:
          - s: "os digo"
            r: "main verb: I tell you"
            under:
              - {s: "Sólo", r: "only"}
              - s: "que tendré eternamente escrito en mi memoria el servicio"
                r: "what I tell: that I will keep the service written forever in my memory"
                under:
                  - {s: "que me habedes fecho", r: "describes 'servicio': that you have done me"}
                  - s: "para agradecéroslo"
                    r: "why: in order to thank you for it"
