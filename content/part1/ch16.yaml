  - sentences:
      - es: "En esto, despertó Sancho, y, sintiendo aquel bulto casi encima de sí, pensó que tenía la pesadilla, y comenzó a dar puñadas a una y otra parte, y entre otras alcanzó con no sé cuántas a Maritornes, la cual, sentida del dolor, echando a rodar la honestidad, dio el retorno a Sancho con tantas que, a su despecho, le quitó el sueño;"
        literal: "At this, awoke Sancho, and, feeling that bulk almost on-top of himself, he-thought that he-had the nightmare, and began to give punches to one and other side, and among others he-reached with not I-know how-many [to] Maritornes, who, stung by-the pain, throwing to roll the modesty, gave the return to Sancho with so-many that, to his spite, him she-took-away the sleep;"
        ormsby: "At this Sancho awoke, and feeling this mass almost on top of him fancied he had the nightmare and began to distribute fisticuffs all round, of which a certain share fell upon Maritornes, who, irritated by the pain and flinging modesty aside, paid back so many in return to Sancho that she woke him up in spite of himself."
        vocab:
          - {w: "en esto", d: "at this, at that moment"}
          - {w: "bulto", d: "bulk, shape, lump (something felt in the dark)"}
          - {w: "pesadilla", d: "nightmare; thought of as a weight sitting on the sleeper's chest"}
