        diagram:
          - s: "pluguiera"
            r: "main verb (after 'y'): would that it pleased"
            under:
              - {s: "a los altos cielos", r: "whom: the high heavens"}
              - s: "que el amor no me tuviera tan rendido y tan sujeto"
                r: "what might please them: that love did not hold me so vanquished and subject"
                under:
                  - {s: "a sus leyes", r: "subject to what, 1: to its laws"}
                  - s: "y los ojos de aquella hermosa ingrata"
                    r: "subject to what, 2: and to the eyes of that fair ingrate"
                    under:
                      - {s: "que digo entre mis dientes", r: "describes 'ingrata': whom I name under my breath"}
        forms:
          - {w: "pluguiera", f: "plugu- + -iera → placer (to please), imperfect subjunctive (-ra form), it: 'would that it pleased'. Built on the old preterite 'plugo' (it pleased): pluguiera, pluguieras, pluguiera, pluguiéramos, pluguierais, pluguieran. The -ra form alone expresses a wish, as in modern 'quisiera'."}
          - {w: "altos", f: "alt- + -os → alto (high), masculine plural to match 'cielos', placed before the noun for solemnity."}
          - {w: "me tuviera", f: "tuv- + -iera → tener (to hold), imperfect subjunctive (-ra form), it (love), with 'me' (me). Built on the preterite tuvieron: tuviera, tuvieras, tuviera, tuviéramos, tuvierais, tuvieran. Subjunctive because it is the content of the wish."}
          - {w: "rendido, sujeto", f: "rendido, the participle of rendir (to surrender), and sujeto (subject), both masculine to match Don Quijote."}
          - {w: "sus", f: "plural to match 'leyes': 'its (love's) laws'."}
          - {w: "aquella", f: "'that' (far off), feminine to match 'ingrata'."}
          - {w: "hermosa ingrata", f: "hermos- + -a and ingrat- + -a, feminine: the adjective 'ingrata' is used as a noun, 'ungrateful woman'."}
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. digo, dices, dice, decimos, decís, dicen."}
          - {w: "mis", f: "'my', plural to match 'dientes'."}
        note: "The 'fair ingrate' is Dulcinea, whom he will not name aloud, a convention of courtly love. Note that Cervantes himself writes 'hermosa' here while putting 'fermosa' into Don Quijote's mouth a line earlier and a line later."
