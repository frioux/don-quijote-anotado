          - {w: "y fue que", d: "and it was that, namely"}
          - {w: "a su parecer", d: "in his opinion, to his mind"}
          - {w: "alojar", d: "to lodge, stay"}
          - {w: "vencido de", d: "overcome by, conquered by"}
          - {w: "gentileza", d: "gallantry, fine bearing, grace"}
