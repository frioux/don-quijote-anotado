  - sentences:
      - es: "— Bien podrá ser eso —dijo la doncella—; que a mí me ha acontecido muchas veces soñar que caía de una torre abajo y que nunca acababa de llegar al suelo, y, cuando despertaba del sueño, hallarme tan molida y quebrantada como si verdaderamente hubiera caído."
        literal: "— Well may-be that —said the maiden—; for to me to-me has happened many times to-dream that I-fell from a tower downward and that never I-finished of arriving at-the ground, and, when I-awoke from-the dream, to-find-myself so ground and broken as if truly I-had fallen."
        ormsby: "“That may well be,” said the young girl, “for it has many a time happened to me to dream that I was falling down from a tower and never coming to the ground, and when I awoke from the dream to find myself as weak and shaken as if I had really fallen.”"
        vocab:
          - {w: "bien podrá ser", d: "that may well be"}
          - {w: "acontecer", d: "to happen, befall; 'me ha acontecido' = it has happened to me"}
          - {w: "soñar", d: "to dream"}
          - {w: "no acabar de", d: "never quite to, not get to the end of: 'nunca acababa de llegar' = never quite reached"}
          - {w: "despertar", d: "to wake up"}
          - {w: "molido", d: "ground (as in a mill), worn out, aching all over"}
          - {w: "quebrantado", d: "broken, shattered, bruised"}
          - {w: "como si", d: "as if (always with the imperfect or pluperfect subjunctive)"}
        diagram:
          - s: "Bien podrá ser eso"
            r: "main verb 1: that may well be"
          - s: "dijo"
            r: "main verb 2 (the speech tag): said"
            under:
              - {s: "la doncella", r: "subject: the daughter"}
          - s: "a mí me ha acontecido muchas veces"
            r: "main verb 3 (after 'que', for): it has often happened to me"
            under:
              - s: "soñar"
                r: "what happened: to dream"
                under:
                  - {s: "que caía de una torre abajo", r: "the dream, 1: that I was falling from a tower"}
                  - {s: "y que nunca acababa de llegar al suelo", r: "the dream, 2: and never reached the ground"}
              - s: "hallarme tan molida y quebrantada"
                r: "what happened, 2: to find myself so battered and bruised"
                under:
                  - {s: "cuando despertaba del sueño", r: "when: when I woke from the dream"}
                  - {s: "como si verdaderamente hubiera caído", r: "comparison: as if I had really fallen"}
        forms:
          - {w: "podrá ser", f: "podr- + -á → poder (to be able), future, it: 'it will be able to be', i.e. may well be. poder's future stem drops the e: podré, podrás, podrá, podremos, podréis, podrán. The future here expresses a guess."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, she. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "me ha acontecido", f: "ha = haber, present, it (he, has, ha, hemos, habéis, han), + acontecido, the participle of acontecer (to happen): 'has happened to me'. 'a mí' doubles 'me'."}
          - {w: "caía", f: "ca- + -ía → caer (to fall), imperfect, I: 'I was falling'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "acababa", f: "acab- + -aba → acabar (to finish), imperfect, I; 'nunca acababa de llegar' = I never quite got to. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "despertaba", f: "despert- + -aba → despertar (to wake), imperfect, I. Same -aba imperfect; the imperfect for what happened every time."}
          - {w: "hallarme", f: "hallar (to find) + me (myself), the pronoun hung on the infinitive; a second infinitive depending on 'me ha acontecido'."}
          - {w: "molida y quebrantada", f: "participles of moler (to grind) and quebrantar (to break), feminine to match the girl speaking."}
          - {w: "hubiera caído", f: "hub- + -iera → haber, imperfect subjunctive (-ra form), I, + caído, the participle of caer (to fall): the pluperfect subjunctive 'had fallen', required after 'como si'. haber in the -ra form: hubiera, hubieras, hubiera, hubiéramos, hubierais, hubieran."}
        note: "The daughter's falling dream is offered in good faith; it gives Sancho his opening for the next line."
