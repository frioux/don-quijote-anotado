  - sentences:
      - es: "— Aún es temprano —respondió Sancho—, porque no ha sino un mes que andamos buscando las aventuras, y hasta ahora no hemos topado con ninguna que lo sea."
        literal: "— Still it-is early —answered Sancho—, because not it-makes but a month that we-go seeking the adventures, and until now not we-have run-into any that it may-be."
        ormsby: "“It is too soon yet,” answered Sancho, “for we have only been a month going in quest of adventures, and so far we have met with nothing that can be called one,"
        vocab:
          - {w: "aún es temprano", d: "it is still early, too soon yet"}
          - {w: "no ha sino", d: "it is only (of time): 'no ha sino un mes que' = it is only a month since; 'ha' is the old 'hace'"}
          - {w: "andar + gerund", d: "to go about doing: 'andamos buscando' = we go about looking for"}
          - {w: "topar con", d: "to run into, come across"}
          - {w: "que lo sea", d: "that is one (a real adventure)"}
        diagram:
          - s: "Aún es temprano"
            r: "main verb 1: it is still early"
            under:
              - s: "porque no ha sino un mes"
                r: "why: because it is only a month"
                under:
                  - {s: "que andamos buscando las aventuras", r: "a month of what: that we have been looking for adventures"}
          - s: "respondió"
            r: "main verb 2 (the speech tag): answered"
            under:
              - {s: "Sancho", r: "subject"}
          - s: "y hasta ahora no hemos topado con ninguna"
            r: "main verb 3: and so far we have not run into any"
            under:
              - {s: "que lo sea", r: "describes 'ninguna': that is a real one"}
        forms:
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "ha", f: "haber, present, it: the old impersonal 'ha' for modern 'hace' in time expressions: 'no ha sino un mes' = it is only a month."}
          - {w: "andamos buscando", f: "and- + -amos → andar (to go about), present, we, + buscando, the gerund of buscar (to look for): 'we go about looking for'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "hemos topado", f: "hemos = haber, present, we (he, has, ha, hemos, habéis, han), + topado, the participle of topar (to run into): 'we have run into'."}
          - {w: "ninguna", f: "ningun- + -a → ninguno (none), feminine to match 'aventura'."}
          - {w: "lo sea", f: "ser (to be), present subjunctive, it, with 'lo' standing for 'aventura': 'that is one'. Subjunctive because the adventure is one that may not exist. sea, seas, sea, seamos, seáis, sean."}
        note: "A month: in fact, counting the two sallies, Don Quijote has been on the road for about three weeks of narrated time. Sancho has been with him for only a few days, but he speaks as a veteran."
