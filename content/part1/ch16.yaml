part: 1
chapter: 16
title_es: "Capítulo XVI. De lo que le sucedió al ingenioso hidalgo en la venta que él imaginaba ser castillo"
title_en: "Of what happened to the ingenious gentleman in the inn which he took to be a castle"
paragraphs:
  - sentences:
      - es: "El ventero, que vio a don Quijote atravesado en el asno, preguntó a Sancho qué mal traía."
        literal: "The innkeeper, who saw [to] Don Quijote laid-crosswise on the donkey, asked [to] Sancho what ailment he-carried."
        ormsby: "The innkeeper, seeing Don Quixote slung across the ass, asked Sancho what was amiss with him."
        vocab:
          - {w: "ventero", d: "innkeeper, keeper of a 'venta', a roadside inn"}
          - {w: "atravesado", d: "laid crosswise, slung across (like a sack)"}
          - {w: "asno", d: "donkey, ass"}
          - {w: "qué mal traía", d: "what was wrong with him; 'mal' = ailment, hurt, and 'traer' (to carry) is used of having an illness or injury"}
        diagram:
          - s: "preguntó"
            r: "main verb: asked"
            under:
              - s: "El ventero"
                r: "subject: the innkeeper"
                under:
                  - {s: "que vio a don Quijote atravesado en el asno", r: "describes 'ventero': who saw Don Quijote slung across the donkey"}
              - {s: "a Sancho", r: "whom he asked"}
              - {s: "qué mal traía", r: "what he asked: what was wrong with him"}
        forms:
          - {w: "vio", f: "ver (to see), preterite, he: 'saw'. ver's preterite is short and irregular: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "a don Quijote", f: "the 'a' that marks a person as the object of the verb ('vio a don Quijote'); English has no equivalent, so the gloss brackets it."}
          - {w: "atravesado", f: "participle of atravesar (to lay across), masculine to match 'don Quijote': 'laid crosswise'."}
          - {w: "preguntó", f: "pregunt- + -ó → preguntar (to ask), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "traía", f: "tra- + -ía → traer (to carry, here: to have an ailment), imperfect, he: 'was carrying'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
        note: "The chapter opens where the last one ended: Sancho has slung his beaten master across the donkey and led him to an inn, which Don Quijote, as always, takes for a castle."
      - es: "Sancho le respondió que no era nada, sino que había dado una caída de una peña abajo, y que venía algo brumadas las costillas."
        literal: "Sancho to-him answered that not it-was anything, but that he-had given a fall from a rock downward, and that he-came somewhat bruised [in] the ribs."
        ormsby: "Sancho answered that it was nothing, only that he had fallen down from a rock and had his ribs a little bruised."
        vocab:
          - {w: "sino que", d: "but rather, only that (after a negative: 'no era nada, sino que ...')"}
          - {w: "dar una caída", d: "to take a fall"}
          - {w: "peña", d: "crag, large rock"}
          - {w: "de una peña abajo", d: "down from a rock; 'abajo' after the noun gives the direction, 'downward'"}
          - {w: "brumado", d: "bruised, battered; old form of 'abrumado' (crushed, weighed down)"}
          - {w: "costilla", d: "rib"}
          - {w: "venir + adjective", d: "to be, arrive in a state: 'venía brumadas las costillas' = he came with his ribs bruised"}
        diagram:
          - s: "respondió"
            r: "main verb: answered"
            under:
              - {s: "Sancho", r: "subject"}
              - {s: "le", r: "to whom: to him (the innkeeper)"}
              - {s: "que no era nada", r: "what he answered, 1: that it was nothing"}
              - {s: "sino que había dado una caída de una peña abajo", r: "what he answered, 2: but that he had fallen down from a rock"}
              - {s: "y que venía algo brumadas las costillas", r: "what he answered, 3: and that his ribs were somewhat bruised"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "era", f: "ser (to be), imperfect, it. ser's imperfect is irregular: era, eras, era, éramos, erais, eran."}
          - {w: "había dado", f: "había (haber, imperfect, he: había, habías, había, habíamos, habíais, habían) + dado, the participle of dar (to give): the pluperfect 'had given', i.e. had taken (a fall)."}
          - {w: "venía", f: "ven- + -ía → venir (to come), imperfect, he: 'was coming, came'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "brumadas", f: "brum- + -adas → participle of brumar (to bruise, batter), feminine plural to match 'las costillas', not Sancho: he came with 'the ribs bruised'."}
        note: "Sancho's lie covers the beating by the Yanguesan carriers in the previous chapter. The 'fall from a rock' will be picked apart by the women in the next exchange."
      - es: "Tenía el ventero por mujer a una, no de la condición que suelen tener las de semejante trato, porque naturalmente era caritativa y se dolía de las calamidades de sus prójimos;"
        literal: "Had the innkeeper for wife [to] one, not of the disposition that are-wont to-have those of similar trade, because by-nature she-was charitable and grieved-herself over the calamities of her neighbors;"
        ormsby: "The innkeeper had a wife whose disposition was not such as those of her calling commonly have, for she was by nature kindhearted and felt for the sufferings of her neighbours,"
        vocab:
          - {w: "tener por mujer", d: "to have as a wife, be married to"}
          - {w: "condición", d: "disposition, temperament, nature (a false friend: not 'condition')"}
          - {w: "soler", d: "to be in the habit of, usually do; 'suelen tener' = usually have"}
          - {w: "trato", d: "trade, line of business; 'las de semejante trato' = women of that calling (innkeepers' wives, proverbially hard and dishonest)"}
          - {w: "naturalmente", d: "by nature (not 'naturally' in the sense of 'of course')"}
          - {w: "caritativo", d: "charitable, kind-hearted"}
          - {w: "dolerse de", d: "to grieve over, feel for, be sorry about"}
          - {w: "calamidad", d: "calamity, misfortune"}
          - {w: "prójimo", d: "fellow man, neighbor in the biblical sense ('love thy neighbor')"}
        diagram:
          - s: "Tenía"
            r: "main verb: had"
            under:
              - {s: "el ventero", r: "subject: the innkeeper"}
              - {s: "por mujer", r: "as what: as his wife"}
              - s: "a una"
                r: "object: a woman"
                under:
                  - s: "no de la condición"
                    r: "describes 'una': not of the disposition"
                    under:
                      - {s: "que suelen tener las de semejante trato", r: "describes 'condición': that women of that trade usually have"}
              - {s: "porque naturalmente era caritativa", r: "why: because she was kind by nature"}
              - {s: "y se dolía de las calamidades de sus prójimos", r: "why, 2: and felt for her neighbors' misfortunes"}
        forms:
          - {w: "Tenía", f: "ten- + -ía → tener (to have), imperfect, he: 'had'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían. Verb first, subject after: a common narrative order in Cervantes."}
          - {w: "a una", f: "the 'a' that marks a person as the object ('tenía a una'); 'una' stands alone for 'una mujer'."}
          - {w: "suelen", f: "suel- + -en → soler (to be wont to), present, they. The stem o becomes ue when stressed: suelo, sueles, suele, solemos, soléis, suelen."}
          - {w: "las", f: "'those (women)': the feminine plural article used as a pronoun before 'de'."}
          - {w: "era", f: "ser (to be), imperfect, she. era, eras, era, éramos, erais, eran."}
          - {w: "caritativa", f: "caritativ- + -a → caritativo (charitable), feminine to match the wife."}
          - {w: "se dolía", f: "dol- + -ía → dolerse (to grieve over), imperfect, she, with 'se' (herself). Same -ía imperfect."}
          - {w: "sus", f: "plural to match 'prójimos', not the owner: 'her neighbors'."}
        note: "Innkeepers and their wives were stock villains in Spanish fiction, thieves who watered the wine; the narrator makes a point of this one being an exception."
      - es: "y así, acudió luego a curar a don Quijote y hizo que una hija suya, doncella, muchacha y de muy buen parecer, la ayudase a curar a su huésped."
        literal: "and so, she-hastened at-once to treat [to] Don Quijote and made that a daughter of-hers, a-maiden, a-girl and of very good appearance, her should-help to treat [to] her guest."
        ormsby: "so she at once set about tending Don Quixote, and made her young daughter, a very comely girl, help her in taking care of her guest."
        vocab:
          - {w: "acudir a", d: "to hasten to, go to the help of"}
          - {w: "luego", d: "at once, immediately (the old meaning; not 'later')"}
          - {w: "curar", d: "to treat, dress (a wound), tend (a patient); not 'to cure'"}
          - {w: "hacer que", d: "to make someone do something: 'hizo que ... la ayudase' = made her help her"}
          - {w: "doncella", d: "maiden, unmarried girl; the word for the heroines of the romances"}
          - {w: "muchacha", d: "young girl"}
          - {w: "de buen parecer", d: "good-looking; 'parecer' as a noun = looks, appearance"}
          - {w: "huésped", d: "guest (in old Spanish also 'host')"}
        diagram:
          - s: "acudió"
            r: "main verb 1: she hastened"
            under:
              - {s: "luego", r: "when: at once"}
              - {s: "a curar a don Quijote", r: "to do what: to tend Don Quijote"}
          - s: "y hizo"
            r: "main verb 2: and made"
            under:
              - s: "que una hija suya, doncella, muchacha y de muy buen parecer, la ayudase"
                r: "what she made happen: that a daughter of hers help her"
                under:
                  - {s: "doncella, muchacha y de muy buen parecer", r: "describes 'hija': a maiden, young and good-looking"}
                  - {s: "a curar a su huésped", r: "help with what: with tending her guest"}
        forms:
          - {w: "acudió", f: "acud- + -ió → acudir (to hasten), preterite, she. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "y hizo", f: "hizo = hacer (to make), preterite, she. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron. Modern Spanish writes 'e hizo' (y becomes e before an i- sound); Cervantes keeps 'y'."}
          - {w: "suya", f: "'of hers', the stressed possessive placed after the noun and feminine to match 'hija'; 'una hija suya' = a daughter of hers."}
          - {w: "buen", f: "bueno (good) clipped before a masculine singular noun ('parecer'), like un, algún, ningún, gran."}
          - {w: "la ayudase", f: "ayud- + -ase → ayudar (to help), imperfect subjunctive (-se form), she, with 'la' (her, the mother). Subjunctive because it is what the mother made happen ('hizo que'). The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "su", f: "'her' (the mother's); one form for his, her, its, their."}
      - es: "Servía en la venta, asimesmo, una moza asturiana, ancha de cara, llana de cogote, de nariz roma, del un ojo tuerta y del otro no muy sana."
        literal: "Served in the inn, likewise, a girl Asturian, broad of face, flat of nape, of nose snub, of-the one eye one-eyed and of-the other not very sound."
        ormsby: "There was besides in the inn, as servant, an Asturian lass with a broad face, flat poll, and snub nose, blind of one eye and not very sound in the other."
        vocab:
          - {w: "servir", d: "to be in service, work as a servant"}
          - {w: "venta", d: "roadside inn for travelers and muleteers, rougher than a town 'posada'"}
          - {w: "asimesmo", d: "= asimismo, likewise, also"}
          - {w: "moza", d: "girl, young woman; serving-wench"}
          - {w: "asturiano", d: "from Asturias, the poor mountain region of northern Spain; Asturians went south to work as servants and were proverbially proud of their old-Christian blood"}
          - {w: "ancho", d: "broad, wide"}
          - {w: "llano", d: "flat, level"}
          - {w: "cogote", d: "back of the head, nape"}
          - {w: "romo", d: "snub, blunt (of a nose)"}
          - {w: "tuerto", d: "one-eyed, blind in one eye"}
          - {w: "del un ojo", d: "in one eye; old Spanish puts the article before 'un' ('el un ojo ... el otro')"}
          - {w: "sano", d: "sound, healthy"}
        diagram:
          - s: "Servía"
            r: "main verb: served, was in service"
            under:
              - {s: "en la venta", r: "where"}
              - {s: "asimesmo", r: "also"}
              - s: "una moza asturiana"
                r: "subject: an Asturian girl"
                under:
                  - {s: "ancha de cara, llana de cogote, de nariz roma", r: "describes 'moza': broad-faced, flat-naped, snub-nosed"}
                  - {s: "del un ojo tuerta y del otro no muy sana", r: "describes 'moza': blind in one eye and not sound in the other"}
        forms:
          - {w: "Servía", f: "serv- + -ía → servir (to serve), imperfect, she: 'was in service'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían. Verb first, subject at the end of the clause."}
          - {w: "asimesmo", f: "= asimismo (likewise); 'mesmo' is the old spelling of mismo found throughout the book."}
          - {w: "asturiana, ancha, llana, tuerta, sana", f: "feminine forms of asturiano, ancho, llano, tuerto, sano, all matching 'moza'. 'ancha de cara' = broad as to face: adjective + 'de' + the body part."}
          - {w: "roma", f: "rom- + -a → romo (snub), feminine to match 'nariz'."}
          - {w: "del un ojo", f: "de + el + un: the article and 'un' together, an old construction; modern Spanish says 'de un ojo'."}
        note: "The portrait inverts, point for point, the catalogue of beauties a romance gives its heroine (fair face, fine nose, bright eyes). Maritornes, as she is soon named, became a byword in Spanish for an ugly, slovenly servant girl."
      - es: "Verdad es que la gallardía del cuerpo suplía las demás faltas: no tenía siete palmos de los pies a la cabeza, y las espaldas, que algún tanto le cargaban, la hacían mirar al suelo más de lo que ella quisiera."
        literal: "Truth is that the elegance of-the body made-up-for the other faults: not she-had seven palms from the feet to the head, and the shoulders, which some what her weighed-down, her made look at-the ground more than that which she would-have-wished."
        ormsby: "The elegance of her shape, to be sure, made up for all her defects; she did not measure seven palms from head to foot, and her shoulders, which overweighted her somewhat, made her contemplate the ground more than she liked."
        vocab:
          - {w: "verdad es que", d: "it is true that; here the deadpan lead-in to a joke"}
          - {w: "gallardía", d: "elegance, fine bearing, gallantry (said ironically)"}
          - {w: "suplir", d: "to make up for, compensate for"}
          - {w: "las demás", d: "the rest, the other (defects)"}
          - {w: "falta", d: "defect, fault, shortcoming"}
          - {w: "palmo", d: "span, the width of an open hand, about 21 cm; seven palms is under five feet"}
          - {w: "espaldas", d: "shoulders, back (Spanish uses the plural for one person's back)"}
          - {w: "algún tanto", d: "somewhat, a little"}
          - {w: "cargar", d: "to weigh down, burden; here of a hunched back pulling her forward"}
          - {w: "más de lo que", d: "more than (before a clause)"}
        diagram:
          - s: "Verdad es"
            r: "main verb 1: it is true"
            under:
              - {s: "que la gallardía del cuerpo suplía las demás faltas", r: "what is true: that her fine figure made up for the other defects"}
          - s: "no tenía siete palmos de los pies a la cabeza"
            r: "main verb 2 (after the colon, explaining the 'figure'): she was not seven palms tall"
          - s: "la hacían mirar al suelo"
            r: "main verb 3: made her look at the ground"
            under:
              - s: "y las espaldas"
                r: "subject: and her shoulders"
                under:
                  - {s: "que algún tanto le cargaban", r: "describes 'espaldas': which weighed her down somewhat"}
              - {s: "más de lo que ella quisiera", r: "how much: more than she would have liked"}
        forms:
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "suplía", f: "supl- + -ía → suplir (to make up for), imperfect, it (the 'gallardía'). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, she: 'measured'. Same -ía imperfect."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular word ('tanto')."}
          - {w: "le cargaban", f: "carg- + -aban → cargar (to weigh down), imperfect, they (the shoulders), with 'le' (on her). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "la hacían mirar", f: "hac- + -ían → hacer (to make), imperfect, they, + the infinitive mirar (to look): 'made her look'. 'la' is the person made to do it. Same -ía imperfect."}
          - {w: "quisiera", f: "quis- + -iera → querer (to want), imperfect subjunctive (-ra form), she: here 'would have liked'. Built on the preterite quisieron: quisiera, quisieras, quisiera, quisiéramos, quisierais, quisieran. Cervantes uses the -ra form as a conditional."}
        note: "The joke is in two steps: her 'fine figure' makes up for her face, and the figure turns out to be that of a tiny hunchback. Seven palms is about 1.45 m."
      - es: "Esta gentil moza, pues, ayudó a la doncella, y las dos hicieron una muy mala cama a don Quijote en un camaranchón que, en otros tiempos, daba manifiestos indicios que había servido de pajar muchos años."
        literal: "This genteel girl, then, helped [to] the maiden, and the two made a very bad bed for Don Quijote in a garret which, in other times, gave manifest indications that it-had served as straw-loft many years."
        ormsby: "This graceful lass, then, helped the young girl, and the two made up a very bad bed for Don Quixote in a garret that showed evident signs of having formerly served for many years as a straw-loft,"
        vocab:
          - {w: "gentil", d: "graceful, genteel, charming (ironic here)"}
          - {w: "pues", d: "then, so (resuming the story)"}
          - {w: "camaranchón", d: "garret, loft under the roof used for lumber"}
          - {w: "en otros tiempos", d: "in former times, once"}
          - {w: "manifiesto", d: "evident, plain"}
          - {w: "indicio", d: "sign, indication"}
          - {w: "servir de", d: "to serve as"}
          - {w: "pajar", d: "straw-loft, where straw ('paja') is stored"}
        diagram:
          - s: "ayudó"
            r: "main verb 1: helped"
            under:
              - {s: "Esta gentil moza", r: "subject: this graceful girl"}
              - {s: "a la doncella", r: "whom: the daughter"}
          - s: "y las dos hicieron una muy mala cama"
            r: "main verb 2: and the two made a very bad bed"
            under:
              - {s: "a don Quijote", r: "for whom"}
              - s: "en un camaranchón"
                r: "where: in a garret"
                under:
                  - s: "que, en otros tiempos, daba manifiestos indicios"
                    r: "describes 'camaranchón': which gave plain signs"
                    under:
                      - {s: "que había servido de pajar muchos años", r: "signs of what: that it had been a straw-loft for years"}
        forms:
          - {w: "Esta", f: "'this', feminine to match 'moza'; the demonstrative adjective takes no accent."}
          - {w: "ayudó", f: "ayud- + -ó → ayudar (to help), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "hicieron", f: "hacer (to make), preterite, they. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "mala", f: "mal- + -a → malo (bad), feminine to match 'cama'; 'muy mala' = very bad."}
          - {w: "daba", f: "d- + -aba → dar (to give), imperfect, it (the garret). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "manifiestos", f: "manifiest- + -os → manifiesto (evident), masculine plural to match 'indicios'."}
          - {w: "indicios que", f: "modern Spanish needs 'indicios de que'; Cervantes drops the 'de' before 'que' (and so does much spoken Spanish today)."}
          - {w: "había servido", f: "había (haber, imperfect, it: había, habías, había, habíamos, habíais, habían) + servido, the participle of servir (to serve): the pluperfect 'had served'."}
      - es: "En la cual también alojaba un arriero, que tenía su cama hecha un poco más allá de la de nuestro don Quijote."
        literal: "In the which also lodged a muleteer, who had his bed made a little more beyond of that of our Don Quijote."
        ormsby: "in which there was also quartered a carrier whose bed was placed a little beyond our Don Quixote’s,"
        vocab:
          - {w: "en la cual", d: "in which (the garret); Cervantes starts a new sentence with a relative, as Latin does"}
          - {w: "alojar", d: "to lodge; here intransitive, 'to be lodged, put up'"}
          - {w: "arriero", d: "muleteer, carrier who moved goods by mule train; Ormsby's 'carrier'"}
          - {w: "más allá de", d: "beyond, further on than"}
          - {w: "la de", d: "that of: 'la (cama) de don Quijote'"}
        diagram:
          - s: "alojaba"
            r: "main verb: was lodged"
            under:
              - {s: "En la cual", r: "where: in which (the garret)"}
              - {s: "también", r: "also"}
              - s: "un arriero"
                r: "subject: a muleteer"
                under:
                  - s: "que tenía su cama hecha"
                    r: "describes 'arriero': who had his bed made"
                    under:
                      - {s: "un poco más allá de la de nuestro don Quijote", r: "where: a little beyond Don Quijote's"}
        forms:
          - {w: "la cual", f: "'which', feminine; the noun it points back to, 'camaranchón', is masculine, so Cervantes probably had 'cámara' or 'estancia' (room) in mind. The relative with the article ('el cual, la cual') is used after prepositions."}
          - {w: "alojaba", f: "aloj- + -aba → alojar (to lodge), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. Today the verb would be reflexive, 'se alojaba'."}
          - {w: "tenía ... hecha", f: "tenía (tener, imperfect, he: tenía, tenías, tenía, teníamos, teníais, tenían) + hecha, the irregular participle of hacer (to make), feminine to match 'cama': 'had his bed made'. tener + participle stresses the finished state."}
          - {w: "nuestro", f: "'our', masculine to match 'don Quijote'; the narrator's affectionate 'our Don Quijote'."}
      - es: "Y, aunque era de las enjalmas y mantas de sus machos, hacía mucha ventaja a la de don Quijote, que sólo contenía cuatro mal lisas tablas, sobre dos no muy iguales bancos, y un colchón que en lo sutil parecía colcha, lleno de bodoques, que, a no mostrar que eran de lana por algunas roturas, al tiento, en la dureza, semejaban de guijarro, y dos sábanas hechas de cuero de adarga, y una frazada, cuyos hilos, si se quisieran contar, no se perdiera uno solo de la cuenta."
        literal: "And, although it-was of the pack-saddles and blankets of his mules, it-had much advantage over that of Don Quijote, which only contained four badly smooth boards, upon two not very equal trestles, and a mattress that in the thin[ness] seemed a-quilt, full of lumps, which, on not showing that they-were of wool through some rents, to-the touch, in the hardness, resembled of pebble, and two sheets made of leather of shield, and a blanket, whose threads, if one-wished to-count them, not one-would-lose one single [one] from the count."
        ormsby: "and, though only made of the packsaddles and cloths of his mules, had much the advantage of it, as Don Quixote’s consisted simply of four rough boards on two not very even trestles, a mattress, that for thinness might have passed for a quilt, full of pellets which, were they not seen through the rents to be wool, would to the touch have seemed pebbles in hardness, two sheets made of buckler leather, and a coverlet the threads of which anyone that chose might have counted without missing one in the reckoning."
