        note: "Ormsby's note identifies the two books. The praise is ironic: Tablante de Ricamonte is a slight, naive romance, and the 'book' of Count Tomillas may not exist at all."
  - sentences:
      - es: "Digo, pues, que después de haber visitado el arriero a su recua y dádole el segundo pienso, se tendió en sus enjalmas y se dio a esperar a su puntualísima Maritornes."
        literal: "I-say, then, that after of having visited the muleteer [to] his mule-train and given-it the second feed, he-stretched-himself on his pack-saddles and gave-himself to wait for his most-punctual Maritornes."
        ormsby: "To proceed, then: after having paid a visit to his team and given them their second feed, the carrier stretched himself on his packsaddles and lay waiting for his conscientious Maritornes."
        vocab:
          - {w: "digo, pues", d: "I say, then; the narrator's formula for getting back to the story after a digression"}
          - {w: "recua", d: "string of mules, mule train"}
          - {w: "pienso", d: "feed, ration of barley or straw for an animal (not 'I think' here)"}
          - {w: "tenderse", d: "to stretch out, lie down"}
          - {w: "darse a", d: "to set oneself to, settle down to"}
          - {w: "puntualísimo", d: "most punctual, most exact; an ironic echo of the 'puntual' historian just praised"}
        diagram:
          - s: "Digo"
            r: "main verb: I say (the narrator)"
            under:
              - s: "que ... se tendió en sus enjalmas"
                r: "what I say, 1: that he stretched out on his packsaddles"
                under:
                  - {s: "después de haber visitado el arriero a su recua y dádole el segundo pienso", r: "when: after the muleteer had seen to his mules and given them their second feed"}
              - {s: "y se dio a esperar a su puntualísima Maritornes", r: "what I say, 2: and settled down to wait for his most punctual Maritornes"}
        forms:
          - {w: "Digo", f: "dig- + -o → decir (to say), present, I. digo, dices, dice, decimos, decís, dicen."}
          - {w: "haber visitado", f: "haber + visitado, the participle of visitar (to visit): the perfect infinitive 'having visited', after 'después de'. Its subject, 'el arriero', follows it."}
          - {w: "dádole", f: "dado, the participle of dar (to give), + le (to it, the mule train), with an accent added: '(having) given it'; it shares the 'haber' of 'haber visitado'. Modern Spanish would write 'haberle dado'."}
          - {w: "se tendió", f: "tend- + -ió → tenderse (to stretch out), preterite, he, with 'se' (himself). The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "se dio", f: "dar (to give), preterite, he, with 'se': 'darse a' = to set oneself to. Irregular: di, diste, dio, dimos, disteis, dieron."}
          - {w: "puntualísima", f: "puntual (punctual) + -ísima, the superlative suffix 'most, very', feminine to match Maritornes."}
      - es: "Ya estaba Sancho bizmado y acostado, y, aunque procuraba dormir, no lo consentía el dolor de sus costillas; y don Quijote, con el dolor de las suyas, tenía los ojos abiertos como liebre."
