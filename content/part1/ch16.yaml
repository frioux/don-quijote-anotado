  - sentences:
      - es: "— Quisiera hallarme en términos, fermosa y alta señora, de poder pagar tamaña merced como la que con la vista de vuestra gran fermosura me habedes fecho, pero ha querido la fortuna, que no se cansa de perseguir a los buenos, ponerme en este lecho, donde yago tan molido y quebrantado que, aunque de mi voluntad quisiera satisfacer a la vuestra, fuera imposible."
        literal: "— I-would-wish to-find-myself in terms, beautiful and high lady, of being-able to-pay so-great favor as the [one] that with the sight of your great beauty to-me you-have done, but has wished the fortune, which not itself tires of persecuting [to] the good, to-put-me in this bed, where I-lie so ground and broken that, although of my will I-might-wish to-satisfy [to] the yours, it-would-be impossible."
        ormsby: "“Would that I found myself, lovely and exalted lady, in a position to repay such a favour as that which you, by the sight of your great beauty, have granted me; but fortune, which is never weary of persecuting the good, has chosen to place me upon this bed, where I lie so bruised and broken that though my inclination would gladly comply with yours it is impossible;"
        vocab:
          - {w: "hallarse en términos de", d: "to be in a position to"}
          - {w: "alto", d: "high, exalted, noble"}
          - {w: "tamaño", d: "so great, such a (before a noun); 'tamaña merced' = so great a favor"}
          - {w: "merced", d: "favor, grace, kindness"}
          - {w: "habedes fecho", d: "= habéis hecho, you have done (romance archaisms)"}
          - {w: "cansarse de", d: "to tire of"}
          - {w: "perseguir", d: "to persecute, pursue"}
          - {w: "yacer", d: "to lie (in bed, wounded, or in a grave); 'yago' = I lie"}
          - {w: "molido y quebrantado", d: "ground and broken: battered, aching all over"}
          - {w: "satisfacer a la vuestra", d: "to satisfy yours (your will)"}
        diagram:
          - s: "Quisiera hallarme en términos"
            r: "main verb 1: I would like to find myself in a position"
            under:
              - {s: "fermosa y alta señora", r: "address: fair and noble lady"}
              - s: "de poder pagar tamaña merced"
                r: "position to do what: to be able to repay so great a favor"
                under:
                  - {s: "como la que con la vista de vuestra gran fermosura me habedes fecho", r: "as the one: as you have done me with the sight of your great beauty"}
          - s: "pero ha querido la fortuna"
            r: "main verb 2: but fortune has wished"
            under:
              - {s: "que no se cansa de perseguir a los buenos", r: "describes 'fortuna': which never tires of persecuting the good"}
              - s: "ponerme en este lecho"
                r: "what fortune wished: to put me in this bed"
                under:
                  - s: "donde yago tan molido y quebrantado"
                    r: "describes 'lecho': where I lie so battered and broken"
                    under:
                      - s: "que ... fuera imposible"
                        r: "result: that it would be impossible"
                        under:
                          - {s: "aunque de mi voluntad quisiera satisfacer a la vuestra", r: "concession: even if of my own will I wished to satisfy yours"}
        forms:
          - {w: "Quisiera", f: "quis- + -iera → querer (to want), imperfect subjunctive (-ra form), I: the polite 'I would like'. Built on the preterite quisieron: quisiera, quisieras, quisiera, quisiéramos, quisierais, quisieran."}
          - {w: "hallarme", f: "hallar (to find) + me (myself), the pronoun hung on the infinitive."}
          - {w: "fermosa, fermosura", f: "= hermosa, hermosura, with the old f- of the romances; fermosa is feminine to match 'señora'."}
          - {w: "tamaña", f: "tamañ- + -a → tamaño (so great), feminine to match 'merced'."}
          - {w: "vuestra gran", f: "vuestra (your), feminine to match 'fermosura'; gran = grande clipped before a singular noun."}
          - {w: "me habedes fecho", f: "habedes = habéis (haber, present, you, the old form with -d-), + fecho = hecho, the participle of hacer (to do): 'you have done me'. Both archaic forms from the romances."}
          - {w: "ha querido", f: "ha = haber, present, it (he, has, ha, hemos, habéis, han), + querido, the participle of querer (to want): 'has wished'."}
          - {w: "se cansa", f: "cans- + -a → cansarse (to tire), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "ponerme", f: "poner (to put) + me, the pronoun hung on the infinitive."}
          - {w: "yago", f: "yag- + -o → yacer (to lie), present, I: an old irregular form (yazgo, yago or yazco). The rest of the present: yaces, yace, yacemos, yacéis, yacen."}
          - {w: "molido y quebrantado", f: "participles of moler (to grind) and quebrantar (to break), masculine to match the speaker."}
          - {w: "quisiera", f: "imperfect subjunctive (-ra form) of querer, I: 'even if I wished', after 'aunque'. quisiera, quisieras, quisiera, quisiéramos, quisierais, quisieran."}
          - {w: "la vuestra", f: "'yours', feminine to match 'voluntad' (understood)."}
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), it, used as a conditional: 'it would be'. fuera, fueras, fuera, fuéramos, fuerais, fueran."}
        note: "Don Quijote's apology is the knight's in the romances who must refuse a lady out of loyalty; here it is addressed to a servant who has come for the muleteer and understands none of it."
