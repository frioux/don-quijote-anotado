          - {w: "bizmado y acostado", f: "participles of bizmar (to poultice) and acostar (to lay down), masculine to match Sancho."}
          - {w: "procuraba", f: "procur- + -aba → procurar (to try), imperfect, he. Same -aba imperfect."}
          - {w: "consentía", f: "consent- + -ía → consentir (to allow), imperfect, it (the pain). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
