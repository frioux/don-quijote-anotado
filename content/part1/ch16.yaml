          - s: "Bien haya"
            r: "main verb 1: blessings on"
            under:
              - {s: "mil veces", r: "how much: a thousand times"}
              - {s: "el autor de Tablante de Ricamonte", r: "whom: the author of Tablante de Ricamonte"}
              - s: "y aquel del otro libro"
                r: "whom, 2: and the author of the other book"
                under:
                  - {s: "donde se cuenta los hechos del conde Tomillas", r: "describes 'libro': where Count Tomillas' deeds are told"}
          - s: "y con qué puntualidad lo describen todo"
            r: "main verb 2: and how minutely they describe everything"
        forms:
          - {w: "haya", f: "hay- + -a → haber (to have), present subjunctive, he: in 'bien haya', a set blessing, 'may he fare well'. haber in the present subjunctive: haya, hayas, haya, hayamos, hayáis, hayan."}
          - {w: "aquel", f: "'that one', the demonstrative as a pronoun standing for 'el autor'."}
          - {w: "se cuenta", f: "cuent- + -a → contar (to tell), present, with impersonal 'se': 'is told'. The verb is singular though 'los hechos' is plural, a loose agreement common in the period. The stem o becomes ue when stressed: cuento, cuentas, cuenta, contamos, contáis, cuentan."}
          - {w: "qué", f: "'what', with the accent because it is exclamatory: 'con qué puntualidad' = with what exactness."}
