                      - {s: "mientras la vida me durare", r: "how long: as long as my life shall last"}
        forms:
          - {w: "os digo", f: "dig- + -o → decir (to say), present, I, with 'os' (to you). digo, dices, dice, decimos, decís, dicen."}
          - {w: "tendré ... escrito", f: "tendr- + -é → tener (to have, keep), future, I, + escrito, the irregular participle of escribir (to write): 'I shall keep written'. tener's future stem is irregular: tendré, tendrás, tendrá, tendremos, tendréis, tendrán."}
          - {w: "eternamente", f: "eterna (eternal, feminine) + -mente: adverbs are built on the feminine of the adjective."}
          - {w: "me habedes fecho", f: "habedes = haber, present, you (vos), the old form of 'habéis' with the Latin -d- still in it; fecho = hecho, the irregular participle of hacer (to do), with the old f-: 'you have done me'. Both are deliberate archaisms from the romances of chivalry."}
          - {w: "agradecéroslo", f: "agradecer (to thank for) + os (you) + lo (it), both pronouns hung on the infinitive, with an accent added to keep the stress on '-cer-': 'to thank you for it'."}
          - {w: "me durare", f: "dur- + -are → durar (to last), future subjunctive, it (the 'vida'), with 'me' (for me): 'as long as life shall last me'. The future subjunctive of -ar verbs: -are, -ares, -are, -áremos, -areis, -aren. Cervantes uses it after 'mientras', 'si', 'donde' for an open future; modern Spanish says 'dure'."}
      - es: "y pluguiera a los altos cielos que el amor no me tuviera tan rendido y tan sujeto a sus leyes, y los ojos de aquella hermosa ingrata que digo entre mis dientes;"
        literal: "and might-it-please [to] the high heavens that the love not me held so surrendered and so subject to its laws, and the eyes of that beautiful ingrate whom I-say between my teeth;"
        ormsby: "and would to Heaven love held me not so enthralled and subject to its laws and to the eyes of that fair ingrate whom I name between my teeth,"
        vocab:
          - {w: "pluguiera a los cielos", d: "would to heaven; 'pluguiera' is the old imperfect subjunctive of 'placer' (to please), a formula of the romances"}
          - {w: "rendido", d: "surrendered, vanquished, enslaved (by love)"}
          - {w: "sujeto a", d: "subject to"}
          - {w: "ley", d: "law; 'las leyes del amor' = love's laws"}
          - {w: "ingrata", d: "ungrateful woman, the cruel beloved of courtly poetry"}
