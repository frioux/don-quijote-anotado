                  - {s: "que así se llamaba la asturiana", r: "describes 'Maritornes': for that was the Asturian's name"}
          - s: "dijo"
            r: "main verb 3 (after 'y'): she (the hostess) said"
            under:
              - s: "como al bizmalle viese la ventera tan acardenalado a partes a don Quijote"
                r: "when and why: as the hostess, plastering him, saw Don Quijote so bruised in places"
              - {s: "que aquello más parecían golpes que caída", r: "what she said: that this looked more like blows than a fall"}
        forms:
          - {w: "se acostó", f: "acost- + -ó → acostarse (to lie down), preterite, he, with 'se' (himself). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "le emplastaron", f: "emplast- + -aron → emplastar (to plaster), preterite, they, with 'le' (him). Same -ar preterite. 'le' for a male person as direct object is Castilian usage (leísmo); strict grammar wants 'lo'."}
          - {w: "alumbrándoles", f: "alumbrando, the gerund of alumbrar (to light), + les (for them), with an accent added to keep the stress on '-bran-'. Its subject, Maritornes, follows it."}
          - {w: "se llamaba", f: "llam- + -aba → llamarse (to be called), imperfect, she, with 'se'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "bizmalle", f: "bizmar (to poultice) + le (him) = 'bizmarle'; in Cervantes' day the -rl- of infinitive + pronoun was often pronounced and written -ll-. 'al bizmalle' = while plastering him."}
