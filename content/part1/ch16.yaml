        forms:
          - {w: "Pensando", f: "gerund of pensar (to think); its subject is Don Quijote, though the main verb's subject is 'el tiempo'."}
          - {w: "se llegó", f: "lleg- + -ó → llegarse (to arrive), preterite, it, with 'se'. Singular though there are two subjects. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "fue menguada", f: "fue = ser, preterite, it (fui, fuiste, fue, fuimos, fuisteis, fueron), + menguada, feminine to match 'hora'."}
