      - es: "Toda la venta estaba en silencio, y en toda ella no había otra luz que la que daba una lámpara que colgada en medio del portal ardía."
        literal: "All the inn was in silence, and in all it not there-was other light than that which gave a lamp that hung in middle of-the gateway burned."
        ormsby: "The inn was all in silence, and in the whole of it there was no light except that given by a lantern that hung burning in the middle of the gateway."
