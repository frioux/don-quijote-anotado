  - sentences:
      - es: "El lecho, que era un poco endeble y de no firmes fundamentos, no pudiendo sufrir la añadidura del arriero, dio consigo en el suelo, a cuyo gran ruido despertó el ventero, y luego imaginó que debían de ser pendencias de Maritornes, porque, habiéndola llamado a voces, no respondía."
        literal: "The bed, which was a little feeble and of not firm foundations, not being-able to-bear the addition of-the muleteer, gave with-itself on the floor, at whose great noise awoke the innkeeper, and at-once imagined that they-must of to-be quarrels of Maritornes, because, having-her called with shouts, not she-answered."
        ormsby: "The bed which was somewhat crazy and not very firm on its feet, unable to support the additional weight of the carrier, came to the ground, and at the mighty crash of this the innkeeper awoke and at once concluded that it must be some brawl of Maritornes’, because after calling loudly to her he got no answer."
