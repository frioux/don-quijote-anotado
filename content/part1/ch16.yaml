          - {w: "se había fabricado", f: "había (haber, imperfect, he: había, habías, había, habíamos, habíais, habían) + fabricado, the participle of fabricar (to build), with 'se' (for himself)."}
          - {w: "firme y valedera", f: "feminine to match 'quimera'."}
          - {w: "se comenzó a acuitar", f: "comenz- + -ó → comenzar (to begin), preterite, he, + a + acuitar (to fret); the 'se' belongs to acuitarse but climbs in front of comenzó. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "se había de ver", f: "había (haber, imperfect, it) + de + ver (to see) with 'se': 'haber de' + infinitive = to be going to, be bound to."}
          - {w: "propuso", f: "propus- + -o → proponer (to resolve), preterite, he. Like poner: propuse, propusiste, propuso, propusimos, propusisteis, propusieron."}
