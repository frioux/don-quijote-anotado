          - {w: "estaba escuchando", f: "est- + -aba → estar (to be), imperfect, he, + escuchando, the gerund of escuchar (to listen): 'was listening'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. The object comes first and the subject last."}
          - {w: "atento", f: "atent- + -o → atento (attentive), masculine to match 'don Quijote'; an adjective used where English wants the adverb 'attentively'."}
