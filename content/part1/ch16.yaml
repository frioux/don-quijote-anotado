  - sentences:
      - es: "Alojaba acaso aquella noche en la venta un cuadrillero de los que llaman de la Santa Hermandad Vieja de Toledo, el cual, oyendo ansimesmo el estraño estruendo de la pelea, asió de su media vara y de la caja de lata de sus títulos, y entró ascuras en el aposento, diciendo:"
        literal: "Was-lodging by-chance that night in the inn a patrolman of those that they-call of the Holy Brotherhood Old of Toledo, who, hearing likewise the strange din of the fight, seized [of] his half staff and [of] the box of tin of his warrants, and entered in-the-dark into the room, saying:"
        ormsby: "It so happened that there was lodging that night in the inn a caudrillero of what they call the Old Holy Brotherhood of Toledo, who, also hearing the extraordinary noise of the conflict, seized his staff and the tin case with his warrants, and made his way in the dark into the room crying:"
        vocab:
          - {w: "acaso", d: "by chance (not 'perhaps' here)"}
          - {w: "cuadrillero", d: "officer of the Santa Hermandad, a member of a 'cuadrilla' (patrol)"}
          - {w: "Santa Hermandad", d: "the Holy Brotherhood, the rural police that hunted highwaymen and judged crimes in open country; the 'Old' one of Toledo was the original medieval brotherhood"}
          - {w: "ansimesmo", d: "= asimismo, likewise, also"}
          - {w: "estraño", d: "= extraño, strange, extraordinary"}
          - {w: "estruendo", d: "din, crash, uproar"}
          - {w: "asir de", d: "to grab, seize"}
          - {w: "media vara", d: "short staff, the Hermandad officer's badge of authority"}
          - {w: "caja de lata", d: "tin box, in which he carried his papers"}
          - {w: "títulos", d: "warrants, commission papers proving his office"}
          - {w: "ascuras", d: "= a oscuras, in the dark"}
        diagram:
          - s: "Alojaba"
            r: "main verb 1: was lodging"
            under:
              - {s: "acaso aquella noche en la venta", r: "when and where: by chance that night at the inn"}
              - s: "un cuadrillero"
                r: "subject: an officer"
                under:
                  - {s: "de los que llaman de la Santa Hermandad Vieja de Toledo", r: "describes 'cuadrillero': of the Old Holy Brotherhood of Toledo, as they call it"}
          - s: "el cual ... asió de su media vara y de la caja de lata de sus títulos"
            r: "main verb 2 (describing 'cuadrillero'): who grabbed his staff and the tin box with his warrants"
            under:
              - {s: "oyendo ansimesmo el estraño estruendo de la pelea", r: "why: hearing, too, the strange din of the fight"}
          - s: "y entró ascuras en el aposento"
            r: "main verb 3: and went into the room in the dark"
            under:
              - {s: "diciendo:", r: "how: saying (what follows)"}
        forms:
          - {w: "Alojaba", f: "aloj- + -aba → alojar (to lodge), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "llaman", f: "llam- + -an → llamar (to call), present, they (people in general). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "oyendo", f: "gerund of oír (to hear), spelled with y."}
          - {w: "ansimesmo", f: "= asimismo (likewise); 'ansí' is the old form of así and 'mesmo' of mismo."}
          - {w: "asió", f: "as- + -ió → asir (to seize), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "media", f: "medi- + -a → medio (half), feminine to match 'vara'."}
          - {w: "entró", f: "entr- + -ó → entrar (to enter), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "diciendo", f: "gerund of decir (to say); the stem e turns to i."}
        note: "The Santa Hermandad was a rural police force with summary powers over crimes on the roads; Sancho has already worried that it would come after them for the fight with the Biscayan."
  - sentences:
      - es: "— ¡Ténganse a la justicia! ¡Ténganse a la Santa Hermandad!"
        literal: "— Hold-yourselves to the justice! Hold-yourselves to the Holy Brotherhood!"
        ormsby: "“Hold! in the name of the Jurisdiction! Hold! in the name of the Holy Brotherhood!”"
        vocab:
          - {w: "tenerse", d: "to stop, hold still: '¡ténganse!' = stop! halt!"}
          - {w: "a la justicia", d: "in the name of the law; 'justicia' = the officers of the law"}
          - {w: "Santa Hermandad", d: "the Holy Brotherhood, the rural police"}
        diagram:
          - s: "Ténganse a la justicia"
            r: "main verb 1: halt, in the name of the law"
          - s: "Ténganse a la Santa Hermandad"
            r: "main verb 2: halt, in the name of the Holy Brotherhood"
        forms:
          - {w: "Ténganse", f: "teng- + -an + se → tenerse (to stop), present subjunctive used as a command, you all (ustedes), with 'se' stuck on the end, as always on a positive command. tener in the present subjunctive: tenga, tengas, tenga, tengamos, tengáis, tengan."}
        note: "This is the official formula of arrest; the officer addresses everyone in the room with the polite plural."
  - sentences:
      - es: "Y el primero con quien topó fue con el apuñeado de don Quijote, que estaba en su derribado lecho, tendido boca arriba, sin sentido alguno, y, echándole a tiento mano a las barbas, no cesaba de decir:"
        literal: "And the first with whom he-bumped was with the punched [one] of Don Quijote, who was in his knocked-down bed, stretched mouth upward, without sense any, and, throwing-to-him by feel hand to the beard, not he-ceased of saying:"
        ormsby: "The first that he came upon was the pummelled Don Quixote, who lay stretched senseless on his back upon his broken-down bed, and, his hand falling on the beard as he felt about, he continued to cry,"
        vocab:
          - {w: "topar con", d: "to run into, come upon"}
          - {w: "el apuñeado de don Quijote", d: "the battered Don Quijote, poor punched Don Quijote; 'apuñeado' = punched"}
          - {w: "derribado", d: "knocked down, collapsed"}
          - {w: "boca arriba", d: "face up, on one's back"}
          - {w: "sin sentido", d: "unconscious"}
          - {w: "echar mano a", d: "to lay hold of, grab"}
          - {w: "a tiento", d: "by feel, groping"}
          - {w: "barbas", d: "beard (Spanish often uses the plural)"}
          - {w: "no cesar de", d: "not stop doing, keep on"}
        diagram:
          - s: "fue"
            r: "main verb 1: was"
            under:
              - {s: "Y el primero con quien topó", r: "subject: the first one he ran into"}
              - s: "con el apuñeado de don Quijote"
                r: "who it was: the battered Don Quijote"
                under:
                  - {s: "que estaba en su derribado lecho, tendido boca arriba, sin sentido alguno", r: "describes 'don Quijote': who lay on his collapsed bed, on his back, unconscious"}
          - s: "no cesaba de decir:"
            r: "main verb 2 (after 'y'): he kept on saying"
            under:
              - {s: "echándole a tiento mano a las barbas", r: "how: groping and grabbing his beard"}
