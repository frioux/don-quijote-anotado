        vocab:
          - {w: "plática", d: "talk, conversation"}
          - {w: "atento", d: "attentive"}
          - {w: "lecho", d: "bed (the literary word; 'cama' is the everyday one)"}
          - {w: "como pudo", d: "as best he could"}
          - {w: "tomar de la mano", d: "to take by the hand"}
        diagram:
