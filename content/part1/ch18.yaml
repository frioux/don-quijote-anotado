              - {s: "A este escuadrón frontero", r: "object (marked with 'a', pulled to the front): this squadron facing us"}
              - {s: "gentes de diversas naciones:", r: "subject: peoples of many nations"}
        forms:
          - {w: "este", f: "'this', masculine to match 'escuadrón'."}
          - {w: "frontero", f: "frontero (facing), masculine to match 'escuadrón'."}
          - {w: "forman y hacen", f: "form- + -an → formar (to form) and hac- + -en → hacer (to make), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an; of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "diversas", f: "divers- + -as → diverso (various), feminine plural to match 'naciones'."}
