          - {w: "estos", f: "'these', masculine plural to match 'señores'."}
          - {w: "preguntó", f: "pregunt- + -ó → preguntar (to ask), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
      - es: "— Quierénse mal —respondió don Quijote— porque este Alefanfarón es un foribundo pagano y está enamorado de la hija de Pentapolín, que es una muy fermosa y además agraciada señora, y es cristiana, y su padre no se la quiere entregar al rey pagano si no deja primero la ley de su falso profeta Mahoma y se vuelve a la suya."
        literal: "— Want-themselves badly —answered Don Quijote— because this Alefanfarón is a furious pagan and is in-love of the daughter of Pentapolín, who is a very beautiful and besides graceful lady, and is Christian, and her father not to-him her wants to-hand-over to-the king pagan if not he-leaves first the law of his false prophet Mohammed and turns to hers."
        ormsby: "“They are at enmity,” replied Don Quixote, “because this Alifanfaron is a furious pagan and is in love with the daughter of Pentapolin, who is a very beautiful and moreover gracious lady, and a Christian, and her father is unwilling to bestow her upon the pagan king unless he first abandons the religion of his false prophet Muhammad, and adopts his own.”"
        vocab:
          - {w: "foribundo", d: "= furibundo, furious, raging"}
          - {w: "pagano", d: "pagan; here a Muslim, as the romances call all non-Christians"}
          - {w: "estar enamorado de", d: "to be in love with"}
          - {w: "fermosa", d: "= hermosa, beautiful; the old f- that the romances kept"}
          - {w: "agraciado", d: "graceful, charming"}
          - {w: "entregar", d: "to hand over, give in marriage"}
          - {w: "ley", d: "here religion, faith (the 'law' of Mohammed, the 'law' of Christ)"}
          - {w: "Mahoma", d: "Mohammed"}
          - {w: "volverse a", d: "to turn to, convert to"}
        diagram:
          - s: "Quierénse mal"
            r: "main verb: they hate each other"
            under:
              - s: "porque este Alefanfarón es un foribundo pagano"
                r: "why, 1: because this Alefanfarón is a furious pagan"
              - s: "y está enamorado de la hija de Pentapolín"
                r: "why, 2: and is in love with Pentapolín's daughter"
                under:
                  - {s: "que es una muy fermosa y además agraciada señora, y es cristiana", r: "describes 'hija': who is a very beautiful and charming lady, and a Christian"}
              - s: "y su padre no se la quiere entregar al rey pagano"
                r: "why, 3: and her father will not give her to the pagan king"
                under:
                  - {s: "si no deja primero la ley de su falso profeta Mahoma y se vuelve a la suya", r: "condition: unless he first leaves the law of his false prophet Mohammed and turns to the father's own"}
          - {s: "respondió don Quijote", r: "narrator's tag: Don Quijote answered"}
        forms:
          - {w: "Quierénse", f: "quier- + -en + se → quererse, present, they, with 'se' (each other) stuck on the end. Cervantes hangs pronouns on the end of a verb that opens its clause; modern Spanish says 'se quieren'. The accent on 'Quierénse' is the Gutenberg text's (modern spelling would be 'Quiérense'). The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "es, está", f: "es (ser, present, he: soy, eres, es, somos, sois, son) for what he is, a pagan; está (estar, present, he: estoy, estás, está, estamos, estáis, están) for his state, in love."}
          - {w: "enamorado", f: "participle of enamorar (to make fall in love), masculine for Alefanfarón: 'in love'."}
          - {w: "fermosa, agraciada", f: "fermos- + -a → fermoso (= hermoso, beautiful) and agraciad- + -a → agraciado (charming), feminine to match 'señora'."}
          - {w: "cristiana", f: "cristian- + -a → cristiano (Christian), feminine for the daughter."}
          - {w: "no se la quiere entregar", f: "quier- + -e → querer (to want), present, he (the father), + entregar (to hand over). 'la' = her; 'se' = to him (the king), 'le' turned into 'se' before 'la'."}
          - {w: "al", f: "a + el."}
          - {w: "deja", f: "dej- + -a → dejar (to leave), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. After 'si' the present is used, not the subjunctive."}
          - {w: "se vuelve", f: "vuelv- + -e → volverse (to turn), present, he, with 'se'. The stem o becomes ue when stressed: vuelvo, vuelves, vuelve, volvemos, volvéis, vuelven."}
          - {w: "la suya", f: "'his own' (the father's law), feminine to match 'ley'; the stressed possessive with the article."}
        note: "The Gutenberg text spells the emperor's name Alifanfarón, Alefanfarón and Alifanfuón, and the king Pentapolén and Pentapolín, in the course of this one chapter; the notes keep each spelling as it occurs."
  - sentences:
      - es: "— ¡Para mis barbas —dijo Sancho—, si no hace muy bien Pentapolín, y que le tengo de ayudar en cuanto pudiere!"
        literal: "— By my beard —said Sancho—, if not does very well Pentapolín, and that him I-have to help in how-much I-may-be-able!"
        ormsby: "“By my beard,” said Sancho, “but Pentapolin does quite right, and I will help him as much as I can.”"
        vocab:
          - {w: "para mis barbas", d: "by my beard, a rustic oath; 'barbas' is plural in Spanish"}
          - {w: "si no hace muy bien", d: "after an oath, 'si no' = 'I swear that ... does'; the negative belongs to the oath formula"}
          - {w: "tener de", d: "= tener que, to have to"}
          - {w: "en cuanto pudiere", d: "as far as I am able (future subjunctive)"}
        diagram:
          - s: "¡Para mis barbas"
            r: "oath: by my beard"
            under:
              - {s: "si no hace muy bien Pentapolín", r: "what I swear: that Pentapolín is doing quite right (an oath phrased as 'if not')"}
              - s: "y que le tengo de ayudar"
                r: "what I swear, 2: and that I am going to help him"
                under:
                  - {s: "en cuanto pudiere!", r: "how far: as much as I can"}
          - {s: "dijo Sancho", r: "narrator's tag: said Sancho"}
        forms:
          - {w: "mis", f: "'my', plural to match 'barbas'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "hace", f: "hac- + -e → hacer (to do), present, he. hago, haces, hace, hacemos, hacéis, hacen. 'hacer bien' = to do right."}
          - {w: "le tengo de ayudar", f: "teng- + -o → tener (to have), present, I, + 'de' + ayudar (to help), with 'le' (him): the old 'tener de' = modern 'tener que', 'I have to help him'. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "pudiere", f: "pud- + -iere → poder (to be able), future subjunctive, I: 'as far as I may be able'. Built on the preterite pudieron: pudiere, pudieres, pudiere, pudiéremos, pudiereis, pudieren. Cervantes uses it after 'cuanto' for an open future; modern Spanish says 'pueda'."}
        note: "'Para mis barbas, si no ...' is an oath in the old pattern: 'by my beard [may I be punished] if he does not do right', i.e. 'I swear he does right'. Sancho's beard will matter again before the chapter ends."
