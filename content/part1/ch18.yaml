          - {w: "coloquio", d: "conversation, talk"}
          - {w: "escudero", d: "squire"}
          - {w: "espeso", d: "thick, dense"}
          - {w: "polvareda", d: "cloud of dust"}
          - {w: "en viéndola", d: "on seeing it; 'en' + gerund = as soon as, upon"}
