  - sentences:
      - es: "— De todo sabían y han de saber los caballeros andantes, Sancho —dijo don Quijote—, porque caballero andante hubo en los pasados siglos que así se paraba a hacer un sermón o plática, en mitad de un campo real, como si fuera graduado por la Universidad de París;"
        literal: "— Of everything knew and have to know the knights errant, Sancho —said Don Quijote—, because knight errant there-was in the past centuries who thus himself stopped to make a sermon or talk, in middle of a camp royal, as if he-were graduated by the University of Paris;"
        ormsby: "“Knights-errant knew and ought to know everything, Sancho,” said Don Quixote; “for there were knights-errant in former times as well qualified to deliver a sermon or discourse in the middle of an encampment, as if they had graduated in the University of Paris;"
        vocab:
          - {w: "saber de", d: "to know about"}
          - {w: "pararse a", d: "to stop to, set about"}
          - {w: "plática", d: "talk, address, homily"}
          - {w: "campo real", d: "royal camp, the army's encampment"}
          - {w: "graduado por", d: "graduated from"}
          - {w: "la Universidad de París", d: "the Sorbonne, the most famous school of theology"}
        diagram:
          - s: "De todo sabían y han de saber los caballeros andantes"
            r: "main verb: knights-errant knew and must know about everything"
            under:
              - {s: "Sancho", r: "address"}
              - s: "porque caballero andante hubo en los pasados siglos"
                r: "why: because there was a knight-errant in past ages"
                under:
                  - s: "que así se paraba a hacer un sermón o plática, en mitad de un campo real"
                    r: "describes 'caballero': who would stop to give a sermon or talk in the middle of a royal camp"
                    under:
                      - {s: "como si fuera graduado por la Universidad de París", r: "comparison: as if he had graduated from the University of Paris"}
          - {s: "dijo don Quijote", r: "narrator's tag: said Don Quijote"}
        forms:
          - {w: "sabían", f: "sab- + -ían → saber (to know), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "han de saber", f: "han (haber, present, they: he, has, ha, hemos, habéis, han) + 'de' + saber: 'must know'."}
          - {w: "hubo", f: "hub- + -o → haber, preterite, used alone as 'there was'. haber's preterite: hube, hubiste, hubo, hubimos, hubisteis, hubieron."}
          - {w: "pasados", f: "participle of pasar (to pass), masculine plural to match 'siglos': 'past'."}
          - {w: "se paraba", f: "par- + -aba → pararse (to stop), imperfect, he, with 'se'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "fuera graduado", f: "fuera (ser, imperfect subjunctive, -ra form, he: fuera, fueras, fuera, fuéramos, fuerais, fueran) + graduado, participle of graduar (to graduate). 'como si' always takes the imperfect subjunctive."}
