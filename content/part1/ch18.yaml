          - {w: "suelen", f: "suel- + -en → soler (to usually do), present, they. The stem o becomes ue when stressed: suelo, sueles, suele, solemos, soléis, suelen."}
          - {w: "malaventurados", f: "mal + aventurado (fortuned), masculine plural to match 'caballeros'."}
          - {w: "es", f: "ser (to be), present, he/she ('vuestra merced'). soy, eres, es, somos, sois, son."}
