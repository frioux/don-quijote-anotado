  - sentences:
      - es: "— Eso fuera —respondió Sancho— cuando faltaran por estos prados las yerbas que vuestra merced dice que conoce, con que suelen suplir semejantes faltas los tan malaventurados andantes caballeros como vuestra merced es."
        literal: "— That would-be —answered Sancho— when were-lacking through these meadows the herbs that your worship says that knows, with which are-accustomed to-supply similar lacks the so unlucky errant knights as your worship is."
        ormsby: "“It would be so,” answered Sancho, “if there were none of the herbs your worship says you know in these meadows, those with which knights-errant as unlucky as your worship are wont to supply suchlike shortcomings.”"
