  - sentences:
      - es: "¡Válame Dios, y cuántas provincias dijo, cuántas naciones nombró, dándole a cada una, con maravillosa presteza, los atributos que le pertenecían, todo absorto y empapado en lo que había leído en sus libros mentirosos!"
        literal: "May-God-help-me, and how-many provinces he-said, how-many nations he-named, giving-to-it to each one, with marvelous quickness, the attributes that to-it belonged, all absorbed and soaked in that which he-had read in his books lying!"
        ormsby: "Good God! what a number of countries and nations he named! giving to each its proper attributes with marvellous readiness; brimful and saturated with what he had read in his lying books!"
        vocab:
          - {w: "¡Válame Dios!", d: "God help me! (= válgame Dios), an exclamation of amazement"}
          - {w: "provincia", d: "province, country"}
          - {w: "presteza", d: "quickness, readiness"}
          - {w: "atributo", d: "attribute, epithet"}
          - {w: "pertenecer", d: "to belong"}
          - {w: "absorto", d: "absorbed, engrossed"}
          - {w: "empapado", d: "soaked, steeped"}
          - {w: "mentiroso", d: "lying, untruthful"}
        diagram:
          - {s: "¡Válame Dios", r: "exclamation: God help me"}
          - s: "y cuántas provincias dijo, cuántas naciones nombró"
            r: "main verbs: and how many provinces he named, how many nations he called out"
            under:
              - s: "dándole a cada una, con maravillosa presteza, los atributos"
                r: "how: giving each one, with marvelous speed, the attributes"
                under:
                  - {s: "que le pertenecían", r: "describes 'atributos': that belonged to it"}
              - s: "todo absorto y empapado en lo que había leído en sus libros mentirosos!"
                r: "his state: wholly absorbed and steeped in what he had read in his lying books"
        forms:
          - {w: "Válame", f: "val- + -a + me → valer (to help, protect), present subjunctive, he (God), with 'me' stuck on: 'may God help me'. A wish in the subjunctive. The usual form is 'válgame' (valga, valgas, valga, valgamos, valgáis, valgan); 'válame' is an older popular variant."}
          - {w: "cuántas", f: "cuánt- + -as → cuánto (how many), feminine plural to match 'provincias' and 'naciones'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "nombró", f: "nombr- + -ó → nombrar (to name), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "dándole", f: "dando, the gerund of dar (to give), + le (to it), with an accent added; 'le' anticipates 'a cada una'."}
          - {w: "maravillosa", f: "maravillos- + -a → maravilloso (marvelous), feminine to match 'presteza'."}
          - {w: "pertenecían", f: "pertenec- + -ían → pertenecer (to belong), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "absorto y empapado", f: "masculine singular to match Don Quijote: absorto (absorbed) and empapado, participle of empapar (to soak)."}
          - {w: "había leído", f: "hab- + -ía → haber, imperfect, he, + leído, participle of leer (to read): the pluperfect 'he had read'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "mentirosos", f: "mentiros- + -os → mentiroso (lying), masculine plural to match 'libros'."}
        note: "The narrator breaks in with his own exclamation, as if overwhelmed; it is the closest Cervantes comes in this chapter to admiring the madman's eloquence while naming its source."
      - es: "Estaba Sancho Panza colgado de sus palabras, sin hablar ninguna, y, de cuando en cuando, volvía la cabeza a ver si veía los caballeros y gigantes que su amo nombraba; y, como no descubría a ninguno, le dijo:"
        literal: "Was Sancho Panza hung from his words, without speaking any, and, from when to when, he-turned the head to see if he-saw the knights and giants that his master named; and, as not he-discovered [to] any, to-him he-said:"
        ormsby: "Sancho Panza hung upon his words without speaking, and from time to time turned to try if he could see the knights and giants his master was describing, and as he could not make out one of them he said to him:"
        vocab:
          - {w: "colgado de", d: "hanging on (someone's words)"}
          - {w: "de cuando en cuando", d: "from time to time"}
          - {w: "volver la cabeza", d: "to turn one's head"}
          - {w: "descubrir", d: "to make out, catch sight of"}
          - {w: "como", d: "at the start of a clause: since, as"}
        diagram:
          - s: "Estaba Sancho Panza colgado de sus palabras"
            r: "main verb 1: Sancho Panza hung on his words"
            under:
              - {s: "sin hablar ninguna", r: "how: without speaking a single one"}
          - s: "volvía la cabeza"
            r: "main verb 2 (after 'y'): he kept turning his head"
            under:
              - {s: "de cuando en cuando", r: "when: from time to time"}
              - s: "a ver si veía los caballeros y gigantes"
                r: "purpose: to see whether he could see the knights and giants"
                under:
                  - {s: "que su amo nombraba", r: "describes 'caballeros y gigantes': that his master was naming"}
          - s: "le dijo:"
            r: "main verb 3 (after 'y'): he said to him"
            under:
              - {s: "como no descubría a ninguno", r: "why: since he could not make out a single one"}
        forms:
