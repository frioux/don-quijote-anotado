                  - s: "con que suelen suplir semejantes faltas los tan malaventurados andantes caballeros"
                    r: "describes 'yerbas': with which such unlucky knights-errant usually make up for such shortages"
                    under:
                      - {s: "como vuestra merced es", r: "comparison: as your worship is"}
          - {s: "respondió Sancho", r: "narrator's tag: Sancho answered"}
        forms:
