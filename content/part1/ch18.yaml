          - {w: "Viéndole", f: "viendo, the gerund of ver (to see), + le (him), with an accent added."}
          - {w: "caído", f: "participle of caer (to fall), masculine for Don Quijote."}
          - {w: "se habían ido", f: "habían (haber, imperfect, they: había, habías, había, habíamos, habíais, habían) + ido, participle of ir (to go), with 'se': 'had gone off'."}
          - {w: "bajó", f: "baj- + -ó → bajar (to go down), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "llegóse, hallóle", f: "lleg- + -ó + se → llegarse (to go up to) and hall- + -ó + le → hallar (to find), preterite, he, with the pronoun stuck on the end; modern 'se llegó', 'le halló'. Same -ar preterite. Cervantes hangs pronouns on the end of a verb that opens its clause."}
