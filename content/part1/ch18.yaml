          - {w: "tomara", f: "tom- + -ara → tomar (to take), imperfect subjunctive (-ra form), I, used as a conditional: 'I would rather take'. The -ra form of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran."}
          - {w: "cuantas", f: "cuant- + -as → cuanto (as many as), feminine plural to match 'yerbas'."}
