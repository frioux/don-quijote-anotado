part: 1
chapter: 18
title_es: "Capítulo XVIII. Donde se cuentan las razones que pasó Sancho Panza con su señor Don Quijote, con otras aventuras dignas de ser contadas"
title_en: "In which is related the discourse Sancho Panza held with his master, Don Quixote, and other adventures worth relating"
paragraphs:
  - sentences:
      - es: "Llegó Sancho a su amo marchito y desmayado; tanto, que no podía arrear a su jumento. Cuando así le vio don Quijote, le dijo:"
        literal: "Arrived Sancho at his master withered and fainting; so-much, that not he-could drive-on [to] his donkey. When thus him saw Don Quijote, to-him he-said:"
        ormsby: "Sancho reached his master so limp and faint that he could not urge on his beast. When Don Quixote saw the state he was in he said,"
        vocab:
          - {w: "amo", d: "master (of a servant)"}
          - {w: "marchito", d: "withered, wilted, drooping; of a person, limp and worn out"}
          - {w: "desmayado", d: "faint, weak, drained (from desmayarse, to faint)"}
          - {w: "tanto, que", d: "so much so that"}
          - {w: "arrear", d: "to drive on, urge forward (an animal), with shouts or a stick"}
          - {w: "jumento", d: "donkey, ass"}
        diagram:
          - s: "Llegó"
            r: "main verb 1: arrived"
            under:
              - {s: "Sancho", r: "subject"}
              - {s: "a su amo", r: "where to: to his master"}
              - s: "marchito y desmayado"
                r: "how he was: withered and faint"
                under:
                  - {s: "tanto, que no podía arrear a su jumento", r: "result: so much that he could not drive his donkey on"}
          - s: "le dijo:"
            r: "main verb 2 (new sentence): he (Don Quijote) said to him"
            under:
              - {s: "Cuando así le vio don Quijote", r: "when: when Don Quijote saw him like that"}
        forms:
          - {w: "Llegó", f: "lleg- + -ó → llegar (to arrive), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. The verb comes first and the subject 'Sancho' after it, the usual order for narrative in Cervantes."}
          - {w: "marchito y desmayado", f: "participles used as adjectives, masculine singular to match 'Sancho': marchito (withered), desmayado (fainting, from desmayar, to faint)."}
          - {w: "podía", f: "pod- + -ía → poder (to be able), imperfect, he: 'could'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "a su jumento", f: "the 'a' that marks a person as the object is extended to the donkey, as to a pet or a named beast."}
          - {w: "le vio", f: "vio → ver (to see), preterite, he, with 'le' (him). ver's preterite is short and has no accent: vi, viste, vio, vimos, visteis, vieron. 'le' for a male person as direct object is Castilian usage (leísmo); strict grammar wants 'lo'."}
          - {w: "le dijo", f: "dij- + -o → decir (to say), preterite, he, with 'le' (to him). Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Ahora acabo de creer, Sancho bueno, que aquel castillo o venta, de que es encantado sin duda; porque aquellos que tan atrozmente tomaron pasatiempo contigo, ¿qué podían ser sino fantasmas y gente del otro mundo?"
        literal: "— Now I-finish of believing, Sancho good, that that castle or inn, of which it-is enchanted without doubt; because those who so atrociously took pastime with-you, what could-they be but phantoms and people of-the other world?"
        ormsby: "“I have now come to the conclusion, good Sancho, that this castle or inn is beyond a doubt enchanted, because those who have so atrociously diverted themselves with thee, what can they be but phantoms or beings of another world?"
        vocab:
          - {w: "acabar de creer", d: "to be finally convinced; 'acabar de' + infinitive = to finish doing, to have just done"}
          - {w: "venta", d: "roadside inn; the one Don Quijote keeps taking for a castle"}
          - {w: "de que", d: "here a loose 'that'; the sentence changes course and the 'de' is left hanging (an anacoluthon Cervantes left in)"}
          - {w: "encantado", d: "enchanted, under a spell"}
          - {w: "atrozmente", d: "atrociously, outrageously"}
          - {w: "tomar pasatiempo con", d: "to amuse oneself with, make sport of"}
          - {w: "fantasma", d: "phantom, ghost; in Cervantes the word is often feminine ('las fantasmas')"}
          - {w: "gente del otro mundo", d: "people from the other world, spirits of the dead"}
        diagram:
          - s: "acabo de creer"
            r: "main verb: I have finally come to believe"
            under:
              - {s: "Ahora", r: "when: now"}
              - {s: "Sancho bueno", r: "address: good Sancho"}
              - {s: "que aquel castillo o venta, de que es encantado sin duda", r: "what I believe: that that castle or inn is beyond doubt enchanted (the 'de que' is a slip of syntax)"}
          - s: "¿qué podían ser"
            r: "main verb 2 (after 'porque'): what could they be"
            under:
              - s: "aquellos"
                r: "subject: those people"
                under:
                  - {s: "que tan atrozmente tomaron pasatiempo contigo", r: "describes 'aquellos': who so cruelly made sport of you"}
              - {s: "sino fantasmas y gente del otro mundo?", r: "but what: except phantoms and people from the other world"}
        forms:
          - {w: "acabo", f: "acab- + -o → acabar (to finish), present, I. 'acabar de' + infinitive: here 'I have just come to'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "Sancho bueno", f: "the adjective after the name, 'Sancho the good'; Don Quijote uses it as a title, like 'Alfonso el Sabio'."}
          - {w: "aquel", f: "'that' (far away), masculine to match 'castillo'."}
          - {w: "es encantado", f: "es (ser, present, it: soy, eres, es, somos, sois, son) + encantado, participle of encantar (to enchant): old Spanish uses 'ser' where modern Spanish says 'está encantado'."}
          - {w: "tomaron", f: "tom- + -aron → tomar (to take), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "contigo", f: "con + ti fused into one word: 'with you' (also conmigo, consigo)."}
          - {w: "podían", f: "pod- + -ían → poder (to be able), imperfect, they: 'could'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "del", f: "de + el."}
        note: "The sentence has no grammatical main clause for 'aquel castillo o venta': Don Quijote starts 'that that castle', interrupts himself with 'de que', and the thought runs on. Editors print it as Cervantes left it."
      - es: "Y confirmo esto por haber visto que, cuando estaba por las bardas del corral mirando los actos de tu triste tragedia, no me fue posible subir por ellas, ni menos pude apearme de Rocinante, porque me debían de tener encantado;"
        literal: "And I-confirm this by having seen that, when I-was by the fence-tops of-the yard watching the acts of your sad tragedy, not to-me it-was possible to-climb by them, nor less could-I dismount-myself from Rocinante, because me they-must-have had enchanted;"
        ormsby: "and I hold this confirmed by having noticed that when I was by the wall of the yard witnessing the acts of thy sad tragedy, it was out of my power to mount upon it, nor could I even dismount from Rocinante, because they no doubt had me enchanted;"
        vocab:
          - {w: "confirmar", d: "to confirm"}
          - {w: "bardas", d: "the thatch or brushwood capping of a mud wall; by extension the wall of a yard"}
          - {w: "corral", d: "yard, enclosure for animals behind the inn"}
          - {w: "actos", d: "acts (of a play); Don Quijote calls the blanketing a tragedy in acts"}
          - {w: "ni menos", d: "nor even, still less"}
          - {w: "apearse", d: "to dismount, get down"}
          - {w: "deber de", d: "must (supposition): 'they must have had me enchanted'"}
        diagram:
          - s: "Y confirmo esto"
            r: "main verb: and I confirm this"
            under:
              - s: "por haber visto"
                r: "how: by having seen"
                under:
                  - s: "que, cuando estaba por las bardas del corral mirando los actos de tu triste tragedia, no me fue posible subir por ellas"
                    r: "what I saw, 1: that when I stood by the yard wall watching your sad tragedy I could not climb over it"
                  - {s: "ni menos pude apearme de Rocinante", r: "what I saw, 2: nor could I even get off Rocinante"}
                  - {s: "porque me debían de tener encantado", r: "why: because they must have had me under a spell"}
        forms:
          - {w: "confirmo", f: "confirm- + -o → confirmar (to confirm), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "haber visto", f: "haber (to have) + visto, the irregular participle of ver (to see): the past infinitive 'having seen', after 'por'."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, I: 'I was'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "mirando", f: "gerund of mirar (to watch): 'watching', with 'estaba'."}
          - {w: "tu triste", f: "tu, 'your' (for tú), no accent; triste (sad) has one form for both genders."}
          - {w: "me fue posible", f: "fu- + -e → ser (to be), preterite, it: 'it was possible for me'. ser's preterite is irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "pude", f: "pud- + -e → poder (to be able), preterite, I. Irregular stem: pude, pudiste, pudo, pudimos, pudisteis, pudieron."}
          - {w: "apearme", f: "apear (to dismount) + me (myself), the pronoun hung on the infinitive."}
          - {w: "debían de tener", f: "deb- + -ían → deber (must), imperfect, they, + 'de' + tener (to have): 'they must have had'. 'deber de' marks a guess. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
      - es: "que te juro, por la fe de quien soy, que si pudiera subir o apearme, que yo te hiciera vengado de manera que aquellos follones y malandrines se acordaran de la burla para siempre, aunque en ello supiera contravenir a las leyes de la caballería, que, como ya muchas veces te he dicho, no consienten que caballero ponga mano contra quien no lo sea, si no fuere en defensa de su propria vida y persona, en caso de urgente y gran necesidad."
        literal: "for to-you I-swear, by the faith of who I-am, that if I-could climb or dismount-myself, that I you would-have-made avenged in-manner that those scoundrels and rogues would-remember of the trick for always, although in it I-knew to-contravene [to] the laws of the chivalry, which, as already many times to-you I-have said, not allow that knight put hand against who not it may-be, if not it-were in defense of his own life and person, in case of urgent and great necessity."
        ormsby: "for I swear to thee by the faith of what I am that if I had been able to climb up or dismount, I would have avenged thee in such a way that those braggart thieves would have remembered their freak forever, even though in so doing I knew that I contravened the laws of chivalry, which, as I have often told thee, do not permit a knight to lay hands on him who is not one, save in case of urgent and great necessity in defence of his own life and person.”"
        vocab:
          - {w: "jurar", d: "to swear"}
          - {w: "por la fe de quien soy", d: "by the faith of who I am, on my honor as the man I am"}
          - {w: "hacer vengado", d: "to see someone avenged"}
          - {w: "follón", d: "scoundrel, braggart coward; a stock insult of the chivalry books"}
          - {w: "malandrín", d: "rogue, villain; another chivalric insult"}
          - {w: "acordarse de", d: "to remember"}
          - {w: "burla", d: "trick, joke played on someone, mockery"}
          - {w: "contravenir a", d: "to contravene, go against (a law)"}
          - {w: "consentir", d: "to allow, permit"}
          - {w: "poner mano contra", d: "to lay hands on, raise a weapon against"}
          - {w: "propria", d: "= propia, own; the Latinizing spelling with 'r'"}
        diagram:
          - s: "que te juro"
            r: "main verb: for I swear to you"
            under:
              - {s: "por la fe de quien soy", r: "by what: by the faith of who I am"}
              - s: "que yo te hiciera vengado"
                r: "what I swear: that I would have had you avenged"
                under:
                  - {s: "si pudiera subir o apearme", r: "condition: if I had been able to climb or dismount"}
                  - s: "de manera que aquellos follones y malandrines se acordaran de la burla para siempre"
                    r: "result: so that those scoundrels would remember the trick forever"
                  - s: "aunque en ello supiera contravenir a las leyes de la caballería"
                    r: "concession: even knowing I was breaking the laws of chivalry"
                    under:
                      - s: "que, como ya muchas veces te he dicho, no consienten"
                        r: "describes 'leyes': which, as I have told you, do not allow"
                        under:
                          - {s: "que caballero ponga mano contra quien no lo sea", r: "what they forbid: that a knight raise his hand against one who is not"}
                          - {s: "si no fuere en defensa de su propria vida y persona, en caso de urgente y gran necesidad", r: "exception: unless in defense of his own life, in urgent need"}
        forms:
          - {w: "juro", f: "jur- + -o → jurar (to swear), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "soy", f: "ser (to be), present, I. soy, eres, es, somos, sois, son."}
          - {w: "pudiera", f: "pud- + -iera → poder (to be able), imperfect subjunctive (-ra form), I: 'if I could / had been able'. Built on the preterite pudieron: pudiera, pudieras, pudiera, pudiéramos, pudierais, pudieran. Subjunctive after 'si' for an unreal condition."}
          - {w: "hiciera", f: "hic- + -iera → hacer (to make), imperfect subjunctive (-ra form), I, used as a conditional: 'I would have made'. Built on the preterite hicieron: hiciera, hicieras, hiciera, hiciéramos, hicierais, hicieran. Cervantes uses the -ra form where modern Spanish says 'habría hecho'."}
          - {w: "vengado", f: "participle of vengar (to avenge), masculine to match 'te' (Sancho): 'avenged'."}
          - {w: "se acordaran", f: "acord- + -aran → acordarse (to remember), imperfect subjunctive (-ra form), they, with 'se'. Subjunctive in a result clause after 'de manera que' in a hypothetical. The -ra form of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran."}
          - {w: "supiera", f: "sup- + -iera → saber (to know), imperfect subjunctive (-ra form), I. Built on the preterite supieron: supiera, supieras, supiera, supiéramos, supierais, supieran. Still part of the unreal 'if I could' world."}
          - {w: "te he dicho", f: "he (haber, present, I: he, has, ha, hemos, habéis, han) + dicho, the irregular participle of decir (to say): 'I have told you'."}
          - {w: "consienten", f: "consient- + -en → consentir (to allow), present, they (the laws). The stem e becomes ie when stressed: consiento, consientes, consiente, consentimos, consentís, consienten."}
          - {w: "ponga", f: "pong- + -a → poner (to put), present subjunctive, he (a knight). Subjunctive after 'no consienten que'. poner's present subjunctive takes the g of 'pongo': ponga, pongas, ponga, pongamos, pongáis, pongan."}
          - {w: "lo sea", f: "ser (to be), present subjunctive, he: sea, seas, sea, seamos, seáis, sean. 'lo' stands for 'caballero': 'who is not one'. Subjunctive because the person is indefinite."}
          - {w: "fuere", f: "fu- + -ere → ser (to be), future subjunctive, it: 'unless it were'. fuere, fueres, fuere, fuéremos, fuereis, fueren. Cervantes uses it after 'si' for an open future case; modern Spanish uses the present 'si no es'."}
          - {w: "su propria", f: "propria = propia (own), feminine to match 'vida'."}
          - {w: "gran", f: "grande (great) clipped before a singular noun ('necesidad')."}
  - sentences:
      - es: "— También me vengara yo si pudiera, fuera o no fuera armado caballero, pero no pude;"
        literal: "— Also myself would-have-avenged I if I-could, were or not were [I] armed knight, but not I-could;"
        ormsby: "“I would have avenged myself too if I could,” said Sancho, “whether I had been dubbed knight or not, but I could not;"
        vocab:
          - {w: "vengarse", d: "to avenge oneself, take revenge"}
          - {w: "fuera o no fuera", d: "whether or not (I were)"}
          - {w: "armado caballero", d: "dubbed a knight; 'armar caballero' is the ceremony of knighting"}
        diagram:
          - s: "También me vengara yo"
            r: "main verb: I too would have avenged myself"
            under:
              - {s: "si pudiera", r: "condition: if I could"}
              - {s: "fuera o no fuera armado caballero", r: "concession: whether or not I had been dubbed a knight"}
          - {s: "pero no pude", r: "main verb 2: but I could not"}
        forms:
          - {w: "me vengara", f: "veng- + -ara → vengarse (to avenge oneself), imperfect subjunctive (-ra form), I, with 'me' (myself), used as a conditional: 'I would have avenged myself'. The -ra form of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran. Cervantes uses the -ra form where modern Spanish says 'me habría vengado'."}
          - {w: "pudiera", f: "pud- + -iera → poder (to be able), imperfect subjunctive (-ra form), I, after 'si' for an unreal condition. Built on the preterite pudieron: pudiera, pudieras, pudiera, pudiéramos, pudierais, pudieran."}
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), I: 'were I'. ser's -ra form: fuera, fueras, fuera, fuéramos, fuerais, fueran. 'fuera o no fuera' is 'whether or not I were'."}
          - {w: "armado", f: "participle of armar (to arm; 'armar caballero' = to dub a knight), masculine to match Sancho."}
          - {w: "pude", f: "pud- + -e → poder (to be able), preterite, I. Irregular stem: pude, pudiste, pudo, pudimos, pudisteis, pudieron."}
      - es: "aunque tengo para mí que aquellos que se holgaron conmigo no eran fantasmas ni hombres encantados, como vuestra merced dice, sino hombres de carne y hueso como nosotros;"
        literal: "although I-hold for myself that those who amused-themselves with-me not were phantoms nor men enchanted, as your worship says, but men of flesh and bone like us;"
        ormsby: "though for my part I am persuaded those who amused themselves with me were not phantoms or enchanted men, as your worship says, but men of flesh and bone like ourselves;"
        vocab:
          - {w: "tener para sí", d: "to be privately convinced, to hold the opinion"}
          - {w: "holgarse con", d: "to amuse oneself with, have fun at the expense of"}
          - {w: "vuestra merced", d: "your worship; the polite address that became 'usted'; Sancho always uses it to his master"}
          - {w: "de carne y hueso", d: "of flesh and bone, i.e. real, mortal"}
        diagram:
          - s: "aunque tengo para mí"
            r: "main verb: though I am convinced"
            under:
              - s: "que aquellos que se holgaron conmigo no eran fantasmas ni hombres encantados"
                r: "what I think: that those who had their fun with me were not phantoms or enchanted men"
                under:
                  - {s: "como vuestra merced dice", r: "aside: as your worship says"}
                  - {s: "sino hombres de carne y hueso como nosotros", r: "but what: but men of flesh and bone like us"}
        forms:
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "mí", f: "'me' after a preposition ('para mí'); the accent tells it from 'mi' (my)."}
          - {w: "aquellos", f: "'those' (far away), masculine plural, used as a pronoun: those men."}
          - {w: "se holgaron", f: "holg- + -aron → holgarse (to amuse oneself), preterite, they, with 'se'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "conmigo", f: "con + mí fused into one word: 'with me'."}
          - {w: "eran", f: "ser (to be), imperfect, they. ser's imperfect is irregular: era, eras, era, éramos, erais, eran."}
          - {w: "encantados", f: "participle of encantar (to enchant), masculine plural to match 'hombres'."}
          - {w: "dice", f: "dic- + -e → decir (to say), present, he/she ('vuestra merced' takes the he/she form). digo, dices, dice, decimos, decís, dicen."}
      - es: "y todos, según los oí nombrar cuando me volteaban, tenían sus nombres:"
        literal: "and all, according-as them I-heard named when me they-tossed, had their names:"
        ormsby: "and they all had their names, for I heard them name them when they were tossing me,"
        vocab:
          - {w: "según", d: "as, according to what; here 'as I heard'"}
          - {w: "oír nombrar", d: "to hear (someone) named"}
          - {w: "voltear", d: "to toss, turn over; here the blanket-tossing of the last chapter"}
        diagram:
          - s: "tenían sus nombres:"
            r: "main verb: they had their names"
            under:
              - {s: "y todos", r: "subject: and all of them"}
              - s: "según los oí nombrar"
                r: "how I know: as I heard them called"
                under:
                  - {s: "cuando me volteaban", r: "when: while they tossed me"}
        forms:
          - {w: "los oí nombrar", f: "o- + -í → oír (to hear), preterite, I, with 'los' (them): 'I heard them'. oír's preterite: oí, oíste, oyó, oímos, oísteis, oyeron. nombrar (to name) is the infinitive after a verb of perceiving: 'heard them named'."}
          - {w: "me volteaban", f: "volte- + -aban → voltear (to toss), imperfect, they, with 'me' (me). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "tenían", f: "ten- + -ían → tener (to have), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "sus", f: "'their', plural to match 'nombres'."}
      - es: "que el uno se llamaba Pedro Martínez, y el otro Tenorio Hernández, y el ventero oí que se llamaba Juan Palomeque el Zurdo."
        literal: "for the one himself called Pedro Martínez, and the other Tenorio Hernández, and the innkeeper I-heard that himself called Juan Palomeque the Left-handed."
        ormsby: "and one was called Pedro Martinez, and another Tenorio Hernández, and the innkeeper, I heard, was called Juan Palomeque the Left-handed;"
        vocab:
          - {w: "el uno ... el otro", d: "the one ... the other"}
          - {w: "llamarse", d: "to be called, be named"}
          - {w: "ventero", d: "innkeeper"}
          - {w: "zurdo", d: "left-handed; 'el Zurdo' is a nickname, as village people were known by their quirks"}
        diagram:
          - s: "que el uno se llamaba Pedro Martínez"
            r: "main verb 1 (explaining 'sus nombres'): one was called Pedro Martínez"
          - {s: "y el otro Tenorio Hernández", r: "main verb 2 (verb understood): and the other Tenorio Hernández"}
          - s: "y el ventero oí"
            r: "main verb 3: and the innkeeper, I heard"
            under:
              - {s: "que se llamaba Juan Palomeque el Zurdo", r: "what I heard: that he was called Juan Palomeque the Left-handed"}
        forms:
          - {w: "se llamaba", f: "llam- + -aba → llamarse (to be called), imperfect, he, with 'se' (himself). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "oí", f: "o- + -í → oír (to hear), preterite, I. oí, oíste, oyó, oímos, oísteis, oyeron. 'el ventero' is pulled to the front of its clause for emphasis; the grammar is 'oí que el ventero se llamaba'."}
