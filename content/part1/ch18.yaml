  - sentences:
      - es: "— Señor, encomiendo al diablo hombre, ni gigante, ni caballero de cuantos vuestra merced dice parece por todo esto; a lo menos, yo no los veo; quizá todo debe ser encantamento, como las fantasmas de anoche."
        literal: "— Sir, I-commend to-the devil [if] man, nor giant, nor knight of as-many-as your worship says appears in all this; at the least, I not them see; perhaps all must be enchantment, like the phantoms of last-night."
        ormsby: "“Señor, devil take it if there’s a sign of any man you talk of, knight or giant, in the whole thing; maybe it’s all enchantment, like the phantoms last night.”"
        ormsby_match: false
        vocab:
          - {w: "encomiendo al diablo", d: "I commend to the devil, devil take it; here a strong denial: 'devil a man appears'"}
          - {w: "parecer", d: "here to appear, show up (not 'to seem')"}
          - {w: "por todo esto", d: "anywhere around here"}
          - {w: "a lo menos", d: "at least"}
          - {w: "quizá", d: "perhaps"}
          - {w: "encantamento", d: "= encantamiento, enchantment"}
          - {w: "anoche", d: "last night"}
        diagram:
          - s: "encomiendo al diablo"
            r: "main verb 1 (an oath): devil take it"
            under:
              - {s: "Señor", r: "address"}
              - s: "hombre, ni gigante, ni caballero de cuantos vuestra merced dice parece por todo esto"
                r: "what is denied: not a man, giant or knight of all your worship names appears anywhere here"
          - {s: "a lo menos, yo no los veo", r: "main verb 2: at least I do not see them"}
          - s: "quizá todo debe ser encantamento"
            r: "main verb 3: perhaps it is all enchantment"
            under:
              - {s: "como las fantasmas de anoche", r: "comparison: like the phantoms of last night"}
        forms:
          - {w: "encomiendo", f: "encomiend- + -o → encomendar (to commend), present, I. The stem e becomes ie when stressed: encomiendo, encomiendas, encomienda, encomendamos, encomendáis, encomiendan."}
          - {w: "al", f: "a + el."}
          - {w: "dice", f: "dic- + -e → decir (to say), present, he/she ('vuestra merced'). digo, dices, dice, decimos, decís, dicen."}
          - {w: "parece", f: "parec- + -e → parecer (to appear), present, it. Verbs in -cer add a z in the I form: parezco, pareces, parece, parecemos, parecéis, parecen."}
          - {w: "los veo", f: "ve- + -o → ver (to see), present, I, with 'los' (them). veo, ves, ve, vemos, veis, ven."}
          - {w: "debe ser", f: "deb- + -e → deber (must), present, it, + ser (to be): 'must be'. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "las fantasmas", f: "fantasma treated as feminine, as often in Cervantes; modern Spanish says 'los fantasmas'."}
        note: "Sancho's 'encomiendo al diablo hombre ... parece' is a muddled oath: he means 'devil take me if any man appears'. Ormsby leaves out 'at least I do not see them', so his English is a loose match."
