          - {w: "faltaran", f: "falt- + -aran → faltar (to be lacking), imperfect subjunctive (-ra form), they: 'if ... were lacking'. The -ra form of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran."}
