summary: |
  Sancho rides out of the inn yard limp from his blanket-tossing. Don Quijote insists the inn is enchanted, since a spell kept him from climbing the wall to avenge his squire. Sancho answers that the men who tossed him had ordinary names, among them the innkeeper Juan Palomeque the Left-handed, and that the wisest thing would be to go home for the harvest. Don Quijote promises to find a sword that no enchantment can resist, like that of the Knight of the Burning Sword; Sancho expects it would only help knights, like the balsam.

  Two great clouds of dust appear on the road from opposite directions. Don Quijote declares they are two armies about to meet: the emperor Alifanfarón of Trapobana and Pentapolín of the Bare Arm, whose Christian daughter the pagan emperor wants to marry. From a hillock he names the knights of both sides, their arms, devices and mottoes, and then the nations of each army in a long, learned catalogue. Sancho sees nothing and hears only bleating. The armies are two flocks of sheep.

  Don Quijote charges into the flock and spears the sheep. The shepherds pelt him with stones from their slings: one breaks two of his ribs, and another smashes his flask of balsam and knocks out several teeth. He falls from his horse. The shepherds gather their flock and their dead sheep, more than seven, and leave quickly. Don Quijote blames the enchanter who persecutes him for turning the armies into sheep.

  When Sancho looks into his master's mouth, the balsam takes effect and Don Quijote vomits into Sancho's beard; Sancho vomits back over him. Sancho finds his saddlebags gone and thinks of going home. Don Quijote consoles him with proverbs and the Gospel, Sancho counts his master's missing teeth, and they set off slowly along the highway to look for shelter.
context: |
  Sheep, shepherds and money. The flocks are the great migrating herds of Castile, moved along fixed routes between summer and winter pastures and protected by the powerful sheep-owners' guild, the Mesta. Shepherds carried slings as their everyday weapon against wolves and stray animals, and they knew how to use them. Their quick retreat with the dead sheep is practical: a dead knight on the road would mean questions from the authorities. Sancho's own losses are of the same practical kind: his saddlebags with food in them, the wages he has earned, and the island he was promised.

  Chivalry and epic. The chapter parodies two things at once. The knights Don Quijote names from the hillock, with their colors, shields and mottoes, come from the romances of chivalry and from heraldry: devices like the lion at a maiden's feet, the blank shield of a new knight, and the motto on a scroll are standard. The names themselves are nonsense built on ordinary words (Miau the cat, Alfeñiquén the sugar-paste, Boliche the bowling ball). The second part, the list of nations, imitates the catalogue of armies in classical epic, with learned epithets from Latin poetry: the Parthians who fight while fleeing, the gold-bearing Pactolus, Arabia Felix, the Guadiana that runs underground. The second army is Spain itself, river by river. Ormsby's notes explain the Tartessian plains and the underground course of the Guadiana, and point out that the 'Knight of the Burning Sword' is Amadís de Grecia, not Amadís de Gaula. He also suggests that Pentapolín's bare arm echoes Suero de Quiñones, the real knight who defended the bridge at Órbigo in 1434.

  The narrator's games. The narrator stays dry while his hero rants, then breaks in with 'Válame Dios' at the length of the catalogue. He calls the sling-stones 'peladillas' and 'almendras', sugared almonds, as if sweets were being tossed at a hero. The cause of the battle is also a joke: Don Quijote sees armies because his head is full of books, and the narrator says so plainly. Don Quijote's explanation afterward, that an enchanter changed the armies into sheep, protects his fantasy from any test, and he even invites Sancho to follow the sheep and watch them turn back into men.

  Medicine and religion. The balsam of Fierabrás, which Don Quijote brewed in the previous chapter and claims heals every wound, works here only as a strong emetic. Missing teeth were a serious loss at a time when dentistry meant pulling them, and Don Quijote's 'a mouth without molars is a mill without a stone' is an old proverb. His comfort to Sancho mixes proverbs ('no man is more than another unless he does more') with the Sermon on the Mount, God who sends rain on the just and the unjust (Matthew 5:45), which leads Sancho to say he would make a better preacher. The claim that 'the lance never blunted the pen' is the Renaissance theme of arms and letters, which Ormsby lists among the book's proverbs. Dioscorides' herbal, in the Spanish translation annotated by Dr. Andrés Laguna, was the standard handbook of medicinal plants.

  Names. The men who tossed Sancho, Pedro Martínez and Tenorio Hernández, have the plainest Spanish names, and the innkeeper is Juan Palomeque el Zurdo, a nickname of the village kind. Against them stand Don Quijote's invented emperors: Alifanfarón, which suggests 'fanfarrón' (braggart), and Pentapolín. The text spells them several ways (Alifanfarón, Alefanfarón, Alifanfuón; Pentapolén, Pentapolín), and the lady appears as Miulina where most editions print Miaulina. Trapobana is Taprobane, the old name for Ceylon, and the Garamantes are a desert people from the ancient geographers.

  Reading Cervantes' Spanish. The archaisms seen in earlier chapters continue: mesmo, asimesmo, ansí, agora, priesa, propria, yerba, atambores, eleción, and the fused 'de' forms (desta, deste, dese, dél, dellas, destotro, estotra). Pronouns attach to verbs that open a clause (Hiciéronlo, Diole, Llegáronse, Maldíjose, Levantóse, fuese meaning 'se fue'). Infinitives with a pronoun change -rl- to -ll- (alanceallas, saludalle, entretenelle, divertille). There are many future subjunctives (trujere, fuere, pudiere, diere, quisieres), and the -ra form often serves as a conditional (vengara, hiciera, tomara, quisiera). 'Haber de' and 'tener de' express obligation or the future ('se ha de ver', 'tengo de hacer'), and 'deber de' expresses a guess. Watch for 'puesto que' (although), 'curarse de' (to care about), 'suceso' (event), 'desgracia' (misfortune), 'soberbio' (proud), 'además' (exceedingly) and the double sense of 'caballería', both chivalry and a riding animal. The Gutenberg text also keeps a misprint, 'Es estos coloquios' for 'En estos coloquios'.
