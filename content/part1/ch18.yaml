  - sentences:
      - es: "Ni por ésas volvió don Quijote; antes, en altas voces, iba diciendo: — ¡Ea, caballeros, los que seguís y militáis debajo de las banderas del valeroso emperador Pentapolín del Arremangado Brazo, seguidme todos: veréis cuán fácilmente le doy venganza de su enemigo Alefanfarón de la Trapobana!"
        literal: "Not-even for those turned-back Don Quijote; rather, in loud voices, he-went saying: — Come-on, knights, those who follow and serve under the banners of-the valiant emperor Pentapolín of-the Rolled-up Arm, follow-me all: you-will-see how easily to-him I-give vengeance of his enemy Alefanfarón of the Trapobana!"
        ormsby: "But not for all these entreaties did Don Quixote turn back; on the contrary he went on shouting out, “Ho, knights, ye who follow and fight under the banners of the valiant emperor Pentapolin of the Bare Arm, follow me all; ye shall see how easily I shall give him his revenge over his enemy Alifanfaron of the Trapobana.”"
        vocab:
          - {w: "ni por ésas", d: "not even for all that, in spite of everything"}
          - {w: "antes", d: "rather, on the contrary (after a negative)"}
          - {w: "en altas voces", d: "loudly, at the top of his voice"}
          - {w: "ir diciendo", d: "to keep saying, go along saying"}
          - {w: "¡Ea!", d: "come on! up! (a rallying cry)"}
          - {w: "militar", d: "to serve as a soldier, fight"}
          - {w: "bandera", d: "banner, flag"}
          - {w: "dar venganza de", d: "to give revenge on"}
        diagram:
          - s: "Ni por ésas volvió don Quijote"
            r: "main verb 1: not even for that did Don Quijote turn back"
          - s: "iba diciendo:"
            r: "main verb 2 (after 'antes', rather): he kept saying"
            under:
              - {s: "en altas voces", r: "how: at the top of his voice"}
          - s: "seguidme todos:"
            r: "what he said (command): follow me, all of you"
            under:
              - s: "¡Ea, caballeros, los que seguís y militáis debajo de las banderas del valeroso emperador Pentapolín del Arremangado Brazo"
                r: "address: come on, knights who follow and serve under the banners of the valiant emperor Pentapolín of the Bare Arm"
              - s: "veréis"
                r: "what he said, 2: you will see"
                under:
                  - {s: "cuán fácilmente le doy venganza de su enemigo Alefanfarón de la Trapobana!", r: "what you will see: how easily I give him revenge on his enemy Alefanfarón of Trapobana"}
        forms:
          - {w: "ésas", f: "'those things' (feminine, vague), the pronoun in the idiom 'ni por ésas'; the accent marks the old spelling of the pronoun."}
          - {w: "volvió", f: "volv- + -ió → volver (to turn back), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "altas", f: "alt- + -as → alto (loud, high), feminine plural to match 'voces'."}
          - {w: "iba diciendo", f: "ib- + -a → ir (to go), imperfect, he, + diciendo, the gerund of decir (to say): 'ir' + gerund = to keep doing. ir's imperfect is irregular: iba, ibas, iba, íbamos, ibais, iban."}
          - {w: "seguís y militáis", f: "segu- + -ís → seguir (to follow) and milit- + -áis → militar (to serve), present, you all (vosotros). The present of -ir verbs: -o, -es, -e, -imos, -ís, -en; of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "del", f: "de + el (twice)."}
          - {w: "seguidme", f: "seguid, the you-all (vosotros) command of seguir (to follow), + me (me). The vosotros command replaces the -r of the infinitive with -d: seguir → seguid."}
          - {w: "veréis", f: "ver + -éis → ver (to see), future, you all. The future is the whole infinitive + -é, -ás, -á, -emos, -éis, -án."}
          - {w: "fácilmente", f: "fácil (easy) + -mente: 'easily'; the adjective keeps its accent."}
          - {w: "le doy", f: "doy → dar (to give), present, I, with 'le' (to him, Pentapolín). doy, das, da, damos, dais, dan. The present stands for an action about to happen."}
      - es: "Esto diciendo, se entró por medio del escuadrón de las ovejas, y comenzó de alanceallas con tanto coraje y denuedo como si de veras alanceara a sus mortales enemigos."
        literal: "This saying, he-entered into middle of-the squadron of the ewes, and began of spearing-them with so-much courage and daring as if truly he-were-spearing [to] his mortal enemies."
        ormsby: "So saying, he dashed into the midst of the squadron of ewes, and began spearing them with as much spirit and intrepidity as if he were transfixing mortal enemies in earnest."
        vocab:
          - {w: "entrarse por", d: "to charge into, plunge into"}
          - {w: "por medio de", d: "through the middle of"}
          - {w: "comenzar de", d: "= comenzar a, to begin to (older construction)"}
          - {w: "alancear", d: "to spear, run through with a lance"}
          - {w: "alanceallas", d: "= alancearlas, to spear them; -rl- becomes -ll- in old Spanish"}
          - {w: "coraje", d: "spirit, fury, courage"}
          - {w: "denuedo", d: "daring, boldness"}
          - {w: "de veras", d: "really, in earnest"}
        diagram:
          - s: "se entró por medio del escuadrón de las ovejas"
            r: "main verb 1: he charged into the midst of the squadron of ewes"
            under:
              - {s: "Esto diciendo", r: "when: saying this"}
          - s: "y comenzó de alanceallas"
            r: "main verb 2: and began to spear them"
            under:
              - s: "con tanto coraje y denuedo"
                r: "how: with as much fury and daring"
                under:
                  - {s: "como si de veras alanceara a sus mortales enemigos", r: "comparison: as if he were really spearing his mortal enemies"}
        forms:
          - {w: "Esto diciendo", f: "diciendo, the gerund of decir (to say), with its object 'esto' put first."}
          - {w: "se entró", f: "entr- + -ó → entrarse (to charge in), preterite, he, with 'se'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "comenzó", f: "comenz- + -ó → comenzar (to begin), preterite, he. Same -ar preterite."}
          - {w: "alanceallas", f: "alancear (to spear) + las (them, the ewes), with the r of the infinitive turned into l before the pronoun: alancearlas → alanceallas, an old sound change."}
          - {w: "tanto", f: "tant- + -o → tanto (as much), masculine to match 'coraje'; 'tanto ... como' = as much ... as."}
          - {w: "alanceara", f: "alance- + -ara → alancear (to spear), imperfect subjunctive (-ra form), he. 'como si' always takes the imperfect subjunctive. The -ra form of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran."}
          - {w: "sus mortales", f: "sus, 'his', plural; mortal in the plural, both to match 'enemigos'."}
      - es: "Los pastores y ganaderos que con la manada venían dábanle voces que no hiciese aquello; pero, viendo que no aprovechaban, desciñéronse las hondas y comenzaron a saludalle los oídos con piedras como el puño."
        literal: "The shepherds and herdsmen who with the flock were-coming gave-him shouts that not he-should-do that; but, seeing that not it-availed, they-ungirded-themselves the slings and began to greet-him the ears with stones like the fist."
        ormsby: "The shepherds and drovers accompanying the flock shouted to him to desist; seeing it was no use, they ungirt their slings and began to salute his ears with stones as big as one’s fist."
        vocab:
          - {w: "pastor", d: "shepherd"}
          - {w: "ganadero", d: "herdsman, drover, stock-owner"}
          - {w: "dar voces", d: "to shout"}
          - {w: "aprovechar", d: "to be of use, avail"}
          - {w: "desceñirse", d: "to ungird, take off what is tied round the waist"}
          - {w: "honda", d: "sling (for throwing stones)"}
          - {w: "saludalle", d: "= saludarle, to greet him; ironic: to 'salute his ears' with stones"}
          - {w: "como el puño", d: "as big as a fist"}
        diagram:
          - s: "dábanle voces"
            r: "main verb 1: shouted at him"
            under:
              - s: "Los pastores y ganaderos"
                r: "subject: the shepherds and herdsmen"
                under:
                  - {s: "que con la manada venían", r: "describes them: who were coming with the flock"}
              - {s: "que no hiciese aquello", r: "what they shouted: that he should stop that"}
          - s: "desciñéronse las hondas"
            r: "main verb 2 (after 'pero'): they untied their slings"
            under:
              - {s: "viendo que no aprovechaban", r: "why: seeing that it did no good"}
          - s: "y comenzaron a saludalle los oídos"
            r: "main verb 3: and began to 'greet' his ears"
            under:
              - {s: "con piedras como el puño", r: "with what: with stones as big as a fist"}
        forms:
          - {w: "venían", f: "ven- + -ían → venir (to come), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "dábanle", f: "d- + -aban + le → dar (to give), imperfect, they, with 'le' (to him) stuck on the end; modern 'le daban'. Cervantes hangs pronouns on the end of a verb that opens its clause. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "hiciese", f: "hic- + -iese → hacer (to do), imperfect subjunctive (-se form), he. Subjunctive because it reports a command in the past. Built on the preterite hicieron: hiciese, hicieses, hiciese, hiciésemos, hicieseis, hiciesen."}
          - {w: "viendo", f: "gerund of ver (to see)."}
          - {w: "aprovechaban", f: "aprovech- + -aban → aprovechar (to avail), imperfect, they (the shouts). Same -aba imperfect."}
          - {w: "desciñéronse", f: "desciñ- + -eron + se → desceñirse (to ungird), preterite, they, with 'se' stuck on the end; modern 'se desciñeron'. The e of the stem becomes i, and after ñ the -ieron ending loses its i: -eron. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "comenzaron", f: "comenz- + -aron → comenzar (to begin), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "saludalle", f: "saludar (to greet) + le (him), with the r turned into l: saludarle → saludalle, an old sound change."}
      - es: "Don Quijote no se curaba de las piedras; antes, discurriendo a todas partes, decía:"
        literal: "Don Quijote not himself cared of the stones; rather, running-about to all parts, he-was-saying:"
        ormsby: "Don Quixote gave no heed to the stones, but, letting drive right and left kept saying:"
        vocab:
          - {w: "curarse de", d: "to care about, heed (not 'to cure')"}
          - {w: "antes", d: "rather, on the contrary"}
          - {w: "discurrir", d: "to run about, rush here and there"}
        diagram:
          - s: "Don Quijote no se curaba de las piedras"
            r: "main verb 1: Don Quijote paid no heed to the stones"
          - s: "decía:"
            r: "main verb 2 (after 'antes', rather): he kept saying"
            under:
              - {s: "discurriendo a todas partes", r: "how: rushing in every direction"}
        forms:
          - {w: "se curaba", f: "cur- + -aba → curarse (to care), imperfect, he, with 'se'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "discurriendo", f: "gerund of discurrir (to run about)."}
          - {w: "todas", f: "tod- + -as → todo (all), feminine plural to match 'partes'."}
          - {w: "decía", f: "dec- + -ía → decir (to say), imperfect, he: 'kept saying'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
  - sentences:
      - es: "— ¿Adónde estás, soberbio Alifanfuón? Vente a mí; que un caballero solo soy, que desea, de solo a solo, probar tus fuerzas y quitarte la vida, en pena de la que das al valeroso Pentapolín Garamanta."
        literal: "— Where are-you, proud Alifanfuón? Come-yourself to me; for a knight alone I-am, who wishes, from alone to alone, to-test your strengths and to-take-from-you the life, in penalty of that which you-give to-the valiant Pentapolín Garamanta."
        ormsby: "“Where art thou, proud Alifanfaron? Come before me; I am a single knight who would fain prove thy prowess hand to hand, and make thee yield thy life a penalty for the wrong thou dost to the valiant Pentapolin Garamanta.”"
        vocab:
          - {w: "adónde", d: "where (old usage, without motion)"}
          - {w: "soberbio", d: "proud, arrogant (not 'superb')"}
          - {w: "venirse a", d: "to come to, come at"}
          - {w: "de solo a solo", d: "one against one, in single combat"}
          - {w: "probar", d: "to test, try"}
          - {w: "en pena de", d: "as punishment for"}
          - {w: "la que das", d: "the [pain] you give; 'la' picks up 'pena'"}
          - {w: "Garamanta", d: "the Garamantian, i.e. king of the Garamantes, used as a surname"}
        diagram:
          - s: "¿Adónde estás"
            r: "main verb 1: where are you"
            under:
              - {s: "soberbio Alifanfuón?", r: "address: proud Alifanfuón"}
          - s: "Vente a mí"
            r: "main verb 2 (command): come at me"
            under:
              - s: "que un caballero solo soy"
                r: "why: for I am a single knight"
                under:
                  - s: "que desea, de solo a solo, probar tus fuerzas y quitarte la vida"
                    r: "describes 'caballero': who wishes, one against one, to test your strength and take your life"
                    under:
                      - {s: "en pena de la que das al valeroso Pentapolín Garamanta", r: "why: as punishment for the pain you give the valiant Pentapolín"}
        forms:
          - {w: "estás", f: "est- + -ás → estar (to be), present, you (tú). estoy, estás, está, estamos, estáis, están."}
          - {w: "Vente", f: "ven, the irregular tú command of venir (to come), + te (yourself): 'come'. The short tú commands: ven, ten, pon, sal, haz, di, ve, sé."}
          - {w: "mí", f: "'me' after a preposition ('a mí'); the accent tells it from 'mi' (my)."}
          - {w: "soy", f: "ser (to be), present, I. soy, eres, es, somos, sois, son."}
          - {w: "desea", f: "dese- + -a → desear (to wish), present, he (the knight, though he means himself). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "tus", f: "'your', plural to match 'fuerzas'."}
          - {w: "quitarte", f: "quitar (to take away) + te (from you), the pronoun hung on the infinitive."}
          - {w: "das", f: "dar (to give), present, you. doy, das, da, damos, dais, dan."}
          - {w: "al", f: "a + el."}
  - sentences:
      - es: "Llegó en esto una peladilla de arroyo, y, dándole en un lado, le sepultó dos costillas en el cuerpo."
        literal: "Arrived at this a sugared-almond of stream, and, giving-him in a side, to-him it-buried two ribs in the body."
        ormsby: "Here came a sugarplum from the brook that struck him on the side and buried a couple of ribs in his body."
        vocab:
          - {w: "en esto", d: "at this point, just then"}
          - {w: "peladilla", d: "sugared almond; 'peladilla de arroyo' = a smooth stream pebble, a joke"}
          - {w: "arroyo", d: "stream, brook"}
          - {w: "dar en", d: "to hit, strike"}
          - {w: "sepultar", d: "to bury"}
          - {w: "costilla", d: "rib"}
        diagram:
          - s: "Llegó en esto una peladilla de arroyo"
            r: "main verb 1: just then a brook pebble came"
          - s: "le sepultó dos costillas en el cuerpo"
            r: "main verb 2 (after 'y'): it drove two of his ribs into his body"
            under:
              - {s: "dándole en un lado", r: "how: hitting him in the side"}
        forms:
          - {w: "Llegó", f: "lleg- + -ó → llegar (to arrive), preterite, it. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "peladilla", f: "the diminutive -illa on pelada (peeled): a sugared almond."}
          - {w: "dándole", f: "dando, the gerund of dar (to give; 'dar en' = to hit), + le (him), with an accent added."}
          - {w: "le sepultó", f: "sepult- + -ó → sepultar (to bury), preterite, it, with 'le' (his, literally 'to him'): Spanish marks the owner of a body part with an indirect pronoun. Same -ar preterite."}
        note: "The narrator calls the stones 'peladillas' (sugared almonds) and then 'almendra' (almond): sweetmeats thrown at a hero, in the mock-gallant style."
      - es: "Viéndose tan maltrecho, creyó sin duda que estaba muerto o malferido, y, acordándose de su licor, sacó su alcuza y púsosela a la boca, y comenzó a echar licor en el estómago;"
        literal: "Seeing-himself so ill-treated, he-believed without doubt that he-was dead or badly-wounded, and, remembering-himself of his liquor, he-took-out his oil-flask and put-it-to-himself to the mouth, and began to pour liquor in the stomach;"
        ormsby: "Feeling himself so smitten, he imagined himself slain or badly wounded for certain, and recollecting his liquor he drew out his flask, and putting it to his mouth began to pour the contents into his stomach;"
        vocab:
          - {w: "maltrecho", d: "battered, badly treated"}
          - {w: "malferido", d: "badly wounded"}
          - {w: "licor", d: "liquid; here the balsam of Fierabrás he brewed in chapter 17"}
          - {w: "alcuza", d: "oil flask, a tin or clay oil bottle"}
          - {w: "echar", d: "to pour, throw"}
        diagram:
          - s: "creyó sin duda"
            r: "main verb 1: he believed for certain"
            under:
              - {s: "Viéndose tan maltrecho", r: "why: seeing himself so battered"}
              - {s: "que estaba muerto o malferido", r: "what he believed: that he was dead or badly wounded"}
          - s: "sacó su alcuza"
            r: "main verb 2 (after 'y'): he took out his flask"
            under:
              - {s: "acordándose de su licor", r: "when: remembering his potion"}
          - {s: "y púsosela a la boca", r: "main verb 3: and put it to his mouth"}
          - {s: "y comenzó a echar licor en el estómago", r: "main verb 4: and began pouring the liquid into his stomach"}
        forms:
          - {w: "Viéndose", f: "viendo, the gerund of ver (to see), + se (himself), with an accent added."}
          - {w: "creyó", f: "cre- + -yó → creer (to believe), preterite, he. The i of the ending becomes y between vowels: creí, creíste, creyó, creímos, creísteis, creyeron."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "muerto, malferido", f: "muerto, the irregular participle of morir (to die), and malferido (badly wounded), masculine for Don Quijote."}
          - {w: "acordándose", f: "acordando, the gerund of acordarse (to remember), + se, with an accent added."}
          - {w: "sacó", f: "sac- + -ó → sacar (to take out), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "púsosela", f: "pus- + -o + se + la → poner (to put), preterite, he, with 'se' (to himself) and 'la' (it, the flask) stuck on the end; modern 'se la puso'. Irregular stem: puse, pusiste, puso, pusimos, pusisteis, pusieron."}
          - {w: "comenzó", f: "comenz- + -ó → comenzar (to begin), preterite, he. Same -ar preterite."}
      - es: "mas, antes que acabase de envasar lo que a él le parecía que era bastante, llegó otra almendra y diole en la mano y en el alcuza tan de lleno que se la hizo pedazos, llevándole de camino tres o cuatro dientes y muelas de la boca, y machucándole malamente dos dedos de la mano."
        literal: "but, before that he-might-finish of pouring-in that which to him it-seemed that was enough, arrived another almond and gave-him in the hand and in the oil-flask so fully that to-him it it-made pieces, carrying-off-from-him on-the way three or four teeth and molars from the mouth, and crushing-him badly two fingers of the hand."
        ormsby: "but ere he had succeeded in swallowing what seemed to him enough, there came another almond which struck him on the hand and on the flask so fairly that it smashed it to pieces, knocking three or four teeth and grinders out of his mouth in its course, and sorely crushing two fingers of his hand."
        vocab:
          - {w: "mas", d: "but (no accent; 'más' is 'more')"}
          - {w: "antes que", d: "before (+ subjunctive)"}
          - {w: "envasar", d: "to bottle, put into a container; jokingly, to swallow down"}
          - {w: "almendra", d: "almond; another joke-name for the stone"}
          - {w: "de lleno", d: "squarely, full on"}
          - {w: "hacer pedazos", d: "to smash to pieces"}
          - {w: "de camino", d: "on the way, in passing"}
          - {w: "muela", d: "molar, back tooth"}
          - {w: "machucar", d: "to crush, mash, bruise"}
        diagram:
          - s: "llegó otra almendra"
            r: "main verb 1 (after 'mas'): another almond came"
            under:
              - s: "antes que acabase de envasar lo que a él le parecía que era bastante"
                r: "when: before he had finished swallowing what seemed enough to him"
          - s: "y diole en la mano y en el alcuza"
            r: "main verb 2: and hit him on the hand and on the flask"
            under:
              - s: "tan de lleno"
                r: "how: so squarely"
                under:
                  - s: "que se la hizo pedazos"
                    r: "result: that it smashed it to pieces"
                    under:
                      - {s: "llevándole de camino tres o cuatro dientes y muelas de la boca", r: "how: taking three or four teeth and molars out of his mouth on the way"}
                      - {s: "y machucándole malamente dos dedos de la mano", r: "how, 2: and badly crushing two fingers of his hand"}
        forms:
          - {w: "acabase", f: "acab- + -ase → acabar (to finish), imperfect subjunctive (-se form), he. 'antes que' always takes the subjunctive. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "le parecía", f: "parec- + -ía → parecer (to seem), imperfect, it, with 'le' (to him). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "era", f: "ser (to be), imperfect, it. era, eras, era, éramos, erais, eran."}
          - {w: "llegó", f: "lleg- + -ó → llegar (to arrive), preterite, it. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "diole", f: "dio + le → dar (to give; 'dar en' = to hit), preterite, it, with 'le' (him) stuck on the end; modern 'le dio'. di, diste, dio, dimos, disteis, dieron."}
          - {w: "el alcuza", f: "alcuza is feminine, but before a stressed a- old Spanish often used 'el' (as modern Spanish still does in 'el agua')."}
          - {w: "se la hizo", f: "hiz- + -o → hacer (to make), preterite, it, with 'la' (it, the flask) and 'se' (for him, 'le' turned into 'se' before 'la'). Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "llevándole, machucándole", f: "gerunds of llevar (to carry off) and machucar (to crush), each + le (from him / his), with an accent added."}
          - {w: "malamente", f: "mala (bad) + -mente: 'badly'."}
  - sentences:
      - es: "Tal fue el golpe primero, y tal el segundo, que le fue forzoso al pobre caballero dar consigo del caballo abajo."
        literal: "Such was the blow first, and such the second, that to-him it-was forced to-the poor knight to-give with-himself from-the horse down."
        ormsby: "Such was the force of the first blow and of the second, that the poor knight in spite of himself came down backwards off his horse."
        vocab:
          - {w: "golpe", d: "blow"}
          - {w: "forzoso", d: "unavoidable, compulsory; 'le fue forzoso' = he could not help"}
          - {w: "dar consigo en", d: "to land, fall (literally 'to give with oneself'); 'dar consigo del caballo abajo' = to fall off the horse"}
        diagram:
          - s: "Tal fue el golpe primero, y tal el segundo"
            r: "main verb: such was the first blow, and such the second"
            under:
              - {s: "que le fue forzoso al pobre caballero dar consigo del caballo abajo", r: "result: that the poor knight could not help falling off his horse"}
        forms:
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, it (twice). ser's preterite is irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "tal", f: "'such', one form for both genders; it triggers the 'que' result clause."}
          - {w: "al pobre", f: "a + el; 'le ... al pobre caballero' names the same person twice, the usual doubling of the indirect object."}
          - {w: "consigo", f: "con + sí fused: 'with himself'."}
          - {w: "del", f: "de + el; 'del caballo abajo' = down off the horse."}
      - es: "Llegáronse a él los pastores y creyeron que le habían muerto; y así, con mucha priesa, recogieron su ganado, y cargaron de las reses muertas, que pasaban de siete, y, sin averiguar otra cosa, se fueron."
        literal: "Came-up-themselves to him the shepherds and believed that him they-had killed; and so, with much haste, they-gathered their flock, and loaded of the beasts dead, which passed of seven, and, without ascertaining other thing, they-went-off."
        ormsby: "The shepherds came up, and felt sure they had killed him; so in all haste they collected their flock together, took up the dead beasts, of which there were more than seven, and made off without waiting to ascertain anything further."
        vocab:
          - {w: "llegarse a", d: "to come up to, approach"}
          - {w: "priesa", d: "= prisa, haste"}
          - {w: "recoger", d: "to gather up, round up"}
          - {w: "cargar de", d: "to load up with, take up"}
          - {w: "res", d: "head of livestock, beast"}
          - {w: "pasar de", d: "to exceed, be more than"}
          - {w: "averiguar", d: "to find out, ascertain"}
        diagram:
          - s: "Llegáronse a él los pastores"
            r: "main verb 1: the shepherds came up to him"
          - s: "y creyeron"
            r: "main verb 2: and believed"
            under:
              - {s: "que le habían muerto", r: "what they believed: that they had killed him"}
          - s: "recogieron su ganado"
            r: "main verb 3 (after 'y así'): they rounded up their flock"
            under:
              - {s: "con mucha priesa", r: "how: in great haste"}
          - s: "y cargaron de las reses muertas"
            r: "main verb 4: and loaded up the dead beasts"
            under:
              - {s: "que pasaban de siete", r: "describes 'reses': which were more than seven"}
          - s: "se fueron"
            r: "main verb 5 (after 'y'): they went off"
            under:
              - {s: "sin averiguar otra cosa", r: "how: without finding out anything more"}
        forms:
          - {w: "Llegáronse", f: "lleg- + -aron + se → llegarse (to come up), preterite, they, with 'se' stuck on the end; modern 'se llegaron'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "creyeron", f: "cre- + -yeron → creer (to believe), preterite, they. The i becomes y between vowels: creí, creíste, creyó, creímos, creísteis, creyeron."}
          - {w: "le habían muerto", f: "habían (haber, imperfect, they: había, habías, había, habíamos, habíais, habían) + muerto: the pluperfect 'they had killed him'. 'muerto' is the participle of morir (to die), used in old Spanish also for matar (to kill)."}
          - {w: "recogieron", f: "recog- + -ieron → recoger (to gather), preterite, they. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "cargaron", f: "carg- + -aron → cargar (to load), preterite, they. Same -ar preterite."}
          - {w: "muertas", f: "muert- + -as → muerto (dead), feminine plural to match 'reses'."}
          - {w: "pasaban", f: "pas- + -aban → pasar (to exceed), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "se fueron", f: "fu- + -eron → irse (to go off), preterite, they, with 'se'. ir borrows ser's preterite: fui, fuiste, fue, fuimos, fuisteis, fueron."}
  - sentences:
      - es: "Estábase todo este tiempo Sancho sobre la cuesta, mirando las locuras que su amo hacía, y arrancábase las barbas, maldiciendo la hora y el punto en que la fortuna se le había dado a conocer."
        literal: "Was-himself all this time Sancho on the slope, watching the follies that his master did, and pulled-out-himself the beards, cursing the hour and the moment in which the fortune him to-him had given to know."
        ormsby: "All this time Sancho stood on the hill watching the crazy feats his master was performing, and tearing his beard and cursing the hour and the occasion when fortune had made him acquainted with him."
        vocab:
          - {w: "estarse", d: "to stay, remain (with 'se' for a lasting state)"}
          - {w: "cuesta", d: "slope, hillside"}
          - {w: "locuras", d: "mad acts, follies"}
          - {w: "arrancarse las barbas", d: "to tear one's beard, a gesture of despair"}
          - {w: "maldecir", d: "to curse"}
          - {w: "darse a conocer", d: "to make oneself known; 'la fortuna se le había dado a conocer' = fortune had made his master known to him"}
        diagram:
          - s: "Estábase todo este tiempo Sancho sobre la cuesta"
            r: "main verb 1: all this time Sancho stayed on the slope"
            under:
              - s: "mirando las locuras"
                r: "how: watching the follies"
                under:
                  - {s: "que su amo hacía", r: "describes 'locuras': that his master was committing"}
          - s: "y arrancábase las barbas"
            r: "main verb 2: and tore his beard"
            under:
              - s: "maldiciendo la hora y el punto"
                r: "how: cursing the hour and the moment"
                under:
                  - {s: "en que la fortuna se le había dado a conocer", r: "describes 'hora y punto': when fortune had made his master known to him"}
        forms:
          - {w: "Estábase", f: "est- + -aba + se → estarse (to stay), imperfect, he, with 'se' stuck on the end; modern 'se estaba'. Cervantes hangs pronouns on the end of a verb that opens its clause. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "mirando", f: "gerund of mirar (to watch)."}
          - {w: "hacía", f: "hac- + -ía → hacer (to do), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "arrancábase", f: "arranc- + -aba + se → arrancarse (to pull out one's own), imperfect, he, with 'se' stuck on the end. Same -aba imperfect."}
          - {w: "maldiciendo", f: "gerund of maldecir (to curse); like decir, the e of the stem becomes i."}
          - {w: "se le había dado", f: "había (haber, imperfect, it: había, habías, había, habíamos, habíais, habían) + dado, participle of dar (to give): the pluperfect 'had given'. 'se' and 'le' (to him): 'darse a conocer' = to make oneself known."}
      - es: "Viéndole, pues, caído en el suelo, y que ya los pastores se habían ido, bajó de la cuesta y llegóse a él, y hallóle de muy mal arte, aunque no había perdido el sentido, y díjole:"
        literal: "Seeing-him, then, fallen on the ground, and that already the shepherds themselves had gone, he-came-down from the slope and came-up-himself to him, and found-him of very bad art, although not he-had lost the sense, and said-to-him:"
        ormsby: "Seeing him, then, brought to the ground, and that the shepherds had taken themselves off, he ran to him and found him in very bad case, though not unconscious; and said he:"
