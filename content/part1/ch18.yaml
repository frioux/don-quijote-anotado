  - sentences:
      - es: "Hiciéronlo ansí, y pusierónse sobre una loma, desde la cual se vieran bien las dos manadas que a don Quijote se le hicieron ejército, si las nubes del polvo que levantaban no les turbara y cegara la vista;"
        literal: "They-did-it thus, and put-themselves upon a hill, from the which would-have-been-seen well the two flocks that to Don Quijote themselves to-him made army, if the clouds of-the dust that they-raised not to-them disturbed and blinded the sight;"
        ormsby: "They did so, and placed themselves on a rising ground from which the two droves that Don Quixote made armies of might have been plainly seen if the clouds of dust they raised had not obscured them and blinded the sight;"
        vocab:
          - {w: "ansí", d: "= así, thus, so"}
          - {w: "loma", d: "low hill, rise, ridge"}
          - {w: "hacérsele a uno", d: "to seem to someone, turn into in someone's mind; 'se le hicieron ejército' = turned into an army for him"}
          - {w: "turbar", d: "to disturb, trouble, cloud"}
          - {w: "cegar", d: "to blind"}
        diagram:
          - {s: "Hiciéronlo ansí", r: "main verb 1: they did so"}
          - s: "y pusierónse sobre una loma"
            r: "main verb 2: and placed themselves on a rise"
            under:
              - s: "desde la cual se vieran bien las dos manadas"
                r: "describes 'loma': from which the two flocks would have been clearly seen"
                under:
                  - {s: "que a don Quijote se le hicieron ejército", r: "describes 'manadas': which to Don Quijote had become an army"}
                  - s: "si las nubes del polvo que levantaban no les turbara y cegara la vista"
                    r: "condition: if the clouds of dust they raised had not clouded and blinded the sight"
        forms:
          - {w: "Hiciéronlo", f: "hic- + -ieron + lo → hacer (to do), preterite, they, with 'lo' (it) stuck on the end. Cervantes hangs pronouns on the end of a verb that opens its clause; modern Spanish says 'lo hicieron'. Irregular stem: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "ansí", f: "= así (thus), the older form."}
          - {w: "pusierónse", f: "pus- + -ieron + se → ponerse (to place oneself), preterite, they, with 'se' stuck on the end (modern 'se pusieron'). The accent falls oddly in the Gutenberg text; the modern spelling is 'pusiéronse'. Irregular stem: puse, pusiste, puso, pusimos, pusisteis, pusieron."}
          - {w: "la cual", f: "'which', the fuller relative used after a preposition, feminine to match 'loma'."}
          - {w: "se vieran", f: "v- + -ieran → ver (to see), imperfect subjunctive (-ra form), they (the flocks), with 'se' making it passive, used as a conditional: 'would have been seen'. ver's -ra form: viera, vieras, viera, viéramos, vierais, vieran. Cervantes uses the -ra form where modern Spanish says 'se habrían visto'."}
          - {w: "se le hicieron", f: "hic- + -ieron → hacerse (to become), preterite, they, with 'se' and 'le' (to him): 'turned into (an army) for him'. Same irregular preterite of hacer."}
          - {w: "del", f: "de + el."}
          - {w: "levantaban", f: "levant- + -aban → levantar (to raise), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "les turbara y cegara", f: "turb- + -ara → turbar (to cloud) and ceg- + -ara → cegar (to blind), imperfect subjunctive (-ra form), with 'les' (to them). The -ra form of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran. Subjunctive after 'si' for an unreal condition; Cervantes keeps the verb singular with the plural subject 'las nubes'."}
      - es: "pero, con todo esto, viendo en su imaginación lo que no veía ni había, con voz levantada comenzó a decir:"
        literal: "but, with all this, seeing in his imagination that which not he-saw nor there-was, with voice raised he-began to say:"
        ormsby: "nevertheless, seeing in his imagination what he did not see and what did not exist, he began thus in a loud voice:"
