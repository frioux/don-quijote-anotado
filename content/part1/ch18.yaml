          - {w: "comenzar a", d: "to begin to"}
        diagram:
          - s: "comenzó a decir:"
            r: "main verb (after 'pero'): he began to say"
            under:
              - {s: "con todo esto", r: "concession: for all that"}
              - s: "viendo en su imaginación"
                r: "how: seeing in his imagination"
                under:
                  - {s: "lo que no veía ni había", r: "what he saw: what he did not see and what was not there"}
              - {s: "con voz levantada", r: "how: in a raised voice"}
        forms:
          - {w: "viendo", f: "gerund of ver (to see): 'seeing'."}
          - {w: "su", f: "'his', one form for both genders (su, sus)."}
          - {w: "veía", f: "ve- + -ía → ver (to see), imperfect, he. ver keeps the e of 'veer' in the imperfect: veía, veías, veía, veíamos, veíais, veían."}
          - {w: "había", f: "hab- + -ía → haber, imperfect, used alone as 'there was'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "levantada", f: "participle of levantar (to raise), feminine to match 'voz'."}
          - {w: "comenzó", f: "comenz- + -ó → comenzar (to begin), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
