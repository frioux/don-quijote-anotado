          - {w: "cuando", d: "with the subjunctive, 'if'"}
          - {w: "prado", d: "meadow"}
          - {w: "yerba", d: "= hierba, herb, grass"}
          - {w: "soler", d: "to be in the habit of, usually do"}
          - {w: "suplir", d: "to make up for, supply"}
          - {w: "falta", d: "lack, shortage"}
          - {w: "malaventurado", d: "unfortunate, ill-starred"}
        diagram:
          - s: "Eso fuera"
            r: "main verb: that would be so"
            under:
              - s: "cuando faltaran por estos prados las yerbas"
                r: "condition: if these meadows lacked the herbs"
                under:
