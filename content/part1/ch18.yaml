          - {w: "vio", f: "ver (to see), preterite, he: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "venía", f: "ven- + -ía → venir (to come), imperfect, it (the dust cloud). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
