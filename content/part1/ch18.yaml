        ormsby: "“Did I not tell you to come back, Señor Don Quixote; and that what you were going to attack were not armies but droves of sheep?”"
        vocab:
          - {w: "volverse", d: "to turn back, come back"}
          - {w: "acometer", d: "to attack, charge"}
          - {w: "manada", d: "flock, herd"}
