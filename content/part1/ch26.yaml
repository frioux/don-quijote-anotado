part: 1
chapter: 26
title_es: "Capítulo XXVI. Donde se prosiguen las finezas que de enamorado hizo don Quijote en Sierra Morena"
title_en: "In which are continued the refinements wherewith Don Quixote played the part of a lover in the Sierra Morena"
paragraphs:
  - sentences:
      - es: "Y, volviendo a contar lo que hizo el de la Triste Figura después que se vio solo, dice la historia que, así como don Quijote acabó de dar las tumbas o vueltas, de medio abajo desnudo y de medio arriba vestido, y que vio que Sancho se había ido sin querer aguardar a ver más sandeces, se subió sobre una punta de una alta peña y allí tornó a pensar lo que otras muchas veces había pensado, sin haberse jamás resuelto en ello."
        literal: "And, returning to tell that which did the [one] of the Sad Figure after that he-saw-himself alone, says the history that, as soon as Don Quijote finished of giving the tumbles or turns, from half down naked and from half up dressed, and that he-saw that Sancho himself had gone without wanting to-wait to see more follies, he-climbed-himself onto a point of a high crag and there he-returned to think that which other many times he-had thought, without having-himself ever resolved in it."
        ormsby: "Returning to the proceedings of him of the Rueful Countenance when he found himself alone, the history says that when Don Quixote had completed the performance of the somersaults or capers, naked from the waist down and clothed from the waist up, and saw that Sancho had gone off without waiting to see any more crazy feats, he climbed up to the top of a high rock, and there set himself to consider what he had several times before considered without ever coming to any conclusion on the point,"
        vocab:
          - {w: "el de la Triste Figura", d: "'the one of the Sad Figure': Don Quijote, whom Sancho named the Knight of the Rueful Countenance ('Caballero de la Triste Figura') after a battle cost him his teeth"}
          - {w: "después que", d: "after (modern 'después de que')"}
          - {w: "así como", d: "here 'as soon as', not 'just as'"}
          - {w: "acabar de", d: "to finish (doing something)"}
          - {w: "tumba", d: "old sense: somersault, tumble (modern 'tumba' is a tomb)"}
          - {w: "vuelta", d: "turn, here a cartwheel or caper"}
          - {w: "de medio abajo / de medio arriba", d: "from the waist down / from the waist up"}
          - {w: "aguardar", d: "to wait, wait for"}
          - {w: "sandez", d: "piece of nonsense, folly; plural 'sandeces'"}
          - {w: "peña", d: "crag, large rock"}
          - {w: "tornar a", d: "+ infinitive: to do again ('tornó a pensar' = he thought again)"}
          - {w: "resolverse en", d: "to make up one's mind about"}
        diagram:
          - s: "dice la historia"
            r: "main verb: the history says"
            under:
              - {s: "volviendo a contar lo que hizo el de la Triste Figura después que se vio solo", r: "how: going back to tell what the Knight of the Sad Figure did once he was alone"}
              - s: "se subió"
                r: "what it says, 1 (after 'que'): he climbed"
                under:
                  - {s: "así como don Quijote acabó de dar las tumbas o vueltas", r: "when 1: as soon as Don Quijote had finished his somersaults"}
                  - {s: "de medio abajo desnudo y de medio arriba vestido", r: "how he was: naked below the waist, dressed above"}
                  - {s: "y que vio que Sancho se había ido sin querer aguardar a ver más sandeces", r: "when 2: and saw that Sancho had left without waiting for more nonsense"}
                  - {s: "sobre una punta de una alta peña", r: "where: onto the top of a high rock"}
              - s: "y allí tornó a pensar"
                r: "what it says, 2: and there he thought again about"
                under:
                  - {s: "lo que otras muchas veces había pensado", r: "object: what he had thought about many times before"}
                  - {s: "sin haberse jamás resuelto en ello", r: "how: without ever deciding"}
        forms:
          - {w: "volviendo", f: "gerund of volver (to return): 'returning'. 'volver a contar' = to go back to telling."}
          - {w: "hizo", f: "hacer (to do), preterite, he. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "se vio", f: "ver (to see), preterite, he, with 'se' (himself): 'he saw himself, found himself'. ver in the preterite: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "dice", f: "dic- + -e → decir (to say), present, it (the history). Irregular: digo, dices, dice, decimos, decís, dicen. The narrator speaks of 'the history' as if quoting a source."}
          - {w: "acabó", f: "acab- + -ó → acabar (to finish), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "desnudo, vestido", f: "masculine singular to match don Quijote; vestido is the participle of vestir (to dress)."}
          - {w: "se había ido", f: "había = haber, imperfect, he (había, habías, había, habíamos, habíais, habían), + ido, the participle of ir (to go): 'had gone'. The 'se' makes it 'had gone off'."}
          - {w: "querer aguardar", f: "two infinitives after 'sin': 'without wanting to wait'. querer (to want) + aguardar (to wait)."}
          - {w: "se subió", f: "sub- + -ió → subirse (to climb up), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "alta", f: "alt- + -a → alto (high), feminine to match 'peña', placed before the noun."}
          - {w: "tornó", f: "torn- + -ó → tornar (to return; 'tornar a' = to do again), preterite, he. Same -ar preterite."}
          - {w: "muchas veces", f: "much- + -as, feminine plural to match 'veces'; vez → veces, z changing to c before -es."}
          - {w: "había pensado", f: "había (haber, imperfect, he) + pensado, the participle of pensar (to think): pluperfect 'had thought'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "haberse ... resuelto", f: "haber + se, the infinitive with 'se' attached, + resuelto, the irregular participle of resolver (to resolve): 'having made up his mind'. 'jamás' (ever) sits between the two parts."}
        note: "In the previous chapter Don Quijote stripped and turned somersaults on the rocks so that Sancho could report his madness to Dulcinea as an eyewitness; Sancho left after seeing enough."
      - es: "Y era que cuál sería mejor y le estaría más a cuento: imitar a Roldán en las locuras desaforadas que hizo, o Amadís en las malencónicas. Y, hablando entre sí mesmo, decía:"
        literal: "And it-was that which would-be better and to-him would-be more to account: to-imitate [to] Roldán in the madnesses outrageous that he-did, or Amadís in the melancholy [ones]. And, speaking between himself same, he-said:"
        ormsby: "namely whether it would be better and more to his purpose to imitate the outrageous madness of Roland, or the melancholy madness of Amadís; and communing with himself he said:"
        vocab:
          - {w: "estar a cuento", d: "to suit, be to one's advantage ('le estaría más a cuento' = would suit him better)"}
          - {w: "Roldán", d: "Roland (Orlando), Charlemagne's paladin; in Ariosto's 'Orlando furioso' he goes raving mad when he learns Angelica loves Medoro"}
          - {w: "desaforado", d: "outrageous, wild, beyond all bounds"}
          - {w: "Amadís", d: "Amadís de Gaula, hero of the most famous Spanish romance of chivalry; rejected by his lady Oriana, he did penance as a hermit on the Peña Pobre"}
          - {w: "malencónico", d: "= melancólico, melancholy (old popular form)"}
          - {w: "entre sí", d: "to himself"}
          - {w: "mesmo", d: "= mismo, same, self"}
        diagram:
          - s: "Y era"
            r: "main verb 1: and it (the question) was"
            under:
              - {s: "que cuál sería mejor y le estaría más a cuento", r: "what it was: which would be better and suit him more"}
              - s: "imitar a Roldán en las locuras desaforadas"
                r: "option 1: to imitate Roland in his wild madness"
                under:
                  - {s: "que hizo", r: "describes 'locuras': that he committed"}
              - {s: "o Amadís en las malencónicas", r: "option 2: or Amadís in his melancholy ones"}
          - s: "decía"
            r: "main verb 2: he was saying"
            under:
              - {s: "hablando entre sí mesmo", r: "how: talking to himself"}
        forms:
          - {w: "era", f: "ser (to be), imperfect, it. ser's imperfect is irregular: era, eras, era, éramos, erais, eran."}
          - {w: "sería, estaría", f: "ser- + -ía, estar- + -ía → ser and estar (to be), conditional, it: 'would be'. The conditional adds -ía, -ías, -ía, -íamos, -íais, -ían to the whole infinitive."}
          - {w: "imitar", f: "infinitive (to imitate), used as a noun: 'to imitate Roland' is one of the two choices."}
          - {w: "desaforadas", f: "desaforad- + -as → desaforado (outrageous), feminine plural to match 'locuras'."}
          - {w: "hizo", f: "hacer (to do), preterite, he. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "malencónicas", f: "feminine plural to match the 'locuras' left out: 'the melancholy ones'."}
          - {w: "hablando", f: "gerund of hablar (to speak): 'speaking'."}
          - {w: "decía", f: "dec- + -ía → decir (to say), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
      - es: "— Si Roldán fue tan buen caballero y tan valiente como todos dicen, ¿qué maravilla?, pues, al fin, era encantado y no le podía matar nadie si no era metiéndole un alfiler de a blanca por la planta del pie, y él traía siempre los zapatos con siete suelas de hierro."
        literal: "— If Roldán was so good knight and so valiant as all say, what wonder?, since, at-the end, he-was enchanted and not him could kill nobody if not it-was putting-into-him a pin of at blanca through the sole of-the foot, and he wore always the shoes with seven soles of iron."
        ormsby: "“What wonder is it if Roland was so good a knight and so valiant as everyone says he was, when, after all, he was enchanted, and nobody could kill him save by thrusting a corking pin into the sole of his foot, and he always wore shoes with seven iron soles?"
        vocab:
          - {w: "¿qué maravilla?", d: "what wonder? no wonder!"}
          - {w: "al fin", d: "after all, in the end"}
          - {w: "encantado", d: "enchanted, under a spell (here: made invulnerable by magic)"}
          - {w: "si no era", d: "except, unless (by)"}
          - {w: "alfiler", d: "pin"}
          - {w: "de a blanca", d: "costing a blanca; 'de a' gives the price of an article, as in English 'a tenpenny nail'"}
          - {w: "blanca", d: "a small copper coin worth half a maravedí"}
          - {w: "planta del pie", d: "sole of the foot"}
          - {w: "traer", d: "here: to wear (clothes, shoes)"}
          - {w: "suela", d: "sole (of a shoe)"}
        diagram:
          - s: "¿qué maravilla?"
            r: "main clause: what wonder is it"
            under:
              - {s: "Si Roldán fue tan buen caballero y tan valiente como todos dicen", r: "condition: if Roland was as good and brave a knight as everyone says"}
              - s: "pues, al fin, era encantado"
                r: "why 1: since after all he was enchanted"
              - s: "y no le podía matar nadie"
                r: "why 2: and nobody could kill him"
                under:
                  - {s: "si no era metiéndole un alfiler de a blanca por la planta del pie", r: "except: by sticking a cheap pin into the sole of his foot"}
              - {s: "y él traía siempre los zapatos con siete suelas de hierro", r: "why 3: and he always wore shoes with seven iron soles"}
        forms:
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, he. ser's preterite is irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "buen", f: "bueno (good) clipped before a masculine singular noun ('caballero'), like un, algún, ningún, gran."}
          - {w: "dicen", f: "dic- + -en → decir (to say), present, they. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "era", f: "ser (to be), imperfect, he. ser's imperfect is irregular: era, eras, era, éramos, erais, eran. 'era encantado' = he was (in a state of being) enchanted."}
          - {w: "podía", f: "pod- + -ía → poder (to be able), imperfect, he/one: 'could'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "no ... nadie", f: "double negative: 'no ... nadie' = nobody. Spanish keeps 'no' before the verb when 'nadie' follows."}
          - {w: "metiéndole", f: "metiendo, the gerund of meter (to put in), + le (into him), with an accent added to keep the stress."}
          - {w: "del", f: "de + el (of the)."}
          - {w: "traía", f: "tra- + -ía → traer (to bring; here to wear), imperfect, he. Same -ía imperfect."}
        ormsby_note: "Properly a 'blanca pin,' i.e., of the size sold for a blanca, or half a inaravedi, as we say a 'tenpenny nail.' Viardot, strangely misinterpreting the very common idiom de á, indicating the price of an article, and fancying the á to have a negative power as in Greek, explains it as 'a pin made of some substance not white.'"
        note: "Ormsby points out that Cervantes slips here: in Ariosto it is Ferraù, not Orlando, who is invulnerable and wears seven iron plates. Orlando's only weak spot, in the Spanish tradition, was the sole of his foot."
      - es: "Aunque no le valieron tretas contra Bernardo del Carpio, que se las entendió y le ahogó entre los brazos, en Roncesvalles."
        literal: "Although not to-him availed tricks against Bernardo del Carpio, who them-to-himself understood and him strangled between the arms, in Roncesvalles."
        ormsby: "Though cunning devices did not avail him against Bernardo del Carpio, who knew all about them, and strangled him in his arms at Roncesvalles."
        vocab:
          - {w: "valer", d: "to be of use, avail ('no le valieron' = did him no good)"}
          - {w: "treta", d: "trick, ruse, device"}
          - {w: "Bernardo del Carpio", d: "legendary Spanish hero of the ballads, said to have defeated the French at Roncesvalles and killed Roland"}
          - {w: "entendérselas", d: "to see through someone's tricks, know all about them"}
          - {w: "ahogar", d: "to strangle, smother, choke"}
          - {w: "Roncesvalles", d: "the pass in the Pyrenees where Charlemagne's rearguard under Roland was destroyed in 778"}
        diagram:
          - s: "no le valieron tretas"
            r: "main verb: tricks did him no good"
            under:
              - {s: "Aunque", r: "concession: although (answering the previous sentence)"}
              - s: "contra Bernardo del Carpio"
                r: "against whom"
                under:
                  - {s: "que se las entendió", r: "describes 'Bernardo': who saw through them"}
                  - s: "y le ahogó entre los brazos"
                    r: "describes 'Bernardo', 2: and strangled him in his arms"
                    under:
                      - {s: "en Roncesvalles", r: "where"}
        forms:
          - {w: "valieron", f: "val- + -ieron → valer (to avail), preterite, they (the tricks). The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "se las entendió", f: "entend- + -ió → entender (to understand), preterite, he. Same -ió preterite. 'las' = them (the tricks); 'se' = for himself, the idiom 'entendérselas'."}
          - {w: "ahogó", f: "ahog- + -ó → ahogar (to strangle), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
        note: "The Spanish ballads made their own hero, Bernardo del Carpio, the man who killed the French champion Roland at Roncesvalles, squeezing him to death because no weapon could hurt him. The French Song of Roland knows nothing of him."
      - es: "Pero, dejando en él lo de la valentía a una parte, vengamos a lo de perder el juicio, que es cierto que le perdió, por las señales que halló en la fontana y por las nuevas que le dio el pastor de que Angélica había dormido más de dos siestas con Medoro, un morillo de cabellos enrizados y paje de Agramante;"
        literal: "But, leaving in him that of the valor to one side, let-us-come to that of losing the judgment, for it-is certain that it he-lost, through the signs that he-found at the fountain and through the news that to-him gave the shepherd of that Angélica had slept more than two siestas with Medoro, a little-Moor of hairs curled and page of Agramante;"
        ormsby: "But putting the question of his valour aside, let us come to his losing his wits, for certain it is that he did lose them in consequence of the proofs he discovered at the fountain, and the intelligence the shepherd gave him of Angelica having slept more than two siestas with Medoro, a little curly-headed Moor, and page to Agramante."
        vocab:
          - {w: "dejar a una parte", d: "to set aside, leave to one side"}
          - {w: "lo de", d: "the matter of, the business of ('lo de la valentía' = the question of his courage)"}
          - {w: "juicio", d: "judgment, reason, wits; 'perder el juicio' = to go mad"}
          - {w: "señal", d: "sign, token; here the lovers' names carved on the trees"}
          - {w: "fontana", d: "fountain, spring (poetic, from Italian; modern 'fuente')"}
          - {w: "nuevas", d: "news, tidings"}
          - {w: "Angélica", d: "the Cathay princess loved by Orlando in Ariosto's 'Orlando furioso'; she falls for the young Moor Medoro instead"}
          - {w: "dormir siestas con", d: "to sleep (afternoon naps) with; a euphemism"}
          - {w: "Medoro", d: "the young Saracen soldier whom Angelica nurses and marries in 'Orlando furioso'"}
          - {w: "morillo", d: "little Moor, young Moor (diminutive of moro)"}
          - {w: "enrizado", d: "curled, curly"}
          - {w: "paje", d: "page, a boy servant to a lord"}
          - {w: "Agramante", d: "the African king who leads the Saracens against Charlemagne in Ariosto's poem"}
        diagram:
          - s: "vengamos"
            r: "main verb: let us come"
            under:
              - {s: "dejando en él lo de la valentía a una parte", r: "how: leaving his courage aside"}
              - {s: "a lo de perder el juicio", r: "to what: to the matter of losing his wits"}
              - s: "que es cierto que le perdió"
                r: "why: for it is certain he lost it"
                under:
                  - {s: "por las señales que halló en la fontana", r: "because of what 1: the signs he found at the spring"}
                  - s: "y por las nuevas que le dio el pastor"
                    r: "because of what 2: the news the shepherd gave him"
                    under:
                      - s: "de que Angélica había dormido más de dos siestas con Medoro"
                        r: "what news: that Angelica had slept more than two siestas with Medoro"
                        under:
                          - {s: "un morillo de cabellos enrizados y paje de Agramante", r: "who Medoro was: a curly-haired young Moor, page to Agramante"}
        forms:
          - {w: "dejando", f: "gerund of dejar (to leave): 'leaving'."}
          - {w: "vengamos", f: "veng- + -amos → venir (to come), present subjunctive, we: 'let us come'. The subjunctive gives the 'let us' command. venir in the present subjunctive: venga, vengas, venga, vengamos, vengáis, vengan."}
          - {w: "perder", f: "infinitive (to lose) used as a noun after 'lo de': 'the losing'."}
          - {w: "perdió", f: "perd- + -ió → perder (to lose), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron. 'le' is the juicio (masculine 'it')."}
          - {w: "halló", f: "hall- + -ó → hallar (to find), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "dio", f: "dar (to give), preterite, he. Irregular: di, diste, dio, dimos, disteis, dieron."}
          - {w: "había dormido", f: "había (haber, imperfect, she: había, habías, había, habíamos, habíais, habían) + dormido, the participle of dormir (to sleep): 'had slept'."}
          - {w: "morillo", f: "mor- + -illo → moro (Moor) with the diminutive -illo: 'little Moor'."}
          - {w: "enrizados", f: "enrizad- + -os → enrizado (curled), masculine plural to match 'cabellos'."}
        ormsby_note: "'Occhi avea neri, e chioma crespa d'oro: / Angel parea di quei del sommo coro.' Orlando Furioso c. xviii st. 166 But Medoro was not in the service of Agramante, but in that of Dardinel; and a little higher up Cervantes has made another slip of memory, for it was not Orlando, but Ferrau who wore the 'sette piastre fatte a buone tempre.' Orlando Furioso c. xii st. 48"
        note: "In Ariosto (cantos 23-24) Orlando finds Angelica's and Medoro's names carved on the trees round a spring, then hears the whole story from the shepherd who sheltered them, and goes raving mad, tearing up trees and killing shepherds."
      - es: "y si él entendió que esto era verdad y que su dama le había cometido desaguisado, no hizo mucho en volverse loco."
        literal: "and if he understood that this was truth and that his lady to-him had committed wrong, not he-did much in turning-himself mad."
        ormsby: "If he was persuaded that this was true, and that his lady had wronged him, it is no wonder that he should have gone mad;"
        vocab:
          - {w: "dama", d: "lady, the lady a knight serves and loves"}
          - {w: "desaguisado", d: "wrong, outrage, injury (an old word Don Quijote loves)"}
          - {w: "no hacer mucho en", d: "to do nothing remarkable in, i.e. it is no wonder that"}
          - {w: "volverse loco", d: "to go mad"}
        diagram:
          - s: "no hizo mucho"
            r: "main verb: he did nothing remarkable (it is no wonder)"
            under:
              - s: "y si él entendió"
                r: "condition: and if he understood"
                under:
                  - {s: "que esto era verdad", r: "what he understood, 1: that this was true"}
                  - {s: "y que su dama le había cometido desaguisado", r: "what he understood, 2: and that his lady had wronged him"}
              - {s: "en volverse loco", r: "in what: in going mad"}
        forms:
          - {w: "entendió", f: "entend- + -ió → entender (to understand), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "era", f: "ser (to be), imperfect, it. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "había cometido", f: "había (haber, imperfect, she: había, habías, había, habíamos, habíais, habían) + cometido, the participle of cometer (to commit): 'had committed'."}
          - {w: "hizo", f: "hacer (to do), preterite, he. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "volverse", f: "infinitive of volver (to turn) with 'se' (himself) on the end: 'to turn (himself) mad', after 'en'."}
      - es: "Pero yo, ¿cómo puedo imitalle en las locuras, si no le imito en la ocasión dellas?"
        literal: "But I, how can-I imitate-him in the madnesses, if not him I-imitate in the occasion of-them?"
        ormsby: "but I, how am I to imitate him in his madness, unless I can imitate him in the cause of it?"
        vocab:
          - {w: "imitalle", d: "= imitarle, to imitate him (old -rl- → -ll-)"}
          - {w: "ocasión", d: "cause, reason (not only 'occasion')"}
          - {w: "dellas", d: "= de ellas, of them"}
        diagram:
          - s: "¿cómo puedo imitalle en las locuras"
            r: "main verb: how can I imitate him in his madness"
            under:
              - {s: "Pero yo", r: "subject, put first for contrast: but I"}
              - {s: "si no le imito en la ocasión dellas", r: "condition: if I don't imitate him in their cause"}
        forms:
          - {w: "puedo", f: "pued- + -o → poder (to be able), present, I. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "imitalle", f: "imitar (to imitate) + le (him): the r of the infinitive turns into l before the pronoun, so -rle becomes -lle. Modern 'imitarle'."}
          - {w: "imito", f: "imit- + -o → imitar (to imitate), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "dellas", f: "de + ellas (of them, the locuras)."}
