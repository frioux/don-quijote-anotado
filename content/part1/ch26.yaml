  - sentences:
      - es: "Buscando las aventuras por entre las duras peñas, maldiciendo entrañas duras, que entre riscos y entre breñas halla el triste desventuras, hirióle amor con su azote, no con su blanda correa; y, en tocándole el cogote, aquí lloró don Quijote ausencias de Dulcinea del Toboso."
        literal: "Seeking the adventures through among the hard crags, cursing entrails hard, for among cliffs and among thickets finds the sad [one] misadventures, wounded-him love with its whip, not with its soft strap; and, on touching-him the nape, here wept Don Quijote absences of Dulcinea del Toboso."
        ormsby: "Adventure-seeking doth he go / Up rugged heights, down rocky valleys, / But hill or dale, or high or low, / Mishap attendeth all his sallies: / Love still pursues him to and fro, / And plies his cruel scourge—ah me! a / Relentless fate, an endless woe; / Don Quixote’s tears are on the flow, / And all for distant Dulcinea / Del Toboso."
        vocab:
          - {w: "por entre", d: "through, in among"}
          - {w: "maldecir", d: "to curse"}
          - {w: "entrañas", d: "entrails, innards; figuratively the heart ('entrañas duras' = a hard heart, Dulcinea's)"}
          - {w: "risco", d: "crag, cliff"}
          - {w: "breña", d: "rough, scrubby ground among rocks"}
          - {w: "desventura", d: "misfortune"}
          - {w: "azote", d: "whip, lash"}
          - {w: "blando", d: "soft, gentle"}
          - {w: "correa", d: "leather strap, belt"}
          - {w: "en + gerund", d: "as soon as ('en tocándole' = as soon as it touched him)"}
          - {w: "cogote", d: "nape of the neck, back of the head (a low, comic word)"}
        diagram:
          - s: "hirióle amor con su azote"
            r: "main verb 1: love struck him with its whip"
            under:
              - {s: "Buscando las aventuras por entre las duras peñas", r: "when 1: as he sought adventures among the hard rocks"}
              - s: "maldiciendo entrañas duras"
                r: "when 2: cursing a hard heart"
                under:
                  - {s: "que entre riscos y entre breñas halla el triste desventuras", r: "why he curses: for among the crags and scrub the sad one finds misfortunes"}
              - {s: "no con su blanda correa", r: "contrast: not with its soft strap"}
          - s: "aquí lloró don Quijote"
            r: "main verb 2 (after 'y'): here Don Quijote wept"
            under:
              - {s: "en tocándole el cogote", r: "when: as soon as it touched the back of his neck"}
              - {s: "ausencias de Dulcinea del Toboso", r: "object: (for) his absence from Dulcinea del Toboso"}
        forms:
          - {w: "Buscando, maldiciendo", f: "gerunds of buscar (to seek) and maldecir (to curse); maldecir changes e to i in the gerund, like decir → diciendo."}
          - {w: "duras", f: "dur- + -as → duro (hard), feminine plural to match 'peñas' and 'entrañas'."}
          - {w: "halla", f: "hall- + -a → hallar (to find), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "el triste", f: "the adjective triste (sad) used as a noun with 'el': 'the sad one', i.e. Don Quijote."}
          - {w: "hirióle", f: "hir- + -ió + le → herir (to wound, strike), preterite, it (love), with 'le' (him) on the end: modern 'le hirió'. The e of the stem becomes i in this form: herí, heriste, hirió, herimos, heristeis, hirieron."}
          - {w: "blanda", f: "bland- + -a → blando (soft), feminine to match 'correa'."}
          - {w: "tocándole", f: "tocando, the gerund of tocar (to touch), + le (him), with an accent added. After 'en' it means 'as soon as'."}
          - {w: "lloró", f: "llor- + -ó → llorar (to weep), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
        ormsby_note: "In its ingenuity of rhyme and versification and its transcendent absurdity this is the best piece of humorous verse in Don Quixote. Even Clemencín, who generally grumbles at the verses of Cervantes, cannot help giving it a word of praise. It is, of course, impossible in English translation to do more than suggest the character of the original, for anything like close imitation is unattainable."
        note: "Love's whip lands on the 'cogote', the back of the neck, the spot where one cuffs a boy or kills a rabbit: a low word in a love poem. Cupid's 'blanda correa' is the gentle strap he is supposed to use."
  - sentences:
      - es: "No causó poca risa en los que hallaron los versos referidos el añadidura del Toboso al nombre de Dulcinea, porque imaginaron que debió de imaginar don Quijote que si, en nombrando a Dulcinea, no decía también del Toboso, no se podría entender la copla;"
        literal: "Not caused little laughter in those who found the verses referred the addition of Toboso to-the name of Dulcinea, because they-imagined that must have imagined Don Quijote that if, on naming [to] Dulcinea, not he-said also del Toboso, not itself could understand the stanza;"
        ormsby: "The addition of “del Toboso” to Dulcinea’s name gave rise to no little laughter among those who found the above lines, for they suspected Don Quixote must have fancied that unless he added “del Toboso” when he introduced the name of Dulcinea the verse would be unintelligible;"
