      - es: "En esto, y en suspirar y en llamar a los faunos y silvanos de aquellos bosques, a las ninfas de los ríos, a la dolorosa y húmida Eco, que le respondiese, consolasen y escuchasen, se entretenía, y en buscar algunas yerbas con que sustentarse en tanto que Sancho volvía;"
