  - sentences:
      - es: "— Dígame, señor licenciado, aquel del caballo, ¿no es Sancho Panza, el que dijo el ama de nuestro aventurero que había salido con su señor por escudero?"
        literal: "— Tell-me, sir licentiate, that [one] of-the horse, not is Sancho Panza, the [one] that said the housekeeper of our adventurer that had gone-out with his lord as squire?"
        ormsby: "“Señor licentiate, is not he on the horse there Sancho Panza who, our adventurer’s housekeeper told us, went off with her master as esquire?”"
        vocab:
          - {w: "licenciado", d: "licentiate, a university graduate; the priest's title"}
          - {w: "aquel del caballo", d: "that man on the horse"}
          - {w: "ama", d: "housekeeper (Don Quijote's, in his village)"}
          - {w: "aventurero", d: "adventurer, i.e. Don Quijote (said with irony)"}
          - {w: "por escudero", d: "as squire"}
        diagram:
          - {s: "Dígame, señor licenciado", r: "opening: tell me, sir licentiate"}
          - s: "¿no es Sancho Panza"
            r: "main verb: isn't (he) Sancho Panza"
            under:
              - {s: "aquel del caballo", r: "subject: that man on the horse"}
              - s: "el que dijo el ama de nuestro aventurero"
                r: "describes 'Sancho': the one our adventurer's housekeeper spoke of"
                under:
                  - {s: "que había salido con su señor por escudero", r: "what she said: that he had gone off with his master as squire"}
        forms:
          - {w: "Dígame", f: "dig- + -a + me → decir (to say), present subjunctive used as the polite command (vuestra merced), with 'me' (to me) on the end and an accent added. decir in the present subjunctive: diga, digas, diga, digamos, digáis, digan."}
          - {w: "aquel", f: "'that (man)', masculine; used as a pronoun."}
          - {w: "del", f: "de + el (of the; here 'on the')."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, she. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "el ama", f: "'ama' is feminine, but takes 'el' because it begins with a stressed a (like 'el agua')."}
          - {w: "había salido", f: "había (haber, imperfect, he: había, habías, había, habíamos, habíais, habían) + salido, the participle of salir (to go out): 'had gone out'."}
        note: "The speaker is the barber, Master Nicolás, addressing the village priest, Pero Pérez, a graduate of Sigüenza, by his academic title."
