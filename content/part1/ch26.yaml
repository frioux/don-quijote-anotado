summary: |
  Left alone in the Sierra Morena after his somersaults, Don Quijote climbs a rock and debates which madman to imitate: Roland, who went raving mad and tore up trees when he learned that Angelica had slept with the young Moor Medoro, or Amadís, who retired in melancholy to the Peña Pobre with a hermit after his lady Oriana banished him. Since Dulcinea has never so much as seen a Moor, Roland's kind of madness would insult her, so he chooses Amadís. He tears a strip from his shirt-tail and knots it into a rosary, prays endlessly, wanders the meadow, and carves verses on the trees and in the sand. Three stanzas survive, each ending with 'aquí lloró don Quijote / ausencias de Dulcinea / del Toboso', and the finders laugh at the 'del Toboso' tacked on to fill the line.

  Sancho meanwhile reaches the inn where he was tossed in a blanket and will not go in. Out come the priest and the barber of his village, looking for Don Quijote. They threaten to accuse him of murdering his master and stealing his horse, so Sancho tells them everything: the penance in the mountains, the adventures, the letter to Dulcinea, who is the daughter of Lorenzo Corchuelo.

  When asked for the letter, Sancho finds that Don Quijote never gave him the notebook. He tears out half his beard and punches himself in the face, since the book also held the order for three donkey colts. The priest promises to have the order renewed. Sancho then recites the letter from memory in a garbled form ('Alta y sobajada señora'), and adds his master's plans to become an emperor and marry him to one of the empress's ladies once he, Sancho, is conveniently a widower. When the priest mentions that his master might become an archbishop instead, Sancho worries, since a married man who cannot read could hope for nothing from the Church. The barber promises to urge Don Quijote to be an emperor.

  The two men go into the inn to eat and plan, sending food out to Sancho. The priest has an idea: he will dress as a damsel-errant and the barber as her squire, and they will ask Don Quijote for a boon, to follow her and avenge a wrong, without asking her name or lifting her mask. In this way they hope to lead him home and look for a cure for his madness.
context: |
  Money, the Church and the law. Sancho's interest in the lost notebook is practical: it held a 'cédula' ordering Don Quijote's niece to give him three donkey colts, and the priest, speaking like a notary, explains that such an order must be on proper paper to be honored. The talk of archbishops-errant gives a picture of Church careers. A 'beneficio' was a Church post with a fixed income; a 'simple' one had no duties, a 'curado' one came with a parish; a sacristan's place was smaller; the 'pie de altar', the fees for baptisms, weddings and funerals, could double a priest's income. All of these needed a man who could read and was not married, which is why Sancho is alarmed. The scene at the inn also turns on food: Sancho has eaten nothing but cold rations for days and longs for something hot, yet his fear of the blanket keeps him outside.

  Roland and Amadís. Don Quijote's choice sets two models of the mad lover side by side. Ariosto's 'Orlando furioso' (1516-32) ends Orlando's love for Angelica in raving madness: he finds her name and Medoro's carved on the trees, strips naked, and uproots forests. The Spanish 'Amadís de Gaula' (1508) gives the gentler version: Amadís, wrongly rejected by Oriana, becomes the hermit Beltenebros on the Peña Pobre and weeps until she forgives him. Don Quijote mixes in Spanish ballad legend, where Bernardo del Carpio kills Roland at Roncesvalles by squeezing him, since he could be wounded only in the sole of his foot. As Ormsby notes, Cervantes slips twice here: in Ariosto it was Ferraù who wore seven iron plates, and Medoro served Dardinel, not Agramante. The priest's plan borrows another commonplace of the romances: a masked damsel asks a knight for a boon before saying what it is, and he must grant it.

  The narrator's games. The verses are presented as fragments found afterwards by people who 'hallaron' them, as if the chronicler had sources. Ormsby calls them the best piece of humorous verse in the book. Every stanza is a 'copla real' that ends in the same refrain with a broken half-line, 'del Toboso', and the rhymes in -ote (alborote, escote, estricote, pipote, azote, cogote) are chosen to chime with 'Quijote', dragging the love poem down into the tavern and the stable. Sancho's recital of the letter is another parody: he remembers the sounds and loses the sense, so 'soberana' becomes 'sobajada' (pawed about) and 'llagado' (wounded) becomes 'llego'.

  Religion. The knotted shirt-tail rosary (eleven knots, one larger, a single decade of Hail Marys) was the reading of the first edition of 1605. Ormsby notes that the second edition changed it to a rosary of oak galls, probably because critics found a rosary made from a half-naked man's shirt-tail indecent, and that Cervantes had nothing to do with the change. Don Quijote's regret that there is no hermit to confess him is part of the same game: he is playing Amadís, who had a hermit with him.

  Names. Don Quijote is again 'el de la Triste Figura', the name Sancho gave him, and the narrator puns on it: three weeks more would have left the 'Caballero de la Triste Figura' so 'desfigurado' that his mother would not have known him. Sancho reveals that Dulcinea is the daughter of Lorenzo Corchuelo, a farmer of El Toboso. 'Ínsulos ni ínsulas' is Sancho's joke on 'ínsula', the bookish word for the island he was promised. The priest, who has no name in this chapter, is addressed as 'licenciado', a university graduate.

  Reading Cervantes' Spanish. The chapter has the usual old spellings: mesmo, ansí, agora, ansimesmo and asimesmo, apriesa, ñudo, yerba, húmida, acetar, estraño, entrambos, and the old preterite stem in 'trujese' (trajese). The priest imitates the language of the romances with its f- for h- (desfacer, fecho, facienda, fasta). Pronouns are hung on verbs that open a clause (haríale, diole, Tráele, hirióle, Conociólos, Consolóle, díjole, Paróse, alabáronsela, Suélenles), and an infinitive plus 'le' or 'la' becomes -lle, -lla (imitalle, acometellas, dejalle, trasladalla, desfacelle); 'Decildo' swaps the d and l of 'decidlo'. Notice the future subjunctive ('pudiere'), the -ra form used as a conditional ('tardara', 'quedara', 'conociera', 'pudiera y debiera'), 'en' + gerund for 'as soon as' (en nombrando, en saliendo, en hallando, en siéndolo), and 'había grandes días que' for 'it had been many days'. Watch for false friends: luego (at once), discreto (wise), desgracia (mishap), admirado (amazed), trasladar (to copy), tumba (somersault), suerte (manner).
