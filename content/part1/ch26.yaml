  - sentences:
      - es: "— No, no —dijo el barbero—, Sancho Panza; si vos no nos decís dónde queda, imaginaremos, como ya imaginamos, que vos le habéis muerto y robado, pues venís encima de su caballo."
        literal: "— No, no —said the barber—, Sancho Panza; if you not to-us tell where he-remains, we-shall-imagine, as already we-imagine, that you him have killed and robbed, since you-come on-top of his horse."
        ormsby: "“Nay, nay,” said the barber, “if you don’t tell us where he is, Sancho Panza, we will suspect as we suspect already, that you have murdered and robbed him, for here you are mounted on his horse;"
        vocab:
          - {w: "vos", d: "you (singular, used to an inferior or an intimate; takes plural verb forms)"}
          - {w: "quedar", d: "to be, remain (somewhere)"}
          - {w: "muerto", d: "here: killed (the participle of morir used for matar, 'to kill')"}
          - {w: "encima de", d: "on top of, upon"}
        diagram:
          - {s: "No, no —dijo el barbero—, Sancho Panza", r: "opening: no, no, said the barber, Sancho Panza"}
          - s: "imaginaremos"
            r: "main verb: we will suppose"
            under:
              - {s: "si vos no nos decís dónde queda", r: "condition: if you don't tell us where he is"}
              - {s: "como ya imaginamos", r: "aside: as we already suppose"}
              - {s: "que vos le habéis muerto y robado", r: "what we will suppose: that you have killed and robbed him"}
              - {s: "pues venís encima de su caballo", r: "why: since you come riding his horse"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "decís", f: "dec- + -ís → decir (to say), present, you (vos takes the vosotros form). decir in the present: digo, dices, dice, decimos, decís, dicen."}
          - {w: "queda", f: "qued- + -a → quedar (to remain), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "imaginaremos", f: "imaginar + -emos → imaginar (to imagine), future, we. The future adds -é, -ás, -á, -emos, -éis, -án to the whole infinitive."}
