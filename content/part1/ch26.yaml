          - {w: "a Rocinante", f: "the 'a' that marks a person as the object, used here also for a named horse."}
          - {w: "deseosos", f: "dese- + -osos → deseo (desire) with -oso: 'desirous', masculine plural to match the two men."}
          - {w: "se fueron", f: "fu- + -eron → irse (to go off), preterite, they. ir borrows ser's preterite: fui, fuiste, fue, fuimos, fuisteis, fueron."}
