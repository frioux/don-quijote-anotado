          - {w: "el añadidura", f: "'añadidura' is feminine, but Cervantes writes 'el', as was still sometimes done before a word beginning with a (compare modern 'el agua')."}
          - {w: "debió de imaginar", f: "deb- + -ió → deber (must), preterite, he, + de + imaginar (to imagine): 'he must have imagined'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "nombrando", f: "gerund of nombrar (to name); with 'en' before it, 'when naming'."}
          - {w: "decía", f: "dec- + -ía → decir (to say), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "se podría entender", f: "podr- + -ía → poder (to be able), conditional, it, + entender (to understand), with passive 'se': 'could be understood'. poder's conditional is built on 'podr-': podría, podrías, podría, podríamos, podríais, podrían."}
