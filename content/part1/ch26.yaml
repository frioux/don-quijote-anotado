          - {w: "referido", d: "aforesaid, quoted above"}
          - {w: "añadidura", d: "addition (feminine; Cervantes' 'el añadidura' is an old usage)"}
          - {w: "deber de", d: "+ infinitive: must have, probably (a guess, not an obligation)"}
