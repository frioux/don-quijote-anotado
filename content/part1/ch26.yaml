          - {w: "se hacían, se acetaban", f: "hac- + -ían → hacer (to make) and acet- + -aban → acetar (to accept), imperfect, they, with passive 'se': 'were made, were accepted'. The imperfect: -ía, -ías, -ía, -íamos, -íais, -ían (for -er/-ir) and -aba, -abas, -aba, -ábamos, -abais, -aban (for -ar)."}
          - {w: "cumplían", f: "cumpl- + -ían → cumplir (to carry out), imperfect, they, sharing the passive 'se': 'were honored'. Same -ía imperfect."}
