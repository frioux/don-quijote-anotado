          - {w: "Consolóle", f: "consol- + -ó + le → consolar (to console), preterite, he, with 'le' (him) on the end: modern 'le consoló'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "díjole", f: "dij- + -o + le → decir (to say), preterite, he, with 'le' (to him) on the end and an accent added: modern 'le dijo'. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
