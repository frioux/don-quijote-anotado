          - {w: "aquellos", f: "'those', masculine plural, used as a pronoun."}
          - {w: "eran", f: "ser (to be), imperfect, they. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "mismo", f: "masculine to match 'lugar': 'his own'."}
          - {w: "hicieron", f: "hic- + -ieron → hacer (to do), preterite, they. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
