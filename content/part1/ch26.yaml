  - sentences:
      - es: "— No hay para qué conmigo amenazas, que yo no soy hombre que robo ni mato a nadie: a cada uno mate su ventura, o Dios, que le hizo."
        literal: "— Not there-is for what with-me threats, for I not am man that rob nor kill [to] nobody: [to] each one may-kill his fortune, or God, who him made."
        ormsby: "“There is no need of threats with me,” said Sancho, “for I am not a man to rob or murder anybody; let his own fate, or God who made him, kill each one;"
        vocab:
          - {w: "no hay para qué", d: "there is no need for, no reason for"}
          - {w: "conmigo", d: "with me"}
          - {w: "amenaza", d: "threat"}
          - {w: "ventura", d: "fortune, fate, lot"}
        diagram:
          - s: "No hay para qué conmigo amenazas"
            r: "main verb 1: there is no need for threats with me"
            under:
              - s: "que yo no soy hombre"
                r: "why: for I am not a man"
                under:
                  - {s: "que robo ni mato a nadie", r: "describes 'hombre': who robs or kills anyone"}
          - s: "a cada uno mate su ventura, o Dios"
            r: "main verb 2, a wish: let each man be killed by his fate, or by God"
            under:
              - {s: "que le hizo", r: "describes 'Dios': who made him"}
        forms:
          - {w: "hay", f: "the form of haber meaning 'there is, there are'."}
          - {w: "conmigo", f: "con + mí fused into one word: 'with me' (also contigo, consigo)."}
          - {w: "soy", f: "ser (to be), present, I. soy, eres, es, somos, sois, son."}
          - {w: "robo, mato", f: "rob- + -o → robar (to rob), mat- + -o → matar (to kill), present, I: Sancho keeps 'I' after 'hombre que', 'a man who (I) rob'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "no ... ni ... nadie", f: "stacked negatives: Spanish keeps 'no' before the verb and adds 'ni' and 'nadie', all meaning one 'not'."}
          - {w: "mate", f: "mat- + -e → matar (to kill), present subjunctive, it (his fate): 'let it kill'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "hizo", f: "hacer (to make), preterite, he. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
      - es: "Mi amo queda haciendo penitencia en la mitad desta montaña, muy a su sabor."
