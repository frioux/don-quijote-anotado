  - sentences:
      - es: "Árboles, yerbas y plantas que en aqueste sitio estáis, tan altos, verdes y tantas, si de mi mal no os holgáis, escuchad mis quejas santas."
        literal: "Trees, grasses and plants that in this place you-are, so tall, green and so-many, if of my ill not yourselves you-rejoice, listen-to my complaints holy."
        ormsby: "Ye on the mountain side that grow, / Ye green things all, trees, shrubs, and bushes, / Are ye aweary of the woe / That this poor aching bosom crushes?"
        ormsby_match: false
        vocab:
          - {w: "yerba", d: "= hierba, grass, herb (old spelling)"}
          - {w: "aqueste", d: "= este, this (old poetic form)"}
          - {w: "sitio", d: "place, spot"}
          - {w: "holgarse de", d: "to be glad at, take pleasure in"}
          - {w: "queja", d: "complaint, lament"}
          - {w: "santo", d: "holy; here 'sincere, blameless'"}
        diagram:
          - s: "escuchad mis quejas santas"
            r: "main verb, a command: listen to my holy complaints"
            under:
              - s: "Árboles, yerbas y plantas"
                r: "who is addressed: trees, grasses and plants"
                under:
                  - {s: "que en aqueste sitio estáis", r: "describes them: you who are in this place"}
                  - {s: "tan altos, verdes y tantas", r: "describes them, 2: so tall, so green and so many"}
              - {s: "si de mi mal no os holgáis", r: "condition: if you take no pleasure in my pain"}
        forms:
          - {w: "aqueste", f: "old form of 'este' (this), masculine to match 'sitio'; also aquesta, aquestos."}
          - {w: "estáis", f: "est- + -áis → estar (to be), present, you all (vosotros). estoy, estás, está, estamos, estáis, están."}
          - {w: "altos, tantas", f: "altos is masculine plural to match 'árboles'; tantas is feminine plural to match 'plantas', the nearest noun. Each adjective agrees with a different noun of the list."}
          - {w: "os holgáis", f: "holg- + -áis → holgarse (to take pleasure), present, you all, with 'os' (yourselves). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an; the stem o becomes ue when stressed (huelgo, huelgas, huelga), but not in the vosotros form."}
          - {w: "escuchad", f: "escuch- + -ad → escuchar (to listen), command, you all. The vosotros command drops the -r of the infinitive and adds -d."}
          - {w: "mis", f: "'my', plural to match 'quejas'."}
        note: "The stanza is a 'copla real' of short eight-syllable lines rhyming in -antas / -áis, then -ote / -ea; every stanza ends with the broken half-line 'del Toboso', which spoils the metre."
      - es: "Mi dolor no os alborote, aunque más terrible sea, pues, por pagaros escote, aquí lloró don Quijote ausencias de Dulcinea del Toboso."
        literal: "My pain not you may-it-disturb, although more terrible it-may-be, since, to pay-you share, here wept Don Quijote absences of Dulcinea del Toboso."
        ormsby: "If it disturb you, and I owe / Some reparation, it may be a / Defence for me to let you know / Don Quixote’s tears are on the flow, / And all for distant Dulcinea / Del Toboso."
        ormsby_match: false
        vocab:
          - {w: "alborotar", d: "to disturb, upset, throw into an uproar"}
          - {w: "aunque más", d: "however much, even if"}
          - {w: "pagar escote", d: "to pay one's share (of a shared meal or bill); here, to pay the trees for their hospitality"}
          - {w: "ausencias", d: "absence, being away from someone (the plural is poetic)"}
        diagram:
          - s: "Mi dolor no os alborote"
            r: "main verb 1, a wish: let my pain not trouble you"
            under:
              - {s: "aunque más terrible sea", r: "concession: however terrible it may be"}
          - s: "aquí lloró don Quijote"
            r: "main verb 2: here Don Quijote wept"
            under:
              - {s: "pues", r: "linking: since, for"}
              - {s: "por pagaros escote", r: "why: to pay you his share"}
              - {s: "ausencias de Dulcinea del Toboso", r: "object: (for) his absence from Dulcinea del Toboso"}
        forms:
          - {w: "alborote", f: "alborot- + -e → alborotar (to disturb), present subjunctive, it. The subjunctive with 'no' makes a wish or polite command. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "sea", f: "ser (to be), present subjunctive, it, after 'aunque más'. sea, seas, sea, seamos, seáis, sean."}
          - {w: "pagaros", f: "pagar (to pay) + os (to you all) on the end of the infinitive."}
          - {w: "lloró", f: "llor- + -ó → llorar (to weep), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
        note: "The joke is the rhyme: Cervantes rhymes 'Quijote' with 'alborote' and 'escote' (a tavern word for splitting the bill), and must add 'del Toboso' to Dulcinea's name even though it breaks the metre."
