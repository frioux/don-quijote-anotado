          - {w: "poca", f: "poc- + -a → poco (little), feminine to match 'risa'."}
          - {w: "hallaron, imaginaron", f: "hall- + -aron → hallar (to find), imagin- + -aron → imaginar (to imagine), preterite, they. Same -ar preterite."}
