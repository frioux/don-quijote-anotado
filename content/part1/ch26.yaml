        ormsby_note: "It is thus the passage stands in the first edition. In the second Don Quixote makes his rosary with oak galls off a cork tree. The alteration was made, no doubt, at the suggestion of some critics who thought the passage indecorous, but Cervantes had nothing to do with it."
