          - {w: "desta", f: "de + esta (of this), fused."}
  - sentences:
      - es: "Y luego, de corrida y sin parar, les contó de la suerte que quedaba, las aventuras que le habían sucedido y cómo llevaba la carta a la señora Dulcinea del Toboso, que era la hija de Lorenzo Corchuelo, de quien estaba enamorado hasta los hígados."
        literal: "And then, at a-run and without stopping, to-them he-told of the manner that he-remained, the adventures that to-him had happened and how he-was-carrying the letter to the lady Dulcinea del Toboso, who was the daughter of Lorenzo Corchuelo, of whom he-was in-love up-to the livers."
        ormsby: "and then, offhand and without stopping, he told them how he had left him, what adventures had befallen him, and how he was carrying a letter to the lady Dulcinea del Toboso, the daughter of Lorenzo Corchuelo, with whom he was over head and ears in love."
        vocab:
          - {w: "de corrida", d: "in one breath, rattling it off"}
          - {w: "suerte", d: "manner, state (not 'luck' here)"}
          - {w: "suceder", d: "to happen, befall"}
          - {w: "Lorenzo Corchuelo", d: "the peasant father of Aldonza Lorenzo, the farm girl Don Quijote has turned into 'Dulcinea'"}
          - {w: "enamorado hasta los hígados", d: "in love 'up to the liver', head over heels in love"}
        diagram:
          - s: "les contó"
            r: "main verb: he told them"
            under:
              - {s: "Y luego, de corrida y sin parar", r: "how: then, in one breath and without stopping"}
              - {s: "de la suerte que quedaba", r: "what 1: about the state he (Don Quijote) was in"}
              - {s: "las aventuras que le habían sucedido", r: "what 2: the adventures that had happened to him"}
              - s: "y cómo llevaba la carta a la señora Dulcinea del Toboso"
                r: "what 3: and how he was carrying the letter to the lady Dulcinea"
                under:
                  - s: "que era la hija de Lorenzo Corchuelo"
                    r: "describes 'Dulcinea': who was Lorenzo Corchuelo's daughter"
                  - {s: "de quien estaba enamorado hasta los hígados", r: "describes 'Dulcinea', 2: with whom he (Don Quijote) was madly in love"}
        forms:
          - {w: "contó", f: "cont- + -ó → contar (to tell), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "quedaba, llevaba, estaba", f: "qued- + -aba → quedar (to remain), llev- + -aba → llevar (to carry), est- + -aba → estar (to be), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "habían sucedido", f: "habían (haber, imperfect, they: había, habías, había, habíamos, habíais, habían) + sucedido, the participle of suceder (to happen): 'had happened'."}
          - {w: "era", f: "ser (to be), imperfect, she. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "enamorado", f: "participle of enamorar (to make fall in love), masculine to match Don Quijote: 'in love'."}
        ormsby_note: "The Spanish phrase is stronger, hasta los higados, 'down to the liver.'"
        note: "Sancho gives away the secret Don Quijote hid even from himself: that 'Dulcinea' is Aldonza, the daughter of a local farmer, Lorenzo Corchuelo, as Sancho learned in the previous chapter."
