  - sentences:
      - es: "— He perdido el libro de memoria —respondió Sancho—, donde venía carta para Dulcinea y una cédula firmada de su señor, por la cual mandaba que su sobrina me diese tres pollinos, de cuatro o cinco que estaban en casa."
        literal: "— I-have lost the book of memory —answered Sancho—, where came letter for Dulcinea and a warrant signed by his lord, by the which he-ordered that his niece to-me should-give three donkey-colts, of four or five that were at home."
        ormsby: "“I have lost the notebook,” said Sancho, “that contained the letter to Dulcinea, and an order signed by my master in which he directed his niece to give me three ass-colts out of four or five he had at home;”"
        vocab:
          - {w: "libro de memoria", d: "notebook, pocket-book"}
          - {w: "venir", d: "here: to be contained, appear (in a book)"}
          - {w: "cédula", d: "written order, warrant, IOU"}
          - {w: "firmado de", d: "signed by"}
          - {w: "sobrina", d: "niece (Don Quijote's niece, who keeps house with him)"}
        diagram:
          - s: "He perdido el libro de memoria"
            r: "main verb: I have lost the notebook"
            under:
              - {s: "respondió Sancho", r: "speech tag: answered Sancho"}
              - s: "donde venía carta para Dulcinea y una cédula firmada de su señor"
                r: "describes 'libro': which held a letter for Dulcinea and an order signed by his master"
                under:
                  - s: "por la cual mandaba"
                    r: "describes 'cédula': by which he ordered"
                    under:
                      - {s: "que su sobrina me diese tres pollinos", r: "what he ordered: that his niece give me three donkey colts"}
                      - {s: "de cuatro o cinco que estaban en casa", r: "out of what: out of the four or five at home"}
        forms:
          - {w: "He perdido", f: "he (haber, present, I: he, has, ha, hemos, habéis, han) + perdido, the participle of perder (to lose): 'I have lost'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "venía", f: "ven- + -ía → venir (to come), imperfect, it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "firmada", f: "participle of firmar (to sign), feminine to match 'cédula'."}
          - {w: "mandaba", f: "mand- + -aba → mandar (to order), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "diese", f: "di- + -ese → dar (to give), imperfect subjunctive (-se form), she, after an order ('mandar que'). dar: diese, dieses, diese, diésemos, dieseis, diesen."}
          - {w: "estaban", f: "est- + -aban → estar (to be), imperfect, they. Same -aba imperfect."}
        note: "Don Quijote had promised Sancho three of the five donkey colts he kept at home to make up for the loss of Sancho's own donkey, and wrote the order to his niece in the same notebook as the love letter."
