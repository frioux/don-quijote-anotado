          - {w: "bellísima", f: "bell- + -ísima → bello (beautiful) + -ísimo (very, most), feminine to match 'Zoraida'."}
          - {w: "aguardándonos", f: "gerund of aguardar (to wait for) + nos (us), accent added."}
