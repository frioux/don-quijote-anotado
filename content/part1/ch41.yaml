                    r: "how: without being accompanied or followed by some evil"
                    under:
                      - {s: "que le turbe o sobresalte", r: "describes 'mal': that may disturb or startle it"}
              - {s: "nuestra ventura", r: "subject 1: our fortune"}
              - s: "o quizá las maldiciones"
                r: "subject 2: or perhaps the curses"
                under:
                  - {s: "que el moro a su hija había echado", r: "describes 'maldiciones': that the Moor had hurled at his daughter"}
                  - {s: "que siempre se han de temer de cualquier padre que sean", r: "describes 'maldiciones', 2: which must always be feared, whatever father they come from"}
        forms:
          - {w: "viene", f: "vien- + -e → venir (to come), present, it (the good). Irregular: vengo, vienes, viene, venimos, venís, vienen."}
          - {w: "ser acompañado o seguido", f: "infinitive of ser (to be) + the participles of acompañar (to accompany) and seguir (to follow): a passive infinitive after 'sin', 'without being accompanied or followed'."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun ('mal'), like un, buen, ningún."}
          - {w: "turbe", f: "turb- + -e → turbar (to disturb), present subjunctive, it (the evil). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. Subjunctive because 'algún mal que' describes a kind of thing, not a known one."}
          - {w: "sobresalte", f: "sobresalt- + -e → sobresaltar (to startle), present subjunctive, it, joined to 'turbe' by 'o'. Same -e subjunctive: sobresalte, sobresaltes, sobresalte, sobresaltemos, sobresaltéis, sobresalten."}
          - {w: "quiso", f: "quis- + -o → querer (to want, to will), preterite, it (fortune). Irregular: quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "había echado", f: "hab- + -ía → haber (to have, auxiliary), imperfect, he, + echado, the participle of echar (to throw, to cast): pluperfect, 'had cast'. haber (to have) in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "se han de temer", f: "han → haber (to have), present, they: he, has, ha, hemos, habéis, han; 'haber de' + temer (to fear) = 'must be feared'; 'se' makes it passive, 'are to be feared'."}
          - {w: "sean", f: "se- + -an → ser (to be), present subjunctive, they: sea, seas, sea, seamos, seáis, sean. Subjunctive after 'de cualquier padre que' (from whatever father)."}
        note: "When Zoraida's father was put ashore at the end of the previous paragraph, he cursed her as the boat sailed away. A father's curse was believed to carry real weight, hence the captive's half-serious suggestion that it caused what follows."
      - es: "quiso, digo, que estando ya engolfados y siendo ya casi pasadas tres horas de la noche, yendo con la vela tendida de alto baja, frenillados los remos, porque el próspero viento nos quitaba del trabajo de haberlos menester, con la luz de la luna, que claramente resplandecía, vimos cerca de nosotros un bajel redondo, que, con todas las velas tendidas, llevando un poco a orza el timón, delante de nosotros atravesaba;"
