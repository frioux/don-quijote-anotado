summary: |
  The captive goes on with his story. Within a fortnight the renegade buys a boat that holds more than thirty people and makes several trading trips to Sargel to make it look honest, anchoring each time in a cove near the garden of Agi Morato. The captive, now ransomed, finds twelve Spanish rowers and tells them to wait by the garden on the next Friday night. The day before, pretending to gather herbs for a salad, he goes to the garden himself. Agi Morato questions him in the mixed language of captives and Moors, and Zoraida comes out dressed in pearls and gold. While her father goes off to drive away some Turks who have jumped the wall, she asks whether he is leaving; he promises she will come with him. When her father returns she pretends to faint in the captive's arms.

  On the Friday night the Christians seize the boat and tie up its Moorish rowers, then go to the garden. Zoraida comes down with a little chest full of gold crowns, but her father wakes and cries out 'Christians! thieves!', and is carried off bound and gagged. Zoraida begs them to free him; the renegade says they will release the Moors at the first Christian land. A north wind forces them along the coast towards Oran. At sea Agi Morato sees his daughter dressed in her finest clothes and her jewel chest on board, and learns from the renegade and from her own mouth that she is a Christian and came willingly. He throws himself into the sea and is pulled out half drowned.

  Bad weather drives them into a cove under the cape the Moors call 'la Cava Rumía'. When the wind turns they set the Moors ashore. Agi Morato curses his daughter, then begs her to come back, and Zoraida answers in tears that she could not have done otherwise. In open sea that night a French corsair ship fires on them, sinks their boat, and strips them of everything, Zoraida's jewels included; the renegade throws her chest overboard before the French can see it. The French captain, bound for La Rochelle, gives them a skiff near the Spanish coast and gives Zoraida forty gold crowns.

  They land at night under a high mountain and climb inland. A young shepherd sees the Moorish dress of the renegade and Zoraida and raises the alarm, and the mounted coastguard rides up; one of the freed captives recognises its leader as his uncle, and they learn they are near Vélez Málaga. The town welcomes them, Zoraida sees images of Lela Marién in the church, and after six days the renegade goes to Granada to be received back into the Church through the Inquisition. The captive and Zoraida, with only the French captain's crowns, are on their way to find out whether his father and brothers are alive. Here the captive ends his story.
context: |
  The escape. The plan the captive describes, a renegade who buys a boat in Algiers and makes trading trips to cover the flight, money supplied from inside, rowers gathered from among the captives, is the kind of plot Cervantes himself made during his five years in Algiers. His last attempt, in 1579, was a plan of this sort, with Valencian merchants putting up money for an armed boat to carry a large party of captives away; it was betrayed before it could sail. In the novel the plan succeeds. Ormsby notes that the Arnaute Mamí, the Albanian corsair the captive names as his master, really did capture the galley Sol on which Cervantes and his brother Rodrigo were sailing home, and that he was known for his cruelty.

  Barbary and its peoples. The chapter is full of the vocabulary of North Africa. Tagarinos were Moriscos from Aragón, mudéjares here those from Granada, and Cervantes says that in Fez the same people were called 'elches', a word Spaniards more usually used for renegades. Moors and Turks were different peoples: Algiers was an Ottoman possession ruled by a Turkish soldiery, and the Moors of the town feared and resented the Janissaries, as the episode of the four Turks in the garden shows. Captives and Moors talked in the 'lengua franca', a trading language mixed from Spanish, Italian, Arabic and other tongues, in which Zoraida says 'Tameji, cristiano?' and calls the Christians 'Nizarani'. Ormsby explains the zoltaní, an Algerian gold coin, and the tramontana, a north wind 'so called from coming across the Alps'. Corsairs of every flag worked these waters, from Tetuán and Algiers as well as from France, and the French ship that robs the fugitives, bound for La Rochelle, treats Christian captives no better than the Moors did.

  La Cava. The cove where the fugitives shelter lies under a headland the Moors call 'la Cava Rumía', 'the wicked Christian woman'. In Spanish legend La Cava was the daughter of Count Julian; King Rodrigo dishonoured her, and her father in revenge let the Moors into Spain in 711, so that Spain was 'lost' through her. Ormsby notes that the real name of the monument there means 'the Christian's tomb'. The irony is plain: a Moorish daughter fleeing her father to Christian Spain rests under the tomb of the Christian daughter whose story gave Spain to the Moors.

  Father and daughter. The heart of the chapter is not the escape but Agi Morato. Cervantes gives him the most moving speeches in the tale: his bewilderment at his daughter's finery, his plunge into the sea, his curses and then his plea from the beach to come back and leave the money. Zoraida's answer, that she could not have done otherwise, is meant to be justified by her faith, yet the captive himself says the father's curses are to be feared 'whatever kind of father they come from', and blames them for the misfortune with the French. Readers have argued ever since about how much sympathy Cervantes means us to keep for the father.

  Religion and law. Zoraida's conversion is incomplete: she prays to Lela Marién, the Virgin Mary, and in the church at Vélez she recognises 'her' face in the images, which the renegade explains to her. She is not yet baptised. The renegade, as an apostate, could only rejoin the Church by presenting himself to the Inquisition, which received such men back ('reducirse al gremio de la Iglesia') once it had examined them; the tribunal of Granada was the one nearest Vélez. The Spanish coast had a mounted coastguard against Barbary raids, which is why a shepherd's cry of '¡Moros!' brings fifty horsemen in two hours. Ormsby places the mountain where they land as probably the Sierra Tejeda and Vélez Málaga about eighteen miles east of Málaga.

  The narrator's game. The chapter ends the captive's long story, which began in chapter 39, and he closes it like an author, asking his listeners to judge whether it was 'agradable y peregrina' and apologising for its length. He has been telling it all evening in the inn to Don Quijote, the priest, Don Fernando and the others, and Zoraida, who rides the animal he bought with the French captain's crowns, is in the room.

  Reading Cervantes' Spanish. The archaisms of the chapter: agora (ahora), priesa (prisa), estremo (extremo), efeto (efecto), ansí (así), mesmo (mismo), recebir (recibir), escuro (oscuro), cosarios (corsarios), circustancias (circunstancias), vee (ve), entrambos (ambos), and fused forms like della, dellos, desta, destos, dese. Infinitives with a pronoun turn -rl- into -ll- (dalle, decille, recogella, despertalle, solenizalle). Pronouns hang on the end of verbs that open a clause, and the vosotros preterite still ends in -stes (pusistes). The -se imperfect subjunctive runs through the planning and reporting (llegásemos, desembarcásemos, dijese), the -ra form serves as a conditional (dijera, quisiera), and the future subjunctive marks open futures. Watch the false friends and shifted words: peregrino (rare, strange), puesto que (although), discurso (long deliberation), suceso (outcome, as in 'buen suceso'), and 'ser vivo' for 'to be alive'.
