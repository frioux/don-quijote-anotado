  - sentences:
      - es: "»Habíanse puesto a bordo del bajel a preguntarnos quién éramos, y adónde navegábamos, y de dónde veníamos; pero, por preguntarnos esto en lengua francesa, dijo nuestro renegado: «Ninguno responda; porque éstos, sin duda, son cosarios franceses, que hacen a toda ropa». Por este advertimiento, ninguno respondió palabra;"
        literal: "»Had-placed-themselves at side of-the vessel to ask-us who we-were, and whither we-were-sailing, and from where we-were-coming; but, because-of asking-us this in tongue French, said our renegade: «None may-answer; because these, without doubt, are corsairs French, who do to all cloth». Through this warning, none answered word;"
        ormsby: "They came to the side of the ship to ask who we were, whither we were bound, and whence we came, but as they asked this in French our renegade said, “Let no one answer, for no doubt these are French corsairs who plunder all comers.” Acting on this warning no one answered a word,"
        vocab:
          - {w: "ponerse a bordo", d: "to come to the ship's side, to the rail"}
          - {w: "lengua francesa", d: "the French language"}
          - {w: "renegado", d: "renegade: a Christian who had turned Muslim, here the Murcian who arranged the escape"}
          - {w: "cosario", d: "= corsario, corsair, privateer, pirate (old form)"}
          - {w: "hacer a toda ropa", d: "to take any cargo at all, plunder anyone, friend or foe ('ropa' = goods, cargo)"}
          - {w: "advertimiento", d: "= advertencia, warning (old form)"}
        diagram:
          - s: "Habíanse puesto a bordo del bajel"
            r: "main verb 1: they had come to the ship's rail"
            under:
              - s: "a preguntarnos"
                r: "why: to ask us"
                under:
