          - {w: "nos lo declaraba", f: "declar- + -aba → declarar (to explain), imperfect, he; 'lo' repeats the object 'Todo lo que el moro decía' put at the front, and 'nos' is 'to us'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "respondía", f: "respond- + -ía → responder (to answer), imperfect, she. Same -ía imperfect as 'decía'."}
      - es: "Pero, cuando él vio a un lado de la barca el cofrecillo donde ella solía tener sus joyas, el cual sabía él bien que le había dejado en Argel, y no traídole al jardín, quedó más confuso, y preguntóle que cómo aquel cofre había venido a nuestras manos, y qué era lo que venía dentro."
        literal: "But, when he saw at one side of the boat the little-chest where she used to-keep her jewels, the which knew he well that it he-had left in Argel, and not brought-it to-the garden, he-remained more confused, and asked-her that how that chest had come to our hands, and what was that which was-coming inside."
        ormsby: "But when he observed in one corner of the vessel the little trunk in which she used to keep her jewels, which he well knew he had left in Algiers and had not brought to the garden, he was still more amazed, and asked her how that trunk had come into our hands, and what there was in it."
        vocab:
          - {w: "cofrecillo", d: "little chest, jewel box (diminutive of 'cofre')"}
          - {w: "soler", d: "to be in the habit of; 'solía tener' = used to keep"}
          - {w: "quedar confuso", d: "to be left bewildered, perplexed"}
          - {w: "venir a las manos de", d: "to come into someone's hands"}
        diagram:
          - s: "quedó más confuso"
            r: "main verb 1: he was more bewildered"
            under:
              - s: "cuando él vio a un lado de la barca el cofrecillo"
                r: "when: when he saw the little chest at one side of the boat"
                under:
                  - {s: "donde ella solía tener sus joyas", r: "describes 'cofrecillo': where she used to keep her jewels"}
                  - s: "el cual sabía él bien"
                    r: "describes 'cofrecillo': which he knew well"
                    under:
                      - {s: "que le había dejado en Argel", r: "what he knew, 1: that he had left it in Algiers"}
                      - {s: "y no traídole al jardín", r: "what he knew, 2: and not brought it to the garden"}
          - s: "y preguntóle"
            r: "main verb 2: and he asked her"
            under:
              - {s: "que cómo aquel cofre había venido a nuestras manos", r: "question 1: how that chest had come into our hands"}
              - {s: "y qué era lo que venía dentro", r: "question 2: and what was inside it"}
        forms:
          - {w: "vio", f: "v- + -io → ver (to see), preterite, he. Irregular: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "cofrecillo", f: "cofre (chest) + -cillo, the diminutive suffix: 'little chest'."}
          - {w: "solía", f: "sol- + -ía → soler (to be in the habit of), imperfect, she, + infinitive 'tener' (to keep). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "sabía", f: "sab- + -ía → saber (to know), imperfect, he. Same -ía imperfect."}
          - {w: "le había dejado", f: "hab- + -ía → haber (to have, auxiliary), imperfect, he, + dejado, the participle of dejar (to leave): the pluperfect, 'he had left'. haber (to have) in the imperfect: había, habías, había, habíamos, habíais, habían. 'le' for the thing (the chest) is leísmo, modern 'lo'."}
          - {w: "traídole", f: "traído, the participle of traer (to bring), + le (it), the pronoun hung on the participle, still governed by 'había': 'and (had) not brought it'."}
          - {w: "quedó", f: "qued- + -ó → quedar (to remain, be left), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "preguntóle", f: "pregunt- + -ó + le → preguntar (to ask), preterite, he, with 'le' (her) stuck on the end; modern 'le preguntó'. Same -ó preterite. Cervantes hangs the pronoun on a verb that opens its clause."}
          - {w: "había venido", f: "había (haber (to have, auxiliary), imperfect, it: había, habías, había, habíamos, habíais, habían) + venido, the participle of venir (to come): 'had come'."}
          - {w: "era, venía", f: "er- + -a → ser (to be), imperfect, it: era, eras, era, éramos, erais, eran; veni- + -ía → venir (to come), imperfect, it: venía, venías, venía, veníamos, veníais, venían."}
        note: "The chest holds the jewels Zoraida brought from her father's house, a large part of his fortune. The Spanish 'que cómo' keeps the 'que' of reported speech in front of the question word, which English drops."
