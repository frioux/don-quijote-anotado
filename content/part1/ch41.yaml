  - sentences:
      - es: "»Demasiada cosa sería decir yo agora la mucha hermosura, la gentileza, el gallardo y rico adorno con que mi querida Zoraida se mostró a mis ojos: sólo diré que más perlas pendían de su hermosísimo cuello, orejas y cabellos, que cabellos tenía en la cabeza."
        literal: "»Too-much thing would-be to-tell I now the much beauty, the grace, the splendid and rich adornment with which my beloved Zoraida herself showed to my eyes: only I-will-say that more pearls hung from her most-beautiful neck, ears and hair, than hairs she-had on the head."
        ormsby: "It would be beyond my power now to describe to you the great beauty, the highbred air, the brilliant attire of my beloved Zoraida as she presented herself before my eyes. I will content myself with saying that more pearls hung from her fair neck, her ears, and her hair than she had hairs on her head."
        vocab:
          - {w: "demasiada cosa", d: "too much, more than I could manage"}
          - {w: "agora", d: "= ahora, now (old form)"}
          - {w: "gentileza", d: "grace, elegance, fine bearing (not 'gentleness')"}
          - {w: "gallardo", d: "splendid, fine, dashing"}
          - {w: "adorno", d: "adornment, finery, attire"}
          - {w: "pender de", d: "to hang from"}
          - {w: "cabellos", d: "hair; in the plural, the hairs of the head"}
        diagram:
          - s: "Demasiada cosa sería"
            r: "main verb 1: it would be too much"
            under:
              - s: "decir yo agora"
                r: "subject: for me to tell now"
                under:
                  - s: "la mucha hermosura, la gentileza, el gallardo y rico adorno"
                    r: "object: the great beauty, the grace, the fine rich attire"
                    under:
                      - {s: "con que mi querida Zoraida se mostró a mis ojos", r: "describes them: in which my beloved Zoraida showed herself to me"}
          - s: "sólo diré"
            r: "main verb 2: I will only say"
            under:
              - s: "que más perlas pendían de su hermosísimo cuello, orejas y cabellos"
                r: "what I'll say: that more pearls hung from her neck, ears and hair"
                under:
                  - {s: "que cabellos tenía en la cabeza", r: "comparison: than she had hairs on her head"}
        forms:
          - {w: "Demasiada", f: "demasiad- + -a → demasiado (too much), feminine to match 'cosa'."}
          - {w: "sería", f: "ser- + -ía → ser (to be), conditional, it. The conditional adds endings to the whole infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "agora", f: "old form of ahora (now)."}
          - {w: "querida", f: "querid- + -a → querido, participle of querer (to love) used as an adjective, feminine to match 'Zoraida': 'beloved'."}
          - {w: "se mostró", f: "mostr- + -ó → mostrarse (to show oneself), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "diré", f: "dir- + -é → decir (to say), future, I. Irregular stem dir-: diré, dirás, dirá, diremos, diréis, dirán."}
