  - sentences:
      - es: "»Pusimos nuestras centinelas en tierra, y no dejamos jamás los remos de la mano; comimos de lo que el renegado había proveído, y rogamos a Dios y a Nuestra Señora, de todo nuestro corazón, que nos ayudase y favoreciese para que felicemente diésemos fin a tan dichoso principio."
        literal: "»We-put our sentries on land, and not we-left ever the oars from the hand; we-ate of that which the renegade had provided, and we-begged to God and to Our Lady, from all our heart, that us he-might-help and favour so-that happily we-might-give end to so fortunate beginning."
        ormsby: "We posted a lookout on shore, and never let the oars out of our hands, and ate of the stores the renegade had laid in, imploring God and Our Lady with all our hearts to help and protect us, that we might give a happy ending to a beginning so prosperous."
        vocab:
          - {w: "centinela", d: "sentry, lookout (feminine in Cervantes, 'las centinelas')"}
          - {w: "proveer", d: "to provide, lay in (supplies)"}
          - {w: "rogar", d: "to beg, pray"}
          - {w: "Nuestra Señora", d: "Our Lady, the Virgin Mary"}
          - {w: "favorecer", d: "to favour, protect"}
          - {w: "felicemente", d: "= felizmente, happily, successfully (old form)"}
          - {w: "dar fin a", d: "to bring to an end, complete"}
          - {w: "dichoso", d: "fortunate, lucky, happy"}
        diagram:
          - s: "Pusimos nuestras centinelas en tierra"
            r: "main verb 1: we posted our sentries on land"
          - s: "y no dejamos jamás los remos de la mano"
            r: "main verb 2: and we never let the oars out of our hands"
          - s: "comimos"
            r: "main verb 3: we ate"
            under:
              - {s: "de lo que el renegado había proveído", r: "what: some of what the renegade had laid in"}
          - s: "y rogamos a Dios y a Nuestra Señora"
            r: "main verb 4: and we prayed to God and Our Lady"
            under:
              - {s: "de todo nuestro corazón", r: "how: with all our hearts"}
              - s: "que nos ayudase y favoreciese"
                r: "what we prayed for: that he help and favour us"
                under:
                  - {s: "para que felicemente diésemos fin a tan dichoso principio", r: "why: so that we might happily finish so fortunate a beginning"}
        forms:
          - {w: "Pusimos", f: "pus- + -imos → poner (to put), preterite, we. Irregular: puse, pusiste, puso, pusimos, pusisteis, pusieron."}
          - {w: "nuestras", f: "nuestr- + -as → nuestro (our), feminine plural to match 'centinelas'."}
          - {w: "dejamos, comimos, rogamos", f: "dej- + -amos → dejar (to leave), com- + -imos → comer (to eat), rog- + -amos → rogar (to beg): preterite, we. The -ar preterite: -é, -aste, -ó, -amos, -asteis, -aron; the -er/-ir preterite: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "había proveído", f: "hab- + -ía → haber (to have, auxiliary), imperfect, he, + proveído, the participle of proveer (to provide): the pluperfect, 'had laid in'. haber (to have) in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "ayudase, favoreciese", f: "ayud- + -ase → ayudar (to help) and favorec- + -iese → favorecer (to favour), imperfect subjunctive (-se form), he (God), after 'rogamos que': -ase, -ases, -ase, -ásemos, -aseis, -asen for -ar verbs; -iese, -ieses, -iese, -iésemos, -ieseis, -iesen for -er verbs. The singular treats 'God and Our Lady' as one helper."}
          - {w: "felicemente", f: "felice (old form of feliz, happy) + -mente → 'happily'."}
          - {w: "diésemos", f: "d- + -iésemos → dar (to give), imperfect subjunctive (-se form), we, after 'para que' (so that): diese, dieses, diese, diésemos, dieseis, diesen."}
      - es: "Diose orden, a suplicación de Zoraida, como echásemos en tierra a su padre y a todos los demás moros que allí atados venían, porque no le bastaba el ánimo, ni lo podían sufrir sus blandas entrañas, ver delante de sus ojos atado a su padre y aquellos de su tierra presos."
        literal: "Gave-itself order, at entreaty of Zoraida, how we-should-put on land to her father and to all the other Moors who there bound were-coming, because not to-her sufficed the spirit, nor it could suffer her soft entrails, to-see before her eyes bound to her father and those of her land prisoners."
        ormsby: "At the entreaty of Zoraida orders were given to set on shore her father and the other Moors who were still bound, for she could not endure, nor could her tender heart bear to see her father in bonds and her fellow-countrymen prisoners before her eyes."
        vocab:
          - {w: "suplicación", d: "entreaty, plea"}
          - {w: "como", d: "here 'that' after 'dar orden' (gave orders that)"}
          - {w: "echar en tierra", d: "to put ashore"}
          - {w: "atado", d: "tied up, bound"}
          - {w: "bastar el ánimo", d: "to have the heart, have the courage ('no le bastaba el ánimo' = she had not the heart)"}
          - {w: "sufrir", d: "to bear, endure (as well as 'to suffer')"}
          - {w: "blando", d: "soft, tender"}
          - {w: "entrañas", d: "insides, heart, feelings (literally 'entrails')"}
          - {w: "preso", d: "imprisoned, a prisoner"}
        diagram:
          - s: "Diose orden"
            r: "main verb: orders were given"
            under:
              - {s: "a suplicación de Zoraida", r: "why: at Zoraida's entreaty"}
              - s: "como echásemos en tierra a su padre y a todos los demás moros"
                r: "what was ordered: that we put her father and all the other Moors ashore"
                under:
                  - {s: "que allí atados venían", r: "describes 'moros': who were there tied up"}
              - s: "porque no le bastaba el ánimo"
                r: "why, 1: because she had not the heart"
                under:
                  - {s: "ni lo podían sufrir sus blandas entrañas", r: "why, 2: nor could her tender heart bear it"}
                  - {s: "ver delante de sus ojos atado a su padre y aquellos de su tierra presos", r: "what she could not bear: to see before her eyes her father bound and her countrymen prisoners"}
        forms:
          - {w: "Diose", f: "di- + -o + se → dar (to give), preterite, it, with 'se' stuck on the end: 'there was given'; modern 'se dio'. Cervantes hangs the pronoun on a verb that opens its clause. Irregular: di, diste, dio, dimos, disteis, dieron."}
          - {w: "echásemos", f: "ech- + -ásemos → echar (to put, throw), imperfect subjunctive (-se form), we, after an order: echase, echases, echase, echásemos, echaseis, echasen."}
          - {w: "demás", f: "'other, the rest', the same for all genders and numbers."}
          - {w: "atados, atado", f: "participle of atar (to tie): 'atados' masculine plural to match 'moros', 'atado' masculine singular to match 'su padre'."}
          - {w: "venían", f: "ven- + -ían → venir (to come), imperfect, they: here just 'were (there)'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "bastaba", f: "bast- + -aba → bastar (to suffice), imperfect, it (the spirit). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "podían", f: "pod- + -ían → poder (to be able), imperfect, they (her 'entrañas'). Same -ía imperfect as 'venían'."}
          - {w: "blandas", f: "bland- + -as → blando (soft), feminine plural to match 'entrañas'."}
          - {w: "ver", f: "infinitive of ver (to see): the real subject of 'bastaba' and 'sufrir'."}
          - {w: "presos", f: "pres- + -os → preso (imprisoned), the old participle of prender (to seize), masculine plural to match 'aquellos'."}
      - es: "Prometímosle de hacerlo así al tiempo de la partida, pues no corría peligro el dejallos en aquel lugar, que era despoblado."
        literal: "We-promised-her of doing-it so at-the time of the departure, since not ran danger the leaving-them in that place, which was unpopulated."
        ormsby: "We promised her to do this at the moment of departure, for as it was uninhabited we ran no risk in releasing them at that place."
        vocab:
          - {w: "prometer de", d: "to promise to (the 'de' is old usage)"}
          - {w: "al tiempo de", d: "at the time of, at the moment of"}
          - {w: "partida", d: "departure"}
          - {w: "correr peligro", d: "to be at risk, be dangerous"}
          - {w: "despoblado", d: "uninhabited, deserted"}
        diagram:
          - s: "Prometímosle"
            r: "main verb: we promised her"
            under:
              - {s: "de hacerlo así", r: "what: to do so"}
              - {s: "al tiempo de la partida", r: "when: at the moment of leaving"}
              - s: "pues no corría peligro el dejallos en aquel lugar"
                r: "why: since leaving them in that place was no risk"
                under:
                  - {s: "que era despoblado", r: "describes 'lugar': which was uninhabited"}
        forms:
          - {w: "Prometímosle", f: "promet- + -imos + le → prometer (to promise), preterite, we, with 'le' (to her) stuck on the end; modern 'le prometimos'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "hacerlo", f: "hacer (to do) + lo (it), the pronoun hung on the infinitive after 'de'."}
          - {w: "corría", f: "corr- + -ía → correr (to run), imperfect, it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "el dejallos", f: "el + infinitive, used as a noun: 'the leaving'. dejallos = dejarlos: dejar (to leave) + los (them), with the -r turning into -l before 'los', an old assimilation (-rl- → -ll-)."}
          - {w: "era", f: "er- + -a → ser (to be), imperfect, it. Irregular: era, eras, era, éramos, erais, eran."}
      - es: "No fueron tan vanas nuestras oraciones que no fuesen oídas del cielo; que, en nuestro favor, luego volvió el viento, tranquilo el mar, convidándonos a que tornásemos alegres a proseguir nuestro comenzado viaje."
        literal: "Not were so vain our prayers that not they-might-be heard by-the heaven; for, in our favour, soon turned the wind, calm the sea, inviting-us to that we-might-return glad to continue our begun voyage."
        ormsby: "Our prayers were not so far in vain as to be unheard by Heaven, for after a while the wind changed in our favour, and made the sea calm, inviting us once more to resume our voyage with a good heart."
        vocab:
          - {w: "vano", d: "vain, useless"}
          - {w: "cielo", d: "heaven, as well as 'sky'"}
          - {w: "luego", d: "at once, soon (not 'later')"}
          - {w: "convidar a", d: "to invite to"}
          - {w: "tornar a", d: "to do again, go back to"}
          - {w: "proseguir", d: "to continue, go on with"}
        diagram:
          - s: "No fueron tan vanas nuestras oraciones"
            r: "main verb 1: our prayers were not so vain"
            under:
              - {s: "que no fuesen oídas del cielo", r: "result: that they were not heard by heaven"}
          - s: "luego volvió el viento"
            r: "main verb 2 (after 'que', for): the wind soon changed"
            under:
              - {s: "en nuestro favor", r: "how: in our favour"}
              - {s: "tranquilo el mar", r: "how: the sea calm"}
              - s: "convidándonos"
                r: "how: inviting us"
                under:
                  - {s: "a que tornásemos alegres a proseguir nuestro comenzado viaje", r: "to what: to go cheerfully back to the voyage we had begun"}
        forms:
          - {w: "fueron", f: "fu- + -eron → ser (to be), preterite, they (our prayers). Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "vanas", f: "van- + -as → vano (vain), feminine plural to match 'oraciones'."}
          - {w: "fuesen oídas", f: "fues- + -en → ser (to be), imperfect subjunctive (-se form), they, + oídas, the participle of oír (to hear), feminine plural to match 'oraciones': passive, 'were heard'. fuese, fueses, fuese, fuésemos, fueseis, fuesen. Subjunctive in a result clause after a negative ('No fueron tan vanas' followed by 'que')."}
          - {w: "volvió", f: "volv- + -ió → volver (to turn), preterite, it (the wind). The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "tranquilo el mar", f: "an absolute phrase with no verb, 'the sea (being) calm'; tranquilo masculine to match 'el mar' (Cervantes uses both 'la mar' and 'el mar')."}
          - {w: "convidándonos", f: "gerund of convidar (to invite) + nos (us), the pronoun hung on the gerund; accent added."}
          - {w: "tornásemos", f: "torn- + -ásemos → tornar (to return), imperfect subjunctive (-se form), we, after 'a que': tornase, tornases, tornase, tornásemos, tornaseis, tornasen."}
          - {w: "alegres", f: "alegre (glad), plural to match 'we'."}
          - {w: "comenzado", f: "participle of comenzar (to begin), masculine to match 'viaje', placed before it: 'our begun voyage'."}
  - sentences:
      - es: "»Viendo esto, desatamos a los moros, y uno a uno los pusimos en tierra, de lo que ellos se quedaron admirados;"
        literal: "»Seeing this, we-untied to the Moors, and one by one them we-put on land, at that which they themselves remained amazed;"
        ormsby: "Seeing this we unbound the Moors, and one by one put them on shore, at which they were filled with amazement;"
        vocab:
          - {w: "desatar", d: "to untie, unbind"}
          - {w: "uno a uno", d: "one by one"}
          - {w: "quedarse admirado", d: "to be left astonished (false friend: 'admirado' = amazed, not 'admired')"}
        diagram:
          - s: "desatamos a los moros"
            r: "main verb 1: we untied the Moors"
            under:
              - {s: "Viendo esto", r: "when: seeing this"}
          - s: "y uno a uno los pusimos en tierra"
            r: "main verb 2: and one by one we put them ashore"
            under:
              - {s: "de lo que ellos se quedaron admirados", r: "result: at which they were astonished"}
        forms:
          - {w: "Viendo", f: "gerund of ver (to see): 'seeing'."}
          - {w: "desatamos", f: "desat- + -amos → desatar (to untie), preterite, we. In -ar verbs the 'we' form is the same in present and preterite. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "pusimos", f: "pus- + -imos → poner (to put), preterite, we. Irregular: puse, pusiste, puso, pusimos, pusisteis, pusieron."}
          - {w: "se quedaron", f: "qued- + -aron → quedarse (to remain), preterite, they. Same -ar preterite: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "admirados", f: "admir- + -ados → admirado (amazed), participle of admirar (to amaze), masculine plural to match 'ellos'."}
        note: "The Moors are amazed because they expected to be carried off and sold, as captives taken at sea usually were."
      - es: "pero, llegando a desembarcar al padre de Zoraida, que ya estaba en todo su acuerdo, dijo:"
        literal: "but, coming to land to-the father of Zoraida, who now was in all his senses, he-said:"
        ormsby: "but when we came to land Zoraida’s father, who had now completely recovered his senses, he said:"
        vocab:
          - {w: "llegar a", d: "here 'to come to (doing)', i.e. when it was time to"}
          - {w: "desembarcar", d: "to put ashore, land"}
          - {w: "estar en su acuerdo", d: "to be in one's right mind, fully conscious"}
        diagram:
          - s: "dijo:"
            r: "main verb: he said"
            under:
              - s: "llegando a desembarcar al padre de Zoraida"
                r: "when: when we came to put Zoraida's father ashore"
                under:
                  - {s: "que ya estaba en todo su acuerdo", r: "describes 'padre': who was now fully himself again"}
        forms:
          - {w: "llegando", f: "gerund of llegar (to arrive, come to): 'coming to', with 'we' understood as its subject."}
          - {w: "desembarcar", f: "infinitive of desembarcar (to put ashore) after 'llegando a'."}
          - {w: "al", f: "a + el; the 'a' marks a person as direct object ('al padre')."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron. The subject switches from 'we' to 'he' without warning."}
      - es: "«¿Por qué pensáis, cristianos, que esta mala hembra huelga de que me deis libertad?"
        literal: "«Why do-you-think, Christians, that this bad female is-glad of that to-me you-give liberty?"
        ormsby: "“Why is it, think ye, Christians, that this wicked woman is rejoiced at your giving me my liberty?"
        vocab:
          - {w: "hembra", d: "female, woman (slighting when said of a person)"}
          - {w: "holgarse de", d: "to be glad of, rejoice at; here without 'se': 'huelga de'"}
        diagram:
          - s: "¿Por qué pensáis"
            r: "main verb: why do you think"
            under:
              - {s: "cristianos", r: "addressed to: Christians"}
              - s: "que esta mala hembra huelga"
                r: "what: that this wicked woman is glad"
                under:
                  - {s: "de que me deis libertad?", r: "at what: that you give me my freedom"}
        forms:
          - {w: "pensáis", f: "pens- + -áis → pensar (to think), present, you (vosotros). The stem e becomes ie when stressed: pienso, piensas, piensa, pensamos, pensáis, piensan."}
          - {w: "esta mala", f: "esta (this) and mala (bad), feminine to match 'hembra'."}
          - {w: "huelga", f: "huelg- + -a → holgar (to rest; to be glad), present, she. The stem o becomes ue when stressed: huelgo, huelgas, huelga, holgamos, holgáis, huelgan."}
          - {w: "deis", f: "d- + -eis → dar (to give), present subjunctive, you (vosotros), after 'huelga de que' (is glad that): dé, des, dé, demos, deis, den."}
      - es: "¿Pensáis que es por piedad que de mí tiene?"
        literal: "Do-you-think that it-is for pity that of me she-has?"
        ormsby: "Think ye it is because of the affection she bears me?"
        vocab:
          - {w: "piedad", d: "pity, compassion; also filial love, devotion"}
          - {w: "tener piedad de", d: "to have pity on, feel for"}
        diagram:
          - s: "¿Pensáis"
            r: "main verb: do you think"
            under:
              - s: "que es por piedad"
                r: "what: that it is out of pity"
                under:
                  - {s: "que de mí tiene?", r: "describes 'piedad': that she has for me"}
        forms:
          - {w: "Pensáis", f: "pens- + -áis → pensar (to think), present, you (vosotros). The stem e becomes ie when stressed: pienso, piensas, piensa, pensamos, pensáis, piensan."}
          - {w: "es", f: "ser (to be), present, it. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, she. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "de mí", f: "'mí' with an accent is the pronoun 'me' after a preposition; 'mi' without it is 'my'."}
      - es: "No, por cierto, sino que lo hace por el estorbo que le dará mi presencia cuando quiera poner en ejecución sus malos deseos;"
        literal: "No, certainly, but that it she-does for the hindrance that to-her will-give my presence when she-may-want to-put in execution her bad desires;"
        ormsby: "Nay verily, it is only because of the hindrance my presence offers to the execution of her base designs."
        vocab:
          - {w: "por cierto", d: "certainly, indeed"}
          - {w: "sino que", d: "but rather (after a negative)"}
          - {w: "estorbo", d: "hindrance, obstacle, nuisance"}
          - {w: "poner en ejecución", d: "to put into effect, carry out"}
        diagram:
          - {s: "No, por cierto", r: "answer: certainly not"}
          - s: "sino que lo hace"
            r: "main verb: but she does it"
            under:
              - s: "por el estorbo"
                r: "why: because of the hindrance"
                under:
                  - {s: "que le dará mi presencia", r: "describes 'estorbo': that my presence would give her"}
                  - {s: "cuando quiera poner en ejecución sus malos deseos", r: "when: when she wants to carry out her wicked desires"}
        forms:
          - {w: "hace", f: "hac- + -e → hacer (to do), present, she. hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "dará", f: "dar- + -á → dar (to give), future, it (my presence). The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "quiera", f: "quier- + -a → querer (to want), present subjunctive, she, after 'cuando' about the future: quiera, quieras, quiera, queramos, queráis, quieran."}
          - {w: "poner", f: "infinitive of poner (to put) after 'quiera'."}
          - {w: "malos", f: "mal- + -os → malo (bad), masculine plural to match 'deseos'; 'sus' is plural to match 'deseos', not the owner."}
      - es: "ni penséis que la ha movido a mudar religión entender ella que la vuestra a la nuestra se aventaja, sino el saber que en vuestra tierra se usa la deshonestidad más libremente que en la nuestra»."
        literal: "nor think that her has moved to change religion to-understand she that the yours to the ours itself surpasses, but the knowing that in your land itself practises the immodesty more freely than in the ours»."
        ormsby: "And think not that it is her belief that yours is better than ours that has led her to change her religion; it is only because she knows that immodesty is more freely practised in your country than in ours.”"
        vocab:
          - {w: "mudar", d: "to change (religion, clothes, place)"}
          - {w: "aventajarse a", d: "to surpass, be better than"}
          - {w: "usarse", d: "to be the custom, be practised"}
          - {w: "deshonestidad", d: "unchastity, immodesty (false friend: not 'dishonesty')"}
        diagram:
          - s: "ni penséis"
            r: "main verb: nor think"
            under:
              - s: "que la ha movido a mudar religión"
                r: "what not to think: that what moved her to change religion"
                under:
                  - {s: "entender ella que la vuestra a la nuestra se aventaja", r: "subject: (was) her understanding that yours surpasses ours"}
                  - s: "sino el saber"
                    r: "subject instead: but the knowing"
                    under:
                      - {s: "que en vuestra tierra se usa la deshonestidad más libremente que en la nuestra", r: "what she knows: that in your land loose living is practised more freely than in ours"}
        forms:
          - {w: "penséis", f: "pens- + -éis → pensar (to think), present subjunctive, you (vosotros), used for a negative command: piense, pienses, piense, pensemos, penséis, piensen."}
          - {w: "ha movido", f: "ha (haber (to have, auxiliary), present, it: he, has, ha, hemos, habéis, han) + movido, the participle of mover (to move): 'has moved'."}
          - {w: "mudar", f: "infinitive of mudar (to change) after 'movido a'."}
          - {w: "entender ella", f: "the infinitive entender (to understand) used as the subject of 'ha movido', with its own subject 'ella' after it: 'her understanding'."}
          - {w: "la vuestra, la nuestra", f: "'yours', 'ours', feminine because they stand for 'religión' (and later 'tierra')."}
          - {w: "se aventaja", f: "aventaj- + -a → aventajarse (to surpass), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "el saber", f: "el + infinitive: saber (to know) used as a noun, 'the knowing'."}
