  - sentences:
      - es: "»Pero, a causa de soplar un poco el viento tramontana y estar la mar algo picada, no fue posible seguir la derrota de Mallorca, y fuenos forzoso dejarnos ir tierra a tierra la vuelta de Orán, no sin mucha pesadumbre nuestra, por no ser descubiertos del lugar de Sargel, que en aquella costa cae sesenta millas de Argel."
        literal: "»But, because of to-blow a little the wind north-wind and to-be the sea somewhat choppy, not it-was possible to-follow the course of Mallorca, and it-was-to-us forced to-let-ourselves go land to land the direction of Orán, not without much anxiety our, for-fear-of not to-be discovered by-the town of Sargel, which on that coast lies sixty miles from Argel."
        ormsby: "Owing, however, to the Tramontana rising a little, and the sea growing somewhat rough, it was impossible for us to keep a straight course for Majorca, and we were compelled to coast in the direction of Oran, not without great uneasiness on our part lest we should be observed from the town of Shershel, which lies on that coast, not more than sixty miles from Algiers."
        ormsby_note: "A wind from the north, so called from coming across the Alps."
        vocab:
          - {w: "a causa de", d: "because of; here followed by infinitives with their own subjects ('a causa de soplar el viento' = because the wind was blowing)"}
          - {w: "tramontana", d: "the north wind (from Italian 'tramontana', the wind from beyond the mountains)"}
          - {w: "picado", d: "choppy, rough (of the sea)"}
          - {w: "la mar", d: "the sea; sailors and poets made 'mar' feminine, and still do"}
          - {w: "derrota", d: "a ship's course, route (false friend: not 'defeat' here)"}
          - {w: "fuenos forzoso", d: "= nos fue forzoso, we were forced to, we had to"}
          - {w: "tierra a tierra", d: "hugging the shore, coasting along close to land"}
          - {w: "la vuelta de", d: "in the direction of, towards (nautical)"}
          - {w: "pesadumbre", d: "anxiety, grief, heaviness of heart"}
          - {w: "por no", d: "here 'for fear of, so as not to' ('por no ser descubiertos' = anxious not to be spotted)"}
          - {w: "caer", d: "here 'to lie, be situated' (of a place)"}
          - {w: "Sargel", d: "Cherchell (Ormsby's Shershel), a port on the Algerian coast west of Algiers"}
          - {w: "Mallorca", d: "Majorca, the nearest Christian land, in the Balearic Islands"}
        diagram:
          - s: "no fue posible"
            r: "main verb 1: it was not possible"
            under:
              - {s: "a causa de soplar un poco el viento tramontana", r: "why, 1: because the north wind blew a little"}
              - {s: "y estar la mar algo picada", r: "why, 2: and the sea was somewhat choppy"}
              - {s: "seguir la derrota de Mallorca", r: "what was not possible: to keep the course for Majorca"}
          - s: "y fuenos forzoso"
            r: "main verb 2: and we were forced"
            under:
              - s: "dejarnos ir tierra a tierra la vuelta de Orán"
                r: "what we were forced to do: to let ourselves go along the coast towards Oran"
              - {s: "no sin mucha pesadumbre nuestra", r: "how: not without much anxiety on our part"}
              - s: "por no ser descubiertos del lugar de Sargel"
                r: "why anxious: for fear of being spotted from the town of Sargel"
                under:
                  - {s: "que en aquella costa cae sesenta millas de Argel", r: "describes 'Sargel': which lies sixty miles from Algiers on that coast"}
        forms:
          - {w: "soplar, estar", f: "infinitives of soplar (to blow) and estar (to be) after 'a causa de', each with its own subject after it ('el viento', 'la mar'): 'because the wind blew and the sea was'."}
          - {w: "picada", f: "pic- + -ada → picado (choppy), participle of picar (to prick, to chop) used as an adjective, feminine to match 'la mar'."}
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, it: 'it was'. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "seguir", f: "infinitive of seguir (to follow), subject of 'no fue posible': 'to follow was not possible'."}
          - {w: "fuenos", f: "fue + nos → ser (to be), preterite, it, with 'nos' (to us) stuck on the end; modern 'nos fue'. Cervantes hangs the pronoun on a verb that opens its clause. ser (to be) in the preterite: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "dejarnos ir", f: "dejar (to let) + nos (ourselves), the pronoun hung on the infinitive, + ir (to go): 'to let ourselves go', i.e. drift with the wind."}
          - {w: "nuestra", f: "nuestr- + -a → nuestro (our), feminine to match 'pesadumbre'; placed after the noun, 'anxiety of ours'."}
          - {w: "ser descubiertos", f: "ser (to be) + descubiertos, the participle of descubrir (to discover, spot), masculine plural to match 'we': the passive, 'to be spotted'. The participle of descubrir (to discover) is irregular: descubierto, not 'descubrido'."}
          - {w: "del", f: "de + el; with the passive 'de' means 'by': 'spotted by the town'."}
          - {w: "cae", f: "ca- + -e → caer (to fall; here to lie), present, it (the town). caigo, caes, cae, caemos, caéis, caen."}
        note: "Cherchell lies west of Algiers, so turning 'towards Oran' meant running along the enemy's coast instead of crossing to Majorca, to the north. The renegade had made his trial voyages to Sargel earlier in this chapter, so the place knew his boat."
      - es: "Y, asimismo, temíamos encontrar por aquel paraje alguna galeota de las que de ordinario vienen con mercancía de Tetuán, aunque cada uno por sí, y todos juntos, presumíamos de que, si se encontraba galeota de mercancía, como no fuese de las que andan en corso, que no sólo no nos perderíamos, mas que tomaríamos bajel donde con más seguridad pudiésemos acabar nuestro viaje."
        literal: "And, likewise, we-feared to-meet in that area some galliot of those that ordinarily come with merchandise from Tetuán, although each one for himself, and all together, we-were-confident of that, if itself was-met galliot of merchandise, provided not it-were of those that go in privateering, that not only not ourselves we-would-lose, but that we-would-take vessel where with more safety we-might finish our voyage."
        ormsby: "Moreover we were afraid of meeting on that course one of the galliots that usually come with goods from Tetuan; although each of us for himself and all of us together felt confident that, if we were to meet a merchant galliot, so that it were not a cruiser, not only should we not be lost, but that we should take a vessel in which we could more safely accomplish our voyage."
        vocab:
          - {w: "asimismo", d: "likewise, also"}
          - {w: "paraje", d: "spot, area, stretch (of coast or sea)"}
          - {w: "galeota", d: "galliot, a small galley with sails and oars"}
          - {w: "de ordinario", d: "ordinarily, usually"}
          - {w: "Tetuán", d: "Tetouan, a port in northern Morocco, a trading town and corsair base"}
          - {w: "presumir de que", d: "to be confident that, to count on it that"}
          - {w: "como no", d: "with the subjunctive: provided that not, as long as not ('como no fuese' = so long as it was not)"}
          - {w: "andar en corso", d: "to go privateering, sail as a corsair (licensed pirate)"}
          - {w: "no sólo ... mas", d: "not only ... but"}
          - {w: "bajel", d: "vessel, ship (literary)"}
        diagram:
          - s: "temíamos"
            r: "main verb: we feared"
            under:
              - {s: "asimismo", r: "linking: likewise"}
              - s: "encontrar por aquel paraje alguna galeota"
                r: "what we feared: to meet some galliot in those waters"
                under:
                  - {s: "de las que de ordinario vienen con mercancía de Tetuán", r: "describes 'galeota': of the kind that usually come with goods from Tetouan"}
              - s: "aunque cada uno por sí, y todos juntos, presumíamos de que"
                r: "concession: although each of us and all of us together were confident that"
                under:
                  - {s: "si se encontraba galeota de mercancía", r: "condition: if we met a merchant galliot"}
                  - {s: "como no fuese de las que andan en corso", r: "proviso: provided it was not one of the corsairs"}
                  - {s: "que no sólo no nos perderíamos", r: "what we counted on, 1: that not only would we not be lost"}
                  - s: "mas que tomaríamos bajel"
                    r: "what we counted on, 2: but that we would take a vessel"
                    under:
                      - {s: "donde con más seguridad pudiésemos acabar nuestro viaje", r: "describes 'bajel': in which we could finish our voyage more safely"}
        forms:
          - {w: "temíamos", f: "tem- + -íamos → temer (to fear), imperfect, we: 'we were afraid'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "vienen", f: "vien- + -en → venir (to come), present, they (the galliots). Irregular: vengo, vienes, viene, venimos, venís, vienen."}
          - {w: "presumíamos", f: "presum- + -íamos → presumir (to presume, be confident), imperfect, we. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "se encontraba", f: "encontr- + -aba → encontrar (to meet), imperfect, it, with 'se': the impersonal 'se', 'if a galliot was met'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "fuese", f: "fu- + -ese → ser (to be), imperfect subjunctive (-se form), it, after 'como no' (provided not): fuese, fueses, fuese, fuésemos, fueseis, fuesen."}
          - {w: "andan", f: "and- + -an → andar (to go about), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "perderíamos, tomaríamos", f: "perder- + -íamos → perder (to lose), with 'nos', 'we would be lost'; tomar- + -íamos → tomar (to take): conditional, we. The conditional adds -ía, -ías, -ía, -íamos, -íais, -ían to the whole infinitive."}
          - {w: "que no sólo", f: "the 'que' after 'presumíamos de que' is repeated after the 'si' clause: Cervantes picks the thread up again; English drops it."}
          - {w: "pudiésemos", f: "pud- + -iésemos → poder (to be able), imperfect subjunctive (-se form), we, after 'donde' describing a vessel we hoped for: pudiese, pudieses, pudiese, pudiésemos, pudieseis, pudiesen."}
        note: "A merchant galliot would carry only a few rowers and traders, so the escaped captives, now armed and many, reckoned they could seize it. A corsair galliot, full of fighting men, would have taken them back to slavery."
      - es: "Iba Zoraida, en tanto que se navegaba, puesta la cabeza entre mis manos, por no ver a su padre, y sentía yo que iba llamando a Lela Marién que nos ayudase."
        literal: "Went Zoraida, while that itself was-sailed, put the head between my hands, so-as not to-see her father, and felt I that she-was calling to Lela Marién that us she-might-help."
        ormsby: "As we pursued our course Zoraida kept her head between my hands so as not to see her father, and I felt that she was praying to Lela Marien to help us."
        vocab:
          - {w: "en tanto que", d: "while, as long as"}
          - {w: "se navegaba", d: "we sailed on, the sailing went on (impersonal)"}
          - {w: "Lela Marién", d: "'Lady Mary', the Moorish name for the Virgin Mary, whom Zoraida has taken as her protector"}
          - {w: "ir + gerund", d: "to keep doing, be doing over time ('iba llamando' = kept calling on)"}
        diagram:
          - s: "Iba Zoraida"
            r: "main verb 1: Zoraida went, sat"
            under:
              - {s: "en tanto que se navegaba", r: "when: while we sailed"}
              - {s: "puesta la cabeza entre mis manos", r: "how: with her head put between my hands"}
              - {s: "por no ver a su padre", r: "why: so as not to see her father"}
          - s: "y sentía yo"
            r: "main verb 2: and I felt"
            under:
              - s: "que iba llamando a Lela Marién"
                r: "what I felt: that she kept calling on Lela Marién"
                under:
                  - {s: "que nos ayudase", r: "what she asked: that she would help us"}
        forms:
          - {w: "Iba", f: "ib- + -a → ir (to go), imperfect, she. Irregular: iba, ibas, iba, íbamos, ibais, iban. With a participle ('puesta') it means 'was, sat'; the subject 'Zoraida' follows the verb."}
          - {w: "se navegaba", f: "naveg- + -aba → navegar (to sail), imperfect, it, with impersonal 'se': 'while sailing went on'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "puesta", f: "irregular participle of poner (to put), feminine to match 'la cabeza': an absolute construction, 'her head put between my hands'."}
          - {w: "ver", f: "infinitive of ver (to see) after 'por no' (so as not to)."}
          - {w: "sentía", f: "sent- + -ía → sentir (to feel), imperfect, I. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "iba llamando", f: "iba (ir (to go), imperfect, she: iba, ibas, iba, íbamos, ibais, iban) + llamando, the gerund of llamar (to call): 'she kept calling on'."}
          - {w: "ayudase", f: "ayud- + -ase → ayudar (to help), imperfect subjunctive (-se form), she, after a request ('iba llamando a Lela Marién que'): ayudase, ayudases, ayudase, ayudásemos, ayudaseis, ayudasen."}
  - sentences:
      - es: "»Bien habríamos navegado treinta millas, cuando nos amaneció, como tres tiros de arcabuz desviados de tierra, toda la cual vimos desierta y sin nadie que nos descubriese;"
        literal: "»Well we-would-have sailed thirty miles, when on-us it-dawned, about three shots of arquebus away from land, all the which we-saw deserted and without anyone who us might-discover;"
        ormsby: "We might have made about thirty miles when daybreak found us some three musket-shots off the land, which seemed to us deserted, and without anyone to see us."
        vocab:
          - {w: "bien", d: "here 'a good, fully, probably' with a number: 'bien habríamos navegado treinta millas' = we must have sailed a good thirty miles"}
          - {w: "amanecer", d: "to dawn; 'nos amaneció' = dawn found us, day broke on us"}
          - {w: "tiro de arcabuz", d: "an arquebus-shot, the range of a musket, used as a measure of distance"}
          - {w: "desviado de", d: "away from, at a distance from"}
          - {w: "desierto", d: "deserted, empty of people"}
        diagram:
          - s: "Bien habríamos navegado treinta millas"
            r: "main verb: we must have sailed a good thirty miles"
            under:
              - s: "cuando nos amaneció"
                r: "when: when day broke on us"
                under:
                  - {s: "como tres tiros de arcabuz desviados de tierra", r: "where: about three musket-shots off the land"}
                  - s: "toda la cual vimos desierta"
                    r: "describes 'tierra': all of which we saw to be deserted"
                    under:
                      - {s: "y sin nadie que nos descubriese", r: "and with no one to spot us"}
        forms:
          - {w: "habríamos navegado", f: "habr- + -íamos → haber (to have, auxiliary), conditional, we, + navegado, the participle of navegar (to sail): the conditional perfect, 'we would have sailed', here a guess about the past, 'we must have sailed'. haber (to have) in the conditional: habría, habrías, habría, habríamos, habríais, habrían."}
          - {w: "amaneció", f: "amanec- + -ió → amanecer (to dawn), preterite, it, with 'nos' (on us). The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "desviados", f: "desvi- + -ados → desviado (away from), participle of desviar (to turn aside), masculine plural to match 'nosotros' (we) or 'tiros'."}
          - {w: "toda la cual", f: "toda = feminine of todo (all) and 'la cual' (which), both feminine to match 'tierra': 'all of which (land)'."}
          - {w: "vimos", f: "v- + -imos → ver (to see), preterite, we. Irregular: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "desierta", f: "desiert- + -a → desierto (deserted), feminine to match 'la cual' (the land)."}
          - {w: "descubriese", f: "descubr- + -iese → descubrir (to discover, spot), imperfect subjunctive (-se form), he (anyone), after 'sin nadie que' (no one who): descubriese, descubrieses, descubriese, descubriésemos, descubrieseis, descubriesen."}
      - es: "pero, con todo eso, nos fuimos a fuerza de brazos entrando un poco en la mar, que ya estaba algo más sosegada;"
        literal: "but, with all that, ourselves we-went by force of arms entering a little into the sea, which now was somewhat more calmed;"
        ormsby: "For all that, however, by hard rowing we put out a little to sea, for it was now somewhat calmer,"
        vocab:
          - {w: "con todo eso", d: "for all that, nevertheless"}
          - {w: "a fuerza de brazos", d: "by sheer strength of arm, by hard rowing"}
          - {w: "entrar en la mar", d: "to stand out to sea, move away from the shore"}
          - {w: "sosegado", d: "calm, quiet (from 'sosegar', to calm)"}
        diagram:
          - s: "nos fuimos"
            r: "main verb: we went"
            under:
              - {s: "con todo eso", r: "concession: for all that"}
              - {s: "a fuerza de brazos", r: "how: by hard rowing"}
              - s: "entrando un poco en la mar"
                r: "how: standing out a little to sea"
                under:
                  - {s: "que ya estaba algo más sosegada", r: "describes 'la mar': which was now somewhat calmer"}
        forms:
          - {w: "nos fuimos", f: "fu- + -imos → irse (to go off), preterite, we, with 'nos' (ourselves). Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron (the same forms as ser (to be) in the preterite)."}
          - {w: "entrando", f: "gerund of entrar (to enter): 'standing out (to sea)'; 'irse + gerund' means to go on gradually doing it."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, it (the sea). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "sosegada", f: "soseg- + -ada → sosegado (calm), participle of sosegar (to calm) used as an adjective, feminine to match 'la mar'."}
      - es: "y, habiendo entrado casi dos leguas, diose orden que se bogase a cuarteles en tanto que comíamos algo, que iba bien proveída la barca, puesto que los que bogaban dijeron que no era aquél tiempo de tomar reposo alguno, que les diesen de comer los que no bogaban, que ellos no querían soltar los remos de las manos en manera alguna."
        literal: "and, having entered almost two leagues, gave-itself order that itself should-row by quarters while that we-ate something, for went well provisioned the boat, although those who were-rowing said that not was that time of taking rest any, that to-them should-give to eat those who not were-rowing, for they not wanted to-let-go the oars from the hands in manner any."
        ormsby: "and having gained about two leagues the word was given to row by batches, while we ate something, for the vessel was well provided; but the rowers said it was not a time to take any rest; let food be served out to those who were not rowing, but they would not leave their oars on any account."
        vocab:
          - {w: "legua", d: "league, about three miles"}
          - {w: "bogar", d: "to row"}
          - {w: "a cuarteles", d: "in shifts, by turns (some crews rowing while others rest)"}
          - {w: "en tanto que", d: "while"}
          - {w: "proveído", d: "provisioned, supplied with food"}
          - {w: "puesto que", d: "here 'although' (false friend: not 'since')"}
          - {w: "reposo", d: "rest"}
          - {w: "dar de comer", d: "to feed, give food to"}
          - {w: "soltar", d: "to let go of, release"}
          - {w: "en manera alguna", d: "in no way, on no account (after a negative)"}
        diagram:
          - s: "diose orden"
            r: "main verb: the order was given"
            under:
              - {s: "habiendo entrado casi dos leguas", r: "when: having gone out almost two leagues"}
              - s: "que se bogase a cuarteles"
                r: "what was ordered: that we row in shifts"
                under:
                  - {s: "en tanto que comíamos algo", r: "when: while we ate something"}
                  - {s: "que iba bien proveída la barca", r: "why: for the boat was well provisioned"}
              - s: "puesto que los que bogaban dijeron"
                r: "concession: although the rowers said"
                under:
                  - {s: "que no era aquél tiempo de tomar reposo alguno", r: "what they said, 1: that this was no time to rest"}
                  - {s: "que les diesen de comer los que no bogaban", r: "what they said, 2: let those not rowing feed them"}
                  - {s: "que ellos no querían soltar los remos de las manos en manera alguna", r: "what they said, 3: for they would on no account let the oars out of their hands"}
        forms:
          - {w: "habiendo entrado", f: "habiendo, the gerund of haber (to have, auxiliary), + entrado, the participle of entrar (to enter): the perfect gerund, 'having gone in'."}
          - {w: "diose", f: "di- + -o + se → dar (to give), preterite, it, with 'se' stuck on the end: 'there was given', the impersonal 'se'; modern 'se dio'. Cervantes hangs the pronoun on a verb that opens its clause. Irregular: di, diste, dio, dimos, disteis, dieron."}
          - {w: "se bogase", f: "bog- + -ase → bogar (to row), imperfect subjunctive (-se form), it, with impersonal 'se': 'that rowing be done', after an order: bogase, bogases, bogase, bogásemos, bogaseis, bogasen."}
          - {w: "comíamos", f: "com- + -íamos → comer (to eat), imperfect, we. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "iba bien proveída", f: "iba (ir (to go), imperfect, it: iba, ibas, iba, íbamos, ibais, iban) + proveída, the participle of proveer (to provide), feminine to match 'la barca': 'the boat was well stocked'."}
          - {w: "bogaban", f: "bog- + -aban → bogar (to row), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "dijeron", f: "dij- + -eron → decir (to say), preterite, they. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "era", f: "er- + -a → ser (to be), imperfect, it. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "aquél", f: "aquel (that), masculine to match 'tiempo'; the old accent marks it as standing before its noun in a stressed position."}
          - {w: "alguno, alguna", f: "alguno (any), masculine to match 'reposo'; alguna, feminine to match 'manera'. After a noun in a negative sentence it means 'none at all'."}
          - {w: "diesen", f: "d- + -iesen → dar (to give), imperfect subjunctive (-se form), they, reporting a request ('let them feed us'): diese, dieses, diese, diésemos, dieseis, diesen."}
          - {w: "querían", f: "quer- + -ían → querer (to want), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
        note: "The rowers are the freed Christian captives, who row for their lives; the Moorish crew (the 'bagarinos') are now prisoners. They refuse to rest as long as the Algerian coast is in sight."
      - es: "Hízose ansí, y en esto comenzó a soplar un viento largo, que nos obligó a hacer luego vela y a dejar el remo, y enderezar a Orán, por no ser posible poder hacer otro viaje."
        literal: "Was-done-itself thus, and in this began to blow a wind large, which us obliged to make at-once sail and to leave the oar, and to-head to Orán, because not to-be possible to-be-able to-make other voyage."
