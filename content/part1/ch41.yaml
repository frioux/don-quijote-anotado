  - sentences:
      - es: "»Mas, como pocas veces, o nunca, viene el bien puro y sencillo, sin ser acompañado o seguido de algún mal que le turbe o sobresalte, quiso nuestra ventura, o quizá las maldiciones que el moro a su hija había echado, que siempre se han de temer de cualquier padre que sean;"
        literal: "»But, as few times, or never, comes the good pure and simple, without being accompanied or followed by some evil that it may-disturb or may-startle, willed our fortune, or perhaps the curses that the Moor on his daughter had cast, which always themselves have to-be-feared from whatever father that they-may-be;"
        ormsby: "But, as good seldom or never comes pure and unmixed, without being attended or followed by some disturbing evil that gives a shock to it, our fortune, or perhaps the curses which the Moor had hurled at his daughter (for whatever kind of father they may come from these are always to be dreaded), brought it about"
        vocab:
          - {w: "mas", d: "but (literary; no accent, unlike 'más', more)"}
          - {w: "pocas veces, o nunca", d: "seldom or never"}
          - {w: "sencillo", d: "simple, unmixed; here 'unalloyed'"}
          - {w: "turbar", d: "to disturb, trouble"}
          - {w: "sobresaltar", d: "to startle, alarm"}
          - {w: "ventura", d: "fortune, luck (good or bad)"}
          - {w: "echar maldiciones a", d: "to hurl curses at, to curse someone"}
          - {w: "haber de", d: "must, to have to; 'se han de temer' = are to be feared"}
          - {w: "de cualquier padre que sean", d: "from whatever father they may come, whatever sort of father he is"}
        diagram:
          - s: "quiso"
            r: "main verb: willed, brought it about (what it willed comes in the next sentence)"
            under:
              - s: "Mas, como pocas veces, o nunca, viene el bien puro y sencillo"
                r: "why: but since good seldom or never comes unmixed"
                under:
