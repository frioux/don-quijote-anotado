        forms:
          - {w: "quiso", f: "quis- + -o → querer (to want, to will), preterite, it (fortune). Irregular: quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "digo", f: "dig- + -o → decir (to say), present, I: 'I say', picking up the sentence again. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "estando ya engolfados", f: "estando, gerund of estar (to be), + engolfados, participle of engolfarse (to go out into the open sea), masculine plural to match 'we'."}
          - {w: "siendo ya casi pasadas", f: "siendo, gerund of ser (to be), + pasadas, participle of pasar (to pass), feminine plural to match 'tres horas': 'three hours being nearly past'."}
          - {w: "yendo", f: "gerund of ir (to go), irregular (y- instead of i-): 'going, running (before the wind)'."}
