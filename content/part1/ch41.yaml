      - es: "«¡Gracias sean dadas a Dios, señores, que a tan buena parte nos ha conducido!, porque, si yo no me engaño, la tierra que pisamos es la de Vélez Málaga, si ya los años de mi cautiverio no me han quitado de la memoria el acordarme que vos, señor, que nos preguntáis quién somos, sois Pedro de Bustamante, tío mío»."
        literal: "«Thanks be given to God, sirs, who to so good place us has led!, because, if I not myself deceive, the land that we-tread is the [land] of Vélez Málaga, if already the years of my captivity not from-me have taken from the memory the remembering-myself that you, sir, who us ask who we-are, are Pedro de Bustamante, uncle mine»."
