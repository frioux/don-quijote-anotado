        note: "These Moorish rowers were hired men of the renegade's boat, not slaves; the Christians had expected a fight, but the crew gave in without a blow."
  - sentences:
      - es: "»Hecho ya esto, quedándose en guardia dellos la mitad de los nuestros, los que quedábamos, haciéndonos asimismo el renegado la guía, fuimos al jardín de Agi Morato, y quiso la buena suerte que, llegando a abrir la puerta, se abrió con tanta facilidad como si cerrada no estuviera;"
        literal: "»Done already this, remaining-themselves on guard of-them the half of the ours, those who remained, making-for-us likewise the renegade the guide, we-went to-the garden of Agi Morato, and wanted the good luck that, arriving to open the gate, itself it-opened with so-much ease as if closed not it-were;"
        ormsby: "This having been accomplished, and half of our party being left to keep guard over them, the rest of us, again taking the renegade as our guide, hastened towards Hadji Morato’s garden, and as good luck would have it, on trying the gate it opened as easily as if it had not been locked;"
        vocab:
          - {w: "hecho esto", d: "this done, having done this"}
          - {w: "quedarse en guardia de", d: "to stay on guard over"}
          - {w: "los nuestros", d: "our people, our men"}
          - {w: "dellos", d: "= de ellos, of them (old contraction)"}
          - {w: "asimismo", d: "likewise, again"}
          - {w: "quiso la buena suerte que", d: "as good luck would have it"}
          - {w: "como si", d: "as if (takes the imperfect subjunctive)"}
        diagram:
          - s: "fuimos al jardín de Agi Morato"
            r: "main verb 1: we went to Agi Morato's garden"
            under:
              - {s: "Hecho ya esto", r: "when: this done"}
              - {s: "quedándose en guardia dellos la mitad de los nuestros", r: "while: half of our men staying to guard them"}
              - {s: "los que quedábamos", r: "subject: those of us who were left"}
              - {s: "haciéndonos asimismo el renegado la guía", r: "how: the renegade again leading us"}
          - s: "y quiso la buena suerte"
            r: "main verb 2: and good luck willed"
            under:
              - s: "se abrió con tanta facilidad"
                r: "what luck willed: that it opened so easily"
                under:
                  - {s: "llegando a abrir la puerta", r: "when: as we came to open the gate"}
                  - {s: "como si cerrada no estuviera", r: "how easily: as if it had not been locked"}
        forms:
          - {w: "Hecho", f: "irregular participle of hacer (to do), in an absolute phrase: 'this (being) done'."}
          - {w: "quedándose", f: "gerund of quedarse (to remain) with 'se' hung on the end and an accent added; its subject is 'la mitad de los nuestros'."}
          - {w: "dellos", f: "de + ellos, old contraction, 'of them'."}
          - {w: "quedábamos", f: "qued- + -ábamos → quedar (to remain), imperfect, we. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "haciéndonos", f: "gerund of hacer (to make) + nos (for us), accent added: 'making himself our guide'."}
          - {w: "fuimos", f: "fu- + -imos → ir (to go), preterite, we. Irregular, the same forms as ser (to be): fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "quiso", f: "quis- + -o → querer (to want), preterite, it (luck). Irregular: quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "llegando a abrir", f: "gerund of llegar (to arrive, come to) + a + abrir (to open): 'coming to open'."}
          - {w: "se abrió", f: "abr- + -ió → abrirse (to open), preterite, it, with 'se': 'it opened'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "tanta", f: "tanto (so much), feminine to match 'facilidad'; 'tanta ... como' = as much ... as."}
          - {w: "cerrada", f: "participle of cerrar (to close), feminine to match 'puerta'."}
          - {w: "estuviera", f: "estuv- + -iera → estar (to be), imperfect subjunctive (-ra form), it, after 'como si' (as if). estuviera, estuvieras, estuviera, estuviéramos, estuvierais, estuvieran."}
        note: "The captive credits good luck for the open gate; Zoraida, who knew the night they were coming, may well have left it unlocked."
