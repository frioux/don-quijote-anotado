part: 1
chapter: 41
title_es: "Capítulo XLI. Donde todavía prosigue el cautivo su suceso"
title_en: "In which the captive still continues his adventures"
paragraphs:
  - sentences:
      - es: "»No se pasaron quince días, cuando ya nuestro renegado tenía comprada una muy buena barca, capaz de más de treinta personas:"
        literal: "»Not themselves passed fifteen days, when already our renegade had bought a very good boat, capable of more than thirty persons:"
        ormsby: "Before fifteen days were over our renegade had already purchased an excellent vessel with room for more than thirty persons;"
        vocab:
          - {w: "pasarse", d: "of time, to go by; 'no se pasaron quince días, cuando' = fifteen days had not gone by when"}
          - {w: "renegado", d: "renegade: a Christian who has turned Muslim, here the man from Murcia who is helping the captive"}
          - {w: "tener comprado", d: "to have (something) bought, already own; 'tener' + participle stresses the finished result"}
          - {w: "barca", d: "boat, small vessel"}
          - {w: "capaz de", d: "able to hold, with room for"}
        diagram:
          - s: "No se pasaron"
            r: "main verb: there did not go by"
            under:
              - {s: "quince días", r: "subject: fifteen days"}
              - s: "cuando ya nuestro renegado tenía comprada una muy buena barca"
                r: "when: when our renegade had already bought a very good boat"
                under:
                  - {s: "capaz de más de treinta personas", r: "describes 'barca': with room for over thirty people"}
        forms:
          - {w: "se pasaron", f: "pas- + -aron → pasarse (to go by), preterite, they (the days), with 'se'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "nuestro", f: "possessive 'our', masculine singular to match 'renegado'."}
          - {w: "tenía comprada", f: "ten- + -ía → tener (to have), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían. + comprada, the participle of comprar (to buy), feminine to match 'barca': with 'tener' the participle agrees with the object, 'he had (it) bought'."}
          - {w: "muy buena", f: "buen- + -a → bueno (good), feminine to match 'barca'; 'muy' (very) goes before it."}
        note: "In the previous chapter the renegade from Murcia offered to buy a boat in Algiers himself, rather than send a ransomed captive to Spain for one, since such men seldom came back. Zoraida's gold paid for it."
      - es: "y, para asegurar su hecho y dalle color, quiso hacer, como hizo, un viaje a un lugar que se llamaba Sargel, que está treinta leguas de Argel hacia la parte de Orán, en el cual hay mucha contratación de higos pasos."
        literal: "and, to secure his deed and to-give-it colour, he-wanted to-make, as he-made, a voyage to a place that itself called Sargel, which is thirty leagues from Algiers toward the side of Oran, in the which there-is much trade of figs dried."
        ormsby: "and to make the transaction safe and lend a colour to it, he thought it well to make, as he did, a voyage to a place called Shershel, twenty leagues from Algiers on the Oran side, where there is an extensive trade in dried figs."
        vocab:
          - {w: "asegurar", d: "to make safe, cover (a plan against suspicion)"}
          - {w: "hecho", d: "deed, undertaking; here the whole scheme"}
          - {w: "dar color", d: "to give (something) a plausible look, a cover story"}
          - {w: "Sargel", d: "Cherchell (Ormsby: Shershel), a port on the coast west of Algiers"}
          - {w: "legua", d: "league, about three miles or five and a half kilometres"}
          - {w: "Argel", d: "Algiers, the corsair city where the captive is held"}
          - {w: "Orán", d: "Oran, west along the coast; then a fortress held by Spain"}
          - {w: "contratación", d: "trade, commerce (not 'contract')"}
          - {w: "higos pasos", d: "dried figs; 'paso' = dried, as in 'uva pasa' (raisin)"}
        diagram:
          - s: "quiso hacer"
            r: "main verb (after 'y'): he wanted to make"
            under:
              - {s: "para asegurar su hecho y dalle color", r: "why: to cover his scheme and give it a plausible look"}
              - {s: "como hizo", r: "aside: as indeed he did"}
              - s: "un viaje"
                r: "object of 'hacer' (to make): a voyage"
                under:
                  - s: "a un lugar"
                    r: "where to: to a place"
                    under:
                      - {s: "que se llamaba Sargel", r: "describes 'lugar': called Sargel"}
                      - {s: "que está treinta leguas de Argel hacia la parte de Orán", r: "describes 'lugar', 2: thirty leagues from Algiers towards Oran"}
                      - {s: "en el cual hay mucha contratación de higos pasos", r: "describes 'lugar', 3: where there is a big trade in dried figs"}
        forms:
          - {w: "dalle", f: "dar (to give) + le (to it), with -rl- turned into -ll-, an old assimilation; modern 'darle'. Infinitive after 'para', like 'asegurar'."}
          - {w: "quiso", f: "quis- + -o → querer (to want), preterite, he. Irregular: quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "hizo", f: "hiz- + -o → hacer (to make, do), preterite, he. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron (c → z before o)."}
          - {w: "se llamaba", f: "llam- + -aba → llamarse (to be called), imperfect, it, with 'se'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "está", f: "est- + -á → estar (to be), present, it: estoy, estás, está, estamos, estáis, están. estar (to be) is used for location."}
          - {w: "hay", f: "the impersonal 'there is / there are' from haber (to have, there to be), present."}
          - {w: "el cual", f: "'which', masculine to match 'lugar'; a heavier relative than 'que', used after a preposition ('en el cual' = where)."}
        note: "Ormsby says twenty leagues where the Spanish says thirty. Regular trips to Sargel with a cargo of figs made the renegade's comings and goings look like ordinary trade."
      - es: "Dos o tres veces hizo este viaje, en compañía del tagarino que había dicho."
        literal: "Two or three times he-made this voyage, in company of-the Tagarin that I-had said."
        ormsby: "Two or three times he made this voyage in company with the Tagarin already mentioned."
        vocab:
          - {w: "en compañía de", d: "together with"}
          - {w: "tagarino", d: "Tagarin, a Moor from Aragon living in Barbary; explained in the next sentence. This one is the renegade's partner in the boat"}
          - {w: "que había dicho", d: "whom I had mentioned (in the previous chapter)"}
        diagram:
          - s: "hizo este viaje"
            r: "main verb: he made this voyage"
            under:
              - {s: "Dos o tres veces", r: "how often: two or three times"}
              - s: "en compañía del tagarino"
                r: "with whom: with the Tagarin"
                under:
                  - {s: "que había dicho", r: "describes 'tagarino': whom I had mentioned"}
        forms:
          - {w: "hizo", f: "hiz- + -o → hacer (to make), preterite, he. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "este", f: "'this', masculine singular to match 'viaje'."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
          - {w: "había dicho", f: "hab- + -ía → haber (to have, auxiliary), imperfect, I: había, habías, había, habíamos, habíais, habían; + dicho, the irregular participle of decir (to say): the pluperfect, 'I had mentioned'."}
        note: "In the previous chapter the renegade arranged to take a Tagarin Moor as partner in the boat and its trade, so that a renegade sailing in and out would raise no suspicion."
      - es: "Tagarinos llaman en Berbería a los moros de Aragón, y a los de Granada, mudéjares; y en el reino de Fez llaman a los mudéjares elches, los cuales son la gente de quien aquel rey más se sirve en la guerra."
        literal: "Tagarins they-call in Barbary [to] the Moors of Aragon, and [to] those of Granada, Mudejars; and in the kingdom of Fez they-call [to] the Mudejars Elches, the which are the people of whom that king most himself-serves in the war."
        ormsby: "The Moors of Aragón are called Tagarins in Barbary, and those of Granada Mudéjars; but in the Kingdom of Fez they call the Mudéjars Elches, and they are the people the king chiefly employs in war."
        vocab:
          - {w: "Berbería", d: "Barbary, the North African coast from Morocco to Tripoli"}
          - {w: "tagarinos", d: "Tagarins: Moors from Aragon who had crossed to North Africa"}
          - {w: "mudéjares", d: "Mudejars: Muslims who had lived under Christian rule in Spain; here those from Granada"}
          - {w: "Fez", d: "kingdom in what is now Morocco"}
          - {w: "elches", d: "in Spain usually 'renegades'; Cervantes says it is the name used in Fez for the Mudejars"}
          - {w: "servirse de", d: "to make use of, employ"}
        diagram:
          - s: "Tagarinos llaman"
            r: "main verb 1: they call (them) Tagarins"
            under:
              - {s: "en Berbería", r: "where: in Barbary"}
              - {s: "a los moros de Aragón", r: "object: the Moors of Aragon"}
              - {s: "y a los de Granada, mudéjares", r: "object 2 and its name: and those of Granada, Mudejars"}
          - s: "llaman a los mudéjares elches"
            r: "main verb 2 (after 'y'): they call the Mudejars Elches"
            under:
              - {s: "en el reino de Fez", r: "where: in the kingdom of Fez"}
              - s: "los cuales son la gente"
                r: "describes 'elches': who are the people"
                under:
                  - {s: "de quien aquel rey más se sirve en la guerra", r: "describes 'gente': whom that king uses most in war"}
        forms:
          - {w: "llaman", f: "llam- + -an → llamar (to call), present, they (people in general). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "a los moros", f: "the personal 'a' that marks a person as the object: 'they call the Moors'; the name ('Tagarinos') comes first for emphasis."}
          - {w: "los cuales", f: "'who', masculine plural to match 'elches'."}
          - {w: "son", f: "s- + -on → ser (to be), present, they: soy, eres, es, somos, sois, son."}
          - {w: "aquel", f: "'that', masculine singular to match 'rey'."}
          - {w: "se sirve", f: "sirv- + -e → servirse (to make use of), present, he, with 'se'. The e of the stem becomes i when stressed: sirvo, sirves, sirve, servimos, servís, sirven."}
        note: "These Moors were descendants of the Muslims of Spain who had crossed to Africa after the Christian conquest; the names show how carefully the exiles were sorted by origin."
  - sentences:
      - es: "»Digo, pues, que cada vez que pasaba con su barca daba fondo en una caleta que estaba no dos tiros de ballesta del jardín donde Zoraida esperaba;"
        literal: "»I-say, then, that each time that he-passed with his boat he-gave bottom in a cove that was not two shots of crossbow from-the garden where Zoraida was-waiting;"
        ormsby: "To proceed: every time he passed with his vessel he anchored in a cove that was not two crossbow shots from the garden where Zoraida was waiting;"
        vocab:
          - {w: "digo, pues", d: "so, as I was saying (resuming the story)"}
          - {w: "dar fondo", d: "to anchor, drop anchor"}
          - {w: "caleta", d: "small cove, inlet"}
          - {w: "tiro de ballesta", d: "a crossbow shot, a measure of distance (a couple of hundred yards)"}
        diagram:
          - s: "Digo, pues"
            r: "main verb: so I say"
            under:
              - s: "daba fondo en una caleta"
                r: "what I say: he would anchor in a cove"
                under:
                  - {s: "cada vez que pasaba con su barca", r: "when: every time he passed with his boat"}
                  - s: "que estaba no dos tiros de ballesta del jardín"
                    r: "describes 'caleta': less than two crossbow shots from the garden"
                    under:
                      - {s: "donde Zoraida esperaba", r: "describes 'jardín': where Zoraida was waiting"}
        forms:
          - {w: "Digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "pasaba, daba, estaba, esperaba", f: "pas- + -aba → pasar (to pass), he; d- + -aba → dar (to give), he; est- + -aba → estar (to be), it (the cove); esper- + -aba → esperar (to wait), she: all imperfect, for what happened again and again. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "del", f: "de + el, 'from the'."}
      - es: "y allí, muy de propósito, se ponía el renegado con los morillos que bogaban el remo, o ya a hacer la zalá, o a como por ensayarse de burlas a lo que pensaba hacer de veras;"
        literal: "and there, very on purpose, himself placed the renegade with the little-Moors who pulled the oar, either now to do the zalá, or to as-if for to-rehearse-himself in jest at that which he-was-thinking to-do in truth;"
        ormsby: "and there the renegade, together with the two Moorish lads that rowed, used purposely to station himself, either going through his prayers, or else practising as a part what he meant to perform in earnest."
        vocab:
          - {w: "de propósito", d: "on purpose, deliberately"}
          - {w: "ponerse a", d: "to set about (doing something); also to station oneself"}
          - {w: "morillo", d: "Moorish lad; diminutive of 'moro'"}
          - {w: "bogar el remo", d: "to pull the oar, row"}
          - {w: "o ya ... o", d: "either ... or"}
          - {w: "zalá", d: "salat, the Muslim ritual prayer (from Arabic)"}
          - {w: "ensayarse", d: "to rehearse, practise"}
          - {w: "de burlas", d: "in jest, as a pretence"}
          - {w: "de veras", d: "in earnest, for real"}
        diagram:
          - s: "se ponía el renegado"
            r: "main verb (after 'y'): the renegade would station himself"
            under:
              - {s: "allí", r: "where: there, in the cove"}
              - {s: "muy de propósito", r: "how: quite deliberately"}
              - s: "con los morillos"
                r: "with whom: with the Moorish lads"
                under:
                  - {s: "que bogaban el remo", r: "describes 'morillos': who rowed"}
              - {s: "o ya a hacer la zalá", r: "purpose 1: either to say his prayers"}
              - s: "o a como por ensayarse de burlas"
                r: "purpose 2: or as if to rehearse in play"
                under:
                  - {s: "a lo que pensaba hacer de veras", r: "what he rehearsed: what he meant to do for real"}
        forms:
          - {w: "se ponía", f: "pon- + -ía → ponerse (to set oneself), imperfect, he, with 'se'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "morillos", f: "mor- + -illo + -s → moro (Moor) with the diminutive -illo, plural: 'Moorish lads'."}
          - {w: "bogaban", f: "bog- + -aban → bogar (to row), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "ensayarse", f: "ensayar (to rehearse) + se (himself), the pronoun hung on the infinitive after 'por'."}
          - {w: "pensaba", f: "pens- + -aba → pensar (to intend), imperfect, he; same -aba imperfect. pensar + infinitive = to intend to."}
        note: "The renegade plays the good Muslim on shore within sight of the garden, saying the prayers, while in fact rehearsing the escape. The boy rowers are Moors, not Christians."
      - es: "y así, se iba al jardín de Zoraida y le pedía fruta, y su padre se la daba sin conocelle;"
        literal: "and so, himself he-went to-the garden of Zoraida and to-him he-asked fruit, and her father to-him it gave without knowing-him;"
        ormsby: "And thus he would go to Zoraida’s garden and ask for fruit, which her father gave him, not knowing him;"
        vocab:
          - {w: "irse", d: "to go off, make one's way"}
          - {w: "conocer", d: "here 'to know who someone is, recognise'"}
        diagram:
          - s: "se iba al jardín de Zoraida"
            r: "main verb 1: he would go to Zoraida's garden"
            under:
              - {s: "y así", r: "linking: and so"}
          - {s: "y le pedía fruta", r: "main verb 2: and ask him (the father) for fruit"}
          - s: "y su padre se la daba"
            r: "main verb 3: and her father gave it to him"
            under:
              - {s: "sin conocelle", r: "how: without knowing who he was"}
        forms:
          - {w: "se iba", f: "iba → ir (to go), imperfect, he, with 'se' (irse, to go off). Irregular: iba, ibas, iba, íbamos, ibais, iban."}
          - {w: "al", f: "a + el, 'to the'."}
          - {w: "pedía", f: "ped- + -ía → pedir (to ask for), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "se la daba", f: "d- + -aba → dar (to give), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. 'se la' = it (la fruta) to him: 'le' becomes 'se' before 'la'."}
          - {w: "conocelle", f: "conocer (to know) + le (him), with -rl- turned into -ll-, an old assimilation; modern 'conocerle'. Infinitive after 'sin'."}
      - es: "y, aunque él quisiera hablar a Zoraida, como él después me dijo, y decille que él era el que por orden mía le había de llevar a tierra de cristianos, que estuviese contenta y segura, nunca le fue posible, porque las moras no se dejan ver de ningún moro ni turco, si no es que su marido o su padre se lo manden."
        literal: "and, although he might-have-wished to-speak to Zoraida, as he afterwards to-me said, and to-tell-her that he was the-one who by order mine her had to take to land of Christians, that she-should-be content and secure, never to-him it-was possible, because the Moorish-women not themselves let see by any Moor nor Turk, if not it-is that their husband or their father to-them it may-order."
        ormsby: "but though, as he afterwards told me, he sought to speak to Zoraida, and tell her who he was, and that by my orders he was to take her to the land of the Christians, so that she might feel satisfied and easy, he had never been able to do so; for the Moorish women do not allow themselves to be seen by any Moor or Turk, unless their husband or father bid them:"
        vocab:
          - {w: "por orden mía", d: "by my order, on my instructions"}
          - {w: "haber de", d: "to be to, have to; 'le había de llevar' = was to take her"}
          - {w: "tierra de cristianos", d: "Christian lands, Christendom"}
          - {w: "seguro", d: "here 'reassured, at ease', not only 'safe'"}
          - {w: "dejarse ver", d: "to let oneself be seen"}
          - {w: "mora", d: "Moorish woman"}
          - {w: "si no es que", d: "unless"}
        diagram:
          - s: "nunca le fue posible"
            r: "main verb: it was never possible for him"
            under:
              - {s: "aunque él quisiera hablar a Zoraida", r: "concession: although he wanted to speak to Zoraida"}
              - {s: "como él después me dijo", r: "aside: as he told me later"}
              - s: "y decille"
                r: "concession, 2: and tell her"
                under:
                  - {s: "que él era el que por orden mía le había de llevar a tierra de cristianos", r: "what he wanted to tell her: that he was the one who, on my orders, was to take her to Christian lands"}
                  - {s: "que estuviese contenta y segura", r: "what he wanted to tell her, 2: that she should be calm and easy"}
              - s: "porque las moras no se dejan ver de ningún moro ni turco"
                r: "why: because Moorish women do not let any Moor or Turk see them"
                under:
                  - {s: "si no es que su marido o su padre se lo manden", r: "condition: unless their husband or father tells them to"}
        forms:
          - {w: "quisiera", f: "quis- + -iera → querer (to want), imperfect subjunctive (-ra form), he: 'although he wanted'. Built on the preterite quisieron: quisiera, quisieras, quisiera, quisiéramos, quisierais, quisieran."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "decille", f: "decir (to tell) + le (her), with -rl- turned into -ll-, an old assimilation; modern 'decirle'. Infinitive joined to 'hablar' after 'quisiera'."}
          - {w: "era", f: "er- + -a → ser (to be), imperfect, he. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "mía", f: "'my', the long possessive placed after the noun, feminine to match 'orden'."}
          - {w: "había de llevar", f: "hab- + -ía → haber (to have), imperfect, he: había, habías, había, habíamos, habíais, habían; 'haber de' + llevar (to take) = 'was to take'."}
          - {w: "estuviese", f: "estuv- + -iese → estar (to be), imperfect subjunctive (-se form), she: estuviese, estuvieses, estuviese, estuviésemos, estuvieseis, estuviesen. Subjunctive because it reports a wish: '(telling her) that she should be'."}
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, it. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "se dejan", f: "dej- + -an → dejarse (to let oneself), present, they (the Moorish women). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "ningún", f: "ninguno (no, any) clipped before a masculine singular noun ('moro'). Spanish keeps the double negative: 'no ... ningún' = not any."}
          - {w: "manden", f: "mand- + -en → mandar (to order), present subjunctive, they (husband or father), after 'si no es que'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "se lo", f: "'it to them': le/les becomes 'se' before 'lo'."}
      - es: "De cristianos cautivos se dejan tratar y comunicar, aun más de aquello que sería razonable; y a mí me hubiera pesado que él la hubiera hablado, que quizá la alborotara, viendo que su negocio andaba en boca de renegados."
        literal: "By Christians captive themselves they-let deal-with and talk-to, even more than that which would-be reasonable; and to me to-me it-would-have weighed that he to-her had spoken, for perhaps her it-would-have alarmed, seeing that her business went in mouth of renegades."
        ormsby: "with Christian captives they permit freedom of intercourse and communication, even more than might be considered proper. But for my part I should have been sorry if he had spoken to her, for perhaps it might have alarmed her to find her affairs talked of by renegades."
        vocab:
          - {w: "tratar", d: "to deal with, have dealings with"}
          - {w: "comunicar", d: "here 'to talk with, associate with'"}
          - {w: "razonable", d: "proper, fitting"}
          - {w: "pesar", d: "to grieve, make sorry; 'me hubiera pesado' = I would have been sorry"}
          - {w: "alborotar", d: "to alarm, upset, throw into confusion"}
          - {w: "negocio", d: "affair, business, matter"}
          - {w: "andar en boca de", d: "to be talked about by, be on the lips of"}
        diagram:
          - s: "se dejan tratar y comunicar"
            r: "main verb 1: they let themselves be dealt with and talked to"
            under:
              - {s: "De cristianos cautivos", r: "by whom: by Christian captives"}
              - {s: "aun más de aquello que sería razonable", r: "how much: even more than would be proper"}
          - s: "a mí me hubiera pesado"
            r: "main verb 2 (after 'y'): I would have been sorry"
            under:
              - {s: "que él la hubiera hablado", r: "what: if he had spoken to her"}
              - s: "que quizá la alborotara"
                r: "why: for perhaps it would have alarmed her"
                under:
                  - {s: "viendo que su negocio andaba en boca de renegados", r: "how: seeing her secret in renegades' mouths"}
        forms:
          - {w: "se dejan", f: "dej- + -an → dejarse (to let oneself), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. With an infinitive it is passive: 'let themselves be dealt with'."}
          - {w: "aquello", f: "neuter 'that', standing for an idea, not a thing."}
