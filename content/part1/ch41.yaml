      - es: "pero, por no parecer en aquella noche la luna y el cielo mostrarse escuro, y por ignorar el paraje en que estábamos, no nos pareció cosa segura embestir en tierra, como a muchos de nosotros les parecía, diciendo que diésemos en ella, aunque fuese en unas peñas y lejos de poblado, porque así aseguraríamos el temor que de razón se debía tener que por allí anduviesen bajeles de cosarios de Tetuán, los cuales anochecen en Berbería y amanecen en las costas de España, y hacen de ordinario presa, y se vuelven a dormir a sus casas."
        literal: "but, because-of not appearing on that night the moon and the sky showing-itself dark, and because-of not-knowing the spot in which we-were, not to-us it-seemed thing safe to-run on land, as to many of us to-them it-seemed, saying that we-should-strike on it, even-if it-were on some rocks and far from inhabited-place, because thus we-would-secure the fear that with reason itself one-ought to-have that around there might-go vessels of corsairs of Tetuán, the which fall-night in Barbary and dawn on the coasts of Spain, and make usually prize, and themselves return to sleep at their houses."
        ormsby: "But as the moon did not show that night, and the sky was clouded, and as we knew not whereabouts we were, it did not seem to us a prudent thing to make for the shore, as several of us advised, saying we ought to run ourselves ashore even if it were on rocks and far from any habitation, for in this way we should be relieved from the apprehensions we naturally felt of the prowling vessels of the Tetuan corsairs, who leave Barbary at nightfall and are on the Spanish coast by daybreak, where they commonly take some prize, and then go home to sleep in their own houses."
