          - s: "dijo nuestro renegado:"
            r: "main verb 2 (after 'pero'): our renegade said"
            under:
              - {s: "por preguntarnos esto en lengua francesa", r: "why: because they asked this in French"}
              - s: "Ninguno responda"
                r: "what he said: let no one answer"
                under:
                  - s: "porque éstos, sin duda, son cosarios franceses"
                    r: "why: because these are certainly French corsairs"
                    under:
                      - {s: "que hacen a toda ropa", r: "describes 'cosarios': who plunder everyone"}
          - s: "ninguno respondió palabra"
            r: "main verb 3: no one answered a word"
            under:
              - {s: "Por este advertimiento", r: "why: because of this warning"}
        forms:
          - {w: "Habíanse puesto", f: "habían + se → haber (to have, auxiliary), imperfect, they, with 'se' stuck on the end, + puesto, the irregular participle of poner (to put): pluperfect of ponerse (to place oneself), 'they had placed themselves'; modern 'se habían puesto'. haber (to have) in the imperfect: había, habías, había, habíamos, habíais, habían. Cervantes hangs the pronoun on a verb that opens the sentence."}
