        note: "Raids by Barbary corsairs on the coasts of Andalusia and Valencia were a constant danger in Cervantes' time; the crossing from Tetouan is short enough to be made in one night. Watchtowers and mounted patrols guarded the shore."
      - es: "Pero, de los contrarios pareceres, el que se tomó fue que nos llegásemos poco a poco, y que si el sosiego del mar lo concediese, desembarcásemos donde pudiésemos."
        literal: "But, of the contrary opinions, the [one] that itself was-taken was that we-should-approach little by little, and that if the calm of-the sea it might-allow, we-should-land where we-could."
        ormsby: "But of the conflicting counsels the one which was adopted was that we should approach gradually, and land where we could if the sea were calm enough to permit us."
