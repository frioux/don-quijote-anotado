  - sentences:
      - es: "»Seis días estuvimos en Vélez, al cabo de los cuales el renegado, hecha su información de cuanto le convenía, se fue a la ciudad de Granada, a reducirse por medio de la Santa Inquisición al gremio santísimo de la Iglesia;"
        literal: "»Six days we-were in Vélez, at-the end of the which the renegade, made his inquiry of as-much-as to-him was-fitting, himself went to the city of Granada, to bring-back-himself by means of the Holy Inquisition to-the bosom most-holy of the Church;"
        ormsby: "We remained six days in Velez, at the end of which the renegade, having informed himself of all that was requisite for him to do, set out for the city of Granada to restore himself to the sacred bosom of the Church through the medium of the Holy Inquisition."
        vocab:
          - {w: "al cabo de", d: "at the end of, after"}
          - {w: "hacer información", d: "to make inquiries, inform oneself"}
          - {w: "convenir", d: "to be fitting, be needed (for someone)"}
          - {w: "reducirse", d: "to be brought back, reconciled (to the Church)"}
          - {w: "por medio de", d: "by means of, through"}
          - {w: "Santa Inquisición", d: "the Holy Office, the Church court that judged heresy and apostasy; it had a tribunal in Granada"}
          - {w: "gremio", d: "bosom, fold (of the Church); a false friend, not 'guild' here"}
        diagram:
          - {s: "Seis días estuvimos en Vélez", r: "main verb 1: we stayed six days in Vélez"}
          - s: "se fue a la ciudad de Granada"
            r: "main verb 2: went off to the city of Granada"
            under:
              - {s: "al cabo de los cuales", r: "when: at the end of which (days)"}
              - {s: "el renegado", r: "subject: the renegade"}
              - {s: "hecha su información de cuanto le convenía", r: "when: having found out all he needed to"}
              - s: "a reducirse"
                r: "why: to be brought back"
                under:
                  - {s: "por medio de la Santa Inquisición", r: "how: through the Holy Inquisition"}
                  - {s: "al gremio santísimo de la Iglesia", r: "to what: to the most holy bosom of the Church"}
        forms:
          - {w: "estuvimos", f: "estuv- + -imos → estar (to be, to stay), preterite, we. Irregular: estuve, estuviste, estuvo, estuvimos, estuvisteis, estuvieron."}
          - {w: "los cuales", f: "'which', masculine plural to match 'días'."}
          - {w: "hecha su información", f: "hecha, irregular participle of hacer (to make), feminine to match 'información': an absolute construction, 'his inquiry made', i.e. having made his inquiries."}
          - {w: "convenía", f: "conven- + -ía → convenir (to be fitting), imperfect, it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "se fue", f: "fu- + -e → irse (to go off), preterite, he. Irregular, the same as ser (to be) in the preterite: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "reducirse", f: "reducir (to bring back) + se (himself), infinitive after 'a' of purpose."}
          - {w: "santísimo", f: "sant- + -ísimo → santo (holy), the -ísimo suffix ('most'), masculine to match 'gremio'."}
        note: "A renegade who returned from Barbary had to present himself to the Inquisition to be absolved of apostasy and received back into the Church; those who came back of their own accord were usually treated mildly. The renegade had planned this from the start."
