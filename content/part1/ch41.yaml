        forms:
          - {w: "se tomó", f: "tom- + -ó → tomar (to take), preterite, it, with 'se' making it passive: 'was taken, was adopted'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, it. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "llegásemos", f: "lleg- + -ásemos → llegarse (to approach), imperfect subjunctive (-se form), we, with 'nos'. The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "desembarcásemos", f: "desembarc- + -ásemos → desembarcar (to land), imperfect subjunctive (-se form), we. Same -ase subjunctive: desembarcase, desembarcases, desembarcase, desembarcásemos, desembarcaseis, desembarcasen."}
          - {w: "concediese", f: "conced- + -iese → conceder (to allow), imperfect subjunctive (-se form), it, in the 'si' clause. The -se imperfect subjunctive of -er verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen."}
          - {w: "pudiésemos", f: "pud- + -iésemos → poder (to be able), imperfect subjunctive (-se form), we. Irregular stem pud-: pudiese, pudieses, pudiese, pudiésemos, pudieseis, pudiesen."}
  - sentences:
      - es: "»Hízose así, y poco antes de la media noche sería cuando llegamos al pie de una disformísima y alta montaña, no tan junto al mar que no concediese un poco de espacio para poder desembarcar cómodamente."
        literal: "»Did-itself thus, and little before of the mid night it-would-be when we-arrived at-the foot of a most-huge and high mountain, not so close to-the sea that not it-might-allow a little of space to be-able to-land comfortably."
        ormsby: "This was done, and a little before midnight we drew near to the foot of a huge and lofty mountain, not so close to the sea but that it left a narrow space on which to land conveniently."
        ormsby_note: "The Sierra Tejeda, to the south of Alhama, is apparently that which Cervantes means."
        vocab:
          - {w: "hacerse así", d: "to be done so: 'hízose así' = so it was done"}
          - {w: "sería cuando", d: "it would have been (about the time) when; a guess about the hour"}
          - {w: "disforme", d: "huge, monstrous, misshapen; 'disformísima' = enormous"}
          - {w: "junto a", d: "close to"}
          - {w: "cómodamente", d: "conveniently, easily (not only 'comfortably')"}
        diagram:
          - {s: "Hízose así", r: "main verb 1: so it was done"}
          - s: "sería"
            r: "main verb 2: it would have been"
            under:
              - {s: "poco antes de la media noche", r: "what time: a little before midnight"}
              - s: "cuando llegamos al pie de una disformísima y alta montaña"
                r: "when: when we came to the foot of a huge, high mountain"
                under:
                  - s: "no tan junto al mar"
                    r: "describes 'montaña': not so close to the sea"
                    under:
                      - {s: "que no concediese un poco de espacio para poder desembarcar cómodamente", r: "result: that it did not leave a little room to land easily"}
        forms:
          - {w: "Hízose", f: "hizo + se → hacer (to do), preterite, it, with 'se' stuck on the end and an accent added: passive, 'it was done'; modern 'se hizo'. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron. Cervantes hangs the pronoun on a verb that opens a sentence."}
          - {w: "sería", f: "ser- + -ía → ser (to be), conditional, it: 'it would be', a guess about the past ('it must have been'). The conditional adds -ía endings to the infinitive: sería, serías, sería, seríamos, seríais, serían."}
          - {w: "llegamos", f: "lleg- + -amos → llegar (to arrive), preterite, we. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (llegué, g → gu before e)."}
          - {w: "disformísima", f: "disform- + -ísima → disforme (huge), the -ísimo suffix ('most, very'), feminine to match 'montaña'."}
          - {w: "concediese", f: "conced- + -iese → conceder (to allow), imperfect subjunctive (-se form), it (the mountain). The -se imperfect subjunctive of -er verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen. Subjunctive in a result clause after a negative ('no tan junto al mar que no concediese'): 'not so close that it did not leave'."}
          - {w: "poder desembarcar", f: "two infinitives after 'para': poder (to be able) + desembarcar (to land)."}
      - es: "Embestimos en la arena, salimos a tierra, besamos el suelo, y, con lágrimas de muy alegrísimo contento, dimos todos gracias a Dios, Señor Nuestro, por el bien tan incomparable que nos había hecho."
        literal: "We-ran into the sand, we-went-out to land, we-kissed the ground, and, with tears of very most-joyful contentment, we-gave all thanks to God, Lord Our, for the good so incomparable that to-us he-had done."
        ormsby: "We ran our boat up on the sand, and all sprang out and kissed the ground, and with tears of joyful satisfaction returned thanks to God our Lord for all his incomparable goodness to us on our voyage."
        vocab:
          - {w: "embestir en la arena", d: "to run (the boat) onto the sand"}
          - {w: "salir a tierra", d: "to go ashore"}
          - {w: "muy alegrísimo", d: "'very most joyful', a double superlative for emphasis"}
          - {w: "contento", d: "here a noun: contentment, joy"}
          - {w: "dar gracias", d: "to give thanks"}
        diagram:
          - {s: "Embestimos en la arena", r: "main verb 1: we ran onto the sand"}
          - {s: "salimos a tierra", r: "main verb 2: we went ashore"}
          - {s: "besamos el suelo", r: "main verb 3: we kissed the ground"}
          - s: "dimos todos gracias a Dios, Señor Nuestro"
            r: "main verb 4 (after 'y'): we all gave thanks to God our Lord"
            under:
              - {s: "con lágrimas de muy alegrísimo contento", r: "how: with tears of the greatest joy"}
              - s: "por el bien tan incomparable"
                r: "why: for the incomparable kindness"
                under:
                  - {s: "que nos había hecho", r: "describes 'bien': that he had done us"}
        forms:
          - {w: "Embestimos", f: "embest- + -imos → embestir (to run into), preterite, we. The e of the stem turns to i only in the he and they forms: embestí, embestiste, embistió, embestimos, embestisteis, embistieron."}
          - {w: "salimos", f: "sal- + -imos → salir (to go out), preterite, we. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron (salí, saliste, salió, salimos, salisteis, salieron)."}
          - {w: "besamos", f: "bes- + -amos → besar (to kiss), preterite, we. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "alegrísimo", f: "alegr- + -ísimo → alegre (joyful), the -ísimo suffix ('most, very'), masculine to match 'contento'; with 'muy' in front it is doubled for emphasis."}
          - {w: "dimos", f: "di- + -mos → dar (to give), preterite, we. Irregular: di, diste, dio, dimos, disteis, dieron."}
          - {w: "había hecho", f: "había → haber (to have, auxiliary), imperfect, he (God): había, habías, había, habíamos, habíais, habían; + hecho, the irregular participle of hacer (to do): pluperfect, 'had done'."}
      - es: "Sacamos de la barca los bastimentos que tenía, tirámosla en tierra, y subímonos un grandísimo trecho en la montaña, porque aún allí estábamos, y aún no podíamos asegurar el pecho, ni acabábamos de creer que era tierra de cristianos la que ya nos sostenía."
        literal: "We-took-out from the boat the provisions that it-had, we-hauled-it on land, and we-climbed-ourselves a very-great stretch on the mountain, because still there we-were, and still not we-could secure the breast, nor we-finished of believing that it-was land of Christians the [land] that now us was-holding-up."
        ormsby: "We took out of the boat the provisions it contained, and drew it up on the shore, and then climbed a long way up the mountain, for even there we could not feel easy in our hearts, or persuade ourselves that it was Christian soil that was now under our feet."
        vocab:
          - {w: "bastimentos", d: "provisions, supplies"}
          - {w: "tirar", d: "here 'to haul, drag'"}
          - {w: "trecho", d: "stretch, distance"}
          - {w: "asegurar el pecho", d: "to set one's heart at rest, feel safe ('pecho' = breast, heart)"}
          - {w: "acabar de creer", d: "to bring oneself to believe, quite believe"}
          - {w: "sostener", d: "to hold up, bear"}
        diagram:
          - s: "Sacamos de la barca los bastimentos"
            r: "main verb 1: we took the provisions out of the boat"
            under:
              - {s: "que tenía", r: "describes 'bastimentos': that it had"}
          - {s: "tirámosla en tierra", r: "main verb 2: we hauled it ashore"}
          - s: "y subímonos un grandísimo trecho en la montaña"
            r: "main verb 3: and climbed a very long way up the mountain"
            under:
              - s: "porque aún allí estábamos"
                r: "why: because even there we were (uneasy)"
                under:
                  - {s: "y aún no podíamos asegurar el pecho", r: "and still could not feel safe"}
                  - s: "ni acabábamos de creer"
                    r: "nor could we quite believe"
                    under:
                      - {s: "que era tierra de cristianos la que ya nos sostenía", r: "what: that the ground now under us was Christian land"}
        forms:
          - {w: "Sacamos", f: "sac- + -amos → sacar (to take out), preterite, we. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (saqué, c → qu before e)."}
          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, it (the boat). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "tirámosla", f: "tiramos + la → tirar (to haul), preterite, we, with 'la' (it, the boat) stuck on the end and an accent added; modern 'la tiramos'. Same -amos preterite. Cervantes hangs the pronoun on a verb that opens a clause."}
          - {w: "subímonos", f: "subimos + nos → subirse (to climb), preterite, we; the final -s of 'subimos' drops before 'nos'; modern 'nos subimos'. Same -imos preterite as 'salimos': subí, subiste, subió, subimos, subisteis, subieron."}
