        ormsby: "and the Moors, who were fainthearted, hearing their captain speak in this way, were cowed, and without any one of them taking to his arms (and indeed they had few or hardly any) they submitted without saying a word to be bound by the Christians, who quickly secured them, threatening them that if they raised any kind of outcry they would be all put to the sword."
