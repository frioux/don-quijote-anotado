        note: "The captive and Zoraida are not yet married: she must first be baptized. He travels as her protector, which is why she arrived at the inn veiled and still unbaptized."
      - es: "La paciencia con que Zoraida lleva las incomodidades que la pobreza trae consigo, y el deseo que muestra tener de verse ya cristiana es tanto y tal, que me admira y me mueve a servirla todo el tiempo de mi vida, puesto que el gusto que tengo de verme suyo y de que ella sea mía me lo turba y deshace no saber si hallaré en mi tierra algún rincón donde recogella, y si habrán hecho el tiempo y la muerte tal mudanza en la hacienda y vida de mi padre y hermanos que apenas halle quien me conozca, si ellos faltan.»"
        literal: "The patience with which Zoraida bears the discomforts that the poverty brings with-itself, and the desire that she-shows to-have of seeing-herself already Christian is so-great and such, that me it-amazes and me moves to serve-her all the time of my life, granted that the pleasure that I-have of seeing-myself hers and of that she may-be mine to-me it disturbs and undoes not knowing if I-shall-find in my land some corner where to-shelter-her, and if will-have made the time and the death such change in the estate and life of my father and brothers that hardly I-may-find who me may-know, if they are-missing.»"
        ormsby: "The patience with which she endures the hardships that poverty brings with it, and the eagerness she shows to become a Christian, are such that they fill me with admiration, and bind me to serve her all my life; though the happiness I feel in seeing myself hers, and her mine, is disturbed and marred by not knowing whether I shall find any corner to shelter her in my own country, or whether time and death may not have made such changes in the fortunes and lives of my father and brothers, that I shall hardly find anyone who knows me, if they are not alive."
        vocab:
          - {w: "llevar", d: "here 'to bear, endure'"}
          - {w: "incomodidades", d: "hardships, discomforts"}
          - {w: "traer consigo", d: "to bring with it"}
