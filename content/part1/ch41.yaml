          - {w: "comenzó", f: "comenz- + -ó → comenzar (to begin), preterite, it, + 'a' + infinitive. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "obligó", f: "oblig- + -ó → obligar (to oblige), preterite, it. Same -ó preterite, followed by 'a' + infinitive."}
