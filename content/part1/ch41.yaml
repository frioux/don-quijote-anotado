      - es: "y, sirviéndola yo hasta agora de padre y escudero, y no de esposo, vamos con intención de ver si mi padre es vivo, o si alguno de mis hermanos ha tenido más próspera ventura que la mía, puesto que, por haberme hecho el cielo compañero de Zoraida, me parece que ninguna otra suerte me pudiera venir, por buena que fuera, que más la estimara."
