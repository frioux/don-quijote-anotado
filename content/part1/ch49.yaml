  - sentences:
      - es: "— Añadió también vuestra merced, diciendo que me habían hecho mucho daño tales libros, pues me habían vuelto el juicio y puéstome en una jaula, y que me sería mejor hacer la enmienda y mudar de letura, leyendo otros más verdaderos y que mejor deleitan y enseñan."
        literal: "— Added also your grace, saying that to-me had done much harm such books, since me they-had turned the judgment and put-me in a cage, and that to-me it-would-be better to-make the amendment and change of reading, reading others more true and which better delight and teach."
        ormsby: "“You also went on to say that books of this kind had done me much harm, inasmuch as they had upset my senses, and shut me up in a cage, and that it would be better for me to reform and change my studies, and read other truer books which would afford more pleasure and instruction.”"
