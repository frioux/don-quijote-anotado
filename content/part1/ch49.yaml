  - sentences:
      - es: "— Yo soy contento de hacer lo que dices, Sancho hermano —replicó don Quijote—; y cuando tú veas coyuntura de poner en obra mi libertad, yo te obedeceré en todo y por todo; pero tú, Sancho, verás como te engañas en el conocimiento de mi desgracia."
        literal: "— I am content to do that which you-say, Sancho brother —replied Don Quijote—; and when you may-see opportunity of putting into work my freedom, I you will-obey in all and for all; but you, Sancho, will-see how yourself you-deceive in the knowledge of my misfortune."
        ormsby: "“I am content to do as thou sayest, brother Sancho,” said Don Quixote, “and when thou seest an opportunity for effecting my release I will obey thee absolutely; but thou wilt see, Sancho, how mistaken thou art in thy conception of my misfortune.”"
