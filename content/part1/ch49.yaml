  - sentences:
      - es: "— Pues yo —replicó don Quijote— hallo por mi cuenta que el sin juicio y el encantado es vuestra merced, pues se ha puesto a decir tantas blasfemias contra una cosa tan recebida en el mundo, y tenida por tan verdadera, que el que la negase, como vuestra merced la niega, merecía la mesma pena que vuestra merced dice que da a los libros cuando los lee y le enfadan."
        literal: "— Well I —replied Don Quijote— find by my reckoning that the without judgment and the enchanted is your grace, since himself he-has put to say so-many blasphemies against a thing so received in the world, and held as so true, that he who it should-deny, as your grace it denies, deserved the same penalty that your grace says that he-gives to the books when them he-reads and him they-annoy."
        ormsby: "“Well then,” returned Don Quixote, “to my mind it is you who are the one that is out of his wits and enchanted, as you have ventured to utter such blasphemies against a thing so universally acknowledged and accepted as true that whoever denies it, as you do, deserves the same punishment which you say you inflict on the books that irritate you when you read them."
        vocab:
          - {w: "replicar", d: "to reply, retort"}
          - {w: "hallar por mi cuenta", d: "to find by my reckoning, to conclude for my part"}
          - {w: "el sin juicio", d: "the one without judgment, the madman ('juicio' = sanity, wits)"}
          - {w: "ponerse a", d: "to set about, start (doing something)"}
          - {w: "blasfemia", d: "blasphemy: Don Quijote treats denying the knights as heresy"}
          - {w: "recebido", d: "= recibido, received, accepted (old spelling)"}
          - {w: "tener por", d: "to hold as, consider"}
          - {w: "mesmo", d: "= mismo, same (old form)"}
          - {w: "pena", d: "penalty, punishment (here, being thrown at the wall or into the fire)"}
          - {w: "enfadar", d: "to annoy, irritate"}
