          - {w: "ser contento de", d: "to be content to, be willing to; old use of 'ser' where modern Spanish says 'estar contento'"}
          - {w: "coyuntura", d: "opportunity, the right moment"}
          - {w: "poner en obra", d: "to put into effect, carry out"}
          - {w: "en todo y por todo", d: "in everything, entirely"}
          - {w: "engañarse", d: "to be mistaken, deceive oneself"}
          - {w: "desgracia", d: "misfortune (not 'disgrace')"}
