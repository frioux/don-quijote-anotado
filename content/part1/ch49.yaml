          - {w: "volver el juicio", d: "to turn someone's head, drive mad"}
          - {w: "jaula", d: "cage: Don Quijote is being carried home in a wooden cage on an oxcart"}
          - {w: "hacer la enmienda", d: "to mend one's ways, reform"}
          - {w: "mudar de", d: "to change (one's ...)"}
          - {w: "letura", d: "= lectura, reading (old spelling)"}
          - {w: "deleitar", d: "to delight, please"}
