summary: |
  Sancho thinks he has caught his master out. People say of someone who is out of sorts that he neither eats, drinks, sleeps nor answers sensibly, as if he were enchanted; so the truly enchanted must be those who do none of these things, not a man who eats, drinks, answers questions and has just admitted to the needs of nature. Don Quijote replies that there are many kinds of enchantment and that the fashion may have changed: he knows he is enchanted, and that keeps his conscience easy, for it would trouble him greatly to sit idle in a cage if he were not. Sancho proposes that his master should try to get out of the cage and mount Rocinante, who also looks enchanted, so melancholy is he; if their luck fails they can always go back to the cage, and Sancho promises to shut himself up in it too. Don Quijote agrees to obey him when the moment comes.

  They reach the meadow where the priest, the canon and the barber have dismounted. The carter unyokes the oxen, and Sancho asks the priest to let his master out for a while, or the cage will not stay as clean as decency requires. The priest fears the knight will run off, but Sancho and the canon stand surety, and Don Quijote gives his word, pointing out that an enchanted man cannot go where he likes anyway, since his enchanter can fetch him back through the air. Out of the cage, he stretches, pats Rocinante and promises him that they will soon ride again, and then goes off with Sancho to a remote spot, coming back much relieved.

  While they all sit on the grass waiting for the canon's provisions, the canon, amazed that a man so sensible on every other subject should lose his stirrups whenever chivalry comes up, urges him to give up these lying books, which he himself throws against the wall, and to read instead the Book of Judges or the true deeds of Viriatus, Caesar, Hannibal, the Cid, the Great Captain and other heroes, which would make him learned, virtuous and a credit to La Mancha.

  Don Quijote answers that it is the canon who is out of his wits: denying Amadís is like denying that the sun gives light. He piles up proofs: Floripes and Guy of Burgundy, Fierabrás and the bridge of Mantible, King Arthur turned into a raven, Lancelot's go-between the duenna Quintañona, whom his own grandmother seemed to remember, the peg of Pierres' wooden horse beside Babieca's saddle in the royal armoury, Roland's horn at Roncesvalles, and the real Spanish knights who fought abroad, among them Gutierre Quijada, his own ancestor in the male line. The canon, amazed at this mixture of truth and lies, grants that the Spanish knights existed and that there were Twelve Peers, but doubts their famous deeds, and confesses that he has seen Babieca's saddle but never the peg. Don Quijote insists it is there, in a cowhide case against rust; the canon does not remember it, and says that even if it is there, a man of such good parts should not believe the wild stories in books of chivalry.
context: |
  The cage and the body. The chapter turns on the most down-to-earth of arguments. In the previous chapter Sancho got his master to admit that, since he was caged, he had felt the needs of nature; here he draws the conclusion. The enchanted heroes of the romances never seem to eat, sleep or relieve themselves, so a man who does all three cannot be enchanted. Don Quijote's reply, that enchantments, like everything else, change with the times, is the sort of answer that cannot be refuted, and Sancho's practical concern, that the cage will not stay clean, is what finally gets him out of it.

  The canon's case. The canon of Toledo speaks for the learned moralists of the sixteenth century, who attacked the romances of chivalry as lies that wasted time and corrupted readers, and proposed history and Scripture instead. His remedy is very much of its time: the Book of Judges, with Gideon, Samson and the other war-leaders of Israel, as true chivalry, and a roll of national heroes in place of the invented ones. Viriatus led the Lusitanians against Rome; Fernán González was the tenth-century count who, in the ballads and chronicles, made Castile independent of León; the Cid took Valencia from the Moors; Gonzalo Fernández de Córdoba, the 'Great Captain', won Naples for Ferdinand and Isabella; Diego García de Paredes, nicknamed the 'Samson of Extremadura', was famous for his strength. Ormsby's notes explain the rest: Garcilaso is not the poet but an ancestor of his, and Manuel Ponce de León a knight of the War of Granada.

  Don Quijote's reply. Don Quijote's answer is a dizzying mixture, as the canon says, of truth and lies. He runs from the Carolingian romances (Floripes, Fierabrás and the bridge of Mantible, the Twelve Peers) through Troy and the Arthurian matter (Arthur turned into a raven and awaited by his people, Tristan and Iseult, Lancelot and Guinevere, the Grail, and the duenna Quintañona, Lancelot's go-between in a Spanish ballad Don Quijote has quoted before) to relics a reader could visit: the peg of the wooden horse in the Provençal romance of Pierres and Magalona, the Cid's horse Babieca's saddle in the royal armoury, Roland's horn at Roncesvalles. Then, with no change of tone, he passes to real fifteenth-century knights who sought adventures and jousts abroad: Juan de Merlo, Pedro Barba and Gutierre Quijada, Fernando de Guevara, Luis de Falces, and Suero de Quiñones, who in 1434, as Ormsby tells, held the bridge of Órbigo against all comers in the 'Paso Honroso'. Knight-errantry of this kind, as a courtly sport of jousts and challenges, had really been practised in the century before Cervantes was born, which is just what makes Don Quijote's confusion plausible. His claim to descend from Gutierre Quijada in the male line plays on his own uncertain name, which the first chapter gives as Quijada, Quesada or Quejana.

  The canon's concessions. The canon, a reasonable man, gives ground where he can: Spanish knights-errant existed, so did the Twelve Peers, the Cid and Bernardo del Carpio, but not their fabulous deeds. His comparison of the Peers to the military orders of Santiago, Calatrava, Alcántara and St John was meaningful to readers in Spain, where membership of these orders was a coveted mark of nobility; as Ormsby observes, there was never in fact a 'knight of the Twelve Peers'. Archbishop Turpin, whom the canon distrusts, was the supposed author of a Latin chronicle of Charlemagne that was really written long after his time. Ormsby adds that most of the Cid's deeds in the ballads have no historical basis, and that his saddle is not among the treasures of the Armería, if it ever was. The comedy of the peg, which is 'a little bigger than a cart-pole' and yet invisible, and which Don Quijote says is kept in a cowhide case against rust, is that of a believer who answers every doubt with more details.

  Reading Cervantes' Spanish. Old spellings abound: agora (ahora), ansí (así), mesmo and asimesmo (mismo, asimismo), desta, deste, della, dello, déstos (de + the demonstrative or pronoun), satisfación, malencólico, estremo, encantamentos, estrañeza, estranjeros, letura and leción (lectura, lección), recebir (recibir), agüela (abuela), yelo (hielo), vee (ve), deciendo (desciendo), do (donde), Ingalaterra. Infinitives with a pronoun turn -rl- into -ll-: soltalle, fatigalles. Pronouns hang on clause-opening verbs (Entendióle, dejólos, Tomóle, Mirábalo, admirábase, Paréceme, Niéguenme, díganme) and even on a participle ('me habían vuelto el juicio y puéstome en una jaula'). The future subjunctive marks open possibilities (fuere, quisiere, hubiere huido, leyeren), the -se subjunctive runs through the reported speech (probase, pensase, dejase, saliese), 'en' with a gerund means 'as soon as' (en viéndose, en tratándole), and 'haber de' means 'must, be going to'. Notice the doubled negative after verbs of denying ('negar que no', 'Niéguenme que no fue'), which Spanish of the time used where English uses only one, and Don Quijote's oath 'voto a tal', a softened 'I swear to God'.
