          - {w: "he sabido", f: "he (haber (to have), present, I: he, has, ha, hemos, habéis, han) + sabido, the participle of saber (to know, to learn): the present perfect, 'I have learned'."}
          - {w: "trae", f: "tra- + -e → traer (to bring), present, you (vuestra merced). Irregular in the I form: traigo, traes, trae, traemos, traéis, traen."}
