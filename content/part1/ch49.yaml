      - es: "porque, ¿qué ingenio puede haber en el mundo que pueda persuadir a otro que no fue verdad lo de la infanta Floripes y Guy de Borgoña, y lo de Fierabrás con la puente de Mantible, que sucedió en el tiempo de Carlomagno;"
        literal: "because, what wit can there-be in the world that may-be-able to-persuade to another that not was truth that of the princess Floripes and Guy of Burgundy, and that of Fierabrás with the bridge of Mantible, which happened in the time of Charlemagne;"
        ormsby: "What wit in the world can persuade another that the story of the Princess Floripes and Guy of Burgundy is not true, or that of Fierabras and the bridge of Mantible, which happened in the time of Charlemagne?"
        ormsby_note: "The Princess Florides was the sister of Fierabras, and wife of Guy of Burgundy, a nephew of Charlemagne. The bridge of Mantible, referred to in the History of Charlemagne, was defended by the giant Galafre supported by the Turks, but carried by Charlemagne with the help of Fierabras. The Estremaduran peasants have given the name to the ruins of the old Roman bridge over the Tagus at Alconétar, north of Caceres."
