  - sentences:
      - es: "Atentísimamente estuvo don Quijote escuchando las razones del canónigo; y, cuando vio que ya había puesto fin a ellas, después de haberle estado un buen espacio mirando, le dijo:"
        literal: "Most-attentively was Don Quijote listening-to the words of-the canon; and, when he-saw that now he-had put end to them, after of having-him been a good space looking-at, to-him he-said:"
        ormsby: "Don Quixote listened with the greatest attention to the canon’s words, and when he found he had finished, after regarding him for some time, he replied to him:"
        vocab:
          - {w: "razones", d: "words, arguments (not 'reasons' only)"}
          - {w: "canónigo", d: "canon: a priest attached to a cathedral chapter, a learned man; he met the party on the road two chapters ago"}
          - {w: "poner fin a", d: "to put an end to, finish"}
          - {w: "un buen espacio", d: "a good while (espacio = space of time)"}
        diagram:
          - s: "Atentísimamente estuvo don Quijote escuchando las razones del canónigo"
            r: "main verb 1: Don Quijote listened most attentively to the canon's words"
          - s: "le dijo:"
            r: "main verb 2 (after 'y'): he said to him"
