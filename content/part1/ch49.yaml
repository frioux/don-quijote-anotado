          - {w: "se fue", f: "irse (to go off), preterite, he, with 'se'. Irregular, the same forms as ser (to be): fui, fuiste, fue, fuimos, fuisteis, fueron; the sense decides which verb it is."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, he (Rocinante). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "dándole", f: "gerund of dar (to give) + le (to him), accent added to keep the stress: 'giving him'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Aún espero en Dios y en su bendita Madre, flor y espejo de los caballos, que presto nos hemos de ver los dos cual deseamos; tú, con tu señor a cuestas; y yo, encima de ti, ejercitando el oficio para que Dios me echó al mundo."
        literal: "— Still I-hope in God and in his blessed Mother, flower and mirror of the horses, that soon ourselves we-have to see the two as we-desire; you, with your master on-your-back; and I, on-top of you, exercising the office for which God me threw into-the world."
        ormsby: "“I still trust in God and in his blessed mother, O flower and mirror of steeds, that we shall soon see ourselves, both of us, as we wish to be, thou with thy master on thy back, and I mounted upon thee, following the calling for which God sent me into the world.”"
        vocab:
          - {w: "esperar en", d: "to trust in, put one's hope in"}
          - {w: "flor y espejo de", d: "flower and mirror of: the flower (the best) and the model of; a chivalric compliment, here paid to a horse"}
          - {w: "presto", d: "soon, quickly (literary)"}
          - {w: "haber de", d: "to be going to, shall (future or obligation)"}
          - {w: "cual", d: "as, like (literary for 'como')"}
          - {w: "a cuestas", d: "on one's back"}
          - {w: "oficio", d: "calling, office, trade"}
          - {w: "echar al mundo", d: "to put into the world, bring into being"}
        diagram:
          - s: "Aún espero"
            r: "main verb: I still hope"
            under:
              - {s: "en Dios y en su bendita Madre", r: "in whom: in God and his blessed Mother"}
              - {s: "flor y espejo de los caballos", r: "address to Rocinante: flower and mirror of horses"}
              - s: "que presto nos hemos de ver los dos"
                r: "what I hope: that we two shall soon see ourselves"
                under:
                  - {s: "cual deseamos", r: "how: as we wish"}
                  - {s: "tú, con tu señor a cuestas", r: "the first of us: you, with your master on your back"}
                  - s: "y yo, encima de ti"
                    r: "the second: and I, on top of you"
                    under:
                      - s: "ejercitando el oficio"
                        r: "doing what: practising the calling"
                        under:
                          - {s: "para que Dios me echó al mundo", r: "describes 'oficio': for which God put me into the world"}
        forms:
          - {w: "espero", f: "esper- + -o → esperar (to hope), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "bendita", f: "bendit- + -a → bendito (blessed), the old participle of bendecir (to bless), feminine to match 'Madre'."}
          - {w: "nos hemos de ver", f: "hemos → haber (to have), present, we, + de + ver (to see) with 'nos' (ourselves) placed before the group: 'we shall see ourselves'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "deseamos", f: "dese- + -amos → desear (to wish), present, we. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "tú, tu, ti", f: "tú = 'you', subject; tu = 'your', no accent; ti = 'you' after a preposition ('encima de ti'). He speaks to the horse as to a familiar."}
          - {w: "ejercitando", f: "gerund of ejercitar (to exercise, practise): 'practising'."}
          - {w: "para que", f: "here not 'so that' but 'para (for) + que (which)': 'the calling for which'; modern Spanish says 'para el que'."}
          - {w: "echó", f: "ech- + -ó → echar (to throw, put), preterite, he (God). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "al", f: "a + el, 'into the'."}
        note: "'Flower and mirror' is the language romances use for the best of knights and ladies; turning it on the bony nag Rocinante is a small joke on Don Quijote's grandiloquence."
  - sentences:
      - es: "Y, diciendo esto, don Quijote se apartó con Sancho en remota parte, de donde vino más aliviado y con más deseos de poner en obra lo que su escudero ordenase."
        literal: "And, saying this, Don Quijote himself withdrew with Sancho to remote part, from where he-came more relieved and with more desires of putting into work that which his squire might-order."
        ormsby: "And so saying, accompanied by Sancho, he withdrew to a retired spot, from which he came back much relieved and more eager than ever to put his squire’s scheme into execution."
        vocab:
          - {w: "apartarse", d: "to withdraw, step aside"}
          - {w: "en remota parte", d: "to a remote spot, out of sight"}
          - {w: "aliviado", d: "relieved, in both senses: comforted, and having relieved himself"}
          - {w: "poner en obra", d: "to put into action, carry out"}
          - {w: "ordenar", d: "to arrange, order, plan"}
        diagram:
          - s: "don Quijote se apartó"
            r: "main verb 1: Don Quijote withdrew"
            under:
              - {s: "diciendo esto", r: "when: saying this"}
              - {s: "con Sancho", r: "with whom: with Sancho"}
              - {s: "en remota parte", r: "where: to a remote spot"}
          - s: "de donde vino"
            r: "main verb 2: from where he came back"
            under:
              - {s: "más aliviado", r: "how: more relieved"}
              - s: "y con más deseos de poner en obra lo"
                r: "how, 2: and more eager to carry out what"
                under:
                  - {s: "que su escudero ordenase", r: "describes 'lo': what his squire might arrange"}
        forms:
          - {w: "diciendo", f: "gerund of decir (to say): 'saying'; the stem e turns to i."}
          - {w: "se apartó", f: "apart- + -ó → apartarse (to withdraw), preterite, he, with 'se' (himself). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "vino", f: "vin- + -o → venir (to come), preterite, he. Irregular: vine, viniste, vino, vinimos, vinisteis, vinieron."}
          - {w: "aliviado", f: "aliv- + -iado → aliviar (to relieve), participle used as an adjective, masculine to match Don Quijote."}
          - {w: "ordenase", f: "orden- + -ase → ordenar (to arrange), imperfect subjunctive (-se form), he: 'whatever he might arrange', a plan not yet made. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
        note: "Cervantes lets the reader guess why Don Quijote withdraws: 'aliviado' (relieved) is the discreet word for it."
  - sentences:
      - es: "Mirábalo el canónigo, y admirábase de ver la estrañeza de su grande locura, y de que, en cuanto hablaba y respondía, mostraba tener bonísimo entendimiento: solamente venía a perder los estribos, como otras veces se ha dicho, en tratándole de caballería."
        literal: "Was-looking-at-him the canon, and was-marvelling-himself of seeing the strangeness of his great madness, and of that, in all-that he-spoke and answered, he-showed to-have very-good understanding: only he-came to lose the stirrups, as other times it has been-said, on dealing-with-him of chivalry."
        ormsby: "The canon gazed at him, wondering at the extraordinary nature of his madness, and that in all his remarks and replies he should show such excellent sense, and only lose his stirrups, as has been already said, when the subject of chivalry was broached."
        vocab:
          - {w: "admirarse de", d: "to marvel at, be amazed at (false friend: not 'to admire')"}
          - {w: "estrañeza", d: "= extrañeza, strangeness, oddity (old spelling)"}
          - {w: "en cuanto", d: "here 'in everything that', whenever"}
          - {w: "bonísimo", d: "very good, excellent (from 'bueno', old superlative; modern also 'buenísimo')"}
          - {w: "entendimiento", d: "understanding, intelligence"}
          - {w: "venir a", d: "to end up, come to (doing something)"}
          - {w: "perder los estribos", d: "to lose one's stirrups: to lose one's head, fly off the handle (still used today)"}
          - {w: "tratarle de", d: "to talk to him about, raise the subject of"}
        diagram:
          - s: "Mirábalo el canónigo"
            r: "main verb 1: the canon was watching him"
          - s: "admirábase"
            r: "main verb 2 (after 'y'): he marvelled"
            under:
              - {s: "de ver la estrañeza de su grande locura", r: "at what, 1: at seeing how strange his great madness was"}
              - s: "y de que"
                r: "at what, 2: and at the fact that"
                under:
                  - {s: "en cuanto hablaba y respondía", r: "when: in everything he said and answered"}
                  - {s: "mostraba tener bonísimo entendimiento", r: "he showed excellent understanding"}
          - s: "solamente venía a perder los estribos"
            r: "main verb 3: he only came to lose his stirrups"
            under:
              - {s: "como otras veces se ha dicho", r: "aside: as has been said other times"}
              - {s: "en tratándole de caballería", r: "when: as soon as chivalry was mentioned to him"}
        forms:
          - {w: "Mirábalo", f: "mir- + -aba + lo → mirar (to look at), imperfect, he, with 'lo' (him) stuck on the end; modern 'lo miraba'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. Cervantes hangs the pronoun on a verb that opens a clause."}
          - {w: "admirábase", f: "admir- + -aba + se → admirarse (to marvel), imperfect, he, with 'se' on the end; modern 'se admiraba'. Same -aba imperfect."}
          - {w: "grande", f: "full form before a noun where modern Spanish clips it to 'gran locura'."}
          - {w: "hablaba", f: "habl- + -aba → hablar (to speak), imperfect, he. Same -aba imperfect."}
          - {w: "respondía", f: "respond- + -ía → responder (to answer), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "mostraba", f: "mostr- + -aba → mostrar (to show), imperfect, he. Same -aba imperfect."}
          - {w: "bonísimo", f: "bon- + -ísimo → bueno (good), the superlative built on the Latin stem 'bon-': 'extremely good'."}
          - {w: "venía", f: "ven- + -ía → venir (to come), imperfect, he; 'venía a perder' = he would end up losing. Same -ía imperfect."}
          - {w: "se ha dicho", f: "ha → haber (to have), present, it, + dicho, the participle of decir (to say), with 'se' making it passive: 'it has been said'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "en tratándole", f: "en + gerund of tratar (to deal with) + le (him): 'as soon as one talked to him'. 'en' before a gerund means 'as soon as, on (doing)'."}
      - es: "Y así, movido de compasión, después de haberse sentado todos en la verde yerba, para esperar el repuesto del canónigo, le dijo:"
        literal: "And so, moved by compassion, after of having-themselves sat-down all on the green grass, to wait-for the provisions of-the canon, to-him he-said:"
        ormsby: "And so, moved by compassion, he said to him, as they all sat on the green grass awaiting the arrival of the provisions:"
        vocab:
          - {w: "movido de", d: "moved by"}
          - {w: "yerba", d: "= hierba, grass (old spelling, still allowed)"}
          - {w: "repuesto", d: "store of provisions, the food the canon's servants had gone to fetch"}
        diagram:
          - s: "le dijo:"
            r: "main verb: he said to him"
            under:
              - {s: "movido de compasión", r: "why: moved by pity"}
              - s: "después de haberse sentado todos en la verde yerba"
                r: "when: after they had all sat down on the green grass"
                under:
                  - {s: "para esperar el repuesto del canónigo", r: "why: to wait for the canon's provisions"}
        forms:
          - {w: "movido", f: "participle of mover (to move), masculine to match the canon: 'moved'."}
          - {w: "haberse sentado", f: "haber (to have) + se (themselves) + sentado, participle of sentar (to seat): 'having sat down', the perfect infinitive after 'después de'."}
          - {w: "verde yerba", f: "the adjective before the noun, a poetic order: 'the green grass'."}
          - {w: "del", f: "de + el, 'of the'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— ¿Es posible, señor hidalgo, que haya podido tanto con vuestra merced la amarga y ociosa letura de los libros de caballerías, que le hayan vuelto el juicio de modo que venga a creer que va encantado, con otras cosas deste jaez, tan lejos de ser verdaderas como lo está la mesma mentira de la verdad?"
        literal: "— Is-it possible, sir gentleman, that has been-able so-much with your grace the bitter and idle reading of the books of chivalries, that to-you they-have turned the judgment in manner that you-come to believe that you-go enchanted, with other things of-this sort, as far from being true as it is the same lie from the truth?"
        ormsby: "“Is it possible, gentle sir, that the nauseous and idle reading of books of chivalry can have had such an effect on your worship as to upset your reason so that you fancy yourself enchanted, and the like, all as far from the truth as falsehood itself is?"
        vocab:
          - {w: "hidalgo", d: "gentleman, a member of the lowest rank of the nobility"}
          - {w: "poder tanto con", d: "to have so much power over, affect so strongly"}
          - {w: "amargo", d: "bitter, here 'harmful, distasteful'"}
          - {w: "ocioso", d: "idle, useless, a waste of time"}
          - {w: "letura", d: "= lectura, reading (old spelling)"}
          - {w: "volver el juicio", d: "to turn someone's wits, drive mad"}
          - {w: "de modo que", d: "so that, in such a way that"}
          - {w: "venir a creer", d: "to come to believe, end up believing"}
          - {w: "deste", d: "= de este, of this"}
          - {w: "jaez", d: "sort, kind (literally a horse's trappings; 'de este jaez' = of this kind, usually scornful)"}
          - {w: "mesmo", d: "= mismo, same, itself (old form)"}
        diagram:
          - s: "¿Es posible"
            r: "main verb: is it possible"
            under:
              - {s: "señor hidalgo", r: "address: sir gentleman"}
              - s: "que haya podido tanto con vuestra merced la amarga y ociosa letura de los libros de caballerías"
                r: "what is possible: that the bitter, idle reading of chivalry books has had such power over you"
                under:
                  - s: "que le hayan vuelto el juicio"
                    r: "result: that they have turned your wits"
                    under:
                      - s: "de modo que venga a creer"
                        r: "result: so that you come to believe"
                        under:
                          - {s: "que va encantado", r: "what you believe: that you are enchanted"}
                          - s: "con otras cosas deste jaez"
                            r: "along with: other things of this sort"
                            under:
                              - {s: "tan lejos de ser verdaderas como lo está la mesma mentira de la verdad", r: "describes 'cosas': as far from true as falsehood itself is from truth"}
        forms:
          - {w: "Es", f: "es → ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "haya podido", f: "hay- + -a → haber (to have), present subjunctive, it, + podido, the participle of poder (to be able): 'can have had (so much power)'. Subjunctive after '¿es posible que?'. haber in the present subjunctive: haya, hayas, haya, hayamos, hayáis, hayan."}
          - {w: "amarga, ociosa", f: "amarg- + -a → amargo (bitter), ocios- + -a → ocioso (idle), feminine to match 'letura'."}
          - {w: "hayan vuelto", f: "hay- + -an → haber (to have), present subjunctive, they (the books), + vuelto, irregular participle of volver (to turn): 'have turned'. haber in the present subjunctive: haya, hayas, haya, hayamos, hayáis, hayan."}
          - {w: "le", f: "'to you' (vuestra merced, treated as he): 'have turned your wits'."}
          - {w: "venga", f: "veng- + -a → venir (to come), present subjunctive, you (vuestra merced): 'that you come (to believe)'. venga, vengas, venga, vengamos, vengáis, vengan."}
          - {w: "va", f: "v- + -a → ir (to go), present, you (vuestra merced): 'you go about, are'. Irregular: voy, vas, va, vamos, vais, van. 'ir' plus a participle means 'to be (in a state)'."}
          - {w: "verdaderas", f: "verdader- + -as → verdadero (true), feminine plural to match 'cosas'."}
          - {w: "lo está", f: "est- + -á → estar (to be), present, it, with 'lo' standing for 'lejos' (far): 'as falsehood is (far) from truth'. estar in the present: estoy, estás, está, estamos, estáis, están."}
          - {w: "mesma", f: "= misma (same, itself), feminine to match 'mentira'."}
        note: "The canon, who argued against chivalry books in the two previous chapters, now speaks to Don Quijote directly. 'Vuestra merced' (your grace) is addressed in the third person, so 'you' in the gloss stands for Spanish 'he' forms."
      - es: "Y ¿cómo es posible que haya entendimiento humano que se dé a entender que ha habido en el mundo aquella infinidad de Amadises, y aquella turbamulta de tanto famoso caballero, tanto emperador de Trapisonda, tanto Felixmarte de Hircania, tanto palafrén, tanta doncella andante, tantas sierpes, tantos endriagos, tantos gigantes, tantas inauditas aventuras, tanto género de encantamentos, tantas batallas, tantos desaforados encuentros, tanta bizarría de trajes, tantas princesas enamoradas, tantos escuderos condes, tantos enanos graciosos, tanto billete, tanto requiebro, tantas mujeres valientes;"
        literal: "And how is-it possible that there-be understanding human that itself may-give to understand that there-has been in the world that infinity of Amadises, and that rabble of so-much famous knight, so-much emperor of Trapisonda, so-much Felixmarte of Hircania, so-much palfrey, so-much damsel errant, so-many serpents, so-many dragon-monsters, so-many giants, so-many unheard-of adventures, so-much kind of enchantments, so-many battles, so-many outrageous encounters, so-much splendour of costumes, so-many princesses in-love, so-many squires counts, so-many dwarfs amusing, so-much love-note, so-much compliment, so-many women valiant;"
        ormsby: "How can there be any human understanding that can persuade itself there ever was all that infinity of Amadíses in the world, or all that multitude of famous knights, all those emperors of Trebizond, all those Felixmartes of Hircania, all those palfreys, and damsels-errant, and serpents, and monsters, and giants, and marvellous adventures, and enchantments of every kind, and battles, and prodigious encounters, splendid costumes, lovesick princesses, squires made counts, droll dwarfs, love letters, billings and cooings, swashbuckler women,"
        ormsby_note: "E.g. Bradamante, Marfisa, and Antea, in the Orlando and Morgante Maggiore."
        vocab:
          - {w: "darse a entender", d: "to persuade oneself, get it into one's head"}
          - {w: "Amadises", d: "plural of Amadís: Amadís de Gaula and the many sequels about his sons and descendants (Amadís de Grecia and others), the most famous Spanish romances of chivalry"}
          - {w: "turbamulta", d: "rabble, disorderly crowd (from 'turba', mob + 'multa', many)"}
          - {w: "emperador de Trapisonda", d: "emperor of Trebizond, a Greek empire on the Black Sea that romances filled with emperors and princesses; in one of the Reinaldos de Montalbán romances the hero is said to become its emperor"}
          - {w: "Felixmarte de Hircania", d: "hero of a Spanish chivalry romance (1556) by Melchor de Ortega; Hircania was an ancient region by the Caspian Sea"}
          - {w: "palafrén", d: "palfrey, a gentle riding horse for ladies and ceremony"}
          - {w: "doncella andante", d: "damsel-errant, a maiden wandering the world alone, the female counterpart of the knight-errant"}
          - {w: "sierpe", d: "serpent, dragon (old word)"}
          - {w: "endriago", d: "a monstrous beast, half dragon, half man, like the one Amadís kills on the Devil's Island"}
          - {w: "inaudito", d: "unheard-of, extraordinary"}
          - {w: "encantamentos", d: "= encantamientos, enchantments (old form)"}
          - {w: "desaforado", d: "outrageous, immense, beyond all measure"}
          - {w: "encuentro", d: "clash, encounter in combat (not a friendly meeting)"}
          - {w: "bizarría", d: "splendour, gallantry, showiness (false friend: not 'bizarre')"}
          - {w: "escuderos condes", d: "squires made counts: in the romances a faithful squire may be rewarded with a title, as Sancho hopes to be rewarded with an island"}
          - {w: "gracioso", d: "funny, amusing, droll (not 'gracious')"}
          - {w: "billete", d: "love note, short letter (not a ticket)"}
          - {w: "requiebro", d: "amorous compliment, sweet talk"}
          - {w: "mujeres valientes", d: "warrior women, like Bradamante and Marfisa in Ariosto's Orlando Furioso"}
        diagram:
          - s: "Y ¿cómo es posible"
            r: "main verb: and how is it possible"
            under:
              - s: "que haya entendimiento humano"
                r: "what is (im)possible: that there is a human mind"
                under:
                  - s: "que se dé a entender"
                    r: "describes 'entendimiento': that can persuade itself"
                    under:
                      - s: "que ha habido en el mundo aquella infinidad de Amadises"
                        r: "what it believes, 1: that there has been in the world that endless line of Amadises"
                      - s: "y aquella turbamulta de tanto famoso caballero"
                        r: "what it believes, 2: and that rabble of so many famous knights"
                        under:
                          - {s: "tanto emperador de Trapisonda, tanto Felixmarte de Hircania", r: "list, 1: so many emperors of Trebizond and Felixmartes"}
                          - {s: "tanto palafrén, tanta doncella andante, tantas sierpes, tantos endriagos, tantos gigantes", r: "list, 2: horses, damsels, monsters, giants"}
                          - {s: "tantas inauditas aventuras, tanto género de encantamentos, tantas batallas, tantos desaforados encuentros", r: "list, 3: adventures, enchantments, battles, clashes"}
                          - {s: "tanta bizarría de trajes, tantas princesas enamoradas, tantos escuderos condes, tantos enanos graciosos", r: "list, 4: costumes, princesses, squires, dwarfs"}
                          - {s: "tanto billete, tanto requiebro, tantas mujeres valientes", r: "list, 5: love notes, compliments, warrior women"}
        forms:
          - {w: "haya", f: "hay- + -a → haber (to have; 'there be'), present subjunctive, it: 'that there should be'. Subjunctive after '¿cómo es posible que?'. haber in the present subjunctive: haya, hayas, haya, hayamos, hayáis, hayan."}
          - {w: "se dé", f: "d- + -é → dar (to give), present subjunctive, it, with 'se': 'darse a entender' = to persuade itself. dar in the present subjunctive: dé, des, dé, demos, deis, den (the accent tells 'dé' from 'de', of)."}
          - {w: "ha habido", f: "ha → haber (to have), present, it, + habido, participle of haber: 'there has been'. haber in the present: he, has, ha, hemos, habéis, han; impersonal 'there is/has been' always uses the 'it' form."}
          - {w: "aquella", f: "aquell- + -a → aquel (that), feminine to match 'infinidad' and 'turbamulta'."}
