part: 1
chapter: 49
title_es: "Capítulo XLIX. Donde se trata del discreto coloquio que Sancho Panza tuvo con su señor don Quijote"
title_en: "Which treats of the shrewd conversation which Sancho Panza held with his master Don Quixote"
paragraphs:
  - sentences:
      - es: "— ¡Ah —dijo Sancho—; cogido le tengo!"
        literal: "— Ah! —said Sancho—; caught him I-have!"
        ormsby: "“Aha, I have caught you,” said Sancho;"
        vocab:
          - {w: "coger", d: "to catch, seize; here 'to catch out' in an argument"}
          - {w: "cogido le tengo", d: "I've got you, I've caught you out: 'tener' + participle stresses the result"}
        diagram:
          - s: "dijo Sancho"
            r: "speech verb: Sancho said"
          - s: "cogido le tengo!"
            r: "what he said: I've caught him (you)"
            under:
              - {s: "¡Ah", r: "exclamation: aha!"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "cogido le tengo", f: "teng- + -o → tener (to have, hold), present, I: tengo, tienes, tiene, tenemos, tenéis, tienen; + cogido, the participle of coger (to catch), put first for emphasis: 'caught I have him'. 'tener' + participle stresses the state reached, like 'I've got him caught'. 'le' is Sancho's master, spoken of in the third person though he means 'you'."}
        note: "At the end of the previous chapter Sancho asked his caged master whether, since being 'enchanted', he had felt the need to relieve himself, and Don Quijote said yes. Sancho now springs his trap: enchanted people, everyone knows, do no such things."
      - es: "Esto es lo que yo deseaba saber, como al alma y como a la vida."
        literal: "This is that which I was-wishing to-know, as to-the soul and as to-the life."
        ormsby: "“this is what in my heart and soul I was longing to know."
        vocab:
          - {w: "como al alma y como a la vida", d: "as much as my soul and my life, i.e. with all my heart; an intensifying formula ('querer como a la vida' = to love like one's own life)"}
        diagram:
          - s: "Esto es"
            r: "main verb: this is"
            under:
              - s: "lo que yo deseaba saber"
                r: "what it is: what I wanted to know"
                under:
                  - {s: "como al alma y como a la vida", r: "how much: as dearly as my soul and my life"}
        forms:
          - {w: "es", f: "es → ser (to be), present, it. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "deseaba", f: "dese- + -aba → desear (to wish), imperfect, I: 'I was longing'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "saber", f: "infinitive of saber (to know), object of 'deseaba'."}
          - {w: "al", f: "a + el, the contraction modern Spanish still makes."}
      - es: "Venga acá, señor: ¿podría negar lo que comúnmente suele decirse por ahí cuando una persona está de mala voluntad: \"No sé qué tiene fulano, que ni come, ni bebe, ni duerme, ni responde a propósito a lo que le preguntan, que no parece sino que está encantado\"?"
        literal: "Come here, sir: could-you deny that which commonly is-wont to-be-said around there when a person is of bad will: \"Not I-know what has so-and-so, that neither he-eats, nor he-drinks, nor he-sleeps, nor he-answers to purpose to that which to-him they-ask, that not it-seems but that he-is enchanted\"?"
        ormsby: "Come now, señor, can you deny what is commonly said around us, when a person is out of humour, ‘I don’t know what ails so-and-so, that he neither eats, nor drinks, nor sleeps, nor gives a proper answer to any question; one would think he was enchanted’?"
        vocab:
          - {w: "venga acá", d: "come now, look here (lit. 'come here'), used to start an argument"}
          - {w: "por ahí", d: "around, among people, out there"}
          - {w: "estar de mala voluntad", d: "to be out of sorts, unwell or out of humour"}
          - {w: "fulano", d: "so-and-so, what's-his-name"}
          - {w: "a propósito", d: "to the point, sensibly"}
          - {w: "no parece sino que", d: "it seems nothing but that, one would think that"}
        diagram:
          - s: "Venga acá, señor:"
            r: "opener: come now, sir"
          - s: "¿podría negar"
            r: "main verb: could you deny"
            under:
              - s: "lo que comúnmente suele decirse por ahí"
                r: "object: what people commonly say"
                under:
                  - {s: "cuando una persona está de mala voluntad:", r: "when: when someone is out of sorts"}
                  - s: "\"No sé qué tiene fulano"
                    r: "the saying: I don't know what's wrong with so-and-so"
                    under:
                      - {s: "que ni come, ni bebe, ni duerme, ni responde a propósito a lo que le preguntan", r: "why one wonders: since he neither eats, drinks, sleeps, nor answers sensibly"}
                      - {s: "que no parece sino que está encantado\"?", r: "result: one would think he is enchanted"}
        forms:
          - {w: "Venga", f: "veng- + -a → venir (to come), present subjunctive, you (vuestra merced): a polite command. vuestra merced takes 'he/she' forms. venir in the present subjunctive: venga, vengas, venga, vengamos, vengáis, vengan."}
          - {w: "podría", f: "podr- + -ía → poder (to be able), conditional, you (vuestra merced): 'could you'. podría, podrías, podría, podríamos, podríais, podrían."}
          - {w: "suele decirse", f: "suel- + -e → soler (to be in the habit of), present, it; the stem o becomes ue when stressed: suelo, sueles, suele, solemos, soléis, suelen. + decirse, decir (to say) with 'se' making it passive: 'is usually said'."}
          - {w: "está", f: "est- + -á → estar (to be), present, she (the person) / he (fulano). estoy, estás, está, estamos, estáis, están."}
          - {w: "sé", f: "saber (to know), present, I. Irregular: sé, sabes, sabe, sabemos, sabéis, saben. The accent tells it from 'se'."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, he: 'what's wrong with him' (lit. 'what he has'). tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "come, bebe, responde", f: "com- + -e → comer (to eat), beb- + -e → beber (to drink), respond- + -e → responder (to answer), present, he. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "duerme", f: "duerm- + -e → dormir (to sleep), present, he. The stem o becomes ue when stressed: duermo, duermes, duerme, dormimos, dormís, duermen."}
          - {w: "preguntan", f: "pregunt- + -an → preguntar (to ask), present, they (people in general): 'what they ask him'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "parece", f: "parec- + -e → parecer (to seem), present, it. parezco, pareces, parece, parecemos, parecéis, parecen."}
          - {w: "encantado", f: "participle of encantar (to enchant), masculine to match 'fulano'."}
      - es: "De donde se viene a sacar que los que no comen, ni beben, ni duermen, ni hacen las obras naturales que yo digo, estos tales están encantados;"
        literal: "From where itself comes to draw-out that those who not eat, nor drink, nor sleep, nor do the works natural that I say, these such are enchanted;"
        ormsby: "From which it is to be gathered that those who do not eat, or drink, or sleep, or do any of the natural acts I am speaking of—that such persons are enchanted;"
        vocab:
          - {w: "de donde", d: "from which, whence (introducing a conclusion)"}
          - {w: "venir a + infinitive", d: "to end up, come to (do something); 'se viene a sacar' = it comes to be concluded"}
          - {w: "sacar", d: "here 'to conclude, infer' (lit. 'to draw out')"}
          - {w: "obras naturales", d: "bodily functions; Sancho's euphemism for relieving oneself"}
          - {w: "estos tales", d: "these same people, such people (resuming a long subject)"}
        diagram:
          - s: "De donde se viene a sacar"
            r: "main verb: from which one comes to conclude"
            under:
              - s: "que los que no comen, ni beben, ni duermen, ni hacen las obras naturales"
                r: "what is concluded: that those who don't eat, drink, sleep, or do the natural functions"
                under:
                  - {s: "que yo digo", r: "describes 'obras naturales': that I mean"}
                  - {s: "estos tales están encantados;", r: "the conclusion itself: such people are enchanted"}
        forms:
          - {w: "se viene a sacar", f: "vien- + -e → venir (to come), present, it: vengo, vienes, viene, venimos, venís, vienen; + 'a' + sacar (to draw out), with 'se' making it impersonal: 'one comes to conclude'."}
          - {w: "comen, beben", f: "com- + -en → comer (to eat), beb- + -en → beber (to drink), present, they. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "duermen", f: "duerm- + -en → dormir (to sleep), present, they. The stem o becomes ue when stressed: duermo, duermes, duerme, dormimos, dormís, duermen."}
          - {w: "hacen", f: "hac- + -en → hacer (to do), present, they. hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "estos tales", f: "est- + -os → este (this), masculine plural, and tal (such) + -es, plural, both to match the people: 'these such'."}
          - {w: "están", f: "est- + -án → estar (to be), present, they. estoy, estás, está, estamos, estáis, están."}
          - {w: "encantados", f: "participle of encantar (to enchant), masculine plural to match 'estos tales'."}
      - es: "pero no aquellos que tienen la gana que vuestra merced tiene y que bebe cuando se lo dan, y come cuando lo tiene, y responde a todo aquello que le preguntan."
        literal: "but not those who have the desire that your grace has and who drinks when to-him it they-give, and eats when it he-has, and answers to all that which him they-ask."
        ormsby: "but not those that have the desire your worship has, and drink when drink is given them, and eat when there is anything to eat, and answer every question that is asked them.”"
        vocab:
          - {w: "gana", d: "desire, urge; here the bodily urge Sancho asked about"}
          - {w: "vuestra merced", d: "your grace, your worship: polite 'you', taking 'he/she' verb forms (the source of modern 'usted')"}
        diagram:
          - s: "pero no aquellos"
            r: "contrast, root carried from 'están encantados': but not those"
            under:
              - s: "que tienen la gana"
                r: "describes 'aquellos': who have the urge"
                under:
                  - {s: "que vuestra merced tiene", r: "describes 'gana': that your worship has"}
              - {s: "y que bebe cuando se lo dan", r: "describes 'aquellos', 2: and who drinks when they give it to him"}
              - {s: "y come cuando lo tiene", r: "describes 'aquellos', 3: and eats when he has it"}
              - {s: "y responde a todo aquello que le preguntan", r: "describes 'aquellos', 4: and answers everything he is asked"}
        forms:
          - {w: "aquellos", f: "aquell- + -os → aquel (that), masculine plural: 'those (people)'."}
          - {w: "tienen", f: "tien- + -en → tener (to have), present, they; 'tiene' is the same verb with you (vuestra merced). tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "bebe, come, responde", f: "beb- + -e → beber (to drink), com- + -e → comer (to eat), respond- + -e → responder (to answer), present, he. Sancho slides from the plural 'aquellos' to the singular, thinking of his master. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "se lo dan", f: "d- + -an → dar (to give), present, they (people in general): doy, das, da, damos, dais, dan. 'se lo' = 'le lo' (it to him): le becomes se before lo."}
          - {w: "preguntan", f: "pregunt- + -an → preguntar (to ask), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "aquello", f: "neuter of aquel (that): 'all that which', not pointing at any noun."}
  - sentences:
      - es: "— Verdad dices, Sancho —respondió don Quijote—, pero ya te he dicho que hay muchas maneras de encantamentos, y podría ser que con el tiempo se hubiesen mudado de unos en otros, y que agora se use que los encantados hagan todo lo que yo hago, aunque antes no lo hacían."
        literal: "— Truth you-say, Sancho —answered Don Quijote—, but already to-you I-have said that there-are many manners of enchantments, and it-could be that with the time they might-have changed from some into others, and that now it-be-the-custom that the enchanted may-do all that which I do, although before not it they-did."
        ormsby: "“What thou sayest is true, Sancho,” replied Don Quixote; “but I have already told thee there are many sorts of enchantments, and it may be that in the course of time they have been changed one for another, and that now it may be the way with enchanted people to do all that I do, though they did not do so before;"
        vocab:
          - {w: "verdad dices", d: "you speak the truth, what you say is true"}
          - {w: "manera", d: "kind, sort (as well as 'manner')"}
          - {w: "encantamento", d: "= encantamiento, enchantment (old form)"}
          - {w: "mudarse", d: "to change, alter"}
          - {w: "de unos en otros", d: "from one kind into another"}
          - {w: "agora", d: "= ahora, now (old form)"}
          - {w: "usarse", d: "to be the custom, be in fashion: 'se use que' = it is now the custom that"}
        diagram:
          - s: "Verdad dices, Sancho"
            r: "main verb 1: you speak the truth, Sancho"
          - {s: "respondió don Quijote", r: "speech verb: Don Quijote answered"}
          - s: "pero ya te he dicho"
            r: "main verb 2: but I have already told you"
            under:
              - {s: "que hay muchas maneras de encantamentos", r: "what I told you: that there are many kinds of enchantment"}
          - s: "y podría ser"
            r: "main verb 3: and it could be"
            under:
              - {s: "que con el tiempo se hubiesen mudado de unos en otros", r: "what could be, 1: that with time they have changed from one kind into another"}
              - s: "y que agora se use"
                r: "what could be, 2: and that now it is the custom"
                under:
                  - {s: "que los encantados hagan todo lo que yo hago", r: "what is the custom: that the enchanted do everything I do"}
                  - {s: "aunque antes no lo hacían", r: "concession: though before they did not"}
        forms:
          - {w: "dices", f: "dic- + -es → decir (to say), present, you (tú). Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "te he dicho", f: "he → haber (to have), present, I: he, has, ha, hemos, habéis, han; + dicho, the irregular participle of decir (to say): the present perfect, 'I have told you'. 'te' = to you (tú): Don Quijote uses tú to his squire."}
          - {w: "hay", f: "hay, 'there is / there are', the impersonal present of haber (to have, there to be)."}
          - {w: "podría", f: "podr- + -ía → poder (to be able), conditional, it: 'it could be'. podría, podrías, podría, podríamos, podríais, podrían."}
          - {w: "se hubiesen mudado", f: "hubiesen → haber (to have), imperfect subjunctive (-se form), they: hubiese, hubieses, hubiese, hubiésemos, hubieseis, hubiesen; + mudado, the participle of mudarse (to change): the pluperfect subjunctive, 'they had changed', subjunctive after 'podría ser que'."}
          - {w: "se use", f: "us- + -e → usarse (to be the custom), present subjunctive, it, with 'se' (impersonal). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "hagan", f: "hag- + -an → hacer (to do), present subjunctive, they: haga, hagas, haga, hagamos, hagáis, hagan. Subjunctive after 'se use que' (it is the custom that)."}
          - {w: "hago", f: "hag- + -o → hacer (to do), present, I. hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "hacían", f: "hac- + -ían → hacer (to do), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "encantados", f: "participle of encantar (to enchant) used as a noun: 'enchanted people'."}
        note: "Don Quijote saves his theory as he always does: when the facts don't fit the books, the enchantments themselves must have changed with the times."
      - es: "De manera que contra el uso de los tiempos no hay que argüir ni de qué hacer consecuencias."
        literal: "Of manner that against the usage of the times not there-is [anything] to argue nor from what to-make inferences."
        ormsby: "so it is vain to argue or draw inferences against the usage of the time."
        vocab:
          - {w: "de manera que", d: "so, so that, therefore"}
          - {w: "uso de los tiempos", d: "the custom of the times, current usage"}
          - {w: "no hay que", d: "there is no point in, one must not ('no hay que argüir' = there is no arguing)"}
          - {w: "argüir", d: "to argue, reason"}
          - {w: "hacer consecuencias", d: "to draw conclusions, make inferences ('consecuencia' = logical consequence)"}
        diagram:
          - s: "no hay que argüir"
            r: "main verb 1: there is no arguing"
            under:
              - {s: "De manera que", r: "linking: so, therefore"}
              - {s: "contra el uso de los tiempos", r: "against what: against the custom of the times"}
          - {s: "ni de qué hacer consecuencias", r: "main verb 2 (after 'ni', still with 'no hay'): nor anything to draw conclusions from"}
        forms:
          - {w: "no hay que argüir", f: "hay, the impersonal present of haber (to have, there to be), + que + infinitive: 'there is no need to / no use in'. argüir (to argue) keeps the two dots (ü) so the u is pronounced."}
          - {w: "de qué hacer", f: "hacer (to make), infinitive after 'de qué': 'nothing from which to make'."}
          - {w: "los tiempos", f: "tiempo (time) + -s, plural: 'the times', the age."}
      - es: "Yo sé y tengo para mí que voy encantado, y esto me basta para la seguridad de mi conciencia;"
        literal: "I know and hold for me that I-go enchanted, and this to-me suffices for the security of my conscience;"
        ormsby: "I know and feel that I am enchanted, and that is enough to ease my conscience;"
        vocab:
          - {w: "tener para sí", d: "to be convinced, believe firmly (lit. 'to hold for oneself')"}
          - {w: "ir encantado", d: "to be enchanted ('ir' + participle = to be, travel in that state)"}
          - {w: "bastar", d: "to be enough, suffice"}
          - {w: "seguridad de mi conciencia", d: "peace of my conscience, a clear conscience"}
        diagram:
          - s: "Yo sé y tengo para mí"
            r: "main verb 1: I know and firmly believe"
            under:
              - {s: "que voy encantado", r: "what I know: that I am enchanted"}
          - s: "y esto me basta"
            r: "main verb 2: and this is enough for me"
            under:
              - {s: "para la seguridad de mi conciencia", r: "what for: for the peace of my conscience"}
        forms:
          - {w: "sé", f: "saber (to know), present, I. Irregular: sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "tengo", f: "teng- + -o → tener (to hold), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "mí", f: "mí, 'me' after a preposition ('para mí'); the accent tells it from 'mi' (my)."}
          - {w: "voy", f: "ir (to go), present, I: voy, vas, va, vamos, vais, van. With a participle ('voy encantado') it means 'I am (travelling) enchanted'."}
          - {w: "basta", f: "bast- + -a → bastar (to be enough), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
      - es: "que la formaría muy grande si yo pensase que no estaba encantado y me dejase estar en esta jaula, perezoso y cobarde, defraudando el socorro que podría dar a muchos menesterosos y necesitados que de mi ayuda y amparo deben tener a la hora de ahora precisa y estrema necesidad."
        literal: "for it I-would-form very great if I should-think that not I-was enchanted and myself should-let be in this cage, lazy and cowardly, cheating-of the help that I-could give to many needy and destitute who of my aid and protection must have at the hour of now pressing and extreme need."
        ormsby: "for it would weigh heavily on it if I thought that I was not enchanted, and that in a fainthearted and cowardly way I allowed myself to lie in this cage, defrauding multitudes of the succour I might afford to those in need and distress, who at this very moment may be in sore want of my aid and protection.”"
        vocab:
          - {w: "formarla grande", d: "here 'la' is 'conciencia': to make a great matter of conscience of it, to have a heavy scruple ('formar conciencia' = to feel a scruple)"}
          - {w: "dejarse estar", d: "to let oneself stay, stay put idly"}
          - {w: "perezoso", d: "lazy, idle"}
          - {w: "defraudar", d: "to cheat (people) of, withhold what is owed"}
          - {w: "socorro", d: "help, relief"}
          - {w: "menesteroso", d: "needy, in want (literary)"}
          - {w: "amparo", d: "protection, shelter"}
          - {w: "a la hora de ahora", d: "at this very hour, right now"}
          - {w: "preciso", d: "pressing, urgent (not 'precise')"}
          - {w: "estremo", d: "= extremo, extreme (old spelling)"}
        diagram:
          - s: "que la formaría muy grande"
            r: "main verb (after 'que', for): for I would have a great scruple about it"
            under:
              - s: "si yo pensase"
                r: "condition: if I thought"
                under:
                  - {s: "que no estaba encantado", r: "what I thought, 1: that I wasn't enchanted"}
                  - {s: "y me dejase estar en esta jaula", r: "condition, 2: and let myself stay in this cage"}
              - {s: "perezoso y cobarde", r: "how: lazy and cowardly"}
              - s: "defraudando el socorro"
                r: "how: cheating others of the help"
                under:
                  - s: "que podría dar a muchos menesterosos y necesitados"
                    r: "describes 'socorro': that I could give to many needy people"
                    under:
                      - {s: "que de mi ayuda y amparo deben tener a la hora de ahora precisa y estrema necesidad", r: "describes 'menesterosos': who must be in urgent need of my help right now"}
        forms:
          - {w: "la", f: "'it', feminine because it stands for 'conciencia' at the end of the last sentence: 'I would make it (my conscience) very heavy'."}
          - {w: "formaría", f: "formar- + -ía → formar (to form), conditional, I. The conditional adds -ía endings to the whole infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "pensase, dejase", f: "pens- + -ase → pensar (to think), dej- + -ase → dejar (to let), imperfect subjunctive (-se form), I, after 'si' in an unreal condition. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, I. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "esta", f: "est- + -a → este (this), feminine to match 'jaula'."}
          - {w: "defraudando", f: "defraud- + -ando → defraudar (to cheat of), gerund: 'cheating (them) of'."}
          - {w: "podría", f: "podr- + -ía → poder (to be able), conditional, I. Irregular stem podr-: podría, podrías, podría, podríamos, podríais, podrían."}
