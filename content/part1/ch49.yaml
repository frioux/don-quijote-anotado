      - es: "Pues, ¿quién podrá negar no ser verdadera la historia de Pierres y la linda Magalona, pues aun hasta hoy día se vee en la armería de los reyes la clavija con que volvía al caballo de madera, sobre quien iba el valiente Pierres por los aires, que es un poco mayor que un timón de carreta?"
        literal: "Then, who will-be-able to-deny not to-be true the story of Pierres and the lovely Magalona, since even until this day itself-sees in the armory of the kings the peg with which he-turned the horse of wood, on which went the valiant Pierres through the airs, which is a little bigger than a pole of cart?"
        ormsby: "Then who can deny that the story of Pierres and the fair Magalona is true, when even to this day may be seen in the king’s armoury the pin with which the valiant Pierres guided the wooden horse he rode through the air, and it is a trifle bigger than the pole of a cart?"
        ormsby_note: "The history of Pierres and Magalona is a Provençal romance written in the twelfth century by Bernardo Treviez, and translated into Spanish apparently as early as 1519."
        vocab:
