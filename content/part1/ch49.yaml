      - es: "— Yo le fío de la fuga —respondió Sancho."
        literal: "— I him guarantee from the flight —answered Sancho."
        ormsby: "“I will answer for his not running away,” said Sancho."
        vocab:
          - {w: "fiar a alguien de", d: "to stand surety for someone against, guarantee that he will not do something"}
          - {w: "fuga", d: "flight, escape, running away"}
        diagram:
          - s: "Yo le fío"
            r: "main verb: I guarantee him"
            under:
              - {s: "de la fuga", r: "against what: against running away"}
          - s: "respondió Sancho"
            r: "speech tag: Sancho answered"
        forms:
          - {w: "fío", f: "fí- + -o → fiar (to vouch for, stand surety for), present, I: 'I guarantee'. The accent keeps the i stressed: fío, fías, fía, fiamos, fiáis, fían."}
          - {w: "le", f: "'him' (Don Quijote), object of 'fío'. Castile often uses 'le' for a male person as direct object where Latin American Spanish says 'lo' (this is called leísmo)."}
