      - es: "digan que fueron burla las justas de Suero de Quiñones, del Paso;"
        literal: "let-them-say that were mockery the jousts of Suero de Quiñones, of-the Pass;"
        ormsby: "I shall be told that the jousts of Suero de Quiñones, him of the ‘Paso,’"
        ormsby_note: "The \"Paso Honroso\" was one of the most famous feats of chivalry of the Middle Ages. Suero de Quiñones, a knight of León, with nine others, undertook in 1434 to hold the bridge of Orbigo, near Astorga, against all comers for thirty days. Each was to break three lances with every gentleman who presented himself. There were 727 encounters and 166 lances broken. An account of it was written by a contemporary, Pero Rodriguez de Lena, secretary of John II, which was afterwards re-edited by Juan de Pineda, and printed at Salamanca in 1588 under the title of Libro del Paso Honroso. It is appended to the Crónica de Álvaro de Luna, Madrid, 1784."
        vocab:
          - {w: "burla", d: "joke, mockery, a sham; 'fueron burla' = were a fiction"}
          - {w: "justa", d: "joust, mounted combat with lances"}
          - {w: "Suero de Quiñones", d: "Leonese knight who in 1434 held the bridge of Órbigo against all comers, the 'Paso Honroso'"}
          - {w: "paso", d: "pass of arms: a knight vows to hold a bridge or road against every passing knight"}
        diagram:
          - s: "digan"
            r: "main verb: let them say"
            under:
              - s: "que fueron burla las justas de Suero de Quiñones"
                r: "what they may say: that Suero de Quiñones' jousts were a sham"
                under:
                  - {s: "del Paso", r: "describes 'Suero de Quiñones': him of the Pass"}
        forms:
          - {w: "digan", f: "dig- + -an → decir (to say), present subjunctive, they: 'let them say'. Irregular: diga, digas, diga, digamos, digáis, digan."}
          - {w: "fueron", f: "fueron → ser (to be), preterite, they (the jousts). fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "del", f: "de + el: 'del Paso' = 'of the Pass', a nickname, like 'him of the Pass'."}
        note: "The Paso Honroso was real and famous: the knight who held it wore an iron collar every Thursday as a token of his love-captivity until the feat was done. It is the kind of history that really does look like a romance, which helps Don Quijote's argument."
      - es: "las empresas de mosén Luis de Falces contra don Gonzalo de Guzmán, caballero castellano, con otras muchas hazañas hechas por caballeros cristianos, déstos y de los reinos estranjeros, tan auténticas y verdaderas, que torno a decir que el que las negase carecería de toda razón y buen discurso."
