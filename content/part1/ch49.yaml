  - sentences:
      - es: "Admirado quedó el canónigo de oír la mezcla que don Quijote hacía de verdades y mentiras, y de ver la noticia que tenía de todas aquellas cosas tocantes y concernientes a los hechos de su andante caballería; y así, le respondió:"
        literal: "Amazed remained the canon from hearing the mixture that Don Quijote made of truths and lies, and from seeing the knowledge that he-had of all those things touching and concerning to the deeds of his errant chivalry; and so, to-him he-answered:"
        ormsby: "The canon was amazed to hear the medley of truth and fiction Don Quixote uttered, and to see how well acquainted he was with everything relating or belonging to the achievements of his knight-errantry; so he said in reply:"
        vocab:
          - {w: "admirado", d: "amazed, astonished (not 'admired')"}
          - {w: "quedar", d: "to be left, end up; 'quedó admirado' = was left amazed"}
          - {w: "mezcla", d: "mixture, medley"}
          - {w: "noticia", d: "knowledge, acquaintance (false friend: not 'news' here)"}
          - {w: "tocante a", d: "concerning, touching on"}
          - {w: "concerniente a", d: "concerning, relating to"}
          - {w: "andante caballería", d: "knight-errantry ('andante' = wandering, errant)"}
        diagram:
          - s: "Admirado quedó el canónigo"
            r: "main verb 1: the canon was amazed"
            under:
              - s: "de oír la mezcla"
                r: "why, 1: at hearing the mixture"
                under:
                  - {s: "que don Quijote hacía de verdades y mentiras", r: "describes 'mezcla': that Don Quijote made of truth and lies"}
              - s: "y de ver la noticia"
                r: "why, 2: and at seeing the knowledge"
                under:
                  - {s: "que tenía de todas aquellas cosas tocantes y concernientes a los hechos de su andante caballería", r: "describes 'noticia': that he had of everything to do with knight-errantry"}
          - s: "y así, le respondió:"
            r: "main verb 2: and so he answered him"
        forms:
          - {w: "Admirado", f: "participle of admirar (to amaze), masculine to match 'el canónigo'; put first for emphasis, with the subject after the verb."}
          - {w: "quedó, respondió", f: "qued- + -ó → quedar (to remain), preterite, he; respond- + -ió → responder (to answer), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "hacía, tenía", f: "hac- + -ía → hacer (to make), imperfect, he; ten- + -ía → tener (to have), imperfect, he. The imperfect of -er verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "tocantes, concernientes", f: "present participles of tocar (to touch) and concernir (to concern), used as adjectives, plural to match 'cosas'; -nte makes an adjective 'touching, concerning'."}
          - {w: "aquellas", f: "aquell- + -as → aquel (that), feminine plural to match 'cosas'."}
  - sentences:
      - es: "— No puedo yo negar, señor don Quijote, que no sea verdad algo de lo que vuestra merced ha dicho, especialmente en lo que toca a los caballeros andantes españoles;"
        literal: "— Not can I deny, sir Don Quijote, that not may-be truth something of that which your grace has said, especially in that which touches to the knights errant Spanish;"
        ormsby: "“I cannot deny, Señor Don Quixote, that there is some truth in what you say, especially as regards the Spanish knights-errant;"
        vocab:
          - {w: "vuestra merced", d: "your grace, the polite 'you' (origin of 'usted'), takes a 'he/she' verb"}
          - {w: "en lo que toca a", d: "as regards, concerning"}
        diagram:
          - s: "No puedo yo negar"
            r: "main verb: I cannot deny"
            under:
              - {s: "señor don Quijote", r: "addressed"}
              - s: "que no sea verdad algo de lo"
                r: "what I can't deny: that some of it is true ('no' is redundant after 'negar')"
                under:
                  - {s: "que vuestra merced ha dicho", r: "describes 'lo': what you have said"}
              - {s: "especialmente en lo que toca a los caballeros andantes españoles", r: "how far: especially about the Spanish knights-errant"}
        forms:
          - {w: "puedo", f: "pued- + -o → poder (to be able), present, I. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "no sea", f: "sea → ser (to be), present subjunctive, it: sea, seas, sea, seamos, seáis, sean. Subjunctive after a negated 'negar'; the extra 'no' repeats the negation, as old Spanish often does after verbs of denying."}
          - {w: "ha dicho", f: "ha → haber (to have), present, you (vuestra merced): he, has, ha, hemos, habéis, han; + dicho, the irregular participle of decir (to say): 'you have said'."}
          - {w: "toca", f: "toc- + -a → tocar (to touch, concern), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "españoles", f: "plural of español (Spanish), -es after a consonant, to match 'caballeros'."}
      - es: "y, asimesmo, quiero conceder que hubo Doce Pares de Francia, pero no quiero creer que hicieron todas aquellas cosas que el arzobispo Turpín dellos escribe;"
        literal: "and, likewise, I-want to-grant that there-were Twelve Peers of France, but not I-want to-believe that they-did all those things that the archbishop Turpin of-them writes;"
        ormsby: "and I am willing to grant too that the Twelve Peers of France existed, but I am not disposed to believe that they did all the things that the Archbishop Turpin relates of them."
        vocab:
          - {w: "asimesmo", d: "= asimismo, likewise, also (old form)"}
          - {w: "conceder", d: "to grant, concede"}
          - {w: "Doce Pares de Francia", d: "the Twelve Peers, Charlemagne's champions (Roland, Oliver and the rest) in the French epics"}
          - {w: "arzobispo Turpín", d: "Turpin, archbishop of Reims, one of Charlemagne's paladins in the epics; a Latin chronicle of Charlemagne was falsely ascribed to him"}
          - {w: "dellos", d: "= de ellos, of them (old contraction)"}
        diagram:
          - s: "quiero conceder"
            r: "main verb 1: I am willing to grant"
            under:
              - {s: "asimesmo", r: "how: likewise"}
              - {s: "que hubo Doce Pares de Francia", r: "what I grant: that there were Twelve Peers of France"}
          - s: "pero no quiero creer"
            r: "main verb 2: but I will not believe"
            under:
              - s: "que hicieron todas aquellas cosas"
                r: "what I won't believe: that they did all those things"
                under:
                  - {s: "que el arzobispo Turpín dellos escribe", r: "describes 'cosas': which Archbishop Turpin writes about them"}
        forms:
          - {w: "quiero", f: "quier- + -o → querer (to want), present, I. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "hubo", f: "hub- + -o → haber (to have; 'there to be' when impersonal), preterite: 'there were'. haber in the preterite: hube, hubiste, hubo, hubimos, hubisteis, hubieron."}
          - {w: "hicieron", f: "hic- + -ieron → hacer (to do), preterite, they. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "dellos", f: "de + ellos (of them): Cervantes fuses 'de' with the pronoun; modern 'de ellos'."}
          - {w: "escribe", f: "escrib- + -e → escribir (to write), present, he. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
        note: "Turpin was a real 8th-century archbishop of Reims who became one of the Twelve Peers in legend. The Latin 'Chronicle of Pseudo-Turpin', written some three centuries after his death but passed off as his eyewitness account, spread the Charlemagne legends; the romances keep citing 'Turpin' as their source."
