          - s: "no tiene libertad"
            r: "main verb (after 'cuanto más, que'): has no freedom"
            under:
              - s: "el que está encantado"
                r: "subject: he who is enchanted"
                under:
                  - {s: "como yo", r: "like me"}
              - s: "para hacer de su persona"
                r: "what for: to do with himself"
                under:
                  - {s: "lo que quisiere", r: "object of 'hacer': whatever he may wish"}
              - s: "porque el que le encantó le puede hacer"
                r: "why: because the one who enchanted him can make him"
                under:
                  - {s: "que no se mueva de un lugar", r: "what he can make happen: that he does not stir from one spot"}
                  - {s: "en tres siglos", r: "how long: for three centuries"}
        forms:
          - {w: "está encantado", f: "est- + -á → estar (to be), present, he, + encantado, the participle of encantar (to enchant): 'is enchanted'. estar in the present: estoy, estás, está, estamos, estáis, están."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, he. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "quisiere", f: "quis- + -iere → querer (to want), future subjunctive, he: 'whatever he may want'. Built on the preterite quisieron: quisiere, quisieres, quisiere, quisiéremos, quisiereis, quisieren. Cervantes uses it after 'lo que' for an open future; modern Spanish says 'quiera'."}
          - {w: "encantó", f: "encant- + -ó → encantar (to enchant), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "puede", f: "pued- + -e → poder (to be able), present, he. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "le", f: "'him', the enchanted man, as object of 'encantó' and 'hacer'; Castilian leísmo uses 'le' for a male person where Latin American Spanish says 'lo'."}
          - {w: "se mueva", f: "muev- + -a → moverse (to move, stir), present subjunctive, he, with 'se' (himself). The stem o becomes ue when stressed: mueva, muevas, mueva, movamos, mováis, muevan. Subjunctive after 'hacer que' (make someone do)."}
