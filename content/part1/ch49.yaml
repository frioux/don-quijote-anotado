      - es: "y, como ahora dicen caballero de San Juan, o de Alcántara, decían en aquel tiempo caballero de los Doce Pares, porque no fueron doce iguales los que para esta religión militar se escogieron."
        literal: "and, as now they-say knight of Saint John, or of Alcántara, they-said in that time knight of the Twelve Peers, because not were twelve equals those who for this religious-order military themselves chose."
        ormsby: "and just as we say now a Knight of St. John, or of Alcántara, they used to say then a Knight of the Twelve Peers, because twelve equals were chosen for that military order."
