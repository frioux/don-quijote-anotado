              - {s: "replicó don Quijote", r: "aside: Don Quijote replied"}
              - {s: "por mi cuenta", r: "how: by my reckoning"}
              - s: "que el sin juicio y el encantado es vuestra merced"
                r: "what I find: that the madman and the enchanted one is you"
                under:
