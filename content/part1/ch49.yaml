              - {s: "después de haberle estado un buen espacio mirando", r: "when, 2: after looking at him a good while"}
        forms:
          - {w: "Atentísimamente", f: "atent- + -ísima + -mente → atento (attentive) made superlative with -ísimo and turned into an adverb with -mente: 'most attentively'. The adverb is built on the feminine form."}
          - {w: "estuvo ... escuchando", f: "estuv- + -o → estar (to be), preterite, he, + escuchando, gerund of escuchar (to listen): 'he was listening'. estar (to be) in the preterite: estuve, estuviste, estuvo, estuvimos, estuvisteis, estuvieron."}
          - {w: "vio", f: "vi- + -o → ver (to see), preterite, he. Irregular: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "había puesto", f: "hab- + -ía → haber (to have), imperfect, he (the canon), + puesto, irregular participle of poner (to put): the pluperfect, 'he had put'. haber (to have) in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "ellas", f: "'them', feminine plural, standing for 'razones'."}
          - {w: "haberle estado ... mirando", f: "haber (to have) + le (him, the canon) + estado, participle of estar (to be), + mirando, gerund of mirar (to look at): 'having been looking at him'. The pronoun hangs on the infinitive after 'después de'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Paréceme, señor hidalgo, que la plática de vuestra merced se ha encaminado a querer darme a entender que no ha habido caballeros andantes en el mundo, y que todos los libros de caballerías son falsos, mentirosos, dañadores e inútiles para la república;"
        literal: "— It-seems-to-me, sir gentleman, that the talk of your grace itself has directed to wish to-give-me to understand that not there-have been knights errant in the world, and that all the books of chivalries are false, lying, harmful and useless for the commonwealth;"
        ormsby: "“It appears to me, gentle sir, that your worship’s discourse is intended to persuade me that there never were any knights-errant in the world, and that all the books of chivalry are false, lying, mischievous and useless to the State,"
        vocab:
          - {w: "hidalgo", d: "gentleman, a member of the lowest rank of nobility; used here as a polite address to the canon"}
          - {w: "plática", d: "talk, discourse, speech"}
          - {w: "encaminarse a", d: "to be aimed at, tend towards"}
          - {w: "dar a entender", d: "to give to understand, make (someone) believe"}
          - {w: "caballeros andantes", d: "knights-errant, wandering knights"}
          - {w: "dañador", d: "harmful, mischievous (literally 'harmer')"}
          - {w: "república", d: "the commonwealth, the state, society (not 'republic')"}
        diagram:
          - s: "Paréceme"
            r: "main verb: it seems to me"
            under:
              - {s: "señor hidalgo", r: "addressed: sir (to the canon)"}
              - s: "que la plática de vuestra merced se ha encaminado"
                r: "what seems: that your speech has been aimed"
                under:
                  - s: "a querer darme a entender"
                    r: "aimed at what: at trying to make me understand"
                    under:
                      - {s: "que no ha habido caballeros andantes en el mundo", r: "what, 1: that there never were knights-errant"}
                      - {s: "y que todos los libros de caballerías son falsos, mentirosos, dañadores e inútiles para la república", r: "what, 2: that all chivalry books are false, lying, harmful and useless to society"}
        forms:
          - {w: "Paréceme", f: "parec- + -e + me → parecer (to seem), present, it, with 'me' (to me) stuck on the end; modern 'me parece'. Cervantes hangs the pronoun on a verb that opens the sentence. parecer (to seem) in the present: parezco, pareces, parece, parecemos, parecéis, parecen."}
          - {w: "se ha encaminado", f: "ha (haber (to have), present, it: he, has, ha, hemos, habéis, han) + encaminado, participle of encaminar (to direct), with 'se': the present perfect, 'has been aimed'."}
          - {w: "querer darme", f: "querer (to want, to try) + dar (to give) with 'me' hung on the infinitive: 'to try to give me'."}
          - {w: "ha habido", f: "ha (haber (to have), present, it: he, has, ha, hemos, habéis, han) + habido, participle of haber (there to be): 'there have been'. Impersonal haber (there to be) stays singular even with a plural noun ('caballeros')."}
          - {w: "son", f: "ser (to be), present, they. soy, eres, es, somos, sois, son."}
          - {w: "falsos, mentirosos, dañadores", f: "masculine plurals to match 'libros'; dañador = dañ- (harm) + -ador, the suffix of the one who does the action."}
          - {w: "e inútiles", f: "'y' (and) becomes 'e' before a word beginning with the sound i: 'e inútiles'."}
      - es: "y que yo he hecho mal en leerlos, y peor en creerlos, y más mal en imitarlos, habiéndome puesto a seguir la durísima profesión de la caballería andante, que ellos enseñan, negándome que no ha habido en el mundo Amadises, ni de Gaula ni de Grecia, ni todos los otros caballeros de que las escrituras están llenas."
        literal: "and that I have done badly in reading-them, and worse in believing-them, and more badly in imitating-them, having-myself put to follow the very-hard profession of the chivalry errant, which they teach, denying-to-me that not there-have been in the world Amadises, neither of Gaul nor of Greece, nor all the other knights of which the writings are full."
        ormsby: "and that I have done wrong in reading them, and worse in believing them, and still worse in imitating them, when I undertook to follow the arduous calling of knight-errantry which they set forth; for you deny that there ever were Amadíses of Gaul or of Greece, or any other of the knights of whom the books are full.”"
        vocab:
          - {w: "hacer mal en", d: "to do wrong in, be wrong to"}
          - {w: "ponerse a", d: "to set about, take up (doing something)"}
          - {w: "profesión", d: "calling, way of life; also the vows of a religious order"}
          - {w: "Amadises, ni de Gaula ni de Grecia", d: "Amadís of Gaul, hero of the most famous Spanish romance of chivalry, and his great-grandson Amadís of Greece, hero of a later sequel"}
          - {w: "escrituras", d: "writings, books (here the romances, not Scripture)"}
        diagram:
          - s: "y que yo he hecho mal"
            r: "still after 'Paréceme' in the previous sentence: and that I have done wrong"
            under:
              - {s: "en leerlos, y peor en creerlos, y más mal en imitarlos", r: "in what: reading them, worse believing them, worse still imitating them"}
              - s: "habiéndome puesto a seguir la durísima profesión de la caballería andante"
                r: "how: having taken up the very hard calling of knight-errantry"
                under:
                  - {s: "que ellos enseñan", r: "describes 'profesión': which they (the books) teach"}
              - s: "negándome"
                r: "how, 2: denying to me (you deny)"
                under:
                  - {s: "que no ha habido en el mundo Amadises, ni de Gaula ni de Grecia", r: "what is denied: that there ever were Amadises, of Gaul or Greece"}
                  - s: "ni todos los otros caballeros"
                    r: "nor all the other knights"
                    under:
                      - {s: "de que las escrituras están llenas", r: "describes 'caballeros': of whom the books are full"}
        forms:
          - {w: "he hecho", f: "he (haber (to have), present, I: he, has, ha, hemos, habéis, han) + hecho, irregular participle of hacer (to do): 'I have done'."}
          - {w: "leerlos, creerlos, imitarlos", f: "leer (to read), creer (to believe), imitar (to imitate) with 'los' (them, the books) hung on each infinitive after 'en'."}
          - {w: "habiéndome puesto", f: "habiendo, gerund of haber (to have), + me (myself), with an accent added, + puesto, participle of poner (to put): 'having set myself'. ponerse a = to take up."}
          - {w: "durísima", f: "dur- + -ísima → duro (hard) with the superlative suffix -ísimo, feminine to match 'profesión': 'very hard'."}
          - {w: "enseñan", f: "enseñ- + -an → enseñar (to teach), present, they (the books). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "negándome", f: "negando, gerund of negar (to deny), + me (to me), with an accent added: 'denying to me'. The 'no' in 'que no ha habido' repeats the negation, as Spanish does after verbs of denying."}
          - {w: "ha habido", f: "ha (haber (to have), present, it: he, has, ha, hemos, habéis, han) + habido, participle of haber (there to be): 'there have been'; stays singular with a plural noun."}
          - {w: "Amadises", f: "plural of the name Amadís: 'Amadises', i.e. all the knights called Amadís."}
          - {w: "están llenas", f: "est- + -án → estar (to be), present, they: estoy, estás, está, estamos, estáis, están; + llenas (full), feminine plural to match 'escrituras'."}
