  - sentences:
      - es: "Si no, díganme también que no es verdad que fue caballero andante el valiente lusitano Juan de Merlo, que fue a Borgoña y se combatió en la ciudad de Ras con el famoso señor de Charní, llamado mosén Pierres, y después, en la ciudad de Basilea, con mosén Enrique de Remestán, saliendo de entrambas empresas vencedor y lleno de honrosa fama;"
        literal: "If not, let-them-tell-me also that not is truth that was knight errant the valiant Lusitanian Juan de Merlo, who went to Burgundy and himself-fought in the city of Arras with the famous lord of Charny, called mossen Pierres, and afterwards, in the city of Basel, with mossen Enrique de Remestán, coming-out from both enterprises victor and full of honorable fame;"
        ormsby: "Or perhaps I shall be told, too, that there was no such knight-errant as the valiant Lusitanian Juan de Merlo, who went to Burgundy and in the city of Arras fought with the famous lord of Charny, Mosen Pierres by name, and afterwards in the city of Basle with Mosen Enrique de Remesten, coming out of both encounters covered with fame and honour;"
        ormsby_note: "Juan de Merlo was a Portuguese knight in the reign of John II of Castile, whose deeds are celebrated by Juan de Menain the Laberinto (198, 199)."
        vocab:
          - {w: "si no", d: "otherwise, or else (here a challenge: 'or else let them tell me')"}
          - {w: "lusitano", d: "Portuguese (Lusitania was the Roman name for roughly Portugal)"}
          - {w: "Juan de Merlo", d: "real 15th-century knight in the service of John II of Castile, famous for jousts abroad"}
          - {w: "Borgoña", d: "Burgundy, then a rich duchy famous for its tournaments"}
          - {w: "combatirse con", d: "to fight (in single combat) with"}
          - {w: "Ras", d: "Arras, a city in Flanders under the dukes of Burgundy"}
          - {w: "señor de Charní", d: "the lord of Charny, a Burgundian knight (Pierre de Bauffremont)"}
          - {w: "mosén", d: "'my lord, sir', a title for knights and clergy in Aragon and Catalonia (like French 'monseigneur')"}
          - {w: "Basilea", d: "Basel, in Switzerland"}
          - {w: "Enrique de Remestán", d: "a German knight Merlo fought at Basel; the name is garbled in the Spanish sources"}
          - {w: "entrambos", d: "both (old word, modern 'ambos')"}
          - {w: "empresa", d: "enterprise, feat of arms, challenge undertaken (false friend: not a 'company')"}
          - {w: "honroso", d: "honourable, bringing honour"}
        diagram:
          - s: "Si no, díganme también"
            r: "main verb: or else let them tell me too"
            under:
              - s: "que no es verdad"
                r: "what they should tell me: that it is not true"
                under:
                  - s: "que fue caballero andante el valiente lusitano Juan de Merlo"
                    r: "what is 'not true': that brave Portuguese Juan de Merlo was a knight-errant"
                    under:
                      - {s: "que fue a Borgoña", r: "describes 'Juan de Merlo': who went to Burgundy"}
                      - {s: "y se combatió en la ciudad de Ras con el famoso señor de Charní", r: "describes him, 2: and fought the lord of Charny at Arras"}
                      - {s: "llamado mosén Pierres", r: "describes 'señor de Charní': called Sir Pierre"}
                      - {s: "y después, en la ciudad de Basilea, con mosén Enrique de Remestán", r: "describes him, 3: and later fought Sir Enrique de Remestán at Basel"}
                      - {s: "saliendo de entrambas empresas vencedor y lleno de honrosa fama", r: "how: coming out of both feats the winner, covered in glory"}
        forms:
          - {w: "díganme", f: "dig- + -an + me → decir (to tell), present subjunctive, they, with 'me' stuck on the end: 'let them tell me'. Irregular: diga, digas, diga, digamos, digáis, digan. A command or challenge in the subjunctive takes the pronoun on the end."}
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "fue", f: "fue → ser (to be) in 'fue caballero' (he was), and ir (to go) in 'fue a Borgoña' (he went): the two verbs share the preterite. fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "se combatió", f: "combat- + -ió → combatirse (to fight), preterite, he, with 'se'. The preterite of -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "llamado", f: "participle of llamar (to call), masculine to match 'señor': 'called'."}
          - {w: "saliendo", f: "gerund of salir (to come out): 'coming out'."}
          - {w: "entrambas", f: "entramb- + -as → entrambos (both), feminine plural to match 'empresas'."}
          - {w: "honrosa", f: "honr- + -osa → honroso (honourable), feminine to match 'fama'; -oso makes adjectives from nouns (honra → honroso)."}
        note: "Now Don Quijote switches from fiction to real 15th-century Spanish knights who fought in foreign tournaments, recorded in the chronicle of John II of Castile. Mixing them with Pierres and the Peers is exactly his confusion of history and romance."
