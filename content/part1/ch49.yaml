                                r: "what follows: deserved the same penalty"
                                under:
                                  - {s: "que vuestra merced dice que da a los libros", r: "describes 'pena': which you say you give the books"}
                                  - {s: "cuando los lee y le enfadan", r: "when: when you read them and they annoy you"}
        forms:
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (repliqué, with c → qu before e)."}
          - {w: "hallo", f: "hall- + -o → hallar (to find), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "el sin juicio, el encantado", f: "'el' turns a phrase or participle into a noun: 'the one without wits', 'the enchanted one'."}
          - {w: "se ha puesto", f: "ha (haber (to have), present, you (vuestra merced): he, has, ha, hemos, habéis, han) + puesto, irregular participle of poner (to put), with 'se': 'you have set yourself'."}
