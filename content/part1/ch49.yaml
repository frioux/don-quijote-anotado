          - {w: "negase", f: "neg- + -ase → negar (to deny), imperfect subjunctive (-se form), he: 'whoever should deny it'. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "niega", f: "nieg- + -a → negar (to deny), present, you (vuestra merced). The stem e becomes ie when stressed: niego, niegas, niega, negamos, negáis, niegan."}
          - {w: "merecía", f: "merec- + -ía → merecer (to deserve), imperfect, he, used for 'would deserve'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "mesma", f: "= misma (same), old form, feminine to match 'pena'."}
          - {w: "dice", f: "dic- + -e → decir (to say), present, you (vuestra merced). Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "da", f: "d- + -a → dar (to give), present, you (vuestra merced). doy, das, da, damos, dais, dan."}
