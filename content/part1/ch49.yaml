          - {w: "lo", f: "'it', the object of 'escuchando', placed before the whole verb group 'estaba escuchando'; 'todo' in front repeats it for emphasis."}
      - es: "cuanto más, que el que está encantado, como yo, no tiene libertad para hacer de su persona lo que quisiere, porque el que le encantó le puede hacer que no se mueva de un lugar en tres siglos;"
        literal: "how-much more, that he who is enchanted, like me, not has liberty to do with his person that which he-may-wish, because he who him enchanted him can make that not himself he-may-move from a place in three centuries;"
        ormsby: "moreover one who is enchanted as I am cannot do as he likes with himself; for he who had enchanted him could prevent his moving from one place for three ages,"
        vocab:
          - {w: "cuanto más", d: "all the more so, besides, moreover"}
          - {w: "hacer de su persona lo que quisiere", d: "to do with himself whatever he likes"}
          - {w: "encantar", d: "to put under a spell, enchant (in the literal, magical sense)"}
          - {w: "siglo", d: "century, age"}
