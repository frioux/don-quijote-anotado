        forms:
          - {w: "Añadió", f: "añad- + -ió → añadir (to add), preterite, you (vuestra merced). The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "diciendo", f: "gerund of decir (to say): the e of the stem becomes i, 'saying'."}
          - {w: "habían hecho", f: "hab- + -ían → haber (to have), imperfect, they (the books), + hecho, irregular participle of hacer (to do): the pluperfect, 'had done'. haber (to have) in the imperfect: había, habías, había, habíamos, habíais, habían."}
