        note: "The canon offers a roll of real heroes, ancient and Spanish, each paired with the land he made famous, as reading better than the invented knights of chivalry."
      - es: "un don Manuel de León, Sevilla, cuya leción de sus valerosos hechos puede entretener, enseñar, deleitar y admirar a los más altos ingenios que los leyeren."
        literal: "a don Manuel de León, Seville, whose reading of his valiant deeds can entertain, teach, delight and amaze to the most high wits that them may-read."
        ormsby: "Seville a Don Manuel de León, to read of whose valiant deeds will entertain and instruct the loftiest minds and fill them with delight and wonder."
        ormsby_note: "Count Fernán González of Castile, the hero of many ballads, flourished in the tenth century; for Gonzalo Fernández, or Hernández, and Diego García de Paredes see notes to Chapter XXXII: García Pérez de Vargas is the hero of more than one ballad, but from the mention of Jerez it may be that Cervantes meant Diego Pérez de Vargas, who, at the siege of Jerez, performed the feat that got him the name of the Pounder. (See Chapter VIII.) Garcilaso is not the poet but an ancestor of his, known as “el del Ave Maria,” from having slain at the battle of the Salado a Moor who appeared with a label bearing the words “Ave Maria” tied to his horse’s tail; an exploit generally said to have been performed at Granada. Don Manuel Ponce de León was a knight of the time of Ferdinand and Isabella, who figures in the ballads of the Siege of Granada; for him see note to Chapter XVII Part II."
        vocab:
          - {w: "don Manuel de León", d: "Manuel Ponce de León, a Sevillian knight of Ferdinand and Isabella, hero of the ballads of the war of Granada"}
          - {w: "leción", d: "= lección, reading (old spelling); here 'the reading', not 'lesson'"}
          - {w: "valeroso", d: "valiant, brave"}
          - {w: "entretener", d: "to entertain, amuse"}
          - {w: "deleitar", d: "to delight"}
          - {w: "admirar", d: "to amaze, fill with wonder (not only 'to admire')"}
          - {w: "ingenio", d: "mind, wit, talent; 'los más altos ingenios' = the finest minds"}
        diagram:
          - s: "un don Manuel de León, Sevilla"
            r: "last pair, still on 'tuvo' from the previous sentence: Seville [had] a Don Manuel de León"
            under:
              - s: "cuya leción de sus valerosos hechos puede entretener, enseñar, deleitar y admirar"
                r: "describes all these heroes: reading of whose deeds can entertain, teach, delight and amaze"
                under:
                  - s: "a los más altos ingenios"
                    r: "object: the loftiest minds"
                    under:
                      - {s: "que los leyeren", r: "describes 'ingenios': who may read them"}
        forms:
          - {w: "cuya", f: "cuy- + -a → cuyo (whose), feminine to match the thing owned, 'leción', not the owner."}
          - {w: "leción", f: "old spelling of lección (reading), with the c of -cc- dropped, as in letura for lectura."}
          - {w: "valerosos", f: "valeros- + -os → valeroso (valiant), masculine plural to match 'hechos'."}
          - {w: "puede", f: "pued- + -e → poder (to be able), present, it (the reading). The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden. Four infinitives hang on it: entretener (to entertain), enseñar (to teach), deleitar (to delight), admirar (to amaze)."}
          - {w: "a los más altos ingenios", f: "personal 'a' before a direct object that is people (the 'wits' are the readers); 'más altos' = loftiest, the superlative made with 'los más'."}
          - {w: "leyeren", f: "ley- + -eren → leer (to read), future subjunctive, they: 'whoever may read them'. The y replaces the i between vowels. The future subjunctive of leer (to read): leyere, leyeres, leyere, leyéremos, leyereis, leyeren. Cervantes uses it after 'que' for an open future; modern Spanish uses the present subjunctive 'lean'."}
          - {w: "los", f: "'them', masculine plural, standing for 'hechos' (deeds)."}
      - es: "Ésta sí será letura digna del buen entendimiento de vuestra merced, señor don Quijote mío, de la cual saldrá erudito en la historia, enamorado de la virtud, enseñado en la bondad, mejorado en las costumbres, valiente sin temeridad, osado sin cobardía, y todo esto, para honra de Dios, provecho suyo y fama de la Mancha;"
        literal: "This indeed will-be reading worthy of-the good understanding of your grace, sir Don Quijote mine, from the which you-will-come-out learned in the history, enamored of the virtue, taught in the goodness, improved in the manners, brave without rashness, bold without cowardice, and all this, for honor of God, profit his-own and fame of the Mancha;"
        ormsby: "Here, Señor Don Quixote, will be reading worthy of your sound understanding; from which you will rise learned in history, in love with virtue, strengthened in goodness, improved in manners, brave without rashness, prudent without cowardice; and all to the honour of God, your own advantage and the glory of La Mancha,"
        vocab:
          - {w: "sí", d: "indeed, really: stressing the verb ('this really will be')"}
          - {w: "letura", d: "= lectura, reading (old spelling)"}
          - {w: "digno de", d: "worthy of"}
          - {w: "entendimiento", d: "understanding, intellect"}
          - {w: "señor don Quijote mío", d: "my dear Don Quijote: 'mío' after the name is affectionate"}
          - {w: "erudito", d: "learned, well-read"}
          - {w: "costumbres", d: "manners, morals, habits of life (not 'customs' only)"}
          - {w: "temeridad", d: "rashness, recklessness"}
          - {w: "osado", d: "daring, bold"}
          - {w: "provecho", d: "profit, benefit"}
        diagram:
          - s: "Ésta sí será letura"
            r: "main verb: this indeed will be reading"
            under:
              - s: "digna del buen entendimiento de vuestra merced"
                r: "describes 'letura': worthy of your good understanding"
              - {s: "señor don Quijote mío", r: "addressed: my dear Don Quijote"}
              - s: "de la cual saldrá"
                r: "describes 'letura': from which you will come out"
                under:
                  - {s: "erudito en la historia, enamorado de la virtud, enseñado en la bondad, mejorado en las costumbres", r: "how you will come out: learned, in love with virtue, taught goodness, better in morals"}
                  - {s: "valiente sin temeridad, osado sin cobardía", r: "how, 2: brave but not rash, bold but not cowardly"}
              - {s: "y todo esto, para honra de Dios, provecho suyo y fama de la Mancha", r: "why: all for God's honour, your benefit and La Mancha's fame"}
        forms:
          - {w: "Ésta", f: "est- + -a → este (this), feminine to match 'letura'; the accent marks it as a pronoun, 'this one'."}
          - {w: "será", f: "ser- + -á → ser (to be), future, it. The future adds endings to the whole infinitive: seré, serás, será, seremos, seréis, serán."}
          - {w: "digna", f: "dign- + -a → digno (worthy), feminine to match 'letura'."}
          - {w: "del buen", f: "del = de + el; buen = bueno (good) clipped before a masculine singular noun ('entendimiento')."}
          - {w: "la cual", f: "'which', feminine to match 'letura'; a heavier relative than 'que', used after 'de'."}
          - {w: "saldrá", f: "saldr- + -á → salir (to come out), future, you (vuestra merced). Irregular stem saldr-: saldré, saldrás, saldrá, saldremos, saldréis, saldrán."}
          - {w: "enamorado, enseñado, mejorado", f: "participles of enamorar (to make fall in love), enseñar (to teach) and mejorar (to improve), masculine singular to match Don Quijote: 'in love, taught, improved'."}
          - {w: "suyo", f: "'his own, your own': the possessive placed after the noun ('provecho suyo'); with vuestra merced it means 'yours'."}
      - es: "do, según he sabido, trae vuestra merced su principio y origen."
        literal: "where, according-as I-have learned, brings your grace his beginning and origin."
        ormsby: "whence, I am informed, your worship derives your birth.”"
        vocab:
