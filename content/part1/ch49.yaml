  - sentences:
      - es: "— Y yo y todo —dijo el canónigo—; y más si él me da la palabra, como caballero, de no apartarse de nosotros hasta que sea nuestra voluntad."
        literal: "— And I and all —said the canon—; and more if he to-me gives the word, as knight, of not to-separate-himself from us until that it-be our will."
        ormsby: "“And I also,” said the canon, “especially if he gives me his word as a knight not to leave us without our consent.”"
        vocab:
          - {w: "y yo y todo", d: "'and I too', 'me as well' (colloquial: 'y todo' = even, as well)"}
          - {w: "canónigo", d: "canon: a priest attached to a cathedral, a learned churchman who joined the party on the road two chapters back"}
          - {w: "y más si", d: "and all the more if, especially if"}
          - {w: "dar la palabra", d: "to give one's word, promise"}
          - {w: "como caballero", d: "as a knight, on his honour as a knight"}
          - {w: "apartarse de", d: "to go away from, leave"}
          - {w: "hasta que sea nuestra voluntad", d: "until it is our wish, until we choose"}
        diagram:
          - s: "Y yo y todo"
            r: "main clause, verb understood: and I too (guarantee him)"
          - s: "dijo el canónigo"
            r: "speech tag: the canon said"
          - s: "y más"
            r: "and especially"
            under:
              - s: "si él me da la palabra"
                r: "condition: if he gives me his word"
                under:
                  - {s: "como caballero", r: "how: as a knight"}
                  - s: "de no apartarse de nosotros"
                    r: "what he promises: not to leave us"
                    under:
                      - {s: "hasta que sea nuestra voluntad", r: "until when: until we wish it"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "da", f: "d- + -a → dar (to give), present, he. dar in the present: doy, das, da, damos, dais, dan."}
          - {w: "apartarse", f: "apartar (to separate) + se (himself), infinitive after 'de', with the pronoun hung on the end: 'to take himself away'."}
