      - es: "Y si es mentira, también lo debe de ser que no hubo Héctor, ni Aquiles, ni la guerra de Troya, ni los Doce Pares de Francia, ni el rey Artús de Ingalaterra, que anda hasta ahora convertido en cuervo y le esperan en su reino por momentos."
