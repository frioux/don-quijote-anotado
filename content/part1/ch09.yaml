      - es: "Con esta imaginación, le di priesa que leyese el principio, y, haciéndolo ansí, volviendo de improviso el arábigo en castellano, dijo que decía: Historia de don Quijote de la Mancha, escrita por Cide Hamete Benengeli, historiador arábigo."
        literal: "With this imagining, him I-gave haste that he-should-read the beginning, and, doing-it thus, turning on-the-spot the Arabic into Castilian, he-said that it-said: History of Don Quijote de la Mancha, written by Cide Hamete Benengeli, historian Arabic."
        ormsby: "With this idea I pressed him to read the beginning, and doing so, turning the Arabic offhand into Castilian, he told me it meant, “History of Don Quixote of La Mancha, written by Cide Hamete Benengeli, an Arab historian.”"
        vocab:
          - {w: "imaginación", d: "thought, idea"}
          - {w: "dar priesa", d: "= dar prisa, to hurry (someone); 'priesa' is the old form of 'prisa'"}
