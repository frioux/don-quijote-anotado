        ormsby_note: "J. A. Condé suggested that Ben Engeli, 'son of the stag', is the Arabic equivalent of the name 'Cervantes,' the root of which he assumed to be ciervo. Cervantes may, of course, have intended what Conde attributes to him, but the name in reality has nothing to do with ciervo, and comes from Servando."
