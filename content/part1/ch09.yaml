  - sentences:
      - es: "— Está, como he dicho, aquí en el margen escrito esto: \"Esta Dulcinea del Toboso, tantas veces en esta historia referida, dicen que tuvo la mejor mano para salar puercos que otra mujer de toda la Mancha\"."
        literal: "— Is, as I-have said, here in the margin written this: \"This Dulcinea del Toboso, so-many times in this history referred-to, they-say that she-had the best hand for salting pigs than other woman of all La Mancha\"."
        ormsby: "“In the margin, as I told you, this is written: ‘This Dulcinea del Toboso so often mentioned in this history, had, they say, the best hand of any woman in all La Mancha for salting pigs.’ ”"
        vocab:
          - {w: "referido", d: "mentioned, referred to"}
          - {w: "tener buena mano para", d: "to have a good hand at, be skilled at"}
          - {w: "salar", d: "to salt, cure (meat)"}
          - {w: "puerco", d: "pig, pork"}
          - {w: "que otra mujer", d: "than any other woman"}
        diagram:
          - s: "Está"
            r: "main verb: is (with 'escrito': is written)"
            under:
              - {s: "como he dicho", r: "as I have said"}
              - {s: "aquí en el margen", r: "where: here in the margin"}
              - {s: "escrito", r: "completes 'Está': written"}
              - s: "esto:"
                r: "subject: this"
                under:
                  - s: "dicen"
                    r: "main verb of the note: they say"
                    under:
                      - {s: "Esta Dulcinea del Toboso", r: "topic: this Dulcinea"}
                      - {s: "tantas veces en esta historia referida", r: "describes Dulcinea: so often mentioned in this history"}
                      - {s: "que tuvo la mejor mano para salar puercos", r: "what they say: that she had the best hand at salting pork"}
                      - {s: "que otra mujer de toda la Mancha", r: "than: than any other woman in La Mancha"}
        forms:
          - {w: "Está", f: "estar (to be), present, it. estoy, estás, está, estamos, estáis, están. 'estar escrito' = to be written (a state)."}
          - {w: "he dicho", f: "he + dicho → haber (present, I) + dicho, the irregular participle of decir (to say): present perfect, 'I have said'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "escrito, esto", f: "escrito is masculine singular to match the neuter 'esto' (this)."}
          - {w: "tantas veces", f: "tant- + -as → tanto (so many), feminine plural to match 'veces'; vez + -es, z becoming c before e."}
          - {w: "referida", f: "referid- + -a → participle of referir (to mention), feminine to match 'Dulcinea'."}
          - {w: "dicen", f: "dic- + -en → decir (to say), present, they (people). decir: digo, dices, dice, decimos, decís, dicen."}
          - {w: "tuvo", f: "tuv- + -o → tener (to have), preterite, she. Irregular stem: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron."}
          - {w: "mejor", f: "the comparative of bueno: 'better, best'."}
          - {w: "salar", f: "infinitive (to salt) after 'para'."}
        note: "Salting the winter pig was peasant housework, the least romantic skill a knight's lady could have. Pork was also the badge of an 'old Christian' family, so a Muslim annotator praising her for it adds a further twist."
