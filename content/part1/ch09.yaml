      - es: "No se diga más, sino que fue de manera que se alzó de nuevo en los estribos, y, apretando más la espada en las dos manos, con tal furia descargó sobre el vizcaíno, acertándole de lleno sobre la almohada y sobre la cabeza, que, sin ser parte tan buena defensa, como si cayera sobre él una montaña, comenzó a echar sangre por las narices, y por la boca y por los oídos, y a dar muestras de caer de la mula abajo, de donde cayera, sin duda, si no se abrazara con el cuello;"
        literal: "Not let-it-be-said more, except that it-was of manner that he-raised-himself anew in the stirrups, and, gripping more the sword in the two hands, with such fury he-came-down upon the Biscayan, hitting-him in full upon the cushion and upon the head, that, without being part so good defense, as if fell upon him a mountain, he-began to throw blood through the nostrils, and through the mouth and through the ears, and to give signs of falling from the mule down, from where he-would-have-fallen, without doubt, if not he-had-clung with the neck;"
        ormsby: "All that can be said is, it was such that he again raised himself in his stirrups, and, grasping his sword more firmly with both hands, he came down on the Biscayan with such fury, smiting him full over the cushion and over the head, that—even so good a shield proving useless—as if a mountain had fallen on him, he began to bleed from nose, mouth, and ears, reeling as if about to fall backwards from his mule, as no doubt he would have done had he not flung his arms about its neck;"
