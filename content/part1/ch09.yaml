  - sentences:
      - es: "Estaba en el primero cartapacio, pintada muy al natural, la batalla de don Quijote con el vizcaíno, puestos en la mesma postura que la historia cuenta, levantadas las espadas, el uno cubierto de su rodela, el otro de la almohada, y la mula del vizcaíno tan al vivo, que estaba mostrando ser de alquiler a tiro de ballesta."
        literal: "Was in the first notebook, painted very to-the natural, the battle of Don Quijote with the Biscayan, placed in the same posture that the history tells, raised the swords, the one covered by his buckler, the other by the cushion, and the mule of-the Biscayan so to-the life, that it-was showing to-be of hire at shot of crossbow."
        ormsby: "In the first pamphlet the battle between Don Quixote and the Biscayan was drawn to the very life, they planted in the same attitude as the history describes, their swords raised, and the one protected by his buckler, the other by his cushion, and the Biscayan’s mule so true to nature that it could be seen to be a hired one a bowshot off."
        vocab:
          - {w: "al natural", d: "true to life"}
          - {w: "mesmo", d: "= mismo, same (old form)"}
          - {w: "postura", d: "posture, attitude"}
          - {w: "rodela", d: "round shield, buckler"}
          - {w: "almohada", d: "cushion, pillow; the Biscayan had snatched a cushion from the coach to use as a shield"}
          - {w: "al vivo", d: "to the life, vividly"}
          - {w: "de alquiler", d: "hired, for hire"}
          - {w: "a tiro de ballesta", d: "a crossbow-shot away, i.e. plainly, from a long way off"}
        diagram:
          - s: "Estaba"
            r: "main verb: was"
            under:
              - {s: "en el primero cartapacio", r: "where: in the first notebook"}
              - {s: "pintada muy al natural", r: "how: painted very true to life"}
              - s: "la batalla de don Quijote con el vizcaíno"
                r: "subject: the battle of Don Quijote with the Biscayan"
                under:
                  - {s: "puestos en la mesma postura que la historia cuenta", r: "describes the two fighters: placed just as the story tells"}
                  - {s: "levantadas las espadas", r: "with their swords raised"}
                  - {s: "el uno cubierto de su rodela", r: "one covered by his buckler"}
                  - {s: "el otro de la almohada", r: "the other by the cushion"}
              - s: "y la mula del vizcaíno tan al vivo"
                r: "subject 2: and the Biscayan's mule, so lifelike"
                under:
                  - {s: "que estaba mostrando ser de alquiler a tiro de ballesta", r: "result: that it showed a bowshot off that it was a hired one"}
        forms:
