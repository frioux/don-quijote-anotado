      - es: "Esta imaginación me traía confuso y deseoso de saber, real y verdaderamente, toda la vida y milagros de nuestro famoso español don Quijote de la Mancha, luz y espejo de la caballería manchega, y el primero que en nuestra edad y en estos tan calamitosos tiempos se puso al trabajo y ejercicio de las andantes armas, y al desfacer agravios, socorrer viudas, amparar doncellas, de aquellas que andaban con sus azotes y palafrenes, y con toda su virginidad a cuestas, de monte en monte y de valle en valle;"
