summary: |
  The narrator picks up where Chapter 8 broke off, with Don Quijote and the Biscayan frozen in mid-blow, and explains his frustration: the history he was following stopped there. He cannot believe that so great a knight had no sage to chronicle him, as every knight-errant of the romances had, and he blames Time for hiding or destroying the rest. He praises Don Quijote as the first knight-errant of these wretched modern times and claims some praise for himself for his search.

  One day in the Alcaná market in Toledo he sees a boy selling old notebooks to a silk merchant. They are in Arabic, so he finds a Spanish-speaking Morisco to read them. The Morisco laughs at a marginal note saying that Dulcinea del Toboso was the best hand at salting pork in all La Mancha, and the narrator realises he has found the lost history: 'History of Don Quijote de la Mancha, written by Cide Hamete Benengeli, Arab historian'. He buys the lot for half a real, takes the Morisco home, and pays him in raisins and wheat to translate it.

  The first notebook has a picture of the battle: the fighters behind buckler and cushion, the Biscayan's plainly hired mule, a skeletal Rocinante, and Sancho with his donkey, labelled 'Sancho Zancas'. The narrator warns that the only doubt about the story's truth is that its author is an Arab, a people he says are prone to lying; if anything, the enemy historian will have left out praise rather than invented it.

  The translation resumes the fight. The Biscayan strikes first; luck turns his sword, which strips Don Quijote's left side of armour and takes half his helmet and half his ear. Don Quijote, enraged, brings his sword down on the Biscayan's cushion and head. The Biscayan bleeds from nose, mouth and ears and is thrown by his bolting mule. Don Quijote holds his sword to his eyes and demands surrender. The lady in the coach begs for her squire's life, and Don Quijote grants it on condition that the Biscayan present himself to Dulcinea in El Toboso. The terrified lady promises everything without asking who Dulcinea is.
context: |
  Money and trade. A real was a silver coin; half a real for a bundle of manuscripts, and two arrobas of raisins (about 23 kg) and two fanegas of wheat (roughly three bushels) for a translation, make the priceless history dirt cheap. Waste paper was sold by weight to shopkeepers like the silk merchant for wrapping goods. The Alcaná of Toledo was a street of shops by the cathedral, once run by Moorish and Jewish traders, and Ormsby's note identifies it as a marketplace near the cathedral.

  Moriscos. Moriscos were Muslims (and their descendants) forcibly converted to Christianity after 1502. Many still knew Arabic, and 'aljamiado' literature, Spanish written in Arabic script, circulated in secret. They were widely distrusted, and between 1609 and 1614, a few years after this chapter was published, they were expelled from Spain. The narrator's remark that the 'nation' of Arabs are liars is the everyday prejudice of the time; Cervantes, who spent five years as a captive in Algiers, uses it for comedy while making an Arab the author of his hero's 'true history'. The joke that an interpreter for an 'older and better language' would be just as easy to find (Hebrew, as Ormsby's note says) points at Toledo's many families of converted Jews.

  The books and the frame. The romances of chivalry claimed to be translations of ancient chronicles by sages or enchanters, and every hero had his chronicler. Cervantes parodies this with a comic chain of narrators: an Arab historian, a Morisco translator paid in groceries, and a Spanish narrator who comments on both. The break at the end of Chapter 8 and the 'second part' beginning here follow the 1605 edition, which divided Part I into four parts. Platir was the hero of a minor Palmerín romance (1533). The two 'modern' books in Don Quijote's library are pastoral romances of the 1580s. The description of the picture, with its captions, is a set-piece in the manner of a romance's illustrated frontispiece.

  History and truth. The narrator's definition of history (rival of time, storehouse of deeds, witness of the past, example to the present, warning to the future) paraphrases Cicero's famous line in De oratore. Ormsby notes that Cervantes wrote 'truth, whose mother is history' when he surely meant the opposite; modern readers often take the slip as one more joke about unreliable chroniclers. The narrator also promises the book will occupy 'almost two hours', a comic underestimate.

  The names. Cide Hamete Benengeli: 'Cide' is the Arabic title 'sidi' (lord), Hamete is Hamid or Ahmed, and Benengeli has been read, as Ormsby's note reports, as 'son of the stag' (a pun on ciervo and Cervantes, which Ormsby doubts) or as a pun on 'berenjena', aubergine, a vegetable Spaniards linked with Moriscos and Toledans. Sancho's labels are jokes too: panza is a paunch and zancas are long shanks; Ormsby notes that the long legs are never mentioned again. Rocinante's name, 'nag before', is proved apt by his portrait. The Biscayan is named Don Sancho de Azpetia, after Azpeitia in Guipúzcoa. Dulcinea's talent for salting pork is the least romantic compliment imaginable for a knight's lady.

  Violence and medicine. The battle is told in the inflated style of romance combats, with blows that could split a man like a pomegranate and a helmet sheared away with half an ear. Bleeding from nose, mouth and ears was the classic sign of a blow to the head. As in the romances, the defeated knight is spared on condition he goes to kneel before the victor's lady.

  Reading Cervantes' Spanish. This chapter is full of the archaisms seen in Chapter 1: the old f- for h- (fendiente, fender, desfacer, fermosas); contractions of 'de' with pronouns and demonstratives (desta, della, dellos, dél); pronouns hung on the end of verbs that open a clause (Causóme, Parecióme, Preguntéle, Díjele, Apartéme, Contentóse, Estábaselo); the -ra subjunctive used as a conditional (fuera, hallara, pasara, cayera, pudiera); the future subjunctive, dead in modern Spanish (leyere, faltare, acertare, fuere); and old spellings such as escrebir, recebir, priesa, ansí, mesmo, truje, tradución, propriedad, rétulo, estender, rancor and Válame. Note also 'puesto que', which means 'since' in one place and 'although' in another, and 'luego', which usually means 'at once'.
