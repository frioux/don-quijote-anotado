        note: "Often read as a glimpse of Cervantes himself, who confessed to reading any scrap of paper he found in the street."
      - es: "Y, puesto que, aunque los conocía, no los sabía leer, anduve mirando si parecía por allí algún morisco aljamiado que los leyese; y no fue muy dificultoso hallar intérprete semejante, pues, aunque le buscara de otra mejor y más antigua lengua, le hallara."
