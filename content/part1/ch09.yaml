      - es: "Y el primero que fue a descargar el golpe fue el colérico vizcaíno, el cual fue dado con tanta fuerza y tanta furia que, a no volvérsele la espada en el camino, aquel solo golpe fuera bastante para dar fin a su rigurosa contienda y a todas las aventuras de nuestro caballero;"
