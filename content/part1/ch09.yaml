  - sentences:
      - es: "— Por cierto, fermosas señoras, yo soy muy contento de hacer lo que me pedís;"
        literal: "— For certain, beauteous ladies, I am very content of doing that which of-me you-ask;"
        ormsby: "“In truth, fair ladies, I am well content to do what ye ask of me;"
        vocab:
          - {w: "por cierto", d: "certainly, indeed"}
          - {w: "fermoso", d: "= hermoso, beautiful; the old f- that Don Quijote uses to sound like a knight of old"}
          - {w: "ser contento de", d: "to be glad to (modern 'estar contento de')"}
        diagram:
          - s: "yo soy muy contento"
            r: "main verb: I am very glad"
            under:
              - {s: "Por cierto", r: "certainly"}
              - {s: "fermosas señoras", r: "address: fair ladies"}
              - {s: "de hacer lo que me pedís", r: "of what: to do what you ask of me"}
        forms:
          - {w: "fermosas", f: "fermos- + -as → fermoso (= hermoso, beautiful, with the old f-), feminine plural to match 'señoras'."}
          - {w: "soy", f: "ser (to be), present, I. soy, eres, es, somos, sois, son. Modern Spanish says 'estoy contento'; Cervantes can use ser for a state of mind."}
          - {w: "hacer", f: "infinitive (to do) after 'de'."}
          - {w: "lo que", f: "neuter 'that which, what'."}
          - {w: "pedís", f: "ped- + -ís → pedir (to ask), present, you (vosotros, the plural 'you'). pido, pides, pide, pedimos, pedís, piden."}
      - es: "mas ha de ser con una condición y concierto, y es que este caballero me ha de prometer de ir al lugar del Toboso y presentarse de mi parte ante la sin par doña Dulcinea, para que ella haga dél lo que más fuere de su voluntad."
        literal: "but it-has to be with one condition and agreement, and it-is that this knight to-me has to promise of going to-the village of-the Toboso and present-himself on my part before the without equal lady Dulcinea, so that she may-do of-him that which most may-be of her will."
        ormsby: "but it must be on one condition and understanding, which is that this knight promise me to go to the village of El Toboso, and on my behalf present himself before the peerless lady Dulcinea, that she deal with him as shall be most pleasing to her.”"
        vocab:
          - {w: "mas", d: "but"}
          - {w: "haber de", d: "must, to have to"}
          - {w: "concierto", d: "agreement, terms"}
          - {w: "prometer de", d: "old for 'prometer', to promise to"}
          - {w: "lugar", d: "village"}
          - {w: "de mi parte", d: "on my behalf"}
          - {w: "sin par", d: "peerless, matchless"}
          - {w: "doña", d: "lady, the title of a noblewoman"}
          - {w: "dél", d: "= de él"}
          - {w: "voluntad", d: "will, pleasure"}
        diagram:
          - s: "mas ha de ser"
            r: "main verb 1: but it must be"
            under:
              - {s: "con una condición y concierto", r: "with what: on one condition and agreement"}
          - s: "y es"
            r: "main verb 2: and it is"
            under:
              - s: "que este caballero me ha de prometer"
                r: "what the condition is: that this knight must promise me"
                under:
                  - {s: "de ir al lugar del Toboso", r: "promise 1: to go to the village of El Toboso"}
                  - {s: "y presentarse de mi parte ante la sin par doña Dulcinea", r: "promise 2: and present himself on my behalf to the peerless Dulcinea"}
                  - {s: "para que ella haga dél lo que más fuere de su voluntad", r: "purpose: so that she may do with him whatever she pleases"}
        forms:
          - {w: "ha de ser", f: "ha → haber (to have), present, it, + de + ser (to be): 'haber de' + infinitive = must. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "este", f: "'this', masculine to match 'caballero'."}
          - {w: "ha de prometer", f: "the same 'haber de' + infinitive: 'must promise'."}
          - {w: "de ir", f: "old 'prometer de' + infinitive ir (to go)."}
          - {w: "al, del", f: "a + el, de + el."}
          - {w: "presentarse", f: "presentar (to present) + se (himself): infinitive with the pronoun on the end."}
          - {w: "haga", f: "hag- + -a → hacer (to do), present subjunctive, she. Built on 'hago': haga, hagas, haga, hagamos, hagáis, hagan. Subjunctive because 'para que' (so that) always takes it."}
          - {w: "dél", f: "de + él (of him, with him)."}
          - {w: "fuere", f: "fu- + -ere → ser (to be), future subjunctive, it: 'whatever may be'. fuere, fueres, fuere, fuéremos, fuereis, fueren. An old tense now replaced by the present subjunctive ('sea')."}
        note: "Sending a defeated foe to kneel before one's lady is exactly what knights do in Amadís de Gaula, and it is the plan Don Quijote rehearsed in Chapter 1."
  - sentences:
      - es: "La temerosa y desconsolada señora, sin entrar en cuenta de lo que don Quijote pedía, y sin preguntar quién Dulcinea fuese, le prometió que el escudero haría todo aquello que de su parte le fuese mandado."
        literal: "The fearful and disconsolate lady, without entering into account of that which Don Quijote was-asking, and without asking who Dulcinea might-be, to-him promised that the squire would-do all that which on his part to-him might-be ordered."
