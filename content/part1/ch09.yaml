  - sentences:
      - es: "Estábaselo con mucho sosiego mirando don Quijote, y, como lo vio caer, saltó de su caballo y con mucha ligereza se llegó a él, y, poniéndole la punta de la espada en los ojos, le dijo que se rindiese; si no, que le cortaría la cabeza."
        literal: "Was-himself-it with much calm watching Don Quijote, and, as him he-saw fall, he-jumped from his horse and with much lightness came-himself to him, and, putting-to-him the point of the sword in the eyes, to-him said that he-should-surrender; if not, that to-him he-would-cut the head."
        ormsby: "Don Quixote stood looking on very calmly, and, when he saw him fall, leaped from his horse and with great briskness ran to him, and, presenting the point of his sword to his eyes, bade him surrender, or he would cut his head off."
        vocab:
          - {w: "sosiego", d: "calm, composure"}
          - {w: "ligereza", d: "nimbleness, speed"}
          - {w: "llegarse a", d: "to go up to, approach"}
          - {w: "punta", d: "point, tip"}
          - {w: "rendirse", d: "to surrender, yield"}
          - {w: "si no", d: "otherwise, or else"}
        diagram:
          - s: "Estábaselo con mucho sosiego mirando don Quijote"
            r: "main verb 1: Don Quijote was calmly watching it"
          - s: "saltó de su caballo"
            r: "main verb 2 (after 'y'): he jumped off his horse"
            under:
              - {s: "como lo vio caer", r: "when: as he saw him fall"}
          - {s: "y con mucha ligereza se llegó a él", r: "main verb 3: and nimbly went up to him"}
          - s: "le dijo"
            r: "main verb 4 (after 'y'): told him"
            under:
              - {s: "poniéndole la punta de la espada en los ojos", r: "how: holding the point of his sword to his eyes"}
              - {s: "que se rindiese", r: "what: to surrender"}
              - {s: "si no, que le cortaría la cabeza", r: "what, 2: otherwise he would cut off his head"}
        forms:
          - {w: "Estábaselo", f: "est- + -aba + se + lo → estar (to be), imperfect, he, with 'se' (for his part) and 'lo' (it: the scene) stuck on the end: modern 'se lo estaba mirando'. Cervantes hangs pronouns on the end of a conjugated verb that opens its clause. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "mirando", f: "mir- + -ando → gerund of mirar (to watch); estar + gerund = 'was watching'."}
          - {w: "mucho, mucha", f: "masculine to match 'sosiego', feminine to match 'ligereza'."}
          - {w: "lo vio", f: "v- + -io → ver (to see), preterite, he; 'lo' = him. ver's preterite: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "caer", f: "infinitive (to fall) after 'vio': 'saw him fall'."}
          - {w: "saltó", f: "salt- + -ó → saltar (to jump), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "se llegó", f: "lleg- + -ó → llegar (to arrive) with 'se': llegarse a = to go up to, preterite, he. Same -ar preterite."}
          - {w: "poniéndole", f: "pon- + -iendo + le → gerund of poner (to put) with 'le' (to him); accent added."}
          - {w: "le dijo", f: "dij- + -o → decir (to tell), preterite, he; 'le' = to him. decir's preterite: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "se rindiese", f: "rind- + -iese → rendirse (to surrender), imperfect subjunctive (-se form), he: 'that he should surrender'. The e of the stem becomes i: rindiese, rindieses, rindiese, rindiésemos, rindieseis, rindiesen. Subjunctive because 'decir que' here is an order."}
          - {w: "cortaría", f: "cortar + -ía → cortar (to cut), conditional, he: 'he would cut'. The conditional is the whole infinitive + -ía, -ías, -ía, -íamos, -íais, -ían. 'le' = from him."}
      - es: "Estaba el vizcaíno tan turbado que no podía responder palabra, y él lo pasara mal, según estaba ciego don Quijote, si las señoras del coche, que hasta entonces con gran desmayo habían mirado la pendencia, no fueran adonde estaba y le pidieran con mucho encarecimiento les hiciese tan gran merced y favor de perdonar la vida a aquel su escudero."
        literal: "Was the Biscayan so dazed that not he-could answer word, and he it would-have-passed badly, according-as was blind Don Quijote, if the ladies of-the coach, who until then with great dismay had watched the fight, not had-gone to-where he-was and him had-asked with much earnestness [that] to-them he-should-do so great mercy and favor of pardoning the life to that their squire."
        ormsby: "The Biscayan was so bewildered that he was unable to answer a word, and it would have gone hard with him, so blind was Don Quixote, had not the ladies in the coach, who had hitherto been watching the combat in great terror, hastened to where he stood and implored him with earnest entreaties to grant them the great grace and favour of sparing their squire’s life;"
        vocab:
          - {w: "turbado", d: "dazed, confused"}
          - {w: "pasarlo mal", d: "to have a bad time of it, fare badly"}
          - {w: "según", d: "here 'given how, so ... was'"}
          - {w: "ciego", d: "blind; here 'blind with rage'"}
          - {w: "coche", d: "coach, carriage"}
          - {w: "desmayo", d: "dismay, faintness"}
          - {w: "pendencia", d: "fight, quarrel"}
          - {w: "encarecimiento", d: "earnestness, insistence"}
          - {w: "merced", d: "favour, grace"}
          - {w: "escudero", d: "squire; here an escort, attendant"}
        diagram:
          - s: "Estaba el vizcaíno tan turbado"
            r: "main verb 1: the Biscayan was so dazed"
            under:
              - {s: "que no podía responder palabra", r: "result: that he could not answer a word"}
          - s: "él lo pasara mal"
            r: "main verb 2 (after 'y'): he would have fared badly"
            under:
              - {s: "según estaba ciego don Quijote", r: "why: so blind was Don Quijote"}
              - s: "si las señoras del coche"
                r: "condition: if the ladies of the coach [had not]"
                under:
                  - {s: "que hasta entonces con gran desmayo habían mirado la pendencia", r: "describes 'señoras': who had watched the fight in dismay till then"}
              - {s: "no fueran adonde estaba", r: "condition, verb 1: had not gone to where he was"}
              - s: "y le pidieran con mucho encarecimiento"
                r: "condition, verb 2: and begged him earnestly"
                under:
                  - {s: "les hiciese tan gran merced y favor de perdonar la vida a aquel su escudero", r: "what they begged: to do them the great favour of sparing their squire's life ('que' left out)"}
        forms:
          - {w: "Estaba", f: "est- + -aba → estar (to be), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "podía", f: "pod- + -ía → poder (to be able), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "responder", f: "infinitive (to answer) after 'podía'."}
          - {w: "lo pasara", f: "pas- + -ara → pasar (to pass; 'pasarlo mal' = fare badly), imperfect subjunctive (-ra form), he, used as a conditional: 'would have fared'. pasara, pasaras, pasara, pasáramos, pasarais, pasaran. Cervantes uses the -ra form where modern Spanish says 'lo habría pasado'."}
          - {w: "del", f: "de + el."}
          - {w: "habían mirado", f: "hab- + -ían + mirado → haber + the participle of mirar (to watch): pluperfect, they: 'had watched'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "gran", f: "grande clipped before a singular noun."}
          - {w: "fueran", f: "fu- + -eran → ir (to go), imperfect subjunctive (-ra form), they: 'had [not] gone'. fuera, fueras, fuera, fuéramos, fuerais, fueran (the same forms as ser). After 'si' the -ra form is the counterfactual."}
          - {w: "pidieran", f: "pid- + -ieran → pedir (to ask), imperfect subjunctive (-ra form), they: 'had begged'. The e becomes i: pidiera, pidieras, pidiera, pidiéramos, pidierais, pidieran."}
          - {w: "les hiciese", f: "hic- + -iese → hacer (to do), imperfect subjunctive (-se form), he; 'les' = to them. hiciese, hicieses, hiciese, hiciésemos, hicieseis, hiciesen. Subjunctive after a request; 'que' is left out."}
          - {w: "perdonar", f: "infinitive (to spare) after 'de'."}
          - {w: "aquel su", f: "demonstrative + possessive together, 'that their', an old construction."}
      - es: "A lo cual don Quijote respondió, con mucho entono y gravedad:"
        literal: "To that which Don Quijote answered, with much haughtiness and gravity:"
        ormsby: "to which Don Quixote replied with much gravity and dignity,"
        vocab:
