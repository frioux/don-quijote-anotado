          - {w: "castellano", d: "Castilian, the Spanish language"}
          - {w: "Cide Hamete Benengeli", d: "the fictional Arab historian of Don Quijote. 'Cide' is Arabic 'sidi' (lord), 'Hamete' is Hamid or Ahmed; 'Benengeli' has been read as 'son of the stag' or as a play on 'berenjena' (aubergine)"}
          - {w: "historiador", d: "historian, chronicler"}
        diagram:
