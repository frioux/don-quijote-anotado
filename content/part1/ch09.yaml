part: 1
chapter: 9
title_es: "Capítulo IX. Donde se concluye y da fin a la estupenda batalla que el gallardo vizcaíno y el valiente manchego tuvieron"
title_en: "In which is concluded and finished the terrific battle between the gallant Biscayan and the valiant Manchegan"
paragraphs:
  - sentences:
      - es: "Dejamos en la primera parte desta historia al valeroso vizcaíno y al famoso don Quijote con las espadas altas y desnudas, en guisa de descargar dos furibundos fendientes, tales que, si en lleno se acertaban, por lo menos se dividirían y fenderían de arriba abajo y abrirían como una granada;"
        literal: "We-left in the first part of-this history the valiant Biscayan and the famous Don Quijote with the swords high and naked, in guise of bringing-down two furious down-strokes, such that, if in full they-hit-home, at-the least they-would-divide-each-other and would-cleave from top to-bottom and would-open like a pomegranate;"
        ormsby: "In the First Part of this history we left the valiant Biscayan and the renowned Don Quixote with drawn swords uplifted, ready to deliver two such furious slashing blows that if they had fallen full and fair they would at least have split and cleft them asunder from top to toe and laid them open like a pomegranate;"
        vocab:
          - {w: "desta", d: "= de esta, 'of this'; Cervantes fuses 'de' with este, esta, ella, él (deste, desta, della, dél)"}
          - {w: "valeroso", d: "valiant, brave"}
          - {w: "vizcaíno", d: "Biscayan, from Vizcaya in the Basque country; in Castile the word could mean any Basque"}
          - {w: "desnudo", d: "naked; of a sword, drawn, out of its scabbard"}
          - {w: "en guisa de", d: "in the manner of, about to; 'guisa' is an old word for 'way, fashion'"}
          - {w: "descargar", d: "to unload; of a blow, to bring down, deliver"}
          - {w: "furibundo", d: "furious, raging"}
          - {w: "fendiente", d: "= hendiente, a downward cutting stroke of the sword; the old f- where modern Spanish has h-"}
          - {w: "tales que", d: "such that"}
          - {w: "en lleno", d: "full on, squarely"}
          - {w: "acertar", d: "to hit the mark, land (a blow)"}
          - {w: "fender", d: "= hender, to cleave, split"}
          - {w: "de arriba abajo", d: "from top to bottom"}
          - {w: "granada", d: "pomegranate (which splits open to show red seeds)"}
        diagram:
          - s: "Dejamos"
            r: "main verb: we left; 'we' = the narrator, in the ending"
            under:
              - {s: "en la primera parte desta historia", r: "where: in the first part of this history"}
              - {s: "al valeroso vizcaíno y al famoso don Quijote", r: "object: whom we left, with the 'a' used before persons"}
              - {s: "con las espadas altas y desnudas", r: "how: with swords raised and bare"}
              - s: "en guisa de descargar dos furibundos fendientes"
                r: "in the act of: about to bring down two furious blows"
                under:
                  - s: "tales que"
                    r: "describes the blows: such that"
                    under:
                      - {s: "si en lleno se acertaban", r: "condition: if they landed squarely"}
                      - {s: "por lo menos se dividirían y fenderían de arriba abajo", r: "result 1: at the least they would split each other from top to bottom"}
                      - {s: "y abrirían como una granada", r: "result 2: and lay each other open like a pomegranate"}
        forms:
          - {w: "Dejamos", f: "dej- + -amos → dejar (to leave), preterite, we: 'we left'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. The 'we' form of the preterite is the same as the present; the context decides."}
          - {w: "desta", f: "de + esta (of this). Cervantes fuses 'de' with este, esta, él, ella, ellos: deste, desta, dél, della, dellos. Modern Spanish keeps only 'del'."}
          - {w: "al ... al", f: "a + el. The 'a' is the personal 'a' that Spanish puts before a person who is the object of a verb; English does not translate it."}
          - {w: "valeroso", f: "valor + -oso: 'full of valor'. The ending -oso makes an adjective 'full of': valeroso, famoso, furioso."}
          - {w: "altas, desnudas", f: "alt- + -as, desnud- + -as → alto (high), desnudo (naked), feminine plural to match 'espadas'."}
          - {w: "descargar", f: "infinitive (to bring down) after 'de'."}
          - {w: "furibundos", f: "furibund- + -os → furibundo (furious), masculine plural to match 'fendientes'."}
          - {w: "fendientes", f: "fendiente + -s: plural of fendiente, old form of hendiente (a downward stroke), with the old f- for modern h-."}
          - {w: "tales", f: "tal + -es → 'such', plural to match 'fendientes'."}
          - {w: "se acertaban", f: "acert- + -aban → acertar (to hit the mark), imperfect, they, with 'se' (each other): 'if they landed on each other'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. After 'si' the imperfect sets up the 'what would happen' of a past scene."}
          - {w: "se dividirían", f: "dividir + -ían → dividir (to divide, split), conditional, they, with 'se' (each other): 'they would split each other'. The conditional is the whole infinitive + -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "fenderían", f: "fender + -ían → fender (= hender, to cleave), conditional, they: 'would cleave'. Same conditional: infinitive + -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "abrirían", f: "abrir + -ían → abrir (to open), conditional, they: 'would open'. Same conditional."}
        note: "In the 1605 edition Part I was divided into four 'parts'; Chapters 1 to 8 were the first, and this chapter opens the second. Chapter 8 broke off in mid-blow, claiming the author's source ran out, a trick borrowed from the romances of chivalry."
      - es: "y que en aquel punto tan dudoso paró y quedó destroncada tan sabrosa historia, sin que nos diese noticia su autor dónde se podría hallar lo que della faltaba."
        literal: "and that at that point so doubtful stopped and remained cut-off so tasty history, without that to-us might-give notice its author where one could find that which of-it was-lacking."
        ormsby: "and at this so critical point the delightful history came to a stop and stood cut short without any intimation from the author where what was missing was to be found."
        vocab:
          - {w: "punto", d: "point; here 'moment'"}
          - {w: "dudoso", d: "doubtful; here 'undecided, critical'"}
          - {w: "parar", d: "to stop"}
          - {w: "destroncado", d: "cut off, lopped (literally 'cut off at the trunk', from 'tronco')"}
          - {w: "sabroso", d: "tasty; of a story, delightful"}
          - {w: "dar noticia", d: "to inform, let know"}
          - {w: "della", d: "= de ella, 'of it'"}
          - {w: "faltar", d: "to be missing, be lacking"}
        diagram:
          - s: "Dejamos"
            r: "carried over from the previous sentence: 'y que' hangs loosely on it, 'and [we left off saying] that'"
            under:
              - s: "paró y quedó destroncada"
                r: "main verbs of the 'que' clause: stopped and was left cut short"
                under:
                  - {s: "en aquel punto tan dudoso", r: "when: at that so critical moment"}
                  - {s: "tan sabrosa historia", r: "subject: so delightful a history"}
                  - s: "sin que nos diese noticia su autor"
                    r: "how: without its author telling us"
                    under:
                      - {s: "dónde se podría hallar lo que della faltaba", r: "what he did not tell: where the missing part could be found"}
        forms:
          - {w: "aquel", f: "'that' (far off), masculine singular to match 'punto': aquel, aquella, aquellos, aquellas."}
          - {w: "paró", f: "par- + -ó → parar (to stop), preterite, it: 'stopped'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "quedó", f: "qued- + -ó → quedar (to remain, be left), preterite, it. Same -ar preterite."}
          - {w: "destroncada", f: "destronc- + -ada → participle of destroncar (to lop off), feminine to match 'historia'."}
          - {w: "sabrosa", f: "sabor + -osa → sabroso (tasty), feminine to match 'historia'."}
          - {w: "diese", f: "d- + -iese → dar (to give), imperfect subjunctive (-se form), he: 'should give'. dar: diese, dieses, diese, diésemos, dieseis, diesen (the -ra twin is diera). Subjunctive because 'sin que' (without) always takes it."}
          - {w: "se podría", f: "podr- + -ía → poder (to be able), conditional, one, with 'se' for 'one': 'one could'. The conditional of poder has a short stem: podría, podrías, podría, podríamos, podríais, podrían."}
          - {w: "hallar", f: "infinitive (to find) after 'podría'."}
          - {w: "lo que", f: "neuter 'lo' + 'que': 'that which, what'."}
          - {w: "della", f: "de + ella (of it; 'ella' = la historia)."}
          - {w: "faltaba", f: "falt- + -aba → faltar (to be missing), imperfect, it. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
  - sentences:
      - es: "Causóme esto mucha pesadumbre, porque el gusto de haber leído tan poco se volvía en disgusto, de pensar el mal camino que se ofrecía para hallar lo mucho que, a mi parecer, faltaba de tan sabroso cuento."
        literal: "Caused-me this much grief, because the pleasure of having read so little turned-itself into displeasure, from thinking the bad road that offered-itself to find the much that, to my seeming, was-lacking of so tasty tale."
        ormsby: "This distressed me greatly, because the pleasure derived from having read such a small portion turned to vexation at the thought of the poor chance that presented itself of finding the large part that, so it seemed to me, was missing of such an interesting tale."
        vocab:
          - {w: "pesadumbre", d: "grief, heaviness of heart (from 'pesado', heavy)"}
          - {w: "gusto", d: "pleasure, enjoyment"}
          - {w: "volverse en", d: "to turn into (modern 'volverse' or 'convertirse en')"}
          - {w: "disgusto", d: "displeasure, vexation; a false friend, not 'disgust'"}
          - {w: "mal camino", d: "bad road; here 'poor prospect, small chance'"}
          - {w: "ofrecerse", d: "to present itself"}
          - {w: "a mi parecer", d: "in my opinion, as it seemed to me"}
          - {w: "cuento", d: "tale, story"}
        diagram:
          - s: "Causóme"
            r: "main verb: caused me"
            under:
              - {s: "esto", r: "subject: this"}
              - {s: "mucha pesadumbre", r: "object: much grief"}
              - s: "porque el gusto de haber leído tan poco se volvía en disgusto"
                r: "why: the pleasure of having read so little turned to vexation"
                under:
                  - s: "de pensar el mal camino"
                    r: "cause of the vexation: from thinking of the poor prospect"
                    under:
                      - s: "que se ofrecía para hallar lo mucho"
                        r: "describes 'camino': that there was of finding the large part"
                        under:
                          - {s: "que, a mi parecer, faltaba de tan sabroso cuento", r: "describes 'lo mucho': that, as I thought, was missing from so good a tale"}
        forms:
          - {w: "Causóme", f: "caus- + -ó + me → causar (to cause), preterite, it, with 'me' (to me) stuck on the end: modern 'Me causó'. Cervantes hangs object pronouns on the end of a conjugated verb that opens its clause. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "esto", f: "neuter 'this [matter]'; esto, eso, aquello point at ideas rather than nouns."}
          - {w: "mucha", f: "much- + -a → mucho, feminine to match 'pesadumbre'."}
          - {w: "haber leído", f: "the infinitive haber + leído, the participle of leer (to read): 'having read', a perfect infinitive after 'de'."}
          - {w: "se volvía", f: "volv- + -ía → volver (to turn), imperfect, it, with 'se': 'was turning itself [into]'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "pensar", f: "infinitive (to think) after 'de': 'from thinking'."}
          - {w: "mal", f: "malo (bad) clipped before a masculine singular noun, like buen, gran, algún."}
          - {w: "se ofrecía", f: "ofrec- + -ía → ofrecer (to offer), imperfect, it, with 'se': 'offered itself'. Same -ía imperfect."}
          - {w: "lo mucho", f: "neuter 'lo' + adjective: 'the much, the large part'."}
          - {w: "parecer", f: "the infinitive parecer (to seem) used as a noun: 'my seeming', i.e. my opinion."}
          - {w: "faltaba", f: "falt- + -aba → faltar (to be missing), imperfect, it. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "sabroso", f: "sabor + -oso, masculine to match 'cuento'."}
      - es: "Parecióme cosa imposible y fuera de toda buena costumbre que a tan buen caballero le hubiese faltado algún sabio que tomara a cargo el escrebir sus nunca vistas hazañas, cosa que no faltó a ninguno de los caballeros andantes,"
        literal: "Seemed-to-me thing impossible and outside of all good custom that to so good knight to-him should-have lacked some sage who might-take in charge the writing his never seen deeds, thing that not lacked to none of the knights errant,"
        ormsby: "It appeared to me to be a thing impossible and contrary to all precedent that so good a knight should have been without some sage to undertake the task of writing his marvellous achievements; a thing that was never wanting to any of those knights-errant"
        vocab:
          - {w: "fuera de", d: "outside of; here 'against, contrary to'"}
          - {w: "costumbre", d: "custom, usage"}
          - {w: "sabio", d: "sage, wise man; in the romances, the enchanter-chronicler who records a knight's deeds"}
          - {w: "tomar a cargo", d: "to take charge of, undertake"}
          - {w: "escrebir", d: "= escribir, to write (old spelling)"}
          - {w: "nunca vistas", d: "never seen, unheard-of"}
          - {w: "hazaña", d: "feat, exploit"}
          - {w: "caballero andante", d: "knight-errant (literally 'walking, wandering knight')"}
        diagram:
          - s: "Parecióme"
            r: "main verb: it seemed to me"
            under:
              - {s: "cosa imposible y fuera de toda buena costumbre", r: "what it seemed: a thing impossible and against all custom"}
              - s: "que a tan buen caballero le hubiese faltado algún sabio"
                r: "subject: that so good a knight should have lacked a sage"
                under:
                  - {s: "que tomara a cargo el escrebir sus nunca vistas hazañas", r: "describes 'sabio': who would take on writing his unheard-of deeds"}
              - s: "cosa que no faltó a ninguno de los caballeros andantes"
                r: "comment: a thing no knight-errant ever lacked"
        forms:
          - {w: "Parecióme", f: "parec- + -ió + me → parecer (to seem), preterite, it, with 'me' (to me) stuck on the end: modern 'Me pareció'. Cervantes hangs object pronouns on the end of a conjugated verb that opens its clause. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "toda buena", f: "tod- + -a, buen- + -a → todo (all), bueno (good), feminine to match 'costumbre'."}
          - {w: "buen", f: "bueno clipped before a masculine singular noun ('caballero')."}
          - {w: "a tan buen caballero le", f: "'le' (to him) repeats 'a tan buen caballero'; Spanish often doubles an indirect object with a pronoun."}
          - {w: "hubiese faltado", f: "hub- + -iese + faltado → haber + the participle of faltar (to be lacking): pluperfect subjunctive, it: 'should have been lacking'. haber in the -se imperfect subjunctive: hubiese, hubieses, hubiese, hubiésemos, hubieseis, hubiesen. Subjunctive after 'cosa imposible ... que'."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun."}
          - {w: "tomara", f: "tom- + -ara → tomar (to take), imperfect subjunctive (-ra form), he: 'who would take'. Built on the preterite tomaron: tomara, tomaras, tomara, tomáramos, tomarais, tomaran. Subjunctive because the sage is only imagined."}
          - {w: "el escrebir", f: "article + infinitive used as a noun: 'the writing'. escrebir is the old spelling of escribir."}
          - {w: "sus", f: "su + -s → 'his', plural to match 'hazañas', not the owner."}
          - {w: "vistas", f: "vist- + -as → visto, the irregular participle of ver (to see), feminine plural to match 'hazañas'."}
          - {w: "faltó", f: "falt- + -ó → faltar (to be lacking), preterite, it. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "no ... ninguno", f: "Spanish doubles the negative: 'not ... to none' = to no one at all."}
          - {w: "andantes", f: "and- + -ante → andar (to walk, wander) + the -ante ending that makes an adjective 'doing': 'wandering'; plural to match 'caballeros'."}
  - sentences:
      - es: "de los que dicen las gentes que van a sus aventuras,"
        literal: "of those who say the people that go to their adventures,"
        ormsby: "who, they say, went after adventures;"
        vocab:
          - {w: "las gentes", d: "people; the plural is old and literary"}
          - {w: "ir a sus aventuras", d: "to go off after adventures"}
        diagram:
          - s: "caballeros andantes"
            r: "carried over from the previous sentence: the knights these words describe"
            under:
              - s: "de los que dicen las gentes"
                r: "which ones: those who, people say,"
                under:
                  - {s: "que van a sus aventuras", r: "what people say they do: ride off to their adventures; the 'que' is repeated after the interruption"}
        forms:
          - {w: "los que", f: "'those who': the article used as a pronoun + relative 'que'."}
          - {w: "dicen", f: "dic- + -en → decir (to say), present, they (the people). decir is irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "van", f: "ir (to go), present, they. ir is irregular: voy, vas, va, vamos, vais, van."}
          - {w: "sus", f: "su + -s → 'their', plural to match 'aventuras', not the owners."}
        note: "The Gutenberg text sets these words as a line of verse because they are a tag from the old Spanish ballads. Cervantes' first readers would have heard the ballad rhythm."
  - sentences:
      - es: "porque cada uno dellos tenía uno o dos sabios, como de molde, que no solamente escribían sus hechos, sino que pintaban sus más mínimos pensamientos y niñerías, por más escondidas que fuesen;"
        literal: "because each one of-them had one or two sages, as of mould, who not only wrote their deeds, but that painted their most minimal thoughts and childishnesses, for more hidden that they-might-be;"
        ormsby: "for every one of them had one or two sages as if made on purpose, who not only recorded their deeds but described their most trifling thoughts and follies, however secret they might be;"
        vocab:
          - {w: "dellos", d: "= de ellos, 'of them'"}
          - {w: "como de molde", d: "made to order, just right (literally 'as from a mould')"}
          - {w: "hechos", d: "deeds"}
          - {w: "no solamente ... sino que", d: "not only ... but also"}
          - {w: "pintar", d: "to paint; here 'to depict, describe'"}
          - {w: "mínimo", d: "smallest, least"}
          - {w: "niñería", d: "trifle, childish act (from 'niño')"}
          - {w: "por más ... que", d: "however ...: 'por más escondidas que fuesen' = however hidden they might be"}
          - {w: "escondido", d: "hidden, secret"}
        diagram:
          - s: "tenía"
            r: "main verb (after 'porque', why it seemed impossible): had"
            under:
              - {s: "cada uno dellos", r: "subject: each one of them"}
              - s: "uno o dos sabios"
                r: "object: one or two sages"
                under:
                  - {s: "como de molde", r: "how: just made for the job"}
                  - {s: "que no solamente escribían sus hechos", r: "describes 'sabios' 1: who not only wrote down their deeds"}
                  - s: "sino que pintaban sus más mínimos pensamientos y niñerías"
                    r: "describes 'sabios' 2: but also depicted their tiniest thoughts and follies"
                    under:
                      - {s: "por más escondidas que fuesen", r: "concession: however secret they were"}
        forms:
          - {w: "dellos", f: "de + ellos (of them). Cervantes fuses 'de' with él, ella, ellos, este: dél, della, dellos, deste."}
          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, he (each one). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "escribían", f: "escrib- + -ían → escribir (to write), imperfect, they (the sages). Same -ía imperfect."}
          - {w: "pintaban", f: "pint- + -aban → pintar (to paint, depict), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "sus", f: "su + -s → 'their', plural to match 'hechos' and 'pensamientos'."}
          - {w: "más mínimos", f: "mínim- + -os → mínimo (least), masculine plural to match 'pensamientos'. 'más mínimos' piles 'most' on a word that already means 'least': emphatic, 'the very tiniest'."}
          - {w: "escondidas", f: "escondid- + -as → escondido, participle of esconder (to hide), feminine plural to match 'niñerías', the nearer noun."}
          - {w: "fuesen", f: "fu- + -esen → ser (to be), imperfect subjunctive (-se form), they. ser: fuese, fueses, fuese, fuésemos, fueseis, fuesen. Subjunctive because 'por más ... que' (however ...) takes it."}
      - es: "y no había de ser tan desdichado tan buen caballero, que le faltase a él lo que sobró a Platir y a otros semejantes."
        literal: "and not had to be so unfortunate so good knight, that to-him might-lack to him that which was-left-over to Platir and to others similar."
        ormsby: "and such a good knight could not have been so unfortunate as not to have what Platir and others like him had in abundance."
        vocab:
          - {w: "haber de", d: "to be bound to, must; 'no había de ser' = could not possibly be"}
          - {w: "desdichado", d: "unlucky, unfortunate (from 'dicha', luck)"}
          - {w: "sobrar", d: "to be left over, be in abundance"}
          - {w: "Platir", d: "hero of 'Crónica del caballero Platir' (1533), a minor romance of the Palmerín cycle, much less famous than Amadís"}
          - {w: "semejante", d: "similar, like him"}
        diagram:
          - s: "no había de ser"
            r: "main verb (after 'y'): could not be"
            under:
              - {s: "tan buen caballero", r: "subject: so good a knight"}
              - s: "tan desdichado"
                r: "what: so unlucky"
                under:
                  - s: "que le faltase a él"
                    r: "result: that he should lack"
                    under:
                      - {s: "lo que sobró a Platir y a otros semejantes", r: "subject of 'faltase': what Platir and the like had to spare"}
        forms:
          - {w: "había de ser", f: "hab- + -ía → haber (to have), imperfect, it, + de + ser (to be): 'haber de' + infinitive = to be bound to. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "desdichado", f: "des- + dicha (luck) + -ado: 'un-lucked', masculine to match 'caballero'."}
          - {w: "buen", f: "bueno clipped before a masculine singular noun."}
          - {w: "le ... a él", f: "'le' (to him) doubled by 'a él' for emphasis; Spanish often says an indirect object twice."}
          - {w: "faltase", f: "falt- + -ase → faltar (to be lacking), imperfect subjunctive (-se form), it: 'should be lacking'. faltase, faltases, faltase, faltásemos, faltaseis, faltasen. Subjunctive in a result clause after a negative main verb."}
          - {w: "sobró", f: "sobr- + -ó → sobrar (to be left over), preterite, it. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "semejantes", f: "semejante + -s → plural to match 'otros'."}
