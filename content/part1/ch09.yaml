  - sentences:
      - es: "Si a ésta se le puede poner alguna objeción cerca de su verdad, no podrá ser otra sino haber sido su autor arábigo, siendo muy propio de los de aquella nación ser mentirosos; aunque, por ser tan nuestros enemigos, antes se puede entender haber quedado falto en ella que demasiado."
        literal: "If to this-one one can put some objection concerning its truth, not it-will-be-able to-be other but to-have been its author Arabic, being very proper of those of that nation to-be liars; although, for being so our enemies, rather one can understand to-have remained short in it than excessive."
        ormsby: "If against the present one any objection be raised on the score of its truth, it can only be that its author was an Arab, as lying is a very common propensity with those of that nation; though, as they are such enemies of ours, it is conceivable that there were omissions rather than additions made in the course of it."
        vocab:
          - {w: "ésta", d: "this one (this history)"}
          - {w: "poner objeción", d: "to raise an objection"}
          - {w: "cerca de", d: "here 'concerning, about' (old sense); today 'near'"}
          - {w: "propio de", d: "characteristic of, typical of"}
          - {w: "nación", d: "nation, people, race"}
          - {w: "mentiroso", d: "liar; lying"}
          - {w: "antes ... que", d: "rather ... than"}
          - {w: "falto", d: "short, lacking"}
          - {w: "demasiado", d: "excessive, overdone"}
        diagram:
          - s: "no podrá ser otra"
            r: "main verb 1: it can be no other"
            under:
              - {s: "Si a ésta se le puede poner alguna objeción cerca de su verdad", r: "condition: if any objection can be raised to its truth"}
              - s: "sino haber sido su autor arábigo"
                r: "than: that its author was an Arab"
                under:
                  - {s: "siendo muy propio de los de aquella nación ser mentirosos", r: "why that matters: lying being typical of that people"}
          - s: "antes se puede entender"
            r: "main verb 2 (after 'aunque'): one may rather suppose"
            under:
              - {s: "por ser tan nuestros enemigos", r: "why: since they are such enemies of ours"}
              - {s: "haber quedado falto en ella que demasiado", r: "what: that he fell short in it rather than overdid it"}
        forms:
          - {w: "ésta", f: "'this one', feminine for 'historia'; the old rule put an accent on the demonstrative when it stands alone as a pronoun."}
          - {w: "se le puede poner", f: "pued- + -e → poder (to be able), present, one, with 'se' for 'one' and 'le' (to it): 'one can raise against it'. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "alguna", f: "algun- + -a → alguno (some), feminine to match 'objeción'."}
          - {w: "podrá", f: "podr- + -á → poder, future, it. Short stem: podré, podrás, podrá, podremos, podréis, podrán."}
          - {w: "otra", f: "feminine to match 'objeción'."}
          - {w: "haber sido", f: "the infinitive haber + sido, the participle of ser: 'to have been', with its own subject 'su autor'."}
          - {w: "siendo", f: "sie- + -ndo → gerund of ser: 'being'."}
          - {w: "ser mentirosos", f: "infinitive ser (to be) as subject of 'siendo propio'; mentirosos is masculine plural to match 'los de aquella nación'."}
          - {w: "por ser", f: "'por' + infinitive = 'because of being'."}
          - {w: "nuestros", f: "nuestr- + -os → 'our', masculine plural to match 'enemigos'."}
          - {w: "haber quedado", f: "the infinitive haber + quedado, participle of quedar (to remain): 'to have remained'."}
          - {w: "falto, demasiado", f: "masculine singular: they describe the author."}
        note: "The slander of Moors as liars was a commonplace of the time. Cervantes turns it into a joke: an enemy chronicler would lie by leaving out the Spanish hero's praises, not by inventing them."
