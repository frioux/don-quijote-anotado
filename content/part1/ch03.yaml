          - {w: "tanta", f: "tant- + -a → tanto (so much), feminine to match 'claridad'. 'tanta ... que' = so much ... that."}
          - {w: "podía", f: "pod- + -ía → poder (can), imperfect, it (the light). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "el que", f: "'the one who': the article as a pronoun + 'que'; masculine because it is 'el sol' (the sun)."}
          - {w: "se la prestaba", f: "prest- + -aba → prestar (to lend), imperfect, he (the sun). 'se' stands for 'le' (to her, the moon), because le turns into 'se' before la; 'la' = it (the light, 'claridad'). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "hacía", f: "hac- + -ía → hacer (to do), imperfect, he. Same -ía imperfect."}
          - {w: "era bien visto", f: "era = ser (to be), imperfect, it (ser's imperfect: era, eras, era, éramos, erais, eran), + visto, the irregular participle of ver (to see): 'was seen'. 'de todos' = by all; old Spanish uses 'de' for 'by' in passives."}
      - es: "Antojósele en esto a uno de los arrieros que estaban en la venta ir a dar agua a su recua, y fue menester quitar las armas de don Quijote, que estaban sobre la pila; el cual, viéndole llegar, en voz alta le dijo:"
        literal: "Took-a-fancy-itself-to-him in this to one of the muleteers who were in the inn to-go to give water to his team, and it-was needful to-remove the arms of Don Quijote, which were upon the trough; the which, seeing-him arrive, in voice loud to-him said:"
        ormsby: "Meanwhile one of the carriers who were in the inn thought fit to water his team, and it was necessary to remove Don Quixote’s armour as it lay on the trough; but he seeing the other approach hailed him in a loud voice,"
        vocab:
