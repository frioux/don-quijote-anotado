          - s: "le dijo"
            r: "main verb 3: said to him"
            under:
              - {s: "el cual", r: "subject: who (Don Quijote)"}
              - {s: "viéndole llegar", r: "when: seeing him come"}
              - {s: "en voz alta", r: "how: loudly"}
        forms:
          - {w: "Antojósele", f: "antoj- + -ó + se + le → antojarse (to take someone's fancy), preterite, it, with 'se' and 'le' (to him) stuck on the end; modern 'se le antojó'. Built like gustar: the thing wanted is the subject, the person is 'le'. Cervantes hangs pronouns on the end of a conjugated verb that opens its clause. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "estaban", f: "est- + -aban → estar (to be, of place), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
