          - {w: "el que se la prestaba", d: "the one who lent it to her: the sun, who lends the moon her light"}
          - {w: "de manera que", d: "so that"}
          - {w: "cuanto", d: "everything that, all that"}
          - {w: "novel", d: "new, novice; 'novel caballero' is a term from the romances for a newly made knight"}
