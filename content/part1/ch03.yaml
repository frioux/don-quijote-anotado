          - {w: "alguno", f: "after the noun in a negative sentence it means 'none at all': 'no caso alguno' = no account whatever."}
          - {w: "tirad, llegad, venid", f: "commands, you (vosotros): the infinitive with -r changed to -d: tirar → tirad (throw), llegar → llegad (come near), venir → venid (come)."}
