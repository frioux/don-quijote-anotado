        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "andaba", f: "and- + -aba → andar (to go, to be), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "acertado", f: "acert- + -ado → acertar (to hit the mark), past participle as adjective, masculine to match Don Quijote: 'right'."}
          - {w: "deseaba", f: "dese- + -aba → desear (to desire), imperfect, he. Same -aba imperfect."}
          - {w: "pedía", f: "ped- + -ía → pedir (to ask for), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "tal prosupuesto", f: "'tal' (such) has one form for both genders; 'prosupuesto' is the old spelling of presupuesto."}
          - {w: "era", f: "ser (to be), imperfect, it. ser's imperfect is irregular: era, eras, era, éramos, erais, eran."}
          - {w: "principales", f: "principal + -es → plural to match 'caballeros'."}
          - {w: "parecía", f: "parec- + -ía → parecer (to seem), imperfect, he. Same -ía imperfect."}
          - {w: "gallarda", f: "gallard- + -a → gallardo (gallant), feminine to match 'presencia'."}
          - {w: "mostraba", f: "mostr- + -aba → mostrar (to show), imperfect, it (his bearing). Same -aba imperfect."}
      - es: "y que él, ansimesmo, en los años de su mocedad, se había dado a aquel honroso ejercicio, andando por diversas partes del mundo buscando sus aventuras, sin que hubiese dejado los Percheles de Málaga, Islas de Riarán, Compás de Sevilla, Azoguejo de Segovia, la Olivera de Valencia, Rondilla de Granada, Playa de Sanlúcar, Potro de Córdoba y las Ventillas de Toledo y otras diversas partes, donde había ejercitado la ligereza de sus pies, sutileza de sus manos, haciendo muchos tuertos, recuestando muchas viudas, deshaciendo algunas doncellas y engañando a algunos pupilos, y, finalmente, dándose a conocer por cuantas audiencias y tribunales hay casi en toda España;"
        literal: "and that he, likewise, in the years of his youth, himself had given to that honorable exercise, going through diverse parts of-the world seeking his adventures, without that he-might-have left-out the Percheles of Málaga, Islands of Riarán, Compás of Sevilla, Azoguejo of Segovia, the Olivera of Valencia, Rondilla of Granada, Beach of Sanlúcar, Potro of Córdoba and the Ventillas of Toledo and other diverse parts, where he-had exercised the lightness of his feet, subtlety of his hands, doing many wrongs, wooing many widows, undoing some maidens and deceiving [to] some wards, and, finally, giving-himself to be-known through as-many-as high-courts and tribunals there-are almost in all Spain;"
        ormsby: "and that he himself in his younger days had followed the same honourable calling, roaming in quest of adventures in various parts of the world, among others the Curing-grounds of Málaga, the Isles of Riarán, the Precinct of Seville, the Little Market of Segovia, the Olivera of Valencia, the Rondilla of Granada, the Strand of San Lúcar, the Colt of Cordova, the Taverns of Toledo, and divers other quarters, where he had proved the nimbleness of his feet and the lightness of his fingers, doing many wrongs, cheating many widows, ruining maids and swindling minors, and, in short, bringing himself under the notice of almost every tribunal and court of justice in Spain;"
        vocab:
          - {w: "ansimesmo", d: "= asimismo, likewise, also; archaic form"}
          - {w: "mocedad", d: "youth"}
          - {w: "darse a", d: "to take up, devote oneself to"}
          - {w: "honroso", d: "honorable"}
          - {w: "ejercicio", d: "calling, profession"}
          - {w: "sin que hubiese dejado", d: "without having left out, i.e. he went to every one of them"}
          - {w: "Percheles de Málaga ... Ventillas de Toledo", d: "real districts of Spanish cities notorious as haunts of rogues and petty criminals (the 'pícaro' underworld); Ormsby's note describes each"}
          - {w: "ligereza", d: "lightness, nimbleness"}
          - {w: "sutileza de manos", d: "sleight of hand, light fingers (i.e. pickpocketing)"}
          - {w: "tuerto", d: "a wrong, injury; knights 'deshacen tuertos' (right wrongs), he did them"}
          - {w: "recuestar", d: "= requestar, to woo, make advances to"}
          - {w: "deshacer doncellas", d: "to seduce maidens, a crude echo of the knight's 'deshacer agravios' (to undo wrongs)"}
          - {w: "pupilo", d: "ward, an orphan under a guardian"}
          - {w: "darse a conocer", d: "to make oneself known"}
          - {w: "audiencia", d: "high court of justice"}
        diagram:
          - s: "le dijo"
            r: "carried over from the previous sentence: he told him"
            under:
              - s: "y que él, ansimesmo, en los años de su mocedad, se había dado a aquel honroso ejercicio"
                r: "what he said, 3: that he too, in his youth, had taken up that honorable calling"
                under:
                  - {s: "andando por diversas partes del mundo buscando sus aventuras", r: "how: roaming the world seeking adventures"}
                  - s: "sin que hubiese dejado los Percheles de Málaga, Islas de Riarán, Compás de Sevilla, Azoguejo de Segovia, la Olivera de Valencia, Rondilla de Granada, Playa de Sanlúcar, Potro de Córdoba y las Ventillas de Toledo y otras diversas partes"
                    r: "how thoroughly: without missing any of these rogues' haunts"
                    under:
                      - s: "donde había ejercitado la ligereza de sus pies, sutileza de sus manos"
                        r: "describes the places: where he had exercised quick feet and light fingers"
                        under:
                          - {s: "haciendo muchos tuertos", r: "how, 1: doing many wrongs"}
                          - {s: "recuestando muchas viudas", r: "how, 2: wooing many widows"}
                          - {s: "deshaciendo algunas doncellas", r: "how, 3: ruining maidens"}
                          - {s: "y engañando a algunos pupilos", r: "how, 4: cheating orphans"}
                  - {s: "y, finalmente, dándose a conocer por cuantas audiencias y tribunales hay casi en toda España", r: "how it ended: getting himself known to nearly every court in Spain"}
        forms:
          - {w: "ansimesmo", f: "old form of asimismo (likewise): 'ansí' is old for 'así', and 'mesmo' old for 'mismo'."}
          - {w: "se había dado", f: "hab- + -ía + dado → haber + the participle of dar (to give), with 'se': pluperfect, he: 'had given himself'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "aquel honroso", f: "aquel (that, far off) and honros- + -o → honroso (honorable), both masculine to match 'ejercicio'."}
          - {w: "andando, buscando", f: "and- + -ando → andar (to go about), and busc- + -ando → buscar (to seek): gerunds, 'going about ... seeking'."}
          - {w: "hubiese dejado", f: "hub- + -iese + dejado → haber + the participle of dejar (to leave out): pluperfect subjunctive, he: 'had left out'. haber in the -se imperfect subjunctive: hubiese, hubieses, hubiese, hubiésemos, hubieseis, hubiesen. Subjunctive because 'sin que' (without) always takes it."}
          - {w: "diversas", f: "divers- + -as → diverso (various), feminine plural to match 'partes'."}
          - {w: "había ejercitado", f: "había + ejercitado → haber + the participle of ejercitar (to exercise): pluperfect, he: 'had exercised'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "haciendo", f: "hac- + -iendo → hacer (to do), gerund: 'doing'."}
          - {w: "recuestando", f: "recuest- + -ando → recuestar (to woo; modern requestar), gerund."}
          - {w: "deshaciendo", f: "des- + hac- + -iendo → deshacer (to undo), gerund."}
          - {w: "engañando", f: "engañ- + -ando → engañar (to deceive), gerund."}
          - {w: "muchos, muchas, algunas, algunos", f: "each agrees with its noun: muchos tuertos (m. pl.), muchas viudas (f. pl.), algunas doncellas (f. pl.), algunos pupilos (m. pl.)."}
          - {w: "dándose", f: "d- + -ando + se → dar (to give), gerund, with 'se' (himself) on the end: 'giving himself'; the accent keeps the stress on dán-. 'darse a conocer' = to make oneself known."}
          - {w: "cuantas", f: "cuant- + -as → 'as many as', feminine plural to match 'audiencias': 'every court there is'."}
          - {w: "hay", f: "haber, the special present form 'there is / there are'; it never changes."}
        ormsby_note: "The localities here mentioned were, and some of them still are, haunts of the rogue and vagabond, or, what would be called in Spain, the picaro class. The Curing-grounds of Málaga was a place outside the town where fish was dried; 'the Isles of Riarán' was the slang name of a low suburb of the same city; the Precinct (compas) of Seville was a district on the river side, not far from the plaza de toros; the Little Market of Segovia was in the hollow spanned by the great aqueduct on the south side of the town; the Olivera of Valencia was a small plaza in the middle of the town; the 'Rondilla of Granada' was probably in the Albayein quarter; the 'Strand of San Lúcar' and the 'Taverns of Toledo' explain themselves sufficiently; and the 'Colt of Cordova' was a district on the south side of the city, which took its name from a horse in stone standing over a fountain in its centre. As Fermín Caballero says in a queer little book called the Geographical Knowledge of Cervantes, it is clear that Cervantes knew by heart the 'Mapa picaresco de España.'"
        note: "The innkeeper's 'knightly' career is a point-by-point parody: a knight rights wrongs and protects widows, maidens and orphans, while he did wrongs, seduced widows, ruined maidens and cheated orphans. His 'adventures' ended in the law courts, and every place he names was a famous thieves' quarter."
      - es: "y que, a lo último, se había venido a recoger a aquel su castillo, donde vivía con su hacienda y con las ajenas, recogiendo en él a todos los caballeros andantes, de cualquiera calidad y condición que fuesen, sólo por la mucha afición que les tenía y porque partiesen con él de sus haberes, en pago de su buen deseo."
        literal: "and that, at the last, himself he-had come to retire to that his castle, where he-lived with his estate and with the others'[estates], taking-in in it [to] all the knights errant, of whatever quality and condition that they-might-be, only for the much fondness that for-them he-had and so-that they-might-share with him of their possessions, in payment of his good will."
        ormsby: "until at last he had retired to this castle of his, where he was living upon his property and upon that of others; and where he received all knights-errant of whatever rank or condition they might be, all for the great love he bore them and that they might share their substance with him in return for his benevolence."
        vocab:
          - {w: "a lo último", d: "at last, in the end"}
          - {w: "recogerse", d: "to retire, withdraw (to a quiet life)"}
          - {w: "aquel su castillo", d: "that castle of his; demonstrative + possessive together is old style"}
          - {w: "hacienda", d: "property, wealth"}
          - {w: "ajeno", d: "belonging to someone else"}
          - {w: "recoger", d: "to take in, give shelter to; a play on 'recogerse' just before"}
