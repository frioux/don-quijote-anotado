        note: "The innkeeper waives the bill just to be rid of him, so his fine advice about carrying money costs him the price of a supper and a night's straw and barley."
summary: |
  After his supper at the inn, Don Quijote shuts himself in the stable with the innkeeper, kneels, and refuses to rise until the 'lord of the castle' grants him a boon. The boon is to be dubbed a knight the next morning, after keeping vigil over his arms that night in the castle chapel.

  The innkeeper, a sly old rogue, decides to play along for the fun of it. He claims he too was a knight-errant in his youth, naming a list of thieves' quarters across Spain as the scenes of his adventures, and says the chapel has been pulled down, so the vigil can be kept in the yard. He also tells Don Quijote that knights-errant always carried money, clean shirts and ointments, whatever the books say, and advises him never to travel without them.

  Don Quijote keeps his vigil by moonlight, pacing beside a water trough with his armor laid on it while the inn's guests watch. When a muleteer moves the armor to water his animals, Don Quijote prays to Dulcinea and knocks him senseless with his lance; he splits open the head of a second muleteer who does the same. The other muleteers stone him from a distance until the innkeeper, shouting that the man is mad and cannot be punished, gets them to stop.

  Alarmed, the innkeeper hurries the ceremony. Reading from his ledger of straw and barley as if it were a prayer book, he strikes Don Quijote on the neck and taps him on the shoulder with his sword. The two prostitutes from the doorway gird on his sword and buckle on his spur, and Don Quijote asks them to call themselves Doña Tolosa and Doña Molinera. Now a knight, he saddles Rocinante, thanks his host in extravagant language, and rides off; the innkeeper, glad to be rid of him, does not charge him for his stay.
context: |
  The dubbing of a knight. A knight had to be made by another knight: this is the gap Don Quijote noticed at the end of Chapter 2. The real rite, set down in the medieval law code of Alfonso X (the Siete Partidas) and in the romances, included a night's vigil over the arms in a church, a blow on the neck (pescozada) or a stroke of the sword on the shoulder (espaldarazo), and the girding of the sword and fastening of the spurs, which in the romances ladies sometimes perform. Every element appears here, each debased: the chapel is a stable yard, the missal is a feed ledger, the ladies are prostitutes, and the ceremony is rushed through to get a dangerous lunatic off the premises. The request for an unnamed 'don' (boon) before the lord knows what it is, and the knight's refusal to rise until it is granted, are stock scenes from Amadís de Gaula and its successors.

  The innkeeper and the picaresque. The innkeeper's autobiography is a parody of knightly service turned inside out: a knight rights wrongs and protects widows, maidens and orphans, while he did wrongs, seduced widows, ruined maidens and cheated wards. The places he names (the Percheles of Málaga, the Azoguejo of Segovia, the Potro of Córdoba and the rest) were notorious haunts of thieves and vagabonds, the world of the picaresque novel, which was the popular genre of the moment. Ormsby's note quotes Fermín Caballero's remark that Cervantes knew the 'Mapa picaresco de España' by heart. His remark that he lives 'on his own property and other people's' tells the reader what kind of host he is.

  Money and the romances. The innkeeper's argument that knights must have carried money and clean shirts, even if the books never mention it, is one of Cervantes' central jokes: the romances leave out everything ordinary, and Don Quijote, reading them as history, takes the silence as fact. Ormsby notes that a 'blanca' was worth about a seventh of a farthing. The healing waters brought by dwarfs on clouds are straight out of the romances, and Ormsby admits that the passage about saddlebags 'as if it were something else of more importance' makes no sense as printed.

  The law of madness. The innkeeper's shout that Don Quijote would go free even if he killed them all reflects real law: the insane were not held criminally responsible. From here on the other characters increasingly treat him as a madman to be humored or managed.

  Names and titles. 'La Tolosa' and 'la Molinera' are nicknames of the kind given to lower-class women, the article marking them as such. 'Don' and 'doña' were titles for people of rank, and their spread to anyone who could claim them was a common target of satire; conferring 'doña' on two prostitutes is the chapter's last joke, and it echoes the 'don' (boon) Don Quijote asked for at the beginning. The innkeeper, whom the narrator ironically calls 'el castellano' (the castellan), is never named.

  Reading Cervantes' Spanish. This chapter adds the chivalric register Don Quijote uses when he speaks: the old initial f- (fasta, fazañas, fermosura), 'vos' and its forms (os, vuestro, habéis, acorredme) for people he honors, 'tú' for enemies and, in his second prayer, for Dulcinea, and the vosotros commands in -d (tirad, llegad, venid). Note also the future subjunctive 'pudiéredes', with its old -des ending, now found only in legal language; the old preterite 'trujo / trujeron' for trajo / trajeron; spellings like ansimesmo, prosupuesto, escrebir, recebir, desculpar, eceto and estraño; 'luego' meaning 'at once'; 'huésped' meaning both guest and host; and the familiar habits from Chapter 1: pronouns hung on the verb (Díjole, Preguntóle, Antojósele, diole), contractions with de (deste, desto, della, dellas), the -ra subjunctive as a conditional (fuera, tuviera, volviera, diera), and leísmo ('le' for 'him').
