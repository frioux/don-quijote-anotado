part: 1
chapter: 3
title_es: "Capítulo III. Donde se cuenta la graciosa manera que tuvo don Quijote en armarse caballero"
title_en: "Wherein is related the droll way in which Don Quixote had himself dubbed a knight"
paragraphs:
  - sentences:
      - es: "Y así, fatigado deste pensamiento, abrevió su venteril y limitada cena; la cual acabada, llamó al ventero, y, encerrándose con él en la caballeriza, se hincó de rodillas ante él, diciéndole:"
        literal: "And thus, wearied of-this thought, he-cut-short his inn-style and limited supper; the which finished, he-called to-the innkeeper, and, shutting-himself-in with him in the stable, he-knelt-himself of knees before him, saying-to-him:"
        ormsby: "Harassed by this reflection, he made haste with his scanty pothouse supper, and having finished it called the landlord, and shutting himself into the stable with him, fell on his knees before him, saying,"
        vocab:
          - {w: "fatigado", d: "wearied, troubled; 'fatigar' = to tire, to harass"}
          - {w: "deste", d: "= de este, 'of this'; Cervantes fuses 'de' with este, ella, él (deste, della, dél)"}
          - {w: "pensamiento", d: "thought; here his worry that he has not yet been dubbed a knight"}
          - {w: "abreviar", d: "to cut short, hurry through"}
          - {w: "venteril", d: "fit for a 'venta' (roadside inn); a comic coinage, like 'pothouse' in Ormsby"}
          - {w: "limitado", d: "scanty, meagre"}
          - {w: "la cual acabada", d: "which being finished; an absolute participle phrase"}
          - {w: "ventero", d: "innkeeper, keeper of a 'venta'"}
          - {w: "encerrarse", d: "to shut oneself in"}
          - {w: "caballeriza", d: "stable"}
          - {w: "hincarse de rodillas", d: "to kneel down (literally 'to plant oneself on one's knees')"}
          - {w: "ante", d: "before, in front of"}
        diagram:
          - s: "abrevió"
            r: "main verb 1: he hurried through; the subject 'he' is in the ending"
            under:
              - {s: "fatigado deste pensamiento", r: "how he was: troubled by this thought"}
              - {s: "su venteril y limitada cena", r: "object: his scanty inn supper"}
          - s: "llamó al ventero"
            r: "main verb 2: he called the innkeeper"
            under:
              - {s: "la cual acabada", r: "when: once the supper was finished"}
          - s: "se hincó de rodillas ante él"
            r: "main verb 3 (after 'y'): he knelt before him"
            under:
              - {s: "encerrándose con él en la caballeriza", r: "how: shutting himself in the stable with him"}
              - {s: "diciéndole:", r: "how: saying to him (the speech follows)"}
        forms:
          - {w: "fatigado", f: "fatig- + -ado → fatigar (to weary), past participle used as an adjective, masculine singular to match Don Quijote: 'wearied'."}
          - {w: "deste", f: "de + este (of this), masculine to match 'pensamiento'. Cervantes fuses 'de' with este, ella, él, ellos: deste, della, dél, dellos; modern Spanish writes them apart."}
          - {w: "abrevió", f: "abrevi- + -ó → abreviar (to cut short), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "venteril", f: "vent- + -eril → from venta (inn) + an adjective ending: 'inn-ish'. One form for both genders; here it describes 'cena'."}
          - {w: "limitada", f: "limit- + -ada → limitar (to limit), participle used as an adjective, feminine to match 'cena'."}
          - {w: "la cual acabada", f: "'la cual' (which) = the supper, feminine; acab- + -ada → acabar (to finish), past participle, feminine to agree with it. An absolute participle: noun + participle = 'the supper being finished'."}
          - {w: "llamó", f: "llam- + -ó → llamar (to call), preterite, he. Same -ar preterite."}
          - {w: "al", f: "a + el. The 'a' marks a person as the object ('personal a')."}
          - {w: "encerrándose", f: "encerr- + -ando + se → encerrar (to shut in), gerund, with 'se' (himself) on the end: 'shutting himself in'. Pronouns attach to the end of a gerund, and the accent is added to keep the stress on -rán-."}
          - {w: "se hincó", f: "hinc- + -ó → hincar (to plant, drive in), preterite, he, with 'se': 'hincarse de rodillas' = to kneel. Same -ar preterite."}
          - {w: "diciéndole", f: "dic- + -iendo + le → decir (to say), gerund, with 'le' (to him) on the end: 'saying to him'. decir changes e to i in the gerund (diciendo); the accent keeps the stress on -cién-."}
        ormsby_note: "'Pothouse', venteril, i.e. such as only a venta could produce."
  - sentences:
      - es: "— No me levantaré jamás de donde estoy, valeroso caballero, fasta que la vuestra cortesía me otorgue un don que pedirle quiero, el cual redundará en alabanza vuestra y en pro del género humano."
        literal: "— Not myself I-will-raise ever from where I-am, valiant knight, until that the your courtesy to-me grant a boon that to-ask-of-you I-want, the which will-redound in praise yours and in favor of-the race human."
        ormsby: "“From this spot I rise not, valiant knight, until your courtesy grants me the boon I seek, one that will redound to your praise and the benefit of the human race.”"
        vocab:
          - {w: "levantarse", d: "to get up, rise"}
          - {w: "jamás", d: "never; with 'no' before the verb it is still 'never' (double negative)"}
          - {w: "valeroso", d: "valiant, brave"}
          - {w: "fasta", d: "= hasta, 'until'; the old initial f- of the romances, which Don Quijote uses to sound like a knight"}
          - {w: "la vuestra cortesía", d: "your courtesy, i.e. 'you'; article + 'vuestra' is the antique courtly style"}
          - {w: "otorgar", d: "to grant"}
          - {w: "don", d: "boon, gift; also the title 'Don'"}
          - {w: "redundar en", d: "to redound to, result in"}
          - {w: "alabanza", d: "praise"}
          - {w: "en pro de", d: "for the benefit of, in favor of"}
          - {w: "género humano", d: "mankind, the human race"}
        diagram:
          - s: "No me levantaré jamás"
            r: "main verb: I will never get up"
            under:
              - {s: "de donde estoy", r: "from where: from where I am"}
              - {s: "valeroso caballero", r: "address: valiant knight"}
              - s: "fasta que la vuestra cortesía me otorgue un don"
                r: "until: until your courtesy grants me a boon"
                under:
                  - {s: "que pedirle quiero", r: "describes 'don': that I want to ask of you"}
                  - {s: "el cual redundará en alabanza vuestra y en pro del género humano", r: "describes 'don': which will bring you praise and help mankind"}
        forms:
          - {w: "me levantaré", f: "levantar + -é → levantarse (to get up), future, I, with 'me' (myself): 'I will get up'. The future is the whole infinitive + -é, -ás, -á, -emos, -éis, -án."}
          - {w: "estoy", f: "estar (to be, of place and state), present, I: 'I am'. estoy, estás, está, estamos, estáis, están."}
          - {w: "fasta", f: "old spelling of hasta (until); many words that now start with h- began with f- (fermosura, fazaña, fablar)."}
          - {w: "vuestra", f: "vuestr- + -a → 'your', the possessive of 'vos' (the respectful 'you' of the romances), feminine to match 'cortesía'. The article before a possessive ('la vuestra') is archaic. Placed after the noun ('alabanza vuestra') it means 'of yours'."}
          - {w: "otorgue", f: "otorg- + -ue → otorgar (to grant), present subjunctive, it (your courtesy): 'grants'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en; g becomes gu before e to keep the hard sound. Subjunctive because 'hasta que' points to an event still in the future."}
          - {w: "pedirle", f: "pedir (to ask for) + le (of you): infinitive with the pronoun on the end."}
          - {w: "quiero", f: "quier- + -o → querer (to want), present, I. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren. Here put last for a solemn ring: 'que pedirle quiero' = 'that I wish to ask of you'."}
          - {w: "el cual", f: "'which', masculine to match 'don'; a heavier, more formal 'que'."}
          - {w: "redundará", f: "redundar + -á → redundar (to redound), future, it. The future is the whole infinitive + -é, -ás, -á, -emos, -éis, -án."}
          - {w: "del", f: "de + el."}
        note: "Don Quijote copies a stock scene of the romances: a young man kneels and asks a lord for an unnamed boon, and honor obliges the lord to grant it before he knows what it is. The word 'don' (boon) will come back at the end of the chapter as the title 'Don'."
  - sentences:
      - es: "El ventero, que vio a su huésped a sus pies y oyó semejantes razones, estaba confuso mirándole, sin saber qué hacerse ni decirle, y porfiaba con él que se levantase, y jamás quiso, hasta que le hubo de decir que él le otorgaba el don que le pedía."
        literal: "The innkeeper, who saw [to] his guest at his feet and heard such reasonings, was confused looking-at-him, without knowing what to-do-himself nor to-say-to-him, and insisted with him that he-should-raise-himself, and never he-was-willing, until that to-him he-had to say that he to-him granted the boon that he of-him asked."
        ormsby: "The landlord, seeing his guest at his feet and hearing a speech of this kind, stood staring at him in bewilderment, not knowing what to do or say, and entreating him to rise, but all to no purpose until he had agreed to grant the boon demanded of him."
        vocab:
          - {w: "huésped", d: "guest (also 'host' in older Spanish; here the guest)"}
          - {w: "semejante", d: "such, of that kind"}
          - {w: "razones", d: "words, speech (not 'reasons')"}
          - {w: "confuso", d: "bewildered, at a loss"}
          - {w: "qué hacerse", d: "what to do with himself"}
          - {w: "porfiar", d: "to insist, keep on at someone"}
          - {w: "jamás quiso", d: "he never would, he flatly refused"}
          - {w: "haber de", d: "to have to"}
        diagram:
          - s: "estaba confuso mirándole"
            r: "main verb 1: was bewildered, looking at him"
            under:
              - s: "El ventero"
                r: "subject"
                under:
                  - {s: "que vio a su huésped a sus pies y oyó semejantes razones", r: "describes 'ventero': who saw his guest at his feet and heard such words"}
              - {s: "sin saber qué hacerse ni decirle", r: "how: not knowing what to do or say"}
          - s: "y porfiaba con él"
            r: "main verb 2: and kept insisting with him"
            under:
              - {s: "que se levantase", r: "what he insisted on: that he get up"}
          - s: "y jamás quiso"
            r: "main verb 3: and he (Don Quijote) never would"
            under:
              - s: "hasta que le hubo de decir"
                r: "until: until he (the innkeeper) had to tell him"
                under:
                  - s: "que él le otorgaba el don"
                    r: "what he had to say: that he granted him the boon"
                    under:
                      - {s: "que le pedía", r: "describes 'don': that he was asking of him"}
        forms:
          - {w: "vio", f: "v- + -io → ver (to see), preterite, he. ver's preterite is short: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "a su huésped", f: "the 'a' marks a person as the object ('personal a'); English has no equivalent."}
          - {w: "oyó", f: "oy- + -ó → oír (to hear), preterite, he; the i between vowels becomes y: oí, oíste, oyó, oímos, oísteis, oyeron."}
          - {w: "semejantes", f: "semejante + -s → plural to match 'razones'."}
          - {w: "estaba", f: "est- + -aba → estar (to be, of state), imperfect, he: 'was'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "mirándole", f: "mir- + -ando + le → mirar (to look at), gerund, with 'le' (him) on the end; the accent keeps the stress on -rán-. 'le' for a male person as direct object is leísmo: strict grammar wants 'lo', but Castilian writers use 'le'."}
          - {w: "hacerse, decirle", f: "infinitives after 'qué' (what to): hacer (to do) + se (with himself), decir (to say) + le (to him)."}
          - {w: "porfiaba", f: "porfi- + -aba → porfiar (to insist), imperfect, he. Same -aba imperfect."}
          - {w: "se levantase", f: "levant- + -ase → levantarse (to get up), imperfect subjunctive (-se form), he. The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. Subjunctive because it reports a request made in the past."}
          - {w: "quiso", f: "quis- + -o → querer (to want), preterite, he; negated in the preterite it means 'refused'. Irregular: quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "hubo de decir", f: "hub- + -o → haber (to have), preterite, he, + 'de' + infinitive decir (to say): 'had to say'. haber's preterite: hube, hubiste, hubo, hubimos, hubisteis, hubieron."}
          - {w: "otorgaba", f: "otorg- + -aba → otorgar (to grant), imperfect, he. Same -aba imperfect."}
          - {w: "pedía", f: "ped- + -ía → pedir (to ask for), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
  - sentences:
      - es: "— No esperaba yo menos de la gran magnificencia vuestra, señor mío — respondió don Quijote—;"
        literal: "— Not expected I less from the great magnificence yours, lord mine — answered Don Quijote—;"
        ormsby: "“I looked for no less, my lord, from your High Magnificence,” replied Don Quixote,"
        vocab:
          - {w: "esperar", d: "to expect (also 'to hope', 'to wait')"}
          - {w: "magnificencia", d: "magnificence, munificence; used here almost as a title, like 'Your Highness'"}
          - {w: "señor mío", d: "my lord; the possessive after the noun is formal and emphatic"}
        diagram:
          - s: "No esperaba yo menos"
            r: "main verb: I expected no less"
            under:
              - {s: "de la gran magnificencia vuestra", r: "from whom: from your great magnificence"}
              - {s: "señor mío", r: "address: my lord"}
          - {s: "respondió don Quijote", r: "frame: Don Quijote answered"}
        forms:
          - {w: "esperaba", f: "esper- + -aba → esperar (to expect), imperfect, I. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban; the I and he forms are the same, so 'yo' is added."}
          - {w: "yo", f: "the subject pronoun 'I', used here for emphasis and because 'esperaba' could be 'he' as well."}
          - {w: "gran", f: "grande clipped before a singular noun; before the noun it means 'great', after it 'big'."}
          - {w: "vuestra", f: "vuestr- + -a → 'your', the possessive of 'vos' (the respectful 'you'), feminine to match 'magnificencia'. After the noun it means 'of yours'."}
          - {w: "mío", f: "the long possessive 'my', placed after the noun: 'señor mío' = 'my lord'. mío, mía, míos, mías."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
      - es: "y así, os digo que el don que os he pedido, y de vuestra liberalidad me ha sido otorgado, es que mañana en aquel día me habéis de armar caballero, y esta noche en la capilla deste vuestro castillo velaré las armas;"
        literal: "and thus, to-you I-say that the boon that of-you I-have asked, and by your liberality to-me has been granted, is that tomorrow in that day me you-have to arm knight, and this night in the chapel of-this your castle I-will-watch the arms;"
        ormsby: "and I have to tell you that the boon I have asked and your liberality has granted is that you shall dub me knight tomorrow morning, and that tonight I shall watch my arms in the chapel of this your castle;"
        vocab:
          - {w: "os", d: "you, to you: the object pronoun of 'vos' (the respectful 'you') and of 'vosotros'"}
          - {w: "liberalidad", d: "generosity, open-handedness"}
          - {w: "mañana en aquel día", d: "tomorrow on that day; a redundant formula copied from the romances"}
          - {w: "haber de", d: "to have to, to be to: 'me habéis de armar' = you are to dub me"}
          - {w: "armar caballero", d: "to dub (someone) a knight; literally 'to arm (someone as a) knight'"}
          - {w: "capilla", d: "chapel"}
          - {w: "castillo", d: "castle; he sees the inn as a castle"}
          - {w: "velar las armas", d: "to keep vigil over one's arms, the all-night watch before knighthood"}
        diagram:
          - s: "os digo"
            r: "main verb: I tell you"
            under:
              - s: "que el don"
                r: "what I tell you: that the boon (its verb is 'es')"
                under:
                  - {s: "que os he pedido", r: "describes 'don': that I have asked of you"}
                  - {s: "y de vuestra liberalidad me ha sido otorgado", r: "describes 'don': and that your generosity has granted me"}
              - s: "es que mañana en aquel día me habéis de armar caballero"
                r: "is: that tomorrow you are to dub me knight"
              - s: "y esta noche en la capilla deste vuestro castillo velaré las armas"
                r: "and: tonight I will keep vigil over my arms in your chapel"
        forms:
          - {w: "os digo", f: "dig- + -o → decir (to say), present, I, with 'os' (to you) in front. decir is irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "he pedido", f: "he + pedido → haber + the participle of pedir (to ask for): present perfect, I: 'I have asked'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "ha sido otorgado", f: "ha + sido + otorgado → haber + participle of ser + participle of otorgar (to grant): present perfect passive, it: 'has been granted'. 'otorgado' is masculine to match 'don'."}
          - {w: "es", f: "ser (to be), present, it: 'is'. soy, eres, es, somos, sois, son."}
          - {w: "habéis de armar", f: "hab- + -éis → haber, present, you (vos), + 'de' + infinitive armar (to arm): 'you are to dub'. haber in the present: he, has, ha, hemos, habéis, han. The -éis form is used for 'vos', the courtly 'you' to one person."}
          - {w: "deste", f: "de + este (of this), masculine to match 'castillo'."}
          - {w: "vuestro", f: "vuestr- + -o → 'your', masculine to match 'castillo'. 'este vuestro castillo' = 'this castle of yours'; demonstrative + possessive together is old style."}
          - {w: "velaré", f: "velar + -é → velar (to keep vigil), future, I: 'I will watch'. The future is the whole infinitive + -é, -ás, -á, -emos, -éis, -án."}
        note: "The vigil of arms was a real rite: the candidate spent the night before his knighting praying in a chapel beside his armor. Because Don Quijote sees the inn as a castle, he assumes it has a chapel."
      - es: "y mañana, como tengo dicho, se cumplirá lo que tanto deseo, para poder, como se debe, ir por todas las cuatro partes del mundo buscando las aventuras, en pro de los menesterosos, como está a cargo de la caballería y de los caballeros andantes, como yo soy, cuyo deseo a semejantes fazañas es inclinado."
        literal: "and tomorrow, as I-have said, will-be-fulfilled that which so-much I-desire, to be-able, as one-ought, to-go through all the four parts of-the world seeking the adventures, in favor of the needy, as is in charge of the chivalry and of the knights errant, as I am, whose desire to such deeds is inclined."
        ormsby: "thus tomorrow, as I have said, will be accomplished what I so much desire, enabling me lawfully to roam through all the four quarters of the world seeking adventures on behalf of those in distress, as is the duty of chivalry and of knights-errant like myself, whose ambition is directed to such deeds.”"
        vocab:
          - {w: "tengo dicho", d: "I have said; 'tener' + participle is an older, emphatic 'haber' + participle"}
          - {w: "cumplirse", d: "to be fulfilled, come true"}
          - {w: "como se debe", d: "as is proper, as one should"}
          - {w: "las cuatro partes del mundo", d: "the four quarters of the world, i.e. everywhere"}
          - {w: "en pro de", d: "for the benefit of"}
          - {w: "menesteroso", d: "needy, in distress"}
          - {w: "estar a cargo de", d: "to be the duty of, to fall to"}
          - {w: "caballero andante", d: "knight-errant, a wandering knight ('andar' = to go about)"}
          - {w: "fazaña", d: "= hazaña, feat, deed; old initial f-"}
          - {w: "inclinado a", d: "inclined to, bent on"}
        diagram:
          - s: "se cumplirá"
            r: "main verb: will be fulfilled"
            under:
              - {s: "y mañana", r: "when: tomorrow"}
              - {s: "como tengo dicho", r: "aside: as I have said"}
              - {s: "lo que tanto deseo", r: "subject: what I so desire"}
              - s: "para poder"
                r: "purpose: so that I can"
                under:
                  - {s: "como se debe", r: "aside: as is proper"}
                  - {s: "ir por todas las cuatro partes del mundo buscando las aventuras", r: "what: go all over the world seeking adventures"}
                  - {s: "en pro de los menesterosos", r: "for whom: for the needy"}
                  - s: "como está a cargo de la caballería y de los caballeros andantes"
                    r: "as: as is the duty of chivalry and of knights-errant"
                    under:
                      - {s: "como yo soy", r: "aside: as I am"}
                      - {s: "cuyo deseo a semejantes fazañas es inclinado", r: "describes the knights: whose desire is bent on such deeds"}
        forms:
          - {w: "tengo dicho", f: "teng- + -o → tener (to have), present, I, + dicho, the irregular participle of decir (to say): 'I have said'. tener is irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "se cumplirá", f: "cumplir + -á → cumplir (to fulfil), future, it, with 'se' making it passive: 'will be fulfilled'. The future is the whole infinitive + -é, -ás, -á, -emos, -éis, -án."}
          - {w: "lo que", f: "neuter 'lo' + 'que' = 'what, that which'."}
          - {w: "deseo", f: "dese- + -o → desear (to desire), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. Later in the sentence 'deseo' is the noun 'desire'."}
          - {w: "poder", f: "infinitive (to be able) after 'para' (in order to); 'ir' (to go) is the infinitive after poder."}
          - {w: "se debe", f: "deb- + -e → deber (ought), present, it, with impersonal 'se': 'as one ought'. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "buscando", f: "busc- + -ando → buscar (to seek), gerund: 'seeking'."}
          - {w: "está", f: "estar (to be), present, it: 'estar a cargo de' = to be the duty of. estoy, estás, está, estamos, estáis, están."}
          - {w: "andantes", f: "and- + -ante → andar (to go about) + -ante, the ending that makes a present participle into an adjective ('going, wandering'); plural to match 'caballeros'."}
          - {w: "soy", f: "ser (to be), present, I. soy, eres, es, somos, sois, son."}
          - {w: "cuyo", f: "cuy- + -o → 'whose', masculine singular to match 'deseo', the thing owned, not the owner: cuyo, cuya, cuyos, cuyas."}
          - {w: "fazañas", f: "old spelling of hazañas (deeds), feminine plural; 'semejantes' is plural to match it."}
          - {w: "inclinado", f: "inclin- + -ado → inclinar (to incline), past participle as adjective, masculine to match 'deseo'."}
  - sentences:
      - es: "El ventero, que, como está dicho, era un poco socarrón y ya tenía algunos barruntos de la falta de juicio de su huésped, acabó de creerlo cuando acabó de oírle semejantes razones, y, por tener qué reír aquella noche, determinó de seguirle el humor;"
        literal: "The innkeeper, who, as is said, was a little sly-joker and already had some inklings of the lack of judgment of his guest, finished to believe-it when he-finished hearing-from-him such reasonings, and, for to-have what to-laugh-at that night, determined of following-to-him the humor;"
        ormsby: "The landlord, who, as has been mentioned, was something of a wag, and had already some suspicion of his guest’s want of wits, was quite convinced of it on hearing talk of this kind from him, and to make sport for the night he determined to fall in with his humour."
        vocab:
          - {w: "como está dicho", d: "as has been said (in the previous chapter)"}
          - {w: "socarrón", d: "sly joker, a wag; someone who mocks with a straight face"}
          - {w: "barrunto", d: "inkling, suspicion"}
          - {w: "falta de juicio", d: "lack of sense, want of wits"}
          - {w: "acabar de", d: "+ infinitive: to finish doing; 'acabó de creerlo' = he became fully convinced, 'acabó de oírle' = he had just heard him"}
          - {w: "tener qué reír", d: "to have something to laugh at"}
          - {w: "determinar de", d: "to decide to; the 'de' is old, modern Spanish says 'determinó seguirle'"}
          - {w: "seguir el humor a alguien", d: "to humor someone, play along with him"}
        diagram:
          - s: "acabó de creerlo"
            r: "main verb 1: he became fully convinced of it"
            under:
              - s: "El ventero"
                r: "subject"
                under:
                  - {s: "que, como está dicho, era un poco socarrón", r: "describes 'ventero': who, as said, was a bit of a wag"}
                  - {s: "y ya tenía algunos barruntos de la falta de juicio de su huésped", r: "describes 'ventero': and already suspected his guest was mad"}
              - {s: "cuando acabó de oírle semejantes razones", r: "when: when he had heard such words from him"}
          - s: "determinó de seguirle el humor"
            r: "main verb 2 (after 'y'): he decided to humor him"
            under:
              - {s: "por tener qué reír aquella noche", r: "why: to have something to laugh at that night"}
        forms:
          - {w: "está dicho", f: "est- + -á → estar (to be), present, it, + dicho, the irregular participle of decir (to say): 'is said, has been said'."}
          - {w: "era", f: "ser (to be), imperfect, he. ser's imperfect is irregular: era, eras, era, éramos, erais, eran."}
          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "algunos", f: "algun- + -os → alguno (some), masculine plural to match 'barruntos'."}
          - {w: "acabó de creerlo", f: "acab- + -ó → acabar (to finish), preterite, he, + 'de' + creer (to believe) + lo (it): 'finished believing it' = was fully convinced. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "acabó de oírle", f: "same preterite of acabar (to finish) + 'de' + oír (to hear) + le (him): 'had just heard him'. The two 'acabó de' are a play on words."}
          - {w: "tener qué reír", f: "infinitives after 'por' (for the sake of): tener (to have) + qué (something) + reír (to laugh): 'to have something to laugh at'."}
          - {w: "determinó", f: "determin- + -ó → determinar (to decide), preterite, he. Same -ar preterite."}
          - {w: "seguirle", f: "seguir (to follow) + le (to him): infinitive with the pronoun on the end; 'seguirle el humor' = to follow his humor, humor him."}
      - es: "y así, le dijo que andaba muy acertado en lo que deseaba y pedía, y que tal prosupuesto era propio y natural de los caballeros tan principales como él parecía y como su gallarda presencia mostraba;"
        literal: "and thus, to-him he-said that he-went very correct in that which he-desired and asked, and that such purpose was proper and natural of the knights so distinguished as he seemed and as his gallant presence showed;"
        ormsby: "So he told him he was quite right in pursuing the object he had in view, and that such a motive was natural and becoming in cavaliers as distinguished as he seemed and his gallant bearing showed him to be;"
        vocab:
          - {w: "andar acertado", d: "to be right, be on the right track; 'andar' often means simply 'to be'"}
          - {w: "prosupuesto", d: "= presupuesto, purpose, intention; archaic spelling"}
          - {w: "propio de", d: "proper to, characteristic of"}
          - {w: "principal", d: "distinguished, of high rank"}
          - {w: "gallardo", d: "gallant, dashing, elegant"}
          - {w: "presencia", d: "bearing, appearance"}
        diagram:
          - s: "le dijo"
            r: "main verb: he told him"
            under:
              - s: "que andaba muy acertado"
                r: "what he said, 1: that he was quite right"
                under:
                  - {s: "en lo que deseaba y pedía", r: "in what: in what he wanted and asked"}
              - s: "y que tal prosupuesto era propio y natural de los caballeros tan principales"
