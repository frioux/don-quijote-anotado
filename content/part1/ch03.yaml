        forms:
          - {w: "se había venido a recoger", f: "había + venido → haber + the participle of venir (to come), pluperfect, he, with 'se' belonging to recoger (to retire): 'had come to retire'. haber in the imperfect: había, habías, había, habíamos, habíais, habían. 'venir a' + infinitive = to end up doing."}
          - {w: "vivía", f: "viv- + -ía → vivir (to live), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "las ajenas", f: "ajen- + -as → ajeno (someone else's), feminine plural: 'las ajenas [haciendas]', other people's property. The noun is understood from 'hacienda'."}
          - {w: "recogiendo", f: "recog- + -iendo → recoger (to take in), gerund: 'taking in'."}
          - {w: "cualquiera", f: "'whatever, any'; modern Spanish clips it to 'cualquier' before a noun."}
          - {w: "fuesen", f: "fu- + -esen → ser (to be), imperfect subjunctive (-se form), they: 'might be'. ser's -se forms: fuese, fueses, fuese, fuésemos, fueseis, fuesen. Subjunctive after 'cualquiera ... que' (whatever)."}
          - {w: "mucha", f: "much- + -a → mucho, feminine to match 'afición'."}
          - {w: "les tenía", f: "ten- + -ía → tener (to have), imperfect, he, with 'les' (for them). Same -ía imperfect."}
          - {w: "partiesen", f: "part- + -iesen → partir (to share), imperfect subjunctive (-se form), they. The -se imperfect subjunctive of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen. Subjunctive because 'porque' here means 'so that' (purpose)."}
          - {w: "buen", f: "bueno clipped before a masculine singular noun ('deseo'), like un, algún, gran."}
        note: "The joke is in 'con su hacienda y con las ajenas': he lives off his own property and other people's, and his 'fondness' for knights-errant is fondness for their money."
  - sentences:
      - es: "Díjole también que en aquel su castillo no había capilla alguna donde poder velar las armas, porque estaba derribada para hacerla de nuevo;"
        literal: "He-said-to-him also that in that his castle not there-was chapel any where to-be-able to-watch the arms, because it-was knocked-down in-order to-make-it anew;"
        ormsby: "He told him, moreover, that in this castle of his there was no chapel in which he could watch his armour, as it had been pulled down in order to be rebuilt,"
        vocab:
          - {w: "aquel su castillo", d: "that castle of his; demonstrative + possessive together is old style"}
          - {w: "capilla alguna", d: "any chapel at all; 'alguno' after the noun in a negative sentence = 'no ... whatever'"}
          - {w: "velar las armas", d: "to keep vigil over one's arms, the all-night watch before knighthood"}
          - {w: "derribado", d: "knocked down, demolished"}
          - {w: "de nuevo", d: "anew, again"}
        diagram:
          - s: "Díjole también"
            r: "main verb: he also told him"
            under:
              - s: "que en aquel su castillo no había capilla alguna"
                r: "what he said: that in his castle there was no chapel"
                under:
                  - {s: "donde poder velar las armas", r: "describes 'capilla': where one could keep vigil over the arms"}
                  - s: "porque estaba derribada"
                    r: "why: because it had been knocked down"
                    under:
                      - {s: "para hacerla de nuevo", r: "why: to rebuild it"}
        forms:
          - {w: "Díjole", f: "dij- + -o + le → decir (to say), preterite, he, with 'le' (to him) stuck on the end; modern 'le dijo'. Cervantes hangs pronouns on the end of a conjugated verb that opens its clause, and adds an accent to keep the stress. decir's preterite: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "había", f: "hab- + -ía → haber, imperfect, used alone as 'there was / there were' (the past of 'hay')."}
          - {w: "alguna", f: "algun- + -a → alguno, feminine to match 'capilla'; after the noun in a negative sentence it means 'none at all'."}
          - {w: "poder velar", f: "two infinitives: poder (to be able) + velar (to keep vigil): 'where to be able to watch'."}
          - {w: "estaba derribada", f: "est- + -aba → estar (to be), imperfect, it, + derrib- + -ada → derribar (to knock down), participle, feminine to match 'capilla': 'was knocked down'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "hacerla", f: "hacer (to make) + la (it: the chapel), infinitive after 'para' with the pronoun on the end."}
      - es: "pero que, en caso de necesidad, él sabía que se podían velar dondequiera, y que aquella noche las podría velar en un patio del castillo;"
        literal: "but that, in case of necessity, he knew that they-could be-watched wherever, and that that night them he-could watch in a courtyard of-the castle;"
        ormsby: "but that in a case of necessity it might, he knew, be watched anywhere, and he might watch it that night in a courtyard of the castle,"
        vocab:
          - {w: "en caso de necesidad", d: "if need be"}
          - {w: "dondequiera", d: "anywhere, wherever"}
          - {w: "patio", d: "courtyard, yard"}
        diagram:
          - s: "Díjole también"
            r: "carried over from the previous sentence: he also told him"
            under:
              - s: "pero que, en caso de necesidad, él sabía"
                r: "what he said, 2: but that if need be, he knew"
                under:
                  - {s: "que se podían velar dondequiera", r: "what he knew: that they could be watched anywhere"}
              - s: "y que aquella noche las podría velar en un patio del castillo"
                r: "what he said, 3: and that tonight he could watch them in a courtyard"
        forms:
          - {w: "sabía", f: "sab- + -ía → saber (to know), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "se podían velar", f: "pod- + -ían → poder (to be able), imperfect, they (the arms), with 'se' making it passive: 'they could be watched'. Same -ía imperfect. The 'se' belongs to velar but sits in front of the whole verb group."}
          - {w: "aquella", f: "aquell- + -a → 'that', feminine to match 'noche'."}
          - {w: "las", f: "them: 'las armas', feminine plural; it goes before the verb group."}
