          - {w: "diole", f: "d- + -io + le → dar (to give), preterite, he, with 'le' (to him) stuck on the end; modern 'le dio'. Cervantes hangs pronouns on the end of a conjugated verb that opens its clause. dar's preterite: di, diste, dio, dimos, disteis, dieron."}
