          - {w: "canalla", d: "rabble, riff-raff"}
          - {w: "hacer caso de", d: "to pay attention to, take account of"}
          - {w: "tirar", d: "to throw (stones)"}
          - {w: "ofender", d: "to attack, harm (the old physical sense)"}
          - {w: "en cuanto", d: "as much as"}
          - {w: "pago", d: "payment, reward, i.e. punishment"}
          - {w: "sandez", d: "foolishness, stupidity"}
          - {w: "demasía", d: "excess, insolence"}
