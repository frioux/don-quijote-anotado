          - {w: "no por eso", d: "not for that reason"}
          - {w: "haber de", d: "to have to, to be to: 'se había de creer' = one was to believe"}
          - {w: "trujeron", d: "= trajeron, 'they carried'; old form of the preterite of traer"}
