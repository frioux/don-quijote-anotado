                      - {s: "de cualquiera calidad y condición que fuesen", r: "describes the knights: of whatever rank they might be"}
                      - {s: "sólo por la mucha afición que les tenía", r: "why, 1: only for the great fondness he had for them"}
                      - {s: "y porque partiesen con él de sus haberes", r: "why, 2: and so that they would share their money with him"}
