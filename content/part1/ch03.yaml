  - sentences:
      - es: "Preguntóle si traía dineros; respondió don Quijote que no traía blanca, porque él nunca había leído en las historias de los caballeros andantes que ninguno los hubiese traído. A esto dijo el ventero que se engañaba;"
        literal: "He-asked-him if he-carried moneys; answered Don Quijote that not he-carried [a] white-penny, because he never had read in the histories of the knights errant that any them had carried. To this said the innkeeper that he-deceived-himself;"
        ormsby: "He asked if he had any money with him, to which Don Quixote replied that he had not a farthing, as in the histories of knights-errant he had never read of any of them carrying any. On this point the landlord told him he was mistaken;"
        vocab:
          - {w: "traer", d: "to carry, have on one (as well as 'to bring')"}
          - {w: "dineros", d: "money; the plural was common in Cervantes' time"}
          - {w: "no traer blanca", d: "to be penniless; a 'blanca' was a tiny copper coin (literally 'white one'), worth half a maravedí"}
          - {w: "historias", d: "histories, stories; for Don Quijote the romances are true history"}
          - {w: "engañarse", d: "to be mistaken (literally 'to deceive oneself')"}
        diagram:
          - s: "Preguntóle"
            r: "main verb 1: he (the innkeeper) asked him"
            under:
              - {s: "si traía dineros", r: "what he asked: whether he had money on him"}
          - s: "respondió don Quijote"
            r: "main verb 2: Don Quijote answered"
            under:
              - {s: "que no traía blanca", r: "what he answered: that he had not a penny"}
              - s: "porque él nunca había leído en las historias de los caballeros andantes"
                r: "why: because he had never read in the histories of knights-errant"
                under:
                  - {s: "que ninguno los hubiese traído", r: "what he had never read: that any of them had carried it"}
          - s: "A esto dijo el ventero"
            r: "main verb 3: to this the innkeeper said"
            under:
              - {s: "que se engañaba", r: "what he said: that he was mistaken"}
        forms:
          - {w: "Preguntóle", f: "pregunt- + -ó + le → preguntar (to ask), preterite, he, with 'le' (him) stuck on the end; modern 'le preguntó'. Cervantes hangs pronouns on the end of a conjugated verb that opens its clause. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "traía", f: "tra- + -ía → traer (to carry), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "había leído", f: "hab- + -ía + leído → haber + the participle of leer (to read): pluperfect, he: 'had read'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "ninguno", f: "ningun- + -o → 'none, any', masculine singular standing for a knight. After 'nunca' the negative words pile up: 'never read that any'."}
          - {w: "los", f: "them: 'dineros', masculine plural."}
          - {w: "hubiese traído", f: "hub- + -iese + traído → haber + the participle of traer (to carry): pluperfect subjunctive, he: 'had carried'. haber in the -se imperfect subjunctive: hubiese, hubieses, hubiese, hubiésemos, hubieseis, hubiesen. Subjunctive because it depends on a denial ('nunca había leído')."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "se engañaba", f: "engañ- + -aba → engañarse (to be mistaken), imperfect, he, with 'se' (himself). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
        ormsby_note: "In the original, blanca, a coin worth about one-seventh of a farthing."
      - es: "que, puesto caso que en las historias no se escribía, por haberles parecido a los autores dellas que no era menester escrebir una cosa tan clara y tan necesaria de traerse como eran dineros y camisas limpias, no por eso se había de creer que no los trujeron;"
        literal: "that, put case that in the histories not it-was-written, for having-to-them seemed to the authors of-them that not it-was needful to-write a thing so clear and so necessary of being-carried as were moneys and shirts clean, not for that it-was to be-believed that not them they-carried;"
        ormsby: "for, though not recorded in the histories, because in the author’s opinion there was no need to mention anything so obvious and necessary as money and clean shirts, it was not to be supposed therefore that they did not carry them,"
        vocab:
