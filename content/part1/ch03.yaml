          - {w: "viéndole", f: "v- + -iendo + le → ver (to see), gerund, with 'le' (him) on the end; the accent keeps the stress on vién-. 'le' for a male person as direct object is leísmo: strict grammar wants 'lo', but Castilian writers use 'le'."}
          - {w: "llegar", f: "infinitive (to arrive) after a verb of seeing: 'seeing him arrive'."}
          - {w: "le dijo", f: "dij- + -o → decir (to say), preterite, he, with 'le' (to him). Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— ¡Oh tú, quienquiera que seas, atrevido caballero, que llegas a tocar las armas del más valeroso andante que jamás se ciñó espada!, mira lo que haces y no las toques, si no quieres dejar la vida en pago de tu atrevimiento."
        literal: "— Oh you, whoever that you-may-be, daring knight, who come to touch the arms of-the most valiant errant that ever girded-on-himself sword!, look-at what you-do and not them touch, if not you-want to-leave the life in payment of your daring."
        ormsby: "“O thou, whoever thou art, rash knight that comest to lay hands on the armour of the most valorous errant that ever girt on sword, have a care what thou dost; touch it not unless thou wouldst lay down thy life as the penalty of thy rashness.”"
        vocab:
          - {w: "quienquiera que", d: "whoever"}
          - {w: "atrevido", d: "bold, rash, insolent"}
          - {w: "llegar a", d: "+ infinitive: to go so far as to, to come to"}
          - {w: "andante", d: "errant, i.e. knight-errant ('caballero andante')"}
          - {w: "ceñirse espada", d: "to gird on a sword, i.e. to be a knight"}
          - {w: "mira lo que haces", d: "watch what you are doing, take care"}
          - {w: "dejar la vida", d: "to lose one's life"}
          - {w: "atrevimiento", d: "daring, insolence"}
        diagram:
          - s: "mira lo que haces"
            r: "main verb 1: watch what you are doing"
            under:
              - s: "¡Oh tú, quienquiera que seas, atrevido caballero"
                r: "address: O you, whoever you are, rash knight"
                under:
                  - s: "que llegas a tocar las armas del más valeroso andante"
                    r: "describes 'caballero': who dare to touch the arms of the bravest knight-errant"
                    under:
                      - {s: "que jamás se ciñó espada", r: "describes 'andante': who ever girded on a sword"}
          - s: "y no las toques"
            r: "main verb 2: and don't touch them"
            under:
              - {s: "si no quieres dejar la vida en pago de tu atrevimiento", r: "condition: if you don't want to pay for your daring with your life"}
        forms:
          - {w: "tú", f: "the familiar 'you'. Don Quijote uses 'tú' to an opponent, as knights do in the romances; he uses 'vos' to people he honors."}
          - {w: "seas", f: "se- + -as → ser (to be), present subjunctive, you (tú). ser's present subjunctive: sea, seas, sea, seamos, seáis, sean. Subjunctive after 'quienquiera que' (whoever)."}
          - {w: "atrevido", f: "atrev- + -ido → atreverse (to dare), past participle as adjective: 'daring'."}
          - {w: "llegas", f: "lleg- + -as → llegar (to come; 'llegar a' + infinitive = to go so far as to), present, you (tú). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "del más valeroso", f: "de + el + más + adjective: 'of the most valiant'. The superlative is article + más + adjective."}
          - {w: "se ciñó", f: "ciñ- + -ó → ceñir (to gird), preterite, he, with 'se' (on himself). ceñir drops the i of the ending after ñ: ceñí, ceñiste, ciñó, ceñimos, ceñisteis, ciñeron."}
          - {w: "mira", f: "mir- + -a → mirar (to look), command, you (tú): 'look!'. The tú command of -ar verbs looks like the he/she present."}
          - {w: "haces", f: "hac- + -es → hacer (to do), present, you (tú). The present of -er verbs: -o, -es, -e, -emos, -éis, -en (hacer has 'hago' for I)."}
          - {w: "no las toques", f: "toqu- + -es → tocar (to touch), present subjunctive, you (tú), used as a negative command: 'don't touch them'. Negative commands use the present subjunctive: -e, -es, -e, -emos, -éis, -en for -ar verbs; c becomes qu before e. 'las' = them (the arms)."}
          - {w: "quieres", f: "quier- + -es → querer (to want), present, you (tú). The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "tu", f: "'your' (familiar), no accent; 'tú' with the accent is the pronoun 'you'."}
  - sentences:
      - es: "No se curó el arriero destas razones (y fuera mejor que se curara, porque fuera curarse en salud); antes, trabando de las correas, las arrojó gran trecho de sí."
        literal: "Not himself cared the muleteer of-these reasonings (and it-would-have-been better that he-had-cared, because it-would-have-been to-cure-himself in health); rather, seizing of the straps, them he-threw great stretch from himself."
        ormsby: "The carrier gave no heed to these words (and he would have done better to heed them if he had been heedful of his health), but seizing it by the straps flung the armour some distance from him."
        vocab:
          - {w: "curarse de", d: "to heed, pay attention to (old sense of curar = to care)"}
          - {w: "destas", d: "= de estas, 'of these'"}
          - {w: "razones", d: "words, speech (not 'reasons')"}
          - {w: "curarse en salud", d: "to take precautions in advance; literally 'to treat oneself while still healthy'"}
          - {w: "antes", d: "rather, on the contrary (after a negative)"}
          - {w: "trabar de", d: "to grab hold of"}
          - {w: "correa", d: "leather strap"}
          - {w: "arrojar", d: "to throw, fling"}
          - {w: "gran trecho", d: "a good distance"}
          - {w: "de sí", d: "from himself"}
        diagram:
          - s: "No se curó el arriero destas razones"
            r: "main verb 1: the muleteer paid no heed to these words"
            under:
              - s: "y fuera mejor que se curara"
                r: "narrator's aside: and it would have been better to heed them"
                under:
                  - {s: "porque fuera curarse en salud", r: "why: because it would have been taking precautions"}
          - s: "las arrojó gran trecho de sí"
            r: "main verb 2: he flung them a good way off"
            under:
              - {s: "antes", r: "linking: on the contrary"}
              - {s: "trabando de las correas", r: "how: grabbing them by the straps"}
        forms:
          - {w: "se curó", f: "cur- + -ó → curarse de (to heed), preterite, he, with 'se'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "destas", f: "de + estas (of these), feminine plural to match 'razones'. Cervantes fuses 'de' with este, ella, él, ellos: deste, desta, della, dél, dellos."}
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), it: here 'would have been'. ser's -ra forms: fuera, fueras, fuera, fuéramos, fuerais, fueran. Cervantes uses the -ra form where modern Spanish says 'habría sido'."}
          - {w: "se curara", f: "cur- + -ara → curarse (to heed), imperfect subjunctive (-ra form), he. The -ra imperfect subjunctive of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran. Subjunctive after 'fuera mejor que' (it would be better that)."}
          - {w: "curarse", f: "infinitive of curarse (to treat oneself), with 'se' on the end."}
          - {w: "trabando", f: "trab- + -ando → trabar (to seize), gerund."}
          - {w: "las arrojó", f: "arroj- + -ó → arrojar (to fling), preterite, he, with 'las' (them: the arms, feminine plural) in front. Same -ar preterite."}
          - {w: "gran", f: "grande clipped before a singular noun ('trecho')."}
          - {w: "sí", f: "'himself' after a preposition ('de sí' = from himself); the accent tells it from 'si' (if)."}
        note: "A pun on 'curarse': 'no se curó' means 'he paid no heed', and 'curarse en salud' (to treat oneself while healthy) means to take precautions. Had he heeded, he would have saved himself needing a cure."
      - es: "Lo cual visto por don Quijote, alzó los ojos al cielo, y, puesto el pensamiento —a lo que pareció— en su señora Dulcinea, dijo:"
        literal: "The which seen by Don Quijote, he-raised the eyes to-the heaven, and, put the thought —to what it-seemed— on his lady Dulcinea, he-said:"
        ormsby: "Seeing this, Don Quixote raised his eyes to heaven, and fixing his thoughts, apparently, upon his lady Dulcinea, exclaimed,"
        vocab:
          - {w: "lo cual visto", d: "which being seen, when he saw this; an absolute participle phrase"}
          - {w: "alzar", d: "to raise, lift"}
          - {w: "puesto el pensamiento en", d: "with his thoughts fixed on; another absolute participle"}
          - {w: "a lo que pareció", d: "as it seemed, apparently"}
          - {w: "Dulcinea", d: "Dulcinea del Toboso, the lady he invented in chapter 1 out of a farm girl, Aldonza Lorenzo"}
        diagram:
          - s: "alzó los ojos al cielo"
            r: "main verb 1: he raised his eyes to heaven"
            under:
              - {s: "Lo cual visto por don Quijote", r: "when: when Don Quijote saw this"}
          - s: "dijo:"
            r: "main verb 2 (after 'y'): he said"
            under:
              - s: "puesto el pensamiento"
                r: "how: with his thoughts fixed"
                under:
                  - {s: "a lo que pareció", r: "aside: as it seemed"}
                  - {s: "en su señora Dulcinea", r: "on whom: on his lady Dulcinea"}
        forms:
          - {w: "Lo cual visto", f: "'lo cual' (which) is neuter, referring to the whole action; visto is the irregular participle of ver (to see). An absolute participle: 'which being seen' = when he saw this."}
          - {w: "alzó", f: "alz- + -ó → alzar (to raise), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "al", f: "a + el."}
          - {w: "puesto", f: "irregular participle of poner (to put), masculine to match 'pensamiento': 'his thought being put' = fixing his thoughts."}
          - {w: "pareció", f: "parec- + -ió → parecer (to seem), preterite, it. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Acorredme, señora mía, en esta primera afrenta que a este vuestro avasallado pecho se le ofrece; no me desfallezca en este primero trance vuestro favor y amparo."
        literal: "— Help-me, lady mine, in this first affront that to this your enslaved breast itself to-it offers; not to-me fail in this first peril your favor and protection."
        ormsby: "“Aid me, lady mine, in this the first encounter that presents itself to this breast which thou holdest in subjection; let not thy favour and protection fail me in this first jeopardy;”"
        vocab:
          - {w: "acorrer", d: "= socorrer, to help, come to the aid of; archaic"}
          - {w: "afrenta", d: "affront, insult; here the first trial of his honor"}
          - {w: "avasallado", d: "made a vassal, subjugated (by love)"}
          - {w: "pecho", d: "breast, heart"}
          - {w: "ofrecerse", d: "to present itself, arise"}
          - {w: "desfallecer", d: "to fail, faint, give out"}
          - {w: "trance", d: "critical moment, peril"}
          - {w: "amparo", d: "protection, shelter"}
        diagram:
          - s: "Acorredme"
            r: "main verb 1: help me"
            under:
              - {s: "señora mía", r: "address: my lady"}
              - s: "en esta primera afrenta"
                r: "in what: in this first affront"
                under:
                  - {s: "que a este vuestro avasallado pecho se le ofrece", r: "describes 'afrenta': that presents itself to this heart enslaved to you"}
          - s: "no me desfallezca"
            r: "main verb 2: let it not fail me"
            under:
              - {s: "en este primero trance", r: "when: in this first peril"}
              - {s: "vuestro favor y amparo", r: "subject: your favor and protection"}
        forms:
          - {w: "Acorredme", f: "acorr- + -ed + me → acorrer (to help), command, you (vos / vosotros), with 'me' on the end: 'help me'. The vosotros/vos command is the infinitive with -r changed to -d: acorred, amad, venid. Pronouns always attach to the end of a positive command."}
          - {w: "mía", f: "the long possessive 'my', feminine to match 'señora', after the noun: 'my lady'."}
          - {w: "primera", f: "primer- + -a → primero (first), feminine to match 'afrenta'."}
          - {w: "vuestro", f: "vuestr- + -o → 'your', the possessive of 'vos' (the respectful 'you'), masculine to match 'pecho' and 'favor'. 'este vuestro pecho' = 'this heart of yours'."}
          - {w: "avasallado", f: "avasall- + -ado → avasallar (to make a vassal), past participle, masculine to match 'pecho'."}
          - {w: "se le ofrece", f: "ofrec- + -e → ofrecerse (to present itself), present, it, with 'le' (to it: the heart) repeating 'a este ... pecho'. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (ofrecer adds -zc- for I: ofrezco)."}
          - {w: "desfallezca", f: "desfallezc- + -a → desfallecer (to fail), present subjunctive, it: 'may it not fail'. Verbs in -ecer add -zc- in the subjunctive: desfallezca, desfallezcas, desfallezca, desfallezcamos, desfallezcáis, desfallezcan. The subjunctive here is a wish: 'let it not fail'."}
          - {w: "primero", f: "'first', unclipped before a masculine noun; modern Spanish says 'primer trance'."}
        note: "He speaks to Dulcinea as a knight to his liege lady: his heart is her vassal, and her favor is what gives him strength. It is the language of Amadís praying to Oriana before a fight."
  - sentences:
      - es: "Y, diciendo estas y otras semejantes razones, soltando la adarga, alzó la lanza a dos manos y dio con ella tan gran golpe al arriero en la cabeza, que le derribó en el suelo, tan maltrecho que, si segundara con otro, no tuviera necesidad de maestro que le curara."
        literal: "And, saying these and other similar reasonings, letting-go the buckler, he-raised the lance at two hands and gave with it so great blow to-the muleteer on the head, that him he-knocked-down on the ground, so badly-treated that, if he-had-seconded with another, not he-would-have-had need of master who him might-cure."
        ormsby: "and, with these words and others to the same purpose, dropping his buckler he lifted his lance with both hands and with it smote such a blow on the carrier’s head that he stretched him on the ground, so stunned that had he followed it up with a second there would have been no need of a surgeon to cure him."
        vocab:
          - {w: "razones", d: "words, speech"}
          - {w: "soltar", d: "to let go, drop"}
          - {w: "adarga", d: "oval leather shield of Moorish origin"}
          - {w: "a dos manos", d: "with both hands"}
          - {w: "dar con", d: "to strike with"}
          - {w: "derribar", d: "to knock down"}
          - {w: "maltrecho", d: "battered, in a bad way"}
          - {w: "segundar", d: "to follow up with a second (blow)"}
          - {w: "maestro", d: "master; here a surgeon"}
        diagram:
          - s: "alzó la lanza a dos manos"
            r: "main verb 1: he raised his lance two-handed"
            under:
              - {s: "diciendo estas y otras semejantes razones", r: "how: saying these and similar words"}
              - {s: "soltando la adarga", r: "how: dropping his shield"}
          - s: "y dio con ella tan gran golpe al arriero en la cabeza"
            r: "main verb 2: and struck the muleteer such a blow on the head with it"
            under:
              - s: "que le derribó en el suelo"
                r: "result: that it knocked him to the ground"
                under:
                  - s: "tan maltrecho"
                    r: "how: so battered"
                    under:
                      - s: "que, si segundara con otro, no tuviera necesidad de maestro"
                        r: "result: that if he had struck again, no surgeon would have been needed"
                        under:
                          - {s: "que le curara", r: "describes 'maestro': to treat him"}
        forms:
          - {w: "diciendo", f: "dic- + -iendo → decir (to say), gerund; decir changes e to i in the gerund."}
          - {w: "estas", f: "est- + -as → 'these', feminine plural to match 'razones'."}
          - {w: "soltando", f: "solt- + -ando → soltar (to let go), gerund."}
          - {w: "alzó", f: "alz- + -ó → alzar (to raise), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "dio", f: "d- + -io → dar (to give; 'dar con' = to strike with), preterite, he. dar's preterite: di, diste, dio, dimos, disteis, dieron."}
          - {w: "ella", f: "'it' (the lance), feminine."}
          - {w: "tan gran", f: "tan (so) + gran (grande clipped before a singular noun): 'so great a'."}
