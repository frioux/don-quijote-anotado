  - sentences:
      - es: "»En efeto, viéndome apurado, y que mi alma se consumía con el deseo de verla, determiné poner por obra y acabar en un punto lo que me pareció que más convenía para salir con mi deseado y merecido premio;"
        literal: "In effect, seeing-myself hard-pressed, and that my soul itself consumed with the desire of to-see-her, I-determined to-put to work and to-finish in one point that which to-me it-seemed that most was-fitting for to-come-out with my desired and merited reward;"
        ormsby: "At length growing impatient and feeling my heart languishing with longing to see her, I resolved to put into execution and carry out what seemed to me the best mode of winning my desired and merited reward,"
        vocab:
          - {w: "en efeto", d: "= en efecto, in short, in fact"}
          - {w: "apurado", d: "hard-pressed, at the end of one's patience"}
          - {w: "consumirse", d: "to waste away, be consumed"}
          - {w: "poner por obra", d: "to put into effect, carry out"}
          - {w: "en un punto", d: "at once, in an instant"}
          - {w: "convenir", d: "to be fitting, be best"}
          - {w: "salir con", d: "to succeed in getting, win"}
          - {w: "premio", d: "reward, prize"}
