  - sentences:
      - es: "»Yo le agradecí su buen intento, pareciéndome que llevaba razón en lo que decía, y que mi padre vendría en ello como yo se lo dijese; y con este intento, luego en aquel mismo instante, fui a decirle a mi padre lo que deseaba."
        literal: "I him thanked-for his good intent, seeming-to-me that he-carried reason in that which he-said, and that my father would-come into it as-soon-as I to-him it should-say; and with this intent, at-once in that same instant, I-went to tell-him [to] my father that which I-desired."
        ormsby: "I thanked him for his kindness, reflecting that there was reason in what he said, and that my father would assent to it as soon as I should tell him, and with that view I went the very same instant to let him know what my desires were."
        vocab:
          - {w: "intento", d: "intention, purpose"}
          - {w: "llevar razón", d: "to be right"}
          - {w: "venir en", d: "to agree to, consent to"}
          - {w: "como", d: "with the subjunctive: as soon as"}
          - {w: "luego", d: "at once"}
