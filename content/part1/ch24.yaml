  - sentences:
      - es: "— «Mi nombre es Cardenio; mi patria, una ciudad de las mejores desta Andalucía; mi linaje, noble; mis padres, ricos;"
        literal: "— My name is Cardenio; my homeland, a city of the best of-this Andalusia; my lineage, noble; my parents, rich;"
        ormsby: "“My name is Cardenio, my birthplace one of the best cities of this Andalusia, my family noble, my parents rich,"
        vocab:
          - {w: "Cardenio", d: "the madman's name; Ormsby thinks it came from the Venta de Cárdenas, an inn at the mouth of the Despeñaperros pass"}
          - {w: "patria", d: "home town, birthplace (not only 'fatherland')"}
          - {w: "desta", d: "= de esta, of this"}
          - {w: "Andalucía", d: "Andalusia, the southern region of Spain, just over the Sierra Morena from La Mancha"}
          - {w: "linaje", d: "lineage, family, descent"}
        diagram:
          - {s: "Mi nombre es Cardenio", r: "main verb: my name is Cardenio"}
          - {s: "mi patria, una ciudad de las mejores desta Andalucía", r: "list, 1 ('es' understood): my home, one of the best cities of this Andalusia"}
          - {s: "mi linaje, noble", r: "list, 2: my lineage, noble"}
          - {s: "mis padres, ricos", r: "list, 3: my parents, rich"}
        forms:
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son. The commas after 'patria', 'linaje', 'padres' stand for this verb, left out."}
          - {w: "desta", f: "= de + esta (of this), feminine to match 'Andalucía'."}
          - {w: "mis", f: "'my', plural to match 'padres'."}
          - {w: "ricos", f: "ric- + -os → rico (rich), masculine plural to match 'padres'."}
        ormsby_note: "This indicates that the spot Cervantes had in his eye was somewhere above the head of the Despeñaperros gorge and commanding a view of the valley of the Guadalquivir; and the scenery there agrees with his description. He was, no doubt, familiar with it from having passed through it on his journeys between Madrid and Seville in the years between 1587 and 1598. The broom, mentioned farther on, is very abundant in this part of the Sierra Morena. The name of Cardenio, too, was probably suggested by Venta de Cardenas, a halting place at the mouth of the gorge."
        note: "The guillemets « » open Cardenio's story as a tale inside the tale; the » that begins later paragraphs marks the same story going on."
