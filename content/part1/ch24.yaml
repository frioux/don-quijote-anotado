summary: |
  The ragged madman of the Sierra Morena thanks Don Quijote courteously for his kindness. Don Quijote swears by his order of knighthood to help him, either by curing his sorrow or by weeping over it with him, and begs to know who he is. The stranger first asks for food, wolfs down what Sancho and the goatherd give him, then leads them to a meadow and agrees to tell his story on one condition: no one may interrupt him, or he will stop.

  He is Cardenio, a well-born young man from a city in Andalusia. He has loved Luscinda, his equal in birth and wealth, since childhood; when her father shut her away, they wrote letters and verses instead. When he asks for her hand, her father tells him the request must come from Cardenio's own father. But his father has just received a letter from Duke Ricardo, a grandee, summoning Cardenio to court as companion to his eldest son. Cardenio leaves, after Luscinda and her father promise to wait.

  At court the duke's younger son, Don Fernando, makes Cardenio his close friend. Fernando seduces a rich peasant girl by promising to marry her, then loses interest, and to escape his promise suggests a trip to Cardenio's city on the pretext of buying horses. There Cardenio unwisely praises Luscinda and shows her to Fernando one night at her window. Fernando falls in love with her, reads her letters, and Cardenio begins to feel uneasy. Luscinda had asked to borrow a book of chivalry, Amadís de Gaula, and at that word Don Quijote breaks in with a speech praising her taste and recommending other romances.

  Cardenio falls silent, then suddenly declares that Master Elisabat was the lover of Queen Madásima in Amadís. Don Quijote, furious, calls him a liar and challenges him. Cardenio, now in a fit of madness, knocks him down with a stone, beats Sancho and the goatherd, and goes back into the mountains. Sancho blames the goatherd for not warning them, the two come to blows, and Don Quijote separates them. The goatherd says Cardenio can be found again, sane or mad, if they keep searching the area.
context: |
  Rank and marriage. Cardenio's story is about the hierarchy of Spanish society. He and Luscinda are rich minor nobility; Duke Ricardo is a 'grande de España', a grandee, the highest rank, whose privilege (Ormsby notes) was to keep his hat on before the king. Young gentlemen were placed in great households to rise in the world, so the duke's letter is a real piece of luck. A son could not ask for a bride while his father lived; the request had to pass from father to father. The peasant girl, a rich farmer's daughter and the duke's vassal, cannot hope to marry a duke's son in the eyes of the world, so Fernando's promise of marriage is the classic seducer's trick. Such private promises could be binding, which is why they mattered so much.

  The books. Cardenio's tale is a short novel of the kind Cervantes later published as his Exemplary Novels, set inside the main story. It is interrupted at the word 'Amadís', and Don Quijote's interruption recommends the later Amadís sequels by Feliciano de Silva (Don Rugel of Greece, Daraida and Geraya, the shepherd Darinel), the very books the priest burned in chapter 6. The quarrel is over a point inside Amadís de Gaula: whether the surgeon Master Elisabat was Queen Madásima's lover. Both madmen treat a fictional queen's honor as a matter of real life and death. Thisbe, whom Cardenio cites for the parents' interference, comes from Ovid's Pyramus and Thisbe, the lovers who talked through a crack in a wall.

  The narrator's games. The story inside the story is framed by Cardenio's rule that no one may interrupt, which recalls Sancho's goat story in chapter 20, broken off when Don Quijote lost count. The text says so openly. The narrator also steps in to marvel at Don Quijote's defense of Madásima ('¡Estraño caso!'), and Cardenio's tale breaks off twice: once when he loses the thread of his own sentence about love and appetite (Ormsby calls it an example of Cervantes' clumsy sentences), and once when Don Quijote cuts in.

  Honor and violence. 'You lie' ('miente como bellaco') was the gravest insult between gentlemen and made a duel unavoidable; Don Quijote offers to fight on foot or horseback, armed or unarmed, by day or night, in the full formula of a challenge. Sancho, for his part, uses the rule that a knight may not fight a commoner but a commoner may fight his equal. Cardenio's madness comes in fits ('accidente'), with clear spells in between, which was how the period understood madness caused by grief.

  Names and places. Ormsby's notes place the scene above the Despeñaperros pass, looking down on the Guadalquivir valley, country Cervantes knew from his travels between Madrid and Seville; he suggests 'Cardenio' came from the Venta de Cárdenas, an inn at the mouth of the pass. Cardenio's unnamed city is almost certainly Córdoba, famous (Ormsby notes) for its horses. Luscinda's name suggests the Latin 'luscinia', nightingale. The narrator calls Cardenio 'el Roto' (the Ragged One), 'Caballero de la Sierra' and 'Caballero del Bosque'.

  Reading Cervantes' Spanish. This chapter is mostly Cardenio speaking in the polished, courtly style of the novella, with long, looping sentences full of doubled words ('amé, quise y adoré'). The usual archaisms appear: mesmo, efeto, estrañeza, estremo, recebir, trujeron and trujese for trajeron and trajese, interromper, trecientos, apriesa, yerba, entrambos; contractions with 'de' (desta, destas, dello, dellas, dél); -rl- becoming -ll- (honralle, decillas); pronouns hung on a verb that opens its clause (Llegóse, díjele, Diole, mandóme, Alabéle, Cumplíselos, Viola, Estábale, Levantóse, Díjole); the -ra subjunctive as a conditional ('quisiera', 'aprobara', 'se hicieran'); the future subjunctive ('fuere', 'preguntáredes', 'entendiere', 'diere'); and 'vos' with its verb forms (seáis, mostráis) beside 'vuestra merced'. Watch for false friends: puesto que (although), discreto (wise), honesto (chaste), billete (note), razones (words), prevención (warning), divertir (to throw off), accidente (fit), villano (peasant), leyenda (reading).
