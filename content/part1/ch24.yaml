      - es: "»Es, pues, el caso que, como entre los amigos no hay cosa secreta que no se comunique, y la privanza que yo tenía con don Fernando dejada de serlo por ser amistad, todos sus pensamientos me declaraba, especialmente uno enamorado, que le traía con un poco de desasosiego."
        literal: "Is, then, the case that, as among the friends not there-is thing secret that not be-shared, and the favor that I had with don Fernando left of to-be-it for to-be friendship, all his thoughts to-me he-declared, especially one amorous, that him kept with a little of unrest."
        ormsby: "It so happened, then, that as between friends no secret remains unshared, and as the favour I enjoyed with Don Fernando had grown into friendship, he made all his thoughts known to me, and in particular a love affair which troubled his mind a little."
