part: 1
chapter: 24
title_es: "Capítulo XXIV. Donde se prosigue la aventura de la Sierra Morena"
title_en: "In which is continued the adventure of the Sierra Morena"
paragraphs:
  - sentences:
      - es: "Dice la historia que era grandísima la atención con que don Quijote escuchaba al astroso Caballero de la Sierra, el cual, prosiguiendo su plática, dijo:"
        literal: "Says the history that was very-great the attention with which don Quijote listened to-the ragged Knight of the Sierra, the which, continuing his talk, said:"
        ormsby: "The history relates that it was with the greatest attention Don Quixote listened to the ragged knight of the Sierra, who began by saying:"
        vocab:
          - {w: "astroso", d: "ragged, shabby, wretched-looking"}
          - {w: "Caballero de la Sierra", d: "Knight of the Sierra: Don Quijote's name for the half-naked madman of the mountains met in the last chapter"}
          - {w: "proseguir", d: "to continue, go on with"}
          - {w: "plática", d: "talk, conversation, discourse"}
        diagram:
          - s: "Dice la historia"
            r: "main verb: the history says"
            under:
              - s: "que era grandísima la atención"
                r: "what it says: that the attention was very great"
                under:
                  - {s: "con que don Quijote escuchaba al astroso Caballero de la Sierra", r: "describes 'atención': with which Don Quijote listened to the ragged Knight"}
                  - s: "el cual"
                    r: "describes 'Caballero': who"
                    under:
                      - {s: "prosiguiendo su plática", r: "how: going on with his talk"}
                      - {s: "dijo", r: "verb of 'el cual': said"}
        forms:
          - {w: "Dice", f: "dic- + -e → decir (to say), present, it (the history). Irregular: digo, dices, dice, decimos, decís, dicen. Verb first, subject after, as often in Cervantes."}
          - {w: "era", f: "ser (to be), imperfect, it. ser's imperfect is irregular: era, eras, era, éramos, erais, eran."}
          - {w: "grandísima", f: "grand- + -ísima → grande (great), with the suffix -ísimo 'very', feminine to match 'atención'."}
          - {w: "escuchaba", f: "escuch- + -aba → escuchar (to listen to), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "al", f: "a + el; the 'a' marks a person as the object."}
          - {w: "el cual", f: "'the which' = who; masculine singular to match 'Caballero'."}
          - {w: "prosiguiendo", f: "gerund of proseguir (to continue): 'continuing'. The e of the stem turns to i in the gerund."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Por cierto, señor, quienquiera que seáis, que yo no os conozco, yo os agradezco las muestras y la cortesía que conmigo habéis usado;"
        literal: "— For certain, sir, whoever that you-may-be, for I not you know, I you thank [for] the signs and the courtesy that with-me you-have used;"
        ormsby: "“Of a surety, señor, whoever you are, for I know you not, I thank you for the proofs of kindness and courtesy you have shown me,"
        vocab:
          - {w: "por cierto", d: "certainly, to be sure"}
          - {w: "quienquiera que", d: "whoever (takes the subjunctive)"}
          - {w: "agradecer", d: "to thank for, be grateful for; the thing thanked for is the direct object"}
          - {w: "muestras", d: "signs, tokens, proofs (of kindness)"}
          - {w: "usar cortesía con", d: "to show courtesy to"}
        diagram:
          - s: "yo os agradezco"
            r: "main verb: I thank you"
            under:
              - {s: "Por cierto, señor", r: "opening: certainly, sir"}
              - {s: "quienquiera que seáis", r: "aside: whoever you may be"}
              - {s: "que yo no os conozco", r: "why I say that: for I do not know you"}
              - s: "las muestras y la cortesía"
                r: "object: what I thank you for"
                under:
                  - {s: "que conmigo habéis usado", r: "describes them: that you have shown me"}
        forms:
          - {w: "quienquiera", f: "quien (who) + quiera (from querer, to want): 'whoever'. The plural is quienesquiera."}
          - {w: "seáis", f: "se- + -áis → ser (to be), present subjunctive, you (vos, polite address to one person). Subjunctive after 'quienquiera que'. sea, seas, sea, seamos, seáis, sean."}
          - {w: "os", f: "'you' as object, the pronoun that goes with 'vos' and 'vosotros'."}
          - {w: "conozco", f: "conozc- + -o → conocer (to know a person), present, I. A z is added before the c in the I form: conozco, conoces, conoce, conocemos, conocéis, conocen."}
          - {w: "agradezco", f: "agradezc- + -o → agradecer (to thank), present, I. The same z before c: agradezco, agradeces, agradece, agradecemos, agradecéis, agradecen."}
          - {w: "conmigo", f: "con + mí fused into one word: 'with me' (also contigo, consigo)."}
          - {w: "habéis usado", f: "hab- + -éis → haber (to have), present, you (vos), + usado, the participle of usar (to use): perfect, 'you have shown'. haber in the present: he, has, ha, hemos, habéis, han."}
        note: "The madman is courteous and speaks in the polished 'vos' of a gentleman, the first hint that he is someone of rank."
      - es: "y quisiera yo hallarme en términos que con más que la voluntad pudiera servir la que habéis mostrado tenerme en el buen acogimiento que me habéis hecho, mas no quiere mi suerte darme otra cosa con que corresponda a las buenas obras que me hacen, que buenos deseos de satisfacerlas."
        literal: "and I-would-wish I to-find-myself in terms that with more than the will I-might serve the [will] that you-have shown to-have-for-me in the good welcome that to-me you-have made, but not wishes my fortune to-give-me other thing with which I-may-respond to the good works that to-me they-do, than good wishes of to-repay-them."
        ormsby: "and would I were in a condition to requite with something more than goodwill that which you have displayed towards me in the cordial reception you have given me; but my fate does not afford me any other means of returning kindnesses done me save the hearty desire to repay them.”"
        vocab:
          - {w: "hallarse en términos que", d: "to be in a position to, be so placed that"}
          - {w: "voluntad", d: "will; here goodwill, good intentions"}
          - {w: "servir", d: "here: to repay, return (a kindness) by service"}
          - {w: "acogimiento", d: "welcome, reception"}
          - {w: "mas", d: "but (no accent; literary); 'más' with the accent is 'more'"}
          - {w: "suerte", d: "fate, fortune, lot"}
          - {w: "corresponder a", d: "to return, repay (a favor)"}
          - {w: "buenas obras", d: "good deeds, kindnesses"}
          - {w: "que", d: "after 'otra cosa': than, except"}
          - {w: "satisfacer", d: "to repay, make amends for"}
        diagram:
          - s: "quisiera yo hallarme en términos"
            r: "main verb 1 (after 'y'): I would like to be in a position"
            under:
              - s: "que con más que la voluntad pudiera servir la"
                r: "result: that I could repay with more than goodwill the one (goodwill)"
                under:
                  - {s: "que habéis mostrado tenerme", r: "describes 'la': that you have shown you have for me"}
                  - {s: "en el buen acogimiento que me habéis hecho", r: "where shown: in the kind welcome you have given me"}
          - s: "mas no quiere mi suerte darme otra cosa"
            r: "main verb 2: but my fate will not give me anything else"
            under:
              - {s: "con que corresponda a las buenas obras que me hacen", r: "describes 'cosa': with which to repay the kindnesses done me"}
              - {s: "que buenos deseos de satisfacerlas", r: "except: than good wishes to repay them"}
        forms:
          - {w: "quisiera", f: "quis- + -iera → querer (to want), imperfect subjunctive (-ra form), I, used as a polite conditional: 'I would like'. quisiera, quisieras, quisiera, quisiéramos, quisierais, quisieran."}
          - {w: "hallarme", f: "hallar (to find) + me: 'to find myself, to be'. Infinitive after 'quisiera', with the pronoun stuck on the end."}
          - {w: "pudiera", f: "pud- + -iera → poder (to be able), imperfect subjunctive (-ra form), I: 'I could'. pudiera, pudieras, pudiera, pudiéramos, pudierais, pudieran."}
          - {w: "la", f: "'the one', feminine, standing for 'voluntad'."}
          - {w: "habéis mostrado, habéis hecho", f: "haber, present, you (vos), + participles of mostrar (to show) and hacer (to do, make; irregular participle 'hecho'): 'you have shown', 'you have given'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "tenerme", f: "tener (to have) + me: 'to have for me'; infinitive after 'mostrado'."}
          - {w: "quiere", f: "quier- + -e → querer (to want), present, it (my fate). The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "darme", f: "dar (to give) + me: 'to give me'."}
          - {w: "corresponda", f: "correspond- + -a → corresponder (to repay), present subjunctive, I. Subjunctive because it is a thing still looked for. The present subjunctive of -er and -ir verbs: -a, -as, -a, -amos, -áis, -an."}
          - {w: "hacen", f: "hac- + -en → hacer (to do), present, they (people in general). hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "satisfacerlas", f: "satisfacer (to repay) + las (them, feminine for 'obras')."}
  - sentences:
      - es: "— Los que yo tengo —respondió don Quijote— son de serviros;"
        literal: "— The [wishes] that I have —answered don Quijote— are of to-serve-you;"
        ormsby: "“Mine,” replied Don Quixote, “is to be of service to you,"
        vocab:
          - {w: "los que yo tengo", d: "the ones I have, i.e. my wishes (picking up 'buenos deseos')"}
          - {w: "ser de", d: "+ infinitive: to be (wishes) to, to consist in"}
        diagram:
          - s: "Los que yo tengo"
            r: "subject: the ones (wishes) that I have"
          - {s: "respondió don Quijote", r: "speech tag: answered Don Quijote"}
          - {s: "son de serviros", r: "main verb: are to serve you"}
        forms:
          - {w: "Los", f: "masculine plural, standing for 'deseos' in the madman's last words."}
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "son", f: "ser (to be), present, they. soy, eres, es, somos, sois, son."}
          - {w: "serviros", f: "servir (to serve) + os (you): infinitive after 'de'."}
      - es: "tanto, que tenía determinado de no salir destas sierras hasta hallaros y saber de vos si el dolor que en la estrañeza de vuestra vida mostráis tener se podía hallar algún género de remedio;"
        literal: "so-much, that I-had determined of not to-leave of-these mountains until to-find-you and to-know from you if the pain that in the strangeness of your life you-show to-have one-could find some kind of remedy;"
        ormsby: "so much so that I had resolved not to quit these mountains until I had found you, and learned of you whether there is any kind of relief to be found for that sorrow under which from the strangeness of your life you seem to labour;"
        vocab:
          - {w: "tanto, que", d: "so much that"}
          - {w: "tener determinado", d: "to have decided, have resolved (tener + participle, an older perfect)"}
          - {w: "destas", d: "= de estas, of these"}
          - {w: "sierra", d: "mountain range, mountains"}
          - {w: "saber de", d: "to learn from"}
          - {w: "estrañeza", d: "= extrañeza, strangeness, oddness"}
          - {w: "género", d: "kind, sort"}
        diagram:
          - {s: "tanto", r: "picks up 'son de serviros': so much so"}
          - s: "que tenía determinado"
            r: "result: that I had resolved"
            under:
              - {s: "de no salir destas sierras", r: "what: not to leave these mountains"}
              - {s: "hasta hallaros", r: "until: till I found you"}
              - s: "y saber de vos"
                r: "until, 2: and learned from you"
                under:
                  - s: "si el dolor ... se podía hallar algún género de remedio"
                    r: "what: whether some kind of remedy could be found for the pain"
                    under:
                      - {s: "que en la estrañeza de vuestra vida mostráis tener", r: "describes 'dolor': that you show you have by your strange life"}
        forms:
          - {w: "tenía determinado", f: "ten- + -ía → tener (to have), imperfect, I, + determinado, the participle of determinar (to decide): 'I had decided'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "destas", f: "= de + estas (of these), feminine plural to match 'sierras'."}
          - {w: "hallaros", f: "hallar (to find) + os (you): infinitive after 'hasta'."}
          - {w: "vos", f: "the polite 'you' for one person; it takes the verb forms of vosotros (mostráis)."}
          - {w: "estrañeza", f: "= extrañeza: Cervantes writes 'es-' for modern 'ex-' (estraño, estremo)."}
          - {w: "vuestra", f: "'your' (for vos), feminine to match 'vida'."}
          - {w: "mostráis", f: "mostr- + -áis → mostrar (to show), present, you (vos). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an (with o → ue when stressed: muestro, but mostráis)."}
          - {w: "se podía hallar", f: "pod- + -ía → poder (can), imperfect, with 'se' making it impersonal: 'one could find'. Same -ía imperfect."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun ('género'), like un, buen, gran."}
        note: "The sentence is loose: 'el dolor' is never fitted into the clause and stands where 'para el dolor' (for the pain) is meant."
      - es: "y si fuera menester buscarle, buscarle con la diligencia posible."
        literal: "and if it-were necessary to-seek-it, to-seek-it with the diligence possible."
        ormsby: "and to search for you with all possible diligence, if search had been necessary."
        vocab:
          - {w: "ser menester", d: "to be necessary"}
          - {w: "diligencia", d: "diligence, care, effort"}
        diagram:
          - s: "buscarle"
            r: "second half of 'tenía determinado de': (I had resolved) to look for it"
            under:
              - {s: "si fuera menester buscarle", r: "condition: if it were necessary to look for it"}
              - {s: "con la diligencia posible", r: "how: with all possible care"}
        forms:
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), it: 'if it were'. fuera, fueras, fuera, fuéramos, fuerais, fueran."}
          - {w: "buscarle", f: "buscar (to look for) + le (it, the remedy). Cervantes often uses 'le' for a masculine thing where modern Spanish puts 'lo'."}
      - es: "Y, cuando vuestra desventura fuera de aquellas que tienen cerradas las puertas a todo género de consuelo, pensaba ayudaros a llorarla y plañirla como mejor pudiera, que todavía es consuelo en las desgracias hallar quien se duela dellas."
        literal: "And, when your misfortune were of those that have closed the doors to all kind of consolation, I-intended to-help-you to weep-it and lament-it as best I-could, for still is consolation in the misfortunes to-find who himself grieves of-them."
        ormsby: "And if your misfortune should prove to be one of those that refuse admission to any sort of consolation, it was my purpose to join you in lamenting and mourning over it, so far as I could; for it is still some comfort in misfortune to find one who can feel for it."
        vocab:
          - {w: "cuando", d: "here with the subjunctive: even if, in case"}
          - {w: "desventura", d: "misfortune"}
          - {w: "consuelo", d: "consolation, comfort"}
          - {w: "pensar", d: "+ infinitive: to intend to"}
          - {w: "plañir", d: "to lament, bewail (literary)"}
          - {w: "todavía", d: "here: still, even so, after all"}
          - {w: "dolerse de", d: "to grieve over, feel for"}
          - {w: "dellas", d: "= de ellas, of them"}
        diagram:
          - s: "pensaba ayudaros"
            r: "main verb: I intended to help you"
            under:
              - s: "cuando vuestra desventura fuera de aquellas"
                r: "condition: if your misfortune were one of those"
                under:
                  - {s: "que tienen cerradas las puertas a todo género de consuelo", r: "describes 'aquellas': that have closed their doors to all comfort"}
              - {s: "a llorarla y plañirla", r: "help to do what: to weep and lament it"}
              - {s: "como mejor pudiera", r: "how: as best I could"}
              - s: "que todavía es consuelo en las desgracias"
                r: "why: for it is still a comfort in misfortune"
                under:
                  - {s: "hallar quien se duela dellas", r: "what is a comfort: to find someone who grieves over them"}
        forms:
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), it. fuera, fueras, fuera, fuéramos, fuerais, fueran."}
          - {w: "tienen cerradas", f: "tien- + -en → tener (to have), present, they, + cerradas, participle of cerrar (to close), feminine plural to match 'puertas': 'have shut'. tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "pensaba", f: "pens- + -aba → pensar (to intend), imperfect, I. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "ayudaros", f: "ayudar (to help) + os (you)."}
          - {w: "llorarla, plañirla", f: "llorar (to weep) and plañir (to lament) + la (it, the misfortune)."}
          - {w: "pudiera", f: "pud- + -iera → poder (to be able), imperfect subjunctive (-ra form), I. pudiera, pudieras, pudiera, pudiéramos, pudierais, pudieran."}
          - {w: "se duela", f: "duel- + -a → dolerse (to grieve), present subjunctive, he (someone). Subjunctive because the person is not yet found. The stem o becomes ue when stressed: duela, duelas, duela, dolamos, doláis, duelan."}
          - {w: "dellas", f: "= de + ellas (of them), feminine plural for 'desgracias'."}
      - es: "Y, si es que mi buen intento merece ser agradecido con algún género de cortesía, yo os suplico, señor, por la mucha que veo que en vos se encierra, y juntamente os conjuro por la cosa que en esta vida más habéis amado o amáis, que me digáis quién sois y la causa que os ha traído a vivir y a morir entre estas soledades como bruto animal, pues moráis entre ellos tan ajeno de vos mismo cual lo muestra vuestro traje y persona."
        literal: "And, if it-is that my good intent deserves to-be thanked with some kind of courtesy, I you beg, sir, by the much [courtesy] that I-see that in you is-contained, and jointly you I-conjure by the thing that in this life most you-have loved or you-love, that to-me you-tell who you-are and the cause that you has brought to live and to die among these solitudes like brute animal, since you-dwell among them so alien from you yourself as it shows your dress and person."
        ormsby: "And if my good intentions deserve to be acknowledged with any kind of courtesy, I entreat you, señor, by that which I perceive you possess in so high a degree, and likewise conjure you by whatever you love or have loved best in life, to tell me who you are and the cause that has brought you to live or die in these solitudes like a brute beast, dwelling among them in a manner so foreign to your condition as your garb and appearance show."
        vocab:
          - {w: "si es que", d: "if it is so that, if indeed"}
          - {w: "intento", d: "intention, purpose"}
          - {w: "suplicar", d: "to beg, entreat"}
          - {w: "encerrarse en", d: "to be contained in, dwell in"}
          - {w: "juntamente", d: "together, at the same time, likewise"}
          - {w: "conjurar", d: "to entreat solemnly, adjure (not 'to conjure up')"}
          - {w: "soledades", d: "solitudes, wild lonely places"}
          - {w: "bruto animal", d: "brute beast, dumb animal"}
          - {w: "morar", d: "to dwell, live"}
          - {w: "ajeno de", d: "foreign to, unlike; 'ajeno de vos mismo' = unlike your true self"}
          - {w: "cual", d: "as (literary for 'como')"}
          - {w: "traje", d: "dress, clothes"}
          - {w: "persona", d: "here: bodily appearance, figure"}
        diagram:
          - s: "yo os suplico"
            r: "main verb 1: I beg you"
            under:
              - s: "si es que mi buen intento merece ser agradecido"
                r: "condition: if my good will deserves to be thanked"
                under:
                  - {s: "con algún género de cortesía", r: "how: with some kind of courtesy"}
              - s: "por la mucha"
                r: "by what: by the great (courtesy)"
                under:
                  - {s: "que veo que en vos se encierra", r: "describes 'la mucha': that I see dwells in you"}
          - s: "y juntamente os conjuro"
            r: "main verb 2: and also I adjure you"
            under:
              - {s: "por la cosa que en esta vida más habéis amado o amáis", r: "by what: by what you have loved or love most in this life"}
          - s: "que me digáis"
            r: "what I beg: that you tell me"
            under:
              - {s: "quién sois", r: "object 1: who you are"}
              - s: "y la causa"
                r: "object 2: and the cause"
                under:
                  - {s: "que os ha traído a vivir y a morir entre estas soledades como bruto animal", r: "describes 'causa': that brought you to live and die here like a beast"}
              - s: "pues moráis entre ellos tan ajeno de vos mismo"
                r: "why I ask: since you live among them so unlike yourself"
                under:
                  - {s: "cual lo muestra vuestro traje y persona", r: "as your dress and person show"}
        forms:
          - {w: "merece", f: "merec- + -e → merecer (to deserve), present, it. A z is added before the c in the I form: merezco, mereces, merece, merecemos, merecéis, merecen."}
          - {w: "agradecido", f: "participle of agradecer (to thank); 'ser agradecido' = to be thanked."}
          - {w: "suplico", f: "suplic- + -o → suplicar (to beg), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "la mucha", f: "feminine, standing for 'cortesía': 'the great courtesy'."}
          - {w: "veo", f: "ve- + -o → ver (to see), present, I. veo, ves, ve, vemos, veis, ven."}
          - {w: "se encierra", f: "encierr- + -a → encerrarse (to be contained), present, it. The stem e becomes ie when stressed: encierro, encierras, encierra, encerramos, encerráis, encierran."}
          - {w: "conjuro", f: "conjur- + -o → conjurar (to adjure), present, I. Same -ar present."}
          - {w: "habéis amado, amáis", f: "haber (present, you, vos) + amado, participle of amar (to love): 'you have loved'; amáis, present of amar, you (vos): 'you love'. haber: he, has, ha, hemos, habéis, han. amar: amo, amas, ama, amamos, amáis, aman."}
          - {w: "digáis", f: "dig- + -áis → decir (to tell), present subjunctive, you (vos). Subjunctive after 'suplico que'. diga, digas, diga, digamos, digáis, digan."}
          - {w: "sois", f: "ser (to be), present, you (vos). soy, eres, es, somos, sois, son."}
          - {w: "ha traído", f: "ha (haber, present, it) + traído, participle of traer (to bring): 'has brought'. he, has, ha, hemos, habéis, han."}
