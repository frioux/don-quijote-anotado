  - sentences:
      - es: "»Bien es verdad que quiero confesar ahora que, puesto que yo veía con cuán justas causas don Fernando a Luscinda alababa, me pesaba de oír aquellas alabanzas de su boca, y comencé a temer y a recelarme dél, porque no se pasaba momento donde no quisiese que tratásemos de Luscinda, y él movía la plática, aunque la trujese por los cabellos;"
        literal: "Well is truth that I-want to-confess now that, although I saw with how just causes don Fernando [to] Luscinda praised, it-grieved-me of to-hear those praises from his mouth, and I-began to fear and to be-wary of-him, because not passed moment where not he-should-want that we-should-talk of Luscinda, and he moved the talk, although it he-should-drag by the hairs;"
        ormsby: "It is true, and I own it now, that though I knew what good cause Don Fernando had to praise Luscinda, it gave me uneasiness to hear these praises from his mouth, and I began to fear, and with reason to feel distrust of him, for there was no moment when he was not ready to talk of Luscinda, and he would start the subject himself even though he dragged it in unseasonably,"
        vocab:
          - {w: "bien es verdad que", d: "it is quite true that"}
          - {w: "puesto que", d: "although (a false friend: in Cervantes not 'since')"}
          - {w: "pesarle a uno", d: "to grieve someone, make them uneasy"}
          - {w: "recelarse de", d: "to be wary of, distrust"}
          - {w: "dél", d: "= de él, of him"}
          - {w: "tratar de", d: "to talk about"}
          - {w: "mover la plática", d: "to bring up the subject"}
          - {w: "traer por los cabellos", d: "to drag in by the hair: to force a topic in where it does not belong"}
        diagram:
          - s: "Bien es verdad que quiero confesar ahora"
            r: "main verb: it is true, I want to confess now"
            under:
              - s: "que ... me pesaba de oír aquellas alabanzas de su boca"
                r: "what I confess, 1: that it pained me to hear those praises from his mouth"
                under:
                  - {s: "puesto que yo veía con cuán justas causas don Fernando a Luscinda alababa", r: "although: though I saw how rightly he praised Luscinda"}
              - s: "y comencé a temer y a recelarme dél"
                r: "what I confess, 2: and I began to fear and distrust him"
                under:
                  - s: "porque no se pasaba momento"
                    r: "why: because no moment passed"
                    under:
                      - {s: "donde no quisiese que tratásemos de Luscinda", r: "describes 'momento': when he did not want us to talk of Luscinda"}
                  - s: "y él movía la plática"
                    r: "why, 2: and he would bring up the subject"
                    under:
                      - {s: "aunque la trujese por los cabellos", r: "although: even if he had to drag it in"}
        forms:
          - {w: "quiero", f: "quier- + -o → querer (to want), present, I. quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "veía", f: "ve- + -ía → ver (to see), imperfect, I. veía, veías, veía, veíamos, veíais, veían."}
          - {w: "alababa, pesaba, tratásemos", f: "alab- + -aba → alabar (to praise), he; pes- + -aba → pesar (to grieve), it: imperfect, -aba, -abas, -aba, -ábamos, -abais, -aban. trat- + -ásemos → tratar (to talk), imperfect subjunctive (-se form), we: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "comencé", f: "comenc- + -é → comenzar (to begin), preterite, I; z becomes c before e. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "se pasaba", f: "pas- + -aba → pasarse (to pass), imperfect, it. Same -aba imperfect."}
          - {w: "quisiese", f: "quis- + -iese → querer (to want), imperfect subjunctive (-se form), he. quisiese, quisieses, quisiese, quisiésemos, quisieseis, quisiesen."}
          - {w: "movía", f: "mov- + -ía → mover (to move), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "trujese", f: "truj- + -ese → traer (to bring), imperfect subjunctive (-se form), he: old form of 'trajese'. trujese, trujeses, trujese, trujésemos, trujeseis, trujesen."}
