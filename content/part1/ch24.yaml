  - sentences:
      - es: "»Sucedió, pues, que, como el amor en los mozos, por la mayor parte, no lo es, sino apetito, el cual, como tiene por último fin el deleite, en llegando a alcanzarle se acaba y ha de volver atrás aquello que parecía amor, porque no puede pasar adelante del término que le puso naturaleza, el cual término no le puso a lo que es verdadero amor...;"
        literal: "It-happened, then, that, as the love in the young-men, for the greater part, not it is, but appetite, the which, as it-has for last end the pleasure, on coming to attain-it itself ends and has to turn back that which seemed love, because not it-can pass beyond of-the limit that to-it set nature, the which limit not it set to that which is true love...;"
        ormsby: "It happened, then, that as with young men love is for the most part nothing more than appetite, which, as its final object is enjoyment, comes to an end on obtaining it, and that which seemed to be love takes to flight, as it cannot pass the limit fixed by nature, which fixes no limit to true love—"
