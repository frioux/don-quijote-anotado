  - sentences:
      - es: "El Caballero del Bosque, que de tal manera oyó hablar al de la Triste Figura, no hacía sino mirarle, y remirarle y tornarle a mirar de arriba abajo; y, después que le hubo bien mirado, le dijo:"
        literal: "The Knight of-the Wood, who in such manner heard speak [to] the [knight] of the Sad Figure, not did but to-look-at-him, and to-look-again-at-him and to-turn-him to look from above below; and, after that him he-had well looked-at, to-him said:"
        ormsby: "The Knight of the Thicket, hearing him of the Rueful Countenance talk in this strain, did nothing but stare at him, and stare at him again, and again survey him from head to foot; and when he had thoroughly examined him, he said to him:"
        vocab:
          - {w: "Caballero del Bosque", d: "Knight of the Wood: another of the narrator's names for the madman"}
          - {w: "el de la Triste Figura", d: "the one of the Sad Figure: Don Quijote, by the title Sancho gave him in chapter 19 ('Knight of the Rueful Countenance')"}
          - {w: "no hacer sino", d: "to do nothing but"}
          - {w: "remirar", d: "to look at again, look over closely"}
          - {w: "tornar a", d: "+ infinitive: to do again"}
          - {w: "de arriba abajo", d: "from top to bottom, from head to foot"}
        diagram:
          - s: "El Caballero del Bosque"
            r: "subject: the Knight of the Wood"
            under:
              - {s: "que de tal manera oyó hablar al de la Triste Figura", r: "describes him: who heard the Knight of the Sad Figure speak like this"}
          - s: "no hacía sino mirarle"
            r: "main verb 1: did nothing but look at him"
            under:
              - {s: "y remirarle y tornarle a mirar de arriba abajo", r: "more of the same: and look again and look him over from head to foot"}
          - s: "le dijo"
            r: "main verb 2 (after 'y'): said to him"
            under:
              - {s: "después que le hubo bien mirado", r: "when: after he had looked him over well"}
        forms:
          - {w: "oyó", f: "o- + -yó → oír (to hear), preterite, he. oí, oíste, oyó, oímos, oísteis, oyeron."}
          - {w: "hablar", f: "infinitive after 'oyó': 'heard [him] speak'."}
          - {w: "hacía", f: "hac- + -ía → hacer (to do), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "mirarle, remirarle, tornarle", f: "mirar (to look at), remirar (to look at again), tornar (to turn; 'tornar a' = do again), each + le (him)."}
          - {w: "hubo ... mirado", f: "hub- + -o → haber, preterite, he, + mirado, the participle of mirar: 'had looked', the past anterior, used after 'después que'. hube, hubiste, hubo, hubimos, hubisteis, hubieron."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Si tienen algo que darme a comer, por amor de Dios que me lo den; que, después de haber comido, yo haré todo lo que se me manda, en agradecimiento de tan buenos deseos como aquí se me han mostrado."
        literal: "— If they-have something that to-give-me to eat, for love of God that to-me it they-give; for, after of to-have eaten, I will-do all that which to-me is-ordered, in thanks of such good wishes as here to-me have-been shown."
        ormsby: "“If you have anything to give me to eat, for God’s sake give it me, and after I have eaten I will do all you ask in acknowledgment of the goodwill you have displayed towards me.”"
        vocab:
          - {w: "algo que darme a comer", d: "something to give me to eat"}
          - {w: "por amor de Dios", d: "for the love of God, for God's sake"}
          - {w: "agradecimiento", d: "gratitude, thanks"}
          - {w: "tan ... como", d: "such ... as"}
        diagram:
          - s: "que me lo den"
            r: "main verb: let them give it to me"
            under:
              - {s: "Si tienen algo que darme a comer", r: "condition: if they have anything to give me to eat"}
              - {s: "por amor de Dios", r: "plea: for God's sake"}
          - s: "yo haré todo lo"
            r: "main verb 2: I will do everything"
            under:
              - {s: "después de haber comido", r: "when: after having eaten"}
              - {s: "que se me manda", r: "describes 'todo lo': that I am told"}
              - {s: "en agradecimiento de tan buenos deseos como aquí se me han mostrado", r: "why: in thanks for the goodwill shown me here"}
        forms:
          - {w: "tienen", f: "tien- + -en → tener (to have), present, they. tengo, tienes, tiene, tenemos, tenéis, tienen. He turns from 'vos' to 'they', speaking of the whole group."}
          - {w: "darme", f: "dar (to give) + me."}
          - {w: "den", f: "d- + -en → dar (to give), present subjunctive, they: 'let them give'. 'que' + subjunctive makes a wish or request. dé, des, dé, demos, deis, den."}
          - {w: "haber comido", f: "haber (infinitive) + comido, participle of comer (to eat): 'having eaten', after 'después de'."}
          - {w: "haré", f: "har- + -é → hacer (to do), future, I. Irregular stem har-: haré, harás, hará, haremos, haréis, harán."}
          - {w: "se me manda", f: "mand- + -a → mandar (to order), present, it, with passive 'se': 'is ordered of me'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "se me han mostrado", f: "han (haber, present, they) + mostrado, participle of mostrar (to show), with passive 'se': 'have been shown to me'. he, has, ha, hemos, habéis, han."}
  - sentences:
      - es: "Luego sacaron, Sancho de su costal y el cabrero de su zurrón, con que satisfizo el Roto su hambre, comiendo lo que le dieron como persona atontada, tan apriesa que no daba espacio de un bocado al otro, pues antes los engullía que tragaba;"
        literal: "At-once they-took-out, Sancho from his sack and the goatherd from his pouch, [that] with which satisfied the Ragged-one his hunger, eating that which to-him they-gave like person dazed, so in-a-hurry that not he-gave space from one mouthful to-the other, since rather them he-gulped-down than swallowed;"
        ormsby: "Sancho from his sack, and the goatherd from his pouch, furnished the Ragged One with the means of appeasing his hunger, and what they gave him he ate like a halfwitted being, so hastily that he took no time between mouthfuls, gorging rather than swallowing;"
        vocab:
          - {w: "luego", d: "at once, immediately (its usual sense in Cervantes, not 'later')"}
          - {w: "costal", d: "sack, bag"}
          - {w: "zurrón", d: "shepherd's leather pouch, scrip"}
          - {w: "satisfacer el hambre", d: "to satisfy one's hunger"}
          - {w: "el Roto", d: "the Ragged One: the narrator's nickname for the madman, from 'roto' (torn)"}
          - {w: "atontado", d: "dazed, stupefied, half-witted"}
          - {w: "apriesa", d: "= aprisa, hurriedly, fast"}
          - {w: "bocado", d: "mouthful, bite"}
          - {w: "antes ... que", d: "rather ... than"}
          - {w: "engullir", d: "to gulp down, wolf"}
          - {w: "tragar", d: "to swallow"}
