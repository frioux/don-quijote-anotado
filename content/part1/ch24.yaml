          - s: "determiné poner por obra y acabar en un punto"
            r: "main verb: I decided to carry out and finish at once"
            under:
              - s: "En efeto, viéndome apurado"
                r: "why: in short, seeing myself hard-pressed"
                under:
                  - {s: "y que mi alma se consumía con el deseo de verla", r: "and (seeing) that my soul was wasting away with longing to see her"}
              - s: "lo que me pareció"
