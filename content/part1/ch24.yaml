          - {w: "añadió", f: "añad- + -ió → añadir (to add), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "recebí", f: "receb- + -í → recebir (= recibir, to receive), preterite, I. Same -ir preterite. Cervantes often has e where modern Spanish has i (recebir, escrebir)."}
