          - {w: "siguiesen", f: "sigu- + -iesen → seguir (to follow), imperfect subjunctive (-se form), they. The e of the stem turns to i. The -se endings for -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen. Subjunctive because it is a command reported in the past."}
