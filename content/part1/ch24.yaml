          - {w: "atontada", f: "participle of atontar (to stun), feminine to match 'persona'."}
          - {w: "daba", f: "d- + -aba → dar (to give), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "engullía, tragaba", f: "engull- + -ía → engullir (to gulp), imperfect, he; trag- + -aba → tragar (to swallow), same -aba imperfect. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían. 'los' = them (the mouthfuls)."}
