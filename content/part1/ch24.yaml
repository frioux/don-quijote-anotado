          - {w: "pareciéndome", f: "pareciendo, the gerund of parecer (to seem), + me (to me), accent added."}
          - {w: "llevaba, deseaba", f: "llevar (to carry), desear (to desire), imperfect, he / I. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
