          - {w: "viéndome", f: "viendo, the gerund of ver (to see), + me (myself), with an accent added."}
          - {w: "se consumía, convenía", f: "consumirse (to waste away), convenir (to be fitting), imperfect, it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
