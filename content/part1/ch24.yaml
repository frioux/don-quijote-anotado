          - {w: "profesión", d: "profession in the religious sense: the vow and calling of a knight"}
          - {w: "complacer", d: "to please, gratify, oblige"}
          - {w: "veras", d: "earnestness; 'con las veras' = in all earnest, with all zeal"}
