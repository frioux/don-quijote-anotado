  - sentences:
      - es: "— No se me puede quitar del pensamiento, ni habrá quien me lo quite en el mundo, ni quien me dé a entender otra cosa (y sería un majadero el que lo contrario entendiese o creyese), sino que aquel bellaconazo del maestro Elisabat estaba amancebado con la reina Madésima."
        literal: "— Not from-me can-it be-taken from-the thought, nor there-will-be who from-me it may-take in the world, nor who me may-give to understand other thing (and would-be a blockhead he who the contrary should-understand or should-believe), but that that big-scoundrel of-the master Elisabat was living-in-sin with the queen Madésima."
        ormsby: "“I cannot get rid of the idea, nor will anyone in the world remove it, or make me think otherwise—and he would be a blockhead who would hold or believe anything else than that that arrant knave Master Elisabad made free with Queen Madasima.”"
        vocab:
          - {w: "quitar del pensamiento", d: "to put out of someone's head"}
          - {w: "dar a entender", d: "to make (someone) believe, persuade"}
          - {w: "majadero", d: "fool, blockhead"}
          - {w: "bellaconazo", d: "big scoundrel, arrant knave (bellaco + the augmentative -azo)"}
          - {w: "maestro Elisabat", d: "Master Elisabad, the surgeon-priest in Amadís de Gaula who travels with Queen Madásima; 'maestro' was the title of a surgeon"}
          - {w: "amancebado", d: "living in concubinage, having an affair"}
          - {w: "reina Madésima / Madásima", d: "Queen Madásima, a noble lady in Amadís de Gaula; the spelling wavers in the first edition"}
        diagram:
          - s: "No se me puede quitar del pensamiento"
            r: "main verb 1: it cannot be taken out of my head"
            under:
              - {s: "sino que aquel bellaconazo del maestro Elisabat estaba amancebado con la reina Madésima", r: "what: that that great rogue Master Elisabat was the lover of Queen Madésima"}
          - {s: "ni habrá quien me lo quite en el mundo", r: "main verb 2: nor will there be anyone in the world to take it from me"}
          - {s: "ni quien me dé a entender otra cosa", r: "nor anyone to make me think otherwise"}
          - {s: "y sería un majadero el que lo contrario entendiese o creyese", r: "aside: and anyone who thought or believed otherwise would be a fool"}
        forms:
          - {w: "se me puede quitar", f: "pued- + -e → poder (can), present, it, with passive 'se': 'it can be taken from me'. puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "habrá", f: "habr- + -á → haber, future, used alone: 'there will be'. habré, habrás, habrá, habremos, habréis, habrán."}
          - {w: "quite, dé", f: "quit- + -e → quitar (to take away), present subjunctive: -e, -es, -e, -emos, -éis, -en; dé → dar (to give), present subjunctive: dé, des, dé, demos, deis, den. Subjunctive after 'no habrá quien'."}
          - {w: "sería", f: "ser + -ía → ser (to be), conditional, he. The conditional: infinitive + -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "entendiese, creyese", f: "entend- + -iese → entender (to understand), crey- + -ese → creer (to believe; i becomes y), imperfect subjunctive (-se form), he. -iese, -ieses, -iese, -iésemos, -ieseis, -iesen."}
          - {w: "bellaconazo", f: "bellaco (rogue) + -ón + -azo, two augmentatives: 'great big rogue'."}
          - {w: "estaba amancebado", f: "est- + -aba → estar (to be), imperfect, he, + amancebado, participle of amancebarse (to live in sin). -aba, -abas, -aba, -ábamos, -abais, -aban."}
        note: "In Amadís de Gaula nothing improper passes between Madásima and Elisabat; Cardenio's slur on a fictional lady's honor is exactly what Don Quijote cannot let pass."
