  - sentences:
      - es: "— Si gustáis, señores, que os diga en breves razones la inmensidad de mis desventuras, habéisme de prometer de que con ninguna pregunta, ni otra cosa, no interromperéis el hilo de mi triste historia; porque en el punto que lo hagáis, en ése se quedará lo que fuere contando."
        literal: "— If you-please, sirs, that to-you I-tell in brief words the immensity of my misfortunes, you-have-me to promise of that with no question, nor other thing, not you-will-interrupt the thread of my sad history; because in the point that it you-do, in that-one will-stop that which I-may-be telling."
        ormsby: "“If it is your wish, sirs, that I should disclose in a few words the surpassing extent of my misfortunes, you must promise not to break the thread of my sad story with any question or other interruption, for the instant you do so the tale I tell will come to an end.”"
        vocab:
          - {w: "gustar", d: "here: to wish, like (with 'que' + subjunctive)"}
          - {w: "en breves razones", d: "in a few words"}
          - {w: "haber de", d: "+ infinitive: must, have to"}
          - {w: "interromper", d: "= interrumpir, to interrupt (old spelling)"}
          - {w: "hilo", d: "thread (of a story)"}
          - {w: "en el punto que", d: "at the moment that, the instant"}
          - {w: "quedarse", d: "here: to stop short, be left there"}
        diagram:
          - s: "habéisme de prometer"
            r: "main verb: you must promise me"
            under:
              - s: "Si gustáis, señores, que os diga"
                r: "condition: if you wish, sirs, that I tell you"
                under:
                  - {s: "en breves razones la inmensidad de mis desventuras", r: "what: in few words the vastness of my misfortunes"}
              - {s: "de que con ninguna pregunta, ni otra cosa, no interromperéis el hilo de mi triste historia", r: "what you promise: that you will not break the thread of my story with any question"}
              - s: "porque ... en ése se quedará lo que fuere contando"
                r: "why: because my tale will stop right there"
                under:
                  - {s: "en el punto que lo hagáis", r: "when: the moment you do it"}
        forms:
