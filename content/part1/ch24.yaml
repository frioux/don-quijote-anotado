  - sentences:
      - es: "Estas razones del Roto trujeron a la memoria a don Quijote el cuento que le había contado su escudero, cuando no acertó el número de las cabras que habían pasado el río y se quedó la historia pendiente. Pero, volviendo al Roto, prosiguió diciendo:"
        literal: "These words of-the Ragged-one brought to the memory to don Quijote the tale that to-him had told his squire, when not he-hit the number of the goats that had crossed the river and remained the story pending. But, returning to-the Ragged-one, he-continued saying:"
        ormsby: "These words of the Ragged One reminded Don Quixote of the tale his squire had told him, when he failed to keep count of the goats that had crossed the river and the story remained unfinished; but to return to the Ragged One, he went on to say:"
        vocab:
          - {w: "razones", d: "words, remarks (not 'reasons')"}
          - {w: "trujeron", d: "= trajeron, they brought (old preterite of traer)"}
          - {w: "traer a la memoria", d: "to bring to mind, remind"}
          - {w: "acertar", d: "to get right, hit on"}
          - {w: "pendiente", d: "hanging, unfinished"}
          - {w: "volviendo a", d: "returning to (the subject of)"}
        diagram:
          - s: "Estas razones del Roto trujeron a la memoria a don Quijote"
            r: "main verb 1: these words of the Ragged One reminded Don Quijote of"
            under:
              - s: "el cuento"
                r: "object: the tale"
                under:
                  - {s: "que le había contado su escudero", r: "describes 'cuento': that his squire had told him"}
                  - s: "cuando no acertó el número de las cabras"
                    r: "when: when he did not get the number of goats right"
                    under:
                      - {s: "que habían pasado el río", r: "describes 'cabras': that had crossed the river"}
                  - {s: "y se quedó la historia pendiente", r: "and the story was left hanging"}
          - s: "prosiguió diciendo"
            r: "main verb 2 (after 'Pero'): he (the Ragged One) went on saying"
            under:
              - {s: "volviendo al Roto", r: "aside: to return to the Ragged One"}
        forms:
          - {w: "trujeron", f: "truj- + -eron → traer (to bring), preterite, they: old form of 'trajeron'. truje, trujiste, trujo, trujimos, trujisteis, trujeron."}
          - {w: "había contado, habían pasado", f: "hab- + -ía / -ían → haber, imperfect, he / they, + participles of contar (to tell) and pasar (to cross): pluperfect, 'had told', 'had crossed'. había, habías, había, habíamos, habíais, habían."}
          - {w: "acertó", f: "acert- + -ó → acertar (to get right), preterite, he (Sancho). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "se quedó", f: "qued- + -ó → quedarse (to remain), preterite, it. Same -ar preterite."}
          - {w: "volviendo, diciendo", f: "gerunds of volver (to return) and decir (to say; e → i: diciendo)."}
          - {w: "prosiguió", f: "prosigu- + -ió → proseguir (to continue), preterite, he. The e of the stem becomes i: proseguí, proseguiste, prosiguió, proseguimos, proseguisteis, prosiguieron."}
        note: "Sancho's story of the goatherd Torralba, ferrying three hundred goats across a river one at a time, stopped dead in chapter 20 when Don Quijote lost count of the goats. Cardenio's condition is the same trick in reverse."
  - sentences:
      - es: "— Esta prevención que hago es porque querría pasar brevemente por el cuento de mis desgracias;"
        literal: "— This warning that I-make is because I-would-like to-pass briefly through the tale of my misfortunes;"
        ormsby: "“I give you this warning because I wish to pass briefly over the story of my misfortunes,"
        vocab:
          - {w: "prevención", d: "warning, forewarning (a false friend: not 'prevention')"}
          - {w: "pasar por", d: "here: to go through, pass over"}
        diagram:
          - s: "Esta prevención"
            r: "subject: this warning"
            under:
              - {s: "que hago", r: "describes it: that I give"}
          - s: "es porque querría"
            r: "main verb: is because I would like"
            under:
              - {s: "pasar brevemente por el cuento de mis desgracias", r: "what: to go briefly through the tale of my misfortunes"}
        forms:
          - {w: "hago", f: "hag- + -o → hacer (to make), present, I. hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "querría", f: "querr- + -ía → querer (to want), conditional, I: 'I would like'. Irregular stem querr-: querría, querrías, querría, querríamos, querríais, querrían."}
          - {w: "brevemente", f: "breve (brief) + -mente: 'briefly'."}
      - es: "que el traerlas a la memoria no me sirve de otra cosa que añadir otras de nuevo, y, mientras menos me preguntáredes, más presto acabaré yo de decillas, puesto que no dejaré por contar cosa alguna que sea de importancia para no satisfacer del todo a vuestro deseo."
        literal: "for the to-bring-them to the memory not to-me serves of other thing than to-add others anew, and, the less me you-may-ask, more quickly will-finish I of telling-them, although not I-will-leave for telling thing any that may-be of importance for not to-satisfy wholly [to] your desire."
        ormsby: "for recalling them to memory only serves to add fresh ones, and the less you question me the sooner shall I make an end of the recital, though I shall not omit to relate anything of importance in order fully to satisfy your curiosity.”"
        vocab:
          - {w: "servir de", d: "to serve as, be good for"}
          - {w: "de nuevo", d: "anew, fresh"}
          - {w: "mientras menos ... más", d: "the less ... the more (modern 'cuanto menos ... más')"}
          - {w: "presto", d: "quickly, soon"}
          - {w: "decillas", d: "= decirlas, to tell them"}
          - {w: "puesto que", d: "although (a false friend: in Cervantes not 'since')"}
          - {w: "dejar por contar", d: "to leave untold"}
          - {w: "del todo", d: "completely"}
        diagram:
          - s: "no me sirve de otra cosa"
            r: "main verb 1 (after 'que', for): serves me for nothing else"
            under:
              - {s: "el traerlas a la memoria", r: "subject: bringing them to mind"}
              - {s: "que añadir otras de nuevo", r: "than: but to add new ones"}
          - s: "más presto acabaré yo de decillas"
            r: "main verb 2 (after 'y'): the sooner I will finish telling them"
            under:
              - {s: "mientras menos me preguntáredes", r: "the less you ask me"}
              - s: "puesto que no dejaré por contar cosa alguna"
                r: "although: though I will not leave anything untold"
                under:
                  - {s: "que sea de importancia", r: "describes 'cosa': that is of importance"}
                  - {s: "para no satisfacer del todo a vuestro deseo", r: "so as (not) to fail to satisfy your wish fully"}
        forms:
          - {w: "el traerlas", f: "infinitive traer (to bring) + las (them, the misfortunes), made a noun with 'el': 'the bringing of them'."}
          - {w: "sirve", f: "sirv- + -e → servir (to serve), present, it. The e of the stem becomes i: sirvo, sirves, sirve, servimos, servís, sirven."}
          - {w: "preguntáredes", f: "pregunt- + -áredes → preguntar (to ask), future subjunctive, you (vosotros), old ending -áredes for -areis. The future subjunctive of -ar verbs: -are, -ares, -are, -áremos, -areis (-áredes), -aren. Modern Spanish: 'preguntéis'."}
          - {w: "acabaré, dejaré", f: "acabar (to finish), dejar (to leave) + -é: future, I. The future: infinitive + -é, -ás, -á, -emos, -éis, -án."}
          - {w: "decillas", f: "= decirlas: decir + las, with -rl- turned into -ll-, an old sound change."}
          - {w: "alguna", f: "after the noun and with 'no' it means 'any at all': 'no ... cosa alguna' = nothing whatever."}
          - {w: "sea", f: "se- + -a → ser (to be), present subjunctive, it. sea, seas, sea, seamos, seáis, sean. Subjunctive in a relative clause about a thing not yet known."}
          - {w: "del", f: "de + el."}
        note: "The final clause is a muddle in the Spanish: 'para no satisfacer' says the opposite of what he means ('so as not to leave your wish unsatisfied'). Ormsby renders the sense."
