              - {s: "pues antes los engullía que tragaba", r: "why I say so: for he gulped rather than swallowed them"}
        forms:
          - {w: "sacaron", f: "sac- + -aron → sacar (to take out), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "satisfizo", f: "satisfiz- + -o → satisfacer (to satisfy), preterite, he. It goes like hacer: satisfice, satisficiste, satisfizo, satisficimos, satisficisteis, satisficieron."}
          - {w: "comiendo", f: "gerund of comer (to eat)."}
