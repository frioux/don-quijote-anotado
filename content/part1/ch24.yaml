  - sentences:
      - es: "— Déjeme vuestra merced, señor Caballero de la Triste Figura, que en éste, que es villano como yo y no está armado caballero, bien puedo a mi salvo satisfacerme del agravio que me ha hecho, peleando con él mano a mano, como hombre honrado."
        literal: "— Leave-me your grace, sir Knight of the Sad Figure, for on this-one, who is peasant like me and not is armed knight, well I-can at my safety satisfy-myself for-the offense that to-me he-has done, fighting with him hand to hand, like man honorable."
        ormsby: "“Leave me alone, Sir Knight of the Rueful Countenance,” said Sancho, grappling with the goatherd, “for of this fellow, who is a clown like myself, and no dubbed knight, I can safely take satisfaction for the affront he has offered me, fighting with him hand to hand like an honest man.”"
        vocab:
          - {w: "Caballero de la Triste Figura", d: "Knight of the Sad Figure (Ormsby's 'Rueful Countenance'), the title Sancho gave Don Quijote in chapter 19"}
          - {w: "villano", d: "peasant, commoner (not 'villain')"}
          - {w: "armado caballero", d: "dubbed a knight"}
          - {w: "a mi salvo", d: "safely, with a clear conscience"}
          - {w: "satisfacerse de", d: "to get satisfaction for, avenge"}
          - {w: "agravio", d: "offense, wrong, insult"}
          - {w: "mano a mano", d: "hand to hand, one on one"}
          - {w: "honrado", d: "honorable, decent"}
        diagram:
          - s: "Déjeme vuestra merced, señor Caballero de la Triste Figura"
            r: "main verb 1: let me be, your worship, Sir Knight of the Sad Figure"
          - s: "que ... bien puedo a mi salvo satisfacerme"
            r: "main verb 2 (after 'que', for): for I can safely take satisfaction"
            under:
              - s: "en éste"
                r: "on whom: on this fellow"
                under:
                  - {s: "que es villano como yo y no está armado caballero", r: "describes him: who is a peasant like me and not a dubbed knight"}
              - {s: "del agravio que me ha hecho", r: "for what: for the wrong he has done me"}
              - {s: "peleando con él mano a mano, como hombre honrado", r: "how: fighting him man to man, like a decent man"}
        forms:
          - {w: "Déjeme", f: "dej- + -e + me → dejar (to leave), present subjunctive used as a polite command, he (your worship), with 'me' stuck on. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "éste", f: "'this one', the accent marks the pronoun use (an old rule)."}
          - {w: "está armado", f: "est- + -á → estar (to be), present, he, + armado, participle of armar (to arm, dub): 'is dubbed'. estoy, estás, está, estamos, estáis, están."}
          - {w: "puedo", f: "pued- + -o → poder (can), present, I. puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "satisfacerme", f: "satisfacer (to satisfy) + me (myself)."}
          - {w: "ha hecho", f: "ha (haber, present, he) + hecho, irregular participle of hacer (to do): 'has done'. he, has, ha, hemos, habéis, han."}
          - {w: "peleando", f: "gerund of pelear (to fight)."}
        note: "Sancho is using his master's own rule: a knight may not fight a commoner, but a squire may fight his equal. Don Quijote had told him in chapter 8 to defend himself only against men of his own class."
