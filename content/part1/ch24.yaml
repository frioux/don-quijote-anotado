      - es: "Y juro —añadió don Quijote—, por la orden de caballería que recebí, aunque indigno y pecador, y por la profesión de caballero andante, que si en esto, señor, me complacéis, de serviros con las veras a que me obliga el ser quien soy:"
        literal: "And I-swear —added don Quijote—, by the order of chivalry that I-received, although unworthy and sinner, and by the profession of knight errant, that if in this, sir, me you-please, of to-serve-you with the earnestness to which me obliges the being who I-am:"
