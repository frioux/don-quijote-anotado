part: 1
chapter: 7
title_es: "Capítulo VII. De la segunda salida de nuestro buen caballero don Quijote de la Mancha"
title_en: "Of the second sally of our worthy knight Don Quixote of La Mancha"
paragraphs:
  - sentences:
      - es: "Estando en esto, comenzó a dar voces don Quijote, diciendo:"
        literal: "Being in this, began to give shouts Don Quijote, saying:"
        ormsby: "At this instant Don Quixote began shouting out,"
        vocab:
          - {w: "estando en esto", d: "at this point, while they were busy with this; the priest and barber are in the middle of sorting his library"}
          - {w: "dar voces", d: "to shout, cry out (literally 'give voices')"}
        diagram:
          - s: "comenzó a dar voces"
            r: "main verb: began to shout"
            under:
              - {s: "Estando en esto", r: "when: while they were at this"}
              - {s: "don Quijote", r: "subject, placed after the verb"}
              - {s: "diciendo:", r: "how: saying (the speech follows)"}
        forms:
          - {w: "Estando", f: "est- + -ando → gerund of estar (to be): 'being'. Here it sets the scene: 'while [they] were at this'."}
          - {w: "comenzó", f: "comenz- + -ó → comenzar (to begin), preterite, he: 'began'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (the 'I' form is spelled 'comencé', z turning to c before e). 'comenzar a' + infinitive = to begin to."}
          - {w: "dar", f: "infinitive of dar (to give) after 'comenzó a'."}
          - {w: "diciendo", f: "dic- + -iendo → gerund of decir (to say), with the stem vowel e turned to i: 'saying'."}
        note: "The chapter opens in the middle of a scene: the priest and the barber have been going through Don Quijote's library book by book, deciding which to burn, while he sleeps off his beating."
  - sentences:
      - es: "— Aquí, aquí, valerosos caballeros; aquí es menester mostrar la fuerza de vuestros valerosos brazos, que los cortesanos llevan lo mejor del torneo."
        literal: "— Here, here, valiant knights; here [it] is needful to-show the strength of your valiant arms, for the courtiers carry-off the best of-the tourney."
        ormsby: "“Here, here, valiant knights! here is need for you to put forth the might of your strong arms, for they of the Court are gaining the mastery in the tourney!”"
        vocab:
          - {w: "valeroso", d: "valiant, brave"}
          - {w: "es menester", d: "it is necessary, there is need (menester = need); very common in Cervantes"}
          - {w: "brazo", d: "arm"}
          - {w: "cortesanos", d: "courtiers; in a romance tournament, the knights of the king's court, fighting against the 'aventureros', the wandering knights"}
          - {w: "llevar lo mejor", d: "to have the best of it, be winning"}
          - {w: "torneo", d: "tournament, tourney"}
        diagram:
          - {s: "Aquí, aquí, valerosos caballeros", r: "call to his comrades: here, here, valiant knights"}
          - s: "aquí es menester"
            r: "main verb: here there is need"
            under:
              - {s: "mostrar la fuerza de vuestros valerosos brazos", r: "need for what: to show the strength of your arms"}
              - {s: "que los cortesanos llevan lo mejor del torneo", r: "loose 'que' = 'for': why, the court knights are winning"}
        forms:
          - {w: "valerosos", f: "valeros- + -os → valeroso (valiant), masculine plural to match 'caballeros', and again to match 'brazos'."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son. 'es menester' = it is needful."}
          - {w: "mostrar", f: "infinitive of mostrar (to show), the thing that 'es menester'."}
          - {w: "vuestros", f: "vuestr- + -os → 'your' (belonging to 'vosotros', you all), masculine plural to match 'brazos': vuestro, vuestra, vuestros, vuestras."}
          - {w: "llevan", f: "llev- + -an → llevar (to carry off), present, they (the courtiers). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "lo mejor", f: "neuter 'lo' + mejor (best): 'the best part'."}
          - {w: "del", f: "de + el (of the)."}
        note: "He is dreaming that he is in a romance tournament, the adventurer knights against the knights of the court. The joke is that his dream-battle breaks up the priest's real 'trial' of his books."
  - sentences:
      - es: "Por acudir a este ruido y estruendo, no se pasó adelante con el escrutinio de los demás libros que quedaban;"
        literal: "For to-come-running to this noise and din, not was-gone forward with the scrutiny of the other books that remained;"
        ormsby: "Called away by this noise and outcry, they proceeded no farther with the scrutiny of the remaining books,"
        vocab:
          - {w: "acudir a", d: "to come running to, respond to (a call or noise)"}
          - {w: "estruendo", d: "din, uproar, crash"}
          - {w: "pasar adelante con", d: "to go on with, proceed with"}
          - {w: "escrutinio", d: "scrutiny, examination; also the counting of votes, so it sounds like an official inquiry"}
          - {w: "los demás", d: "the rest, the other"}
          - {w: "quedar", d: "to remain, be left"}
        diagram:
          - s: "no se pasó adelante"
            r: "main verb: there was no going on; impersonal, no named subject"
            under:
              - {s: "Por acudir a este ruido y estruendo", r: "why: because of running to this noise"}
              - s: "con el escrutinio de los demás libros"
                r: "with what: the examination of the other books"
                under:
                  - {s: "que quedaban", r: "describes 'libros': that were left"}
        forms:
          - {w: "acudir", f: "infinitive of acudir (to come running) after 'por': 'por' + infinitive = 'because of doing'."}
          - {w: "este", f: "'this', masculine singular to match 'ruido': este, esta, estos, estas."}
          - {w: "se pasó", f: "pas- + -ó → pasar (to pass, go on), preterite, it, with impersonal 'se': 'there was no going on' = they did not go on. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "los demás", f: "'the other'; 'demás' never changes and always takes the article."}
          - {w: "quedaban", f: "qued- + -aban → quedar (to remain), imperfect, they (the books). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
      - es: "y así, se cree que fueron al fuego, sin ser vistos ni oídos, La Carolea y León de España, con Los Hechos del Emperador, compuestos por don Luis de Ávila, que, sin duda, debían de estar entre los que quedaban;"
        literal: "and thus, it-is-believed that went to-the fire, without being seen nor heard, La Carolea and León de España, with Los Hechos del Emperador, composed by Don Luis de Ávila, which, without doubt, must have been among those that remained;"
        ormsby: "and so it is thought that The Carolea, The Lion of Spain, and The Deeds of the Emperor, written by Don Luis de Avila, went to the fire unseen and unheard; for no doubt they were among those that remained,"
        vocab:
          - {w: "se cree", d: "it is believed, people think"}
          - {w: "sin ser vistos ni oídos", d: "without being seen or heard; 'sin ser oído' is also the legal phrase for condemning someone without a hearing"}
          - {w: "La Carolea", d: "an epic poem (1560) by Jerónimo Sempere on the victories of the Emperor Charles V"}
          - {w: "León de España", d: "an epic poem (1586) by Pedro de la Vecilla on the history of the city of León"}
          - {w: "Los Hechos del Emperador", d: "'The Deeds of the Emperor'; no book by this title is known; Cervantes may mean another poem on Charles V"}
          - {w: "Luis de Ávila", d: "Luis de Ávila y Zúñiga, soldier and historian who wrote a prose commentary on Charles V's war in Germany"}
          - {w: "deber de", d: "must (a guess): 'debían de estar' = they must have been"}
        diagram:
          - s: "se cree"
            r: "main verb: it is believed"
            under:
              - s: "que fueron al fuego"
                r: "what is believed: that they went to the fire"
                under:
                  - {s: "sin ser vistos ni oídos", r: "how: unseen and unheard"}
                  - {s: "La Carolea y León de España", r: "subject of 'fueron', placed after it: two books"}
                  - s: "con Los Hechos del Emperador"
                    r: "subject, continued: along with a third book"
                    under:
                      - {s: "compuestos por don Luis de Ávila", r: "describes the books: written by Luis de Ávila"}
                  - s: "que, sin duda, debían de estar entre los que quedaban"
                    r: "describes the books: which no doubt must have been among those left"
        forms:
          - {w: "se cree", f: "cre- + -e → creer (to believe), present, it, with impersonal 'se': 'it is believed'. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "fueron", f: "ir (to go), preterite, they: 'went'. ir's preterite is irregular (and the same as ser's): fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "al", f: "a + el (to the)."}
          - {w: "ser vistos ni oídos", f: "ser (to be) + participles, a passive infinitive after 'sin': 'without being seen or heard'. vistos is the irregular participle of ver (to see); oídos the participle of oír (to hear); both masculine plural to match the books."}
          - {w: "compuestos", f: "compuest- + -os → compuesto, the irregular participle of componer (to compose), masculine plural to match the books."}
          - {w: "debían de estar", f: "deb- + -ían → deber (must), imperfect, they, + 'de' + estar (to be): 'must have been', a guess. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "los que", f: "'those that': the article as a pronoun + relative 'que'."}
          - {w: "quedaban", f: "qued- + -aban → quedar (to remain), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
        ormsby_note: "The books referred to are the Carolea of Geronimo Sempere (1560), which deals with the victories of Charles V; the León de España, by Pedro de la Vezilla, a poem on the history of the city of León; and, probably, the Carlo Famoso of Louis Zapata, for there is no book known with the title of The Deeds of the Emperor and the work of Avila is simply a prose commentary on the wars against the Protestants of Germany."
      - es: "y quizá, si el cura los viera, no pasaran por tan rigurosa sentencia."
        literal: "and perhaps, if the priest them had-seen, not they-would-have-passed through so rigorous sentence."
        ormsby: "and perhaps if the curate had seen them they would not have undergone so severe a sentence."
        vocab:
          - {w: "quizá", d: "perhaps"}
          - {w: "pasar por", d: "to undergo, go through"}
          - {w: "riguroso", d: "harsh, severe"}
          - {w: "sentencia", d: "sentence, verdict; the book-burning is described as a court trial"}
        diagram:
          - s: "no pasaran por tan rigurosa sentencia"
            r: "main verb: they would not have undergone so harsh a sentence"
            under:
              - {s: "quizá", r: "how sure: perhaps"}
              - {s: "si el cura los viera", r: "condition: if the priest had seen them"}
        forms:
          - {w: "los", f: "them (the books), masculine plural object pronoun."}
          - {w: "viera", f: "vi- + -era → ver (to see), imperfect subjunctive (-ra form), he: here 'had seen'. Built on the preterite vieron: viera, vieras, viera, viéramos, vierais, vieran. After 'si' the -ra form is the counterfactual."}
          - {w: "pasaran", f: "pas- + -aran → pasar (to undergo), imperfect subjunctive (-ra form), they: here 'would have undergone'. pasara, pasaras, pasara, pasáramos, pasarais, pasaran. Cervantes uses the -ra form where modern Spanish says 'habrían pasado'."}
          - {w: "tan rigurosa", f: "tan (so) + rigurosa, feminine to match 'sentencia'."}
        note: "The narrator keeps up the legal joke of the previous chapter: the books are defendants, the priest is the judge, and some are condemned unheard. Cervantes, who admired some of these epics, pretends to regret it."
  - sentences:
      - es: "Cuando llegaron a don Quijote, ya él estaba levantado de la cama, y proseguía en sus voces y en sus desatinos, dando cuchilladas y reveses a todas partes, estando tan despierto como si nunca hubiera dormido."
        literal: "When they-arrived at Don Quijote, already he was risen from the bed, and continued in his shouts and in his follies, giving slashes and backstrokes to all sides, being so awake as if never he-had slept."
        ormsby: "When they reached Don Quixote he was already out of bed, and was still shouting and raving, and slashing and cutting all round, as wide awake as if he had never slept."
        vocab:
          - {w: "levantado", d: "up, out of bed"}
          - {w: "proseguir en", d: "to carry on with, continue"}
          - {w: "desatino", d: "folly, raving, nonsense"}
          - {w: "cuchillada", d: "slash, cut (with a sword or knife)"}
          - {w: "revés", d: "backhand stroke (in fencing)"}
          - {w: "a todas partes", d: "in all directions"}
          - {w: "despierto", d: "awake"}
        diagram:
          - s: "ya él estaba levantado de la cama"
            r: "main verb 1: he was already out of bed"
            under:
              - {s: "Cuando llegaron a don Quijote", r: "when: when they reached him"}
          - s: "y proseguía en sus voces y en sus desatinos"
            r: "main verb 2: and went on shouting and raving"
            under:
              - {s: "dando cuchilladas y reveses a todas partes", r: "how: slashing in all directions"}
              - s: "estando tan despierto"
                r: "how: being so wide awake"
                under:
                  - {s: "como si nunca hubiera dormido", r: "as if he had never slept"}
        forms:
          - {w: "llegaron", f: "lleg- + -aron → llegar (to arrive), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "estaba levantado", f: "est- + -aba → estar (to be), imperfect, he, + levantado, participle of levantar (to raise): 'was up'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "proseguía", f: "prosegu- + -ía → proseguir (to continue), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "sus", f: "'his', plural to match 'voces' and 'desatinos', not the owner."}
          - {w: "dando", f: "d- + -ando → gerund of dar (to give): 'giving [slashes]'."}
          - {w: "reveses", f: "revés + -es → plural of revés (backstroke); the accent drops because the stress now falls regularly."}
          - {w: "estando", f: "est- + -ando → gerund of estar (to be)."}
          - {w: "hubiera dormido", f: "hub- + -iera → haber, imperfect subjunctive (-ra form), he, + dormido, participle of dormir (to sleep): pluperfect subjunctive, 'had slept'. haber's -ra form: hubiera, hubieras, hubiera, hubiéramos, hubierais, hubieran. 'como si' (as if) always takes the imperfect or pluperfect subjunctive."}
      - es: "Abrazáronse con él, y por fuerza le volvieron al lecho; y, después que hubo sosegado un poco, volviéndose a hablar con el cura, le dijo:"
        literal: "They-grappled-themselves with him, and by force him they-returned to-the bed; and, after that he-had calmed a little, turning-himself to speak with the priest, to-him he-said:"
        ormsby: "They closed with him and by force got him back to bed, and when he had become a little calm, addressing the curate, he said to him,"
        vocab:
          - {w: "abrazarse con", d: "to seize hold of, grapple with; here not a friendly 'embrace'"}
          - {w: "por fuerza", d: "by force"}
          - {w: "volver", d: "to return, put back; 'volverse a' = to turn to"}
          - {w: "lecho", d: "bed (literary word for 'cama')"}
          - {w: "sosegar", d: "to calm down, quiet down"}
        diagram:
          - s: "Abrazáronse con él"
            r: "main verb 1: they grabbed hold of him"
          - s: "y por fuerza le volvieron al lecho"
            r: "main verb 2: and by force put him back to bed"
          - s: "le dijo:"
            r: "main verb 3 (after 'y'): he said to him"
            under:
              - {s: "después que hubo sosegado un poco", r: "when: after he had calmed down a little"}
              - {s: "volviéndose a hablar con el cura", r: "how: turning to speak to the priest"}
        forms:
          - {w: "Abrazáronse", f: "abraz- + -aron + se → abrazarse (to grapple), preterite, they, with 'se' stuck on the end: modern 'se abrazaron'. Cervantes hangs pronouns on the end of a conjugated verb that opens its clause. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "le volvieron", f: "volv- + -ieron → volver (to put back), preterite, they, + 'le' (him). The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron. 'le' for a male person as direct object is leísmo, normal in Castile; strict grammar wants 'lo'."}
          - {w: "al", f: "a + el (to the)."}
          - {w: "hubo sosegado", f: "hub- + -o → haber, preterite, he, + sosegado, participle of sosegar (to calm down): the past anterior, 'had calmed', used after 'después que'. haber's preterite: hube, hubiste, hubo, hubimos, hubisteis, hubieron."}
          - {w: "volviéndose", f: "volv- + -iendo + se → gerund of volverse (to turn), with 'se' on the end and an accent added to keep the stress."}
          - {w: "hablar", f: "infinitive of hablar (to speak) after 'volverse a'."}
          - {w: "le dijo", f: "dij- + -o → decir (to say), preterite, he, + 'le' (to him). Irregular stem: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Por cierto, señor arzobispo Turpín, que es gran mengua de los que nos llamamos doce Pares dejar, tan sin más ni más, llevar la vitoria deste torneo a los caballeros cortesanos, habiendo nosotros los aventureros ganado el prez en los tres días antecedentes."
        literal: "— For certain, sir archbishop Turpín, that [it] is great disgrace of those who ourselves call twelve Peers to-let, so without more nor more, carry-off the victory of-this tourney to the knights courtly, having we the adventurers won the prize in the three days preceding."
        ormsby: "“Of a truth, Señor Archbishop Turpin, it is a great disgrace for us who call ourselves the Twelve Peers, so carelessly to allow the knights of the Court to gain the victory in this tourney, we the adventurers having carried off the honour on the three former days.”"
        vocab:
          - {w: "por cierto", d: "truly, certainly"}
          - {w: "arzobispo Turpín", d: "Archbishop Turpin, Charlemagne's warrior-bishop in the Roland legends; he takes the priest for him"}
          - {w: "mengua", d: "disgrace, discredit (literally 'lessening')"}
          - {w: "los doce Pares", d: "the Twelve Peers of France, Charlemagne's paladins (Roland, Oliver, Reinaldos and the rest)"}
          - {w: "sin más ni más", d: "just like that, without more ado, for no reason"}
          - {w: "vitoria", d: "= victoria, victory (old spelling)"}
          - {w: "deste", d: "= de este, 'of this'"}
          - {w: "aventureros", d: "the adventurer knights, the wandering side in the tourney, against the 'cortesanos' of the court"}
          - {w: "prez", d: "honor, glory, the prize of a tournament (an old chivalric word)"}
          - {w: "antecedente", d: "preceding, previous"}
        diagram:
          - s: "es gran mengua"
            r: "main verb: it is a great disgrace"
            under:
              - {s: "Por cierto, señor arzobispo Turpín, que", r: "opening: truly, Archbishop Turpin; the 'que' just adds emphasis"}
              - {s: "de los que nos llamamos doce Pares", r: "for whom: for us who call ourselves the Twelve Peers"}
              - s: "dejar"
                r: "subject, what is the disgrace: to let"
                under:
                  - {s: "tan sin más ni más", r: "how: just like that"}
                  - {s: "llevar la vitoria deste torneo a los caballeros cortesanos", r: "what they let happen: the court knights carry off the victory"}
              - {s: "habiendo nosotros los aventureros ganado el prez en los tres días antecedentes", r: "when we had: we adventurers having won the prize on the three days before"}
        forms:
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "gran", f: "grande clipped before a singular noun; before the noun it means 'great'."}
          - {w: "nos llamamos", f: "llam- + -amos → llamarse (to call oneself), present, we, with 'nos' (ourselves). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "dejar ... llevar", f: "two infinitives: dejar (to let) + llevar (to carry off): 'to let [them] carry off'. The whole infinitive phrase is the subject of 'es'."}
          - {w: "vitoria", f: "old spelling of victoria (Cervantes drops the c before t: vitoria, efeto, dotor)."}
          - {w: "deste", f: "de + este (of this)."}
          - {w: "habiendo ... ganado", f: "habiendo, gerund of haber, + ganado, participle of ganar (to win): 'having won', with its own subject 'nosotros' squeezed in between. A gerund phrase with its own subject works like 'since we had ...'."}
          - {w: "antecedentes", f: "antecedente + -s → plural to match 'días'."}
        ormsby_note: "Turpin (or Tilpin), Charlemagne's chaplain, and Archbishop of Rheims: according to the Chanson de Roland, one of those slain at Roncesvalles; but also claimed as author of the Chronicle of Charlemagne, which, however, was probably not composed before the end of the eleventh or beginning of the twelfth century. He died in the year of the Roncesvalles rout, 778."
        note: "In his dream Don Quijote has become one of Charlemagne's Twelve Peers and takes the priest for Archbishop Turpin, the Peers' fighting churchman: a fitting part for a village priest."
  - sentences:
      - es: "— Calle vuestra merced, señor compadre —dijo el cura—, que Dios será servido que la suerte se mude, y que lo que hoy se pierde se gane mañana;"
        literal: "— Be-quiet your grace, sir gossip —said the priest—, for God will-be served that the luck itself-change, and that what today is-lost be-won tomorrow;"
        ormsby: "“Hush, gossip,” said the curate; “please God, the luck may turn, and what is lost today may be won tomorrow;"
        vocab:
          - {w: "callar", d: "to be quiet, hush"}
          - {w: "vuestra merced", d: "'your grace', the polite way to say 'you', taking a he/she verb; it later shrank to 'usted'"}
          - {w: "compadre", d: "old friend, 'gossip'; literally a godfather in relation to the child's parents, and so a term for a close neighbor"}
          - {w: "Dios será servido", d: "God willing, please God (literally 'God will be served [to grant]')"}
          - {w: "suerte", d: "luck, fortune"}
          - {w: "mudarse", d: "to change"}
        diagram:
          - {s: "Calle vuestra merced, señor compadre", r: "main verb 1: hush, my friend"}
          - s: "Dios será servido"
            r: "main verb 2, after a loose 'que' = 'for': God will be pleased"
            under:
              - {s: "que la suerte se mude", r: "what God will grant, 1: that luck will change"}
              - s: "y que lo que hoy se pierde se gane mañana"
                r: "what God will grant, 2: that what is lost today be won tomorrow"
        forms:
          - {w: "Calle", f: "call- + -e → callar (to be quiet), present subjunctive, you (vuestra merced), used as a polite command: 'be quiet'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "vuestra merced", f: "a 'you' that takes the he/she form of the verb, like modern 'usted' (which grew out of it)."}
          - {w: "será servido", f: "ser (to be), future, he (God): 'will be', + servido, participle of servir (to serve). The future is the whole infinitive + -é, -ás, -á, -emos, -éis, -án: seré, serás, será, seremos, seréis, serán."}
          - {w: "se mude", f: "mud- + -e → mudarse (to change), present subjunctive, it, with 'se'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. Subjunctive because it is a wish."}
          - {w: "lo que", f: "neuter 'lo' + 'que': 'what, that which'."}
