  - sentences:
      - es: "En este tiempo, solicitó don Quijote a un labrador vecino suyo, hombre de bien —si es que este título se puede dar al que es pobre—, pero de muy poca sal en la mollera."
        literal: "In this time, solicited Don Quijote a farmhand neighbor of-his, man of good —if it-is that this title itself can give to-the one who is poor—, but of very little salt in the pate."
        ormsby: "Meanwhile Don Quixote worked upon a farm labourer, a neighbour of his, an honest man (if indeed that title can be given to him who is poor), but with very little wit in his pate."
        vocab:
          - {w: "solicitar", d: "to court, work on, try to win over"}
          - {w: "labrador", d: "farm laborer, peasant farmer (from 'labrar', to till)"}
