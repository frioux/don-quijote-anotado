          - {w: "ganase", f: "gan- + -ase → ganar (to win), imperfect subjunctive (-se form), he: 'might win'. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. Subjunctive because the adventure is only possible."}
