          - {w: "hombre de bien", d: "honest man, decent man"}
          - {w: "si es que", d: "if indeed"}
          - {w: "sal", d: "salt; figuratively wit, good sense"}
          - {w: "mollera", d: "crown of the head, pate; 'poca sal en la mollera' = not very bright"}
