  - sentences:
      - es: "— De esa manera —respondió Sancho Panza—, si yo fuese rey por algún milagro de los que vuestra merced dice, por lo menos, Juana Gutiérrez, mi oíslo, vendría a ser reina, y mis hijos infantes."
        literal: "— In that manner —answered Sancho Panza—, if I were king by some miracle of those that your grace says, at the least, Juana Gutiérrez, my missus, would-come to be queen, and my children princes."
        ormsby: "“In that case,” said Sancho Panza, “if I should become a king by one of those miracles your worship speaks of, even Juana Gutierrez, my old woman, would come to be queen and my children infantes.”"
        vocab:
          - {w: "de esa manera", d: "in that case, that way"}
          - {w: "milagro", d: "miracle"}
          - {w: "por lo menos", d: "at least"}
          - {w: "oíslo", d: "wife, 'my old woman'; a rustic pet name for a wife"}
          - {w: "venir a ser", d: "to come to be, end up as"}
          - {w: "infantes", d: "princes and princesses, the king's children who are not heirs to the throne"}
        diagram:
          - s: "vendría a ser reina"
            r: "main verb: would come to be queen"
            under:
              - {s: "De esa manera", r: "in that case"}
              - {s: "respondió Sancho Panza", r: "speech tag: answered Sancho Panza"}
              - s: "si yo fuese rey por algún milagro"
                r: "condition: if I were king by some miracle"
                under:
                  - {s: "de los que vuestra merced dice", r: "describes 'milagro': of the kind your grace speaks of"}
              - {s: "por lo menos", r: "at least"}
              - {s: "Juana Gutiérrez, mi oíslo", r: "subject: Juana Gutiérrez, my missus"}
              - {s: "y mis hijos infantes", r: "second subject, verb understood: and my children [would be] princes"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "fuese", f: "fue- + -se → ser (to be), imperfect subjunctive (-se form), I. Built on the preterite fueron: fuese, fueses, fuese, fuésemos, fueseis, fuesen. After 'si' it marks a condition unlikely to happen."}
          - {w: "algún", f: "alguno clipped before a masculine singular noun."}
          - {w: "dice", f: "dic- + -e → decir (to say), present, you (vuestra merced). The e in the stem becomes i: digo, dices, dice, decimos, decís, dicen."}
          - {w: "vendría", f: "vendr- + -ía → venir (to come), conditional, she. Short stem vendr-: vendría, vendrías, vendría, vendríamos, vendríais, vendrían."}
          - {w: "mis", f: "'my', plural to match 'hijos'."}
        ormsby_note: "Mi oislo, a sort of pet-name for a wife in old Spanish among the lower orders: 'Acuerda de su oislo Mirando en pobre casa.'"
        note: "Sancho's wife is called Juana Gutiérrez here and Mari Gutiérrez a few lines later: Cervantes was careless with the name."
