  - sentences:
      - es: "— No sé —respondió el ama— si se llamaba Frestón o Fritón; sólo sé que acabó en tón su nombre."
        literal: "— Not I-know —answered the housekeeper— if himself he-called Frestón or Fritón; only I-know that ended in tón his name."
        ormsby: "“I don’t know whether he called himself Fristón or Fritón,” said the housekeeper, “I only know that his name ended with ‘ton.’”"
        vocab:
          - {w: "Fritón", d: "the housekeeper's garbling; it sounds like 'frito' (fried)"}
          - {w: "acabar en", d: "to end in"}
        diagram:
          - s: "No sé"
            r: "main verb 1: I don't know"
            under:
              - {s: "respondió el ama", r: "speech tag: answered the housekeeper"}
              - {s: "si se llamaba Frestón o Fritón", r: "what I don't know: whether he was called Frestón or Fritón"}
          - s: "sólo sé"
            r: "main verb 2: I only know"
            under:
              - {s: "que acabó en tón su nombre", r: "what I know: that his name ended in 'tón'"}
        forms:
          - {w: "sé", f: "saber (to know), present, I: sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, she. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "se llamaba", f: "llam- + -aba → llamarse (to be called), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "acabó", f: "acab- + -ó → acabar (to end), preterite, it (his name). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
        note: "Everyone agrees on the ending -tón, which is the joke: the rest of the name hardly matters to the women, while for Don Quijote the name identifies a specific enemy from his books."
  - sentences:
      - es: "— Así es —dijo don Quijote—; que ése es un sabio encantador, grande enemigo mío, que me tiene ojeriza, porque sabe por sus artes y letras que tengo de venir, andando los tiempos, a pelear en singular batalla con un caballero a quien él favorece, y le tengo de vencer, sin que él lo pueda estorbar, y por esto procura hacerme todos los sinsabores que puede;"
        literal: "— So it-is —said Don Quijote—; for that-one is a sage enchanter, great enemy of-mine, who to-me has grudge, because he-knows by his arts and letters that I-have to come, going-along the times, to fight in single battle with a knight whom he favors, and him I-have to defeat, without that he it can prevent, and for this he-tries to-do-me all the displeasures that he-can;"
        ormsby: "“So it does,” said Don Quixote, “and he is a sage magician, a great enemy of mine, who has a spite against me because he knows by his arts and lore that in process of time I am to engage in single combat with a knight whom he befriends and that I am to conquer, and he will be unable to prevent it; and for this reason he endeavours to do me all the ill turns that he can;"
        vocab:
          - {w: "así es", d: "that's right, so it is"}
          - {w: "ése", d: "that one (pronoun, written with an accent in older spelling)"}
          - {w: "sabio encantador", d: "wizard-sage, the stock magician of the romances"}
          - {w: "tener ojeriza a", d: "to have a grudge against, have it in for"}
          - {w: "artes y letras", d: "his (magic) arts and learning"}
          - {w: "tener de", d: "= tener que, to have to, be destined to (old form)"}
          - {w: "andando los tiempos", d: "in the course of time, some day"}
          - {w: "singular batalla", d: "single combat"}
          - {w: "favorecer", d: "to favor, protect"}
          - {w: "vencer", d: "to defeat, conquer"}
          - {w: "estorbar", d: "to prevent, hinder"}
          - {w: "procurar", d: "to try, strive to (not 'procure')"}
          - {w: "sinsabor", d: "trouble, unpleasantness (literally 'without-taste')"}
        diagram:
          - {s: "Así es", r: "reply: that's right"}
          - s: "ése es un sabio encantador"
            r: "main verb 1, after a loose 'que' = 'for': that one is a wizard"
            under:
              - {s: "grande enemigo mío", r: "describes 'ése': a great enemy of mine"}
              - s: "que me tiene ojeriza"
                r: "describes 'ése': who has it in for me"
                under:
                  - s: "porque sabe por sus artes y letras"
                    r: "why: because he knows by his arts"
                    under:
                      - s: "que tengo de venir, andando los tiempos, a pelear en singular batalla con un caballero"
                        r: "what he knows, 1: that some day I must fight a knight in single combat"
                        under:
                          - {s: "a quien él favorece", r: "describes 'caballero': whom he favors"}
                      - {s: "y le tengo de vencer", r: "what he knows, 2: and I must defeat him"}
                      - {s: "sin que él lo pueda estorbar", r: "what he knows, 3: without his being able to stop it"}
          - s: "y por esto procura hacerme todos los sinsabores"
            r: "main verb 2: and for this he tries to do me every ill turn"
            under:
              - {s: "que puede", r: "describes 'sinsabores': that he can"}
        forms:
          - {w: "es", f: "ser (to be), present, it / he: soy, eres, es, somos, sois, son."}
          - {w: "ése", f: "'that one', masculine pronoun; ese, esa, esos, esas (accent when it stands alone, in older spelling)."}
          - {w: "grande", f: "full form here, though before a singular noun modern Spanish clips it to 'gran'."}
          - {w: "mío", f: "'of mine', the full possessive placed after the noun, masculine to match 'enemigo'."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, he: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "sabe", f: "sab- + -e → saber (to know), present, he: sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "tengo de venir, tengo de vencer", f: "teng- + -o → tener (to have), present, I, + 'de' + infinitive: 'I am to come', 'I am to defeat'. Old for 'tengo que'."}
          - {w: "andando", f: "and- + -ando → gerund of andar (to go along): 'andando los tiempos' = as time goes on."}
          - {w: "pelear", f: "infinitive of pelear (to fight) after 'venir a'."}
          - {w: "a quien", f: "'whom', with the 'a' that marks a person as object."}
          - {w: "favorece", f: "favorec- + -e → favorecer (to favor), present, he. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (the 'I' form is 'favorezco')."}
          - {w: "le", f: "him (the knight), the direct object; strict grammar wants 'lo', but Castilian uses 'le' for a male person (leísmo)."}
          - {w: "pueda", f: "pued- + -a → poder (to be able), present subjunctive, he. The o in the stem becomes ue when stressed: pueda, puedas, pueda, podamos, podáis, puedan. 'sin que' always takes the subjunctive."}
          - {w: "procura", f: "procur- + -a → procurar (to try), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "hacerme", f: "hacer (to do) + me (to me), infinitive after 'procura'."}
          - {w: "puede", f: "pued- + -e → poder (to be able), present, he: puedo, puedes, puede, podemos, podéis, pueden."}
        note: "The enchanter who persecutes the hero and protects his enemy is a fixture of the romances. From now on Don Quijote will blame every setback on enchanters, which makes his delusion impossible to disprove."
