  - sentences:
      - es: "Iba Sancho Panza sobre su jumento como un patriarca, con sus alforjas y su bota, y con mucho deseo de verse ya gobernador de la ínsula que su amo le había prometido."
        literal: "Went Sancho Panza upon his donkey like a patriarch, with his saddlebags and his wineskin, and with much desire of seeing-himself already governor of the isle that his master to-him had promised."
        ormsby: "Sancho rode on his ass like a patriarch, with his alforjas and bota, and longing to see himself soon governor of the island his master had promised him."
        vocab:
          - {w: "jumento", d: "donkey, ass"}
          - {w: "patriarca", d: "patriarch, like an Old Testament elder: grave, comfortable, at ease"}
          - {w: "alforjas", d: "saddlebags"}
          - {w: "bota", d: "leather wine bag, drunk from by squirting"}
          - {w: "amo", d: "master"}
        diagram:
          - s: "Iba"
            r: "main verb: went, was riding"
            under:
              - {s: "Sancho Panza", r: "subject"}
              - {s: "sobre su jumento", r: "on what: on his donkey"}
              - {s: "como un patriarca", r: "how: like a patriarch"}
              - {s: "con sus alforjas y su bota", r: "with what: saddlebags and wineskin"}
              - s: "y con mucho deseo de verse ya gobernador de la ínsula"
                r: "with what: longing to see himself governor of the isle"
                under:
                  - {s: "que su amo le había prometido", r: "describes 'ínsula': that his master had promised him"}
        forms:
          - {w: "Iba", f: "ir (to go), imperfect, he: 'was going'. ir's imperfect is irregular: iba, ibas, iba, íbamos, ibais, iban."}
          - {w: "sus, su", f: "'his': plural 'sus' to match 'alforjas', singular 'su' to match 'bota', not the owner."}
          - {w: "mucho", f: "masculine singular to match 'deseo'."}
          - {w: "verse", f: "infinitive of ver (to see) + se (himself), after 'deseo de'."}
          - {w: "le había prometido", f: "haber (había) + prometido, participle of prometer (to promise): pluperfect, he: 'had promised', + 'le' (to him). haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
        ormsby_note: "The bota is the leathern wine-bag which is as much a part of the Spanish wayfarer's paraphernalia as the alforjas. It cannot, of course, be properly translated 'bottle.'"
      - es: "Acertó don Quijote a tomar la misma derrota y camino que el que él había tomado en su primer viaje, que fue por el campo de Montiel, por el cual caminaba con menos pesadumbre que la vez pasada, porque, por ser la hora de la mañana y herirles a soslayo los rayos del sol, no les fatigaban."
        literal: "Happened Don Quijote to take the same route and road as that which he had taken in his first journey, which was through the Campo de Montiel, through which he-traveled with less grief than the time past, because, for being the hour of the morning and striking-them at slant the rays of the sun, not them they-tired."
        ormsby: "Don Quixote decided upon taking the same route and road he had taken on his first journey, that over the Campo de Montiel, which he travelled with less discomfort than on the last occasion, for, as it was early morning and the rays of the sun fell on them obliquely, the heat did not distress them."
