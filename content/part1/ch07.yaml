  - sentences:
      - es: "— Has de saber, amigo Sancho Panza, que fue costumbre muy usada de los caballeros andantes antiguos hacer gobernadores a sus escuderos de las ínsulas o reinos que ganaban, y yo tengo determinado de que por mí no falte tan agradecida usanza; antes, pienso aventajarme en ella:"
        literal: "— You-have to know, friend Sancho Panza, that [it] was custom very used of the knights errant ancient to-make governors to their squires of the isles or kingdoms that they-won, and I have determined of that by me not be-lacking so grateful usage; rather, I-intend to-outdo-myself in it:"
        ormsby: "“Thou must know, friend Sancho Panza, that it was a practice very much in vogue with the knights-errant of old to make their squires governors of the islands or kingdoms they won, and I am determined that there shall be no failure on my part in so liberal a custom; on the contrary, I mean to improve upon it,"
        vocab:
          - {w: "haber de", d: "to have to, must; 'has de saber' = you must know"}
          - {w: "usado", d: "customary, common, in use"}
          - {w: "tener determinado", d: "to have decided (tener + participle)"}
          - {w: "faltar", d: "to be lacking, fail"}
          - {w: "agradecido", d: "here: generous, rewarding (literally 'grateful')"}
          - {w: "usanza", d: "custom, usage"}
          - {w: "antes", d: "here: on the contrary, rather"}
          - {w: "aventajarse en", d: "to outdo, go further in"}
        diagram:
          - s: "Has de saber"
            r: "main verb 1: you must know"
            under:
              - {s: "amigo Sancho Panza", r: "whom he is addressing"}
              - s: "que fue costumbre muy usada de los caballeros andantes antiguos"
                r: "what to know: that it was a common custom of the old knights-errant"
                under:
                  - s: "hacer gobernadores a sus escuderos de las ínsulas o reinos"
                    r: "what the custom was: to make their squires governors of the isles or kingdoms"
                    under:
                      - {s: "que ganaban", r: "describes 'ínsulas o reinos': that they won"}
          - s: "y yo tengo determinado"
            r: "main verb 2: and I have decided"
            under:
              - {s: "de que por mí no falte tan agradecida usanza", r: "what: that so generous a custom shall not fail through me"}
          - s: "antes, pienso aventajarme en ella:"
            r: "main verb 3: on the contrary, I mean to outdo it"
        forms:
          - {w: "Has de saber", f: "haber (has) + 'de' + saber (to know): 'you are to know'. haber in the present: he, has, ha, hemos, habéis, han. He uses 'tú' to Sancho, as a master to a servant."}
          - {w: "fue", f: "ser (to be), preterite, it: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "usada", f: "usad- + -a → usado (customary), feminine to match 'costumbre'."}
          - {w: "antiguos", f: "antigu- + -os → antiguo (ancient), masculine plural to match 'caballeros'."}
          - {w: "hacer", f: "infinitive of hacer (to make), explaining what the custom was."}
          - {w: "a sus escuderos", f: "the 'a' marks people as the direct object; 'sus' plural to match 'escuderos'."}
          - {w: "ganaban", f: "gan- + -aban → ganar (to win), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "tengo determinado", f: "teng- + -o → tener (to have), present, I, + determinado, participle of determinar (to decide): 'I have decided'. tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "falte", f: "falt- + -e → faltar (to be lacking), present subjunctive, it. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. Subjunctive after a decision about the future."}
          - {w: "agradecida", f: "agradecid- + -a → agradecido, feminine to match 'usanza'."}
          - {w: "pienso", f: "piens- + -o → pensar (to intend), present, I. The stem e becomes ie when stressed: pienso, piensas, piensa, pensamos, pensáis, piensan."}
          - {w: "aventajarme", f: "aventajar (to outdo) + me (myself), infinitive after 'pienso'."}
          - {w: "ella", f: "'it' (the usanza), feminine, after a preposition."}
        ormsby_note: "Amadís, for instance, made his squire Gandalin governor of the Insula Firme."
