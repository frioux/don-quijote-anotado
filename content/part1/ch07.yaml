summary: |
  The priest and the barber are still weeding out Don Quijote's library when he wakes up shouting, dreaming he is fighting in a tournament. In the rush to calm him, the remaining books are burned unexamined. He takes the priest for Archbishop Turpin and himself for one of Charlemagne's peers, claims Roland has beaten him with an oak trunk, and asks for food. That night the housekeeper burns every book in the house.

  To remove the cause of his madness, his friends wall up his library and tell him an enchanter took it. When he gets up he gropes for the missing door. The niece and the housekeeper describe a wizard on a cloud and a serpent who flew off through the roof leaving smoke, and whose name ended in '-tón'. Don Quijote recognizes his enemy, the sage Frestón. The niece begs him to stay home; he answers with threats to anyone who touches a hair of his head.

  For two weeks he seems calm, debating the need for knights-errant with the priest and barber. Meanwhile he persuades a poor, honest, not very bright neighbor, Sancho Panza, to be his squire, promising him the governorship of an island. He raises money, borrows a shield, patches his helmet and, following the innkeeper's advice, packs shirts. Sancho insists on bringing his donkey, which troubles Don Quijote, since no squire in the books rode one.

  One night they slip away without saying goodbye to anyone. On the road across the Campo de Montiel, Sancho reminds his master of the island. Don Quijote promises him a kingdom within six days. Sancho doubts his wife would do as a queen, perhaps as a countess; Don Quijote tells him not to settle for less than a governorship.
context: |
  The book-burning. Chapters 6 and 7 stage the destruction of the library as a legal trial: the 'escrutinio', the 'sentencia', books condemned 'sin ser oídos'. Book-burning in Spain inevitably called up the Inquisition, which burned forbidden books, but the priest's tribunal is literary, not religious. The books named at the start of this chapter are not romances at all but patriotic epic poems on Charles V and the city of León (Ormsby identifies them). The narrator hints that the careless 'escrutiñador' let some good books burn with the bad: 'the just pay for sinners'.

  The Carolingian cycle. In his waking dream Don Quijote becomes Reinaldos de Montalbán, one of Charlemagne's Twelve Peers, fighting at a tournament and quarreling with his rival Roldán (Roland). This material came to Spain from French epic and Italian poems (Boiardo, Ariosto) and from Spanish ballads. Roland was invulnerable by enchantment, which is why Don Quijote swears revenge 'in spite of all his spells'. Archbishop Turpin was the Peers' warrior-priest and supposed chronicler, a neat part for the village priest.

  Enchanters. In the romances every hero has a friendly sage who records his deeds and an enemy magician who harasses him. Fristón (Cervantes writes Frestón) was the magician claimed as author of Belianís de Grecia. The walled-up room gives Don Quijote the explanation he will fall back on for the rest of the novel: whatever goes wrong is the work of enchanters. The niece and housekeeper, who hate the books, invent a story straight out of them, with its cloud, serpent and smoke.

  The squire. Squires in the romances were young gentlemen in training who could expect a reward; Amadís made his squire Gandalín governor of an island (Ormsby's note). Sancho is instead a married farmhand with children, poor, honest and shrewd, and he rides a donkey, the mount of peasants and clowns, which has no place in the romances. His name means 'belly'. The pair, the tall thin master on his nag and the squire on his donkey with wineskin and saddlebags, is born in this chapter.

  Money, rank and titles. Don Quijote finances the sally the way ruined gentry did, selling and pawning at a loss. His promises move up the scale of Spanish titles: ínsula, governor, count, marquis, king, and Sancho's children as 'infantes', the royal princes. The 'adelantado' was the royal governor of a frontier province. Sancho's reply is in money: his wife is not worth two maravedís (the smallest copper coin) as a queen.

  Proverbs. This chapter brings in the proverbs that Sancho will later pour out: 'the just pay for sinners', 'what is lost today is won tomorrow', 'to look for bread better than wheat', 'many go for wool and come back shorn'. Ormsby numbers them in his list of proverbs; the niece uses two of them together, and Don Quijote answers the last one by turning it round.

  The Spanish of this chapter. Old spellings: vitoria (victoria), efeto (efecto), agora (ahora), ansí (así), asimesmo and ansimesmo (asimismo), mesmo (mismo), duecho (ducho), tresquilado (trasquilado), and the old f- in ferido and malferido (herido). Contractions: deste, della, dellos. Pronouns hung on the end of a verb that opens its clause: Abrazáronse, Hiciéronlo, diéronle, quedóse, tentábala, Decíale, Acomodóse, Proveyóse, mándole. The future subjunctive, dead in modern Spanish, appears twice (pagare, imaginaren), and 'tener de' and 'haber de' stand where modern Spanish says 'tener que'. Notice too the address: Don Quijote says 'tú' to Sancho and his niece, who both call him 'vuestra merced'.
