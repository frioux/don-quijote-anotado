  - sentences:
      - es: "— Ferido no —dijo don Quijote—, pero molido y quebrantado, no hay duda en ello; porque aquel bastardo de don Roldán me ha molido a palos con el tronco de una encina, y todo de envidia, porque ve que yo solo soy el opuesto de sus valentías."
