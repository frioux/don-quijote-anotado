  - sentences:
      - es: "— ¿Quién duda de eso? —dijo la sobrina—."
        literal: "— Who doubts of that? —said the niece—."
        ormsby: "“Who doubts that?” said the niece;"
        vocab:
          - {w: "dudar de", d: "to doubt"}
        diagram:
          - s: "Quién duda de eso"
            r: "main verb: who doubts that?"
          - {s: "dijo la sobrina", r: "speech tag: said the niece"}
        forms:
          - {w: "Quién", f: "'who', with an accent because it asks a question."}
          - {w: "duda", f: "dud- + -a → dudar (to doubt), present, he (whoever). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "eso", f: "neuter 'that [matter]'; esto, eso, aquello point at ideas rather than nouns."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, she: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
        note: "The niece agrees with the madness in order to argue against it: fine, the enchanter is real, so why go looking for trouble?"
      - es: "Pero, ¿quién le mete a vuestra merced, señor tío, en esas pendencias?"
        literal: "But, who you puts to your grace, sir uncle, in those quarrels?"
        ormsby: "“but, uncle, who mixes you up in these quarrels?"
        vocab:
          - {w: "meter a uno en", d: "to get someone into, mix someone up in"}
          - {w: "vuestra merced", d: "'your grace', the polite 'you', taking a he/she verb; the ancestor of 'usted'"}
          - {w: "tío", d: "uncle"}
          - {w: "pendencia", d: "quarrel, brawl, fight"}
        diagram:
          - s: "quién le mete"
            r: "main verb: who gets you"
            under:
              - {s: "a vuestra merced", r: "object, spelling out 'le': your grace"}
              - {s: "señor tío", r: "whom she is addressing: uncle"}
              - {s: "en esas pendencias", r: "into what: into those quarrels"}
        forms:
          - {w: "le mete", f: "met- + -e → meter (to put), present, he (whoever), + 'le' (you, for vuestra merced). The present of -er verbs: -o, -es, -e, -emos, -éis, -en. 'le' and 'a vuestra merced' are the same person, said twice, as Spanish often does."}
          - {w: "esas", f: "es- + -as → 'those', feminine plural to match 'pendencias': ese, esa, esos, esas."}
      - es: "¿No será mejor estarse pacífico en su casa y no irse por el mundo a buscar pan de trastrigo, sin considerar que muchos van por lana y vuelven tresquilados?"
        literal: "Not will-it-be better to-stay-oneself peaceful in your house and not go-off through the world to seek bread of beyond-wheat, without considering that many go for wool and return shorn?"
        ormsby: "Would it not be better to remain at peace in your own house instead of roaming the world looking for better bread than ever came of wheat, never reflecting that many go for wool and come back shorn?”"
        vocab:
          - {w: "estarse", d: "to stay, remain (put)"}
          - {w: "pacífico", d: "peaceful, quiet"}
          - {w: "irse por el mundo", d: "to go off roaming the world"}
          - {w: "buscar pan de trastrigo", d: "proverb: to look for bread better than wheat, i.e. ask for the impossible and ask for trouble"}
          - {w: "ir por lana y volver trasquilado", d: "proverb: to go for wool and come back shorn, i.e. to set out to get something and lose instead"}
          - {w: "tresquilado", d: "= trasquilado, shorn, sheared (old form)"}
        diagram:
          - s: "No será mejor"
            r: "main verb: wouldn't it be better"
            under:
              - s: "estarse pacífico en su casa"
                r: "subject, 1: to stay quietly at home"
              - s: "y no irse por el mundo"
                r: "subject, 2: and not go off through the world"
                under:
                  - {s: "a buscar pan de trastrigo", r: "why: to look for bread better than wheat"}
              - s: "sin considerar"
                r: "how: without considering"
                under:
                  - {s: "que muchos van por lana y vuelven tresquilados", r: "what: that many go for wool and come back shorn"}
        forms:
          - {w: "será", f: "ser (to be), future, it: 'will it not be'. The future is the whole infinitive + -é, -ás, -á, -emos, -éis, -án: seré, serás, será, seremos, seréis, serán."}
          - {w: "estarse, irse", f: "infinitives of estar (to be) and ir (to go) with 'se' on the end: 'estarse' = to stay put, 'irse' = to go off. The infinitives are the subject of 'será mejor'."}
          - {w: "su", f: "'your' here, belonging to vuestra merced; su serves for his, her, its, their and polite 'your'."}
          - {w: "buscar, considerar", f: "infinitives of buscar (to look for) after 'a' and considerar (to consider) after 'sin'."}
          - {w: "van", f: "ir (to go), present, they: voy, vas, va, vamos, vais, van."}
          - {w: "vuelven", f: "vuelv- + -en → volver (to come back), present, they. The o in the stem becomes ue when stressed: vuelvo, vuelves, vuelve, volvemos, volvéis, vuelven."}
          - {w: "tresquilados", f: "tresquilad- + -os → participle of tresquilar (= trasquilar, to shear), masculine plural to match 'muchos'."}
        ormsby_note: "Proverb 171. Buscar pan de trastrigo: there is some difference of opinion as to the meaning of trastrigo, but it seems on the whole more probable that it means wheat of such superlative quality as to be unattainable; at any rate, the proverb is used in reference to seeking things that are out of reach. (On the second proverb:) Proverb 124. A very old proverb, as old at least as the poem of Fernán González."
