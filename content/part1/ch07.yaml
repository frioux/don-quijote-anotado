  - sentences:
      - es: "— Mire vuestra merced, señor caballero andante, que no se le olvide lo que de la ínsula me tiene prometido; que yo la sabré gobernar, por grande que sea."
        literal: "— Look your grace, sir knight errant, that not itself to-you forget what of the isle to-me you-have promised; for I it will-know-how to-govern, for big that it-be."
        ormsby: "“Your worship will take care, Señor Knight-errant, not to forget about the island you have promised me, for be it ever so big I’ll be equal to governing it.”"
        vocab:
          - {w: "mire vuestra merced que", d: "mind, your grace, that; take care that"}
          - {w: "olvidársele a uno", d: "to slip someone's mind; 'no se le olvide' = don't let it slip your mind (the thing forgotten is the subject)"}
          - {w: "tener prometido", d: "to have promised (tener + participle stresses the promise stands)"}
          - {w: "saber + infinitive", d: "to know how to"}
          - {w: "por ... que", d: "however ...: 'por grande que sea' = however big it may be"}
        diagram:
          - s: "Mire vuestra merced"
            r: "main verb: mind, your grace"
            under:
              - {s: "señor caballero andante", r: "whom he is addressing: sir knight-errant"}
              - s: "que no se le olvide lo"
                r: "what to mind: that you don't forget what"
                under:
                  - {s: "que de la ínsula me tiene prometido", r: "describes 'lo': what you have promised me about the isle"}
          - s: "que yo la sabré gobernar"
            r: "main verb 2, after a loose 'que' = 'for': I'll know how to govern it"
            under:
              - {s: "por grande que sea", r: "concession: however big it is"}
        forms:
          - {w: "Mire", f: "mir- + -e → mirar (to look, mind), present subjunctive, you (vuestra merced), as a polite command. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "se le olvide", f: "olvid- + -e → olvidar (to forget), present subjunctive, it, with 'se' + 'le' (to you): 'that it not slip your mind'. Same -e subjunctive, needed after 'mire que' as a warning."}
          - {w: "tiene prometido", f: "tien- + -e → tener (to have), present, you (vuestra merced), + prometido, participle of prometer (to promise): 'you have promised'. tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "la sabré gobernar", f: "sabr- + -é → saber (to know how), future, I, + gobernar (to govern) + 'la' (it, the ínsula, feminine) placed before both verbs. saber's future has the short stem sabr-: sabré, sabrás, sabrá, sabremos, sabréis, sabrán."}
          - {w: "sea", f: "se- + -a → ser (to be), present subjunctive, it: sea, seas, sea, seamos, seáis, sean. 'por ... que' (however) takes the subjunctive."}
        note: "Sancho's first words in the book are about the island. He calls his master 'vuestra merced' and 'señor', a servant's courtesy, and has already caught the language of chivalry."
