  - sentences:
      - es: "Es, pues, el caso que él estuvo quince días en casa muy sosegado, sin dar muestras de querer segundar sus primeros devaneos, en los cuales días pasó graciosísimos cuentos con sus dos compadres el cura y el barbero, sobre que él decía que la cosa de que más necesidad tenía el mundo era de caballeros andantes y de que en él se resucitase la caballería andantesca."
        literal: "It-is, then, the case that he stayed fifteen days at home very calm, without giving signs of wanting to-repeat his first follies, in the which days he-passed very-amusing tales with his two gossips the priest and the barber, over that he said that the thing of which most need had the world was of knights errant and of that in it itself should-revive the chivalry errantish."
        ormsby: "In short, then, he remained at home fifteen days very quietly without showing any signs of a desire to take up with his former delusions, and during this time he held lively discussions with his two gossips, the curate and the barber, on the point he maintained, that knights-errant were what the world stood most in need of, and that in him was to be accomplished the revival of knight-errantry."
        vocab:
          - {w: "es el caso que", d: "the fact is that, well then"}
          - {w: "sosegado", d: "calm, quiet"}
          - {w: "dar muestras de", d: "to show signs of"}
          - {w: "segundar", d: "to repeat, do a second time"}
          - {w: "devaneo", d: "folly, wild fancy, delusion"}
          - {w: "pasar cuentos", d: "to have exchanges, conversations"}
          - {w: "gracioso", d: "amusing, witty (not 'gracious')"}
          - {w: "compadre", d: "old friend, 'gossip' (literally a co-godparent)"}
          - {w: "caballeros andantes", d: "knights-errant (andante = wandering)"}
          - {w: "resucitarse", d: "to be revived, come back to life"}
          - {w: "caballería andantesca", d: "knight-errantry; 'andantesco' is a mock-solemn coinage"}
        diagram:
          - s: "Es, pues, el caso"
            r: "opening formula: the fact is, then"
            under:
              - s: "que él estuvo quince días en casa muy sosegado"
                r: "what the fact is: he stayed home fifteen days quite calm"
                under:
