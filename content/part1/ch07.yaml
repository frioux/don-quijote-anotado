          - {w: "derrota", d: "route, course (a false friend: also 'defeat', but not here)"}
          - {w: "campo de Montiel", d: "the Campo de Montiel, a high, bare plain in the southeast of La Mancha"}
          - {w: "pesadumbre", d: "discomfort, heaviness, grief"}
          - {w: "la vez pasada", d: "last time"}
          - {w: "herir", d: "to strike (of light or sun); normally 'to wound'"}
          - {w: "a soslayo", d: "slantwise, at an angle"}
          - {w: "fatigar", d: "to tire, wear out"}
