      - es: "Decíale, entre otras cosas, don Quijote que se dispusiese a ir con él de buena gana, porque tal vez le podía suceder aventura que ganase, en quítame allá esas pajas, alguna ínsula, y le dejase a él por gobernador della."
        literal: "Was-telling-him, among other things, Don Quijote that he-should-dispose-himself to go with him of good will, because perhaps to-him could happen adventure that [he] might-win, in take-me-away-there those straws, some isle, and him should-leave him as governor of-it."
        ormsby: "Don Quixote, among other things, told him he ought to be ready to go with him gladly, because any moment an adventure might occur that might win an island in the twinkling of an eye and leave him governor of it."
