      - es: "Primero que a mí me tresquilen, tendré peladas y quitadas las barbas a cuantos imaginaren tocarme en la punta de un solo cabello."
        literal: "First than to me me they-shear, I-will-have plucked and removed the beards to as-many-as might-imagine to-touch-me in the tip of a single hair."
        ormsby: "ere they shear me I shall have plucked away and stripped off the beards of all who dare to touch only the tip of a hair of mine.”"
        vocab:
          - {w: "primero que", d: "before (+ subjunctive); modern 'antes de que'"}
          - {w: "pelar", d: "to pluck, strip of hair"}
          - {w: "barbas", d: "beard; pulling a man's beard was the gravest insult in chivalric and Spanish custom"}
          - {w: "cuantos", d: "all those who, as many as"}
          - {w: "imaginar", d: "here: to dare to think of, to so much as intend"}
          - {w: "punta", d: "tip, point"}
          - {w: "cabello", d: "a hair of the head"}
        diagram:
          - s: "tendré peladas y quitadas las barbas"
            r: "main verb: I will have plucked off the beards"
            under:
              - {s: "Primero que a mí me tresquilen", r: "when: before they shear me"}
              - s: "a cuantos"
                r: "from whom: from all those"
                under:
                  - {s: "imaginaren tocarme en la punta de un solo cabello", r: "describes 'cuantos': who so much as think of touching the tip of one hair of mine"}
        forms:
          - {w: "a mí me", f: "'me' said twice: 'a mí' stresses the object pronoun 'me'."}
          - {w: "tresquilen", f: "tresquil- + -en → tresquilar (= trasquilar, to shear), present subjunctive, they (people in general). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. 'primero que' (before) always takes the subjunctive."}
          - {w: "tendré peladas y quitadas", f: "tendr- + -é → tener (to have), future, I, + peladas and quitadas, participles of pelar (to pluck) and quitar (to remove), feminine plural to match 'barbas': 'I will have [them] plucked'. tener's future: tendré, tendrás, tendrá, tendremos, tendréis, tendrán."}
          - {w: "imaginaren", f: "imagin- + -aren → imaginar (to imagine, dare think of), future subjunctive, they: 'whoever shall think of'. Built on the preterite imaginaron: imaginare, imaginares, imaginare, imagináremos, imaginareis, imaginaren. Dead in modern Spanish, which uses the present subjunctive 'imaginen'."}
          - {w: "tocarme", f: "tocar (to touch) + me (me), infinitive after 'imaginaren'."}
          - {w: "un solo", f: "'a single': solo before the noun means 'only one'."}
        note: "He turns her proverb round: he will do the shearing. Plucking or pulling another man's beard was the supreme insult, so the threat is both grand and faintly comic."
