                          - {s: "y de que en él se resucitase la caballería andantesca", r: "what he said, 2: and that knight-errantry be revived in it"}
        forms:
          - {w: "Es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "estuvo", f: "estuv- + -o → estar (to be, to stay), preterite, he. Irregular stem: estuve, estuviste, estuvo, estuvimos, estuvisteis, estuvieron."}
          - {w: "sosegado", f: "participle of sosegar (to calm), masculine singular to match 'él'."}
          - {w: "dar, querer, segundar", f: "infinitives: dar (to give) after 'sin', querer (to want) after 'de', segundar (to repeat) after 'querer'."}
          - {w: "sus primeros", f: "plural to match 'devaneos'; 'primeros' = his first [outing's]."}
          - {w: "los cuales", f: "'which', masculine plural to match 'días'; here used like an adjective, 'in which days'."}
          - {w: "pasó", f: "pas- + -ó → pasar (to pass, spend), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "graciosísimos", f: "gracios- + -ísimos → gracioso (amusing) + -ísimo 'very', masculine plural to match 'cuentos'."}
          - {w: "decía", f: "dec- + -ía → decir (to say), imperfect, he: 'kept saying'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, it (the world). Same -ía imperfect."}
          - {w: "era", f: "ser (to be), imperfect, it: era, eras, era, éramos, erais, eran."}
          - {w: "se resucitase", f: "resucit- + -ase → resucitar (to revive), imperfect subjunctive (-se form), it, with passive 'se': 'should be revived'. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. Subjunctive because it is something wished for."}
