      - es: "Ni de su fin y acabamiento pudo alcanzar cosa alguna, ni la alcanzara ni supiera si la buena suerte no le deparara un antiguo médico que tenía en su poder una caja de plomo, que, según él dijo, se había hallado en los cimientos derribados de una antigua ermita que se renovaba;"
        literal: "Nor of his end and finishing could-he attain thing any, nor it he-would-have-attained nor would-have-known if the good luck not to-him had-provided an old doctor who had in his power a box of lead, which, according-to [what] he said, itself had found in the foundations demolished of an ancient hermitage that itself was-renewing;"
        ormsby: "Of his end and death he could learn no particulars, nor would he have ascertained it or known of it, if good fortune had not produced an old physician for him who had in his possession a leaden box, which, according to his account, had been discovered among the crumbling foundations of an ancient hermitage that was being rebuilt;"
        vocab:
