  - sentences:
      - es: "El boyero unció sus bueyes y acomodó a don Quijote sobre un haz de heno, y con su acostumbrada flema siguió el camino que el cura quiso, y a cabo de seis días llegaron a la aldea de don Quijote, adonde entraron en la mitad del día, que acertó a ser domingo, y la gente estaba toda en la plaza, por mitad de la cual atravesó el carro de don Quijote."
        literal: "The ox-driver yoked his oxen and settled Don Quijote on a bundle of hay, and with his accustomed phlegm followed the road that the priest wanted, and at end of six days they-arrived at the village of Don Quijote, where they-entered in the middle of-the day, which happened to be Sunday, and the people was all in the square, through middle of the which crossed the cart of Don Quijote."
        ormsby: "The carter yoked his oxen and made Don Quixote comfortable on a truss of hay, and at his usual deliberate pace took the road the curate directed, and at the end of six days they reached Don Quixote’s village, and entered it about the middle of the day, which it so happened was a Sunday, and the people were all in the plaza, through which Don Quixote’s cart passed."
        vocab:
          - {w: "boyero", d: "ox-driver, carter"}
          - {w: "uncir", d: "to yoke (oxen)"}
          - {w: "acomodar", d: "to settle, make comfortable"}
          - {w: "haz de heno", d: "bundle, truss of hay"}
          - {w: "flema", d: "phlegm, i.e. slowness, unhurried calm (from the 'phlegmatic' humour)"}
          - {w: "a cabo de", d: "at the end of, after"}
          - {w: "acertar a", d: "+ infinitive: to happen to ('acertó a ser domingo' = happened to be a Sunday)"}
          - {w: "atravesar", d: "to cross, pass through"}
        diagram:
