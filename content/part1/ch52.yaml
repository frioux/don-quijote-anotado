          - {w: "maravillados", f: "participle of maravillar (to amaze), masculine plural to match 'todos'."}
          - {w: "acudió", f: "acud- + -ió → acudir (to come running), preterite, he. Same -ió preterite."}
          - {w: "corriendo", f: "gerund of correr (to run): 'running'."}
