      - es: "Y si de su Amadís se precia Gaula, por cuyos bravos descendientes Grecia triunfó mil veces y su fama ensancha, hoy a Quijote le corona el aula do Belona preside, y dél se precia, más que Grecia ni Gaula, la alta Mancha."
        literal: "And if of its Amadís itself prides Gaul, through whose brave descendants Greece triumphed a-thousand times and its fame widens, today [to] Quijote him crowns the hall where Bellona presides, and of-him itself prides, more than Greece or Gaul, the lofty Mancha."
        ormsby: "If Amadís be the proud boast of Gaul, / If by his progeny the fame of Greece / Through all the regions of the earth be spread, / Great Quixote crowned in grim Bellona’s hall / Today exalts La Mancha over these, / And above Greece or Gaul she holds her head."
        ormsby_match: false
        vocab:
          - {w: "preciarse de", d: "to pride oneself on, boast of"}
          - {w: "Gaula", d: "Gaula, the kingdom of Amadís in the romance, rendered 'Gaul' by Ormsby and often identified with Wales"}
          - {w: "bravos descendientes", d: "brave descendants: in the Amadís cycle, Amadís' sons and grandsons (Esplandián, Amadís de Grecia) become emperors in Greece and Constantinople"}
