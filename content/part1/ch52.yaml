  - sentences:
      - es: "El calvatrueno que adornó a la Mancha de más despojos que Jasón decreta;"
        literal: "The madcap who adorned [to] La Mancha with more spoils than Jason of-Crete;"
        ormsby: "The scatterbrain that gave La Mancha more / Rich spoils than Jason’s;"
        ormsby_match: false
        vocab:
          - {w: "calvatrueno", d: "harebrain, madcap (a coarse colloquial word, literally something like 'bald thunder')"}
          - {w: "adornar de", d: "to adorn with"}
          - {w: "despojos", d: "spoils, booty taken from the enemy"}
          - {w: "Jasón", d: "Jason, the Greek hero who brought back the Golden Fleece, the most famous spoil of legend"}
          - {w: "decreta", d: "obscure: most likely 'de Creta', 'of Crete', a nonsense attribution, since Jason was not Cretan; it also rhymes with 'veleta'"}
        diagram:
          - s: "El calvatrueno"
            r: "subject 1 of 'yace' (lies), which comes only in the last line of the poem"
            under:
              - s: "que adornó a la Mancha"
                r: "describes 'calvatrueno': who adorned La Mancha"
                under:
                  - {s: "de más despojos que Jasón decreta", r: "with what: with more spoils than Jason of Crete"}
        forms:
          - {w: "adornó", f: "adorn- + -ó → adornar (to adorn), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "a la Mancha", f: "'a' before the object, the personal 'a', used here because La Mancha is treated like a person being honored."}
          - {w: "más ... que", f: "comparison: 'más despojos que Jasón', 'more spoils than Jason'."}
        note: "The poem is a sonnet in which all thirteen first lines heap up subjects ('the madcap who', 'the wit that', 'the arm that') and the main verb 'yace' (lies) arrives only in the last line, a parody of grand funeral epitaphs."
      - es: "el jüicio que tuvo la veleta aguda donde fuera mejor ancha, el brazo que su fuerza tanto ensancha, que llegó del Catay hasta Gaeta, la musa más horrenda y más discreta que grabó versos en la broncínea plancha, el que a cola dejó los Amadises, y en muy poquito a Galaores tuvo, estribando en su amor y bizarría, el que hizo callar los Belianises, aquel que en Rocinante errando anduvo, yace debajo desta losa fría."
        literal: "the judgment that had the weathervane sharp where it-would-be better broad, the arm that its strength so-much extends, that it-reached from-the Cathay as-far-as Gaeta, the muse most horrid and most wise that engraved verses on the bronze plate, he who at tail left the Amadises, and in very little [to] Galaors held, resting on his love and gallantry, he who made to-be-silent the Belianises, that-one who on Rocinante wandering went, lies beneath this slab cold."
        ormsby: "who a point so keen / Had to his wit, and happier far had been / If his wit’s weathercock a blunter bore; / The arm renowned far as Gaeta’s shore, / Cathay, and all the lands that lie between; / The muse discreet and terrible in mien / As ever wrote on brass in days of yore; / He who surpassed the Amadíses all, / And who as naught the Galaors accounted, / Supported by his love and gallantry: / Who made the Belianises sing small, / And sought renown on Rocinante mounted; / Here, underneath this cold stone, doth he lie."
        ormsby_match: false
        vocab:
          - {w: "jüicio", d: "= juicio, judgment, wits; the diaeresis tells the reader to pronounce ju-i-cio in three syllables for the metre"}
          - {w: "veleta", d: "weathervane; a 'veleta aguda' (sharp vane) is a mind too sharp and too changeable"}
          - {w: "donde fuera mejor ancha", d: "where it would have been better broad, i.e. a little duller would have saved him"}
          - {w: "ensanchar", d: "to widen, extend"}
          - {w: "el Catay", d: "Cathay, the old name for China, at the far eastern edge of the known world"}
          - {w: "Gaeta", d: "a port on the coast of Italy, between Rome and Naples"}
          - {w: "musa", d: "muse, poetic inspiration; here his poetry"}
          - {w: "horrendo", d: "horrible, frightful"}
          - {w: "discreto", d: "wise, sensible, clever (not 'discreet')"}
          - {w: "broncínea plancha", d: "bronze plate; 'broncíneo' is a learned word for 'of bronze', where lasting inscriptions were engraved"}
          - {w: "dejar a cola", d: "to leave behind, outstrip (literally 'at the tail')"}
          - {w: "Amadises", d: "the Amadises: Amadís de Gaula and his descendants, heroes of the most famous Spanish romance cycle"}
          - {w: "tener en poco", d: "to think little of; 'en muy poquito tuvo' = thought very little of"}
          - {w: "Galaores", d: "the Galaors: Galaor, Amadís' brother, a lusty knight of the same romance"}
          - {w: "estribar en", d: "to rest on, rely on (from 'estribo', stirrup)"}
          - {w: "bizarría", d: "gallantry, dash, spirit (not 'bizarre')"}
          - {w: "Belianises", d: "the Belianises: Belianís de Grecia, hero of another romance of chivalry"}
          - {w: "errar", d: "to wander, as a knight-errant does; also 'to err', a pun"}
          - {w: "yacer", d: "to lie (dead, buried): the word of epitaphs, 'aquí yace' = here lies"}
          - {w: "desta", d: "= de esta, of this (old contraction)"}
          - {w: "losa", d: "stone slab, gravestone"}
        diagram:
          - s: "yace debajo desta losa fría"
            r: "main verb (last line): lies beneath this cold stone; its subjects are all the phrases before it and 'El calvatrueno' in the previous line"
            under:
              - s: "el jüicio"
                r: "subject 2: the wit"
                under:
                  - {s: "que tuvo la veleta aguda donde fuera mejor ancha", r: "describes 'jüicio': which had its vane sharp where it would have been better broad"}
              - s: "el brazo"
                r: "subject 3: the arm"
                under:
                  - {s: "que su fuerza tanto ensancha", r: "describes 'brazo': whose strength stretches so far"}
                  - {s: "que llegó del Catay hasta Gaeta", r: "result: that it reached from Cathay to Gaeta"}
              - s: "la musa más horrenda y más discreta"
                r: "subject 4: the most frightful and most clever muse"
                under:
                  - {s: "que grabó versos en la broncínea plancha", r: "describes 'musa': that ever engraved verses on a bronze plate"}
              - s: "el que a cola dejó los Amadises"
                r: "subject 5: he who left the Amadises behind"
                under:
                  - {s: "y en muy poquito a Galaores tuvo", r: "and thought very little of the Galaors"}
                  - {s: "estribando en su amor y bizarría", r: "how: relying on his love and gallantry"}
              - {s: "el que hizo callar los Belianises", r: "subject 6: he who silenced the Belianises"}
              - {s: "aquel que en Rocinante errando anduvo", r: "subject 7: he who went wandering on Rocinante"}
        forms:
          - {w: "tuvo", f: "tuv- + -o → tener (to have), preterite, it (the wit), and later 'en poquito tuvo', he. Irregular: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron."}
          - {w: "aguda, ancha", f: "agud- + -a → agudo (sharp) and anch- + -a → ancho (broad), feminine to match 'veleta'."}
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), it, used as a conditional: 'it would be'. ser (to be) in the -ra form: fuera, fueras, fuera, fuéramos, fuerais, fueran."}
          - {w: "ensancha", f: "ensanch- + -a → ensanchar (to widen), present, it (its strength). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "llegó, grabó, dejó", f: "lleg- + -ó → llegar (to reach), grab- + -ó → grabar (to engrave), dej- + -ó → dejar (to leave), preterite, it / she / he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "del Catay", f: "del = de + el, the article kept with the name 'el Catay'."}
          - {w: "más horrenda y más discreta", f: "horrend- + -a → horrendo, discret- + -a → discreto, feminine to match 'musa'; 'la ... más' + adjective makes the superlative 'the most'."}
          - {w: "broncínea", f: "broncíne- + -a → broncíneo (of bronze), feminine to match 'plancha'; a Latinate formation like 'marmóreo' (of marble)."}
          - {w: "Amadises, Galaores, Belianises", f: "proper names made plural (-es after a consonant) to mean 'all the knights like Amadís, Galaor, Belianís'."}
          - {w: "muy poquito", f: "poc- + -quito → poco (little) with the diminutive -ito (c becomes qu before i): 'very little indeed'."}
          - {w: "estribando", f: "gerund of estribar (to rest on): 'relying'."}
          - {w: "hizo callar", f: "hiz- + -o → hacer (to make), preterite, he, + the infinitive callar (to be silent): 'made (them) be silent'. hacer (to make) in the preterite: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "errando anduvo", f: "anduv- + -o → andar (to go), preterite, he, + errando, gerund of errar (to wander): 'went wandering'. andar (to go) in the preterite: anduve, anduviste, anduvo, anduvimos, anduvisteis, anduvieron."}
          - {w: "yace", f: "yac- + -e → yacer (to lie buried), present, he. yazgo (or yazco), yaces, yace, yacemos, yacéis, yacen."}
          - {w: "desta", f: "de + esta (this), feminine to match 'losa'."}
        note: "The 'arm that reached from Cathay to Gaeta' and the bronze inscriptions are mock-heroic hyperbole. The academicians' muse is called both 'most frightful' and 'most wise', a self-mocking pair."
  - sentences:
