        note: "Lost manuscripts dug up in old buildings were a stock device of the romances of chivalry, which often claimed to be translations of ancient chronicles found by chance; the 'leaden box' also recalls the lead tablets of Granada's Sacromonte, 'discovered' in the 1590s, though any allusion is uncertain."
      - es: "en la cual caja se habían hallado unos pergaminos escritos con letras góticas, pero en versos castellanos, que contenían muchas de sus hazañas y daban noticia de la hermosura de Dulcinea del Toboso, de la figura de Rocinante, de la fidelidad de Sancho Panza y de la sepultura del mesmo don Quijote, con diferentes epitafios y elogios de su vida y costumbres."
