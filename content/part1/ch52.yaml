  - sentences:
      - es: "En el soberbio trono diamantino que con sangrientas plantas huella Marte, frenético, el Manchego su estandarte tremola con esfuerzo peregrino."
        literal: "On the proud throne diamond-like that with bloody soles treads Mars, frenzied, the Manchegan his standard waves with effort rare."
        ormsby: "On that proud throne of diamantine sheen, / Which the blood-reeking feet of Mars degrade, / The mad Manchegan’s banner now hath been / By him in all its bravery displayed."
        ormsby_match: false
        ormsby_note: "In the second and third editions trono, \"throne\", was changed into tronco, which Hartzenbusch considers a blundering alteration. I am inclined to think, however, that he is wrong, and that what Cervantes meant was not a diamond-studded throne, but an adamant pillar, a trophy in fact. But it is no great matter; the sonnet was meant for nonsense, and is successful either way."
        vocab:
          - {w: "soberbio", d: "proud, magnificent"}
          - {w: "trono", d: "throne"}
          - {w: "diamantino", d: "of diamond, adamantine, unbreakable (poetic)"}
          - {w: "plantas", d: "soles of the feet (not 'plants')"}
          - {w: "hollar", d: "to tread on, trample; 'huella' = treads"}
          - {w: "Marte", d: "Mars, Roman god of war"}
          - {w: "frenético", d: "frenzied, raving mad"}
          - {w: "el Manchego", d: "the man from La Mancha, i.e. Don Quijote"}
          - {w: "estandarte", d: "standard, banner"}
          - {w: "tremolar", d: "to wave, flutter (a flag)"}
          - {w: "peregrino", d: "rare, extraordinary (false friend: here not 'pilgrim')"}
        diagram:
          - s: "el Manchego su estandarte tremola"
            r: "main verb: the man of La Mancha waves his banner"
            under:
              - s: "En el soberbio trono diamantino"
                r: "where: on the proud diamond throne"
                under:
                  - {s: "que con sangrientas plantas huella Marte", r: "describes 'trono': which Mars treads with bloody soles"}
              - {s: "frenético", r: "describes 'el Manchego': frenzied"}
              - {s: "con esfuerzo peregrino", r: "how: with rare valor"}
        forms:
          - {w: "soberbio, diamantino", f: "masculine to match 'trono'; diamant- + -ino → diamantino, 'made of diamond', the suffix -ino as in 'cristalino'."}
          - {w: "sangrientas", f: "sangrient- + -as → sangriento (bloody), feminine plural to match 'plantas'."}
          - {w: "huella", f: "huell- + -a → hollar (to tread), present, he (Mars). The stem o becomes ue when stressed: huello, huellas, huella, hollamos, holláis, huellan. The subject 'Marte' comes after the verb."}
          - {w: "tremola", f: "tremol- + -a → tremolar (to wave), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. The object 'su estandarte' comes before the verb, a poetic inversion."}
          - {w: "peregrino", f: "masculine to match 'esfuerzo'."}
        note: "The sonnet is a string of grand, nearly meaningless heroic images, the kind found in the commendatory sonnets printed at the front of books, here aimed at a nag."
      - es: "Cuelga las armas y el acero fino con que destroza, asuela, raja y parte: ¡nuevas proezas!, pero inventa el arte un nuevo estilo al nuevo paladino."
