        ormsby: "Malignant planets, cruel destiny, / Pursued them both, the fair Manchegan dame, / And the unconquered star of chivalry. / Nor youth nor beauty saved her from the claim / Of death; he paid love’s bitter penalty, / And left the marble to preserve his name."
        ormsby_match: false
        vocab:
