      - es: "que luego al punto dejéis libre a esa hermosa señora, cuyas lágrimas y triste semblante dan claras muestras que la lleváis contra su voluntad y que algún notorio desaguisado le habedes fecho;"
        literal: "that immediately at-the moment you-leave free to that beautiful lady, whose tears and sad countenance give clear signs that her you-carry against her will and that some notorious outrage to-her you-have done;"
        ormsby: "that at once, this very instant, ye release that fair lady whose tears and sad aspect show plainly that ye are carrying her off against her will, and that ye have committed some scandalous outrage against her;"
        vocab:
          - {w: "luego al punto", d: "at once, this very instant ('luego' in Cervantes means 'immediately')"}
          - {w: "dejar libre", d: "to set free"}
          - {w: "semblante", d: "face, countenance, expression"}
          - {w: "dar muestras", d: "to show signs, show"}
          - {w: "notorio", d: "obvious, glaring"}
          - {w: "desaguisado", d: "outrage, wrong, injury (chivalric word)"}
          - {w: "habedes fecho", d: "= habéis hecho, you have done: mock-archaic knightly speech, with 'f' for 'h' and the old '-edes' ending"}
        diagram:
          - s: "que luego al punto dejéis libre a esa hermosa señora"
            r: "what I say (continues 'es ésta'): that you set that fair lady free at once"
            under:
              - s: "cuyas lágrimas y triste semblante dan claras muestras"
                r: "describes 'señora': whose tears and sad face clearly show"
                under:
                  - {s: "que la lleváis contra su voluntad", r: "what they show, 1: that you are carrying her off against her will"}
                  - {s: "y que algún notorio desaguisado le habedes fecho", r: "what they show, 2: and that you have done her some glaring wrong"}
        forms:
          - {w: "dejéis", f: "dej- + -éis → dejar (to leave), present subjunctive, you (vosotros): 'that you leave'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. Subjunctive because it is a demand."}
          - {w: "esa hermosa", f: "es- + -a → ese (that), hermos- + -a → hermoso (beautiful), feminine to match 'señora'."}
          - {w: "cuyas", f: "cuy- + -as → cuyo (whose), feminine plural to match 'lágrimas', the thing owned, not the owner."}
          - {w: "dan", f: "d- + -an → dar (to give), present, they: doy, das, da, damos, dais, dan."}
          - {w: "lleváis", f: "llev- + -áis → llevar (to carry), present, you (vosotros). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun ('desaguisado')."}
          - {w: "habedes fecho", f: "hab- + -edes → haber (to have), present, you (vosotros), old form of 'habéis': he, has, ha, hemos, habéis (old habedes), han; + fecho, old form of hecho, participle of hacer (to do): 'you have done'."}
        note: "Don Quijote slips into the archaic language of the romances ('habedes fecho' for 'habéis hecho') whenever he plays the knight. The 'tears' are painted or carved on the image: a Virgin of Sorrows weeps."
