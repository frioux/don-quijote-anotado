                r: "how: gripping their scourges"
                under:
                  - {s: "y los clérigos los ciriales", r: "and the clergy (gripping) their candlesticks"}
              - s: "con determinación de defenderse"
                r: "how: determined to defend themselves"
                under:
                  - {s: "y aun ofender, si pudiesen, a sus acometedores", r: "and even to attack their assailants, if they could"}
        forms:
          - {w: "alzados", f: "alz- + -ados → alzar (to raise), participle, masculine plural to match 'capirotes': absolute participle, 'with the hoods raised'."}
          - {w: "empuñando", f: "gerund of empuñar (to grip): 'gripping'."}
          - {w: "esperaban", f: "esper- + -aban → esperar (to await), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "defenderse", f: "defender (to defend) + se (themselves), the pronoun hung on the infinitive after 'de'."}
          - {w: "pudiesen", f: "pud- + -iesen → poder (to be able), imperfect subjunctive (-se form), they: pudiese, pudieses, pudiese, pudiésemos, pudieseis, pudiesen."}
