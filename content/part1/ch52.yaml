          - s: "Bien dices"
            r: "main verb 1: you speak well"
            under:
              - {s: "Sancho", r: "address"}
          - {s: "respondió don Quijote", r: "speech tag: answered Don Quijote"}
          - s: "será gran prudencia"
            r: "main verb 2 (after 'y'): it will be great prudence"
            under:
              - s: "dejar pasar el mal influjo de las estrellas"
                r: "subject: to let the stars' bad influence pass"
                under:
                  - {s: "que agora corre", r: "describes 'influjo': that prevails now"}
        forms:
          - {w: "dices", f: "dic- + -es → decir (to say), present, you (tú). Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "será", f: "ser- + -á → ser (to be), future, it. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "gran", f: "grande (great) clipped to 'gran' before a singular noun ('prudencia')."}
          - {w: "dejar pasar", f: "dejar (to let) + pasar (to pass): two infinitives, 'to let pass'; the whole phrase is the subject of 'será'."}
          - {w: "mal", f: "malo (bad) clipped to 'mal' before a masculine singular noun ('influjo')."}
          - {w: "corre", f: "corr- + -e → correr (to run, prevail), present, it (the influence). The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
        note: "Astrology was taken seriously: a run of bad luck could be blamed on an unfavourable conjunction of the stars, and the prudent man waited for it to pass."
  - sentences:
      - es: "El canónigo y el cura y barbero le dijeron que haría muy bien en hacer lo que decía; y así, habiendo recebido grande gusto de las simplicidades de Sancho Panza, pusieron a don Quijote en el carro, como antes venía."
