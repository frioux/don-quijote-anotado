            r: "subject: what stopped the peasant"
            under:
              - {s: "no fueron las voces de Sancho", r: "main verb 1: was not Sancho's shouts"}
              - s: "sino el ver"
                r: "but: but the seeing"
                under:
                  - {s: "que don Quijote no bullía pie ni mano", r: "what he saw: that Don Quijote did not stir hand or foot"}
          - s: "con priesa se alzó la túnica a la cinta"
            r: "main verb 2: hastily he hitched his tunic up to his waist"
            under:
              - {s: "creyendo que le había muerto", r: "why: believing he had killed him"}
          - {s: "y dio a huir por la campaña como un gamo", r: "main verb 3: and fled across the country like a deer"}
        forms:
          - {w: "detuvo", f: "detuv- + -o → detener (to stop), preterite, it. Irregular like tener (to have): detuve, detuviste, detuvo, detuvimos, detuvisteis, detuvieron."}
          - {w: "al", f: "a + el; 'a' marks the person who is the object."}
          - {w: "fueron", f: "fu- + -eron → ser (to be), preterite, they, agreeing with the plural 'voces'. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "el ver", f: "ver (to see), infinitive used as a noun with 'el': 'the seeing'."}
          - {w: "bullía", f: "bull- + -ía → bullir (to stir), imperfect, he. The imperfect of -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "creyendo", f: "gerund of creer (to believe); i turns to y between vowels."}
