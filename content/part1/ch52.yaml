            r: "main verb: Sancho Panza is this one (pointing at a portrait)"
            under:
              - {s: "en cuerpo chico", r: "describes Sancho, 1: small in body"}
              - {s: "Pero grande en valor", r: "describes Sancho, 2: but great in valor"}
          - {s: "¡milagro extraño!", r: "exclamation: a strange wonder!"}
        forms:
          - {w: "es", f: "ser (to be), present, he. soy, eres, es, somos, sois, son."}
