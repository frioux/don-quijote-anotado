                under:
                  - {s: "que acertó a ser domingo", r: "describes 'día': which happened to be a Sunday"}
          - s: "la gente estaba toda en la plaza"
            r: "main verb 5 (after 'y'): everyone was in the square"
            under:
              - {s: "por mitad de la cual atravesó el carro de don Quijote", r: "describes 'plaza': through the middle of which Don Quijote's cart passed"}
        forms:
          - {w: "unció", f: "unc- + -ió → uncir (to yoke), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "acomodó", f: "acomod- + -ó → acomodar (to settle), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "siguió", f: "sigu- + -ió → seguir (to follow), preterite, he. The stem e becomes i in the he/they forms: seguí, seguiste, siguió, seguimos, seguisteis, siguieron."}
          - {w: "acostumbrada", f: "participle of acostumbrar (to be used to), used as an adjective 'usual', feminine to match 'flema'."}
          - {w: "quiso", f: "quis- + -o → querer (to want), preterite, he. Irregular: quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "llegaron, entraron", f: "lleg- + -aron → llegar (to arrive) and entr- + -aron → entrar (to enter), preterite, they. Same -ar preterite."}
          - {w: "acertó", f: "acert- + -ó → acertar (to happen to, hit on), preterite, it. Same -ar preterite."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, it (the people). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. 'la gente' is singular in Spanish."}
          - {w: "toda", f: "todo (all), feminine singular to match 'la gente'."}
          - {w: "la cual", f: "'which', feminine to match 'plaza'; a heavier relative than 'que', used after a preposition."}
          - {w: "atravesó", f: "atraves- + -ó → atravesar (to cross), preterite, it (the cart). Same -ar preterite."}
        note: "A procession of the caged madman through his own village square on a Sunday, when everyone is out after Mass, is the most public homecoming possible: the whole village sees him come back in disgrace."
      - es: "Acudieron todos a ver lo que en el carro venía, y, cuando conocieron a su compatrioto, quedaron maravillados, y un muchacho acudió corriendo a dar las nuevas a su ama y a su sobrina de que su tío y su señor venía flaco y amarillo, y tendido sobre un montón de heno y sobre un carro de bueyes."
        literal: "Came-running all to see that which in the cart was-coming, and, when they-recognized their fellow-townsman, they-remained amazed, and a boy came running to give the news to his housekeeper and to his niece that their uncle and their master was-coming thin and yellow, and stretched on a heap of hay and on a cart of oxen."
        ormsby: "They all flocked to see what was in the cart, and when they recognised their townsman they were filled with amazement, and a boy ran off to bring the news to his housekeeper and his niece that their master and uncle had come back all lean and yellow and stretched on a truss of hay on an oxcart."
