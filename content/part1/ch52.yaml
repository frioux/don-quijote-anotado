  - sentences:
      - es: "— ¿Quién ha de ser —respondió el barbero— sino el famoso don Quijote de la Mancha, desfacedor de agravios, enderezador de tuertos, el amparo de las doncellas, el asombro de los gigantes y el vencedor de las batallas?"
        literal: "— Who has to be —answered the barber— but the famous Don Quijote of la Mancha, undoer of grievances, straightener of wrongs, the shelter of the maidens, the terror of the giants and the conqueror of the battles?"
        ormsby: "“Who should it be,” said the barber, “but the famous Don Quixote of La Mancha, the undoer of injustice, the righter of wrongs, the protector of damsels, the terror of giants, and the winner of battles?”"
        vocab:
          - {w: "¿quién ha de ser sino ...?", d: "who should it be but ...?, who else but ...?"}
          - {w: "desfacedor de agravios", d: "undoer of wrongs; 'desfacer' is the old form of 'deshacer', the language of the chivalry books"}
          - {w: "agravio", d: "wrong, injury, grievance"}
          - {w: "enderezador de tuertos", d: "righter of wrongs; 'tuerto' is an old word for 'wrong', literally 'twisted', so 'enderezar' (to straighten) fits it"}
          - {w: "amparo", d: "protection, shelter, protector"}
          - {w: "asombro", d: "terror, dread (older sense); now 'astonishment'"}
          - {w: "vencedor", d: "conqueror, winner"}
        diagram:
          - s: "¿Quién ha de ser"
            r: "main verb: who should it be?"
            under:
              - {s: "respondió el barbero", r: "speech tag: the barber answered"}
              - s: "sino el famoso don Quijote de la Mancha"
                r: "the answer: but the famous Don Quijote de la Mancha"
                under:
                  - {s: "desfacedor de agravios, enderezador de tuertos", r: "describes 'don Quijote', titles 1: undoer of grievances, righter of wrongs"}
                  - {s: "el amparo de las doncellas, el asombro de los gigantes y el vencedor de las batallas?", r: "describes 'don Quijote', titles 2: protector, terror, conqueror"}
        forms:
          - {w: "ha de ser", f: "ha, from haber (to have), present, it: he, has, ha, hemos, habéis, han; + de + ser (to be): 'haber de' + infinitive, 'must be, should be'. In a question, 'who should it be?'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "desfacedor", f: "desfac- + -edor → desfacer, the old form of deshacer (to undo), with the suffix -dor, 'one who does': 'undoer'."}
          - {w: "enderezador", f: "enderez- + -ador → enderezar (to straighten), with the suffix -dor, 'one who does': 'straightener'."}
          - {w: "vencedor", f: "venc- + -edor → vencer (to conquer), with the suffix -dor: 'conqueror'."}
        note: "The barber answers in Don Quijote's own chivalric jargon, with the old f- of 'desfacedor' and the archaic 'tuertos', mocking him while seeming to praise him."
  - sentences:
      - es: "— Eso me semeja —respondió el cabrero— a lo que se lee en los libros de caballeros andantes, que hacían todo eso que de este hombre vuestra merced dice;"
