  - sentences:
      - es: "En estas razones, cayeron todos los que las oyeron que don Quijote debía de ser algún hombre loco, y tomáronse a reír muy de gana; cuya risa fue poner pólvora a la cólera de don Quijote, porque, sin decir más palabra, sacando la espada, arremetió a las andas."
        literal: "On these words, fell [into it] all those who them heard that Don Quijote must be some man mad, and took-themselves to laugh very heartily; which laughter was to-put gunpowder to the anger of Don Quijote, because, without saying more word, drawing the sword, he-charged at the litter."
        ormsby: "From these words all the hearers concluded that he must be a madman, and began to laugh heartily, and their laughter acted like gunpowder on Don Quixote’s fury, for drawing his sword without another word he made a rush at the stand."
        vocab:
          - {w: "razones", d: "words, remarks (not 'reasons')"}
          - {w: "caer en que", d: "to realize, see that, twig"}
          - {w: "deber de", d: "must (probability): 'debía de ser' = must be"}
          - {w: "tomarse a", d: "to start to, set about"}
          - {w: "de gana", d: "heartily, with a will"}
          - {w: "poner pólvora a", d: "to add gunpowder to, i.e. to make explode"}
          - {w: "cólera", d: "anger, rage (in humoral theory, the hot humour of choler)"}
          - {w: "andas", d: "the litter or stand on which a holy image is carried on the shoulders"}
