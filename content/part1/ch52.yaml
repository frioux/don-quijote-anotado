  - sentences:
      - es: "Esta que veis de rostro amondongado, alta de pechos y ademán brioso, es Dulcinea, reina del Toboso, de quien fue el gran Quijote aficionado."
        literal: "This-one whom you-see of face tripe-puffed, high of breasts and bearing spirited, is Dulcinea, queen of-the Toboso, of whom was the great Quijote enamoured."
        ormsby: "She, whose full features may be here descried, / High-bosomed, with a bearing of disdain, / Is Dulcinea, she for whom in vain / The great Don Quixote of La Mancha sighed."
        vocab:
          - {w: "amondongado", d: "puffy, fat-faced, coarse-featured (from 'mondongo', tripe)"}
          - {w: "alta de pechos", d: "high-bosomed, full-breasted"}
          - {w: "ademán", d: "bearing, manner, gesture"}
          - {w: "brioso", d: "spirited, vigorous"}
          - {w: "el Toboso", d: "El Toboso, Dulcinea's village in La Mancha; 'reina del Toboso' mixes royal and rustic"}
          - {w: "aficionado de", d: "fond of, in love with"}
        diagram:
          - s: "es Dulcinea"
            r: "main verb: is Dulcinea"
            under:
              - s: "Esta que veis"
                r: "subject: this woman you see"
                under:
                  - {s: "de rostro amondongado", r: "describes 'Esta': with a puffy face"}
                  - {s: "alta de pechos y ademán brioso", r: "describes 'Esta', 2: high-bosomed and spirited in bearing"}
              - {s: "reina del Toboso", r: "describes 'Dulcinea': queen of El Toboso"}
              - {s: "de quien fue el gran Quijote aficionado", r: "describes 'Dulcinea': whom the great Quijote loved"}
        forms:
          - {w: "Esta", f: "est- + -a → este (this), feminine pronoun: 'this woman'; it points at a portrait, as in a poem for the front of a book."}
          - {w: "veis", f: "ve- + -is → ver (to see), present, you (vosotros, the readers). ver (to see) in the present: veo, ves, ve, vemos, veis, ven."}
          - {w: "amondongado", f: "a- + mondongo (tripe) + -ado, an adjective shaped like a participle, masculine to match 'rostro'."}
          - {w: "alta", f: "alt- + -a → alto (high), feminine to match 'Esta'."}
          - {w: "es, fue", f: "ser (to be), present and preterite, she / he. Present: soy, eres, es, somos, sois, son; preterite: fui, fuiste, fue, fuimos, fuisteis, fueron. 'fue aficionado' = 'was devoted'."}
          - {w: "gran", f: "grande (great) clipped before a singular noun ('Quijote')."}
        note: "The 'praise' is a backhanded portrait, describing Dulcinea as the buxom peasant Aldonza Lorenzo rather than the ideal lady Don Quijote imagines. The opening 'Esta que veis' copies the formula of verses written beneath portraits."
      - es: "Pisó por ella el uno y otro lado de la gran Sierra Negra, y el famoso campo de Montïel, hasta el herboso llano de Aranjüez, a pie y cansado."
        literal: "He-trod for her the one and other side of the great Sierra Negra, and the famous plain of Montiel, as-far-as the grassy plain of Aranjuez, on foot and tired."
        ormsby: "For her, Toboso’s queen, from side to side / He traversed the grim sierra, the champaign / Of Aranjuez, and Montiel’s famous plain: / On Rocinante oft a weary ride."
        ormsby_match: false
        vocab:
          - {w: "pisar", d: "to tread, walk over"}
          - {w: "el uno y otro lado", d: "both sides, from one side to the other"}
          - {w: "Sierra Negra", d: "'Black Mountains'; probably a mock name for the Sierra Morena ('dark' mountains), where Don Quijote did penance"}
          - {w: "campo de Montiel", d: "the plain of Montiel in La Mancha, where Don Quijote rode on his first sally"}
          - {w: "Montïel, Aranjüez", d: "the diaeresis marks an extra syllable for the metre: Mon-ti-el, A-ran-ju-ez"}
          - {w: "herboso", d: "grassy"}
          - {w: "llano", d: "plain, flat land"}
          - {w: "Aranjuez", d: "royal palace and gardens on the Tagus south of Madrid, famous for its greenery; Don Quijote never went there"}
          - {w: "a pie", d: "on foot"}
        diagram:
          - s: "Pisó"
            r: "main verb: he trod"
            under:
              - {s: "por ella", r: "why: for her sake"}
              - s: "el uno y otro lado de la gran Sierra Negra"
                r: "object 1: both sides of the great Black Sierra"
              - {s: "y el famoso campo de Montïel", r: "object 2: and the famous plain of Montiel"}
              - {s: "hasta el herboso llano de Aranjüez", r: "how far: as far as the grassy plain of Aranjuez"}
              - {s: "a pie y cansado", r: "how: on foot and weary"}
        forms:
          - {w: "Pisó", f: "pis- + -ó → pisar (to tread), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "ella", f: "'her' after a preposition (por ella), standing for Dulcinea."}
          - {w: "gran", f: "grande (great) clipped before a singular noun ('Sierra')."}
          - {w: "famoso, herboso", f: "fam- + -oso → famoso (famous), herb- + -oso → herboso (grassy): the suffix -oso, 'full of', masculine to match 'campo' and 'llano'."}
          - {w: "cansado", f: "participle of cansar (to tire), masculine to match the knight: 'tired'."}
        note: "'A pie' is a joke: a knight-errant never goes on foot, yet the poem makes him trudge for love. Ormsby softens it to 'on Rocinante oft a weary ride'."
      - es: "Culpa de Rocinante, ¡oh dura estrella!, que esta manchega dama, y este invito andante caballero, en tiernos años, ella dejó, muriendo, de ser bella; y él, aunque queda en mármores escrito, no pudo huir de amor, iras y engaños."
