      - es: "y, recibiendo en ella una gran cuchillada que le tiró don Quijote, con que se la hizo dos partes, con el último tercio, que le quedó en la mano, dio tal golpe a don Quijote encima de un hombro, por el mismo lado de la espada, que no pudo cubrir el adarga contra villana fuerza, que el pobre don Quijote vino al suelo muy mal parado."
