  - sentences:
      - es: "Era el caso que aquel año habían las nubes negado su rocío a la tierra, y por todos los lugares de aquella comarca se hacían procesiones, rogativas y diciplinas, pidiendo a Dios abriese las manos de su misericordia y les lloviese;"
        literal: "It-was the case that that year had the clouds denied their dew to the earth, and through all the villages of that district themselves were-made processions, rogations and scourgings, asking to God [that] he-should-open the hands of his mercy and on-them should-rain;"
        ormsby: "The fact was that the clouds had that year withheld their moisture from the earth, and in all the villages of the district they were organising processions, rogations, and penances, imploring God to open the hands of his mercy and send the rain;"
