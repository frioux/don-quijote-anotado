      - es: "puesto que para mí tengo, o que vuestra merced se burla, o que este gentil hombre debe de tener vacíos los aposentos de la cabeza."
        literal: "although for myself I-hold, either that your grace himself mocks, or that this gentle man must have empty the rooms of the head."
