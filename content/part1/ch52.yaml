          - {w: "canterà", d: "Italian: will sing (Spanish 'cantará')"}
          - {w: "miglior", d: "Italian: better (Spanish 'mejor')"}
          - {w: "plectio", d: "the Gutenberg reading, most likely a misprint for 'plectro' (Ormsby prints 'plectro'): plectrum, the quill used to pluck a lyre, i.e. poetic skill"}
        diagram:
          - s: "canterà"
            r: "main verb (Italian): will sing"
            under:
              - {s: "Forsi", r: "how sure: perhaps"}
              - {s: "altro", r: "subject: another (poet)"}
              - {s: "con miglior plectio", r: "how: with a better plectrum, more skill"}
        forms:
