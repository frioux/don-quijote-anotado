part: 1
chapter: 52
title_es: "Capítulo LII. De la pendencia que don Quijote tuvo con el cabrero, con la rara aventura de los deceplinantes, a quien dio felice fin a costa de su sudor"
title_en: "Of the quarrel that Don Quixote had with the goatherd, together with the rare adventure of the penitents, which with an expenditure of sweat he brought to a happy conclusion"
paragraphs:
  - sentences:
      - es: "General gusto causó el cuento del cabrero a todos los que escuchado le habían;"
        literal: "General pleasure caused the tale of-the goatherd to all those who listened-to it had;"
        ormsby: "The goatherd’s tale gave great satisfaction to all the hearers,"
        ormsby_match: false
        vocab:
          - {w: "gusto", d: "pleasure, enjoyment; 'causar gusto' = to please"}
          - {w: "cabrero", d: "goatherd: Eugenio, who has just told the story of Leandra"}
          - {w: "escuchado le habían", d: "= le habían escuchado, had listened to it; verse-like word order with the participle first"}
        diagram:
          - s: "causó"
            r: "main verb: caused"
            under:
              - {s: "General gusto", r: "object: general pleasure (put first for emphasis)"}
              - {s: "el cuento del cabrero", r: "subject: the goatherd's tale"}
              - {s: "a todos los que escuchado le habían", r: "to whom: to all who had listened to it"}
        forms:
          - {w: "causó", f: "caus- + -ó → causar (to cause), preterite, it (the tale). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "del", f: "de + el, 'of the'."}
          - {w: "escuchado le habían", f: "hab- + -ían → haber (to have), imperfect, they, + escuchado, the participle of escuchar (to listen to): the pluperfect, 'they had listened to'. haber (to have) in the imperfect: había, habías, había, habíamos, habíais, habían. Cervantes puts the participle first and the pronoun in the middle; modern order 'le habían escuchado'."}
          - {w: "le", f: "'it' (the tale), a masculine thing as direct object: 'le' where modern standard Spanish uses 'lo' (leísmo, common in Cervantes)."}
      - es: "especialmente le recibió el canónigo, que con estraña curiosidad notó la manera con que le había contado, tan lejos de parecer rústico cabrero cuan cerca de mostrarse discreto cortesano;"
        literal: "especially it received the canon, who with unusual care noted the manner with which it [he] had told, as far from seeming rustic goatherd as near to showing-himself witty courtier;"
        ormsby: "and the canon especially enjoyed it, for he had remarked with particular attention the manner in which it had been told, which was as unlike the manner of a clownish goatherd as it was like that of a polished city wit;"
        vocab:
          - {w: "recibir", d: "here to take (something) well, enjoy it"}
          - {w: "canónigo", d: "canon: a priest of a cathedral chapter; this one is from Toledo and has been riding with the party"}
          - {w: "estraño", d: "= extraño (old spelling); here 'unusual, remarkable', not 'strange'"}
          - {w: "curiosidad", d: "care, close attention (false friend: not 'curiosity')"}
          - {w: "tan lejos de ... cuan cerca de", d: "as far from ... as close to"}
          - {w: "rústico", d: "rustic, boorish, countrified"}
          - {w: "discreto", d: "clever, witty, sensible (not 'discreet')"}
          - {w: "cortesano", d: "courtier, a polished man of the court or city"}
        diagram:
          - s: "le recibió"
            r: "main verb: received it, i.e. enjoyed it"
            under:
              - {s: "especialmente", r: "how: especially"}
              - s: "el canónigo"
                r: "subject: the canon"
                under:
                  - s: "que con estraña curiosidad notó la manera"
                    r: "describes 'canónigo': who noted with unusual care the manner"
                    under:
                      - {s: "con que le había contado", r: "describes 'manera': in which he had told it"}
                      - {s: "tan lejos de parecer rústico cabrero", r: "describes the telling: as far from seeming a rustic goatherd"}
                      - {s: "cuan cerca de mostrarse discreto cortesano", r: "comparison: as close to showing himself a witty courtier"}
        forms:
          - {w: "recibió", f: "recib- + -ió → recibir (to receive), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "le", f: "'it' (the tale), masculine direct object: 'le' where modern standard Spanish uses 'lo' (leísmo)."}
          - {w: "estraña", f: "estrañ- + -a → estraño (= extraño, unusual), feminine to match 'curiosidad'; old spelling with s for x."}
          - {w: "notó", f: "not- + -ó → notar (to note), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "había contado", f: "hab- + -ía → haber (to have), imperfect, he, + contado, the participle of contar (to tell): the pluperfect, 'he had told'. haber (to have) in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "parecer", f: "parecer (to seem), infinitive after 'de'."}
          - {w: "mostrarse", f: "mostrar (to show) + se (himself), infinitive after 'de' with the pronoun hung on the end: 'to show himself'."}
          - {w: "cuan", f: "cuanto (as much) clipped before an adjective or adverb: 'tan ... cuan' = 'as ... as'; modern Spanish says 'tan ... como'."}
      - es: "y así, dijo que había dicho muy bien el cura en decir que los montes criaban letrados."
        literal: "and so, he-said that had said very well the priest in saying that the hills bred learned-men."
        ormsby: "and he observed that the curate had been quite right in saying that the woods bred men of learning."
        vocab:
          - {w: "y así", d: "and so, and accordingly"}
          - {w: "decir bien", d: "to speak rightly, be right"}
          - {w: "cura", d: "parish priest (the curate): Don Quijote's village priest, Pero Pérez"}
          - {w: "montes", d: "hills, wild uplands, woods: the countryside far from towns"}
          - {w: "criar", d: "to breed, raise, bring up"}
          - {w: "letrado", d: "learned man, scholar; also a university-trained lawyer"}
        diagram:
          - s: "dijo"
            r: "main verb: he (the canon) said"
            under:
              - {s: "y así", r: "linking: and so"}
              - s: "que había dicho muy bien el cura"
                r: "what he said: that the priest had been quite right"
                under:
                  - s: "en decir"
                    r: "in what: in saying"
                    under:
                      - {s: "que los montes criaban letrados", r: "what the priest said: that the hills bred scholars"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "había dicho", f: "hab- + -ía → haber (to have), imperfect, he, + dicho, the irregular participle of decir (to say): the pluperfect, 'he had said'. haber (to have) in the imperfect: había, habías, había, habíamos, habíais, habían. The subject 'el cura' follows the verb."}
          - {w: "en decir", f: "decir (to say), infinitive after 'en': 'in saying'."}
          - {w: "criaban", f: "cri- + -aban → criar (to breed), imperfect, they (the hills). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
        note: "The priest made this remark when the goatherd first spoke so well, before his tale. A goatherd who talks like a courtier is a convention of pastoral, where shepherds are often gentlemen in disguise, as Eugenio is: a rich young farmer turned herdsman for love."
      - es: "Todos se ofrecieron a Eugenio; pero el que más se mostró liberal en esto fue don Quijote, que le dijo:"
        literal: "All themselves offered to Eugenio; but the-one who most himself showed generous in this was Don Quijote, who to-him said:"
        ormsby: "They all offered their services to Eugenio but he who showed himself most liberal in this way was Don Quixote, who said to him,"
        vocab:
          - {w: "ofrecerse a", d: "to offer one's services to"}
          - {w: "liberal", d: "generous, open-handed (not the political sense)"}
          - {w: "mostrarse", d: "to show oneself, prove to be"}
        diagram:
          - s: "Todos se ofrecieron"
            r: "main verb 1: all offered themselves"
            under:
              - {s: "a Eugenio", r: "to whom: to Eugenio"}
          - s: "fue don Quijote"
            r: "main verb 2 (after 'pero'): was Don Quijote"
            under:
              - {s: "el que más se mostró liberal en esto", r: "subject: the one who showed himself most generous in this"}
              - {s: "que le dijo:", r: "describes 'don Quijote': who said to him"}
        forms:
          - {w: "se ofrecieron", f: "ofrec- + -ieron → ofrecerse (to offer oneself), preterite, they. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "se mostró", f: "mostr- + -ó → mostrarse (to show oneself), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "fue", f: "ser (to be), preterite, he. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Por cierto, hermano cabrero, que si yo me hallara posibilitado de poder comenzar alguna aventura, que luego luego me pusiera en camino porque vos la tuviérades buena;"
        literal: "— For certain, brother goatherd, that if I myself found able of to-be-able to-begin some adventure, that at-once at-once myself I-would-put on road so-that you it would-have good;"
        ormsby: "“Most assuredly, brother goatherd, if I found myself in a position to attempt any adventure, I would, this very instant, set out on your behalf,"
        vocab:
          - {w: "por cierto", d: "certainly, most assuredly"}
          - {w: "que ... que", d: "the 'que' after 'Por cierto' and again after the 'si' clause is a spoken filler, 'I tell you that'; English drops both"}
          - {w: "hallarse", d: "to find oneself, to be"}
          - {w: "posibilitado", d: "in a position, able (a rare, rather pompous word)"}
          - {w: "luego luego", d: "at once, this very instant (doubling makes it stronger); 'luego' in Cervantes usually means 'immediately', not 'later'"}
          - {w: "ponerse en camino", d: "to set out, take the road"}
          - {w: "porque", d: "with the subjunctive, 'so that', not 'because'"}
          - {w: "tenerla buena", d: "to have it go well; 'la' is vague, 'your affair'"}
        diagram:
          - s: "me pusiera en camino"
            r: "main verb: I would set out"
            under:
              - {s: "Por cierto, hermano cabrero", r: "opening and address: certainly, brother goatherd"}
              - s: "si yo me hallara posibilitado"
                r: "condition: if I found myself able"
                under:
                  - {s: "de poder comenzar alguna aventura", r: "able to what: to be able to start some adventure"}
              - {s: "luego luego", r: "when: this very instant"}
              - {s: "porque vos la tuviérades buena", r: "purpose: so that things might go well for you"}
        forms:
          - {w: "me hallara", f: "hall- + -ara → hallar (to find), imperfect subjunctive (-ra form), I, with 'me' (myself): 'if I found myself'. The -ra imperfect subjunctive of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran. Used after 'si' for an unreal condition."}
          - {w: "posibilitado", f: "posibilit- + -ado → posibilitar (to make possible), participle as adjective, masculine to match 'yo'."}
          - {w: "poder comenzar", f: "poder (to be able) + comenzar (to begin), two infinitives in a row after 'de': 'of being able to begin'."}
          - {w: "alguna", f: "algun- + -a → alguno (some), feminine to match 'aventura'."}
          - {w: "pusiera", f: "pus- + -iera → poner (to put), imperfect subjunctive (-ra form), I, used as a conditional: 'I would put (myself)'. Irregular stem pus-: pusiera, pusieras, pusiera, pusiéramos, pusierais, pusieran. Cervantes often uses the -ra form where modern Spanish uses the conditional 'pondría'."}
          - {w: "vos", f: "'you', one person addressed with the old pronoun 'vos', which by 1600 was used to equals or inferiors; Don Quijote is the gentleman, Eugenio the herdsman."}
          - {w: "tuviérades", f: "tuv- + -iérades → tener (to have), imperfect subjunctive (-ra form), you (vos), after 'porque' meaning 'so that'. Irregular stem tuv-: tuviera, tuvieras, tuviera, tuviéramos, tuvierais, tuvieran; Cervantes' old ending for the 'vos/vosotros' form is -ades, so 'tuviérades' = modern 'tuvierais'."}
          - {w: "buena", f: "buen- + -a → bueno (good), feminine to match 'la'."}
      - es: "que yo sacara del monesterio, donde, sin duda alguna, debe de estar contra su voluntad, a Leandra, a pesar de la abadesa y de cuantos quisieran estorbarlo, y os la pusiera en vuestras manos, para que hiciérades della a toda vuestra voluntad y talante, guardando, pero, las leyes de la caballería, que mandan que a ninguna doncella se le sea fecho desaguisado alguno;"
        literal: "for I would-take-out from-the convent, where, without doubt any, she-must be against her will, Leandra, in-spite of the abbess and of as-many-as might-want to-hinder-it, and to-you her I-would-put in your hands, so-that you-might-do with-her at all your will and pleasure, keeping, however, the laws of the chivalry, which command that to no damsel to-her be done wrong any;"
        ormsby: "and would rescue Leandra from that convent (where no doubt she is kept against her will), in spite of the abbess and all who might try to prevent me, and would place her in your hands to deal with her according to your will and pleasure, observing, however, the laws of chivalry which lay down that no violence of any kind is to be offered to any damsel."
        vocab:
          - {w: "que", d: "here 'for, I mean', continuing the promise"}
          - {w: "monesterio", d: "= monasterio (old spelling); here a convent of nuns"}
          - {w: "deber de", d: "must (probability): 'debe de estar' = she must be"}
          - {w: "a pesar de", d: "in spite of"}
          - {w: "abadesa", d: "abbess, the head of a convent"}
          - {w: "cuantos", d: "all those who, as many as"}
          - {w: "estorbar", d: "to hinder, prevent"}
          - {w: "della", d: "= de ella, of her, with her"}
          - {w: "a toda vuestra voluntad y talante", d: "just as you please; 'talante' = mood, will, pleasure"}
          - {w: "pero", d: "placed after the verb, 'however' (old use); modern 'sin embargo'"}
          - {w: "doncella", d: "maiden, damsel"}
          - {w: "fecho", d: "= hecho, done (old form with f-, the language of the chivalry books)"}
          - {w: "desaguisado", d: "wrong, outrage, injury; a chivalric word"}
        diagram:
          - s: "que yo sacara del monesterio"
            r: "main verb 1 (going on from 'me pusiera en camino'): for I would take out of the convent"
            under:
              - {s: "donde, sin duda alguna, debe de estar contra su voluntad", r: "describes 'monesterio': where she must surely be against her will"}
              - {s: "a Leandra", r: "object: Leandra"}
              - {s: "a pesar de la abadesa y de cuantos quisieran estorbarlo", r: "in spite of whom: the abbess and anyone who tried to stop it"}
          - s: "y os la pusiera en vuestras manos"
            r: "main verb 2: and I would put her in your hands"
            under:
              - {s: "para que hiciérades della a toda vuestra voluntad y talante", r: "purpose: so you could do with her as you pleased"}
              - s: "guardando, pero, las leyes de la caballería"
                r: "how: still keeping, however, the laws of chivalry"
                under:
                  - {s: "que mandan que a ninguna doncella se le sea fecho desaguisado alguno", r: "describes 'leyes': which command that no wrong be done to any maiden"}
        forms:
          - {w: "sacara", f: "sac- + -ara → sacar (to take out), imperfect subjunctive (-ra form), I, used as a conditional: 'I would take out'. The -ra imperfect subjunctive of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran."}
          - {w: "debe de estar", f: "deb- + -e → deber (must), present, she: debo, debes, debe, debemos, debéis, deben; + de + estar (to be): 'deber de' marks a guess, 'she must be'."}
          - {w: "a Leandra", f: "'a' before a person who is the object of the verb (the personal 'a'); English has nothing for it."}
          - {w: "quisieran", f: "quis- + -ieran → querer (to want), imperfect subjunctive (-ra form), they: 'might want'. Irregular stem quis-: quisiera, quisieras, quisiera, quisiéramos, quisierais, quisieran."}
          - {w: "estorbarlo", f: "estorbar (to hinder) + lo (it), the pronoun hung on the infinitive."}
          - {w: "os la pusiera", f: "pus- + -iera → poner (to put), imperfect subjunctive (-ra form) used as a conditional, I, with 'os' (to you) and 'la' (her) before it. Irregular stem pus-: pusiera, pusieras, pusiera, pusiéramos, pusierais, pusieran."}
          - {w: "vuestras", f: "vuestr- + -as → vuestro (your), feminine plural to match 'manos', not the owner."}
          - {w: "hiciérades", f: "hic- + -iérades → hacer (to do), imperfect subjunctive (-ra form), you (vos), after 'para que'. Irregular stem hic-: hiciera, hicieras, hiciera, hiciéramos, hicierais, hicieran; Cervantes' old ending -ades for the 'vos/vosotros' form, so 'hiciérades' = modern 'hicierais'."}
          - {w: "della", f: "de + ella, 'of her', run together in the old spelling."}
          - {w: "guardando", f: "guard- + -ando → guardar (to keep, observe), gerund: 'keeping'."}
          - {w: "mandan", f: "mand- + -an → mandar (to command), present, they (the laws). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "se le sea fecho", f: "sea, from ser (to be), present subjunctive, it, + fecho, the old form of hecho, participle of hacer (to do): passive 'be done', subjunctive because it follows 'mandan que' (command that). ser (to be) in the present subjunctive: sea, seas, sea, seamos, seáis, sean. 'le' (to her) repeats 'a ninguna doncella'; the 'se' is redundant."}
          - {w: "ninguna, alguno", f: "ningun- + -a → ninguno (no), feminine to match 'doncella'; 'alguno' after the noun in a negative sentence means 'any at all': 'no wrong whatever'. Spanish keeps both negatives."}
        note: "Leandra's own father put her in the convent, so the 'rescue' would be both kidnapping and sacrilege; Don Quijote's only scruple is the knightly rule that no damsel may be wronged. Breaking into a convent to carry off a woman was a well-known crime in plays of the period."
      - es: "aunque yo espero en Dios Nuestro Señor que no ha de poder tanto la fuerza de un encantador malicioso, que no pueda más la de otro encantador mejor intencionado, y para entonces os prometo mi favor y ayuda, como me obliga mi profesión, que no es otra si no es favorecer a los desvalidos y menesterosos."
        literal: "although I hope in God Our Lord that not has to be-able so-much the force of an enchanter malicious, that not may-be-able more that of another enchanter better intentioned, and for then to-you I-promise my favor and help, as me obliges my profession, which not is other if not it-is to-favor the helpless and needy."
        ormsby: "But I trust in God our Lord that the might of one malignant enchanter may not prove so great but that the power of another better disposed may prove superior to it, and then I promise you my support and assistance, as I am bound to do by my profession, which is none other than to give aid to the weak and needy.”"
        vocab:
          - {w: "esperar en", d: "to trust in, put one's hope in"}
          - {w: "haber de", d: "+ infinitive: will, is going to, must"}
          - {w: "poder tanto", d: "to be so powerful, prevail so much; 'poder más' = to be stronger, prevail"}
          - {w: "encantador", d: "enchanter: Don Quijote believes an enchanter has shut him in the cage on the ox-cart"}
          - {w: "malicioso", d: "malicious, malignant"}
          - {w: "mejor intencionado", d: "better-disposed, more kindly"}
          - {w: "para entonces", d: "for that time, when that happens"}
          - {w: "favor y ayuda", d: "support and help, a formula"}
          - {w: "profesión", d: "calling, vow: knighthood seen as an order one 'professes', like a monk"}
          - {w: "si no es", d: "except, other than"}
          - {w: "desvalido", d: "helpless, unprotected"}
          - {w: "menesteroso", d: "needy"}
        diagram:
          - s: "yo espero en Dios Nuestro Señor"
            r: "main verb 1 (after 'aunque', although): I trust in God our Lord"
            under:
              - s: "que no ha de poder tanto la fuerza de un encantador malicioso"
                r: "what I trust: that a malicious enchanter's power will not be so great"
                under:
                  - {s: "que no pueda más la de otro encantador mejor intencionado", r: "result: that a better-disposed enchanter's power cannot overcome it"}
          - s: "os prometo mi favor y ayuda"
            r: "main verb 2 (after 'y'): I promise you my support and help"
            under:
              - {s: "para entonces", r: "when: for that time"}
              - s: "como me obliga mi profesión"
                r: "how: as my calling obliges me"
                under:
                  - {s: "que no es otra si no es favorecer a los desvalidos y menesterosos", r: "describes 'profesión': which is nothing but helping the helpless and needy"}
        forms:
          - {w: "espero", f: "esper- + -o → esperar (to hope, trust), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "ha de poder", f: "ha, from haber (to have), present, it: he, has, ha, hemos, habéis, han; + de + poder (to be able): 'haber de' + infinitive means 'will, is going to', so 'will not be so strong'."}
          - {w: "pueda", f: "pued- + -a → poder (to be able), present subjunctive, it. The o of the stem becomes ue when stressed: pueda, puedas, pueda, podamos, podáis, puedan. Subjunctive in the result clause after 'no ... tanto ... que no'."}
          - {w: "la de otro", f: "'la' stands for 'la fuerza': 'that of another (enchanter)'."}
          - {w: "intencionado", f: "intencion- + -ado → intencionado (intentioned), adjective from 'intención', masculine to match 'encantador'."}
          - {w: "prometo", f: "promet- + -o → prometer (to promise), present, I. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "obliga", f: "oblig- + -a → obligar (to oblige), present, it (my calling). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son. The infinitive 'favorecer' (to help) is the thing it 'is'."}
          - {w: "a los desvalidos", f: "personal 'a' before people as the object of 'favorecer'; 'desvalidos' and 'menesterosos' are adjectives used as plural nouns, 'the helpless'."}
  - sentences:
      - es: "Miróle el cabrero, y, como vio a don Quijote de tan mal pelaje y catadura, admiróse y preguntó al barbero, que cerca de sí tenía:"
        literal: "Looked-at-him the goatherd, and, as he-saw Don Quijote of so bad coat and look, wondered-himself and asked to-the barber, whom near of himself he-had:"
        ormsby: "The goatherd eyed him, and noticing Don Quixote’s sorry appearance and looks, he was filled with wonder, and asked the barber, who was next him,"
        vocab:
          - {w: "pelaje", d: "an animal's coat; of a person, sorry appearance, look (scornful)"}
          - {w: "catadura", d: "look, mien, face"}
          - {w: "admirarse", d: "to be amazed, wonder (not 'to admire')"}
          - {w: "barbero", d: "the barber, Maese Nicolás, Don Quijote's neighbour, travelling with the priest"}
          - {w: "tener cerca de sí", d: "to have next to oneself, be sitting by"}
        diagram:
          - s: "Miróle el cabrero"
            r: "main verb 1: the goatherd looked at him"
          - s: "admiróse"
            r: "main verb 2: he was amazed"
            under:
