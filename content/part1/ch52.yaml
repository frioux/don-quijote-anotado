              - {s: "la alta Mancha", r: "subject: lofty La Mancha"}
        forms:
          - {w: "se precia", f: "preci- + -a → preciarse (to pride oneself), present, it (Gaul, then La Mancha), with 'se'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "cuyos bravos", f: "cuy- + -os → cuyo (whose), masculine plural to match 'descendientes' (the thing owned, not the owner); brav- + -os → bravo (brave), the same."}
          - {w: "triunfó", f: "triunf- + -ó → triunfar (to triumph), preterite, it (Greece). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "ensancha", f: "ensanch- + -a → ensanchar (to spread), present, it (Greece). Same -ar present."}
          - {w: "a Quijote le corona", f: "coron- + -a → coronar (to crown), present, it (the hall); 'a Quijote' with the personal 'a', doubled by the pronoun 'le'."}
