        literal: "—answered Juana Panza, for so herself called the wife of Sancho, although not they-were relatives, but because itself is-the-custom in La Mancha to-take the wives the surname of their husbands."
        ormsby: "returned Teresa Panza, for so Sancho’s wife was called, though they were not relations, for in La Mancha it is customary for wives to take their husbands’ surnames."
        vocab:
          - {w: "pariente", d: "relative, kinsman"}
          - {w: "usarse", d: "to be the custom ('se usa' = it is customary)"}
          - {w: "apellido", d: "surname, family name (false friend: not 'appellation')"}
        diagram:
          - s: "respondió Juana Panza"
            r: "main verb (speech tag): answered Juana Panza"
            under:
              - s: "que así se llamaba la mujer de Sancho"
                r: "explanation: for that was the name of Sancho's wife"
                under:
                  - {s: "aunque no eran parientes", r: "concession: although they were not related"}
                  - s: "sino porque se usa en la Mancha"
                    r: "real reason: but because it is the custom in La Mancha"
                    under:
                      - {s: "tomar las mujeres el apellido de sus maridos", r: "what is the custom: for wives to take their husbands' surname"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, she. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "se llamaba", f: "llam- + -aba → llamarse (to be called), imperfect, she, with 'se'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "eran", f: "ser (to be), imperfect, they. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "se usa", f: "us- + -a → usarse (to be customary), present, it, with impersonal 'se'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "tomar las mujeres", f: "infinitive tomar (to take) with its own subject after it, 'las mujeres': 'for women to take'. Spanish allows an infinitive to carry a stated subject in this way."}
          - {w: "sus", f: "plural to match 'maridos', not the owner; 'their husbands'."}
        note: "Here she is Juana Panza; elsewhere Cervantes calls Sancho's wife Juana Gutiérrez and Mari Gutiérrez (Chapter 7), and Ormsby, following later usage, calls her Teresa here. The inconsistency seems to be Cervantes' own."
  - sentences:
