          - {w: "alguna", f: "algun- + -a → alguno (some, any), feminine to match 'cosa'; after the noun in a negative sentence it means 'not any'."}
          - {w: "alcanzara, supiera, deparara", f: "alcanz- + -ara → alcanzar (to attain), sup- + -iera → saber (to know), depar- + -ara → deparar (to provide), imperfect subjunctive (-ra form), he / it. The -ra form of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran; saber (to know) builds it on the preterite stem: supiera, supieras, supiera, supiéramos, supierais, supieran. Here the -ra form does the work of the pluperfect: 'would have attained, would have known' in the result, 'had provided' in the 'si' clause; modern Spanish 'no la habría alcanzado si no le hubiera deparado'."}
          - {w: "la", f: "'it', feminine, standing for 'cosa alguna' (anything about his end)."}
