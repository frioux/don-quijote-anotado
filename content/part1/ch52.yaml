          - {w: "haría", f: "har- + -ía → hacer (to do), conditional, he. Irregular stem har-: haría, harías, haría, haríamos, haríais, harían."}
          - {w: "decía", f: "dec- + -ía → decir (to say), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "habiendo recebido", f: "habiendo, gerund of haber (to have), + recebido, participle of recebir (= recibir, to receive): 'having received'."}
