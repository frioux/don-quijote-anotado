        vocab:
          - {w: "tenerse noticia", d: "to be known, be reported; 'tiénese noticia' = word has it"}
          - {w: "a costa de", d: "at the cost of"}
          - {w: "vigilias", d: "sleepless nights, nights of study"}
          - {w: "sacar a luz", d: "to bring to light, publish"}
          - {w: "salida", d: "sally, expedition"}
        diagram:
          - s: "Tiénese noticia"
            r: "main verb: it is reported"
            under:
              - s: "que lo ha hecho"
                r: "what is reported, 1: that he has done it"
                under:
                  - {s: "a costa de muchas vigilias y mucho trabajo", r: "how: at the cost of many sleepless nights and much work"}
              - s: "y que tiene intención de sacallos a luz"
                r: "what is reported, 2: and that he intends to publish them"
                under:
                  - {s: "con esperanza de la tercera salida de don Quijote", r: "how: in hope of Don Quijote's third sally"}
        forms:
          - {w: "Tiénese", f: "tien- + -e + se → tener (to have), present, it, with 'se' stuck on the end (impersonal: 'one has'); modern 'se tiene'. tener (to have) in the present: tengo, tienes, tiene, tenemos, tenéis, tienen. Cervantes hangs the pronoun on a verb that opens the sentence."}
          - {w: "ha hecho", f: "ha (from haber, to have, present, he) + hecho, irregular participle of hacer (to do): 'he has done'. haber (to have) in the present: he, has, ha, hemos, habéis, han."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, he. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "sacallos", f: "sacar (to bring out) + los (them, the verses), with -rl- turned into -ll-: old form of 'sacarlos'."}
          - {w: "muchas, mucho", f: "much- + -as → mucho (many), feminine plural to match 'vigilias'; 'mucho' masculine singular to match 'trabajo'."}
        note: "The 'third sally' is the hook for a sequel; the 'esperanza' can be read as the scholar's hope to publish once Don Quijote sets out again, or the reader's hope of a third sally."
