  - sentences:
      - es: "El cura fue conocido de otro cura que en la procesión venía, cuyo conocimiento puso en sosiego el concebido temor de los dos escuadrones."
        literal: "The priest was known by another priest who in the procession was-coming, which recognition put in calm the conceived fear of the two squadrons."
        ormsby: "The curate was known to another curate who walked in the procession, and their recognition of one another set at rest the apprehensions of both parties;"
        vocab:
          - {w: "ser conocido de", d: "to be recognized by, known to"}
          - {w: "conocimiento", d: "recognition, acquaintance"}
          - {w: "poner en sosiego", d: "to calm, set at rest"}
          - {w: "concebir", d: "to conceive, form (a fear, an idea)"}
          - {w: "escuadrón", d: "squadron: mock-military word for the two groups"}
        diagram:
          - s: "El cura fue conocido de otro cura"
            r: "main verb: the priest was recognized by another priest"
            under:
              - {s: "que en la procesión venía", r: "describes 'otro cura': who was coming in the procession"}
              - s: "cuyo conocimiento puso en sosiego el concebido temor de los dos escuadrones"
                r: "result: which recognition calmed the fear the two squadrons had formed"
        forms:
          - {w: "fue conocido", f: "fue, from ser (to be), preterite, he: fui, fuiste, fue, fuimos, fuisteis, fueron; + conocido, participle of conocer (to know, recognize): passive 'was recognized'. 'de' marks the agent, where modern Spanish uses 'por'."}
          - {w: "venía", f: "ven- + -ía → venir (to come), imperfect, he. The imperfect of -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "cuyo", f: "cuy- + -o → cuyo (whose, which), masculine to match 'conocimiento'; links back to the whole recognition."}
          - {w: "puso", f: "pus- + -o → poner (to put), preterite, it. Irregular: puse, pusiste, puso, pusimos, pusisteis, pusieron."}
          - {w: "concebido", f: "participle of concebir (to conceive), masculine to match 'temor', placed before the noun."}
      - es: "El primer cura dio al segundo, en dos razones, cuenta de quién era don Quijote, y así él como toda la turba de los diciplinantes fueron a ver si estaba muerto el pobre caballero, y oyeron que Sancho Panza, con lágrimas en los ojos, decía:"
        literal: "The first priest gave to-the second, in two words, account of who was Don Quijote, and so he as all the crowd of the flagellants went to see if was dead the poor knight, and they-heard that Sancho Panza, with tears in the eyes, was-saying:"
        ormsby: "the first then told the other in two words who Don Quixote was, and he and the whole troop of penitents went to see if the poor gentleman was dead, and heard Sancho Panza saying, with tears in his eyes,"
        vocab:
          - {w: "dar cuenta de", d: "to give an account of, explain"}
          - {w: "en dos razones", d: "in a few words ('razones' = words, remarks)"}
          - {w: "así ... como", d: "both ... and"}
          - {w: "turba", d: "crowd, throng"}
