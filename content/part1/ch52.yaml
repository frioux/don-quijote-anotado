          - {w: "venir corriendo", f: "venir (to come), infinitive after 'vieron', + corriendo, gerund of correr (to run): 'come running'."}
          - {w: "sus", f: "sus = plural to match 'ballestas', not the owner; 'their crossbows'."}
          - {w: "temieron", f: "tem- + -ieron → temer (to fear), preterite, they. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun ('suceso')."}
          - {w: "hiciéronse", f: "hic- + -ieron + se → hacerse (to make themselves into), preterite, they, with 'se' stuck on the end; modern 'se hicieron'. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron. Cervantes hangs the pronoun on a verb that opens its clause."}
      - es: "y, alzados los capirotes, empuñando las diciplinas, y los clérigos los ciriales, esperaban el asalto con determinación de defenderse, y aun ofender, si pudiesen, a sus acometedores;"
        literal: "and, raised the hoods, gripping the scourges, and the clergymen the processional-candlesticks, they-were-awaiting the assault with determination of defending-themselves, and even attacking, if they-could, to their attackers;"
        ormsby: "raised their hoods, and grasped their scourges, as the priests did their tapers, and awaited the attack, resolved to defend themselves and even to take the offensive against their assailants if they could."
