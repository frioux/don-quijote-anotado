      - es: "Mas, lo que detuvo al villano no fueron las voces de Sancho, sino el ver que don Quijote no bullía pie ni mano; y así, creyendo que le había muerto, con priesa se alzó la túnica a la cinta, y dio a huir por la campaña como un gamo."
        literal: "But, that which stopped to-the peasant not were the shouts of Sancho, but the seeing that Don Quijote not was-stirring foot nor hand; and so, believing that him he-had killed, with haste he-raised-for-himself the tunic to the waist, and gave to flee through the countryside like a deer."
        ormsby: "but what checked the clown was, not Sancho’s shouting, but seeing that Don Quixote did not stir hand or foot; and so, fancying he had killed him, he hastily hitched up his tunic under his girdle and took to his heels across the country like a deer."
