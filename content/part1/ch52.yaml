          - {w: "andan", f: "and- + -an → andar (to go, to be), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
        note: "The joke cuts both ways: he asks to be believed exactly as much as sensible people believe the romances of chivalry, that is, not at all, while admitting that many sensible people do believe them."
