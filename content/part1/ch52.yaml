  - sentences:
      - es: "— Sois un grandísimo bellaco —dijo a esta sazón don Quijote—; y vos sois el vacío y el menguado, que yo estoy más lleno que jamás lo estuvo la muy hideputa puta que os parió."
        literal: "— You-are a very-great scoundrel —said at this moment Don Quijote—; and you are the empty-one and the witless-one, for I am more full than ever it was the very whoreson whore who you bore."
        ormsby: "“You are a great scoundrel,” said Don Quixote, “and it is you who are empty and a fool. I am fuller than ever was the whoreson bitch that bore you;”"
        vocab:
          - {w: "bellaco", d: "scoundrel, rogue"}
          - {w: "a esta sazón", d: "at this moment, just then"}
          - {w: "menguado", d: "witless, lacking, a fool (from 'menguar', to diminish)"}
          - {w: "lleno", d: "full; he turns the goatherd's 'empty rooms' around"}
          - {w: "hideputa", d: "= hijo de puta, son of a whore, here used as an adjective, 'whoreson'"}
          - {w: "parir", d: "to give birth to, bear"}
        diagram:
          - s: "Sois un grandísimo bellaco"
            r: "main verb 1: you are a very great scoundrel"
            under:
              - {s: "dijo a esta sazón don Quijote", r: "speech tag: said Don Quijote at this moment"}
          - s: "y vos sois el vacío y el menguado"
            r: "main verb 2: and you are the empty one and the witless one"
            under:
              - s: "que yo estoy más lleno"
                r: "why: for I am fuller"
                under:
                  - s: "que jamás lo estuvo la muy hideputa puta"
                    r: "comparison: than ever the whoreson whore was"
                    under:
                      - {s: "que os parió", r: "describes 'puta': who bore you"}
        forms:
          - {w: "Sois, sois", f: "ser (to be), present, you (vos): soy, eres, es, somos, sois, son. 'sois', the 'vosotros' form, is also the form for 'vos' addressed to one person, here as an insult to an inferior."}
          - {w: "grandísimo", f: "grand- + -ísimo → grande (great) with the superlative suffix -ísimo: 'very great, utter'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "estoy", f: "estar (to be), present, I. estoy, estás, está, estamos, estáis, están."}
          - {w: "lo estuvo", f: "estuv- + -o → estar (to be), preterite, she. Irregular stem estuv-: estuve, estuviste, estuvo, estuvimos, estuvisteis, estuvieron. 'lo' stands for 'lleno': 'than she ever was (full)'."}
          - {w: "parió", f: "par- + -ió → parir (to give birth), preterite, she. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "os", f: "'you' (object of the verb), the object pronoun that goes with 'vos'."}
        note: "Don Quijote, who elsewhere speaks like a courtly book, explodes into the coarsest street insult of the language. The goatherd's 'empty rooms in the head' and the knight's 'full' play on the same image."
