      - es: "Cosa de lástima fue oír los gritos que las dos buenas señoras alzaron, las bofetadas que se dieron, las maldiciones que de nuevo echaron a los malditos libros de caballerías; todo lo cual se renovó cuando vieron entrar a don Quijote por sus puertas."
        literal: "Thing of pity it-was to-hear the cries that the two good ladies raised, the slaps that to-themselves they-gave, the curses that anew they-threw at the cursed books of chivalries; all that which itself renewed when they-saw enter Don Quijote through their doors."
        ormsby: "It was piteous to hear the cries the two good ladies raised, how they beat their breasts and poured out fresh maledictions on those accursed books of chivalry; all which was renewed when they saw Don Quixote coming in at the gate."
        vocab:
          - {w: "cosa de lástima", d: "a pitiful thing, a pity"}
          - {w: "bofetada", d: "slap in the face; 'darse bofetadas' = to slap one's own face, a gesture of grief"}
          - {w: "maldición", d: "curse"}
          - {w: "de nuevo", d: "again, anew"}
          - {w: "echar maldiciones", d: "to hurl curses"}
          - {w: "renovarse", d: "to start again, be renewed"}
