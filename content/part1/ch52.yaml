      - es: "El cual autor no pide a los que la leyeren, en premio del inmenso trabajo que le costó inquerir y buscar todos los archivos manchegos, por sacarla a luz, sino que le den el mesmo crédito que suelen dar los discretos a los libros de caballerías, que tan validos andan en el mundo;"
        literal: "The which author not asks to those who it may-read, in reward of-the immense labor that him cost to-inquire and search all the archives of-La-Mancha, to bring-it to light, but that to-him they-give the same credit that are-wont to-give the sensible-ones to the books of chivalry, which so esteemed go in the world;"
        ormsby: "And the said author asks of those that shall read it nothing in return for the vast toil which it has cost him in examining and searching the Manchegan archives in order to bring it to light, save that they give him the same credit that people of sense give to the books of chivalry that pervade the world and are so popular;"
        ormsby_note: "One of his grievances against the books of chivalry being that they led astray not merely the silly, thoughtless, and uncritical, but vast numbers of people who ought to know better."
        vocab:
          - {w: "el cual autor", d: "'which author', i.e. this author; 'el cual' used like an adjective before a repeated noun"}
          - {w: "premio", d: "reward, prize"}
          - {w: "inquerir", d: "= inquirir, to inquire into, investigate (old form)"}
          - {w: "archivos", d: "archives, collections of records"}
          - {w: "manchego", d: "of La Mancha"}
          - {w: "sacar a luz", d: "to bring to light; also 'to publish'"}
          - {w: "mesmo", d: "= mismo, same (old form)"}
          - {w: "crédito", d: "credence, belief; 'dar crédito' = to believe"}
          - {w: "los discretos", d: "sensible, intelligent people (false friend: not 'discreet')"}
          - {w: "valido", d: "esteemed, in favor, popular (not 'válido', valid)"}
          - {w: "andar", d: "here 'to be', with a sense of going about: 'tan validos andan' = are so popular"}
        diagram:
          - s: "El cual autor no pide"
            r: "main verb: this author does not ask"
            under:
              - {s: "a los que la leyeren", r: "of whom: of those who read it"}
