  - sentences:
      - es: "— Gracias sean dadas a Dios —replicó ella—, que tanto bien me ha hecho; pero contadme agora, amigo: ¿qué bien habéis sacado de vuestras escuderías?, ¿qué saboyana me traes a mí?, ¿qué zapaticos a vuestros hijos?"
        literal: "— Thanks be given to God —replied she—, who so-much good to-me has done; but tell-me now, friend: what good have-you got from your squireships?, what skirt to-me you-bring to me?, what little-shoes to your children?"
        ormsby: "“Thanks be to God,” said she, “for being so good to me; but now tell me, my friend, what have you made by your squirings? What gown have you brought me back? What shoes for your children?”"
        vocab:
          - {w: "gracias sean dadas a Dios", d: "thanks be to God (a set formula)"}
          - {w: "agora", d: "= ahora, now (old form)"}
          - {w: "sacar", d: "here 'to get out of, gain from'"}
          - {w: "escudería", d: "squireship, service as a squire (a coinage of hers)"}
          - {w: "saboyana", d: "a kind of open skirt or overgown worn by women, 'Savoy-style'"}
          - {w: "zapaticos", d: "little shoes; '-ico' is a diminutive typical of the Aragon/La Mancha region, modern 'zapatitos'"}
        diagram:
          - s: "Gracias sean dadas a Dios"
            r: "main verb 1: thanks be given to God"
            under:
              - {s: "que tanto bien me ha hecho", r: "describes 'Dios': who has done me so much good"}
          - {s: "replicó ella", r: "speech tag: she replied"}
          - s: "pero contadme agora"
            r: "main verb 2: but tell me now"
            under:
              - {s: "amigo", r: "address: friend (to her husband)"}
              - {s: "¿qué bien habéis sacado de vuestras escuderías?", r: "what to tell, 1: what good have you got from your squiring?"}
              - {s: "¿qué saboyana me traes a mí?", r: "what to tell, 2: what skirt are you bringing me?"}
              - {s: "¿qué zapaticos a vuestros hijos?", r: "what to tell, 3: what shoes for your children? (verb 'traes' understood)"}
        forms:
          - {w: "sean dadas", f: "sean, from ser (to be), present subjunctive, they: sea, seas, sea, seamos, seáis, sean; + dadas, participle of dar (to give), feminine plural to match 'gracias': a passive wish, 'may thanks be given'."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "ha hecho", f: "ha (from haber, to have, present, he: he, has, ha, hemos, habéis, han) + hecho, irregular participle of hacer (to do): the perfect, 'has done'."}
          - {w: "contadme", f: "contad + me → contar (to tell), imperative, you (vosotros form, used here as the polite 'vos' to her husband), + me: 'tell me'. The vosotros imperative swaps the final -r for -d: contad, comed, vivid."}
          - {w: "habéis sacado", f: "habéis (from haber, to have, present, you, vos/vosotros form: he, has, ha, hemos, habéis, han) + sacado, participle of sacar (to get): 'have you got'."}
          - {w: "traes", f: "tra- + -es → traer (to bring), present, you (tú). Irregular: traigo, traes, trae, traemos, traéis, traen. She slips from 'vos' (habéis, vuestras) to 'tú' (traes) in the same breath, as Sancho and his wife do throughout."}
          - {w: "zapaticos", f: "zapat- + -icos → zapato (shoe) with the diminutive -ico, plural."}
        note: "A peasant wife's idea of the rewards of service: a new skirt for her and shoes for the children. The mixture of 'vos' and 'tú' is typical of married village couples in Cervantes."
