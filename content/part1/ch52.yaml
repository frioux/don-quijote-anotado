  - sentences:
      - es: "LOS ACADÉMICOS DE LA ARGAMASILLA, LUGAR DE LA MANCHA, EN VIDA Y MUERTE DEL VALEROSO DON QUIJOTE DE LA MANCHA,"
        literal: "THE ACADEMICIANS OF THE ARGAMASILLA, VILLAGE OF LA MANCHA, ON [THE] LIFE AND DEATH OF-THE VALIANT DON QUIJOTE OF LA MANCHA,"
        ormsby: "The Academicians of Argamasilla, a Village of La Mancha, on the Life and Death of Don Quixote of La Mancha,"
        ormsby_note: "Whether or not this is to be held an indication of some grudge on the part of Cervantes against the authorities of the town, it is, at any rate, conclusive that Don Quixote's village, \"the name of which he did not care to call to mind,\" was Argamasilla. Monicongo may be translated \"mannikin\"; Paniaguado is a sort of parasite hanging about the house of a patron for such scraps as he can pick up; Burlador means a joker, and cachidiablo a hobgoblin. Except, perhaps, in the sonnet on Sancho Panza, there is not much drollery or humor in these verses, but it would not be fair to criticise them severely, as they are obviously nothing more than a mere outburst of reckless nonsense to finish off with; a sort of flourish or rubrica like that commonly appended to a Spanish signature."
        vocab:
          - {w: "académico", d: "member of an academy, a literary society"}
          - {w: "la Argamasilla", d: "Argamasilla de Alba, a small town in La Mancha; the article 'la' was often used with this place-name"}
          - {w: "lugar", d: "village, small town (not just 'place')"}
          - {w: "en", d: "here 'on, about' (the subject of the poems)"}
          - {w: "valeroso", d: "valiant, brave"}
        diagram:
          - s: "LOS ACADÉMICOS DE LA ARGAMASILLA"
            r: "heading: the subject of 'scripserunt' (wrote) in the next line"
            under:
              - {s: "LUGAR DE LA MANCHA", r: "describes 'ARGAMASILLA': a village of La Mancha"}
              - {s: "EN VIDA Y MUERTE DEL VALEROSO DON QUIJOTE DE LA MANCHA", r: "on what: on the life and death of the valiant Don Quijote"}
        forms:
          - {w: "ACADÉMICOS", f: "académic- + -os → académico (academician), masculine plural."}
          - {w: "DEL VALEROSO", f: "del = de + el; valer- + -oso → valeroso (valiant), from valor with the adjective suffix -oso ('full of')."}
        note: "Literary academies, clubs where poets read verses under fanciful pen-names, were fashionable in Spain around 1600, and romances of chivalry and other books opened or closed with commendatory poems. Here a village academy of nonsense poets closes the book, and the place names Don Quijote's unnamed village almost outright."
