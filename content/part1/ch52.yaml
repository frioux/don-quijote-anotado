  - sentences:
      - es: "Sancho Panza es asqueste, en cuerpo chico, Pero grande en valor: ¡milagro extraño!"
        literal: "Sancho Panza is this-one, in body small, But great in valor: miracle strange!"
        ormsby: "The worthy Sancho Panza here you see; / A great soul once was in that body small,"
        ormsby_match: false
        vocab:
          - {w: "asqueste", d: "the Gutenberg reading; modern editions print 'es aquéste', 'is this one', so 'es asqueste' is most likely a misprint for 'es aquéste' (aqueste = este, old form)"}
          - {w: "chico", d: "small"}
          - {w: "valor", d: "valor, courage; also worth"}
          - {w: "milagro extraño", d: "a strange miracle, a wonder"}
