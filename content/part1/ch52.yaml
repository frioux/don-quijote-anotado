          - {w: "zuzar", d: "= azuzar, to egg on, set (dogs) on, 'sic them'"}
          - {w: "los unos y los otros", d: "both parties, everyone on both sides"}
          - {w: "pendencia", d: "fight, brawl, quarrel (the word in the chapter title)"}
