  - sentences:
      - es: "— Hermano demonio, que no es posible que dejes de serlo, pues has tenido valor y fuerzas para sujetar las mías, ruégote que hagamos treguas, no más de por una hora;"
        literal: "— Brother devil, for not it-is possible that you-cease of being-it, since you-have had valor and strength to subdue the mine, I-beg-you that we-make truces, no more than for one hour;"
        ormsby: "“Brother devil (for it is impossible but that thou must be one since thou hast had might and strength enough to overcome mine), I ask thee to agree to a truce for but one hour"
        vocab:
          - {w: "dejar de", d: "to stop, cease (being or doing)"}
          - {w: "sujetar", d: "to subdue, overpower, hold down"}
          - {w: "rogar", d: "to beg, ask"}
          - {w: "treguas", d: "truce (the plural is the old usage)"}
          - {w: "no más de", d: "only, no more than"}
        diagram:
          - s: "ruégote"
            r: "main verb: I beg you"
            under:
              - {s: "Hermano demonio", r: "address: brother devil"}
              - s: "que no es posible que dejes de serlo"
                r: "aside: for you cannot be anything else"
                under:
                  - {s: "pues has tenido valor y fuerzas para sujetar las mías", r: "why: since you had the courage and strength to overpower mine"}
              - s: "que hagamos treguas"
                r: "what I beg: that we make a truce"
                under:
                  - {s: "no más de por una hora", r: "how long: for one hour only"}
        forms:
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "dejes", f: "dej- + -es → dejar (to cease), present subjunctive, you (tú), after 'no es posible que'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. Don Quijote now calls the goatherd 'tú' instead of 'vos'."}
          - {w: "serlo", f: "ser (to be) + lo (it, i.e. a devil), the pronoun hung on the infinitive."}
          - {w: "has tenido", f: "has, from haber (to have), present, you (tú): he, has, ha, hemos, habéis, han; + tenido, the participle of tener (to have): the perfect, 'you have had'."}
          - {w: "las mías", f: "mí- + -as → mío (mine), feminine plural to match 'fuerzas': 'my (strength)'."}
          - {w: "ruégote", f: "rueg- + -o + te → rogar (to beg), present, I, with 'te' (you) stuck on the end; modern 'te ruego'. The o of the stem becomes ue when stressed: ruego, ruegas, ruega, rogamos, rogáis, ruegan. Cervantes hangs the pronoun on a verb that opens its clause."}
          - {w: "hagamos", f: "hag- + -amos → hacer (to make), present subjunctive, we, after 'ruego que'. Irregular: haga, hagas, haga, hagamos, hagáis, hagan."}
        note: "Don Quijote explains his defeat the only way his honour allows: a goatherd who can beat a knight must be a devil in disguise. He asks for a truce in proper chivalric form."
