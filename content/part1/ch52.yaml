        ormsby_match: false
        vocab:
          - {w: "con perdón se miente", d: "'saving your presence', 'if you'll pardon the word': the polite formula used before naming something low, such as a donkey; 'miente' is from 'mentar' (to mention), not 'mentir' (to lie)"}
          - {w: "manso", d: "meek, gentle, tame"}
          - {w: "tras", d: "behind, after"}
          - {w: "dueño", d: "master, owner"}
        diagram:
          - s: "Sobre él anduvo"
            r: "main verb: on it (the donkey) went"
            under:
              - {s: "(con perdón se miente)", r: "aside: if you'll pardon the mention"}
              - {s: "Este manso escudero", r: "subject: this meek squire"}
              - {s: "tras el manso Caballo Rocinante", r: "where: behind the meek horse Rocinante"}
              - {s: "y tras su dueño", r: "where, 2: and behind his master"}
        forms:
          - {w: "él", f: "'it', masculine, standing for 'un borrico' in the previous sentence."}
          - {w: "anduvo", f: "anduv- + -o → andar (to go), preterite, he. Irregular: anduve, anduviste, anduvo, anduvimos, anduvisteis, anduvieron."}
          - {w: "se miente", f: "mient- + -e → mentar (to mention), present, it, with 'se' making it impersonal: 'it is mentioned'. The stem e becomes ie when stressed: miento, mientas, mienta, mentamos, mentáis, mientan. Not to be confused with mentir (to lie)."}
          - {w: "Este manso", f: "este (this), mans- + -o → manso (meek), masculine to match 'escudero'."}
        note: "The repeated 'manso' (meek) for both squire and horse, and the apology for naming an ass in a sonnet, make the poem's mock-heroic point."
      - es: "¡Oh vanas esperanzas de la gente!"
        literal: "Oh vain hopes of the people!"
        ormsby: "Delusive hopes that lure the common herd"
        ormsby_match: false
        vocab:
          - {w: "vano", d: "vain, empty, useless"}
          - {w: "esperanzas", d: "hopes"}
          - {w: "la gente", d: "people, humankind"}
