        forms:
          - {w: "Acudieron", f: "acud- + -ieron → acudir (to come running), preterite, they. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "venía", f: "ven- + -ía → venir (to come), imperfect, it / he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían. With 'su tío y su señor', the singular verb shows that both titles are one man."}
          - {w: "conocieron", f: "conoc- + -ieron → conocer (to know, recognize), preterite, they. Same -ieron preterite."}
