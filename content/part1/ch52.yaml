                r: "subject: to hear the cries"
                under:
                  - {s: "que las dos buenas señoras alzaron", r: "describes 'gritos': that the two good ladies raised"}
              - {s: "las bofetadas que se dieron", r: "object of 'oír', 2: the slaps they gave themselves"}
              - {s: "las maldiciones que de nuevo echaron a los malditos libros de caballerías", r: "object of 'oír', 3: the curses they hurled again at the cursed books of chivalry"}
          - s: "todo lo cual se renovó"
            r: "main verb 2: all of which started again"
            under:
              - {s: "cuando vieron entrar a don Quijote por sus puertas", r: "when: when they saw Don Quijote come in at their door"}
        forms:
          - {w: "fue", f: "ser (to be), preterite, it. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "alzaron, echaron", f: "alz- + -aron → alzar (to raise) and ech- + -aron → echar (to throw), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "se dieron", f: "d- + -ieron → dar (to give), preterite, they, with 'se' (to themselves). Irregular: di, diste, dio, dimos, disteis, dieron."}
          - {w: "malditos", f: "irregular participle of maldecir (to curse), 'cursed', masculine plural to match 'libros'."}
          - {w: "todo lo cual", f: "'all of which', referring back to the whole scene of cries and curses."}
          - {w: "se renovó", f: "renov- + -ó → renovarse (to be renewed), preterite, it, with 'se'. Same -ar preterite."}
          - {w: "vieron", f: "v- + -ieron → ver (to see), preterite, they. ver in the preterite: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "entrar", f: "infinitive after 'vieron': 'saw (him) come in'; Spanish uses the infinitive after verbs of seeing."}
        note: "The housekeeper and niece burned his library before his second sally and have blamed the books for his madness from the start, so their curses are a well-worn routine."
  - sentences:
      - es: "A las nuevas desta venida de don Quijote, acudió la mujer de Sancho Panza, que ya había sabido que había ido con él sirviéndole de escudero, y, así como vio a Sancho, lo primero que le preguntó fue que si venía bueno el asno."
        literal: "At the news of-this coming of Don Quijote, came-running the wife of Sancho Panza, who already had known that he-had gone with him serving-him as squire, and, as soon as she-saw Sancho, the first that him she-asked was that if was-coming well the ass."
        ormsby: "At the news of Don Quixote’s arrival Sancho Panza’s wife came running, for she by this time knew that her husband had gone away with him as his squire, and on seeing Sancho, the first thing she asked him was if the ass was well."
        vocab:
          - {w: "desta", d: "= de esta, of this (old contraction)"}
          - {w: "venida", d: "arrival, coming"}
          - {w: "servir de", d: "to serve as"}
          - {w: "así como", d: "as soon as"}
          - {w: "venir bueno", d: "to come back in good health"}
        diagram:
          - s: "acudió la mujer de Sancho Panza"
            r: "main verb 1: Sancho Panza's wife came running"
            under:
              - {s: "A las nuevas desta venida de don Quijote", r: "why: at the news of Don Quijote's arrival"}
              - s: "que ya había sabido"
                r: "describes 'mujer': who already knew"
                under:
                  - {s: "que había ido con él sirviéndole de escudero", r: "what she knew: that he had gone with him as his squire"}
          - s: "lo primero"
            r: "subject of main verb 2 (after 'y'): the first thing"
            under:
              - {s: "así como vio a Sancho", r: "when: as soon as she saw Sancho"}
              - {s: "que le preguntó", r: "describes 'lo primero': that she asked him"}
              - {s: "fue", r: "main verb 2: was"}
              - {s: "que si venía bueno el asno", r: "what it was: whether the ass had come back well"}
        forms:
          - {w: "desta", f: "de + esta (this), feminine to match 'venida'; modern 'de esta'."}
          - {w: "acudió", f: "acud- + -ió → acudir (to come running), preterite, she. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "había sabido, había ido", f: "había (from haber, to have, imperfect, she / he: había, habías, había, habíamos, habíais, habían) + sabido, participle of saber (to know), and + ido, participle of ir (to go): the pluperfect, 'had known', 'had gone'."}
          - {w: "sirviéndole", f: "gerund of servir (to serve), e → i in the stem, + le (him), accent added: 'serving him'."}
          - {w: "vio", f: "v- + -io → ver (to see), preterite, she. ver in the preterite: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "preguntó", f: "pregunt- + -ó → preguntar (to ask), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "fue", f: "ser (to be), preterite, it. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "que si", f: "'que' before an indirect question repeats the 'asked' (that she asked whether); modern Spanish drops it."}
          - {w: "venía", f: "ven- + -ía → venir (to come), imperfect, it (the ass). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
        note: "Her first question is about the donkey, not her husband: a peasant joke, since the ass was the family's working capital. Sancho's ass was stolen and recovered earlier in Part I."
