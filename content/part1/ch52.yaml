  - sentences:
      - es: "— Deso recibo yo mucho gusto —respondió la mujer—; mostradme esas cosas de más consideración y más momento, amigo mío, que las quiero ver, para que se me alegre este corazón, que tan triste y descontento ha estado en todos los siglos de vuestra ausencia."
        literal: "— Of-that I-receive I much pleasure —answered the wife—; show-me those things of more consideration and more moment, friend mine, for them I-want to-see, so that itself to-me may-gladden this heart, which so sad and discontented has been in all the centuries of your absence."
        ormsby: "“I am very glad of that,” returned his wife; “show me these things of more value and consequence, my friend; for I want to see them to cheer my heart that has been so sad and heavy all these ages that you have been away.”"
        vocab:
          - {w: "recibir gusto de", d: "to be pleased at"}
          - {w: "alegrarse", d: "to be cheered, rejoice"}
          - {w: "descontento", d: "unhappy, dissatisfied"}
          - {w: "siglos", d: "centuries, i.e. ages (playful exaggeration for the months he was away)"}
        diagram:
          - s: "Deso recibo yo mucho gusto"
            r: "main verb 1: that pleases me greatly"
          - {s: "respondió la mujer", r: "speech tag: answered the wife"}
          - s: "mostradme esas cosas de más consideración y más momento"
            r: "main verb 2: show me those things of more value and weight"
            under:
              - {s: "amigo mío", r: "address: my friend"}
              - s: "que las quiero ver"
                r: "why: for I want to see them"
                under:
                  - s: "para que se me alegre este corazón"
                    r: "purpose: so that this heart of mine may be cheered"
                    under:
                      - {s: "que tan triste y descontento ha estado en todos los siglos de vuestra ausencia", r: "describes 'corazón': which has been so sad and unhappy all the ages you were away"}
        forms:
          - {w: "Deso", f: "de + eso (that); modern 'de eso'."}
          - {w: "recibo", f: "recib- + -o → recibir (to receive), present, I. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, she. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "mostradme", f: "mostrad + me → mostrar (to show), imperative, you (vos/vosotros form) + me: 'show me'. The vosotros imperative swaps the final -r for -d: mostrad, comed, vivid."}
          - {w: "esas", f: "ese (that), feminine plural to match 'cosas'."}
          - {w: "las quiero ver", f: "quier- + -o → querer (to want), present, I: quiero, quieres, quiere, queremos, queréis, quieren; + ver (to see), with 'las' (them, the things) placed before the whole group (modern Spanish also says 'quiero verlas')."}
          - {w: "se me alegre", f: "alegr- + -e → alegrarse (to be cheered), present subjunctive, it (the heart), with 'se' and 'me' (for me). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. Subjunctive after 'para que'."}
          - {w: "ha estado", f: "ha (from haber, to have, present, it: he, has, ha, hemos, habéis, han) + estado, participle of estar (to be): the perfect, 'has been'."}
          - {w: "triste y descontento", f: "masculine singular to match 'corazón'."}
  - sentences:
      - es: "— En casa os las mostraré, mujer —dijo Panza—, y por agora estad contenta, que, siendo Dios servido de que otra vez salgamos en viaje a buscar aventuras, vos me veréis presto conde o gobernador de una ínsula, y no de las de por ahí, sino la mejor que pueda hallarse."
        literal: "— In house to-you them I-will-show, wife —said Panza—, and for now be content, for, being God served of that another time we-go-out on journey to seek adventures, you me will-see soon count or governor of an isle, and not of those of around there, but the best that may be-found."
        ormsby: "“I will show them to you at home, wife,” said Sancho; “be content for the present; for if it please God that we should again go on our travels in search of adventures, you will soon see me a count, or governor of an island, and that not one of those everyday ones, but the best that is to be had.”"
        vocab:
          - {w: "por agora", d: "for now (agora = ahora)"}
          - {w: "siendo Dios servido", d: "God willing, if it please God (literally 'God being served')"}
          - {w: "presto", d: "soon, quickly"}
          - {w: "ínsula", d: "isle: the old, literary word for 'isla' used in the romances of chivalry; the governorship Don Quijote promised Sancho"}
          - {w: "de las de por ahí", d: "one of those common ones, any old one"}
        diagram:
          - s: "En casa os las mostraré"
            r: "main verb 1: I'll show them to you at home"
            under:
              - {s: "mujer", r: "address: wife"}
          - {s: "dijo Panza", r: "speech tag: said Panza"}
          - s: "por agora estad contenta"
            r: "main verb 2 (after 'y'): for now be content"
            under:
              - s: "que"
                r: "why: for"
                under:
                  - {s: "siendo Dios servido de que otra vez salgamos en viaje a buscar aventuras", r: "condition: if God wills that we set out again to seek adventures"}
                  - s: "vos me veréis presto conde o gobernador de una ínsula"
                    r: "what will happen: you will soon see me a count or governor of an isle"
                    under:
                      - {s: "y no de las de por ahí", r: "describes 'ínsula': and not one of the common sort"}
                      - {s: "sino la mejor que pueda hallarse", r: "describes 'ínsula', 2: but the best that can be found"}
        forms:
          - {w: "os las mostraré", f: "mostrar- + -é → mostrar (to show), future, I, with 'os' (to you) and 'las' (them, the things). The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "estad", f: "estar (to be), imperative, you (vos/vosotros form): 'be'. The vosotros imperative swaps the final -r for -d: estad, comed, vivid."}
          - {w: "contenta", f: "contento (content), feminine to match the wife."}
          - {w: "siendo Dios servido", f: "siendo, gerund of ser (to be), + servido, participle of servir (to serve): an absolute construction, 'God being served', i.e. if God wills it."}
          - {w: "salgamos", f: "salg- + -amos → salir (to go out), present subjunctive, we. salga, salgas, salga, salgamos, salgáis, salgan."}
          - {w: "veréis", f: "ver- + -éis → ver (to see), future, you (vos). The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "pueda hallarse", f: "pued- + -a → poder (to be able), present subjunctive, it: pueda, puedas, pueda, podamos, podáis, puedan; + hallarse (to be found), with passive 'se'. Subjunctive after a superlative ('la mejor que')."}
  - sentences:
      - es: "— Quiéralo así el cielo, marido mío; que bien lo habemos menester."
        literal: "— May-want-it so the heaven, husband mine; for well it we-have need."
        ormsby: "“Heaven grant it, husband,” said she, “for indeed we have need of it."
        vocab:
          - {w: "el cielo", d: "heaven, i.e. God"}
          - {w: "habemos", d: "= hemos, we have (old form)"}
          - {w: "haber menester", d: "to need, have need of ('lo habemos menester' = we need it)"}
        diagram:
          - s: "Quiéralo así el cielo"
            r: "main verb: may heaven so will it"
            under:
              - {s: "marido mío", r: "address: husband"}
              - {s: "que bien lo habemos menester", r: "why: for we certainly need it"}
        forms:
          - {w: "Quiéralo", f: "quier- + -a + lo → querer (to want), present subjunctive, it (heaven), with 'lo' (it) stuck on the end: 'may heaven want it'. quiera, quieras, quiera, queramos, queráis, quieran. A subjunctive opening the sentence makes a wish, and the pronoun then hangs on the end; the accent is written to keep the stress."}
          - {w: "habemos", f: "old form of hemos, from haber (to have), present, we: he, has, ha, habemos (hemos), habéis, han. Here haber (to have) is a full verb in the set phrase 'haber menester', to need."}
        note: "Ormsby adds 'said she', which the Spanish leaves out."
      - es: "Mas, decidme: ¿qué es eso de ínsulas, que no lo entiendo?"
        literal: "But, tell-me: what is that of isles, for not it I-understand?"
        ormsby: "But tell me, what’s this about islands, for I don’t understand it?”"
        vocab:
          - {w: "mas", d: "but (literary; without accent, not 'más')"}
          - {w: "eso de", d: "this business of, this talk about"}
          - {w: "ínsula", d: "isle: the old, literary word for 'isla' from the romances of chivalry, which a peasant woman would not know"}
        diagram:
          - s: "Mas, decidme:"
            r: "main verb: but tell me"
            under:
              - s: "¿qué es eso de ínsulas"
                r: "what to tell: what is this about isles"
                under:
                  - {s: "que no lo entiendo?", r: "why she asks: for I don't understand it"}
        forms:
          - {w: "decidme", f: "decid + me → decir (to say, tell), imperative, you (vos/vosotros form) + me: 'tell me'. The vosotros imperative swaps the final -r for -d: decid, comed, contad."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "entiendo", f: "entiend- + -o → entender (to understand), present, I. The stem e becomes ie when stressed: entiendo, entiendes, entiende, entendemos, entendéis, entienden."}
  - sentences:
      - es: "— No es la miel para la boca del asno —respondió Sancho—; a su tiempo lo verás, mujer, y aun te admirarás de oírte llamar Señoría de todos tus vasallos."
        literal: "— Not is the honey for the mouth of-the ass —answered Sancho—; at its time it you-will-see, wife, and even yourself you-will-marvel at hearing-yourself call Lordship by all your vassals."
        ormsby: "“Honey is not for the mouth of the ass,” returned Sancho; “all in good time thou shalt see, wife, nay, thou wilt be surprised to hear thyself called ‘your ladyship’ by all thy vassals.”"
        ormsby_note: "Proverb 138."
        vocab:
          - {w: "no es la miel para la boca del asno", d: "proverb: honey is not for the donkey's mouth, i.e. some things are too good for the ignorant to understand"}
          - {w: "a su tiempo", d: "in due course, all in good time"}
          - {w: "admirarse de", d: "to be amazed at (false friend: not 'to admire')"}
          - {w: "Señoría", d: "Lordship, Ladyship: the title of address of titled nobles and high officials"}
          - {w: "vasallo", d: "vassal, subject of a lord"}
        diagram:
          - s: "No es la miel para la boca del asno"
            r: "main verb 1: honey is not for the donkey's mouth"
          - {s: "respondió Sancho", r: "speech tag: answered Sancho"}
          - s: "a su tiempo lo verás"
            r: "main verb 2: you'll see it in due course"
            under:
              - {s: "mujer", r: "address: wife"}
          - s: "aun te admirarás"
            r: "main verb 3 (after 'y'): you will even be amazed"
            under:
              - {s: "de oírte llamar Señoría de todos tus vasallos", r: "at what: at hearing yourself called Ladyship by all your vassals"}
        forms:
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "del", f: "de + el, 'of the'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "verás", f: "ver- + -ás → ver (to see), future, you (tú). The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "te admirarás", f: "admirar- + -ás → admirarse (to be amazed), future, you (tú), with 'te' (yourself). Same future endings."}
          - {w: "oírte llamar", f: "oír (to hear) + te (yourself), then the infinitive llamar (to call): 'to hear yourself called'. After verbs of hearing and seeing Spanish uses the infinitive where English uses a participle."}
          - {w: "de todos tus vasallos", f: "'de' here marks the agent, 'by all your vassals'; modern Spanish would say 'por'."}
        note: "Sancho now uses 'tú' to his wife (verás, te admirarás), the familiar form; she answers with 'vos'. The proverb puts her in the place of the donkey, which is Sancho's teasing, not an insult between them."
  - sentences:
