          - {w: "cuya", f: "cuy- + -a → cuyo (whose, which), feminine to match 'risa'; here linking back to the whole laugh: 'and this laughter'."}
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, it. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
