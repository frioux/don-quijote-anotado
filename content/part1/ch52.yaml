summary: |
  Everyone enjoys the goatherd's tale, and the canon remarks that Eugenio tells it more like a courtier than a rustic. Don Quijote offers to rescue Leandra from her convent as soon as he is free of his enchantment. The goatherd, seeing his strange looks, asks who he is; when the barber describes him in the terms of the books of chivalry, Eugenio says the man must have empty rooms in his head. Don Quijote hurls a loaf in his face and flattens his nose, and a brawl follows on the tablecloth: Sancho pulls the goatherd off, the barber helps the goatherd get Don Quijote underneath him, and the canon, the priest and the officers laugh and egg them on like dogs.

  A doleful trumpet interrupts the fight. Don Quijote begs a truce and sees men in white coming down a hill: a procession of penitents praying for rain in a year of drought, carrying an image of the Virgin draped in black. He takes the image for a noble lady being carried off by villains, mounts Rocinante and charges, deaf to Sancho's shouts that it is the blessed Virgin. He orders the penitents to free the lady; they laugh; he attacks the litter, and one of the bearers breaks his sword stroke with a forked prop and fells him with a blow on the shoulder. Thinking him dead, the man runs off. Sancho throws himself on his master and laments over him in high style, until a priest of the procession recognizes the curate and the misunderstanding is cleared up.

  Don Quijote revives, speaks of Dulcinea, and agrees to go home in the ox-cart until the evil influence of the stars has passed. The company breaks up, and six days later the cart enters the village at noon on a Sunday, before the whole square. The housekeeper and the niece curse the books of chivalry again and put the knight to bed, where he stares at them without knowing where he is. Sancho's wife asks first about the ass, then about presents; Sancho promises that she will soon be a countess or a governor's wife, and praises the life of a squire in spite of the blanketings.

  The narrator says he could find no authentic record of Don Quijote's third sally, only a tradition that he went to Zaragoza for some jousts. An old doctor, however, owned a leaden box found in the ruins of a hermitage, holding parchments in Gothic letters with Castilian verses about the knight. The chapter and Part I end with the legible poems by the 'academicians of Argamasilla': epitaphs for Don Quijote and Dulcinea and sonnets in praise of Dulcinea, Rocinante and Sancho. The rest of the verses have been given to an academician to decipher, 'in hope of Don Quijote's third sally', and the book closes on a line of Ariosto: perhaps another will sing it with a better plectrum.
context: |
  Penitents and rogations. The procession is real Castilian religious life. In a drought villages held 'rogativas', processions with litanies to beg God for rain, carrying an image of the Virgin or a saint to a hermitage in the countryside. The 'diciplinantes' were flagellants: members of a brotherhood who walked in white tunics and hoods, whipping their own bare backs as public penance, which is why the cleric says 'these brothers are opening their flesh' and cannot stop. The image is dressed in black mourning, as statues of the sorrowing Virgin often were, and it rides on a 'peana' or litter carried on poles, with forked props to rest it on. To a madman who has read only romances, a hooded company carrying off a weeping lady in black is a textbook adventure; the joke is that Don Quijote must have seen such processions all his life. Ormsby notes, quoting Hartzenbusch, that the canon and priest's enjoyment of the brawl is excused by the fact that it was after dinner.

  Village life. The homecoming shows the village Don Quijote left in Chapter 7: a Sunday crowd in the square, the housekeeper and niece who already cursed his books once, and Sancho's wife, whose first question is about the ass and her second about presents. Her 'saboyana' is a woman's overskirt, and the 'zapaticos' are little shoes for the children. Sancho's answer, that he will make her a countess, and his praise of a life of free lodging with 'devil take the maravedí to pay', look forward to the ambitions of the next sally. Cervantes calls her 'Juana Panza' here and explains that in La Mancha wives took their husbands' surnames; earlier in Part I she is Juana or Mari Gutiérrez, and Ormsby, following the name she has later, calls her Teresa.

  The narrator's games. Part I ends as it began, with a mock search of the archives. The 'author' says authentic records fail him, then produces a leaden box found in the foundations of a ruined hermitage, with parchments in Gothic script but Castilian verse: the kind of miraculous discovery that romances of chivalry used to authenticate themselves, and that Cervantes' own readers may have connected with the lead tablets found at Granada in the 1590s (a connection scholars have suggested, not one the text makes). He asks only to be believed as much as sensible people believe the books of chivalry, which is to say not at all. The 'third sally' to Zaragoza is promised but left vague, and the closing line, Ariosto's 'perhaps another will sing with a better plectrum', seems, as Ormsby says, almost to invite another writer to continue. Someone did: a sequel by 'Avellaneda' appeared in 1614, before Cervantes' own Part II of 1615.

  The academicians' verses. Romances of chivalry, and Part I itself, opened with commendatory poems by friends and patrons; Cervantes places his at the end and gives them to a mock literary academy of Argamasilla, which Ormsby takes as proof that this is the village whose name the narrator 'did not care to call to mind'. The academicians' names are jokes: Monicongo (Ormsby suggests 'mannikin'; the word also recalls the 'Manicongo', the king of the Congo), Paniaguado (a hanger-on who eats a patron's bread and water), Caprichoso (whimsical), Burlador (joker), Cachidiablo (hobgoblin, also remembered as the nickname of a Barbary corsair), Tiquitoc (apparently an imitation of a ticking sound). The poems mix high style with low: Don Quijote is a 'calvatrueno' (scatterbrain) whose fame reached from Cathay to Gaeta; Dulcinea is 'high-bosomed' and has a face like tripe; Rocinante outshines Brigliadoro and Baiardo, the horses of Orlando and Rinaldo in Ariosto; Sancho rode a donkey, 'begging your pardon'. The Rocinante sonnet carries an 'estrambote', a three-line tail added to the fourteen lines, a recognized Italian and Spanish form often used for comic effect. Ormsby finds little humour in the verses except the sonnet on Sancho and calls them a flourish to finish off with, like the 'rúbrica' scrawled under a Spanish signature.

  Names and places. Gaeta is a port in southern Italy, Cathay the old name for China; Bellona is the Roman goddess of war, Mars the god; Gaula (Gaul or Wales) is the homeland of Amadís, and Grecia the Greek empire his descendants rule in the sequels (one of them is Amadís de Grecia); Galaor is Amadís' brother and Belianís de Grecia the hero of another romance. The Sierra Negra, the plain of Montiel and the meadows of Aranjuez map Don Quijote's world, though Aranjuez, a royal estate with famous gardens on the Tagus, lies well to the north of anywhere he actually went.

  Reading Cervantes' Spanish. The archaisms of the chapter: estraño (extraño), monesterio (monasterio), diciplinas and diciplinantes (disciplinas), ledanías (letanías), recebir (recibir), mesmo (mismo), agora (ahora), priesa (prisa), expiriencia (experiencia), desto, deso, della, dél (contractions with de), traelle and sacallos (traerle, sacarlos, with -rl- turned into -ll-), and the knightly archaisms Don Quijote puts on for battle: veredes (veréis), habedes fecho (habéis hecho), desfacer (deshacer), and fecho desaguisado. Pronouns hang on verbs that open a clause (Miróle, admiróse, confirmóle, tomáronse, hiciéronse, Fatigóse, Tiénese). The -ra form serves as a conditional (me pusiera, sacara, volviera, la alcanzara) and the -se form as the subjunctive after past verbs (abriese, diese, confundiese, tuviese); the future subjunctive appears in 'los que la leyeren'. Watch the false friends and idioms: curiosidad (care), discreto (sensible, witty), puesto que (although), suceso (outcome), 'luego luego' (at once), 'dar en' and 'dar a huir' (to start running), 'no estar para' (not to be in a state to), 'ser menester' (to be needed), and the verse liberties: 'do' for 'donde', 'invito' for 'invicto', and the diaeresis in jüicio, Montïel, Aranjüez and fïel, which marks an extra syllable for the metre.
