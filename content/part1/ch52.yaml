          - {w: "acometedor de peligros", d: "one who takes on dangers"}
          - {w: "sufridor", d: "endurer, one who suffers patiently"}
          - {w: "afrenta", d: "affront, insult, disgrace"}
          - {w: "enamorado sin causa", d: "in love without cause: in love with a lady who has given him no reason"}
          - {w: "azote", d: "scourge, whip"}
          - {w: "ruin", d: "base, mean, vile"}
          - {w: "en fin", d: "in short, finally"}
        diagram:
          - s: "¡Oh humilde con los soberbios y arrogante con los humildes"
            r: "address: oh you who were humble with the proud and arrogant with the humble"
          - {s: "acometedor de peligros, sufridor de afrentas, enamorado sin causa", r: "more titles: taker-on of dangers, endurer of affronts, lover without cause"}
          - {s: "imitador de los buenos, azote de los malos, enemigo de los ruines", r: "more titles: imitator of the good, scourge of the wicked, enemy of the base"}
          - s: "en fin, caballero andante"
            r: "summing up: in short, knight-errant"
            under:
              - {s: "que es todo lo que decir se puede!", r: "describes 'caballero andante': which is all that can be said"}
        forms:
          - {w: "acometedor, sufridor, imitador", f: "nouns made from verbs with the suffix -dor (one who does): acometer (to attack) → acometedor, sufrir (to suffer) → sufridor, imitar (to imitate) → imitador."}
          - {w: "enamorado", f: "participle of enamorar (to make fall in love), masculine, used as a noun: 'lover, one in love'."}
          - {w: "los buenos, los malos, los ruines", f: "adjectives used as nouns with 'los': 'the good, the wicked, the base (people)'."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "decir se puede", f: "pued- + -e → poder (to be able), present, it: puedo, puedes, puede, podemos, podéis, pueden; with 'se' making it impersonal ('one can say'), and the infinitive decir (to say) put first; prose order 'se puede decir'."}
        note: "Sancho garbles the knightly formula 'humble with the humble and arrogant with the proud', turning it upside down, and 'enamorado sin causa' is truer than he knows: Dulcinea has never given Don Quijote any cause."
