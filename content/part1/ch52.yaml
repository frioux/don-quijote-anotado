          - {w: "decía", f: "dec- + -ía → decir (to say), imperfect, he. The imperfect of -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
  - sentences:
      - es: "— ¡Oh flor de la caballería, que con solo un garrotazo acabaste la carrera de tus tan bien gastados años!"
        literal: "— Oh flower of the chivalry, who with only one cudgel-blow finished the course of your so well spent years!"
        ormsby: "“Oh flower of chivalry, that with one blow of a stick hast ended the course of thy well-spent life!"
        vocab:
          - {w: "flor de la caballería", d: "flower of chivalry: a stock phrase of the romances for the perfect knight"}
          - {w: "garrotazo", d: "blow with a cudgel ('garrote', club, + '-azo', blow)"}
          - {w: "carrera", d: "course, career (of a life)"}
        diagram:
          - s: "¡Oh flor de la caballería"
            r: "address: oh flower of chivalry"
            under:
              - s: "que con solo un garrotazo acabaste la carrera de tus tan bien gastados años!"
                r: "describes 'flor': who with a single blow of a club ended the course of your so well-spent years"
        forms:
          - {w: "acabaste", f: "acab- + -aste → acabar (to finish), preterite, you (tú). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. Sancho uses 'tú' in his lament, as in a funeral oration."}
          - {w: "garrotazo", f: "garrot- + -azo → garrote (club) with the suffix -azo, 'a blow with'."}
          - {w: "tus", f: "tus = plural to match 'años', not the owner; 'your years'."}
          - {w: "gastados", f: "gast- + -ados → gastar (to spend), participle, masculine plural to match 'años'."}
        note: "Sancho's lament imitates the 'planto', the formal funeral lament over a fallen knight in the romances of chivalry and epic poetry, built from a string of apostrophes opening with 'Oh!'."
      - es: "¡Oh honra de tu linaje, honor y gloria de toda la Mancha, y aun de todo el mundo, el cual, faltando tú en él, quedará lleno de malhechores, sin temor de ser castigados de sus malas fechorías!"
        literal: "Oh honor of your lineage, honor and glory of all the Mancha, and even of all the world, the which, lacking you in it, will-remain full of evildoers, without fear of being punished for their bad misdeeds!"
        ormsby: "Oh pride of thy race, honour and glory of all La Mancha, nay, of all the world, that for want of thee will be full of evildoers, no longer in fear of punishment for their misdeeds!"
        vocab:
          - {w: "linaje", d: "lineage, family line"}
          - {w: "faltar", d: "to be missing, be gone"}
          - {w: "malhechor", d: "evildoer, criminal"}
          - {w: "fechoría", d: "misdeed, crime"}
        diagram:
          - s: "¡Oh honra de tu linaje, honor y gloria de toda la Mancha, y aun de todo el mundo"
            r: "address: oh honor of your line, glory of La Mancha and of the world"
            under:
              - s: "el cual"
                r: "describes 'mundo': which"
                under:
                  - {s: "faltando tú en él", r: "condition: with you gone from it"}
                  - {s: "quedará lleno de malhechores", r: "verb: will be left full of evildoers"}
                  - {s: "sin temor de ser castigados de sus malas fechorías!", r: "how: with no fear of being punished for their misdeeds"}
        forms:
          - {w: "faltando tú", f: "gerund of faltar (to be missing) with its own subject 'tú': 'you being gone'."}
          - {w: "quedará", f: "quedar- + -á → quedar (to remain), future, it. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "lleno", f: "masculine to match 'el cual' (the world)."}
          - {w: "ser castigados", f: "ser (to be) + castigados, participle of castigar (to punish), masculine plural to match 'malhechores': passive 'being punished'. 'de' marks the cause."}
          - {w: "sus malas", f: "sus = plural to match 'fechorías', not the owner; mal- + -as → malo (bad), feminine plural."}
      - es: "¡Oh liberal sobre todos los Alejandros, pues por solos ocho meses de servicio me tenías dada la mejor ínsula que el mar ciñe y rodea!"
        literal: "Oh generous above all the Alexanders, since for only eight months of service to-me you-had given the best isle that the sea girds and surrounds!"
        ormsby: "Oh thou, generous above all the Alexanders, since for only eight months of service thou hast given me the best island the sea girds or surrounds!"
        ormsby_note: "It is commonly said that Sancho, though he would have understood what isla meant, had no conception of the meaning of insula, the antiquated word for island Don Quixote always uses; but it appears from this that he understood perfectly what an insula is."
        vocab:
          - {w: "liberal", d: "generous, open-handed (not political)"}
          - {w: "Alejandros", d: "Alexanders: Alexander the Great, proverbial for his generosity to his followers"}
          - {w: "ínsula", d: "isle: the archaic, chivalric word for 'isla' that Don Quijote promised Sancho to govern"}
          - {w: "ceñir", d: "to gird, encircle"}
          - {w: "rodear", d: "to surround"}
        diagram:
          - s: "¡Oh liberal sobre todos los Alejandros"
            r: "address: oh you, more generous than all the Alexanders"
            under:
              - s: "pues por solos ocho meses de servicio me tenías dada la mejor ínsula"
                r: "why: since for only eight months' service you had given me the best isle"
                under:
                  - {s: "que el mar ciñe y rodea!", r: "describes 'ínsula': that the sea girds and surrounds"}
        forms:
          - {w: "Alejandros", f: "a proper name made plural: 'all the Alexanders', i.e. all men as generous as Alexander."}
          - {w: "solos", f: "sol- + -os → solo (only), masculine plural to match 'meses'."}
          - {w: "tenías dada", f: "ten- + -ías → tener (to have), imperfect, you (tú): tenía, tenías, tenía, teníamos, teníais, tenían; + dada, participle of dar (to give), feminine to match 'ínsula': 'tener' + participle stresses a settled result, 'you had given me (as good as done)'."}
          - {w: "mejor", f: "comparative of bueno (good); with 'la' it is the superlative, 'the best'."}
          - {w: "ciñe", f: "ciñ- + -e → ceñir (to gird), present, it. The e of the stem becomes i, and the i of the ending is absorbed by ñ: ciño, ciñes, ciñe, ceñimos, ceñís, ciñen."}
