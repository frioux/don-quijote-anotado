  - sentences:
      - es: "— Agora, valerosa compañía, veredes cuánto importa que haya en el mundo caballeros que profesen la orden de la andante caballería; agora digo que veredes, en la libertad de aquella buena señora que allí va cautiva, si se han de estimar los caballeros andantes."
        literal: "— Now, valiant company, you-shall-see how-much it-matters that there-be in the world knights who profess the order of the errant chivalry; now I-say that you-shall-see, in the freedom of that good lady who there goes captive, whether themselves have to be-esteemed the knights errant."
        ormsby: "“Now, noble company, ye shall see how important it is that there should be knights in the world professing the order of knight-errantry; now, I say, ye shall see, by the deliverance of that worthy lady who is borne captive there, whether knights-errant deserve to be held in estimation,”"
        vocab:
          - {w: "agora", d: "= ahora, now (old form)"}
          - {w: "compañía", d: "company, gathering of people"}
          - {w: "veredes", d: "= veréis, you will see: the old chivalric -edes ending Don Quijote affects"}
          - {w: "profesar", d: "to profess, be a member of (a religious or knightly order)"}
          - {w: "la orden de la andante caballería", d: "the order of knight-errantry; 'orden' is feminine when it means a religious or knightly order"}
          - {w: "cautivo", d: "captive, held prisoner"}
          - {w: "estimar", d: "to esteem, value"}
        diagram:
          - s: "Agora, valerosa compañía, veredes"
            r: "main verb 1: now, valiant company, you shall see"
            under:
              - s: "cuánto importa"
                r: "what you shall see: how much it matters"
                under:
                  - s: "que haya en el mundo caballeros"
                    r: "subject of 'importa': that there be knights in the world"
                    under:
                      - {s: "que profesen la orden de la andante caballería", r: "describes 'caballeros': who profess the order of knight-errantry"}
          - s: "agora digo"
            r: "main verb 2: now I say"
            under:
              - s: "que veredes"
                r: "what I say: that you shall see"
                under:
                  - s: "en la libertad de aquella buena señora"
                    r: "how: in the freeing of that good lady"
                    under:
                      - {s: "que allí va cautiva", r: "describes 'señora': who goes captive there"}
                  - {s: "si se han de estimar los caballeros andantes", r: "what you shall see: whether knights-errant are to be esteemed"}
        forms:
          - {w: "veredes", f: "ver- + -edes → ver (to see), future, you (vosotros), old form of 'veréis'. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis (old -edes), -án."}
          - {w: "importa", f: "import- + -a → importar (to matter), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "haya", f: "hay- + -a → haber (there to be), present subjunctive, it: haya, hayas, haya, hayamos, hayáis, hayan. Subjunctive after 'importa que'."}
          - {w: "profesen", f: "profes- + -en → profesar (to profess), present subjunctive, they. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. Subjunctive because the knights are wished for, not pointed out."}
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "va", f: "ir (to go), present, she. Irregular: voy, vas, va, vamos, vais, van. 'va cautiva' = is being carried captive."}
          - {w: "se han de estimar", f: "han, from haber (to have), present, they: he, has, ha, hemos, habéis, han; 'haber de' + estimar (to esteem) = 'are to be esteemed', with 'se' making it passive."}
          - {w: "valerosa, cautiva", f: "valeros- + -a → valeroso (valiant), cautiv- + -a → cautivo (captive), feminine to match 'compañía' and 'señora'."}
        note: "The phrase echoes his challenge in many earlier adventures: an enchanted or kidnapped lady to free is the core situation of the romances of chivalry."
  - sentences:
      - es: "Y, en diciendo esto, apretó los muslos a Rocinante, porque espuelas no las tenía, y, a todo galope, porque carrera tirada no se lee en toda esta verdadera historia que jamás la diese Rocinante, se fue a encontrar con los diciplinantes, bien que fueran el cura y el canónigo y barbero a detenelle;"
        literal: "And, on saying this, he-squeezed the thighs to Rocinante, because spurs not them he-had, and, at full gallop, because race stretched-out not itself reads in all this true history that ever it might-give Rocinante, he-went-off to meet with the flagellants, even-though went the priest and the canon and barber to stop-him;"
        ormsby: "and so saying he brought his legs to bear on Rocinante—for he had no spurs—and at a full canter (for in all this veracious history we never read of Rocinante fairly galloping) set off to encounter the penitents, though the curate, the canon, and the barber ran to prevent him."
        vocab:
          - {w: "en diciendo esto", d: "as soon as he said this ('en' + gerund = on doing, the moment after)"}
          - {w: "apretar", d: "to squeeze, press"}
          - {w: "muslo", d: "thigh"}
          - {w: "espuela", d: "spur"}
          - {w: "a todo galope", d: "at full gallop (here mock-heroic: the best Rocinante can do)"}
          - {w: "carrera tirada", d: "a full, flat-out run, a real gallop"}
          - {w: "encontrarse con", d: "to meet, encounter; here 'to charge'"}
          - {w: "bien que", d: "although, even though"}
          - {w: "detenelle", d: "= detenerle, to stop him (the -r of the infinitive merged with the l of the pronoun)"}
        diagram:
          - s: "apretó los muslos a Rocinante"
            r: "main verb 1: he pressed his thighs to Rocinante"
            under:
              - {s: "en diciendo esto", r: "when: as soon as he said this"}
              - {s: "porque espuelas no las tenía", r: "why: because he had no spurs"}
          - s: "se fue a encontrar con los diciplinantes"
            r: "main verb 2 (after 'y'): he went off to charge the flagellants"
            under:
              - s: "a todo galope"
                r: "how: at full gallop"
                under:
                  - s: "porque carrera tirada no se lee en toda esta verdadera historia"
                    r: "aside: because a real flat-out run is not read of in all this true history"
                    under:
                      - {s: "que jamás la diese Rocinante", r: "what is not read: that Rocinante ever gave one"}
              - {s: "bien que fueran el cura y el canónigo y barbero a detenelle", r: "although: though the priest, the canon and the barber went to stop him"}
        forms:
          - {w: "diciendo", f: "gerund of decir (to say), stem e turned to i; after 'en' it means 'on saying, the moment he said'."}
          - {w: "apretó", f: "apret- + -ó → apretar (to squeeze), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "espuelas no las tenía", f: "ten- + -ía → tener (to have), imperfect, he: tenía, tenías, tenía, teníamos, teníais, tenían. The object 'espuelas' is put first for emphasis and repeated by 'las'."}
          - {w: "se lee", f: "le- + -e → leer (to read), present, it, with 'se' making it passive: 'is read'. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "esta", f: "est- + -a → este (this), feminine to match 'historia'."}
          - {w: "diese", f: "di- + -ese → dar (to give), imperfect subjunctive (-se form), he (Rocinante): diese, dieses, diese, diésemos, dieseis, diesen. 'la' stands for 'carrera tirada'."}
          - {w: "se fue", f: "fu- + -e → irse (to go off), preterite, he: fui, fuiste, fue, fuimos, fuisteis, fueron; with 'se' meaning 'off, away'."}
          - {w: "fueran", f: "fu- + -eran → ir (to go), imperfect subjunctive (-ra form), they: fuera, fueras, fuera, fuéramos, fuerais, fueran. After 'bien que' (although); 'fueran a detenelle' = they went to stop him."}
          - {w: "detenelle", f: "detener (to stop) + le (him), with -rl- becoming -ll-: old form of 'detenerle'."}
        note: "A running joke: Rocinante never manages a real gallop anywhere in the book, so the narrator, playing the scrupulous historian, corrects his own 'a todo galope'."
      - es: "mas no les fue posible, ni menos le detuvieron las voces que Sancho le daba, diciendo:"
        literal: "but not to-them it-was possible, nor less him stopped the shouts that Sancho to-him was-giving, saying:"
        ormsby: "But it was out of their power, nor did he even stop for the shouts of Sancho calling after him,"
        vocab:
          - {w: "mas", d: "but (without an accent; 'más' with an accent is 'more')"}
          - {w: "ni menos", d: "nor even, still less"}
          - {w: "dar voces", d: "to shout, call out"}
        diagram:
          - s: "mas no les fue posible"
            r: "main verb 1: but it was not possible for them"
          - s: "ni menos le detuvieron las voces"
            r: "main verb 2: nor did the shouts even stop him"
            under:
              - s: "que Sancho le daba"
                r: "describes 'voces': that Sancho gave him"
                under:
                  - {s: "diciendo:", r: "how: saying"}
        forms:
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, it. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "detuvieron", f: "detuv- + -ieron → detener (to stop), preterite, they (the shouts). Irregular like tener (to have): detuve, detuviste, detuvo, detuvimos, detuvisteis, detuvieron."}
          - {w: "daba", f: "d- + -aba → dar (to give), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "diciendo", f: "gerund of decir (to say), stem e turned to i."}
  - sentences:
      - es: "— ¿Adónde va, señor don Quijote? ¿Qué demonios lleva en el pecho, que le incitan a ir contra nuestra fe católica?"
        literal: "— Where-to are-you-going, sir Don Quijote? What devils do-you-carry in the breast, that you incite to go against our faith Catholic?"
        ormsby: "“Where are you going, Señor Don Quixote? What devils have possessed you to set you on against our Catholic faith?"
        vocab:
          - {w: "adónde", d: "where to"}
          - {w: "llevar en el pecho", d: "to carry in one's breast, have inside one"}
          - {w: "incitar a", d: "to urge on, incite to"}
          - {w: "fe católica", d: "the Catholic faith"}
        diagram:
          - s: "¿Adónde va, señor don Quijote?"
            r: "question 1: where are you going, sir?"
          - s: "¿Qué demonios lleva en el pecho"
            r: "question 2: what devils do you have in your breast"
            under:
              - {s: "que le incitan a ir contra nuestra fe católica?", r: "describes 'demonios': that urge you to go against our Catholic faith"}
        forms:
          - {w: "va", f: "ir (to go), present, you (vuestra merced, which takes the 'he/she' form): voy, vas, va, vamos, vais, van."}
          - {w: "lleva", f: "llev- + -a → llevar (to carry), present, you (vuestra merced). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "le incitan", f: "incit- + -an → incitar (to urge), present, they (the devils); 'le' = you, the polite 'vuestra merced'. Same -ar present."}
          - {w: "católica", f: "católic- + -a → católico (Catholic), feminine to match 'fe'."}
        note: "Sancho speaks to his master with the polite 'he/she' verb forms of 'vuestra merced' (your grace), so 'va' and 'lleva' mean 'you go', 'you carry'. A procession was an act of the Church, so attacking it really could look like an attack on the faith."
      - es: "Advierta, mal haya yo, que aquélla es procesión de diciplinantes, y que aquella señora que llevan sobre la peana es la imagen benditísima de la Virgen sin mancilla; mire, señor, lo que hace, que por esta vez se puede decir que no es lo que sabe."
        literal: "Notice, bad may-have I, that that-one is procession of flagellants, and that that lady whom they-carry on the pedestal is the image most-blessed of the Virgin without stain; look, sir, at what you-do, for for this time itself can say that not it-is what you-know."
        ormsby: "Plague take me! mind, that is a procession of penitents, and the lady they are carrying on that stand there is the blessed image of the immaculate Virgin. Take care what you are doing, señor, for this time it may be safely said you don’t know what you are about.”"
        vocab:
          - {w: "advertir", d: "to take notice, consider (false friend: not 'to advertise')"}
          - {w: "mal haya yo", d: "curse me, plague take me: an oath ('may I have ill')"}
          - {w: "peana", d: "pedestal, the stand an image is carried on"}
          - {w: "benditísimo", d: "most blessed (superlative of 'bendito')"}
          - {w: "sin mancilla", d: "without stain, immaculate: the Virgin conceived without original sin"}
          - {w: "no es lo que sabe", d: "it is not what you know, i.e. you do not know what you are doing (Sancho twists the saying 'no sabe lo que hace')"}
        diagram:
          - s: "Advierta"
            r: "main verb 1: notice (you, sir)"
            under:
              - {s: "mal haya yo", r: "oath: curse me"}
              - {s: "que aquélla es procesión de diciplinantes", r: "what to notice, 1: that that is a procession of flagellants"}
              - s: "y que aquella señora"
                r: "what to notice, 2: and that that lady"
                under:
                  - {s: "que llevan sobre la peana", r: "describes 'señora': whom they carry on the stand"}
                  - {s: "es la imagen benditísima de la Virgen sin mancilla", r: "verb of 'señora': is the most blessed image of the Immaculate Virgin"}
          - s: "mire, señor, lo que hace"
            r: "main verb 2: look, sir, at what you are doing"
            under:
              - s: "que por esta vez se puede decir"
                r: "why: for this time it can be said"
                under:
                  - {s: "que no es lo que sabe", r: "what can be said: that it is not what you know"}
        forms:
          - {w: "Advierta", f: "advierta → advertir (to notice), present subjunctive, you (vuestra merced), used as a polite command. The e of the stem becomes ie: advierta, adviertas, advierta, advirtamos, advirtáis, adviertan."}
          - {w: "haya", f: "hay- + -a → haber (to have), present subjunctive, I, in a curse: 'may I have ill'. haya, hayas, haya, hayamos, hayáis, hayan."}
          - {w: "aquélla, aquella", f: "aquell- + -a → aquel (that), feminine; 'aquélla' with an accent is the pronoun 'that one', 'aquella' without is the adjective before 'señora'."}
          - {w: "es", f: "ser (to be), present, it / she: soy, eres, es, somos, sois, son."}
          - {w: "llevan", f: "llev- + -an → llevar (to carry), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "benditísima", f: "bendit- + -ísima → bendito (blessed) with the superlative suffix -ísimo, feminine to match 'imagen'."}
          - {w: "mire", f: "mir- + -e → mirar (to look), present subjunctive as a polite command, you (vuestra merced). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "hace", f: "hac- + -e → hacer (to do), present, you (vuestra merced): hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "se puede decir", f: "pued- + -e → poder (to be able), present, it, with 'se' making it impersonal: 'one can say'. puedo, puedes, puede, podemos, podéis, pueden; + decir (to say), infinitive."}
          - {w: "sabe", f: "sab- + -e → saber (to know), present, you (vuestra merced): sé, sabes, sabe, sabemos, sabéis, saben."}
  - sentences:
      - es: "Fatigóse en vano Sancho, porque su amo iba tan puesto en llegar a los ensabanados y en librar a la señora enlutada, que no oyó palabra; y, aunque la oyera, no volviera, si el rey se lo mandara."
        literal: "Wore-himself-out in vain Sancho, because his master was-going so set on reaching to the sheeted-ones and on freeing to the lady in-mourning, that not he-heard word; and, although it he-had-heard, not he-would-have-turned-back, if the king him it had-ordered."
        ormsby: "Sancho laboured in vain, for his master was so bent on coming to quarters with these sheeted figures and releasing the lady in black that he did not hear a word; and even had he heard, he would not have turned back if the king had ordered him."
        vocab:
          - {w: "fatigarse", d: "to tire oneself out, toil, make every effort"}
          - {w: "en vano", d: "in vain"}
          - {w: "ir puesto en", d: "to be bent on, set on"}
          - {w: "ensabanado", d: "sheeted, covered in a sheet: Sancho's and the narrator's word for the white-robed penitents"}
          - {w: "enlutado", d: "in mourning, dressed in black"}
          - {w: "volver", d: "here 'to turn back'"}
        diagram:
          - s: "Fatigóse en vano Sancho"
            r: "main verb 1: Sancho wore himself out in vain"
            under:
              - s: "porque su amo iba tan puesto"
                r: "why: because his master was so bent"
                under:
                  - {s: "en llegar a los ensabanados y en librar a la señora enlutada", r: "on what: on reaching the sheeted men and freeing the lady in black"}
                  - {s: "que no oyó palabra", r: "result: that he did not hear a word"}
          - s: "no volviera"
            r: "main verb 2 (after 'y'): he would not have turned back"
            under:
              - {s: "aunque la oyera", r: "concession: even if he had heard it"}
              - {s: "si el rey se lo mandara", r: "condition: if the king had ordered him to"}
        forms:
          - {w: "Fatigóse", f: "fatig- + -ó + se → fatigarse (to tire oneself), preterite, he, with 'se' stuck on the end; modern 'se fatigó'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. Cervantes hangs the pronoun on a verb that opens its clause."}
          - {w: "iba", f: "ir (to go), imperfect, he. Irregular: iba, ibas, iba, íbamos, ibais, iban."}
          - {w: "puesto", f: "irregular participle of poner (to put, set), masculine to match 'amo': 'set on'."}
          - {w: "enlutada", f: "enlut- + -ada → enlutar (to put in mourning), participle used as adjective, feminine to match 'señora'."}
          - {w: "oyó", f: "o- + -yó → oír (to hear), preterite, he; i turns to y between vowels: oí, oíste, oyó, oímos, oísteis, oyeron."}
          - {w: "oyera", f: "oy- + -era → oír (to hear), imperfect subjunctive (-ra form), he: oyera, oyeras, oyera, oyéramos, oyerais, oyeran. After 'aunque' for an unreal case: 'even if he had heard'."}
          - {w: "volviera, mandara", f: "volv- + -iera → volver (to turn back) and mand- + -ara → mandar (to order), -ra form used as conditional: 'would have turned back', 'if he had ordered'. The -ra form of -er verbs: -iera, -ieras, -iera, -iéramos, -ierais, -ieran; of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran."}
          - {w: "se lo", f: "le (to him) becomes 'se' before 'lo' (it): 'se lo mandara' = had ordered it of him."}
      - es: "Llegó, pues, a la procesión, y paró a Rocinante, que ya llevaba deseo de quietarse un poco, y, con turbada y ronca voz, dijo:"
        literal: "He-arrived, then, at the procession, and he-stopped to Rocinante, who already was-carrying desire of quieting-himself a little, and, with troubled and hoarse voice, he-said:"
        ormsby: "He came up with the procession and reined in Rocinante, who was already anxious enough to slacken speed a little, and in a hoarse, excited voice he exclaimed,"
        vocab:
          - {w: "parar", d: "to stop, rein in (a horse)"}
          - {w: "llevar deseo de", d: "to have a wish to, be longing to"}
          - {w: "quietarse", d: "= aquietarse, to rest, calm down (old form)"}
          - {w: "turbado", d: "agitated, excited"}
          - {w: "ronco", d: "hoarse"}
        diagram:
          - s: "Llegó, pues, a la procesión"
            r: "main verb 1: he reached the procession, then"
          - s: "y paró a Rocinante"
            r: "main verb 2: and he stopped Rocinante"
            under:
              - {s: "que ya llevaba deseo de quietarse un poco", r: "describes 'Rocinante': who was already longing to rest a little"}
          - s: "dijo:"
            r: "main verb 3 (after 'y'): he said"
            under:
              - {s: "con turbada y ronca voz", r: "how: in an excited, hoarse voice"}
        forms:
          - {w: "Llegó, paró", f: "lleg- + -ó → llegar (to arrive) and par- + -ó → parar (to stop), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "a Rocinante", f: "'a' before the object because Rocinante is treated as a person (the personal 'a')."}
          - {w: "llevaba", f: "llev- + -aba → llevar (to carry, have), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "quietarse", f: "quietar (to calm) + se (himself), the pronoun hung on the infinitive after 'de'."}
          - {w: "turbada, ronca", f: "turb- + -ada → turbar (to disturb), participle, and ronc- + -a → ronco (hoarse), both feminine to match 'voz'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
        note: "Even Rocinante's eagerness to stop is a joke: the horse is the only one in the scene who wants peace and quiet."
  - sentences:
      - es: "— Vosotros, que, quizá por no ser buenos, os encubrís los rostros, atended y escuchad lo que deciros quiero."
        literal: "— You, who, perhaps for not being good, yourselves cover the faces, attend and listen-to that which to-tell-you I-want."
        ormsby: "“You who hide your faces, perhaps because you are not good subjects, pay attention and listen to what I am about to say to you.”"
        vocab:
          - {w: "encubrir", d: "to hide, conceal"}
          - {w: "rostro", d: "face"}
          - {w: "atender", d: "to pay attention (false friend: not 'to attend' an event)"}
        diagram:
          - s: "atended y escuchad"
            r: "main verbs: pay attention and listen (you all)"
            under:
              - s: "Vosotros"
                r: "address: you"
                under:
                  - {s: "que, quizá por no ser buenos, os encubrís los rostros", r: "describes 'vosotros': who hide your faces, perhaps because you are not good men"}
              - {s: "lo que deciros quiero", r: "object: what I want to tell you"}
        forms:
          - {w: "os encubrís", f: "encubr- + -ís → encubrir (to hide), present, you (vosotros), with 'os' (yourselves). The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "ser", f: "ser (to be), infinitive after 'por no': 'because of not being'."}
          - {w: "atended, escuchad", f: "atended → atender (to pay attention) and escuchad → escuchar (to listen), imperative, you (vosotros): the final -r of the infinitive becomes -d."}
          - {w: "deciros quiero", f: "quier- + -o → querer (to want), present, I: quiero, quieres, quiere, queremos, queréis, quieren; + decir (to say) + os (to you), the infinitive put first for emphasis; prose order 'quiero deciros'."}
        note: "Penitents in processions wore hoods covering the face so that their penance was anonymous; Don Quijote reads the hoods as the disguise of criminals."
  - sentences:
      - es: "Los primeros que se detuvieron fueron los que la imagen llevaban; y uno de los cuatro clérigos que cantaban las ledanías, viendo la estraña catadura de don Quijote, la flaqueza de Rocinante y otras circunstancias de risa que notó y descubrió en don Quijote, le respondió diciendo:"
        literal: "The first who themselves stopped were those who the image were-carrying; and one of the four clergymen who were-singing the litanies, seeing the strange look of Don Quijote, the leanness of Rocinante and other circumstances of laughter that he-noted and discovered in Don Quijote, to-him responded saying:"
        ormsby: "The first to halt were those who were carrying the image, and one of the four ecclesiastics who were chanting the Litany, struck by the strange figure of Don Quixote, the leanness of Rocinante, and the other ludicrous peculiarities he observed, said in reply to him,"
        vocab:
          - {w: "detenerse", d: "to stop, halt"}
          - {w: "clérigo", d: "cleric, priest"}
          - {w: "ledanías", d: "= letanías, litanies: the chanted prayers of a procession (old popular form)"}
          - {w: "catadura", d: "look, appearance, mien (usually unflattering)"}
          - {w: "flaqueza", d: "thinness, leanness"}
          - {w: "circunstancias de risa", d: "laughable details"}
        diagram:
          - s: "Los primeros"
            r: "subject 1: the first"
            under:
              - {s: "que se detuvieron", r: "describes 'primeros': who stopped"}
              - {s: "fueron los que la imagen llevaban", r: "main verb 1: were those carrying the image"}
          - s: "le respondió diciendo:"
            r: "main verb 2 (after 'y'): answered him, saying"
            under:
              - s: "uno de los cuatro clérigos"
                r: "subject: one of the four clergymen"
                under:
                  - {s: "que cantaban las ledanías", r: "describes 'clérigos': who were chanting the litanies"}
              - s: "viendo la estraña catadura de don Quijote, la flaqueza de Rocinante y otras circunstancias de risa"
                r: "why: seeing Don Quijote's strange look, Rocinante's leanness and other laughable things"
                under:
                  - {s: "que notó y descubrió en don Quijote", r: "describes 'circunstancias': that he noticed in Don Quijote"}
        forms:
          - {w: "se detuvieron", f: "detuv- + -ieron → detenerse (to stop), preterite, they. Irregular like tener (to have): detuve, detuviste, detuvo, detuvimos, detuvisteis, detuvieron."}
          - {w: "fueron", f: "fu- + -eron → ser (to be), preterite, they. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "llevaban, cantaban", f: "llev- + -aban → llevar (to carry) and cant- + -aban → cantar (to sing), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "viendo", f: "gerund of ver (to see): 'seeing'."}
          - {w: "estraña", f: "estrañ- + -a → estraño (strange, old spelling of extraño), feminine to match 'catadura'."}
          - {w: "notó y descubrió", f: "not- + -ó → notar (to note) and descubr- + -ió → descubrir (to discover), preterite, he. Preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron; of -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "diciendo", f: "gerund of decir (to say), stem e turned to i."}
  - sentences:
      - es: "— Señor hermano, si nos quiere decir algo, dígalo presto, porque se van estos hermanos abriendo las carnes, y no podemos, ni es razón que nos detengamos a oír cosa alguna, si ya no es tan breve que en dos palabras se diga."
        literal: "— Sir brother, if to-us you-want to-say something, say-it quickly, because themselves go these brothers opening the flesh, and not we-can, nor is-it reason that ourselves we-stop to hear thing any, if already not it-is so brief that in two words itself it-be-said."
        ormsby: "“Brother, if you have anything to say to us say it quickly, for these brethren are whipping themselves, and we cannot stop, nor is it reasonable we should stop to hear anything, unless indeed it is short enough to be said in two words.”"
        vocab:
          - {w: "hermano", d: "brother; also a member of a religious confraternity, as the penitents are"}
          - {w: "presto", d: "quickly, soon"}
          - {w: "abrirse las carnes", d: "to open up their flesh, i.e. to lash themselves till they bleed"}
          - {w: "ser razón", d: "to be right, reasonable"}
          - {w: "si ya no", d: "unless (old form of 'si no')"}
        diagram:
          - s: "dígalo presto"
            r: "main verb 1: say it quickly"
            under:
              - {s: "Señor hermano", r: "address"}
              - {s: "si nos quiere decir algo", r: "condition: if you want to say something to us"}
              - {s: "porque se van estos hermanos abriendo las carnes", r: "why: because these brothers are lashing their flesh open"}
          - {s: "y no podemos", r: "main verb 2: and we cannot (stop)"}
          - s: "ni es razón"
            r: "main verb 3: nor is it right"
            under:
              - {s: "que nos detengamos a oír cosa alguna", r: "subject: that we stop to hear anything"}
              - s: "si ya no es tan breve"
                r: "condition: unless it is so short"
                under:
                  - {s: "que en dos palabras se diga", r: "result: that it can be said in two words"}
        forms:
          - {w: "quiere", f: "quier- + -e → querer (to want), present, you (vuestra merced, 'he' form). The e of the stem becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "dígalo", f: "dig- + -a + lo → decir (to say), present subjunctive used as a polite command, you, with 'lo' (it) stuck on the end; accent added. diga, digas, diga, digamos, digáis, digan."}
          - {w: "se van ... abriendo", f: "van, from ir (to go), present, they: voy, vas, va, vamos, vais, van; + abriendo, gerund of abrir (to open): ir + gerund = 'are going on opening'. 'se' with 'las carnes' = their own flesh."}
          - {w: "estos", f: "est- + -os → este (this), masculine plural to match 'hermanos'."}
          - {w: "podemos", f: "pod- + -emos → poder (to be able), present, we: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "nos detengamos", f: "deteng- + -amos → detenerse (to stop), present subjunctive, we. Like tener (to have): detenga, detengas, detenga, detengamos, detengáis, detengan. Subjunctive after 'es razón que'."}
          - {w: "alguna", f: "algun- + -a → alguno (any), feminine to match 'cosa'; after the noun in a negative it means 'any at all'."}
          - {w: "se diga", f: "dig- + -a → decir (to say), present subjunctive, it, with 'se' making it passive: 'can be said'. diga, digas, diga, digamos, digáis, digan."}
  - sentences:
