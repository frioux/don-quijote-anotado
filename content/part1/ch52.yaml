  - sentences:
      - es: "Aquí yace el caballero, bien molido y mal andante, a quien llevó Rocinante por uno y otro sendero."
        literal: "Here lies the knight, well ground and badly errant, whom carried Rocinante along one and another path."
        ormsby: "The knight lies here below, / Ill-errant and bruised sore, / Whom Rocinante bore / In his wanderings to and fro."
        vocab:
          - {w: "aquí yace", d: "here lies, the opening formula of epitaphs"}
          - {w: "molido", d: "beaten, bruised black and blue (literally 'ground', like flour)"}
          - {w: "mal andante", d: "unlucky, unfortunate ('malandante'), with a pun on 'caballero andante', knight-errant: a knight who wandered badly"}
          - {w: "por uno y otro sendero", d: "along path after path, everywhere"}
          - {w: "sendero", d: "path, track"}
        diagram:
          - s: "Aquí yace el caballero"
            r: "main verb: here lies the knight"
            under:
              - {s: "bien molido y mal andante", r: "describes 'caballero': well bruised and ill-errant"}
              - s: "a quien llevó Rocinante"
                r: "describes 'caballero': whom Rocinante carried"
                under:
                  - {s: "por uno y otro sendero", r: "where: along one path and another"}
        forms:
          - {w: "yace", f: "yac- + -e → yacer (to lie buried), present, he. yazgo (or yazco), yaces, yace, yacemos, yacéis, yacen."}
          - {w: "molido", f: "participle of moler (to grind), masculine to match 'caballero'."}
          - {w: "andante", f: "present participle of andar (to go, walk), 'walking, errant'; with 'mal' before it, 'unlucky'."}
          - {w: "a quien", f: "'whom', with the personal 'a' because the knight is the object of 'llevó'."}
          - {w: "llevó", f: "llev- + -ó → llevar (to carry), preterite, he (Rocinante). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. The subject comes after the verb."}
        note: "The last two epitaphs are 'redondillas', stanzas of eight-syllable lines rhyming abba, the plainest popular Spanish metre, a drop in register from the sonnets."
      - es: "Sancho Panza el majadero yace también junto a él, escudero el más fïel que vio el trato de escudero."
        literal: "Sancho Panza the dolt lies also next to him, squire the most faithful that saw the trade of squire."
        ormsby: "By the side of the knight is laid / Stolid man Sancho too, / Than whom a squire more true / Was not in the esquire trade."
        vocab:
          - {w: "majadero", d: "dolt, fool, blockhead"}
          - {w: "junto a", d: "next to, beside"}
          - {w: "fïel", d: "faithful; the diaeresis makes it two syllables, fi-el, for the metre"}
          - {w: "trato", d: "trade, occupation; also dealings"}
        diagram:
          - s: "yace también junto a él"
            r: "main verb: lies also beside him"
            under:
              - {s: "Sancho Panza el majadero", r: "subject: Sancho Panza the dolt"}
              - s: "escudero el más fïel"
                r: "describes Sancho: the most faithful squire"
                under:
                  - {s: "que vio el trato de escudero", r: "describes 'escudero': that the squire's trade ever saw"}
        forms:
          - {w: "yace", f: "yac- + -e → yacer (to lie buried), present, he. yazgo (or yazco), yaces, yace, yacemos, yacéis, yacen."}
          - {w: "él", f: "'him' after a preposition (junto a él), standing for the knight."}
          - {w: "el más fïel", f: "article + 'más' + adjective after the noun: the superlative, 'the most faithful'."}
          - {w: "vio", f: "vi- + -o → ver (to see), preterite, it (the trade). ver (to see) in the preterite: vi, viste, vio, vimos, visteis, vieron. The subject 'el trato de escudero' comes after the verb."}
        note: "Sancho is buried alongside his master, though nothing in the story says he has died: the academy kills off everyone. 'Escudero' rhyming with itself (lines 4 and 8 end in 'sendero' and 'escudero') shows the poet's limits."
