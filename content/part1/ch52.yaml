            under:
              - s: "que Sancho Panza"
                r: "what they heard: that Sancho Panza"
                under:
                  - {s: "con lágrimas en los ojos", r: "how: with tears in his eyes"}
                  - {s: "decía:", r: "verb of 'Sancho': was saying"}
        forms:
          - {w: "primer", f: "primero (first) clipped before a masculine singular noun ('cura')."}
          - {w: "dio", f: "di- + -o → dar (to give), preterite, he. Irregular: di, diste, dio, dimos, disteis, dieron."}
          - {w: "al", f: "a + el, 'to the'."}
          - {w: "quién era", f: "quién, with an accent in an indirect question; era → ser (to be), imperfect, he: era, eras, era, éramos, erais, eran."}
          - {w: "fueron a ver", f: "fu- + -eron → ir (to go), preterite, they: fui, fuiste, fue, fuimos, fuisteis, fueron (the same forms as ser, to be); 'ir a' + ver (to see) = went to see."}
