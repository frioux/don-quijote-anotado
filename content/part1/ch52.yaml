          - {w: "recebir", d: "= recibir, to receive (old spelling)"}
          - {w: "grande gusto", d: "great pleasure; 'grande' unclipped before a noun is old usage, modern 'gran gusto'"}
          - {w: "simplicidad", d: "simple-minded remark, naivety"}
