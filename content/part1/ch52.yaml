      - es: "¡Oh humilde con los soberbios y arrogante con los humildes, acometedor de peligros, sufridor de afrentas, enamorado sin causa, imitador de los buenos, azote de los malos, enemigo de los ruines, en fin, caballero andante, que es todo lo que decir se puede!"
        literal: "Oh humble with the proud and arrogant with the humble, attacker of dangers, sufferer of affronts, in-love without cause, imitator of the good, scourge of the bad, enemy of the base, in short, knight errant, which is all that to-say itself can!"
