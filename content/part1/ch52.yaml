          - {w: "destroza, raja", f: "destroz- + -a → destrozar (to smash), raj- + -a → rajar (to split), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "asuela", f: "asuel- + -a → asolar (to raze), present, he, conjugated with the stem change o → ue (asuelo, asuelas, asuela, asolamos, asoláis, asuelan); modern Spanish usually says 'asola'."}
