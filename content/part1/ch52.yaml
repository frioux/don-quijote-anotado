  - sentences:
      - es: "— El que de vos vive ausente, dulcísima Dulcinea, a mayores miserias que éstas está sujeto."
        literal: "— He who from you lives absent, sweetest Dulcinea, to greater miseries than these is subject."
        ormsby: "“He who lives separated from you, sweetest Dulcinea, has greater miseries to endure than these."
        vocab:
          - {w: "ausente de", d: "absent from, far from"}
          - {w: "dulcísimo", d: "sweetest, most sweet"}
          - {w: "sujeto a", d: "subject to, exposed to"}
        diagram:
          - s: "está sujeto"
            r: "main verb: is subject"
            under:
              - s: "El que"
                r: "subject: he who"
                under:
                  - {s: "de vos vive ausente", r: "describes 'El que': lives far from you"}
              - {s: "dulcísima Dulcinea", r: "address: sweetest Dulcinea"}
              - {s: "a mayores miserias que éstas", r: "to what: to greater miseries than these"}
        forms:
          - {w: "vive", f: "viv- + -e → vivir (to live), present, he. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "dulcísima", f: "dulc- + -ísima → dulce (sweet) with the superlative suffix -ísimo ('most sweet'), feminine to match 'Dulcinea'. The pun on 'dulce' and 'Dulcinea' is old and intended."}
          - {w: "mayores", f: "mayor (greater), the irregular comparative of grande (big), plural to match 'miserias'."}
          - {w: "éstas", f: "ésta (this one), feminine plural pronoun for 'miserias'; the old spelling writes the accent on the pronoun."}
          - {w: "está sujeto", f: "est- + -á → estar (to be), present, he: estoy, estás, está, estamos, estáis, están; + sujeto (subject), masculine to match 'El que'. The verb comes last, a poetic word order."}
        note: "Even half-stunned, Don Quijote answers like a lover in the romances: the blow is nothing beside the pain of absence from his lady."
      - es: "Ayúdame, Sancho amigo, a ponerme sobre el carro encantado, que ya no estoy para oprimir la silla de Rocinante, porque tengo todo este hombro hecho pedazos."
        literal: "Help-me, Sancho friend, to put-myself on the cart enchanted, for now not I-am for to-press the saddle of Rocinante, because I-have all this shoulder made pieces."
        ormsby: "Aid me, friend Sancho, to mount the enchanted cart, for I am not in a condition to press the saddle of Rocinante, as this shoulder is all knocked to pieces.”"
        vocab:
          - {w: "carro encantado", d: "the 'enchanted cart', the ox-cart with a cage in which he is being taken home and which he believes is enchanted"}
          - {w: "no estar para", d: "not to be in a state to, not be up to"}
          - {w: "oprimir la silla", d: "to press the saddle, i.e. to ride (a high-flown phrase)"}
          - {w: "hecho pedazos", d: "in pieces, smashed"}
        diagram:
          - s: "Ayúdame"
            r: "main verb: help me"
            under:
              - {s: "Sancho amigo", r: "address: friend Sancho"}
              - {s: "a ponerme sobre el carro encantado", r: "to do what: to get onto the enchanted cart"}
              - s: "que ya no estoy para oprimir la silla de Rocinante"
                r: "why: for I am no longer fit to ride Rocinante"
                under:
                  - {s: "porque tengo todo este hombro hecho pedazos", r: "why: because this whole shoulder of mine is smashed"}
        forms:
          - {w: "Ayúdame", f: "ayud- + -a + me → ayudar (to help), imperative, you (tú): 'help me'. The tú imperative of -ar verbs ends in -a; the pronoun hangs on the end and the accent is written to keep the stress."}
          - {w: "ponerme", f: "poner (to put) + me (myself): 'to put myself', the pronoun hung on the infinitive after 'a'."}
          - {w: "estoy", f: "est- + -oy → estar (to be), present, I: estoy, estás, está, estamos, estáis, están."}
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "hecho", f: "irregular participle of hacer (to make), masculine to match 'hombro': 'tener + noun + participle' = to have it in that state."}
          - {w: "este", f: "este (this), masculine singular to match 'hombro'."}
  - sentences:
      - es: "— Eso haré yo de muy buena gana, señor mío —respondió Sancho—, y volvamos a mi aldea en compañía destos señores, que su bien desean, y allí daremos orden de hacer otra salida que nos sea de más provecho y fama."
        literal: "— That I-will-do I of very good will, sir mine —answered Sancho—, and let-us-return to my village in company of-these gentlemen, who your good desire, and there we-will-give order of making another sally that to-us may-be of more profit and fame."
        ormsby: "“That I will do with all my heart, señor,” said Sancho; “and let us return to our village with these gentlemen, who seek your good, and there we will prepare for making another sally, which may turn out more profitable and creditable to us.”"
        vocab:
          - {w: "de buena gana", d: "willingly, gladly"}
          - {w: "destos", d: "= de estos, of these (old contraction)"}
          - {w: "dar orden de", d: "to arrange, make arrangements for"}
          - {w: "salida", d: "sally, expedition (Don Quijote's outings from home)"}
          - {w: "provecho", d: "profit, benefit"}
        diagram:
          - s: "Eso haré yo"
            r: "main verb 1: that I will do"
            under:
              - {s: "de muy buena gana", r: "how: very gladly"}
              - {s: "señor mío", r: "address: my lord"}
          - {s: "respondió Sancho", r: "speech tag: answered Sancho"}
          - s: "volvamos a mi aldea"
            r: "main verb 2 (after 'y'): let us go back to my village"
            under:
              - s: "en compañía destos señores"
                r: "how: with these gentlemen"
                under:
                  - {s: "que su bien desean", r: "describes 'señores': who wish your good"}
          - s: "allí daremos orden de hacer otra salida"
            r: "main verb 3 (after 'y'): there we will arrange another sally"
            under:
              - {s: "que nos sea de más provecho y fama", r: "describes 'salida': that may bring us more profit and fame"}
        forms:
          - {w: "haré", f: "har- + -é → hacer (to do), future, I. Irregular stem har-: haré, harás, hará, haremos, haréis, harán."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "volvamos", f: "volv- + -amos → volver (to return), present subjunctive, we: 'let us go back'. The present subjunctive of -er verbs: -a, -as, -a, -amos, -áis, -an (the stem stays volv- in the 'we' form: vuelva, vuelvas, vuelva, volvamos, volváis, vuelvan)."}
          - {w: "destos", f: "de + estos (these), masculine plural to match 'señores'; modern Spanish writes 'de estos'."}
          - {w: "desean", f: "dese- + -an → desear (to desire), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. The object 'su bien' comes before the verb."}
          - {w: "daremos", f: "dar- + -emos → dar (to give), future, we. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "sea", f: "ser (to be), present subjunctive, it: sea, seas, sea, seamos, seáis, sean. Subjunctive because the sally is still only wished for."}
  - sentences:
      - es: "— Bien dices, Sancho —respondió don Quijote—, y será gran prudencia dejar pasar el mal influjo de las estrellas que agora corre."
