          - s: "¡Oh vanas esperanzas"
            r: "exclamation, no verb: oh vain hopes"
            under:
              - {s: "de la gente!", r: "whose: of people"}
        forms:
          - {w: "vanas", f: "van- + -as → vano (vain), feminine plural to match 'esperanzas', placed before the noun for emphasis."}
        note: "The last tercet switches suddenly to a moral lament on human hopes, a standard ending for serious sonnets, here pinned to Sancho's lost earldom."
      - es: "¡Cómo pasais con prometer descanso, Y al fin parais en sombra, en humo, en sueño!"
        literal: "How you-pass-by with promising rest, And at-the end you-end-up in shadow, in smoke, in dream!"
        ormsby: "With promises of ease, the heart’s desire, / In shadows, dreams, and smoke ye always end."
        ormsby_match: false
        vocab:
          - {w: "pasar", d: "here 'to pass away, go by'"}
          - {w: "descanso", d: "rest, ease"}
          - {w: "al fin", d: "in the end"}
          - {w: "parar en", d: "to end up in, come to"}
          - {w: "sombra, humo, sueño", d: "shadow, smoke, dream: the classic images of the emptiness of life"}
        diagram:
          - s: "¡Cómo pasais"
            r: "main verb 1: how you pass away (addressed to the hopes)"
            under:
              - {s: "con prometer descanso", r: "how: while promising rest"}
          - s: "Y al fin parais"
            r: "main verb 2: and in the end you come to"
            under:
              - {s: "en sombra, en humo, en sueño!", r: "in what: shadow, smoke and dream"}
        forms:
          - {w: "pasais, parais", f: "pas- + -áis → pasar (to pass) and par- + -áis → parar (to end up), present, you (vosotros, the hopes); Gutenberg prints them without the accent, modern 'pasáis', 'paráis'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "con prometer", f: "prometer (to promise), infinitive after 'con': 'with promising', i.e. 'while you promise'."}
          - {w: "al", f: "a + el, 'at the'."}
        note: "The final line recalls the close of Góngora's sonnet 'Mientras por competir con tu cabello' ('en tierra, en humo, en polvo, en sombra, en nada'), or the common stock both drew on; the bathos is in applying it to a squire who missed his earldom."
