        forms:
          - {w: "pide", f: "pid- + -e → pedir (to ask), present, he. The e of the stem becomes i when stressed: pido, pides, pide, pedimos, pedís, piden."}
          - {w: "leyeren", f: "ley- + -eren → leer (to read), future subjunctive, they: 'whoever may read it'. The future subjunctive of -er and -ir verbs: -iere, -ieres, -iere, -iéremos, -iereis, -ieren (the i turns to y between vowels: leyere). Cervantes uses it after 'los que' for an open future; modern Spanish uses the present subjunctive 'lean'."}
          - {w: "costó", f: "cost- + -ó → costar (to cost), preterite, it. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "sacarla", f: "sacar (to take out) + la (it, the history), the pronoun hung on the infinitive after 'por'."}
          - {w: "den", f: "d- + -en → dar (to give), present subjunctive, they, after 'pide que' (asks that). dar (to give) in the present subjunctive: dé, des, dé, demos, deis, den."}
          - {w: "suelen", f: "suel- + -en → soler (to be in the habit of), present, they. The stem o becomes ue when stressed: suelo, sueles, suele, solemos, soléis, suelen. Followed by the infinitive 'dar'."}
