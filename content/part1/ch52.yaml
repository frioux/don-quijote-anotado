          - {w: "presidir", d: "to preside over"}
          - {w: "dél", d: "= de él, of him (old contraction)"}
          - {w: "la alta Mancha", d: "lofty La Mancha: an absurd epithet for a famously flat plain"}
        diagram:
          - s: "hoy a Quijote le corona el aula"
