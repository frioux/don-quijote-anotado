          - {w: "bien dices", d: "you are right, well said"}
          - {w: "influjo", d: "influence, especially of the stars on human affairs (astrology)"}
          - {w: "agora", d: "= ahora, now (old form)"}
          - {w: "correr", d: "here 'to be current, prevail'"}
