  - sentences:
      - es: "Reposa aquí Dulcinea; y, aunque de carnes rolliza, la volvió en polvo y ceniza la muerte espantable y fea."
        literal: "Rests here Dulcinea; and, although of flesh plump, her turned into dust and ash the death frightful and ugly."
        ormsby: "Here Dulcinea lies. / Plump was she and robust: / Now she is ashes and dust: / The end of all flesh that dies."
        ormsby_match: false
        vocab:
          - {w: "reposar", d: "to rest, lie (in the grave)"}
          - {w: "de carnes rolliza", d: "plump, well-fleshed, chubby"}
          - {w: "volver en", d: "to turn into"}
          - {w: "polvo y ceniza", d: "dust and ashes, the biblical phrase for mortality"}
          - {w: "espantable", d: "frightful, dreadful (old form of 'espantoso')"}
        diagram:
          - s: "Reposa aquí Dulcinea"
            r: "main verb 1: here rests Dulcinea"
          - s: "la volvió en polvo y ceniza"
            r: "main verb 2 (after 'y'): turned her into dust and ashes"
            under:
              - {s: "aunque de carnes rolliza", r: "concession: although (she was) plump of flesh"}
              - {s: "la muerte espantable y fea", r: "subject: frightful, ugly death"}
        forms:
          - {w: "Reposa", f: "repos- + -a → reposar (to rest), present, she. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "rolliza", f: "rolliz- + -a → rollizo (plump), feminine to match Dulcinea."}
          - {w: "la volvió", f: "volv- + -ió → volver (to turn), preterite, it (death), with 'la' (her) before it. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron. The subject 'la muerte' comes last."}
          - {w: "espantable, fea", f: "espantable (frightful) has one form for both genders; fe- + -a → feo (ugly), feminine to match 'muerte'."}
        note: "'Plump' is no compliment in a lady's epitaph: the poem keeps describing Dulcinea as the sturdy peasant girl Aldonza Lorenzo."
      - es: "Fue de castiza ralea, y tuvo asomos de dama; del gran Quijote fue llama, y fue gloria de su aldea."
        literal: "She-was of pure-bred stock, and she-had hints of lady; of-the great Quijote she-was flame, and she-was glory of her village."
        ormsby: "A lady of high degree, / With the port of a lofty dame, / And the great Don Quixote’s flame, / And the pride of her village was she."
        ormsby_match: false
        vocab:
          - {w: "castizo", d: "pure-bred, of good old stock"}
          - {w: "ralea", d: "breed, stock, ilk: a disparaging word, used of animals or low people, so 'castiza ralea' is a comic mix"}
          - {w: "asomos", d: "hints, traces, signs"}
          - {w: "llama", d: "flame; in love poetry, the beloved who inflames the lover"}
          - {w: "aldea", d: "village"}
        diagram:
          - s: "Fue de castiza ralea"
            r: "main verb 1: she was of pure stock"
          - {s: "y tuvo asomos de dama", r: "main verb 2: and she had traces of a lady"}
          - s: "del gran Quijote fue llama"
            r: "main verb 3: she was the flame of the great Quijote"
          - {s: "y fue gloria de su aldea", r: "main verb 4: and she was the glory of her village"}
        forms:
          - {w: "Fue", f: "ser (to be), preterite, she. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "castiza", f: "castiz- + -a → castizo (pure-bred), feminine to match 'ralea'."}
          - {w: "tuvo", f: "tuv- + -o → tener (to have), preterite, she. Irregular: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron."}
          - {w: "del gran", f: "del = de + el; gran = grande (great) clipped before a singular noun ('Quijote')."}
        note: "'Traces of a lady' is faint praise: Dulcinea only resembles a lady. Being 'the glory of her village' shrinks the peerless princess of Don Quijote's imagination to a local beauty."
  - sentences:
      - es: "Éstos fueron los versos que se pudieron leer; los demás, por estar carcomida la letra, se entregaron a un académico para que por conjeturas los declarase."
        literal: "These were the verses that themselves could read; the rest, for being worm-eaten the lettering, themselves handed-over to an academician so that by conjectures them he-might-explain."
        ormsby: "These were all the verses that could be deciphered; the rest, the writing being worm-eaten, were handed over to one of the Academicians to make out their meaning conjecturally."
        vocab:
          - {w: "los demás", d: "the rest, the others"}
          - {w: "carcomido", d: "worm-eaten, eaten away (by woodworm, 'carcoma')"}
          - {w: "la letra", d: "the writing, the lettering"}
          - {w: "entregar", d: "to hand over"}
          - {w: "por conjeturas", d: "by guesswork, conjecturally"}
          - {w: "declarar", d: "here 'to explain, interpret, make out' (not 'declare')"}
        diagram:
          - s: "Éstos fueron los versos"
            r: "main verb 1: these were the verses"
            under:
              - {s: "que se pudieron leer", r: "describes 'versos': that could be read"}
          - s: "los demás ... se entregaron a un académico"
            r: "main verb 2: the rest were handed over to an academician"
            under:
              - {s: "por estar carcomida la letra", r: "why: because the writing was worm-eaten"}
              - {s: "para que por conjeturas los declarase", r: "purpose: so that he might make them out by guesswork"}
        forms:
          - {w: "Éstos", f: "est- + -os → este (this), masculine plural pronoun to match 'versos'; the old spelling puts an accent on the pronoun."}
          - {w: "fueron", f: "ser (to be), preterite, they. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "se pudieron leer", f: "pud- + -ieron → poder (to be able), preterite, they, + the infinitive leer (to read), with 'se' making it passive: 'could be read'. poder (to be able) in the preterite: pude, pudiste, pudo, pudimos, pudisteis, pudieron."}
          - {w: "por estar carcomida", f: "estar (to be), infinitive after 'por' (because of), + carcomida, participle of carcomer (to eat away), feminine to match 'la letra', the subject placed after."}
          - {w: "se entregaron", f: "entreg- + -aron → entregar (to hand over), preterite, they, with 'se' making it passive: 'were handed over'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "declarase", f: "declar- + -ase → declarar (to explain), imperfect subjunctive (-se form), he, after 'para que' (so that). The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
        note: "Interpreting a damaged text 'by conjecture' parodies the work of humanist scholars restoring ancient manuscripts."
      - es: "Tiénese noticia que lo ha hecho, a costa de muchas vigilias y mucho trabajo, y que tiene intención de sacallos a luz, con esperanza de la tercera salida de don Quijote."
        literal: "Has-itself news that it he-has done, at cost of many sleepless-nights and much labor, and that he-has intention of bringing-them to light, with hope of the third sally of Don Quijote."
