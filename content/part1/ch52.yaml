      - es: "Nunca sus glorias el olvido mancha, pues hasta Rocinante, en ser gallardo, excede a Brilladoro y a Bayardo."
        literal: "Never his glories the oblivion stains, since even Rocinante, in being gallant, exceeds [to] Brilladoro and [to] Bayardo."
        ormsby: "Nor ends his glory here, for his good steed / Doth Brillador and Bayard far exceed; / As mettled steeds compared with Rocinante, / The reputation they have won is scanty."
        ormsby_match: false
        ormsby_note: "Brillador was Orlando's horse; Bayard, Rinaldo's: \"Ouel Brigliador si bello e si gagliardo / Che non ha paragon, fuorche Baiardo.\" Orlando Furtoso, IX 60"
        vocab:
          - {w: "glorias", d: "glories, glorious deeds"}
          - {w: "olvido", d: "oblivion, forgetting"}
          - {w: "manchar", d: "to stain; a pun on 'la Mancha' (the stain) in the line before"}
          - {w: "hasta", d: "here 'even'"}
          - {w: "gallardo", d: "gallant, fine, handsome"}
          - {w: "exceder a", d: "to surpass, outdo"}
          - {w: "Brilladoro", d: "Brigliadoro, Orlando's horse in Ariosto's Orlando Furioso"}
          - {w: "Bayardo", d: "Bayard (Baiardo), the magic horse of Rinaldo de Montalbán in the Carolingian romances"}
        diagram:
          - s: "Nunca sus glorias el olvido mancha"
            r: "main verb: oblivion never stains his glories"
            under:
              - s: "pues hasta Rocinante"
                r: "why: since even Rocinante"
                under:
                  - {s: "en ser gallardo", r: "in what: in being gallant"}
                  - {s: "excede a Brilladoro y a Bayardo", r: "verb of 'Rocinante': outdoes Brigliadoro and Bayard"}
        forms:
          - {w: "mancha", f: "manch- + -a → manchar (to stain), present, it (oblivion). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. The object 'sus glorias' comes first, a poetic inversion."}
          - {w: "sus glorias", f: "sus = plural to match 'glorias', not the owner; 'his glories'."}
          - {w: "ser", f: "infinitive of ser (to be) after 'en': 'in being'."}
          - {w: "excede", f: "exced- + -e → exceder (to surpass), present, he (Rocinante). The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "a Brilladoro y a Bayardo", f: "the personal 'a' before the horses' names, as if they were persons."}
        note: "These three lines are the 'estrambote', a tail added to a fourteen-line sonnet, common in burlesque verse. Ormsby's version adds a couplet of his own invention ('As mettled steeds compared with Rocinante, / The reputation they have won is scanty') that has no equivalent in the Spanish."
