          - {w: "andante caballero", d: "knight-errant, with the words in reverse order for the metre"}
          - {w: "en tiernos años", d: "in tender years, young"}
          - {w: "dejar de", d: "to stop, cease to"}
          - {w: "mármores", d: "= mármoles, marbles, marble tombs (old form)"}
          - {w: "huir de", d: "to flee from, escape"}
          - {w: "iras", d: "wraths, fits of anger"}
          - {w: "engaños", d: "deceits, tricks"}
        diagram:
          - s: "Culpa de Rocinante"
            r: "main clause 1, no verb: (it was) Rocinante's fault"
            under:
              - {s: "¡oh dura estrella!", r: "exclamation: oh cruel fate"}
              - s: "que esta manchega dama, y este invito andante caballero"
                r: "what was his fault: that this lady of La Mancha and this unconquered knight-errant"
                under:
                  - {s: "en tiernos años", r: "when: in their tender years"}
                  - {s: "ella dejó, muriendo, de ser bella", r: "she, dying, ceased to be beautiful"}
          - s: "no pudo huir de amor, iras y engaños"
            r: "main verb 2: (and he) could not escape love, rages and deceits"
            under:
              - {s: "y él", r: "subject: and he"}
              - {s: "aunque queda en mármores escrito", r: "concession: although he remains written in marble"}
        forms:
          - {w: "esta manchega dama", f: "est- + -a → este (this), mancheg- + -a → manchego (of La Mancha), feminine to match 'dama'."}
          - {w: "este invito andante", f: "este (this), invito (unconquered), masculine to match 'caballero'; andante is the present participle of andar (to go, walk), 'walking, errant'."}
          - {w: "tiernos", f: "tiern- + -os → tierno (tender), masculine plural to match 'años'."}
          - {w: "dejó", f: "dej- + -ó → dejar (to stop), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "muriendo", f: "gerund of morir (to die): the o of the stem becomes u in the gerund, 'dying'."}
          - {w: "bella", f: "bell- + -a → bello (beautiful), feminine to match 'ella'."}
          - {w: "queda", f: "qued- + -a → quedar (to remain), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "escrito", f: "irregular participle of escribir (to write), masculine to match 'él'."}
          - {w: "pudo huir", f: "pud- + -o → poder (to be able), preterite, he, + the infinitive huir (to flee). poder (to be able) in the preterite: pude, pudiste, pudo, pudimos, pudisteis, pudieron."}
        note: "Blaming the horse for the lovers' fate is the nonsense of the sestet, which jumbles the syntax with a dangling 'que' and a sudden 'ella', a deliberate mock of overwrought sonnets. Dulcinea's death, like Don Quijote's, is the academy's invention."
