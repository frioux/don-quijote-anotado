          - {s: "y es ésta:", r: "main verb 2: and it is this"}
        forms:
          - {w: "diré", f: "dir- + -é → decir (to say), future, I. Irregular stem dir-: diré, dirás, dirá, diremos, diréis, dirán."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "una, ésta", f: "feminine to match the understood 'palabra' (word); 'ésta' with the accent is the pronoun 'this one'."}
