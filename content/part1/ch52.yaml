                under:
                  - {s: "y con ellos los cuadrilleros con sus ballestas", r: "also seen: and with them the troopers with their crossbows"}
              - {s: "temieron algún mal suceso", r: "main verb 1: feared some mischief"}
              - s: "y hiciéronse todos un remolino"
                r: "main verb 2: and all crowded into a swirl"
                under:
                  - {s: "alrededor de la imagen", r: "where: around the image"}
