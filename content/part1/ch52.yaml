            r: "main verb 1: the first priest gave the second"
            under:
              - {s: "en dos razones", r: "how: in a few words"}
              - {s: "cuenta de quién era don Quijote", r: "object: an account of who Don Quijote was"}
          - s: "y así él como toda la turba de los diciplinantes fueron a ver"
            r: "main verb 2: and both he and the whole crowd of flagellants went to see"
            under:
