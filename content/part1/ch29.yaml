        forms:
          - {w: "Dichosa, dichoso", f: "dichos- + -a / -o → dichoso (lucky), feminine to match 'buscada', masculine to match 'hallazgo'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "desfaga", f: "desfag- + -a → desfacer (= deshacer, to undo), present subjunctive, he. Subjunctive after 'tan ... que' expressing a hoped-for result. Modern 'deshaga': deshaga, deshagas, deshaga, deshagamos, deshagáis, deshagan."}
          - {w: "enderece", f: "endere- + -ce → enderezar (to straighten), present subjunctive, he; z becomes c before e. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
