part: 1
chapter: 29
title_es: "Capítulo XXIX. Que trata de la discreción de la hermosa Dorotea, con otras cosas de mucho gusto y pasatiempo"
title_en: "Which treats of the droll device and method adopted to extricate our love-stricken knight from the severe penance he had imposed upon himself"
paragraphs:
  - sentences:
      - es: "— Esta es, señores, la verdadera historia de mi tragedia:"
        literal: "— This is, sirs, the true story of my tragedy:"
        ormsby: "“Such, sirs, is the true story of my sad adventures;"
        vocab:
          - {w: "señores", d: "sirs, gentlemen: Dorotea addresses the curate, the barber and Cardenio together"}
          - {w: "tragedia", d: "tragedy; here her whole sad story, which she has just finished telling"}
        diagram:
          - s: "Esta es"
            r: "main verb: this is"
            under:
              - {s: "señores", r: "who she speaks to: sirs"}
              - {s: "la verdadera historia de mi tragedia", r: "what this is: the true story of my tragedy"}
        forms:
          - {w: "Esta", f: "est- + -a → este (this), feminine to match 'historia'; used alone as a pronoun: 'this [story]'. Modern spelling often writes it 'ésta' when it stands alone."}
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "verdadera", f: "verdader- + -a → verdadero (true), feminine to match 'historia', placed before the noun."}
        note: "Dorotea has just told the curate, the barber and Cardenio how Don Fernando seduced her under promise of marriage and then abandoned her to marry Luscinda. She ran away from home dressed as a boy."
      - es: "mirad y juzgad ahora si los suspiros que escuchastes, las palabras que oístes y las lágrimas que de mis ojos salían, tenían ocasión bastante para mostrarse en mayor abundancia;"
        literal: "look and judge now if the sighs that you-heard, the words that you-heard and the tears that from my eyes came-out, had cause sufficient for showing-themselves in greater abundance;"
        ormsby: "judge for yourselves now whether the sighs and lamentations you heard, and the tears that flowed from my eyes, had not sufficient cause even if I had indulged in them more freely;"
        vocab:
          - {w: "juzgar", d: "to judge"}
          - {w: "suspiro", d: "sigh"}
          - {w: "escuchastes", d: "= escuchasteis, 'you (plural) heard'; old form of the vosotros preterite"}
          - {w: "oístes", d: "= oísteis, 'you (plural) heard'; same old vosotros preterite"}
          - {w: "ocasión", d: "cause, reason (not only 'occasion')"}
          - {w: "bastante", d: "sufficient, enough"}
          - {w: "en mayor abundancia", d: "more abundantly, in greater quantity"}
        diagram:
          - s: "mirad y juzgad ahora"
            r: "main verbs: look and judge now (commands to you all)"
            under:
              - s: "si los suspiros"
                r: "what to judge: whether the sighs"
                under:
                  - {s: "que escuchastes", r: "describes 'suspiros': that you heard"}
              - s: "las palabras"
                r: "subject 2: the words"
                under:
                  - {s: "que oístes", r: "describes 'palabras': that you heard"}
              - s: "y las lágrimas"
                r: "subject 3: and the tears"
                under:
                  - {s: "que de mis ojos salían", r: "describes 'lágrimas': that came from my eyes"}
              - s: "tenían ocasión bastante"
                r: "their verb: had enough reason"
                under:
                  - {s: "para mostrarse en mayor abundancia", r: "for what: to show themselves even more"}
        forms:
          - {w: "mirad, juzgad", f: "mir- + -ad → mirar (to look), jug- + -ad → juzgar (to judge): command to you all (vosotros). The vosotros command drops the -r of the infinitive and adds -d: mirad, juzgad, comed, venid."}
          - {w: "escuchastes", f: "escuch- + -astes → escuchar (to hear), preterite, you all. Cervantes' form of the vosotros preterite; modern 'escuchasteis'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -astes (now -asteis), -aron."}
          - {w: "oístes", f: "o- + -ístes → oír (to hear), preterite, you all; modern 'oísteis'. oír in the preterite: oí, oíste, oyó, oímos, oísteis, oyeron."}
          - {w: "salían", f: "sal- + -ían → salir (to come out), imperfect, they (the tears). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "tenían", f: "ten- + -ían → tener (to have), imperfect, they (sighs, words and tears). Same -ía imperfect."}
          - {w: "mostrarse", f: "mostrar (to show) + se (themselves), infinitive after 'para'."}
          - {w: "mayor", f: "comparative of grande (great): 'greater', one form for both genders."}
      - es: "y, considerada la calidad de mi desgracia, veréis que será en vano el consuelo, pues es imposible el remedio della."
        literal: "and, considered the quality of my misfortune, you-will-see that it-will-be in vain the consolation, since is impossible the remedy of-it."
        ormsby: "and if you consider the nature of my misfortune you will see that consolation is idle, as there is no possible remedy for it."
        vocab:
          - {w: "considerada la calidad", d: "absolute participle: 'the nature being considered' = when you consider the nature"}
          - {w: "calidad", d: "nature, kind (here not 'quality' in the sense of excellence)"}
          - {w: "desgracia", d: "misfortune (a false friend: not 'disgrace')"}
          - {w: "en vano", d: "in vain, useless"}
          - {w: "consuelo", d: "consolation, comfort"}
          - {w: "della", d: "= de ella, 'of it'; Cervantes fuses 'de' with él, ella, este (dél, della, deste)"}
        diagram:
          - {s: "considerada la calidad de mi desgracia", r: "when: once you consider the nature of my misfortune"}
          - s: "veréis"
            r: "main verb (after 'y'): you will see"
            under:
              - s: "que será en vano el consuelo"
                r: "what you will see: that consolation will be in vain"
                under:
                  - {s: "pues es imposible el remedio della", r: "why: since a cure for it is impossible"}
        forms:
          - {w: "considerada", f: "participle of considerar (to consider), feminine to match 'calidad'. An absolute participle: the phrase 'considerada la calidad' stands on its own, like Latin's ablative absolute."}
          - {w: "veréis", f: "ver + -éis → ver (to see), future, you all. The future is the infinitive + -é, -ás, -á, -emos, -éis, -án."}
          - {w: "será", f: "ser + -á → ser (to be), future, it. Same future endings: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "della", f: "de + ella (of it, the misfortune)."}
      - es: "Sólo os ruego (lo que con facilidad podréis y debéis hacer) que me aconsejéis dónde podré pasar la vida sin que me acabe el temor y sobresalto que tengo de ser hallada de los que me buscan;"
        literal: "Only you I-beg (that which with ease you-will-be-able and you-ought to-do) that me you-advise where I-will-be-able to-pass the life without that me may-finish the fear and alarm that I-have of being found by those who me seek;"
        ormsby: "All I ask of you is, what you may easily and reasonably do, to show me where I may pass my life unharassed by the fear and dread of discovery by those who are in search of me;"
        vocab:
          - {w: "rogar", d: "to beg, ask; 'os ruego' = I beg you"}
          - {w: "con facilidad", d: "easily"}
          - {w: "aconsejar", d: "to advise"}
          - {w: "sobresalto", d: "sudden fright, alarm, start"}
          - {w: "acabar", d: "to finish; here 'to finish off, kill': without fear being the death of me"}
          - {w: "ser hallada de", d: "to be found by; old Spanish uses 'de' for the doer of a passive where modern Spanish uses 'por'"}
        diagram:
          - s: "Sólo os ruego"
            r: "main verb: I only beg you"
            under:
              - {s: "(lo que con facilidad podréis y debéis hacer)", r: "aside: something you can easily do and ought to do"}
              - s: "que me aconsejéis"
                r: "what I beg: that you advise me"
                under:
                  - s: "dónde podré pasar la vida"
                    r: "on what: where I can spend my life"
                    under:
                      - s: "sin que me acabe el temor y sobresalto"
                        r: "how: without the fear and alarm killing me"
                        under:
                          - {s: "que tengo de ser hallada de los que me buscan", r: "describes 'temor': that I have of being found by those who seek me"}
        forms:
          - {w: "os", f: "'you' (plural, object), for vosotros. Dorotea speaks to the three men together."}
          - {w: "ruego", f: "rueg- + -o → rogar (to beg), present, I. The stem o becomes ue when stressed: ruego, ruegas, ruega, rogamos, rogáis, ruegan."}
          - {w: "podréis", f: "podr- + -éis → poder (to be able), future, you all. poder shortens its stem in the future: podré, podrás, podrá, podremos, podréis, podrán."}
          - {w: "debéis", f: "deb- + -éis → deber (ought, must), present, you all. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "aconsejéis", f: "aconsej- + -éis → aconsejar (to advise), present subjunctive, you all. Subjunctive because it is what I beg ('ruego que'). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "podré", f: "podr- + -é → poder (to be able), future, I. podré, podrás, podrá, podremos, podréis, podrán."}
          - {w: "acabe", f: "acab- + -e → acabar (to finish), present subjunctive, it (the fear). Subjunctive after 'sin que' (without). Same -e subjunctive: -e, -es, -e, -emos, -éis, -en."}
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "hallada", f: "participle of hallar (to find), feminine because the speaker is a woman: 'ser hallada' = to be found."}
          - {w: "buscan", f: "busc- + -an → buscar (to look for), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
      - es: "que, aunque sé que el mucho amor que mis padres me tienen me asegura que seré dellos bien recebida, es tanta la vergüenza que me ocupa sólo el pensar que, no como ellos pensaban, tengo de parecer a su presencia, que tengo por mejor desterrarme para siempre de ser vista que no verles el rostro, con pensamiento que ellos miran el mío ajeno de la honestidad que de mí se debían de tener prometida."
        literal: "for, although I-know that the much love that my parents me have me assures that I-will-be by-them well received, is so-great the shame that me fills only the thinking that, not as they thought, I-have to appear at their presence, that I-hold for better to-banish-myself for ever from being seen than not to-see-them the face, with thought that they look-at the mine alien from the chastity that from me they must have promised [to themselves]."
        ormsby: "for though the great love my parents bear me makes me feel sure of being kindly received by them, so great is my feeling of shame at the mere thought that I cannot present myself before them as they expect, that I had rather banish myself from their sight forever than look them in the face with the reflection that they beheld mine stripped of that purity they had a right to expect in me.”"
        vocab:
          - {w: "asegurar", d: "to assure, make certain"}
          - {w: "recebida", d: "= recibida, 'received'; recebir is the old spelling of recibir"}
          - {w: "vergüenza", d: "shame"}
          - {w: "ocupar", d: "to fill, take hold of (a feeling)"}
          - {w: "tener de", d: "= tener que, to have to; 'tengo de parecer' = I must appear"}
          - {w: "parecer a su presencia", d: "to appear before them, come into their presence ('parecer' here = 'aparecer')"}
          - {w: "tener por mejor", d: "to think it better, prefer"}
          - {w: "desterrarse", d: "to exile oneself, go into exile"}
          - {w: "rostro", d: "face"}
          - {w: "ajeno de", d: "lacking, stripped of, a stranger to"}
          - {w: "honestidad", d: "chastity, modesty (a false friend: not 'honesty')"}
          - {w: "deber de", d: "must (probability): 'they must have'"}
        diagram:
          - s: "es tanta la vergüenza"
            r: "main verb: so great is the shame"
            under:
              - s: "aunque sé"
                r: "concession: although I know"
                under:
                  - s: "que el mucho amor ... me asegura"
                    r: "what I know: that the great love assures me"
                    under:
                      - {s: "que mis padres me tienen", r: "describes 'amor': that my parents have for me"}
                      - {s: "que seré dellos bien recebida", r: "what it assures me of: that I will be well received by them"}
              - s: "que me ocupa sólo el pensar"
                r: "describes 'vergüenza': that the mere thought fills me with"
                under:
                  - {s: "que, no como ellos pensaban, tengo de parecer a su presencia", r: "what I think: that I must come before them not as they believed me to be"}
              - s: "que tengo por mejor desterrarme para siempre de ser vista"
                r: "result of 'tanta': that I think it better to exile myself forever from being seen"
                under:
                  - s: "que no verles el rostro"
                    r: "comparison: than to see their faces"
                    under:
                      - s: "con pensamiento que ellos miran el mío"
                        r: "how: with the thought that they look at mine"
                        under:
                          - s: "ajeno de la honestidad"
                            r: "describes 'el mío': stripped of the chastity"
                            under:
                              - {s: "que de mí se debían de tener prometida", r: "describes 'honestidad': that they must have expected of me"}
        forms:
          - {w: "sé", f: "saber (to know), present, I. Irregular: sé, sabes, sabe, sabemos, sabéis, saben. The accent tells it from 'se'."}
          - {w: "mucho amor", f: "mucho (much) before a noun with the article ('el mucho amor'): 'the great love'. An old construction: modern Spanish says 'el gran amor'."}
          - {w: "tienen", f: "tien- + -en → tener (to have), present, they. tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "asegura", f: "asegur- + -a → asegurar (to assure), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "seré", f: "ser + -é → ser (to be), future, I. The future is the infinitive + -é, -ás, -á, -emos, -éis, -án."}
          - {w: "dellos", f: "de + ellos (by them), with 'de' marking the doer of the passive."}
          - {w: "recebida", f: "participle of recebir (= recibir, to receive), feminine because Dorotea is speaking."}
          - {w: "tanta", f: "tant- + -a → tanto (so much), feminine to match 'vergüenza'. 'tanto ... que' = so much ... that."}
          - {w: "el pensar", f: "an infinitive with the article used as a noun: 'the thinking, the thought'."}
          - {w: "pensaban", f: "pens- + -aban → pensar (to think), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "desterrarme", f: "desterrar (to exile) + me (myself), the pronoun hung on the end of the infinitive."}
          - {w: "vista", f: "participle of ver (to see), irregular (visto), feminine because Dorotea speaks: 'ser vista' = to be seen."}
          - {w: "verles", f: "ver (to see) + les (to them, their): 'verles el rostro' = to see their face. Spanish uses an indirect pronoun plus the article where English uses 'their'."}
          - {w: "miran", f: "mir- + -an → mirar (to look at), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "el mío", f: "'mine', masculine to match the understood 'rostro' (face)."}
          - {w: "debían", f: "deb- + -ían → deber (must), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "prometida", f: "participle of prometer (to promise), feminine to match 'honestidad': 'tener prometida' = to have promised to oneself, to expect. With 'tener' the participle agrees with the object."}
  - sentences:
      - es: "Calló en diciendo esto, y el rostro se le cubrió de un color que mostró bien claro el sentimiento y vergüenza del alma."
        literal: "She-fell-silent on saying this, and the face itself to-her covered with a color that showed well clear the feeling and shame of-the soul."
        ormsby: "With these words she became silent, and the colour that overspread her face showed plainly the pain and shame she was suffering at heart."
        vocab:
          - {w: "callar", d: "to fall silent, stop talking"}
          - {w: "en diciendo", d: "'en' + gerund: as soon as, on (doing); 'en diciendo esto' = as soon as she said this"}
          - {w: "cubrirse de un color", d: "to flush, blush ('color' here = the red of shame)"}
          - {w: "sentimiento", d: "grief, pain (here not just 'feeling')"}
        diagram:
          - s: "Calló"
            r: "main verb 1: she fell silent"
            under:
              - {s: "en diciendo esto", r: "when: as soon as she said this"}
          - s: "el rostro se le cubrió de un color"
            r: "main verb 2 (after 'y'): her face was covered with a color"
            under:
              - {s: "que mostró bien claro el sentimiento y vergüenza del alma", r: "describes 'color': which clearly showed the grief and shame in her soul"}
        forms:
          - {w: "Calló", f: "call- + -ó → callar (to fall silent), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "diciendo", f: "gerund of decir (to say): the e of the stem turns to i (decir → diciendo)."}
          - {w: "se le cubrió", f: "cubr- + -ió → cubrirse (to be covered), preterite, it (the face). The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron. 'le' = on her: Spanish marks the owner of a body part with an indirect pronoun ('her face')."}
          - {w: "mostró", f: "mostr- + -ó → mostrar (to show), preterite, it. Same -ar preterite."}
          - {w: "del", f: "de + el (of the)."}
      - es: "En las suyas sintieron los que escuchado la habían tanta lástima como admiración de su desgracia; y, aunque luego quisiera el cura consolarla y aconsejarla, tomó primero la mano Cardenio, diciendo:"
        literal: "In theirs felt those who listened-to her had as-much pity as wonder at her misfortune; and, although at-once would-have-liked the curate to-console-her and to-advise-her, took first the hand Cardenio, saying:"
        ormsby: "In theirs the listeners felt as much pity as wonder at her misfortunes; but as the curate was just about to offer her some consolation and advice Cardenio forestalled him, saying,"
        vocab:
          - {w: "en las suyas", d: "in theirs: 'their souls', picking up 'alma' from the previous sentence"}
          - {w: "lástima", d: "pity"}
          - {w: "admiración", d: "wonder, astonishment (a false friend: not 'admiration')"}
          - {w: "luego", d: "at once, immediately (in Cervantes usually not 'later')"}
          - {w: "consolar", d: "to console, comfort"}
          - {w: "tomar la mano", d: "to take the lead, speak first, get in first"}
        diagram:
          - s: "sintieron"
            r: "main verb 1: felt"
            under:
              - {s: "En las suyas", r: "where: in theirs (their souls)"}
              - {s: "los que escuchado la habían", r: "subject: those who had listened to her"}
              - {s: "tanta lástima como admiración de su desgracia", r: "object: as much pity as wonder at her misfortune"}
          - s: "tomó primero la mano Cardenio"
            r: "main verb 2 (after 'y'): Cardenio spoke first"
            under:
              - {s: "aunque luego quisiera el cura consolarla y aconsejarla", r: "concession: although the curate wanted at once to console and advise her"}
              - {s: "diciendo", r: "how: saying (what follows)"}
        forms:
          - {w: "las suyas", f: "suy- + -as → suyo (theirs), feminine plural to match the understood 'almas' (souls)."}
          - {w: "sintieron", f: "sint- + -ieron → sentir (to feel), preterite, they. The e of the stem turns to i in this form. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "escuchado la habían", f: "habían = haber, imperfect, they (había, habías, había, habíamos, habíais, habían), + escuchado, the participle of escuchar (to listen to): pluperfect 'had listened to'. The participle comes first and 'la' (her) sits between, a poetic order; modern 'la habían escuchado'."}
          - {w: "tanta ... como", f: "tant- + -a → tanto, feminine to match 'lástima': 'as much ... as'."}
          - {w: "quisiera", f: "quis- + -iera → querer (to want), imperfect subjunctive (-ra form), he: here 'wanted, would have liked'. Built on the preterite quisieron: quisiera, quisieras, quisiera, quisiéramos, quisierais, quisieran."}
          - {w: "consolarla, aconsejarla", f: "consolar (to console), aconsejar (to advise), each + la (her), the pronoun hung on the end of the infinitive."}
          - {w: "tomó", f: "tom- + -ó → tomar (to take), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "diciendo", f: "gerund of decir (to say), the stem e turning to i: 'saying'."}
  - sentences:
      - es: "— En fin, señora, que tú eres la hermosa Dorotea, la hija única del rico Clenardo."
        literal: "— In end, lady, [so] that you are the beautiful Dorotea, the daughter only of-the rich Clenardo."
        ormsby: "“So then, señora, you are the fair Dorothea, the only daughter of the rich Clenardo?”"
        vocab:
          - {w: "en fin", d: "so then, in short"}
          - {w: "que", d: "here an opening 'so': 'so you are...', introducing a conclusion"}
          - {w: "hija única", d: "only daughter"}
          - {w: "Clenardo", d: "Dorotea's father, a rich farmer (a vassal of Don Fernando's father, the duke); a name Cardenio knows from Luscinda's world"}
        diagram:
          - s: "tú eres"
            r: "main verb: you are"
            under:
              - {s: "En fin, señora, que", r: "opening: so then, lady"}
              - s: "la hermosa Dorotea"
                r: "what you are: the beautiful Dorotea"
                under:
                  - {s: "la hija única del rico Clenardo", r: "describes 'Dorotea': the only daughter of rich Clenardo"}
        forms:
          - {w: "tú", f: "'you', the familiar singular; the accent tells it from 'tu' (your). Cardenio, still half wild, uses 'tú'; in his next speech he switches to the polite 'vos'."}
          - {w: "eres", f: "ser (to be), present, you. soy, eres, es, somos, sois, son."}
          - {w: "hermosa", f: "hermos- + -a → hermoso (beautiful), feminine to match 'Dorotea'."}
          - {w: "única", f: "únic- + -a → único (only), feminine to match 'hija'; after the noun it means 'only', before it 'unique'."}
          - {w: "del", f: "de + el (of the)."}
        note: "Dorotea never named her father in her story, as she says next; Cardenio knows him because Clenardo's family lived near Luscinda's and Don Fernando's in Andalusia."
  - sentences:
      - es: "Admirada quedó Dorotea cuando oyó el nombre de su padre, y de ver cuán de poco era el que le nombraba, porque ya se ha dicho de la mala manera que Cardenio estaba vestido; y así, le dijo:"
        literal: "Astonished remained Dorotea when she-heard the name of her father, and at seeing how of little was the [one] who it named, because already itself has said of the bad manner that Cardenio was dressed; and so, to-him she-said:"
        ormsby: "Dorothea was astonished at hearing her father’s name, and at the miserable appearance of him who mentioned it, for it has been already said how wretchedly clad Cardenio was; so she said to him:"
        vocab:
          - {w: "admirado", d: "astonished, amazed (a false friend: not 'admired')"}
          - {w: "cuán de poco", d: "how poor, how little worth: 'de poco' = of little account, wretched-looking"}
          - {w: "nombrar", d: "to name, mention by name"}
          - {w: "de la mala manera que", d: "in what a bad way, how badly"}
