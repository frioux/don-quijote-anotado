          - {w: "correr peligro de", d: "to run the risk of"}
          - {w: "invención", d: "scheme, contrivance, trick"}
          - {w: "acudir a", d: "to rush to"}
          - {w: "yacer", d: "to lie"}
          - {w: "de un golpe", d: "at one stroke, in a flash"}
          - {w: "murmurar", d: "to mutter, murmur"}
