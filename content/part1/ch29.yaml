  - sentences:
      - es: "— De aquí no me levantaré, ¡oh valeroso y esforzado caballero!, fasta que la vuestra bondad y cortesía me otorgue un don, el cual redundará en honra y prez de vuestra persona, y en pro de la más desconsolada y agraviada doncella que el sol ha visto."
        literal: "— From here not myself I-will-raise, oh valiant and mighty knight!, until that the your goodness and courtesy to-me grant a boon, the which will-redound in honor and glory of your person, and in benefit of the most disconsolate and wronged damsel that the sun has seen."
        ormsby: "“From this spot I will not rise, valiant and doughty knight, until your goodness and courtesy grant me a boon, which will redound to the honour and renown of your person and render a service to the most disconsolate and afflicted damsel the sun has seen;"
        vocab:
          - {w: "valeroso", d: "valiant, brave"}
          - {w: "esforzado", d: "doughty, mighty, courageous"}
          - {w: "fasta", d: "= hasta, until (old f- form, put on for the chivalric style)"}
          - {w: "la vuestra bondad", d: "your goodness: the article before the possessive is old, formal style ('la vuestra merced')"}
          - {w: "otorgar", d: "to grant"}
          - {w: "redundar en", d: "to redound to, result in"}
          - {w: "prez", d: "glory, renown (an archaic word of the romances)"}
          - {w: "en pro de", d: "for the benefit of"}
          - {w: "agraviado", d: "wronged, injured"}
        diagram:
          - s: "De aquí no me levantaré"
            r: "main verb: I will not rise from here"
            under:
              - {s: "¡oh valeroso y esforzado caballero!", r: "who she speaks to: O valiant and doughty knight"}
              - s: "fasta que la vuestra bondad y cortesía me otorgue un don"
                r: "until when: until your goodness and courtesy grant me a boon"
                under:
                  - s: "el cual redundará en honra y prez de vuestra persona"
                    r: "describes 'don': which will bring honor and glory to you"
                  - s: "y en pro de la más desconsolada y agraviada doncella"
                    r: "and: and benefit the most disconsolate and wronged damsel"
                    under:
                      - {s: "que el sol ha visto", r: "describes 'doncella': that the sun has ever seen"}
        forms:
          - {w: "me levantaré", f: "levantar + -é → levantarse (to rise), future, I. The future is the infinitive + -é, -ás, -á, -emos, -éis, -án."}
          - {w: "otorgue", f: "otorg- + -ue → otorgar (to grant), present subjunctive, it (your goodness). Subjunctive after 'fasta que' for a time not yet reached; g becomes gu before e. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "redundará", f: "redundar + -á → redundar (to redound), future, it. Same future endings: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "desconsolada, agraviada", f: "participles of desconsolar (to grieve) and agraviar (to wrong), feminine to match 'doncella'."}
