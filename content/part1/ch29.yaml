          - {w: "nuevas", d: "news, reports"}
          - {w: "así como", d: "as soon as"}
          - {w: "encomendarse a / en", d: "to commend oneself to, put oneself in the hands of"}
          - {w: "fiar de", d: "to entrust to, rely on"}
          - {w: "invencible", d: "invincible"}
