  - sentences:
      - es: "— Vuestra merced está engañado, señor mío —dijo ella—, porque no ha dos años que yo partí dél, y en verdad que nunca tuve buen tiempo, y, con todo eso, he llegado a ver lo que tanto deseaba, que es al señor don Quijote de la Mancha, cuyas nuevas llegaron a mis oídos así como puse los pies en España, y ellas me movieron a buscarle, para encomendarme en su cortesía y fiar mi justicia del valor de su invencible brazo."
        literal: "— Your grace is mistaken, sir mine —said she—, because not it-has two years that I departed from-it, and in truth that never I-had good weather, and, with all that, I-have arrived to see that which so-much I-desired, which is [to]-the sir Don Quijote of La Mancha, whose news arrived at my ears as soon as I-put the feet in Spain, and they me moved to look-for-him, for to-commend-myself in his courtesy and to-entrust my justice to-the valor of his invincible arm."
        ormsby: "“Your worship is mistaken, señor,” said she; “for it is not two years since I set out from it, and though I never had good weather, nevertheless I am here to behold what I so longed for, and that is my lord Don Quixote of La Mancha, whose fame came to my ears as soon as I set foot in Spain and impelled me to go in search of him, to commend myself to his courtesy, and entrust the justice of my cause to the might of his invincible arm.”"
        vocab:
          - {w: "estar engañado", d: "to be mistaken"}
          - {w: "no ha dos años", d: "not two years ago: 'ha' = hace (ago)"}
          - {w: "partir de", d: "to set out from, leave"}
