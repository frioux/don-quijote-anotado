  - sentences:
      - es: "— Dichosa buscada y dichoso hallazgo —dijo a esta sazón Sancho Panza—, y más si mi amo es tan venturoso que desfaga ese agravio y enderece ese tuerto, matando a ese hideputa dese gigante que vuestra merced dice;"
        literal: "— Lucky seeking and lucky finding —said at this moment Sancho Panza—, and more if my master is so fortunate that he-undo that injury and straighten that wrong, killing [to] that son-of-a-whore of-that giant that your grace says;"
        ormsby: "“A lucky seeking and a lucky finding!” said Sancho Panza at this; “especially if my master has the good fortune to redress that injury, and right that wrong, and kill that son of a bitch of a giant your worship speaks of;"
        vocab:
          - {w: "buscada", d: "a seeking, search (a participle used as a noun)"}
          - {w: "hallazgo", d: "finding, find"}
          - {w: "a esta sazón", d: "at this moment, just then"}
          - {w: "venturoso", d: "lucky, fortunate"}
          - {w: "enderezar", d: "to straighten, set right; 'enderezar tuertos' = to right wrongs, a pun since 'tuerto' also means 'crooked'"}
          - {w: "hideputa", d: "son of a whore (hijo de puta run together): a coarse oath, often used with no real malice, even admiringly"}
          - {w: "dese", d: "= de ese, of that"}
          - {w: "vuestra merced", d: "your worship, your grace: the polite address, the ancestor of 'usted'; it takes the he/she form of the verb"}
        diagram:
          - {s: "Dichosa buscada y dichoso hallazgo", r: "exclamation: a lucky search and a lucky find"}
          - {s: "dijo a esta sazón Sancho Panza", r: "speech tag: said Sancho Panza just then"}
          - s: "y más si mi amo es tan venturoso"
