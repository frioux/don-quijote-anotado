  - sentences:
      - es: "— A eso yo responderé con brevedad —respondió el cura—, porque sabrá vuestra merced, señor don Quijote, que yo y maese Nicolás, nuestro amigo y nuestro barbero, íbamos a Sevilla a cobrar cierto dinero que un pariente mío que ha muchos años que pasó a Indias me había enviado, y no tan pocos que no pasan de sesenta mil pesos ensayados, que es otro que tal;"
        literal: "— To that I will-answer with brevity —answered the curate—, because will-know your grace, sir Don Quijote, that I and Master Nicolás, our friend and our barber, were-going to Seville to collect certain money that a relative of-mine who it-has many years that passed to Indies to-me had sent, and not so few that not they-pass of sixty thousand pesos assayed, which is another such;"
        ormsby: "“I will answer that briefly,” replied the curate; “you must know then, Señor Don Quixote, that Master Nicholas, our friend and barber, and I were going to Seville to receive some money that a relative of mine who went to the Indies many years ago had sent me, and not such a small sum but that it was over sixty thousand pieces of eight, full weight, which is something;"
        vocab:
          - {w: "con brevedad", d: "briefly"}
          - {w: "sabrá vuestra merced", d: "your worship must know (a formula to begin a story)"}
          - {w: "cobrar", d: "to collect, receive (money owed)"}
          - {w: "pariente", d: "relative, kinsman (not 'parent')"}
          - {w: "pasar a Indias", d: "to emigrate to the Indies, i.e. Spanish America"}
          - {w: "y no tan pocos que no pasan de", d: "and not so little either, for it comes to more than"}
          - {w: "peso ensayado", d: "assayed peso: a silver coin of guaranteed weight and purity, the 'piece of eight'"}
          - {w: "otro que tal", d: "quite something, no small matter"}
        diagram:
          - {s: "A eso yo responderé con brevedad", r: "main verb 1: I will answer that briefly"}
          - {s: "respondió el cura", r: "speech tag: answered the curate"}
          - s: "porque sabrá vuestra merced, señor don Quijote"
            r: "main verb 2: for your worship must know, Don Quijote"
            under:
              - s: "que yo y maese Nicolás ... íbamos a Sevilla"
                r: "what to know: that Master Nicolás and I were going to Seville"
                under:
                  - {s: "nuestro amigo y nuestro barbero", r: "describes 'maese Nicolás': our friend and our barber"}
                  - s: "a cobrar cierto dinero"
                    r: "what for: to collect some money"
                    under:
                      - s: "que un pariente mío ... me había enviado"
                        r: "describes 'dinero': that a relative of mine had sent me"
                        under:
                          - {s: "que ha muchos años que pasó a Indias", r: "describes 'pariente': who went to the Indies many years ago"}
                      - s: "y no tan pocos que no pasan de sesenta mil pesos ensayados"
                        r: "how much: and no small sum, for it comes to over sixty thousand assayed pesos"
                        under:
                          - {s: "que es otro que tal", r: "comment: which is no small matter"}
        forms:
          - {w: "responderé", f: "responder + -é → responder (to answer), future, I. The future is the infinitive + -é, -ás, -á, -emos, -éis, -án."}
          - {w: "sabrá", f: "sabr- + -á → saber (to know), future, you (vuestra merced): 'you must know'. saber shortens its stem: sabré, sabrás, sabrá, sabremos, sabréis, sabrán."}
          - {w: "íbamos", f: "ib- + -amos → ir (to go), imperfect, we. ir's imperfect is irregular: iba, ibas, iba, íbamos, ibais, iban."}
          - {w: "ha muchos años que pasó", f: "ha = haber in the old sense of 'hace' (ago), + pasó, pas- + -ó → pasar (to go across), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "había enviado", f: "había = haber, imperfect, he (había, habías, había, habíamos, habíais, habían), + enviado, participle of enviar (to send)."}
          - {w: "pasan", f: "pas- + -an → pasar (to exceed; 'pasar de' = to be more than), present, they (the pesos). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
        note: "Money from relatives in the Americas came by the treasure fleet to Seville, the only port licensed for trade with the Indies. Sixty thousand pesos was a fortune, which makes the curate's lie the grander."
      - es: "y, pasando ayer por estos lugares, nos salieron al encuentro cuatro salteadores y nos quitaron hasta las barbas;"
        literal: "and, passing yesterday through these places, to-us came-out to-the meeting four highwaymen and from-us they-took even the beards;"
        ormsby: "and passing by this place yesterday we were attacked by four footpads, who stripped us even to our beards,"
        vocab:
          - {w: "salir al encuentro", d: "to come out to meet; here 'to waylay'"}
          - {w: "salteador", d: "highwayman, robber"}
          - {w: "quitar hasta las barbas", d: "to strip of everything, even the beard: a joke on the proverbial phrase and on the barber's false beard"}
        diagram:
          - {s: "pasando ayer por estos lugares", r: "when: as we passed through here yesterday"}
          - {s: "nos salieron al encuentro cuatro salteadores", r: "main verb 1 (after 'y'): four highwaymen waylaid us"}
          - {s: "y nos quitaron hasta las barbas", r: "main verb 2: and took even our beards"}
        forms:
          - {w: "pasando", f: "gerund of pasar (to pass): 'passing'."}
          - {w: "salieron", f: "sal- + -ieron → salir (to come out), preterite, they. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "quitaron", f: "quit- + -aron → quitar (to take away), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. 'nos' = from us: the person robbed takes the indirect pronoun."}
      - es: "y de modo nos las quitaron, que le convino al barbero ponérselas postizas;"
        literal: "and in manner to-us them they-took, that to-him it-suited to-the barber to-put-them-on-himself false;"
        ormsby: "and them they stripped off so that the barber found it necessary to put on a false one,"
        vocab:
          - {w: "de modo ... que", d: "in such a way that, so thoroughly that"}
          - {w: "convenir", d: "to be necessary, be advisable"}
          - {w: "postizo", d: "false, artificial (of hair, teeth)"}
        diagram:
          - s: "de modo nos las quitaron"
            r: "main verb (after 'y'): they took them from us so thoroughly"
            under:
              - {s: "que le convino al barbero ponérselas postizas", r: "result: that the barber had to put on a false one"}
        forms:
          - {w: "nos las quitaron", f: "quit- + -aron → quitar (to take away), preterite, they; 'nos' = from us, 'las' = them (the beards). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "convino", f: "conv- + -ino → convenir (to be necessary), preterite, it. Like venir: convine, conviniste, convino, convinimos, convinisteis, convinieron."}
          - {w: "ponérselas", f: "poner (to put on) + se (on himself) + las (them, the beards), accent added."}
          - {w: "postizas", f: "postiz- + -as → postizo (false), feminine plural to match 'las' (the beards)."}
        note: "The curate explains away the barber's false beard, which Don Quijote has just seen fall off, by blaming robbers who shaved them."
      - es: "y aun a este mancebo que aquí va —señalando a Cardenio— le pusieron como de nuevo."
        literal: "and even [to] this young-man who here goes —pointing to Cardenio— him they-put as of new."
        ormsby: "and even this young man here”—pointing to Cardenio—“they completely transformed."
        vocab:
          - {w: "mancebo", d: "young man, youth"}
          - {w: "señalar", d: "to point to, point at"}
          - {w: "poner como de nuevo", d: "to leave as good as new, i.e. strip bare (ironic: 'as on the day he was born')"}
        diagram:
          - s: "le pusieron como de nuevo"
            r: "main verb (after 'y aun'): they left him as good as new (stripped)"
            under:
              - s: "a este mancebo"
                r: "whom: this young man"
                under:
                  - {s: "que aquí va", r: "describes 'mancebo': who is going here"}
              - {s: "señalando a Cardenio", r: "narrator's aside: pointing to Cardenio"}
        forms:
          - {w: "va", f: "ir (to go), present, he. voy, vas, va, vamos, vais, van."}
          - {w: "señalando", f: "gerund of señalar (to point at)."}
          - {w: "pusieron", f: "pus- + -ieron → poner (to put), preterite, they. Irregular: puse, pusiste, puso, pusimos, pusisteis, pusieron. 'a este mancebo ... le' = the object named and then repeated by the pronoun."}
      - es: "Y es lo bueno que es pública fama por todos estos contornos que los que nos saltearon son de unos galeotes que dicen que libertó, casi en este mesmo sitio, un hombre tan valiente que, a pesar del comisario y de las guardas, los soltó a todos;"
        literal: "And it-is the good [part] that it-is public fame through all these surroundings that those who us robbed are of some galley-slaves that they-say that freed, almost in this same place, a man so valiant that, in spite of-the commissary and of the guards, them he-released all;"
        ormsby: "But the best of it is, the story goes in the neighbourhood that those who attacked us belong to a number of galley slaves who, they say, were set free almost on the very same spot by a man of such valour that, in spite of the commissary and of the guards, he released the whole of them;"
        vocab:
          - {w: "lo bueno", d: "the best part, the funny thing"}
          - {w: "ser pública fama", d: "to be common talk, generally said"}
          - {w: "contornos", d: "surroundings, neighborhood"}
          - {w: "saltear", d: "to rob on the highway, waylay"}
          - {w: "galeote", d: "galley slave, a convict sentenced to row in the king's galleys"}
          - {w: "libertar", d: "to free, set at liberty"}
          - {w: "comisario", d: "commissary, the officer escorting the chain of convicts"}
          - {w: "guarda", d: "guard"}
          - {w: "soltar", d: "to release, let go"}
        diagram:
          - {s: "Y es lo bueno", r: "main verb: and the best of it is"}
          - s: "que es pública fama por todos estos contornos"
            r: "what the best is: that it is common talk all round here"
            under:
              - s: "que los que nos saltearon son de unos galeotes"
                r: "what is said: that those who robbed us are some of the galley slaves"
                under:
                  - s: "que dicen que libertó, casi en este mesmo sitio, un hombre tan valiente"
                    r: "describes 'galeotes': whom, they say, a man so brave freed, almost on this very spot"
                    under:
                      - {s: "que, a pesar del comisario y de las guardas, los soltó a todos", r: "result: that in spite of the commissary and the guards he set them all loose"}
        forms:
          - {w: "saltearon", f: "salte- + -aron → saltear (to waylay), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "son", f: "ser (to be), present, they. soy, eres, es, somos, sois, son."}
          - {w: "dicen", f: "dic- + -en → decir (to say), present, they (people). digo, dices, dice, decimos, decís, dicen."}
          - {w: "libertó, soltó", f: "libert- + -ó → libertar (to free), solt- + -ó → soltar (to release), preterite, he. Same -ar preterite."}
          - {w: "mesmo", f: "= mismo (same), the old form."}
          - {w: "los ... a todos", f: "'los' (them) doubled by 'a todos' (all of them) for emphasis."}
        note: "The curate is describing Don Quijote's own exploit of chapter 22, when he freed a chain of galley slaves who then stoned him. He tells it without naming him to watch his reaction."
      - es: "y, sin duda alguna, él debía de estar fuera de juicio, o debe de ser tan grande bellaco como ellos, o algún hombre sin alma y sin conciencia, pues quiso soltar al lobo entre las ovejas, a la raposa entre las gallinas, a la mosca entre la miel;"
        literal: "and, without doubt any, he must of be out of judgment, or must of be as great rogue as they, or some man without soul and without conscience, since he-wanted to-release [to]-the wolf among the sheep, [to] the fox among the hens, [to] the fly among the honey;"
        ormsby: "and beyond all doubt he must have been out of his senses, or he must be as great a scoundrel as they, or some man without heart or conscience to let the wolf loose among the sheep, the fox among the hens, the fly among the honey."
        ormsby_note: "Clemencín and Hartzenbusch point out that to let the fly loose 'among the honey' would be worse for him than for it, and the latter, giving a quotation in point from Francisco de Rojas, substitutes 'the bear.'"
        vocab:
          - {w: "fuera de juicio", d: "out of his mind"}
          - {w: "bellaco", d: "rogue, scoundrel"}
          - {w: "raposa", d: "fox (vixen)"}
          - {w: "gallina", d: "hen"}
          - {w: "mosca", d: "fly"}
          - {w: "miel", d: "honey"}
        diagram:
          - s: "él debía de estar fuera de juicio"
            r: "main verb 1 (after 'y'): he must have been out of his mind"
            under:
              - {s: "sin duda alguna", r: "how sure: without any doubt"}
          - {s: "o debe de ser tan grande bellaco como ellos", r: "main verb 2: or he must be as great a rogue as they are"}
          - s: "o algún hombre sin alma y sin conciencia"
            r: "or 3: or some man without soul or conscience"
            under:
              - s: "pues quiso soltar al lobo entre las ovejas"
                r: "why: since he chose to let the wolf loose among the sheep"
                under:
                  - {s: "a la raposa entre las gallinas, a la mosca entre la miel", r: "and: the fox among the hens, the fly among the honey"}
        forms:
          - {w: "debía de estar", f: "deb- + -ía → deber (must), imperfect, he, + de + estar: 'must have been'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "debe de ser", f: "deb- + -e → deber (must), present, he, + de + ser: 'must be'. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "grande", f: "the full form before 'bellaco'; modern Spanish would clip it to 'gran'."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun ('hombre')."}
          - {w: "quiso", f: "quis- + -o → querer (to want, choose), preterite, he. Irregular: quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "al lobo, a la raposa, a la mosca", f: "the 'a' that marks a person as the object is used here for the animals, as if they were persons."}
        note: "Don Quijote is sitting right there, hearing himself called mad, a scoundrel or a man without a soul."
      - es: "quiso defraudar la justicia, ir contra su rey y señor natural, pues fue contra sus justos mandamientos."
        literal: "he-wanted to-defraud the justice, to-go against his king and lord natural, since he-went against his just commands."
        ormsby: "He has defrauded justice, and opposed his king and lawful master, for he opposed his just commands;"
        vocab:
          - {w: "defraudar", d: "to cheat, defraud"}
          - {w: "señor natural", d: "natural lord, rightful sovereign"}
          - {w: "mandamiento", d: "command, order (also 'commandment')"}
        diagram:
          - s: "quiso"
            r: "main verb: he chose"
            under:
              - {s: "defraudar la justicia", r: "what he chose, 1: to cheat justice"}
              - s: "ir contra su rey y señor natural"
                r: "what he chose, 2: to go against his king and rightful lord"
                under:
                  - {s: "pues fue contra sus justos mandamientos", r: "why: since he went against his just commands"}
        forms:
          - {w: "quiso", f: "quis- + -o → querer (to want, choose), preterite, he. Irregular: quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "fue", f: "fu- + -e → ir (to go), preterite, he. ir borrows ser's preterite: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "justos", f: "just- + -os → justo (just), masculine plural to match 'mandamientos'."}
      - es: "Quiso, digo, quitar a las galeras sus pies, poner en alboroto a la Santa Hermandad, que había muchos años que reposaba; quiso, finalmente, hacer un hecho por donde se pierda su alma y no se gane su cuerpo."
        literal: "He-wanted, I-say, to-take from the galleys their feet, to-put in uproar [to] the Holy Brotherhood, which it-had many years that was-resting; he-wanted, finally, to-do a deed by where itself may-be-lost his soul and not itself be-gained his body."
        ormsby: "he has, I say, robbed the galleys of their feet, stirred up the Holy Brotherhood which for many years past has been quiet, and, lastly, has done a deed by which his soul may be lost without any gain to his body.”"
        vocab:
          - {w: "galera", d: "galley, an oared warship rowed by convicts and slaves"}
          - {w: "sus pies", d: "their feet: the rowers, who move the galley as feet move a body"}
          - {w: "alboroto", d: "uproar, commotion"}
          - {w: "la Santa Hermandad", d: "the Holy Brotherhood, the rural police of Castile, who hunted highwaymen and runaways"}
          - {w: "reposar", d: "to rest, be idle"}
          - {w: "hecho", d: "deed, act"}
          - {w: "por donde", d: "by which, whereby"}
        diagram:
          - s: "Quiso, digo"
            r: "main verb 1: he chose, I say"
            under:
              - {s: "quitar a las galeras sus pies", r: "what, 1: to take the galleys' feet from them"}
              - s: "poner en alboroto a la Santa Hermandad"
                r: "what, 2: to stir up the Holy Brotherhood"
                under:
                  - {s: "que había muchos años que reposaba", r: "describes 'Hermandad': which had been resting for many years"}
          - s: "quiso, finalmente, hacer un hecho"
            r: "main verb 2: he chose, finally, to do a deed"
            under:
              - {s: "por donde se pierda su alma y no se gane su cuerpo", r: "describes 'hecho': by which his soul is lost and his body gains nothing"}
        forms:
          - {w: "Quiso, quiso", f: "quis- + -o → querer (to want, choose), preterite, he. Irregular: quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. digo, dices, dice, decimos, decís, dicen."}
          - {w: "había muchos años que reposaba", f: "había = haber in the old sense of 'hacía' (for, since), + repos- + -aba → reposar (to rest), imperfect, it: 'had been resting for many years'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "se pierda, se gane", f: "pierd- + -a → perderse (to be lost), present subjunctive, it; gan- + -e → ganarse (to be gained), present subjunctive, it. Subjunctive after 'por donde' for a result not yet happened. perder: pierda, pierdas, pierda, perdamos, perdáis, pierdan; ganar: gane, ganes, gane, ganemos, ganéis, ganen."}
        note: "'Lose his soul and not gain his body' twists the Gospel line about gaining the whole world and losing one's soul: the man has damned himself for nothing."
  - sentences:
      - es: "Habíales contado Sancho al cura y al barbero la aventura de los galeotes, que acabó su amo con tanta gloria suya, y por esto cargaba la mano el cura refiriéndola, por ver lo que hacía o decía don Quijote;"
        literal: "Had-to-them told Sancho to-the curate and to-the barber the adventure of the galley-slaves, which finished his master with so-much glory his, and for this was-loading the hand the curate relating-it, for to-see that which did or said Don Quijote;"
        ormsby: "Sancho had told the curate and the barber of the adventure of the galley slaves, which, so much to his glory, his master had achieved, and hence the curate in alluding to it made the most of it to see what would be said or done by Don Quixote;"
        vocab:
          - {w: "acabar", d: "here 'to accomplish, carry out'"}
          - {w: "con tanta gloria suya", d: "so much to his glory (ironic)"}
          - {w: "cargar la mano", d: "to lay it on thick, exaggerate"}
          - {w: "referir", d: "to relate, tell"}
        diagram:
          - s: "Habíales contado Sancho al cura y al barbero la aventura de los galeotes"
            r: "main verb 1: Sancho had told the curate and the barber the adventure of the galley slaves"
            under:
              - {s: "que acabó su amo con tanta gloria suya", r: "describes 'aventura': which his master carried out so gloriously"}
          - s: "y por esto cargaba la mano el cura refiriéndola"
            r: "main verb 2: and so the curate laid it on thick in telling it"
            under:
              - {s: "por ver lo que hacía o decía don Quijote", r: "why: to see what Don Quijote would do or say"}
        forms:
          - {w: "Habíales contado", f: "hab- + -ía + les → haber, imperfect, he, with 'les' (to them) stuck on the end, + contado, participle of contar (to tell): 'had told them'; modern 'les había contado'. había, habías, había, habíamos, habíais, habían."}
          - {w: "acabó", f: "acab- + -ó → acabar (to accomplish), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "cargaba", f: "carg- + -aba → cargar (to load), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "refiriéndola", f: "refiriendo, the gerund of referir (to relate), the e turning to i, + la (it, the adventure), accent added."}
          - {w: "hacía, decía", f: "hac- + -ía → hacer (to do), dec- + -ía → decir (to say), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
      - es: "al cual se le mudaba la color a cada palabra, y no osaba decir que él había sido el libertador de aquella buena gente."
        literal: "to whom himself to-him was-changing the color at each word, and not he-dared to-say that he had been the liberator of that good people."
        ormsby: "who changed colour at every word, not daring to say that it was he who had been the liberator of those worthy people."
        vocab:
          - {w: "mudarse la color", d: "to change color, blush or go pale ('la color': color was often feminine in Cervantes' day)"}
          - {w: "osar", d: "to dare"}
          - {w: "libertador", d: "liberator"}
          - {w: "buena gente", d: "fine people (ironic, of the convicts)"}
        diagram:
          - s: "al cual se le mudaba la color a cada palabra"
            r: "main verb 1: whose color changed at every word"
          - s: "y no osaba decir"
            r: "main verb 2: and he did not dare say"
            under:
              - {s: "que él había sido el libertador de aquella buena gente", r: "what: that he had been the liberator of those fine people"}
        forms:
          - {w: "se le mudaba", f: "mud- + -aba → mudarse (to change), imperfect, it (the color); 'le' = his. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "la color", f: "'color' treated as feminine, as it often was in Golden Age Spanish; modern 'el color'."}
          - {w: "osaba", f: "os- + -aba → osar (to dare), imperfect, he. Same -aba imperfect."}
          - {w: "había sido", f: "había = haber, imperfect, he (había, habías, había, habíamos, habíais, habían), + sido, participle of ser (to be)."}
          - {w: "libertador", f: "libertar (to free) + -dor, the suffix for the one who does it: 'liberator'."}
  - sentences:
      - es: "— Éstos, pues —dijo el cura—, fueron los que nos robaron; que Dios, por su misericordia, se lo perdone al que no los dejó llevar al debido suplicio."
        literal: "— These, then —said the curate—, were those who us robbed; for God, by his mercy, to-him it may-forgive to-the [one] who not them let take to-the due punishment."
        ormsby: "“These, then,” said the curate, “were they who robbed us; and God in his mercy pardon him who would not let them go to the punishment they deserved.”"
        vocab:
          - {w: "misericordia", d: "mercy"}
          - {w: "perdonar", d: "to forgive, pardon"}
