summary: |
  Dorotea ends her story and asks only for advice on where to hide, too ashamed to face her parents. Cardenio, recognizing her father's name, reveals that he is the Cardenio whom Luscinda named as her husband at the wedding to Don Fernando. Since Luscinda is his and Don Fernando is hers, he argues, heaven may yet give them both back what is theirs, and he swears as a gentleman not to abandon her until Don Fernando marries her, and to challenge him if he refuses. The curate invites them both to his village, and the barber tells them of Don Quijote's madness.

  Sancho arrives: he has found his master thin, half-naked and pining for Dulcinea, refusing to see her until he has done great deeds, and he fears Don Quijote will never become an emperor. Dorotea offers to play the distressed damsel in place of the barber, since she has read the books of chivalry and has a fine dress with her. Dressed up, she dazzles them all. The curate tells Sancho she is the Princess Micomicona of the kingdom of Micomicón, come from Guinea to beg his master to kill a giant, and Sancho begs the curate to make Don Quijote marry her at once, so that he will not become an archbishop.

  Dorotea kneels before Don Quijote and asks a boon: that he follow her and take up no other adventure until he has avenged her on the traitor who usurped her kingdom. He grants it and arms himself. Sancho, on foot again, dreams of selling his black vassals in Spain for silver and gold and buying a title. Meanwhile the curate shaves Cardenio, gives him his own cloak and cape, and the two wait on the road where they greet Don Quijote as if by chance.

  On the way the barber is thrown by a hired mule and loses his false beard; the curate sticks it back with a pretended charm, which Don Quijote begs to learn. The curate leads the 'princess' towards his own village, inventing a voyage of nine years to her kingdom. Asked why he travels so lightly dressed, he says he and the barber were robbed by galley slaves freed by some madman, and lays the blame on their liberator so heavily that Don Quijote changes color at every word.
context: |
  Honor and marriage. Dorotea's shame and Cardenio's oath rest on the honor code of the Spanish gentry. A promise of marriage given before witness (as Don Fernando gave Dorotea, and as Luscinda claimed to have given Cardenio) could bind like a wedding, which is why Cardenio argues that neither of the new marriages can stand. A woman who had lost her chastity could not go home without disgrace to her family; a gentleman who took up her cause could challenge the man responsible. Clothes mark rank throughout: Dorotea's 'saya entera' and jewels turn a runaway into a princess, and the curate, stripped of his cloak and left in hose and doublet, looks to Don Quijote like a man who has been robbed.

  The romances of chivalry. Dorotea knows her part from reading, and plays it to the letter: the damsel who kneels and will not rise until the knight grants a boon unheard, the knight who grants it reserving only the rights of his king, his country and his lady, and the boon itself, to follow her and take no other adventure until her wrong is righted. These are the set scenes of Amadís de Gaula and its successors. Don Quijote and Dorotea both slip into the archaic chivalric Spanish with f- for h- (fermosura, fasta, facienda, fazañas, fabló), and the curate greets Don Quijote with a string of the romances' titles: mirror of chivalry, flower and cream of gentility, quintessence of knights-errant.

  The narrator's games. The plot now runs on two fictions at once: the curate's play of the Princess Micomicona, and Don Quijote's own romance, which absorbs it without strain. When the false beard falls off he sees a miracle, not a trick; when the curate lays out a voyage of nine years from Cartagena past the Sea of Azov to an African kingdom, he notices nothing. The chapter ends with the curate turning the story of the galley slaves (chapter 22) against its hero while pretending not to know who he is. The heading Ormsby uses differs from the Spanish title ('Which treats of the discretion of the beautiful Dorotea'); the chapter titles of the early editions were confused at this point.

  Money, slavery and the Church. Sancho's daydream is brutally practical: Africans were bought and sold in Seville and Lisbon, and titles and public offices were sold by the Crown, so he plans to turn black vassals into 'white or yellow', silver and gold. His fear that his master will become an archbishop rests on a real rule: a married man could not take orders, so a squire with a wife could hope for nothing from the Church without dispensations. The curate's sixty thousand assayed pesos from a relative in the Indies point to the treasure fleets that came into Seville. Medicine and folk religion meet in the 'ensalmo', a healing charm muttered over a wound, which the Church distrusted and which the curate pretends to use on the beard. Ormsby's notes record the proverb 'in delay lies danger', explain that Sancho's 'me mamo el dedo' means 'do you take me for a fool?', locate the hill of Zulema beside Alcalá de Henares (Complutum), and point out where he follows editors who corrected the text: 'two leagues' to the inn, which he makes six, and 'the fly among the honey', which one editor changed to 'the bear'.

  Names. Micomicón and Micomicona are built on 'mico', a long-tailed monkey, a comic African-sounding name the curate invents on the spot. Sancho justifies it with the Spanish custom of naming men after their towns (Pedro de Alcalá, Juan de Úbeda). The curate's 'laguna Meona, digo, Meótides' is a slip that turns the classical Palus Maeotis into a word built on 'mear', to urinate. Cardenio calls Dorotea 'Teodora', a muddle in the early editions that Ormsby corrects. Clenardo, her father, is a rich farmer, and Muzaraque is a Moor of Alcalá folklore who lies enchanted in the hill of Zulema.

  Reading Cervantes' Spanish. The chapter mixes three registers: Cardenio's elevated speech of honor, the mock-archaic chivalric dialogue, and Sancho's peasant talk full of oaths and proverbs (hideputa, par Dios, en dácame esas pajas). Watch for the old forms: mesmo, asimesmo, recebir, acetar, efeto, estrañeza, estremo, estender, intricado, entrambos, malenconía, quistión, compatriote, lueñe; contractions with 'de' (della, dellos, dél, desta, destos, dese); and -rl- becoming -ll- (desafialle, buscalle, habello). Pronouns are hung on verbs that open a clause (víneme, suplícoos, Vínosele, contóla, Saliéronle, Llámase, Estábase, vistióle, diole, bastaráme, Concertáronse, Habíales). The future subjunctive appears often (pudiere, fuere, quisiere, llevare, quisieren, diere, tuviere), and the -ra form serves as a conditional (quedaran, conociera, diera). False friends include puesto que (although), admirarse (to be amazed), desgracia (misfortune), suceso (outcome), honestidad (chastity), pariente (relative), collar (necklace) and derrota (route).
