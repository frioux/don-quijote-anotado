        note: "Dorotea plays the damsel from the romances perfectly: kneeling, refusing to rise until the knight grants a boon unheard, the 'don' in blank that knights in Amadís de Gaula always grant."
      - es: "Y si es que el valor de vuestro fuerte brazo corresponde a la voz de vuestra inmortal fama, obligado estáis a favorecer a la sin ventura que de tan lueñes tierras viene, al olor de vuestro famoso nombre, buscándoos para remedio de sus desdichas."
        literal: "And if it-is that the valor of your strong arm corresponds to the voice of your immortal fame, obliged you-are to favor [to] the without fortune who from so distant lands comes, at-the smell of your famous name, seeking-you for remedy of her misfortunes."
