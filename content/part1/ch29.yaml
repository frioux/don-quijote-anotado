                  - s: "y de ver cuán encajados tenía en la fantasía los mesmos disparates que su amo"
                    r: "at what, 2: and at seeing how firmly he had the same nonsense lodged in his head as his master"
                    under:
                      - {s: "pues sin alguna duda se daba a entender que había de venir a ser emperador", r: "why: since he had no doubt he was going to be an emperor"}
        forms:
          - {w: "quedó", f: "qued- + -ó → quedar (to be left), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "admirado", f: "participle of admirar (to amaze), masculine for the curate: 'amazed'."}
          - {w: "encajados", f: "participle of encajar (to fit in), masculine plural to match 'disparates': 'tener encajados' = to have lodged."}
          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "mesmos", f: "= mismos (same), masculine plural to match 'disparates'."}
