                  - {s: "buscándoos para remedio de sus desdichas", r: "doing what: seeking you as a cure for her misfortunes"}
        forms:
          - {w: "corresponde", f: "correspond- + -e → corresponder (to match), present, it. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "obligado estáis", f: "est- + -áis → estar (to be), present, you (vos), + obligado, participle of obligar (to oblige): 'you are bound'. estoy, estás, está, estamos, estáis, están."}
          - {w: "lueñes", f: "lueñ- + -es → lueñe (distant), plural to match 'tierras'."}
          - {w: "viene", f: "vien- + -e → venir (to come), present, she. vengo, vienes, viene, venimos, venís, vienen."}
