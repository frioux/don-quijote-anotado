  - sentences:
      - es: "— ¡Vive Dios, que es gran milagro éste! ¡Las barbas le ha derribado y arrancado del rostro, como si las quitaran aposta!"
        literal: "— Lives God, that is great miracle this! The beards to-him it-has knocked-down and torn-off from-the face, as if them they-had-removed on-purpose!"
        ormsby: "“By the living God, but this is a great miracle! it has knocked off and plucked away the beard from his face as if it had been shaved off designedly.”"
        vocab:
          - {w: "¡vive Dios!", d: "as God lives! by God! (an oath)"}
          - {w: "milagro", d: "miracle"}
          - {w: "arrancar", d: "to tear off, pull out"}
          - {w: "aposta", d: "on purpose, deliberately (= a propósito)"}
        diagram:
          - {s: "¡Vive Dios", r: "exclamation: by God"}
          - {s: "que es gran milagro éste!", r: "main verb 1: this is a great miracle"}
          - s: "¡Las barbas le ha derribado y arrancado del rostro"
            r: "main verb 2: it (the kick) has knocked off and torn his beard from his face"
            under:
              - {s: "como si las quitaran aposta!", r: "how: as if it had been removed on purpose"}
        forms:
          - {w: "Vive", f: "viv- + -e → vivir (to live), present, he (God): 'God lives'. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "gran", f: "grande clipped before a singular noun ('milagro')."}
          - {w: "éste", f: "'this one', este used alone as a pronoun, with the old written accent; masculine to match 'milagro'."}
          - {w: "le ha derribado y arrancado", f: "ha = haber, present, it (he, has, ha, hemos, habéis, han), + derribado (from derribar, to knock off) and arrancado (from arrancar, to tear off): 'has knocked off and torn off'. 'le' = from him."}
          - {w: "quitaran", f: "quit- + -aran → quitar (to remove), imperfect subjunctive (-ra form), they (impersonal): 'as if they had removed'. 'como si' always takes the imperfect subjunctive. The -ra form of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran."}
        note: "Don Quijote, who sees enchantment everywhere, takes a fallen false beard for a miracle rather than a disguise; the plot survives because he cannot imagine a trick."
  - sentences:
      - es: "El cura, que vio el peligro que corría su invención de ser descubierta, acudió luego a las barbas y fuese con ellas adonde yacía maese Nicolás, dando aún voces todavía, y de un golpe, llegándole la cabeza a su pecho, se las puso, murmurando sobre él unas palabras, que dijo que era cierto ensalmo apropiado para pegar barbas, como lo verían;"
        literal: "The curate, who saw the danger that ran his invention of being discovered, hurried at-once to the beards and went-himself with them to-where was-lying Master Nicolás, giving still shouts still, and in one blow, bringing-to-him the head to his chest, them to-him he-put, murmuring over him some words, which he-said that was certain charm suited for to-stick beards, as it they-would-see;"
        ormsby: "The curate, seeing the danger of discovery that threatened his scheme, at once pounced upon the beard and hastened with it to where Master Nicholas lay, still uttering moans, and drawing his head to his breast had it on in an instant, muttering over him some words which he said were a certain special charm for sticking on beards, as they would see;"
