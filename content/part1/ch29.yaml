          - {w: "facienda", d: "= hacienda, here 'affair, business' (old f- form)"}
          - {w: "fasta", d: "= hasta, until (old f- form)"}
        diagram:
          - s: "No os responderé palabra"
            r: "main verb 1: I will not answer you a word"
            under:
              - {s: "fermosa señora", r: "who he speaks to: beautiful lady"}
              - {s: "respondió don Quijote", r: "speech tag: answered Don Quijote"}
          - s: "ni oiré más cosa de vuestra facienda"
            r: "main verb 2: nor hear anything more of your affair"
            under:
              - {s: "fasta que os levantéis de tierra", r: "until when: until you rise from the ground"}
        forms:
          - {w: "responderé", f: "responder + -é → responder (to answer), future, I. The future is the infinitive + -é, -ás, -á, -emos, -éis, -án."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "oiré", f: "oir + -é → oír (to hear), future, I (the accent of the infinitive drops). Same future endings."}
          - {w: "os levantéis", f: "levant- + -éis → levantarse (to rise), present subjunctive, you (vos). Subjunctive after 'fasta que' for a time not yet reached. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
        note: "Don Quijote answers in his archaic chivalric Spanish, with f- for h- (fermosa, facienda, fasta), as he did with the girls at the first inn in chapter 2."
