  - sentences:
      - es: "Con lo que quedó tan contento Sancho cuanto el cura admirado de su simplicidad, y de ver cuán encajados tenía en la fantasía los mesmos disparates que su amo, pues sin alguna duda se daba a entender que había de venir a ser emperador."
        literal: "With which remained as content Sancho as the curate amazed at his simplicity, and at seeing how fitted-in he-had in the fancy the same nonsenses as his master, since without any doubt himself he-gave to understand that he-had to come to be emperor."
        ormsby: "with which Sancho was as much pleased as the curate was amazed at his simplicity and at seeing what a hold the absurdities of his master had taken of his fancy, for he had evidently persuaded himself that he was going to be an emperor."
        vocab:
          - {w: "tan ... cuanto", d: "as ... as (= tan ... como)"}
          - {w: "simplicidad", d: "simple-mindedness, naivety"}
          - {w: "encajado", d: "fitted in, lodged firmly"}
          - {w: "fantasía", d: "imagination, fancy"}
          - {w: "disparate", d: "nonsense, absurdity"}
          - {w: "darse a entender", d: "to persuade oneself, convince oneself"}
        diagram:
          - s: "quedó tan contento Sancho"
            r: "main verb (after 'Con lo que'): Sancho was left as pleased"
            under:
              - s: "cuanto el cura admirado"
