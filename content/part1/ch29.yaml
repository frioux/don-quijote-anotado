  - sentences:
      - es: "— Yo vos le otorgo y concedo —respondió don Quijote—, como no se haya de cumplir en daño o mengua de mi rey, de mi patria y de aquella que de mi corazón y libertad tiene la llave."
        literal: "— I to-you it grant and concede —answered Don Quijote—, as-long-as not itself has to fulfil in harm or lessening of my king, of my country and of that [lady] who of my heart and freedom has the key."
        ormsby: "“I grant and accord it,” said Don Quixote, “provided without detriment or prejudice to my king, my country, or her who holds the key of my heart and freedom, it may be complied with.”"
        vocab:
          - {w: "vos", d: "here the object 'to you' (old form of 'os'), part of the chivalric style"}
          - {w: "conceder", d: "to concede, grant"}
          - {w: "como no", d: "with the subjunctive: provided that ... not"}
          - {w: "mengua", d: "detriment, discredit, loss"}
          - {w: "patria", d: "homeland, country"}
        diagram:
          - s: "Yo vos le otorgo y concedo"
            r: "main verb: I grant and concede it to you"
            under:
              - {s: "respondió don Quijote", r: "speech tag: answered Don Quijote"}
              - s: "como no se haya de cumplir en daño o mengua de mi rey, de mi patria y de aquella"
                r: "condition: provided it is not to be done to the harm or discredit of my king, my country, and the lady"
                under:
                  - {s: "que de mi corazón y libertad tiene la llave", r: "describes 'aquella': who holds the key of my heart and freedom (Dulcinea)"}
        forms:
          - {w: "vos le", f: "'vos' = to you (old object form, modern 'os'); 'le' = it (the boon), Cervantes' 'le' for a masculine thing."}
          - {w: "otorgo, concedo", f: "otorg- + -o → otorgar (to grant), conced- + -o → conceder (to grant), present, I. The present: -o, -as, -a ... for -ar; -o, -es, -e, -emos, -éis, -en for -er."}
          - {w: "se haya de cumplir", f: "hay- + -a → haber, present subjunctive, it, + de + cumplir (to fulfil): 'is to be fulfilled'. Subjunctive after 'como' meaning 'provided that'. haber in the present subjunctive: haya, hayas, haya, hayamos, hayáis, hayan."}
          - {w: "aquella", f: "aquel (that) used alone, feminine: 'that lady'."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, she. tengo, tienes, tiene, tenemos, tenéis, tienen."}
        note: "The standard reservation of the romances: a knight grants a boon blind, but never against his king, his country or his lady. Don Quijote knows the formula by heart."
