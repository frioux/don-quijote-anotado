  - sentences:
      - es: "— Pues el que pido es —dijo la doncella— que la vuestra magnánima persona se venga luego conmigo donde yo le llevare, y me prometa que no se ha de entremeter en otra aventura ni demanda alguna hasta darme venganza de un traidor que, contra todo derecho divino y humano, me tiene usurpado mi reino."
        literal: "— Then the [one] that I-ask is —said the damsel— that the your magnanimous person itself come at-once with-me where I it may-take, and to-me promise that not itself has to meddle in other adventure nor quest any until to-give-me vengeance of a traitor who, against all law divine and human, from-me has usurped my kingdom."
        ormsby: "“Then what I ask,” said the damsel, “is that your magnanimous person accompany me at once whither I will conduct you, and that you promise not to engage in any other adventure or quest until you have avenged me of a traitor who against all human and divine law, has usurped my kingdom.”"
        vocab:
          - {w: "magnánimo", d: "magnanimous, great-souled"}
          - {w: "entremeterse en", d: "= entrometerse, to meddle in, get involved in"}
          - {w: "demanda", d: "quest (the knight's word for a mission); not 'demand'"}
          - {w: "traidor", d: "traitor"}
          - {w: "usurpar", d: "to usurp, seize unlawfully"}
        diagram:
          - s: "el que pido es"
            r: "main verb (after 'Pues'): the one I ask is"
            under:
              - {s: "dijo la doncella", r: "speech tag: said the damsel"}
              - s: "que la vuestra magnánima persona se venga luego conmigo"
                r: "what it is, 1: that your magnanimous person come with me at once"
                under:
                  - {s: "donde yo le llevare", r: "where: wherever I may take you"}
              - s: "y me prometa"
                r: "what it is, 2: and promise me"
                under:
                  - s: "que no se ha de entremeter en otra aventura ni demanda alguna"
                    r: "what to promise: not to take up any other adventure or quest"
                    under:
                      - s: "hasta darme venganza de un traidor"
                        r: "until when: until you avenge me on a traitor"
                        under:
                          - {s: "que, contra todo derecho divino y humano, me tiene usurpado mi reino", r: "describes 'traidor': who against all divine and human law has seized my kingdom"}
        forms:
          - {w: "pido", f: "pid- + -o → pedir (to ask for), present, I. pido, pides, pide, pedimos, pedís, piden."}
          - {w: "se venga", f: "veng- + -a → venirse (to come along), present subjunctive, it (your person). Subjunctive because it is what I ask. venir in the present subjunctive: venga, vengas, venga, vengamos, vengáis, vengan."}
          - {w: "conmigo", f: "con + mí fused into one word: 'with me'."}
          - {w: "llevare", f: "llev- + -are → llevar (to take), future subjunctive, I: 'wherever I may take'. The future subjunctive of -ar verbs: -are, -ares, -are, -áremos, -areis, -aren. Modern 'lleve'."}
          - {w: "prometa", f: "promet- + -a → prometer (to promise), present subjunctive, it (your person). The present subjunctive of -er verbs: -a, -as, -a, -amos, -áis, -an."}
          - {w: "se ha de entremeter", f: "ha = haber, present, it, + de + entremeterse (to meddle): 'is to get involved'. he, has, ha, hemos, habéis, han."}
          - {w: "darme", f: "dar (to give) + me (to me), infinitive after 'hasta'."}
          - {w: "tiene usurpado", f: "tien- + -e → tener (to have), present, he, + usurpado, participle of usurpar (to seize): 'has seized (and keeps)'. tengo, tienes, tiene, tenemos, tenéis, tienen."}
        note: "Dorotea's boon copies the romances: the damsel binds the knight to follow her and take up no other adventure until her wrong is righted. It is exactly what the curate's plan needs to lead Don Quijote home."
