          - {w: "ese, dese", f: "ese (that), masculine; 'dese' = de + ese, fused."}
          - {w: "dice", f: "dic- + -e → decir (to say), present, you (vuestra merced, which takes the he/she form). digo, dices, dice, decimos, decís, dicen."}
        note: "'Ese hideputa dese gigante', 'that son of a whore of a giant', is the Spanish pattern 'ese tonto de Juan', 'that fool of a Juan'. Sancho swears casually, as peasants did."
