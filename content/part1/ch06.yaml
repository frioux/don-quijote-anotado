part: 1
chapter: 6
title_es: "Capítulo VI. Del donoso y grande escrutinio que el cura y el barbero hicieron en la librería de nuestro ingenioso hidalgo"
title_en: "Of the diverting and important scrutiny which the curate and the barber made in the library of our ingenious gentleman"
paragraphs:
  - sentences:
      - es: "el cual aún todavía dormía."
        literal: "the which still yet was-sleeping."
        ormsby: "He was still sleeping;"
        vocab:
          - {w: "el cual", d: "who, which; a relative pronoun that here picks up 'don Quijote' from the last words of Chapter 5"}
          - {w: "aún todavía", d: "still, even now; two words for 'still' doubled for emphasis"}
        diagram:
          - s: "dormía"
            r: "main verb: was sleeping"
            under:
              - {s: "el cual", r: "subject: who, i.e. Don Quijote"}
              - {s: "aún todavía", r: "when: still"}
        forms:
          - {w: "el cual", f: "article + cual: 'the which' = who. It agrees with the person it stands for: el cual, la cual, los cuales, las cuales."}
          - {w: "dormía", f: "dorm- + -ía → dormir (to sleep), imperfect, he: 'was sleeping'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
        ormsby_note: "In the original the passage runs: 'Who was even still sleeping. He asked the niece for the keys,' etc. It is a minor instance of Cervantes' disregard of the ordinary laws of composition, and also a proof that at this stage of the work he had not originally contemplated a division into chapters."
        note: "The chapter opens in mid-sentence: Chapter 5 ended with the curate coming with his friend the barber, maese Nicolás, to the house of Don Quijote, 'who was still asleep'."
      - es: "Pidió las llaves, a la sobrina, del aposento donde estaban los libros, autores del daño, y ella se las dio de muy buena gana."
        literal: "He-asked-for the keys, to the niece, of-the room where were the books, authors of-the harm, and she to-him them gave of very good will."
        ormsby: "so the curate asked the niece for the keys of the room where the books, the authors of all the mischief, were, and right willingly she gave them."
        vocab:
          - {w: "pedir", d: "to ask for; the person asked takes 'a': 'pedir algo a alguien'"}
          - {w: "llave", d: "key"}
          - {w: "aposento", d: "room, chamber"}
          - {w: "autores del daño", d: "the authors (causes) of the harm; the books are treated as culprits"}
          - {w: "daño", d: "harm, damage, mischief"}
          - {w: "de buena gana", d: "willingly, gladly; 'gana' = desire, appetite"}
        diagram:
          - s: "Pidió las llaves"
            r: "main verb 1: he (the curate) asked for the keys"
            under:
              - {s: "a la sobrina", r: "from whom: the niece"}
              - s: "del aposento"
                r: "whose keys: of the room"
                under:
                  - s: "donde estaban los libros"
                    r: "describes 'aposento': where the books were"
                    under:
                      - {s: "autores del daño", r: "describes 'libros': the culprits"}
          - s: "y ella se las dio"
            r: "main verb 2: and she gave them to him"
            under:
              - {s: "de muy buena gana", r: "how: very willingly"}
        forms:
          - {w: "Pidió", f: "pid- + -ió → pedir (to ask for), preterite, he: 'asked for'. The e of the stem turns to i in this form: pedí, pediste, pidió, pedimos, pedisteis, pidieron."}
          - {w: "del", f: "de + el (of the)."}
          - {w: "estaban", f: "est- + -aban → estar (to be, for place), imperfect, they (the books). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "se las", f: "'se' stands in for 'le' (to him), because le / les turns into 'se' before lo / la / los / las; 'las' = them, feminine plural for 'las llaves'."}
          - {w: "dio", f: "d- + -io → dar (to give), preterite, she. Irregular: di, diste, dio, dimos, disteis, dieron."}
          - {w: "buena", f: "buen- + -a → bueno (good), feminine to match 'gana'."}
      - es: "Entraron dentro todos, y la ama con ellos, y hallaron más de cien cuerpos de libros grandes, muy bien encuadernados, y otros pequeños;"
        literal: "They-entered inside all, and the housekeeper with them, and they-found more than hundred bodies of books big, very well bound, and others small;"
        ormsby: "They all went in, the housekeeper with them, and found more than a hundred volumes of big books very well bound, and some other small ones."
        vocab:
          - {w: "ama", d: "housekeeper"}
          - {w: "hallar", d: "to find"}
          - {w: "cuerpo de libro", d: "volume (literally 'body of a book')"}
          - {w: "encuadernado", d: "bound (of a book); 'encuadernar' = to bind"}
        diagram:
          - s: "Entraron dentro"
            r: "main verb 1: they went in"
            under:
              - {s: "todos", r: "subject: all of them"}
              - {s: "y la ama con ellos", r: "and the housekeeper too"}
          - s: "y hallaron"
            r: "main verb 2: and they found"
            under:
              - s: "más de cien cuerpos de libros grandes"
                r: "object 1: over a hundred big volumes"
                under:
                  - {s: "muy bien encuadernados", r: "describes the volumes: very well bound"}
              - {s: "y otros pequeños", r: "object 2: and other small ones"}
        forms:
          - {w: "Entraron", f: "entr- + -aron → entrar (to go in), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "la ama", f: "modern Spanish says 'el ama': a feminine noun beginning with stressed a- takes 'el'. Cervantes writes both 'la ama' and 'el ama' in this chapter."}
          - {w: "hallaron", f: "hall- + -aron → hallar (to find), preterite, they. Same -ar preterite."}
          - {w: "más de cien", f: "'more than' before a number is 'más de', not 'más que'. 'cien' is 'ciento' clipped before a noun."}
          - {w: "encuadernados", f: "encuadern- + -ados → participle of encuadernar (to bind), masculine plural to match 'libros'."}
          - {w: "pequeños", f: "pequeñ- + -os → pequeño (small), masculine plural to match 'otros [libros]'."}
        ormsby_note: "The romances of chivalry were, with not more than two or three exceptions, produced in the folio form, while the books of poetry, the pastorals, the cancioneros, and romanceros, were either in small quarto or much more commonly in small octavo corresponding in size with our duodecimo."
      - es: "y, así como el ama los vio, volvióse a salir del aposento con gran priesa, y tornó luego con una escudilla de agua bendita y un hisopo, y dijo:"
        literal: "and, as soon as the housekeeper them saw, she-turned-herself to go-out of-the room with great haste, and returned at-once with a bowl of water blessed and a sprinkler, and said:"
        ormsby: "The moment the housekeeper saw them she turned about and ran out of the room, and came back immediately with a saucer of holy water and a sprinkler, saying,"
        vocab:
          - {w: "así como", d: "as soon as, the moment that"}
          - {w: "volverse a", d: "to turn back and (do something); here 'she turned round and went out'"}
          - {w: "priesa", d: "= prisa, haste; archaic form"}
          - {w: "tornar", d: "to return, come back (literary)"}
          - {w: "luego", d: "at once, immediately; in Cervantes 'luego' usually means 'right away', not 'later'"}
          - {w: "escudilla", d: "small bowl, porringer"}
          - {w: "agua bendita", d: "holy water"}
          - {w: "hisopo", d: "aspergillum, the brush or perforated ball a priest uses to sprinkle holy water"}
        diagram:
          - s: "volvióse a salir del aposento"
            r: "main verb 1: she turned and went out of the room"
            under:
              - {s: "así como el ama los vio", r: "when: the moment the housekeeper saw them"}
              - {s: "con gran priesa", r: "how: in a great hurry"}
          - s: "y tornó luego"
            r: "main verb 2: and came straight back"
            under:
              - {s: "con una escudilla de agua bendita y un hisopo", r: "with what: a bowl of holy water and a sprinkler"}
          - {s: "y dijo:", r: "main verb 3: and said (what follows in the next paragraph)"}
        forms:
          - {w: "los", f: "them (the books), masculine plural object pronoun, before the verb."}
          - {w: "vio", f: "v- + -io → ver (to see), preterite, she. Irregular: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "volvióse", f: "volv- + -ió + se → volver (to turn) with 'se' (herself) stuck on the end: 'she turned round'. Cervantes hangs pronouns on the end of a conjugated verb that opens its clause; modern Spanish says 'se volvió'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "salir", f: "infinitive (to go out) after 'volverse a'."}
          - {w: "gran", f: "grande clipped before a singular noun."}
          - {w: "priesa", f: "old form of prisa (haste)."}
          - {w: "tornó", f: "torn- + -ó → tornar (to come back), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "bendita", f: "bendit- + -a → bendito (blessed), the old participle of bendecir (to bless), feminine to match 'agua'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, she. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Tome vuestra merced, señor licenciado: rocíe este aposento, no esté aquí algún encantador de los muchos que tienen estos libros, y nos encanten, en pena de las que les queremos dar echándolos del mundo."
        literal: "— Take your grace, sir licentiate: sprinkle this room, lest be here some enchanter of the many that have these books, and us they-enchant, in penalty of those that to-them we-want to-give throwing-them from-the world."
        ormsby: "“Here, your worship, señor licentiate, sprinkle this room; don’t leave any magician of the many there are in these books to bewitch us in revenge for our design of banishing them from the world.”"
        vocab:
          - {w: "vuestra merced", d: "your grace, your worship; the polite 'you', ancestor of modern 'usted', and it takes a he/she verb"}
          - {w: "licenciado", d: "licentiate, holder of a university degree; the curate's title"}
          - {w: "rociar", d: "to sprinkle, spray"}
          - {w: "no esté", d: "lest there be; 'no' + subjunctive expressing a fear, 'in case'"}
          - {w: "encantador", d: "enchanter, wizard; in the romances enchanters constantly help or persecute knights"}
          - {w: "encantar", d: "to enchant, put a spell on"}
          - {w: "en pena de", d: "as punishment for, in revenge for"}
          - {w: "las que les queremos dar", d: "those [penalties] that we mean to give them"}
          - {w: "echar del mundo", d: "to throw out of the world, i.e. destroy"}
        diagram:
          - s: "Tome vuestra merced"
            r: "main verb 1: take [this], your grace"
            under:
              - {s: "señor licenciado", r: "who is addressed"}
          - s: "rocíe este aposento"
            r: "main verb 2: sprinkle this room"
            under:
              - s: "no esté aquí algún encantador de los muchos"
                r: "why: in case some enchanter is here"
                under:
                  - {s: "que tienen estos libros", r: "describes 'los muchos': that these books contain"}
              - s: "y nos encanten"
                r: "and in case they enchant us"
                under:
                  - s: "en pena de las"
                    r: "why they would: as payback for the [penalties]"
                    under:
                      - {s: "que les queremos dar echándolos del mundo", r: "describes 'las': that we mean to give them by throwing them out of the world"}
        forms:
          - {w: "Tome", f: "tom- + -e → tomar (to take), present subjunctive used as a polite command to 'vuestra merced': 'take'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "rocíe", f: "rocí- + -e → rociar (to sprinkle), present subjunctive as a polite command: 'sprinkle'. Same -ar subjunctive; the accent on í shows the stress."}
          - {w: "este", f: "'this', masculine to match 'aposento'."}
          - {w: "esté", f: "est- + -é → estar (to be), present subjunctive, he: 'be'. estar: esté, estés, esté, estemos, estéis, estén. Subjunctive because 'no' here means 'lest'."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun."}
          - {w: "tienen", f: "tien- + -en → tener (to have), present, they (the books). tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "nos encanten", f: "encant- + -en → encantar (to enchant), present subjunctive, they, with 'nos' (us). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. Plural because she now thinks of the many enchanters."}
          - {w: "las", f: "'those', feminine plural standing for 'penas' (penalties)."}
          - {w: "les", f: "to them (the enchanters or the books)."}
          - {w: "queremos", f: "quer- + -emos → querer (to want), present, we. The e becomes ie only when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "echándolos", f: "ech- + -ando + los → gerund of echar (to throw) with 'los' (them) attached: 'throwing them'. A pronoun always attaches to the end of a gerund; the accent keeps the stress on -án-."}
        note: "The housekeeper treats the library as if it were haunted: the enchanters are inside the books, and holy water will keep them from taking revenge. It is the first sign that the household half-believes the romances too."
  - sentences:
      - es: "Causó risa al licenciado la simplicidad del ama, y mandó al barbero que le fuese dando de aquellos libros uno a uno, para ver de qué trataban, pues podía ser hallar algunos que no mereciesen castigo de fuego."
        literal: "Caused laughter to-the licentiate the simplicity of-the housekeeper, and he-ordered to-the barber that to-him he-should-go giving of those books one by one, to see of what they-treated, since it-could be to-find some that not might-deserve punishment of fire."
        ormsby: "The simplicity of the housekeeper made the licentiate laugh, and he directed the barber to give him the books one by one to see what they were about, as there might be some to be found among them that did not deserve the penalty of fire."
        vocab:
          - {w: "causar risa", d: "to make (someone) laugh; literally 'to cause laughter'"}
          - {w: "simplicidad", d: "simple-mindedness, naivety"}
          - {w: "mandar", d: "to order, command"}
          - {w: "ir dando", d: "to keep handing, hand one after another; 'ir' + gerund = gradual action"}
          - {w: "tratar de", d: "to be about, deal with"}
          - {w: "pues", d: "since, for"}
          - {w: "podía ser", d: "it might be, it was possible"}
          - {w: "castigo", d: "punishment"}
        diagram:
          - s: "Causó risa"
            r: "main verb 1: caused laughter"
            under:
              - {s: "al licenciado", r: "to whom: the licentiate"}
              - {s: "la simplicidad del ama", r: "subject: the housekeeper's naivety"}
          - s: "y mandó al barbero"
            r: "main verb 2: and he ordered the barber"
            under:
              - s: "que le fuese dando de aquellos libros uno a uno"
                r: "what he ordered: to hand him the books one at a time"
                under:
                  - {s: "para ver de qué trataban", r: "why: to see what they were about"}
                  - s: "pues podía ser hallar algunos"
                    r: "why: since they might find some"
                    under:
                      - {s: "que no mereciesen castigo de fuego", r: "describes 'algunos': that did not deserve the fire"}
        forms:
          - {w: "Causó", f: "caus- + -ó → causar (to cause), preterite, it. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "al, del", f: "a + el, de + el."}
          - {w: "mandó", f: "mand- + -ó → mandar (to order), preterite, he. Same -ar preterite."}
          - {w: "fuese dando", f: "fu- + -ese → ir (to go), imperfect subjunctive (-se form), he, + dando, the gerund of dar (to give): 'should keep handing'. ir in the -se form: fuese, fueses, fuese, fuésemos, fueseis, fuesen. Subjunctive because it follows 'mandó ... que' (ordered that)."}
          - {w: "le", f: "to him (the curate)."}
          - {w: "ver", f: "infinitive (to see) after 'para' = in order to."}
          - {w: "qué", f: "'what', with the accent because it is a question word inside an indirect question."}
          - {w: "trataban", f: "trat- + -aban → tratar (to deal with), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "podía", f: "pod- + -ía → poder (to be able), imperfect, it: 'it could be'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "hallar", f: "infinitive (to find), the subject of 'podía ser': 'finding might be [possible]'."}
          - {w: "mereciesen", f: "merec- + -iesen → merecer (to deserve), imperfect subjunctive (-se form), they: 'might deserve'. Built on the preterite merecieron: mereciese, merecieses, mereciese, mereciésemos, merecieseis, mereciesen. Subjunctive because the books are only hypothetical."}
  - sentences:
      - es: "— No —dijo la sobrina—, no hay para qué perdonar a ninguno, porque todos han sido los dañadores;"
        literal: "— No —said the niece—, not there-is for what to-pardon to none, because all have been the harm-doers;"
        ormsby: "“No,” said the niece, “there is no reason for showing mercy to any of them; they have every one of them done mischief;"
        vocab:
          - {w: "no hay para qué", d: "there is no reason to, no need to"}
          - {w: "perdonar", d: "to pardon, spare"}
          - {w: "dañador", d: "wrongdoer, one who does harm"}
        diagram:
          - s: "dijo la sobrina"
            r: "speech tag: said the niece"
          - s: "no hay para qué perdonar a ninguno"
            r: "main verb: there is no reason to spare any"
            under:
              - {s: "porque todos han sido los dañadores", r: "why: all of them have been the culprits"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, she. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "hay", f: "haber, the special present form 'there is / there are'; it never changes."}
          - {w: "perdonar", f: "infinitive (to spare) after 'para qué'."}
          - {w: "a ninguno", f: "'a' marks a direct object treated like a person; the books are spoken of as culprits. 'no ... ninguno': Spanish doubles negatives."}
          - {w: "han sido", f: "han (haber, present, they) + sido (participle of ser, to be): present perfect, they: 'have been'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "dañadores", f: "dañ- + -ador + -es → dañar (to harm) + the -dor ending that makes a doer, plural: 'harm-doers'."}
      - es: "mejor será arrojarlos por las ventanas al patio, y hacer un rimero dellos y pegarles fuego;"
        literal: "better will-be to-throw-them through the windows to-the courtyard, and to-make a pile of-them and to-stick-to-them fire;"
        ormsby: "better fling them out of the window into the court and make a pile of them and set fire to them;"
        vocab:
          - {w: "arrojar", d: "to throw, fling"}
          - {w: "patio", d: "the inner courtyard of a Spanish house, open to the sky"}
          - {w: "rimero", d: "heap, pile"}
          - {w: "dellos", d: "= de ellos, 'of them'"}
          - {w: "pegar fuego a", d: "to set fire to"}
        diagram:
          - s: "mejor será"
            r: "main verb: it will be better"
            under:
              - {s: "arrojarlos por las ventanas al patio", r: "subject 1: to throw them out of the windows into the courtyard"}
              - {s: "y hacer un rimero dellos", r: "subject 2: and to make a pile of them"}
              - {s: "y pegarles fuego", r: "subject 3: and to set fire to them"}
        forms:
          - {w: "será", f: "ser (to be), future, it: 'will be'. The future is the infinitive + -é, -ás, -á, -emos, -éis, -án: seré, serás, será, seremos, seréis, serán."}
          - {w: "arrojarlos", f: "arrojar (to throw) + los (them). A pronoun attaches to the end of an infinitive."}
          - {w: "al", f: "a + el."}
          - {w: "hacer", f: "infinitive (to make), second subject of 'será'."}
          - {w: "dellos", f: "de + ellos (of them). Cervantes fuses 'de' with él, ella, ellos, este: dél, della, dellos, deste."}
          - {w: "pegarles", f: "pegar (to stick; 'pegar fuego a' = to set fire to) + les (to them)."}
        ormsby_note: "The court the niece speaks of, was the patio or open space in the middle of the house; the corral or yard was on the outside."
      - es: "y si no, llevarlos al corral, y allí se hará la hoguera, y no ofenderá el humo."
        literal: "and if not, to-carry-them to-the yard, and there will-be-made the bonfire, and not will-offend the smoke."
        ormsby: "or else carry them into the yard, and there a bonfire can be made without the smoke giving any annoyance.”"
        vocab:
          - {w: "si no", d: "otherwise, or else"}
          - {w: "corral", d: "yard, enclosed yard outside the house"}
          - {w: "hoguera", d: "bonfire; also the stake where heretics were burned"}
          - {w: "ofender", d: "here: to bother, be a nuisance"}
          - {w: "humo", d: "smoke"}
        diagram:
          - s: "llevarlos al corral"
            r: "second choice: carry them to the yard ('mejor será' understood)"
            under:
              - {s: "y si no", r: "condition: or else"}
          - s: "y allí se hará la hoguera"
            r: "main verb 2: and there the bonfire will be made"
          - s: "y no ofenderá el humo"
            r: "main verb 3: and the smoke will not bother anyone"
        forms:
          - {w: "llevarlos", f: "llevar (to carry) + los (them). A pronoun attaches to the end of an infinitive."}
          - {w: "se hará", f: "har- + -á → hacer (to make), future, it, with 'se' making it passive: 'will be made'. hacer has a short future stem har-: haré, harás, hará, haremos, haréis, harán."}
          - {w: "ofenderá", f: "ofender + -á → ofender (to bother), future, it. The future is the whole infinitive + -é, -ás, -á, -emos, -éis, -án."}
        note: "The 'hoguera' and the language of pardon, condemnation and heresy through this chapter parody an auto de fe of the Inquisition, in which books and people were judged and burned."
  - sentences:
      - es: "Lo mismo dijo el ama: tal era la gana que las dos tenían de la muerte de aquellos inocentes; mas el cura no vino en ello sin primero leer siquiera los títulos."
        literal: "The same said the housekeeper: such was the desire that the two had of the death of those innocents; but the priest not came in it without first to-read at-least the titles."
        ormsby: "The housekeeper said the same, so eager were they both for the slaughter of those innocents, but the curate would not agree to it without first reading at any rate the titles."
        vocab:
          - {w: "lo mismo", d: "the same thing"}
          - {w: "gana", d: "desire, eagerness"}
          - {w: "inocentes", d: "innocents; an echo of the massacre of the Holy Innocents by Herod"}
          - {w: "mas", d: "but (literary; no accent, unlike 'más' = more)"}
          - {w: "cura", d: "parish priest, curate"}
          - {w: "venir en", d: "to agree to, consent to"}
          - {w: "siquiera", d: "at least, even"}
        diagram:
          - s: "Lo mismo dijo el ama"
            r: "main verb 1: the housekeeper said the same"
          - s: "tal era la gana"
            r: "main verb 2: such was the eagerness"
