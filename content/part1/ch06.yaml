            r: "main verb 1: are the best"
            under:
              - {s: "Todos esos tres libros", r: "subject: all those three books"}
              - {s: "que, en verso heroico, en lengua castellana están escritos", r: "describes 'mejores': that are written in epic verse in Castilian"}
          - {s: "dijo el cura", r: "speech tag: said the priest"}
          - s: "y pueden competir con los más famosos de Italia:"
            r: "main verb 2: and they can rival the most famous of Italy"
          - s: "guárdense"
            r: "main verb 3: let them be kept"
            under:
              - s: "como las más ricas prendas de poesía"
                r: "how: as the richest treasures of poetry"
                under:
                  - {s: "que tiene España", r: "describes 'prendas': that Spain has"}
        forms:
          - {w: "esos", f: "es- + -os → 'those', masculine plural to match 'libros'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "son", f: "ser (to be), present, they. soy, eres, es, somos, sois, son."}
          - {w: "los mejores", f: "article + mejores (plural of mejor, the comparative of bueno) = 'the best'."}
          - {w: "están escritos", f: "están (estar, present, they) + escritos (irregular participle of escribir, to write, masculine plural): 'are written'. estoy, estás, está, estamos, estáis, están."}
          - {w: "pueden", f: "pued- + -en → poder (can), present, they. The o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "competir", f: "infinitive (to compete) after 'pueden'."}
          - {w: "guárdense", f: "guard- + -en + se → guardar (to keep), present subjunctive, they, with passive 'se' stuck on the end: 'let them be kept'. A clause-opening verb takes its pronoun on the end. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "las más ricas", f: "article + más + adjective = superlative 'the richest', feminine plural to match 'prendas'."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, it (Spain). tengo, tienes, tiene, tenemos, tenéis, tienen."}
  - sentences:
      - es: "Cansóse el cura de ver más libros; y así, a carga cerrada, quiso que todos los demás se quemasen; pero ya tenía abierto uno el barbero, que se llamaba Las lágrimas de Angélica."
        literal: "Tired-himself the priest of seeing more books; and so, at load closed, he-wanted that all the rest be-burned; but already had open one the barber, which was-called The tears of Angelica."
        ormsby: "The curate was tired and would not look into any more books, and so he decided that, “contents uncertified,” all the rest should be burned; but just then the barber held open one, called The Tears of Angelica."
        vocab:
          - {w: "cansarse de", d: "to tire of, get tired of"}
          - {w: "a carga cerrada", d: "wholesale, without looking; literally 'with the load closed', buying goods without opening the bales"}
          - {w: "Las lágrimas de Angélica", d: "'The Tears of Angelica' (1586), an epic by Luis Barahona de Soto continuing Ariosto's story of the beautiful Angelica"}
          - {w: "lágrima", d: "tear"}
        diagram:
          - s: "Cansóse el cura"
            r: "main verb 1: the priest got tired"
            under:
              - {s: "de ver más libros", r: "of what: of looking at more books"}
          - s: "quiso"
            r: "main verb 2 (after 'y así'): he wanted"
            under:
              - {s: "a carga cerrada", r: "how: wholesale, unexamined"}
              - {s: "que todos los demás se quemasen", r: "what: that all the rest be burned"}
          - s: "pero ya tenía abierto uno el barbero"
            r: "main verb 3: but the barber already had one open"
            under:
              - {s: "que se llamaba Las lágrimas de Angélica", r: "describes 'uno': called The Tears of Angelica"}
        forms:
          - {w: "Cansóse", f: "cans- + -ó + se → cansarse (to get tired), preterite, he, with 'se' stuck on the end. Cervantes hangs pronouns on the end of a conjugated verb that opens its clause; modern Spanish says 'se cansó'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "ver", f: "infinitive (to see) after 'de'."}
          - {w: "quiso", f: "quis- + -o → querer (to want), preterite, he. Irregular: quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "se quemasen", f: "quem- + -asen → quemar (to burn), imperfect subjunctive (-se form), they, with passive 'se': 'be burned'. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. Subjunctive after 'quiso que' (wanted that)."}
          - {w: "tenía abierto", f: "ten- + -ía → tener (to have), imperfect, he, + abierto (irregular participle of abrir, to open): 'had [it] open'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
