  - sentences:
      - es: "— Pues la del Salmantino —respondió el cura—, acompañe y acreciente el número de los condenados al corral, y la de Gil Polo se guarde como si fuera del mesmo Apolo; y pase adelante, señor compadre, y démonos prisa, que se va haciendo tarde."
        literal: "— Well the-one of-the Salamancan —answered the priest—, let-it-accompany and increase the number of the condemned to-the yard, and the-one of Gil Polo let-it-be-kept as if it-were of-the same Apollo; and pass forward, sir gossip, and let-us-give-ourselves haste, for it-is-going becoming late."
        ormsby: "“As for that of the Salamancan,” replied the curate, “let it go to swell the number of the condemned in the yard, and let Gil Polo’s be preserved as if it came from Apollo himself: but get on, gossip, and make haste, for it is growing late.”"
        vocab:
          - {w: "acrecentar", d: "to increase, swell"}
          - {w: "condenado", d: "condemned man; the trial language again"}
          - {w: "como si fuera del mesmo Apolo", d: "as if it were by Apollo himself; a pun on Polo / Apolo"}
          - {w: "Apolo", d: "Apollo, Greek god of poetry and leader of the Muses"}
          - {w: "pasar adelante", d: "to go on, carry on"}
          - {w: "compadre", d: "friend, 'gossip'; a friendly form of address between men"}
          - {w: "darse prisa", d: "to hurry"}
          - {w: "irse haciendo tarde", d: "to be getting late"}
        diagram:
          - s: "acompañe y acreciente el número de los condenados al corral"
            r: "main verb 1: let it join and swell the number condemned to the yard"
            under:
              - {s: "Pues la del Salmantino", r: "subject: well, the Salamancan's"}
          - {s: "respondió el cura", r: "speech tag: answered the priest"}
          - s: "y la de Gil Polo se guarde"
            r: "main verb 2: and let Gil Polo's be kept"
            under:
              - {s: "como si fuera del mesmo Apolo", r: "how: as if it were by Apollo himself"}
          - s: "y pase adelante"
            r: "main verb 3: and go on"
            under:
              - {s: "señor compadre", r: "who is addressed"}
          - s: "y démonos prisa"
            r: "main verb 4: and let's hurry"
            under:
              - {s: "que se va haciendo tarde", r: "why: for it's getting late"}
        forms:
          - {w: "la del, la de", f: "'the one of', feminine standing for 'La Diana'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "acompañe", f: "acompañ- + -e → acompañar (to go with), present subjunctive, it: 'let it go with'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. The subjunctive gives a command about a third person."}
          - {w: "acreciente", f: "acrecient- + -e → acrecentar (to increase), present subjunctive, it; the e becomes ie when stressed. Same -ar subjunctive."}
          - {w: "se guarde", f: "guard- + -e → guardar (to keep), present subjunctive, it, passive 'se': 'let it be kept'. Same -ar subjunctive."}
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), it: 'as if it were'. Built on the preterite fueron: fuera, fueras, fuera, fuéramos, fuerais, fueran. 'como si' always takes the imperfect subjunctive."}
          - {w: "pase", f: "pas- + -e → pasar (to pass), present subjunctive as a polite command to 'señor compadre': 'go on'. Same -ar subjunctive."}
          - {w: "démonos", f: "demos (dar, to give, present subjunctive, we: 'let us give') + nos (ourselves); the -s of -mos drops before 'nos': 'let us hurry'. dar: dé, des, dé, demos, deis, den."}
          - {w: "se va haciendo", f: "va (ir, to go, present, it) + haciendo (gerund of hacer, to make), with 'se': 'it is getting [late]'. 'ir' + gerund = a gradual change. voy, vas, va, vamos, vais, van."}
        ormsby_note: "Los Siete Libros de la Diana de Jorge de Montemayor. Impreso en Valencia, 4to. The first edition is undated, and from the dedication appears to have been printed in the author's lifetime. He died in 1561, in which year the second edition, with additions, appeared. The Diana was the first and best of the Spanish pastoral romances, the taste for which was created by Sannazaro's Arcadia. The Salamancan was Alonso Pérez, who published a continuation of the Diana at Alcalá de Henares in 1564, but Gil Polo's, printed the same year at Valencia, has been generally preferred. The pun on Polo and Apolo is not so obvious in English. An excellent English translation of all three by Bartholomew Yong was published in 1598."
