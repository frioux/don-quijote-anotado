  - sentences:
      - es: "Todo lo confirmó el barbero, y lo tuvo por bien y por cosa muy acertada, por entender que era el cura tan buen cristiano y tan amigo de la verdad, que no diría otra cosa por todas las del mundo."
        literal: "All it confirmed the barber, and it held for good and for thing very right, for understanding that was the priest so good Christian and so friend of the truth, that not he-would-say other thing for all those of-the world."
        ormsby: "To all this the barber gave his assent, and looked upon it as right and proper, being persuaded that the curate was so staunch to the Faith and loyal to the Truth that he would not for the world say anything opposed to them."
        vocab:
          - {w: "confirmar", d: "to confirm, approve"}
          - {w: "tener por bien", d: "to consider right, approve"}
          - {w: "acertado", d: "right, well judged"}
          - {w: "por entender que", d: "because he understood that"}
          - {w: "amigo de", d: "fond of, devoted to"}
          - {w: "por todas las del mundo", d: "for all the [things] in the world, i.e. not for anything"}
        diagram:
          - s: "Todo lo confirmó el barbero"
            r: "main verb 1: the barber approved it all"
          - s: "y lo tuvo por bien y por cosa muy acertada"
            r: "main verb 2: and thought it right and very well judged"
            under:
              - s: "por entender que era el cura tan buen cristiano y tan amigo de la verdad"
                r: "why: because he believed the priest was so good a Christian and so devoted to truth"
                under:
                  - {s: "que no diría otra cosa por todas las del mundo", r: "result: that he would not say otherwise for anything"}
        forms:
          - {w: "Todo lo", f: "'todo' put first and repeated by 'lo' (it): 'all of it'. Spanish often doubles a fronted object with a pronoun."}
          - {w: "confirmó", f: "confirm- + -ó → confirmar (to approve), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "tuvo", f: "tuv- + -o → tener (to hold; 'tener por' = to consider), preterite, he. Irregular: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron."}
          - {w: "acertada", f: "acert- + -ada → participle of acertar (to get right), feminine to match 'cosa'."}
          - {w: "entender", f: "infinitive (to understand) after 'por': 'because of understanding'."}
          - {w: "era", f: "ser (to be), imperfect, he. ser's imperfect is irregular: era, eras, era, éramos, erais, eran."}
          - {w: "buen", f: "bueno clipped before a masculine singular noun."}
          - {w: "diría", f: "dir- + -ía → decir (to say), conditional, he: 'would say'. decir has a short stem dir-: diría, dirías, diría, diríamos, diríais, dirían."}
          - {w: "las", f: "'those', feminine plural standing for 'cosas'."}
        note: "The joke is double: the barber defers to the curate as a man of the Faith, and the whole scene keeps sliding into the language of the Inquisition, where agreeing with the judge was the safe course."
