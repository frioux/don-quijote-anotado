        forms:
          - {w: "el que", f: "'the one who', the article as a pronoun + que."}
          - {w: "le ha leído", f: "ha (haber, present, he) + leído (participle of leer, to read), with 'le' (it, the book): 'has read it'. haber in the present: he, has, ha, hemos, habéis, han. 'le' for a masculine thing is leísmo."}
          - {w: "puede", f: "pued- + -e → poder (can), present, he. The o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
