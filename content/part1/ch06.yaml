  - sentences:
      - es: "— Por nombre tan santo como este libro tiene, se podía perdonar su ignorancia; mas también se suele decir: \"tras la cruz está el diablo\"; vaya al fuego."
        literal: "— For name so holy as this book has, could-be pardoned its ignorance; but also it-is-usual to-say: \"behind the cross is the devil\"; let-it-go to-the fire."
        ormsby: "“For the sake of the holy name this book has,” said the curate, “its ignorance might be excused; but then, they say, ‘behind the cross there’s the devil’; to the fire with it.”"
