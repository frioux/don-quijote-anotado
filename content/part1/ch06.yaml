      - es: "Llevadle a casa y leedle, y veréis que es verdad cuanto dél os he dicho."
        literal: "Carry-it to home and read-it, and you-will-see that is truth all-that of-it to-you I-have said."
        ormsby: "Take it home with you and read it, and you will see that what I have said is true.”"
        vocab:
          - {w: "cuanto", d: "all that, everything that"}
          - {w: "dél", d: "= de él, 'about it'"}
        diagram:
          - {s: "Llevadle a casa", r: "command 1: take it home"}
          - {s: "y leedle", r: "command 2: and read it"}
          - s: "y veréis"
            r: "main verb: and you will see"
            under:
              - {s: "que es verdad cuanto dél os he dicho", r: "what: that all I have told you about it is true"}
        forms:
          - {w: "Llevadle, leedle", f: "llevad, leed (vos / vosotros commands of llevar, to carry, and leer, to read: the infinitive's -r becomes -d) + le (it, the book). A pronoun attaches to the end of a positive command; 'le' for a masculine thing is leísmo."}
          - {w: "veréis", f: "ver + -éis → ver (to see), future, you (vos / vosotros). The future is the whole infinitive + -é, -ás, -á, -emos, -éis, -án."}
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "dél", f: "de + él (about it). Cervantes fuses 'de' with él, ella, ellos, este: dél, della, dellos, deste."}
          - {w: "he dicho", f: "he (haber, present, I) + dicho (irregular participle of decir, to say): present perfect, I: 'I have said'. haber in the present: he, has, ha, hemos, habéis, han."}
        ormsby_note: "Tirante el Blanco is the title of the translation into Castilian of the romance of Tirant lo Blanch, first published in Valencian at Valencia in 1490. Joanot Martorell, who is said to have translated it from English into Portuguese and thence into Valencian, was no doubt the author. Only three copies are known to exist, one in the University at Valencia, another in the College of the Sapienza in Rome, and the third in the British Museum. The Castilian version appeared at Valladolid in 1511. Don Pascual de Gayangos is in doubt whether the curate's eulogy is to be taken as ironical or serious, but rather inclines to the belief that Cervantes meant to praise the book. It would be rash to differ with such an authority, otherwise I should say that the laudation is rather too boisterously expressed and too like the extravagant eulogy of Lo Frasso farther on, to be sincerely meant."
