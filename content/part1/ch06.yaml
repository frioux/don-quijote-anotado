        ormsby_note: "The anticlimax here almost equals that famous one of Waller's: 'Under the tropic is our language spoke, And part of Flanders hath received our yoke.' The book referred to was entitled simply the Angelica by Luis Barahona de Soto (Madrid, 1586). In his praise of this poem we have one more instance of Cervantes' loyalty to a friend getting the better of his critical judgment."
        note: "The pun: the book is 'The Tears of Angelica', and the curate says he himself would have wept 'them' (the tears) had he burned it."
summary: |
  While Don Quijote sleeps off his beating, the curate and the barber, Master Nicolás, get the keys to his library from the niece. They find over a hundred large, well-bound volumes and some small ones. The housekeeper rushes off for holy water to sprinkle the room, in case the enchanters who live in the books take revenge. The niece and the housekeeper want everything burned at once, but the curate insists on at least reading the titles.

  The barber hands the books down one by one and the curate passes sentence. Amadís de Gaula is spared as the best of its kind, but its son Esplandián and the rest of the Amadís family go out of the window into the yard, followed by Olivante de Laura, Florimorte de Hircania, Platir and the Knight of the Cross. The Mirror of Chivalries and the other books about Charlemagne's peers are sentenced to a dry well, pending review, except two Spanish epics that go straight to the fire. Palmerín de Oliva is burned and Palmerín of England is kept as a treasure. Belianís is given time to reform in the barber's house. Tired of the work, the curate orders all the big books burned; the housekeeper throws them out eight at a time, and one falls at the barber's feet: Tirante el Blanco, which the curate greets with delight as the best book in the world, because in it knights eat, sleep and die in their beds.

  The small books turn out to be poetry and pastoral romances. The curate would spare them, but the niece warns that her uncle, once cured of chivalry, might decide to become a shepherd, or worse, a poet. The curate keeps Montemayor's Diana (with cuts), Gil Polo's Diana, the absurd Fortuna de Amor, the Pastor de Fílida and several books by friends, and burns other pastorals. When the barber finds the Galatea, the curate says its author, Cervantes, is an old friend more versed in misfortunes than in verses, and that the book must wait for its promised second part. The three Spanish epics, the Araucana, the Austríada and the Monserrate, are kept as Spain's best. The curate decides to burn the rest unseen, but stops at The Tears of Angelica, which he says he would have wept to burn.
context: |
  The scrutiny as an auto de fe. The whole chapter is played as a trial by the Inquisition, which in Cervantes' Spain examined and burned both books and heretics. The vocabulary is judicial and religious throughout: the books are 'autores del daño' (culprits), Amadís is a 'dogmatizador' of a 'secta', the condemned are handed to 'el brazo seglar' (the secular arm, the civil power that carried out the Inquisition's death sentences), some are pardoned, some exiled to a dry well, some granted the 'término ultramarino' (the legal delay allowed to defendants overseas). The Index of prohibited books was a real presence, and Cervantes' readers would have recognized the parody at once. Ormsby's notes, drawn from Gayangos, Clemencín and Salvá, identify nearly every title.

  The household. The housekeeper's holy water and the niece's eagerness to burn everything show how the women of the house see the books: as something like witchcraft. The patio was the courtyard inside the house and the corral the yard outside it (Ormsby's note). The curate is a university graduate and the barber, as barbers then were, a man of some reading; their friendship is shown in the constant 'compadre' (literally co-godfather, the ordinary word for a close friend).

  The books. The romances of chivalry were big folio volumes; the pastoral and verse books were small quarto or octavo (Ormsby's note), which is how the curate can tell the genres apart without opening them. The Amadís series (Amadís de Gaula, Las Sergas de Esplandián, Amadís de Grecia) and the Palmerín series (Palmerín de Oliva, Platir, Palmerín de Inglaterra) were the two great families of Spanish romance. The 'Mirror of Chivalries' belongs to the Carolingian material, the stories of Charlemagne's peers that reached Spain through Boiardo and Ariosto; the curate's praise of Ariosto 'in his own language' and his scorn for Captain Urrea's translation open a theme Cervantes returns to in Part II, where Don Quijote compares translation to the back of a tapestry. Tirante el Blanco, a Valencian romance, is praised precisely for what the others lack: realism. The pastoral romance, begun in Spain by Montemayor's Diana (c. 1559), was the other fashionable fiction of the age, with shepherds of courtly manners lamenting their loves in prose and verse. The last shelf holds the Spanish verse epics of the 1580s.

  Cervantes' own voice. Many of the books spared are by Cervantes' friends (Gálvez de Montalvo, Padilla, López Maldonado, Barahona de Soto), and Ormsby notes more than once that friendship overrules criticism. Cervantes then puts himself on the shelf: the Galatea (1585), his only published book before Don Quijote, is judged by the curate, who calls its author an old friend 'más versado en desdichas que en versos'. Cervantes had been maimed at Lepanto, held captive for five years in Algiers and jailed over his accounts as a tax collector. The promised second part of the Galatea never appeared.

  Jokes and puns. The olive and the palm (Palmerín de Oliva, Palmerín de Inglaterra); Polo and Apolo; 'canta ... encanta'; 'versado ... versos'; the curate 'weeping' the Tears of Angelica; the knight Quirieleisón, named after the Kyrie eleison of the Mass; the proverb 'tras la cruz está el diablo' applied to the Knight of the Cross. The praise of Lofraso's Fortuna de Amor is plainly ironic, and whether the praise of Tirante is ironic has been argued for centuries (Ormsby thinks it is).

  Medicine and law. Belianís needs 'ruibarbo' (rhubarb, a standard purgative) to purge its excess of 'cólera' (choler, the hot dry humour of anger), in the four-humour medicine that also explains Don Quijote's madness in Chapter 1. 'Sin perjuicio de tercero' and 'sin remisión' are legal formulas.

  Reading Cervantes' Spanish. This chapter is almost all dialogue, so it is full of commands in several forms: the vosotros/vos command with -d for the housekeeper and the barber (Tomad, abrid, echadle, Dádmele, tenedlos, Llevadle); the present subjunctive for third persons and for 'vuestra merced' (vayan, vaya, acompañe, se guarde, guárdese, perezcan, Tome, rocíe); and 'let us' with -mos (Veamos, démonos). The future subjunctive, now dead, appears several times (se hallaren, quisieren, se enmendaren), as does the -ra form used as a conditional (fuera bien, perdonáramos, fueran más estimadas, Lloráralas). Pronouns hang on clause-opening verbs (volvióse, Hízolo, Diéronselos, Abrióse, Púsole, Cansóse, quédesele), and 'le' is used for a book as a direct object (leísmo). Old spellings in this chapter: priesa, mesmo, estraño, escusa, efeto, ecetuando, recebí, propriedad, emienda, tradución, Ingalaterra, and the contractions deste, destas, destos, déste, della, dellas, dellos, dél, esotro, quemallos, and 'ha' for 'hace'.
