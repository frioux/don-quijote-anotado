          - {w: "mesmo", d: "= mismo, 'same'; archaic form used throughout"}
          - {w: "Gil Polo", d: "Gaspar Gil Polo, Valencian poet whose 'Diana enamorada' (1564), another sequel to Montemayor, was much admired"}
