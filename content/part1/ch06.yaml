      - es: "Dádmele acá, compadre, que precio más haberle hallado que si me dieran una sotana de raja de Florencia."
        literal: "Give-me-it here, gossip, for I-prize more to-have-it found than if to-me they-gave a cassock of serge of Florence."
        ormsby: "Give it here, gossip, for I make more account of having found it than if they had given me a cassock of Florence stuff.”"
        vocab:
          - {w: "compadre", d: "friend, 'gossip'; a friendly form of address between men"}
          - {w: "preciar", d: "to value, prize"}
          - {w: "sotana", d: "cassock, a priest's long robe"}
          - {w: "raja de Florencia", d: "a fine Florentine woollen cloth, a luxury for a village priest"}
        diagram:
          - s: "Dádmele acá"
            r: "command: give it here to me"
            under:
              - {s: "compadre", r: "who is addressed"}
          - s: "que precio más haberle hallado"
            r: "why (loose 'que' = for): I prize having found it more"
            under:
              - {s: "que si me dieran una sotana de raja de Florencia", r: "than what: than if they gave me a cassock of Florentine cloth"}
        forms:
          - {w: "Dádmele", f: "dad (vos / vosotros command of dar, to give: the infinitive's -r becomes -d) + me (to me) + le (it): 'give it to me'. Pronouns attach to the end of a positive command; the accent keeps the stress on dá-. 'le' for a masculine thing is leísmo."}
          - {w: "precio", f: "preci- + -o → preciar (to value), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "haberle hallado", f: "haber + le + hallado (participle of hallar, to find): perfect infinitive, 'to have found it'. A pronoun attaches to the end of the infinitive haber."}
          - {w: "dieran", f: "d- + -ieran → dar (to give), imperfect subjunctive (-ra form), they: 'if they gave'. Built on the preterite dieron: diera, dieras, diera, diéramos, dierais, dieran. After 'si' the -ra form is the counterfactual."}
        ormsby_note: "The Fortuna d'Amor, por Antonio de lo Frasso, Militar, Sardo, appeared at Barcelona in 1573. In the Viage del Parnaso Cervantes treats the book in the same bantering strain, which misled Pedro de Pineda, one of the editors of Lord Carteret's Quixote, and induced him to bring out a new edition in 1740. The book is an utterly worthless one, and highly prized by collectors."
        note: "The praise is ironic: Lofraso's book was notoriously bad, and the curate relishes it as a comic treasure."
