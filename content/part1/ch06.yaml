          - {w: "por", d: "here: for the sake of, on account of"}
          - {w: "santo", d: "holy"}
          - {w: "ignorancia", d: "ignorance, i.e. the book's stupidity"}
          - {w: "soler", d: "to be in the habit of; 'se suele decir' = people usually say, as the saying goes"}
          - {w: "tras", d: "behind, after"}
          - {w: "tras la cruz está el diablo", d: "proverb: 'behind the cross stands the devil', i.e. evil hides behind a pious front"}
        diagram:
          - s: "se podía perdonar su ignorancia"
            r: "main verb 1: its ignorance could be pardoned"
            under:
              - {s: "Por nombre tan santo como este libro tiene", r: "why: for the sake of so holy a name as this book has"}
          - s: "mas también se suele decir:"
            r: "main verb 2: but they also say"
            under:
              - {s: "\"tras la cruz está el diablo\"", r: "what they say: the proverb"}
          - {s: "vaya al fuego", r: "main verb 3: let it go to the fire"}
