      - es: "Con todo eso, os digo que merecía el que le compuso, pues no hizo tantas necedades de industria, que le echaran a galeras por todos los días de su vida."
        literal: "With all that, to-you I-say that deserved he who it composed, since not he-did so-many follies of purpose, that him they-should-throw to galleys for all the days of his life."
