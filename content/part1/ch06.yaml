      - es: "Y, pues comenzamos por La Diana de Montemayor, soy de parecer que no se queme, sino que se le quite todo aquello que trata de la sabia Felicia y de la agua encantada, y casi todos los versos mayores, y quédesele en hora buena la prosa, y la honra de ser primero en semejantes libros."
        literal: "And, since we-begin with The Diana of Montemayor, I-am of opinion that not it-be-burned, but that from-it be-removed all that which treats of the wise Felicia and of the water enchanted, and almost all the verses longer, and let-remain-to-it in hour good the prose, and the honor of being first in similar books."
        ormsby: "To begin, then, with the Diana of Montemayor. I am of opinion it should not be burned, but that it should be cleared of all that about the sage Felicia and the magic water, and of almost all the longer pieces of verse: let it keep, and welcome, its prose and the honour of being the first of books of the kind.”"
