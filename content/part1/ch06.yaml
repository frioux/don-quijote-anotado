        ormsby_note: "Palmerín de Oliva, the founder of the Palmerín Series of Romances, was first printed at Salamanca in 1511. It is said to have been written by a lady of Augustobriga (i.e. Burgos, according to some, but more probably Ciudad Rodrigo), but nothing certain is known of the author. Palmerín de Inglaterra, like Amadís, was until lately supposed to be, as Cervantes supposed it, of Portuguese origin; but the question was settled a few years ago by Vincente Salvá, who discovered a Toledo edition of 1547, twenty years earlier than the Portuguese edition on which the claims of Francisco de Moraes, or of John II, rested. An acrostic gives the name of the author, Luis Hurtado."
