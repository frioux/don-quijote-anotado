          - {w: "Ninfas de Henares", d: "'Nymphs and Shepherds of the Henares' (1587), pastoral by Bernardo González de Bobadilla, set on the river of Cervantes' birthplace, Alcalá"}
          - {w: "Desengaños de celos", d: "'Disillusionments of Jealousy' (1586), pastoral by Bartolomé López de Enciso"}
          - {w: "desengaño", d: "disillusionment, the waking-up from a delusion"}
