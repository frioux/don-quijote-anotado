          - {w: "déste", f: "de + éste (from this one). Cervantes fuses 'de' with él, ella, ellos, este: dél, della, dellos, deste."}
        ormsby_note: "The curate was quite correct in his idea that Amadís of Gaul was the parent of the chivalry literature, but not in his statement that it was the first book of the kind printed in Spain, for it is not likely it was printed before Tirant lo Blanch, Oliveros de Castilla, or the Carcel de Amor. The earliest known edition was printed in Rome in 1519, but there can be no doubt that this is a reprint of a Spanish edition, of perhaps even an earlier date than 1510, which has been given as that of the first edition."
