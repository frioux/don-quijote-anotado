  - sentences:
      - es: "— Muchos años ha que es grande amigo mío ese Cervantes, y sé que es más versado en desdichas que en versos."
        literal: "— Many years [it] has that is great friend of-mine that Cervantes, and I-know that he-is more versed in misfortunes than in verses."
        ormsby: "“That Cervantes has been for many years a great friend of mine, and to my knowledge he has had more experience in reverses than in verses."
        vocab:
          - {w: "muchos años ha que", d: "for many years now; 'ha' is the old form of 'hace'"}
          - {w: "versado en", d: "versed in, experienced in"}
          - {w: "desdicha", d: "misfortune"}
          - {w: "más versado en desdichas que en versos", d: "more versed in misfortunes than in verses; a pun on 'versado' and 'versos'"}
        diagram:
          - s: "es grande amigo mío ese Cervantes"
            r: "main verb 1: that Cervantes is a great friend of mine"
            under:
              - {s: "Muchos años ha que", r: "for how long: for many years"}
          - s: "y sé"
            r: "main verb 2: and I know"
            under:
              - {s: "que es más versado en desdichas que en versos", r: "what: that he is more versed in misfortunes than in verses"}
        forms:
          - {w: "ha", f: "haber (to have), present, it. Old for 'hace' in time phrases: 'muchos años ha que' = 'hace muchos años que', 'it is many years since'."}
          - {w: "es", f: "ser (to be), present, he. soy, eres, es, somos, sois, son. Present because the friendship still goes on."}
          - {w: "grande", f: "Cervantes often keeps 'grande' unclipped before a noun where modern Spanish says 'gran'."}
          - {w: "ese", f: "'that', masculine; before a name it sounds familiar, 'that fellow Cervantes'."}
          - {w: "sé", f: "saber (to know), present, I. Irregular in the I-form only: sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "versado", f: "vers- + -ado → participle of versar (to deal with), used as an adjective: 'versed'."}
        note: "Cervantes had lost the use of his left hand at Lepanto, spent five years as a captive in Algiers, and had been jailed for debts; the joke about 'desdichas' is autobiographical."
      - es: "Su libro tiene algo de buena invención; propone algo, y no concluye nada: es menester esperar la segunda parte que promete; quizá con la emienda alcanzará del todo la misericordia que ahora se le niega; y, entre tanto que esto se ve, tenedle recluso en vuestra posada, señor compadre."
        literal: "His book has something of good invention; it-proposes something, and not it-concludes nothing: it-is needful to-wait-for the second part that it-promises; perhaps with the amendment it-will-attain of-the whole the mercy that now to-it is-denied; and, while that this is-seen, keep-it confined in your lodging, sir gossip."
        ormsby: "His book has some good invention in it, it presents us with something but brings nothing to a conclusion: we must wait for the Second Part it promises: perhaps with amendment it may succeed in winning the full measure of grace that is now denied it; and in the meantime do you, señor gossip, keep it shut up in your own quarters.”"
        vocab:
          - {w: "invención", d: "invention, imaginative material"}
          - {w: "proponer", d: "to propose, set out"}
          - {w: "concluir", d: "to conclude, finish"}
          - {w: "es menester", d: "it is necessary"}
          - {w: "emienda", d: "= enmienda, amendment, correction; old spelling"}
          - {w: "alcanzar", d: "to reach, obtain"}
          - {w: "del todo", d: "fully, completely"}
          - {w: "misericordia", d: "mercy"}
          - {w: "negar", d: "to deny, refuse"}
          - {w: "entre tanto que", d: "while, until"}
          - {w: "recluso", d: "confined, locked up (as a prisoner)"}
          - {w: "posada", d: "lodging, house"}
          - {w: "compadre", d: "friend, 'gossip'; a friendly form of address between men"}
        diagram:
          - s: "Su libro tiene algo de buena invención"
            r: "main verb 1: his book has some good invention"
          - s: "propone algo, y no concluye nada:"
            r: "main verbs 2: it sets out something and concludes nothing"
          - s: "es menester esperar la segunda parte"
            r: "main verb 3: we must wait for the second part"
            under:
              - {s: "que promete", r: "describes 'parte': that it promises"}
          - s: "quizá con la emienda alcanzará del todo la misericordia"
            r: "main verb 4: perhaps with correction it will win full mercy"
            under:
              - {s: "que ahora se le niega", r: "describes 'misericordia': that is now denied it"}
          - s: "tenedle recluso en vuestra posada"
            r: "command: keep it locked up in your house"
            under:
              - {s: "y, entre tanto que esto se ve", r: "when: meanwhile, until this is seen"}
              - {s: "señor compadre", r: "who is addressed"}
        forms:
          - {w: "tiene", f: "tien- + -e → tener (to have), present, it. tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "buena", f: "buen- + -a → bueno (good), feminine to match 'invención'."}
          - {w: "propone", f: "propon- + -e → proponer (to propose), present, it. Built like poner: pongo, pones, pone, ponemos, ponéis, ponen."}
          - {w: "concluye", f: "conclu- + -y- + -e → concluir (to conclude), present, it; verbs in -uir add y before the ending: concluyo, concluyes, concluye, concluimos, concluís, concluyen."}
          - {w: "no ... nada", f: "Spanish doubles negatives: 'no concluye nada' = concludes nothing."}
          - {w: "esperar", f: "infinitive (to wait for) after 'es menester'."}
          - {w: "promete", f: "promet- + -e → prometer (to promise), present, it. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "emienda", f: "old spelling of enmienda (amendment)."}
          - {w: "alcanzará", f: "alcanzar + -á → alcanzar (to attain), future, it. The future is the whole infinitive + -é, -ás, -á, -emos, -éis, -án."}
          - {w: "se le niega", f: "nieg- + -a → negar (to deny), present, it, with passive 'se' and 'le' (to it): 'is denied to it'. The e becomes ie when stressed: niego, niegas, niega, negamos, negáis, niegan."}
          - {w: "se ve", f: "ve → ver (to see), present, it, with passive 'se': 'is seen'. veo, ves, ve, vemos, veis, ven."}
          - {w: "tenedle", f: "tened (vos / vosotros command of tener, to keep: the infinitive's -r becomes -d) + le (it, the book). A pronoun attaches to the end of a positive command; 'le' for a masculine thing is leísmo."}
          - {w: "vuestra", f: "'your', the possessive of 'vos', feminine to match 'posada'."}
        ormsby_note: "The play upon words in the original is 'more versed in misfortunes than in verses.' This introduction of himself and his forgotten pastoral is Cervantes all over in its tone of playful stoicism with a certain quiet self-assertion. It shows, moreover, pretty clearly, that until Don Quixote had made the author's name known, the Galatea had remained unnoticed."
  - sentences:
      - es: "— Que me place —respondió el barbero—. Y aquí vienen tres, todos juntos: La Araucana, de don Alonso de Ercilla; La Austríada, de Juan Rufo, jurado de Córdoba, y El Monserrato, de Cristóbal de Virués, poeta valenciano."
        literal: "— That it-pleases-me —answered the barber—. And here come three, all together: The Araucana, of Don Alonso de Ercilla; The Austriad, of Juan Rufo, alderman of Córdoba, and The Monserrat, of Cristóbal de Virués, poet Valencian."
        ormsby: "“Very good,” said the barber; “and here come three together, the Araucana of Don Alonso de Ercilla, the Austriada of Juan Rufo, Justice of Cordova, and the Montserrate of Christobal de Virues, the Valencian poet.”"
        vocab:
          - {w: "que me place", d: "with pleasure, gladly; 'placer' = to please"}
          - {w: "La Araucana", d: "epic poem (1569 to 1589) by Alonso de Ercilla on the Spanish war against the Araucanian (Mapuche) people of Chile, in which he fought"}
          - {w: "La Austríada", d: "'The Austriad' (1584), epic by Juan Rufo on Don John of Austria, victor of Lepanto, where Cervantes fought"}
          - {w: "jurado", d: "a city councillor (a municipal office), not a juror"}
          - {w: "El Monserrato", d: "'El Monserrate' (1587), epic by Cristóbal de Virués on the legend of the hermit Garín and the founding of the monastery of Montserrat"}
        diagram:
          - {s: "Que me place", r: "the reply: with pleasure"}
          - {s: "respondió el barbero", r: "speech tag: answered the barber"}
          - s: "Y aquí vienen tres, todos juntos:"
            r: "main verb: and here come three, all together"
            under:
              - {s: "La Araucana, de don Alonso de Ercilla", r: "book 1"}
              - {s: "La Austríada, de Juan Rufo, jurado de Córdoba", r: "book 2"}
              - {s: "y El Monserrato, de Cristóbal de Virués, poeta valenciano", r: "book 3"}
        forms:
          - {w: "place", f: "plac- + -e → placer (to please), present, it, with 'me' (to me): 'it pleases me'. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "vienen", f: "vien- + -en → venir (to come), present, they. vengo, vienes, viene, venimos, venís, vienen."}
          - {w: "todos juntos", f: "masculine plural, agreeing with 'libros' understood."}
        ormsby_note: "These three are examples of Spanish epic poetry. The Araucana of Ercilla (Madrid, 1569, 1578, 1590) is, next to the Poem of the Cid, the best effort in that direction in the language. The Austriada, which appeared first at Madrid in 1584, deals with the life and achievements of Don John of Austria, but it was probably the memory of Lepanto rather than the merits of the poem that made Cervantes give it a place here. The Montserrate of the dramatist Virues (Madrid, 1588) had for its subject the repulsive Oriental legend which became popular in Spain with Garin the hermit of Monserrat for its hero, and which M. G. Lewis made the foundation of his famous romance, The Monk."
  - sentences:
      - es: "— Todos esos tres libros —dijo el cura— son los mejores que, en verso heroico, en lengua castellana están escritos, y pueden competir con los más famosos de Italia: guárdense como las más ricas prendas de poesía que tiene España."
