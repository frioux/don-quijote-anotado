  - sentences:
      - es: "— No es ése pastor —dijo el cura—, sino muy discreto cortesano; guárdese como joya preciosa."
        literal: "— Not is that-one shepherd —said the priest—, but very witty courtier; let-it-be-kept as jewel precious."
        ormsby: "“No Pastor that,” said the curate, “but a highly polished courtier; let it be preserved as a precious jewel.”"
        vocab:
          - {w: "pastor", d: "shepherd; the pun is that the book's author is no rustic"}
          - {w: "discreto", d: "wise, clever and witty; a false friend, not 'discreet'"}
          - {w: "cortesano", d: "courtier"}
          - {w: "joya", d: "jewel"}
        diagram:
          - s: "No es ése pastor"
            r: "main verb 1: that one is no shepherd"
            under:
              - {s: "sino muy discreto cortesano", r: "contrast: but a very witty courtier"}
          - {s: "dijo el cura", r: "speech tag: said the priest"}
          - s: "guárdese"
            r: "main verb 2: let it be kept"
            under:
              - {s: "como joya preciosa", r: "how: as a precious jewel"}
        forms:
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "ése", f: "'that one'; the accent marks a demonstrative used as a pronoun (old rule)."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "guárdese", f: "guard- + -e + se → guardar (to keep), present subjunctive, it, with passive 'se' stuck on the end: 'let it be kept'. A clause-opening verb takes its pronoun on the end; the accent keeps the stress on guár-. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "preciosa", f: "precios- + -a → precioso (precious), feminine to match 'joya'."}
        ormsby_note: "The Pastor de Filida (Madrid, 1582), one of the best of the pastorals, was by Luis Galvez de Montalvo of Guadalajara, a retainer of the great Mendoza family, and apparently an intimate personal friend of Cervantes, who, under the name of Tirsi, is referred to in the pastoral as a clarissimo ingennio worthy of being mentioned with Ercilla. Montalvo, in return, is introduced under the name of Siralvo into the Galatea of Cervantes, to which he contributed a complimentary sonnet."
