  - sentences:
      - es: "— Por las órdenes que recebí —dijo el cura—, que, desde que Apolo fue Apolo, y las musas musas, y los poetas poetas, tan gracioso ni tan disparatado libro como ése no se ha compuesto, y que, por su camino, es el mejor y el más único de cuantos deste género han salido a la luz del mundo;"
        literal: "— By the orders that I-received —said the priest—, that, since Apollo was Apollo, and the muses muses, and the poets poets, so funny nor so absurd book as that-one not has-been composed, and that, by its road, it-is the best and the most unique of as-many-as of-this kind have come-out to the light of-the world;"
        ormsby: "“By the orders I have received,” said the curate, “since Apollo has been Apollo, and the Muses have been Muses, and poets have been poets, so droll and absurd a book as this has never been written, and in its way it is the best and the most singular of all of this species that have as yet appeared,"
        vocab:
          - {w: "las órdenes", d: "holy orders; 'por las órdenes que recebí' = by the priesthood I received, an oath"}
          - {w: "recebir", d: "= recibir, to receive; old spelling"}
          - {w: "musas", d: "the Muses, the nine goddesses of the arts"}
          - {w: "gracioso", d: "funny, amusing"}
          - {w: "disparatado", d: "absurd, nonsensical"}
          - {w: "por su camino", d: "in its own way"}
          - {w: "el más único", d: "the most unique; a deliberately absurd superlative"}
          - {w: "deste", d: "= de este, 'of this'"}
          - {w: "salir a la luz", d: "to come out, be published"}
        diagram:
          - {s: "Por las órdenes que recebí", r: "oath: by the holy orders I received"}
          - {s: "dijo el cura", r: "speech tag: said the priest"}
          - s: "tan gracioso ni tan disparatado libro como ése no se ha compuesto"
            r: "sworn fact 1 (after 'que'): no book so funny or so absurd as that has been written"
            under:
              - {s: "desde que Apolo fue Apolo, y las musas musas, y los poetas poetas", r: "since when: since Apollo was Apollo"}
          - s: "y que, por su camino, es el mejor y el más único"
            r: "sworn fact 2: and that in its way it is the best and most unique"
            under:
              - {s: "de cuantos deste género han salido a la luz del mundo", r: "of which: of all of this kind ever published"}
        forms:
          - {w: "recebí", f: "receb- + -í → recibir (to receive; old spelling recebir), preterite, I. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "fue", f: "ser (to be), preterite, he. ser and ir share the preterite: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "las musas musas", f: "the verb 'fueron' is understood: 'and the Muses [were] Muses'."}
          - {w: "no se ha compuesto", f: "ha (haber, present, it) + compuesto (irregular participle of componer, to compose), with passive 'se': 'has not been written'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "han salido", f: "han (haber, present, they) + salido (participle of salir, to go out): present perfect, they: 'have come out'."}
        ormsby_match: false
