  - sentences:
      - es: "— Pues ése —replicó el cura—, con la segunda, tercera y cuarta parte, tienen necesidad de un poco de ruibarbo para purgar la demasiada cólera suya, y es menester quitarles todo aquello del castillo de la Fama y otras impertinencias de más importancia, para lo cual se les da término ultramarino, y como se enmendaren, así se usará con ellos de misericordia o de justicia;"
        literal: "— Well that-one —replied the priest—, with the second, third and fourth part, have need of a little of rhubarb to purge the excessive choler of-theirs, and it-is needful to-remove-from-them all that of-the castle of the Fame and other impertinences of more importance, for the which is-given-to-them term overseas, and as they-may-mend, so will-be-used with them of mercy or of justice;"
        ormsby: "“Well,” said the curate, “that and the second, third, and fourth parts all stand in need of a little rhubarb to purge their excess of bile, and they must be cleared of all that stuff about the Castle of Fame and other greater affectations, to which end let them be allowed the overseas term, and, according as they mend, so shall mercy or justice be meted out to them;"
        vocab:
          - {w: "tener necesidad de", d: "to need"}
          - {w: "ruibarbo", d: "rhubarb, used as a purgative in old medicine"}
          - {w: "purgar", d: "to purge"}
          - {w: "demasiado", d: "excessive, too much"}
          - {w: "cólera", d: "choler, yellow bile, one of the four humours; also 'anger', so the books are too violent"}
          - {w: "es menester", d: "it is necessary"}
          - {w: "castillo de la Fama", d: "the Castle of Fame, an episode in 'Belianís de Grecia'"}
          - {w: "impertinencia", d: "irrelevance, piece of nonsense; not 'rudeness'"}
          - {w: "término ultramarino", d: "the overseas term, a legal delay granted to a defendant who is abroad"}
          - {w: "como", d: "here: according as, depending on how"}
          - {w: "enmendarse", d: "to mend one's ways, reform"}
          - {w: "usar de misericordia con", d: "to show mercy to"}
        diagram:
          - {s: "replicó el cura", r: "speech tag: replied the priest"}
          - s: "tienen necesidad de un poco de ruibarbo"
            r: "main verb 1: need a little rhubarb"
            under:
              - {s: "Pues ése", r: "subject 1: well, that one"}
              - {s: "con la segunda, tercera y cuarta parte", r: "subject 2: with the second, third and fourth parts"}
              - {s: "para purgar la demasiada cólera suya", r: "why: to purge their excess of bile"}
          - s: "y es menester"
            r: "main verb 2: and it is necessary"
            under:
              - {s: "quitarles todo aquello del castillo de la Fama y otras impertinencias de más importancia", r: "what is necessary: to cut the Castle of Fame and other bigger nonsense"}
              - {s: "para lo cual se les da término ultramarino", r: "for which they are given the overseas term"}
          - s: "y como se enmendaren, así se usará con ellos de misericordia o de justicia"
            r: "main verb 3: and as they mend, so will mercy or justice be used with them"
        forms:
          - {w: "tienen", f: "tien- + -en → tener (to have), present, they: plural because 'ése' and the other parts together are the subject. tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "purgar", f: "infinitive (to purge) after 'para' = in order to."}
          - {w: "demasiada", f: "demasiad- + -a → demasiado (excessive), feminine to match 'cólera'."}
          - {w: "suya", f: "'theirs', feminine to match 'cólera', placed after the noun."}
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "quitarles", f: "quitar (to take away) + les (from them). A pronoun attaches to the end of an infinitive."}
          - {w: "se les da", f: "d- + -a → dar (to give), present, it, with passive 'se' and 'les' (to them): 'is given to them'. doy, das, da, damos, dais, dan."}
          - {w: "se enmendaren", f: "enmend- + -aren → enmendarse (to reform), future subjunctive, they: 'as they may mend'. The future subjunctive of -ar verbs: -are, -ares, -are, -áremos, -areis, -aren. It marks an open future; modern Spanish uses 'se enmienden'."}
          - {w: "se usará", f: "usar + -á → usar (to use), future, it, with passive 'se': 'will be used'. The future is the whole infinitive + -é, -ás, -á, -emos, -éis, -án."}
        ormsby_note: "The 'overseas term' was the allowance of time granted in the case of persons beyond the seas, when sued or indicted, to enable them to appear and show cause why judgment should not be given against them."
        note: "The curate mixes two professional languages: medicine (rhubarb to purge choler, the humour of anger) and law (the overseas term, mercy or justice). Books full of fights are 'choleric'."
