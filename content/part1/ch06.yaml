        forms:
          - {w: "se siguen", f: "sig- + -uen → seguir (to follow), present, they, with 'se': 'come next'. The e of the stem turns to i when stressed: sigo, sigues, sigue, seguimos, seguís, siguen."}
          - {w: "son", f: "ser (to be), present, they. soy, eres, es, somos, sois, son."}
        ormsby_note: "The books here referred to are the Pastor de Iberia, by Bernardo de la Vega (Seville, 1591); the Nimphas y Pastores de Henares, by Bernardo González de Bovadilla (Alcalá de Henares, 1587); and the Desengaño de Zelos, by Bartolme Lopes de Enciso (Madrid, 1586)."
  - sentences:
      - es: "— Pues no hay más que hacer —dijo el cura—, sino entregarlos al brazo seglar del ama; y no se me pregunte el porqué, que sería nunca acabar."
        literal: "— Then not there-is more to do —said the priest—, but to-hand-them to-the arm secular of-the housekeeper; and not of-me let-it-be-asked the why, for it-would-be never to-finish."
        ormsby: "“Then all we have to do,” said the curate, “is to hand them over to the secular arm of the housekeeper, and ask me not why, or we shall never have done.”"
        vocab:
          - {w: "no hay más que hacer sino", d: "there is nothing to do but"}
          - {w: "entregar", d: "to hand over, deliver"}
          - {w: "brazo seglar", d: "the secular arm: the civil authorities to whom the Inquisition 'released' condemned heretics for burning"}
          - {w: "el porqué", d: "the reason why (a noun)"}
          - {w: "sería nunca acabar", d: "it would be never-ending, we'd never finish"}
        diagram:
          - s: "Pues no hay más que hacer"
            r: "main verb 1: then there is nothing more to do"
            under:
              - {s: "sino entregarlos al brazo seglar del ama", r: "except: to hand them over to the housekeeper's secular arm"}
          - {s: "dijo el cura", r: "speech tag: said the priest"}
          - s: "y no se me pregunte el porqué"
            r: "main verb 2: and let no one ask me why"
            under:
              - {s: "que sería nunca acabar", r: "why (loose 'que' = for): it would never end"}
        forms:
          - {w: "hay", f: "haber, the special present form 'there is / there are'; it never changes."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "entregarlos", f: "entregar (to hand over) + los (them). A pronoun attaches to the end of an infinitive."}
          - {w: "se me pregunte", f: "pregunt- + -e → preguntar (to ask), present subjunctive, it, with passive 'se' and 'me' (of me): 'let [it] not be asked of me'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "sería", f: "ser + -ía → ser (to be), conditional, it. The conditional is the whole infinitive + -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "acabar", f: "infinitive (to finish) used as a noun: 'never finishing'."}
        note: "The Inquisition did not execute anyone itself: it 'relaxed' the condemned to the secular arm, the civil courts, which burned them. The housekeeper is cast as the executioner."
