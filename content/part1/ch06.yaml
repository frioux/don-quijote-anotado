          - {w: "agua encantada", d: "enchanted water, Felicia's potion in 'La Diana'"}
          - {w: "versos mayores", d: "longer lines of verse, e.g. the Italian-style eleven-syllable lines"}
          - {w: "en hora buena", d: "and welcome, by all means"}
