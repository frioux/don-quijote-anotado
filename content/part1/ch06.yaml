        forms:
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), it: here 'would be'. Built on the preterite fueron: fuera, fueras, fuera, fuéramos, fuerais, fueran. Cervantes uses the -ra form where modern Spanish uses the conditional 'sería'."}
          - {w: "entendiérades", f: "entend- + -iérades → entender (to understand), imperfect subjunctive (-ra form), you (vos): 'that you understood'. Old -ra endings: entendiera, entendieras, entendiera, entendiéramos, entendiérades (now entendierais), entendieran. Subjunctive after 'fuera bien que'."}
          - {w: "le", f: "him (Ariosto), direct object. 'le' for a male person as direct object is leísmo, normal in Castilian."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "perdonáramos", f: "perdon- + -áramos → perdonar (to pardon, let off), imperfect subjunctive (-ra form), we: here 'we would have let off'. The -ra form of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran. Cervantes uses it where modern Spanish says 'habríamos perdonado'."}
          - {w: "hubiera traído ... hecho", f: "hubiera (haber, -ra imperfect subjunctive, he) + traído (participle of traer, to bring) and hecho (participle of hacer, to make): pluperfect subjunctive, 'had brought ... made'. haber: hubiera, hubieras, hubiera, hubiéramos, hubierais, hubieran."}
        note: "The curate says, with a sideways compliment, that Captain Urrea's Spanish verse translation spoiled Ariosto, and everyone would have been better off had he not done it."
        ormsby_note: "Geronimo Jiménez de Urrea, whose translation of Ariosto into Spanish was first printed at Antwerp in 1549. This is not the only passage in which Cervantes declares against translation. In Chapter LXII of the Second Part he puts his objection still more strongly, and there extends it to translation of prose. And yet of all great writers there is not one who is under such obligations to translation as Cervantes. The influence of Homer and Virgil would be scarcely less than it is if they had never been translated; Shakespeare and Milton wrote in a language destined to become the most widely read on the face of the globe, and no reader of any culture needs an interpreter for Molière or Le Sage. But how would Cervantes have fared in the world if, according to his own principles, he had been confined to his native Castilian?"
