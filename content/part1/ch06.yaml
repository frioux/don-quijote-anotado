          - {w: "tomar principio y origen de", d: "to take one's beginning and origin from, to derive from"}
          - {w: "déste", d: "= de éste, 'from this one'"}
        diagram:
          - s: "Parece cosa de misterio"
            r: "main verb 1: it seems a thing of mystery"
            under:
              - {s: "ésta", r: "subject: this [thing], put last"}
