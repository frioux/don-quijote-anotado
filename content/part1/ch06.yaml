          - {w: "soy", f: "ser (to be), present, I. soy, eres, es, somos, sois, son."}
          - {w: "se queme", f: "quem- + -e → quemar (to burn), present subjunctive, it, passive 'se': 'be burned'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. Subjunctive after 'soy de parecer que' (I think it should be)."}
          - {w: "se le quite", f: "quit- + -e → quitar (to remove), present subjunctive, it, passive 'se' + 'le' (from it): 'be removed from it'. Same -ar subjunctive."}
          - {w: "trata", f: "trat- + -a → tratar (to deal with), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "la agua", f: "modern Spanish says 'el agua': a feminine noun beginning with stressed a- takes 'el'. Cervantes still writes 'la'."}
          - {w: "encantada", f: "encant- + -ada → participle of encantar (to enchant), feminine to match 'agua'."}
          - {w: "quédesele", f: "qued- + -e + se + le → quedar (to remain), present subjunctive, it, with 'se' and 'le' (to it) stuck on the end: 'let it remain to it' = let it keep. Cervantes hangs pronouns on the end of a conjugated verb that opens its clause; modern Spanish would say 'que se le quede'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
