          - {w: "tiene", f: "tien- + -e → tener (to have), present, it. tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "se podía perdonar", f: "pod- + -ía → poder (to be able), imperfect, it, + perdonar (to pardon), with passive 'se': 'could be pardoned'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían. The imperfect here is a polite 'might'."}
          - {w: "se suele decir", f: "suel- + -e → soler (to be used to), present, it, + decir (to say), with impersonal 'se': 'it is usually said'. The o becomes ue when stressed: suelo, sueles, suele, solemos, soléis, suelen."}
          - {w: "está", f: "est- + -á → estar (to be, for place), present, he. estoy, estás, está, estamos, estáis, están."}
