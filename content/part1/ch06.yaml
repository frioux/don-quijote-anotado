  - sentences:
      - es: "— Parece cosa de misterio ésta; porque, según he oído decir, este libro fue el primero de caballerías que se imprimió en España, y todos los demás han tomado principio y origen déste;"
        literal: "— Seems thing of mystery this-one; because, according-to-what I-have heard say, this book was the first of chivalries that was-printed in Spain, and all the rest have taken beginning and origin from-this-one;"
        ormsby: "“This seems a mysterious thing,” said the curate, “for, as I have heard say, this was the first book of chivalry printed in Spain, and from this all the others derive their birth and origin;"
        vocab:
          - {w: "cosa de misterio", d: "something with a hidden meaning, a providential sign: the first book out is the first book ever"}
          - {w: "según", d: "according to; 'según he oído decir' = from what I have heard"}
