            r: "why: because, from what I have heard, this was the first book of chivalry"
            under:
              - {s: "que se imprimió en España", r: "describes 'el primero': that was printed in Spain"}
          - {s: "y todos los demás han tomado principio y origen déste", r: "why, 2: and all the others come from it"}
        forms:
          - {w: "Parece", f: "parec- + -e → parecer (to seem), present, it. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (parecer adds -zc- in 'parezco')."}
          - {w: "ésta", f: "'this one', feminine because it stands for 'cosa'; the accent marks a demonstrative used as a pronoun (old rule, dropped in modern spelling)."}
          - {w: "he oído", f: "he (haber, present, I) + oído (participle of oír, to hear): present perfect, I: 'I have heard'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "decir", f: "infinitive (to say) after 'oído': 'heard [people] say'."}
          - {w: "fue", f: "ser (to be), preterite, it. ser and ir share the preterite: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "se imprimió", f: "imprim- + -ió → imprimir (to print), preterite, it, with 'se' making it passive: 'was printed'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
