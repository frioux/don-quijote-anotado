        ormsby_note: "Olivante de Laura, by Antonio de Torquemada, appeared first at Barcelona in 1564. Gayangos suggests that Cervantes must have been thinking of a later quarto or octavo edition, for the original folio is not so exceptionally stout as the description in the text implies. The Garden of Flowers (1575), a treatise of wonders natural and supernatural, was translated into English in 1600 as The Spanish Mandeville, a title which may seem to justify the curate's criticism; but it does not come with a good grace from Cervantes, who made free use of the book in the First Part of Persiles and Sigismunda, and in the Second Part of Don Quixote. The book is really an entertaining one."
