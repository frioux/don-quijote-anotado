  - sentences:
      - es: "— Lo que vuestra merced nos manda, señor y libertador nuestro, es imposible de toda imposibilidad cumplirlo, porque no podemos ir juntos por los caminos, sino solos y divididos, y cada uno por su parte, procurando meterse en las entrañas de la tierra, por no ser hallado de la Santa Hermandad, que, sin duda alguna, ha de salir en nuestra busca."
        literal: "— That which your worship us orders, lord and liberator ours, is impossible of all impossibility to-fulfil-it, because not we-can go together along the roads, but alone and divided, and each one by his part, trying to put-himself in the bowels of the earth, for not to-be found by the Holy Brotherhood, which, without doubt any, has to come-out in our search."
        ormsby: "“That which you, sir, our deliverer, demand of us, is of all impossibilities the most impossible to comply with, because we cannot go together along the roads, but only singly and separate, and each one his own way, endeavouring to hide ourselves in the bowels of the earth to escape the Holy Brotherhood, which, no doubt, will come out in search of us."
        vocab:
          - {w: "libertador", d: "liberator, deliverer"}
          - {w: "imposible de toda imposibilidad", d: "utterly impossible, impossible of all impossibility (a mock-learned phrase)"}
          - {w: "por su parte", d: "each his own way"}
          - {w: "procurar", d: "to try to"}
          - {w: "entrañas", d: "bowels, depths"}
          - {w: "hallar", d: "to find"}
          - {w: "Santa Hermandad", d: "the Holy Brotherhood, Castile's rural police, which hunted down fugitives on the roads"}
          - {w: "en busca de", d: "in search of"}
