          - {w: "manda", f: "mand- + -a → mandar (to order), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
      - es: "Si no, ¡por vida de...! ¡Basta!, que podría ser que saliesen algún día en la colada las manchas que se hicieron en la venta; y todo el mundo calle, y viva bien, y hable mejor y caminemos, que ya es mucho regodeo éste."
        literal: "If not, by life of...! Enough!, for it-could be that came-out some day in the wash the stains that were-made in the inn; and all the world let-be-silent, and let-live well, and let-speak better and let-us-walk, for already it-is much merriment this."
        ormsby: "if not, by the life of, never mind; it may be that some day the stains made in the inn will come out in the scouring; let everyone hold his tongue and behave well and speak better; and now let us march on, for we have had quite enough of this entertainment.”"
        ormsby_note: "Proverb. 53. Clemencín thinks that there is an allusion here to Aleman's Guzman de Alfarache, the hero of which is sent to the galleys like Ginés de Pasamonte, and at an inn on the road ingratiates himself with the commissary by presenting him with a pig he had stolen. But Clemencín forgot that this incident occurs in the Second Part of Guzman, which was not published till after Don Quixote."
        vocab:
          - {w: "¡por vida de...!", d: "'by the life of ...!', the start of an oath he bites off"}
          - {w: "¡basta!", d: "enough!"}
          - {w: "salir en la colada", d: "proverb: to come out in the wash, i.e. hidden misdeeds will come to light"}
          - {w: "colada", d: "the wash, bleaching of linen in lye"}
          - {w: "mancha", d: "stain"}
          - {w: "venta", d: "roadside inn"}
          - {w: "regodeo", d: "fun, entertainment, merriment; ironic"}
        diagram:
