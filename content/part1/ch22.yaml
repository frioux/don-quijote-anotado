  - sentences:
      - es: "— Es tan bueno —respondió Ginés— que mal año para Lazarillo de Tormes y para todos cuantos de aquel género se han escrito o escribieren."
        literal: "— It-is so good —answered Ginés— that bad year for Lazarillo de Tormes and for all as-many-as of that genre have-been written or may-be-written."
        ormsby: "“So good is it,” replied Ginés, “that a fig for Lazarillo de Tormes, and all of that kind that have been written, or shall be written compared with it:"
        ormsby_note: "At the time Cervantes was writing the only book of the kind (i.e. picaresque fiction) that had appeared besides Lazarillo de Tormes was Aleman's Guzman de Alfarache, at which, it has been suggested, this passage is aimed."
        vocab:
          - {w: "mal año para", d: "a bad year for, a fig for: so much the worse for (a scornful dismissal)"}
          - {w: "Lazarillo de Tormes", d: "the anonymous 1554 novel of a boy who serves a series of masters, the first picaresque novel, told in the first person by the rogue himself"}
          - {w: "todos cuantos", d: "all those that, every one that"}
          - {w: "género", d: "genre, kind"}
          - {w: "escribieren", d: "future subjunctive: 'shall be written'"}
        diagram:
          - s: "Es tan bueno"
            r: "main verb (speech): it is so good"
            under:
              - s: "que mal año para Lazarillo de Tormes"
                r: "result: that a fig for Lazarillo de Tormes"
                under:
                  - {s: "y para todos cuantos de aquel género se han escrito o escribieren", r: "and for all of that kind written or yet to be written"}
          - s: "respondió"
            r: "main verb (narrator): answered"
            under:
              - {s: "Ginés", r: "subject"}
        forms:
          - {w: "Es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "mal", f: "malo (bad) clipped before a masculine singular noun ('año')."}
          - {w: "se han escrito", f: "han → haber, present, they (he, has, ha, hemos, habéis, han) + escrito (written), with 'se' as a passive: 'have been written'."}
          - {w: "escribieren", f: "escrib- + -ieren → escribir (to write), future subjunctive, they (with 'se' carried over): 'may yet be written'. The future subjunctive of -er and -ir verbs: -iere, -ieres, -iere, -iéremos, -iereis, -ieren. Modern Spanish uses the present subjunctive 'se escriban'."}
      - es: "Lo que le sé decir a voacé es que trata verdades, y que son verdades tan lindas y tan donosas que no pueden haber mentiras que se le igualen."
        literal: "That which to-you I-know-how to-say to your-worship is that it-treats truths, and that they-are truths so pretty and so witty that not can there-be lies that themselves to-it may-equal."
        ormsby: "all I will say about it is that it deals with facts, and facts so neat and diverting that no lies could match them.”"
        vocab:
          - {w: "voacé", d: "a slurred form of 'vuestra merced', your worship, used by ruffians and soldiers"}
          - {w: "tratar", d: "to deal with, be about"}
          - {w: "lindo", d: "pretty, fine"}
          - {w: "donoso", d: "witty, amusing"}
          - {w: "igualarse a", d: "to equal, match"}
        diagram:
          - s: "Lo que le sé decir a voacé es"
            r: "main verb: what I can tell your worship is"
            under:
              - {s: "que trata verdades", r: "what it is, 1: that it deals in truths"}
              - s: "y que son verdades tan lindas y tan donosas"
                r: "what it is, 2: and they are truths so fine and so witty"
                under:
                  - {s: "que no pueden haber mentiras que se le igualen", r: "result: that no lies could match them"}
        forms:
          - {w: "le sé decir", f: "sé → saber (to know how), present, I (sé, sabes, sabe, sabemos, sabéis, saben), + decir (to say), with 'le' (to you) doubled by 'a voacé'."}
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "trata", f: "trat- + -a → tratar (to deal with), present, it (the book). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "lindas, donosas", f: "lindo (pretty) and donoso (witty), feminine plural to match 'verdades'."}
          - {w: "pueden haber", f: "pued- + -en → poder (can), present, they, + haber: 'there can be'. Strict grammar keeps impersonal haber singular ('no puede haber'); Ginés lets it agree with 'mentiras'. puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "se le igualen", f: "igual- + -en → igualarse (to equal), present subjunctive, they, with 'se' and 'le' (to it). Subjunctive after a denied antecedent ('no ... mentiras que'). The -ar subjunctive: -e, -es, -e, -emos, -éis, -en."}
        note: "Ginés is a rogue writing his own life as a true story, exactly what a picaresque novel pretends to be. The boast that his truths beat any lies is a joke against fiction that claims to be fact, including the 'true history' of Don Quijote itself."
