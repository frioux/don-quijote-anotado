  - sentences:
      - es: "— Este hombre honrado va por cuatro años a galeras, habiendo paseado las acostumbradas vestido en pompa y a caballo."
        literal: "— This man honoured goes for four years to galleys, having paraded the customary [streets] dressed in pomp and on horseback."
        ormsby: "“This worthy man is going to the galleys for four years, after having gone the rounds in ceremony and on horseback.”"
        ormsby_note: "Malefactors were commonly whipped in this way, and the ceremony is frequently alluded to in the Picaresque novels."
        vocab:
          - {w: "hombre honrado", d: "honourable man; said with heavy irony"}
          - {w: "pasear las acostumbradas", d: "to be paraded through the usual streets, the public shaming of a convict led through town on a donkey while the crier announced his crime; 'calles' is understood"}
          - {w: "vestido en pompa", d: "dressed in state; ironic for the shaming garb (a tall paper cap and placards)"}
        diagram:
          - s: "Este hombre honrado va"
            r: "main verb: this 'honourable' man is going"
            under:
              - {s: "por cuatro años a galeras", r: "for how long, where: four years to the galleys"}
              - s: "habiendo paseado las acostumbradas"
                r: "after what: having been paraded through the usual streets"
                under:
                  - {s: "vestido en pompa y a caballo", r: "how: dressed in state and mounted"}
        forms:
          - {w: "honrado", f: "participle of honrar (to honor) used as an adjective, masculine to match 'hombre'."}
          - {w: "va", f: "ir (to go), present, he. voy, vas, va, vamos, vais, van."}
          - {w: "habiendo paseado", f: "habiendo, the gerund of haber, + paseado, participle of pasear (to parade, stroll): 'having paraded'."}
          - {w: "las acostumbradas", f: "acostumbr- + -adas → acostumbrado (customary), feminine plural with 'calles' (streets) understood: 'the usual ones'."}
          - {w: "vestido", f: "participle of vestir (to dress), masculine to match 'hombre': 'dressed'."}
  - sentences:
      - es: "— Eso es —dijo Sancho Panza—, a lo que a mí me parece, haber salido a la vergüenza."
        literal: "— That is —said Sancho Panza—, to that which to me seems, to-have gone-out to the shame."
        ormsby: "“That means,” said Sancho Panza, “as I take it, to have been exposed to shame in public.”"
        vocab:
          - {w: "a lo que me parece", d: "as it seems to me, as I take it"}
          - {w: "salir a la vergüenza", d: "to be put to public shame, paraded through the streets as a punishment"}
        diagram:
          - s: "Eso es"
            r: "main verb (speech): that is"
            under:
              - {s: "a lo que a mí me parece", r: "aside: as I take it"}
              - {s: "haber salido a la vergüenza", r: "what it is: to have been put to public shame"}
          - s: "dijo"
            r: "main verb (narrator): said"
            under:
              - {s: "Sancho Panza", r: "subject"}
        forms:
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "a mí me parece", f: "parec- + -e → parecer (to seem), present, it, with 'me' (to me) doubled by the stressed 'a mí' for emphasis. parezco, pareces, parece, parecemos, parecéis, parecen."}
          - {w: "haber salido", f: "the perfect infinitive: haber + salido, participle of salir (to go out): 'to have gone out'."}
        note: "Sancho translates the convicts' euphemisms into plain speech: 'paseado las acostumbradas' means the public shaming of being led through the streets to be whipped. He understands the slang better than his master."
