  - sentences:
      - es: "— Éste, señor, va por canario; digo, por músico y cantor."
        literal: "— This-one, sir, goes for canary; I-say, for musician and singer."
        ormsby: "“He, sir, goes as a canary, I mean as a musician and a singer.”"
        vocab:
          - {w: "ir por", d: "to go (to the galleys) for being, as a"}
          - {w: "canario", d: "canary, songbird; in thieves' slang, a man who 'sang', confessed under torture"}
          - {w: "digo", d: "I mean, that is to say (correcting oneself)"}
          - {w: "cantor", d: "singer"}
        diagram:
          - s: "Éste, señor, va"
            r: "main verb: this one goes"
            under:
              - {s: "por canario", r: "why: as a canary"}
              - {s: "digo, por músico y cantor", r: "correction: I mean, as a musician and singer"}
        forms:
          - {w: "Éste", f: "'this one', masculine pronoun pointing at the second convict; accented as a pronoun."}
          - {w: "va", f: "ir (to go), present, he. voy, vas, va, vamos, vais, van."}
          - {w: "digo", f: "dig- + -o → decir (to say), present, I: 'I mean'. digo, dices, dice, decimos, decís, dicen."}
        note: "In germanía a 'canario' was a prisoner who sang, that is, confessed under torture. The first convict dresses up the slang as a joke about music, and Don Quijote takes him literally."
