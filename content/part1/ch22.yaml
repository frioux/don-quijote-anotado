  - sentences:
      - es: "— Bien parece —respondió el galeote— que va el hombre como Dios es servido, pero algún día sabrá alguno si me llamo Ginesillo de Parapilla o no."
        literal: "— Well it-seems —answered the galley-slave— that goes the man as God is pleased, but some day will-know someone if myself I-call Ginesillo de Parapilla or not."
        ormsby: "“It is easy to see,” returned the galley slave, “that man goes as God pleases, but someone shall know some day whether I am called Ginesillo de Parapilla or not.”"
        ormsby_note: "Proverb 79."
        vocab:
          - {w: "bien parece", d: "it is plain to see"}
          - {w: "ir como Dios es servido", d: "proverb: to go as God pleases, to put up with what comes"}
          - {w: "algún día sabrá alguno", d: "some day someone will find out: a veiled threat"}
        diagram:
          - s: "Bien parece"
            r: "main verb (speech) 1: it is plain"
            under:
              - {s: "que va el hombre como Dios es servido", r: "what is plain: that a man goes as God wills"}
          - s: "respondió"
            r: "main verb (narrator): answered"
            under:
              - {s: "el galeote", r: "subject"}
          - s: "pero algún día sabrá alguno"
            r: "main verb (speech) 2: but some day someone will know"
            under:
              - {s: "si me llamo Ginesillo de Parapilla o no", r: "what: whether my name is Ginesillo de Parapilla or not"}
        forms:
          - {w: "parece", f: "parec- + -e → parecer (to seem), present, it. parezco, pareces, parece, parecemos, parecéis, parecen."}
          - {w: "va", f: "ir (to go), present, he. voy, vas, va, vamos, vais, van."}
          - {w: "es servido", f: "ser (to be), present, he (soy, eres, es, somos, sois, son) + servido (pleased): 'as God is pleased', a fixed formula."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun ('día')."}
          - {w: "sabrá", f: "sabr- + -á → saber (to know), future, he. saber has the irregular future stem sabr-: sabré, sabrás, sabrá, sabremos, sabréis, sabrán."}
          - {w: "me llamo", f: "llam- + -o → llamarse (to be called), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
        note: "'Va el hombre como Dios es servido' is a proverb of resignation: a man must go where God sends him. Ginés turns it into a threat with the next clause."
