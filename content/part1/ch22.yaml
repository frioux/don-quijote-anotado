  - sentences:
      - es: "— Pues ¡voto a tal! —dijo don Quijote, ya puesto en cólera—, don hijo de la puta, don Ginesillo de Paropillo, o como os llamáis, que habéis de ir vos solo, rabo entre piernas, con toda la cadena a cuestas."
        literal: "— Well, I-vow to such! —said Don Quijote, now put in anger—, Don son of the whore, Don Ginesillo de Paropillo, or however you call-yourself, that you-have to go you alone, tail between legs, with all the chain on back."
        ormsby: "“Then by all that’s good,” said Don Quixote (now stirred to wrath), “Don son of a bitch, Don Ginesillo de Paropillo, or whatever your name is, you will have to go yourself alone, with your tail between your legs and the whole chain on your back.”"
        vocab:
          - {w: "¡voto a tal!", d: "I swear!, by Heaven! (a euphemistic oath, 'tal' replacing God's name)"}
          - {w: "puesto en cólera", d: "angered, in a rage"}
          - {w: "don hijo de la puta", d: "Sir son of a whore: the 'don' makes the insult a mock title"}
          - {w: "Paropillo", d: "Don Quijote gets the nickname 'Parapilla' wrong"}
          - {w: "rabo entre piernas", d: "with your tail between your legs"}
          - {w: "a cuestas", d: "on one's back"}
        diagram:
          - s: "Pues ¡voto a tal!"
            r: "oath: well, by Heaven!"
          - s: "dijo"
            r: "main verb (narrator): said"
            under:
              - {s: "don Quijote, ya puesto en cólera", r: "subject: Don Quijote, now in a rage"}
          - s: "que habéis de ir vos solo"
            r: "main verb (speech): you will have to go alone yourself"
            under:
              - {s: "don hijo de la puta, don Ginesillo de Paropillo, o como os llamáis", r: "address: insults and the garbled name"}
              - {s: "rabo entre piernas, con toda la cadena a cuestas", r: "how: tail between legs, with the whole chain on your back"}
        forms:
          - {w: "voto", f: "vot- + -o → votar (to vow, swear), present, I: 'I swear'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "puesto", f: "irregular participle of poner (to put), masculine to match Don Quijote: 'put into a rage'."}
          - {w: "os llamáis", f: "llam- + -áis → llamarse (to be called), present, you (vos form), with 'os'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "habéis de ir", f: "habéis → haber, present, you (vos) (he, has, ha, hemos, habéis, han) + 'de' + ir (to go): 'you shall go'."}
        note: "Don Quijote, who never swears, loses his temper and both curses and garbles the nickname Ginés hates. The insult is what turns the convicts on their rescuer."
  - sentences:
      - es: "Pasamonte, que no era nada bien sufrido, estando ya enterado que don Quijote no era muy cuerdo, pues tal disparate había cometido como el de querer darles libertad, viéndose tratar de aquella manera, hizo del ojo a los compañeros, y, apartándose aparte, comenzaron a llover tantas piedras sobre don Quijote, que no se daba manos a cubrirse con la rodela;"
        literal: "Pasamonte, who not was at-all well long-suffering, being already informed that Don Quijote not was very sane, since such folly he-had committed as that of wanting to-give-them liberty, seeing-himself treated in that manner, made of-the eye to the companions, and, withdrawing-themselves apart, they-began to rain so-many stones on Don Quijote, that not himself he-gave hands to cover-himself with the buckler;"
