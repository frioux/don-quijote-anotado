          - {w: "no responder palabra", d: "not to answer a word"}
          - {w: "según iba de triste", d: "so sad was he; 'según ... de' = judging by how ... he was"}
          - {w: "malencónico", d: "= melancólico, melancholy (popular form)"}
          - {w: "mas", d: "but (no accent; 'más' with the accent is 'more')"}
        diagram:
          - s: "Lo mesmo preguntó"
            r: "main verb 1: asked the same"
            under:
              - {s: "don Quijote", r: "subject"}
              - s: "al segundo"
                r: "whom: the second man"
                under:
                  - s: "el cual no respondió palabra"
                    r: "describes 'segundo': who did not answer a word"
                    under:
                      - {s: "según iba de triste y malencónico", r: "why: so sad and melancholy was he"}
          - s: "mas respondió por él el primero"
            r: "main verb 2: but the first answered for him"
          - s: "y dijo:"
            r: "main verb 3: and said"
        forms:
          - {w: "Lo mesmo", f: "'lo' + adjective makes a neuter noun: 'the same thing'; mesmo = mismo."}
          - {w: "preguntó", f: "pregunt- + -ó → preguntar (to ask), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "al segundo", f: "a + el: 'to the second'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron. 'no respondió palabra', with no article, is stronger than 'not a word'."}
          - {w: "iba", f: "ir (to go), imperfect, he; 'iba de triste' = he went about sad. iba, ibas, iba, íbamos, ibais, iban."}
          - {w: "malencónico", f: "a popular reshaping of melancólico (melancholy), as if from 'mal' (ill)."}
          - {w: "él", f: "'him' after 'por', with the accent that marks the pronoun."}
