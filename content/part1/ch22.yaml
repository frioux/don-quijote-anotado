      - es: "Venía diferentemente atado que los demás, porque traía una cadena al pie, tan grande que se la liaba por todo el cuerpo, y dos argollas a la garganta, la una en la cadena, y la otra de las que llaman guardaamigo o piedeamigo, de la cual decendían dos hierros que llegaban a la cintura, en los cuales se asían dos esposas, donde llevaba las manos, cerradas con un grueso candado, de manera que ni con las manos podía llegar a la boca, ni podía bajar la cabeza a llegar a las manos."
