          - s: "para mí tengo"
            r: "main verb 2 (after 'y'): for my part I hold"
            under:
              - {s: "que no van muy fuera de camino", r: "what I hold: that they are not far wrong"}
        forms:
          - {w: "dicen", f: "dic- + -en → decir (to say), present, they. digo, dices, dice, decimos, decís, dicen."}
          - {w: "tantas", f: "tant- + -as → tanto (so many), feminine plural to match 'letras'; 'tantas ... como' = as many ... as."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, it (un no; un delincuente). tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "harta", f: "hart- + -a → harto (plenty), feminine to match 'ventura'."}
          - {w: "está", f: "estar (to be), present, it. estoy, estás, está, estamos, estáis, están."}
          - {w: "la de", f: "'that of', 'la' standing for 'lengua': the tongue of the witnesses."}
          - {w: "tengo", f: "teng- + -o → tener (to hold, have), present, I; 'para mí tengo que' = I am of the opinion that. tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "van", f: "ir (to go), present, they. voy, vas, va, vamos, vais, van."}
        note: "'Tantas letras tiene un no como un sí' is a proverb: saying no takes no more breath than saying yes, so a prisoner who denies everything keeps his fate in his own hands. The guard, a law officer, calmly agrees with the thieves' code."
