      - es: "Porque dicen ellos que tantas letras tiene un no como un sí, y que harta ventura tiene un delincuente, que está en su lengua su vida o su muerte, y no en la de los testigos y probanzas; y para mí tengo que no van muy fuera de camino."
        literal: "Because say they that as-many letters has a no as a yes, and that plenty fortune has a delinquent, that is in his tongue his life or his death, and not in that of the witnesses and proofs; and for myself I-hold that not they-go very out of road."
        ormsby: "for, say they, ‘nay’ has no more letters in it than ‘yea,’ and a culprit is well off when life or death with him depends on his own tongue and not on that of witnesses or evidence; and to my thinking they are not very far out.”"
        ormsby_note: "Proverb 126."
        vocab:
