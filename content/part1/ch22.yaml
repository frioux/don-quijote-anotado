            r: "main verb 9 (wish): let life last"
            under:
              - {s: "que con ella todo se alcanza", r: "reason: for with it everything is attained"}
        forms:
          - {w: "Probóseme", f: "prob- + -ó + se + me → probar (to prove), preterite, it, with 'se' (passive) and 'me' (against me) stuck on the end; modern 'se me probó'. Cervantes hangs pronouns on a verb that opens its clause. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "faltó", f: "falt- + -ó → faltar (to be lacking), preterite, it. Same -ar preterite."}
