  - sentences:
      - es: "— Ya le he dicho, señor comisario —respondió Pasamonte—, que se vaya poco a poco, que aquellos señores no le dieron esa vara para que maltratase a los pobretes que aquí vamos, sino para que nos guiase y llevase adonde Su Majestad manda."
        literal: "— Already to-you I-have said, sir commissary —answered Pasamonte—, that you-go little by little, for those lords not to-you gave that staff so-that you-should-mistreat [to] the poor-fellows who here we-go, but so-that us you-should-guide and take whither His Majesty orders."
        ormsby: "“I told you already to go gently, master commissary,” said Pasamonte; “their lordships yonder never gave you that staff to ill-treat us wretches here, but to conduct and take us where his majesty orders you;"
        vocab:
          - {w: "irse poco a poco", d: "to go easy, take it gently"}
          - {w: "aquellos señores", d: "those gentlemen, the judges who appointed him"}
          - {w: "vara", d: "staff, rod of office carried by officers of justice"}
          - {w: "maltratar", d: "to ill-treat"}
          - {w: "pobrete", d: "poor fellow, poor devil"}
          - {w: "guiar", d: "to guide, conduct"}
