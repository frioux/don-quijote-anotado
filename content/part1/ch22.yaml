            under:
              - {s: "Una de las guardas de a caballo", r: "subject: one of the mounted guards"}
              - s: "que eran galeotes, gente de Su Majestad"
                r: "what he answered, 1: that they were galley slaves, the king's people"
                under:
                  - {s: "que iba a galeras", r: "describes 'gente': going to the galleys"}
              - {s: "y que no había más que decir", r: "what he answered, 2: and there was nothing more to say"}
              - {s: "ni él tenía más que saber", r: "what he answered, 3: nor had he any more business knowing"}
        forms:
          - {w: "Una de las guardas", f: "'guarda' is feminine here though the guard is a man: the word for the duty was used for the person. Modern Spanish says 'uno de los guardas'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "eran", f: "ser (to be), imperfect, they. ser's imperfect is irregular: era, eras, era, éramos, erais, eran. Imperfect because the speech is reported after 'respondió que'."}
          - {w: "iba", f: "ir (to go), imperfect, it ('gente'). iba, ibas, iba, íbamos, ibais, iban."}
          - {w: "había", f: "hab- + -ía → haber, imperfect, used alone as 'there was' (the past of 'hay'). haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
  - sentences:
      - es: "— Con todo eso —replicó don Quijote—, querría saber de cada uno dellos en particular la causa de su desgracia."
        literal: "— With all that —replied Don Quijote—, I-would-want to-know from each one of-them in particular the cause of his misfortune."
        ormsby: "“Nevertheless,” replied Don Quixote, “I should like to know from each of them separately the reason of his misfortune;”"
        vocab:
          - {w: "con todo eso", d: "nevertheless, all the same"}
          - {w: "querría", d: "I should like; the conditional of querer as a polite request"}
          - {w: "dellos", d: "= de ellos, of them"}
          - {w: "en particular", d: "individually, one by one"}
          - {w: "desgracia", d: "misfortune (not 'disgrace')"}
        diagram:
          - s: "replicó"
            r: "main verb (narrator): replied"
            under:
              - {s: "don Quijote", r: "subject"}
          - s: "querría saber"
            r: "main verb (speech): I should like to know"
            under:
              - {s: "Con todo eso", r: "concession: nevertheless"}
              - {s: "de cada uno dellos en particular", r: "from whom: from each of them separately"}
              - {s: "la causa de su desgracia", r: "object: the cause of his misfortune"}
        forms:
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "querría", f: "querr- + -ía → querer (to want), conditional, I: 'I should like'. querer has an irregular conditional stem querr-: querría, querrías, querría, querríamos, querríais, querrían. The conditional softens the request."}
          - {w: "dellos", f: "de + ellos (of them)."}
          - {w: "su", f: "'his', singular to match 'desgracia': each man's own misfortune."}
  - sentences:
      - es: "Añadió a éstas otras tales y tan comedidas razones, para moverlos a que dijesen lo que deseaba, que la otra guarda de a caballo le dijo:"
        literal: "He-added to these other such and so courteous words, to move-them to that they-should-say that which he-desired, that the other guard of on horse to-him said:"
        ormsby: "to this he added more to the same effect to induce them to tell him what he wanted so civilly that the other mounted guard said to him:"
        vocab:
          - {w: "añadir", d: "to add"}
          - {w: "otras tales", d: "others of the same kind"}
          - {w: "comedido", d: "courteous, measured, polite"}
          - {w: "mover a", d: "to move (someone) to, induce"}
        diagram:
          - s: "Añadió"
            r: "main verb: he added"
            under:
              - {s: "a éstas", r: "to what: to these (words)"}
              - s: "otras tales y tan comedidas razones"
                r: "object: other words of the kind and so courteous"
                under:
                  - s: "que la otra guarda de a caballo le dijo:"
                    r: "result of 'tan comedidas': that the other mounted guard said to him"
              - s: "para moverlos"
                r: "why: to induce them"
                under:
                  - {s: "a que dijesen lo que deseaba", r: "to what: to tell him what he wanted"}
        forms:
          - {w: "Añadió", f: "añad- + -ió → añadir (to add), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "éstas", f: "'these ones', feminine plural pronoun standing for 'razones'; accented because it is a pronoun."}
          - {w: "tales, comedidas", f: "tal (such) in the plural and comedido (courteous) in the feminine plural, both to match 'razones'."}
          - {w: "moverlos", f: "mover (to move) + los (them), the pronoun hung on the infinitive after 'para'."}
          - {w: "dijesen", f: "dij- + -esen → decir (to say), imperfect subjunctive (-se form), they: 'that they should tell'. Subjunctive after 'mover a que' (purpose). Built on the preterite dijeron: dijese, dijeses, dijese, dijésemos, dijeseis, dijesen."}
          - {w: "deseaba", f: "dese- + -aba → desear (to want), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "le dijo", f: "dij- + -o → decir (to say), preterite, he, with 'le' (to him) in front. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
      - es: "— Aunque llevamos aquí el registro y la fe de las sentencias de cada uno destos malaventurados, no es tiempo éste de detenerles a sacarlas ni a leellas;"
        literal: "— Although we-carry here the register and the certificate of the sentences of each one of-these ill-fated-ones, not is time this of detaining-them to take-them-out nor to read-them;"
        ormsby: "“Though we have here the register and certificate of the sentence of every one of these wretches, this is no time to take them out or read them;"
        vocab:
          - {w: "registro", d: "register, official record"}
          - {w: "fe", d: "certificate, attestation (a notary's 'fe' = his sworn statement); also 'faith'"}
          - {w: "destos", d: "= de estos, of these"}
          - {w: "malaventurado", d: "ill-fated, wretched"}
          - {w: "detener", d: "to hold up, delay"}
          - {w: "leellas", d: "= leerlas, to read them; -rl- becomes -ll-"}
        diagram:
          - s: "no es tiempo éste"
            r: "main verb: this is no time"
            under:
              - {s: "Aunque llevamos aquí el registro y la fe de las sentencias de cada uno destos malaventurados", r: "concession: although we carry the register and certificate of each wretch's sentence"}
              - s: "de detenerles"
                r: "for what: for holding them up"
                under:
                  - {s: "a sacarlas ni a leellas", r: "to do what: to get the papers out or read them"}
        forms:
          - {w: "llevamos", f: "llev- + -amos → llevar (to carry), present, we. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "destos", f: "de + estos (of these)."}
          - {w: "malaventurados", f: "mal (ill) + aventurado (fated), masculine plural; used as a noun, 'these wretches'."}
          - {w: "éste", f: "'this one', masculine pronoun for the moment, 'this is no time'; accented as a pronoun."}
          - {w: "detenerles", f: "detener (to hold up) + les (them), the pronoun hung on the infinitive; 'les' for men as the direct object is Castilian leísmo."}
          - {w: "sacarlas, leellas", f: "sacar (to take out) + las (them, the sentences) and leer (to read) + las, with -rl- turned into -ll-: leellas = leerlas."}
      - es: "vuestra merced llegue y se lo pregunte a ellos mesmos, que ellos lo dirán si quisieren, que sí querrán, porque es gente que recibe gusto de hacer y decir bellaquerías."
        literal: "your worship let-approach and it to-them let-ask to them themselves, for they it will-say if they-should-want, for yes they-will-want, because it-is people that receives pleasure from doing and saying rascalities."
        ormsby: "come and ask themselves; they can tell if they choose, and they will, for these fellows take a pleasure in doing and talking about rascalities.”"
        vocab:
          - {w: "llegar", d: "here: to go up, approach"}
          - {w: "mesmos", d: "= mismos; 'ellos mesmos' = they themselves"}
          - {w: "si quisieren", d: "if they should wish; future subjunctive, modern 'si quieren'"}
          - {w: "recibir gusto de", d: "to take pleasure in"}
          - {w: "bellaquería", d: "roguery, knavery, a rascal's trick"}
        diagram:
          - s: "vuestra merced llegue y se lo pregunte a ellos mesmos"
            r: "main verbs: let your worship go up and ask them themselves"
            under:
              - s: "que ellos lo dirán"
                r: "reason: for they will tell it"
                under:
                  - {s: "si quisieren", r: "condition: if they choose"}
                  - s: "que sí querrán"
                    r: "aside: and they will"
                    under:
                      - {s: "porque es gente que recibe gusto de hacer y decir bellaquerías", r: "why: because they enjoy doing and telling of roguery"}
        forms:
          - {w: "llegue", f: "llegu- + -e → llegar (to approach), present subjunctive as a polite command, you (vuestra merced): 'go up'. The g takes a u before e to keep the hard sound: llegue, llegues, llegue, lleguemos, lleguéis, lleguen."}
          - {w: "se lo pregunte", f: "pregunt- + -e → preguntar (to ask), present subjunctive command, you: 'ask it of them'. 'se' stands for 'les' (to them): le / les become 'se' before lo. The -ar subjunctive endings: -e, -es, -e, -emos, -éis, -en."}
          - {w: "mesmos", f: "old spelling of mismos (-selves), masculine plural to match 'ellos'."}
          - {w: "dirán", f: "dir- + -án → decir (to say), future, they. decir has the shortened future stem dir-: diré, dirás, dirá, diremos, diréis, dirán."}
          - {w: "quisieren", f: "quis- + -ieren → querer (to want), future subjunctive, they: 'if they should wish'. Built on the preterite quisieron: quisiere, quisieres, quisiere, quisiéremos, quisiereis, quisieren. Used after 'si' for an open future; modern Spanish says 'si quieren'."}
          - {w: "querrán", f: "querr- + -án → querer (to want), future, they: 'they will want to'. Irregular stem querr-: querré, querrás, querrá, querremos, querréis, querrán."}
          - {w: "recibe", f: "recib- + -e → recibir (to receive), present, it ('gente'). The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
  - sentences:
      - es: "Con esta licencia, que don Quijote se tomara aunque no se la dieran, se llegó a la cadena, y al primero le preguntó que por qué pecados iba de tan mala guisa."
        literal: "With this permission, which Don Quijote for-himself would-have-taken although not to-him it they-gave, he-approached to the chain, and to-the first him he-asked that for what sins he-was-going in such bad fashion."
        ormsby: "With this permission, which Don Quixote would have taken even had they not granted it, he approached the chain and asked the first for what offences he was now in such a sorry case."
        vocab:
          - {w: "licencia", d: "permission, leave"}
          - {w: "tomarse", d: "to take for oneself, help oneself to"}
          - {w: "llegarse a", d: "to go up to, approach"}
          - {w: "pecado", d: "sin; here jokingly for 'crime'"}
          - {w: "de mala guisa", d: "in a bad way, in sorry fashion; 'guisa' is an old word for manner"}
        diagram:
          - s: "se llegó"
            r: "main verb 1: he went up"
            under:
              - s: "Con esta licencia"
                r: "with what: with this leave"
                under:
                  - s: "que don Quijote se tomara"
                    r: "describes 'licencia': which he would have taken anyway"
                    under:
                      - {s: "aunque no se la dieran", r: "concession: even if they had not given it"}
              - {s: "a la cadena", r: "where to: to the chain"}
          - s: "le preguntó"
            r: "main verb 2 (after 'y'): asked him"
            under:
              - {s: "al primero", r: "whom: the first man"}
              - {s: "que por qué pecados iba de tan mala guisa", r: "what he asked: for what sins he was in such a sorry state"}
        forms:
          - {w: "se tomara", f: "tom- + -ara → tomar (to take), imperfect subjunctive (-ra form), he, with 'se' (for himself): here 'would have taken'. Cervantes uses the -ra form where modern Spanish says 'habría tomado'. The -ra form of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran."}
          - {w: "se la dieran", f: "di- + -eran → dar (to give), imperfect subjunctive (-ra form), they: 'had they not given it'. 'se' = to him (le turned into se before 'la'); 'la' = it, the licencia. dar's -ra subjunctive: diera, dieras, diera, diéramos, dierais, dieran."}
          - {w: "se llegó", f: "lleg- + -ó → llegarse (to go up to), preterite, he, with 'se'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "al primero", f: "a + el: 'to the first'; the personal 'a' marking the man as object, picked up again by 'le'."}
          - {w: "le preguntó", f: "pregunt- + -ó → preguntar (to ask), preterite, he, with 'le' (him). Same -ar preterite. The 'que' after it is the old way of introducing an indirect question."}
          - {w: "iba", f: "ir (to go), imperfect, he. ir's imperfect: iba, ibas, iba, íbamos, ibais, iban."}
      - es: "Él le respondió que por enamorado iba de aquella manera."
        literal: "He to-him answered that for enamoured he-was-going in that manner."
        ormsby: "He made answer that it was for being a lover."
        vocab:
          - {w: "por enamorado", d: "for being in love; 'por' + adjective = on account of being"}
          - {w: "enamorado", d: "in love, a lover"}
        diagram:
