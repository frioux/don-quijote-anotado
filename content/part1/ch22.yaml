          - {w: "el cual", d: "who, which; Cervantes often opens a sentence with it to pick up the last person named"}
          - {w: "mozo", d: "young man, lad"}
          - {w: "de hasta edad de", d: "of about the age of; 'hasta' = roughly"}
          - {w: "natural de", d: "a native of, born in"}
          - {w: "Piedrahíta", d: "a town in the province of Ávila, in Old Castile"}
