      - es: "Pero, porque sé que una de las partes de la prudencia es que lo que se puede hacer por bien no se haga por mal, quiero rogar a estos señores guardianes y comisario sean servidos de desataros y dejaros ir en paz, que no faltarán otros que sirvan al rey en mejores ocasiones;"
