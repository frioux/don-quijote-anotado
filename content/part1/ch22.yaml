      - es: "Dígolo porque si a su tiempo tuviera yo esos veinte ducados que vuestra merced ahora me ofrece, hubiera untado con ellos la péndola del escribano y avivado el ingenio del procurador, de manera que hoy me viera en mitad de la plaza de Zocodover, de Toledo, y no en este camino, atraillado como galgo; pero Dios es grande: paciencia y basta."
