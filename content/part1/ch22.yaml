  - sentences:
      - es: "— Yo voy aquí porque me burlé demasiadamente con dos primas hermanas mías, y con otras dos hermanas que no lo eran mías; finalmente, tanto me burlé con todas, que resultó de la burla crecer la parentela, tan intricadamente que no hay diablo que la declare."
        literal: "— I go here because myself I-joked too-much with two cousins first of-mine, and with other two sisters who not it were mine; finally, so-much myself I-joked with all, that resulted from the joke to-grow the kinship, so intricately that not there-is devil that it may-explain."
        ormsby: "“I am here because I carried the joke too far with a couple of cousins of mine, and with a couple of other cousins who were none of mine; in short, I carried the joke so far with them all that it ended in such a complicated increase of kindred that no accountant could make it clear:"
        vocab:
          - {w: "burlarse con", d: "to fool about with, dally with; a euphemism for seducing"}
          - {w: "demasiadamente", d: "too much, excessively"}
          - {w: "prima hermana", d: "first cousin (female)"}
          - {w: "finalmente", d: "in short, in the end"}
          - {w: "parentela", d: "kinsfolk, family connections"}
          - {w: "intricadamente", d: "= intrincadamente, intricately, tangledly"}
          - {w: "no hay diablo que", d: "there's no devil who (could), i.e. nobody on earth"}
          - {w: "declarar", d: "to explain, make clear"}
        diagram:
          - s: "Yo voy aquí"
            r: "main verb 1: I go here"
            under:
              - s: "porque me burlé demasiadamente con dos primas hermanas mías"
                r: "why: because I fooled about too much with two first cousins of mine"
                under:
                  - {s: "y con otras dos hermanas que no lo eran mías", r: "and with two other sisters who were not mine"}
          - s: "finalmente, tanto me burlé con todas"
            r: "main verb 2: in short, I fooled about so much with them all"
            under:
              - s: "que resultó de la burla crecer la parentela"
                r: "result: that the family grew from the fooling"
                under:
                  - s: "tan intricadamente"
                    r: "how: so tangledly"
                    under:
                      - {s: "que no hay diablo que la declare", r: "result: that no devil could sort it out"}
        forms:
          - {w: "voy", f: "ir (to go), present, I. voy, vas, va, vamos, vais, van."}
          - {w: "me burlé", f: "burl- + -é → burlarse (to fool about), preterite, I, with 'me'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "demasiadamente", f: "demasiado (too much) + -mente, the adverb ending; modern Spanish just says 'demasiado'."}
          - {w: "primas hermanas mías", f: "all three feminine plural: 'cousins first of mine'. 'mías' is the stressed possessive placed after the noun."}
          - {w: "no lo eran mías", f: "ser (to be), imperfect, they (era, eras, era, éramos, erais, eran), with 'lo' standing for 'hermanas mías': 'were not that (my sisters)'. The joke: the second pair were sisters to each other, not to him."}
          - {w: "resultó", f: "result- + -ó → resultar (to result), preterite, it; its subject is the infinitive phrase 'crecer la parentela'. Same -ar preterite."}
          - {w: "crecer", f: "infinitive (to grow) used as the subject of 'resultó': 'that the kinship should grow'."}
          - {w: "hay", f: "haber used alone, present: 'there is'."}
          - {w: "la declare", f: "declar- + -e → declarar (to explain), present subjunctive, he, with 'la' (it, the kinship). Subjunctive after a denied antecedent ('no hay diablo que'). The -ar subjunctive: -e, -es, -e, -emos, -éis, -en."}
        note: "The student seduced two of his cousins and two sisters (sisters of each other), fathering children on all of them, so that the family tree has become a tangle nobody could sort out. 'Burlarse con' (to fool about with) is his coy word for it."
      - es: "Probóseme todo, faltó favor, no tuve dineros, víame a pique de perder los tragaderos, sentenciáronme a galeras por seis años, consentí: castigo es de mi culpa; mozo soy: dure la vida, que con ella todo se alcanza."
        literal: "Proved-itself-to-me all, lacked favour, not I-had moneys, I-saw-myself on the-point of losing the gullet, they-sentenced-me to galleys for six years, I-consented: punishment it-is of my fault; young I-am: let-last the life, for with it all is-attained."
        ormsby: "it was all proved against me, I got no favour, I had no money, I was near having my neck stretched, they sentenced me to the galleys for six years, I accepted my fate, it is the punishment of my fault; I am a young man; let life only last, and with that all will come right."
        vocab:
          - {w: "probar", d: "to prove; 'probóseme todo' = everything was proved against me"}
          - {w: "faltar favor", d: "to lack influence, have no friends in high places"}
          - {w: "verse a pique de", d: "to be on the point of, within an ace of"}
          - {w: "tragaderos", d: "gullet, throat; 'perder los tragaderos' = to be hanged"}
          - {w: "consentir", d: "to accept (a sentence), not appeal"}
          - {w: "mozo", d: "young"}
          - {w: "dure la vida", d: "let life last, as long as there is life"}
          - {w: "alcanzarse", d: "to be attained, achieved"}
