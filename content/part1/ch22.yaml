        literal: "for the mine were that I-loved so-much [to] a basket of bleaching, crammed with clothing white, that it I-embraced with-me so strongly that, at not taking-it-from-me the justice by force, even until now not it I-would-have let-go of my will."
        ormsby: "mine was that I loved a washerwoman’s basket of clean linen so well, and held it so close in my embrace, that if the arm of the law had not forced it from me, I should never have let it go of my own will to this moment;"
        vocab:
          - {w: "los míos", d: "mine (my loves)"}
          - {w: "querer a", d: "to love (a person); the joke is that the object is a basket"}
          - {w: "canasta de colar", d: "laundry basket, the hamper in which washing was bleached with lye ('colar' = to bleach, strain)"}
          - {w: "atestado de", d: "crammed with, stuffed with"}
          - {w: "ropa blanca", d: "linen, white washing"}
          - {w: "abrazar", d: "to embrace, hug"}
          - {w: "a no + infinitive", d: "if ... had not; 'a no quitármela' = had they not taken it from me"}
          - {w: "agora", d: "= ahora, now (old form)"}
          - {w: "dejar", d: "to let go of, leave"}
        diagram:
          - s: "los míos fueron"
            r: "main verb (after 'que'): mine were"
            under:
              - s: "que quise tanto a una canasta de colar, atestada de ropa blanca"
                r: "what they were: that I so loved a laundry basket full of linen"
                under:
                  - s: "que la abracé conmigo tan fuertemente"
                    r: "result of 'tanto': that I hugged it so hard"
                    under:
                      - s: "que, a no quitármela la justicia por fuerza, aún hasta agora no la hubiera dejado"
                        r: "result of 'tan': that, had the law not torn it from me, I would still be holding it"
                        under:
                          - {s: "de mi voluntad", r: "how: of my own will"}
        forms:
          - {w: "los míos", f: "the stressed possessive 'mío' with the article, masculine plural to stand for 'los amores': 'mine'."}
          - {w: "fueron", f: "fu- + -eron → ser (to be), preterite, they. ser's preterite is irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "quise", f: "quis- + -e → querer (to love), preterite, I. Irregular stem: quise, quisiste, quiso, quisimos, quisisteis, quisieron. The personal 'a' before 'canasta' treats the basket as a sweetheart."}
          - {w: "atestada", f: "atest- + -ada → atestado, participle of atestar (to cram), feminine to match 'canasta'."}
          - {w: "la abracé", f: "abrac- + -é → abrazar (to embrace), preterite, I, with 'la' (it, the basket). The z becomes c before e: abracé, abrazaste, abrazó, abrazamos, abrazasteis, abrazaron."}
          - {w: "conmigo", f: "con + mí fused into one word: 'with me' (also contigo, consigo)."}
          - {w: "fuertemente", f: "fuerte (strong) + -mente, the adverb ending: 'strongly'."}
          - {w: "a no quitármela", f: "'a' + 'no' + infinitive = 'had not', a condition: quitar (to take away) + me (from me) + la (it). A written accent keeps the stress on 'quitár-'. The subject 'la justicia' follows the infinitive."}
          - {w: "agora", f: "old form of ahora (now)."}
          - {w: "la hubiera dejado", f: "hub- + -iera → haber, imperfect subjunctive (-ra form), I, + dejado, participle of dejar (to let go): 'I would not have let it go', a pluperfect conditional. haber's -ra form: hubiera, hubieras, hubiera, hubiéramos, hubierais, hubieran."}
        note: "The 'lover' is a thief who stole a basket of washing; thieves' slang called stealing 'loving'. The whole speech keeps up the double meaning, with the basket embraced like a mistress and the law as a jealous rival."
      - es: "Fue en fragante, no hubo lugar de tormento; concluyóse la causa, acomodáronme las espaldas con ciento, y por añadidura tres precisos de gurapas, y acabóse la obra."
        literal: "It-was in flagrant, not there-was place for torture; concluded-itself the case, they-fitted-me the back with a-hundred, and by addition three precise [years] of gurapas, and finished-itself the work."
        ormsby: "I was caught in the act, there was no occasion for torture, the case was settled, they treated me to a hundred lashes on the back, and three years of gurapas besides, and that was the end of it.”"
        vocab:
          - {w: "en fragante", d: "= in flagrante, caught in the act, red-handed (Latin 'in flagranti delicto')"}
          - {w: "no hubo lugar de", d: "there was no occasion for, no need of"}
          - {w: "tormento", d: "judicial torture, used to extract a confession when the evidence was incomplete"}
          - {w: "concluir la causa", d: "to settle the case; 'causa' = lawsuit, trial"}
          - {w: "acomodar las espaldas con ciento", d: "to 'fit out' the back with a hundred (lashes); a convict's ironic phrasing"}
          - {w: "por añadidura", d: "in addition, into the bargain"}
          - {w: "tres precisos", d: "three (years) exact, three years precisely; slang for a galley sentence"}
          - {w: "gurapas", d: "galleys, in thieves' slang (germanía)"}
          - {w: "acabarse la obra", d: "to be done with, that was the end of the business"}
        diagram:
          - s: "Fue en fragante"
            r: "main verb 1: it was in the act"
          - s: "no hubo lugar de tormento"
            r: "main verb 2: there was no occasion for torture"
          - s: "concluyóse la causa"
            r: "main verb 3: the case was closed"
          - s: "acomodáronme las espaldas"
            r: "main verb 4: they fitted out my back"
            under:
              - {s: "con ciento", r: "with what: with a hundred (lashes)"}
              - {s: "y por añadidura tres precisos de gurapas", r: "and in addition three years' galleys"}
          - s: "y acabóse la obra"
            r: "main verb 5: and the job was done"
        forms:
          - {w: "Fue", f: "fu- + -e → ser (to be), preterite, it. ser's preterite: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "hubo", f: "hub- + -o → haber, preterite, used alone as 'there was' (the past of 'hay'). Irregular: hube, hubiste, hubo, hubimos, hubisteis, hubieron."}
          - {w: "concluyóse", f: "conclu- + -yó + se → concluirse (to be concluded), preterite, it, with 'se' stuck on the end; modern 'se concluyó'. Cervantes hangs pronouns on a verb that opens its clause. -uir verbs put a y between vowels: concluí, concluiste, concluyó, concluimos, concluisteis, concluyeron."}
          - {w: "acomodáronme", f: "acomod- + -aron + me → acomodar (to fit, settle), preterite, they, with 'me' (for me) stuck on the end; modern 'me acomodaron'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "precisos", f: "precis- + -os → preciso (exact), masculine plural, with 'años' understood: 'three exact ones'."}
          - {w: "acabóse", f: "acab- + -ó + se → acabarse (to come to an end), preterite, it, with 'se' on the end; modern 'se acabó'. Same -ar preterite."}
        note: "Caught in the act, the thief needed no torture: Castilian procedure used torture only to complete the proof when a confession was lacking. Whipping (a hundred or two hundred lashes through the streets) plus years at the oar was the normal sentence for theft."
