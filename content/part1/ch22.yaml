                  - {s: "que se hicieron en la venta", r: "describes 'manchas': that were made at the inn"}
          - s: "y todo el mundo calle, y viva bien, y hable mejor"
            r: "main verbs 2 to 4 (wishes): and let everyone keep quiet, live well, speak better"
          - s: "y caminemos"
            r: "main verb 5: and let us march"
            under:
              - {s: "que ya es mucho regodeo éste", r: "why: for this fun has gone on long enough"}
        forms:
          - {w: "Basta", f: "bast- + -a → bastar (to be enough), present, it: 'enough!'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "podría", f: "podr- + -ía → poder (can), conditional, it: 'it could be'. Irregular stem podr-: podría, podrías, podría, podríamos, podríais, podrían."}
          - {w: "saliesen", f: "sal- + -iesen → salir (to come out), imperfect subjunctive (-se form), they (the stains). After 'podría ser que'. The -se form of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen."}
          - {w: "se hicieron", f: "hic- + -ieron → hacer (to make), preterite, they, with 'se' as passive: 'were made'. hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "calle, viva, hable", f: "call- + -e → callar (to be silent), viv- + -a → vivir (to live), habl- + -e → hablar (to speak), present subjunctive, he ('todo el mundo'), as wishes or commands. The -ar subjunctive: -e, -es, -e, -emos, -éis, -en; the -ir: -a, -as, -a, -amos, -áis, -an."}
          - {w: "caminemos", f: "camin- + -emos → caminar (to walk), present subjunctive, we: 'let us march'. Same -ar subjunctive."}
          - {w: "éste", f: "'this', masculine pronoun for the 'regodeo', put at the end for emphasis."}
        note: "Ginés hints that the commissary has his own secrets from some inn on the road, perhaps a bribe or a theft, and threatens to air them. 'Saldrán en la colada' is a proverb: dirty linen comes out in the wash."
