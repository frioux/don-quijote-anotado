  - sentences:
      - es: "— Va por diez años —replicó la guarda—, que es como muerte cevil."
        literal: "— He-goes for ten years —replied the guard—, which is like death civil."
        ormsby: "“He goes for ten years,” replied the guard, “which is the same thing as civil death,"
        vocab:
          - {w: "muerte cevil", d: "= muerte civil, civil death: the loss of all civil rights, as if legally dead; 'cevil' is an old spelling of 'civil'"}
        diagram:
          - s: "Va por diez años"
            r: "main verb (speech): he goes for ten years"
            under:
              - {s: "que es como muerte cevil", r: "comment: which is like civil death"}
          - s: "replicó"
            r: "main verb (narrator): replied"
            under:
              - {s: "la guarda", r: "subject"}
        forms:
          - {w: "Va", f: "ir (to go), present, he. voy, vas, va, vamos, vais, van."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "cevil", f: "old spelling of civil."}
        note: "A galley sentence of ten years or more carried 'muerte civil': the convict lost his legal standing, property rights and family rights as if he were dead. Few survived that long at the oar."
      - es: "No se quiera saber más, sino que este buen hombre es el famoso Ginés de Pasamonte, que por otro nombre llaman Ginesillo de Parapilla."
        literal: "Not let-it-be-wanted to-know more, but that this good man is the famous Ginés de Pasamonte, whom by other name they-call Ginesillo de Parapilla."
        ormsby: "and all that need be said is that this good fellow is the famous Ginés de Pasamonte, otherwise called Ginesillo de Parapilla.”"
        vocab:
          - {w: "no se quiera saber más", d: "let no one ask to know more, that is all you need to know"}
          - {w: "buen hombre", d: "good fellow; ironic"}
          - {w: "por otro nombre", d: "otherwise, alias"}
          - {w: "Ginesillo de Parapilla", d: "a mocking nickname: the diminutive 'Ginesillo', and 'Parapilla' perhaps from 'pillar' (to pillage, catch)"}
        diagram:
          - s: "No se quiera saber más"
            r: "main verb: let no more be asked"
            under:
              - s: "sino que este buen hombre es el famoso Ginés de Pasamonte"
                r: "except: that this good man is the famous Ginés de Pasamonte"
                under:
                  - {s: "que por otro nombre llaman Ginesillo de Parapilla", r: "describes him: whom they also call Ginesillo de Parapilla"}
        forms:
          - {w: "se quiera", f: "quier- + -a → querer (to want), present subjunctive, it, with impersonal 'se': 'let it not be wished'. The stem e becomes ie when stressed: quiera, quieras, quiera, queramos, queráis, quieran."}
          - {w: "buen", f: "bueno (good) clipped before a masculine singular noun ('hombre')."}
          - {w: "es", f: "ser (to be), present, he. soy, eres, es, somos, sois, son."}
          - {w: "llaman", f: "llam- + -an → llamar (to call), present, they (impersonal). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "Ginesillo", f: "Ginés + the diminutive -illo, belittling."}
  - sentences:
      - es: "— Señor comisario —dijo entonces el galeote—, váyase poco a poco, y no andemos ahora a deslindar nombres y sobrenombres."
        literal: "— Sir commissary —said then the galley-slave—, go-yourself little by little, and not let-us-go-about now to mark-out names and surnames."
        ormsby: "“Gently, señor commissary,” said the galley slave at this, “let us have no fixing of names or surnames;"
        vocab:
          - {w: "comisario", d: "commissary, the officer in charge of the chain gang"}
          - {w: "irse poco a poco", d: "to go easy, take it gently"}
          - {w: "andar a", d: "to go about doing, busy oneself with"}
          - {w: "deslindar", d: "to mark the boundaries of; here to pick over, sort out"}
          - {w: "sobrenombre", d: "surname; also nickname"}
        diagram:
          - s: "dijo"
            r: "main verb (narrator): said"
            under:
              - {s: "entonces el galeote", r: "when, subject: then the galley slave"}
          - s: "váyase poco a poco"
            r: "main verb (speech) 1: go easy"
            under:
              - {s: "Señor comisario", r: "address"}
          - s: "y no andemos ahora a deslindar nombres y sobrenombres"
            r: "main verb (speech) 2: and let's not go splitting hairs over names"
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "váyase", f: "vay- + -a + se → irse (to go), present subjunctive used as a polite command, you (the he-form), with 'se' on the end, accent added. ir's subjunctive: vaya, vayas, vaya, vayamos, vayáis, vayan."}
          - {w: "andemos", f: "and- + -emos → andar (to go about), present subjunctive, we: 'let us not go'. The -ar subjunctive: -e, -es, -e, -emos, -éis, -en."}
      - es: "Ginés me llamo y no Ginesillo, y Pasamonte es mi alcurnia, y no Parapilla, como voacé dice; y cada uno se dé una vuelta a la redonda, y no hará poco."
        literal: "Ginés myself I-call and not Ginesillo, and Pasamonte is my lineage, and not Parapilla, as your-worship says; and each one himself let-give a turn to the round, and not he-will-do little."
        ormsby: "my name is Ginés, not Ginesillo, and my family name is Pasamonte, not Parapilla as you say; let each one mind his own business, and he will be doing enough.”"
        vocab:
          - {w: "llamarse", d: "to be called; 'Ginés me llamo' = my name is Ginés"}
          - {w: "alcurnia", d: "lineage, ancestry; a grand word for a family name"}
          - {w: "voacé", d: "a slurred form of 'vuestra merced', your worship; the speech of ruffians and soldiers"}
          - {w: "darse una vuelta a la redonda", d: "to take a turn round oneself, look to oneself: mind your own business"}
          - {w: "no hará poco", d: "he will do no small thing, he'll have enough to do"}
        diagram:
          - s: "Ginés me llamo y no Ginesillo"
            r: "main verb 1: my name is Ginés, not Ginesillo"
          - s: "y Pasamonte es mi alcurnia, y no Parapilla"
            r: "main verb 2: and Pasamonte is my lineage, not Parapilla"
            under:
              - {s: "como voacé dice", r: "comparison: as your worship says"}
          - s: "y cada uno se dé una vuelta a la redonda"
            r: "main verb 3 (wish): and let each man look to himself"
          - s: "y no hará poco"
            r: "main verb 4: and he will do no little"
        forms:
          - {w: "me llamo", f: "llam- + -o → llamarse (to be called), present, I, with 'me'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "dice", f: "dic- + -e → decir (to say), present, you (voacé takes he-forms). digo, dices, dice, decimos, decís, dicen."}
          - {w: "se dé", f: "dé → dar (to give), present subjunctive, he, with 'se': 'let him give himself'. The accent tells it from 'de' (of). dé, des, dé, demos, deis, den."}
          - {w: "hará", f: "har- + -á → hacer (to do), future, he. hacer has the short future stem har-: haré, harás, hará, haremos, haréis, harán."}
  - sentences:
