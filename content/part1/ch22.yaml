      - es: "pero pensar que hemos de volver ahora a las ollas de Egipto, digo, a tomar nuestra cadena y a ponernos en camino del Toboso, es pensar que es ahora de noche, que aún no son las diez del día, y es pedir a nosotros eso como pedir peras al olmo."
        literal: "but to-think that we-have to return now to the pots of Egypt, I-say, to take our chain and to put-ourselves on road of-El Toboso, is to-think that it-is now of night, for still not are the ten of-the day, and it-is to-ask of us that like to-ask pears of-the elm."
