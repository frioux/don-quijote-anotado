          - {w: "víame", f: "ve- + -ía + me → ver (to see), imperfect, I, with 'me' (myself) on the end; modern 'me veía'. The accent marks the stress on 'ví-'. The imperfect of ver keeps the e: veía, veías, veía, veíamos, veíais, veían."}
          - {w: "sentenciáronme", f: "sentenci- + -aron + me → sentenciar (to sentence), preterite, they, with 'me' on the end; modern 'me sentenciaron'. Same -ar preterite."}
          - {w: "consentí", f: "consent- + -í → consentir (to consent), preterite, I. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "es, soy", f: "ser (to be), present, it and I: soy, eres, es, somos, sois, son. In both clauses the predicate comes first: 'castigo es', 'mozo soy'."}
          - {w: "dure", f: "dur- + -e → durar (to last), present subjunctive, it, as a wish: 'may life last'. The -ar subjunctive: -e, -es, -e, -emos, -éis, -en."}
          - {w: "se alcanza", f: "alcanz- + -a → alcanzar (to attain), present, it, with 'se' as a passive: 'is attained'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
        note: "The clipped, verbless-sounding string of clauses imitates a quick confession: proof, no friends, no money, nearly hanged, six years, I took it. 'Favor' is patronage, the protection of someone powerful, which in that legal system counted as much as evidence."
      - es: "Si vuestra merced, señor caballero, lleva alguna cosa con que socorrer a estos pobretes, Dios se lo pagará en el cielo, y nosotros tendremos en la tierra cuidado de rogar a Dios en nuestras oraciones por la vida y salud de vuestra merced, que sea tan larga y tan buena como su buena presencia merece."
