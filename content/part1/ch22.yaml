          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "juntos", f: "junt- + -os → junto (together), masculine plural to match 'otros'."}
          - {w: "era", f: "ser (to be), imperfect, he. era, eras, era, éramos, erais, eran."}
          - {w: "le llevaban", f: "llev- + -aban → llevar (to take), imperfect, they, with 'le' (him). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
