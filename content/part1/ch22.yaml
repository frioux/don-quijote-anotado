      - es: "Señor caballero, si tiene algo que darnos, dénoslo ya, y vaya con Dios, que ya enfada con tanto querer saber vidas ajenas; y si la mía quiere saber, sepa que yo soy Ginés de Pasamonte, cuya vida está escrita por estos pulgares."
        literal: "Sir knight, if you-have something to give-us, give-it-to-us now, and go with God, for already you-annoy with so-much wanting to-know lives of-others; and if the mine you-want to-know, know that I am Ginés de Pasamonte, whose life is written by these thumbs."
