            r: "question with no verb: for that alone?"
          - s: "replicó"
            r: "main verb (narrator): replied"
            under:
              - {s: "don Quijote", r: "subject"}
          - s: "pudiera yo estar bogando en ellas"
            r: "main verb 2: I could have been rowing in them"
            under:
              - {s: "si por enamorados echan a galeras", r: "condition: if they send lovers to the galleys"}
              - {s: "días ha que", r: "since when: for days now, long ago"}
        forms:
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "enamorados", f: "plural of enamorado (in love): 'for being lovers', generalizing from the one man."}
          - {w: "echan", f: "ech- + -an → echar (to throw, send), present, they (impersonal 'they'). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "ha", f: "haber (to have), present, it, used for time: 'días ha' = 'it has days', i.e. days ago. Modern Spanish says 'hace días'. he, has, ha, hemos, habéis, han."}
          - {w: "pudiera", f: "pud- + -iera → poder (to be able), imperfect subjunctive (-ra form), I: here 'could have', a conditional. Built on the preterite pudieron: pudiera, pudieras, pudiera, pudiéramos, pudierais, pudieran."}
          - {w: "estar bogando", f: "estar (to be) + bogando, gerund of bogar (to row): 'be rowing'."}
