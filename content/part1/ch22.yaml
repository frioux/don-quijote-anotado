summary: |
  Don Quijote and Sancho meet a dozen convicts chained together by the neck, marched under guard to serve the king as galley slaves. Don Quijote hears that they go by force and decides that his office is to undo force. Sancho reminds him that the king's justice is punishing them, not wronging them, but Don Quijote politely asks each man his crime.

  The answers come in thieves' slang. One went for 'loving' a basket of laundry, another for 'singing' (confessing under torture) and is despised by the rest for it, a third for lacking ten ducats to bribe the clerk. A white-bearded old man goes for pimping and a little sorcery, and Don Quijote praises pimping as a needed office while denying that spells can force the will; Sancho gives him four reales. A student goes for seducing his cousins. Last comes the heavily chained Ginés de Pasamonte, who is writing his own life story, boasts that it beats Lazarillo de Tormes, and trades threats with the commissary.

  Don Quijote makes a speech asking the guards to free the men, since God and nature made them free, and when the commissary mocks him and his basin-helmet he charges and unhorses him with his lance. The convicts break their chain, Ginés seizes the commissary's musket, and the guards flee under a hail of stones. Sancho fears the Holy Brotherhood and urges flight into the sierra.

  Don Quijote instead orders the convicts to carry their chain to El Toboso and present themselves to Dulcinea. Ginés refuses, offering prayers instead, and when Don Quijote curses him the convicts stone knight and squire, smash the basin, strip them both, and scatter. The chapter ends on the four of them left on the road: the donkey shaking its ears, Rocinante lying beside his master, Sancho in his shirt, and Don Quijote vexed at being so ill-paid by the men he had freed.
context: |
  Galleys and punishment. Spain's Mediterranean war galleys were rowed by 'forzados', convicts sentenced to the oar for years, alongside slaves and paid rowers. Sentences in this chapter run from three to ten years, usually with a public whipping (a hundred or two hundred lashes) first; the old pimp has also been 'paseado', paraded through the usual streets on a donkey for public shame, which Ormsby notes is constantly alluded to in the picaresque novels. A ten-year sentence carried 'civil death', the loss of all legal rights. Torture was a normal part of procedure where a confession was needed, and the convicts' code says a man who holds out keeps his fate in his own hands. The thief who could not raise ten ducats explains how the system worked: the notary's pen and the attorney's wits could be bought. The guards answer to a 'comisario', and behind them stands the Santa Hermandad, the rural police who could hang highwaymen without much ceremony.

  Chivalry and the picaresque. Freeing captives is a stock adventure of the romances, and Don Quijote's speech (God and nature made men free; let each answer for his sins in the next world) is chivalric and sincere; Cervantes, who spent five years as a slave in Algiers, gives it real force. But the chapter brings the knight face to face with the other fashionable fiction of the time, the picaresque novel told by a rogue in the first person. Ginés de Pasamonte is writing exactly such a book, scorns Lazarillo de Tormes (1554), and cannot finish it because his life is not finished. Ormsby notes that the only other picaresque book then in print was Alemán's Guzmán de Alfarache (1599), whose hero is also sent to the galleys, and that the jab may be aimed at it. Sending the freed men to Dulcinea is another romance convention, applied to convicts.

  The narrator's games. The chapter opens with Cide Hamete's 'most grave, high-sounding, minute, sweet and imagined history', a pompous string of adjectives that admits the history is invented. Ormsby points out a slip: two mounted guards are given muskets at the start, but the one Don Quijote fells is 'the one with the musket'. The narrator also lets a guard calmly agree with the thieves' code of silence.

  Law, religion and magic. Sancho states the doctrine that the king is justice itself. Don Quijote's defence of the pimp as a licensed office parodies the reform treatises of the day, which proposed inspectors and fixed numbers for every trade. His remark that no spell can force the will is orthodox Catholic teaching on free will: love charms were punished, but theologians held they could not truly work. Ginés offers to change the Dulcinea errand into Hail Marys and Creeds said 'for your worship's intention', which Ormsby explains as a mark of devotional sympathy, and quotes Exodus on the fleshpots of Egypt.

  Names and slang. Ginés de Pasamonte may borrow the name of a real soldier, Jerónimo de Pasamonte, who wrote his own life; the guards' nickname 'Ginesillo de Parapilla' belittles him, and Don Quijote garbles it into 'Paropillo'. Much of the convicts' talk is germanía, the underworld cant Ormsby says a reader of the original cannot do without: 'gurapas' (galleys), 'cantar en el ansia' (to confess under torture), 'canario' (one who sings), 'cuatrero' (cattle thief), 'corredor de oreja' (go-between). The chapter is also thick with proverbs Ormsby numbers in his list: 'quien canta sus males espanta', 'tantas letras tiene un no como un sí', the crumbs that freeze between hand and mouth, 'va el hombre como Dios es servido', stains that come out in the wash, three feet on a cat, pears from the elm.

  Reading Cervantes' Spanish. The archaisms continue: mesmo, asimesmo, ansimismo, ansí, agora, cevil, efeto, recebir, decender, docientos, intricadamente, yerba, entrambos, and the old preterite 'vido' for 'vio'. Contractions with 'de' are everywhere (dellos, dél, desta, deste, desa, déste). Pronouns ride on the end of opening verbs (concluyóse, acomodáronme, Dígolo, Probóseme, víame, sentenciáronme, Respondióle, túvole, avínole, diole, Quitáronle, Entristecióse), and -rl- becomes -ll- on infinitives (informalle, decille, leellas, mandallas, echalle, disparalla). The -ra subjunctive stands in for the conditional (se tomara, pudiera, hubiera untado, lo pasara mal); the future subjunctive marks open conditions (quisieren, escribieren, quisiéredes); old verb endings appear in 'teníades' and the subjunctive 'vais'. The galley slaves call the polite 'you' 'voacé', a slurred 'vuestra merced'. Watch for false friends: razones (words), desgracia (misfortune), discreto (wise), república (the state), prisiones (fetters), campaña (open country), suceso (event), idiota (ignorant), luego (at once).
