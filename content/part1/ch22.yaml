            r: "main verb: answered him"
            under:
              - {s: "Él", r: "subject: he (the first convict)"}
              - {s: "que por enamorado iba de aquella manera", r: "what he answered: that it was for being a lover that he went that way"}
        forms:
          - {w: "Él", f: "'he', with the accent that tells the pronoun from 'el' (the)."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "enamorado", f: "participle of enamorar (to make fall in love), used as an adjective: 'in love'. 'por enamorado' = for being in love."}
          - {w: "iba", f: "ir (to go), imperfect, he. iba, ibas, iba, íbamos, ibais, iban."}
      - es: "— ¿Por eso no más? —replicó don Quijote—. Pues, si por enamorados echan a galeras, días ha que pudiera yo estar bogando en ellas."
        literal: "— For that no more? —replied Don Quijote—. Well, if for enamoured they-throw to galleys, days it-has that could I be rowing in them."
