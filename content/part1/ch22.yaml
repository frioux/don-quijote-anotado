  - sentences:
      - es: "— Antes, he yo oído decir —dijo don Quijote— que quien canta sus males espanta."
        literal: "— Rather, have I heard say —said Don Quijote— that who sings his ills frightens-away."
        ormsby: "“On the contrary, I have heard say,” said Don Quixote, “that he who sings scares away his woes.”"
        ormsby_note: "Proverb 32."
        vocab:
          - {w: "antes", d: "here: on the contrary, rather (not 'before')"}
          - {w: "oír decir", d: "to hear it said, hear tell"}
          - {w: "quien canta sus males espanta", d: "proverb: he who sings frightens his troubles away"}
          - {w: "espantar", d: "to scare off, frighten away"}
        diagram:
          - s: "he yo oído decir"
            r: "main verb (speech): I have heard it said"
            under:
              - {s: "Antes", r: "contrast: on the contrary"}
              - s: "que quien canta sus males espanta"
                r: "what I have heard: that he who sings scares off his troubles"
          - s: "dijo"
            r: "main verb (narrator): said"
            under:
              - {s: "don Quijote", r: "subject"}
        forms:
          - {w: "he yo oído", f: "he → haber, present, I (he, has, ha, hemos, habéis, han) + oído, participle of oír (to hear): 'I have heard'. The subject 'yo' is wedged between the two parts, an old liberty."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "canta, espanta", f: "cant- + -a → cantar (to sing) and espant- + -a → espantar (to scare off), present, he (the 'quien'). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. The proverb rhymes canta / espanta."}
          - {w: "sus", f: "'his', plural to match 'males'."}
        note: "'Quien canta sus males espanta' is a common proverb (Ormsby numbers it in his list of proverbs): singing drives sorrows away. Don Quijote answers slang with a proverb, and the convict will twist the proverb straight back."
