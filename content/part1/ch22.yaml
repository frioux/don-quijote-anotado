            r: "main verb 1: who was a young man"
            under:
              - {s: "de hasta edad de veinte y cuatro años", r: "describes 'mozo': of about twenty-four"}
          - s: "y dijo"
            r: "main verb 2: and said"
            under:
              - {s: "que era natural de Piedrahíta", r: "what he said: that he was from Piedrahíta"}
        forms:
          - {w: "El cual", f: "'the which' = who, a relative pronoun used to start a fresh sentence about the galley slave just named."}
          - {w: "era", f: "ser (to be), imperfect, he. ser's imperfect: era, eras, era, éramos, erais, eran."}
          - {w: "veinte y cuatro", f: "twenty and four; modern Spanish writes it as one word, veinticuatro."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
      - es: "Lo mesmo preguntó don Quijote al segundo, el cual no respondió palabra, según iba de triste y malencónico; mas respondió por él el primero, y dijo:"
        literal: "The same asked Don Quijote to-the second, the which not answered word, according-as he-was-going of sad and melancholy; but answered for him the first, and said:"
        ormsby: "Don Quixote asked the same question of the second, who made no reply, so downcast and melancholy was he; but the first answered for him, and said,"
