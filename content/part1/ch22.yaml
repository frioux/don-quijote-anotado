part: 1
chapter: 22
title_es: "Capítulo XXII. De la libertad que dio don Quijote a muchos desdichados que, mal de su grado, los llevaban donde no quisieran ir"
title_en: "Of the freedom Don Quixote conferred on several unfortunates who against their will were being carried where they had no wish to go"
paragraphs:
  - sentences:
      - es: "Cuenta Cide Hamete Benengeli, autor arábigo y manchego, en esta gravísima, altisonante, mínima, dulce e imaginada historia que, después que entre el famoso don Quijote de la Mancha y Sancho Panza, su escudero, pasaron aquellas razones que en el fin del capítulo veinte y uno quedan referidas, que don Quijote alzó los ojos y vio que por el camino que llevaba venían hasta doce hombres a pie, ensartados, como cuentas, en una gran cadena de hierro por los cuellos, y todos con esposas a las manos."
        literal: "Relates Cide Hamete Benengeli, author Arabic and Manchegan, in this most-grave, high-sounding, minute, sweet and imagined history that, after that between the famous Don Quijote of La Mancha and Sancho Panza, his squire, passed those words that at the end of-the chapter twenty and one remain related, that Don Quijote raised the eyes and saw that along the road that he-was-taking were-coming up-to twelve men on foot, strung, like beads, on a great chain of iron by the necks, and all with handcuffs on the hands."
        ormsby: "Cide Hamete Benengeli, the Arab and Manchegan author, relates in this most grave, high-sounding, minute, delightful, and original history that after the discussion between the famous Don Quixote of La Mancha and his squire Sancho Panza which is set down at the end of chapter twenty-one, Don Quixote raised his eyes and saw coming along the road he was following some dozen men on foot strung together by the neck, like beads, on a great iron chain, and all with manacles on their hands."
        vocab:
          - {w: "Cide Hamete Benengeli", d: "the invented Moorish historian whose Arabic manuscript the narrator claims to be translating (introduced in chapter 9); 'Cide' = sidi, 'my lord'"}
          - {w: "arábigo", d: "Arab, Arabic"}
          - {w: "manchego", d: "of La Mancha"}
          - {w: "gravísimo", d: "most grave, most serious; the -ísimo superlative"}
          - {w: "altisonante", d: "high-sounding, grandiloquent"}
          - {w: "mínimo", d: "minute, tiny; here 'detailed down to the smallest thing', set against 'gravísima' for the joke"}
          - {w: "imaginado", d: "imagined, invented; a sly admission that the 'true history' is fiction"}
          - {w: "razones", d: "words, remarks, a conversation (not 'reasons')"}
          - {w: "quedar referido", d: "to stand related, to have been told"}
          - {w: "alzar los ojos", d: "to raise one's eyes, look up"}
          - {w: "llevar (un camino)", d: "to follow, be taking (a road)"}
          - {w: "hasta doce", d: "up to twelve, about a dozen; 'hasta' before a number = roughly"}
          - {w: "ensartar", d: "to string, thread (beads on a string)"}
          - {w: "cuentas", d: "beads (of a rosary); the same word as 'accounts'"}
          - {w: "cadena de hierro", d: "iron chain"}
          - {w: "esposas", d: "handcuffs, manacles; literally 'wives', the pun being standard"}
        diagram:
          - s: "Cuenta"
            r: "main verb: relates"
            under:
              - s: "Cide Hamete Benengeli"
                r: "subject"
                under:
                  - {s: "autor arábigo y manchego", r: "describes him: Arab and Manchegan author"}
              - {s: "en esta gravísima, altisonante, mínima, dulce e imaginada historia", r: "where: in this history, with five mock-solemn adjectives"}
              - s: "que don Quijote alzó los ojos y vio"
                r: "what he relates: that Don Quijote looked up and saw (the 'que' is repeated after the long 'después que' clause)"
                under:
                  - s: "después que entre el famoso don Quijote de la Mancha y Sancho Panza, su escudero, pasaron aquellas razones"
                    r: "when: after the talk between knight and squire"
                    under:
                      - {s: "que en el fin del capítulo veinte y uno quedan referidas", r: "describes 'razones': set down at the end of chapter 21"}
                  - s: "que por el camino que llevaba venían hasta doce hombres a pie"
                    r: "what he saw: a dozen men on foot coming along his road"
                    under:
                      - {s: "ensartados, como cuentas, en una gran cadena de hierro por los cuellos", r: "describes the men: strung by the neck like beads on a great iron chain"}
                      - {s: "y todos con esposas a las manos", r: "and all handcuffed"}
        forms:
          - {w: "Cuenta", f: "cuent- + -a → contar (to tell, relate), present, he. The stem o becomes ue when stressed: cuento, cuentas, cuenta, contamos, contáis, cuentan. The present tense makes the historian 'say' it as we read."}
          - {w: "gravísima", f: "grav- + -ísima → grave (serious) with the superlative suffix -ísimo, feminine to match 'historia': 'most grave'."}
          - {w: "mínima, dulce e imaginada", f: "three more adjectives agreeing with 'historia'; 'e' replaces 'y' (and) before a word beginning with the i- sound ('e imaginada')."}
          - {w: "pasaron", f: "pas- + -aron → pasar (to pass, take place), preterite, they (the 'razones'). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "aquellas", f: "aquel (that, over there) in the feminine plural to match 'razones'."}
          - {w: "quedan referidas", f: "qued- + -an → quedar (to remain), present, they, + referidas, participle of referir (to relate), feminine plural to match 'razones': 'stand related', a passive built on quedar. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "alzó", f: "alz- + -ó → alzar (to raise), preterite, he. Same -ar preterite: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "vio", f: "vi- + -o → ver (to see), preterite, he: 'saw'. ver's preterite: vi, viste, vio, vimos, visteis, vieron (no accent on vio)."}
          - {w: "llevaba", f: "llev- + -aba → llevar (to carry; of a road, to follow), imperfect, he: 'the road he was taking'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "venían", f: "ven- + -ían → venir (to come), imperfect, they: 'were coming'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "ensartados", f: "participle of ensartar (to string), masculine plural to match 'hombres'."}
          - {w: "gran", f: "grande (big) clipped to 'gran' before a singular noun ('gran cadena')."}
        note: "The five adjectives for the history are a parody of the pompous openings of the romances of chivalry; 'mínima' (minute) sits oddly next to 'gravísima', and 'imaginada' (invented) gives the game away. The 'chapter twenty and one' reference is the narrator playing at being a careful historian."
      - es: "Venían ansimismo con ellos dos hombres de a caballo y dos de a pie; los de a caballo, con escopetas de rueda, y los de a pie, con dardos y espadas; y que así como Sancho Panza los vido, dijo:"
        literal: "Were-coming likewise with them two men of on horse and two of on foot; those of on horse, with muskets of wheel, and those of on foot, with darts and swords; and that as soon as Sancho Panza them saw, he-said:"
        ormsby: "With them there came also two men on horseback and two on foot; those on horseback with wheel-lock muskets, those on foot with javelins and swords, and as soon as Sancho saw them he said:"
        vocab:
          - {w: "ansimismo", d: "= asimismo, likewise, also (old form)"}
          - {w: "de a caballo", d: "on horseback, mounted; 'de a pie' = on foot"}
          - {w: "escopeta de rueda", d: "wheel-lock gun, a musket fired by a spring-driven wheel striking sparks from pyrite; the modern firearm of 1600"}
          - {w: "dardo", d: "dart, javelin, a short throwing spear"}
          - {w: "así como", d: "as soon as"}
          - {w: "vido", d: "= vio, saw; an old preterite of ver"}
        diagram:
          - s: "Venían"
            r: "main verb 1: were coming"
            under:
              - {s: "ansimismo con ellos", r: "how: likewise, with them"}
              - s: "dos hombres de a caballo y dos de a pie"
                r: "subject: two men on horseback and two on foot"
                under:
                  - {s: "los de a caballo, con escopetas de rueda", r: "detail: the horsemen with wheel-lock muskets"}
                  - {s: "y los de a pie, con dardos y espadas", r: "detail: the foot guards with javelins and swords"}
          - s: "dijo:"
            r: "main verb 2 (still what Cide Hamete relates, hence 'y que'): he said"
            under:
              - {s: "así como Sancho Panza los vido", r: "when: as soon as Sancho saw them"}
        forms:
          - {w: "Venían", f: "ven- + -ían → venir (to come), imperfect, they: 'were coming'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "ansimismo", f: "old spelling of asimismo (likewise); Cervantes also writes 'asimesmo' and 'ansí' for 'así'."}
          - {w: "los de a caballo", f: "'los' with no noun = 'the ones', 'those'; 'de a caballo' describes them: the mounted ones."}
          - {w: "los vido", f: "vido → ver (to see), an old preterite, he: 'saw them', with 'los' (them, the men) in front. Modern Spanish has vi, viste, vio, vimos, visteis, vieron; 'vido' survived in rustic speech."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Ésta es cadena de galeotes, gente forzada del rey, que va a las galeras."
        literal: "— This is chain of galley-slaves, people forced of-the king, who go to the galleys."
        ormsby: "“That is a chain of galley slaves, on the way to the galleys by force of the king’s orders.”"
        vocab:
          - {w: "galeote", d: "galley slave, a convict sentenced to row in the king's galleys"}
          - {w: "gente forzada del rey", d: "people pressed by the king, convicts; 'forzado' was the legal word for a man sentenced to the oar"}
          - {w: "galera", d: "galley, the oared warship of the Mediterranean, rowed by convicts and captives"}
        diagram:
          - s: "Ésta es"
            r: "main verb: this is"
            under:
              - s: "cadena de galeotes"
                r: "what it is: a chain of galley slaves"
                under:
                  - s: "gente forzada del rey"
                    r: "restates 'galeotes': people forced by the king"
                    under:
                      - {s: "que va a las galeras", r: "describes 'gente': who are going to the galleys"}
        forms:
          - {w: "Ésta", f: "'this one', feminine pronoun pointing at the 'cadena'; the old spelling puts an accent on the pronoun to tell it from the adjective 'esta'."}
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son. No article before 'cadena': 'this is galley-chain', the type of thing, not 'a chain'."}
          - {w: "forzada", f: "forz- + -ada → forzado, participle of forzar (to force), feminine to match 'gente'."}
          - {w: "del rey", f: "de + el: 'of the king'. Here 'de' marks the doer, where modern Spanish would say 'por el rey'."}
          - {w: "va", f: "ir (to go), present, it: 'gente' is singular in Spanish, so 'goes'. voy, vas, va, vamos, vais, van."}
      - es: "— ¿Cómo gente forzada? —preguntó don Quijote—. ¿Es posible que el rey haga fuerza a ninguna gente?"
        literal: "— How people forced? —asked Don Quijote—. Is [it] possible that the king does force to any people?"
        ormsby: "“How by force?” asked Don Quixote; “is it possible that the king uses force against anyone?”"
        vocab:
          - {w: "hacer fuerza a", d: "to use force on, to coerce"}
          - {w: "ninguna gente", d: "anyone at all; after a question 'ninguno' means 'any', not 'none'"}
        diagram:
          - s: "¿Cómo gente forzada?"
            r: "question with no verb: how, 'forced people'?"
          - s: "preguntó"
            r: "main verb (narrator): asked"
            under:
              - {s: "don Quijote", r: "subject"}
          - s: "¿Es posible"
            r: "main verb 2: is it possible"
            under:
              - {s: "que el rey haga fuerza a ninguna gente?", r: "what is possible: that the king should use force on anyone"}
        forms:
          - {w: "preguntó", f: "pregunt- + -ó → preguntar (to ask), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "haga", f: "hag- + -a → hacer (to do, make), present subjunctive, he: 'should use'. Subjunctive after 'es posible que'. hacer's subjunctive is built on the irregular 'hago': haga, hagas, haga, hagamos, hagáis, hagan."}
          - {w: "ninguna", f: "ningun- + -a → ninguno (no, none), feminine to match 'gente'. In a question it means 'any at all'."}
        note: "Don Quijote hears 'forzada' in its chivalric sense, a wrong done by force to the helpless, and cannot imagine the king doing such a thing. Sancho means the legal sense: a convict is 'forzado', pressed to row."
  - sentences:
      - es: "— No digo eso —respondió Sancho—, sino que es gente que, por sus delitos, va condenada a servir al rey en las galeras de por fuerza."
        literal: "— Not I-say that —answered Sancho—, but that it-is people who, for their crimes, go condemned to serve [to] the king in the galleys of by force."
        ormsby: "“I do not say that,” answered Sancho, “but that these are people condemned for their crimes to serve by force in the king’s galleys.”"
        vocab:
          - {w: "no digo eso, sino que", d: "I don't mean that, but rather that"}
          - {w: "delito", d: "crime, offence"}
          - {w: "condenado a", d: "sentenced to"}
          - {w: "de por fuerza", d: "by force, under compulsion"}
        diagram:
          - s: "No digo eso"
            r: "main verb 1: I do not say that"
          - s: "respondió"
            r: "main verb (narrator): answered"
            under:
              - {s: "Sancho", r: "subject"}
          - s: "sino que es gente"
            r: "main verb 2: but rather that it is people"
            under:
              - s: "que, por sus delitos, va condenada a servir al rey en las galeras"
                r: "describes 'gente': who for their crimes go sentenced to serve the king in the galleys"
                under:
                  - {s: "de por fuerza", r: "how: by compulsion"}
        forms:
          - {w: "digo", f: "dig- + -o → decir (to say), present, I: 'I say'. digo, dices, dice, decimos, decís, dicen."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "sus", f: "'their', plural to match 'delitos', not the owners."}
          - {w: "va condenada", f: "va → ir (to go), present, it (voy, vas, va, vamos, vais, van) + condenada, participle of condenar (to sentence), feminine to match 'gente': 'goes sentenced'."}
          - {w: "servir al rey", f: "infinitive after 'condenada a'; 'al' = a + el."}
  - sentences:
      - es: "— En resolución —replicó don Quijote—, comoquiera que ello sea, esta gente, aunque los llevan, van de por fuerza, y no de su voluntad."
        literal: "— In resolution —replied Don Quijote—, however that it may-be, this people, although them they-take, go of by force, and not of their will."
        ormsby: "“In fact,” replied Don Quixote, “however it may be, these people are going where they are taking them by force, and not of their own will.”"
        vocab:
          - {w: "en resolución", d: "in short, to sum up"}
          - {w: "replicar", d: "to reply, retort"}
          - {w: "comoquiera que ello sea", d: "however that may be, be that as it may"}
          - {w: "de su voluntad", d: "of their own will, willingly"}
        diagram:
          - s: "replicó"
            r: "main verb (narrator): replied"
            under:
              - {s: "don Quijote", r: "subject"}
          - s: "van"
            r: "main verb (speech): they go"
            under:
              - {s: "En resolución", r: "framing: in short"}
              - {s: "comoquiera que ello sea", r: "concession: however that may be"}
              - {s: "esta gente", r: "subject: these people (singular noun, plural verb)"}
              - {s: "aunque los llevan", r: "concession: although they are being taken"}
              - {s: "de por fuerza, y no de su voluntad", r: "how: by force and not willingly"}
        forms:
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "sea", f: "ser (to be), present subjunctive, it: 'may be'. sea, seas, sea, seamos, seáis, sean. Subjunctive after 'comoquiera que' (however)."}
          - {w: "esta", f: "'this', feminine to match 'gente'; no accent because it is the adjective, not the pronoun."}
          - {w: "los llevan", f: "llev- + -an → llevar (to take, carry), present, they (the guards), with 'los' (them, the convicts) in front. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "van", f: "ir (to go), present, they: 'go'. voy, vas, va, vamos, vais, van. 'gente' is singular, but Cervantes lets the plural sense win: 'esta gente ... van'."}
  - sentences:
      - es: "— Así es —dijo Sancho."
        literal: "— Thus it-is —said Sancho."
        ormsby: "“Just so,” said Sancho."
        vocab:
          - {w: "así es", d: "that's right, just so"}
        diagram:
          - s: "Así es"
            r: "main verb (speech): so it is"
          - s: "dijo"
            r: "main verb (narrator): said"
            under:
              - {s: "Sancho", r: "subject"}
        forms:
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Pues desa manera —dijo su amo—, aquí encaja la ejecución de mi oficio: desfacer fuerzas y socorrer y acudir a los miserables."
        literal: "— Well of-that manner —said his master—, here fits the execution of my office: to-undo forces and to-succour and to-come-to-the-aid to the wretched."
        ormsby: "“Then if so,” said Don Quixote, “here is a case for the exercise of my office, to put down force and to succour and help the wretched.”"
        vocab:
          - {w: "desa", d: "= de esa, 'of that'; Cervantes fuses 'de' with ese, esa, este, esta"}
          - {w: "encajar", d: "to fit, fit in; 'aquí encaja' = here is the place for"}
          - {w: "ejecución", d: "carrying out, exercise (of a duty)"}
          - {w: "oficio", d: "office, calling, profession"}
          - {w: "desfacer", d: "= deshacer, to undo, right (a wrong); 'desfacer fuerzas' and 'desfacer agravios' are the knight-errant's archaic formula, with the old f- kept on purpose"}
          - {w: "socorrer", d: "to succour, help in distress"}
          - {w: "acudir a", d: "to come to the aid of, hasten to"}
          - {w: "miserable", d: "wretched, miserable (a person in misery, not a mean one)"}
        diagram:
          - s: "dijo"
            r: "main verb (narrator): said"
            under:
              - {s: "su amo", r: "subject: his master"}
          - s: "aquí encaja la ejecución de mi oficio"
            r: "main verb (speech): here the exercise of my office fits"
            under:
              - {s: "Pues desa manera", r: "link: well then, in that case"}
              - {s: "desfacer fuerzas y socorrer y acudir a los miserables", r: "explains 'mi oficio': to undo force, succour and aid the wretched"}
        forms:
          - {w: "desa", f: "de + esa (of that). Cervantes fuses 'de' with the demonstratives; modern Spanish keeps only 'del'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "encaja", f: "encaj- + -a → encajar (to fit), present, it (the 'ejecución'). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "desfacer", f: "the archaic form of deshacer (to undo), keeping the medieval f- that became h-; Don Quijote uses it for its knightly ring. Infinitive, in apposition to 'oficio'."}
          - {w: "socorrer, acudir", f: "two more infinitives (to succour, to come to the aid), coordinated with 'desfacer'."}
  - sentences:
      - es: "— Advierta vuestra merced —dijo Sancho— que la justicia, que es el mesmo rey, no hace fuerza ni agravio a semejante gente, sino que los castiga en pena de sus delitos."
        literal: "— Let-notice your worship —said Sancho— that the justice, which is the same king, not does force nor wrong to such people, but that them it-punishes in penalty of their crimes."
        ormsby: "“Recollect, your worship,” said Sancho, “Justice, which is the king himself, is not using force or doing wrong to such persons, but punishing them for their crimes.”"
        vocab:
          - {w: "advertir", d: "to notice, bear in mind; 'advierta vuestra merced' = please note"}
          - {w: "vuestra merced", d: "your worship, the polite 'you' of the period (it shrank into 'usted')"}
          - {w: "la justicia", d: "the law, the courts (justice as an institution)"}
          - {w: "mesmo", d: "= mismo; 'el mesmo rey' = the king himself"}
          - {w: "agravio", d: "wrong, injury, offence"}
          - {w: "semejante gente", d: "such people, people of that kind"}
          - {w: "en pena de", d: "as a punishment for"}
        diagram:
          - s: "Advierta"
            r: "main verb (speech): let your worship notice"
            under:
              - {s: "vuestra merced", r: "subject: your worship (he, in grammar)"}
              - s: "que la justicia, que es el mesmo rey, no hace fuerza ni agravio a semejante gente"
                r: "what to notice: that the law, which is the king himself, does no force or wrong to such people"
                under:
                  - {s: "sino que los castiga en pena de sus delitos", r: "contrast: but punishes them for their crimes"}
          - s: "dijo"
            r: "main verb (narrator): said"
            under:
              - {s: "Sancho", r: "subject"}
        forms:
          - {w: "Advierta", f: "adviert- + -a → advertir (to notice), present subjunctive used as a polite command, you (vuestra merced takes he-forms): 'take note'. The stem e becomes ie when stressed: advierta, adviertas, advierta, advirtamos, advirtáis, adviertan."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "mesmo", f: "old spelling of mismo (same, -self), masculine to match 'rey'."}
          - {w: "hace", f: "hac- + -e → hacer (to do), present, it (la justicia). hago, haces, hace, hacemos, hacéis, hacen. 'no ... ni' = neither ... nor."}
          - {w: "los castiga", f: "castig- + -a → castigar (to punish), present, it, with 'los' (them) in front. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
        note: "Sancho states the orthodox doctrine of the age: the king is the fountain of justice, so a legal sentence cannot be an 'agravio'. Don Quijote will ignore this and treat the convicts as the oppressed his order was founded to free."
  - sentences:
      - es: "Llegó, en esto, la cadena de los galeotes, y don Quijote, con muy corteses razones, pidió a los que iban en su guarda fuesen servidos de informalle y decille la causa, o causas, por que llevan aquella gente de aquella manera."
        literal: "Arrived, in this, the chain of the galley-slaves, and Don Quijote, with very courteous words, asked [to] those who were-going in its guard [that] they-be pleased to inform-him and tell-him the cause, or causes, for which they-take that people in that manner."
        ormsby: "The chain of galley slaves had by this time come up, and Don Quixote in very courteous language asked those who were in custody of it to be good enough to tell him the reason or reasons for which they were conducting these people in this manner."
        vocab:
          - {w: "en esto", d: "at this point, meanwhile"}
          - {w: "cortés", d: "courteous, polite"}
          - {w: "ir en guarda de", d: "to go as escort of, to guard"}
          - {w: "ser servido de", d: "to be pleased to, be so good as to (a courtly formula)"}
          - {w: "informalle", d: "= informarle, to inform him; -rl- becomes -ll- when a pronoun is hung on an infinitive"}
          - {w: "decille", d: "= decirle, to tell him"}
          - {w: "por que", d: "for which (two words: por + que); modern 'por la que'"}
        diagram:
          - s: "Llegó"
            r: "main verb 1: arrived"
            under:
              - {s: "en esto", r: "when: at this point"}
              - {s: "la cadena de los galeotes", r: "subject: the chain of galley slaves"}
          - s: "pidió"
            r: "main verb 2 (after 'y'): asked"
            under:
              - {s: "don Quijote", r: "subject"}
              - {s: "con muy corteses razones", r: "how: in very courteous words"}
              - s: "a los que iban en su guarda"
                r: "whom: those escorting it"
              - s: "fuesen servidos de informalle y decille la causa, o causas"
                r: "what he asked (with 'que' left out): that they be pleased to tell him the cause or causes"
                under:
                  - {s: "por que llevan aquella gente de aquella manera", r: "describes 'causa': for which they take those people that way"}
        forms:
          - {w: "Llegó", f: "lleg- + -ó → llegar (to arrive), preterite, it (the chain). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "corteses", f: "cortés (courteous) in the plural, to match 'razones'; placed before the noun for emphasis."}
          - {w: "pidió", f: "pid- + -ió → pedir (to ask for), preterite, he. The stem e becomes i in the he/they forms: pedí, pediste, pidió, pedimos, pedisteis, pidieron."}
          - {w: "iban", f: "ir (to go), imperfect, they. ir's imperfect is irregular: iba, ibas, iba, íbamos, ibais, iban."}
          - {w: "fuesen servidos", f: "fu- + -esen → ser (to be), imperfect subjunctive (-se form), they, + servidos (pleased), masculine plural: 'that they be so good as to'. Subjunctive because it is what he asked ('pidió [que]'); the 'que' is dropped, as Cervantes often does after verbs of asking. ser's -se imperfect subjunctive: fuese, fueses, fuese, fuésemos, fueseis, fuesen."}
          - {w: "informalle y decille", f: "informar (to inform) + le and decir (to tell) + le, with the final -r of the infinitive turned into -l before the pronoun: informalle = informarle, decille = decirle. A common sixteenth-century form."}
          - {w: "llevan", f: "llev- + -an → llevar (to take), present, they; the present slips in where the past is expected, a common looseness in Cervantes. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "aquella gente, aquella manera", f: "aquel (that) in the feminine to match 'gente' and 'manera'."}
      - es: "Una de las guardas de a caballo respondió que eran galeotes, gente de Su Majestad que iba a galeras, y que no había más que decir, ni él tenía más que saber."
        literal: "One of the guards of on horse answered that they-were galley-slaves, people of His Majesty who were-going to galleys, and that not there-was more that to-say, nor he had more that to-know."
        ormsby: "One of the guards on horseback answered that they were galley slaves belonging to his majesty, that they were going to the galleys, and that was all that was to be said and all he had any business to know."
        vocab:
          - {w: "guarda", d: "guard (the person); feminine in Cervantes even for a man, 'una de las guardas'"}
          - {w: "Su Majestad", d: "His Majesty, the king"}
          - {w: "no hay más que decir", d: "there is nothing more to say"}
          - {w: "tener más que saber", d: "to have any more business knowing"}
        diagram:
