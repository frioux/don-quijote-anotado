              - {s: "maese Nicolás", r: "subject: Master Nicolás (the barber)"}
              - {s: "que esperasen un poco", r: "what he called: that they should wait a little"}
              - s: "que querían detenerse a beber en una fontecilla"
                r: "why: for they (the others) wanted to stop and drink at a little spring"
                under:
                  - {s: "que allí estaba", r: "describes 'fontecilla': that was there"}
        forms:
          - {w: "dio", f: "dar (to give), preterite, he. dar takes -er/-ir endings in the preterite: di, diste, dio, dimos, disteis, dieron."}
          - {w: "esperasen", f: "esper- + -asen → esperar (to wait), imperfect subjunctive (-se form), they: reported order. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "querían", f: "quer- + -ían → querer (to want), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "detenerse", f: "detener (to stop) + se, infinitive after 'querían'."}
          - {w: "fontecilla", f: "font- + -ecilla: a diminutive of fuente (spring), built on the Latin stem 'font-'."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, it. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
      - es: "Detúvose don Quijote, con no poco gusto de Sancho, que ya estaba cansado de mentir tanto y temía no le cogiese su amo a palabras; porque, puesto que él sabía que Dulcinea era una labradora del Toboso, no la había visto en toda su vida."
        literal: "Stopped-himself Don Quijote, with not little pleasure of Sancho, who already was tired of lying so-much and feared [lest] him might-catch his master at words; because, although he knew that Dulcinea was a peasant-girl of-the Toboso, not her he-had seen in all his life."
        ormsby: "Don Quixote drew up, not a little to the satisfaction of Sancho, for he was by this time weary of telling so many lies, and in dread of his master catching him tripping, for though he knew that Dulcinea was a peasant girl of El Toboso, he had never seen her in all his life."
        vocab:
          - {w: "con no poco gusto de", d: "much to the pleasure of"}
          - {w: "mentir", d: "to lie"}
          - {w: "temer (que) no", d: "to fear that: the 'no' is not negative, it just follows a verb of fearing (Latin style)"}
          - {w: "coger a palabras", d: "to catch out in his words, trip up"}
          - {w: "puesto que", d: "although (in Cervantes; now 'since')"}
          - {w: "labradora", d: "peasant woman, farm girl"}
        diagram:
          - s: "Detúvose don Quijote"
            r: "main verb: Don Quijote stopped"
            under:
              - s: "con no poco gusto de Sancho"
                r: "how: much to Sancho's pleasure"
                under:
                  - {s: "que ya estaba cansado de mentir tanto", r: "describes Sancho, 1: who was tired of lying so much"}
                  - {s: "y temía no le cogiese su amo a palabras", r: "describes Sancho, 2: and feared his master would catch him out"}
                  - s: "porque, puesto que él sabía que Dulcinea era una labradora del Toboso, no la había visto en toda su vida"
                    r: "why he feared: because, though he knew Dulcinea was a peasant girl from El Toboso, he had never seen her in his life"
        forms:
          - {w: "Detúvose", f: "detuv- + -o + se → detenerse (to stop), preterite, he, with 'se' stuck on the end; modern 'se detuvo'. Cervantes hangs pronouns on a clause-opening verb. Irregular like tener: detuve, detuviste, detuvo, detuvimos, detuvisteis, detuvieron."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "cansado", f: "participle of cansar (to tire), masculine to match Sancho: 'tired'."}
          - {w: "temía, sabía", f: "tem- + -ía → temer (to fear), sab- + -ía → saber (to know), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "cogiese", f: "cog- + -iese → coger (to catch), imperfect subjunctive (-se form), he, after a verb of fearing; 'que' is left out. The -se form of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen."}
          - {w: "había visto", f: "había (haber, imperfect, he: había, habías, había, habíamos, habíais, habían) + visto, the irregular participle of ver (to see): 'had seen'."}
        note: "The narrator confirms what the reader guessed: Sancho's whole account was invented. He knew who 'Dulcinea' really was (Aldonza Lorenzo, ch. 25) but had never laid eyes on her."
