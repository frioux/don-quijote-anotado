                      - {s: "por sólo ser ella quien es", r: "why they serve: only because she is who she is"}
                      - s: "sin esperar otro premio de sus muchos y buenos deseos"
                        r: "how, 2: expecting no other reward for their many good desires"
                        under:
                          - {s: "sino que ella se contente de acetarlos por sus caballeros", r: "except: than that she be content to accept them as her knights"}
        forms:
          - {w: "has de saber", f: "has (haber, present, you: he, has, ha, hemos, habéis, han) + de + saber (to know): 'you must know'."}
          - {w: "este nuestro", f: "'this ... of ours': demonstrative and possessive stacked before the noun, an old construction."}
          - {w: "gran", f: "grande (great) clipped before a singular noun ('honra')."}
          - {w: "tener", f: "infinitive (to have), the subject of 'es'; 'una dama' is its own subject: 'for a lady to have'."}
          - {w: "sirvan", f: "sirv- + -an → servir (to serve), present subjunctive, they: knights of an ideal kind, not specific ones. The e of the stem becomes i: sirva, sirvas, sirva, sirvamos, sirváis, sirvan."}
          - {w: "se estiendan", f: "estiend- + -an → estenderse (= extenderse, to reach), present subjunctive, they, after 'sin que'. The stem e becomes ie when stressed: estienda, estiendas, estienda, estendamos, estendáis, estiendan."}
          - {w: "servilla", f: "= servirla: servir (to serve) + la (her), with -rl- turned into -ll-, an old sound change."}
          - {w: "muchos y buenos", f: "masculine plural to match 'deseos'."}
          - {w: "se contente", f: "content- + -e → contentarse (to be content), present subjunctive, she, after 'sino que' expressing a wish. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "acetarlos", f: "acetar (= aceptar, to accept) + los (them), the pronoun hung on the infinitive."}
        note: "This is the doctrine of courtly love: the knight serves his lady for her own sake and expects nothing but to be accepted as her servant. Sancho at once compares it with the theology of pure love of God."
  - sentences:
      - es: "— Con esa manera de amor —dijo Sancho— he oído yo predicar que se ha de amar a Nuestro Señor, por sí solo, sin que nos mueva esperanza de gloria o temor de pena."
        literal: "— With that manner of love —said Sancho— have heard I preach that one has to love [to] Our Lord, for himself alone, without that us may-move hope of glory or fear of punishment."
        ormsby: "“It is with that kind of love,” said Sancho, “I have heard preachers say we ought to love our Lord, for himself alone, without being moved by the hope of glory or the fear of punishment;"
        vocab:
          - {w: "predicar", d: "to preach"}
          - {w: "Nuestro Señor", d: "Our Lord, God"}
          - {w: "por sí solo", d: "for himself alone"}
          - {w: "gloria", d: "here 'heaven, eternal glory'"}
          - {w: "pena", d: "punishment, pain (here the pains of hell)"}
        diagram:
          - s: "he oído yo predicar"
            r: "main verb: I have heard it preached"
            under:
              - s: "que se ha de amar a Nuestro Señor"
                r: "what was preached: that one must love Our Lord"
                under:
                  - {s: "Con esa manera de amor", r: "how: with that kind of love"}
                  - {s: "por sí solo", r: "why: for himself alone"}
                  - {s: "sin que nos mueva esperanza de gloria o temor de pena", r: "how: without being moved by hope of heaven or fear of hell"}
          - {s: "dijo Sancho", r: "speech tag"}
        forms:
          - {w: "he oído", f: "he (haber, present, I: he, has, ha, hemos, habéis, han) + oído, the participle of oír (to hear): 'I have heard'."}
          - {w: "predicar", f: "infinitive (to preach) after 'he oído': 'heard (someone) preach'."}
          - {w: "se ha de amar", f: "ha (haber, present, it) + de + amar (to love), with impersonal 'se': 'one must love'."}
          - {w: "sí", f: "'himself' after a preposition ('por sí'); the accent tells it from 'si' (if)."}
          - {w: "mueva", f: "muev- + -a → mover (to move), present subjunctive, it, after 'sin que'. The stem o becomes ue when stressed: mueva, muevas, mueva, movamos, mováis, muevan."}
        note: "Sancho repeats a commonplace of Spanish preaching and mysticism, summed up in the famous sonnet 'No me mueve, mi Dios, para quererte / el cielo que me tienes prometido': love God for himself, not for heaven or fear of hell."
