          - {w: "estilo", d: "here 'custom, practice, way'"}
          - {w: "estenderse", d: "= extenderse, to extend, reach"}
          - {w: "servilla", d: "= servirla, 'to serve her'; -rl- turned into -ll-"}
          - {w: "premio", d: "reward, prize"}
          - {w: "contentarse de", d: "to be content with, be willing to"}
          - {w: "acetar", d: "= aceptar, to accept (old spelling)"}
