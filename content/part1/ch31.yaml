summary: |
  Riding along with the priest, the barber, Cardenio and Dorotea, Don Quijote questions Sancho about his embassy to Dulcinea, and Sancho, who never delivered the letter, invents every answer. His Dulcinea is not stringing pearls but winnowing wheat in a farmyard; she tells him to put the letter on a sack, smells a little of honest sweat, is a hand taller than he is, cannot read, tears the letter up, and sends word that Don Quijote should leave his penance and come to El Toboso at once. For a reward she handed him bread and sheep's-milk cheese over the yard wall. Don Quijote turns each detail into a courtly one, and explains Sancho's speedy return by a friendly enchanter who must have carried him through the air.

  Don Quijote now hesitates between his lady's command and the boon he promised Princess Micomicona. He decides to kill the giant first and then return to Dulcinea. Sancho begs him to marry the princess and take her kingdom, but Don Quijote says he will stipulate a share of the kingdom for Sancho without marrying. He tells Sancho to keep his love secret, and when Sancho points out that the knights he defeats are sent to kneel before Dulcinea, he explains the pure, disinterested service of courtly love. Sancho compares it with loving God for his own sake, though he would rather serve God for what God can give.

  The party stops at a spring to eat. Sancho is relieved, since he is tired of lying and has in fact never seen Dulcinea. A boy passing by throws himself at Don Quijote's legs: it is Andrés, the servant Don Quijote 'rescued' from a flogging in chapter 4. Don Quijote proudly tells the story as proof of the value of knights-errant, but Andrés reveals that as soon as Don Quijote left, his master tied him up again and flogged him so badly that he has been in hospital ever since, all because Don Quijote's interference enraged him.

  Don Quijote wants to ride off at once to punish the farmer, but Dorotea reminds him of his promise to her. Andrés asks only for food for the road to Seville; Sancho gives him bread and cheese. Leaving, Andrés begs Don Quijote never to help him again, and curses him and all knights-errant ever born. He runs off before Don Quijote can punish him, leaving the knight deeply ashamed while the others try hard not to laugh.
context: |
  Peasant life against courtly fantasy. The whole first half of the chapter sets two pictures of Dulcinea side by side. Don Quijote imagines a lady embroidering in gold thread, smelling of Arabian spices and a glover's perfumes, sending her messenger a jewel. Sancho describes the real work of a farm girl in La Mancha: winnowing and sifting wheat, loading sacks onto a donkey, sweating, unable to read, and paying a messenger with bread and sheep's-milk cheese over the wall of the yard. The kinds of wheat, candeal (fine white), trechel (spring wheat) and rubión (a reddish wheat), were real grades of grain, and Sancho names the coarser one. Gloves were sold perfumed in Spain, which is why a glover's shop is Don Quijote's idea of a sweet smell.

  The romances of chivalry. Don Quijote cites the customs of the romances: a lady receiving a letter on her head as a sign of respect, a jewel given as 'albricias' to the bearer of good news, messengers who are squires, damsels or dwarfs, and above all the friendly enchanter who protects each knight and carries him through the air on a cloud or a chariot of fire. In Amadís de Gaula and its sequels such rescues across thousands of leagues are routine, and Don Quijote uses them to explain away Sancho's suspiciously quick trip. The 'boon' (don) he has granted Dorotea is another rule of the romances: a knight who has promised a lady a favor may take on no other adventure until it is done, which is exactly the excuse Dorotea uses to keep him from chasing Andrés's master.

  The narrator's games. Ormsby notes that the chapter division here is clumsy: the conversation began at the end of the previous chapter. The chapter is a duel between two liars of different kinds: Sancho lies to save himself and builds his Dulcinea out of what he knows of village life, while Don Quijote reinterprets every detail so that the illusion survives. The narrator lets the reader in on it only near the end, when he says that Sancho had never seen Dulcinea in his life. The Andrés episode then closes a story left open since chapter 4, where Don Quijote rode away believing he had righted a wrong; here the reader learns the true outcome, one of the book's clearest judgments on the knight's good intentions.

  Religion, law and money. Sancho's remark about loving God 'for himself alone, without hope of glory or fear of punishment' repeats a theme of Spanish preaching and mystical writing, best known from the sonnet 'No me mueve, mi Dios, para quererte'; Sancho, characteristically, would rather serve God for what God can do for him. Andrés says he has been in a 'hospital', which then meant a charitable house for the sick poor run by the Church or a confraternity. The money is real: a 'real' was a silver coin of 34 maravedís, and the maravedí was the smallest unit, so 'to the last maravedí' means to the last penny. Sancho's plan to ship his future black subjects off and sell them recalls the African slave trade that passed through Seville and Lisbon in Cervantes' day.

  Proverbs and names. Ormsby's notes flag the proverbs Sancho and his master use: 'one devil is like another', 'sleeves are good after Easter' (a good thing is welcome even when late), 'a sparrow in the hand is better than a vulture on the wing', and a long one that Sancho garbles, which should run 'who has good and chooses ill, let him not complain of the ill that comes to him'. Ormsby also explains the quicksilver gypsy dealers put in a donkey's ears to make it lively for sale. St Bartholomew, flayed alive, was a common sight in church paintings, so a beaten boy is 'a flayed St Bartholomew'. Andrés ends with a pun on 'andante': he wishes the knights-errant to be as 'bien andantes' (fortunate) to themselves as they have been to him.

  Reading Cervantes' Spanish. The chapter is mostly fast dialogue, rich in old forms: agora (ahora), mesmo (mismo), apriesa (aprisa), estremo (extremo), efeto (efecto), acetar (aceptar), Ingalaterra (Inglaterra), finojos (hinojos), luengo, vee (ve), the old preterite 'veniste'. Pronouns hang on clause-opening verbs (besóla, Púsosela, díjome, Medíme, Haste medido, véome, fuérzame, hágote, avísote, encendiósele, Íbase). The -rl- of an infinitive plus pronoun often becomes -ll- (dalle, enviallo, servilla, guardalla, castigalle, seguille, acaballe). Contractions with 'de' are frequent (della, dellos, déstos, desos). The future subjunctive appears after 'si' and relatives (quisiere, contentare, fueren, encontrare, alcanzare), and the -ra form doubles as a conditional (me riera, se contentara). Polite address is varied: Sancho and Andrés use 'vuestra merced' to Don Quijote, Don Quijote uses 'vos' to Dorotea, Dulcinea uses 'vos' to Sancho ('Poned'), and Sancho clips the vos command to a rustic 'Tomá'. Watch the false friends: discreto (wise), industria (skill), curioso (fine), luego (at once), puesto que (although), antes (rather), cerca de (about), curarse de (to bother about), desgracia (misfortune).
