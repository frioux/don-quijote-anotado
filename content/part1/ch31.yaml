      - es: "Que acaece estar uno peleando en las sierras de Armenia con algún endriago, o con algún fiero vestiglo, o con otro caballero, donde lleva lo peor de la batalla y está ya a punto de muerte, y cuando no os me cato, asoma por acullá, encima de una nube, o sobre un carro de fuego, otro caballero amigo suyo, que poco antes se hallaba en Ingalaterra, que le favorece y libra de la muerte, y a la noche se halla en su posada, cenando muy a su sabor;"
        literal: "For it-happens to-be one fighting in the mountains of Armenia with some dragon, or with some fierce monster, or with another knight, where he-takes the worst of the battle and is already at point of death, and when not you I-look-for, appears over yonder, on-top of a cloud, or on a chariot of fire, another knight friend of-his, who little before himself found in England, who him favors and frees from the death, and at the night himself finds in his lodging, dining very to his taste;"
