      - es: "Porque has de saber que en este nuestro estilo de caballería es gran honra tener una dama muchos caballeros andantes que la sirvan, sin que se estiendan más sus pensamientos que a servilla, por sólo ser ella quien es, sin esperar otro premio de sus muchos y buenos deseos, sino que ella se contente de acetarlos por sus caballeros."
        literal: "Because you-have to know that in this our style of chivalry it-is great honor to-have a lady many knights errant who her may-serve, without that themselves extend more their thoughts than to serve-her, for only being she who she-is, without expecting other reward of their many and good desires, but that she herself content of accepting-them for her knights."
        ormsby: "For thou must know that according to our way of thinking in chivalry, it is a high honour to a lady to have many knights-errant in her service, whose thoughts never go beyond serving her for her own sake, and who look for no other reward for their great and true devotion than that she should be willing to accept them as her knights.”"
        vocab:
