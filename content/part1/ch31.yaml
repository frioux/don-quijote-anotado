  - sentences:
      - es: "— Ella no me preguntó nada —dijo Sancho—, mas yo le dije de la manera que vuestra merced, por su servicio, quedaba haciendo penitencia, desnudo de la cintura arriba, metido entre estas sierras como si fuera salvaje, durmiendo en el suelo, sin comer pan a manteles ni sin peinarse la barba, llorando y maldiciendo su fortuna."
        literal: "— She not me asked nothing —said Sancho—, but I to-her told of the manner that your grace, for her service, was-remaining doing penance, naked from the waist up, put-in among these mountains as if he-were savage, sleeping on the ground, without eating bread at tablecloths nor without combing-himself the beard, weeping and cursing his fortune."
        ormsby: "“She asked me nothing,” said Sancho; “but I told her how your worship was left doing penance in her service, naked from the waist up, in among these mountains like a savage, sleeping on the ground, not eating bread off a tablecloth nor combing your beard, weeping and cursing your fortune.”"
        vocab:
          - {w: "mas", d: "but (literary; no accent)"}
          - {w: "de la manera que", d: "how, the way in which"}
          - {w: "vuestra merced", d: "your grace, your worship: the polite 'you', ancestor of 'usted'; takes a he/she verb"}
          - {w: "quedar haciendo", d: "to be left doing, stay on doing"}
          - {w: "cintura", d: "waist; 'de la cintura arriba' = from the waist up"}
          - {w: "metido entre", d: "shut away among, deep in"}
          - {w: "sierra", d: "mountain range (here the Sierra Morena)"}
          - {w: "salvaje", d: "savage, wild man"}
          - {w: "comer pan a manteles", d: "to eat bread on a tablecloth, i.e. eat a proper meal at table; a vow of chivalric penance"}
          - {w: "maldecir", d: "to curse"}
        diagram:
          - {s: "Ella no me preguntó nada", r: "main verb 1: she asked me nothing"}
          - {s: "dijo Sancho", r: "speech tag"}
          - s: "mas yo le dije"
            r: "main verb 2: but I told her"
            under:
              - s: "de la manera que vuestra merced, por su servicio, quedaba haciendo penitencia"
                r: "what I told: how your worship stayed doing penance for her sake"
                under:
                  - {s: "desnudo de la cintura arriba", r: "how, 1: naked from the waist up"}
                  - s: "metido entre estas sierras"
                    r: "how, 2: shut away in these mountains"
                    under:
                      - {s: "como si fuera salvaje", r: "like what: as if he were a wild man"}
                  - {s: "durmiendo en el suelo", r: "how, 3: sleeping on the ground"}
                  - {s: "sin comer pan a manteles ni sin peinarse la barba", r: "how, 4: not eating at table nor combing his beard"}
                  - {s: "llorando y maldiciendo su fortuna", r: "how, 5: weeping and cursing his fortune"}
        forms:
          - {w: "preguntó", f: "pregunt- + -ó → preguntar (to ask), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "no ... nada", f: "Spanish doubles the negative: 'no me preguntó nada' = she asked me nothing."}
          - {w: "dije", f: "dij- + -e → decir (to say, tell), preterite, I. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "quedaba", f: "qued- + -aba → quedar (to remain), imperfect, he (vuestra merced): with the gerund, 'was staying on doing'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "haciendo, durmiendo, llorando, maldiciendo", f: "gerunds of hacer (to do), dormir (to sleep; o becomes u in the gerund), llorar (to weep) and maldecir (to curse; e becomes i)."}
          - {w: "metido", f: "met- + -ido → participle of meter (to put in), masculine to match 'vuestra merced' (a man)."}
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), he: 'como si fuera' = as if he were. Built on the preterite fueron: fuera, fueras, fuera, fuéramos, fuerais, fueran. 'como si' always takes the imperfect subjunctive."}
          - {w: "ni sin peinarse", f: "peinar (to comb) + se (himself), infinitive after 'sin'. 'ni sin' doubles the negative, a loose colloquial pile-up typical of Sancho."}
        note: "Sancho repeats the penance Don Quijote had told him to report: going half-naked, sleeping on the ground and not eating at table, modelled on Amadís's penance on the Peña Pobre in the romances."
  - sentences:
      - es: "— En decir que maldecía mi fortuna dijiste mal —dijo don Quijote—, porque antes la bendigo y bendeciré todos los días de mi vida, por haberme hecho digno de merecer amar tan alta señora como Dulcinea del Toboso."
        literal: "— In saying that I-was-cursing my fortune you-said badly —said Don Quijote—, because rather it I-bless and I-will-bless all the days of my life, for having-me made worthy of deserving to-love so high lady as Dulcinea of-the Toboso."
        ormsby: "“In saying I cursed my fortune thou saidst wrong,” said Don Quixote; “for rather do I bless it and shall bless it all the days of my life for having made me worthy of aspiring to love so lofty a lady as Dulcinea del Toboso.”"
        vocab:
          - {w: "antes", d: "rather, on the contrary (not 'before')"}
          - {w: "bendecir", d: "to bless"}
          - {w: "merecer", d: "to deserve, be worthy"}
          - {w: "alto", d: "high, lofty; of a lady, of high rank and worth"}
          - {w: "Dulcinea del Toboso", d: "Don Quijote's imaginary lady, his idealized name for Aldonza Lorenzo, a peasant girl of the village of El Toboso"}
        diagram:
          - s: "dijiste mal"
            r: "main verb: you said wrong"
            under:
              - {s: "En decir que maldecía mi fortuna", r: "in what: in saying that I cursed my fortune"}
          - {s: "dijo don Quijote", r: "speech tag"}
          - s: "porque antes la bendigo y bendeciré todos los días de mi vida"
            r: "why: because I rather bless it and will bless it every day of my life"
            under:
              - s: "por haberme hecho digno de merecer amar tan alta señora"
                r: "why I bless it: for having made me worthy to deserve to love so high a lady"
                under:
                  - {s: "como Dulcinea del Toboso", r: "who: as Dulcinea del Toboso"}
        forms:
          - {w: "decir", f: "infinitive (saying) after 'en': 'en decir' = in saying."}
          - {w: "maldecía", f: "maldec- + -ía → maldecir (to curse), imperfect, I. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "dijiste", f: "dij- + -iste → decir (to say), preterite, you (tú). Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "bendigo", f: "bendig- + -o → bendecir (to bless), present, I. It goes like decir: bendigo, bendices, bendice, bendecimos, bendecís, bendicen."}
          - {w: "bendeciré", f: "bendecir + -é → future, I. The future adds to the whole infinitive: -é, -ás, -á, -emos, -éis, -án. (Unlike decir, which shortens to diré, bendecir keeps the full form.)"}
          - {w: "haberme hecho", f: "haber (to have) + me (me) + hecho, the irregular participle of hacer (to make): 'having made me', the perfect infinitive after 'por'."}
