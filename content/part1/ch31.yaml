          - {w: "buenas son mangas después de Pascua", d: "proverb: 'sleeves are good after Easter', a good thing is welcome even if it comes late"}
          - {w: "mangas", d: "sleeves; detachable sleeves were a common gift, and 'mangas' also meant a tip or present"}
          - {w: "satisfacerse", d: "to be made good, be settled, paid in full"}
          - {w: "estar maravillado de", d: "to be amazed at"}
