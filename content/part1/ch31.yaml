          - {w: "quisiere", f: "quis- + -iere → querer (to want), future subjunctive, I: 'whomever I may wish'. The future subjunctive of -er and -ir verbs: -iere, -ieres, -iere, -iéremos, -iereis, -ieren. Modern Spanish would say 'quiera'."}
