      - es: "— Es liberal en estremo —dijo don Quijote—, y si no te dio joya de oro, sin duda debió de ser porque no la tendría allí a la mano para dártela; pero buenas son mangas después de Pascua: yo la veré, y se satisfará todo. ¿Sabes de qué estoy maravillado, Sancho?"
        literal: "— She-is generous in extreme —said Don Quijote—, and if not to-you she-gave jewel of gold, without doubt it-must of be because not it she-would-have there at the hand to give-you-it; but good are sleeves after Easter: I her will-see, and itself will-be-satisfied all. Do-you-know of what I-am amazed, Sancho?"
        ormsby: "“She is generous in the extreme,” said Don Quixote, “and if she did not give thee a jewel of gold, no doubt it must have been because she had not one to hand there to give thee; but sleeves are good after Easter; I shall see her and all shall be made right. But knowest thou what amazes me, Sancho?"
        ormsby_note: "Proverb 135, i.e. a good thing may be acceptable even out of its proper season, as after Easter the weather may be still cold enough to make sleeves comfortable. Cf. the Scotch proverb, \"A Yule feast may be done at Pasch.\""
