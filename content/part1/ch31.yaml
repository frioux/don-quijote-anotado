  - sentences:
      - es: "— Todo puede ser —respondió Sancho—, que muchas veces sale de mí aquel olor que entonces me pareció que salía de su merced de la señora Dulcinea; pero no hay de qué maravillarse, que un diablo parece a otro."
        literal: "— All can be —answered Sancho—, for many times comes-out from me that smell that then to-me it-seemed that came-out from her grace of the lady Dulcinea; but not there-is of what to-marvel, for one devil resembles [to] another."
        ormsby: "“Maybe so,” replied Sancho; “there often comes from myself that same odour which then seemed to me to come from her grace the lady Dulcinea; but that’s no wonder, for one devil is like another.”"
        ormsby_note: "Proverb 176."
        vocab:
          - {w: "todo puede ser", d: "anything is possible, maybe so"}
          - {w: "su merced", d: "her grace, her worship: polite form for a third person"}
          - {w: "no hay de qué maravillarse", d: "there is nothing to wonder at"}
          - {w: "parecer a", d: "to resemble, look like; modern 'parecerse a'"}
          - {w: "un diablo parece a otro", d: "proverb: one devil looks like another, i.e. there is not much to choose between them"}
        diagram:
          - s: "Todo puede ser"
            r: "main verb 1: anything may be"
            under:
              - s: "que muchas veces sale de mí aquel olor"
                r: "why: for that smell often comes off me"
                under:
                  - {s: "que entonces me pareció que salía de su merced de la señora Dulcinea", r: "describes 'olor': which then seemed to me to come from the lady Dulcinea"}
          - {s: "respondió Sancho", r: "speech tag"}
          - s: "pero no hay de qué maravillarse"
            r: "main verb 2: but there's nothing to wonder at"
            under:
              - {s: "que un diablo parece a otro", r: "why: for one devil looks like another (proverb)"}
        forms:
          - {w: "puede", f: "pued- + -e → poder (can), present, it. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "sale", f: "sal- + -e → salir (to come out), present, it. salgo, sales, sale, salimos, salís, salen."}
          - {w: "pareció", f: "parec- + -ió → parecer (to seem), preterite, it. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "salía", f: "sal- + -ía → salir (to come out), imperfect, it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "hay", f: "haber used alone, present: 'there is'."}
          - {w: "maravillarse", f: "maravillar (to amaze) + se: 'to marvel', infinitive after 'de qué'."}
          - {w: "parece", f: "parec- + -e → parecer (to resemble), present, he (the devil). Present of -er verbs: -o, -es, -e, -emos, -éis, -en (here parezco, pareces, parece...)."}
        note: "Without meaning to, Sancho calls himself and Dulcinea a pair of devils. The joke is on the 'sweet smell' of the idealized lady: Sancho has never been near the real one."
