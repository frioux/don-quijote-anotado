      - es: "Pero lo que pienso hacer será caminar apriesa y llegar presto donde está este gigante, y, en llegando, le cortaré la cabeza, y pondré a la princesa pacíficamente en su estado, y al punto daré la vuelta a ver a la luz que mis sentidos alumbra, a la cual daré tales disculpas que ella venga a tener por buena mi tardanza, pues verá que todo redunda en aumento de su gloria y fama, pues cuanta yo he alcanzado, alcanzo y alcanzare por las armas en esta vida, toda me viene del favor que ella me da y de ser yo suyo."
        literal: "But that which I-think to-do will-be to-travel in-haste and to-arrive quickly where is this giant, and, on arriving, to-him I-will-cut the head, and I-will-put [to] the princess peacefully in her estate, and at-the point I-will-give the turn to see [to] the light that my senses lights, to the which I-will-give such excuses that she may-come to hold for good my delay, since she-will-see that all redounds in increase of her glory and fame, since as-much-as I have won, win and shall-win by the arms in this life, all to-me comes from-the favor that she me gives and from being I hers."
