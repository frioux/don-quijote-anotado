  - sentences:
      - es: "— No sería eso —respondió don Quijote—, sino que tú debías de estar romadizado, o te debiste de oler a ti mismo; porque yo sé bien a lo que huele aquella rosa entre espinas, aquel lirio del campo, aquel ámbar desleído."
        literal: "— Not it-would-be that —answered Don Quijote—, but that you must of be having-a-cold, or yourself you-must of smell [to] yourself; because I know well [of] what smells that rose among thorns, that lily of-the field, that amber dissolved."
        ormsby: "“It could not be that,” said Don Quixote, “but thou must have been suffering from cold in the head, or must have smelt thyself; for I know well what would be the scent of that rose among thorns, that lily of the field, that dissolved amber.”"
        vocab:
          - {w: "romadizado", d: "suffering from a head cold, stuffed up (from 'romadizo', catarrh)"}
          - {w: "oler a", d: "to smell of; 'olerse a sí mismo' = to smell oneself"}
          - {w: "rosa entre espinas", d: "rose among thorns, from the Song of Songs (2:2), 'as the lily among thorns'"}
          - {w: "lirio del campo", d: "lily of the field, from the Song of Songs and the Gospel (Matthew 6:28)"}
          - {w: "ámbar", d: "ambergris, a costly perfume (not the fossil resin)"}
          - {w: "desleído", d: "dissolved, melted (from 'desleír')"}
        diagram:
          - s: "No sería eso"
            r: "main verb 1: it can't have been that"
            under:
              - {s: "sino que tú debías de estar romadizado", r: "but rather, 1: you must have had a cold"}
              - {s: "o te debiste de oler a ti mismo", r: "but rather, 2: or you must have smelled yourself"}
          - {s: "respondió don Quijote", r: "speech tag"}
          - s: "porque yo sé bien"
            r: "why: because I know well"
            under:
