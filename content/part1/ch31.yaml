                r: "what I know: what that rose among thorns smells of"
                under:
                  - {s: "aquel lirio del campo, aquel ámbar desleído", r: "more names for her: that lily of the field, that dissolved ambergris"}
        forms:
          - {w: "sería", f: "ser + -ía → ser (to be), conditional, it: 'it would be', here a guess about the past. The conditional adds to the infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "debías", f: "deb- + -ías → deber (must), imperfect, you (tú). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "debiste", f: "deb- + -iste → deber (must), preterite, you (tú). The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "te ... oler a ti mismo", f: "olerse (to smell oneself), the 'te' placed before 'debiste' and repeated as 'a ti mismo' for emphasis."}
          - {w: "huele", f: "huel- + -e → oler (to smell), present, it. o becomes hue when stressed: huelo, hueles, huele, olemos, oléis, huelen."}
