      - es: "De todo lo cual tiene vuestra merced la culpa, porque si se fuera su camino adelante y no viniera donde no le llamaban, ni se entremetiera en negocios ajenos, mi amo se contentara con darme una o dos docenas de azotes, y luego me soltara y pagara cuanto me debía."
