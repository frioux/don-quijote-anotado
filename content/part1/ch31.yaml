  - sentences:
      - es: "En esto, les dio voces maese Nicolás que esperasen un poco, que querían detenerse a beber en una fontecilla que allí estaba."
        literal: "In this, to-them gave shouts Master Nicolás that they-should-wait a little, for they-wanted to-stop-themselves to drink at a little-spring that there was."
        ormsby: "Master Nicholas here called out to them to wait a while, as they wanted to halt and drink at a little spring there was there."
        vocab:
          - {w: "en esto", d: "at this point, just then"}
          - {w: "dar voces", d: "to shout, call out"}
          - {w: "maese", d: "Master, a title for craftsmen; 'maese Nicolás' is the village barber"}
          - {w: "detenerse", d: "to stop, halt"}
          - {w: "fontecilla", d: "a little spring (diminutive of 'fuente')"}
