  - sentences:
      - es: "— Eso está claro —respondió Sancho—, pero mire vuestra merced que la escoja hacia la marina, porque, si no me contentare la vivienda, pueda embarcar mis negros vasallos y hacer dellos lo que ya he dicho."
        literal: "— That is clear —answered Sancho—, but see your grace that it you-choose toward the seacoast, so-that, if not me should-please the dwelling, I-may-be-able to-ship my black vassals and do of-them that which already I-have said."
