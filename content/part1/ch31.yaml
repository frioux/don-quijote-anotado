      - es: "¿piensa vuestra merced caminar este camino en balde, y dejar pasar y perder un tan rico y tan principal casamiento como éste, donde le dan en dote un reino, que a buena verdad que he oído decir que tiene más de veinte mil leguas de contorno, y que es abundantísimo de todas las cosas que son necesarias para el sustento de la vida humana, y que es mayor que Portugal y que Castilla juntos?"
        literal: "does-think your grace to-travel this road in vain, and to-let pass and to-lose a so rich and so principal marriage as this, where to-you they-give in dowry a kingdom, which in good truth that I-have heard say that it-has more than twenty thousand leagues of circuit, and that it-is most-abundant of all the things that are necessary for the sustenance of the life human, and that it-is bigger than Portugal and than Castile together?"
        ormsby: "do you mean to travel all that way for nothing, and to let slip and lose so rich and great a match as this where they give as a portion a kingdom that in sober truth I have heard say is more than twenty thousand leagues round about, and abounds with all things necessary to support human life, and is bigger than Portugal and Castile put together?"
