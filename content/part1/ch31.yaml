          - {w: "llevar a alguien", d: "to be taller (or older) than someone by: 'me lleva un coto' = she's a hand taller than me"}
          - {w: "coto", d: "a measure: the width of a closed fist with the thumb raised, about half a palm"}
        diagram:
          - s: "Tan alta es"
            r: "main verb: so tall she is"
            under:
              - s: "que a buena fe que me lleva a mí más de un coto"
                r: "result: that, honestly, she tops me by more than a fist"
          - {s: "respondió Sancho", r: "speech tag"}
        forms:
