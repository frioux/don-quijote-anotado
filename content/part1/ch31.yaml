  - sentences:
      - es: "— Tan alta es —respondió Sancho—, que a buena fe que me lleva a mí más de un coto."
        literal: "— So tall she-is —answered Sancho—, that in good faith that me she-takes to me more than a fist-length."
        ormsby: "“And so lofty she is,” said Sancho, “that she overtops me by more than a hand’s-breadth.”"
