      - es: "Y advierta que ya tengo edad para dar consejos, y que este que le doy le viene de molde, y que más vale pájaro en mano que buitre volando, porque quien bien tiene y mal escoge, por bien que se enoja no se venga."
        literal: "And note that already I-have age to give advices, and that this which to-you I-give to-you comes of mould, and that more is-worth bird in hand than vulture flying, because who good has and bad chooses, for well that himself he-angers not himself he-avenges."
        ormsby: "remember, I am old enough to give advice, and this I am giving comes pat to the purpose; for a sparrow in the hand is better than a vulture on the wing, and he who has the good to his hand and chooses the bad, that the good he complains of may not come to him.”"
        ormsby_note: "Proverb 167. Proverb 21. Sancho, as he almost always does when it is long, makes a muddle of the proverb: the correct form is, \"Who has good and chooses evil, let him not complain of the evil that comes to him.\""
        vocab:
          - {w: "advertir", d: "to note, take heed, bear in mind"}
          - {w: "tener edad para", d: "to be old enough to"}
          - {w: "venir de molde", d: "to fit perfectly, come just right (literally 'come from the mould')"}
          - {w: "más vale pájaro en mano que buitre volando", d: "proverb: a bird in the hand is worth more than a vulture on the wing (English 'a bird in the hand is worth two in the bush')"}
          - {w: "buitre", d: "vulture"}
          - {w: "escoger", d: "to choose"}
          - {w: "por bien que", d: "however much"}
          - {w: "enojarse", d: "to get angry"}
          - {w: "vengarse", d: "to take revenge, get even"}
