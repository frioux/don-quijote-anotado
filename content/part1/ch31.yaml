            r: "main verb: and bear in mind (an order)"
            under:
              - {s: "que ya tengo edad para dar consejos", r: "what, 1: that I'm old enough to give advice"}
              - s: "y que este que le doy le viene de molde"
                r: "what, 2: and that this advice I give you fits you perfectly"
              - s: "y que más vale pájaro en mano que buitre volando"
                r: "what, 3: and that a bird in hand is worth more than a vulture flying (proverb)"
                under:
                  - s: "porque quien bien tiene y mal escoge, por bien que se enoja no se venga"
                    r: "why: because he who has good and chooses ill gets no revenge however angry he gets (Sancho's garbled proverb)"
        forms:
          - {w: "advierta", f: "adviert- + -a → advertir (to note), command for vuestra merced (present subjunctive). The stem e becomes ie when stressed: advierta, adviertas, advierta, advirtamos, advirtáis, adviertan."}
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "doy", f: "dar (to give), present, I. doy, das, da, damos, dais, dan."}
          - {w: "viene", f: "vien- + -e → venir (to come), present, it. Irregular: vengo, vienes, viene, venimos, venís, vienen."}
          - {w: "vale", f: "val- + -e → valer (to be worth), present, it. valgo, vales, vale, valemos, valéis, valen."}
          - {w: "volando", f: "gerund of volar (to fly): 'flying'."}
          - {w: "tiene, escoge", f: "tener (to have) and escog- + -e → escoger (to choose), present, he. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "se enoja, se venga", f: "enoj- + -a → enojarse (to get angry), veng- + -a → vengarse (to take revenge), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
        note: "The proper proverb is 'quien bien tiene y mal escoge, del mal que le venga no se enoje', 'who has good and chooses ill, let him not complain of the ill that comes'. Sancho jumbles 'venga' (comes) into 'se venga' (takes revenge)."
  - sentences:
      - es: "— Mira, Sancho —respondió don Quijote—: si el consejo que me das de que me case es porque sea luego rey, en matando al gigante, y tenga cómodo para hacerte mercedes y darte lo prometido, hágote saber que sin casarme podré cumplir tu deseo muy fácilmente, porque yo sacaré de adahala, antes de entrar en la batalla, que, saliendo vencedor della, ya que no me case, me han de dar una parte del reino, para que la pueda dar a quien yo quisiere;"
        literal: "— Look, Sancho —answered Don Quijote—: if the advice that me you-give of that I-should-marry is so-that I-may-be at-once king, on killing [to]-the giant, and may-have means to do-you favors and give-you the promised, I-make-you know that without marrying-myself I-will-be-able to-fulfil your wish very easily, because I will-take-out as-extra, before of entering in the battle, that, coming-out victor of-it, even-if not I-marry, to-me they-have to give a part of-the kingdom, so-that it I-may-be-able to-give to whom I may-wish;"
        ormsby: "“Look here, Sancho,” said Don Quixote. “If thou art advising me to marry, in order that immediately on slaying the giant I may become king, and be able to confer favours on thee, and give thee what I have promised, let me tell thee I shall be able very easily to satisfy thy desires without marrying; for before going into battle I will make it a stipulation that, if I come out of it victorious, even I do not marry, they shall give me a portion of the kingdom, that I may bestow it upon whomsoever I choose,"
        vocab:
          - {w: "luego", d: "at once, straight away"}
          - {w: "en + gerund", d: "as soon as: 'en matando' = as soon as I kill"}
          - {w: "tener cómodo para", d: "to be in a position to, have the means to"}
          - {w: "hacer mercedes", d: "to grant favors, reward (a lord to a vassal)"}
          - {w: "hacer saber", d: "to inform, let know"}
          - {w: "sacar de adahala", d: "to stipulate as an extra; 'adahala' (= adehala) is a bonus added to the agreed price"}
          - {w: "vencedor", d: "victor, winner"}
          - {w: "ya que", d: "here 'even if, although' (not 'since')"}
          - {w: "haber de + infinitive", d: "must, have to; 'me han de dar' = they will have to give me"}
        diagram:
          - {s: "Mira, Sancho", r: "opener: look, Sancho"}
          - {s: "respondió don Quijote", r: "speech tag"}
          - s: "hágote saber"
            r: "main verb: I let you know"
            under:
              - s: "si el consejo que me das de que me case es"
                r: "condition: if the advice you give me, that I marry, is"
                under:
                  - {s: "porque sea luego rey, en matando al gigante", r: "why, 1: so that I become king at once, as soon as I kill the giant"}
                  - {s: "y tenga cómodo para hacerte mercedes y darte lo prometido", r: "why, 2: and have the means to reward you and give you what I promised"}
              - {s: "que sin casarme podré cumplir tu deseo muy fácilmente", r: "what I let you know: that without marrying I can very easily fulfil your wish"}
              - s: "porque yo sacaré de adahala"
                r: "why: because I'll stipulate as an extra"
                under:
                  - {s: "antes de entrar en la batalla", r: "when: before going into battle"}
                  - s: "que, saliendo vencedor della, ya que no me case, me han de dar una parte del reino"
                    r: "what I'll stipulate: that, if I come out the winner, even without marrying, they must give me part of the kingdom"
                    under:
                      - {s: "para que la pueda dar a quien yo quisiere", r: "purpose: so that I can give it to whomever I like"}
        forms:
          - {w: "Mira", f: "mir- + -a → mirar (to look), command, you (tú): the same as the he-form of the present."}
          - {w: "das", f: "dar (to give), present, you (tú). doy, das, da, damos, dais, dan."}
          - {w: "me case", f: "cas- + -e → casarse (to marry), present subjunctive, I, after 'consejo de que'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "sea, tenga", f: "ser (to be) and tener (to have), present subjunctive, I, after 'porque' meaning 'so that'. sea, seas, sea, seamos, seáis, sean; tenga, tengas, tenga, tengamos, tengáis, tengan."}
          - {w: "matando", f: "gerund of matar (to kill), after 'en': 'en matando' = as soon as I kill."}
          - {w: "hacerte, darte", f: "hacer (to do) and dar (to give) + te (to you): pronouns hung on the infinitives."}
          - {w: "prometido", f: "participle of prometer (to promise) used as a noun with 'lo': 'what was promised'."}
          - {w: "hágote", f: "hag- + -o + te → hacer (to make), present, I, with 'te' stuck on the end; modern 'te hago saber'. Cervantes hangs pronouns on a clause-opening verb. hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "podré", f: "podr- + -é → poder (to be able), future, I. poder shortens to podr-: podré, podrás, podrá, podremos, podréis, podrán."}
          - {w: "sacaré", f: "sacar + -é → sacar (to take out, stipulate), future, I. The future adds to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "saliendo", f: "gerund of salir (to come out): 'coming out (as) victor', i.e. if I win."}
          - {w: "della", f: "de + ella (of it, the battle)."}
          - {w: "han de dar", f: "han (haber, present, they: he, has, ha, hemos, habéis, han) + de + dar (to give): 'they must give'."}
