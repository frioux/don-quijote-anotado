part: 1
chapter: 31
title_es: "Capítulo XXXI. De los sabrosos razonamientos que pasaron entre don Quijote y Sancho Panza, su escudero, con otros sucesos"
title_en: "Of the delectable discussion between Don Quixote and Sancho Panza, his squire, together with other incidents"
paragraphs:
  - sentences:
      - es: "— Todo eso no me descontenta; prosigue adelante —dijo don Quijote—."
        literal: "— All that not me displeases; continue forward —said Don Quijote—."
        ormsby: "“All that is not unsatisfactory to me,” said Don Quixote. “Go on;"
        ormsby_note: "The division here is very awkwardly managed: Chapter XXXI ought to have commenced at \"While they were holding this conversation,\" in the preceding chapter."
        vocab:
          - {w: "descontentar", d: "to displease, dissatisfy; 'no me descontenta' = I am not unhappy with it"}
          - {w: "proseguir adelante", d: "to go on, carry on (with a story)"}
        diagram:
          - s: "no me descontenta"
            r: "main verb 1: does not displease me"
            under:
              - {s: "Todo eso", r: "subject: all that (Sancho's report so far)"}
          - {s: "prosigue adelante", r: "main verb 2: an order, go on"}
          - {s: "dijo don Quijote", r: "speech tag: said Don Quijote"}
        forms:
          - {w: "descontenta", f: "descontent- + -a → descontentar (to displease), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "prosigue", f: "prosig- + -ue → proseguir (to continue), command, you (tú). The tú command is the same as the he-form of the present; the stem e becomes i: prosigo, prosigues, prosigue, proseguimos, proseguís, prosiguen. The u keeps the g hard before e."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
        note: "The chapter opens in the middle of a conversation: Sancho has just begun to tell the lie that he delivered Don Quijote's letter to Dulcinea, when in fact he lost it and never went to El Toboso."
      - es: "Llegaste, ¿y qué hacía aquella reina de la hermosura?"
        literal: "You-arrived, and what was-doing that queen of the beauty?"
        ormsby: "thou didst reach her; and what was that queen of beauty doing?"
        vocab:
          - {w: "reina de la hermosura", d: "queen of beauty, a courtly title for the lady a knight serves"}
        diagram:
          - {s: "Llegaste", r: "main verb 1: you arrived"}
          - s: "¿y qué hacía"
            r: "main verb 2 (after 'y'): and what was she doing?"
            under:
              - {s: "aquella reina de la hermosura", r: "subject: that queen of beauty (Dulcinea)"}
        forms:
          - {w: "Llegaste", f: "lleg- + -aste → llegar (to arrive), preterite, you (tú). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "hacía", f: "hac- + -ía → hacer (to do), imperfect, she: 'was doing'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "aquella", f: "aquel (that) made feminine to match 'reina': aquel, aquella, aquellos, aquellas."}
      - es: "A buen seguro que la hallaste ensartando perlas, o bordando alguna empresa con oro de cañutillo para este su cautivo caballero."
        literal: "At good sure that her you-found threading pearls, or embroidering some device with gold of little-tube for this her captive knight."
        ormsby: "Surely thou didst find her stringing pearls, or embroidering some device in gold thread for this her enslaved knight.”"
        vocab:
          - {w: "a buen seguro", d: "surely, for certain"}
          - {w: "hallar", d: "to find"}
          - {w: "ensartar", d: "to thread, string (beads, pearls)"}
          - {w: "bordar", d: "to embroider"}
          - {w: "empresa", d: "here a heraldic device or emblem with a motto (also 'enterprise, exploit')"}
          - {w: "oro de cañutillo", d: "gold purl: fine gold wire coiled into tiny tubes ('cañutillo' = little tube) for embroidery"}
          - {w: "cautivo", d: "captive; the lover as his lady's prisoner"}
        diagram:
          - s: "la hallaste"
            r: "main verb: you found her"
            under:
              - {s: "A buen seguro que", r: "how sure: I'm certain that"}
              - {s: "ensartando perlas", r: "doing what, 1: stringing pearls"}
              - s: "o bordando alguna empresa"
                r: "doing what, 2: or embroidering some device"
                under:
                  - {s: "con oro de cañutillo", r: "with what: gold thread"}
                  - {s: "para este su cautivo caballero", r: "for whom: for this captive knight of hers (me)"}
        forms:
          - {w: "la hallaste", f: "hall- + -aste → hallar (to find), preterite, you (tú), with 'la' (her). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "ensartando, bordando", f: "gerunds of ensartar (to string) and bordar (to embroider): -ar verbs make the gerund in -ando. After 'hallar' they say what she was doing when found."}
          - {w: "alguna", f: "algun- + -a → alguno (some), feminine to match 'empresa'."}
          - {w: "este su", f: "'this ... of hers': Cervantes stacks a demonstrative and a possessive before the noun ('este su cautivo caballero'), an old construction modern Spanish avoids."}
  - sentences:
      - es: "— No la hallé —respondió Sancho— sino ahechando dos hanegas de trigo en un corral de su casa."
        literal: "— Not her I-found —answered Sancho— but winnowing two acre-measures of wheat in a yard of her house."
        ormsby: "“I did not,” said Sancho, “but I found her winnowing two bushels of wheat in the yard of her house.”"
        vocab:
          - {w: "no ... sino", d: "not ... but (only); 'no la hallé sino ahechando' = I found her doing nothing but winnowing"}
          - {w: "ahechar", d: "to winnow, sift grain in a sieve to clear the chaff"}
          - {w: "hanega", d: "= fanega, a Castilian dry measure of grain, about a bushel and a half"}
          - {w: "trigo", d: "wheat"}
          - {w: "corral", d: "yard, enclosed farmyard behind a house"}
        diagram:
          - s: "No la hallé"
            r: "main verb: I did not find her"
            under:
              - s: "sino ahechando dos hanegas de trigo"
                r: "but doing what: only winnowing two measures of wheat"
                under:
                  - {s: "en un corral de su casa", r: "where: in a yard of her house"}
          - {s: "respondió Sancho", r: "speech tag: answered Sancho"}
        forms:
          - {w: "hallé", f: "hall- + -é → hallar (to find), preterite, I. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "ahechando", f: "gerund of ahechar (to winnow): -ar verbs make the gerund in -ando."}
        note: "Sancho's answer turns Don Quijote's courtly picture into farm work: a lady embroiders, a peasant girl winnows wheat in the yard. The whole dialogue runs on this contrast."
  - sentences:
      - es: "— Pues haz cuenta —dijo don Quijote— que los granos de aquel trigo eran granos de perlas, tocados de sus manos."
        literal: "— Then make account —said Don Quijote— that the grains of that wheat were grains of pearls, touched by her hands."
        ormsby: "“Then depend upon it,” said Don Quixote, “the grains of that wheat were pearls when touched by her hands;"
        vocab:
          - {w: "hacer cuenta que", d: "to reckon, take it that, suppose"}
          - {w: "grano", d: "grain; also a single pearl ('grano de perla')"}
          - {w: "tocados de", d: "touched by; old Spanish marks the doer with 'de'"}
        diagram:
          - s: "Pues haz cuenta"
            r: "main verb: then reckon (an order)"
            under:
              - s: "que los granos de aquel trigo eran granos de perlas"
                r: "what to reckon: that the grains of that wheat were pearls"
                under:
                  - {s: "tocados de sus manos", r: "describes 'granos': once touched by her hands"}
          - {s: "dijo don Quijote", r: "speech tag"}
        forms:
          - {w: "haz", f: "hacer (to make), command, you (tú): one of the short irregular tú commands (haz, pon, ten, ven, sal, di)."}
          - {w: "eran", f: "ser (to be), imperfect, they. ser's imperfect is irregular: era, eras, era, éramos, erais, eran."}
          - {w: "tocados", f: "toc- + -ado + -s → participle of tocar (to touch), masculine plural to match 'granos'."}
          - {w: "sus", f: "'her', plural to match 'manos', not the owner."}
      - es: "Y si miraste, amigo, el trigo ¿era candeal, o trechel?"
        literal: "And if you-looked-at, friend, the wheat, was-it white-wheat, or spring-wheat?"
        ormsby: "and didst thou look, friend? was it white wheat or brown?”"
        vocab:
          - {w: "candeal", d: "fine white wheat, which made the best bread ('pan candeal')"}
          - {w: "trechel", d: "spring wheat, a hardy summer-sown variety, a lower grade"}
        diagram:
          - {s: "si miraste, amigo, el trigo", r: "condition: if you looked at the wheat, friend"}
          - s: "¿era candeal, o trechel?"
            r: "main verb: was it white wheat or spring wheat?"
        forms:
          - {w: "miraste", f: "mir- + -aste → mirar (to look at), preterite, you (tú). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "era", f: "ser (to be), imperfect, it. ser's imperfect is irregular: era, eras, era, éramos, erais, eran."}
  - sentences:
      - es: "— No era sino rubión —respondió Sancho."
        literal: "— Not it-was but red-wheat —answered Sancho."
        ormsby: "“It was neither, but red,” said Sancho."
        vocab:
          - {w: "no ... sino", d: "only, nothing but"}
          - {w: "rubión", d: "a reddish wheat, coarser than candeal; from 'rubio' (fair, reddish)"}
        diagram:
          - s: "No era"
            r: "main verb: it was not"
            under:
              - {s: "sino rubión", r: "but what: anything but red wheat"}
          - {s: "respondió Sancho", r: "speech tag"}
        forms:
          - {w: "era", f: "ser (to be), imperfect, it. ser's imperfect is irregular: era, eras, era, éramos, erais, eran."}
          - {w: "rubión", f: "rubi- + -ón: from rubio (reddish) with the suffix -ón, which names a thing by a quality (here 'the reddish kind')."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
  - sentences:
      - es: "— Pues yo te aseguro —dijo don Quijote— que, ahechado por sus manos, hizo pan candeal, sin duda alguna."
        literal: "— Then I you assure —said Don Quijote— that, winnowed by her hands, it-made bread white, without doubt any."
        ormsby: "“Then I promise thee,” said Don Quixote, “that, winnowed by her hands, beyond a doubt the bread it made was of the whitest;"
        vocab:
          - {w: "asegurar", d: "to assure, promise"}
          - {w: "pan candeal", d: "bread of fine white wheat, the best bread"}
          - {w: "sin duda alguna", d: "without any doubt; 'alguna' after the noun means 'any at all'"}
        diagram:
          - s: "Pues yo te aseguro"
            r: "main verb: then I assure you"
            under:
              - s: "que, ahechado por sus manos, hizo pan candeal"
                r: "what I assure: that, once winnowed by her hands, it made white bread"
              - {s: "sin duda alguna", r: "how sure: without any doubt"}
          - {s: "dijo don Quijote", r: "speech tag"}
        forms:
          - {w: "aseguro", f: "asegur- + -o → asegurar (to assure), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "ahechado", f: "ahech- + -ado → participle of ahechar (to winnow), masculine to match 'trigo' (understood): 'once winnowed'."}
          - {w: "hizo", f: "hiz- + -o → hacer (to make), preterite, it. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron (c becomes z before o)."}
          - {w: "alguna", f: "algun- + -a → alguno (some, any), feminine to match 'duda'; after the noun in a negative it means 'at all'."}
      - es: "Pero pasa adelante: cuando le diste mi carta, ¿besóla? ¿Púsosela sobre la cabeza?"
        literal: "But go forward: when to-her you-gave my letter, kissed-she-it? Put-she-it-to-herself on the head?"
        ormsby: "but go on; when thou gavest her my letter, did she kiss it? Did she place it on her head?"
        vocab:
          - {w: "pasar adelante", d: "to go on, continue"}
          - {w: "ponerse sobre la cabeza", d: "to put on one's head: the formal gesture of respect for a letter from a superior or a royal order"}
        diagram:
          - {s: "Pero pasa adelante", r: "main verb 1: but go on (an order)"}
          - s: "¿besóla?"
            r: "main verb 2: did she kiss it?"
            under:
              - {s: "cuando le diste mi carta", r: "when: when you gave her my letter"}
          - s: "¿Púsosela"
            r: "main verb 3: did she put it"
            under:
              - {s: "sobre la cabeza", r: "where: on her head"}
        forms:
          - {w: "pasa", f: "pas- + -a → pasar (to pass), command, you (tú): the same as the he-form of the present."}
          - {w: "le diste", f: "d- + -iste → dar (to give), preterite, you (tú), with 'le' (to her). dar takes -er/-ir endings in the preterite: di, diste, dio, dimos, disteis, dieron."}
          - {w: "besóla", f: "bes- + -ó + la → besar (to kiss), preterite, she, with 'la' (it, the letter) stuck on the end; modern 'la besó'. Cervantes hangs pronouns on the end of a conjugated verb that opens its clause. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "Púsosela", f: "pus- + -o + se + la → ponerse (to put on oneself), preterite, she, with 'se' (on herself) and 'la' (it) stuck on the end; modern 'se la puso'. Irregular preterite: puse, pusiste, puso, pusimos, pusisteis, pusieron."}
        note: "To kiss a letter and place it on one's head was the ceremonial way of receiving a letter from a king or a superior, showing submission. Don Quijote expects the same of his lady."
      - es: "¿Hizo alguna ceremonia digna de tal carta, o qué hizo?"
        literal: "Did-she-make some ceremony worthy of such letter, or what did-she-do?"
        ormsby: "Did she perform any ceremony befitting it, or what did she do?”"
        vocab:
          - {w: "digno de", d: "worthy of, befitting"}
        diagram:
          - s: "¿Hizo alguna ceremonia"
            r: "main verb 1: did she perform some ceremony"
            under:
              - {s: "digna de tal carta", r: "describes 'ceremonia': worthy of such a letter"}
          - {s: "o qué hizo?", r: "main verb 2: or what did she do?"}
        forms:
          - {w: "Hizo", f: "hiz- + -o → hacer (to do, make), preterite, she. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "alguna", f: "algun- + -a → alguno (some), feminine to match 'ceremonia'."}
          - {w: "digna", f: "dign- + -a → digno (worthy), feminine to match 'ceremonia'."}
  - sentences:
      - es: "— Cuando yo se la iba a dar —respondió Sancho—, ella estaba en la fuga del meneo de una buena parte de trigo que tenía en la criba, y díjome:"
        literal: "— When I to-her it was-going to give —answered Sancho—, she was in the rush of-the shaking of a good part of wheat that she-had in the sieve, and said-to-me:"
        ormsby: "“When I went to give it to her,” replied Sancho, “she was hard at it swaying from side to side with a lot of wheat she had in the sieve, and she said to me,"
        vocab:
          - {w: "ir a + infinitive", d: "to be going to, be about to"}
          - {w: "en la fuga de", d: "in the full swing of, at the height of"}
          - {w: "meneo", d: "shaking, swaying, jiggling (from 'menear', to shake)"}
          - {w: "criba", d: "sieve, riddle for grain"}
        diagram:
          - s: "ella estaba en la fuga del meneo de una buena parte de trigo"
            r: "main verb 1: she was in full swing shaking a good lot of wheat"
            under:
              - {s: "Cuando yo se la iba a dar", r: "when: when I was about to give it to her"}
              - {s: "que tenía en la criba", r: "describes 'trigo': that she had in the sieve"}
          - {s: "respondió Sancho", r: "speech tag"}
          - {s: "y díjome:", r: "main verb 2: and she said to me"}
        forms:
          - {w: "se la", f: "'it to her': 'le' (to her) turns into 'se' before 'la' (it, the letter). le / les become se before lo, la, los, las."}
          - {w: "iba", f: "ir (to go), imperfect, I: 'iba a dar' = I was going to give. ir's imperfect is irregular: iba, ibas, iba, íbamos, ibais, iban."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, she. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, she. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "díjome", f: "dij- + -o + me → decir (to say), preterite, she, with 'me' (to me) stuck on the end; modern 'me dijo'. Cervantes hangs pronouns on a clause-opening verb. Irregular preterite: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
      - es: "«Poned, amigo, esa carta sobre aquel costal, que no la puedo leer hasta que acabe de acribar todo lo que aquí está»."
        literal: "«Put, friend, that letter on that sack, for not it I-can read until I-finish of sieving all that which here is»."
        ormsby: "‘Lay the letter, friend, on the top of that sack, for I cannot read it until I have done sifting all this.”"
        vocab:
          - {w: "costal", d: "large sack (for grain)"}
          - {w: "acabar de + infinitive", d: "to finish doing"}
          - {w: "acribar", d: "to sift, riddle (grain through a criba)"}
        diagram:
          - s: "Poned, amigo, esa carta"
            r: "main verb: put that letter, friend (an order)"
            under:
              - {s: "sobre aquel costal", r: "where: on that sack"}
              - s: "que no la puedo leer"
                r: "why: for I can't read it"
                under:
                  - s: "hasta que acabe de acribar todo"
                    r: "until when: until I finish sifting everything"
                    under:
                      - {s: "lo que aquí está", r: "describes 'todo': all that is here"}
        forms:
          - {w: "Poned", f: "pon- + -ed → poner (to put), command, you (vos/vosotros): the -ed command, made from the infinitive by changing -r to -d. Dulcinea uses the polite-plural 'vos' to a stranger."}
          - {w: "esa, aquel", f: "esa (that, near you), feminine to match 'carta'; aquel (that, over there), masculine to match 'costal'."}
          - {w: "puedo", f: "pued- + -o → poder (to be able), present, I. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "acabe", f: "acab- + -e → acabar (to finish), present subjunctive, I. Subjunctive after 'hasta que' for something not yet done. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "está", f: "est- + -á → estar (to be), present, it. estoy, estás, está, estamos, estáis, están."}
        note: "Sancho invents the whole scene, and his invented Dulcinea is a busy peasant girl who will not stop work to read a letter. Don Quijote's next words turn her rudeness into discretion."
  - sentences:
      - es: "— ¡Discreta señora! —dijo don Quijote—. Eso debió de ser por leerla despacio y recrearse con ella."
        literal: "— Wise lady! —said Don Quijote—. That must of be for to-read-it slowly and to-delight-herself with it."
        ormsby: "“Discreet lady!” said Don Quixote; “that was in order to read it at her leisure and enjoy it;"
        vocab:
          - {w: "discreto", d: "wise, sensible, judicious (false friend: not 'discreet' in the sense of 'quiet')"}
          - {w: "deber de + infinitive", d: "must (probably), expressing a guess: 'debió de ser' = it must have been"}
          - {w: "despacio", d: "slowly, at leisure"}
          - {w: "recrearse con", d: "to take delight in, enjoy"}
        diagram:
          - {s: "¡Discreta señora!", r: "exclamation: what a wise lady!"}
          - {s: "dijo don Quijote", r: "speech tag"}
          - s: "Eso debió de ser"
            r: "main verb: that must have been"
            under:
              - {s: "por leerla despacio", r: "why, 1: so as to read it at leisure"}
              - {s: "y recrearse con ella", r: "why, 2: and to delight in it"}
        forms:
          - {w: "Discreta", f: "discret- + -a → discreto (wise), feminine to match 'señora'."}
          - {w: "debió", f: "deb- + -ió → deber (must), preterite, it: 'debió de ser' = it must have been. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "leerla", f: "leer (to read) + la (it, the letter), the pronoun hung on the infinitive."}
          - {w: "recrearse", f: "recrear (to delight) + se (herself), hung on the infinitive."}
      - es: "Adelante, Sancho: y, en tanto que estaba en su menester, ¿qué coloquios pasó contigo? ¿Qué te preguntó de mí? Y tú, ¿qué le respondiste?"
        literal: "Forward, Sancho: and, while that she-was in her task, what conversations passed-she with-you? What you she-asked about me? And you, what to-her you-answered?"
        ormsby: "proceed, Sancho; while she was engaged in her occupation what converse did she hold with thee? What did she ask about me, and what answer didst thou give?"
        vocab:
          - {w: "en tanto que", d: "while, as long as"}
          - {w: "menester", d: "task, occupation, job (also 'need': 'ser menester' = to be necessary)"}
          - {w: "coloquio", d: "conversation, talk"}
          - {w: "pasar coloquios con", d: "to hold conversation with"}
        diagram:
          - {s: "Adelante, Sancho", r: "an order: go on, Sancho"}
          - s: "¿qué coloquios pasó contigo?"
            r: "main verb 1: what talk did she have with you?"
            under:
              - {s: "en tanto que estaba en su menester", r: "when: while she was at her work"}
          - {s: "¿Qué te preguntó de mí?", r: "main verb 2: what did she ask you about me?"}
          - {s: "Y tú, ¿qué le respondiste?", r: "main verb 3: and you, what did you answer her?"}
        forms:
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, she. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "pasó, preguntó", f: "pas- + -ó → pasar (to pass, hold) and pregunt- + -ó → preguntar (to ask), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "contigo", f: "con + ti fused into one word: 'with you' (also conmigo, consigo)."}
          - {w: "mí", f: "'me' after a preposition ('de mí'); the accent tells it from 'mi' (my)."}
          - {w: "respondiste", f: "respond- + -iste → responder (to answer), preterite, you (tú). The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
