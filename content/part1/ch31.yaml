  - sentences:
      - es: "— Así sería —dijo Sancho—; porque a buena fe que andaba Rocinante como si fuera asno de gitano con azogue en los oídos."
        literal: "— Thus it-would-be —said Sancho—; because in good faith that was-going Rocinante as if he-were donkey of gypsy with quicksilver in the ears."
        ormsby: "“That must have been it,” said Sancho, “for indeed Rocinante went like a gipsy’s ass with quicksilver in his ears.”"
        ormsby_note: "Alluding to a common device of the gypsy dealers to improve the pace of a beast for sale."
        vocab:
          - {w: "así sería", d: "that must have been it (the conditional as a guess)"}
          - {w: "a buena fe", d: "truly, honestly"}
          - {w: "andar", d: "to go, move (of a horse)"}
          - {w: "gitano", d: "gypsy; gypsies were known as horse and donkey dealers"}
          - {w: "azogue", d: "quicksilver, mercury; put in an animal's ears to make it skittish and lively"}
          - {w: "Rocinante", d: "Don Quijote's bony old horse"}
        diagram:
          - {s: "Así sería", r: "main verb 1: that must have been it"}
          - {s: "dijo Sancho", r: "speech tag"}
          - s: "porque a buena fe que andaba Rocinante"
            r: "why: because, honestly, Rocinante went"
            under:
              - {s: "como si fuera asno de gitano con azogue en los oídos", r: "how: as if he were a gypsy's donkey with quicksilver in its ears"}
        forms:
          - {w: "sería", f: "ser + -ía → ser (to be), conditional, it: a guess about the past, 'it must have been'. The conditional adds to the infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "andaba", f: "and- + -aba → andar (to go), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), he, after 'como si'. Built on the preterite fueron: fuera, fueras, fuera, fuéramos, fuerais, fueran."}
        note: "Sancho's donkey had been stolen, so Don Quijote lent him Rocinante for the errand. The idea of the bony old nag flying along like a doctored gypsy donkey is the joke."
  - sentences:
      - es: "— Y ¡cómo si llevaba azogue! —dijo don Quijote—, y aun una legión de demonios, que es gente que camina y hace caminar, sin cansarse, todo aquello que se les antoja."
        literal: "— And how [indeed] if he-carried quicksilver! —said Don Quijote—, and even a legion of demons, which is people that travels and makes travel, without tiring-themselves, all that which itself to-them takes-fancy."
        ormsby: "“Quicksilver!” said Don Quixote, “aye and what is more, a legion of devils, folk that can travel and make others travel without being weary, exactly as the whim seizes them."
        vocab:
          - {w: "¡y cómo si ...!", d: "and how! I should say so! ('y cómo si llevaba azogue' = he certainly did carry quicksilver)"}
          - {w: "legión de demonios", d: "a legion of devils, echoing the Gospel (Mark 5:9, 'my name is Legion')"}
          - {w: "cansarse", d: "to get tired"}
          - {w: "antojarse", d: "to take a fancy to, feel like: 'se les antoja' = they please"}
        diagram:
          - s: "Y ¡cómo si llevaba azogue!"
            r: "exclamation: he certainly did carry quicksilver!"
          - {s: "dijo don Quijote", r: "speech tag"}
          - s: "y aun una legión de demonios"
            r: "and what's more (he carried): a legion of devils"
            under:
              - s: "que es gente que camina y hace caminar"
                r: "describes 'demonios': who are folk that travel and make travel"
                under:
                  - {s: "sin cansarse", r: "how: without getting tired"}
                  - {s: "todo aquello que se les antoja", r: "object of 'hace caminar': anything they please"}
        forms:
          - {w: "llevaba", f: "llev- + -aba → llevar (to carry), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "es", f: "ser (to be), present, it: singular to match 'gente', a collective noun, though it means many devils."}
          - {w: "camina, hace", f: "camin- + -a → caminar (to travel) and hac- + -e → hacer (to make), present, it (gente). Present of -ar verbs: -o, -as, -a, -amos, -áis, -an; hacer: hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "cansarse", f: "cansar (to tire) + se (oneself), infinitive after 'sin'."}
