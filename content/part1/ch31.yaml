  - sentences:
      - es: "— Porque vean vuestras mercedes cuán de importancia es haber caballeros andantes en el mundo, que desfagan los tuertos y agravios que en él se hacen por los insolentes y malos hombres que en él viven, sepan vuestras mercedes que los días pasados, pasando yo por un bosque, oí unos gritos y unas voces muy lastimosas, como de persona afligida y menesterosa;"
        literal: "— So-that may-see your graces how of importance it-is to-be knights errant in the world, who may-undo the wrongs and injuries that in it themselves do by the insolent and bad men who in it live, know your graces that the days past, passing I through a wood, I-heard some cries and some voices very pitiful, as of person afflicted and needy;"
        ormsby: "“That your worships may see how important it is to have knights-errant to redress the wrongs and injuries done by tyrannical and wicked men in this world, I may tell you that some days ago passing through a wood, I heard cries and piteous complaints as of a person in pain and distress;"
        vocab:
          - {w: "porque", d: "with the subjunctive, 'so that' (= para que)"}
          - {w: "cuán de importancia", d: "how important"}
          - {w: "desfacer", d: "= deshacer, to undo, redress; the old f- form is part of Don Quijote's chivalric language ('desfacer tuertos')"}
          - {w: "tuerto", d: "wrong, injury (old word; now 'one-eyed')"}
          - {w: "agravio", d: "wrong, offense, grievance"}
          - {w: "los días pasados", d: "the other day, some days ago"}
          - {w: "lastimoso", d: "pitiful, piteous"}
          - {w: "afligido", d: "afflicted, distressed"}
          - {w: "menesteroso", d: "needy, in need of help"}
