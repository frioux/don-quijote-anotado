                under:
                  - {s: "que la fortuna me podía hacer por ahora", r: "describes 'bien': that fortune could do me now"}
              - {s: "para no ver ni oír a ese desdichado músico", r: "purpose: so as neither to see nor hear that wretched musician"}
        forms:
          - {w: "despertastes", f: "despert- + -astes → despertar (to wake), preterite, you (vos, polite). Cervantes' form of modern 'despertasteis'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis (old -astes), -aron. Clara speaks to Dorotea as 'vos', with respect."}
          - {w: "mayor", f: "comparative of grande (great): 'greater'; with 'el' it is 'the greatest'."}
          - {w: "podía", f: "pod- + -ía → poder (to be able), imperfect, it (fortune). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "era", f: "ser (to be), imperfect, it. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "tenerme cerrados", f: "tener (to keep) + me (for me), with cerrados, the participle of cerrar (to close), masculine plural to match 'los ojos y los oídos': 'to keep my eyes and ears shut'."}
          - {w: "ese", f: "'that' (near the listener), masculine to match 'músico'."}
