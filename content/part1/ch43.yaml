          - {w: "taparse los oídos", d: "to stop one's ears, cover one's ears"}
          - {w: "entrambos", d: "= ambos, both (old form)"}
          - {w: "admirarse de", d: "to be amazed at, wonder at"}
          - {w: "en esta manera", d: "in this way, as follows"}
        diagram:
