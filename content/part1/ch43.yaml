  - sentences:
      - es: "Pero todas estas razones de don Quijote ya no las escuchaba nadie, porque, así como Maritornes le ató, ella y la otra se fueron, muertas de risa, y le dejaron asido de manera que fue imposible soltarse."
        literal: "But all these words of Don Quijote already not them was-listening-to nobody, because, as soon as Maritornes him tied, she and the other themselves went, dead of laughter, and him left fastened in manner that it-was impossible to-loose-himself."
        ormsby: "But there was nobody now to listen to these words of Don Quixote’s, for as soon as Maritornes had tied him she and the other made off, ready to die with laughing, leaving him fastened in such a way that it was impossible for him to release himself."
        vocab:
          - {w: "razones", d: "words, speeches (not 'reasons')"}
          - {w: "así como", d: "as soon as"}
          - {w: "muerto de risa", d: "dying of laughter, helpless with laughing"}
          - {w: "asido", d: "held fast, caught (participle of 'asir', to grasp)"}
          - {w: "de manera que", d: "in such a way that"}
          - {w: "soltarse", d: "to get loose, free oneself"}
        diagram:
          - s: "todas estas razones de don Quijote ya no las escuchaba nadie"
            r: "main verb: nobody was listening any more to all these words"
            under:
              - s: "porque, así como Maritornes le ató"
                r: "why: because as soon as Maritornes tied him"
                under:
                  - {s: "ella y la otra se fueron, muertas de risa", r: "what happened 1: she and the other girl left, dying of laughter"}
                  - s: "y le dejaron asido"
                    r: "what happened 2: and left him fastened"
                    under:
                      - {s: "de manera que fue imposible soltarse", r: "result: so that he could not get loose"}
        forms:
          - {w: "estas", f: "est- + -as → este (this), feminine plural to match 'razones'."}
          - {w: "las escuchaba nadie", f: "escuch- + -aba → escuchar (to listen to), imperfect, he/she (nobody). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. 'las' repeats the object 'razones', which was put first for emphasis; 'no ... nadie' is the normal double negative."}
          - {w: "ató, dejaron", f: "at- + -ó → atar (to tie), preterite, she; dej- + -aron → dejar (to leave), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "se fueron", f: "fue- + -ron → irse (to go away), preterite, they, with 'se'. ir (to go) in the preterite (same as ser (to be)): fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "muertas", f: "participle of morir (to die), irregular 'muerto', feminine plural to match the two girls."}
          - {w: "asido", f: "participle of asir (to grasp, hold), masculine to match 'le' (Don Quijote)."}
