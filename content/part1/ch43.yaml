          - {w: "de pies", d: "standing (modern 'de pie')"}
          - {w: "cuidado", d: "here 'anxiety, worry', not 'care'"}
          - {w: "desviarse", d: "to move aside, turn away"}
          - {w: "a un cabo o a otro", d: "to one side or the other; 'cabo' = end, side"}
          - {w: "haber de", d: "to be bound to, have to; 'había de quedar' = he would be left"}
