          - {w: "debes de estar", f: "deb- + -es → deber (must), present, you (tú): debo, debes, debe, debemos, debéis, deben; + de + estar (to be): 'deber de' marks a guess, 'you must be'."}
          - {w: "ensillando", f: "gerund of ensillar (to saddle), with estar (to be): 'saddling'."}
          - {w: "tus caballos", f: "tus = plural to match 'caballos', not the owner: 'your horses'."}
          - {w: "madrugar, salir", f: "infinitives after 'por', here meaning 'in order to': madrugar (to rise early), salir (to go out)."}
          - {w: "a mi señora", f: "the 'a' before a person who is the object (personal a): 'to see my lady'."}
          - {w: "veas", f: "ve- + -as → ver (to see), present subjunctive, you (tú). Subjunctive after 'así como' for an event still to come. vea, veas, vea, veamos, veáis, vean."}
          - {w: "suplícote", f: "suplic- + -o + te → suplicar (to beg), present, I, with 'te' (you) stuck on the end; modern 'te suplico'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. Cervantes hangs the pronoun on a verb that opens its clause, adding an accent to keep the stress."}
          - {w: "saludes", f: "salud- + -es → saludar (to greet), present subjunctive, you (tú), after 'suplico que' (I beg that). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
        note: "In classical myth the sun god drives a chariot drawn by horses across the sky each day, so at dawn he is harnessing them. Don Quijote treats both the moon and the sun as rivals who can see Dulcinea when he cannot."
      - es: "pero guárdate que al verla y saludarla no le des paz en el rostro, que tendré más celos de ti que tú los tuviste de aquella ligera ingrata que tanto te hizo sudar y correr por los llanos de Tesalia, o por las riberas de Peneo, que no me acuerdo bien por dónde corriste entonces celoso y enamorado."
        literal: "but guard-yourself that on-the seeing-her and greeting-her not to-her you-give peace on the face, for I-will-have more jealousy of you than you them had of that swift ungrateful-girl who so-much you made sweat and run through the plains of Thessaly, or along the banks of Peneus, for not I-remember well through where you-ran then jealous and in-love."
        ormsby: "but have a care, when thou shalt see her and salute her, that thou kiss not her face; for I shall be more jealous of thee than thou wert of that light-footed ingrate that made thee sweat and run so on the plains of Thessaly, or on the banks of the Peneus (for I do not exactly recollect where it was thou didst run on that occasion) in thy jealousy and love.”"
        ormsby_note: "I.e. Daphne."
        vocab:
          - {w: "guardarse", d: "to take care not to, beware of"}
          - {w: "dar paz en el rostro", d: "to kiss on the face (from the 'kiss of peace' given in church)"}
          - {w: "celos", d: "jealousy (always plural in this sense); 'tener celos de' = to be jealous of"}
          - {w: "ligero", d: "swift, light-footed; also fickle"}
          - {w: "ingrata", d: "ungrateful woman, the lady who does not return love"}
          - {w: "llano", d: "plain, flat land"}
          - {w: "Tesalia", d: "Thessaly, a region of northern Greece, scene of the myth of Apollo and Daphne"}
          - {w: "ribera", d: "bank of a river, riverside"}
          - {w: "Peneo", d: "the Peneus, a river of Thessaly; in Ovid the river god Peneus is Daphne's father"}
        diagram:
          - s: "pero guárdate"
            r: "main verb 1: but take care"
            under:
              - s: "que al verla y saludarla no le des paz en el rostro"
                r: "what to beware of: that when you see and greet her you do not kiss her face"
          - s: "que tendré más celos de ti"
            r: "why (after 'que', for): I shall be more jealous of you"
            under:
              - s: "que tú los tuviste de aquella ligera ingrata"
                r: "comparison: than you were of that swift ungrateful girl"
                under:
                  - s: "que tanto te hizo sudar y correr"
                    r: "describes 'ingrata': who made you sweat and run so much"
                    under:
                      - {s: "por los llanos de Tesalia, o por las riberas de Peneo", r: "where: over the plains of Thessaly or along the Peneus"}
          - s: "que no me acuerdo bien"
            r: "aside (after 'que', for): since I do not remember well"
            under:
              - {s: "por dónde corriste entonces celoso y enamorado", r: "what he does not remember: where you ran then, jealous and in love"}
        forms:
          - {w: "guárdate", f: "guarda + te → guardarse (to beware), imperative, you (tú), with 'te' on the end as on every positive command; accent added to keep the stress. The tú imperative of -ar verbs is like the 'he' present: guarda."}
          - {w: "al verla y saludarla", f: "al (a + el) + infinitive means 'on ...ing, when ...': ver (to see) and saludar (to greet), each with 'la' (her) hung on the end."}
          - {w: "le des", f: "d- + -es → dar (to give), present subjunctive, you (tú), with 'le' (to her). dé, des, dé, demos, deis, den. Subjunctive after 'guárdate que' (beware that)."}
          - {w: "tendré", f: "tendr- + -é → tener (to have), future, I. Irregular stem tendr-: tendré, tendrás, tendrá, tendremos, tendréis, tendrán."}
          - {w: "tuviste", f: "tuv- + -iste → tener (to have), preterite, you (tú). Irregular: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron. 'los' repeats 'celos': 'than you had them'."}
          - {w: "aquella ligera ingrata", f: "aquell- + -a → aquel (that), and ligera (swift), both feminine to match 'ingrata'."}
          - {w: "hizo", f: "hiz- + -o → hacer (to make), preterite, she: 'made (you sweat)'. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron. hacer (to make) + infinitive = to make someone do something."}
          - {w: "me acuerdo", f: "acuerd- + -o → acordarse (to remember), present, I, with 'me'. The stem o becomes ue when stressed: me acuerdo, te acuerdas, se acuerda, nos acordamos, os acordáis, se acuerdan."}
          - {w: "corriste", f: "corr- + -iste → correr (to run), preterite, you (tú). The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "celoso y enamorado", f: "masculine singular to match 'tú' (the sun, Apollo); enamorado is the participle of enamorar (to make fall in love)."}
        note: "In Ovid's Metamorphoses Apollo, the sun god, chased the nymph Daphne across Thessaly until she was turned into a laurel by the river Peneus. Don Quijote's show of not quite remembering where it happened is a comic touch of pedantry."
  - sentences:
      - es: "A este punto llegaba entonces don Quijote en su tan lastimero razonamiento, cuando la hija de la ventera le comenzó a cecear y a decirle:"
        literal: "To this point was-arriving then Don Quijote in his so pitiful discourse, when the daughter of the innkeeper's-wife to-him began to hiss and to say-to-him:"
        ormsby: "Don Quixote had got so far in his pathetic speech when the landlady’s daughter began to signal to him, saying,"
        ormsby_note: "Cecear, to call attention by making a hissing sound such as the Andalusians produce when they have to pronounce ce."
        vocab:
          - {w: "a este punto", d: "at this point, this far"}
          - {w: "lastimero", d: "pitiful, plaintive, mournful"}
          - {w: "razonamiento", d: "speech, discourse (not only 'reasoning')"}
          - {w: "cecear", d: "to go 'psst, psst' to catch someone's attention (literally, to lisp the s as th)"}
          - {w: "ventera", d: "the innkeeper's wife, the landlady"}
        diagram:
          - s: "A este punto llegaba entonces don Quijote"
            r: "main verb: Don Quijote had then reached this point"
            under:
              - {s: "en su tan lastimero razonamiento", r: "where: in his so mournful speech"}
              - s: "cuando la hija de la ventera le comenzó"
                r: "when: when the landlady's daughter began"
                under:
                  - {s: "a cecear y a decirle:", r: "what she began: to hiss 'psst' at him and say to him"}
        forms:
          - {w: "llegaba", f: "lleg- + -aba → llegar (to arrive, to reach), imperfect, he: 'was reaching, had got to'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. Imperfect for the scene in progress, then the preterite 'comenzó' for what interrupts it."}
          - {w: "tan lastimero", f: "tan (so) + lastimer- + -o → lastimero (pitiful), masculine to match 'razonamiento'."}
          - {w: "comenzó", f: "comenz- + -ó → comenzar (to begin), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (comencé, with z → c before e). comenzar a + infinitive = to begin to."}
          - {w: "decirle", f: "decir (to say) + le (to him), the pronoun hung on the infinitive after 'a'."}
  - sentences:
      - es: "— Señor mío, lléguese acá la vuestra merced si es servido."
        literal: "— Sir my, let-come-yourself here the your grace if you-are served."
        ormsby: "“Señor, come over here, please.”"
        vocab:
          - {w: "llegarse", d: "to come near, approach"}
          - {w: "acá", d: "over here, this way"}
          - {w: "la vuestra merced", d: "'your grace', with the old article before the possessive, an imitation of chivalric language"}
          - {w: "si es servido", d: "if you please, if it pleases you (literally 'if you are served')"}
        diagram:
          - s: "lléguese acá"
            r: "main verb: come over here"
            under:
              - {s: "Señor mío", r: "address: my lord"}
              - {s: "la vuestra merced", r: "subject: your grace (you)"}
              - {s: "si es servido", r: "condition: if you please"}
        forms:
          - {w: "Señor mío", f: "mi- + -o → mío (my), the long possessive placed after the noun: 'my lord', more polite and formal than 'mi señor'."}
          - {w: "lléguese", f: "llegu- + -e + se → llegarse (to come near), present subjunctive, you (vuestra merced takes the 'he/she' form), with 'se' on the end: a polite command. g becomes gu before e. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "la vuestra merced", f: "the article 'la' + possessive 'vuestra' + 'merced', an old-fashioned way of saying 'you'; the girl copies Don Quijote's own bookish style."}
          - {w: "es servido", f: "es (ser (to be), present, he: soy, eres, es, somos, sois, son) + servido, participle of servir (to serve): a set phrase, 'if you please'."}
        note: "The daughter speaks to him in his own antiquated chivalric manner, 'la vuestra merced', to keep up the game."
  - sentences:
      - es: "A cuyas señas y voz volvió don Quijote la cabeza, y vio, a la luz de la luna, que entonces estaba en toda su claridad, cómo le llamaban del agujero que a él le pareció ventana, y aun con rejas doradas, como conviene que las tengan tan ricos castillos como él se imaginaba que era aquella venta;"
        literal: "At whose signs and voice turned Don Quijote the head, and saw, by the light of the moon, which then was in all its brightness, how him they-were-calling from-the hole which to him to-him seemed window, and even with grilles gilded, as it-is-fitting that them may-have such rich castles as he himself imagined that was that inn;"
        ormsby: "At these signals and voice Don Quixote turned his head and saw by the light of the moon, which then was in its full splendour, that someone was calling to him from the hole in the wall, which seemed to him to be a window, and what is more, with a gilt grating, as rich castles, such as he believed the inn to be, ought to have;"
        vocab:
          - {w: "señas", d: "signs, signals, gestures"}
          - {w: "a la luz de la luna", d: "by the light of the moon"}
          - {w: "claridad", d: "brightness, clearness; 'en toda su claridad' = at its full"}
          - {w: "reja", d: "grille, iron grating over a window (the classic place for Spanish courtship)"}
          - {w: "dorado", d: "gilded, golden"}
          - {w: "convenir", d: "to be fitting, proper"}
          - {w: "imaginarse", d: "to imagine, fancy"}
        diagram:
          - s: "volvió don Quijote la cabeza"
            r: "main verb 1: Don Quijote turned his head"
            under:
              - {s: "A cuyas señas y voz", r: "why: at whose signals and voice (the girl's)"}
          - s: "y vio"
            r: "main verb 2: and he saw"
            under:
              - s: "a la luz de la luna"
                r: "how: by moonlight"
                under:
                  - {s: "que entonces estaba en toda su claridad", r: "describes 'luna': which was then full and bright"}
              - s: "cómo le llamaban del agujero"
                r: "what he saw: how they were calling him from the hole"
                under:
                  - s: "que a él le pareció ventana"
                    r: "describes 'agujero': which seemed to him a window"
                    under:
                      - s: "y aun con rejas doradas"
                        r: "and even (a window) with gilded grilles"
                        under:
                          - s: "como conviene que las tengan tan ricos castillos"
                            r: "comparison: as it is fitting such rich castles should have them"
                            under:
                              - {s: "como él se imaginaba que era aquella venta", r: "describes 'castillos': as he imagined that inn was"}
        forms:
          - {w: "cuyas", f: "cuy- + -as → cuyo (whose), feminine plural to match 'señas', the thing owned, not the owner."}
          - {w: "volvió", f: "volv- + -ió → volver (to turn), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "vio", f: "vi- + -o → ver (to see), preterite, he. vi, viste, vio, vimos, visteis, vieron."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, it (the moon). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "llamaban", f: "llam- + -aban → llamar (to call), imperfect, they (someone, unspecified). Same -aba imperfect: llamaba, llamabas, llamaba, llamábamos, llamabais, llamaban."}
          - {w: "a él le pareció", f: "parec- + -ió → parecer (to seem), preterite, it (the hole). The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron. 'a él' and 'le' both mean 'to him': Spanish doubles the pronoun for emphasis."}
          - {w: "doradas", f: "dor- + -adas → dorar (to gild), participle used as an adjective, feminine plural to match 'rejas'."}
          - {w: "conviene", f: "convien- + -e → convenir (to be fitting), present, it. Irregular like venir (to come): convengo, convienes, conviene, convenimos, convenís, convienen."}
          - {w: "tengan", f: "teng- + -an → tener (to have), present subjunctive, they (the castles), after 'conviene que'. tenga, tengas, tenga, tengamos, tengáis, tengan. 'las' stands for 'rejas'."}
          - {w: "se imaginaba", f: "imagin- + -aba → imaginarse (to imagine), imperfect, he, with 'se'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "era", f: "ser (to be), imperfect, it. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "aquella", f: "aquell- + -a → aquel (that), feminine to match 'venta'."}
      - es: "y luego en el instante se le representó en su loca imaginación que otra vez, como la pasada, la doncella fermosa, hija de la señora de aquel castillo, vencida de su amor, tornaba a solicitarle;"
