          - s: "es un hijo de un caballero"
            r: "main verb: is the son of a gentleman"
            under:
              - {s: "Este que canta", r: "subject: this one who is singing"}
              - {s: "señora mía", r: "aside: addressed to Dorotea, 'my lady'"}
              - s: "un caballero"
                r: "whose son"
                under:
                  - {s: "natural del reino de Aragón", r: "describes 'caballero': a native of Aragon"}
                  - {s: "señor de dos lugares", r: "describes 'caballero': lord of two villages"}
                  - s: "el cual vivía"
                    r: "describes 'caballero': who lived"
                    under:
                      - {s: "frontero de la casa de mi padre", r: "where: opposite my father's house"}
                      - {s: "en la Corte", r: "where: at Court, in Madrid"}
        forms:
          - {w: "Este", f: "'this (one)', masculine singular because it means the singer; used alone as a pronoun here, so it could also be written 'éste'."}
          - {w: "canta", f: "cant- + -a → cantar (to sing), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "mía", f: "mí- + -a → mío (my, mine), feminine to match 'señora'; placed after the noun it is the strong, affectionate form: 'señora mía' = my lady."}
          - {w: "es", f: "ser (to be), present, he: soy, eres, es, somos, sois, son."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
