summary: |
  Late at night in the inn, a voice outside sings a love song about a sailor steering by a distant star. Dorotea wakes the girl Clara, the judge's daughter, to hear it, but Clara begins to tremble and weep: the singer, everyone says, is a mule-boy, but Clara says he is 'lord of places' and of her soul. When a second song follows, about hope pressing on through impossibilities, she stops her ears.

  At Dorotea's urging Clara whispers the story. The singer is the son of a rich Aragonese gentleman who lived opposite her father's house at Court. He fell in love with her through the windows, with signs and tears, and promised marriage by joining his hands; she answered only by lifting the curtain to let him see her. When her father left for the Indies, the young man followed the party disguised as a mule-boy, hiding from her father. They have never spoken a word. Clara, not yet sixteen, fears his father will never accept her and says she will not marry behind her own father's back. Dorotea laughs at her childish way of talking and promises to help in the morning.

  Meanwhile the innkeeper's daughter and Maritornes decide to play a trick on Don Quijote, who is keeping guard outside on Rocinante and sighing to Dulcinea, the moon and the sun. From the hole of the hayloft the girl calls him; he takes it for a window with golden bars and the girl for the lovesick princess of the castle, and gallantly refuses her love but offers her his hand. Standing on Rocinante's saddle, he gives it; Maritornes slips a noose from Sancho's ass's halter round his wrist, ties the other end to the bolt of the loft door, and the two run off laughing.

  Don Quijote spends the rest of the night tied up, sure that he is enchanted, calling on Amadís's sword, the sages Lirgandeo and Alquife, and his friend Urganda, and bellowing like a bull by dawn. At daybreak four armed horsemen knock at the inn gate. Don Quijote, still on watch, tells them a castle does not open before sunrise, and argues with them about whether it is an inn. When one of their horses comes to sniff Rocinante, Rocinante moves, Don Quijote's feet slip off the saddle, and he is left hanging by the wrist with his toes just touching the ground, like a prisoner under the strappado.
context: |
  The judge's household. Clara is the daughter of the judge (oidor) who arrived at the inn in the previous chapter with his household on his way to a post in the Americas; his brother is the captive whose story fills chapters 39 to 41. A judge of an American audiencia was a figure of real wealth and standing, which makes Clara's fear telling: the boy's father, she says, will think her not good enough even to be his son's servant. A rich young lover in servant's disguise is a familiar device of the Spanish stage and of the Italian-style novella. The four armed riders at dawn, with muskets across their saddle-bows, belong to the same world of real travel: Ormsby renders their 'escopetas' as 'firelocks'.

  The songs and the lovers. The first song is a ballad stanza of the courtly kind, built on the old image of the lover as a sailor steering by a star; Ormsby notes that he tried to imitate its assonant rhyme, and that the 'clara estrella' of the last stanza is a play on Clara's own name. Palinurus is the helmsman of Aeneas in Virgil, who watched the stars as he steered. The second song is in stanzas of mixed long and short lines on the theme that love is worth what it costs; Ormsby traces one line to a proverb. Clara's story, told in a childish rush, is a small comic love-romance set against the larger ones of Cardenio, Dorotea and the captive.

  Chivalry parodied. Don Quijote's night speech to Dulcinea is a pastiche of the romances, with its archaic 'fará' and 'la tu merced', and its apostrophes to the moon ('luminary of the three faces', the triple goddess Diana-Luna-Hecate, as Ormsby's note from Virgil shows) and to the sun, who once ran jealous after the nymph Daphne in Thessaly. The scene at the loft hole repeats in reverse his first night at this inn (chapter 16), when he took Maritornes, on her way to the carrier, for the lovesick daughter of the lord of the castle. Ormsby notes that Lirgandeo and Alquife are magicians from the romances (he places them in The Knight of Phoebus; Alquife also appears, as Urganda's husband, in the later sequels of Amadís), and Urganda the Unknown is the sorceress who protects Amadís. Don Quijote himself states the rule of the genre that an adventure that fails is reserved for another knight.

  The narrator's games. The narrator calls the two girls 'semidoncellas', half-maidens, and keeps a straight face as Don Quijote offers 'the executioner of the evil-doers of the world' for inspection, asking that his hand be admired for its sinews and veins rather than kissed. The traveller's joke that the 'sceptre' belongs on the head and the 'crown' in the hand turns royalty into a beating, and his guess that the inn holds a company of strolling players, with pasteboard crowns, is the realistic explanation of Don Quijote's kings and queens. Ormsby points out an inconsistency: a man tied tightly while standing on his horse could not fall almost to the ground, and Cervantes, he thinks, never gave it a thought.

  Law and punishment. The chapter ends on an image every early reader knew: the 'tormento de la garrucha', the strappado, in which a prisoner was hoisted by the wrists on a pulley. Hung 'a toca, no toca', with the toes just brushing the floor, the victim wore himself out trying to stand. Ormsby finds 'something almost ghastly' in the comparison. Judicial torture was a normal part of criminal procedure in Habsburg Spain.

  Reading Cervantes' Spanish. The archaisms of the chapter: mesmo and mesma (mismo), deste and della (de este, de ella), estraño and estremo (extraño, extremo), fermosa and ferida with the old f- for h-, fará (hará), agora (ahora), asaz (enough), priesa (prisa), denantes (before), do (where), trujera (trajera), ansí (así), and infinitives with the pronoun assimilated, dejalle, dalle, comunicallo, conocelle, hacelle, oílle, velle, where -rl- has become -ll-. Don Quijote's courtly speech uses the old -ades and -edes forms (hayades, pidiésedes) and 'la tu merced' with the article. Pronouns hang on the end of verbs that open a clause (Conocíle, admiréme y alegréme, engañóse, Cansábanse, fatigábase y estirábase). The -ra form of the subjunctive serves as a conditional (fuera, dieran, trujera), 'haber de' means 'must', 'deber de' gives a guess, and the infinitive is used as a noun in the run of 'allí fue el desear ..., allí fue el maldecir ...'. Watch the false friends: suceso (event), ignorar (not to know), resentirse (to respond), discurso (reasoning), and planta (sole of the foot).
