              - s: "qué era lo que le quería decir denantes"
                r: "object: what it was she had wanted to tell her before"
        forms:
          - {w: "volvió a preguntar", f: "volv- + -ió → volver (to turn, here 'to do again'), preterite, she, + a preguntar (to ask). The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "era", f: "ser (to be), imperfect, it. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "quería", f: "quer- + -ía → querer (to want), imperfect, she (Clara). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "denantes", f: "old form of antes (before), from 'de' + 'enantes'."}
      - es: "Entonces Clara, temerosa de que Luscinda no la oyese, abrazando estrechamente a Dorotea, puso su boca tan junto del oído de Dorotea, que seguramente podía hablar sin ser de otro sentida, y así le dijo:"
        literal: "Then Clara, fearful of that Luscinda [not] her might-hear, embracing tightly [to] Dorotea, put her mouth so close to-the ear of Dorotea, that safely she-could speak without being by another heard, and so to-her she-said:"
        ormsby: "On this Clara, afraid that Luscinda might overhear her, winding her arms tightly round Dorothea put her mouth so close to her ear that she could speak without fear of being heard by anyone else, and said:"
        vocab:
          - {w: "temeroso de que", d: "afraid that, fearing that"}
          - {w: "no", d: "after a verb of fearing this 'no' adds nothing: 'temerosa de que no la oyese' = afraid that she might hear her"}
          - {w: "junto de", d: "close to, next to"}
          - {w: "seguramente", d: "safely, without risk (not 'surely')"}
          - {w: "sentir", d: "here to hear, notice: 'ser sentida' = to be heard"}
          - {w: "de otro", d: "by anyone else ('de' = by, in an old passive)"}
        diagram:
          - s: "puso su boca"
            r: "main verb 1: she put her mouth"
            under:
              - {s: "Entonces Clara", r: "when + subject: then Clara"}
              - {s: "temerosa de que Luscinda no la oyese", r: "why: afraid that Luscinda might hear her"}
              - {s: "abrazando estrechamente a Dorotea", r: "how: hugging Dorotea tightly"}
              - s: "tan junto del oído de Dorotea"
                r: "where: so close to Dorotea's ear"
                under:
                  - {s: "que seguramente podía hablar sin ser de otro sentida", r: "result: that she could speak safely without being heard by anyone else"}
          - {s: "y así le dijo:", r: "main verb 2: and so she said to her"}
        forms:
          - {w: "temerosa", f: "temeros- + -a → temeroso (afraid), feminine to match 'Clara'."}
          - {w: "oyese", f: "oy- + -ese → oír (to hear), imperfect subjunctive (-se form), she (Luscinda). oyese, oyeses, oyese, oyésemos, oyeseis, oyesen. Subjunctive after 'temerosa de que' (afraid that)."}
          - {w: "abrazando", f: "gerund of abrazar (to embrace): 'hugging'; 'a Dorotea' takes the personal a."}
          - {w: "puso", f: "pus- + -o → poner (to put), preterite, she. Irregular: puse, pusiste, puso, pusimos, pusisteis, pusieron."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
          - {w: "seguramente", f: "segur- + -a + -mente → seguro (safe) + -mente, the adverb ending added to the feminine: 'safely'."}
          - {w: "podía", f: "pod- + -ía → poder (to be able), imperfect, she. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "sentida", f: "sent- + -ida → sentir (to hear), participle, feminine to match Clara; 'ser sentida' = to be heard (passive)."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, she. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
        note: "Luscinda, Cardenio's beloved, reunited with him a few chapters earlier, is sleeping in the same room. Clara does not want a stranger to hear the secret she is about to tell."
  - sentences:
