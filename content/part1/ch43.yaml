          - {w: "Maritornes", d: "the Asturian serving-maid of the inn, who in chapter 16 stumbled in the dark into Don Quijote's bed"}
          - {w: "criada", d: "maidservant"}
          - {w: "humor", d: "humour in the old medical sense: temperament, the 'humour' or madness that rules him"}
          - {w: "pecar de", d: "to suffer from a fault, be given to (literally 'to sin of')"}
          - {w: "hacer la guarda", d: "to stand guard, keep watch"}
          - {w: "determinar de", d: "to decide to (old use with 'de'; modern 'determinar' + infinitive)"}
          - {w: "hacelle", d: "= hacerle, to make him / to play on him (old -rl- → -ll-)"}
          - {w: "burla", d: "trick, practical joke, prank"}
          - {w: "a lo menos", d: "at least (modern 'al menos' or 'por lo menos')"}
          - {w: "disparates", d: "nonsense, absurdities, crazy talk"}
        diagram:
          - s: "solamente no dormían"
            r: "main verb 1: only ... were not asleep"
            under:
              - {s: "la hija de la ventera y Maritornes, su criada", r: "subject: the landlady's daughter and her maid Maritornes"}
          - s: "las cuales"
            r: "who (the two of them), subject of the next verb"
            under:
              - s: "como ya sabían el humor"
                r: "why: since they already knew the madness"
                under:
                  - {s: "de que pecaba don Quijote", r: "describes 'humor': that Don Quijote suffered from"}
                  - {s: "y que estaba fuera de la venta armado y a caballo haciendo la guarda", r: "what they knew, 2: and that he was outside, armed and mounted, keeping guard"}
              - s: "determinaron las dos"
                r: "main verb 2: the two decided"
                under:
                  - {s: "de hacelle alguna burla", r: "what they decided, 1: to play some trick on him"}
                  - s: "o, a lo menos, de pasar un poco el tiempo"
                    r: "what they decided, 2: or at least to pass the time a little"
                    under:
                      - {s: "oyéndole sus disparates", r: "how: listening to his nonsense"}
        forms:
          - {w: "dormían", f: "dorm- + -ían → dormir (to sleep), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían. Plural because there are two subjects, the daughter and Maritornes."}
          - {w: "las cuales", f: "'who', feminine plural to match the two women; a heavier relative than 'que', used after a comma."}
          - {w: "sabían", f: "sab- + -ían → saber (to know), imperfect, they. Same -ía imperfect: sabía, sabías, sabía, sabíamos, sabíais, sabían."}
          - {w: "pecaba, estaba", f: "pec- + -aba → pecar (to sin, to suffer from), and est- + -aba → estar (to be), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "armado", f: "arm- + -ado → armar (to arm), participle used as an adjective, masculine to match 'don Quijote': 'in armour'."}
          - {w: "haciendo", f: "gerund of hacer (to make, to do): 'keeping (guard)'."}
          - {w: "determinaron", f: "determin- + -aron → determinar (to decide), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "hacelle", f: "hacer (to make, to do) + le (on him), with the -r of the infinitive turned into -l- before the pronoun: hacerle → hacelle, an old sound change common in Cervantes. Infinitive after 'determinaron de'."}
          - {w: "alguna", f: "algun- + -a → alguno (some), feminine to match 'burla'."}
          - {w: "oyéndole", f: "gerund of oír (to hear) + le (from him), with an accent added to keep the stress: oyendo → oyéndole. The i of oír becomes y between vowels."}
          - {w: "sus disparates", f: "sus = plural to match 'disparates', not the owner: 'his nonsense'."}
  - sentences:
      - es: "Es, pues, el caso que en toda la venta no había ventana que saliese al campo, sino un agujero de un pajar, por donde echaban la paja por defuera."
        literal: "It-is, then, the case that in all the inn not there-was window that might-go-out to-the field, but a hole of a straw-loft, through where they-threw the straw from outside."
        ormsby: "As it so happened there was not a window in the whole inn that looked outwards except a hole in the wall of a straw-loft through which they used to throw out the straw."
        vocab:
          - {w: "es el caso que", d: "the fact is that, it so happens that (a storyteller's formula)"}
          - {w: "salir a", d: "of a window: to open onto, look out on"}
          - {w: "campo", d: "the open country, the outside"}
          - {w: "agujero", d: "hole"}
          - {w: "pajar", d: "hayloft, straw-loft"}
          - {w: "echar", d: "to throw, toss"}
          - {w: "por defuera", d: "= por de fuera, from outside (old form 'defuera')"}
        diagram:
          - s: "Es, pues, el caso"
            r: "main verb: the fact is, then"
            under:
              - s: "que en toda la venta no había ventana"
                r: "what the fact is: that there was no window in the whole inn"
                under:
                  - {s: "que saliese al campo", r: "describes 'ventana': that opened onto the outside"}
                  - s: "sino un agujero de un pajar"
                    r: "except: only a hole in a straw-loft"
                    under:
                      - {s: "por donde echaban la paja por defuera", r: "describes 'agujero': through which they threw in the straw from outside"}
        forms:
          - {w: "Es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "había", f: "hab- + -ía → haber (there to be), imperfect, 'there was'. Same form for singular and plural; the imperfect of -er verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "saliese", f: "sal- + -iese → salir (to go out, to open onto), imperfect subjunctive (-se form), it: 'that might open onto'. Subjunctive because the window does not exist ('no había ventana que...'). The -se imperfect subjunctive of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen."}
          - {w: "al", f: "a + el, 'to the'."}
          - {w: "echaban", f: "ech- + -aban → echar (to throw), imperfect, they (people in general), a habit: 'they used to throw'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "defuera", f: "= de fuera (from outside), written as one word in Cervantes."}
        note: "Ormsby reads 'echaban la paja por defuera' as throwing the straw out; it may equally mean the straw was pitched in from outside. Either way the only opening is a rough hole, which Don Quijote will take for a castle window."
      - es: "A este agujero se pusieron las dos semidoncellas, y vieron que don Quijote estaba a caballo, recostado sobre su lanzón, dando de cuando en cuando tan dolientes y profundos suspiros que parecía, que con cada uno se le arrancaba el alma."
        literal: "At this hole themselves placed the two half-maidens, and they-saw that Don Quijote was on horse, leaning upon his big-lance, giving from when to when so doleful and deep sighs that it-seemed, that with each one to-him was-torn-out the soul."
        ormsby: "At this hole the two demi-damsels posted themselves, and observed Don Quixote on his horse, leaning on his pike and from time to time sending forth such deep and doleful sighs, that he seemed to pluck up his soul by the roots with each of them;"
        vocab:
          - {w: "semidoncellas", d: "'half-maidens', demi-damsels: a joke on 'doncella' (maiden, virgin) and on how far from maidens these two are"}
          - {w: "recostado", d: "leaning, reclining"}
          - {w: "lanzón", d: "a big, heavy lance or pike (augmentative of 'lanza')"}
          - {w: "de cuando en cuando", d: "from time to time, now and then"}
          - {w: "doliente", d: "doleful, sorrowful, full of pain"}
          - {w: "suspiro", d: "sigh"}
          - {w: "arrancarse el alma", d: "to have one's soul torn out, i.e. to sigh as if one's soul were coming out with the breath"}
        diagram:
          - s: "se pusieron las dos semidoncellas"
            r: "main verb 1: the two demi-damsels stationed themselves"
            under:
              - {s: "A este agujero", r: "where: at this hole"}
          - s: "y vieron"
            r: "main verb 2: and they saw"
            under:
              - s: "que don Quijote estaba a caballo"
                r: "what they saw: that Don Quijote was on horseback"
                under:
                  - {s: "recostado sobre su lanzón", r: "how: leaning on his pike"}
                  - s: "dando de cuando en cuando tan dolientes y profundos suspiros"
                    r: "how, 2: heaving such doleful, deep sighs now and then"
                    under:
                      - {s: "que parecía, que con cada uno se le arrancaba el alma", r: "result: that it seemed his soul was being torn out with each one"}
        forms:
          - {w: "se pusieron", f: "pus- + -ieron → ponerse (to place oneself), preterite, they. Irregular: me puse, te pusiste, se puso, nos pusimos, os pusisteis, se pusieron."}
          - {w: "vieron", f: "vi- + -eron → ver (to see), preterite, they. vi, viste, vio, vimos, visteis, vieron."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "recostado", f: "recost- + -ado → recostar (to lean), participle used as an adjective, masculine to match 'don Quijote'."}
          - {w: "lanzón", f: "lanz(a) + -ón: the suffix -ón makes things bigger: lanza (lance) → lanzón (big lance)."}
          - {w: "dando", f: "gerund of dar (to give): 'giving, heaving (sighs)'."}
          - {w: "dolientes", f: "doliente (doleful), plural to match 'suspiros'; the -iente ending comes from doler (to hurt)."}
          - {w: "parecía", f: "parec- + -ía → parecer (to seem), imperfect, it. The imperfect of -er verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "se le arrancaba", f: "arranc- + -aba → arrancar (to tear out), imperfect, it (the soul), with 'se' making it passive and 'le' (from him): 'his soul was torn out of him'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
        note: "The comma in 'parecía, que' is Gutenberg's punctuation; read straight through: 'it seemed that with each one his soul was torn out'."
      - es: "Y asimesmo oyeron que decía con voz blanda, regalada y amorosa:"
        literal: "And likewise they-heard that he-was-saying with voice soft, delicate and loving:"
        ormsby: "and they could hear him, too, saying in a soft, tender, loving tone,"
        vocab:
          - {w: "asimesmo", d: "= asimismo, likewise, also (old spelling with 'mesmo')"}
          - {w: "blando", d: "soft, gentle"}
          - {w: "regalado", d: "delicate, sweet, tender (from 'regalar', to pamper, delight)"}
          - {w: "amoroso", d: "loving, amorous"}
        diagram:
          - s: "Y asimesmo oyeron"
            r: "main verb: and likewise they heard"
            under:
              - s: "que decía"
                r: "what they heard: that he was saying"
                under:
                  - {s: "con voz blanda, regalada y amorosa:", r: "how: in a soft, tender, loving voice"}
        forms:
          - {w: "asimesmo", f: "= asimismo (likewise), built from así (so) + mesmo, the old form of mismo (same)."}
          - {w: "oyeron", f: "oy- + -eron → oír (to hear), preterite, they. Irregular, i turns to y between vowels: oí, oíste, oyó, oímos, oísteis, oyeron."}
          - {w: "decía", f: "dec- + -ía → decir (to say), imperfect, he: 'he was saying'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "blanda, regalada, amorosa", f: "all feminine to match 'voz'; regalada is the participle of regalar (to delight) used as an adjective."}
  - sentences:
      - es: "— ¡Oh mi señora Dulcinea del Toboso, estremo de toda hermosura, fin y remate de la discreción, archivo del mejor donaire, depósito de la honestidad, y, ultimadamente, idea de todo lo provechoso, honesto y deleitable que hay en el mundo! Y ¿qué fará agora la tu merced?"
        literal: "— Oh my lady Dulcinea del Toboso, extreme of all beauty, end and crowning of the discretion, archive of-the best grace, deposit of the modesty, and, lastly, idea of all the profitable, virtuous and delightful that there-is in the world! And what will-be-doing now the your grace?"
        ormsby: "“Oh my lady Dulcinea del Toboso, perfection of all beauty, summit and crown of discretion, treasure house of grace, depositary of virtue, and finally, ideal of all that is good, honourable, and delectable in this world! What is thy grace doing now?"
        vocab:
          - {w: "estremo", d: "= extremo, the extreme, the height, the very peak (old spelling)"}
          - {w: "fin y remate", d: "end and crowning touch, the summit and perfection (a doubled phrase, both words meaning 'the finishing point')"}
          - {w: "discreción", d: "good sense, wit, intelligence (false friend: not 'discretion' in the sense of tact)"}
          - {w: "archivo", d: "archive, storehouse"}
          - {w: "donaire", d: "grace, charm, elegance; also wit"}
          - {w: "depósito", d: "depository, store where something is kept safe"}
          - {w: "honestidad", d: "chastity, modesty, virtue (not 'honesty')"}
          - {w: "ultimadamente", d: "lastly, finally (an unusual adverb; modern 'últimamente' means 'lately')"}
          - {w: "idea", d: "ideal, the perfect pattern of something, in the Platonic sense"}
          - {w: "provechoso", d: "profitable, beneficial, good"}
          - {w: "deleitable", d: "delightful, pleasing"}
          - {w: "fará", d: "= hará, 'will do', with the old f- of chivalric romance (Latin facere)"}
          - {w: "agora", d: "= ahora, now (old form)"}
          - {w: "la tu merced", d: "'thy grace', an old-fashioned form of address with the article before the possessive, as in the romances of chivalry"}
        diagram:
          - s: "¡Oh mi señora Dulcinea del Toboso"
            r: "address: oh my lady Dulcinea del Toboso"
            under:
              - {s: "estremo de toda hermosura", r: "title 1: the height of all beauty"}
              - {s: "fin y remate de la discreción", r: "title 2: the summit of good sense"}
              - {s: "archivo del mejor donaire", r: "title 3: storehouse of the finest grace"}
              - {s: "depósito de la honestidad", r: "title 4: treasury of chastity"}
              - s: "y, ultimadamente, idea de todo lo provechoso, honesto y deleitable"
                r: "title 5: and lastly the ideal of all that is good, virtuous and delightful"
                under:
                  - {s: "que hay en el mundo!", r: "describes 'todo lo ...': that there is in the world"}
          - s: "Y ¿qué fará agora"
            r: "main verb: and what will you be doing now?"
            under:
              - {s: "la tu merced", r: "subject: thy grace"}
        forms:
          - {w: "estremo", f: "old spelling of extremo (extreme): Cervantes often writes s for x before a consonant (estraño, estremo)."}
          - {w: "del", f: "de + el, 'of the'."}
          - {w: "toda", f: "tod- + -a → todo (all), feminine to match 'hermosura'."}
          - {w: "mejor", f: "the irregular comparative of bueno (good): 'best' here, with the article 'el' inside 'del'."}
          - {w: "ultimadamente", f: "ultimad(a) + -mente: the feminine adjective ultimado (finished, final) + -mente, the ending that turns adjectives into adverbs."}
          - {w: "lo provechoso, honesto y deleitable", f: "lo + masculine adjective makes an abstract noun: 'what is profitable, virtuous and delightful'."}
          - {w: "hay", f: "from haber (there to be), 'there is', the special present form used for existence."}
          - {w: "fará", f: "far- + -á → facer (to do), the old form of hacer (to do), future, it (your grace): 'what will you be doing', a future of guess about the present. Old f- for modern h-, in imitation of the romances. hacer (to do) in the future: haré, harás, hará, haremos, haréis, harán."}
          - {w: "la tu merced", f: "the article 'la' + the possessive 'tu' + noun, an old pattern ('la tu merced' = 'thy grace') that modern Spanish has dropped; 'tu' is the familiar 'your'."}
        note: "Don Quijote speaks to the absent Dulcinea in the old chivalric style he uses for solemn moments, with the f- of 'fará' and 'la tu merced' copied from the romances of chivalry."
      - es: "¿Si tendrás por ventura las mientes en tu cautivo caballero, que a tantos peligros, por sólo servirte, de su voluntad ha querido ponerse?"
        literal: "Whether you-will-have by chance the minds on your captive knight, who to so-many dangers, for only to-serve-you, of his will has wanted to-put-himself?"
        ormsby: "Art thou, perchance, mindful of thy enslaved knight who of his own free will hath exposed himself to so great perils, and all to serve thee?"
        vocab:
          - {w: "¿si ...?", d: "'I wonder whether ...?': a question opening with 'si' expresses doubt or wondering"}
          - {w: "por ventura", d: "perchance, by any chance (literary)"}
          - {w: "tener las mientes en", d: "to have one's mind on, think of; 'mientes' (minds, thoughts) is an archaic word kept in old phrases"}
          - {w: "cautivo", d: "captive: a lover captured by his lady, a commonplace of courtly love"}
          - {w: "de su voluntad", d: "of his own free will"}
          - {w: "ponerse a", d: "here: to expose oneself to (dangers)"}
        diagram:
          - s: "¿Si tendrás"
            r: "main verb: I wonder if you have"
            under:
              - {s: "por ventura", r: "how: by any chance"}
              - {s: "las mientes", r: "object: your thoughts"}
              - s: "en tu cautivo caballero"
                r: "where: on your captive knight"
                under:
                  - s: "que a tantos peligros"
                    r: "describes 'caballero': who to so many dangers"
                    under:
                      - {s: "por sólo servirte", r: "why: only to serve you"}
                      - {s: "de su voluntad", r: "how: of his own free will"}
                      - {s: "ha querido ponerse?", r: "verb of the clause: has chosen to expose himself"}
        forms:
          - {w: "tendrás", f: "tendr- + -ás → tener (to have), future, you (tú, to Dulcinea): a future of wondering, 'can you be having?'. Irregular stem tendr-: tendré, tendrás, tendrá, tendremos, tendréis, tendrán."}
          - {w: "tu", f: "the familiar 'your', for tú; Don Quijote addresses the absent Dulcinea as tú, as lovers do in poetry."}
          - {w: "tantos", f: "tant- + -os → tanto (so many), masculine plural to match 'peligros'."}
          - {w: "servirte", f: "servir (to serve) + te (you), the pronoun hung on the infinitive after 'por sólo'."}
          - {w: "ha querido ponerse", f: "h- + -a → haber (to have, the helper verb), present, he: he, has, ha, hemos, habéis, han; + querido, participle of querer (to want): present perfect, 'has wanted, has chosen'; then ponerse, poner (to put) + se (himself) = ponerse (to expose oneself), infinitive after querido: 'to expose himself'."}
      - es: "Dame tú nuevas della, ¡oh luminaria de las tres caras!"
        literal: "Give-me you news of-her, oh luminary of the three faces!"
        ormsby: "Give me tidings of her, oh luminary of the three faces!"
        ormsby_note: "\"Tria virginis ora Dianae.\" (Aeneid iv 511)"
        vocab:
          - {w: "nuevas", d: "news, tidings (plural noun, literary)"}
          - {w: "della", d: "= de ella, of her (old contraction)"}
          - {w: "luminaria", d: "luminary, heavenly light"}
          - {w: "luminaria de las tres caras", d: "the moon, as the three-faced goddess: Luna in the sky, Diana on earth, Hecate in the underworld (also the moon's three phases)"}
        diagram:
          - s: "Dame tú nuevas"
            r: "main verb: give me news"
            under:
              - {s: "della", r: "about whom: about her"}
              - {s: "¡oh luminaria de las tres caras!", r: "address: oh three-faced light (the moon)"}
        forms:
          - {w: "Dame", f: "da + me → dar (to give), imperative, you (tú), with 'me' (to me) stuck on the end, as pronouns always are on a positive command. The tú imperative of dar (to give): da."}
          - {w: "tú", f: "subject pronoun 'you', added for emphasis after the command: 'you, give me'. The accent separates it from 'tu' (your)."}
          - {w: "della", f: "= de ella (of her), the old contraction of de + ella."}
        note: "He now turns from Dulcinea to the moon, which is shining in full above the inn. The 'three faces' come from Virgil's phrase about the three-formed Diana, as Ormsby notes."
      - es: "Quizá con envidia de la suya la estás ahora mirando;"
        literal: "Perhaps with envy of the hers her you-are now looking-at;"
        ormsby: "Perhaps at this moment, envious of hers, thou art regarding her,"
