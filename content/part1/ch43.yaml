        forms:
          - {w: "Habláis", f: "habl- + -áis → hablar (to speak), present, you (vos, polite). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. Dorotea now addresses Clara as 'señora' and 'vos', more formally than before."}
          - {w: "puedo", f: "pued- + -o → poder (to be able), present, I. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "entenderos", f: "entender (to understand) + os (you), the pronoun hung on the infinitive."}
          - {w: "declaraos", f: "declarad + os → declararse (to explain oneself), imperative, you (vos): the -d of 'declarad' drops before 'os'. The vosotros/vos imperative swaps the final -r of the infinitive for -d: declarad, comed, decid."}
          - {w: "decidme", f: "decid + me → decir (to say), imperative, you (vos), with 'me' (to me) on the end: 'tell me'."}
          - {w: "decís", f: "dec- + -ís → decir (to say), present, you (vos). Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "deste", f: "de + este (this), contracted as was common then; modern 'de este'."}
