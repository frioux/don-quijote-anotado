  - sentences:
      - es: "— Sola una de vuestras hermosas manos —dijo Maritornes—, por poder deshogar con ella el gran deseo que a este agujero la ha traído, tan a peligro de su honor que si su señor padre la hubiera sentido, la menor tajada della fuera la oreja."
        literal: "— Only one of your beautiful hands —said Maritornes—, for to-be-able to-vent with it the great desire which to this hole her has brought, so at risk of her honour that if her lord father her had heard, the smallest slice of-her would-have-been the ear."
        ormsby: "“Only one of your fair hands,” said Maritornes, “to enable her to vent over it the great passion which has brought her to this loophole, so much to the risk of her honour; for if the lord her father had heard her, the least slice he would cut off her would be her ear.”"
        vocab:
          - {w: "deshogar", d: "= desahogar, to vent, relieve, give outlet to (a feeling)"}
          - {w: "a peligro de", d: "at the risk of"}
          - {w: "sentir", d: "here 'to hear, notice' (not 'to feel')"}
          - {w: "tajada", d: "slice, cut (as of meat)"}
          - {w: "della", d: "= de ella, of her (old contraction)"}
        diagram:
          - s: "Sola una de vuestras hermosas manos"
            r: "answer (verb understood 'she needs'): only one of your beautiful hands"
            under:
              - s: "por poder deshogar con ella el gran deseo"
                r: "why: so she can vent on it the great desire"
                under:
                  - s: "que a este agujero la ha traído"
                    r: "describes 'deseo': which has brought her to this hole"
                    under:
                      - s: "tan a peligro de su honor"
                        r: "how: so much at risk to her honour"
                        under:
                          - s: "que si su señor padre la hubiera sentido"
                            r: "result, condition: that if her lord father had heard her"
                            under:
                              - {s: "la menor tajada della fuera la oreja", r: "result: the smallest slice off her would have been her ear"}
          - {s: "dijo Maritornes", r: "frame verb: said Maritornes"}
        forms:
          - {w: "Sola", f: "sol- + -a → solo (only, single), feminine to match 'una (mano)'."}
          - {w: "vuestras hermosas", f: "vuestr- + -as → vuestro (your), and hermos- + -as → hermoso (beautiful), feminine plural to match 'manos'."}
          - {w: "deshogar", f: "old spelling of desahogar (to vent), infinitive after 'poder'."}
          - {w: "ha traído", f: "h- + -a → haber (to have, the helper verb), present, it (the desire): he, has, ha, hemos, habéis, han; + traído, participle of traer (to bring): 'has brought'. 'la' is the object, 'her'."}
          - {w: "hubiera sentido", f: "hub- + -iera → haber (to have, the helper verb), imperfect subjunctive (-ra form), he; + sentido, participle of sentir (to hear): pluperfect subjunctive, 'had heard'. haber (to have) in the -ra subjunctive: hubiera, hubieras, hubiera, hubiéramos, hubierais, hubieran. Used after 'si' for an unreal past condition."}
          - {w: "menor", f: "the irregular comparative of pequeño (small): with 'la', 'the smallest'."}
          - {w: "della", f: "= de ella (of her), the old contraction."}
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), it, used as a conditional: 'would have been'. fuera, fueras, fuera, fuéramos, fuerais, fueran. Cervantes often uses the -ra form where modern Spanish puts the conditional ('habría sido')."}
        note: "'The smallest slice would be the ear' is a joking threat in the style of comedies: the angry father would cut her to pieces, and an ear is the least of it."
  - sentences:
      - es: "— ¡Ya quisiera yo ver eso! —respondió don Quijote—; pero él se guardará bien deso, si ya no quiere hacer el más desastrado fin que padre hizo en el mundo, por haber puesto las manos en los delicados miembros de su enamorada hija."
        literal: "— Now would-like I to-see that! —answered Don Quijote—; but he himself will-guard well of-that, if now not he-wants to-make the most disastrous end that father made in the world, for to-have put the hands on the delicate limbs of his enamoured daughter."
        ormsby: "“I should like to see that tried,” said Don Quixote; “but he had better beware of that, if he does not want to meet the most disastrous end that ever father in the world met for having laid hands on the tender limbs of a love-stricken daughter.”"
        vocab:
          - {w: "¡ya quisiera yo ver eso!", d: "I'd like to see that! (a challenge: just let him try)"}
          - {w: "guardarse de", d: "to take care not to, beware of"}
          - {w: "deso", d: "= de eso, of that (old contraction)"}
          - {w: "si ya no", d: "unless (old phrase, = 'a no ser que')"}
          - {w: "hacer fin", d: "to come to an end, meet an end"}
          - {w: "desastrado", d: "disastrous, wretched, ill-starred"}
          - {w: "miembros", d: "limbs"}
          - {w: "enamorado", d: "in love, love-struck"}
        diagram:
          - s: "¡Ya quisiera yo ver eso!"
            r: "main verb 1: I would like to see that!"
          - {s: "—respondió don Quijote—", r: "frame verb: answered Don Quijote"}
          - s: "pero él se guardará bien deso"
            r: "main verb 2: but he will take good care not to"
            under:
              - s: "si ya no quiere hacer el más desastrado fin"
                r: "condition: unless he wants to meet the most disastrous end"
                under:
                  - {s: "que padre hizo en el mundo", r: "describes 'fin': that any father ever met in the world"}
                  - {s: "por haber puesto las manos en los delicados miembros de su enamorada hija", r: "why: for having laid hands on the delicate limbs of his love-struck daughter"}
        forms:
          - {w: "quisiera", f: "quis- + -iera → querer (to want), imperfect subjunctive (-ra form), I, used as a softened 'would like'. quisiera, quisieras, quisiera, quisiéramos, quisierais, quisieran."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "se guardará", f: "guardar- + -á → guardarse (to beware), future, he, with 'se'. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "deso", f: "= de eso (of that), the old contraction."}
          - {w: "quiere", f: "quier- + -e → querer (to want), present, he. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "el más desastrado", f: "el + más + adjective = the superlative, 'the most disastrous'; desastrado is masculine to match 'fin'."}
          - {w: "hizo", f: "hiz- + -o → hacer (to make), preterite, he (any father). Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "haber puesto", f: "haber (to have) + puesto, irregular participle of poner (to put): the perfect infinitive, 'to have put', after 'por' (for)."}
          - {w: "delicados, enamorada", f: "delicad- + -os → delicado (delicate), masculine plural to match 'miembros'; enamorad- + -a → enamorado (in love), feminine to match 'hija'."}
  - sentences:
      - es: "Parecióle a Maritornes que sin duda don Quijote daría la mano que le habían pedido, y, proponiendo en su pensamiento lo que había de hacer, se bajó del agujero y se fue a la caballeriza, donde tomó el cabestro del jumento de Sancho Panza, y con mucha presteza se volvió a su agujero, a tiempo que don Quijote se había puesto de pies sobre la silla de Rocinante, por alcanzar a la ventana enrejada, donde se imaginaba estar la ferida doncella; y, al darle la mano, dijo:"
        literal: "It-seemed-to-her to Maritornes that without doubt Don Quijote would-give the hand that of-him they-had asked, and, proposing in her thought that which she-had to do, herself she-got-down from-the hole and herself went to the stable, where she-took the halter of-the donkey of Sancho Panza, and with much speed herself returned to her hole, at time that Don Quijote himself had put on feet upon the saddle of Rocinante, for to-reach to the window grated, where he-imagined to-be the wounded maiden; and, on-the giving-her the hand, he-said:"
        ormsby: "Maritornes felt sure that Don Quixote would present the hand she had asked, and making up her mind what to do, she got down from the hole and went into the stable, where she took the halter of Sancho Panza’s ass, and in all haste returned to the hole, just as Don Quixote had planted himself standing on Rocinante’s saddle in order to reach the grated window where he supposed the lovelorn damsel to be; and giving her his hand, he said,"
        vocab:
          - {w: "proponer en su pensamiento", d: "to plan in one's mind, make up one's mind"}
          - {w: "haber de", d: "to have to, be going to: 'lo que había de hacer' = what she was to do"}
          - {w: "caballeriza", d: "stable"}
          - {w: "cabestro", d: "halter (the rope for leading an animal)"}
          - {w: "jumento", d: "donkey, ass (Sancho's 'rucio')"}
          - {w: "presteza", d: "speed, quickness"}
          - {w: "a tiempo que", d: "just as, at the moment when"}
          - {w: "ponerse de pies", d: "to stand up (modern 'ponerse de pie')"}
          - {w: "silla", d: "saddle (here, not 'chair')"}
          - {w: "enrejado", d: "barred, grated, fitted with a grille"}
          - {w: "ferida", d: "= herida, wounded (by love), with the old chivalric f-"}
        diagram:
          - s: "Parecióle a Maritornes"
            r: "main verb 1: it seemed to Maritornes"
            under:
              - s: "que sin duda don Quijote daría la mano"
                r: "what seemed: that Don Quijote would surely give the hand"
                under:
                  - {s: "que le habían pedido", r: "describes 'mano': that they had asked of him"}
          - s: "se bajó del agujero"
            r: "main verb 2 (after 'y'): she got down from the hole"
            under:
              - {s: "proponiendo en su pensamiento lo que había de hacer", r: "how: planning in her mind what she was going to do"}
          - s: "y se fue a la caballeriza"
            r: "main verb 3: and went to the stable"
            under:
              - {s: "donde tomó el cabestro del jumento de Sancho Panza", r: "describes 'caballeriza': where she took the halter of Sancho's donkey"}
          - s: "y con mucha presteza se volvió a su agujero"
            r: "main verb 4: and very quickly returned to her hole"
            under:
              - s: "a tiempo que don Quijote se había puesto de pies sobre la silla de Rocinante"
                r: "when: just as Don Quijote had stood up on Rocinante's saddle"
                under:
                  - s: "por alcanzar a la ventana enrejada"
                    r: "why: to reach the grated window"
                    under:
                      - {s: "donde se imaginaba estar la ferida doncella", r: "describes 'ventana': where he imagined the love-wounded maiden was"}
          - s: "dijo:"
            r: "main verb 5 (after 'y'), Don Quijote: he said"
            under:
              - {s: "al darle la mano", r: "when: as he gave her his hand"}
        forms:
          - {w: "Parecióle", f: "parec- + -ió + le → parecer (to seem), preterite, it, with 'le' (to her) stuck on the end; modern 'le pareció'. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron. Cervantes hangs pronouns on a verb that opens the sentence. 'a Maritornes' repeats who 'le' is."}
          - {w: "daría", f: "dar- + -ía → dar (to give), conditional, he: 'would give'. The conditional adds endings to the whole infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "habían pedido", f: "hab- + -ían → haber (to have, the helper verb), imperfect, they: había, habías, había, habíamos, habíais, habían; + pedido, participle of pedir (to ask for): pluperfect, 'they had asked'."}
          - {w: "proponiendo", f: "gerund of proponer (to plan, propose): 'planning'."}
          - {w: "había de hacer", f: "hab- + -ía → haber (to have), imperfect, she (había, habías, había, habíamos, habíais, habían) + de + hacer (to do): 'was to do'."}
          - {w: "se bajó, tomó, se volvió", f: "baj- + -ó → bajarse (to get down), tom- + -ó → tomar (to take), volv- + -ió → volverse (to go back), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron; of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "se fue", f: "fu- + -e → irse (to go off), preterite, she, with 'se'. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "del", f: "de + el, 'from the' / 'of the'."}
          - {w: "se había puesto", f: "hab- + -ía → haber (to have, the helper verb), imperfect, he (había, habías, había, habíamos, habíais, habían); + puesto, irregular participle of poner (to put): pluperfect of ponerse (to put oneself), 'had stood himself'."}
          - {w: "enrejada", f: "enrej- + -ada → enrejar (to fit with a grille), participle used as an adjective, feminine to match 'ventana'."}
          - {w: "se imaginaba estar", f: "imagin- + -aba → imaginarse (to imagine), imperfect, he: imaginaba, imaginabas, imaginaba, imaginábamos, imaginabais, imaginaban; + estar (to be), infinitive with its own subject ('la ferida doncella') after a verb of thinking, a Latin-style pattern: 'he imagined the maiden to be'."}
          - {w: "ferida", f: "= herida, participle of ferir (to wound), old form of herir (to wound), feminine to match 'doncella'."}
          - {w: "al darle", f: "al (a + el) + infinitive = 'on ...ing, as': dar (to give) + le (to her) hung on the end."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
        note: "The 'grated window' is the straw-loft hole, and Don Quijote has to stand on his saddle to reach it."
  - sentences:
      - es: "— Tomad, señora, esa mano, o, por mejor decir, ese verdugo de los malhechores del mundo; tomad esa mano, digo, a quien no ha tocado otra de mujer alguna, ni aun la de aquella que tiene entera posesión de todo mi cuerpo."
        literal: "— Take, lady, this hand, or, for better to-say, this executioner of the evildoers of-the world; take this hand, I-say, to which not has touched another of woman any, nor even that of her who has entire possession of all my body."
        ormsby: "“Lady, take this hand, or rather this scourge of the evildoers of the earth; take, I say, this hand which no other hand of woman has ever touched, not even hers who has complete possession of my entire body."
        vocab:
          - {w: "por mejor decir", d: "or rather, to put it better"}
          - {w: "verdugo", d: "executioner, hangman; figuratively a scourge, a punisher"}
          - {w: "malhechor", d: "evildoer, criminal (mal + hechor, 'doer of ill')"}
          - {w: "a quien", d: "here 'which', used of the hand as if it were a person; modern Spanish would say 'a la que'"}
          - {w: "mujer alguna", d: "any woman at all; 'alguno' after the noun in a negative sentence = 'no ... whatever'"}
          - {w: "entera posesión", d: "complete possession: Dulcinea owns him body and soul, in the language of courtly love"}
        diagram:
          - s: "Tomad, señora, esa mano"
            r: "main verb 1: take, lady, this hand"
            under:
              - {s: "o, por mejor decir, ese verdugo de los malhechores del mundo", r: "correction of 'mano': or rather, this scourge of the world's evildoers"}
          - s: "tomad esa mano, digo"
            r: "main verb 2: take this hand, I say (repeating)"
            under:
              - s: "a quien no ha tocado otra de mujer alguna"
                r: "describes 'mano': which no other woman's hand has touched"
                under:
                  - s: "ni aun la de aquella"
                    r: "not even: not even that of the lady"
                    under:
                      - {s: "que tiene entera posesión de todo mi cuerpo", r: "describes 'aquella': who wholly owns my body (Dulcinea)"}
        forms:
          - {w: "Tomad", f: "tom- + -ad → tomar (to take), imperative, you (vosotros), used as the polite plural to one lady: 'take!'. The vosotros imperative swaps the final -r of the infinitive for -d: tomad, comed, vivid."}
          - {w: "esa, ese", f: "es- + -a / -e → ese (that), feminine to match 'mano', masculine to match 'verdugo'."}
          - {w: "por mejor decir", f: "decir (to say), infinitive after 'por': 'to say [it] better'."}
          - {w: "del", f: "de + el, 'of the', the contraction modern Spanish still makes."}
          - {w: "digo", f: "dig- + -o → decir (to say), present, I: 'I say'. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "ha tocado", f: "h- + -a → haber (to have), present, it, + tocado, the participle of tocar (to touch): the perfect, 'has touched'. haber (to have) in the present: he, has, ha, hemos, habéis, han. The subject is 'otra (mano)', which comes after the verb."}
          - {w: "alguna", f: "algun- + -a → alguno (any), feminine to match 'mujer'; placed after the noun in a negative sentence it means 'none at all'."}
          - {w: "la de aquella", f: "'la' stands for 'la mano' ('that of'); 'aquell- + -a' → aquel (that, that one), feminine: 'her' (Dulcinea)."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, she. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
        note: "Don Quijote thinks he is granting a favour to the castle lord's lovesick daughter, as in a romance, where a knight faithful to his lady may offer a hand but never his heart. The 'damsel' is in fact the innkeeper's daughter and Maritornes, setting up a prank."
      - es: "No os la doy para que la beséis, sino para que miréis la contestura de sus nervios, la trabazón de sus músculos, la anchura y espaciosidad de sus venas; de donde sacaréis qué tal debe de ser la fuerza del brazo que tal mano tiene."
        literal: "Not to-you it I-give in-order that it you-may-kiss, but in-order that you-may-look-at the texture of its sinews, the binding of its muscles, the breadth and spaciousness of its veins; from where you-will-draw what such must be the strength of-the arm that such hand has."
        ormsby: "I present it to you, not that you may kiss it, but that you may observe the contexture of the sinews, the close network of the muscles, the breadth and capacity of the veins, whence you may infer what must be the strength of the arm that has such a hand.”"
        vocab:
          - {w: "contestura", d: "= contextura, structure, build, texture (old spelling)"}
          - {w: "nervios", d: "sinews, tendons (in older Spanish 'nervio' often means tendon, not only 'nerve')"}
          - {w: "trabazón", d: "binding, interlacing, the way things are knit together"}
          - {w: "espaciosidad", d: "spaciousness, breadth (a learned, rare word)"}
          - {w: "sacar", d: "here 'to deduce, infer, draw (a conclusion)'"}
          - {w: "qué tal", d: "what kind of, how (great)"}
          - {w: "deber de", d: "must (probability): 'debe de ser' = must be"}
        diagram:
          - s: "No os la doy"
            r: "main verb: I do not give it to you"
            under:
              - {s: "para que la beséis", r: "why not: so that you may kiss it"}
              - s: "sino para que miréis"
                r: "why: but so that you may look at"
                under:
                  - {s: "la contestura de sus nervios", r: "object 1: the build of its sinews"}
                  - {s: "la trabazón de sus músculos", r: "object 2: the knitting of its muscles"}
                  - {s: "la anchura y espaciosidad de sus venas", r: "object 3: the width and roominess of its veins"}
              - s: "de donde sacaréis"
                r: "result: from which you will infer"
                under:
                  - s: "qué tal debe de ser la fuerza del brazo"
                    r: "what you infer: how great the strength of the arm must be"
                    under:
                      - {s: "que tal mano tiene", r: "describes 'brazo': that has such a hand"}
        forms:
          - {w: "os la", f: "os = 'to you' (vosotros form, used politely to one lady); la = 'it', feminine for 'la mano'. Object pronouns stand before the conjugated verb, indirect before direct."}
          - {w: "doy", f: "d- + -oy → dar (to give), present, I. Irregular: doy, das, da, damos, dais, dan."}
          - {w: "beséis, miréis", f: "bes- + -éis → besar (to kiss) and mir- + -éis → mirar (to look at), present subjunctive, you (vosotros), after 'para que' (so that). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "sus", f: "su + -s, plural to match 'nervios', 'músculos', 'venas', not the owner: 'its' (the hand's)."}
          - {w: "sacaréis", f: "sacar- + -éis → sacar (to draw out, infer), future, you (vosotros). The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "debe de ser", f: "deb- + -e → deber (must), present, it: debo, debes, debe, debemos, debéis, deben; + de + ser (to be): 'must be', a guess about what is likely."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, it (the arm). Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen. Verb at the end: 'que tal mano tiene' = that has such a hand."}
        note: "Don Quijote describes his hand in the anatomical vocabulary of a physician, as proof of a mighty sword arm. The boast is about to be put to a very different test."
  - sentences:
      - es: "— Ahora lo veremos —dijo Maritornes."
        literal: "— Now it we-shall-see —said Maritornes."
        ormsby: "“That we shall see presently,” said Maritornes,"
        vocab:
          - {w: "ahora lo veremos", d: "we'll see about that right now; a mocking reply to his boast"}
        diagram:
          - s: "Ahora lo veremos"
            r: "what she said: now we shall see it"
          - s: "dijo Maritornes"
            r: "main verb: said Maritornes"
        forms:
          - {w: "lo", f: "'it', neuter: the strength he has just boasted of."}
          - {w: "veremos", f: "ver- + -emos → ver (to see), future, we. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, she. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
        note: "Maritornes is the Asturian serving-girl of the inn, whose night-time mix-up with Don Quijote and the carrier in Part I chapter 16 ended in a general brawl. Her 'we shall see' is a double meaning: the strength of the arm is about to be tested."
  - sentences:
      - es: "Y, haciendo una lazada corrediza al cabestro, se la echó a la muñeca, y, bajándose del agujero, ató lo que quedaba al cerrojo de la puerta del pajar muy fuertemente."
        literal: "And, making a loop running on-the halter, to-him it she-threw on the wrist, and, lowering-herself from-the hole, she-tied that which remained to-the bolt of the door of-the hayloft very strongly."
        ormsby: "and making a running knot on the halter, she passed it over his wrist and coming down from the hole tied the other end very firmly to the bolt of the door of the straw-loft."
        vocab:
          - {w: "lazada corrediza", d: "running knot, slipknot, noose"}
          - {w: "cabestro", d: "halter, the rope for leading an animal (here Sancho's donkey's)"}
          - {w: "muñeca", d: "wrist (also 'doll')"}
          - {w: "agujero", d: "hole: the opening in the hayloft wall used for throwing out straw"}
          - {w: "lo que quedaba", d: "what was left, the other end (of the rope)"}
          - {w: "cerrojo", d: "bolt (of a door)"}
          - {w: "pajar", d: "hayloft, straw-loft"}
        diagram:
          - s: "se la echó a la muñeca"
            r: "main verb 1: she put it on his wrist"
            under:
              - {s: "haciendo una lazada corrediza al cabestro", r: "how: making a slipknot in the halter"}
          - s: "ató lo que quedaba"
            r: "main verb 2 (after 'y'): she tied the rest"
            under:
              - {s: "bajándose del agujero", r: "when: getting down from the hole"}
              - {s: "al cerrojo de la puerta del pajar", r: "to what: to the bolt of the hayloft door"}
              - {s: "muy fuertemente", r: "how: very tightly"}
        forms:
          - {w: "haciendo", f: "gerund of hacer (to make): 'making'."}
          - {w: "al", f: "a + el, 'to the / on the', the contraction modern Spanish still makes."}
          - {w: "se la", f: "se = 'to him' (le turns into se before la, lo); la = 'it', feminine for 'la lazada'. Literally 'to-him it she threw'."}
          - {w: "echó, ató", f: "ech- + -ó → echar (to throw, put) and at- + -ó → atar (to tie), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "bajándose", f: "gerund of bajar (to go down) + se (herself) stuck on the end, with an accent added to keep the stress: 'getting down'."}
          - {w: "del", f: "de + el, 'from the / of the'."}
          - {w: "quedaba", f: "qued- + -aba → quedar (to remain), imperfect, it. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "fuertemente", f: "fuerte (strong) + -mente → adverb, 'strongly, tightly'; -mente turns an adjective into an adverb like English -ly."}
      - es: "Don Quijote, que sintió la aspereza del cordel en su muñeca, dijo:"
        literal: "Don Quijote, who felt the roughness of-the cord on his wrist, said:"
        ormsby: "Don Quixote, feeling the roughness of the rope on his wrist, exclaimed,"
        vocab:
          - {w: "aspereza", d: "roughness, harshness"}
          - {w: "cordel", d: "cord, thin rope"}
        diagram:
          - s: "dijo:"
            r: "main verb: said"
            under:
              - s: "Don Quijote"
                r: "subject"
                under:
                  - {s: "que sintió la aspereza del cordel en su muñeca", r: "describes 'Don Quijote': who felt the rough cord on his wrist"}
        forms:
          - {w: "sintió", f: "sint- + -ió → sentir (to feel), preterite, he; the stem e turns to i in this form. sentí, sentiste, sintió, sentimos, sentisteis, sintieron."}
          - {w: "del", f: "de + el, 'of the'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Más parece que vuestra merced me ralla que no que me regala la mano; no la tratéis tan mal, pues ella no tiene la culpa del mal que mi voluntad os hace, ni es bien que en tan poca parte venguéis el todo de vuestro enojo."
        literal: "— More it-seems that your grace to-me grates than not that to-me caresses the hand; not it treat so badly, since it not has the blame of-the harm that my will to-you does, nor is [it] good that on so small part you-avenge the whole of your anger."
        ormsby: "“Your grace seems to be grating rather than caressing my hand; treat it not so harshly, for it is not to blame for the offence my resolution has given you, nor is it just to wreak all your vengeance on so small a part;"
        vocab:
          - {w: "rallar", d: "to grate (as cheese); a pun with 'regalar', to caress, pamper"}
          - {w: "regalar", d: "here 'to caress, treat tenderly', not 'to give a present'"}
          - {w: "más ... que no que", d: "rather ... than; the extra 'no' is an old pleonasm, not a negation"}
          - {w: "voluntad", d: "will; here his love, his heart (given to Dulcinea)"}
          - {w: "ser bien", d: "to be right, proper"}
