          - {w: "puesta", f: "irregular participle of poner (to put), feminine to match Dulcinea: 'placed, leaning'."}
          - {w: "está considerando", f: "est- + -á → estar (to be), present, she: estoy, estás, está, estamos, estáis, están; + considerando, gerund of considerar (to consider): 'she is considering'."}
          - {w: "salva", f: "salv- + -a → salvo (safe), feminine to match 'honestidad': an absolute phrase, 'her virtue (being) safe', i.e. 'without harm to her virtue'."}
          - {w: "ha de amansar, ha de dar", f: "h- + -a → haber (to have, the helper verb), present, she: he, has, ha, hemos, habéis, han; haber (to have) + de + infinitive means 'to have to, to be going to': amansar (to calm), dar (to give)."}
          - {w: "este mi cuitado corazón", f: "demonstrative + possessive together before the noun, 'this my wretched heart', an old pattern modern Spanish avoids ('este corazón mío')."}
          - {w: "padece", f: "padec- + -e → padecer (to suffer), present, it (the heart). The present of -er verbs: -o (padezco, with z), -es, -e, -emos, -éis, -en."}
          - {w: "mis penas, mis servicios", f: "mis = plural to match 'penas' and 'servicios', not the owner."}
        note: "The list of paradoxes (life to my death, glory to my pains) is the stock language of courtly love poetry, in which the lady's favour is the lover's life and her coldness his death."
      - es: "Y tú, sol, que ya debes de estar apriesa ensillando tus caballos, por madrugar y salir a ver a mi señora, así como la veas, suplícote que de mi parte la saludes;"
        literal: "And you, sun, who already must be in-haste saddling your horses, for to-rise-early and to-go-out to see to my lady, as-soon as her you-see, I-beg-you that on my part her you-greet;"
        ormsby: "And thou, oh sun, that art now doubtless harnessing thy steeds in haste to rise betimes and come forth to see my lady; when thou seest her I entreat of thee to salute her on my behalf:"
        vocab:
          - {w: "deber de", d: "must (probability): 'debes de estar' = you must be"}
          - {w: "apriesa", d: "= aprisa, quickly, in haste (old form)"}
          - {w: "ensillar", d: "to saddle (here the horses of the sun's chariot)"}
          - {w: "madrugar", d: "to rise early, get up at dawn"}
          - {w: "así como", d: "as soon as (with the subjunctive for the future)"}
          - {w: "suplicar", d: "to beg, entreat"}
          - {w: "de mi parte", d: "on my behalf, from me"}
