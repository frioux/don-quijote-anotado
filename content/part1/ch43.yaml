part: 1
chapter: 43
title_es: "Capítulo XLIII. Donde se cuenta la agradable historia del mozo de mulas, con otros estraños acaecimientos en la venta sucedidos]"
title_en: "Wherein is related the pleasant story of the muleteer, together with other strange things that came to pass in the inn"
paragraphs:
  - sentences:
      - es: "-Marinero soy de amor, y en su piélago profundo navego sin esperanza de llegar a puerto alguno."
        literal: "-Sailor I-am of love, and in its sea deep I-sail without hope of arriving at port any."
        ormsby: "Ah me, Love’s mariner am I / On Love’s deep ocean sailing; / I know not where the haven lies, / I dare not hope to gain it."
        ormsby_note: "In this translation an attempt has been made to imitate the prevailing rhyme of the Spanish ballad, the double assonant in the second and fourth lines."
        vocab:
          - {w: "marinero", d: "sailor, mariner"}
          - {w: "piélago", d: "the open sea, the deep (a poetic, Latinate word)"}
          - {w: "navegar", d: "to sail, navigate"}
          - {w: "puerto alguno", d: "any port at all; 'alguno' placed after the noun in a negative sentence means 'none whatever'"}
        diagram:
          - s: "Marinero soy de amor"
            r: "main verb 1: I am a sailor of love"
          - s: "navego"
            r: "main verb 2 (after 'y'): I sail"
            under:
              - {s: "en su piélago profundo", r: "where: in its (love's) deep sea"}
              - s: "sin esperanza"
                r: "how: without hope"
                under:
                  - {s: "de llegar a puerto alguno", r: "describes 'esperanza': of reaching any port"}
        forms:
          - {w: "soy", f: "ser (to be), present, I. Irregular: soy, eres, es, somos, sois, son. The noun 'Marinero' is put before the verb for emphasis, as poetry often does."}
          - {w: "su", f: "'its', referring back to 'amor': love is pictured as a sea."}
          - {w: "navego", f: "naveg- + -o → navegar (to sail), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "profundo", f: "profund- + -o → profundo (deep), masculine singular to match 'piélago'; the adjective follows the noun."}
          - {w: "llegar", f: "infinitive of llegar (to arrive), after 'de' ('hope of arriving')."}
        note: "The line begins with a hyphen in the Gutenberg text, marking the start of a song: a young voice is singing in the inn yard at night, heard by the women lodged inside. The song is a romance-style ballad in eight-syllable lines, its sea and star images taken from love poetry."
      - es: "Siguiendo voy a una estrella que desde lejos descubro, más bella y resplandeciente que cuantas vio Palinuro."
        literal: "Following I-go to a star that from afar I-descry, more beautiful and resplendent than as-many-as saw Palinuro."
        ormsby: "One solitary distant star / Is all I have to guide me, / A brighter orb than those of old / That Palinurus lighted."
        ormsby_note: "Surgit Palinurus, et … / Sidora cuncta notat tacito labentia coelo. (Aeneid iii)"
        vocab:
          - {w: "ir siguiendo", d: "to go on following; 'ir' + gerund = to keep doing something, little by little"}
          - {w: "desde lejos", d: "from afar"}
          - {w: "descubrir", d: "here to catch sight of, descry (not only 'to discover')"}
          - {w: "resplandeciente", d: "shining, resplendent"}
          - {w: "cuantas", d: "all those that, as many as"}
          - {w: "Palinuro", d: "Palinurus, Aeneas's helmsman in Virgil's Aeneid, who steered by the stars and fell overboard asleep"}
        diagram:
          - s: "Siguiendo voy"
            r: "main verb: I go following"
            under:
              - s: "a una estrella"
                r: "object: a star"
                under:
                  - {s: "que desde lejos descubro", r: "describes 'estrella': which I make out from afar"}
                  - s: "más bella y resplandeciente"
                    r: "describes 'estrella': more beautiful and bright"
                    under:
                      - {s: "que cuantas vio Palinuro", r: "compared with: than all the stars Palinurus ever saw"}
        forms:
          - {w: "Siguiendo", f: "gerund of seguir (to follow): 'following'. The e of the stem turns to i in the gerund: seguir → siguiendo."}
          - {w: "voy", f: "ir (to go), present, I. Irregular: voy, vas, va, vamos, vais, van. With a gerund it means 'I keep on ...ing'; the gerund is put first for the verse."}
          - {w: "descubro", f: "descubr- + -o → descubrir (to descry), present, I. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "bella", f: "bell- + -a → bello (beautiful), feminine to match 'estrella'; 'más bella ... que' = more beautiful than."}
          - {w: "cuantas", f: "cuant- + -as → cuanto (as many as), feminine plural because it means 'all the stars that'."}
          - {w: "vio", f: "vi- + -o → ver (to see), preterite, he (Palinurus). Irregular: vi, viste, vio, vimos, visteis, vieron. The subject 'Palinuro' comes after the verb."}
      - es: "Yo no sé adónde me guía, y así, navego confuso, el alma a mirarla atenta, cuidadosa y con descuido."
        literal: "I not know where-to me it-guides, and so, I-sail confused, the soul to look-at-her intent, careful and with carelessness."
        ormsby: "And vaguely drifting am I borne, / I know not where it leads me; / I fix my gaze on it alone, / Of all beside it heedless."
        vocab:
          - {w: "adónde", d: "where to, whither"}
          - {w: "guiar", d: "to guide, lead"}
          - {w: "confuso", d: "bewildered, at a loss (stronger than English 'confused')"}
          - {w: "atento a", d: "intent on, attentive to"}
          - {w: "cuidadosa y con descuido", d: "anxious and yet careless: a play on 'cuidado' (care, worry) and 'descuido' (carelessness); she is all care for the star and careless of everything else"}
        diagram:
          - s: "Yo no sé"
            r: "main verb 1: I do not know"
            under:
              - {s: "adónde me guía", r: "what I do not know: where it (the star) leads me"}
          - s: "navego confuso"
            r: "main verb 2 (after 'y así'): I sail bewildered"
            under:
              - s: "el alma"
                r: "how: (with) my soul"
                under:
                  - {s: "a mirarla atenta", r: "describes 'alma': intent on watching it"}
                  - {s: "cuidadosa y con descuido", r: "describes 'alma': full of care and yet careless"}
        forms:
          - {w: "sé", f: "saber (to know), present, I. Irregular: sé, sabes, sabe, sabemos, sabéis, saben. The accent tells it from the pronoun 'se'."}
          - {w: "guía", f: "gui- + -a → guiar (to guide), present, it (the star). The i carries the stress and an accent: guío, guías, guía, guiamos, guiáis, guían."}
          - {w: "navego", f: "naveg- + -o → navegar (to sail), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "confuso", f: "confus- + -o → confuso (bewildered), masculine to match 'yo', the singer."}
          - {w: "el alma", f: "'alma' (soul) is feminine but takes 'el' because it begins with a stressed a; the adjectives after it are feminine. The phrase stands loose, with no verb, like 'with my soul ...'."}
          - {w: "mirarla", f: "mirar (to look at) + la (her, i.e. the star 'estrella'), the pronoun hung on the infinitive after 'a'."}
          - {w: "atenta, cuidadosa", f: "atent- + -a → atento (intent) and cuidados- + -a → cuidadoso (careful, anxious), feminine to match 'alma'."}
      - es: "Recatos impertinentes, honestidad contra el uso, son nubes que me la encubren cuando más verla procuro."
        literal: "Reserves uncalled-for, modesty against the custom, are clouds that from-me her hide when most to-see-her I-try."
        ormsby: "But overcautious prudery, / And coyness cold and cruel, / When most I need it, these, like clouds, / Its longed-for light refuse me."
        vocab:
          - {w: "recato", d: "modesty, reserve, caution (especially a young woman's)"}
          - {w: "impertinente", d: "uncalled-for, excessive, out of place (false friend: not 'rude')"}
          - {w: "honestidad", d: "modesty, chastity (false friend: not 'honesty')"}
          - {w: "contra el uso", d: "beyond what is customary, more than usual"}
          - {w: "encubrir", d: "to hide, conceal"}
          - {w: "procurar", d: "to try, endeavour (false friend: not 'to procure')"}
        diagram:
          - s: "son nubes"
            r: "main verb: are clouds"
            under:
              - s: "Recatos impertinentes, honestidad contra el uso"
                r: "subject: excessive reserve, more-than-usual modesty"
              - s: "que me la encubren"
                r: "describes 'nubes': which hide her (the star) from me"
                under:
                  - {s: "cuando más verla procuro", r: "when: just when I most try to see her"}
        forms:
          - {w: "Recatos impertinentes", f: "plural nouns with a plural adjective: recato + -s, impertinente + -s. The two subjects together make the verb plural."}
          - {w: "son", f: "ser (to be), present, they. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "me la encubren", f: "encubr- + -en → encubrir (to hide), present, they (the clouds). The present of -ir verbs: -o, -es, -e, -imos, -ís, -en. 'me' (from me) comes before 'la' (her, the star): the indirect pronoun always goes first."}
          - {w: "verla", f: "ver (to see) + la (her, the star), the pronoun hung on the infinitive; the infinitive is put before its verb 'procuro' for the verse."}
          - {w: "procuro", f: "procur- + -o → procurar (to try), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
        note: "The star's 'clouds' are the strict guarding of a well-born girl: kept indoors, behind curtains and lattices, she can hardly be seen by a suitor. The singer is complaining of the girl's modesty, not of the weather."
      - es: "¡Oh clara y luciente estrella, en cuya lumbre me apuro!; al punto que te me encubras, será de mi muerte el punto."
        literal: "Oh bright and shining star, in whose light myself I-refine!; at-the moment that yourself from-me you-may-hide, will-be of my death the point."
        ormsby: "Bright star, goal of my yearning eyes / As thou above me beamest, / When thou shalt hide thee from my sight / I’ll know that death is near me."
        ormsby_note: '"Clara estrella."'
        vocab:
          - {w: "luciente", d: "shining, gleaming (poetic)"}
          - {w: "lumbre", d: "light; also fire, flame"}
          - {w: "apurarse", d: "here to be refined, purified, as gold in the fire; also to fret, be in distress (both senses at once)"}
          - {w: "al punto que", d: "the moment that, as soon as"}
          - {w: "el punto de mi muerte", d: "the moment of my death; the line plays on 'punto' (moment, point) at both ends"}
        diagram:
          - s: "¡Oh clara y luciente estrella"
            r: "address: oh bright and shining star"
            under:
              - {s: "en cuya lumbre me apuro!", r: "describes 'estrella': in whose light I am refined (and tormented)"}
          - s: "será de mi muerte el punto"
            r: "main verb: will be the moment of my death"
            under:
              - {s: "al punto que te me encubras", r: "when: the moment you hide yourself from me"}
        forms:
          - {w: "clara", f: "clar- + -a → claro (bright, clear), feminine to match 'estrella'; also the name of the girl who is listening."}
          - {w: "cuya", f: "cuy- + -a → cuyo (whose), feminine to match the thing owned, 'lumbre', not the owner."}
          - {w: "me apuro", f: "apur- + -o → apurarse (to be refined, to fret), present, I, with 'me' (myself). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "te me encubras", f: "encubr- + -as → encubrirse (to hide oneself), present subjunctive, you, with 'te' (yourself) and 'me' (from me). The present subjunctive of -ir verbs: -a, -as, -a, -amos, -áis, -an. Subjunctive because 'al punto que' points to a time that has not yet come."}
          - {w: "será", f: "ser- + -á → ser (to be), future, it. The future adds endings to the whole infinitive: seré, serás, será, seremos, seréis, serán."}
        note: "Ormsby's note points to the pun: 'clara estrella' (bright star) is also 'Clara', the judge's young daughter asleep inside the inn, so the song is addressed to her by name without saying so."
  - sentences:
      - es: "Llegando el que cantaba a este punto, le pareció a Dorotea que no sería bien que dejase Clara de oír una tan buena voz; y así, moviéndola a una y a otra parte, la despertó diciéndole:"
        literal: "Arriving he who was-singing at this point, to-her it-seemed to Dorotea that not it-would-be well that should-fail Clara to hear a so good voice; and so, moving-her to one and to other side, her she-woke saying-to-her:"
        ormsby: "The singer had got so far when it struck Dorothea that it was not fair to let Clara miss hearing such a sweet voice, so, shaking her from side to side, she woke her, saying:"
        vocab:
          - {w: "el que cantaba", d: "the one who was singing, the singer"}
          - {w: "llegar a este punto", d: "to reach this point (in the song)"}
          - {w: "parecerle a uno", d: "to seem to someone, strike someone as"}
          - {w: "no ser bien", d: "not to be right, not to be fair"}
          - {w: "dejar de", d: "to fail to, miss, leave off (doing something)"}
          - {w: "a una y a otra parte", d: "to one side and the other, from side to side"}
        diagram:
          - s: "le pareció a Dorotea"
            r: "main verb 1: it seemed to Dorotea"
            under:
              - s: "Llegando el que cantaba a este punto"
                r: "when: as the singer reached this point"
              - s: "que no sería bien"
                r: "what seemed: that it would not be right"
                under:
                  - {s: "que dejase Clara de oír una tan buena voz", r: "what would not be right: that Clara should miss hearing so fine a voice"}
          - s: "la despertó"
            r: "main verb 2 (after 'y así'): she woke her"
            under:
              - {s: "moviéndola a una y a otra parte", r: "how: shaking her from side to side"}
              - {s: "diciéndole:", r: "how: saying to her"}
        forms:
          - {w: "Llegando", f: "gerund of llegar (to arrive): 'arriving', here with its own subject 'el que cantaba', meaning 'when the singer reached'."}
          - {w: "cantaba", f: "cant- + -aba → cantar (to sing), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "le pareció", f: "parec- + -ió → parecer (to seem), preterite, it, with 'le' (to her) doubled by 'a Dorotea'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "sería", f: "ser- + -ía → ser (to be), conditional, it. The conditional adds endings to the whole infinitive: sería, serías, sería, seríamos, seríais, serían."}
          - {w: "dejase", f: "dej- + -ase → dejar (to leave off), imperfect subjunctive (-se form), she (Clara). The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. Subjunctive after 'no sería bien que'; the subject 'Clara' follows the verb."}
          - {w: "una tan buena voz", f: "word order of the period: 'una tan buena voz' where modern Spanish says 'una voz tan buena' (so good a voice)."}
          - {w: "moviéndola", f: "gerund of mover (to move, shake) + la (her), the pronoun hung on the gerund; the accent keeps the stress on -én-."}
          - {w: "despertó", f: "despert- + -ó → despertar (to wake), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "diciéndole", f: "gerund of decir (to say), with the stem e turned to i (decir → diciendo), + le (to her), hung on the end with an accent added."}
        note: "Dorotea and Clara are sharing a room with the other ladies in the inn; Clara is the young daughter of the judge (oidor) who arrived in the previous chapter. The singer is out in the yard."
  - sentences:
      - es: "— Perdóname, niña, que te despierto, pues lo hago porque gustes de oír la mejor voz que quizá habrás oído en toda tu vida."
        literal: "— Forgive-me, girl, that you I-wake, for it I-do so-that you-may-enjoy of hearing the best voice that perhaps you-will-have heard in all your life."
        ormsby: "“Forgive me, child, for waking thee, but I do so that thou mayest have the pleasure of hearing the best voice thou hast ever heard, perhaps, in all thy life.”"
        vocab:
          - {w: "niña", d: "child, little girl; an affectionate address to a young girl"}
          - {w: "que", d: "here 'for, because': 'que te despierto' = for waking you"}
          - {w: "porque", d: "with the subjunctive 'so that', not 'because'"}
          - {w: "gustar de", d: "to enjoy, take pleasure in"}
          - {w: "quizá", d: "perhaps"}
        diagram:
          - s: "Perdóname"
            r: "main verb 1: forgive me"
            under:
              - {s: "niña", r: "address: child"}
              - {s: "que te despierto", r: "why: for waking you"}
          - s: "pues lo hago"
            r: "main verb 2: for I do it"
            under:
              - s: "porque gustes de oír la mejor voz"
                r: "purpose: so that you may enjoy hearing the best voice"
                under:
                  - {s: "que quizá habrás oído en toda tu vida", r: "describes 'voz': that perhaps you will have heard in all your life"}
        forms:
          - {w: "Perdóname", f: "perdona + me → perdonar (to forgive), imperative, you (tú), with 'me' stuck on the end and an accent added: 'forgive me'. The tú imperative of regular verbs is the same as the he/she present: perdona, come, vive. Dorotea speaks to the girl as tú, affectionately."}
          - {w: "despierto", f: "despiert- + -o → despertar (to wake), present, I. The stem e becomes ie when stressed: despierto, despiertas, despierta, despertamos, despertáis, despiertan."}
          - {w: "hago", f: "hag- + -o → hacer (to do), present, I. Irregular: hago, haces, hace, hacemos, hacéis, hacen. 'lo hago' = I do it (I wake you)."}
          - {w: "gustes", f: "gust- + -es → gustar (to enjoy), present subjunctive, you. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. Subjunctive because 'porque' here states a purpose."}
          - {w: "mejor", f: "comparative of bueno (good): 'better'; with 'la' it is 'the best'."}
          - {w: "habrás oído", f: "habr- + -ás → haber (to have), future, you, + oído, the participle of oír (to hear): future perfect, 'you will have heard', here a guess about the past ('perhaps you have ever heard'). haber (to have) in the future: habré, habrás, habrá, habremos, habréis, habrán."}
          - {w: "toda tu vida", f: "tod- + -a → todo (all), feminine to match 'vida'; 'tu' = your (tú form)."}
  - sentences:
      - es: "Clara despertó toda soñolienta, y de la primera vez no entendió lo que Dorotea le decía; y, volviéndoselo a preguntar, ella se lo volvió a decir, por lo cual estuvo atenta Clara."
        literal: "Clara woke all drowsy, and at the first time not she-understood that which Dorotea to-her was-saying; and, turning-to-her-it to ask, she to-her it turned to say, through which was attentive Clara."
        ormsby: "Clara awoke quite drowsy, and not understanding at the moment what Dorothea said, asked her what it was; she repeated what she had said, and Clara became attentive at once;"
        vocab:
          - {w: "soñoliento", d: "drowsy, sleepy"}
          - {w: "de la primera vez", d: "at first, the first time round"}
          - {w: "volver a + infinitive", d: "to do again: 'volvió a decir' = said again"}
          - {w: "por lo cual", d: "for which reason, whereupon"}
          - {w: "atento", d: "attentive, listening closely"}
        diagram:
          - s: "Clara despertó toda soñolienta"
            r: "main verb 1: Clara woke all drowsy"
          - s: "no entendió"
            r: "main verb 2 (after 'y'): she did not understand"
            under:
              - {s: "de la primera vez", r: "when: at first"}
              - {s: "lo que Dorotea le decía", r: "object: what Dorotea was saying to her"}
          - s: "ella se lo volvió a decir"
            r: "main verb 3: she (Dorotea) said it to her again"
            under:
              - {s: "volviéndoselo a preguntar", r: "when: when (Clara) asked her again"}
              - {s: "por lo cual estuvo atenta Clara", r: "result: whereupon Clara paid attention"}
        forms:
          - {w: "despertó", f: "despert- + -ó → despertar (to wake), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "toda soñolienta", f: "tod- + -a and soñolient- + -a, feminine to match 'Clara': 'all drowsy'. 'todo' used as an adverb still agrees in old and modern Spanish."}
          - {w: "entendió", f: "entend- + -ió → entender (to understand), preterite, she. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "decía", f: "dec- + -ía → decir (to say), imperfect, she. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "volviéndoselo", f: "gerund of volver (to turn, here 'to do again') + se (to her) + lo (it), both pronouns hung on the end with an accent added. 'se' stands for 'le': le becomes se before lo."}
          - {w: "se lo volvió a decir", f: "volv- + -ió → volver (to do again), preterite, she, + a decir (to say): 'she said it again'. Same -ió preterite. 'se lo' = le lo, 'it to her'."}
          - {w: "estuvo atenta", f: "estuv- + -o → estar (to be), preterite, she. Irregular: estuve, estuviste, estuvo, estuvimos, estuvisteis, estuvieron. 'atenta' is feminine to match 'Clara'."}
      - es: "Pero, apenas hubo oído dos versos que el que cantaba iba prosiguiendo, cuando le tomó un temblor tan estraño como si de algún grave accidente de cuartana estuviera enferma, y, abrazándose estrechamente con Teodora, le dijo:"
        literal: "But, hardly she-had heard two verses that he who was-singing was going continuing, when her took a trembling so strange as if from some grave attack of quartan-fever she-were sick, and, embracing-herself tightly with Teodora, to-her she-said:"
        ormsby: "but she had hardly heard two lines, as the singer continued, when a strange trembling seized her, as if she were suffering from a severe attack of quartan ague, and throwing her arms round Dorothea she said:"
        vocab:
          - {w: "apenas ... cuando", d: "hardly ... when, no sooner ... than"}
          - {w: "verso", d: "line of verse (not a whole 'verse' or stanza)"}
          - {w: "proseguir", d: "to go on, continue"}
          - {w: "temblor", d: "trembling, a fit of shaking"}
          - {w: "estraño", d: "= extraño, strange (old spelling)"}
          - {w: "accidente", d: "attack, fit, bout of illness (false friend: not 'accident')"}
          - {w: "cuartana", d: "quartan fever: a malarial fever whose shivering fits return every fourth day (counting both ends)"}
          - {w: "abrazarse con", d: "to throw one's arms round, cling to"}
          - {w: "estrechamente", d: "tightly, closely"}
          - {w: "Teodora", d: "a slip for 'Dorotea' in Cervantes' text; Ormsby silently corrects it"}
        diagram:
          - s: "le tomó un temblor tan estraño"
            r: "main verb 1: a strange trembling seized her"
            under:
              - s: "apenas hubo oído dos versos"
                r: "when: hardly had she heard two lines"
                under:
                  - {s: "que el que cantaba iba prosiguiendo", r: "describes 'versos': which the singer was going on with"}
              - {s: "como si de algún grave accidente de cuartana estuviera enferma", r: "how strange: as if she were sick with a bad bout of quartan fever"}
          - s: "le dijo:"
            r: "main verb 2 (after 'y'): she said to her"
            under:
              - {s: "abrazándose estrechamente con Teodora", r: "how: clinging tightly to Dorotea"}
        forms:
          - {w: "hubo oído", f: "hub- + -o → haber (to have), preterite, she, + oído, the participle of oír (to hear): the past anterior, 'she had heard', used after 'apenas' for something just finished. haber (to have) in the preterite: hube, hubiste, hubo, hubimos, hubisteis, hubieron."}
          - {w: "cantaba", f: "cant- + -aba → cantar (to sing), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "iba prosiguiendo", f: "iba = ir (to go), imperfect, he: iba, ibas, iba, íbamos, ibais, iban; + prosiguiendo, gerund of proseguir (to continue) with e turned to i: 'was going on with'."}
          - {w: "tomó", f: "tom- + -ó → tomar (to take, seize), preterite, it (the trembling). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun ('accidente'), like un, buen, ningún."}
          - {w: "estuviera enferma", f: "estuv- + -iera → estar (to be), imperfect subjunctive (-ra form), she. estuviera, estuvieras, estuviera, estuviéramos, estuvierais, estuvieran. 'como si' (as if) always takes this past subjunctive. 'enferma' is feminine to match Clara."}
          - {w: "abrazándose", f: "gerund of abrazarse (to embrace) with 'se' (herself) on the end and an accent added."}
          - {w: "estrechamente", f: "estrech- + -a + -mente → estrecho (tight) + -mente, the adverb ending added to the feminine: 'tightly'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, she. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
        note: "Quartan fever (malaria) was common in Spain and its fits of shivering were proverbial. 'Teodora' for Dorotea is one of Cervantes' famous slips of the pen; editions keep it."
  - sentences:
      - es: "— ¡Ay señora de mi alma y de mi vida!, ¿para qué me despertastes?; que el mayor bien que la fortuna me podía hacer por ahora era tenerme cerrados los ojos y los oídos, para no ver ni oír a ese desdichado músico."
        literal: "— Ah lady of my soul and of my life!, for what me you-woke?; for the greatest good that the fortune to-me could do for now was to-keep-to-me closed the eyes and the ears, so-as not to-see nor to-hear [to] that wretched musician."
        ormsby: "“Ah, dear lady of my soul and life! why did you wake me? The greatest kindness fortune could do me now would be to close my eyes and ears so as neither to see or hear that unhappy musician.”"
        vocab:
          - {w: "¡ay!", d: "ah! alas! (a cry of pain or longing)"}
          - {w: "para qué", d: "what for, why"}
          - {w: "bien", d: "here a noun: good, kindness, blessing"}
          - {w: "por ahora", d: "for now, at present"}
          - {w: "desdichado", d: "unhappy, wretched, ill-starred"}
          - {w: "músico", d: "musician; here the singer"}
        diagram:
          - s: "¡Ay señora de mi alma y de mi vida!"
            r: "address: ah, lady of my soul and life"
          - s: "¿para qué me despertastes?"
            r: "main verb 1: why did you wake me?"
          - s: "era tenerme cerrados los ojos y los oídos"
            r: "main verb 2 (after 'que', for): was to keep my eyes and ears shut"
