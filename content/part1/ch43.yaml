  - sentences:
      - es: "— Sabéis poco del mundo —replicó don Quijote—, pues ignoráis los casos que suelen acontecer en la caballería andante."
        literal: "— You-know little of-the world —replied Don Quijote—, since you-are-ignorant-of the cases that are-wont to-happen in the chivalry errant."
