          - {w: "inquieta os tiene", f: "inquiet- + -a → inquieto (agitated), feminine to match 'os' (you, Clara); tien- + -e → tener (to keep), present, it (the voice). Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
      - es: "Pero no me digáis nada por ahora, que no quiero perder, por acudir a vuestro sobresalto, el gusto que recibo de oír al que canta; que me parece que con nuevos versos y nuevo tono torna a su canto."
