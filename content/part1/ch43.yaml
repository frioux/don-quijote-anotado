        ormsby: "just like those undergoing the torture of the strappado, when they are fixed at “touch and no touch,” who aggravate their own sufferings by their violent efforts to stretch themselves, deceived by the hope which makes them fancy that with a very little more they will reach the ground."
        ormsby_note: "There is some inconsistency here. How could Don Quixote fall almost to the ground, if when standing on Rocinante he was tied up so tightly as we are told? Hartzenbusch, more suo, has an ingenious explanation, by which he avoids the simpler one, that Cervantes never gave a thought to the matter. The strappado was inflicted by tying the hands of the victim behind his back and then hanging him by the wrists from a crossbeam or bough of a tree. Examples of it may be seen among Callot's sketches. There is something almost ghastly in its introduction here as an illustration which must as a matter of course be familiar to every reader."
