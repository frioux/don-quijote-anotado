          - {w: "vitoria", d: "= victoria, victory (old spelling)"}
          - {w: "dichoso", d: "happy, fortunate"}
          - {w: "contrastar", d: "to resist, stand up to, fight against (old sense; not 'to contrast')"}
          - {w: "entregar", d: "to hand over, surrender"}
          - {w: "desvalido", d: "helpless, defenceless"}
          - {w: "ocio", d: "idleness, leisure"}
          - {w: "blando", d: "soft, gentle, easy"}
