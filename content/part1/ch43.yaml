          - {w: "natural de", d: "native of, born in"}
          - {w: "reino de Aragón", d: "the kingdom of Aragon, in the north-east, united with Castile under one crown but still a separate kingdom"}
          - {w: "lugar", d: "village, small town (not just 'place'); 'señor de dos lugares' = lord of two villages"}
          - {w: "frontero de", d: "opposite, facing (old; modern 'enfrente de')"}
          - {w: "la Corte", d: "the Court, i.e. Madrid, where the king and his councils sat"}
