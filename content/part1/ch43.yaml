      - es: "Y, por no oílle, se tapó con las manos entrambos oídos, de lo que también se admiró Dorotea; la cual, estando atenta a lo que se cantaba, vio que proseguían en esta manera:"
        literal: "And, so-as not to-hear-him, herself she-covered with the hands both ears, at which also herself amazed Dorotea; the which, being attentive to that which was-being-sung, saw that they-continued in this manner:"
        ormsby: "and not to hear him she stopped both ears with her hands, at which Dorothea was again surprised; but turning her attention to the song she found that it ran in this fashion:"
