        forms:
          - {w: "encendía", f: "encend- + -ía → encender (to kindle), imperfect, it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "deseaba", f: "dese- + -aba → desear (to desire), imperfect, she. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "saber", f: "infinitive of saber (to know), after 'deseaba'."}
          - {w: "tan suave canto, tan triste lloro", f: "'tan' (so) + adjective before the noun: 'such sweet singing, such sad weeping'; the two halves balance each other."}
      - es: "Y así, le volvió a preguntar qué era lo que le quería decir denantes."
        literal: "And so, to-her she-turned to ask what was it that to-her she-wanted to-say before."
        ormsby: "so she again asked her what it was she was going to say before."
        vocab:
