        literal: "— This [one] who sings, lady mine, is a son of a gentleman native of-the kingdom of Aragón, lord of two villages, the which lived opposite of the house of my father in the Court;"
        ormsby: "“This singer, dear señora, is the son of a gentleman of Aragón, lord of two villages, who lives opposite my father’s house at Madrid;"
