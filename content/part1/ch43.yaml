              - {s: "que se alojan personas dignas de corona y cetro", r: "what I do not believe: that people worthy of crown and sceptre lodge there"}
        forms:
          - {w: "será", f: "ser- + -á → ser (to be), future, it, here of guesswork: 'it will be (that)', i.e. probably. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "viene", f: "vien- + -e → venir (to come), present, it. Irregular: vengo, vienes, viene, venimos, venís, vienen."}
          - {w: "debe de estar", f: "deb- + -e → deber (must), present, it: debo, debes, debe, debemos, debéis, deben; + de + estar (to be): 'there must be', of probability."}
          - {w: "alguna", f: "algun- + -a → alguno (some), feminine to match 'compañía'."}
          - {w: "de los cuales", f: "'of whom', masculine plural to match 'representantes'; a heavier relative than 'que', used after a comma."}
          - {w: "es tener", f: "es (ser (to be), present, it: soy, eres, es, somos, sois, son) + tener (to have), the infinitive as subject: 'having ... is (their way)'."}
          - {w: "decís", f: "dec- + -ís → decir (to say), present, you (vosotros). Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "se guarda", f: "guard- + -a → guardar (to keep), present, it, with 'se' making it passive: 'is kept'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "ésta", f: "'this one', the pronoun, feminine to stand for 'venta'; written with an accent in these editions."}
          - {w: "creo", f: "cre- + -o → creer (to believe), present, I: creo, crees, cree, creemos, creéis, creen. 'yo' after the verb is emphatic."}
          - {w: "se alojan", f: "aloj- + -an → alojarse (to lodge), present, they (the persons). Same present: alojo, alojas, aloja, alojamos, alojáis, alojan, with 'se'. After 'no creo que' modern Spanish would use the subjunctive 'se alojen'."}
