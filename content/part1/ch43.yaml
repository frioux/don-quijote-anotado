          - {w: "nuevos", f: "nuev- + -os → nuevo (new), masculine plural to match 'sollozos'; before the noun it means 'fresh, more'."}
      - es: "Todo lo cual encendía el deseo de Dorotea, que deseaba saber la causa de tan suave canto y de tan triste lloro."
        literal: "All which kindled the desire of Dorotea, who desired to-know the cause of so sweet singing and of so sad weeping."
