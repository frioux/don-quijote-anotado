          - {w: "ser de", d: "to be characteristic of, belong to: 'de los cuales es tener' = whose business it is to have"}
          - {w: "a menudo", d: "often"}
          - {w: "guardarse silencio", d: "silence is kept"}
          - {w: "alojarse", d: "to lodge, stay, put up"}
          - {w: "digno de", d: "worthy of"}
        diagram:
