  - sentences:
      - es: "— No es sino señor de lugares —respondió Clara—, y el que le tiene en mi alma con tanta seguridad que si él no quiere dejalle, no le será quitado eternamente."
        literal: "— Not he-is but lord of places —answered Clara—, and the [one] which it he-holds in my soul with such security that if he not wishes to-leave-it, not from-him it-will-be taken eternally."
        ormsby: "“Nay, he is the lord of many places,” replied Clara, “and that one in my heart which he holds so firmly shall never be taken from him, unless he be willing to surrender it.”"
        vocab:
          - {w: "no ... sino", d: "nothing but, only; here 'he is no such thing, but a lord'"}
          - {w: "señor de lugares", d: "lord of villages, a nobleman with villages under his rule; 'lugar' is both 'village' and 'place', hence her play on 'the place he holds in my soul'"}
          - {w: "seguridad", d: "security, firmness, sure hold"}
          - {w: "dejalle", d: "= dejarle, to leave it (old -rl- turned into -ll-)"}
          - {w: "eternamente", d: "eternally; with 'no', never ever"}
        diagram:
          - s: "No es sino señor de lugares"
            r: "main verb 1: he is nothing but a lord of villages"
          - {s: "respondió Clara", r: "speech tag: answered Clara"}
          - s: "el que le tiene en mi alma"
            r: "and of the one (place) he holds in my soul"
            under:
              - s: "con tanta seguridad"
                r: "how: so securely"
                under:
                  - s: "que ... no le será quitado eternamente"
                    r: "result: that it will never be taken from him"
                    under:
                      - {s: "si él no quiere dejalle", r: "condition: unless he wants to leave it"}
        forms:
          - {w: "es", f: "ser (to be), present, he. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, she. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "el que le tiene", f: "'el que' = the one which (the place, 'lugar'); 'le' is the object 'it', standing for the place: Cervantes often uses 'le' where modern Spanish says 'lo'. tien- + -e → tener (to hold), present, he. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "tanta", f: "tant- + -a → tanto (so much), feminine to match 'seguridad'; it sets up the result clause 'que ...'."}
          - {w: "quiere", f: "quier- + -e → querer (to want), present, he. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "dejalle", f: "old form of dejarle: dejar (to leave) + le (it), with -rl- assimilated to -ll-, common in Cervantes' time."}
          - {w: "será quitado", f: "ser- + -á → ser (to be), future, it: seré, serás, será, seremos, seréis, serán; + quitado, the participle of quitar (to take away), masculine to match the place: passive 'it will be taken'. 'le' here = from him."}
        note: "A 'señor de vasallos' or lord of villages held land and jurisdiction over the people in it: a rich and high rank. Clara turns the legal phrase into a lover's conceit: he is lord of the 'place' in her heart too."
  - sentences:
