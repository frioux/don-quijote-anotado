        forms:
          - {w: "alcanzan", f: "alcanz- + -an → alcanzar (to win), present, they (the lazy). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. The subject 'perezosos' follows the verb."}
          - {w: "honrados", f: "honr- + -ados → honrar (to honour), participle used as an adjective, masculine plural to match 'triunfos'."}
          - {w: "alguna", f: "algun- + -a → alguno (any), feminine to match 'vitoria'; after the noun in a negative sentence it means 'none whatever'."}
          - {w: "pueden", f: "pued- + -en → poder (to be able), present, they. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "dichosos", f: "dichos- + -os → dichoso (happy), masculine plural to match 'los que'."}
          - {w: "contrastando", f: "gerund of contrastar (to resist): 'resisting'; 'a la fortuna' takes the personal a because Fortune is treated as a person."}
          - {w: "entregan", f: "entreg- + -an → entregar (to surrender), present, they. Same -ar present: entrego, entregas, entrega, entregamos, entregáis, entregan."}
          - {w: "desvalidos", f: "desvalid- + -os → desvalido (helpless), masculine plural to match 'los que'."}
          - {w: "al ocio blando", f: "al = a + el; blando (soft) is masculine singular to match 'ocio'."}
      - es: "Que amor sus glorias venda caras, es gran razón, y es trato justo, pues no hay más rica prenda que la que se quilata por su gusto; y es cosa manifiesta que no es de estima lo que poco cuesta."
        literal: "That love its glories may-sell dear, is great reason, and is bargain just, since not there-is more rich jewel than that which itself is-assayed by its pleasure; and is thing manifest that not is of esteem that which little costs."
        ormsby: "If Love his wares / Do dearly sell, his right must be contest; / What gold compares / With that whereon his stamp he hath imprest? / And all men know / What costeth little that we rate but low."
        ormsby_note: "Proverb 190."
        vocab:
          - {w: "glorias", d: "joys, bliss (of love); 'gloria' is also heaven"}
          - {w: "caro", d: "dear, expensive: 'vender caro' = to sell dear"}
          - {w: "es gran razón", d: "it is entirely right, it stands to reason"}
          - {w: "trato", d: "bargain, deal, dealing"}
          - {w: "prenda", d: "jewel, treasure, something precious; also a pledge, and a word for the beloved"}
          - {w: "quilatar", d: "to assay, test the carats of gold; hence to weigh the worth of something"}
          - {w: "por su gusto", d: "by its pleasure, by the delight it gives; the line is compressed and its exact sense is debated"}
          - {w: "manifiesto", d: "evident, plain"}
          - {w: "de estima", d: "of worth, valued"}
        diagram:
          - s: "es gran razón, y es trato justo"
            r: "main verb 1: it is entirely right and a fair bargain"
            under:
              - {s: "Que amor sus glorias venda caras", r: "subject: that love sells its joys dear"}
              - s: "pues no hay más rica prenda"
                r: "why: since there is no richer jewel"
                under:
                  - {s: "que la que se quilata por su gusto", r: "compared with: than the one whose worth is assayed by its delight"}
          - s: "y es cosa manifiesta"
            r: "main verb 2: and it is a plain fact"
            under:
              - {s: "que no es de estima lo que poco cuesta", r: "what is plain: that what costs little is not valued"}
        forms:
          - {w: "sus glorias", f: "sus = plural to match 'glorias', not the owner; 'its joys' (love's)."}
          - {w: "venda", f: "vend- + -a → vender (to sell), present subjunctive, it (love). The present subjunctive of -er and -ir verbs: -a, -as, -a, -amos, -áis, -an. Subjunctive because the 'que' clause is the subject of a judgement ('es gran razón')."}
          - {w: "caras", f: "car- + -as → caro (dear), feminine plural to match 'glorias': 'sells them dear'."}
          - {w: "gran", f: "grande (great) clipped before any singular noun, here 'razón'."}
          - {w: "hay", f: "from haber (there to be): 'there is'. 'no hay más rica prenda que' = there is no richer jewel than."}
          - {w: "rica", f: "ric- + -a → rico (rich), feminine to match 'prenda'; 'más rica' = richer."}
          - {w: "se quilata", f: "quilat- + -a → quilatar (to assay), present, it, with 'se' making it passive: 'is assayed'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "manifiesta", f: "manifiest- + -a → manifiesto (evident), feminine to match 'cosa'."}
          - {w: "cuesta", f: "cuest- + -a → costar (to cost), present, it. The stem o becomes ue when stressed: cuesto, cuestas, cuesta, costamos, costáis, cuestan."}
        note: "Ormsby's note refers to a proverb: what costs little is little valued. The idea that love's joys must be dearly bought, through long service and suffering, is a commonplace of courtly love poetry."
      - es: "Amorosas porfías tal vez alcanzan imposibles cosas; y ansí, aunque con las mías sigo de amor las más dificultosas, no por eso recelo de no alcanzar desde la tierra el cielo."
        literal: "Loving persistences at-times attain impossible things; and so, although with the mine I-pursue of love the most difficult, not for that I-fear of not reaching from the earth the heaven."
        ormsby: "Love resolute / Knows not the word “impossibility;” / And though my suit / Beset by endless obstacles I see, / Yet no despair / Shall hold me bound to earth while heaven is there."
        vocab:
          - {w: "porfía", d: "persistence, stubborn insistence"}
          - {w: "tal vez", d: "here 'sometimes, now and then' (old sense); modern 'perhaps'"}
          - {w: "ansí", d: "= así, so, thus (old form)"}
          - {w: "dificultoso", d: "difficult, hard"}
          - {w: "no por eso", d: "not for that reason, not on that account"}
          - {w: "recelar", d: "to fear, be wary, suspect"}
          - {w: "alcanzar el cielo", d: "to reach heaven: to win the beloved, who is 'above' the lover"}
        diagram:
          - s: "Amorosas porfías tal vez alcanzan imposibles cosas"
            r: "main verb 1: loving persistence sometimes achieves impossible things"
          - s: "no por eso recelo"
            r: "main verb 2 (after 'y ansí'): I do not therefore fear"
            under:
              - s: "aunque con las mías sigo de amor las más dificultosas"
                r: "concession: although with mine (my persistence) I pursue the hardest (things) of love"
              - {s: "de no alcanzar desde la tierra el cielo", r: "what I do not fear: failing to reach heaven from earth"}
        forms:
          - {w: "Amorosas", f: "amoros- + -as → amoroso (loving), feminine plural to match 'porfías'."}
          - {w: "alcanzan", f: "alcanz- + -an → alcanzar (to achieve), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "imposibles cosas", f: "imposible + -s, plural to match 'cosas'; the adjective put before the noun for the verse."}
          - {w: "las mías", f: "mí- + -as → mío (mine), feminine plural because it stands for 'porfías': 'my persistences'."}
          - {w: "sigo", f: "sig- + -o → seguir (to follow, pursue), present, I. The e of the stem becomes i when stressed (and gu becomes g before o): sigo, sigues, sigue, seguimos, seguís, siguen."}
          - {w: "las más dificultosas", f: "dificultos- + -as → dificultoso (difficult), feminine plural to match 'cosas' understood; 'las más' = the most: the superlative."}
          - {w: "recelo", f: "recel- + -o → recelar (to fear), present, I. Same -ar present: recelo, recelas, recela, recelamos, receláis, recelan. 'recelo de no alcanzar' = I fear not reaching, so 'no por eso recelo' = I am not therefore afraid of failing."}
          - {w: "alcanzar", f: "infinitive of alcanzar (to reach), after 'de no'; its object 'el cielo' comes last for the rhyme."}
  - sentences:
      - es: "Aquí dio fin la voz, y principio a nuevos sollozos Clara."
        literal: "Here gave end the voice, and beginning to new sobs Clara."
        ormsby: "Here the voice ceased and Clara’s sobs began afresh,"
        vocab:
