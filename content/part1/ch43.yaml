  - sentences:
      - es: "Cansábanse los compañeros que con el preguntante venían del coloquio que con don Quijote pasaba, y así, tornaron a llamar con grande furia; y fue de modo que el ventero despertó, y aun todos cuantos en la venta estaban; y así, se levantó a preguntar quién llamaba."
        literal: "Were-tiring-themselves the companions who with the questioner came of-the conversation that with Don Quijote was-passing, and so, they-returned to knock with great fury; and it-was of manner that the innkeeper awoke, and even all as-many-as in the inn were; and so, he-got-up to ask who was-knocking."
        ormsby: "But the comrades of the spokesman, growing weary of the dialogue with Don Quixote, renewed their knocks with great vehemence, so much so that the host, and not only he but everybody in the inn, awoke, and he got up to ask who knocked."
        vocab:
          - {w: "cansarse de", d: "to grow tired of"}
          - {w: "preguntante", d: "questioner, the one asking (here the rider who did the talking)"}
          - {w: "coloquio", d: "conversation, dialogue (literary)"}
          - {w: "pasar", d: "here 'to go on, take place' (of a conversation)"}
          - {w: "tornar a", d: "to do again: 'tornaron a llamar' = they knocked again"}
          - {w: "grande", d: "= gran, great (the full form before a noun is old-fashioned)"}
          - {w: "de modo que", d: "so that, in such a way that"}
          - {w: "todos cuantos", d: "all those who, everyone that"}
        diagram:
          - s: "Cansábanse los compañeros"
            r: "main verb 1: the companions were growing tired"
            under:
              - {s: "que con el preguntante venían", r: "describes 'compañeros': who came with the questioner"}
              - s: "del coloquio"
                r: "of what: of the conversation"
                under:
                  - {s: "que con don Quijote pasaba", r: "describes 'coloquio': that was going on with Don Quijote"}
          - s: "tornaron a llamar con grande furia"
            r: "main verb 2 (after 'y así'): they knocked again furiously"
          - s: "y fue de modo"
            r: "main verb 3: and it was in such a way"
            under:
              - {s: "que el ventero despertó, y aun todos cuantos en la venta estaban", r: "result: that the innkeeper woke, and indeed everyone in the inn"}
          - s: "se levantó a preguntar"
            r: "main verb 4 (after 'y así'): he got up to ask"
            under:
              - {s: "quién llamaba", r: "what: who was knocking"}
        forms:
          - {w: "Cansábanse", f: "cans- + -aban + se → cansarse (to grow tired), imperfect, they, with 'se' stuck on the end; modern 'se cansaban'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. Cervantes hangs the pronoun on a verb that opens its clause."}
          - {w: "venían", f: "ven- + -ían → venir (to come), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "pasaba", f: "pas- + -aba → pasar (to go on), imperfect, it (the conversation). Same -aba imperfect."}
          - {w: "tornaron", f: "torn- + -aron → tornar (to return, do again), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "fue", f: "ser (to be), preterite, it. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "despertó", f: "despert- + -ó → despertar (to wake up), preterite, he. Same -ar preterite: desperté, despertaste, despertó, despertamos, despertasteis, despertaron."}
          - {w: "estaban", f: "est- + -aban → estar (to be), imperfect, they. Same -aba imperfect: estaba, estabas, estaba, estábamos, estabais, estaban."}
          - {w: "se levantó", f: "levant- + -ó → levantarse (to get up), preterite, he, with 'se'. Same -ar preterite."}
          - {w: "llamaba", f: "llam- + -aba → llamar (to knock), imperfect, he / one. Same -aba imperfect."}
      - es: "Sucedió en este tiempo que una de las cabalgaduras en que venían los cuatro que llamaban se llegó a oler a Rocinante, que, melancólico y triste, con las orejas caídas, sostenía sin moverse a su estirado señor;"
