          - {w: "proseguían", f: "prosegu- + -ían → proseguir (to continue), imperfect, they (people in general, i.e. the song went on). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
  - sentences:
      - es: "-Dulce esperanza mía, que, rompiendo imposibles y malezas, sigues firme la vía que tú mesma te finges y aderezas: no te desmaye el verte a cada paso junto al de tu muerte."
        literal: "-Sweet hope mine, who, breaking-through impossibilities and thickets, you-follow firm the way that you yourself for-yourself you-imagine and you-make-ready: not you may-dishearten the seeing-yourself at each step next to-the [step] of your death."
        ormsby: "Sweet Hope, my stay, / That onward to the goal of thy intent / Dost make thy way, / Heedless of hindrance or impediment, / Have thou no fear / If at each step thou findest death is near."
        vocab:
          - {w: "imposibles", d: "here a noun: impossibilities, impossible obstacles"}
          - {w: "maleza", d: "undergrowth, brambles, thicket"}
          - {w: "vía", d: "way, road (poetic)"}
          - {w: "mesma", d: "= misma, self, same (old form)"}
          - {w: "fingirse", d: "to imagine, invent for oneself"}
          - {w: "aderezar", d: "to prepare, make ready, set in order"}
          - {w: "desmayar", d: "to dishearten, make lose heart (also 'to faint')"}
          - {w: "a cada paso", d: "at every step"}
        diagram:
          - s: "Dulce esperanza mía"
            r: "address: my sweet hope"
            under:
              - s: "que, rompiendo imposibles y malezas, sigues firme la vía"
                r: "describes 'esperanza': who, breaking through impossibilities and brambles, keep steadily to the road"
                under:
                  - {s: "que tú mesma te finges y aderezas", r: "describes 'vía': which you yourself imagine and prepare"}
          - s: "no te desmaye"
            r: "main verb: let it not dishearten you"
            under:
              - s: "el verte a cada paso"
                r: "subject: seeing yourself at every step"
                under:
                  - {s: "junto al de tu muerte", r: "where: right beside the step of your death"}
        forms:
          - {w: "mía", f: "mí- + -a → mío (my), feminine to match 'esperanza'; placed after the noun it is emphatic, 'hope of mine'."}
          - {w: "rompiendo", f: "gerund of romper (to break): 'breaking through'."}
          - {w: "sigues", f: "sigu- + -es → seguir (to follow), present, you (tú). The e of the stem becomes i when stressed: sigo, sigues, sigue, seguimos, seguís, siguen."}
          - {w: "mesma", f: "= misma (self), feminine to match 'tú', the hope: 'you yourself'."}
          - {w: "te finges", f: "fing- + -es → fingirse (to imagine for oneself), present, you, with 'te'. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "aderezas", f: "aderez- + -as → aderezar (to prepare), present, you. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "desmaye", f: "desmay- + -e → desmayar (to dishearten), present subjunctive, it, for a wish or command: 'let it not dishearten you'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "el verte", f: "ver (to see) + te (yourself), an infinitive used as a noun with 'el': 'the seeing yourself'. It is the subject of 'desmaye'."}
          - {w: "al de", f: "al = a + el; 'el de tu muerte' = the one (the step) of your death, the noun 'paso' left out."}
        note: "The second song is in a different, more learned stanza, alternating short and long lines (seven and eleven syllables), as Ormsby's translation imitates. The singer addresses his own hope, which goes on through impossible obstacles."
      - es: "No alcanzan perezosos honrados triunfos ni vitoria alguna, ni pueden ser dichosos los que, no contrastando a la fortuna, entregan, desvalidos, al ocio blando todos los sentidos."
        literal: "Not attain lazy-ones honoured triumphs nor victory any, nor can be happy those who, not resisting [to] the fortune, hand-over, helpless, to-the idleness soft all the senses."
        ormsby: "No victory, / No joy of triumph doth the faint heart know; / Unblest is he / That a bold front to Fortune dares not show, / But soul and sense / In bondage yieldeth up to indolence."
        vocab:
          - {w: "alcanzar", d: "to attain, win, reach"}
