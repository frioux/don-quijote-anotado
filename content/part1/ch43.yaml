          - {w: "soltarse", f: "soltar (to loosen) + se (himself), infinitive after 'fue imposible'."}
  - sentences:
      - es: "Estaba, pues, como se ha dicho, de pies sobre Rocinante, metido todo el brazo por el agujero y atado de la muñeca, y al cerrojo de la puerta, con grandísimo temor y cuidado, que si Rocinante se desviaba a un cabo o a otro, había de quedar colgado del brazo;"
        literal: "He-was, then, as itself has said, on feet upon Rocinante, put all the arm through the hole and tied by the wrist, and to-the bolt of the door, with very-great fear and anxiety, that if Rocinante himself turned-aside to one end or to other, he-was-to remain hanging from-the arm;"
        ormsby: "He was, as has been said, standing on Rocinante, with his arm passed through the hole and his wrist tied to the bolt of the door, and in mighty fear and dread of being left hanging by the arm if Rocinante were to stir one side or the other;"
        vocab:
