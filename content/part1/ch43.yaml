        forms:
          - {w: "la suya", f: "'hers', feminine to match the feminine noun understood, 'cara' (face) from the 'tres caras' before: envious of her face."}
          - {w: "la estás ... mirando", f: "est- + -ás → estar (to be), present, you (tú): estoy, estás, está, estamos, estáis, están; + mirando, gerund of mirar (to look at): the progressive, 'you are looking at'. The object pronoun 'la' (her) goes before the whole group."}
      - es: "que, o paseándose por alguna galería de sus suntuosos palacios, o ya puesta de pechos sobre algún balcón, está considerando cómo, salva su honestidad y grandeza, ha de amansar la tormenta que por ella este mi cuitado corazón padece, qué gloria ha de dar a mis penas, qué sosiego a mi cuidado y, finalmente, qué vida a mi muerte y qué premio a mis servicios."
        literal: "for, either strolling-herself through some gallery of her sumptuous palaces, or now placed of breasts upon some balcony, she-is considering how, safe her chastity and greatness, she-has to tame the storm that for her this my wretched heart suffers, what glory she-has to give to my pains, what calm to my care and, finally, what life to my death and what reward to my services."
