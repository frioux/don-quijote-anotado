          - {w: "escopeta", d: "musket, firelock (a long gun; today 'shotgun')"}
          - {w: "arzón", d: "saddle-bow, the raised front (or back) of a saddle"}
        diagram:
          - s: "Pero engañóse mucho"
            r: "main verb 1: but he was much mistaken"
            under:
              - {s: "en su creencia", r: "in what: in his belief (that he would stay enchanted)"}
          - s: "llegaron a la venta"
            r: "main verb 2 (after 'porque'): there arrived at the inn"
            under:
              - {s: "apenas comenzó a amanecer, cuando", r: "when: hardly had dawn begun, when"}
              - s: "cuatro hombres de a caballo"
                r: "subject: four horsemen"
                under:
                  - {s: "muy bien puestos y aderezados", r: "describes 'hombres': very well turned-out and equipped"}
                  - {s: "con sus escopetas sobre los arzones", r: "describes 'hombres': with their muskets across their saddle-bows"}
        forms:
          - {w: "engañóse", f: "engañ- + -ó + se → engañarse (to be mistaken), preterite, he, with 'se' stuck on the end; modern 'se engañó'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. Cervantes often hangs the pronoun on a verb that opens its clause."}
          - {w: "comenzó a amanecer", f: "comenz- + -ó → comenzar (to begin), preterite, it: comencé, comenzaste, comenzó, comenzamos, comenzasteis, comenzaron (z → c before e); + a + amanecer (to dawn), the infinitive after 'comenzar a': 'it began to dawn'."}
          - {w: "llegaron", f: "lleg- + -aron → llegar (to arrive), preterite, they: llegué, llegaste, llegó, llegamos, llegasteis, llegaron (g → gu before e). The subject 'cuatro hombres' comes after the verb."}
          - {w: "puestos y aderezados", f: "puestos: irregular participle of poner (to put, here 'to dress, turn out'); aderez- + -ados → aderezar (to equip), participle; both masculine plural to match 'hombres'."}
          - {w: "sus escopetas", f: "sus = plural to match 'escopetas', not the owners; 'their muskets'."}
        note: "The muskets mark these riders as armed travellers of Cervantes' own day, not knights of romance: the modern world rides up to the 'castle' while Don Quijote is still tied to its window."
      - es: "Llamaron a la puerta de la venta, que aún estaba cerrada, con grandes golpes; lo cual, visto por don Quijote desde donde aún no dejaba de hacer la centinela, con voz arrogante y alta dijo:"
        literal: "They-called at the door of the inn, which still was closed, with great blows; the which, seen by Don Quijote from where still not he-left-off to do the sentry, with voice arrogant and loud he-said:"
        ormsby: "They called out and knocked loudly at the gate of the inn, which was still shut; on seeing which, Don Quixote, even there where he was, did not forget to act as sentinel, and said in a loud and imperious tone,"
        vocab:
          - {w: "llamar a la puerta", d: "to knock at the door (not only 'to call')"}
          - {w: "golpe", d: "blow, knock"}
          - {w: "lo cual", d: "which (referring to the whole preceding idea)"}
          - {w: "no dejar de", d: "not to stop, keep on (doing)"}
          - {w: "hacer la centinela", d: "to stand sentry, keep watch ('centinela' was often feminine then)"}
          - {w: "arrogante", d: "haughty, proud; here also 'bold, commanding'"}
        diagram:
          - s: "Llamaron a la puerta de la venta"
            r: "main verb 1: they knocked at the inn door"
            under:
              - {s: "que aún estaba cerrada", r: "describes 'puerta': which was still shut"}
              - {s: "con grandes golpes", r: "how: with great blows"}
          - s: "dijo:"
            r: "main verb 2: he said"
            under:
              - s: "lo cual, visto por don Quijote"
                r: "when: which being seen by Don Quijote (absolute participle)"
                under:
                  - {s: "desde donde aún no dejaba de hacer la centinela", r: "where from: from where he was still keeping watch"}
              - {s: "con voz arrogante y alta", r: "how: in a haughty, loud voice"}
        forms:
          - {w: "Llamaron", f: "llam- + -aron → llamar (to knock, call), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "estaba cerrada", f: "est- + -aba → estar (to be), imperfect, it: estaba, estabas, estaba, estábamos, estabais, estaban; + cerrada, participle of cerrar (to shut), feminine to match 'puerta'."}
          - {w: "visto", f: "irregular participle of ver (to see), in an absolute construction: 'lo cual, visto por don Quijote' = this being seen by Don Quijote, i.e. when Don Quijote saw it. Masculine singular to match 'lo cual'."}
          - {w: "dejaba", f: "dej- + -aba → dejar (to leave off), imperfect, he. Same -aba imperfect: dejaba, dejabas, dejaba, dejábamos, dejabais, dejaban. 'no dejaba de hacer' = he did not stop doing."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
        note: "Don Quijote has been tied by the wrist all night and is in no position to guard anything, but he still speaks as the sentinel of the castle."
  - sentences:
      - es: "— Caballeros, o escuderos, o quienquiera que seáis: no tenéis para qué llamar a las puertas deste castillo;"
        literal: "— Knights, or squires, or whoever that you-may-be: not you-have for what to-knock at the doors of-this castle;"
        ormsby: "“Knights, or squires, or whatever ye be, ye have no right to knock at the gates of this castle;"
        vocab:
          - {w: "quienquiera que", d: "whoever"}
          - {w: "no tener para qué", d: "to have no reason to, no need to"}
          - {w: "deste", d: "= de este, of this (old contraction)"}
        diagram:
          - s: "no tenéis para qué llamar a las puertas deste castillo;"
            r: "main verb: you have no reason to knock at the gates of this castle"
            under:
              - {s: "Caballeros, o escuderos, o quienquiera que seáis:", r: "who is addressed: knights, squires, or whoever you are"}
        forms:
          - {w: "seáis", f: "se- + -áis → ser (to be), present subjunctive, you (vosotros): sea, seas, sea, seamos, seáis, sean. Subjunctive after 'quienquiera que' because the speaker does not know who they are."}
          - {w: "tenéis", f: "ten- + -éis → tener (to have), present, you (vosotros). Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "llamar", f: "infinitive of llamar (to knock), after 'para qué'."}
          - {w: "deste", f: "de + este (this) run together, an old contraction like 'del'; modern Spanish writes 'de este'."}
        note: "Don Quijote addresses the riders with the formal plural 'vosotros' forms that knights use in the romances, and treats the inn gate as a castle gate that must not be opened before day."
      - es: "que asaz de claro está que a tales horas, o los que están dentro duermen, o no tienen por costumbre de abrirse las fortalezas hasta que el sol esté tendido por todo el suelo."
        literal: "for enough of clear it-is that at such hours, either those who are inside sleep, or not they-have as custom of opening-themselves the fortresses until that the sun may-be spread over all the ground."
        ormsby: "for it is plain enough that they who are within are either asleep, or else are not in the habit of throwing open the fortress until the sun’s rays are spread over the whole surface of the earth."
        vocab:
          - {w: "asaz", d: "enough, quite (old-fashioned, literary): 'asaz de claro' = quite clear"}
          - {w: "a tales horas", d: "at such an hour"}
          - {w: "tener por costumbre", d: "to be in the habit of, have as a custom"}
          - {w: "fortaleza", d: "fortress, stronghold"}
          - {w: "tendido", d: "stretched out, spread out (from 'tender', to spread)"}
        diagram:
          - s: "asaz de claro está"
            r: "main verb (after 'que', for): it is quite clear"
            under:
              - s: "que a tales horas"
                r: "what is clear: that at such an hour"
                under:
                  - {s: "o los que están dentro duermen", r: "either: those inside are asleep"}
                  - s: "o no tienen por costumbre de abrirse las fortalezas"
                    r: "or: fortresses are not in the habit of being opened"
                    under:
                      - {s: "hasta que el sol esté tendido por todo el suelo", r: "until when: until the sun is spread over the whole ground"}
        forms:
          - {w: "está", f: "est- + -á → estar (to be), present, it: estoy, estás, está, estamos, estáis, están. 'claro está' = it is clear, with the adjective first for emphasis."}
          - {w: "están", f: "est- + -án → estar (to be), present, they. Same forms: estoy, estás, está, estamos, estáis, están."}
          - {w: "duermen", f: "duerm- + -en → dormir (to sleep), present, they. The stem o becomes ue when stressed: duermo, duermes, duerme, dormimos, dormís, duermen."}
          - {w: "tienen", f: "tien- + -en → tener (to have), present, they. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "abrirse", f: "abrir (to open) + se, the infinitive with 'se' making it passive: 'to be opened'. Its subject is 'las fortalezas'."}
          - {w: "esté tendido", f: "est- + -é → estar (to be), present subjunctive, it (the sun): esté, estés, esté, estemos, estéis, estén; subjunctive after 'hasta que' for a time not yet reached. + tendido, participle of tender (to spread), masculine to match 'sol'."}
      - es: "Desviaos afuera, y esperad que aclare el día, y entonces veremos si será justo o no que os abran."
        literal: "Move-yourselves-aside outwards, and wait that may-clear-up the day, and then we-shall-see if it-will-be just or not that to-you they-may-open."
        ormsby: "Withdraw to a distance, and wait till it is broad daylight, and then we shall see whether it will be proper or not to open to you.”"
        vocab:
          - {w: "desviarse", d: "to move aside, step away"}
          - {w: "afuera", d: "outside, away"}
          - {w: "aclarar", d: "(of the day) to grow light, clear up"}
          - {w: "justo", d: "right, proper, fitting"}
        diagram:
          - {s: "Desviaos afuera", r: "main verb 1: move away"}
          - s: "esperad"
            r: "main verb 2 (after 'y'): wait"
            under:
              - {s: "que aclare el día", r: "what for: for the day to grow light"}
          - s: "entonces veremos"
            r: "main verb 3 (after 'y'): then we shall see"
            under:
              - s: "si será justo o no"
                r: "what: whether it will be right or not"
                under:
                  - {s: "que os abran", r: "what may be right: that they open to you"}
        forms:
          - {w: "Desviaos", f: "desvi- + -ad + os → desviarse (to move aside), imperative, you (vosotros), with 'os' (yourselves) on the end. The -d of the imperative drops before 'os': desviad + os → desviaos (compare 'sentaos', 'callaos')."}
          - {w: "esperad", f: "esper- + -ad → esperar (to wait), imperative, you (vosotros): the final -r of the infinitive becomes -d (esperad, comed, vivid)."}
          - {w: "aclare", f: "aclar- + -e → aclarar (to grow light), present subjunctive, it (the day): aclare, aclares, aclare, aclaremos, aclaréis, aclaren. Subjunctive after 'esperar que' (wait for something to happen)."}
          - {w: "veremos", f: "ver- + -emos → ver (to see), future, we. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "será", f: "ser- + -á → ser (to be), future, it. Same future endings: seré, serás, será, seremos, seréis, serán."}
          - {w: "abran", f: "abr- + -an → abrir (to open), present subjunctive, they (people inside, unnamed): abra, abras, abra, abramos, abráis, abran. Subjunctive after 'será justo que'; 'os' = to you."}
  - sentences:
      - es: "— ¿Qué diablos de fortaleza o castillo es éste —dijo uno—, para obligarnos a guardar esas ceremonias?"
        literal: "— What devils of fortress or castle is this-one —said one—, to oblige-us to keep those ceremonies?"
        ormsby: "“What the devil fortress or castle is this,” said one, “to make us stand on such ceremony?"
        vocab:
          - {w: "qué diablos de", d: "what the devil of a ..., an impatient oath"}
          - {w: "obligar a", d: "to oblige, force to"}
          - {w: "guardar ceremonias", d: "to stand on ceremony, observe formalities"}
        diagram:
          - s: "¿Qué diablos de fortaleza o castillo es éste"
            r: "main verb: what the devil of a fortress or castle is this"
            under:
              - {s: "—dijo uno—", r: "aside: one of them said"}
              - {s: "para obligarnos a guardar esas ceremonias?", r: "purpose: that it forces us to stand on such ceremony"}
        forms:
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "éste", f: "'this one', the pronoun, written with an accent in Cervantes' editions to tell it from the adjective 'este'; masculine to match 'castillo'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "obligarnos", f: "obligar (to oblige) + nos (us), the pronoun hung on the infinitive after 'para'."}
          - {w: "esas", f: "es- + -as → ese (that), feminine plural to match 'ceremonias'."}
      - es: "Si sois el ventero, mandad que nos abran, que somos caminantes que no queremos más de dar cebada a nuestras cabalgaduras y pasar adelante, porque vamos de priesa."
        literal: "If you-are the innkeeper, order that to-us they-may-open, for we-are travellers who not want more than to-give barley to our mounts and to-pass onward, because we-go in haste."
        ormsby: "If you are the innkeeper bid them open to us; we are travellers who only want to feed our horses and go on, for we are in haste.”"
        vocab:
          - {w: "ventero", d: "innkeeper (of a 'venta', a roadside inn)"}
          - {w: "caminante", d: "traveller, wayfarer"}
          - {w: "no ... más de", d: "nothing more than, only"}
          - {w: "cebada", d: "barley, the usual feed for horses and mules"}
          - {w: "cabalgadura", d: "mount, riding animal (horse or mule)"}
          - {w: "pasar adelante", d: "to go on, continue the journey"}
          - {w: "de priesa", d: "= de prisa, in a hurry ('priesa' is the old form)"}
        diagram:
          - s: "mandad"
            r: "main verb: order"
            under:
              - {s: "Si sois el ventero", r: "condition: if you are the innkeeper"}
              - {s: "que nos abran", r: "what to order: that they open to us"}
              - s: "que somos caminantes"
                r: "why: for we are travellers"
                under:
                  - {s: "que no queremos más de dar cebada a nuestras cabalgaduras y pasar adelante", r: "describes 'caminantes': who only want to feed our mounts and go on"}
                  - {s: "porque vamos de priesa", r: "why: because we are in a hurry"}
        forms:
          - {w: "sois", f: "ser (to be), present, you (vosotros, used to one person as a polite form): soy, eres, es, somos, sois, son."}
          - {w: "mandad", f: "mand- + -ad → mandar (to order), imperative, you (vosotros): the final -r of the infinitive becomes -d."}
          - {w: "abran", f: "abr- + -an → abrir (to open), present subjunctive, they: abra, abras, abra, abramos, abráis, abran. Subjunctive after 'mandar que' (order that)."}
          - {w: "somos", f: "ser (to be), present, we: soy, eres, es, somos, sois, son."}
          - {w: "queremos", f: "quer- + -emos → querer (to want), present, we. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "nuestras", f: "nuestr- + -as → nuestro (our), feminine plural to match 'cabalgaduras'."}
          - {w: "vamos", f: "ir (to go), present, we. Irregular: voy, vas, va, vamos, vais, van."}
          - {w: "priesa", f: "old form of prisa (haste)."}
  - sentences:
      - es: "— ¿Paréceos, caballeros, que tengo yo talle de ventero? —respondió don Quijote."
        literal: "— Does-it-seem-to-you, gentlemen, that have I [the] figure of innkeeper? —answered Don Quijote."
        ormsby: "“Do you think, gentlemen, that I look like an innkeeper?” said Don Quixote."
        vocab:
          - {w: "parecer", d: "to seem; 'paréceos que ...?' = do you think that ...?"}
          - {w: "talle", d: "figure, build, look; 'tener talle de' = to look like"}
        diagram:
          - s: "¿Paréceos"
            r: "main verb: does it seem to you"
            under:
              - {s: "caballeros", r: "who is addressed: gentlemen"}
              - {s: "que tengo yo talle de ventero?", r: "what seems: that I look like an innkeeper"}
          - {s: "—respondió don Quijote.", r: "main verb 2: Don Quijote answered"}
        forms:
          - {w: "Paréceos", f: "parec- + -e + os → parecer (to seem), present, it, with 'os' (to you) stuck on the end; modern '¿Os parece?'. Present: parezco, pareces, parece, parecemos, parecéis, parecen. A verb opening a sentence takes its pronoun on the end in Cervantes."}
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen. The subject 'yo' after the verb is emphatic: 'do I look ...?'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
  - sentences:
      - es: "— No sé de qué tenéis talle —respondió el otro—, pero sé que decís disparates en llamar castillo a esta venta."
        literal: "— Not I-know of what you-have figure —answered the other—, but I-know that you-say nonsense in calling castle to this inn."
        ormsby: "“I don’t know what you look like,” replied the other; “but I know that you are talking nonsense when you call this inn a castle.”"
        vocab:
          - {w: "talle", d: "figure, look; 'tener talle de' = to look like"}
          - {w: "disparate", d: "piece of nonsense; 'decir disparates' = to talk nonsense"}
          - {w: "en + infinitive", d: "in doing; 'en llamar' = in calling, when you call"}
        diagram:
          - s: "No sé"
            r: "main verb 1: I do not know"
            under:
              - {s: "de qué tenéis talle", r: "what: what you look like"}
              - {s: "—respondió el otro—", r: "aside: the other answered"}
          - s: "pero sé"
            r: "main verb 2: but I know"
            under:
              - s: "que decís disparates"
                r: "what: that you talk nonsense"
                under:
                  - {s: "en llamar castillo a esta venta", r: "how: in calling this inn a castle"}
        forms:
          - {w: "sé", f: "saber (to know), present, I. Irregular: sé, sabes, sabe, sabemos, sabéis, saben. The accent tells it from 'se'."}
          - {w: "tenéis", f: "ten- + -éis → tener (to have), present, you (vosotros). Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "decís", f: "dec- + -ís → decir (to say), present, you (vosotros). Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "llamar castillo a esta venta", f: "infinitive of llamar (to call) after 'en'; 'llamar X a Y' = to call Y an X, with 'a' before the thing named. 'esta' = feminine of este (this), to match 'venta'."}
  - sentences:
      - es: "— Castillo es —replicó don Quijote—, y aun de los mejores de toda esta provincia; y gente tiene dentro que ha tenido cetro en la mano y corona en la cabeza."
        literal: "— Castle it-is —replied Don Quijote—, and even of the best of all this province; and people it-has inside who has had sceptre in the hand and crown on the head."
        ormsby: "“A castle it is,” returned Don Quixote, “nay, more, one of the best in this whole province, and it has within it people who have had the sceptre in the hand and the crown on the head.”"
        vocab:
          - {w: "replicar", d: "to reply, retort"}
          - {w: "aun", d: "even, what is more"}
          - {w: "provincia", d: "province, region"}
          - {w: "cetro", d: "sceptre"}
        diagram:
          - s: "Castillo es"
            r: "main verb 1: it is a castle"
            under:
              - {s: "—replicó don Quijote—", r: "aside: Don Quijote retorted"}
              - {s: "y aun de los mejores de toda esta provincia", r: "what kind: and one of the best in the whole province"}
          - s: "y gente tiene dentro"
            r: "main verb 2: and it has people inside"
            under:
              - {s: "que ha tenido cetro en la mano y corona en la cabeza", r: "describes 'gente': who have held sceptre in hand and crown on head"}
        forms:
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son. 'Castillo' is put first for emphasis: 'a castle it is'."}
          - {w: "replicó", f: "replic- + -ó → replicar (to retort), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (repliqué, with c → qu before e)."}
          - {w: "mejores", f: "plural of mejor (better, best), to match 'los' (castles); 'de los mejores' = one of the best."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, it (the castle). Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "ha tenido", f: "h- + -a → haber (to have, the helper verb), present, it: he, has, ha, hemos, habéis, han; + tenido, participle of tener (to have, hold): the present perfect, 'has held'. Singular because 'gente' (people) is a singular noun."}
        note: "He means Dorotea, whom he still takes for Princess Micomicona, and perhaps the noble guests at the inn. The traveller's reply will turn the 'sceptre and crown' into stage props."
  - sentences:
      - es: "— Mejor fuera al revés —dijo el caminante—: el cetro en la cabeza y la corona en la mano."
        literal: "— Better it-would-be the other-way-round —said the traveller—: the sceptre on the head and the crown in the hand."
        ormsby: "“It would be better if it were the other way,” said the traveller, “the sceptre on the head and the crown in the hand;"
        vocab:
          - {w: "al revés", d: "the other way round, backwards"}
          - {w: "caminante", d: "traveller, wayfarer"}
        diagram:
          - s: "Mejor fuera al revés"
            r: "main verb: it would be better the other way round"
            under:
              - {s: "—dijo el caminante—", r: "aside: the traveller said"}
              - {s: "el cetro en la cabeza y la corona en la mano", r: "explains 'al revés': sceptre on the head, crown in the hand"}
        forms:
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), it, used as a conditional: 'it would be'. ser (to be) in the -ra form: fuera, fueras, fuera, fuéramos, fuerais, fueran. Cervantes often uses the -ra form where modern Spanish says 'sería'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
        note: "A jibe: a sceptre on the head would be a blow from a stick. The traveller jokes that the inn's 'crowned heads' are more likely to have been beaten than enthroned."
      - es: "Y será, si a mano viene, que debe de estar dentro alguna compañía de representantes, de los cuales es tener a menudo esas coronas y cetros que decís, porque en una venta tan pequeña, y adonde se guarda tanto silencio como ésta, no creo yo que se alojan personas dignas de corona y cetro."
        literal: "And it-will-be, if to hand it-comes, that must be inside some company of players, of whom it-is [the way] to-have often those crowns and sceptres that you-say, because in an inn so small, and where itself keeps so-much silence as this-one, not believe I that lodge-themselves persons worthy of crown and sceptre."
        ormsby: "but if so, maybe there is within some company of players, with whom it is a common thing to have those crowns and sceptres you speak of; for in such a small inn as this, and where such silence is kept, I do not believe any people entitled to crowns and sceptres can have taken up their quarters.”"
        vocab:
