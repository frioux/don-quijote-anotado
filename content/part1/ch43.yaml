            r: "main verb 1: she stopped up"
            under:
              - {s: "por no oílle", r: "why: so as not to hear him"}
              - {s: "con las manos", r: "how: with her hands"}
              - {s: "entrambos oídos", r: "object: both ears"}
              - {s: "de lo que también se admiró Dorotea", r: "comment: at which Dorotea was amazed again"}
          - s: "la cual"
            r: "subject of main verb 2: Dorotea, who"
            under:
              - {s: "estando atenta a lo que se cantaba", r: "how: listening closely to what was being sung"}
              - {s: "vio que proseguían en esta manera:", r: "main verb 2: saw that they went on like this"}
        forms:
          - {w: "oílle", f: "old form of oírle: oír (to hear) + le (him), with -rl- assimilated to -ll-; infinitive after 'por no' (so as not to)."}
          - {w: "se tapó", f: "tap- + -ó → taparse (to cover one's own), preterite, she, with 'se'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "entrambos", f: "old form of ambos (both), masculine plural to match 'oídos'."}
          - {w: "se admiró", f: "admir- + -ó → admirarse (to be amazed), preterite, she (Dorotea), with 'se'. Same -ó preterite."}
          - {w: "la cual", f: "'who, which', feminine to match 'Dorotea'; a heavier relative than 'que', used after a pause."}
          - {w: "estando atenta", f: "gerund of estar (to be): 'being'; atent- + -a → atento (attentive), feminine to match Dorotea."}
