  - sentences:
      - es: "— Señor, quien quiera que seáis, hacednos merced y beneficio de darnos un poco de romero, aceite, sal y vino, que es menester para curar uno de los mejores caballeros andantes que hay en la tierra, el cual yace en aquella cama, malferido por las manos del encantado moro que está en esta venta."
        literal: "— Sir, whoever that you-may-be, do-us grace and benefit of giving-us a little of rosemary, oil, salt and wine, for it-is needed for to-treat one of the best knights errant that there-are on the earth, the which lies in that bed, badly-wounded by the hands of-the enchanted Moor who is in this inn."
        ormsby: "“Señor, whoever you are, do us the favour and kindness to give us a little rosemary, oil, salt, and wine, for it is wanted to cure one of the best knights-errant on earth, who lies on yonder bed wounded by the hands of the enchanted Moor that is in this inn.”"
        vocab:
          - {w: "quien quiera que seáis", d: "whoever you may be"}
          - {w: "hacer merced", d: "to do a favor, be so kind as to"}
          - {w: "beneficio", d: "kindness, favor"}
          - {w: "ser menester", d: "to be needed, necessary"}
          - {w: "curar", d: "to treat, nurse (a wound or patient); not only 'to cure'"}
          - {w: "el cual", d: "who, which (a formal relative)"}
          - {w: "yacer", d: "to lie (in bed, wounded, or in a grave)"}
          - {w: "malferido", d: "= malherido, badly wounded; the old f- form of the romances"}
        diagram:
          - s: "hacednos merced y beneficio"
            r: "main verb (polite command): do us the favor and kindness"
            under:
              - {s: "Señor, quien quiera que seáis", r: "who is addressed: sir, whoever you are"}
              - {s: "de darnos un poco de romero, aceite, sal y vino", r: "of what: of giving us a little rosemary, oil, salt and wine"}
              - s: "que es menester para curar uno de los mejores caballeros andantes"
                r: "why: for it is needed to treat one of the best knights-errant"
                under:
                  - {s: "que hay en la tierra", r: "describes 'caballeros': that there are on earth"}
                  - s: "el cual yace en aquella cama, malferido por las manos del encantado moro"
                    r: "describes 'uno': who lies in that bed, badly wounded by the hands of the enchanted Moor"
                    under:
                      - {s: "que está en esta venta", r: "describes 'moro': who is in this inn"}
        forms:
          - {w: "seáis", f: "se- + -áis → ser (to be), present subjunctive, you (vos): 'whoever you may be'. ser in the present subjunctive: sea, seas, sea, seamos, seáis, sean."}
          - {w: "hacednos", f: "haced + nos → hacer (to do), command, you (vos, the plural or polite 'you'), with 'nos' (for us) on the end. The vos command ends in -d: haced, dad, decid."}
          - {w: "darnos", f: "dar (to give) + nos (to us), the pronoun hung on the infinitive."}
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "mejores", f: "mejor (better, best), plural to match 'caballeros'; 'los mejores' = the best."}
          - {w: "hay", f: "haber, present, used alone: 'there are'; it stays singular even with a plural."}
          - {w: "yace", f: "yac- + -e → yacer (to lie), present, he. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (but 'yazgo' or 'yago' for I)."}
          - {w: "malferido", f: "mal (badly) + ferido (= herido, the participle of herir, to wound), masculine to match 'uno'."}
          - {w: "del", f: "de + el (of the), the contraction modern Spanish still makes."}
        note: "Sancho uses 'vos' and asks for the balsam's ingredients in his master's high style, explaining that a knight lies wounded by an enchanted Moor: no wonder the officer thinks him mad."
      - es: "Cuando el cuadrillero tal oyó, túvole por hombre falto de seso; y, porque ya comenzaba a amanecer, abrió la puerta de la venta, y, llamando al ventero, le dijo lo que aquel buen hombre quería."
        literal: "When the officer such heard, he-held-him for man lacking of sense; and, because already it-was-beginning to dawn, he-opened the door of the inn, and, calling [to] the innkeeper, to-him he-said that which that good man wanted."
        ormsby: "When the officer heard him talk in this way, he took him for a man out of his senses, and as day was now beginning to break, he opened the inn gate, and calling the host, he told him what this good man wanted."
        vocab:
          - {w: "tal", d: "such a thing, this"}
          - {w: "tener por", d: "to take for, consider (as)"}
          - {w: "falto de seso", d: "lacking sense, out of his wits"}
          - {w: "amanecer", d: "to dawn, grow light"}
        diagram:
          - s: "túvole por hombre falto de seso"
            r: "main verb 1: he took him for a man out of his wits"
            under:
              - {s: "Cuando el cuadrillero tal oyó", r: "when: when the officer heard this"}
          - s: "abrió la puerta de la venta"
            r: "main verb 2 (after 'y'): he opened the door of the inn"
            under:
              - {s: "porque ya comenzaba a amanecer", r: "why: because it was already beginning to dawn"}
          - s: "le dijo"
            r: "main verb 3 (after 'y'): he told him"
            under:
              - {s: "llamando al ventero", r: "how: calling the innkeeper"}
              - {s: "lo que aquel buen hombre quería", r: "what: what that good man wanted"}
        forms:
          - {w: "oyó", f: "o- + -yó → oír (to hear), preterite, he; the i becomes y between vowels. oír in the preterite: oí, oíste, oyó, oímos, oísteis, oyeron."}
          - {w: "túvole", f: "tuv- + -o + le → tener (to hold; 'tener por' = to take for), preterite, he, with 'le' (him) on the end; modern 'le tuvo'. Irregular: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron."}
          - {w: "comenzaba", f: "comenz- + -aba → comenzar (to begin), imperfect, it. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "abrió", f: "abr- + -ió → abrir (to open), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "llamando", f: "gerund of llamar (to call)."}
          - {w: "dijo", f: "dij- + -o → decir (to say, tell), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "quería", f: "quer- + -ía → querer (to want), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
      - es: "El ventero le proveyó de cuanto quiso, y Sancho se lo llevó a don Quijote, que estaba con las manos en la cabeza, quejándose del dolor del candilazo, que no le había hecho más mal que levantarle dos chichones algo crecidos, y lo que él pensaba que era sangre no era sino sudor que sudaba con la congoja de la pasada tormenta."
        literal: "The innkeeper him provided with as-much-as he-wanted, and Sancho to-him it took to Don Quijote, who was with the hands on the head, complaining-himself of-the pain of-the lamp-blow, which not to-him had done more harm than to-raise-him two lumps somewhat grown, and that which he thought that was blood not was but sweat that he-sweated with the anguish of the past storm."
        ormsby: "The host furnished him with what he required, and Sancho brought it to Don Quixote, who, with his hand to his head, was bewailing the pain of the blow of the lamp, which had done him no more harm than raising a couple of rather large lumps, and what he fancied blood was only the sweat that flowed from him in his sufferings during the late storm."
        vocab:
          - {w: "proveer de", d: "to provide with, supply with"}
          - {w: "cuanto", d: "all that, whatever"}
          - {w: "quejarse de", d: "to complain of, moan about"}
          - {w: "chichón", d: "bump, lump (on the head)"}
          - {w: "algo crecido", d: "somewhat large, fair-sized"}
          - {w: "no ... sino", d: "only, nothing but"}
          - {w: "congoja", d: "anguish, distress"}
          - {w: "tormenta", d: "storm; here the night's brawl"}
        diagram:
          - s: "El ventero le proveyó de cuanto quiso"
            r: "main verb 1: the innkeeper gave him all he wanted"
          - s: "y Sancho se lo llevó a don Quijote"
            r: "main verb 2: and Sancho took it to Don Quijote"
            under:
              - s: "que estaba con las manos en la cabeza, quejándose del dolor del candilazo"
                r: "describes 'don Quijote': who sat with his hands on his head, moaning at the pain of the lamp-blow"
                under:
                  - {s: "que no le había hecho más mal que levantarle dos chichones algo crecidos", r: "describes 'candilazo': which had done him no more harm than raise two fair-sized lumps"}
          - s: "y lo que él pensaba que era sangre no era sino sudor"
            r: "main verb 3: and what he thought was blood was only sweat"
            under:
              - {s: "que sudaba con la congoja de la pasada tormenta", r: "describes 'sudor': that he sweated in the anguish of the past storm"}
        forms:
          - {w: "proveyó", f: "prove- + -yó → proveer (to provide), preterite, he; the i becomes y between vowels. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "quiso", f: "quis- + -o → querer (to want), preterite, he. Irregular: quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "se lo llevó", f: "llev- + -ó → llevar (to take), preterite, he; 'se' stands in for 'le' (to him) before 'lo' (it). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "quejándose", f: "quejando, the gerund of quejarse (to complain), + se, with an accent added."}
          - {w: "había hecho", f: "había (haber, imperfect, it: había, habías, había, habíamos, habíais, habían) + hecho, the irregular participle of hacer (to do): pluperfect 'had done'."}
          - {w: "levantarle", f: "levantar (to raise) + le (on him), the pronoun hung on the infinitive."}
          - {w: "pensaba, sudaba", f: "pens- + -aba → pensar (to think), sud- + -aba → sudar (to sweat), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "era", f: "ser (to be), imperfect, it. era, eras, era, éramos, erais, eran."}
          - {w: "pasada", f: "pas- + -ada → pasar (to pass), participle, feminine to match 'tormenta': 'past, recent'."}
        note: "The narrator quietly deflates Don Quijote's 'much blood': two lumps and some sweat."
      - es: "En resolución, él tomó sus simples, de los cuales hizo un compuesto, mezclándolos todos y cociéndolos un buen espacio, hasta que le pareció que estaban en su punto."
        literal: "In resolution, he took his simples, from the which he-made a compound, mixing-them all and cooking-them a good space, until that to-him it-seemed that they-were at their point."
        ormsby: "To be brief, he took the materials, of which he made a compound, mixing them all and boiling them a good while until it seemed to him they had come to perfection."
        vocab:
          - {w: "en resolución", d: "in short, to sum up"}
          - {w: "simples", d: "simples: the single ingredients (herbs, oils) of a medicine, as apothecaries called them"}
          - {w: "compuesto", d: "compound, mixture (the apothecary's word for a mixed medicine)"}
          - {w: "cocer", d: "to cook, boil"}
          - {w: "un buen espacio", d: "a good while"}
          - {w: "estar en su punto", d: "to be just right, done to a turn"}
        diagram:
          - s: "él tomó sus simples"
            r: "main verb: he took his ingredients"
            under:
              - {s: "En resolución", r: "in short"}
              - s: "de los cuales hizo un compuesto"
                r: "describes 'simples': from which he made a compound"
                under:
                  - {s: "mezclándolos todos y cociéndolos un buen espacio", r: "how: mixing them all and boiling them a good while"}
                  - {s: "hasta que le pareció que estaban en su punto", r: "until when: until he thought they were just right"}
        forms:
          - {w: "tomó", f: "tom- + -ó → tomar (to take), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "hizo", f: "hiz- + -o → hacer (to make), preterite, he. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "mezclándolos, cociéndolos", f: "mezclando and cociendo, the gerunds of mezclar (to mix) and cocer (to boil), + los (them), with accents added."}
          - {w: "pareció", f: "parec- + -ió → parecer (to seem), preterite, it. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "estaban", f: "est- + -aban → estar (to be), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
      - es: "Pidió luego alguna redoma para echallo, y, como no la hubo en la venta, se resolvió de ponello en una alcuza o aceitera de hoja de lata, de quien el ventero le hizo grata donación."
        literal: "He-asked-for then some flask for to-pour-it, and, as not it there-was in the inn, he-resolved-himself of to-put-it in an oil-jar or oil-can of leaf of tin, of which the innkeeper to-him made free donation."
        ormsby: "He then asked for some vial to pour it into, and as there was not one in the inn, he decided on putting it into a tin oil-bottle or flask of which the host made him a free gift;"
        vocab:
          - {w: "redoma", d: "glass flask, vial (wide at the bottom, narrow at the neck)"}
          - {w: "echallo", d: "= echarlo, to pour it; -rl- becomes -ll- in Cervantes' Spanish"}
          - {w: "resolverse de", d: "to decide to, make up one's mind to"}
          - {w: "ponello", d: "= ponerlo, to put it; the same -rl- → -ll- change"}
          - {w: "alcuza", d: "oil cruet, a small cone-shaped oil flask"}
          - {w: "aceitera", d: "oil can, oil bottle"}
          - {w: "hoja de lata", d: "tinplate (modern 'hojalata')"}
          - {w: "de quien", d: "of which; 'quien' could refer to things in old Spanish"}
          - {w: "hacer grata donación", d: "to make a free gift, give gladly"}
        diagram:
          - s: "Pidió luego alguna redoma"
            r: "main verb 1: then he asked for some flask"
            under:
              - {s: "para echallo", r: "why: to pour it into"}
          - s: "se resolvió de ponello en una alcuza o aceitera de hoja de lata"
            r: "main verb 2 (after 'y'): he decided to put it in a tin oil flask"
            under:
              - {s: "como no la hubo en la venta", r: "why: since there was none in the inn"}
              - {s: "de quien el ventero le hizo grata donación", r: "describes 'alcuza': which the innkeeper gave him freely"}
        forms:
          - {w: "Pidió", f: "pid- + -ió → pedir (to ask for), preterite, he; the e of the stem turns to i. pedir in the preterite: pedí, pediste, pidió, pedimos, pedisteis, pidieron."}
          - {w: "echallo", f: "echar (to pour) + lo (it), with -rl- turned into -ll-: echarlo → echallo. Common in Cervantes' time."}
          - {w: "hubo", f: "hub- + -o → haber, preterite, used alone: 'there was'. Irregular: hube, hubiste, hubo, hubimos, hubisteis, hubieron."}
          - {w: "se resolvió", f: "resolv- + -ió → resolverse (to decide), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "ponello", f: "poner (to put) + lo (it), with -rl- turned into -ll-: ponerlo → ponello."}
          - {w: "hizo", f: "hiz- + -o → hacer (to make), preterite, he. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "grata", f: "grat- + -a → grato (pleasing, free), feminine to match 'donación'."}
      - es: "Y luego dijo sobre la alcuza más de ochenta paternostres y otras tantas avemarías, salves y credos, y a cada palabra acompañaba una cruz, a modo de bendición;"
        literal: "And then he-said over the oil-jar more than eighty paternosters and other so-many Ave-Marias, Salves and Creeds, and to each word he-accompanied a cross, by way of blessing;"
        ormsby: "and over the flask he repeated more than eighty paternosters and as many more ave-marias, salves, and credos, accompanying each word with a cross by way of benediction,"
        vocab:
          - {w: "paternostre", d: "the Lord's Prayer ('Pater noster', Our Father)"}
          - {w: "otras tantas", d: "as many more"}
          - {w: "avemaría", d: "the Hail Mary"}
          - {w: "salve", d: "the Salve Regina, 'Hail, Holy Queen', a prayer to the Virgin"}
          - {w: "credo", d: "the Creed"}
          - {w: "a modo de", d: "by way of, as a kind of"}
          - {w: "bendición", d: "blessing, benediction"}
        diagram:
          - s: "Y luego dijo sobre la alcuza"
            r: "main verb 1: and then he said over the flask"
            under:
              - {s: "más de ochenta paternostres y otras tantas avemarías, salves y credos", r: "object: more than eighty Our Fathers and as many Hail Marys, Salves and Creeds"}
          - s: "y a cada palabra acompañaba una cruz"
            r: "main verb 2: and with each word he made a cross"
            under:
              - {s: "a modo de bendición", r: "how: as a blessing"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "otras tantas", f: "otr- + -as, tant- + -as → otro, tanto, feminine plural to match 'avemarías': 'as many more'."}
          - {w: "acompañaba", f: "acompañ- + -aba → acompañar (to accompany), imperfect, he: a repeated action. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
        note: "Saying prayers and making the sign of the cross over a medicine was folk healing ('ensalmo'); the Church frowned on it as superstition, and the comedy lies in the sheer number."
      - es: "a todo lo cual se hallaron presentes Sancho, el ventero y cuadrillero;"
        literal: "at all that which themselves found present Sancho, the innkeeper and officer;"
        ormsby: "at all which there were present Sancho, the innkeeper, and the cuadrillero;"
        vocab:
          - {w: "a todo lo cual", d: "at all of which"}
          - {w: "hallarse presente", d: "to be present"}
        diagram:
          - s: "se hallaron presentes"
            r: "main verb: were present"
            under:
              - {s: "a todo lo cual", r: "at what: at all of this"}
              - {s: "Sancho, el ventero y cuadrillero", r: "subject: Sancho, the innkeeper and the officer"}
        forms:
          - {w: "se hallaron", f: "hall- + -aron → hallarse (to find oneself, be), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "presentes", f: "presente (present), plural to match the three people."}
          - {w: "lo cual", f: "'which', referring to a whole idea (everything just described), so it takes the neuter 'lo'."}
      - es: "que ya el arriero sosegadamente andaba entendiendo en el beneficio de sus machos."
        literal: "for already the carrier calmly was-going-about attending to the care of his mules."
        ormsby: "for the carrier was now peacefully engaged in attending to the comfort of his mules."
        vocab:
          - {w: "arriero", d: "muleteer, carrier (who drives pack mules)"}
          - {w: "sosegadamente", d: "calmly, quietly"}
          - {w: "entender en", d: "to be busy with, see to"}
          - {w: "beneficio", d: "care, tending (of animals); not 'benefit'"}
          - {w: "macho", d: "male mule"}
        diagram:
          - s: "que ya el arriero sosegadamente andaba entendiendo"
            r: "main verb (after 'que', 'for'): the carrier was already calmly busy"
            under:
              - {s: "en el beneficio de sus machos", r: "with what: with tending his mules"}
        forms:
          - {w: "sosegadamente", f: "sosegada (calm) + -mente: 'calmly'. -mente is added to the feminine form of the adjective."}
          - {w: "andaba entendiendo", f: "and- + -aba → andar (to go about), imperfect, he, + entendiendo, the gerund of entender (to see to): 'was going about seeing to'. andar + gerund stresses an ongoing activity. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
        note: "The carrier is the man who punched Don Quijote in the dark the night before; he alone takes no interest in the knight."
      - es: "Hecho esto, quiso él mesmo hacer luego la esperiencia de la virtud de aquel precioso bálsamo que él se imaginaba;"
        literal: "Done this, wanted he himself to-make at-once the experiment of the virtue of that precious balsam that he himself imagined;"
        ormsby: "This being accomplished, he felt anxious to make trial himself, on the spot, of the virtue of this precious balsam, as he considered it,"
        vocab:
          - {w: "hecho esto", d: "this done, once this was done"}
          - {w: "él mesmo", d: "he himself; 'mesmo' = mismo"}
          - {w: "esperiencia", d: "= experiencia, here 'experiment, trial'; the old spelling with s"}
          - {w: "virtud", d: "power, healing property (of a medicine), not moral virtue"}
          - {w: "imaginarse", d: "to imagine, fancy"}
        diagram:
          - s: "quiso él mesmo hacer luego la esperiencia"
            r: "main verb: he himself wanted to test at once"
            under:
              - {s: "Hecho esto", r: "when: this done"}
              - s: "de la virtud de aquel precioso bálsamo"
                r: "of what: the power of that precious balsam"
                under:
                  - {s: "que él se imaginaba", r: "describes 'bálsamo': that he imagined it to be"}
        forms:
          - {w: "Hecho esto", f: "hecho, the irregular participle of hacer (to do), in an absolute phrase: 'this done'. The participle comes first and agrees with 'esto'."}
          - {w: "quiso", f: "quis- + -o → querer (to want), preterite, he. Irregular: quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "mesmo", f: "= mismo (himself, same), masculine to match 'él'."}
          - {w: "esperiencia", f: "= experiencia; Cervantes' spelling drops the x before a consonant sound (estraño, esperiencia)."}
          - {w: "se imaginaba", f: "imagin- + -aba → imaginarse (to imagine), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
      - es: "y así, se bebió, de lo que no pudo caber en la alcuza y quedaba en la olla donde se había cocido, casi media azumbre;"
        literal: "and so, he-drank-himself, of that which not could fit in the oil-jar and remained in the pot where it had-been-cooked, almost half an-azumbre;"
        ormsby: "and so he drank near a quart of what could not be put into the flask and remained in the pigskin in which it had been boiled;"
        vocab:
          - {w: "beberse", d: "to drink down, drink up (the 'se' stresses the whole amount)"}
          - {w: "caber", d: "to fit, go into"}
          - {w: "olla", d: "cooking pot, an earthenware pot; Ormsby's 'pigskin' does not match the Spanish"}
          - {w: "azumbre", d: "a liquid measure of about two liters; 'media azumbre' is about a liter, roughly a quart"}
        diagram:
          - s: "se bebió"
            r: "main verb (after 'y así'): he drank down"
            under:
              - s: "de lo que no pudo caber en la alcuza y quedaba en la olla"
                r: "of what: of what would not fit in the flask and was left in the pot"
                under:
                  - {s: "donde se había cocido", r: "describes 'olla': where it had been cooked"}
