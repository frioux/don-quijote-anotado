part: 1
chapter: 17
title_es: "Capítulo XVII. Donde se prosiguen los innumerables trabajos que el bravo don Quijote y su buen escudero Sancho Panza pasaron en la venta que, por su mal, pensó que era castillo"
title_en: "In which are contained the innumerable troubles which the brave Don Quixote and his good squire Sancho Panza endured in the inn, which to his misfortune he took to be a castle"
paragraphs:
  - sentences:
      - es: "Había ya vuelto en este tiempo de su parasismo don Quijote, y, con el mesmo tono de voz con que el día antes había llamado a su escudero, cuando estaba tendido en el val de las estacas, le comenzó a llamar, diciendo:"
        literal: "Had already returned in this time from his paroxysm Don Quijote, and, with the same tone of voice with which the day before he-had called [to] his squire, when he-was stretched-out in the vale of the stakes, him he-began to call, saying:"
        ormsby: "By this time Don Quixote had recovered from his swoon; and in the same tone of voice in which he had called to his squire the day before when he lay stretched “in the vale of the stakes,” he began calling to him now,"
        ormsby_note: "The words quoted are the beginning of one of the Cid ballads, \"Por el val de las estacas.\""
        vocab:
          - {w: "volver de", d: "to come back from, recover from (a faint)"}
          - {w: "en este tiempo", d: "by this time, meanwhile"}
          - {w: "parasismo", d: "= paroxismo, a fit, swoon, faint; Cervantes' spelling"}
          - {w: "mesmo", d: "= mismo, same; the old form, used throughout the book"}
          - {w: "el día antes", d: "the day before"}
          - {w: "tendido", d: "stretched out, lying flat"}
          - {w: "val", d: "old short form of 'valle', vale, valley"}
          - {w: "estaca", d: "stake, stick, cudgel; 'el val de las estacas' = 'the vale of the stakes', a line from a ballad of the Cid, used for the beating by the carriers' cudgels"}
        diagram:
          - s: "Había ya vuelto en este tiempo de su parasismo don Quijote"
            r: "main verb 1: Don Quijote had by now come round from his fit"
          - s: "le comenzó a llamar"
            r: "main verb 2 (after 'y'): he began to call him"
            under:
              - s: "con el mesmo tono de voz"
                r: "how: in the same tone of voice"
                under:
                  - s: "con que el día antes había llamado a su escudero"
                    r: "describes 'tono': with which he had called his squire the day before"
                    under:
                      - {s: "cuando estaba tendido en el val de las estacas", r: "when: when he lay stretched out in the 'vale of the stakes'"}
              - {s: "diciendo:", r: "how: saying (the words follow)"}
        forms:
          - {w: "Había ... vuelto", f: "hab- + -ía → haber (to have), imperfect, he, + vuelto, the irregular participle of volver (to return): pluperfect 'had come back'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "mesmo", f: "= mismo (same), masculine to match 'tono'."}
          - {w: "había llamado", f: "había (haber, imperfect, he) + llamado, the participle of llamar (to call): pluperfect 'had called'. Same imperfect of haber."}
          - {w: "estaba tendido", f: "est- + -aba → estar (to be), imperfect, he, + tendido, the participle of tender (to stretch out): 'lay stretched out'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "val", f: "valle (vale) with its last vowel and one l dropped, an old poetic short form kept from the ballad."}
          - {w: "le comenzó a llamar", f: "comenz- + -ó → comenzar (to begin), preterite, he, + 'a' + llamar (to call). The pronoun 'le' (him) sits before the whole group instead of on 'llamar'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "diciendo", f: "gerund of decir (to say): 'saying'. The e of the stem turns to i in the gerund: decir → diciendo."}
  - sentences:
      - es: "— Sancho amigo, ¿duermes? ¿Duermes, amigo Sancho?"
        literal: "— Sancho friend, do-you-sleep? Do-you-sleep, friend Sancho?"
        ormsby: "“Sancho, my friend, art thou asleep? sleepest thou, friend Sancho?”"
        vocab:
          - {w: "Sancho amigo", d: "Sancho, my friend; Spanish can put 'amigo' after or before the name as a term of address"}
        diagram:
          - s: "¿duermes?"
            r: "question 1: are you asleep?"
            under:
              - {s: "Sancho amigo", r: "who is addressed"}
          - s: "¿Duermes, amigo Sancho?"
            r: "question 2: the same, with the words turned round"
        forms:
          - {w: "duermes", f: "duerm- + -es → dormir (to sleep), present, you (tú). The stem o becomes ue when stressed: duermo, duermes, duerme, dormimos, dormís, duermen."}
          - {w: "Duermes", f: "the same word again: duerm- + -es → dormir (to sleep), present, you (tú): duermo, duermes, duerme, dormimos, dormís, duermen."}
        note: "Don Quijote calls Sancho 'tú', as a master does a servant. The chiastic repeat (Sancho amigo, duermes / Duermes, amigo Sancho) echoes the ballad style he has just quoted."
  - sentences:
      - es: "— ¿Qué tengo de dormir, pesia a mí —respondió Sancho, lleno de pesadumbre y de despecho—; que no parece sino que todos los diablos han andado conmigo esta noche?"
        literal: "— What have-I of to-sleep, curse-on me —answered Sancho, full of sorrow and of spite—; for not it-seems but that all the devils have gone-about with-me this night?"
        ormsby: "“How can I sleep, curses on it!” returned Sancho discontentedly and bitterly, “when it is plain that all the devils have been at me this night?”"
        vocab:
          - {w: "¿Qué tengo de dormir?", d: "how am I supposed to sleep?; 'tener de' + infinitive = 'tener que', to have to"}
          - {w: "pesia a mí", d: "curse it, confound me; an oath from 'pese a mí', 'may it weigh on me'"}
          - {w: "pesadumbre", d: "grief, sorrow, heaviness of heart"}
          - {w: "despecho", d: "spite, resentment, vexation (not 'despite')"}
          - {w: "no parece sino que", d: "it looks just as if, you would think that"}
          - {w: "andar con", d: "to be after, to have a go at, keep busy with (someone)"}
        diagram:
          - s: "¿Qué tengo de dormir"
            r: "main verb (Sancho's question): how should I sleep?"
            under:
              - {s: "pesia a mí", r: "an oath: curse it"}
              - s: "que no parece sino"
                r: "why: for it seems nothing else but"
                under:
                  - {s: "que todos los diablos han andado conmigo esta noche", r: "what it seems: that all the devils have been at me tonight"}
          - s: "respondió Sancho"
            r: "speech tag: Sancho answered"
            under:
              - {s: "lleno de pesadumbre y de despecho", r: "how: full of grief and spite"}
        forms:
          - {w: "tengo de dormir", f: "teng- + -o → tener (to have), present, I, + 'de' + dormir (to sleep): 'have I to sleep', i.e. how can I sleep. tener in the present: tengo, tienes, tiene, tenemos, tenéis, tienen. Cervantes says 'tener de' where modern Spanish says 'tener que'."}
          - {w: "pesia", f: "a worn-down form of 'pese', present subjunctive of pesar (to weigh, grieve), used as a curse: 'may it grieve'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "lleno", f: "lleno (full), masculine to match Sancho."}
          - {w: "parece", f: "parec- + -e → parecer (to seem), present, it. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (but 'parezco' for I)."}
          - {w: "han andado", f: "han (haber, present, they: he, has, ha, hemos, habéis, han) + andado, the participle of andar (to go about): present perfect 'have been going at'."}
          - {w: "conmigo", f: "con + mí fused into one word: 'with me' (also contigo, consigo)."}
  - sentences:
      - es: "— Puédeslo creer ansí, sin duda —respondió don Quijote—, porque, o yo sé poco, o este castillo es encantado. Porque has de saber..."
        literal: "— You-can-it believe so, without doubt —answered Don Quijote—, because, either I know little, or this castle is enchanted. Because you-have of to-know..."
        ormsby: "“Thou mayest well believe that,” answered Don Quixote, “because, either I know little, or this castle is enchanted, for thou must know—"
        vocab:
          - {w: "ansí", d: "= así, so, thus; the old form"}
          - {w: "o ... o", d: "either ... or"}
          - {w: "encantado", d: "enchanted, under a spell"}
          - {w: "haber de", d: "+ infinitive: must, have to; 'has de saber' = you must know (a stock opening for a story)"}
        diagram:
          - s: "Puédeslo creer ansí, sin duda"
            r: "main verb: you may well believe it so"
            under:
              - s: "porque"
                r: "why"
                under:
                  - {s: "o yo sé poco", r: "either: I know little"}
                  - {s: "o este castillo es encantado", r: "or: this castle is enchanted"}
          - {s: "respondió don Quijote", r: "speech tag: Don Quijote answered"}
          - {s: "Porque has de saber...", r: "new start, broken off: for you must know..."}
        forms:
          - {w: "Puédeslo", f: "pued- + -es + lo → poder (to be able), present, you (tú), with 'lo' (it) stuck on the end; modern 'lo puedes'. Cervantes hangs pronouns on a verb that opens its clause. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "sé", f: "saber (to know), present, I; the accent tells it from 'se'. sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "es encantado", f: "ser (to be) + encantado, the participle of encantar (to enchant): 'is enchanted', a lasting state. ser in the present: soy, eres, es, somos, sois, son."}
          - {w: "has de saber", f: "has, haber (to have), present, you (tú), + 'de' + saber (to know): 'you must know'. haber in the present: he, has, ha, hemos, habéis, han."}
      - es: "Mas, esto que ahora quiero decirte hasme de jurar que lo tendrás secreto hasta después de mi muerte."
        literal: "But, this that now I-want to-tell-you you-have-me of to-swear that it you-will-keep secret until after of my death."
        ormsby: "but this that I am now about to tell thee thou must swear to keep secret until after my death.”"
        vocab:
          - {w: "mas", d: "but (literary, no accent); 'más' with the accent is 'more'"}
          - {w: "jurar", d: "to swear, promise on oath"}
          - {w: "tener secreto", d: "to keep secret"}
        diagram:
          - s: "hasme de jurar"
            r: "main verb: you must swear to me"
            under:
              - {s: "esto que ahora quiero decirte", r: "topic, placed first: this thing I now want to tell you"}
              - {s: "que lo tendrás secreto hasta después de mi muerte", r: "what you must swear: that you will keep it secret until after my death"}
        forms:
          - {w: "quiero", f: "quier- + -o → querer (to want), present, I. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "decirte", f: "decir (to tell) + te (to you), the pronoun hung on the infinitive."}
          - {w: "hasme de jurar", f: "has + me → haber (to have), present, you (tú), with 'me' (to me) stuck on the end, + 'de' + jurar (to swear): 'you must swear to me'; modern 'me has de jurar'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "tendrás", f: "tendr- + -ás → tener (to have, keep), future, you (tú). Irregular stem tendr-; the future endings: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "mi", f: "'my', one form for both genders (mi, mis)."}
  - sentences:
      - es: "— Sí juro —respondió Sancho."
        literal: "— Yes I-swear —answered Sancho."
        ormsby: "“I swear it,” answered Sancho."
        vocab:
          - {w: "sí juro", d: "I do swear; 'sí' before the verb stresses it, like English 'I do'"}
        diagram:
          - s: "Sí juro"
            r: "main verb: I do swear"
          - {s: "respondió Sancho", r: "speech tag: Sancho answered"}
        forms:
          - {w: "juro", f: "jur- + -o → jurar (to swear), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "Sí", f: "'yes', or an emphatic 'indeed' before a verb; the accent tells it from 'si' (if)."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
  - sentences:
      - es: "— Dígolo —replicó don Quijote—, porque soy enemigo de que se quite la honra a nadie."
        literal: "— I-say-it —replied Don Quijote—, because I-am enemy of that one-should-take-away the honor to nobody."
        ormsby: "“I say so,” continued Don Quixote, “because I hate taking away anyone’s good name.”"
        vocab:
          - {w: "replicar", d: "to reply, answer back"}
          - {w: "ser enemigo de", d: "to dislike, be against (doing something); 'soy enemigo de' = I hate to"}
          - {w: "quitar la honra a", d: "to take away someone's good name, damage their reputation"}
          - {w: "nadie", d: "anyone (after a negative idea), nobody"}
        diagram:
          - s: "Dígolo"
            r: "main verb: I say it"
            under:
              - s: "porque soy enemigo"
                r: "why: because I am against"
                under:
                  - {s: "de que se quite la honra a nadie", r: "against what: anyone's honor being taken away"}
          - {s: "replicó don Quijote", r: "speech tag: Don Quijote replied"}
        forms:
          - {w: "Dígolo", f: "dig- + -o + lo → decir (to say), present, I, with 'lo' (it) stuck on the end; modern 'lo digo'. Cervantes hangs pronouns on a verb that opens its clause. decir in the present: digo, dices, dice, decimos, decís, dicen."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "soy", f: "ser (to be), present, I. soy, eres, es, somos, sois, son."}
          - {w: "se quite", f: "quit- + -e → quitar (to take away), present subjunctive, it, with 'se': 'that one take away' (impersonal). Subjunctive after 'ser enemigo de que'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
        note: "Don Quijote's secret is a knight's discretion: a gentleman never boasts of a lady's favors, since that would stain her honor. Here the 'lady' is Maritornes, the inn's servant girl, who was creeping to the carrier's bed the night before when he caught hold of her."
  - sentences:
      - es: "— Digo que sí juro —tornó a decir Sancho— que lo callaré hasta después de los días de vuestra merced, y plega a Dios que lo pueda descubrir mañana."
        literal: "— I-say that yes I-swear —returned to say Sancho— that it I-will-keep-quiet until after of the days of your grace, and may-it-please [to] God that it I-may-be-able to-reveal tomorrow."
        ormsby: "“I say,” replied Sancho, “that I swear to hold my tongue about it till the end of your worship’s days, and God grant I may be able to let it out tomorrow.”"
        vocab:
          - {w: "tornar a", d: "+ infinitive: to do again; 'tornó a decir' = said again, went on"}
          - {w: "callar", d: "to keep quiet about, keep (a secret)"}
          - {w: "los días de vuestra merced", d: "your worship's lifetime"}
          - {w: "vuestra merced", d: "'your grace', the polite 'you' (later shortened to 'usted'); takes a he/she verb"}
          - {w: "plega a Dios", d: "may it please God, God grant; 'plega' is an old form of 'plazca'"}
          - {w: "descubrir", d: "to reveal, disclose (not only 'discover')"}
        diagram:
          - s: "Digo"
            r: "main verb 1: I say"
            under:
              - s: "que sí juro"
                r: "what I say: that I do swear"
                under:
                  - {s: "que lo callaré hasta después de los días de vuestra merced", r: "what I swear: that I will keep quiet till after your days"}
          - {s: "tornó a decir Sancho", r: "speech tag: Sancho said again"}
          - s: "plega a Dios"
            r: "main verb 2 (after 'y'): may it please God"
            under:
              - {s: "que lo pueda descubrir mañana", r: "what: that I may reveal it tomorrow"}
        forms:
          - {w: "Digo", f: "dig- + -o → decir (to say), present, I. decir in the present: digo, dices, dice, decimos, decís, dicen."}
          - {w: "juro", f: "jur- + -o → jurar (to swear), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "tornó", f: "torn- + -ó → tornar (to return; 'tornar a' = to do again), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "callaré", f: "callar- + -é → callar (to keep quiet), future, I. The future adds to the infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "plega", f: "old present subjunctive of placer (to please), it: 'may it please'; modern 'plazca'. A wish, so subjunctive."}
          - {w: "pueda", f: "pued- + -a → poder (to be able), present subjunctive, I. Subjunctive after the wish 'plega a Dios que'. The stem o becomes ue when stressed: pueda, puedas, pueda, podamos, podáis, puedan."}
        note: "Sancho's joke: he swears to keep the secret until his master's death, then hopes he may tell it tomorrow, that is, wishes his master dead by morning without meaning it."
      - es: "— ¿Tan malas obras te hago, Sancho —respondió don Quijote—, que me querrías ver muerto con tanta brevedad?"
        literal: "— Such bad works to-you I-do, Sancho —answered Don Quijote—, that me you-would-like to-see dead with such brevity?"
        ormsby: "“Do I do thee such injuries, Sancho,” said Don Quixote, “that thou wouldst see me dead so soon?”"
        vocab:
          - {w: "malas obras", d: "ill treatment, wrongs, injuries"}
          - {w: "con tanta brevedad", d: "so soon, so quickly"}
        diagram:
          - s: "¿Tan malas obras te hago"
            r: "main verb: do I treat you so badly"
            under:
              - {s: "Sancho", r: "who is addressed"}
              - {s: "que me querrías ver muerto con tanta brevedad?", r: "result of 'tan': that you would want to see me dead so soon"}
          - {s: "respondió don Quijote", r: "speech tag: Don Quijote answered"}
        forms:
          - {w: "malas", f: "mal- + -as → malo (bad), feminine plural to match 'obras'."}
          - {w: "hago", f: "hag- + -o → hacer (to do), present, I. hacer in the present: hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "querrías", f: "querr- + -ías → querer (to want), conditional, you (tú): 'would you want'. Irregular stem querr-; the conditional endings: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "muerto", f: "irregular participle of morir (to die), masculine to match 'me' (Don Quijote): 'dead'."}
          - {w: "tanta", f: "tant- + -a → tanto (so much), feminine to match 'brevedad'; 'tan' is its short form before an adjective ('tan malas')."}
  - sentences:
      - es: "— No es por eso —respondió Sancho—, sino porque soy enemigo de guardar mucho las cosas, y no querría que se me pudriesen de guardadas."
        literal: "— Not it-is for that —answered Sancho—, but because I-am enemy of keeping much the things, and not I-would-want that they-should-rot on-me from kept."
        ormsby: "“It is not for that,” replied Sancho, “but because I hate keeping things long, and I don’t want them to grow rotten with me from over-keeping.”"
        vocab:
          - {w: "no ... sino", d: "not ... but (rather)"}
          - {w: "ser enemigo de", d: "to dislike, hate (doing something)"}
          - {w: "guardar", d: "to keep, store"}
          - {w: "pudrirse", d: "to rot, go bad"}
          - {w: "de guardadas", d: "from being kept (too long); 'de' + participle gives the cause"}
        diagram:
          - s: "No es por eso"
            r: "main verb: it is not for that"
            under:
              - {s: "sino porque soy enemigo de guardar mucho las cosas", r: "but why: because I hate keeping things long"}
              - s: "y no querría"
                r: "why, 2: and I would not want"
                under:
                  - {s: "que se me pudriesen de guardadas", r: "what: that they rot on me from being kept"}
          - {s: "respondió Sancho", r: "speech tag: Sancho answered"}
        forms:
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "soy", f: "ser (to be), present, I. Same present of ser."}
          - {w: "querría", f: "querr- + -ía → querer (to want), conditional, I: 'I would want'. Irregular stem querr-; the conditional endings: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "se me pudriesen", f: "pudr- + -iesen → pudrirse (to rot), imperfect subjunctive (-se form), they (the things), with 'se' and 'me' (on me, to my loss). Subjunctive after 'no querría que'. The -se form of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen."}
          - {w: "guardadas", f: "guard- + -adas → guardar (to keep), participle, feminine plural to match 'cosas'."}
        note: "Sancho cannot keep a secret and says so outright; it is a joke on the proverb that secrets 'rot' if kept too long."
  - sentences:
      - es: "— Sea por lo que fuere —dijo don Quijote—; que más fío de tu amor y de tu cortesía;"
        literal: "— Let-it-be for what it-may-be —said Don Quijote—; for more I-trust of your love and of your courtesy;"
        ormsby: "“At any rate,” said Don Quixote, “I have more confidence in thy affection and good nature;"
        vocab:
          - {w: "sea por lo que fuere", d: "be that as it may, whatever the reason"}
          - {w: "fiar de", d: "to trust, rely on"}
          - {w: "cortesía", d: "courtesy, good manners, kindness"}
        diagram:
          - s: "Sea por lo que fuere"
            r: "main verb 1: be that as it may"
          - {s: "dijo don Quijote", r: "speech tag: Don Quijote said"}
          - s: "que más fío"
            r: "main verb 2: for I trust more"
            under:
              - {s: "de tu amor y de tu cortesía", r: "in what: in your love and your courtesy"}
        forms:
          - {w: "Sea", f: "se- + -a → ser (to be), present subjunctive, it: 'let it be'. ser in the present subjunctive: sea, seas, sea, seamos, seáis, sean."}
          - {w: "fuere", f: "fu- + -ere → ser (to be), future subjunctive, it: 'whatever it may be'. ser in the future subjunctive: fuere, fueres, fuere, fuéremos, fuereis, fueren. Cervantes uses it for an open future after 'lo que', 'si', 'quien'; modern Spanish says 'sea'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
