  - sentences:
      - es: "— Señor caballero, yo no tengo necesidad de que vuestra merced me vengue ningún agravio, porque yo sé tomar la venganza que me parece, cuando se me hacen."
        literal: "— Sir knight, I not have need of that your grace for-me avenge no wrong, because I know-how to-take the vengeance that to-me seems-good, when to-me they-are-done."
        ormsby: "“Sir Knight, I do not want your worship to avenge me of any wrong, because when any is done me I can take what vengeance seems good to me;"
        vocab:
          - {w: "tener necesidad de", d: "to need"}
          - {w: "vengar", d: "to avenge"}
          - {w: "ningún", d: "any (after a negative), no"}
          - {w: "saber", d: "+ infinitive: to know how to, be able to"}
          - {w: "parecerle a uno", d: "to seem right to one; 'la venganza que me parece' = whatever revenge I see fit"}
        diagram:
          - s: "yo no tengo necesidad"
            r: "main verb: I have no need"
            under:
              - {s: "Señor caballero", r: "who is addressed: sir knight"}
              - {s: "de que vuestra merced me vengue ningún agravio", r: "of what: of your worship avenging any wrong for me"}
              - s: "porque yo sé tomar la venganza"
                r: "why: because I know how to take revenge"
                under:
                  - {s: "que me parece", r: "describes 'venganza': that seems right to me"}
                  - {s: "cuando se me hacen", r: "when: when wrongs are done me"}
        forms:
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "vengue", f: "veng- + -ue → vengar (to avenge), present subjunctive, you (vuestra merced); the g gets a u to keep its hard sound before e. Subjunctive after 'necesidad de que'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "ningún", f: "ninguno (no, any) clipped before a masculine singular noun ('agravio')."}
          - {w: "sé", f: "saber (to know how), present, I; the accent tells it from 'se'. sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "parece", f: "parec- + -e → parecer (to seem), present, it. parecer in the present: parezco, pareces, parece, parecemos, parecéis, parecen."}
          - {w: "se me hacen", f: "hac- + -en → hacer (to do), present, they (the wrongs), with 'se' (passive: 'are done') and 'me' (to me). hacer in the present: hago, haces, hace, hacemos, hacéis, hacen."}
        note: "The innkeeper answers the knight's 'vos' with the polite 'vuestra merced' and calm good sense, keeping up the courtesy while refusing the whole chivalric frame."
      - es: "Sólo he menester que vuestra merced me pague el gasto que esta noche ha hecho en la venta, así de la paja y cebada de sus dos bestias, como de la cena y camas."
        literal: "Only I-have need that your grace to-me pay the expense that this night you-have made in the inn, so of the straw and barley of your two beasts, as of the supper and beds."
        ormsby: "the only thing I want is that you pay me the score that you have run up in the inn last night, as well for the straw and barley for your two beasts, as for supper and beds.”"
        vocab:
          - {w: "haber menester", d: "to need (an old expression)"}
          - {w: "gasto", d: "expense, bill, what one has spent"}
          - {w: "así ... como", d: "both ... and, as well ... as"}
          - {w: "paja", d: "straw"}
          - {w: "cebada", d: "barley (fodder for horses and mules)"}
          - {w: "bestia", d: "beast, animal (a mount or beast of burden)"}
        diagram:
          - s: "Sólo he menester"
            r: "main verb: I only need"
            under:
              - s: "que vuestra merced me pague el gasto"
                r: "what: that your worship pay me the bill"
                under:
                  - {s: "que esta noche ha hecho en la venta", r: "describes 'gasto': that you ran up in the inn tonight"}
                  - {s: "así de la paja y cebada de sus dos bestias, como de la cena y camas", r: "what for: for straw and barley for your two animals as well as supper and beds"}
        forms:
          - {w: "he menester", f: "he, haber (to have), present, I, + menester (need): 'haber menester' = to need. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "pague", f: "pag- + -ue → pagar (to pay), present subjunctive, you (vuestra merced); the g gets a u before e. Subjunctive after 'he menester que'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "ha hecho", f: "ha (haber, present, you as vuestra merced) + hecho, the irregular participle of hacer (to make): 'you have run up'."}
          - {w: "sus", f: "'your' (for vuestra merced), plural to match 'bestias', not the owner."}
