          - {w: "encomendar", d: "to entrust, commission"}
          - {w: "no hay sino", d: "+ infinitive: you need only, all you have to do is"}
          - {w: "decilla", d: "= decirla, to say it; -rl- becomes -ll-"}
          - {w: "faceros", d: "= haceros, to make you; the old f- form"}
          - {w: "a toda vuestra voluntad", d: "entirely to your liking"}
        diagram:
