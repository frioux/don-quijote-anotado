          - {w: "sujetos", f: "sujet- + -os → sujeto (subject, exposed), masculine plural to match the knights."}
        note: "In chapter 3 the first innkeeper told Don Quijote that knights always carried money, and he seems to have forgotten that advice. His claim that knights never paid is his own reading of the romances, which simply never mention bills."
  - sentences:
      - es: "— Poco tengo yo que ver en eso —respondió el ventero—; págueseme lo que se me debe, y dejémonos de cuentos ni de caballerías, que yo no tengo cuenta con otra cosa que con cobrar mi hacienda."
        literal: "— Little have I to see in that —answered the innkeeper—; let-be-paid-to-me what to-me is-owed, and let-us-leave-off of stories nor of chivalries, for I not have account with other thing than with collecting my property."
        ormsby: "“I have little to do with that,” replied the innkeeper; “pay me what you owe me, and let us have no more talk of chivalry, for all I care about is to get my money.”"
        vocab:
          - {w: "tener que ver en", d: "to have to do with, be concerned with"}
          - {w: "dejarse de", d: "to drop, leave off, stop (talking about)"}
          - {w: "cuentos", d: "stories, tales; idle talk"}
          - {w: "caballerías", d: "deeds of chivalry; tales of knighthood"}
          - {w: "tener cuenta con", d: "to care about, pay attention to (a pun on 'cuento' just before)"}
          - {w: "cobrar", d: "to collect (money owed), get paid"}
          - {w: "hacienda", d: "property, money, what is one's own"}
        diagram:
          - s: "Poco tengo yo que ver en eso"
            r: "main verb 1: I have little to do with that"
          - {s: "respondió el ventero", r: "speech tag: the innkeeper answered"}
          - s: "págueseme lo que se me debe"
            r: "main verb 2 (command): let me be paid what I'm owed"
          - s: "y dejémonos de cuentos ni de caballerías"
            r: "main verb 3: and let's have done with tales and chivalries"
            under:
              - {s: "que yo no tengo cuenta con otra cosa que con cobrar mi hacienda", r: "why: for I care about nothing but collecting what's mine"}
        forms:
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "págueseme", f: "pag- + -ue + se + me → pagar (to pay), present subjunctive, it, with 'se' (passive: 'be paid') and 'me' (to me) on the end: 'let me be paid'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "se me debe", f: "deb- + -e → deber (to owe), present, it, with 'se' (passive) and 'me' (to me): 'is owed to me'. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "dejémonos", f: "dejemos + nos → dejarse (to leave off), present subjunctive, we, as 'let's'; the final s of dejemos drops before 'nos'. Same -e subjunctive."}
        note: "The innkeeper's 'cuentos' (tales) and 'cuenta' (account, care) is a pun: he wants his account, not the knight's stories."
