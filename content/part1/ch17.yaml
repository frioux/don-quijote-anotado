summary: |
  Don Quijote comes round from his faint and tells Sancho, under an oath of secrecy, that the daughter of the castle's lord visited him in the night, but that an enchanted Moor guarding her beauty struck him in the jaw and beat him. Sancho answers that some four hundred Moors have pounded him too. When the officer of the Holy Brotherhood comes in with a lamp and calls Don Quijote 'good man', the knight calls him a blockhead, and the officer breaks the lamp over his head.

  Don Quijote sends Sancho for oil, wine, salt and rosemary, boils them into the 'balsam of Fierabrás', and blesses it with eighty paternosters and as many Ave Marias, Salves and Creeds. He drinks about a liter, vomits, sweats, sleeps three hours, and wakes feeling cured. Sancho drinks the rest and suffers far worse, purging from both ends for two hours. Don Quijote concludes that the balsam works only for knights.

  Eager to ride on, Don Quijote saddles up, takes a pike from a corner of the inn for a lance, and thanks the 'alcaide' for his hospitality, offering to avenge any wrong he has suffered. The innkeeper asks him to pay for the night instead. Learning that the castle is an inn, Don Quijote declares that knights-errant never pay for lodging, calls the innkeeper a fool and rides off without paying.

  Sancho refuses to pay too, citing the law of chivalry. Some lively guests (wool-carders, needle-makers and men from Seville's rough quarters) pull him off his donkey and toss him in a blanket in the yard. Don Quijote, too bruised to climb the wall, can only shout insults. When the tossers tire, Maritornes brings Sancho water, which he refuses, and then wine, which she pays for herself. Sancho rides out pleased to have paid nothing, without noticing that the innkeeper has kept his saddlebags.
context: |
  Inns and money. The 'venta' was a roadside inn on the open road, often poor and isolated, where carriers, travelers and rough company lodged together. The innkeeper charges for straw and barley for the animals, supper and beds, a normal bill. Don Quijote's refusal to pay rests on his reading of the romances, which never mention money. In chapter 3 the first innkeeper had warned him that knights always carry money and clean shirts. The officer here is a 'cuadrillero', a member of the Santa Hermandad, the rural police that patrolled roads and could arrest and punish on the spot. Maritornes, the servant girl, also sells herself to guests, which the narrator calls being 'in that trade' ('aquel trato').

  The romances. The 'balsam of Fierabrás' comes from the French Charlemagne romances (Fierabras, a Saracen giant, carried a balm that had embalmed Christ and healed every wound), known in Spain through the 'Historia del emperador Carlomagno'. Don Quijote first promised to make it in chapter 10. His speech to the 'alcaide' is the knight's farewell to a host, in the archaic language of the books (fecho, faceros, tuertos, recebí), and the creed he states (to help the weak, avenge wrongs, punish treachery) is the knight-errant's charter. The 'enchanted Moor' guarding a treasure is pure Spanish folklore. Ormsby notes that the chapter opens with a line from a ballad of the Cid ('Por el val de las estacas'), and that the claim that knights never paid for lodging is not quite true: in Pulci's Morgante Maggiore, Orlando has to leave his horse as a pledge for his bill.

  The narrator and the joke. The narrator keeps deflating the knight. The 'much blood' is two lumps and sweat; the balsam's 'virtue' is a violent purge; the narrator says that if rage had let him, Don Quijote would have laughed at the sight of Sancho flying through the air. The officer who hits Don Quijote is the same man he refuses to recognize as the enchanted Moor because enchanted beings are invisible. Sancho, who swore he would never be a knight, invokes the law of chivalry when it saves him money, and is paid in blows instead. Ormsby notes that blanket-tossing appears in Mateo Alemán's Guzmán de Alfarache (1599), the great picaresque novel, where the hero is tossed 'as they used to doe to dogges at Shrovetide', and suggests it may have given Cervantes the idea.

  Medicine and religion. The balsam's ingredients (oil, wine, salt, rosemary) were those of an ordinary household wound salve. Saying prayers and making crosses over a remedy was 'ensalmo', folk healing the Church disapproved of; the comedy lies in the numbers, eighty Our Fathers and as many Hail Marys, Salves and Creeds. Its effect, vomiting and sweating, is what an early-modern physician would call a purge, then a standard treatment, here taken to grotesque extremes. Shrovetide (carnestolendas), the carnival before Lent, was the season of rough games, including tossing dogs in blankets.

  Names and places. The blanketers come from places proverbial for rogues: the wool-carders of Segovia, Spain's cloth town; the needle-makers of the Potro, the Colt Square of Córdoba, named for its fountain; and the Heria (Feria) of Seville, which Ormsby calls 'a low quarter'. The 'cornado' Sancho will not pay is, as Ormsby notes, a coin worth about a sixth of a maravedí; the 'ardite' in the last sentence is another worthless coin. The Round Table, King Arthur's, stands for the whole order of knights-errant.

  Reading Cervantes' Spanish. The usual archaisms continue: mesmo, ansí, agora, recebir, estraño, esperiencia, sospiro, priesa, entrambos, vee for ve, fermosa and fermosura in Don Quijote's mouth, fecho and faceros in his formal speech, and the old preterite 'trujo, trujeron, trujese' for 'trajo'. Pronouns hang on clause-opening verbs (Puédeslo, Dígolo, asentóme, déjanse, Llegóse, salióse, túvole, Hiciéronlo, Concedióselo, Trujéronle, hásele olvidado); 'de' fuses with pronouns (deste, desta, desa, della, dél, dellos, desto); infinitive plus 'lo/la' turns -rl- into -ll- (echallo, ponello, decilla, escribillos, socorrelle). Watch the -ra form used as a conditional (Hablara yo, se riera, no le estimaran), the future subjunctive (fuere, hiciere), 'tener de' for 'tener que', 'ha' for 'hace' (poco ha), the past anterior 'no hubo llegado ... cuando', and false friends: luego (at once; therefore), procurar (to try), virtud (healing power), accidente (fit), ventura (fortune), curar (to treat), trato (trade).
