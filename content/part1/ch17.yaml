  - sentences:
      - es: "Quiso la mala suerte del desdichado Sancho que, entre la gente que estaba en la venta, se hallasen cuatro perailes de Segovia, tres agujeros del Potro de Córdoba y dos vecinos de la Heria de Sevilla, gente alegre, bien intencionada, maleante y juguetona, los cuales, casi como instigados y movidos de un mesmo espíritu, se llegaron a Sancho, y, apeándole del asno, uno dellos entró por la manta de la cama del huésped, y, echándole en ella, alzaron los ojos y vieron que el techo era algo más bajo de lo que habían menester para su obra, y determinaron salirse al corral, que tenía por límite el cielo."
        literal: "Wanted the bad luck of-the unlucky Sancho that, among the people who were in the inn, there-should-be four wool-carders of Segovia, three needle-makers of-the Potro of Córdoba and two residents of the Heria of Sevilla, people merry, well intentioned, mischievous and playful, the which, almost as instigated and moved by one same spirit, came-themselves to Sancho, and, getting-him-down from-the ass, one of-them went-in for the blanket of the bed of-the host, and, throwing-him in it, they-raised the eyes and saw that the ceiling was somewhat more low than that-which they-had need for their work, and they-decided to-go-out to-the yard, which had for limit the sky."
        ormsby: "The ill-luck of the unfortunate Sancho so ordered it that among the company in the inn there were four woolcarders from Segovia, three needle-makers from the Colt of Cordova, and two lodgers from the Fair of Seville, lively fellows, tenderhearted, fond of a joke, and playful, who, almost as if instigated and moved by a common impulse, made up to Sancho and dismounted him from his ass, while one of them went in for the blanket of the host’s bed; but on flinging him into it they looked up, and seeing that the ceiling was somewhat lower what they required for their work, they decided upon going out into the yard, which was bounded by the sky,"
        ormsby_note: "The \"Fair\" was a low quarter in Seville."
        vocab:
          - {w: "perail", d: "wool-carder, cloth-dresser (Segovia was Spain's great wool-cloth town)"}
          - {w: "agujero", d: "needle-maker (from 'aguja', needle); today 'agujero' means only 'hole'"}
          - {w: "Potro de Córdoba", d: "the Colt Square of Córdoba, named for its fountain with a colt, a haunt of rogues and petty traders"}
          - {w: "vecino", d: "resident, householder of a town"}
          - {w: "la Heria de Sevilla", d: "the Feria district of Seville, a rough quarter (Ormsby's 'Fair')"}
          - {w: "bien intencionado", d: "well-meaning; ironic here"}
          - {w: "maleante", d: "mischievous, fond of tricks (today 'criminal')"}
          - {w: "juguetón", d: "playful"}
          - {w: "instigado", d: "urged on, incited"}
          - {w: "apear", d: "to help or pull down from a mount"}
          - {w: "entrar por", d: "to go in for, go and fetch"}
          - {w: "huésped", d: "here 'host, innkeeper' (the word meant both host and guest)"}
          - {w: "corral", d: "yard, courtyard (of an inn), open to the sky"}
        diagram:
          - s: "Quiso la mala suerte del desdichado Sancho"
            r: "main verb: the bad luck of unlucky Sancho willed"
            under:
              - s: "que, entre la gente que estaba en la venta, se hallasen cuatro perailes de Segovia, tres agujeros del Potro de Córdoba y dos vecinos de la Heria de Sevilla"
                r: "what: that among the people in the inn there should be four wool-carders of Segovia, three needle-makers of the Colt of Córdoba and two residents of the Heria of Seville"
                under:
                  - {s: "gente alegre, bien intencionada, maleante y juguetona", r: "describes the nine: merry, well-meaning, mischievous, playful people"}
                  - s: "los cuales ... se llegaron a Sancho"
                    r: "describes the nine: who went up to Sancho"
                    under:
                      - {s: "casi como instigados y movidos de un mesmo espíritu", r: "how: almost as if urged on by one and the same spirit"}
          - s: "uno dellos entró por la manta de la cama del huésped"
            r: "next (after 'y'): one of them went in for the blanket off the host's bed"
            under:
              - {s: "apeándole del asno", r: "first: getting him down off the ass"}
          - s: "alzaron los ojos y vieron"
            r: "next (after 'y'): they looked up and saw"
            under:
              - {s: "echándole en ella", r: "first: throwing him into it"}
              - {s: "que el techo era algo más bajo de lo que habían menester para su obra", r: "what: that the ceiling was rather lower than they needed for their work"}
          - s: "y determinaron salirse al corral"
            r: "next: and they decided to go out into the yard"
            under:
              - {s: "que tenía por límite el cielo", r: "describes 'corral': whose only roof was the sky"}
        forms:
          - {w: "Quiso", f: "quis- + -o → querer (to want, will), preterite, it (the bad luck). Irregular: quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "se hallasen", f: "hall- + -asen → hallarse (to be found, be there), imperfect subjunctive (-se form), they; subjunctive after 'quiso que'. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "intencionada, juguetona", f: "feminine to match 'gente', which is a feminine singular noun even for a group of men."}
          - {w: "instigados y movidos", f: "participles of instigar (to urge) and mover (to move), masculine plural to match 'los cuales' (the men)."}
          - {w: "se llegaron", f: "lleg- + -aron → llegarse (to go up to), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "apeándole, echándole", f: "apeando, echando, the gerunds of apear (to get down) and echar (to throw), + le (him), with accents added."}
          - {w: "dellos", f: "de + ellos (of them). Cervantes fuses 'de' with this pronoun; modern Spanish keeps only 'del'."}
          - {w: "entró, alzaron, determinaron", f: "entrar (to go in), alzar (to raise), determinar (to decide), preterite: -ó for he, -aron for they. Same -ar preterite."}
          - {w: "vieron", f: "vi- + -eron → ver (to see), preterite, they. ver in the preterite: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "habían menester", f: "habían, haber (to have), imperfect, they, + menester (need): 'they needed'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
        note: "The three places are famous low haunts of Golden Age Spain, the kind of districts the picaresque novels describe; their people are rough jokers, not villains."
      - es: "Y allí, puesto Sancho en mitad de la manta, comenzaron a levantarle en alto y a holgarse con él como con perro por carnestolendas."
        literal: "And there, put Sancho in middle of the blanket, they-began to raise-him on high and to amuse-themselves with him as with dog at carnival."
        ormsby: "and there, putting Sancho in the middle of the blanket, they began to raise him high, making sport with him as they would with a dog at Shrovetide."
        ormsby_note: "\"The roome was high-roofed and fitted for their purpose. ... They began to blanket me and to toss me up in the air as they used to doe to dogges at Shrovetide.\" (Aleman's Guzman de Alfarache, Part I Book III Chapter I, James Mabbe's translation.) As the First Part of Guzman was published in 1599, it may have suggested the scene to Cervantes."
        vocab:
          - {w: "en mitad de", d: "in the middle of"}
          - {w: "en alto", d: "up high, into the air"}
          - {w: "holgarse con", d: "to have fun with, amuse oneself with"}
          - {w: "carnestolendas", d: "Shrovetide, the carnival days before Lent, when tossing dogs in blankets was a common rough game"}
        diagram:
          - s: "comenzaron"
            r: "main verb: they began"
            under:
              - {s: "Y allí", r: "where: and there"}
              - {s: "puesto Sancho en mitad de la manta", r: "when: Sancho being put in the middle of the blanket"}
              - {s: "a levantarle en alto", r: "what, 1: to toss him up high"}
              - s: "y a holgarse con él"
                r: "what, 2: and to make sport with him"
                under:
                  - {s: "como con perro por carnestolendas", r: "how: as with a dog at carnival"}
        forms:
          - {w: "puesto Sancho", f: "puesto, the irregular participle of poner (to put), in an absolute phrase: 'Sancho having been put'. The participle comes first and agrees with 'Sancho'."}
          - {w: "comenzaron", f: "comenz- + -aron → comenzar (to begin), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "levantarle", f: "levantar (to raise) + le (him), the pronoun hung on the infinitive."}
          - {w: "holgarse", f: "holgar (to rest; 'holgarse' = to have fun) + se, the pronoun hung on the infinitive."}
        note: "Tossing in a blanket ('mantear') was a carnival sport played on dogs and on unpopular people."
