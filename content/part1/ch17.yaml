          - {w: "haber menester", d: "to need, have need of (an old expression)"}
          - {w: "írsele a uno la sangre", d: "to be losing blood, bleed"}
          - {w: "herida", d: "wound"}
          - {w: "fantasma", d: "phantom, ghost; feminine in Cervantes ('esta fantasma'), masculine today"}
        diagram:
          - s: "creo"
            r: "main verb (after 'que', 'for'): I believe"
            under:
              - {s: "en verdad que", r: "how: truly"}
              - {s: "que lo he bien menester ahora", r: "what: that I need it badly now"}
              - s: "porque se me va mucha sangre de la herida"
                r: "why: because I am losing much blood from the wound"
                under:
                  - {s: "que esta fantasma me ha dado", r: "describes 'herida': that this phantom has given me"}
        forms:
          - {w: "creo", f: "cre- + -o → creer (to believe), present, I. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "he ... menester", f: "he, haber (to have), present, I, + menester (need): 'haber menester' = to need. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "se me va", f: "v- + -a → irse (to go away), present, it (the blood), with 'se' and 'me' (from me): 'is leaving me'. ir in the present: voy, vas, va, vamos, vais, van."}
          - {w: "esta fantasma", f: "esta (this), feminine because Cervantes treats 'fantasma' as feminine, like 'la mano'."}
          - {w: "me ha dado", f: "ha (haber, present, she/it) + dado, the participle of dar (to give): present perfect 'has given me'."}
  - sentences:
