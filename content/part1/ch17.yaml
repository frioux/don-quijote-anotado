          - {w: "bien es verdad que", d: "it is true that, to be sure"}
          - {w: "boca arriba", d: "face up, on one's back"}
          - {w: "menearse", d: "to move, stir"}
          - {w: "de puro", d: "+ adjective: from sheer, out of pure (molido = beaten)"}
          - {w: "molido", d: "ground; beaten black and blue, aching"}
          - {w: "emplastado", d: "plastered, covered in poultices"}
          - {w: "llegarse a", d: "to go up to, approach"}
        diagram:
          - s: "Bien es verdad"
            r: "main verb 1: it is true"
            under:
              - s: "que aún don Quijote se estaba boca arriba"
                r: "what: that Don Quijote still lay on his back"
                under:
                  - {s: "sin poderse menear", r: "how: unable to move"}
                  - {s: "de puro molido y emplastado", r: "why: from sheer beating and plasters"}
          - s: "Llegóse a él el cuadrillero"
            r: "main verb 2 (new sentence): the officer went up to him"
          - {s: "y díjole:", r: "main verb 3: and said to him"}
        forms:
          - {w: "se estaba", f: "est- + -aba → estarse (to stay, lie), imperfect, he; the 'se' stresses that he stayed put. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "poderse menear", f: "poder (to be able) + se (himself) + menear (to move): the 'se' of 'menearse' has climbed onto 'poder'."}
          - {w: "molido y emplastado", f: "participles of moler (to grind, beat) and emplastar (to plaster), masculine to match Don Quijote."}
          - {w: "Llegóse", f: "lleg- + -ó + se → llegarse (to go up to), preterite, he, with 'se' stuck on the end; modern 'se llegó'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "díjole", f: "dij- + -o + le → decir (to say), preterite, he, with 'le' (to him) on the end; modern 'le dijo'. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Pues, ¿cómo va, buen hombre?"
        literal: "— Well, how goes-it, good man?"
        ormsby: "“Well, how goes it, good man?”"
        vocab:
          - {w: "¿cómo va?", d: "how goes it?, how are you doing?"}
          - {w: "buen hombre", d: "my good man; a condescending address for a commoner, an insult to a knight"}
        diagram:
          - s: "¿cómo va"
            r: "main verb (question): how goes it"
            under:
              - {s: "Pues", r: "well: opening word"}
              - {s: "buen hombre?", r: "who is addressed: my good man"}
        forms:
          - {w: "va", f: "ir (to go), present, it: 'how goes it'. ir in the present: voy, vas, va, vamos, vais, van."}
          - {w: "buen", f: "bueno (good) clipped before a masculine singular noun ('hombre')."}
        note: "'Buen hombre' was how one spoke to a peasant or a tradesman. To Don Quijote, who expects 'señor caballero', it is an insult."
  - sentences:
      - es: "— Hablara yo más bien criado —respondió don Quijote—, si fuera que vos."
        literal: "— Would-speak I more well bred —answered Don Quijote—, if I-were that you."
        ormsby: "“I would speak more politely if I were you,” replied Don Quixote;"
        vocab:
          - {w: "bien criado", d: "well brought up, polite; 'mal criado' = rude"}
          - {w: "si fuera que vos", d: "if I were you; 'que' here is an old turn, modern 'si fuera vos' or 'si yo fuera usted'"}
          - {w: "vos", d: "'you', used here to a social inferior; less respectful than 'vuestra merced'"}
        diagram:
          - s: "Hablara yo más bien criado"
            r: "main verb: I would speak more politely"
            under:
              - {s: "si fuera que vos", r: "condition: if I were you"}
          - {s: "respondió don Quijote", r: "speech tag: Don Quijote answered"}
        forms:
          - {w: "Hablara", f: "habl- + -ara → hablar (to speak), imperfect subjunctive (-ra form), I, used as a conditional: 'I would speak'. The -ra form of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran. Cervantes often uses it where modern Spanish says 'hablaría'."}
          - {w: "criado", f: "cri- + -ado → criar (to bring up), participle, masculine to match 'yo': 'bred'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), I: 'if I were'. ser in the -ra form: fuera, fueras, fuera, fuéramos, fuerais, fueran."}
      - es: "¿Úsase en esta tierra hablar desa suerte a los caballeros andantes, majadero?"
        literal: "Is-it-used in this land to-speak of-that sort to the knights errant, blockhead?"
        ormsby: "“is it the way of this country to address knights-errant in that style, you booby?”"
        vocab:
          - {w: "usarse", d: "to be the custom, be usual"}
          - {w: "tierra", d: "land, country, region"}
          - {w: "desa suerte", d: "= de esa suerte, in that way, like that; 'desa' = de esa"}
          - {w: "majadero", d: "fool, blockhead, idiot"}
        diagram:
          - s: "¿Úsase en esta tierra"
            r: "main verb (question): is it the custom in this country"
            under:
              - {s: "hablar desa suerte a los caballeros andantes", r: "subject: to speak like that to knights-errant"}
              - {s: "majadero?", r: "who is addressed: you blockhead"}
        forms:
          - {w: "Úsase", f: "us- + -a + se → usarse (to be customary), present, it, with 'se' stuck on the end; modern 'se usa'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "hablar", f: "infinitive (to speak), the subject of 'úsase': 'is speaking ... customary'."}
          - {w: "desa", f: "de + esa (of that). Cervantes fuses 'de' with this pronoun; modern Spanish keeps only 'del'."}
          - {w: "andantes", f: "andante (wandering), plural to match 'caballeros'."}
  - sentences:
      - es: "El cuadrillero, que se vio tratar tan mal de un hombre de tan mal parecer, no lo pudo sufrir, y, alzando el candil con todo su aceite, dio a don Quijote con él en la cabeza, de suerte que le dejó muy bien descalabrado;"
        literal: "The officer, who himself saw treat so badly by a man of such bad appearance, not it could bear, and, raising the oil-lamp with all its oil, he-hit [to] Don Quijote with it on the head, of sort that him he-left very well head-broken;"
        ormsby: "The cuadrillero finding himself so disrespectfully treated by such a sorry-looking individual, lost his temper, and raising the lamp full of oil, smote Don Quixote such a blow with it on the head that he gave him a badly broken pate;"
        vocab:
          - {w: "verse tratar", d: "to find oneself treated"}
          - {w: "de mal parecer", d: "ill-looking, sorry-looking"}
          - {w: "sufrir", d: "to put up with, bear, tolerate"}
          - {w: "dar a uno con algo", d: "to hit someone with something"}
          - {w: "de suerte que", d: "so that, in such a way that"}
          - {w: "descalabrado", d: "with a broken head, a gashed scalp"}
        diagram:
          - s: "El cuadrillero"
            r: "subject"
            under:
              - {s: "que se vio tratar tan mal de un hombre de tan mal parecer", r: "describes 'cuadrillero': who saw himself treated so badly by so sorry-looking a man"}
          - {s: "no lo pudo sufrir", r: "main verb 1: could not stand it"}
          - s: "dio a don Quijote con él en la cabeza"
            r: "main verb 2 (after 'y'): hit Don Quijote with it on the head"
            under:
              - {s: "alzando el candil con todo su aceite", r: "how: raising the lamp with all its oil"}
              - {s: "de suerte que le dejó muy bien descalabrado", r: "result: so that he left him with a thoroughly broken head"}
        forms:
          - {w: "se vio", f: "vi- + -o → verse (to see oneself), preterite, he. ver in the preterite: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "pudo", f: "pud- + -o → poder (to be able), preterite, he. Irregular stem: pude, pudiste, pudo, pudimos, pudisteis, pudieron."}
          - {w: "alzando", f: "gerund of alzar (to raise): 'raising'."}
          - {w: "dio", f: "di- + -o → dar (to give; 'dar con' = to hit with), preterite, he. dar in the preterite: di, diste, dio, dimos, disteis, dieron."}
          - {w: "dejó", f: "dej- + -ó → dejar (to leave), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "descalabrado", f: "descalabr- + -ado → descalabrar (to break the head), participle, masculine to match 'le'."}
      - es: "y, como todo quedó ascuras, salióse luego; y Sancho Panza dijo:"
        literal: "and, as all remained in-the-dark, he-went-out-himself at-once; and Sancho Panza said:"
        ormsby: "then, all being in darkness, he went out, and Sancho Panza said,"
        vocab:
          - {w: "ascuras", d: "= a oscuras, in the dark; Cervantes writes it as one word"}
          - {w: "salirse", d: "to go out, leave"}
          - {w: "luego", d: "at once, right away (the old sense), not 'later'"}
        diagram:
          - s: "salióse luego"
            r: "main verb 1 (after 'y'): he went out at once"
            under:
              - {s: "como todo quedó ascuras", r: "why: since everything was left in the dark"}
          - {s: "y Sancho Panza dijo:", r: "main verb 2: and Sancho Panza said"}
        forms:
          - {w: "quedó", f: "qued- + -ó → quedar (to be left), preterite, it. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "salióse", f: "sal- + -ió + se → salirse (to go out), preterite, he, with 'se' stuck on the end; modern 'se salió'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Sin duda, señor, que éste es el moro encantado, y debe de guardar el tesoro para otros, y para nosotros sólo guarda las puñadas y los candilazos."
        literal: "— Without doubt, sir, that this-one is the Moor enchanted, and he-must of keep the treasure for others, and for us only he-keeps the punches and the lamp-blows."
        ormsby: "“That is certainly the enchanted Moor, Señor, and he keeps the treasure for others, and for us only the cuffs and lamp-whacks.”"
        vocab:
          - {w: "sin duda que", d: "no doubt, certainly; the 'que' adds emphasis"}
          - {w: "deber de", d: "+ infinitive: must (probability)"}
          - {w: "puñada", d: "punch, blow with the fist"}
          - {w: "candilazo", d: "blow with an oil lamp; -azo makes 'a blow with' (candil = oil lamp)"}
        diagram:
          - s: "Sin duda, señor, que éste es el moro encantado"
            r: "main verb 1: no doubt, sir, this is the enchanted Moor"
          - s: "y debe de guardar el tesoro para otros"
            r: "main verb 2: and he must be keeping the treasure for others"
          - s: "y para nosotros sólo guarda las puñadas y los candilazos"
            r: "main verb 3: and for us he keeps only punches and lamp-blows"
        forms:
          - {w: "éste", f: "este (this one), masculine, standing alone as a pronoun; the accent is the old printers' habit."}
          - {w: "debe de guardar", f: "deb- + -e → deber (must), present, he, + 'de' + guardar (to keep): 'he must be keeping'. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "guarda", f: "guard- + -a → guardar (to keep), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "candilazos", f: "candil (oil lamp) + -azo (a blow with) + -s: 'lamp-blows', like 'porrazo' (club blow) and 'puñetazo' (punch)."}
        note: "Sancho turns his master's theory against him: the treasure (the 'damsel') goes to others and the blows to them, a summary of the whole night."
  - sentences:
      - es: "— Así es —respondió don Quijote—, y no hay que hacer caso destas cosas de encantamentos, ni hay para qué tomar cólera ni enojo con ellas; que, como son invisibles y fantásticas, no hallaremos de quién vengarnos, aunque más lo procuremos."
        literal: "— So it-is —answered Don Quijote—, and not there-is [need] to make case of-these things of enchantments, nor there-is for what to-take anger nor annoyance with them; for, as they-are invisible and fantastic, not we-will-find of whom to-avenge-ourselves, although more it we-may-try."
        ormsby: "“That is the truth,” answered Don Quixote, “and there is no use in troubling oneself about these matters of enchantment or being angry or vexed at them, for as they are invisible and visionary we shall find no one on whom to avenge ourselves, do what we may;"
        vocab:
          - {w: "no hay que", d: "+ infinitive: there is no need to, one shouldn't"}
          - {w: "hacer caso de", d: "to pay attention to, take notice of"}
          - {w: "destas", d: "= de estas, of these"}
          - {w: "encantamento", d: "= encantamiento, enchantment; the old form"}
          - {w: "no hay para qué", d: "there is no reason to, no point in"}
          - {w: "tomar cólera", d: "to get angry"}
          - {w: "fantástico", d: "imaginary, unreal, phantom (not 'wonderful')"}
          - {w: "vengarse de", d: "to take revenge on"}
          - {w: "aunque más", d: "+ subjunctive: however much, no matter how hard"}
          - {w: "procurar", d: "to try, endeavor (false friend: not 'procure')"}
        diagram:
          - s: "Así es"
            r: "main verb 1: so it is"
          - {s: "respondió don Quijote", r: "speech tag: Don Quijote answered"}
          - s: "y no hay que hacer caso destas cosas de encantamentos"
            r: "main verb 2: and there is no point in heeding these matters of enchantment"
          - s: "ni hay para qué tomar cólera ni enojo con ellas"
            r: "main verb 3: nor any reason to get angry or vexed at them"
            under:
              - s: "que ... no hallaremos de quién vengarnos"
                r: "why: for we will find no one to take revenge on"
                under:
                  - {s: "como son invisibles y fantásticas", r: "why: since they are invisible and imaginary"}
                  - {s: "aunque más lo procuremos", r: "concession: however hard we try"}
        forms:
          - {w: "hay", f: "haber, present, used alone: 'there is'. With 'que' + infinitive it means 'one must'."}
          - {w: "destas", f: "de + estas (of these). Cervantes fuses 'de' with this pronoun; modern Spanish keeps only 'del'."}
          - {w: "son", f: "ser (to be), present, they. soy, eres, es, somos, sois, son."}
          - {w: "invisibles y fantásticas", f: "invisible (one form for both genders) + -s; fantástic- + -as → fantástico, feminine plural to match 'cosas'."}
          - {w: "hallaremos", f: "hallar- + -emos → hallar (to find), future, we. The future adds to the infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "vengarnos", f: "vengar (to avenge) + nos (ourselves), the pronoun hung on the infinitive."}
          - {w: "procuremos", f: "procur- + -emos → procurar (to try), present subjunctive, we. Subjunctive after 'aunque más' (however much). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
      - es: "Levántate, Sancho, si puedes, y llama al alcaide desta fortaleza, y procura que se me dé un poco de aceite, vino, sal y romero para hacer el salutífero bálsamo;"
        literal: "Get-yourself-up, Sancho, if you-can, and call [to] the warden of-this fortress, and try that to-me be-given a little of oil, wine, salt and rosemary for to-make the health-giving balsam;"
        ormsby: "rise, Sancho, if thou canst, and call the alcaide of this fortress, and get him to give me a little oil, wine, salt, and rosemary to make the salutiferous balsam,"
        vocab:
          - {w: "alcaide", d: "governor or warden of a castle; Don Quijote's word for the innkeeper"}
          - {w: "fortaleza", d: "fortress, stronghold"}
          - {w: "procurar que", d: "+ subjunctive: to see to it that, get (someone) to"}
          - {w: "romero", d: "rosemary"}
          - {w: "salutífero", d: "health-giving, healing (a learned Latin word)"}
        diagram:
          - {s: "Levántate", r: "command 1: get up"}
          - {s: "si puedes", r: "condition: if you can"}
          - {s: "y llama al alcaide desta fortaleza", r: "command 2: and call the warden of this fortress"}
          - s: "y procura"
            r: "command 3: and see to it"
            under:
              - s: "que se me dé un poco de aceite, vino, sal y romero"
                r: "what: that I be given a little oil, wine, salt and rosemary"
                under:
                  - {s: "para hacer el salutífero bálsamo", r: "why: to make the healing balsam"}
        forms:
          - {w: "Levántate", f: "levanta + te → levantarse (to get up), command, you (tú), with 'te' (yourself) on the end and an accent added. The tú command of -ar verbs looks like the he-form of the present: levanta, llama, procura."}
          - {w: "puedes", f: "pued- + -es → poder (to be able), present, you (tú). The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "llama, procura", f: "llamar (to call) and procurar (to try), commands, you (tú). Same tú command."}
          - {w: "al, desta", f: "a + el (to the); de + esta (of this). Modern Spanish keeps 'al' but writes 'de esta'."}
          - {w: "se me dé", f: "d- + -é → dar (to give), present subjunctive, it, with 'se' (impersonal: 'be given') and 'me' (to me). Subjunctive after 'procura que'. dar in the present subjunctive: dé, des, dé, demos, deis, den."}
        note: "Oil, wine, salt and rosemary are the real ingredients of a common household salve; the magic is supposed to come from the prayers Don Quijote says over it."
      - es: "que en verdad que creo que lo he bien menester ahora, porque se me va mucha sangre de la herida que esta fantasma me ha dado."
        literal: "for in truth that I-believe that it I-have well need now, because itself from-me goes much blood from the wound that this phantom to-me has given."
        ormsby: "for indeed I believe I have great need of it now, because I am losing much blood from the wound that phantom gave me.”"
