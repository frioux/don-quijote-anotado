  - sentences:
      - es: "— Muchas y muy grandes son las mercedes, señor alcaide, que en este vuestro castillo he recebido, y quedo obligadísimo a agradecéroslas todos los días de mi vida."
        literal: "— Many and very great are the favors, lord warden, that in this your castle I-have received, and I-remain most-obliged to thank-you-for-them all the days of my life."
        ormsby: "“Many and great are the favours, Señor Alcaide, that I have received in this castle of yours, and I remain under the deepest obligation to be grateful to you for them all the days of my life;"
        vocab:
          - {w: "merced", d: "favor, kindness"}
          - {w: "alcaide", d: "governor or warden of a castle"}
          - {w: "este vuestro castillo", d: "this castle of yours (demonstrative and possessive together, an old construction)"}
          - {w: "recebir", d: "= recibir, to receive; the old spelling"}
          - {w: "quedar obligado a", d: "to remain obliged to, be in someone's debt"}
          - {w: "agradecer", d: "to thank for, be grateful for"}
        diagram:
          - s: "Muchas y muy grandes son las mercedes"
            r: "main verb 1: many and very great are the favors"
            under:
              - {s: "señor alcaide", r: "who is addressed: lord warden"}
              - {s: "que en este vuestro castillo he recebido", r: "describes 'mercedes': that I have received in this castle of yours"}
          - s: "y quedo obligadísimo"
            r: "main verb 2: and I remain deeply obliged"
            under:
              - {s: "a agradecéroslas todos los días de mi vida", r: "to what: to thank you for them all the days of my life"}
        forms:
          - {w: "Muchas y muy grandes", f: "much- + -as → mucho, feminine plural to match 'mercedes'; grandes, plural of grande (one form for both genders)."}
          - {w: "son", f: "ser (to be), present, they. soy, eres, es, somos, sois, son."}
          - {w: "vuestro", f: "'your' for vos, masculine to match 'castillo'."}
          - {w: "he recebido", f: "he (haber, present, I: he, has, ha, hemos, habéis, han) + recebido (= recibido), the participle of recebir (= recibir, to receive): present perfect 'I have received'."}
          - {w: "quedo", f: "qued- + -o → quedar (to remain), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "obligadísimo", f: "obligado (obliged) + -ísimo (most, very), masculine to match 'yo'."}
          - {w: "agradecéroslas", f: "agradecer (to thank for) + os (to you, vos) + las (them, the favors), with an accent added to keep the stress on '-cer'."}
        note: "Don Quijote speaks the formal farewell of a knight leaving a lord's castle, in the old 'vos' and with the archaic vocabulary of the romances (recebido, fecho, faceros, tuertos)."
      - es: "Si os las puedo pagar en haceros vengado de algún soberbio que os haya fecho algún agravio, sabed que mi oficio no es otro sino valer a los que poco pueden, y vengar a los que reciben tuertos, y castigar alevosías."
        literal: "If to-you them I-can repay in making-you avenged of some proud-one who to-you may-have done some wrong, know that my office not is other but to-help [to] those who little can, and to-avenge [to] those who receive wrongs, and to-punish treacheries."
        ormsby: "if I can repay them in avenging you of any arrogant foe who may have wronged you, know that my calling is no other than to aid the weak, to avenge those who suffer wrong, and to chastise perfidy."
        vocab:
          - {w: "hacer vengado a uno de", d: "to get someone avenged on, take revenge for someone"}
          - {w: "soberbio", d: "proud, arrogant man"}
          - {w: "fecho", d: "= hecho, done; the old f- form of the romances"}
          - {w: "agravio", d: "wrong, injury, insult"}
          - {w: "oficio", d: "calling, duty, job"}
          - {w: "valer a", d: "to help, protect, stand by (old sense)"}
          - {w: "los que poco pueden", d: "those who have little power, the weak"}
          - {w: "tuerto", d: "wrong, injustice (old noun; today 'one-eyed')"}
          - {w: "alevosía", d: "treachery, perfidy"}
        diagram:
          - s: "sabed"
            r: "main verb (command): know"
            under:
              - s: "Si os las puedo pagar en haceros vengado de algún soberbio"
                r: "condition: if I can repay them by avenging you on some arrogant man"
                under:
                  - {s: "que os haya fecho algún agravio", r: "describes 'soberbio': who may have done you some wrong"}
              - s: "que mi oficio no es otro sino"
                r: "what: that my office is nothing other than"
                under:
                  - {s: "valer a los que poco pueden", r: "duty 1: to help the weak"}
                  - {s: "y vengar a los que reciben tuertos", r: "duty 2: to avenge those who suffer wrongs"}
                  - {s: "y castigar alevosías", r: "duty 3: to punish treachery"}
        forms:
          - {w: "os las puedo pagar", f: "pued- + -o → poder (to be able), present, I, + pagar (to repay), with 'os' (to you, vos) and 'las' (them, the favors). The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "haceros", f: "hacer (to make) + os (you, vos), the pronoun hung on the infinitive."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun."}
          - {w: "haya fecho", f: "haya (haber, present subjunctive, he: haya, hayas, haya, hayamos, hayáis, hayan) + fecho (= hecho), the participle of hacer: 'may have done'. Subjunctive because the wrongdoer is hypothetical."}
          - {w: "sabed", f: "sabe- + -d → saber (to know), command, you (vos). The vos command ends in -d: sabed, haced, decid."}
          - {w: "pueden, reciben", f: "pued- + -en → poder (to be able), recib- + -en → recibir (to receive), present, they. poder: puedo, puedes, puede, podemos, podéis, pueden; recibir: recibo, recibes, recibe, recibimos, recibís, reciben."}
        note: "This is the knight-errant's creed as the romances state it: to help the weak, right wrongs and punish treachery. Offering it to an innkeeper as payment is the joke."
      - es: "Recorred vuestra memoria, y si halláis alguna cosa deste jaez que encomendarme, no hay sino decilla; que yo os prometo, por la orden de caballero que recebí, de faceros satisfecho y pagado a toda vuestra voluntad."
        literal: "Run-through your memory, and if you-find some thing of-this kind that to-entrust-me, not there-is but to-say-it; for I to-you promise, by the order of knight that I-received, of to-make-you satisfied and paid to all your will."
        ormsby: "Search your memory, and if you find anything of this kind you need only tell me of it, and I promise you by the order of knighthood which I have received to procure you satisfaction and reparation to the utmost of your desire.”"
        vocab:
