          - s: "no hay sino decilla"
            r: "main verb 2 (after 'y'): you need only say it"
            under:
              - {s: "si halláis alguna cosa deste jaez que encomendarme", r: "condition: if you find something of this kind to entrust to me"}
          - s: "que yo os prometo"
            r: "main verb 3: for I promise you"
            under:
              - {s: "por la orden de caballero que recebí", r: "by what: by the order of knighthood I received"}
              - {s: "de faceros satisfecho y pagado a toda vuestra voluntad", r: "what: to make you satisfied and repaid wholly to your liking"}
        forms:
          - {w: "Recorred", f: "recorre- + -d → recorrer (to run through), command, you (vos). The vos command ends in -d: recorred, sabed, haced."}
          - {w: "halláis", f: "hall- + -áis → hallar (to find), present, you (vos). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "deste", f: "de + este (of this). Cervantes fuses 'de' with this pronoun; modern Spanish keeps only 'del'."}
          - {w: "encomendarme", f: "encomendar (to entrust) + me (to me), the pronoun hung on the infinitive."}
          - {w: "decilla", f: "decir (to say) + la (it), with -rl- turned into -ll-: decirla → decilla."}
          - {w: "prometo", f: "promet- + -o → prometer (to promise), present, I. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "recebí", f: "receb- + -í → recebir (= recibir, to receive), preterite, I. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "faceros", f: "facer (= hacer, to make) + os (you, vos). The old f- survives in the language of the romances."}
          - {w: "satisfecho y pagado", f: "participles of satisfacer (to satisfy; irregular, like hacer → hecho) and pagar (to pay), masculine to match 'os' (the innkeeper)."}
        note: "The 'order of knighthood' he received is the mock dubbing performed by another innkeeper in chapter 3."
