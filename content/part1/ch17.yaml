          - {w: "se les debe", f: "deb- + -e → deber (to owe), present, it, with 'se' (passive: 'is owed') and 'les' (to them). The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "cualquier", f: "cualquiera (any) clipped before a noun ('buen acogimiento')."}
          - {w: "hiciere", f: "hic- + -iere → hacer (to make, give), future subjunctive, it: 'that may be given'. hacer in the future subjunctive: hiciere, hicieres, hiciere, hiciéremos, hiciereis, hicieren. Cervantes uses it for an open future; modern Spanish says 'haga'."}
