  - sentences:
      - es: "— Engañado he vivido hasta aquí —respondió don Quijote—, que en verdad que pensé que era castillo, y no malo;"
        literal: "— Deceived I-have lived until here —answered Don Quijote—, for in truth that I-thought that it-was castle, and not bad;"
        ormsby: "“I have been under a mistake all this time,” answered Don Quixote, “for in truth I thought it was a castle, and not a bad one;"
        vocab:
          - {w: "engañado", d: "deceived, mistaken"}
          - {w: "hasta aquí", d: "until now"}
          - {w: "en verdad que", d: "truly, indeed; the 'que' adds emphasis"}
        diagram:
          - s: "Engañado he vivido hasta aquí"
            r: "main verb: I have lived deceived until now"
          - {s: "respondió don Quijote", r: "speech tag: Don Quijote answered"}
          - s: "que en verdad que pensé"
            r: "why: for truly I thought"
            under:
              - {s: "que era castillo, y no malo", r: "what: that it was a castle, and not a bad one"}
        forms:
          - {w: "Engañado", f: "engañ- + -ado → engañar (to deceive), participle, masculine to match 'yo', placed first for emphasis."}
          - {w: "he vivido", f: "he (haber, present, I: he, has, ha, hemos, habéis, han) + vivido, the participle of vivir (to live): present perfect 'I have lived'."}
          - {w: "pensé", f: "pens- + -é → pensar (to think), preterite, I. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "era", f: "ser (to be), imperfect, it. era, eras, era, éramos, erais, eran."}
      - es: "pero, pues es ansí que no es castillo sino venta, lo que se podrá hacer por agora es que perdonéis por la paga, que yo no puedo contravenir a la orden de los caballeros andantes, de los cuales sé cierto, sin que hasta ahora haya leído cosa en contrario, que jamás pagaron posada ni otra cosa en venta donde estuviesen, porque se les debe de fuero y de derecho cualquier buen acogimiento que se les hiciere, en pago del insufrible trabajo que padecen buscando las aventuras de noche y de día, en invierno y en verano, a pie y a caballo, con sed y con hambre, con calor y con frío, sujetos a todas las inclemencias del cielo y a todos los incómodos de la tierra."
        literal: "but, since it-is so that not it-is castle but inn, that which one-will-be-able to-do for now is that you-pardon for the payment, for I not can contravene [to] the order of the knights errant, of the which I-know certain, without that until now I-may-have read thing in contrary, that never they-paid lodging nor other thing in inn where they-might-be, because to-them is-owed by statute and by right whatever good welcome that to-them may-be-made, in payment of-the insufferable toil that they-suffer seeking the adventures by night and by day, in winter and in summer, on foot and on horse, with thirst and with hunger, with heat and with cold, subject to all the inclemencies of-the sky and to all the discomforts of the earth."
        ormsby: "but since it appears that it is not a castle but an inn, all that can be done now is that you should excuse the payment, for I cannot contravene the rule of knights-errant, of whom I know as a fact (and up to the present I have read nothing to the contrary) that they never paid for lodging or anything else in the inn where they might be; for any hospitality that might be offered them is their due by law and right in return for the insufferable toil they endure in seeking adventures by night and by day, in summer and in winter, on foot and on horseback, in hunger and thirst, cold and heat, exposed to all the inclemencies of heaven and all the hardships of earth.”"
        ormsby_note: "Nevertheless Orlando in the Morgante Maggiore is called upon to leave his horse in pledge for his reckoning. Morg. Magg. Chapter XXI st. 129."
