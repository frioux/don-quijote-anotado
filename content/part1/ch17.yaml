          - {w: "lo son", f: "son, ser (to be), present, they, with 'lo' standing for 'caballeros': 'who are not (knights)'. soy, eres, es, somos, sois, son."}
  - sentences:
      - es: "— Si eso sabía vuestra merced —replicó Sancho—, ¡mal haya yo y toda mi parentela!, ¿para qué consintió que lo gustase?"
        literal: "— If that knew your grace —replied Sancho—, ill may-have I and all my kindred!, for what did-you-consent that it I-might-taste?"
        ormsby: "“If your worship knew that,” returned Sancho—“woe betide me and all my kindred!—why did you let me taste it?”"
        vocab:
          - {w: "¡mal haya ...!", d: "curse ...!, woe betide ...! (an oath)"}
          - {w: "parentela", d: "kindred, relatives, family"}
          - {w: "¿para qué?", d: "what for?, why?"}
          - {w: "consentir", d: "to allow, permit, consent"}
          - {w: "gustar", d: "here 'to taste, try' (the old sense), not 'to please'"}
        diagram:
          - s: "¿para qué consintió"
            r: "main verb (question): why did you allow"
            under:
              - {s: "Si eso sabía vuestra merced", r: "condition: if your worship knew that"}
              - {s: "¡mal haya yo y toda mi parentela!", r: "an oath: curse me and all my kin"}
              - {s: "que lo gustase?", r: "what: that I taste it"}
          - {s: "replicó Sancho", r: "speech tag: Sancho replied"}
        forms:
          - {w: "sabía", f: "sab- + -ía → saber (to know), imperfect, you (vuestra merced takes the he/she form). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "haya", f: "hay- + -a → haber, present subjunctive, used in the curse 'mal haya' (may ill befall). haber in the present subjunctive: haya, hayas, haya, hayamos, hayáis, hayan."}
          - {w: "consintió", f: "consint- + -ió → consentir (to allow), preterite, you (vuestra merced); the e of the stem turns to i. consentir in the preterite: consentí, consentiste, consintió, consentimos, consentisteis, consintieron."}
          - {w: "gustase", f: "gust- + -ase → gustar (to taste), imperfect subjunctive (-se form), I. Subjunctive after 'consintió que'. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
  - sentences:
      - es: "En esto, hizo su operación el brebaje, y comenzó el pobre escudero a desaguarse por entrambas canales, con tanta priesa que la estera de enea, sobre quien se había vuelto a echar, ni la manta de anjeo con que se cubría, fueron más de provecho."
        literal: "At this, made its operation the brew, and began the poor squire to drain-himself through both channels, with such haste that the mat of bulrush, on which he-had turned to lie-down, nor the blanket of coarse-linen with which he-covered-himself, were more of use."
        ormsby: "At this moment the draught took effect, and the poor squire began to discharge both ways at such a rate that the rush mat on which he had thrown himself and the canvas blanket he had covering him were fit for nothing afterwards."
        vocab:
          - {w: "hacer su operación", d: "to take effect, work (of a medicine)"}
          - {w: "brebaje", d: "brew, potion, concoction (usually nasty)"}
          - {w: "desaguarse", d: "to drain, empty oneself (a comic euphemism)"}
          - {w: "entrambos", d: "= ambos, both; the old form"}
          - {w: "canal", d: "channel; 'por entrambas canales' = from both ends"}
          - {w: "priesa", d: "= prisa, haste; the old form"}
          - {w: "estera de enea", d: "bulrush mat"}
          - {w: "volver a", d: "+ infinitive: to do again"}
          - {w: "manta de anjeo", d: "blanket of coarse linen, sacking"}
          - {w: "ser de provecho", d: "to be of use; 'ni ... fueron más de provecho' = were never of use again"}
        diagram:
          - s: "hizo su operación el brebaje"
            r: "main verb 1: the brew took effect"
            under:
              - {s: "En esto", r: "when: at this point"}
          - s: "y comenzó el pobre escudero a desaguarse por entrambas canales"
            r: "main verb 2: and the poor squire began to empty himself from both ends"
            under:
              - s: "con tanta priesa"
                r: "how: with such haste"
                under:
                  - s: "que la estera de enea ... ni la manta de anjeo ... fueron más de provecho"
                    r: "result: that neither the rush mat nor the linen blanket was ever of use again"
                    under:
                      - {s: "sobre quien se había vuelto a echar", r: "describes 'estera': on which he had lain down again"}
                      - {s: "con que se cubría", r: "describes 'manta': with which he covered himself"}
        forms:
          - {w: "hizo", f: "hiz- + -o → hacer (to make), preterite, it. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "comenzó", f: "comenz- + -ó → comenzar (to begin), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "desaguarse", f: "desaguar (to drain) + se (himself), the pronoun hung on the infinitive after 'comenzó a'."}
          - {w: "entrambas", f: "entramb- + -as → entrambos (both), feminine plural to match 'canales', which Cervantes treats as feminine."}
          - {w: "se había vuelto a echar", f: "había (haber, imperfect, he: había, habías, había, habíamos, habíais, habían) + vuelto, the irregular participle of volver, + 'a' + echar: 'had lain down again'."}
          - {w: "quien", f: "'which' for a thing (the mat); old Spanish lets 'quien' refer to things."}
          - {w: "se cubría", f: "cubr- + -ía → cubrirse (to cover oneself), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "fueron", f: "fu- + -eron → ser (to be), preterite, they (mat and blanket). ser's preterite is irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
      - es: "Sudaba y trasudaba con tales parasismos y accidentes, que no solamente él, sino todos pensaron que se le acababa la vida."
        literal: "He-was-sweating and over-sweating with such paroxysms and fits, that not only he, but all thought that itself to-him was-ending the life."
        ormsby: "He sweated and perspired with such paroxysms and convulsions that not only he himself but all present thought his end had come."
        vocab:
          - {w: "trasudar", d: "to sweat lightly, break into a cold sweat"}
          - {w: "parasismo", d: "= paroxismo, fit, convulsion"}
          - {w: "accidente", d: "fit, sudden attack of illness (medical sense), not 'accident'"}
          - {w: "no solamente ... sino", d: "not only ... but"}
          - {w: "acabársele a uno la vida", d: "for one's life to be ending"}
        diagram:
          - s: "Sudaba y trasudaba"
            r: "main verb: he sweated and sweated"
            under:
              - s: "con tales parasismos y accidentes"
                r: "how: with such fits and seizures"
                under:
                  - {s: "que no solamente él, sino todos pensaron que se le acababa la vida", r: "result: that not only he but everyone thought his life was ending"}
        forms:
          - {w: "Sudaba, trasudaba", f: "sud- + -aba → sudar (to sweat), trasud- + -aba → trasudar (to sweat lightly), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "tales", f: "tal (such), plural to match 'parasismos y accidentes'."}
          - {w: "solamente", f: "sola (only, alone) + -mente: 'only'. -mente is added to the feminine form of the adjective."}
          - {w: "pensaron", f: "pens- + -aron → pensar (to think), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "se le acababa", f: "acab- + -aba → acabarse (to come to an end), imperfect, it (his life), with 'le' (for him). Same -aba imperfect."}
      - es: "Duróle esta borrasca y mala andanza casi dos horas, al cabo de las cuales no quedó como su amo, sino tan molido y quebrantado que no se podía tener."
        literal: "Lasted-him this squall and bad going almost two hours, at-the end of the which not he-remained like his master, but so ground and broken that not himself he-could hold."
        ormsby: "This tempest and tribulation lasted about two hours, at the end of which he was left, not like his master, but so weak and exhausted that he could not stand."
        vocab:
          - {w: "durar", d: "to last"}
          - {w: "borrasca", d: "squall, storm"}
          - {w: "mala andanza", d: "misfortune, ordeal (also written 'malandanza')"}
          - {w: "al cabo de", d: "at the end of, after"}
          - {w: "molido y quebrantado", d: "ground and broken: worn out, aching all over"}
          - {w: "tenerse", d: "to stand up, hold oneself up"}
        diagram:
          - s: "Duróle esta borrasca y mala andanza casi dos horas"
            r: "main verb: this storm and ordeal lasted him almost two hours"
            under:
              - s: "al cabo de las cuales no quedó como su amo"
                r: "describes 'horas': at the end of which he was not left like his master"
                under:
                  - {s: "sino tan molido y quebrantado que no se podía tener", r: "but: but so worn out and aching that he could not stand"}
        forms:
          - {w: "Duróle", f: "dur- + -ó + le → durar (to last), preterite, it, with 'le' (to him) on the end; modern 'le duró'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "esta, mala", f: "est- + -a → este (this), mal- + -a → malo (bad), feminine to match 'borrasca' and 'andanza'."}
          - {w: "quedó", f: "qued- + -ó → quedar (to be left), preterite, he. Same -ar preterite."}
          - {w: "molido y quebrantado", f: "participles of moler (to grind) and quebrantar (to break), masculine to match Sancho."}
          - {w: "se podía tener", f: "pod- + -ía → poder (to be able), imperfect, he, + tener (to hold), with 'se' (himself) moved in front: 'he could not hold himself up'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
  - sentences:
      - es: "Pero don Quijote, que, como se ha dicho, se sintió aliviado y sano, quiso partirse luego a buscar aventuras, pareciéndole que todo el tiempo que allí se tardaba era quitársele al mundo y a los en él menesterosos de su favor y amparo;"
        literal: "But Don Quijote, who, as it has-been said, himself felt relieved and healthy, wanted to-depart at-once to seek adventures, seeming-to-him that all the time that there he-delayed was to-take-it-away from-the world and from those in it needy of his favor and protection;"
        ormsby: "Don Quixote, however, who, as has been said, felt himself relieved and well, was eager to take his departure at once in quest of adventures, as it seemed to him that all the time he loitered there was a fraud upon the world and those in it who stood in need of his help and protection,"
        vocab:
          - {w: "partirse", d: "to leave, set out"}
          - {w: "luego", d: "at once, right away (the old sense)"}
          - {w: "tardarse", d: "to linger, delay"}
          - {w: "quitar a", d: "to take away from, rob (someone of something)"}
          - {w: "menesteroso de", d: "in need of"}
          - {w: "amparo", d: "protection, shelter"}
        diagram:
          - s: "quiso partirse luego a buscar aventuras"
            r: "main verb: he wanted to set out at once to seek adventures"
            under:
              - s: "Pero don Quijote"
                r: "subject: but Don Quijote"
                under:
                  - {s: "que, como se ha dicho, se sintió aliviado y sano", r: "describes 'don Quijote': who, as has been said, felt relieved and well"}
              - s: "pareciéndole"
                r: "why: since it seemed to him"
                under:
                  - s: "que todo el tiempo que allí se tardaba era quitársele al mundo y a los en él menesterosos de su favor y amparo"
                    r: "what: that all the time he lingered there was stolen from the world and from those in it who needed his help and protection"
        forms:
          - {w: "se ha dicho", f: "ha (haber, present, it: he, has, ha, hemos, habéis, han) + dicho, the participle of decir (to say), with 'se': 'it has been said'."}
          - {w: "se sintió", f: "sint- + -ió → sentirse (to feel), preterite, he; the e of the stem turns to i. sentir in the preterite: sentí, sentiste, sintió, sentimos, sentisteis, sintieron."}
          - {w: "quiso", f: "quis- + -o → querer (to want), preterite, he. Irregular: quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "pareciéndole", f: "pareciendo, the gerund of parecer (to seem), + le (to him), with an accent added."}
          - {w: "se tardaba", f: "tard- + -aba → tardarse (to linger), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "quitársele", f: "quitar (to take away) + se (impersonal: 'being taken') + le (from it, the world), with an accent added: 'to be taking it away from'."}
          - {w: "los en él menesterosos", f: "a compressed phrase: 'los (que están) en él menesterosos', those in it who are in need; menesterosos is masculine plural to match 'los'."}
      - es: "y más con la seguridad y confianza que llevaba en su bálsamo."
        literal: "and more with the security and confidence that he-carried in his balsam."
        ormsby: "all the more when he had the security and confidence his balsam afforded him;"
        vocab:
          - {w: "y más", d: "all the more so, especially"}
          - {w: "seguridad", d: "security, assurance"}
          - {w: "confianza", d: "confidence, trust"}
        diagram:
          - s: "quiso partirse"
            r: "carried over from the previous sentence: he wanted to set out"
            under:
              - s: "y más con la seguridad y confianza"
                r: "all the more: given the assurance and confidence"
                under:
                  - {s: "que llevaba en su bálsamo", r: "describes 'seguridad y confianza': that he had in his balsam"}
        forms:
          - {w: "llevaba", f: "llev- + -aba → llevar (to carry, have), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "su", f: "'his' here; su serves for his, her, its, their, your (vuestra merced)."}
      - es: "Y así, forzado deste deseo, él mismo ensilló a Rocinante y enalbardó al jumento de su escudero, a quien también ayudó a vestir y a subir en el asno."
        literal: "And so, forced by-this desire, he himself saddled [to] Rocinante and pack-saddled [to] the donkey of his squire, whom also he-helped to dress and to get-up on the ass."
        ormsby: "and so, urged by this impulse, he saddled Rocinante himself and put the packsaddle on his squire’s beast, whom likewise he helped to dress and mount the ass;"
        vocab:
          - {w: "forzado de", d: "driven by, compelled by"}
          - {w: "deste", d: "= de este, by this"}
          - {w: "ensillar", d: "to saddle (a horse)"}
          - {w: "enalbardar", d: "to put a packsaddle (albarda) on a donkey"}
          - {w: "jumento", d: "donkey, ass"}
        diagram:
          - s: "él mismo ensilló a Rocinante"
            r: "main verb 1 (after 'Y así'): he himself saddled Rocinante"
            under:
              - {s: "forzado deste deseo", r: "why: driven by this desire"}
          - s: "y enalbardó al jumento de su escudero"
            r: "main verb 2: and packsaddled his squire's donkey"
            under:
              - {s: "a quien también ayudó a vestir y a subir en el asno", r: "describes 'escudero': whom he also helped to dress and get up on the ass"}
        forms:
          - {w: "forzado", f: "forz- + -ado → forzar (to force), participle, masculine to match Don Quijote. Old Spanish marks the doer with 'de' ('deste deseo')."}
          - {w: "deste", f: "de + este (by this). Cervantes fuses 'de' with this pronoun; modern Spanish keeps only 'del'."}
          - {w: "ensilló, enalbardó, ayudó", f: "ensill- + -ó → ensillar (to saddle), enalbard- + -ó → enalbardar (to packsaddle), ayud- + -ó → ayudar (to help), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "a Rocinante, al jumento", f: "the 'a' that marks a person as the object is used for the named horse and then for the donkey too."}
          - {w: "vestir, subir", f: "infinitives after 'ayudó a': 'helped to dress, to get up'."}
      - es: "Púsose luego a caballo, y, llegándose a un rincón de la venta, asió de un lanzón que allí estaba, para que le sirviese de lanza."
        literal: "Put-himself then on horse, and, approaching-himself to a corner of the inn, he-grasped of a pike that there was, for that to-him it-might-serve as lance."
        ormsby: "after which he mounted his horse and turning to a corner of the inn he laid hold of a pike that stood there, to serve him by way of a lance."
        vocab:
          - {w: "ponerse a caballo", d: "to mount, get on horseback"}
          - {w: "llegarse a", d: "to go up to, approach"}
          - {w: "rincón", d: "corner (inside)"}
          - {w: "asir de", d: "to grab, seize, take hold of"}
          - {w: "lanzón", d: "pike, a short thick lance (used by watchmen and farm guards); -ón makes it 'big lance'"}
          - {w: "servir de", d: "to serve as"}
        diagram:
          - {s: "Púsose luego a caballo", r: "main verb 1: then he mounted"}
          - s: "asió de un lanzón"
            r: "main verb 2 (after 'y'): he grabbed a pike"
            under:
              - {s: "llegándose a un rincón de la venta", r: "how: going over to a corner of the inn"}
              - {s: "que allí estaba", r: "describes 'lanzón': that was there"}
              - {s: "para que le sirviese de lanza", r: "why: so that it might serve him as a lance"}
        forms:
          - {w: "Púsose", f: "pus- + -o + se → ponerse (to put oneself), preterite, he, with 'se' on the end; modern 'se puso'. Irregular: puse, pusiste, puso, pusimos, pusisteis, pusieron."}
          - {w: "llegándose", f: "llegando, the gerund of llegar (to approach), + se, with an accent added."}
          - {w: "asió", f: "as- + -ió → asir (to seize), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, it. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "sirviese", f: "sirv- + -iese → servir (to serve), imperfect subjunctive (-se form), it; subjunctive after 'para que'. The e of the stem turns to i. The -se form of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen."}
        note: "A 'lanzón' was the short pike a watchman or a field guard carried. Don Quijote helps himself to the inn's pike without asking, as if the castle's arms were his to use."
