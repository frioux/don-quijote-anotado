              - {s: "ya que estas desgracias son de la cosecha de la caballería", r: "since: as these mishaps are the harvest of chivalry"}
              - {s: "si suceden muy a menudo", r: "tell me what, 1: whether they happen very often"}
              - s: "o si tienen sus tiempos limitados"
