          - {w: "te agradare", f: "agrad- + -are → agradar (to please), future subjunctive, it, with 'te' (to you): 'whatever way may please you'. The future subjunctive of -ar verbs: -are, -ares, -are, -áremos, -areis, -aren. Modern 'te agrade'."}
          - {w: "vamos", f: "ir (to go), present, we, used as 'let's go'. voy, vas, va, vamos, vais, van."}
          - {w: "venga, saltee", f: "veng- + -a → venir (to come) and salte- + -e → saltear (to waylay), present subjunctive, it (night), with 'nos' (us) on the second. Subjunctive after 'antes que'. venir: venga, vengas, venga, vengamos, vengáis, vengan; -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "este", f: "'this', masculine to match 'despoblado'."}
