      - es: "porque, apenas puse mano a mi tizona, cuando me santiguaron los hombros con sus pinos, de manera que me quitaron la vista de los ojos y la fuerza de los pies, dando conmigo adonde ahora yago, y adonde no me da pena alguna el pensar si fue afrenta o no lo de los estacazos, como me la da el dolor de los golpes, que me han de quedar tan impresos en la memoria como en las espaldas."
        literal: "because, scarcely I-put hand to my tizona, when to-me they-crossed the shoulders with their pines, in manner that from-me they-took the sight of the eyes and the strength of the feet, giving with-me where now I-lie, and where not to-me gives pain any the thinking if it-was affront or not the [matter] of the stake-blows, as to-me it gives the pain of the blows, which to-me have to remain as impressed in the memory as on the shoulders."
        ormsby: "“for hardly had I laid hand on my Tizona when they signed the cross on my shoulders with their sticks in such style that they took the sight out of my eyes and the strength out of my feet, stretching me where I now lie, and where thinking of whether all those stake-strokes were an indignity or not gives me no uneasiness, which the pain of the blows does, for they will remain as deeply impressed on my memory as on my shoulders.”"
        ormsby_note: "Tizon was the name of one of the Cid's two famous swords; the word was altered into Tizona to suit the trochaic rhythm of the ballads. It means simply \"brand.\""
