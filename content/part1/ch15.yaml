  - sentences:
      - es: "— Pues, a tenerla yo aquí, desgraciado yo, ¿qué nos faltaba? —respondió don Quijote—."
        literal: "— Well, at having-it I here, unlucky I, what to-us would-be-lacking? —answered Don Quijote—."
        ormsby: "“If I only had it here, wretch that I am, what more should we want?” said Don Quixote;"
        vocab:
          - {w: "pues", d: "well, why (an interjection opening a reply)"}
          - {w: "a tenerla yo aquí", d: "if I had it here; 'a' + infinitive = if (a condition)"}
          - {w: "desgraciado yo", d: "wretch that I am, unlucky me"}
          - {w: "faltar", d: "to be lacking, be missing; '¿qué nos faltaba?' = what would we lack?"}
        diagram:
          - s: "qué nos faltaba?"
            r: "main verb: what would we lack?"
            under:
              - {s: "a tenerla yo aquí", r: "condition: if I had it here"}
              - {s: "desgraciado yo", r: "exclamation: wretch that I am"}
          - {s: "respondió don Quijote", r: "narrator's tag"}
        forms:
          - {w: "a tenerla", f: "a + tener (to have) + la (it): 'a' with an infinitive states a condition, 'if I had it'. The subject 'yo' follows the infinitive."}
          - {w: "desgraciado", f: "desgraciad- + -o → desgraciado (unlucky), masculine to match 'yo' (Don Quijote)."}
          - {w: "nos faltaba", f: "falt- + -aba → faltar (to be lacking), imperfect, it, with 'nos' (to us). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. The imperfect stands in for a conditional ('would be lacking'), a common colloquial use."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
      - es: "Mas yo te juro, Sancho Panza, a fe de caballero andante, que antes que pasen dos días, si la fortuna no ordena otra cosa, la tengo de tener en mi poder, o mal me han de andar las manos."
        literal: "But I to-you swear, Sancho Panza, on faith of knight errant, that before that pass two days, if [the] fortune not orders other thing, it I-have to have in my power, or badly to-me have to go the hands."
        ormsby: "“but I swear to thee, Sancho Panza, on the faith of a knight-errant, ere two days are over, unless fortune orders otherwise, I mean to have it in my possession, or my hand will have lost its cunning.”"
        vocab:
          - {w: "mas", d: "but (literary, no accent)"}
          - {w: "jurar", d: "to swear"}
          - {w: "a fe de", d: "on the faith of, on my word as a"}
          - {w: "caballero andante", d: "knight-errant"}
          - {w: "antes que", d: "= antes de que, before"}
          - {w: "ordenar otra cosa", d: "to order otherwise"}
          - {w: "tener de", d: "= tener que, to have to; the old form"}
          - {w: "en mi poder", d: "in my possession"}
          - {w: "mal me han de andar las manos", d: "my hands will have to serve me ill, i.e. unless I lose my skill; a set phrase"}
        diagram:
          - s: "yo te juro"
            r: "main verb: I swear to you"
            under:
              - {s: "Sancho Panza", r: "addressed to Sancho"}
              - {s: "a fe de caballero andante", r: "on what: on my word as a knight-errant"}
              - s: "que"
                r: "what I swear:"
                under:
                  - {s: "antes que pasen dos días", r: "when: before two days pass"}
                  - {s: "si la fortuna no ordena otra cosa", r: "condition: unless fortune orders otherwise"}
                  - {s: "la tengo de tener en mi poder", r: "the oath: I am to have it in my possession"}
                  - {s: "o mal me han de andar las manos", r: "or else: or my hands will have failed me"}
        forms:
          - {w: "te juro", f: "jur- + -o → jurar (to swear), present, I, with 'te' (to you). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "pasen", f: "pas- + -en → pasar (to pass), present subjunctive, they (the days). Subjunctive after 'antes que' for a time not yet reached. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "ordena", f: "orden- + -a → ordenar (to order), present, it (fortune). Same -ar present; the indicative after 'si' states an open condition."}
          - {w: "la tengo de tener", f: "teng- + -o → tener (to have), present, I, + de + tener: 'tener de' + infinitive is the old form of 'tener que', to have to; 'la' (it, the potion) is the object of the second tener. tener's present: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "me han de andar", f: "haber (to have), present, they, + de + andar (to go): 'haber de' = must, are bound to; 'me' is for me. haber in the present: he, has, ha, hemos, habéis, han. The subject 'las manos' follows."}
