          - {w: "le avino", f: "avin- + -o → avenir (to befall), preterite, it, with 'le' (to him, doubled by 'a don Quijote'). Conjugated like venir: avine, aviniste, avino, avinimos, avinisteis, avinieron."}
          - {w: "le valiese", f: "val- + -iese → valer (to avail), imperfect subjunctive (-se form), it, with 'le' (him). Subjunctive after 'sin que'. The -se form of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen. The subject is two things ('destreza y buen ánimo') but the verb is singular, as Cervantes allows."}
