      - es: "Mas yo me tengo la culpa de todo, que no había de poner mano a la espada contra hombres que no fuesen armados caballeros como yo;"
        literal: "But I to-myself have the blame of all, for not I-had to put hand to the sword against men who not were dubbed knights like I;"
