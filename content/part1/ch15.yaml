          - {w: "me santiguaron", f: "santigu- + -aron → santiguar (to cross), preterite, they, with 'me' (on me). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "sus", f: "'their', plural to match 'pinos'."}
          - {w: "me quitaron", f: "quit- + -aron → quitar (to take away), preterite, they, with 'me' (from me). Same -ar preterite."}
          - {w: "dando conmigo", f: "dando, the gerund of dar (to give), + conmigo (with me): 'dar con alguien' = to knock someone down."}
          - {w: "yago", f: "yag- + -o → yacer (to lie), present, I. An old I-form (also 'yazgo', 'yazco'): yago, yaces, yace, yacemos, yacéis, yacen."}
          - {w: "me da", f: "d- + -a → dar (to give), present, it, with 'me' (to me). doy, das, da, damos, dais, dan."}
          - {w: "alguna", f: "algun- + -a → alguno, feminine to match 'pena'; after the noun with 'no' it means 'any at all'."}
          - {w: "el pensar", f: "the infinitive pensar (to think) with the article, used as a noun: 'the thinking'."}
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, it. ser's preterite is irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "me la da", f: "da (dar, present, it) with 'me' (to me) and 'la' (it, standing for 'pena'): 'as the pain gives it to me'."}
          - {w: "me han de quedar", f: "haber (to have), present, they, + de + quedar (to remain): 'haber de' = will, are bound to; 'me' = on me. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "impresos", f: "the irregular participle of imprimir (to print), masculine plural to match 'golpes'."}
          - {w: "tan ... como", f: "'as ... as': the comparison of equals."}
        note: "Sancho mocks his master's legal distinction from below: what hurts is the blows, not the theory of honor. 'Santiguar' (to make the sign of the cross) is a common comic word for a beating."
  - sentences:
      - es: "— Con todo eso, te hago saber, hermano Panza —replicó don Quijote—, que no hay memoria a quien el tiempo no acabe, ni dolor que muerte no le consuma."
        literal: "— With all that, to-you I-make know, brother Panza —replied Don Quijote—, that not there-is memory to which the time not may-end, nor pain that death not it may-consume."
        ormsby: "“For all that let me tell thee, brother Panza,” said Don Quixote, “that there is no recollection which time does not put an end to, and no pain which death does not remove.”"
        vocab:
          - {w: "con todo eso", d: "for all that, nevertheless"}
          - {w: "hacer saber", d: "to let know, inform"}
          - {w: "acabar", d: "to end, finish off"}
          - {w: "consumir", d: "to consume, destroy, wear away"}
        diagram:
          - s: "te hago saber"
            r: "main verb: I let you know"
            under:
              - {s: "Con todo eso", r: "concession: for all that"}
              - {s: "hermano Panza", r: "addressed to Sancho"}
              - {s: "replicó don Quijote", r: "narrator's tag"}
              - s: "que no hay memoria"
                r: "what I tell you, 1: that there is no memory"
                under:
                  - {s: "a quien el tiempo no acabe", r: "describes 'memoria': that time does not end"}
              - s: "ni dolor"
                r: "what I tell you, 2: nor pain"
                under:
                  - {s: "que muerte no le consuma", r: "describes 'dolor': that death does not consume"}
        forms:
          - {w: "hago", f: "hag- + -o → hacer (to make), present, I. hago, haces, hace, hacemos, hacéis, hacen. 'hacer saber' = to let know."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "hay", f: "haber used alone, present: 'there is'."}
          - {w: "a quien", f: "'quien' used for a thing (memory), as old Spanish allowed; modern Spanish says 'a la que'. The 'a' marks the object of 'acabe'."}
          - {w: "acabe", f: "acab- + -e → acabar (to end), present subjunctive, it (time). Subjunctive because the clause describes something that does not exist ('no hay ... que'). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "le consuma", f: "consum- + -a → consumir (to consume), present subjunctive, it (death), with 'le' repeating 'dolor'. Same reason for the subjunctive. The present subjunctive of -er and -ir verbs: -a, -as, -a, -amos, -áis, -an."}
        note: "A sententious commonplace, Ovidian in tone: time cures memory and death ends pain. Sancho's reply turns it upside down."
  - sentences:
      - es: "— Pues, ¿qué mayor desdicha puede ser —replicó Panza— de aquella que aguarda al tiempo que la consuma y a la muerte que la acabe?"
        literal: "— Well, what greater misfortune can be —replied Panza— than that which waits for-the time that it may-consume and for the death that it may-end?"
        ormsby: "“And what greater misfortune can there be,” replied Panza, “than the one that waits for time to put an end to it and death to remove it?"
        vocab:
          - {w: "desdicha", d: "misfortune"}
          - {w: "mayor ... de", d: "greater ... than; 'de' here where modern Spanish uses 'que'"}
          - {w: "aguardar", d: "to wait for"}
        diagram:
          - s: "qué mayor desdicha puede ser"
            r: "main verb: what greater misfortune can there be"
            under:
              - {s: "replicó Panza", r: "narrator's tag"}
              - s: "de aquella"
                r: "than what: than that one"
                under:
                  - s: "que aguarda al tiempo que la consuma y a la muerte que la acabe?"
                    r: "describes 'aquella': that waits for time to consume it and death to end it"
        forms:
          - {w: "mayor", f: "the comparative of grande: 'greater'; one form for both genders."}
          - {w: "puede", f: "pued- + -e → poder (to be able), present, it. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "aquella", f: "'that one', feminine, standing for 'desdicha'."}
          - {w: "aguarda", f: "aguard- + -a → aguardar (to wait for), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "consuma, acabe", f: "consum- + -a → consumir (to consume) and acab- + -e → acabar (to end), present subjunctive, it, each with 'la' (it, the misfortune). Subjunctive because they are what is waited for. -ir: -a, -as, -a, -amos, -áis, -an; -ar: -e, -es, -e, -emos, -éis, -en."}
      - es: "Si esta nuestra desgracia fuera de aquellas que con un par de bizmas se curan, aun no tan malo; pero voy viendo que no han de bastar todos los emplastos de un hospital para ponerlas en buen término siquiera."
        literal: "If this our misfortune were of those that with a pair of poultices are-cured, still not so bad; but I-go seeing that not have to suffice all the plasters of a hospital for putting-them in good condition even."
        ormsby: "If our mishap were one of those that are cured with a couple of plasters, it would not be so bad; but I am beginning to think that all the plasters in a hospital almost won’t be enough to put us right.”"
        vocab:
          - {w: "esta nuestra desgracia", d: "this misfortune of ours; demonstrative and possessive stacked"}
          - {w: "bizma", d: "poultice, plaster"}
          - {w: "aun no tan malo", d: "it would still not be so bad"}
          - {w: "ir viendo", d: "to begin to see, come to see"}
          - {w: "bastar", d: "to be enough, suffice"}
          - {w: "emplasto", d: "plaster, salve-dressing"}
          - {w: "poner en buen término", d: "to put right, set in good order"}
          - {w: "siquiera", d: "even, at least"}
        diagram:
          - s: "aun no tan malo"
            r: "main clause 1, verbless: it would still not be so bad"
            under:
              - s: "Si esta nuestra desgracia fuera de aquellas"
                r: "condition: if this misfortune of ours were one of those"
                under:
                  - {s: "que con un par de bizmas se curan", r: "describes 'aquellas': that are cured with a couple of poultices"}
          - s: "pero voy viendo"
            r: "main verb 2: but I am coming to see"
            under:
              - s: "que no han de bastar todos los emplastos de un hospital"
                r: "what I see: that all the plasters of a hospital will not suffice"
                under:
                  - {s: "para ponerlas en buen término siquiera", r: "for what: even to put them right"}
        forms:
          - {w: "esta nuestra", f: "esta (this) + nuestra (our), both feminine to match 'desgracia': demonstrative and possessive stacked before the noun, as old Spanish allowed."}
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), it. Subjunctive after 'si' for an unreal condition. ser's -ra forms: fuera, fueras, fuera, fuéramos, fuerais, fueran."}
          - {w: "se curan", f: "cur- + -an → curar (to cure), present, they, with 'se' as a passive: 'are cured'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "voy viendo", f: "voy (ir, present, I: voy, vas, va, vamos, vais, van) + viendo, the gerund of ver (to see): 'ir' + gerund = to be gradually doing."}
          - {w: "han de bastar", f: "haber (to have), present, they, + de + bastar (to suffice): 'will (not) suffice'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "ponerlas", f: "poner (to put) + las (them): 'las' refers loosely to 'desgracias' or to the wounds; the antecedent is vague."}
          - {w: "buen", f: "bueno (good) clipped before a masculine singular noun ('término')."}
  - sentences:
      - es: "— Déjate deso y saca fuerzas de flaqueza, Sancho —respondió don Quijote—, que así haré yo, y veamos cómo está Rocinante; que, a lo que me parece, no le ha cabido al pobre la menor parte desta desgracia."
        literal: "— Leave-yourself of-that and draw strengths from weakness, Sancho —answered Don Quijote—, for so will-do I, and let-us-see how is Rocinante; for, to what to-me it-seems, not to-him has fallen to-the poor [one] the least part of-this misfortune."
        ormsby: "“No more of that: pluck strength out of weakness, Sancho, as I mean to do,” returned Don Quixote, “and let us see how Rocinante is, for it seems to me that not the least share of this mishap has fallen to the lot of the poor beast.”"
        vocab:
          - {w: "dejarse de", d: "to leave off, stop (talking about)"}
          - {w: "deso", d: "= de eso, of that"}
          - {w: "sacar fuerzas de flaqueza", d: "to make an effort in spite of weakness, pluck up strength; a proverb"}
          - {w: "caberle a uno", d: "to fall to one's lot, be one's share"}
          - {w: "la menor parte", d: "the smallest share"}
          - {w: "desta", d: "= de esta, of this"}
        diagram:
          - s: "Déjate deso"
            r: "main verb 1: leave off that"
          - s: "y saca fuerzas de flaqueza"
            r: "main verb 2: and draw strength from weakness"
            under:
              - {s: "Sancho", r: "addressed to Sancho"}
              - {s: "respondió don Quijote", r: "narrator's tag"}
              - {s: "que así haré yo", r: "why: for I will do the same"}
          - s: "y veamos cómo está Rocinante"
            r: "main verb 3: and let us see how Rocinante is"
            under:
              - {s: "que, a lo que me parece, no le ha cabido al pobre la menor parte desta desgracia", r: "why: for, it seems to me, the poor beast has not had the least share of this mishap"}
        forms:
          - {w: "Déjate", f: "deja, the tú command of dejar (to leave), + te (yourself), with an accent added: 'leave off'. Pronouns always follow a positive command."}
          - {w: "deso, desta", f: "de + eso (of that), de + esta (of this): Cervantes fuses 'de' with the demonstratives."}
          - {w: "saca", f: "sac- + -a → sacar (to draw out), command, you (tú). The tú command of regular verbs is the same as the he-form of the present: saca, come, vive."}
          - {w: "haré", f: "har- + -é → hacer (to do), future, I. The future stem is shortened: haré, harás, hará, haremos, haréis, harán."}
          - {w: "veamos", f: "ve- + -amos → ver (to see), present subjunctive, we, used as 'let us': 'let's see'. ver's present subjunctive: vea, veas, vea, veamos, veáis, vean."}
          - {w: "está", f: "est- + -á → estar (to be), present, he. estoy, estás, está, estamos, estáis, están."}
          - {w: "me parece", f: "parec- + -e → parecer (to seem), present, it, with 'me' (to me). The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "le ha cabido", f: "ha, the present of haber (to have), + cabido, the participle of caber (to fall to one's share), with 'le' (to him, doubled by 'al pobre'). haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "menor", f: "the comparative of pequeño: 'smallest' with the article."}
  - sentences:
      - es: "— No hay de qué maravillarse deso —respondió Sancho—, siendo él tan buen caballero andante; de lo que yo me maravillo es de que mi jumento haya quedado libre y sin costas donde nosotros salimos sin costillas."
        literal: "— Not there-is of what to-marvel-oneself of-that —answered Sancho—, being he so good knight errant; of that which I myself marvel is of that my donkey has remained free and without costs where we came-out without ribs."
        ormsby: "“There is nothing wonderful in that,” replied Sancho, “since he is a knight-errant too; what I wonder at is that my beast should have come off scot-free where we come out scotched.”"
        ormsby_note: "In this characteristic comment of Sancho's, Hartzenbusch corrects caballero andante (\"knight-errant\") into caballeria andante (\"horse-errant\") (entirely overlooking the también, \"too\"), and with profound gravity reminds us that Rocinante is a horse. Mr. J. P. Collier's \"old corrector\" in the 1632 folio Shakespeare could hardly do worse than this. The play upon the words sin costas and sin costillas cannot be rendered literally; sin costillas (\"without ribs\") means also in popular parlance bankrupt, \"cleaned out.\""
        vocab:
          - {w: "no hay de qué", d: "there is no reason to"}
          - {w: "maravillarse de", d: "to marvel at, be surprised at"}
          - {w: "sin costas", d: "without costs, scot-free (a legal phrase: without paying the costs of the case)"}
          - {w: "sin costillas", d: "without ribs; also slang for 'broke, cleaned out'; a pun on 'sin costas'"}
        diagram:
          - s: "No hay de qué maravillarse deso"
            r: "main verb 1: there is no reason to wonder at that"
            under:
              - {s: "respondió Sancho", r: "narrator's tag"}
              - {s: "siendo él tan buen caballero andante", r: "why: he being such a good knight-errant"}
          - s: "es"
            r: "main verb 2: is"
            under:
              - {s: "de lo que yo me maravillo", r: "subject: what I wonder at"}
              - s: "de que mi jumento haya quedado libre y sin costas"
                r: "what it is: that my donkey has come off free and scot-free"
                under:
                  - {s: "donde nosotros salimos sin costillas", r: "where: where we came out without ribs"}
        forms:
          - {w: "hay", f: "haber used alone, present: 'there is'."}
          - {w: "maravillarse, me maravillo", f: "maravillar (to amaze) + se: the infinitive 'to wonder'; maravill- + -o + me → maravillarse, present, I: 'I wonder'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "siendo", f: "gerund of ser (to be): 'being', with its subject 'él' after it."}
          - {w: "buen", f: "bueno (good) clipped before a masculine singular noun ('caballero')."}
          - {w: "haya quedado", f: "haya, the present subjunctive of haber (to have), + quedado, the participle of quedar (to remain): the perfect subjunctive 'has come off'. Subjunctive after an expression of wonder ('me maravillo de que'). haber's present subjunctive: haya, hayas, haya, hayamos, hayáis, hayan."}
          - {w: "salimos", f: "sal- + -imos → salir (to come out), preterite, we. The -ir preterite and present share the we-form: -í, -iste, -ió, -imos, -isteis, -ieron."}
        note: "Sancho's joke is that Rocinante, like his master, is a 'knight-errant' and so shares his master's beatings, while the donkey, a squire's beast, got off free. Ormsby's 'scot-free ... scotched' imitates the 'costas/costillas' pun."
  - sentences:
      - es: "— Siempre deja la ventura una puerta abierta en las desdichas, para dar remedio a ellas —dijo don Quijote—."
        literal: "— Always leaves [the] fortune a door open in the misfortunes, for giving remedy to them —said Don Quijote—."
        ormsby: "“Fortune always leaves a door open in adversity in order to bring relief to it,” said Don Quixote;"
        vocab:
          - {w: "ventura", d: "fortune, luck"}
          - {w: "desdicha", d: "misfortune"}
          - {w: "dar remedio a", d: "to remedy, bring relief to"}
        diagram:
          - s: "Siempre deja"
            r: "main verb: always leaves"
            under:
              - {s: "la ventura", r: "subject: fortune"}
              - {s: "una puerta abierta", r: "object: a door open"}
              - {s: "en las desdichas", r: "where: in misfortunes"}
              - {s: "para dar remedio a ellas", r: "why: to bring them relief"}
          - {s: "dijo don Quijote", r: "narrator's tag"}
        forms:
          - {w: "deja", f: "dej- + -a → dejar (to leave), present, it (fortune). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. The subject follows the verb."}
          - {w: "abierta", f: "the irregular participle of abrir (to open), feminine to match 'puerta'."}
          - {w: "ellas", f: "'them', feminine, standing for 'las desdichas'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
        note: "A proverb: 'when one door closes, another opens'. Don Quijote applies it to the donkey he must now ride."
      - es: "Dígolo porque esa bestezuela podrá suplir ahora la falta de Rocinante, llevándome a mí desde aquí a algún castillo donde sea curado de mis feridas."
        literal: "I-say-it because that little-beast will-be-able to-supply now the lack of Rocinante, carrying-me [to] me from here to some castle where I-may-be cured of my wounds."
        ormsby: "“I say so because this little beast may now supply the want of Rocinante, carrying me hence to some castle where I may be cured of my wounds."
        vocab:
          - {w: "bestezuela", d: "little beast; '-zuela' is a diminutive ending, here faintly contemptuous"}
          - {w: "suplir", d: "to make up for, supply, stand in for"}
          - {w: "falta", d: "lack, absence"}
          - {w: "curar", d: "to treat, tend (a wound), not only 'to cure'"}
          - {w: "ferida", d: "= herida, wound; the old form with f-"}
