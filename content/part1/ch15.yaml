        forms:
          - {w: "no me repliques", f: "replic- + -es → replicar (to answer back), present subjunctive, you (tú), used as a negative command, with 'me' (to me). The c becomes qu before e. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "te he dicho", f: "he, the present of haber (to have), + dicho, the irregular participle of decir (to say): 'I have told', with 'te' (you). haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "levántate", f: "levanta, the tú command of levantar (to raise), + te (yourself), with an accent added: 'get up'."}
          - {w: "pudieres", f: "pud- + -ieres → poder (to be able), future subjunctive, you: 'as best you may be able'. The future subjunctive of -er and -ir verbs: -iere, -ieres, -iere, -iéremos, -iereis, -ieren. Modern Spanish uses 'puedas'."}
