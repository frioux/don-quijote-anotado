          - {w: "la ciudad de las cien puertas", d: "the city of a hundred gates: Thebes in Egypt, which Don Quijote confuses with Greek Thebes, the city of Bacchus"}
          - {w: "a su placer", d: "at his ease, contentedly"}
          - {w: "ir caballero", d: "to ride, go mounted; 'caballero' also means 'gentleman'"}
        diagram:
          - s: "no tendré a deshonra la tal caballería"
            r: "main verb (after 'Y más, que'): I will not consider such a mount a dishonor"
            under:
              - s: "porque me acuerdo haber leído que"
