          - {w: "quisiera", f: "quis- + -iera → querer (to want), imperfect subjunctive (-ra form), I: 'I would like'. Built on the preterite quisieron: quisiera, quisieras, quisiera, quisiéramos, quisierais, quisieran. Sancho echoes his master's 'quisiera'."}
