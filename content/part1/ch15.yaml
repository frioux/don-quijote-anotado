          - {w: "la tal caballería", d: "such a mount; 'caballería' = mount, riding beast (also 'chivalry', a pun)"}
          - {w: "Sileno", d: "Silenus, in Greek myth the fat old drunken tutor of Bacchus (Dionysus), usually shown riding an ass"}
          - {w: "ayo", d: "tutor, governor (of a young noble)"}
          - {w: "pedagogo", d: "teacher, instructor"}
