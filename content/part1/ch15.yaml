        ormsby: "“In what has now befallen us,” answered Sancho, “I’d have been well pleased to have that good sense and that valour your worship speaks of, but I swear on the faith of a poor man I am more fit for plasters than for arguments."
        vocab:
          - {w: "en este que", d: "in this (event) that; 'este' picks up 'acontecimiento'"}
          - {w: "acontecer", d: "to happen, befall"}
          - {w: "a fe de pobre hombre", d: "on the faith of a poor man; Sancho's version of 'a fe de caballero andante'"}
          - {w: "estar para", d: "to be fit for, in a state for"}
          - {w: "bizma", d: "poultice, plaster (a medicated cloth laid on a bruise)"}
          - {w: "plática", d: "talk, discourse, conversation"}
