      - es: "Los gallegos, que se vieron maltratar de aquellos dos hombres solos, siendo ellos tantos, acudieron a sus estacas, y, cogiendo a los dos en medio, comenzaron a menudear sobre ellos con grande ahínco y vehemencia."
