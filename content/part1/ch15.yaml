part: 1
chapter: 15
title_es: "Capítulo XV. Donde se cuenta la desgraciada aventura que se topó don Quijote en topar con unos desalmados yangüeses"
title_en: "In which is related the unfortunate adventure that Don Quixote fell in with when he fell out with certain heartless Yanguesans"
paragraphs:
  - sentences:
      - es: "Cuenta el sabio Cide Hamete Benengeli que, así como don Quijote se despidió de sus huéspedes y de todos los que se hallaron al entierro del pastor Grisóstomo, él y su escudero se entraron por el mesmo bosque donde vieron que se había entrado la pastora Marcela;"
        literal: "Relates the sage Cide Hamete Benengeli that, as-soon as Don Quijote took-leave of his hosts and of all those who found-themselves at-the burial of-the shepherd Grisóstomo, he and his squire entered-themselves through the same wood where they-saw that had entered-herself the shepherdess Marcela;"
        ormsby: "The sage Cide Hamete Benengeli relates that as soon as Don Quixote took leave of his hosts and all who had been present at the burial of Chrysostom, he and his squire passed into the same wood which they had seen the shepherdess Marcela enter,"
        vocab:
          - {w: "contar", d: "to relate, tell (a story); 'cuenta' = relates"}
          - {w: "sabio", d: "sage, wise man; the romances of chivalry claimed to be written by a wise enchanter-historian, and Cide Hamete Benengeli is Cervantes' invented Moorish historian (introduced in chapter 9)"}
          - {w: "así como", d: "as soon as (here); elsewhere 'just as'"}
          - {w: "despedirse de", d: "to take leave of, say goodbye to"}
          - {w: "huésped", d: "host (here); the word also means 'guest', so context decides"}
          - {w: "hallarse", d: "to find oneself, be present"}
          - {w: "entierro", d: "burial, funeral"}
          - {w: "escudero", d: "squire, a knight's attendant"}
          - {w: "entrarse por", d: "to go into, make one's way into; the 'se' adds the idea of plunging in"}
          - {w: "mesmo", d: "= mismo, same; the old spelling, used throughout the book"}
          - {w: "pastor, pastora", d: "shepherd, shepherdess; Grisóstomo and Marcela are the figures of the pastoral story of chapters 12-14"}
        diagram:
          - s: "Cuenta"
            r: "main verb: relates"
            under:
              - {s: "el sabio Cide Hamete Benengeli", r: "subject: the sage historian"}
              - s: "que"
                r: "what he relates:"
                under:
                  - {s: "así como don Quijote se despidió de sus huéspedes y de todos los que se hallaron al entierro del pastor Grisóstomo", r: "when: as soon as Don Quijote had taken leave of his hosts and all who were at the burial"}
                  - s: "él y su escudero se entraron"
                    r: "the event: he and his squire went in"
                    under:
                      - s: "por el mesmo bosque"
                        r: "where: into the same wood"
                        under:
                          - {s: "donde vieron que se había entrado la pastora Marcela", r: "describes 'bosque': where they had seen Marcela go in"}
        forms:
          - {w: "Cuenta", f: "cuent- + -a → contar (to relate), present, he. The stem o becomes ue when stressed: cuento, cuentas, cuenta, contamos, contáis, cuentan. The historical present: the narrator's source 'relates' as if now."}
          - {w: "se despidió", f: "despid- + -ió → despedirse (to take leave), preterite, he, with 'se' (himself). The stem e turns to i in the he/they forms of the preterite: despedí, despediste, despidió, despedimos, despedisteis, despidieron."}
          - {w: "sus", f: "'his', plural to match 'huéspedes', not the owner."}
          - {w: "se hallaron", f: "hall- + -aron → hallarse (to be present), preterite, they, with 'se'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "al, del", f: "a + el, de + el: the two contractions modern Spanish still makes."}
          - {w: "se entraron", f: "entr- + -aron → entrarse (to go in), preterite, they, with 'se' (themselves). Same -ar preterite. The 'se' makes 'went off into' rather than plain 'entered'."}
          - {w: "mesmo", f: "= mismo (same), masculine to match 'bosque'."}
          - {w: "vieron", f: "v- + -ieron → ver (to see), preterite, they. ver's preterite: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "se había entrado", f: "había, the imperfect of haber (to have), + entrado, the participle of entrar (to enter): the pluperfect 'had gone in', with 'se' (herself). haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
        note: "The chapter opens by naming Cide Hamete Benengeli, the Moorish historian whose manuscript the narrator claims to be translating; this is only the second time he is named. Grisóstomo's burial and Marcela's speech are the matter of chapters 12-14."
      - es: "y, habiendo andado más de dos horas por él, buscándola por todas partes sin poder hallarla, vinieron a parar a un prado lleno de fresca yerba, junto del cual corría un arroyo apacible y fresco;"
        literal: "and, having walked more than two hours through it, seeking-her through all parts without being-able to-find-her, they-came to stop at a meadow full of fresh grass, next to which ran a brook peaceful and cool;"
        ormsby: "and after having wandered for more than two hours in all directions in search of her without finding her, they came to a halt in a glade covered with tender grass, beside which ran a pleasant cool stream"
        vocab:
          - {w: "andar", d: "to walk, go about, wander"}
          - {w: "por todas partes", d: "everywhere, in all directions"}
          - {w: "venir a parar a", d: "to end up at, fetch up at"}
          - {w: "prado", d: "meadow"}
          - {w: "yerba", d: "= hierba, grass; the old spelling"}
          - {w: "junto de", d: "= junto a, next to, beside"}
          - {w: "arroyo", d: "brook, stream"}
          - {w: "apacible", d: "peaceful, gentle, pleasant"}
          - {w: "fresco", d: "cool (of water, air); fresh (of grass)"}
        diagram:
          - s: "vinieron a parar"
            r: "main verb (after 'y'): they ended up"
            under:
              - {s: "habiendo andado más de dos horas por él", r: "when: after walking through it (the wood) for more than two hours"}
              - {s: "buscándola por todas partes sin poder hallarla", r: "how: looking for her everywhere without finding her"}
              - s: "a un prado lleno de fresca yerba"
                r: "where: at a meadow full of fresh grass"
                under:
                  - {s: "junto del cual corría un arroyo apacible y fresco", r: "describes 'prado': beside which ran a gentle, cool brook"}
        forms:
          - {w: "habiendo andado", f: "habiendo, the gerund of haber (to have), + andado, the participle of andar (to walk): 'having walked'."}
          - {w: "buscándola", f: "buscando, the gerund of buscar (to look for), + la (her, Marcela), with an accent added to keep the stress on 'can-'."}
          - {w: "hallarla", f: "hallar (to find) + la (her), the pronoun hung on the infinitive, which follows 'poder' (to be able)."}
          - {w: "vinieron", f: "vin- + -ieron → venir (to come), preterite, they. Irregular stem: vine, viniste, vino, vinimos, vinisteis, vinieron. 'venir a parar' = to end up."}
          - {w: "lleno", f: "llen- + -o → lleno (full), masculine to match 'prado'."}
          - {w: "fresca", f: "fresc- + -a → fresco (fresh), feminine to match 'yerba', placed before the noun for a poetic touch."}
          - {w: "del cual", f: "de + el cual (of which), the relative that follows 'junto'."}
          - {w: "corría", f: "corr- + -ía → correr (to run), imperfect, it (the brook). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
      - es: "tanto, que convidó y forzó a pasar allí las horas de la siesta, que rigurosamente comenzaba ya a entrar."
        literal: "so-much, that it-invited and forced to-pass there the hours of the siesta, which rigorously was-beginning already to come-in."
        ormsby: "that invited and compelled them to pass there the hours of the noontide heat, which by this time was beginning to come on oppressively."
        vocab:
          - {w: "tanto, que", d: "so much so that; picks up 'apacible y fresco': so pleasant that..."}
          - {w: "convidar", d: "to invite"}
          - {w: "forzar", d: "to force, compel"}
          - {w: "siesta", d: "the hot hours of early afternoon (from Latin 'sexta', the sixth hour), when travel stops; not just the nap"}
          - {w: "rigurosamente", d: "rigorously, harshly; here of the heat setting in with full force"}
          - {w: "entrar", d: "here of a time of day: to set in, come on"}
        diagram:
          - s: "convidó y forzó"
            r: "main verbs (after 'tanto, que', result of the brook's pleasantness): it invited and compelled"
            under:
              - s: "a pasar allí las horas de la siesta"
                r: "to do what: to spend the siesta hours there"
                under:
                  - {s: "que rigurosamente comenzaba ya a entrar", r: "describes 'siesta': which was already setting in with full force"}
        forms:
          - {w: "convidó y forzó", f: "convid- + -ó → convidar (to invite) and forz- + -ó → forzar (to force), preterite, it (the brook). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "pasar", f: "infinitive (to spend) after 'convidó y forzó a'."}
          - {w: "rigurosamente", f: "rigurosa (feminine of riguroso, rigorous) + -mente: the adverb, 'rigorously'. -mente always attaches to the feminine form."}
          - {w: "comenzaba", f: "comenz- + -aba → comenzar (to begin), imperfect, it (the siesta). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. 'comenzar a' + infinitive = to begin to."}
  - sentences:
      - es: "Apeáronse don Quijote y Sancho, y, dejando al jumento y a Rocinante a sus anchuras pacer de la mucha yerba que allí había, dieron saco a las alforjas, y, sin cerimonia alguna, en buena paz y compañía, amo y mozo comieron lo que en ellas hallaron."
        literal: "Dismounted-themselves Don Quijote and Sancho, and, leaving [to]-the donkey and [to] Rocinante at their ease to-graze of the much grass that there there-was, they-gave sack to the saddlebags, and, without ceremony any, in good peace and company, master and lad ate that which in them they-found."
        ormsby: "Don Quixote and Sancho dismounted, and turning Rocinante and the ass loose to feed on the grass that was there in abundance, they ransacked the alforjas, and without any ceremony very peacefully and sociably master and man made their repast on what they found in them."
        vocab:
          - {w: "apearse", d: "to dismount, get down (from a horse)"}
          - {w: "jumento", d: "donkey, ass"}
          - {w: "a sus anchuras", d: "at their ease, freely; 'anchura' = breadth"}
          - {w: "pacer", d: "to graze"}
          - {w: "dar saco a", d: "to sack, plunder; 'saco' = sack (of a city); a comic exaggeration for emptying the saddlebags"}
          - {w: "alforjas", d: "saddlebags; Ormsby keeps the Spanish word"}
          - {w: "cerimonia", d: "= ceremonia, ceremony, formality"}
          - {w: "en buena paz y compañía", d: "peaceably and sociably, as good companions"}
          - {w: "amo", d: "master (of a servant)"}
          - {w: "mozo", d: "lad, servant, man (as in 'master and man')"}
        diagram:
          - s: "Apeáronse"
            r: "main verb 1: they dismounted"
            under:
              - {s: "don Quijote y Sancho", r: "subject"}
          - s: "dieron saco a las alforjas"
            r: "main verb 2 (after 'y'): they plundered the saddlebags"
            under:
              - s: "dejando al jumento y a Rocinante a sus anchuras pacer"
                r: "when: leaving the donkey and Rocinante to graze at their ease"
                under:
                  - {s: "de la mucha yerba que allí había", r: "on what: on the plentiful grass there"}
          - s: "amo y mozo comieron"
            r: "main verb 3 (after 'y'): master and man ate"
            under:
              - {s: "sin cerimonia alguna, en buena paz y compañía", r: "how: without any ceremony, in peace and good company"}
              - {s: "lo que en ellas hallaron", r: "object: what they found in them (the saddlebags)"}
        forms:
          - {w: "Apeáronse", f: "ape- + -aron + se → apearse (to dismount), preterite, they, with 'se' (themselves) stuck on the end. Cervantes hangs pronouns on the end of a conjugated verb that opens its clause; modern Spanish says 'se apearon'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "dejando", f: "gerund of dejar (to leave, let): 'leaving', with the infinitive 'pacer' as what they were left to do."}
          - {w: "al jumento y a Rocinante", f: "the 'a' that marks a person as object is used for the two animals, as if they were persons; 'al' = a + el."}
          - {w: "sus", f: "'their', plural to match 'anchuras'."}
          - {w: "había", f: "hab- + -ía → haber, imperfect, used alone as 'there was' (the past of 'hay'). haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "dieron", f: "d- + -ieron → dar (to give), preterite, they. dar's preterite takes -er endings: di, diste, dio, dimos, disteis, dieron."}
          - {w: "alguna", f: "algun- + -a → alguno (any), feminine to match 'cerimonia'. After the noun and with 'sin' it means 'any at all'; modern Spanish prefers 'ninguna'."}
          - {w: "comieron, hallaron", f: "com- + -ieron → comer (to eat), preterite, they: the preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron. hall- + -aron → hallar (to find), preterite, they: same -ar preterite as above."}
          - {w: "ellas", f: "'them', feminine, standing for 'las alforjas'."}
  - sentences:
      - es: "No se había curado Sancho de echar sueltas a Rocinante, seguro de que le conocía por tan manso y tan poco rijoso que todas las yeguas de la dehesa de Córdoba no le hicieran tomar mal siniestro."
        literal: "Not himself had troubled Sancho of putting hobbles on Rocinante, sure of that him he-knew for so tame and so little lustful that all the mares of the pasture of Córdoba not him would-make take bad vice."
        ormsby: "Sancho had not thought it worth while to hobble Rocinante, feeling sure, from what he knew of his staidness and freedom from incontinence, that all the mares in the Cordova pastures would not lead him into an impropriety."
        vocab:
          - {w: "curarse de", d: "to trouble oneself about, bother to (not 'to cure')"}
          - {w: "echar sueltas", d: "to put on hobbles; 'suelta' is the rope tying a horse's forelegs so it can graze but not stray"}
          - {w: "conocer por", d: "to know (someone) to be, know as"}
          - {w: "manso", d: "tame, meek, gentle"}
          - {w: "rijoso", d: "lustful, randy (of a stallion); from 'rijo', sexual excitement"}
          - {w: "yegua", d: "mare"}
          - {w: "dehesa de Córdoba", d: "the royal stud pastures of Córdoba, famous for horses; so 'all the mares of Córdoba' = the most tempting mares in Spain"}
          - {w: "tomar mal siniestro", d: "to pick up a bad habit, a vice; 'siniestro' here = evil habit (of an animal), not 'sinister'"}
        diagram:
          - s: "No se había curado"
            r: "main verb: had not troubled himself"
            under:
              - {s: "Sancho", r: "subject"}
              - {s: "de echar sueltas a Rocinante", r: "about what: about hobbling Rocinante"}
              - s: "seguro de que le conocía por tan manso y tan poco rijoso"
                r: "why: sure that he knew him to be so tame and so little lustful"
                under:
                  - {s: "que todas las yeguas de la dehesa de Córdoba no le hicieran tomar mal siniestro", r: "result of 'tan': that all the mares of Córdoba would not lead him astray"}
        forms:
          - {w: "se había curado", f: "había, the imperfect of haber (to have), + curado, the participle of curar (curarse de = to trouble about): the pluperfect 'had not troubled himself'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "seguro", f: "segur- + -o → seguro (sure), masculine to match Sancho; 'seguro de que' = sure that."}
          - {w: "le conocía", f: "conoc- + -ía → conocer (to know), imperfect, he, with 'le' (him, Rocinante). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían. 'le' as direct object for a male is Castilian leísmo; strict grammar wants 'lo'."}
          - {w: "manso, rijoso", f: "masculine singular to match Rocinante; 'tan poco rijoso' = so little lustful."}
          - {w: "hicieran", f: "hic- + -ieran → hacer (to make), imperfect subjunctive (-ra form), they (the mares): 'would make'. Subjunctive because it is an imagined result ('tan ... que'). Built on the preterite hicieron: hiciera, hicieras, hiciera, hiciéramos, hicierais, hicieran. 'hacer' + infinitive = to make someone do."}
          - {w: "tomar", f: "infinitive (to take, pick up) after 'hicieran'."}
      - es: "Ordenó, pues, la suerte, y el diablo, que no todas veces duerme, que andaban por aquel valle paciendo una manada de hacas galicianas de unos arrieros gallegos, de los cuales es costumbre sestear con su recua en lugares y sitios de yerba y agua;"
        literal: "Ordained, then, [the] fortune, and the devil, who not all times sleeps, that were-going through that valley grazing a herd of ponies Galician of some carriers Galician, of whom it-is custom to-take-the-siesta with their pack-train in places and spots of grass and water;"
        ormsby: "Chance, however, and the devil, who is not always asleep, so ordained it that feeding in this valley there was a drove of Galician ponies belonging to certain Yanguesan carriers, whose way it is to take their midday rest with their teams in places and spots where grass and water abound;"
        ormsby_note: "I.e. of Yanguas, a district in the north of Old Castile, near Logroño."
        vocab:
          - {w: "ordenar", d: "to ordain, decree"}
          - {w: "pues", d: "then, so (a connective, not 'since')"}
          - {w: "suerte", d: "fortune, chance, luck"}
          - {w: "no todas veces", d: "= no todas las veces, not every time, not always"}
          - {w: "paciendo", d: "grazing; gerund of 'pacer'"}
          - {w: "manada", d: "herd, drove"}
          - {w: "haca", d: "= jaca, pony, small horse"}
          - {w: "galiciano", d: "= gallego, Galician, from Galicia in the northwest of Spain; Galician ponies were small and hardy"}
          - {w: "arriero", d: "muleteer, carrier; a man who transports goods on pack animals"}
          - {w: "sestear", d: "to take the siesta, rest in the midday heat"}
          - {w: "recua", d: "pack-train, string of pack animals"}
          - {w: "sitio", d: "spot, place"}
        diagram:
          - s: "Ordenó"
            r: "main verb: ordained"
            under:
              - {s: "la suerte", r: "subject 1: fortune"}
              - s: "y el diablo"
                r: "subject 2: and the devil"
                under:
                  - {s: "que no todas veces duerme", r: "describes 'diablo': who does not always sleep"}
              - s: "que andaban por aquel valle paciendo una manada de hacas galicianas"
                r: "what was ordained: that a drove of Galician ponies was grazing in that valley"
                under:
                  - s: "de unos arrieros gallegos"
                    r: "whose: belonging to some Galician carriers"
                    under:
                      - {s: "de los cuales es costumbre sestear con su recua en lugares y sitios de yerba y agua", r: "describes 'arrieros': whose custom it is to rest at midday with their animals where there is grass and water"}
        forms:
          - {w: "Ordenó", f: "orden- + -ó → ordenar (to ordain), preterite, it (fortune). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. The verb stands first and its two subjects follow."}
          - {w: "duerme", f: "duerm- + -e → dormir (to sleep), present, he (the devil). The stem o becomes ue when stressed: duermo, duermes, duerme, dormimos, dormís, duermen."}
          - {w: "andaban ... paciendo", f: "and- + -aban → andar (to go about), imperfect, they, + paciendo, the gerund of pacer (to graze): 'were going about grazing'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. The subject 'una manada' is singular but the verb is plural, agreeing with the many ponies."}
          - {w: "galicianas", f: "galician- + -as → galiciano (Galician), feminine plural to match 'hacas'."}
          - {w: "unos", f: "un- + -os → 'some', masculine plural to match 'arrieros'."}
          - {w: "de los cuales", f: "'of whom', the relative pronoun with its article, plural to match 'arrieros'."}
          - {w: "es costumbre", f: "ser (to be), present, it: 'it is the custom'. soy, eres, es, somos, sois, son."}
          - {w: "su", f: "'their', singular to match 'recua'."}
        note: "The text says the carriers are 'gallegos' (Galician) while the chapter title and chapter 10 call them 'yangüeses' (from Yanguas); the first edition is inconsistent, and Ormsby smooths it over by writing 'Yanguesan' throughout. Yanguesan carriers were a well-known trade in Cervantes' day, carrying goods across Castile with strings of pack animals."
      - es: "y aquel donde acertó a hallarse don Quijote era muy a propósito de los gallegos."
        literal: "and that-one where happened to find-himself Don Quijote was very to purpose of the Galicians."
        ormsby: "and that where Don Quixote chanced to be suited the Yanguesans’ purpose very well."
        vocab:
          - {w: "aquel", d: "that one (the place), standing for 'aquel lugar'"}
          - {w: "acertar a", d: "to happen to, chance to"}
          - {w: "muy a propósito de", d: "very suitable for, just right for"}
        diagram:
          - s: "era"
            r: "main verb (after 'y'): was"
            under:
              - s: "aquel"
                r: "subject: that place"
                under:
                  - {s: "donde acertó a hallarse don Quijote", r: "describes 'aquel': where Don Quijote happened to be"}
              - {s: "muy a propósito de los gallegos", r: "what it was: just what the Galicians wanted"}
        forms:
          - {w: "aquel", f: "'that one', masculine, standing alone for 'that place'. aquel/aquella/aquellos/aquellas point to something far from both speaker and listener."}
          - {w: "acertó", f: "acert- + -ó → acertar (to happen to), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. 'acertar a' + infinitive = to chance to."}
          - {w: "hallarse", f: "hallar (to find) + se (himself): 'to find himself, to be', the infinitive after 'acertó a'."}
          - {w: "era", f: "ser (to be), imperfect, it. ser's imperfect is irregular: era, eras, era, éramos, erais, eran."}
      - es: "Sucedió, pues, que a Rocinante le vino en deseo de refocilarse con las señoras facas; y saliendo, así como las olió, de su natural paso y costumbre, sin pedir licencia a su dueño, tomó un trotico algo picadillo y se fue a comunicar su necesidad con ellas."
        literal: "It-happened, then, that to Rocinante to-him came in desire of refreshing-himself with the lady ponies; and leaving, as-soon as them he-smelled, from his natural pace and custom, without asking leave of his owner, he-took a little-trot somewhat brisk and went-off to communicate his need with them."
        ormsby: "It so happened, then, that Rocinante took a fancy to disport himself with their ladyships the ponies, and abandoning his usual gait and demeanour as he scented them, he, without asking leave of his master, got up a briskish little trot and hastened to make known his wishes to them;"
        vocab:
          - {w: "suceder", d: "to happen"}
          - {w: "venirle a uno en deseo de", d: "to take a fancy to, get the urge to"}
          - {w: "refocilarse", d: "to take one's pleasure, disport oneself; a mock-genteel word for what the horse wants"}
          - {w: "las señoras facas", d: "the lady ponies, 'their ladyships the ponies'; 'faca' = haca = jaca, pony; the narrator's mock courtesy"}
          - {w: "oler", d: "to smell; 'olió' = he smelled"}
          - {w: "paso", d: "pace, gait"}
          - {w: "pedir licencia", d: "to ask leave, ask permission"}
          - {w: "dueño", d: "owner, master"}
          - {w: "trotico", d: "little trot; '-ico' is a diminutive ending"}
          - {w: "picadillo", d: "a bit brisk, lively; diminutive of 'picado', pricked, spurred"}
          - {w: "comunicar su necesidad con", d: "to make his need known to; a prim euphemism"}
        diagram:
