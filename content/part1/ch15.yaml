          - {w: "fuesen", f: "fu- + -esen → ser (to be), imperfect subjunctive (-se form), they: 'who were not'. Subjunctive because the men are described by a quality they lack, a type rather than particular men. Built on the preterite fueron: fuese, fueses, fuese, fuésemos, fueseis, fuesen."}
