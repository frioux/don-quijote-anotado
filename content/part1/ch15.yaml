      - es: "Así que, Panza amigo, no me repliques más, sino, como ya te he dicho, levántate lo mejor que pudieres y ponme de la manera que más te agradare encima de tu jumento, y vamos de aquí antes que la noche venga y nos saltee en este despoblado."
        literal: "So that, Panza friend, not to-me reply more, but, as already to-you I-have said, get-yourself-up the best that you-may-be-able and put-me in the manner that most to-you may-please on-top of your donkey, and let-us-go from here before that the night come and us waylay in this wilderness."
        ormsby: "and so, friend Panza, say no more, but, as I told thee before, get up as well as thou canst and put me on top of thy beast in whatever fashion pleases thee best, and let us go hence ere night come on and surprise us in these wilds.”"
        vocab:
          - {w: "replicar", d: "to answer back, argue"}
          - {w: "lo mejor que pudieres", d: "as best you can"}
          - {w: "agradar", d: "to please"}
          - {w: "encima de", d: "on top of"}
          - {w: "saltear", d: "to waylay, ambush, take by surprise (as a highwayman does)"}
          - {w: "despoblado", d: "wilderness, uninhabited place"}
        diagram:
          - s: "no me repliques más"
            r: "main verb 1 (after 'Así que'): don't answer me back any more"
            under:
              - {s: "Panza amigo", r: "addressed to Sancho"}
          - s: "sino ... levántate lo mejor que pudieres"
            r: "main verb 2: but get up as best you can"
            under:
