          - {w: "su", f: "'his', one form for both genders: su natural paso, su dueño, su necesidad."}
          - {w: "tomó", f: "tom- + -ó → tomar (to take), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "trotico, picadillo", f: "trote (trot) + -ico and picado (spurred) + -illo: two diminutive endings, 'a little trot, a bit lively'. The diminutives make the horse's lust comically small and polite."}
          - {w: "se fue", f: "fu- + -e → irse (to go off), preterite, he, with 'se'. ir borrows ser's preterite: fui, fuiste, fue, fuimos, fuisteis, fueron. 'ir a' + infinitive = to go to do."}
      - es: "Mas ellas, que, a lo que pareció, debían de tener más gana de pacer que de ál, recibiéronle con las herraduras y con los dientes, de tal manera que, a poco espacio, se le rompieron las cinchas y quedó, sin silla, en pelota."
        literal: "But they, who, to what it-seemed, must-have of having more desire of grazing than of other-thing, received-him with the horseshoes and with the teeth, of such manner that, at little space, to-him broke the girths and he-remained, without saddle, in [the] bare-skin."
        ormsby: "they, however, it seemed, preferred their pasture to him, and received him with their heels and teeth to such effect that they soon broke his girths and left him naked without a saddle to cover him;"
        vocab:
          - {w: "mas", d: "but (literary, no accent); 'más' with the accent is 'more'"}
          - {w: "a lo que pareció", d: "as it seemed, apparently"}
          - {w: "deber de", d: "must (probably), expressing a guess, not an obligation"}
          - {w: "tener gana de", d: "to feel like, want to"}
          - {w: "ál", d: "anything else, something else; an archaic word (from Latin 'aliud'), already old in Cervantes' time"}
          - {w: "herradura", d: "horseshoe; 'con las herraduras' = with their hooves, with kicks"}
          - {w: "de tal manera que", d: "in such a way that, so that"}
          - {w: "a poco espacio", d: "in a short while, soon; 'espacio' here = span of time"}
          - {w: "cincha", d: "girth, the strap holding the saddle on"}
          - {w: "silla", d: "saddle (short for 'silla de montar'); also 'chair'"}
          - {w: "en pelota", d: "stark naked, stripped bare; here 'without his saddle'. Modern 'en pelotas'"}
        diagram:
          - s: "recibiéronle"
            r: "main verb: they received him"
            under:
              - s: "ellas"
                r: "subject: they (the mares)"
                under:
                  - {s: "que, a lo que pareció, debían de tener más gana de pacer que de ál", r: "describes 'ellas': who, it seemed, would rather graze than anything else"}
              - {s: "con las herraduras y con los dientes", r: "how: with hooves and teeth"}
              - s: "de tal manera que"
                r: "result: in such a way that"
                under:
                  - {s: "a poco espacio, se le rompieron las cinchas", r: "result 1: his girths soon broke"}
                  - {s: "y quedó, sin silla, en pelota", r: "result 2: and he was left bare, without a saddle"}
        forms:
          - {w: "pareció", f: "parec- + -ió → parecer (to seem), preterite, it. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "debían de tener", f: "deb- + -ían → deber (deber de = must, probably), imperfect, they, + the infinitive tener (to have): 'probably had'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "recibiéronle", f: "recib- + -ieron + le → recibir (to receive), preterite, they, with 'le' (him) stuck on the end; the accent keeps the stress on '-bié-'. Cervantes hangs pronouns on a conjugated verb that opens its clause; modern Spanish says 'le recibieron'. Same -er/-ir preterite: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "se le rompieron", f: "romp- + -ieron → romperse (to break), preterite, they (the girths), with 'se' (reflexive: broke by themselves) and 'le' (on him, to his loss). Same -er preterite."}
          - {w: "quedó", f: "qued- + -ó → quedar (to remain, be left), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
      - es: "Pero lo que él debió más de sentir fue que, viendo los arrieros la fuerza que a sus yeguas se les hacía, acudieron con estacas, y tantos palos le dieron que le derribaron malparado en el suelo."
        literal: "But that which he must-have more of felt was that, seeing the carriers the force that to their mares to-them was-being-done, they-came-running with stakes, and so-many blows him they-gave that him they-knocked-down badly-hurt on the ground."
        ormsby: "but what must have been worse to him was that the carriers, seeing the violence he was offering to their mares, came running up armed with stakes, and so belaboured him that they brought him sorely battered to the ground."
        ormsby_note: "Used by the carriers in loading their beasts to prop up the pack on one side while they are adjusting the balance on the other."
        vocab:
          - {w: "sentir", d: "to feel, mind, be hurt by"}
          - {w: "hacer fuerza a", d: "to do violence to, force; here of an attempted rape of the mares, said straight-faced"}
          - {w: "acudir", d: "to come running, hurry to the spot"}
          - {w: "estaca", d: "stake, cudgel; the carriers' loading poles"}
          - {w: "palo", d: "blow with a stick; 'dar palos' = to beat"}
          - {w: "derribar", d: "to knock down"}
          - {w: "malparado", d: "badly hurt, in a sorry state; 'mal' + 'parado' (left)"}
        diagram:
          - s: "fue que"
            r: "main verb: was that"
            under:
              - {s: "lo que él debió más de sentir", r: "subject: what he must have minded most"}
              - s: "acudieron con estacas"
                r: "what happened 1: they (the carriers) ran up with stakes"
                under:
                  - s: "viendo los arrieros la fuerza"
                    r: "when: the carriers seeing the violence"
                    under:
                      - {s: "que a sus yeguas se les hacía", r: "describes 'fuerza': that was being done to their mares"}
              - s: "y tantos palos le dieron"
                r: "what happened 2: and gave him so many blows"
                under:
                  - {s: "que le derribaron malparado en el suelo", r: "result of 'tantos': that they knocked him, badly hurt, to the ground"}
        forms:
          - {w: "debió más de sentir", f: "deb- + -ió → deber (deber de = must have, probably), preterite, he, + the infinitive sentir (to feel): 'must have felt most'. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron. 'más' is tucked between the two parts."}
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, it. ser's preterite is irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "viendo", f: "gerund of ver (to see): 'seeing'; its subject 'los arrieros' follows it."}
          - {w: "sus", f: "'their', plural to match 'yeguas'."}
          - {w: "se les hacía", f: "hac- + -ía → hacer (to do), imperfect, it (the violence), with 'se' (passive: was being done) and 'les' (to them, the mares; doubled by 'a sus yeguas'). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "acudieron, dieron, derribaron", f: "acud- + -ieron → acudir (to run up), preterite, they; d- + -ieron → dar (to give), preterite, they (di, diste, dio, dimos, disteis, dieron); derrib- + -aron → derribar (to knock down), preterite, they. The -ir preterite: -í, -iste, -ió, -imos, -isteis, -ieron; the -ar preterite: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "tantos", f: "tant- + -os → tanto (so many), masculine plural to match 'palos'; 'tantos ... que' = so many that."}
          - {w: "malparado", f: "mal + parado (the participle of parar, to leave in a state), masculine to match Rocinante: 'left in a bad way'."}
  - sentences:
      - es: "Ya en esto don Quijote y Sancho, que la paliza de Rocinante habían visto, llegaban ijadeando; y dijo don Quijote a Sancho:"
        literal: "Already in this Don Quijote and Sancho, who the beating of Rocinante had seen, were-arriving panting; and said Don Quijote to Sancho:"
        ormsby: "By this time Don Quixote and Sancho, who had witnessed the drubbing of Rocinante, came up panting, and said Don Quixote to Sancho:"
        vocab:
          - {w: "ya en esto", d: "by this time, at this point"}
          - {w: "paliza", d: "beating, thrashing"}
          - {w: "ijadear", d: "to pant; from 'ijada', the flank, which heaves"}
        diagram:
          - s: "llegaban"
            r: "main verb 1: were arriving"
            under:
              - {s: "Ya en esto", r: "when: by this time"}
              - s: "don Quijote y Sancho"
                r: "subject"
                under:
                  - {s: "que la paliza de Rocinante habían visto", r: "describes them: who had seen Rocinante's beating"}
              - {s: "ijadeando", r: "how: panting"}
          - s: "dijo"
            r: "main verb 2 (after 'y'): said"
            under:
              - {s: "don Quijote", r: "subject"}
              - {s: "a Sancho", r: "to whom"}
        forms:
          - {w: "habían visto", f: "habían, the imperfect of haber (to have), + visto, the irregular participle of ver (to see): the pluperfect 'had seen', they. haber in the imperfect: había, habías, había, habíamos, habíais, habían. The object 'la paliza' comes before the verb, Latin style."}
          - {w: "llegaban", f: "lleg- + -aban → llegar (to arrive), imperfect, they: 'were arriving'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "ijadeando", f: "gerund of ijadear (to pant): 'panting', how they arrived."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— A lo que yo veo, amigo Sancho, éstos no son caballeros, sino gente soez y de baja ralea."
        literal: "— To what I see, friend Sancho, these not are knights, but people base and of low breed."
        ormsby: "“So far as I can see, friend Sancho, these are not knights but base folk of low birth:"
        vocab:
          - {w: "a lo que yo veo", d: "as far as I can see"}
          - {w: "caballero", d: "knight; also 'gentleman' and 'rider', a triple meaning this chapter plays on"}
          - {w: "sino", d: "but rather (after a negative)"}
          - {w: "soez", d: "base, vile, low"}
          - {w: "ralea", d: "breed, kind, stock (contemptuous); 'de baja ralea' = low-born"}
        diagram:
          - s: "no son caballeros"
            r: "main verb: are not knights"
            under:
              - {s: "A lo que yo veo", r: "qualification: as far as I can see"}
              - {s: "amigo Sancho", r: "addressed to Sancho"}
              - {s: "éstos", r: "subject: these men"}
              - {s: "sino gente soez y de baja ralea", r: "but what instead: base, low-born folk"}
        forms:
          - {w: "veo", f: "ve- + -o → ver (to see), present, I. veo, ves, ve, vemos, veis, ven."}
          - {w: "éstos", f: "'these (men)', masculine plural, with the accent the old spelling gave the pronoun to tell it from the adjective 'estos'."}
          - {w: "son", f: "ser (to be), present, they. soy, eres, es, somos, sois, son."}
          - {w: "soez", f: "one form for both genders, agreeing with 'gente' (feminine singular, though it means a group of people)."}
          - {w: "baja", f: "baj- + -a → bajo (low), feminine to match 'ralea'."}
      - es: "Dígolo porque bien me puedes ayudar a tomar la debida venganza del agravio que delante de nuestros ojos se le ha hecho a Rocinante."
        literal: "I-say-it because well me you-can help to take the due vengeance of-the wrong that before of our eyes has-been done to-him to Rocinante."
        ormsby: "I mention it because thou canst lawfully aid me in taking due vengeance for the insult offered to Rocinante before our eyes.”"
        vocab:
          - {w: "bien", d: "here: rightly, lawfully, with good reason (a squire may fight commoners, not knights)"}
          - {w: "debido", d: "due, proper"}
          - {w: "venganza", d: "vengeance, revenge"}
          - {w: "agravio", d: "wrong, insult, injury to honor; a key word of the chapter"}
          - {w: "delante de", d: "in front of, before"}
        diagram:
          - s: "Dígolo"
            r: "main verb: I say it"
            under:
              - s: "porque bien me puedes ayudar"
                r: "why: because you can rightly help me"
                under:
                  - s: "a tomar la debida venganza"
                    r: "help to do what: to take due vengeance"
                    under:
                      - s: "del agravio"
                        r: "for what: for the wrong"
                        under:
                          - {s: "que delante de nuestros ojos se le ha hecho a Rocinante", r: "describes 'agravio': that was done to Rocinante before our eyes"}
        forms:
          - {w: "Dígolo", f: "dig- + -o + lo → decir (to say), present, I, with 'lo' (it) stuck on the end; the accent keeps the stress on 'Di-'. Cervantes hangs pronouns on a verb that opens its clause; modern Spanish says 'lo digo'. decir's present: digo, dices, dice, decimos, decís, dicen."}
          - {w: "me puedes ayudar", f: "pued- + -es → poder (to be able), present, you (tú), + the infinitive ayudar (to help), with 'me' (me) placed before the whole group. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden. 'ayudar a' + infinitive = to help to."}
          - {w: "debida", f: "debid- + -a → debido (due), the participle of deber used as an adjective, feminine to match 'venganza'."}
          - {w: "del", f: "de + el."}
          - {w: "nuestros", f: "nuestr- + -os → nuestro (our), masculine plural to match 'ojos'."}
          - {w: "se le ha hecho", f: "ha, the present of haber (to have), + hecho, the irregular participle of hacer (to do): the perfect 'has been done', with 'se' (passive) and 'le' (to him, doubled by 'a Rocinante'). haber in the present: he, has, ha, hemos, habéis, han."}
        note: "The laws of chivalry as Don Quijote understands them forbid a knight to fight men who are not knights, but a squire may. He is giving Sancho permission, as he already did in chapter 8 against the Biscayan's servants."
  - sentences:
      - es: "— ¿Qué diablos de venganza hemos de tomar —respondió Sancho—, si éstos son más de veinte y nosotros no más de dos, y aun, quizá, nosotros sino uno y medio?"
        literal: "— What devils of vengeance have we to take —answered Sancho—, if these are more than twenty and we not more than two, and even, perhaps, we but one and a-half?"
        ormsby: "“What the devil vengeance can we take,” answered Sancho, “if they are more than twenty, and we no more than two, or, indeed, perhaps not more than one and a half?”"
        vocab:
          - {w: "qué diablos de", d: "what the devil kind of"}
          - {w: "haber de", d: "to have to, be to; 'hemos de tomar' = are we to take"}
          - {w: "aun", d: "even (no accent); 'aún' with the accent is 'still'"}
          - {w: "quizá", d: "perhaps"}
          - {w: "sino", d: "here: only, no more than (= no más que); Sancho counts himself as half a man"}
        diagram:
          - s: "hemos de tomar"
            r: "main verb: are we to take"
            under:
              - {s: "Qué diablos de venganza", r: "object: what devil of a vengeance"}
              - {s: "respondió Sancho", r: "narrator's tag"}
              - s: "si éstos son más de veinte"
                r: "condition: if these are more than twenty"
                under:
                  - {s: "y nosotros no más de dos", r: "and we no more than two"}
                  - {s: "y aun, quizá, nosotros sino uno y medio", r: "and even, perhaps, only one and a half"}
        forms:
          - {w: "hemos de tomar", f: "haber (to have), present, we, + de + the infinitive tomar (to take): 'haber de' = to be to, have to. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "son", f: "ser (to be), present, they. soy, eres, es, somos, sois, son. The verb is left out for 'nosotros (somos)'."}
          - {w: "más de veinte", f: "'more than' before a number is 'más de', not 'más que'."}
          - {w: "medio", f: "'half', masculine to match the understood 'hombre' (man)."}
        note: "Sancho's 'one and a half' means that he counts himself as only half a fighter. Ormsby's rendering keeps the joke."
  - sentences:
      - es: "— Yo valgo por ciento —replicó don Quijote."
        literal: "— I am-worth for a-hundred —replied Don Quijote."
        ormsby: "“I count for a hundred,” replied Don Quixote,"
        vocab:
          - {w: "valer por", d: "to be worth as much as, count for"}
          - {w: "replicar", d: "to reply, retort"}
        diagram:
          - s: "valgo"
            r: "main verb: am worth"
            under:
              - {s: "Yo", r: "subject: I"}
              - {s: "por ciento", r: "how much: as much as a hundred"}
          - {s: "replicó don Quijote", r: "narrator's tag"}
        forms:
          - {w: "valgo", f: "valg- + -o → valer (to be worth), present, I. The I-form adds a g: valgo, vales, vale, valemos, valéis, valen."}
          - {w: "ciento", f: "the full form of 'cien' (a hundred), used when no noun follows."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
        note: "In the romances a single knight routinely scatters a hundred foes. The boast is answered at once by the stakes."
  - sentences:
      - es: "Y, sin hacer más discursos, echó mano a su espada y arremetió a los gallegos, y lo mesmo hizo Sancho Panza, incitado y movido del ejemplo de su amo."
        literal: "And, without making more speeches, he-put hand to his sword and charged at the Galicians, and the same did Sancho Panza, incited and moved by-the example of his master."
        ormsby: "and without more words he drew his sword and attacked the Yanguesans and excited and impelled by the example of his master, Sancho did the same;"
        vocab:
          - {w: "hacer discursos", d: "to make speeches, argue; 'sin hacer más discursos' = without further ado"}
          - {w: "echar mano a", d: "to lay hand on, grab, draw (a weapon)"}
          - {w: "arremeter a", d: "to charge at, attack"}
          - {w: "lo mesmo", d: "= lo mismo, the same"}
          - {w: "incitado", d: "incited, spurred on"}
          - {w: "movido de", d: "moved by; old Spanish marks the doer with 'de' where modern Spanish uses 'por'"}
        diagram:
          - s: "echó mano a su espada"
            r: "main verb 1: he (Don Quijote) laid hand on his sword"
            under:
              - {s: "sin hacer más discursos", r: "how: without more talk"}
          - {s: "y arremetió a los gallegos", r: "main verb 2: and charged at the Galicians"}
          - s: "y lo mesmo hizo"
            r: "main verb 3: and the same did"
            under:
              - s: "Sancho Panza"
                r: "subject"
                under:
                  - {s: "incitado y movido del ejemplo de su amo", r: "describes Sancho: spurred and moved by his master's example"}
        forms:
          - {w: "echó, arremetió", f: "ech- + -ó → echar (to put), preterite, he: the preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. arremet- + -ió → arremeter (to charge), preterite, he: the preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "su", f: "'his', one form for both genders: su espada, su amo."}
          - {w: "mesmo", f: "= mismo (same); 'lo mesmo' = the same thing."}
          - {w: "hizo", f: "hiz- + -o → hacer (to do), preterite, he. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron; the c becomes z before o."}
          - {w: "incitado y movido", f: "participles of incitar (to incite) and mover (to move), masculine to match Sancho, used as adjectives."}
          - {w: "del", f: "de + el; here 'de' marks the doer ('by the example'), as old Spanish allows."}
      - es: "Y, a las primeras, dio don Quijote una cuchillada a uno, que le abrió un sayo de cuero de que venía vestido, con gran parte de la espalda."
