          - {w: "cuchillada", d: "slash, cut with a blade; 'dar una cuchillada' = to deliver a slash"}
          - {w: "sayo", d: "loose tunic, smock, a working man's outer garment"}
          - {w: "cuero", d: "leather"}
          - {w: "venir vestido de", d: "to be dressed in, wearing"}
          - {w: "espalda", d: "back, shoulder; the upper back"}
        diagram:
          - s: "dio"
            r: "main verb: gave"
            under:
              - {s: "a las primeras", r: "when: at the first strokes"}
              - {s: "don Quijote", r: "subject"}
              - s: "una cuchillada"
                r: "object: a slash"
