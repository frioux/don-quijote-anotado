          - {w: "suceden", f: "suced- + -en → suceder (to happen), present, they. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "tienen", f: "tien- + -en → tener (to have), present, they. tengo, tienes, tiene, tenemos, tenéis, tienen."}
