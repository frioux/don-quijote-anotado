              - s: "que viniese a caer"
                r: "what it willed: that he should fall"
                under:
                  - s: "a los pies de Rocinante"
                    r: "where: at Rocinante's feet"
                    under:
                      - {s: "que aún no se había levantado", r: "describes Rocinante: who had still not got up"}
        forms:
          - {w: "quiso", f: "quis- + -o → querer (to want, will), preterite, it (fortune). Irregular stem: quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "viniese", f: "vin- + -iese → venir (to come), imperfect subjunctive (-se form), he. Subjunctive because it is what fortune willed ('quiso que'). Built on the preterite vinieron: viniese, vinieses, viniese, viniésemos, vinieseis, viniesen. 'venir a' + infinitive = to end up doing."}
          - {w: "se había levantado", f: "había, the imperfect of haber (to have), + levantado, the participle of levantar (to raise): the pluperfect 'had got up', with 'se' (himself). haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
      - es: "donde se echa de ver la furia con que machacan estacas puestas en manos rústicas y enojadas."
        literal: "where it lets-itself be-seen the fury with which pound stakes placed in hands rustic and angry."
        ormsby: "whereby it may be seen how furiously stakes can pound in angry boorish hands."
        ormsby_note: "An allusion probably to the story of Diego Pérez de Vargas, \"the pounder.\" (See Chapter VIII)"
        vocab:
          - {w: "echarse de ver", d: "to be plain, be evident; 'se echa de ver' = one can see"}
          - {w: "furia", d: "fury"}
          - {w: "machacar", d: "to pound, crush, hammer; the verb behind the nickname 'Machuca'"}
          - {w: "rústico", d: "rustic, boorish, of country people"}
          - {w: "enojado", d: "angry"}
        diagram:
          - s: "se echa de ver"
            r: "main verb (after 'donde', a comment on the whole scene): is made plain"
            under:
              - s: "la furia"
                r: "subject: the fury"
                under:
                  - s: "con que machacan estacas"
                    r: "describes 'furia': with which stakes pound"
                    under:
                      - {s: "puestas en manos rústicas y enojadas", r: "describes 'estacas': placed in angry rustic hands"}
        forms:
          - {w: "se echa de ver", f: "ech- + -a → echar (to throw), present, it, with 'se': 'echarse de ver' is an idiom, 'to be plain to see'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "machacan", f: "machac- + -an → machacar (to pound), present, they (the stakes). Same -ar present. The subject 'estacas' follows the verb."}
          - {w: "puestas", f: "irregular participle of poner (to put), feminine plural to match 'estacas': 'placed'."}
          - {w: "rústicas y enojadas", f: "rústic- + -as → rústico (rustic) and enojad- + -as → enojado (angry), feminine plural to match 'manos' (hand is feminine though it ends in -o)."}
        note: "Diego Pérez de Vargas, nicknamed Machuca ('the pounder'), tore a branch from an oak when his sword broke and pounded so many Moors with it that he won the nickname; Don Quijote told the story in chapter 8 when his own lance broke. The narrator now turns the pounding against him."
  - sentences:
      - es: "Viendo, pues, los gallegos el mal recado que habían hecho, con la mayor presteza que pudieron, cargaron su recua y siguieron su camino, dejando a los dos aventureros de mala traza y de peor talante."
        literal: "Seeing, then, the Galicians the bad business that they-had done, with the greatest haste that they-could, they-loaded their pack-train and followed their road, leaving [to] the two adventurers of bad appearance and of worse mood."
        ormsby: "Then, seeing the mischief they had done, the Yanguesans with all the haste they could loaded their team and pursued their journey, leaving the two adventurers a sorry sight and in sorrier mood."
        vocab:
          - {w: "mal recado", d: "mischief, a bad piece of work; 'recado' = errand, business"}
          - {w: "presteza", d: "haste, promptness"}
          - {w: "cargar", d: "to load (pack animals)"}
          - {w: "recua", d: "pack-train, string of pack animals"}
          - {w: "seguir su camino", d: "to go on one's way"}
          - {w: "aventurero", d: "adventurer; ironic for the two seekers of adventures"}
          - {w: "traza", d: "appearance, look; 'de mala traza' = in a sorry state"}
          - {w: "talante", d: "mood, humor, disposition"}
        diagram:
          - s: "cargaron su recua"
            r: "main verb 1: they loaded their animals"
            under:
              - s: "Viendo, pues, los gallegos el mal recado"
                r: "when: the Galicians seeing the mischief"
                under:
                  - {s: "que habían hecho", r: "describes 'recado': that they had done"}
              - {s: "con la mayor presteza que pudieron", r: "how: as fast as they could"}
          - s: "y siguieron su camino"
            r: "main verb 2: and went on their way"
            under:
              - {s: "dejando a los dos aventureros de mala traza y de peor talante", r: "how: leaving the two adventurers in a sorry state and a worse mood"}
        forms:
          - {w: "Viendo", f: "gerund of ver (to see): 'seeing'; its subject 'los gallegos' follows."}
          - {w: "habían hecho", f: "habían, the imperfect of haber (to have), + hecho, the irregular participle of hacer (to do): the pluperfect 'had done', they. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "mayor", f: "the comparative of grande: 'greatest' with the article ('la mayor presteza')."}
          - {w: "pudieron", f: "pud- + -ieron → poder (to be able), preterite, they. Irregular stem: pude, pudiste, pudo, pudimos, pudisteis, pudieron."}
          - {w: "cargaron", f: "carg- + -aron → cargar (to load), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "siguieron", f: "sigu- + -ieron → seguir (to follow), preterite, they. The stem e turns to i in the he/they forms: seguí, seguiste, siguió, seguimos, seguisteis, siguieron."}
          - {w: "dejando", f: "gerund of dejar (to leave): 'leaving'."}
          - {w: "peor", f: "the comparative of malo (bad): 'worse'; 'de mala traza y de peor talante' plays the plain adjective against its comparative."}
  - sentences:
      - es: "El primero que se resintió fue Sancho Panza; y, hallándose junto a su señor, con voz enferma y lastimada, dijo:"
        literal: "The first who came-to-himself was Sancho Panza; and, finding-himself next to his master, with voice sick and pained, he-said:"
        ormsby: "Sancho was the first to come to, and finding himself close to his master he called to him in a weak and doleful voice,"
        vocab:
          - {w: "resentirse", d: "here: to come to, come round, begin to feel again; usually 'to feel the effects of, resent'"}
          - {w: "junto a", d: "next to, beside"}
          - {w: "señor", d: "master, lord (Sancho's word for Don Quijote)"}
          - {w: "enfermo", d: "sick, weak"}
          - {w: "lastimado", d: "hurt, pained, pitiful"}
        diagram:
          - s: "fue"
            r: "main verb 1: was"
            under:
              - {s: "El primero que se resintió", r: "subject: the first to come round"}
              - {s: "Sancho Panza", r: "who it was"}
          - s: "dijo:"
            r: "main verb 2 (after 'y'): he said"
            under:
              - {s: "hallándose junto a su señor", r: "when: finding himself beside his master"}
              - {s: "con voz enferma y lastimada", r: "how: in a weak, pained voice"}
        forms:
          - {w: "se resintió", f: "resint- + -ió → resentirse (to come round), preterite, he, with 'se'. The stem e turns to i in the he/they forms of the preterite: resentí, resentiste, resintió, resentimos, resentisteis, resintieron."}
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, he. ser's preterite is irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "hallándose", f: "hallando, the gerund of hallar (to find), + se (himself), with an accent added to keep the stress on 'llan-'."}
          - {w: "enferma y lastimada", f: "enferm- + -a → enfermo (sick) and lastimad- + -a → lastimado (pained), feminine to match 'voz'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— ¡Señor don Quijote! ¡Ah, señor don Quijote!"
        literal: "— Sir Don Quijote! Ah, sir Don Quijote!"
        ormsby: "“Señor Don Quixote, ah, Señor Don Quixote!”"
        vocab:
          - {w: "señor", d: "sir, lord; a title before a name, which Ormsby keeps as 'Señor'"}
        diagram:
          - {s: "¡Señor don Quijote!", r: "a call, with no verb: Sancho calling his master"}
          - {s: "¡Ah, señor don Quijote!", r: "the call repeated"}
        forms:
          - {w: "Señor, señor", f: "the same title, capitalized the first time only because it opens the speech; 'don' is a title placed before a first name and is never capitalized in the middle of a sentence."}
  - sentences:
      - es: "— ¿Qué quieres, Sancho hermano? —respondió don Quijote con el mesmo tono afeminado y doliente que Sancho."
        literal: "— What do-you-want, Sancho brother? —answered Don Quijote with the same tone effeminate and aching that Sancho."
        ormsby: "“What wouldst thou, brother Sancho?” answered Don Quixote in the same feeble suffering tone as Sancho."
        vocab:
          - {w: "hermano", d: "brother; a friendly form of address, placed after the name here"}
          - {w: "mesmo", d: "= mismo, same"}
          - {w: "tono", d: "tone (of voice)"}
          - {w: "afeminado", d: "effeminate, feeble, womanish; of a voice, thin and weak"}
          - {w: "doliente", d: "aching, suffering, sorrowful"}
        diagram:
          - s: "quieres"
            r: "main verb 1: do you want"
            under:
              - {s: "Qué", r: "object: what"}
              - {s: "Sancho hermano", r: "addressed to Sancho"}
          - s: "respondió"
            r: "main verb 2 (narrator's tag): answered"
            under:
              - {s: "don Quijote", r: "subject"}
              - s: "con el mesmo tono afeminado y doliente"
                r: "how: in the same feeble, aching tone"
                under:
                  - {s: "que Sancho", r: "same as whom: as Sancho"}
        forms:
          - {w: "quieres", f: "quier- + -es → querer (to want), present, you (tú). The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "mesmo", f: "= mismo (same), masculine to match 'tono'; 'el mesmo ... que' = the same ... as."}
          - {w: "afeminado y doliente", f: "afeminad- + -o → afeminado (feeble), masculine to match 'tono'; doliente, the old present participle of doler (to ache), one form for both genders."}
  - sentences:
      - es: "— Querría, si fuese posible —respondió Sancho Panza—, que vuestra merced me diese dos tragos de aquella bebida del feo Blas, si es que la tiene vuestra merced ahí a mano."
        literal: "— I-would-want, if it-were possible —answered Sancho Panza—, that your grace to-me should-give two swallows of that drink of-the ugly Blas, if it-is that it has your grace there at hand."
        ormsby: "“I would like, if it were possible,” answered Sancho Panza, “your worship to give me a couple of sups of that potion of the fiery Blas, if it be that you have any to hand there;"
        ormsby_note: "Sancho's blunder in the name of Fierabras is droller in the original, as he says, del feo Blas, \"of the ugly Blas.\""
        vocab:
          - {w: "querría", d: "I would like; conditional of querer, a polite request"}
          - {w: "vuestra merced", d: "your grace, your worship; the polite 'you', which became modern 'usted'; Sancho always addresses his master so"}
          - {w: "trago", d: "swallow, gulp, sup"}
          - {w: "bebida", d: "drink, potion"}
          - {w: "el feo Blas", d: "'ugly Blas': Sancho's mangling of Fierabrás, the giant whose balm heals any wound, which Don Quijote described in chapter 10"}
          - {w: "si es que", d: "if indeed, if it is the case that"}
          - {w: "a mano", d: "at hand, handy"}
        diagram:
          - s: "Querría"
            r: "main verb: I would like"
            under:
              - {s: "si fuese posible", r: "condition: if it were possible"}
              - {s: "respondió Sancho Panza", r: "narrator's tag"}
              - s: "que vuestra merced me diese dos tragos"
                r: "what I would like: that your worship give me two sups"
                under:
                  - {s: "de aquella bebida del feo Blas", r: "of what: of that potion of ugly Blas"}
              - {s: "si es que la tiene vuestra merced ahí a mano", r: "condition: if you have it there at hand"}
        forms:
          - {w: "Querría", f: "querr- + -ía → querer (to want), conditional, I: 'I would like'. The conditional adds -ía endings to an irregular stem: querría, querrías, querría, querríamos, querríais, querrían. Not to be confused with 'quería' (imperfect, I wanted)."}
          - {w: "fuese", f: "fu- + -ese → ser (to be), imperfect subjunctive (-se form), it: 'if it were'. Built on the preterite fueron: fuese, fueses, fuese, fuésemos, fueseis, fuesen. Subjunctive after 'si' for an unlikely condition."}
          - {w: "me diese", f: "d- + -iese → dar (to give), imperfect subjunctive (-se form), he/you (vuestra merced), with 'me' (to me). Subjunctive because it is what I would like ('querría que'); imperfect to match 'querría'. dar's -se forms: diese, dieses, diese, diésemos, dieseis, diesen."}
          - {w: "aquella", f: "aquell- + -a → aquel (that), feminine to match 'bebida'."}
          - {w: "del", f: "de + el."}
          - {w: "la tiene", f: "tien- + -e → tener (to have), present, he/you (vuestra merced takes he-forms), with 'la' (it, the potion). The stem e becomes ie when stressed: tengo, tienes, tiene, tenemos, tenéis, tienen."}
        note: "The balm of Fierabrás was the subject of Don Quijote's promise in chapter 10: a potion that mends any wound, which he will try to brew in chapter 17. Sancho has already forgotten the name."
      - es: "Quizá será de provecho para los quebrantamientos de huesos como lo es para las feridas."
        literal: "Perhaps it-will-be of use for the breakings of bones as it is for the wounds."
        ormsby: "perhaps it will serve for broken bones as well as for wounds.”"
        vocab:
          - {w: "ser de provecho", d: "to be of use, do good"}
          - {w: "quebrantamiento", d: "breaking, shattering, bruising"}
          - {w: "ferida", d: "= herida, wound; the old spelling with f-, which Don Quijote uses in his chivalric manner"}
        diagram:
          - s: "será de provecho"
            r: "main verb: will be of use"
            under:
              - {s: "Quizá", r: "how likely: perhaps"}
              - {s: "para los quebrantamientos de huesos", r: "for what: for broken bones"}
              - {s: "como lo es para las feridas", r: "comparison: as it is for wounds"}
        forms:
          - {w: "será", f: "ser- + -á → ser (to be), future, it. The future adds its endings to the whole infinitive: seré, serás, será, seremos, seréis, serán."}
