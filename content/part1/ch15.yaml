  - sentences:
      - es: "— Verdad será que él debía de ir caballero, como vuestra merced dice — respondió Sancho—, pero hay grande diferencia del ir caballero al ir atravesado como costal de basura."
        literal: "— Truth it-will-be that he must-have of going rider, as your grace says — answered Sancho—, but there-is great difference from-the going rider to-the going laid-across like sack of rubbish."
        ormsby: "“It may be true that he went mounted as your worship says,” answered Sancho, “but there is a great difference between going mounted and going slung like a sack of manure.”"
        ormsby_note: "The grave drollery of Sancho's matter-of-fact reply is lost in translation, inasmuch as in Spanish \"to go mounted\" (ir caballero) implies also \"to go like a gentleman.\""
        vocab:
          - {w: "verdad será que", d: "it may well be true that (the future expresses supposition)"}
          - {w: "deber de", d: "must (probably)"}
          - {w: "ir caballero", d: "to go mounted, ride; also 'to go as a gentleman'"}
          - {w: "atravesado", d: "laid across, slung crosswise (over the saddle)"}
          - {w: "costal", d: "sack (a large one, for grain)"}
          - {w: "basura", d: "rubbish, dung"}
        diagram:
          - s: "Verdad será que"
            r: "main verb 1: it may be true that"
            under:
              - {s: "él debía de ir caballero", r: "what may be true: he went mounted"}
              - {s: "como vuestra merced dice", r: "as: as your worship says"}
              - {s: "respondió Sancho", r: "narrator's tag"}
          - s: "pero hay grande diferencia"
            r: "main verb 2: but there is a great difference"
            under:
              - {s: "del ir caballero al ir atravesado como costal de basura", r: "between what: between riding and being slung like a sack of rubbish"}
        forms:
          - {w: "será", f: "ser- + -á → ser (to be), future, it: here 'it may be', a future of supposition. seré, serás, será, seremos, seréis, serán."}
          - {w: "debía de ir", f: "deb- + -ía → deber (deber de = must, probably), imperfect, he, + the infinitive ir (to go): 'he probably went'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "dice", f: "dic- + -e → decir (to say), present, he/you (vuestra merced). digo, dices, dice, decimos, decís, dicen."}
          - {w: "hay", f: "haber used alone, present: 'there is'."}
          - {w: "grande", f: "not clipped to 'gran' before 'diferencia', as Cervantes often leaves it."}
          - {w: "del ir, al ir", f: "de + el ir and a + el ir: the infinitive with the article used as a noun, 'the going'. 'diferencia de ... a' = difference between ... and."}
          - {w: "atravesado", f: "the participle of atravesar (to lay across), masculine to match the rider."}
