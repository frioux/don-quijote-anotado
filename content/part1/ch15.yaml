        forms:
          - {w: "Dígolo", f: "dig- + -o + lo → decir (to say), present, I, with 'lo' (it) stuck on the end; the accent keeps the stress on 'Dí-'. Cervantes hangs pronouns on a verb that opens its clause; modern 'lo digo'. digo, dices, dice, decimos, decís, dicen."}
          - {w: "esa", f: "'that', feminine to match 'bestezuela'."}
          - {w: "podrá", f: "podr- + -á → poder (to be able), future, it. The future stem drops the e: podré, podrás, podrá, podremos, podréis, podrán."}
          - {w: "llevándome a mí", f: "llevando, the gerund of llevar (to carry), + me (me), with an accent added; 'a mí' doubles the 'me' for emphasis."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun ('castillo')."}
          - {w: "sea curado", f: "se- + -a → ser (to be), present subjunctive, I, + curado, the participle of curar (to treat): 'where I may be treated'. Subjunctive because the castle is not yet found. ser's present subjunctive: sea, seas, sea, seamos, seáis, sean."}
          - {w: "feridas", f: "= heridas (wounds): old Spanish kept the Latin f- that became a silent h-."}
      - es: "Y más, que no tendré a deshonra la tal caballería, porque me acuerdo haber leído que aquel buen viejo Sileno, ayo y pedagogo del alegre dios de la risa, cuando entró en la ciudad de las cien puertas iba, muy a su placer, caballero sobre un muy hermoso asno."
        literal: "And more, that not I-will-hold as dishonor the such mount, because myself I-remember to-have read that that good old-man Silenus, tutor and pedagogue of-the merry god of the laughter, when he-entered in the city of the hundred gates went, very at his pleasure, rider upon a very handsome ass."
        ormsby: "And moreover I shall not hold it any dishonour to be so mounted, for I remember having read how the good old Silenus, the tutor and instructor of the gay god of laughter, when he entered the city of the hundred gates, went very contentedly mounted on a handsome ass.”"
        ormsby_note: "Thebes; but that of the hundred gates was the Egyptian, not the Boeotian Thebes, which is the one here referred to."
