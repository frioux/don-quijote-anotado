  - sentences:
      - es: "— Eso es —dijo don Quijote— cuando no pueden más, o cuando están enamorados; y es tan verdad esto, que ha habido caballero que se ha estado sobre una peña, al sol y a la sombra, y a las inclemencias del cielo, dos años, sin que lo supiese su señora."
        literal: "— That is —said Don Quijote— when not they-can more, or when they-are in-love; and it-is so truth this, that there-has been knight who himself has stayed upon a rock, at-the sun and at the shade, and at the inclemencies of-the sky, two years, without that it knew his lady."
        ormsby: "“That is,” said Don Quixote, “when they cannot help it, or when they are in love; and so true is this that there have been knights who have remained two years on rocks, in sunshine and shade and all the inclemencies of heaven, without their ladies knowing anything of it;"
