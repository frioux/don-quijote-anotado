summary: |
  After leaving Grisóstomo's funeral, Don Quijote and Sancho look in vain for Marcela in the wood and stop in a cool meadow by a stream for the hot midday hours. They turn Rocinante and the donkey loose to graze and eat what is in the saddlebags.

  Rocinante, whom Sancho trusted too much to hobble, smells a drove of mares belonging to some carriers from Galicia (the title calls them Yanguesans) and trots off to court them. The mares answer with hooves and teeth and strip off his saddle, and the carriers beat him to the ground with their pack-stakes. Don Quijote decides that since they are not knights Sancho may help him avenge the insult; they attack more than twenty men, Don Quijote slashes one, and both are clubbed flat beside the fallen horse. The carriers load up and leave.

  Lying on the ground, the two talk. Sancho asks for the balm of 'ugly Blas'. Don Quijote blames the beating on his own breach of chivalry in fighting non-knights, and tells Sancho that from now on he must punish such rabble himself; Sancho replies that he is a man of peace and forgives all insults past, present and future. Don Quijote explains that a future island governor must be brave, cites the humiliations of Amadís and the Knight of the Sun, and argues from the law of the duel that a beating with tools that come to hand is no dishonor. Sancho answers that the blows hurt regardless.

  Sancho gets up with a hundred groans, saddles the donkey, lifts Rocinante, and loads his battered master across the donkey's back. Don Quijote consoles himself with Silenus, who rode an ass. They reach the highway and find an inn, which Don Quijote insists is a castle; still arguing, they ride in.
context: |
  The carriers and the road. 'Arrieros' carried goods across Spain on strings of mules and ponies and were a rough, well-known class of traveller; Yanguas, in the north of Old Castile, was famous for them, as Ormsby's note explains. The text calls them both 'yangüeses' (title) and 'gallegos' (Galicians), an inconsistency of the first edition that Ormsby irons out. Their weapons are the stakes they use to prop the load while balancing a pack. The meal 'sin cerimonia' and the hobbled or unhobbled horse are ordinary details of rural travel; the stud pastures of Córdoba were famous for Spain's best horses.

  The books parodied. Don Quijote measures every mishap against the romances of chivalry. He cites Amadís de Gaula flogged by the enchanter Arcaláus (Ormsby notes that no such flogging is in the Amadís), the Knight of the Sun given an ice-water enema in a dungeon, and Amadís's penance on the Peña Pobre under the name Beltenebros. The rule that a knight may not fight non-knights, and the fantasy that knights-errant become kings and give their squires islands, come from the same books. Sancho's 'tizona' borrows the name of the Cid's sword, as Ormsby notes, and the 'feo Blas' is his garbling of Fierabrás, whose balm Don Quijote promised in chapter 10. Silenus on his ass, entering a 'city of the hundred gates' that Ormsby points out is the wrong Thebes, is a piece of school mythology misapplied.

  The narrator's games. The chapter is told from Cide Hamete Benengeli's history, named in the first line. The narrator treats Rocinante's lust in mock-courtly language ('las señoras facas', 'comunicar su necesidad') and mocks his hero openly ('tal quedó de arrogante el pobre señor'). Ormsby points out that the sentence about Rocinante complaining is muddled, one of the places where Cervantes wrote carelessly.

  Honor and medicine. The long argument over whether a beating with sticks is an 'afrenta' rests on the real code of honor: being 'apaleado' (cudgelled) disgraced a gentleman, as stick-beating was the punishment of servants, while wounds from a sword did not. Duelling treatises discussed such distinctions in earnest. Sancho, a peasant, cares only about the pain, wants poultices ('bizmas', 'emplastos'), and declares a sweeping pardon of every insult in the manner of a legal formula. The 'melecina' of the Knight of the Sun is an enema, the standard remedy of the period.

  Names. Sancho calls the balm of Fierabrás 'del feo Blas' (of ugly Blas), which Ormsby renders 'the fiery Blas'. Beltenebros means roughly 'handsome-in-darkness', the hermit name of Amadís. Sancho's pun 'sin costas ... sin costillas' (scot-free ... without ribs, and also 'broke') is explained in Ormsby's note, along with the double sense of 'ir caballero', to ride and to go as a gentleman.

  Reading Cervantes' Spanish. The chapter is mostly dialogue and shows the ordinary archaisms: mesmo, agora, ansí, yerba, cerimonia, sospiros, coluna, docientos, eceptar, estiende, destraído, and the f- forms feridas and facas; the contractions della, dellos, desta, deso, déstos; pronouns hung on an opening verb (Apeáronse, recibiéronle, Dígolo, pudiérate); -rl- becoming -ll- in 'ofendellos'; 'tener de' for 'tener que'; the -ra subjunctive as a conditional (dijera, pasara, fueran); and the future subjunctive (acudieren, pudieres, agradare). Watch the false friends 'curarse de' (to bother about), 'puesto que' (although), 'ofender' (to attack), 'villano' (peasant) and 'novedad' (disturbance).
