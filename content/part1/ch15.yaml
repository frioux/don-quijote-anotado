  - sentences:
      - es: "— En este que ahora nos ha acontecido —respondió Sancho—, quisiera yo tener ese entendimiento y ese valor que vuestra merced dice; mas yo le juro, a fe de pobre hombre, que más estoy para bizmas que para pláticas."
