          - s: "y se fue a comunicar su necesidad con ellas"
            r: "main verb 3: and went off to make his need known to them"
        forms:
          - {w: "Sucedió", f: "suced- + -ió → suceder (to happen), preterite, it. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "le vino en deseo", f: "vin- + -o → venir (to come), preterite, it (the desire), with 'le' (to him, Rocinante): 'the desire came to him'. Irregular stem: vine, viniste, vino, vinimos, vinisteis, vinieron. 'a Rocinante le' doubles the object, as Spanish does with 'le'."}
