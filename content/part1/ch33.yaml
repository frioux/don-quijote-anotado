  - sentences:
      - es: "»—Así es la verdad —respondió Anselmo—, y con esa confianza te hago saber, amigo Lotario, que el deseo que me fatiga es pensar si Camila, mi esposa, es tan buena y tan perfeta como yo pienso;"
        literal: "»—So is the truth (answered Anselmo), and with that confidence to-you I-make know, friend Lotario, that the desire that me wearies is to-think whether Camila, my wife, is so good and so perfect as I think;"
        ormsby: "“That is the truth,” replied Anselmo, “and relying upon that I will tell thee, friend Lothario, that the desire which harasses me is that of knowing whether my wife Camilla is as good and as perfect as I think her to be;"
        vocab:
          - {w: "confianza", d: "trust, confidence"}
          - {w: "hacer saber", d: "to let know, inform"}
          - {w: "perfeto", d: "= perfecto, perfect"}
        diagram:
          - {s: "Así es la verdad", r: "main verb 1: that is the truth"}
          - {s: "respondió Anselmo", r: "speech tag: Anselmo answered"}
          - s: "y con esa confianza te hago saber, amigo Lotario"
            r: "main verb 2: and trusting in that I tell you, friend Lotario"
            under:
              - s: "que el deseo que me fatiga es pensar"
                r: "what I tell you: that the desire troubling me is to wonder"
                under:
                  - {s: "si Camila, mi esposa, es tan buena y tan perfeta como yo pienso", r: "what I wonder: whether Camila, my wife, is as good and perfect as I think"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "hago", f: "hag- + -o → hacer (to make), present, I. hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "fatiga", f: "fatig- + -a → fatigar (to trouble), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "perfeta", f: "= perfecta, feminine to match Camila; Cervantes drops the c of -ct-."}
          - {w: "pienso", f: "piens- + -o → pensar (to think), present, I. The stem e becomes ie when stressed: pienso, piensas, piensa, pensamos, pensáis, piensan."}
      - es: "y no puedo enterarme en esta verdad, si no es probándola de manera que la prueba manifieste los quilates de su bondad, como el fuego muestra los del oro."
        literal: "and not I-can inform-myself in this truth, if not it-is testing-her in manner that the proof may-show the carats of her goodness, as the fire shows those of-the gold."
        ormsby: "and I cannot satisfy myself of the truth on this point except by testing her in such a way that the trial may prove the purity of her virtue as the fire proves that of gold;"
