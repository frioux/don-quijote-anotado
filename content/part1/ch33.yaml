  - sentences:
      - es: "»Pero el provecho que las muchas virtudes de Camila hicieron, poniendo silencio en la lengua de Lotario, redundó más en daño de los dos, porque si la lengua callaba, el pensamiento discurría y tenía lugar de contemplar, parte por parte, todos los estremos de bondad y de hermosura que Camila tenía, bastantes a enamorar una estatua de mármol, no que un corazón de carne."
        literal: "»But the benefit that the many virtues of Camila did, putting silence on the tongue of Lotario, redounded more to harm of the two, because if the tongue was-silent, the thought roamed and had room to contemplate, part by part, all the extremes of goodness and of beauty that Camila had, sufficient to enamor a statue of marble, not that a heart of flesh."
        ormsby: "But the influence which the many virtues of Camilla exerted in imposing silence on Lothario’s tongue proved mischievous for both of them, for if his tongue was silent his thoughts were busy, and could dwell at leisure upon the perfections of Camilla’s goodness and beauty one by one, charms enough to warm with love a marble statue, not to say a heart of flesh."
        vocab:
          - {w: "provecho", d: "benefit, good"}
          - {w: "redundar en", d: "to result in, turn into"}
          - {w: "daño", d: "harm, damage"}
          - {w: "callar", d: "to be silent"}
          - {w: "discurrir", d: "to roam, run on; also to reason"}
          - {w: "parte por parte", d: "one by one, piece by piece"}
          - {w: "estremos", d: "= extremos, extremes; here perfections, the highest degree"}
          - {w: "bastante a", d: "enough to"}
          - {w: "enamorar", d: "to make (someone) fall in love"}
          - {w: "no que", d: "let alone, not to mention"}
        diagram:
          - s: "el provecho ... redundó más en daño de los dos"
            r: "main verb (after 'Pero'): the good ... turned rather to the harm of both"
            under:
              - s: "que las muchas virtudes de Camila hicieron"
                r: "describes 'provecho': that Camila's many virtues did"
