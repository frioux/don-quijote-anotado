  - sentences:
      - es: "»Sucedió, pues, que se pasaron muchos días que, sin decir Lotario palabra a Camila, respondía a Anselmo que la hablaba y jamás podía sacar della una pequeña muestra de venir en ninguna cosa que mala fuese, ni aun dar una señal de sombra de esperanza;"
        literal: "»It-happened, then, that themselves passed many days that, without saying Lotario [a] word to Camila, he-answered to Anselmo that her he-talked-to and never could draw from-her one small sign of coming into any thing that bad might-be, nor even give one signal of shadow of hope;"
        ormsby: "Thus, then, several days went by, and Lothario, without uttering a word to Camilla, reported to Anselmo that he had talked with her and that he had never been able to draw from her the slightest indication of consent to anything dishonourable, nor even a sign or shadow of hope;"
        vocab:
          - {w: "pasarse", d: "to go by (of time)"}
          - {w: "sacar de", d: "to get out of, draw from"}
          - {w: "della", d: "= de ella, from her"}
          - {w: "muestra", d: "sign, indication"}
          - {w: "venir en", d: "to agree to, consent to"}
          - {w: "sombra", d: "shadow; here 'the faintest trace'"}
        diagram:
          - s: "Sucedió, pues,"
            r: "main verb: it happened, then"
            under:
              - s: "que se pasaron muchos días"
                r: "what happened: that many days went by"
                under:
                  - s: "que, sin decir Lotario palabra a Camila, respondía a Anselmo"
                    r: "in which: without saying a word to Camila, Lotario kept answering Anselmo"
                    under:
                      - {s: "que la hablaba", r: "what he answered, 1: that he talked to her"}
                      - s: "y jamás podía sacar della una pequeña muestra"
                        r: "what he answered, 2: and could never get the least sign from her"
                        under:
                          - {s: "de venir en ninguna cosa que mala fuese", r: "of what: of agreeing to anything wrong"}
                      - {s: "ni aun dar una señal de sombra de esperanza", r: "what he answered, 3: nor even give a shadow of hope"}
        forms:
          - {w: "Sucedió", f: "suced- + -ió → suceder (to happen), preterite, it. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "se pasaron", f: "pas- + -aron → pasarse (to go by), preterite, they (the days). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "decir", f: "infinitive of decir (to say) after 'sin', with its own subject 'Lotario' placed after it."}
          - {w: "respondía", f: "respond- + -ía → responder (to answer), imperfect, he: 'kept answering'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
