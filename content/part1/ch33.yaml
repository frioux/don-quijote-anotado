          - {w: "se ha de probar", f: "ha (present of haber 'to have') + de + probar (to test), with impersonal 'se': 'one must test'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "se puede ... quebrar", f: "puede (present of poder 'to be able') + quebrarse (to break): 'she can break'. poder in the present: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "podría", f: "podr- + -ía → poder (can), conditional, it. podría, podrías, podría, podríamos, podríais, podrían."}
        note: "The three stanzas are 'redondillas', four eight-syllable lines rhyming abba, the common verse of the Spanish stage; the play they come from has not been identified for certain."
      - es: "Y es más fácil el quebrarse, y no es cordura ponerse a peligro de romperse lo que no puede soldarse."
        literal: "And is more easy the breaking-itself, and not is good-sense to-put-oneself at danger of breaking-itself what not can be-soldered."
        ormsby: "Breaking is an easy matter, / And it’s folly to expose / What you cannot mend to blows; / What you can’t make whole to shatter."
