  - sentences:
      - es: "»Pero la suerte, que las cosas guiaba de otra manera, ordenó que, habiendo dejado Anselmo solos a Lotario y a Camila, como otras veces solía, él se encerró en un aposento y por los agujeros de la cerradura estuvo mirando y escuchando lo que los dos trataban, y vio que en más de media hora Lotario no habló palabra a Camila, ni se la hablara si allí estuviera un siglo, y cayó en la cuenta de que cuanto su amigo le había dicho de las respuestas de Camila todo era ficción y mentira."
        literal: "»But the fate, which the things guided of other manner, ordained that, having left Anselmo alone [to] Lotario and [to] Camila, as other times he-was-wont, he himself shut-in in a chamber and through the holes of the lock was looking and listening [to] that which the two discussed, and he-saw that in more than half hour Lotario not spoke [a] word to Camila, nor to-her it would-have-spoken if there he-were a century, and he-fell into the account of that whatever his friend to-him had said of the answers of Camila all was fiction and lie."
        ormsby: "But chance, directing things in a different manner, so ordered it that Anselmo, having left Lothario and Camilla alone as on other occasions, shut himself into a chamber and posted himself to watch and listen through the keyhole to what passed between them, and perceived that for more than half an hour Lothario did not utter a word to Camilla, nor would utter a word though he were to be there for an age; and he came to the conclusion that what his friend had told him about the replies of Camilla was all invention and falsehood,"
        vocab:
          - {w: "suerte", d: "fate, chance"}
          - {w: "encerrarse", d: "to shut oneself in"}
          - {w: "agujeros de la cerradura", d: "the keyhole ('cerradura' = lock, 'agujero' = hole)"}
          - {w: "tratar", d: "to discuss, talk about"}
          - {w: "siglo", d: "century; here 'an age'"}
          - {w: "caer en la cuenta de", d: "to realize, see the truth of"}
          - {w: "cuanto", d: "all that, whatever"}
          - {w: "ficción", d: "invention, made-up story"}
