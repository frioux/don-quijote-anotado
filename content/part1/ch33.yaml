              - {s: "que no es una mujer más buena de cuanto es o no es solicitada", r: "what I believe, 1: that a woman is only as good as she is or is not tempted"}
              - s: "y que aquella sola es fuerte"
                r: "what I believe, 2: and that she alone is strong"
                under:
