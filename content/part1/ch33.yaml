      - es: "Dime, Anselmo, si el cielo, o la suerte buena, te hubiera hecho señor y legítimo posesor de un finísimo diamante, de cuya bondad y quilates estuviesen satisfechos cuantos lapidarios le viesen, y que todos a una voz y de común parecer dijesen que llegaba en quilates, bondad y fineza a cuanto se podía estender la naturaleza de tal piedra, y tú mesmo lo creyeses así, sin saber otra cosa en contrario, ¿sería justo que te viniese en deseo de tomar aquel diamante, y ponerle entre un ayunque y un martillo, y allí, a pura fuerza de golpes y brazos, probar si es tan duro y tan fino como dicen?"
        literal: "Tell-me, Anselmo, if the heaven, or the fortune good, you had made lord and legitimate possessor of a very-fine diamond, of whose goodness and carats were-satisfied as-many lapidaries as it might-see, and that all with one voice and of common opinion should-say that it-reached in carats, goodness and fineness to as-far-as could extend the nature of such stone, and you yourself it believed so, without knowing other thing in contrary, would-it-be just that to-you should-come in desire of taking that diamond, and putting-it between an anvil and a hammer, and there, by pure force of blows and arms, to-test if it-is so hard and so fine as they-say?"
        ormsby: "“Tell me, Anselmo, if Heaven or good fortune had made thee master and lawful owner of a diamond of the finest quality, with the excellence and purity of which all the lapidaries that had seen it had been satisfied, saying with one voice and common consent that in purity, quality, and fineness, it was all that a stone of the kind could possibly be, thou thyself too being of the same belief, as knowing nothing to the contrary, would it be reasonable in thee to desire to take that diamond and place it between an anvil and a hammer, and by mere force of blows and strength of arm try if it were as hard and as fine as they said?"
