  - sentences:
      - es: "Busco en la muerte la vida, salud en la enfermedad, en la prisión libertad, en lo cerrado salida y en el traidor lealtad."
        literal: "I-seek in the death the life, health in the sickness, in the prison freedom, in the closed exit and in the traitor loyalty."
        ormsby: "’Tis mine to seek for life in death, / Health in disease seek I, / I seek in prison freedom’s breath, / In traitors loyalty."
        vocab:
          - {w: "salud", d: "health"}
          - {w: "salida", d: "exit, way out"}
          - {w: "traidor", d: "traitor"}
          - {w: "lealtad", d: "loyalty"}
        diagram:
          - s: "Busco"
            r: "main verb: I seek"
            under:
              - {s: "en la muerte la vida", r: "1: life in death"}
              - {s: "salud en la enfermedad", r: "2: health in sickness"}
              - {s: "en la prisión libertad", r: "3: freedom in prison"}
              - {s: "en lo cerrado salida", r: "4: a way out in what is shut"}
              - {s: "y en el traidor lealtad", r: "5: and loyalty in the traitor"}
        forms:
          - {w: "Busco", f: "busc- + -o → buscar (to seek), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. The one verb governs all five pairs."}
          - {w: "lo cerrado", f: "lo + cerrado, the participle of cerrar (to close): 'what is closed'."}
        note: "A quintilla, five eight-syllable lines rhyming vida / salida and enfermedad / libertad / lealtad. Asking for impossibilities through paired opposites was a favourite game of fifteenth- and sixteenth-century courtly verse, going back to Petrarch."
      - es: "Pero mi suerte, de quien jamás espero algún bien, con el cielo ha estatuido que, pues lo imposible pido, lo posible aun no me den."
        literal: "But my fate, from whom never I-hope any good, with the heaven has decreed that, since the impossible I-ask, the possible even not to-me they-may-give."
        ormsby: "So Fate that ever scorns to grant / Or grace or boon to me, / Since what can never be I want, / Denies me what might be."
        vocab:
          - {w: "suerte", d: "fate, lot"}
          - {w: "de quien", d: "from which: 'quien' used for a thing, common in old Spanish"}
          - {w: "estatuir", d: "to decree, ordain (legal word)"}
          - {w: "pues", d: "here 'since'"}
        diagram:
          - s: "mi suerte ... con el cielo ha estatuido"
            r: "main verb (after 'Pero'): my fate, together with heaven, has decreed"
            under:
              - {s: "de quien jamás espero algún bien", r: "describes 'suerte': from which I never hope for any good"}
              - {s: "que, pues lo imposible pido, lo posible aun no me den", r: "what it decreed: that, since I ask the impossible, they shall not give me even the possible"}
        forms:
          - {w: "quien", f: "'which', used here for a thing ('suerte'); modern Spanish says 'de la que' or 'de la cual'."}
          - {w: "espero", f: "esper- + -o → esperar (to hope), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "algún", f: "alguno (some, any) clipped before a masculine singular noun ('bien')."}
          - {w: "ha estatuido", f: "ha, the present of haber (to have): he, has, ha, hemos, habéis, han; + estatuido, the participle of estatuir (to decree): 'has decreed'."}
          - {w: "pido", f: "pid- + -o → pedir (to ask), present, I. The stem e becomes i when stressed: pido, pides, pide, pedimos, pedís, piden."}
          - {w: "den", f: "d- + -en → dar (to give), present subjunctive, they (fate and heaven), after 'ha estatuido que' (has decreed that). dé, des, dé, demos, deis, den."}
        note: "The second quintilla rhymes quien / bien / den and estatuido / pido. The lover who asks for the impossible loses even the possible: exactly Anselmo's case."
  - sentences:
      - es: "»Fuese otro día Anselmo a la aldea, dejando dicho a Camila que el tiempo que él estuviese ausente vendría Lotario a mirar por su casa y a comer con ella; que tuviese cuidado de tratalle como a su mesma persona."
