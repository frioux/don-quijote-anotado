  - sentences:
      - es: "»Viendo Lotario la resoluta voluntad de Anselmo, y no sabiendo qué más ejemplos traerle ni qué más razones mostrarle para que no la siguiese, y viendo que le amenazaba que daría a otro cuenta de su mal deseo, por evitar mayor mal, determinó de contentarle y hacer lo que le pedía, con propósito e intención de guiar aquel negocio de modo que, sin alterar los pensamientos de Camila, quedase Anselmo satisfecho;"
        literal: "»Seeing Lotario the resolute will of Anselmo, and not knowing what more examples to-bring-him nor what more reasons to-show-him for that not it he-should-follow, and seeing that him he-threatened that he-would-give to another account of his bad desire, for to-avoid greater evil, he-determined of contenting-him and doing what him he-asked, with purpose and intention of guiding that business in manner that, without altering the thoughts of Camila, should-remain Anselmo satisfied;"
        ormsby: "Lothario seeing the fixed determination of Anselmo, and not knowing what further examples to offer or arguments to urge in order to dissuade him from it, and perceiving that he threatened to confide his pernicious scheme to someone else, to avoid a greater evil resolved to gratify him and do what he asked, intending to manage the business so as to satisfy Anselmo without corrupting the mind of Camilla;"
        vocab:
          - {w: "resoluto", d: "resolute, determined"}
          - {w: "amenazar", d: "to threaten"}
