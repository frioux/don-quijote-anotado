  - sentences:
      - es: "»—Con la atención que has visto he escuchado, Lotario amigo, cuanto has querido decirme, y en tus razones, ejemplos y comparaciones he visto la mucha discreción que tienes y el estremo de la verdadera amistad que alcanzas;"
        literal: "»—With the attention that you-have seen I-have listened, Lotario friend, all-that you-have wanted to-tell-me, and in your reasons, examples and comparisons I-have seen the much discretion that you-have and the extreme of the true friendship that you-attain;"
        ormsby: "“I have listened, Lothario my friend, attentively, as thou hast seen, to what thou hast chosen to say to me, and in thy arguments, examples, and comparisons I have seen that high intelligence thou dost possess, and the perfection of true friendship thou hast reached;"
        vocab:
          - {w: "discreción", d: "good sense, wisdom"}
          - {w: "estremo", d: "= extremo, the height, perfection"}
          - {w: "alcanzar", d: "to attain, possess"}
        diagram:
          - s: "he escuchado"
            r: "main verb 1: I have listened"
            under:
              - {s: "Con la atención que has visto", r: "how: with the attention you have seen"}
              - {s: "Lotario amigo", r: "address"}
              - {s: "cuanto has querido decirme", r: "object: everything you wanted to tell me"}
          - s: "y en tus razones, ejemplos y comparaciones he visto"
            r: "main verb 2: and in your arguments, examples and comparisons I have seen"
            under:
              - {s: "la mucha discreción que tienes", r: "object, 1: your great wisdom"}
              - {s: "y el estremo de la verdadera amistad que alcanzas", r: "object, 2: and the height of true friendship you reach"}
        forms:
