  - sentences:
      - es: "»—Paréceme, ¡oh Anselmo!, que tienes tú ahora el ingenio como el que siempre tienen los moros, a los cuales no se les puede dar a entender el error de su secta con las acotaciones de la Santa Escritura, ni con razones que consistan en especulación del entendimiento, ni que vayan fundadas en artículos de fe, sino que les han de traer ejemplos palpables, fáciles, intelegibles, demonstrativos, indubitables, con demostraciones matemáticas que no se pueden negar, como cuando dicen:"
        literal: "»—It-seems-to-me, oh Anselmo!, that you-have you now the wit like that which always have the Moors, to the whom not to-them one-can give to understand the error of their sect with the citations of the Holy Scripture, nor with reasons that may-consist in speculation of-the understanding, nor that may-go founded on articles of faith, but that to-them one-has to bring examples palpable, easy, intelligible, demonstrative, indubitable, with demonstrations mathematical that not can be-denied, as when they-say:"
        ormsby: "“It seems to me, Anselmo, that thine is just now the temper of mind which is always that of the Moors, who can never be brought to see the error of their creed by quotations from the Holy Scriptures, or by reasons which depend upon the examination of the understanding or are founded upon the articles of faith, but must have examples that are palpable, easy, intelligible, capable of proof, not admitting of doubt, with mathematical demonstrations that cannot be denied, like,"
        vocab:
          - {w: "ingenio", d: "wit, turn of mind"}
          - {w: "moro", d: "Moor, Muslim (the Moriscos and North Africans of Cervantes' day)"}
          - {w: "secta", d: "sect; used of Islam by Christian writers of the time"}
          - {w: "acotación", d: "citation, quotation (of a text)"}
          - {w: "especulación", d: "reasoning, abstract thought"}
          - {w: "palpable", d: "that can be touched, tangible"}
          - {w: "intelegible", d: "= inteligible, intelligible"}
          - {w: "demonstrativo", d: "able to be demonstrated, provable"}
          - {w: "indubitable", d: "beyond doubt"}
        diagram:
          - s: "Paréceme"
            r: "main verb: it seems to me"
            under:
              - {s: "¡oh Anselmo!", r: "address"}
              - s: "que tienes tú ahora el ingenio como el que siempre tienen los moros"
                r: "what seems: that your mind now is like the Moors'"
                under:
                  - s: "a los cuales no se les puede dar a entender el error de su secta"
                    r: "describes 'moros': who cannot be made to see the error of their creed"
                    under:
                      - {s: "con las acotaciones de la Santa Escritura", r: "how not, 1: with quotations from Scripture"}
                      - {s: "ni con razones que consistan en especulación del entendimiento", r: "how not, 2: nor with abstract reasoning"}
                      - {s: "ni que vayan fundadas en artículos de fe", r: "how not, 3: nor with arguments based on articles of faith"}
                  - s: "sino que les han de traer ejemplos palpables, fáciles, intelegibles, demonstrativos, indubitables"
                    r: "but: one must bring them tangible, easy, clear, provable, certain examples"
                    under:
                      - {s: "con demostraciones matemáticas que no se pueden negar", r: "how: with mathematical proofs that cannot be denied"}
                      - {s: "como cuando dicen:", r: "like when people say:"}
        forms:
          - {w: "Paréceme", f: "parec- + -e + me → parecer (to seem), present, it, with 'me' stuck on the end; modern 'me parece'. Cervantes hangs the pronoun on a verb that opens the clause. parezco, pareces, parece, parecemos, parecéis, parecen."}
          - {w: "tienes, tienen", f: "tener (to have), present, you / they. tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "se les puede", f: "'one can ... them': impersonal 'se' + 'les' (to them) + puede (present of poder 'to be able'). poder in the present: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "consistan, vayan", f: "consist- + -an → consistir (to consist), vay- + -an → ir (to go), present subjunctive, they: in descriptions of reasons that might exist. The -ir subjunctive: -a, -as, -a, -amos, -áis, -an; ir's is vaya, vayas, vaya, vayamos, vayáis, vayan."}
          - {w: "fundadas", f: "participle of fundar (to base), feminine plural to match 'razones'."}
          - {w: "han de traer", f: "han (present of haber 'to have', they) + de + traer (to bring): 'they (one) must bring'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "se pueden negar", f: "pueden (present of poder 'to be able', they) + negar (to deny), with 'se' making it passive: 'can be denied'. poder in the present: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "dicen", f: "dic- + -en → decir (to say), present, they. digo, dices, dice, decimos, decís, dicen."}
        note: "Missionary debate with Muslims was a live topic in Spain, where many Moriscos had been forcibly converted; the commonplace was that they would accept only proofs they could see and touch."
