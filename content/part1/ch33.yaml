          - {w: "ponerse, romperse, soldarse", f: "infinitives with 'se': to put oneself, to get broken, to be mended."}
          - {w: "puede", f: "pued- + -e → poder (can), present, it. puedo, puedes, puede, podemos, podéis, pueden."}
      - es: "Y en esta opinión estén todos, y en razón la fundo: que si hay Dánaes en el mundo, hay pluvias de oro también."
        literal: "And in this opinion let-be all, and in reason it I-found: that if there-are Danaës in the world, there-are rains of gold also."
        ormsby: "This, then, all may hold as true, / And the reason’s plain to see; / For if Danaes there be, / There are golden showers too."
        vocab:
          - {w: "fundar en", d: "to base on"}
          - {w: "Dánae", d: "Danaë, Greek princess locked in a bronze tower by her father; Zeus reached her as a shower of gold"}
          - {w: "pluvia", d: "= lluvia, rain (Latinism)"}
        diagram:
          - {s: "Y en esta opinión estén todos", r: "main verb 1: and let everyone hold this view"}
          - s: "y en razón la fundo"
            r: "main verb 2: and I base it on reason"
            under:
              - s: "que si hay Dánaes en el mundo, hay pluvias de oro también"
                r: "the reason: if there are Danaës in the world, there are also showers of gold"
        forms:
          - {w: "estén", f: "estar (to be), present subjunctive, they: a wish, 'let all be'. esté, estés, esté, estemos, estéis, estén."}
          - {w: "fundo", f: "fund- + -o → fundar (to base), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "hay", f: "the 'there is / there are' form of haber (to have)."}
          - {w: "Dánaes, pluvias", f: "plurals: Dánae + -s, pluvia + -s."}
        note: "The golden shower is the classic image of bribery: no guarded tower keeps a woman safe from gold, which is exactly what Anselmo plans to offer Camila."
