              - {s: "el virtuoso y prudente Lotario", r: "subject: the virtuous, prudent Lotario"}
          - s: "y Anselmo quedó tan confuso y pensativo"
            r: "main verb 2: and Anselmo was left so troubled and thoughtful"
            under:
              - {s: "que por un buen espacio no le pudo responder palabra", r: "result: that for a good while he could not answer a word"}
          - {s: "pero, en fin, le dijo", r: "main verb 3: but at last he said to him"}
