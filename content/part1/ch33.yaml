          - {w: "decirme", f: "decir (to tell) + me."}
          - {w: "tienes", f: "tien- + -es → tener (to have), present, you. tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "alcanzas", f: "alcanz- + -as → alcanzar (to attain), present, you. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "estremo", f: "= extremo."}
