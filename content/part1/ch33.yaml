      - es: "Afligióse Camila, como mujer discreta y honrada, de la orden que su marido le dejaba, y díjole que advirtiese que no estaba bien que nadie, él ausente, ocupase la silla de su mesa, y que si lo hacía por no tener confianza que ella sabría gobernar su casa, que probase por aquella vez, y vería por experiencia como para mayores cuidados era bastante."
