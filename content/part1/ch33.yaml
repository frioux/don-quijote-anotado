      - es: "No quiso Lotario, y allí se quedó dormido hasta que volvió Anselmo, el cual, como halló a Camila en su aposento y a Lotario durmiendo, creyó que, como se había tardado tanto, ya habrían tenido los dos lugar para hablar, y aun para dormir, y no vio la hora en que Lotario despertase, para volverse con él fuera y preguntarle de su ventura. »Todo le sucedió como él quiso:"
