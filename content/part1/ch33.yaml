          - {w: "padezco", f: "padezc- + -o → padecer (to suffer), present, I. padezco, padeces, padece, padecemos, padecéis, padecen."}
          - {w: "suelen", f: "suel- + -en → soler (to be wont), present, they. suelo, sueles, suele, solemos, soléis, suelen."}
