      - es: "Prosupuesto esto, has de considerar que yo padezco ahora la enfermedad que suelen tener algunas mujeres, que se les antoja comer tierra, yeso, carbón y otras cosas peores, aun asquerosas para mirarse, cuanto más para comerse;"
