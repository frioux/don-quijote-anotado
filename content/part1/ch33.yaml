  - sentences:
      - es: "»Calló, en diciendo esto, el virtuoso y prudente Lotario, y Anselmo quedó tan confuso y pensativo que por un buen espacio no le pudo responder palabra; pero, en fin, le dijo:"
        literal: "»Fell-silent, on saying this, the virtuous and prudent Lotario, and Anselmo remained so confused and pensive that for a good space not to-him he-could answer word; but, in end, to-him he-said:"
        ormsby: "Having said this, the wise and virtuous Lothario was silent, and Anselmo, troubled in mind and deep in thought, was unable for a while to utter a word in reply; but at length he said,"
        vocab:
          - {w: "callar", d: "to fall silent"}
          - {w: "en diciendo", d: "as soon as he had said"}
          - {w: "pensativo", d: "thoughtful, pensive"}
          - {w: "un buen espacio", d: "a good while"}
