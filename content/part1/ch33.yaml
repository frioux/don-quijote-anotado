summary: |
  At the inn the priest reads aloud the manuscript of a short novel, 'The Ill-Advised Curiosity'. In Florence live two rich young gentlemen, Anselmo and Lotario, such close friends that everyone calls them simply 'the Two Friends'. Anselmo falls in love with Camila, a beautiful girl of good family, and marries her with Lotario as his go-between. After the wedding Lotario visits less often, to keep gossip away from his friend's honour, although Anselmo begs him to come as before.

  Anselmo then confesses a strange desire that torments him: he wants to know whether Camila is truly as virtuous as he believes, and the only proof he will accept is to have her tempted. He asks Lotario to court her. Lotario, horrified, argues against it at length: a priceless diamond is not struck with a hammer to see if it breaks, a woman's good name is as fragile as glass, and husband and wife are one flesh, so Anselmo would be dishonouring himself. Anselmo grants every argument but says he is sick with a craving he cannot help, and threatens to find someone else. Lotario agrees, meaning to deceive Anselmo without ever troubling Camila.

  Anselmo leaves the two alone; Lotario dozes in his chair and afterwards reports invented compliments and refusals. Anselmo gives him four thousand gold crowns to tempt Camila with gifts, and Lotario lies again. Spying through a keyhole, Anselmo sees that Lotario never says a word to her and reproaches him; ashamed, Lotario swears to do the thing in earnest. Anselmo arranges to be called away to a friend's village for eight days and orders Camila, against her protests, to receive Lotario as she would himself. The narrator cries out against Anselmo's folly and quotes a poem on the man who asks for the impossible and loses even the possible.

  Camila keeps her servants about her, but her maid Leonela, busy with affairs of her own, leaves the two alone. Silenced by Camila's modesty, Lotario has nothing to do but look at her, and he falls in love. After three days of struggling with himself he declares his passion. Camila rises without a word and goes to her room, and that same night she sends a servant to Anselmo with a letter.
context: |
  The novel in the inn. The manuscript was found in a trunk of books a guest had left at the inn, and the priest reads it to the company while Don Quijote sleeps. The opening « and the » that begins every later paragraph mark the reading. 'El curioso impertinente' is a 'novela' in the Italian sense: a short tale of intrigue, set in Italy, in the line of Boccaccio and Bandello. Cervantes was proud of bringing the form into Spanish and later published a whole book of such tales, the Novelas ejemplares (1613). Readers have long argued whether this tale, which has nothing to do with Don Quijote, belongs in the book at all; but its theme, a man who will not accept the evidence of his senses and insists on testing reality, runs close to the main story.

  The testing husband. The plot is an old one. In Ovid's Metamorphoses, Cephalus returns in disguise and tempts his own wife Procris with gifts until she wavers. In Ariosto's Orlando Furioso, Canto 43, which gives Anselmo his name, a knight offers Rinaldo a magic cup from which no husband with an unfaithful wife can drink without spilling, and Rinaldo wisely refuses to try it. As Ormsby notes, Cervantes has run two of Ariosto's stories together: it was not 'the doctor' but Rinaldo's host who tried the cup. Lotario's speech draws on the usual sources of moral argument: Proverbs 31 on the price of a virtuous woman (Ormsby's note), Plutarch's report of Pericles, who would help a friend 'as far as the altar' and no further (also Ormsby), Genesis on man and wife as one flesh, a stanza from Tansillo's poem on St Peter's tears, the ermine that would rather be caught than soil its coat, and the redondillas on woman as a thing of glass.

  Honour and the household. Behind the tale lies the honour code of Spain and Italy: a husband's honour depended on his wife's chastity and on what the neighbours said about it, which is why Lotario stops visiting a newly married friend and why Camila objects to anyone sitting in her husband's chair. A respectable wife kept to her house ('recogimiento'), sat on the estrado, the cushioned dais of the women's room, and went out with servants, mainly to church; Ormsby notes that the church was the great meeting place of Italian and Spanish tales of intrigue. The four thousand gold crowns Anselmo hands over were a fortune, when a labourer earned two or three reales a day.

  Medicine and religion. Anselmo excuses himself as a sick man: his craving is like pica, the appetite for earth or charcoal known in pregnant women and in girls with the 'green sickness', which doctors cured by trickery. Lotario warns him against stirring up the 'humours' when they are at rest, the medical theory of the day. Lotario compares Anselmo to the Moors, who in the missionaries' commonplace would accept no argument from scripture, only proofs they could touch. The devil who disguises himself as an angel of light comes from St Paul (2 Corinthians 11:14).

  Names and the narrator. Lotario's name passed into English as a byword for a seducer through Nicholas Rowe's play The Fair Penitent (1703), and is usually traced back to this tale. Camila bears the name of Virgil's virgin warrior Camilla, servant of the chaste huntress Diana. The title's 'curioso' and 'impertinente' are false friends: 'curioso' is a man who pries, 'impertinente' one whose prying is out of place, hence Ormsby's 'Ill-Advised Curiosity'. The narrator of the tale breaks in with his own voice, doubting that any friend but Lotario would be so careful, punning on 'necesidad' and 'necedad' (need and folly), and, when Anselmo leaves for the village, crying out to his character in a rhetorical apostrophe.

  Reading Cervantes' Spanish. The archaisms of the chapter: mesmo (mismo), ansí (así), della and desta (de ella, de esta), efeto (efecto), priesa (prisa), recebir and rescebido (recibir), estremos (extremos), respectos (respetos), and trujo for trajo. Infinitives with a pronoun turn -rl- into -ll-: contentalle, mentille, satisfacelle, dalle, tratalle, obedecelle, respondelle. Pronouns hang on the end of verbs that open a clause: Fuese, Viose, Creyóle, Afligióse, díjole, Partióse, Mirábala, Hacíase, Culpábase. Look out for laísmo ('la hablaba' for 'le hablaba'), 'de' marking the doer of a passive ('recebido de Camila'), the -ra form used as a conditional (pudiera, hablara, temiera) and once as a pluperfect (pensara), the future subjunctive for an open future (quisiere, fuere, viniere), 'haber de' for 'must, be going to', and Anselmo moving between the courteous 'vos' (os daré, ofrezcáis) and the intimate 'tú'. The false friends are many: discreción (good sense), curiosidad (care, prying), impertinente (uncalled-for), industria (cunning), honestidad (chastity), comodidad (opportunity), diligencia (care), discurso (reasoning), razones (words), billete (note), puesto que (although).
