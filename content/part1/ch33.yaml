  - sentences:
      - es: "»Pero lo que hizo fue poner el codo sobre el brazo de la silla y la mano abierta en la mejilla, y, pidiendo perdón a Camila del mal comedimiento, dijo que quería reposar un poco en tanto que Anselmo volvía."
