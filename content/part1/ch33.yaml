          - {w: "muestra", f: "muestr- + -a → mostrar (to show), present, it. The stem o becomes ue when stressed: muestro, muestras, muestra, mostramos, mostráis, muestran."}
      - es: "Porque yo tengo para mí, ¡oh amigo!, que no es una mujer más buena de cuanto es o no es solicitada, y que aquella sola es fuerte que no se dobla a las promesas, a las dádivas, a las lágrimas y a las continuas importunidades de los solícitos amantes."
        literal: "Because I hold for me, oh friend!, that not is a woman more good than as-much-as she-is or not is solicited, and that that-one alone is strong who not bends-herself to the promises, to the gifts, to the tears and to the continual importunities of the eager lovers."
