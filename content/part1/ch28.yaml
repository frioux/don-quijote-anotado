            under:
              - {s: "ya que no es Luscinda", r: "why: since she is not Luscinda"}
        forms:
          - {w: "Ésta", f: "esta (this), feminine, used as a pronoun ('this one') and so written with an accent in the old spelling. Cardenio already says 'she'."}
          - {w: "es", f: "ser (to be), present, she. soy, eres, es, somos, sois, son."}
          - {w: "humana, divina", f: "feminine to match 'persona'."}
        note: "Cardenio uses the feminine 'Ésta' before anyone knows the youth is a woman: his lover's eye guesses first. In his logic, any beauty that is not Luscinda must be more than human."
  - sentences:
      - es: "El mozo se quitó la montera, y, sacudiendo la cabeza a una y a otra parte, se comenzaron a descoger y desparcir unos cabellos, que pudieran los del sol tenerles envidia."
