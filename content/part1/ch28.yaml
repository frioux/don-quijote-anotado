  - sentences:
      - es: "— «Llegó esta triste nueva a mis oídos, y, en lugar de helárseme el corazón en oílla, fue tanta la cólera y rabia que se encendió en él, que faltó poco para no salirme por las calles dando voces, publicando la alevosía y traición que se me había hecho."
        literal: "— «Arrived this sad news to my ears, and, in place of freezing-to-me the heart on hearing-it, was so-much the anger and rage that kindled in it, that lacked little for not to-go-out-me through the streets giving cries, proclaiming the perfidy and treachery that to-me had-been done."
        ormsby: "“This sad intelligence reached my ears, and, instead of being struck with a chill, with such wrath and fury did my heart burn that I scarcely restrained myself from rushing out into the streets, crying aloud and proclaiming openly the perfidy and treachery of which I was the victim;"
