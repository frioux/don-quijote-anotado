  - sentences:
      - es: "Oyó Cardenio el nombre de Luscinda, y no hizo otra cosa que encoger los hombros, morderse los labios, enarcar las cejas y dejar de allí a poco caer por sus ojos dos fuentes de lágrimas."
        literal: "Heard Cardenio the name of Luscinda, and not he-did other thing than to-shrug the shoulders, to-bite-himself the lips, to-arch the brows and to-let from there to little fall through his eyes two fountains of tears."
