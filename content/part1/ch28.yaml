        literal: "With words most-effective and oaths extraordinary, to-me he-gave the word of being my husband, although, before that he-might-finish of saying-them, to-him I-said that he-should-look well what he-was-doing and that he-should-consider the anger that his father had to receive from seeing-him married with a peasant vassal his;"
