  - sentences:
      - es: "»Estando, pues, en la ciudad, sin saber qué hacerme, pues a don Fernando no hallaba, llegó a mis oídos un público pregón, donde se prometía grande hallazgo a quien me hallase, dando las señas de la edad y del mesmo traje que traía;"
