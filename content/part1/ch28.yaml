        vocab:
          - {w: "quitarse", d: "to take off (a garment)"}
          - {w: "sacudir", d: "to shake"}
          - {w: "a una y a otra parte", d: "from side to side"}
          - {w: "descoger", d: "to unfold, let loose (old word)"}
          - {w: "desparcir", d: "= esparcir, to spread out, scatter (old form)"}
          - {w: "cabellos", d: "hair (of the head); the plural is common for long hair"}
          - {w: "los del sol", d: "those of the sun, i.e. the sun's rays, pictured as golden hair"}
          - {w: "tener envidia", d: "to envy"}
        diagram:
          - {s: "El mozo se quitó la montera", r: "main verb 1: the youth took off his cap"}
          - s: "se comenzaron a descoger y desparcir"
            r: "main verb 2 (after 'y'): began to come loose and spread out"
