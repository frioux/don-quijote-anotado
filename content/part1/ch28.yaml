      - es: "Y, tornándole a hacer nuevos ofrecimientos y nuevos ruegos para que lo prometido cumpliese, ella, sin hacerse más de rogar, calzándose con toda honestidad y recogiendo sus cabellos, se acomodó en el asiento de una piedra, y, puestos los tres alrededor della, haciéndose fuerza por detener algunas lágrimas que a los ojos se le venían, con voz reposada y clara, comenzó la historia de su vida desta manera:"
        literal: "And, returning-to-her to make new offers and new pleas so that the promised she-might-fulfil, she, without making-herself more of to-beg, putting-on-shoes with all modesty and gathering-up her hairs, settled-herself on the seat of a stone, and, placed the three around of-her, making-herself force for to-hold-back some tears that to the eyes to-her were-coming, with voice calm and clear, began the story of her life of-this manner:"
        ormsby: "and as they again repeated their offers and entreaties to her to fulfil her promise, she without further pressing, first modestly covering her feet and gathering up her hair, seated herself on a stone with the three placed around her, and, after an effort to restrain some tears that came to her eyes, in a clear and steady voice began her story thus:"
