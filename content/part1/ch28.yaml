        ormsby: "“As this is not Luscinda, it is no human creature but a divine being.”"
        vocab:
          - {w: "ya que", d: "since, seeing that"}
          - {w: "no ... sino", d: "not ... but rather"}
        diagram:
          - s: "Ésta ... no es persona humana, sino divina"
