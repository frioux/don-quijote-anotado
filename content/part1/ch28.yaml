      - es: "y oí decir que se decía que me había sacado de casa de mis padres el mozo que conmigo vino, cosa que me llegó al alma, por ver cuán de caída andaba mi crédito, pues no bastaba perderle con mi venida, sino añadir el con quién, siendo subjeto tan bajo y tan indigno de mis buenos pensamientos."
        literal: "and I-heard say that it-was-said that me had taken-out of house of my parents the youth who with-me came, thing that to-me reached to-the soul, for seeing how of falling went my credit, since not it-sufficed to-lose-it with my coming, but to-add the with whom, being subject so low and so unworthy of my good thoughts."
        ormsby: "and I heard it said that the lad who came with me had taken me away from my father’s house; a thing that cut me to the heart, showing how low my good name had fallen, since it was not enough that I should lose it by my flight, but they must add with whom I had fled, and that one so much beneath me and so unworthy of my consideration."
