              - {s: "sacudiendo la cabeza a una y a otra parte", r: "how: as he shook his head from side to side"}
              - s: "unos cabellos"
                r: "subject: some hair"
                under:
                  - {s: "que pudieran los del sol tenerles envidia", r: "describes 'cabellos': which the sun's own rays might have envied"}
        forms:
          - {w: "se quitó", f: "quit- + -ó → quitarse (to take off), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "sacudiendo", f: "gerund of sacudir (to shake)."}
          - {w: "se comenzaron", f: "comenz- + -aron → comenzar (to begin), preterite, they (the hairs), with 'se' because the hair moves of itself. Same -ar preterite."}
          - {w: "pudieran", f: "pud- + -ieran → poder (to be able), imperfect subjunctive (-ra form), they, used as a conditional: 'might have'. pudiera, pudieras, pudiera, pudiéramos, pudierais, pudieran."}
