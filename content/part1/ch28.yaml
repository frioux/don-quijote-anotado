      - es: "Pero, como suele decirse que un mal llama a otro, y que el fin de una desgracia suele ser principio de otra mayor, así me sucedió a mí, porque mi buen criado, hasta entonces fiel y seguro, así como me vio en esta soledad, incitado de su mesma bellaquería antes que de mi hermosura, quiso aprovecharse de la ocasión que, a su parecer, estos yermos le ofrecían;"
        literal: "But, as is-wont to-be-said that one ill calls to another, and that the end of one misfortune is-wont to-be beginning of another greater, so to-me it-happened to me, because my good servant, until then faithful and trusty, as soon as me he-saw in this solitude, incited by his own villainy rather than by my beauty, wanted to-take-advantage of the occasion that, to his seeming, these wastes to-him offered;"
        ormsby: "But, as is commonly said, one evil calls up another, and the end of one misfortune is apt to be the beginning of one still greater, and so it proved in my case; for my worthy servant, until then so faithful and trusty when he found me in this lonely spot, moved more by his own villainy than by my beauty, sought to take advantage of the opportunity which these solitudes seemed to present him,"
