      - es: "“Si como estoy, señor, en tus brazos, estuviera entre los de un león fiero y el librarme dellos se me asegurara con que hiciera, o dijera, cosa que fuera en perjuicio de mi honestidad, así fuera posible hacella o decilla como es posible dejar de haber sido lo que fue."
        literal: "“If as I-am, sir, in your arms, I-were between those of a lion fierce and the freeing-myself from-them to-me were-assured with that I-did, or said, thing that were in prejudice of my virtue, so would-it-be possible to-do-it or to-say-it as is possible to-cease of having been what was."
        ormsby: "‘If, as I am now in your arms, señor, I were in the claws of a fierce lion, and my deliverance could be procured by doing or saying anything to the prejudice of my honour, it would no more be in my power to do it or say it, than it would be possible that what was should not have been;"
        vocab:
          - {w: "fiero", d: "fierce, wild"}
          - {w: "librarse de", d: "to escape from, be freed from"}
          - {w: "dellos", d: "= de ellos, from them"}
          - {w: "asegurar", d: "to ensure, guarantee"}
          - {w: "con que", d: "on condition that, by"}
          - {w: "en perjuicio de", d: "to the harm of"}
          - {w: "hacella, decilla", d: "= hacerla, decirla, to do it, say it (old -rl- → -ll-)"}
          - {w: "dejar de haber sido lo que fue", d: "for what was not to have been, i.e. to undo the past: impossible"}
        diagram:
          - s: "así fuera posible hacella o decilla"
            r: "main verb: it would be as possible to do or say it"
            under:
              - {s: "Si como estoy, señor, en tus brazos, estuviera entre los de un león fiero", r: "condition 1: if, as I am in your arms, I were in those of a fierce lion"}
              - s: "y el librarme dellos se me asegurara"
                r: "condition 2: and my escape from them were assured me"
                under:
                  - s: "con que hiciera, o dijera, cosa"
                    r: "on what terms: by doing or saying something"
                    under:
                      - {s: "que fuera en perjuicio de mi honestidad", r: "describes 'cosa': that harmed my virtue"}
              - {s: "como es posible dejar de haber sido lo que fue", r: "comparison: as it is possible for what has been not to have been"}
        forms:
          - {w: "estoy", f: "estar (to be), present, I. estoy, estás, está, estamos, estáis, están."}
          - {w: "tus", f: "'your' (for tú), plural to match 'brazos'. She now speaks to Don Fernando as 'tú', in passion."}
          - {w: "estuviera", f: "estuv- + -iera → estar (to be), imperfect subjunctive (-ra form), I, after 'si'. estuviera, estuvieras, estuviera, estuviéramos, estuvierais, estuvieran."}
          - {w: "librarme", f: "infinitive of librar (to free) + me, used as a noun with 'el'."}
          - {w: "se me asegurara", f: "asegur- + -ara → asegurar (to assure), imperfect subjunctive (-ra form), it, with 'se' as a passive: 'were assured to me'. -ara, -aras, -ara, -áramos, -arais, -aran."}
          - {w: "hiciera, dijera, fuera", f: "imperfect subjunctive (-ra form), I / it: hic- + -iera → hacer (to do), dij- + -era → decir (to say), fu- + -era → ser (to be). The endings: -iera, -ieras, -iera, -iéramos, -ierais, -ieran; after j and in ser the i drops: dijera, fuera."}
          - {w: "así fuera", f: "fuera (ser, -ra form) used as a conditional: 'it would be'. fuera, fueras, fuera, fuéramos, fuerais, fueran."}
          - {w: "hacella, decilla", f: "= hacerla, decirla: infinitive + la (it), the r assimilating to the l."}
          - {w: "haber sido", f: "infinitive of haber + sido (participle of ser): 'having been'."}
      - es: "Así que, si tú tienes ceñido mi cuerpo con tus brazos, yo tengo atada mi alma con mis buenos deseos, que son tan diferentes de los tuyos como lo verás si con hacerme fuerza quisieres pasar adelante en ellos."
