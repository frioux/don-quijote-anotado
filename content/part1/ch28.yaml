part: 1
chapter: 28
title_es: "Capítulo XXVIII. Que trata de la nueva y agradable aventura que al cura y barbero sucedió en la mesma sierra"
title_en: "Which treats of the strange and delightful adventure that befell the curate and the barber in the same Sierra"
paragraphs:
  - sentences:
      - es: "Felicísimos y venturosos fueron los tiempos donde se echó al mundo el audacísimo caballero don Quijote de la Mancha, pues por haber tenido tan honrosa determinación como fue el querer resucitar y volver al mundo la ya perdida y casi muerta orden de la andante caballería, gozamos ahora, en esta nuestra edad, necesitada de alegres entretenimientos, no sólo de la dulzura de su verdadera historia, sino de los cuentos y episodios della, que, en parte, no son menos agradables y artificiosos y verdaderos que la misma historia;"
        literal: "Most-happy and fortunate were the times where was-sent to-the world the most-daring knight Don Quijote of La Mancha, since for having had so honorable resolution as was the to-want to-revive and to-return to-the world the already lost and almost dead order of the errant chivalry, we-enjoy now, in this our age, needy of cheerful entertainments, not only of the sweetness of his true history, but of the tales and episodes of-it, which, in part, not are less pleasant and artful and true than the same history;"
        ormsby: "Happy and fortunate were the times when that most daring knight Don Quixote of La Mancha was sent into the world; for by reason of his having formed a resolution so honourable as that of seeking to revive and restore to the world the long-lost and almost defunct order of knight-errantry, we now enjoy in this age of ours, so poor in light entertainment, not only the charm of his veracious history, but also of the tales and episodes contained in it which are, in a measure, no less pleasing, ingenious, and truthful, than the history itself;"
        vocab:
          - {w: "felicísimo", d: "most happy; the -ísimo superlative of feliz"}
          - {w: "venturoso", d: "fortunate, lucky"}
          - {w: "echar al mundo", d: "to bring into the world, send into the world"}
          - {w: "audacísimo", d: "most daring; superlative of audaz"}
          - {w: "determinación", d: "resolution, decision"}
          - {w: "resucitar", d: "to revive, bring back to life"}
          - {w: "la orden de la andante caballería", d: "the order of knight-errantry; 'orden' (an order of knights) is feminine here"}
          - {w: "gozar de", d: "to enjoy"}
          - {w: "necesitado de", d: "in need of, short of"}
          - {w: "entretenimiento", d: "entertainment, pastime"}
          - {w: "episodio", d: "episode, a story set inside the main one"}
          - {w: "della", d: "= de ella, of it (the history)"}
          - {w: "artificioso", d: "artful, skilfully made (praise, not 'artificial')"}
        diagram:
          - s: "fueron"
            r: "main verb 1: were"
            under:
              - {s: "Felicísimos y venturosos", r: "what they were: most happy and fortunate"}
              - s: "los tiempos"
                r: "subject: the times"
                under:
                  - {s: "donde se echó al mundo el audacísimo caballero don Quijote de la Mancha", r: "describes 'tiempos': when the most daring knight was sent into the world"}
          - s: "gozamos"
            r: "main verb 2: we enjoy"
            under:
              - s: "pues por haber tenido tan honrosa determinación"
                r: "why: since, because he formed so honorable a resolution"
                under:
                  - {s: "como fue el querer resucitar y volver al mundo la ya perdida y casi muerta orden de la andante caballería", r: "what resolution: wanting to revive and restore the lost order of knight-errantry"}
              - {s: "ahora, en esta nuestra edad", r: "when: now, in this age of ours"}
              - {s: "necesitada de alegres entretenimientos", r: "describes 'edad': short of cheerful entertainment"}
              - {s: "no sólo de la dulzura de su verdadera historia", r: "what we enjoy, 1: the sweetness of his true history"}
              - s: "sino de los cuentos y episodios della"
                r: "what we enjoy, 2: but also its tales and episodes"
                under:
                  - {s: "que, en parte, no son menos agradables y artificiosos y verdaderos que la misma historia", r: "describes 'cuentos y episodios': no less pleasing, artful and true than the history itself"}
        forms:
          - {w: "Felicísimos", f: "feliz + -ísimo → 'most happy', masculine plural to match 'tiempos'. The z of feliz turns to c before i."}
          - {w: "fueron", f: "fue- + -ron → ser (to be), preterite, they. ser's preterite is irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "se echó", f: "ech- + -ó → echar (to throw, send), preterite, with 'se' as a passive: 'was sent'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "audacísimo", f: "audaz + -ísimo → 'most daring'; z turns to c before i."}
          - {w: "haber tenido", f: "infinitive of haber (to have) + tenido, the participle of tener (to have): 'having had', after 'por' (because of)."}
          - {w: "el querer", f: "infinitive of querer (to want) used as a noun with 'el': 'the wanting'."}
          - {w: "perdida, muerta", f: "participles of perder (to lose) and morir (to die, irregular 'muerto'), feminine to match 'orden'."}
          - {w: "gozamos", f: "goz- + -amos → gozar (to enjoy), present, we. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "necesitada", f: "participle of necesitar (to need), feminine to match 'edad'."}
          - {w: "della", f: "de + ella (of it), fused; Cervantes does this with 'ella', 'este', 'ese'; modern Spanish keeps only 'del'."}
          - {w: "son", f: "ser (to be), present, they. soy, eres, es, somos, sois, son."}
        ormsby_note: "This looks as if some doubt had crossed the mind of Cervantes as to the propriety of introducing these tales and episodes."
      - es: "la cual, prosiguiendo su rastrillado, torcido y aspado hilo, cuenta que, así como el cura comenzó a prevenirse para consolar a Cardenio, lo impidió una voz que llegó a sus oídos, que, con tristes acentos, decía desta manera:"
        literal: "the which, continuing its heckled, twisted and reeled thread, relates that, just as the priest began to-prepare-himself for to-console [to] Cardenio, it prevented a voice that arrived at his ears, which, with sad accents, was-saying of-this manner:"
        ormsby: "which, resuming its thread, carded, spun, and wound, relates that just as the curate was going to offer consolation to Cardenio, he was interrupted by a voice that fell upon his ear saying in plaintive tones:"
        vocab:
          - {w: "proseguir", d: "to continue, carry on"}
          - {w: "rastrillado", d: "heckled, combed (of flax, before spinning)"}
          - {w: "torcido", d: "twisted, spun"}
          - {w: "aspado", d: "reeled, wound on a reel (aspa)"}
          - {w: "hilo", d: "thread; 'el hilo de la historia', the thread of the story"}
          - {w: "así como", d: "just as, as soon as"}
          - {w: "prevenirse", d: "to get ready, prepare oneself"}
          - {w: "acento", d: "tone of voice"}
          - {w: "desta manera", d: "= de esta manera, in this way, as follows"}
        diagram:
          - s: "la cual"
            r: "subject: which (the history, from the previous sentence)"
          - s: "cuenta"
            r: "main verb: relates"
            under:
              - {s: "prosiguiendo su rastrillado, torcido y aspado hilo", r: "how: taking up its combed, spun and reeled thread"}
              - s: "que ... lo impidió una voz"
                r: "what it relates: that a voice prevented it"
                under:
                  - {s: "así como el cura comenzó a prevenirse para consolar a Cardenio", r: "when: just as the priest was getting ready to comfort Cardenio"}
                  - {s: "que llegó a sus oídos", r: "describes 'voz': that reached his ears"}
                  - {s: "que, con tristes acentos, decía desta manera", r: "describes 'voz': that said, in sad tones, as follows"}
        forms:
          - {w: "prosiguiendo", f: "gerund of proseguir (to continue): 'continuing'. The e of the stem turns to i in the gerund: proseguir → prosiguiendo."}
          - {w: "rastrillado, torcido y aspado", f: "participles of rastrillar (to comb flax), torcer (to twist), aspar (to reel), masculine to match 'hilo'."}
          - {w: "cuenta", f: "cuent- + -a → contar (to tell), present, it. The stem o becomes ue when stressed: cuento, cuentas, cuenta, contamos, contáis, cuentan."}
          - {w: "comenzó", f: "comenz- + -ó → comenzar (to begin), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "prevenirse", f: "infinitive of prevenir (to prepare) + se (himself), after 'comenzó a'."}
          - {w: "impidió", f: "impid- + -ió → impedir (to prevent), preterite, it. The e of the stem turns to i in this form: impedí, impediste, impidió, impedimos, impedisteis, impidieron."}
          - {w: "llegó", f: "lleg- + -ó → llegar (to arrive), preterite, it. Same -ar preterite."}
          - {w: "decía", f: "dec- + -ía → decir (to say), imperfect, it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "desta", f: "de + esta (of this), fused into one word."}
        note: "The image is of spinning flax: combed, twisted, reeled. The narrator pictures the story as a thread being spun, and picks it up again after the digression on tales and episodes."
  - sentences:
      - es: "— ¡Ay Dios! ¿Si será posible que he ya hallado lugar que pueda servir de escondida sepultura a la carga pesada deste cuerpo, que tan contra mi voluntad sostengo?"
        literal: "— Oh God! Whether will-it-be possible that I-have already found place that may serve as hidden grave to the load heavy of-this body, which so against my will I-sustain?"
        ormsby: "“O God! is it possible I have found a place that may serve as a secret grave for the weary load of this body that I support so unwillingly?"
        vocab:
          - {w: "¡Ay Dios!", d: "Oh God! a cry of grief"}
          - {w: "¿Si será posible que...?", d: "can it be that...? 'si' opening a question expresses wonder or doubt"}
          - {w: "hallar", d: "to find"}
          - {w: "servir de", d: "to serve as"}
          - {w: "sepultura", d: "grave, burial place"}
          - {w: "carga", d: "load, burden"}
          - {w: "deste", d: "= de este, of this"}
          - {w: "sostener", d: "to support, bear, keep up"}
        diagram:
          - {s: "¡Ay Dios!", r: "exclamation: oh God!"}
          - s: "¿Si será posible"
            r: "main verb: can it be possible"
            under:
              - s: "que he ya hallado lugar"
                r: "what might be possible: that I have now found a place"
                under:
                  - s: "que pueda servir de escondida sepultura a la carga pesada deste cuerpo"
                    r: "describes 'lugar': that can serve as a hidden grave for the heavy load of this body"
                    under:
                      - {s: "que tan contra mi voluntad sostengo", r: "describes 'cuerpo': which I bear so much against my will"}
        forms:
          - {w: "será", f: "ser- + -á → ser (to be), future, it: 'can it be'. The future adds -é, -ás, -á, -emos, -éis, -án to the infinitive. Here it expresses wonder rather than time."}
          - {w: "he ... hallado", f: "he = haber, present, I (he, has, ha, hemos, habéis, han), + hallado, the participle of hallar (to find): 'I have found'. 'ya' sits between them."}
          - {w: "pueda", f: "pued- + -a → poder (to be able), present subjunctive, it: 'that may serve'. Subjunctive because the place is only hoped for. The stem o becomes ue when stressed: pueda, puedas, pueda, podamos, podáis, puedan."}
          - {w: "escondida", f: "participle of esconder (to hide), feminine to match 'sepultura'."}
          - {w: "pesada", f: "pesad- + -a → pesado (heavy), feminine to match 'carga'; placed after the noun."}
          - {w: "deste", f: "de + este (of this), fused into one word."}
          - {w: "sostengo", f: "sosteng- + -o → sostener (to bear), present, I. Built like tener: sostengo, sostienes, sostiene, sostenemos, sostenéis, sostienen."}
      - es: "Sí será, si la soledad que prometen estas sierras no me miente."
        literal: "Yes it-will-be, if the solitude that promise these mountains not to-me lies."
        ormsby: "If the solitude these mountains promise deceives me not, it is so;"
        vocab:
          - {w: "Sí será", d: "yes, it will be so; 'sí' with the accent is 'yes', 'si' without it is 'if'"}
          - {w: "soledad", d: "solitude, loneliness"}
          - {w: "sierra", d: "mountain range; here the Sierra Morena"}
          - {w: "mentir", d: "to lie, deceive"}
        diagram:
          - s: "Sí será"
            r: "main verb: yes, it will be (possible)"
            under:
              - s: "si la soledad ... no me miente"
                r: "condition: if the solitude does not deceive me"
                under:
                  - {s: "que prometen estas sierras", r: "describes 'soledad': which these mountains promise"}
        forms:
          - {w: "será", f: "ser- + -á → ser (to be), future, it. The future adds -é, -ás, -á, -emos, -éis, -án to the infinitive."}
          - {w: "prometen", f: "promet- + -en → prometer (to promise), present, they (the mountains). The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "miente", f: "mient- + -e → mentir (to lie), present, it. The stem e becomes ie when stressed: miento, mientes, miente, mentimos, mentís, mienten."}
          - {w: "Sí, si", f: "'sí' (yes) and 'si' (if) side by side; only the accent tells them apart in writing."}
      - es: "¡Ay, desdichada, y cuán más agradable compañía harán estos riscos y malezas a mi intención, pues me darán lugar para que con quejas comunique mi desgracia al cielo, que no la de ningún hombre humano, pues no hay ninguno en la tierra de quien se pueda esperar consejo en las dudas, alivio en las quejas, ni remedio en los males!"
        literal: "Oh, unhappy-[woman], and how-much more pleasant company will-make these crags and thickets to my intention, since to-me they-will-give room for that with complaints I-may-communicate my misfortune to-the heaven, than not that of any man human, since not there-is none on the earth from whom one may hope counsel in the doubts, relief in the complaints, nor remedy in the ills!"
        ormsby: "ah! woe is me! how much more grateful to my mind will be the society of these rocks and brakes that permit me to complain of my misfortune to Heaven, than that of any human being, for there is none on earth to look to for counsel in doubt, comfort in sorrow, or relief in distress!”"
        vocab:
          - {w: "desdichado", d: "unhappy, unfortunate; the feminine 'desdichada' is the first sign the speaker is a woman"}
          - {w: "cuán", d: "how (before an adjective or adverb); short for 'cuanto'"}
          - {w: "risco", d: "crag, high rock"}
          - {w: "maleza", d: "thicket, scrub, undergrowth"}
          - {w: "dar lugar", d: "to give room, allow"}
          - {w: "queja", d: "complaint, lament"}
          - {w: "comunicar", d: "to share, make known"}
          - {w: "que no", d: "than; the 'no' is a pleonastic negative after a comparison, not translated"}
          - {w: "alivio", d: "relief, comfort"}
        diagram:
          - {s: "¡Ay, desdichada", r: "exclamation: alas, unhappy woman"}
          - s: "y cuán más agradable compañía harán"
            r: "main verb: and how much more pleasant company will make"
            under:
              - {s: "estos riscos y malezas", r: "subject: these crags and thickets"}
              - {s: "a mi intención", r: "to whom: to my purpose"}
              - s: "pues me darán lugar"
                r: "why: since they will give me room"
                under:
                  - {s: "para que con quejas comunique mi desgracia al cielo", r: "purpose: to tell my misfortune to heaven with complaints"}
              - s: "que no la de ningún hombre humano"
                r: "than what: than that (the company) of any human man"
                under:
                  - s: "pues no hay ninguno en la tierra"
                    r: "why: since there is none on earth"
                    under:
                      - {s: "de quien se pueda esperar consejo en las dudas, alivio en las quejas, ni remedio en los males", r: "describes 'ninguno': from whom one could hope for counsel, comfort or remedy"}
        forms:
          - {w: "desdichada", f: "desdichad- + -a → desdichado (unhappy), feminine: the speaker calls herself so."}
          - {w: "harán", f: "har- + -án → hacer (to make), future, they. Irregular stem har-: haré, harás, hará, haremos, haréis, harán."}
          - {w: "darán", f: "dar- + -án → dar (to give), future, they. The future adds -é, -ás, -á, -emos, -éis, -án to the infinitive."}
          - {w: "comunique", f: "comuniqu- + -e → comunicar (to tell), present subjunctive, I, after 'para que'. The c becomes qu before e. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "ningún", f: "ninguno clipped before a masculine singular noun ('hombre'), like un, algún, buen."}
          - {w: "hay", f: "haber (there is), the special present form used alone for 'there is / there are'."}
          - {w: "se pueda", f: "pued- + -a → poder (to be able), present subjunctive, with 'se' as 'one': 'from whom one could'. Subjunctive because no such person exists. pueda, puedas, pueda, podamos, podáis, puedan."}
  - sentences:
      - es: "Todas estas razones oyeron y percibieron el cura y los que con él estaban, y por parecerles, como ello era, que allí junto las decían, se levantaron a buscar el dueño, y no hubieron andado veinte pasos, cuando detrás de un peñasco vieron, sentado al pie de un fresno, a un mozo vestido como labrador, al cual, por tener inclinado el rostro, a causa de que se lavaba los pies en el arroyo que por allí corría, no se le pudieron ver por entonces."
        literal: "All these words heard and perceived the priest and those who with him were, and for to-seem-to-them, as it was, that there close-by them they-were-saying, they-got-up to look-for the owner, and not they-had walked twenty paces, when behind a boulder they-saw, seated at-the foot of an ash-tree, [to] a youth dressed like farm-laborer, to-the which, for to-have bent the face, because that he-was-washing-himself the feet in the brook that through there ran, not to-him it they-could see for then."
        ormsby: "All this was heard distinctly by the curate and those with him, and as it seemed to them to be uttered close by, as indeed it was, they got up to look for the speaker, and before they had gone twenty paces they discovered behind a rock, seated at the foot of an ash tree, a youth in the dress of a peasant, whose face they were unable at the moment to see as he was leaning forward, bathing his feet in the brook that flowed past."
        vocab:
          - {w: "razones", d: "words, remarks (not 'reasons')"}
          - {w: "percibir", d: "to make out, catch (a sound)"}
          - {w: "allí junto", d: "right there, close by"}
          - {w: "dueño", d: "owner; here the owner of the voice, the speaker"}
          - {w: "no hubieron andado ... cuando", d: "they had hardly gone ... when"}
          - {w: "peñasco", d: "large rock, boulder"}
          - {w: "fresno", d: "ash tree"}
          - {w: "mozo", d: "youth, lad; also a servant"}
          - {w: "labrador", d: "farmer, peasant who works the land"}
          - {w: "inclinado", d: "bent down, leaning forward"}
          - {w: "a causa de que", d: "because"}
          - {w: "arroyo", d: "brook, stream"}
          - {w: "por entonces", d: "for the moment, at that time"}
        diagram:
          - s: "oyeron y percibieron"
            r: "main verb 1: heard and made out"
            under:
              - {s: "Todas estas razones", r: "object (placed first): all these words"}
              - {s: "el cura y los que con él estaban", r: "subject: the priest and those with him"}
          - s: "se levantaron"
            r: "main verb 2 (after 'y'): they got up"
            under:
              - {s: "por parecerles, como ello era, que allí junto las decían", r: "why: because it seemed to them, as was true, that the words were spoken close by"}
              - {s: "a buscar el dueño", r: "purpose: to look for the speaker"}
          - s: "no hubieron andado veinte pasos"
            r: "main verb 3 (after 'y'): they had not gone twenty paces"
            under:
              - s: "cuando detrás de un peñasco vieron"
                r: "when: when behind a rock they saw"
                under:
                  - {s: "sentado al pie de un fresno", r: "describes 'mozo': seated at the foot of an ash"}
                  - s: "a un mozo vestido como labrador"
                    r: "object: a youth dressed as a peasant"
                    under:
                      - {s: "al cual ... no se le pudieron ver por entonces", r: "describes 'mozo': whose face they could not see just then"}
                      - {s: "por tener inclinado el rostro", r: "why: because his face was bent down"}
                      - {s: "a causa de que se lavaba los pies en el arroyo que por allí corría", r: "why: because he was washing his feet in the brook that ran there"}
        forms:
          - {w: "oyeron", f: "oy- + -eron → oír (to hear), preterite, they. The i turns to y between vowels: oí, oíste, oyó, oímos, oísteis, oyeron."}
          - {w: "percibieron", f: "percib- + -ieron → percibir (to make out), preterite, they. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "estaban", f: "est- + -aban → estar (to be), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "parecerles", f: "infinitive of parecer (to seem) + les (to them), after 'por' (because)."}
          - {w: "decían", f: "dec- + -ían → decir (to say), imperfect, they (impersonal: 'someone was saying'). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "se levantaron", f: "levant- + -aron → levantarse (to get up), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "hubieron andado", f: "hubieron = haber, preterite, they (hube, hubiste, hubo, hubimos, hubisteis, hubieron), + andado, the participle of andar (to walk): the past anterior, 'had gone', used after 'no ... cuando'."}
          - {w: "vieron", f: "vi- + -eron → ver (to see), preterite, they. vi, viste, vio, vimos, visteis, vieron."}
          - {w: "sentado, vestido", f: "participles of sentar (to seat) and vestir (to dress), masculine to match 'mozo'."}
          - {w: "se lavaba", f: "lav- + -aba → lavarse (to wash oneself), imperfect, he. Same -aba imperfect."}
          - {w: "corría", f: "corr- + -ía → correr (to run, flow), imperfect, it. Same -ía imperfect."}
          - {w: "se le pudieron ver", f: "pud- + -ieron → poder (to be able), preterite, they: 'they could see', with 'se le' meaning 'his (face)'. pude, pudiste, pudo, pudimos, pudisteis, pudieron."}
      - es: "Y ellos llegaron con tanto silencio que dél no fueron sentidos, ni él estaba a otra cosa atento que a lavarse los pies, que eran tales, que no parecían sino dos pedazos de blanco cristal que entre las otras piedras del arroyo se habían nacido."
        literal: "And they arrived with so-much silence that by-him not they-were heard, nor he was to other thing attentive than to wash-himself the feet, which were such, that not they-seemed but two pieces of white crystal that among the other stones of-the brook themselves had been-born."
        ormsby: "They approached so silently that he did not perceive them, being fully occupied in bathing his feet, which were so fair that they looked like two pieces of shining crystal brought forth among the other stones of the brook."
        vocab:
          - {w: "dél", d: "= de él; here 'by him' ('de' marks the doer of a passive)"}
          - {w: "sentir", d: "here: to hear, notice (not 'feel')"}
          - {w: "atento a", d: "attentive to, busy with"}
          - {w: "no ... sino", d: "nothing but, only"}
          - {w: "pedazo", d: "piece, bit"}
          - {w: "cristal", d: "crystal, rock crystal; a stock comparison for white skin"}
          - {w: "nacerse", d: "to have grown, sprung up (of things in nature)"}
        diagram:
          - s: "Y ellos llegaron"
            r: "main verb 1: and they came up"
