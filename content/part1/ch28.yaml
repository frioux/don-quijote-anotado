      - es: "Díjome que la noche que don Fernando se desposó con Luscinda, después de haber ella dado el sí de ser su esposa, le había tomado un recio desmayo, y que, llegando su esposo a desabrocharle el pecho para que le diese el aire, le halló un papel escrito de la misma letra de Luscinda, en que decía y declaraba que ella no podía ser esposa de don Fernando, porque lo era de Cardenio, que, a lo que el hombre me dijo, era un caballero muy principal de la mesma ciudad;"
        literal: "He-told-me that the night that Don Fernando betrothed-himself with Luscinda, after of having she given the yes of being his wife, to-her had taken a strong faint, and that, coming her husband to unbutton-for-her the breast so-that to-her might-give the air, on-her he-found a paper written in the same hand of Luscinda, in which she-said and declared that she not could be wife of Don Fernando, because it she-was of Cardenio, who, to what the man to-me said, was a gentleman very distinguished of the same city;"
        ormsby: "He said that on the night of Don Fernando’s betrothal with Luscinda, as soon as she had consented to be his bride by saying ‘Yes,’ she was taken with a sudden fainting fit, and that on the bridegroom approaching to unlace the bosom of her dress to give her air, he found a paper in her own handwriting, in which she said and declared that she could not be Don Fernando’s bride, because she was already Cardenio’s, who, according to the man’s account, was a gentleman of distinction of the same city;"
