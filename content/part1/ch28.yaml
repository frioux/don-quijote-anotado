summary: |
  The narrator opens by praising the age that produced Don Quijote, since it gave us not only his history but also the tales and episodes woven into it. He then picks up the thread: just as the priest is about to comfort Cardenio, the three men hear a sad voice lamenting nearby. Following it, they find a youth in peasant clothes sitting by a brook, washing feet as white as crystal. When the youth takes off his cap, a mass of golden hair falls down, and they see that he is a woman, and the most beautiful they have ever seen, except, Cardenio says, for Luscinda.

  Startled, she tries to run but falls on the stones. The priest calms her, notes that her hair has given away what her clothes hid, and asks to hear her story. Moved by their kindness, and wishing to protect her good name, she sits on a stone and begins.

  She is the only daughter of rich peasants, Old Christians and vassals of an Andalusian duke, who run their whole estate through her. The duke's younger son, Don Fernando, sees her and courts her with bribes, gifts, serenades and letters. She resists, and her parents propose to marry her to someone else. One night Don Fernando gets into her locked room with her maid's help. She refuses him, but he swears before an image of the Virgin to marry her, calls her maid as a witness, and she gives way. He leaves before dawn with a promise and a ring, comes once more, then stays away. At this point Cardenio learns that her name is Dorotea, and he begins to realize who she is.

  News comes that Don Fernando has married Luscinda in a nearby city. Dorotea disguises herself as a farm lad and goes there with a servant. She learns that Luscinda fainted at the wedding, that a note in her bosom said she was already Cardenio's wife, that Don Fernando tried to stab her, and that both Luscinda and Cardenio have vanished. Then a town crier offers a reward for Dorotea, and she flees into the Sierra Morena. Her servant tries to rape her and she pushes him over a cliff. She works as a herd boy for a herdsman until he too discovers she is a woman, then hides alone in the mountains, where the three men have found her.
context: |
  Rich peasants and great lords. Dorotea's family are 'labradores ricos', peasants by birth but rich enough to be slowly gaining the name of hidalgos. They are vassals of a duke who is a 'grande de España', the top rank of the nobility. Her pride as an 'Old Christian', with no Jewish or Moorish blood, was a real social asset in Cervantes' Spain, where 'limpieza de sangre' (purity of blood) was required for many offices; Ormsby notes that 'rancio' is the word for bacon or wine that has aged, and that 'hidalgo' meant a gentleman by birth and 'caballero' one by standing. Her account of running the household (oil mills, winepresses, livestock, beehives, accounts) and of her needlework, spinning and devotional reading is a picture of the ideal well-off country daughter.

  Romance and its conventions. Ormsby notes that the opening praise of 'tales and episodes' sounds as if Cervantes had doubts about placing them in the book. Dorotea's story is one of the interpolated novellas critics have argued over ever since. The discovery scene is pure pastoral romance: a disguised lady washing her feet in a brook, hair like gold, hands like snow, feet like crystal. Dorotea herself speaks in the long, balanced sentences of the courtly novel, yet her story is realistic: bribed servants, gossip, a town crier and a would-be rapist. Don Fernando is compared to Vellido Dolfos, who murdered King Sancho II at Zamora, and to Ganelon, who betrayed Roland, the two proverbial traitors of Spanish ballad.

  The narrator's games. The chapter is a story inside a story inside the history: the narrator tells what Dorotea tells, and her story finishes the one Cardenio broke off in chapters 24 and 27. The reader, like Cardenio, sees the connection when she says the names Don Fernando, Dorotea and Luscinda, and the narrator lets Cardenio's sweating, shrugging and tears do the commentary. The narrator even calls the history a thread that is combed, spun and reeled.

  Law and religion. The heart of her case is the secret promise of marriage. Before the Council of Trent (1563) a promise given before witnesses and followed by consummation counted as a valid marriage; afterwards a priest and public banns were required, but such promises still carried moral and legal weight. That is why Don Fernando swears before an image of the Virgin, why Dorotea calls her maid as an earthly witness, why she reasons that 'before God' she will be his wife, and why she hopes the 'impedimento' to his second marriage is heaven's doing. Her father's public 'pregón' offering a reward for her was the ordinary way to search for a runaway.

  Names. Dorotea means 'gift of God' in Greek; Ormsby, like most English translators, writes Dorothea. The 'zagal' who goes with her is simply a farm lad, the word used on Andalusian farms, as she explains. Ormsby's notes also gloss the 'montera', the cloth cap of peasants in central Spain, and list 'un mal llama a otro' (one misfortune calls up another) among the proverbs of the book.

  Reading Cervantes' Spanish. The chapter is dense with the old forms: mesmo, ansí, ansimesmo, estraño, estremo, efeto, recebir, reprehender, ligítimo, monesterio, dispusición, disignio, subjeto, apriesa, priesa, asconder, luengo, infelice, parasismo; fusions with 'de' (della, dello, deste, desta, destas); and the -rl- to -ll- change on infinitives (quitalle, hacella, decilla, despedille, solicitallo, decilles, oílla, dejalle). Pronouns cling to verbs that open a clause (Suspendióles, Acabóse, Decíanme, Díjome, Díjose, apretóme, echóse, templóse, rogóle). The -ra subjunctive often works as a conditional (pudieran, tuvieran, temiera, quisiera, hiciera), and the future subjunctive marks open conditions (quisierdes, quisieres, fuere, supiere, hiciere). Watch the false friends: honesto and honestidad (chaste, chastity), industria (skill), solicitud (care), puesto que (although), razones (words), hábito (dress), trabajos (troubles), calidad (rank), and pariente (relative). Note also the puns: 'cuento' as both tale and count, 'doncella' as maid and maiden, and 'despeñar y despenar'.
