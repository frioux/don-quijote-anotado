          - {w: "honra", d: "honor, reputation"}
          - {w: "república", d: "commonwealth, the state; not a republic"}
          - {w: "caballero andante", d: "knight-errant ('andante' = walking, wandering)"}
          - {w: "armas", d: "arms; here armor"}
          - {w: "ejercitarse en", d: "to practice, engage in"}
          - {w: "deshacer agravios", d: "to right wrongs ('agravio' = wrong, offense); a stock phrase of the romances"}
          - {w: "ocasión", d: "here: hazardous situation, occasion for action"}
          - {w: "cobrar fama", d: "to win fame"}
