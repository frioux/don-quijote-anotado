  - sentences:
      - es: "En resolución, él se enfrascó tanto en su letura, que se le pasaban las noches leyendo de claro en claro, y los días de turbio en turbio; y así, del poco dormir y del mucho leer, se le secó el celebro, de manera que vino a perder el juicio."
        literal: "In resolution, he himself-immersed so-much in his reading, that to-him passed the nights reading from clear to clear, and the days from murky to murky; and thus, from the little sleeping and from the much reading, to-him dried the brain, in manner that he-came to lose the judgment."
        ormsby: "In short, he became so absorbed in his books that he spent his nights from sunset to sunrise, and his days from dawn to dark, poring over them; and what with little sleep and much reading his brains got so dry that he lost his wits."
        vocab:
          - {w: "en resolución", d: "in short"}
          - {w: "enfrascarse en", d: "to become engrossed in (literally to get into a flask)"}
          - {w: "letura", d: "= lectura, reading"}
          - {w: "de claro en claro", d: "from dusk to dawn, straight through the night"}
          - {w: "de turbio en turbio", d: "from dawn to dusk (literally 'from murk to murk')"}
          - {w: "celebro", d: "= cerebro, brain"}
          - {w: "secarse", d: "to dry up"}
          - {w: "venir a + inf.", d: "to end up doing"}
        note: "Sixteenth-century medicine held that the brain needed moisture; too much study and too little sleep 'dried' it and produced madness. 'Seco de carnes' above already hinted at this dry, choleric temperament."
      - es: "Llenósele la fantasía de todo aquello que leía en los libros, así de encantamentos como de pendencias, batallas, desafíos, heridas, requiebros, amores, tormentas y disparates imposibles;"
        literal: "Filled-itself-to-him the fantasy with all that which he-read in the books, as-much of enchantments as of brawls, battles, challenges, wounds, compliments, loves, storms and absurdities impossible;"
        ormsby: "His fancy grew full of what he used to read about in his books, enchantments, quarrels, battles, challenges, wounds, wooings, loves, agonies, and all sorts of impossible nonsense;"
        vocab:
          - {w: "llenósele", d: "= se le llenó; object pronouns attached to the end of a conjugated verb, very common in Cervantes"}
          - {w: "fantasía", d: "imagination"}
          - {w: "encantamento", d: "= encantamiento, enchantment, spell"}
          - {w: "pendencia", d: "quarrel, brawl"}
          - {w: "desafío", d: "challenge, duel"}
          - {w: "tormenta", d: "storm (Ormsby reads it as 'torment')"}
          - {w: "disparate", d: "absurdity, nonsense"}
      - es: "y asentósele de tal modo en la imaginación que era verdad toda aquella máquina de aquellas sonadas soñadas invenciones que leía, que para él no había otra historia más cierta en el mundo."
        literal: "and settled-itself-to-him in such manner in the imagination that it-was truth all that machinery of those famous dreamed-up inventions that he-read, that for him not there-was other history more certain in the world."
        ormsby: "and it so possessed his mind that the whole fabric of invention and fancy he read of was true, that to him no history in the world had more reality in it."
        vocab:
          - {w: "asentarse", d: "to settle, become fixed"}
          - {w: "máquina", d: "here: contrivance, whole elaborate fabric"}
          - {w: "sonado", d: "famous, much talked-of"}
          - {w: "soñado", d: "dreamed, dreamt-up; 'sonadas soñadas' is a deliberate jingle"}
          - {w: "invención", d: "invention, fiction"}
          - {w: "historia", d: "both 'history' and 'story': Spanish has one word, a pun the whole book exploits"}
          - {w: "cierto", d: "true, certain"}
      - es: "Decía él que el Cid Ruy Díaz había sido muy buen caballero, pero que no tenía que ver con el Caballero de la Ardiente Espada, que de sólo un revés había partido por medio dos fieros y descomunales gigantes."
        literal: "Said he that the Cid Ruy Díaz had been very good knight, but that not he-had to see with the Knight of the Burning Sword, who of only one backhand had split by half two fierce and huge giants."
        ormsby: "He used to say the Cid Ruy Díaz was a very good knight, but that he was not to be compared with the Knight of the Burning Sword who with one back-stroke cut in half two fierce and monstrous giants."
        vocab:
          - {w: "el Cid Ruy Díaz", d: "Rodrigo Díaz de Vivar, the historical 11th-century Castilian hero"}
          - {w: "no tener que ver con", d: "to be nothing compared to (literally 'to have nothing to do with')"}
          - {w: "Caballero de la Ardiente Espada", d: "Knight of the Burning Sword, nickname of Amadís de Grecia"}
          - {w: "revés", d: "backhand stroke"}
          - {w: "partir por medio", d: "to split in half"}
          - {w: "fiero", d: "fierce"}
          - {w: "descomunal", d: "enormous, monstrous"}
      - es: "Mejor estaba con Bernardo del Carpio, porque en Roncesvalles había muerto a Roldán el encantado, valiéndose de la industria de Hércules, cuando ahogó a Anteo, el hijo de la Tierra, entre los brazos."
        literal: "Better he-was with Bernardo del Carpio, because in Roncesvalles he-had killed Roldán the enchanted, availing-himself of the artifice of Hercules, when he-choked Antaeus, the son of the Earth, between the arms."
        ormsby: "He thought more of Bernardo del Carpio because at Roncesvalles he slew Roland in spite of enchantments, availing himself of the artifice of Hercules when he strangled Antaeus the son of Terra in his arms."
        vocab:
          - {w: "estar mejor con", d: "to think more highly of"}
          - {w: "Bernardo del Carpio", d: "legendary Spanish hero who, in Spanish tradition, killed Roland at Roncesvalles"}
          - {w: "había muerto a", d: "had killed; 'morir' used transitively, archaic"}
          - {w: "encantado", d: "enchanted, i.e. made invulnerable by magic"}
          - {w: "valerse de", d: "to make use of"}
          - {w: "industria", d: "here: cunning, stratagem; not 'industry'"}
          - {w: "ahogar", d: "to choke, strangle, drown"}
          - {w: "Anteo", d: "Antaeus, giant invincible while touching his mother Earth; Hercules lifted him off the ground and crushed him"}
        ormsby_note: "The Spanish tradition of the battle of Roncesvalles is, of course, at variance with the Chanson de Roland, but it is somewhat nearer historical truth, inasmuch as the slaughter of Roland and the rearguard of Charlemagne's army was effected not by Saracens, but by the Basque mountaineers."
      - es: "Decía mucho bien del gigante Morgante, porque, con ser de aquella generación gigantea, que todos son soberbios y descomedidos, él solo era afable y bien criado."
        literal: "He-said much good of the giant Morgante, because, with being of that lineage gigantic, who all are arrogant and rude, he alone was affable and well raised."
        ormsby: "He approved highly of the giant Morgante, because, although of the giant breed which is always arrogant and ill-conditioned, he alone was affable and well-bred."
        vocab:
          - {w: "decir bien de", d: "to speak well of"}
