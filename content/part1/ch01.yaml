  - sentences:
      - es: "En resolución, él se enfrascó tanto en su letura, que se le pasaban las noches leyendo de claro en claro, y los días de turbio en turbio; y así, del poco dormir y del mucho leer, se le secó el celebro, de manera que vino a perder el juicio."
        literal: "In resolution, he himself-immersed so-much in his reading, that to-him passed the nights reading from clear to clear, and the days from murky to murky; and thus, from the little sleeping and from the much reading, to-him dried the brain, in manner that he-came to lose the judgment."
        ormsby: "In short, he became so absorbed in his books that he spent his nights from sunset to sunrise, and his days from dawn to dark, poring over them; and what with little sleep and much reading his brains got so dry that he lost his wits."
        vocab:
          - {w: "en resolución", d: "in short"}
          - {w: "enfrascarse en", d: "to become engrossed in (literally to get into a flask)"}
          - {w: "letura", d: "= lectura, reading"}
          - {w: "de claro en claro", d: "from dusk to dawn, straight through the night"}
          - {w: "de turbio en turbio", d: "from dawn to dusk (literally 'from murk to murk')"}
          - {w: "celebro", d: "= cerebro, brain"}
          - {w: "secarse", d: "to dry up"}
          - {w: "venir a + inf.", d: "to end up doing"}
        diagram:
          - s: "se enfrascó tanto"
            r: "main verb 1: he got so absorbed"
            under:
              - {s: "él", r: "subject, stated for emphasis"}
              - {s: "en su letura", r: "in what"}
              - {s: "que se le pasaban las noches leyendo de claro en claro, y los días de turbio en turbio", r: "result: nights and days slipped by reading"}
          - s: "se le secó el celebro"
            r: "main verb 2 (after 'y así'): and so his brain dried up"
            under:
              - {s: "del poco dormir y del mucho leer", r: "why: from little sleep and much reading"}
              - {s: "de manera que vino a perder el juicio", r: "result: so that he lost his mind"}
        forms:
          - {w: "se enfrascó", f: "enfrasc- + -ó → enfrascarse en (to get absorbed in), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (the 1st sg. is 'enfrasqué')."}
          - {w: "letura", f: "= lectura."}
          - {w: "se le pasaban", f: "pas- + -aban → pasar (to pass), imperfect, they (the nights); 'se' makes it 'go by' and 'le' = on him. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "leyendo", f: "le- + -yendo → gerund of leer (to read): 'reading'; -iendo is spelled -yendo between vowels."}
          - {w: "el poco dormir, el mucho leer", f: "infinitives (dormir = to sleep, leer = to read) used as nouns, with article and adjective: 'the little sleeping', 'the much reading'."}
          - {w: "del", f: "de + el."}
          - {w: "se le secó", f: "sec- + -ó → secar (to dry), preterite, it; 'se' = dried up, 'le' = on him. Same -ar preterite."}
          - {w: "celebro", f: "= cerebro."}
          - {w: "vino", f: "vin- + -o → venir (to come), preterite, he; 'venir a' + infinitive = to end up doing. Irregular stem: vine, viniste, vino, vinimos, vinisteis, vinieron."}
          - {w: "perder", f: "infinitive (to lose) after 'a'."}
        note: "Sixteenth-century medicine held that the brain needed moisture; too much study and too little sleep 'dried' it and produced madness. 'Seco de carnes' above already hinted at this dry, choleric temperament."
