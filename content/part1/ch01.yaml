      - es: "Diera él, por dar una mano de coces al traidor de Galalón, al ama que tenía, y aun a su sobrina de añadidura."
        literal: "Would-give he, for giving a hand of kicks to the traitor of Galalón, the housekeeper that he-had, and even his niece of addition."
