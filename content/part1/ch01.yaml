summary: |
  An unnamed gentleman of about fifty lives in an unnamed village of La Mancha. He is an hidalgo, the lowest rung of the nobility, and a poor one: three-quarters of his income goes on a thin diet, he keeps a housekeeper, a niece, one servant, a skinny nag and a greyhound, and his surname is uncertain (Quijada, Quesada or Quejana).

  He reads romances of chivalry obsessively, sells farmland to buy more, argues with the village priest and barber about which fictional knight is greatest, and finally, from too much reading and too little sleep, his brain dries out and he goes mad. He believes the books are true history and decides to become a knight-errant himself, to right wrongs and win eternal fame.

  He cleans his great-grandfather's rusted armor and patches a pasteboard visor onto its open helmet. The visor fails its first sword test; he rebuilds it with iron bars and prudently declines to test it again. After four days he names his nag Rocinante, after eight more he names himself Don Quijote de la Mancha, and, since a knight-errant must have a lady, he settles on a farm girl from a nearby village whom he once admired from afar, Aldonza Lorenzo, and renames her Dulcinea del Toboso. He rehearses the speech a conquered giant will make to her.
context: |
  The hidalgo. An hidalgo was a member of the untitled lower nobility, exempt from taxes and forbidden by pride from manual work or trade. Many were poor. The famous diet paragraph is a precise class marker: beef was cheaper than mutton, lentils were fast-day food for Fridays, 'duelos y quebrantos' was a cheap Saturday dish permitted on a day of semi-abstinence in Castile, and a pigeon was a Sunday luxury. His clothes tell the same story: fine broadcloth and velvet only for feast days, undyed homespun during the week. Keeping a lance, a shield, a horse and a hunting greyhound is what marks him as gentry at all.

  The romances of chivalry. Amadís de Gaula (1508), its many sequels (several by Feliciano de Silva), Palmerín de Inglaterra, Belianís de Grecia and the Caballero del Febo were the bestsellers of sixteenth-century Spain, condemned by moralists as lies that corrupted readers. Cervantes said in his prologue that his purpose was to destroy the authority of these books. By 1605 the genre was already dying, so the parody is partly affectionate. The two quotations Don Quijote admires are real, lightly altered, and were already notorious as examples of bad style. The Carolingian names (Roldán, Bernardo del Carpio, Reinaldos de Montalbán, Galalón, Morgante) come from Spanish ballads and Italian epics, which he ranks alongside the historical Cid as if all were equally true. This confusion of 'historia' (which means both history and story) is the seed of his madness.

  The narrator's game. 'The authors who write of this case', 'this so true history', 'as has been said': Cervantes imitates the pose of the romances, which claimed to be translations of ancient chronicles. The fictional Arabic historian Cide Hamete Benengeli will appear in Chapter 9 and take this joke much further. The narrator's refusal to name the village, and his inability to settle the hero's surname, are part of the same mock-scholarship.

  Madness and medicine. Renaissance medicine followed Galen: the brain needed moisture, and sleeplessness and hard study dried it out, producing mania. Cervantes' description is medically orthodox for its time. The hidalgo's lean, dry build ('seco de carnes, enjuto de rostro') already suggests the choleric temperament prone to this.

  The names. Quijada is a jawbone and quesada a cheesecake. A quijote is the piece of armor over the thigh, and the suffix -ote is comic and slightly ridiculous. Rocinante fuses 'rocín' (nag) with 'antes' (before): formerly a nag, and first among nags. Dulcinea is built on 'dulce' (sweet) in the manner of pastoral heroines like Melibea, while Aldonza was proverbially a coarse country name. Caraculiambro combines 'face' and 'backside', Malindrania comes from 'scoundrel', and 'ínsula' is the pompous Latin word for island that the romances used; Sancho Panza will spend the rest of the book hoping to govern one.

  Knight-errantry as a checklist. Armor, horse, a resounding name, and a lady to serve are the formal requirements of the genre, and Don Quijote assembles them one by one. He forgets that a knight must be dubbed by another knight, which becomes the plot of Chapter 3. His plan to send defeated giants to kneel before his lady is exactly what happens in Amadís.

  Reading Cervantes' Spanish. Expect these archaisms throughout: initial f- for modern h- (fermosura); contractions of 'de' with pronouns (della, dél, deste, desta, dellos, dello); object pronouns attached to conjugated verbs (Llenósele, Limpiólas, Decíase, Llamábase, Imaginábase); the -ra form of the subjunctive used as a conditional or pluperfect (hiciera, diera, saliera); 'ha' for 'hace' in time expressions; and older spellings such as mesmo, ansí, efeto, estraño, letura, celebro, recebir, priesa, luengo, lantejas, entricado, encantamento. Ormsby's translation is faithful but Victorian; where the literal gloss and Ormsby disagree, the gloss follows the Spanish.
