      - es: "Pero, sobre todos, estaba bien con Reinaldos de Montalbán, y más cuando le veía salir de su castillo y robar cuantos topaba, y cuando en allende robó aquel ídolo de Mahoma que era todo de oro, según dice su historia."
        literal: "But, above all, he-was well with Reinaldos of Montalbán, and more when him he-saw go-out from his castle and rob as-many-as he-ran-into, and when in over-there he-stole that idol of Mohammed that was all of gold, according-to says his history."
        ormsby: "But above all he admired Reinaldos of Montalban, especially when he saw him sallying forth from his castle and robbing everyone he met, and when beyond the seas he stole that image of Mahomet which, as his history says, was entirely of gold."
