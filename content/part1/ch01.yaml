  - sentences:
      - es: "Con estas razones perdía el pobre caballero el juicio, y desvelábase por entenderlas y desentrañarles el sentido, que no se lo sacara ni las entendiera el mesmo Aristóteles, si resucitara para sólo ello."
        literal: "With these reasonings lost the poor gentleman the judgment, and kept-himself-awake to understand-them and dis-entrail-from-them the sense, which not it would-have-extracted nor them would-have-understood the same Aristotle, if he-rose-from-the-dead for only that."
        ormsby: "Over conceits of this sort the poor gentleman lost his wits, and used to lie awake striving to understand them and worm the meaning out of them; what Aristotle himself could not have made out or extracted had he come to life again for that special purpose."
        vocab:
          - {w: "razones", d: "sentences, arguments"}
          - {w: "caballero", d: "gentleman; also 'knight'. The book plays on both senses from here on"}
          - {w: "perder el juicio", d: "to lose one's mind; 'juicio' = judgment, sanity"}
          - {w: "desvelarse por", d: "to lose sleep over, strive to"}
          - {w: "desentrañar", d: "to unravel, get to the bottom of; literally 'disembowel'"}
          - {w: "sacar", d: "to extract, get out"}
          - {w: "el mesmo Aristóteles", d: "Aristotle himself"}
          - {w: "resucitar", d: "to rise from the dead"}
          - {w: "para sólo ello", d: "for that alone"}
        diagram:
          - s: "perdía"
            r: "main verb 1: was losing"
            under:
              - {s: "el pobre caballero", r: "subject"}
              - {s: "el juicio", r: "object: his mind"}
              - {s: "Con estas razones", r: "over what: these sentences"}
          - s: "y desvelábase"
            r: "main verb 2: he kept himself awake"
            under:
              - {s: "por entenderlas", r: "why: to understand them"}
              - s: "y desentrañarles el sentido"
                r: "why: and dig the meaning out of them"
                under:
                  - s: "que no se lo sacara ni las entendiera el mesmo Aristóteles"
                    r: "loose 'que': a meaning Aristotle himself could not have got out"
                    under:
                      - {s: "si resucitara para sólo ello", r: "condition: if he came back to life just for that"}
        forms:
          - {w: "estas", f: "est- + -as → 'these', feminine plural to match 'razones'."}
          - {w: "perdía", f: "perd- + -ía → perder (to lose), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "desvelábase", f: "desvel- + -aba + se → desvelar (to keep awake) with 'se' (himself) stuck on the end: 'kept himself awake'. Cervantes hangs pronouns on the end of a conjugated verb that opens its clause; modern Spanish says 'se desvelaba'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "entenderlas", f: "entender (to understand) + las (them: the razones, feminine plural)."}
          - {w: "desentrañarles", f: "desentrañar (to unravel) + les (from them)."}
          - {w: "sacara", f: "sac- + -ara → sacar (to get out), imperfect subjunctive (-ra form), he: here 'would have got out'. Built on the 3rd pl. preterite (sacaron → saca-): sacara, sacaras, sacara, sacáramos, sacarais, sacaran. Cervantes uses the -ra form where modern Spanish says 'habría sacado'."}
          - {w: "se lo", f: "'se' stands in for 'les' (to them, the sentences), because le / les turns into 'se' before lo / la / los / las; 'lo' = it (the meaning)."}
          - {w: "entendiera", f: "entend- + -iera → entender, imperfect subjunctive (-ra), he: 'would have understood'. entendieron → entendiera."}
          - {w: "las", f: "them (the razones)."}
          - {w: "mesmo", f: "= mismo; before a name = 'himself'."}
          - {w: "resucitara", f: "resucit- + -ara → resucitar (to rise from the dead), imperfect subjunctive (-ra), he: 'if he were to come back'. After 'si' the -ra form is the normal counterfactual, as in modern Spanish."}
          - {w: "ello", f: "neuter 'it / that' for an idea."}
