        forms:
          - {w: "Puesto", f: "the irregular participle of poner (to put), masculine to match 'nombre'; a participle set beside its own noun: 'a name having been given'."}
          - {w: "quiso", f: "quis- + -o → querer (to want), preterite, he: quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "ponérsele", f: "poner + se (to himself) + le (it, the name): two pronouns on the infinitive, with an accent added."}
          - {w: "sí mismo", f: "'himself' after a preposition ('sí' with the accent), strengthened by 'mismo'."}
          - {w: "este", f: "'this', masculine to match 'pensamiento'."}
          - {w: "duró", f: "dur- + -ó → durar (to last), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "otros", f: "otr- + -os → 'another', masculine plural before a number, with no 'un'."}
          - {w: "se vino a llamar", f: "vin- + -o → venir (to come), preterite, he, with 'se' belonging to llamarse (to be called): 'came to be called'. The pronoun may sit before 'vino' or on 'llamar'. venir: vine, viniste, vino, vinimos, vinisteis, vinieron."}
        ormsby_note: "Quixote, or, as it is now written, Quijote, means the piece of armor that protects the thigh (cuissan, cuish). Smollett's Sir Lancelot Greaves is a kind of parody on the name. Quixada and Quesada were both distinguished family names. The Governor of the Goletta, who was one of the passengers on board the unfortunate Sol galley, was a Quesada; and the faithful majordomo of Charles V and guardian of Don John of Austria was a Quixada."
