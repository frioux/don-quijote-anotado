  - sentences:
      - es: "Puesto nombre, y tan a su gusto, a su caballo, quiso ponérsele a sí mismo, y en este pensamiento duró otros ocho días, y al cabo se vino a llamar don Quijote;"
        literal: "Put name, and so to his taste, to his horse, he-wanted to put-it-to himself, and in this thought he-lasted other eight days, and at the end himself he-came to call Don Quijote;"
        ormsby: "Having got a name for his horse so much to his taste, he was anxious to get one for himself, and he was eight days more pondering over this point, till at last he made up his mind to call himself \"Don Quixote,\""
        vocab:
          - {w: "puesto nombre", d: "the name having been given; absolute participle, a Latinate construction Cervantes likes"}
          - {w: "a su gusto", d: "to his liking"}
          - {w: "ponérsele", d: "to give one (a name) to himself"}
