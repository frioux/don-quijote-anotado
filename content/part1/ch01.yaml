  - sentences:
      - es: "Fue luego a ver su rocín, y, aunque tenía más cuartos que un real y más tachas que el caballo de Gonela, que tantum pellis et ossa fuit, le pareció que ni el Bucéfalo de Alejandro ni Babieca el del Cid con él se igualaban."
        literal: "He-went next to see his nag, and, although it-had more quarters than a real and more blemishes than the horse of Gonela, which 'only skin and bones was', to-him it-seemed that neither the Bucephalus of Alexander nor Babieca the [one] of the Cid with him equaled-themselves."
        ormsby: "He next proceeded to inspect his hack, which, with more quartos than a real and more blemishes than the steed of Gonela, that \"tantum pellis et ossa fuit,\" surpassed in his eyes the Bucephalus of Alexander or the Babieca of the Cid."
        vocab:
          - {w: "luego", d: "here: next, then (today usually 'later')"}
          - {w: "cuarto", d: "a crack in a horse's hoof; also a copper coin worth 1/8 of a real, hence the pun"}
          - {w: "real", d: "silver coin"}
          - {w: "tacha", d: "flaw, blemish"}
          - {w: "Gonela", d: "Italian court jester famous for his bag-of-bones horse"}
          - {w: "tantum pellis et ossa fuit", d: "Latin: 'it was only skin and bones'"}
          - {w: "Bucéfalo", d: "Bucephalus, Alexander the Great's horse"}
          - {w: "Babieca", d: "the Cid's horse"}
          - {w: "igualarse con", d: "to be equal to"}
        ormsby_note: "An untranslatable pun on the word quarto, which means a sand-crack in a horse's hoof, as well as the coin equal to one-eighth of the real. Gonela, or Gonnella, was a jester in the service of Borso, Duke of Ferrara (1450-1470). A book of the jests attributed to him was printed in 1568, the year before Cervantes went to Italy."
