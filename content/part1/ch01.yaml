part: 1
chapter: 1
title_es: "Capítulo primero. Que trata de la condición y ejercicio del famoso hidalgo don Quijote de la Mancha"
title_en: "Which treats of the character and pursuits of the famous gentleman Don Quixote of La Mancha"
paragraphs:
  - sentences:
      - es: "En un lugar de la Mancha, de cuyo nombre no quiero acordarme, no ha mucho tiempo que vivía un hidalgo de los de lanza en astillero, adarga antigua, rocín flaco y galgo corredor."
        literal: "In a place of La Mancha, of whose name not I-want to-remember-myself, not [it] has much time that lived a hidalgo of those of lance in rack, buckler old, nag skinny and greyhound runner."
        ormsby: "In a village of La Mancha, the name of which I have no desire to call to mind, there lived not long since one of those gentlemen that keep a lance in the lance-rack, an old buckler, a lean hack, and a greyhound for coursing."
        vocab:
          - {w: "lugar", d: "place; in Cervantes' time also 'village, small town', which is the sense here"}
          - {w: "cuyo", d: "whose"}
          - {w: "acordarse de", d: "to remember; 'no quiero acordarme' = I don't care to recall"}
          - {w: "no ha mucho tiempo", d: "not long ago; 'ha' is the old form of 'hace'"}
          - {w: "hidalgo", d: "minor untitled nobleman, from 'hijo de algo' (son of something)"}
          - {w: "de los de", d: "one of those with"}
          - {w: "lanza", d: "lance"}
          - {w: "astillero", d: "lance rack (today the word means 'shipyard')"}
          - {w: "adarga", d: "oval leather shield of Moorish origin"}
          - {w: "rocín", d: "workhorse, nag"}
          - {w: "flaco", d: "skinny, lean"}
          - {w: "galgo", d: "greyhound"}
          - {w: "corredor", d: "running, i.e. kept for coursing hares"}
        note: "The most famous opening line in Spanish literature. The narrator's refusal to name the village is a joke at the expense of chivalric romances, which always name everything grandly. Ormsby's own note on this sentence simply points to his preface, where he discusses the tradition that the village is Argamasilla de Alba."
      - es: "Una olla de algo más vaca que carnero, salpicón las más noches, duelos y quebrantos los sábados, lantejas los viernes, algún palomino de añadidura los domingos, consumían las tres partes de su hacienda."
        literal: "A pot of somewhat more cow than mutton, salpicón the most nights, griefs and breakings the Saturdays, lentils the Fridays, some squab of addition the Sundays, consumed the three parts of his estate."
        ormsby: "An olla of rather more beef than mutton, a salad on most nights, scraps on Saturdays, lentils on Fridays, and a pigeon or so extra on Sundays, made away with three-quarters of his income."
        vocab:
          - {w: "olla", d: "stew pot, and the stew cooked in it (Spain's national dish)"}
          - {w: "vaca", d: "beef (literally 'cow'); cheaper than mutton at the time"}
          - {w: "carnero", d: "mutton (literally 'ram')"}
          - {w: "salpicón", d: "cold dish of minced leftover meat with onion, oil and vinegar"}
          - {w: "las más noches", d: "most nights"}
          - {w: "duelos y quebrantos", d: "literally 'griefs and breakings'; a cheap dish of eggs with bacon or offal, see Ormsby's note"}
          - {w: "lantejas", d: "= lentejas, lentils"}
          - {w: "palomino", d: "young pigeon, squab"}
          - {w: "de añadidura", d: "as an extra, into the bargain"}
          - {w: "las tres partes", d: "three parts (of four), i.e. three-quarters"}
          - {w: "hacienda", d: "estate, property, income"}
        ormsby_note: "The national dish, the olla, of which the puchero of Central and Northern Spain is a poor relation, is a stew with beef, bacon, sausage, chickpeas, and cabbage for its prime constituents, and for ingredients any other meat or vegetable that may be available. There is nothing exceptional in Don Quixote's olla being more a beef than a mutton one, for mutton is scarce in Spain except in the mountain districts. Salpicon (salad) is meat minced with red peppers, onions, oil, and vinegar, and is in fact a sort of meat salad. Duelos y quebrantos, the title of the Don's Saturday dish, would be a puzzle even to the majority of Spanish readers were it not for Pellicer's explanation. In the cattle-feeding districts of Spain, the carcasses of animals that came to an untimely end were converted into salt meat, and the parts unfit for that purpose were sold cheap under the name of duelos y quebrantos, 'sorrows and losses' (literally 'breakings'), and were held to be sufficiently unlike meat to be eaten on days when flesh was forbidden, among which in Castile Saturday was included in commemoration of the battle of Navas de Tolosa. Any rendering of such a phrase must necessarily be unsatisfactory, and in adopting 'scraps' I have, as in the other cases, merely gone on the principle of choosing the least of evils."
      - es: "El resto della concluían sayo de velarte, calzas de velludo para las fiestas, con sus pantuflos de lo mesmo, y los días de entresemana se honraba con su vellorí de lo más fino."
        literal: "The rest of-it finished-off tunic of fine-broadcloth, breeches of velvet for the feast-days, with their slippers of the same, and the days of mid-week he-honored-himself with his homespun of the most fine."
        ormsby: "The rest of it went in a doublet of fine cloth and velvet breeches and shoes to match for holidays, while on weekdays he made a brave figure in his best homespun."
        vocab:
          - {w: "della", d: "= de ella, 'of it'; Cervantes contracts de + ella/él/este/ellos constantly (della, dél, deste, dellos)"}
          - {w: "concluir", d: "here: to use up, finish off"}
          - {w: "sayo", d: "loose tunic or doublet"}
          - {w: "velarte", d: "fine black broadcloth"}
          - {w: "calzas", d: "breeches, hose"}
          - {w: "velludo", d: "velvet (literally 'hairy')"}
          - {w: "fiestas", d: "feast days, holidays"}
          - {w: "pantuflos", d: "slippers, soft indoor shoes"}
          - {w: "mesmo", d: "= mismo, 'same'; archaic form used throughout"}
          - {w: "entresemana", d: "weekdays, midweek"}
          - {w: "honrarse con", d: "to do oneself proud with, to dress up in"}
          - {w: "vellorí", d: "undyed grey homespun wool"}
      - es: "Tenía en su casa una ama que pasaba de los cuarenta, y una sobrina que no llegaba a los veinte, y un mozo de campo y plaza, que así ensillaba el rocín como tomaba la podadera."
        literal: "He-had in his house a housekeeper who passed of the forty, and a niece who not arrived at the twenty, and a lad of field and square, who as-much saddled the nag as took-up the pruning-hook."
        ormsby: "He had in his house a housekeeper past forty, a niece under twenty, and a lad for the field and marketplace, who used to saddle the hack as well as handle the billhook."
        vocab:
          - {w: "ama", d: "housekeeper (also 'mistress of the house', 'wet-nurse')"}
          - {w: "pasar de", d: "to be over (an age)"}
          - {w: "sobrina", d: "niece"}
          - {w: "no llegar a", d: "to not reach, be under"}
          - {w: "mozo", d: "lad, young servant"}
          - {w: "plaza", d: "town square, market"}
          - {w: "así ... como", d: "as much ... as, both ... and"}
          - {w: "ensillar", d: "to saddle"}
          - {w: "podadera", d: "pruning hook, billhook"}
      - es: "Frisaba la edad de nuestro hidalgo con los cincuenta años; era de complexión recia, seco de carnes, enjuto de rostro, gran madrugador y amigo de la caza."
        literal: "Bordered the age of our hidalgo with the fifty years; he-was of constitution robust, dry of fleshes, lean of face, great early-riser and friend of the hunt."
        ormsby: "The age of this gentleman of ours was bordering on fifty; he was of a hardy habit, spare, gaunt-featured, a very early riser and a great sportsman."
        vocab:
          - {w: "frisar con", d: "to border on, approach (an age)"}
          - {w: "complexión", d: "constitution, physical build; a false friend, not 'complexion'"}
          - {w: "recio", d: "robust, tough, sturdy"}
          - {w: "seco de carnes", d: "spare, lean of flesh"}
          - {w: "enjuto", d: "lean, gaunt, dried-out"}
          - {w: "rostro", d: "face"}
          - {w: "madrugador", d: "early riser (madrugar = to get up early)"}
          - {w: "amigo de", d: "fond of"}
          - {w: "caza", d: "hunting"}
      - es: "Quieren decir que tenía el sobrenombre de Quijada, o Quesada, que en esto hay alguna diferencia en los autores que deste caso escriben; aunque, por conjeturas verosímiles, se deja entender que se llamaba Quejana."
        literal: "They-want to-say that he-had the surname of Quijada, or Quesada, that in this there-is some difference in the authors who of-this case write; although, by conjectures plausible, it lets-itself understand that he-was-called Quejana."
        ormsby: "They will have it his surname was Quixada or Quesada (for here there is some difference of opinion among the authors who write on the subject), although from reasonable conjectures it seems plain that he was called Quexana."
        vocab:
          - {w: "querer decir", d: "to mean; here impersonal 'they claim, it is said'"}
          - {w: "sobrenombre", d: "surname, byname"}
          - {w: "quijada", d: "jaw, jawbone (as a common noun)"}
          - {w: "quesada", d: "cheesecake (as a common noun)"}
          - {w: "deste", d: "= de este"}
          - {w: "caso", d: "matter, case"}
          - {w: "verosímil", d: "plausible, likely"}
          - {w: "dejarse entender", d: "to be inferred, to be understood"}
        note: "First appearance of the mock-scholarly pose: the narrator pretends to be reconciling earlier 'authors' as if this were a real chronicle. The candidate surnames are also jokes: a quijada is a jawbone and a quesada a cheesecake."
      - es: "Pero esto importa poco a nuestro cuento; basta que en la narración dél no se salga un punto de la verdad."
        literal: "But this matters little to our tale; [it] suffices that in the narration of-it not one-departs a point from the truth."
        ormsby: "This, however, is of but little importance to our tale; it will be enough not to stray a hair's breadth from the truth in the telling of it."
        vocab:
          - {w: "importar", d: "to matter"}
          - {w: "cuento", d: "tale, story"}
          - {w: "bastar", d: "to suffice; 'basta que' = it is enough that"}
          - {w: "dél", d: "= de él, 'of it'"}
          - {w: "salirse de", d: "to depart from, stray from"}
          - {w: "un punto", d: "one jot, a hair's breadth"}
  - sentences:
      - es: "Es, pues, de saber que este sobredicho hidalgo, los ratos que estaba ocioso, que eran los más del año, se daba a leer libros de caballerías, con tanta afición y gusto, que olvidó casi de todo punto el ejercicio de la caza, y aun la administración de su hacienda."
        literal: "It-is, then, to know that this above-said hidalgo, the whiles that he-was idle, which were the most of the year, gave-himself to read books of chivalries, with such fondness and pleasure, that he-forgot almost of all point the exercise of the hunt, and even the administration of his estate."
        ormsby: "You must know, then, that the above-named gentleman whenever he was at leisure (which was mostly all the year round) gave himself up to reading books of chivalry with such ardour and avidity that he almost entirely neglected the pursuit of his field-sports, and even the management of his property;"
        vocab:
          - {w: "es de saber", d: "be it known, you must know"}
          - {w: "pues", d: "then, well; a connective, not 'because' here"}
          - {w: "sobredicho", d: "aforesaid, above-mentioned"}
          - {w: "rato", d: "a while, spell of time"}
          - {w: "ocioso", d: "idle, at leisure"}
          - {w: "darse a", d: "to give oneself over to, take up"}
          - {w: "libros de caballerías", d: "romances of chivalry, the genre being parodied"}
          - {w: "afición", d: "fondness, enthusiasm"}
          - {w: "de todo punto", d: "entirely, completely"}
          - {w: "aun", d: "even (no accent; 'aún' with accent means 'still')"}
      - es: "Y llegó a tanto su curiosidad y desatino en esto, que vendió muchas hanegas de tierra de sembradura para comprar libros de caballerías en que leer, y así, llevó a su casa todos cuantos pudo haber dellos;"
        literal: "And arrived at so-much his curiosity and folly in this, that he-sold many fanegas of land of sowing to buy books of chivalries in which to-read, and thus, he-carried to his house all as-many-as he-could get of-them;"
        ormsby: "and to such a pitch did his eagerness and infatuation go that he sold many an acre of tillageland to buy books of chivalry to read, and brought home as many of them as he could get."
        vocab:
          - {w: "llegar a tanto", d: "to reach such a pitch"}
          - {w: "curiosidad", d: "here: eager interest, not idle curiosity"}
          - {w: "desatino", d: "folly, foolishness"}
          - {w: "hanega", d: "= fanega, a land measure of roughly 1.5 acres (also a grain measure)"}
          - {w: "tierra de sembradura", d: "arable land, sown land"}
          - {w: "todos cuantos", d: "all that, as many as"}
          - {w: "haber", d: "here in its old sense 'to get hold of, obtain'"}
          - {w: "dellos", d: "= de ellos"}
      - es: "y de todos, ningunos le parecían tan bien como los que compuso el famoso Feliciano de Silva, porque la claridad de su prosa y aquellas entricadas razones suyas le parecían de perlas, y más cuando llegaba a leer aquellos requiebros y cartas de desafíos, donde en muchas partes hallaba escrito:"
        literal: "and of all, none to-him seemed so well as those that composed the famous Feliciano de Silva, because the clarity of his prose and those intricate reasonings of-his to-him seemed of pearls, and more when he-came to read those compliments and letters of challenges, where in many parts he-found written:"
        ormsby: "But of all there were none he liked so well as those of the famous Feliciano de Silva's composition, for their lucidity of style and complicated conceits were as pearls in his sight, particularly when in his reading he came upon courtships and cartels, where he often found passages like"
        vocab:
          - {w: "parecer bien", d: "to seem good, to please"}
          - {w: "componer", d: "to compose, write"}
          - {w: "Feliciano de Silva", d: "prolific 16th-century author of sequels to Amadís, famous for his tortured style"}
          - {w: "entricado", d: "= intrincado, intricate, convoluted"}
          - {w: "razones", d: "here: sentences, arguments, turns of phrase"}
          - {w: "parecer de perlas", d: "to seem perfect, 'like pearls'"}
          - {w: "requiebro", d: "flirtatious compliment, gallantry"}
          - {w: "carta de desafío", d: "letter of challenge, cartel"}
          - {w: "hallar", d: "to find"}
      - es: "La razón de la sinrazón que a mi razón se hace, de tal manera mi razón enflaquece, que con razón me quejo de la vuestra fermosura."
        literal: "The reason of the unreason that to my reason is done, in such manner my reason weakens, that with reason I complain of the your beauty."
        ormsby: "\"the reason of the unreason with which my reason is afflicted so weakens my reason that with reason I murmur at your beauty;\""
        vocab:
          - {w: "razón", d: "reason, in several senses at once: rationale, mind, justification"}
          - {w: "sinrazón", d: "unreason, injustice, wrong"}
          - {w: "enflaquecer", d: "to weaken, grow thin"}
          - {w: "con razón", d: "rightly, with good reason"}
          - {w: "quejarse de", d: "to complain of"}
          - {w: "la vuestra fermosura", d: "your beauty; 'fermosura' is archaic 'hermosura' with the old initial f-, and the article before 'vuestra' is deliberately antique"}
        note: "A near-quotation from Feliciano de Silva, chosen because it is almost meaningless. The joke is the mannered style of the romances, not its content."
      - es: "Y también cuando leía: ...los altos cielos que de vuestra divinidad divinamente con las estrellas os fortifican, y os hacen merecedora del merecimiento que merece la vuestra grandeza."
        literal: "And also when he-read: ...the high heavens that of your divinity divinely with the stars you fortify, and you make deserving of the desert that deserves the your greatness."
        ormsby: "or again, \"the high heavens, that of your divinity divinely fortify you with the stars, render you deserving of the desert your greatness deserves.\""
        vocab:
          - {w: "cielos", d: "heavens"}
          - {w: "divinidad", d: "divinity"}
          - {w: "fortificar", d: "to fortify, strengthen"}
          - {w: "merecedor, -a", d: "deserving"}
          - {w: "merecimiento", d: "merit, desert (what one deserves)"}
          - {w: "merecer", d: "to deserve"}
          - {w: "grandeza", d: "greatness, grandeur; also the rank of the highest nobility (grandes)"}
        ormsby_note: "The first passage quoted is from the Chronicle of Don Florisel de Niquea, by Feliciano de Silva, the volumes of which appeared in 1532, 1536, and 1551, and from the tenth and eleventh books of the Amadís series. The second is from Olivante de Laura, by Torquemada (1564). Clemencín points out that the first passage had been previously picked out as a sample of the absurdity of the school, by Diego Hurtado de Mendoza."
  - sentences:
      - es: "Con estas razones perdía el pobre caballero el juicio, y desvelábase por entenderlas y desentrañarles el sentido, que no se lo sacara ni las entendiera el mesmo Aristóteles, si resucitara para sólo ello."
        literal: "With these reasonings lost the poor gentleman the judgment, and kept-himself-awake to understand-them and dis-entrail-from-them the sense, which not it would-have-extracted nor them would-have-understood the same Aristotle, if he-rose-from-the-dead for only that."
        ormsby: "Over conceits of this sort the poor gentleman lost his wits, and used to lie awake striving to understand them and worm the meaning out of them; what Aristotle himself could not have made out or extracted had he come to life again for that special purpose."
        vocab:
          - {w: "razones", d: "sentences, arguments"}
          - {w: "caballero", d: "gentleman; also 'knight'. The book plays on both senses from here on"}
          - {w: "perder el juicio", d: "to lose one's mind; 'juicio' = judgment, sanity"}
          - {w: "desvelarse por", d: "to lose sleep over, strive to"}
          - {w: "desentrañar", d: "to unravel, get to the bottom of; literally 'disembowel'"}
          - {w: "sacar", d: "to extract, get out"}
          - {w: "el mesmo Aristóteles", d: "Aristotle himself"}
          - {w: "resucitar", d: "to rise from the dead"}
          - {w: "para sólo ello", d: "for that alone"}
      - es: "No estaba muy bien con las heridas que don Belianís daba y recebía, porque se imaginaba que, por grandes maestros que le hubiesen curado, no dejaría de tener el rostro y todo el cuerpo lleno de cicatrices y señales."
        literal: "Not he-was very well with the wounds that Don Belianís gave and received, because he-imagined that, for great masters that him might-have cured, not he-would-cease to have the face and all the body full of scars and marks."
        ormsby: "He was not at all easy about the wounds which Don Belianis gave and took, because it seemed to him that, great as were the surgeons who had cured him, he must have had his face and body covered all over with seams and scars."
        vocab:
          - {w: "no estar bien con", d: "to be uneasy about, not to approve of"}
          - {w: "herida", d: "wound"}
          - {w: "recebir", d: "= recibir"}
          - {w: "por ... que", d: "however ...: 'por grandes maestros que' = however great the surgeons"}
          - {w: "maestro", d: "master; here a master surgeon"}
          - {w: "no dejar de", d: "to not fail to; 'no dejaría de tener' = he could not fail to have"}
          - {w: "cicatriz", d: "scar"}
          - {w: "señal", d: "mark"}
        ormsby_note: "The History of Don Belianis de Grecia, by the Licentiate Jerónimo Fernández, 1547. It has been by some included in the Amadís series, but it is in reality an independent romance."
      - es: "Pero, con todo, alababa en su autor aquel acabar su libro con la promesa de aquella inacabable aventura, y muchas veces le vino deseo de tomar la pluma y dalle fin al pie de la letra, como allí se promete;"
        literal: "But, with all, he-praised in its author that finishing his book with the promise of that unfinishable adventure, and many times to-him came desire of taking the pen and giving-it end to the foot of the letter, as there is-promised;"
        ormsby: "He commended, however, the author's way of ending his book with the promise of that interminable adventure, and many a time was he tempted to take up his pen and finish it properly as is there proposed,"
        vocab:
          - {w: "con todo", d: "all the same, nevertheless"}
          - {w: "alabar", d: "to praise"}
          - {w: "aquel acabar", d: "that way of ending (infinitive used as a noun)"}
          - {w: "inacabable", d: "endless, unfinishable; puns on 'acabar'"}
          - {w: "venirle deseo a uno", d: "to feel a desire"}
          - {w: "pluma", d: "pen (literally 'feather')"}
          - {w: "dalle", d: "= darle; old assimilation of infinitive + le"}
          - {w: "dar fin a", d: "to finish"}
          - {w: "al pie de la letra", d: "to the letter, exactly as written"}
      - es: "y sin duda alguna lo hiciera, y aun saliera con ello, si otros mayores y continuos pensamientos no se lo estorbaran."
        literal: "and without doubt any it he-would-have-done, and even would-have-come-out with it, if other greater and continuous thoughts not to-him it had-hindered."
        ormsby: "which no doubt he would have done, and made a successful piece of work of it too, had not greater and more absorbing thoughts prevented him."
        vocab:
          - {w: "sin duda alguna", d: "without any doubt"}
          - {w: "hiciera / saliera / estorbaran", d: "-ra subjunctive used as conditional and pluperfect ('would have done'), very common in Golden Age Spanish"}
          - {w: "salir con", d: "to succeed at, pull off"}
          - {w: "estorbar", d: "to hinder, get in the way of"}
      - es: "Tuvo muchas veces competencia con el cura de su lugar —que era hombre docto, graduado en Sigüenza—, sobre cuál había sido mejor caballero: Palmerín de Ingalaterra o Amadís de Gaula;"
        literal: "He-had many times contest with the priest of his village —who was man learned, graduated in Sigüenza—, over which had been better knight: Palmerín of England or Amadís of Gaul;"
        ormsby: "Many an argument did he have with the curate of his village (a learned man, and a graduate of Sigüenza) as to which had been the better knight, Palmerín of England or Amadís of Gaul."
        vocab:
          - {w: "competencia", d: "here: dispute, argument; not 'competence'"}
          - {w: "cura", d: "parish priest"}
          - {w: "lugar", d: "village"}
          - {w: "docto", d: "learned"}
          - {w: "graduado", d: "holding a university degree"}
          - {w: "Ingalaterra", d: "= Inglaterra, England (old form)"}
          - {w: "Palmerín de Inglaterra", d: "hero of a Portuguese romance (1547) admired even by Cervantes"}
          - {w: "Amadís de Gaula", d: "hero of the most famous romance of chivalry (1508), the model for all the rest"}
        ormsby_note: "Sigüenza was one of the Universidades menores, the degrees of which were often laughed at by the Spanish humorists."
      - es: "mas maese Nicolás, barbero del mesmo pueblo, decía que ninguno llegaba al Caballero del Febo, y que si alguno se le podía comparar, era don Galaor, hermano de Amadís de Gaula, porque tenía muy acomodada condición para todo;"
        literal: "but master Nicolás, barber of the same town, said that none reached to the Knight of the Phoebus, and that if any to-him could be-compared, it-was Don Galaor, brother of Amadís of Gaul, because he-had very accommodating disposition for everything;"
        ormsby: "Master Nicholas, the village barber, however, used to say that neither of them came up to the Knight of Phoebus, and that if there was any that could compare with him it was Don Galaor, the brother of Amadís of Gaul, because he had a spirit that was equal to every occasion,"
        vocab:
          - {w: "mas", d: "but (literary; no accent, unlike 'más' = more)"}
          - {w: "maese", d: "master; old title for craftsmen"}
          - {w: "barbero", d: "barber, who in this period also did minor surgery and bloodletting"}
          - {w: "pueblo", d: "village, town"}
          - {w: "llegar a", d: "here: to measure up to"}
          - {w: "Caballero del Febo", d: "Knight of Phoebus (the Sun), hero of 'Espejo de príncipes y caballeros' (1555)"}
          - {w: "don Galaor", d: "Amadís's brother, a cheerful womanizer in the romance"}
          - {w: "acomodado", d: "accommodating, easy-going"}
          - {w: "condición", d: "disposition, temperament"}
      - es: "que no era caballero melindroso, ni tan llorón como su hermano, y que en lo de la valentía no le iba en zaga."
        literal: "that not he-was knight squeamish, nor so weepy as his brother, and that in the [matter] of the valor not to-him he-went in rear."
