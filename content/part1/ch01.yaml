      - es: "y fue que le pareció convenible y necesario, así para el aumento de su honra como para el servicio de su república, hacerse caballero andante, y irse por todo el mundo con sus armas y caballo a buscar las aventuras y a ejercitarse en todo aquello que él había leído que los caballeros andantes se ejercitaban, deshaciendo todo género de agravio, y poniéndose en ocasiones y peligros donde, acabándolos, cobrase eterno nombre y fama."
        literal: "and it-was that to-him seemed fitting and necessary, as-much for the increase of his honor as for the service of his commonwealth, to-make-himself knight errant, and to-go-off through all the world with his arms and horse to seek the adventures and to exercise-himself in all that which he had read that the knights errant exercised-themselves-in, undoing every kind of wrong, and putting-himself in occasions and dangers where, finishing-them, he-might-gain eternal name and fame."
        ormsby: "and that was that he fancied it was right and requisite, as well for the support of his own honour as for the service of his country, that he should make a knight-errant of himself, roaming the world over in full armour and on horseback in quest of adventures, and putting in practice himself all that he had read of as being the usual practices of knights-errant; righting every kind of wrong, and exposing himself to peril and danger from which, in the issue, he was to reap eternal renown and fame."
        vocab:
          - {w: "convenible", d: "fitting, suitable; archaic for 'conveniente'"}
          - {w: "honra", d: "honor, reputation"}
          - {w: "república", d: "commonwealth, the state; not a republic"}
