          - s: "o no permitas"
            r: "main verb 2: or do not allow"
            under:
              - s: "que el engaño se vista tu librea"
                r: "what not to allow: that deceit put on your livery"
                under:
                  - {s: "con que destruye a la intención sincera", r: "describes 'librea': with which it destroys honest intent"}
          - s: "presto ha de verse el mundo"
            r: "main verb 3 (after 'que', for): soon the world will find itself"
            under:
              - {s: "si tus apariencias no le quitas", r: "condition: if you do not strip your appearance from it"}
              - {s: "en la pelea de la discorde confusión primera", r: "where: in the strife of the first discordant chaos"}
        forms:
          - {w: "Deja", f: "dej- + -a → dejar (to leave), command, you (tú). The tú command looks like the he-form of the present: deja, come, vive."}
          - {w: "no permitas", f: "permit- + -as → permitir (to allow), present subjunctive, you, used for a negative command. The present subjunctive of -er and -ir verbs: -a, -as, -a, -amos, -áis, -an."}
          - {w: "se vista", f: "vist- + -a → vestirse (to put on), present subjunctive, it. Same -a subjunctive; the stem e becomes i: vista."}
          - {w: "destruye", f: "destruy- + -e → destruir (to destroy), present, it; a y is added before the ending: destruyo, destruyes, destruye, destruimos, destruís, destruyen."}
          - {w: "le quitas", f: "quit- + -as → quitar (to take away), present, you, with 'le' (from it, the deceit). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "ha de verse", f: "ha (haber, present, it) + de + verse (to find itself): 'will find itself'. haber in the present: he, has, ha, hemos, habéis, han."}
        note: "The sonnet blames false friends who wear friendship's 'livery' to deceive: a hint, before Cardenio speaks, of what Don Fernando did to him."
