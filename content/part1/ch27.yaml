      - es: "— Bien veo yo, señores, quienquiera que seáis, que el cielo, que tiene cuidado de socorrer a los buenos, y aun a los malos muchas veces, sin yo merecerlo, me envía, en estos tan remotos y apartados lugares del trato común de las gentes, algunas personas que, poniéndome delante de los ojos con vivas y varias razones cuán sin ella ando en hacer la vida que hago, han procurado sacarme désta a mejor parte;"
