  - sentences:
      - es: "Entróse Sancho por aquellas quebradas de la sierra, dejando a los dos en una por donde corría un pequeño y manso arroyo, a quien hacían sombra agradable y fresca otras peñas y algunos árboles que por allí estaban."
        literal: "Went-in Sancho through those ravines of the mountains, leaving [to] the two in one through where ran a small and gentle stream, to which made shade pleasant and cool other rocks and some trees that around there were."
        ormsby: "Sancho pushed on into the glens of the Sierra, leaving them in one through which there flowed a little gentle rivulet, and where the rocks and trees afforded a cool and grateful shade."
        vocab:
          - {w: "entrarse", d: "to go in, make one's way in"}
          - {w: "quebrada", d: "ravine, gorge, narrow pass"}
          - {w: "manso", d: "gentle, quiet (of water); also 'tame'"}
          - {w: "arroyo", d: "stream, brook"}
          - {w: "a quien", d: "to which: old Spanish uses 'quien' for things too"}
          - {w: "peña", d: "rock, crag"}
        diagram:
          - s: "Entróse Sancho"
            r: "main verb: Sancho made his way in"
            under:
              - {s: "por aquellas quebradas de la sierra", r: "where: through those ravines of the mountains"}
              - s: "dejando a los dos en una"
                r: "how: leaving the two in one (ravine)"
                under:
                  - s: "por donde corría un pequeño y manso arroyo"
                    r: "describes 'una': through which ran a small gentle stream"
                    under:
                      - s: "a quien hacían sombra agradable y fresca otras peñas y algunos árboles"
                        r: "describes 'arroyo': which other rocks and some trees shaded pleasantly and coolly"
                        under:
                          - {s: "que por allí estaban", r: "describes 'peñas' and 'árboles': that were around there"}
        forms:
          - {w: "Entróse", f: "entr- + -ó + se → entrarse (to go in), preterite, he; modern 'se entró'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. Cervantes hangs the pronoun on a clause-opening verb."}
          - {w: "dejando", f: "gerund of dejar (to leave)."}
          - {w: "una", f: "'one', feminine, standing for 'una quebrada'."}
          - {w: "corría", f: "corr- + -ía → correr (to run, flow), imperfect, it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "hacían", f: "hac- + -ían → hacer (to make), imperfect, they (the rocks and trees, which come after the verb). Same -ía imperfect."}
          - {w: "estaban", f: "est- + -aban → estar (to be), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
      - es: "El calor, y el día que allí llegaron, era de los del mes de agosto, que por aquellas partes suele ser el ardor muy grande; la hora, las tres de la tarde:"
        literal: "The heat, and the day that there they-arrived, was of those of-the month of August, that in those parts is-usually the burning very great; the hour, the three of the afternoon:"
        ormsby: "It was an August day with all the heat of one, and the heat in those parts is intense, and the hour was three in the afternoon,"
        vocab:
          - {w: "ser de los de", d: "to be one of those of, be like those of"}
          - {w: "soler", d: "to be in the habit of, usually (do): 'suele ser' = usually is"}
          - {w: "ardor", d: "burning heat"}
          - {w: "las tres de la tarde", d: "three in the afternoon"}
        diagram:
          - s: "era de los del mes de agosto"
            r: "main verb: was (one) of those of August"
            under:
              - {s: "El calor, y el día que allí llegaron", r: "subject: the heat, and the day they arrived there"}
              - {s: "que por aquellas partes suele ser el ardor muy grande", r: "describes 'agosto': when in those parts the heat is usually very great"}
          - {s: "la hora, las tres de la tarde", r: "clause 2, verb 'era' understood: the hour (was) three in the afternoon"}
        forms:
          - {w: "llegaron", f: "lleg- + -aron → llegar (to arrive), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "era", f: "ser (to be), imperfect, it. era, eras, era, éramos, erais, eran. Singular although it has two subjects, because heat and day are felt as one."}
          - {w: "suele", f: "suel- + -e → soler (to usually do), present, it. The stem o becomes ue when stressed: suelo, sueles, suele, solemos, soléis, suelen."}
      - es: "todo lo cual hacía al sitio más agradable, y que convidase a que en él esperasen la vuelta de Sancho, como lo hicieron."
        literal: "all which made [to] the spot more pleasant, and that it-should-invite to that in it they-should-await the return of Sancho, as it they-did."
        ormsby: "all which made the spot the more inviting and tempted them to wait there for Sancho’s return, which they did."
        vocab:
          - {w: "todo lo cual", d: "all of which"}
          - {w: "sitio", d: "spot, place"}
          - {w: "convidar a", d: "to invite to, tempt to"}
          - {w: "vuelta", d: "return"}
        diagram:
          - s: "todo lo cual hacía al sitio más agradable"
            r: "main verb 1: all of which made the spot more pleasant"
          - s: "y que convidase"
            r: "main verb 2, still on 'hacía': and made it invite"
            under:
              - {s: "a que en él esperasen la vuelta de Sancho", r: "to what: to wait there for Sancho's return"}
              - {s: "como lo hicieron", r: "aside: as they did"}
        forms:
          - {w: "hacía", f: "hac- + -ía → hacer (to make), imperfect, it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "convidase, esperasen", f: "convid- + -ase → convidar (to invite), imperfect subjunctive (-se form), it; esper- + -asen → esperar (to wait for), same tense, they. The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. Subjunctive after 'hacía que' and 'convidar a que'."}
          - {w: "hicieron", f: "hic- + -ieron → hacer (to do), preterite, they. hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
  - sentences:
      - es: "Estando, pues, los dos allí, sosegados y a la sombra, llegó a sus oídos una voz que, sin acompañarla son de algún otro instrumento, dulce y regaladamente sonaba, de que no poco se admiraron, por parecerles que aquél no era lugar donde pudiese haber quien tan bien cantase."
        literal: "Being, then, the two there, at-rest and in the shade, arrived to their ears a voice that, without accompanying-it sound of some other instrument, sweetly and delightfully sounded, at which not a-little they-wondered, for seeming-to-them that that not was place where there-could be who so well might-sing."
        ormsby: "They were reposing, then, in the shade, when a voice unaccompanied by the notes of any instrument, but sweet and pleasing in its tone, reached their ears, at which they were not a little astonished, as the place did not seem to them likely quarters for one who sang so well;"
        vocab:
          - {w: "sosegado", d: "quiet, at rest"}
          - {w: "son", d: "sound (of music); not 'they are'"}
          - {w: "regaladamente", d: "delightfully, sweetly; 'regalado' = delicate, pleasing"}
          - {w: "admirarse", d: "to wonder, be amazed (not 'to admire')"}
          - {w: "no poco", d: "not a little: greatly"}
        diagram:
          - s: "llegó a sus oídos una voz"
            r: "main verb: a voice reached their ears"
            under:
              - {s: "Estando, pues, los dos allí, sosegados y a la sombra", r: "when: while the two were there, resting in the shade"}
              - s: "que ... dulce y regaladamente sonaba"
                r: "describes 'voz': which sounded sweet and delightful"
                under:
                  - {s: "sin acompañarla son de algún otro instrumento", r: "how: with no sound of any instrument accompanying it"}
              - s: "de que no poco se admiraron"
                r: "comment: at which they were greatly surprised"
                under:
                  - s: "por parecerles que aquél no era lugar"
                    r: "why: because it seemed to them that that was no place"
                    under:
                      - {s: "donde pudiese haber quien tan bien cantase", r: "describes 'lugar': where there could be anyone who sang so well"}
        forms:
          - {w: "Estando", f: "gerund of estar (to be): 'being'; its subject 'los dos' follows."}
          - {w: "sosegados", f: "sosegado, participle of sosegar (to calm), masculine plural to match 'los dos'."}
          - {w: "llegó", f: "lleg- + -ó → llegar (to arrive), preterite, it. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "acompañarla", f: "infinitive acompañar (to accompany) after 'sin', + la (it, the voice); its subject 'son' comes after."}
          - {w: "algún", f: "alguno clipped before a masculine singular noun ('instrumento')."}
          - {w: "dulce y regaladamente", f: "two adverbs sharing one -mente: 'dulcemente y regaladamente'. Spanish puts -mente only on the last."}
          - {w: "sonaba", f: "son- + -aba → sonar (to sound), imperfect, it. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "se admiraron", f: "admir- + -aron → admirarse (to be amazed), preterite, they. Same -ar preterite."}
          - {w: "parecerles", f: "infinitive parecer (to seem) after 'por', + les (to them)."}
          - {w: "pudiese", f: "pud- + -iese → poder (can), imperfect subjunctive (-se form), it. Subjunctive because such a place is doubted. pudiese, pudieses, pudiese, pudiésemos, pudieseis, pudiesen."}
          - {w: "cantase", f: "cant- + -ase → cantar (to sing), imperfect subjunctive (-se form), he. The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
      - es: "Porque, aunque suele decirse que por las selvas y campos se hallan pastores de voces estremadas, más son encarecimientos de poetas que verdades; y más, cuando advirtieron que lo que oían cantar eran versos, no de rústicos ganaderos, sino de discretos cortesanos."
        literal: "Because, although is-usually said that in the woods and fields are-found shepherds of voices extreme, more they-are exaggerations of poets than truths; and more, when they-noticed that what they-heard sing were verses, not of rustic herdsmen, but of clever courtiers."
        ormsby: "for though it is often said that shepherds of rare voice are to be found in the woods and fields, this is rather a flight of the poet’s fancy than the truth. And still more surprised were they when they perceived that what they heard sung were the verses not of rustic shepherds, but of the polished wits of the city;"
        vocab:
          - {w: "selva", d: "wood, forest (not 'jungle')"}
          - {w: "estremado", d: "= extremado, exceptional, superb"}
          - {w: "encarecimiento", d: "exaggeration, overpraise"}
          - {w: "advertir", d: "to notice, perceive (not 'to warn' here)"}
          - {w: "ganadero", d: "herdsman, stockman"}
          - {w: "discreto", d: "clever, witty, sensible (false friend: not 'discreet')"}
          - {w: "cortesano", d: "man of the capital, cultivated city wit (not a courtier at the palace)"}
        diagram:
          - s: "más son encarecimientos de poetas que verdades"
            r: "main verb 1: they are more poets' exaggerations than truths"
            under:
              - {s: "Porque", r: "connector: for (explains their surprise)"}
              - {s: "aunque suele decirse que por las selvas y campos se hallan pastores de voces estremadas", r: "concession: although it is often said that in woods and fields there are shepherds with superb voices"}
          - s: "y más"
            r: "main clause 2, 'se admiraron' understood: and (they were) more (surprised)"
            under:
              - s: "cuando advirtieron"
                r: "when: when they noticed"
                under:
                  - {s: "que lo que oían cantar eran versos, no de rústicos ganaderos, sino de discretos cortesanos", r: "what they noticed: that the verses were not of rustic herdsmen but of witty city men"}
        forms:
          - {w: "suele decirse", f: "suel- + -e → soler (to usually do), present, it, + decirse (to be said): 'it is often said'. The stem o becomes ue when stressed: suelo, sueles, suele, solemos, soléis, suelen."}
          - {w: "se hallan", f: "hall- + -an → hallar (to find), present, they, with passive 'se': 'are found'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "estremadas", f: "= extremadas, feminine plural to match 'voces'; Cervantes often writes s for x before a consonant."}
          - {w: "son", f: "ser (to be), present, they. soy, eres, es, somos, sois, son."}
          - {w: "advirtieron", f: "advirt- + -ieron → advertir (to notice), preterite, they; the stem e becomes i. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "oían", f: "o- + -ían → oír (to hear), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "eran", f: "ser, imperfect, they: era, eras, era, éramos, erais, eran."}
        ormsby_note: "Cortesanos: not courtiers, but persons who have caught the tone, tastes, and culture of La Corte, 'the Court,' as the capital was always called."
        note: "The narrator pokes at the pastoral novels, where shepherds sing like trained poets. The singer will turn out to be no shepherd at all."
      - es: "Y confirmó esta verdad haber sido los versos que oyeron éstos:"
        literal: "And confirmed this truth to-have been the verses that they-heard these:"
        ormsby: "and so it proved, for the verses they heard were these:"
        vocab:
          - {w: "confirmar", d: "to confirm, bear out"}
        diagram:
          - s: "Y confirmó esta verdad"
            r: "main verb: and (this) confirmed this truth"
            under:
              - s: "haber sido los versos ... éstos"
                r: "subject: the verses having been these"
                under:
                  - {s: "que oyeron", r: "describes 'versos': that they heard"}
        forms:
          - {w: "confirmó", f: "confirm- + -ó → confirmar (to confirm), preterite, it. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "haber sido", f: "infinitive haber + sido (participle of ser): 'to have been'; the whole infinitive phrase is the subject of 'confirmó'."}
          - {w: "oyeron", f: "oy- + -eron → oír (to hear), preterite, they; the i becomes y between vowels: oí, oíste, oyó, oímos, oísteis, oyeron."}
          - {w: "éstos", f: "'these', masculine plural to match 'versos'; the old written accent marks the pronoun."}
        ormsby_note: "These are intended to be echo verses; but, as Clemencín has pointed out, the echoes are nothing but rhymes. In the novel of the Ilustre Fregona, Cervantes introduced similar verses, which Lope de Vega turned into ridicule in a parody."
  - sentences:
      - es: "¿Quién menoscaba mis bienes? Desdenes. Y ¿quién aumenta mis duelos? Los celos. Y ¿quién prueba mi paciencia? Ausencia. De ese modo, en mi dolencia ningún remedio se alcanza, pues me matan la esperanza desdenes, celos y ausencia."
        literal: "Who lessens my goods? Disdains. And who increases my griefs? The jealousies. And who tests my patience? Absence. Of that manner, in my illness no remedy itself reaches, since me kill the hope disdains, jealousies and absence."
        ormsby: "What makes my quest of happiness seem vain? / Disdain. / What bids me to abandon hope of ease? / Jealousies. / What holds my heart in anguish of suspense? / Absence. / If that be so, then for my grief / Where shall I turn to seek relief, / When hope on every side lies slain / By Absence, Jealousies, Disdain?"
        ormsby_match: false
        vocab:
          - {w: "menoscabar", d: "to diminish, impair, damage"}
          - {w: "bienes", d: "good things, happiness (literally 'goods, possessions')"}
          - {w: "desdén", d: "disdain, scorn; plural 'desdenes' = acts of scorn"}
          - {w: "duelo", d: "grief, sorrow (also 'duel'; here grief)"}
          - {w: "celos", d: "jealousy (always plural in this sense)"}
          - {w: "dolencia", d: "illness, ailment"}
          - {w: "alcanzarse", d: "to be obtained, be reached"}
        diagram:
          - s: "¿Quién menoscaba mis bienes? Desdenes."
            r: "question and answer 1: who spoils my happiness? scorn"
          - {s: "Y ¿quién aumenta mis duelos? Los celos.", r: "question and answer 2: who increases my griefs? jealousy"}
          - {s: "Y ¿quién prueba mi paciencia? Ausencia.", r: "question and answer 3: who tries my patience? absence"}
          - s: "ningún remedio se alcanza"
            r: "main verb of the conclusion: no remedy is found"
            under:
              - {s: "De ese modo", r: "connector: that being so"}
              - {s: "en mi dolencia", r: "for what: for my illness"}
              - s: "pues me matan la esperanza"
                r: "why: since they kill my hope"
                under:
                  - {s: "desdenes, celos y ausencia", r: "subject of 'matan', placed last: scorn, jealousy and absence"}
        forms:
          - {w: "menoscaba, aumenta, prueba", f: "menoscab- + -a → menoscabar (to impair), aument- + -a → aumentar (to increase), prueb- + -a → probar (to test), present, he/it: 'who impairs, who increases, who tests'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an; probar changes o to ue when stressed."}
          - {w: "mis", f: "'my', plural to match 'bienes' and 'duelos'."}
          - {w: "Desdenes", f: "desdén + -es: the plural adds -es and drops the written accent (desdén, desdenes)."}
          - {w: "ningún", f: "ninguno clipped before a masculine singular noun ('remedio')."}
          - {w: "se alcanza", f: "alcanz- + -a → alcanzar (to reach), present, it, with passive 'se': 'is obtained'. Same -ar present."}
          - {w: "matan", f: "mat- + -an → matar (to kill), present, they. Same -ar present."}
        note: "The poem is an 'ovillejo': each stanza asks three questions answered by a one-word 'echo' that rhymes with the line, then winds them up in a closing quatrain whose last line repeats the three answers."
      - es: "¿Quién me causa este dolor? Amor. Y ¿quién mi gloria repugna? Fortuna. Y ¿quién consiente en mi duelo? El cielo De ese modo, yo recelo morir deste mal estraño, pues se aumentan en mi daño, amor, fortuna y el cielo."
        literal: "Who me causes this pain? Love. And who my glory opposes? Fortune. And who consents in my grief? The heaven. Of that manner, I fear to-die of-this illness strange, since themselves increase in my harm, love, fortune and the heaven."
        ormsby: "What the prime cause of all my woe doth prove? / Love. / What at my glory ever looks askance? / Chance. / Whence is permission to afflict me given? / Heaven. / If that be so, I but await / The stroke of a resistless fate, / Since, working for my woe, these three, / Love, Chance and Heaven, in league I see."
        ormsby_match: false
        vocab:
          - {w: "gloria", d: "bliss, happiness (the lover's joy)"}
          - {w: "repugnar", d: "to oppose, resist, be contrary to (not 'to disgust' here)"}
          - {w: "consentir en", d: "to consent to, allow"}
          - {w: "recelar", d: "to fear, suspect"}
          - {w: "estraño", d: "= extraño, strange"}
          - {w: "daño", d: "harm, hurt"}
        diagram:
          - s: "¿Quién me causa este dolor? Amor."
            r: "question and answer 1: who causes me this pain? love"
          - {s: "Y ¿quién mi gloria repugna? Fortuna.", r: "question and answer 2: who opposes my joy? fortune"}
          - {s: "Y ¿quién consiente en mi duelo? El cielo", r: "question and answer 3: who allows my grief? heaven"}
          - s: "yo recelo"
            r: "main verb of the conclusion: I fear"
            under:
              - {s: "De ese modo", r: "connector: that being so"}
              - {s: "morir deste mal estraño", r: "what I fear: to die of this strange illness"}
              - s: "pues se aumentan en mi daño"
                r: "why: since they grow to my harm"
                under:
                  - {s: "amor, fortuna y el cielo", r: "subject of 'se aumentan', placed last: love, fortune and heaven"}
        forms:
          - {w: "causa, repugna", f: "caus- + -a → causar (to cause), repugn- + -a → repugnar (to oppose), present, he/it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. 'mi gloria repugna' puts the object before the verb, for the rhyme."}
