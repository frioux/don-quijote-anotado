  - sentences:
      - es: "El cura, que era hombre bien hablado (como el que ya tenía noticia de su desgracia, pues por las señas le había conocido), se llegó a él, y con breves aunque muy discretas razones le rogó y persuadió que aquella tan miserable vida dejase, porque allí no la perdiese, que era la desdicha mayor de las desdichas."
        literal: "The priest, who was [a] man well spoken (as the [one] who already had news of his misfortune, since by the signs him he-had recognized), himself approached to him, and with brief though very sensible words him begged and persuaded that that so miserable life he-should-leave, so-that there not it he-should-lose, which was the misfortune greatest of the misfortunes."
        ormsby: "The curate, who was aware of his misfortune and recognised him by the description, being a man of good address, approached him and in a few sensible words entreated and urged him to quit a life of such misery, lest he should end it there, which would be the greatest of all misfortunes."
        vocab:
          - {w: "bien hablado", d: "well-spoken, courteous in speech"}
          - {w: "tener noticia de", d: "to know about, have heard of"}
          - {w: "desgracia", d: "misfortune (not 'disgrace')"}
          - {w: "señas", d: "description, identifying marks"}
          - {w: "llegarse a", d: "to go up to, approach"}
          - {w: "discreto", d: "wise, sensible (false friend)"}
          - {w: "razones", d: "words, remarks"}
          - {w: "persuadir", d: "to urge, try to persuade"}
          - {w: "desdicha", d: "misfortune"}
        diagram:
