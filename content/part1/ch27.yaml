        note: "The 1605 Don Quijote was divided into four 'parts'; this chapter closes the third, on a cliffhanger. Cervantes credits the break to his invented Arab chronicler, a running joke about the book's authorship."
summary: |
  The barber approves the priest's plan. They borrow a skirt and headdress from the innkeeper's wife, leaving the priest's new cassock as a pledge, and the barber makes a false beard from an ox-tail. The innkeepers recognize the madman as their guest of the balsam and the blanket-tossing, and tell everything. The priest is dressed as a damsel in old-fashioned finery, and Maritornes promises to pray a rosary for them. Barely out of the inn, the priest decides it is unseemly for a priest to dress as a woman and swaps roles with the barber, who will be the damsel. Sancho laughs at the sight of them and guides them to the Sierra Morena, keeping quiet about the bag of gold he found.

  At the mountains the two men coach Sancho: he is to tell Don Quijote that Dulcinea, who cannot read, has ordered him by word of mouth to come to her at once. Sancho is glad they mean to make his master an emperor rather than an archbishop, and goes ahead alone. Waiting in a shady ravine in the August heat, the priest and barber hear a fine voice singing a poem of questions and answers on scorn, jealousy and absence, and then a sonnet on false friendship. The song turns to sobs, and they find the singer: a man matching Sancho's description of Cardenio.

  Cardenio, sane for the moment, tells them his whole story. Luscinda's note in the book of Amadís moved him to seek her hand, and he asked his friend Don Fernando to help. Don Fernando sent him away to his brother on a pretext and meanwhile asked Luscinda's father for her himself. A letter from Luscinda, brought by a stranger she paid from her window, told Cardenio that the wedding would be in two days. He rode home, spoke to Luscinda at her window, where she showed him a dagger she would use rather than marry, and hid behind a tapestry in the hall. But at the priest's question Luscinda said 'yes', then fainted; a paper was found in her bodice, which Don Fernando read in silence.

  Cardenio fled the city without taking revenge, cursing and excusing Luscinda by turns, and wandered into the mountains until his mule died. Since then goatherds have fed him, and he has fits of madness in which he rages and robs shepherds. He wants no cure without Luscinda. As the priest is about to comfort him, another plaintive voice is heard, and the narrator closes the third part of the history.
context: |
  Disguise and decorum. The priest's scruple about dressing as a woman is real: canon law forbade clergy to wear women's clothing or go masked, and his solution, letting the barber play the damsel, keeps his dignity at the barber's expense. The old-fashioned clothes the landlady lends him (slashed velvet stripes, a green bodice trimmed with satin) are from 'King Wamba's time', a proverbial phrase for anything ancient; Ormsby notes that Wamba was a Visigothic king who reigned 672-680. The money in the story is real money too: a hundred reals wrapped in a handkerchief was a large tip, more than a labourer earned in weeks.

  The books behind it. The plan to lure Don Quijote home with a 'doncella menesterosa', a damsel in distress, uses the chivalric romances against him. The main story here, though, belongs to a different genre: Cardenio's tale is a Spanish 'novela' of betrayed love, told in the high style of the sentimental romance, with apostrophes to memory, balanced antitheses, metaphors of night and sunset, and a list of history's traitors (Marius, Catiline, Sulla, Ganelon, Vellido Dolfos, Count Julian, Judas; Ormsby identifies the medieval ones). The poems are in the courtly manner: an 'ovillejo' meant as echo verses, though, as Ormsby notes after Clemencín, the 'echoes' are only rhymes (Cervantes tried the form again in La ilustre fregona, and Lope de Vega parodied it), and a sonnet that Ormsby, against Clemencín, ranks among the best in Spanish. The narrator teases the pastoral novels, where shepherds sing like poets: the verses are those of 'cortesanos', which Ormsby glosses as people who have caught the culture of the capital, not courtiers.

  The narrator's games. The chapter stacks narrators: Cide Hamete tells of Cardenio, who quotes a messenger, who quotes Luscinda. Cardenio's interrupted story from chapter 24 is picked up exactly where it broke off, and the narrator reminds us why it broke off (Master Elisabat, in Amadís). The chapter ends on a cliffhanger with the end of the 'third part', one of the four parts into which the 1605 volume was divided, credited to the 'wise and careful' Arab historian. Ormsby's own text has two slips worth knowing: he writes 'as they know' where Cardenio says 'as they do not know', and 'mingling tears' where Cardenio says the lovers never mixed tears into their talk.

  Love, marriage and the body. The wedding follows the Catholic rite: the priest asks 'do you take ... as the holy Mother Church commands?', the couple answer, and the ring is given. After the Council of Trent (1563) a valid marriage required a priest and witnesses, so Cardenio's claim that Luscinda is 'his wife' rests on a private promise that bound the conscience rather than the law. Luscinda's honour depends on public opinion: refusing a rich nobleman would make people suspect a secret lover. Cardenio's madness is described in the medicine of the day: an 'accidente' (a fit) brought on by the force of the 'imaginación', the faculty that keeps images in the mind; he alternates between lucid spells and violent episodes, and his fainting bride is revived by loosening her bodice. The biblical allusions are to Nathan's parable of the poor man's one ewe lamb (2 Samuel 12) and to Lot fleeing Sodom without looking back.

  Names. Luscinda's name suggests 'luz', light. Cardenio, Ormsby suggests elsewhere, may come from the Venta de Cárdenas at the mouth of the Despeñaperros pass. Don Fernando is the younger son of Duke Ricardo, a 'grande' of Andalusia. Maritornes is the kind-hearted, unlovely maid of the inn, here sending the priest off with a promised rosary.

  Reading Cervantes' Spanish. The chapter is rich in the archaisms seen before: mesmo, efeto, imperfeto, perfeción, priesa, apriesa, recebir, lición, estremado, escuridad, asimesmo, añudar, desculpar, condecender, estobar, enoblecer, perroquia, and the very old 'maguer que' and 'empero'. Contractions with 'de' are everywhere (desta, deste, dél, dellas, désta). Pronouns hang on clause-opening verbs (Pidiéronle, púsole, Díjele, Abríla, Conocióme, púsoseme, Dile). Commands to 'vos' swap d and l before a pronoun (imaginaldo, veldo), and -rl- becomes -ll- (miralla). Look out for the future subjunctive (quisiéredes, dieren, pudiere, fuere, dijere), the -ra form as a conditional (pudiera, fuera, vieran), the old vos ending -des (érades), 'el ausencia' and 'las colores', 'ha' for 'hace', and false friends: invención (trick), accidente (fit), discreto (wise), admiración (wonder), suceso (outcome), puesto que (even if), honesto (chaste), pretender (to seek), industria (skill), calidad (rank), celebrar (to recount), atentado (prudent).
