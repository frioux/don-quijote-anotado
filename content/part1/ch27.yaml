  - sentences:
      - es: "Despidiéronse de todos, y de la buena de Maritornes, que prometió de rezar un rosario, aunque pecadora, porque Dios les diese buen suceso en tan arduo y tan cristiano negocio como era el que habían emprendido."
        literal: "They-took-leave of all, and of the good [one] of Maritornes, who promised to pray a rosary, although [a] sinner, so-that God to-them might-give good outcome in so arduous and so Christian business as was the [one] that they-had undertaken."
        ormsby: "They took leave of all, and of the good Maritornes, who, sinner as she was, promised to pray a rosary of prayers that God might grant them success in such an arduous and Christian undertaking as that they had in hand."
        vocab:
          - {w: "despedirse de", d: "to take leave of, say goodbye to"}
          - {w: "la buena de Maritornes", d: "'good old Maritornes': 'el bueno de / la buena de' + name is affectionate"}
          - {w: "Maritornes", d: "the ugly, kind-hearted Asturian serving-girl of the inn (chapters 16-17)"}
          - {w: "prometer de", d: "to promise to (old use with 'de')"}
          - {w: "rosario", d: "rosary: a set of prayers counted on beads"}
          - {w: "pecadora", d: "sinner (feminine); Maritornes is free with her favors"}
          - {w: "porque", d: "here 'so that' (with the subjunctive), not 'because'"}
          - {w: "suceso", d: "outcome, result (false friend: not 'success' alone; 'buen suceso' = success)"}
          - {w: "negocio", d: "business, affair, undertaking"}
          - {w: "emprender", d: "to undertake"}
        diagram:
          - s: "Despidiéronse"
            r: "main verb: they took leave"
            under:
              - {s: "de todos", r: "of whom 1: of everyone"}
              - s: "y de la buena de Maritornes"
                r: "of whom 2: and of good Maritornes"
                under:
                  - s: "que prometió de rezar un rosario"
                    r: "describes 'Maritornes': who promised to pray a rosary"
                    under:
                      - {s: "aunque pecadora", r: "concession: sinner though she was"}
                      - s: "porque Dios les diese buen suceso"
                        r: "purpose: so that God might give them success"
                        under:
                          - {s: "en tan arduo y tan cristiano negocio como era el que habían emprendido", r: "in what: in so hard and so Christian a business as the one they had undertaken"}
        forms:
          - {w: "Despidiéronse", f: "despid- + -ieron + se → despedirse (to take leave), preterite, they; modern 'se despidieron'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron; the e of the stem turns to i here."}
          - {w: "prometió", f: "promet- + -ió → prometer (to promise), preterite, she. Same -ió preterite."}
          - {w: "rezar", f: "infinitive (to pray) after 'prometió de'."}
          - {w: "diese", f: "di- + -ese → dar (to give), imperfect subjunctive (-se form), he (God). Subjunctive because 'porque' means 'so that'. dar: diese, dieses, diese, diésemos, dieseis, diesen."}
          - {w: "buen", f: "bueno clipped before a masculine singular noun ('suceso')."}
          - {w: "habían emprendido", f: "hab- + -ían → haber, imperfect, + emprendido, participle of emprender (to undertake): pluperfect, they, 'had undertaken'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
        note: "The joke is in 'aunque pecadora': the inn's easy-going maid offers her prayers for a priest's mission, and the narrator calls the plot to trick a madman 'so Christian a business'."
