      - es: "Y, queriéndolo poner en efeto, hizo la mesma voz que no se moviesen, la cual llegó de nuevo a sus oídos, cantando este soneto:"
        literal: "And, wanting-it to-put into effect, made the same voice that not themselves they-should-move, the which arrived anew to their ears, singing this sonnet:"
        ormsby: "but just as they were about to do so they were checked by the same voice, which once more fell upon their ears, singing this sonnet:"
        vocab:
          - {w: "poner en efeto", d: "= poner en efecto: to carry out"}
          - {w: "mesmo", d: "= mismo, same (old form)"}
          - {w: "de nuevo", d: "again"}
          - {w: "soneto", d: "sonnet: fourteen eleven-syllable lines, the Italian form brought into Spanish by Garcilaso"}
        diagram:
          - s: "hizo la mesma voz"
            r: "main verb: the same voice made"
            under:
              - {s: "queriéndolo poner en efeto", r: "when: as they were about to do it"}
              - {s: "que no se moviesen", r: "what it made happen: that they did not move"}
              - s: "la cual llegó de nuevo a sus oídos"
                r: "describes 'voz': which reached their ears again"
                under:
                  - {s: "cantando este soneto", r: "how: singing this sonnet"}
        forms:
          - {w: "queriéndolo", f: "queriendo, gerund of querer (to want), + lo (it), accent added; 'lo' belongs to 'poner' but climbs onto the gerund."}
          - {w: "hizo", f: "hiz- + -o → hacer (to make), preterite, it. hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "mesma", f: "= misma, feminine to match 'voz'."}
          - {w: "se moviesen", f: "mov- + -iesen → moverse (to move), imperfect subjunctive (-se form), they. Subjunctive after 'hizo que'. The -se imperfect subjunctive of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen."}
          - {w: "llegó", f: "lleg- + -ó → llegar (to arrive), preterite, it. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "cantando", f: "gerund of cantar (to sing)."}
        ormsby_note: "Notwithstanding Clemencín's disparaging remark that this is 'of the same stuff' as Cervantes' sonnets are commonly composed of, it will be seen, even in translation, that there is at least a backbone here, while the serious sonnets of Cervantes are only too often little better than invertebrate twaddle. Translation, however, can not reproduce the exquisite melody of the original, and, had it no other merit, this alone would, pace Clemencín, entitle the sonnet to a place among the best in the Spanish language."
