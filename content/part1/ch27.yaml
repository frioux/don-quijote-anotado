      - es: "¿Quién pudiera imaginar que don Fernando, caballero ilustre, discreto, obligado de mis servicios, poderoso para alcanzar lo que el deseo amoroso le pidiese dondequiera que le ocupase, se había de enconar, como suele decirse, en tomarme a mí una sola oveja, que aún no poseía?"
