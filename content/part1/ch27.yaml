      - es: "Parecióles bien lo que Sancho Panza decía, y así, determinaron de aguardarle hasta que volviese con las nuevas del hallazgo de su amo."
        literal: "Seemed-to-them well what Sancho Panza said, and so, they-resolved to wait-for-him until that he-should-return with the news of-the finding of his master."
