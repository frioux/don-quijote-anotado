          - {w: "vestirse algo", d: "to put on (a garment)"}
          - {w: "librea", d: "livery: the uniform a lord's servants wear; here the outward dress of friendship"}
          - {w: "presto", d: "soon, quickly"}
          - {w: "haber de", d: "to be going to, must"}
          - {w: "pelea", d: "fight, strife"}
          - {w: "discorde", d: "discordant, at odds"}
          - {w: "la confusión primera", d: "the first confusion: the primeval chaos before creation, when the elements fought"}
        diagram:
