  - sentences:
      - es: "Santa amistad, que con ligeras alas, tu apariencia quedándose en el suelo, entre benditas almas, en el cielo, subiste alegre a las impíreas salas, desde allá, cuando quieres, nos señalas la justa paz cubierta con un velo, por quien a veces se trasluce el celo de buenas obras que, a la fin, son malas."
        literal: "Holy friendship, who with light wings, your appearance staying on the ground, among blessed souls, in the heaven, rose joyful to the empyrean halls, from there, when you-wish, to-us you-point-out the just peace covered with a veil, through which at times shows-through the zeal of good works that, at the end, are bad."
        ormsby: "When heavenward, holy Friendship, thou didst go / Soaring to seek thy home beyond the sky, / And take thy seat among the saints on high, / It was thy will to leave on earth below / Thy semblance, and upon it to bestow / Thy veil, wherewith at times hypocrisy, / Parading in thy shape, deceives the eye, / And makes its vileness bright as virtue show."
        ormsby_match: false
        vocab:
          - {w: "ligero", d: "light, swift"}
          - {w: "apariencia", d: "outward semblance, appearance (here: the mere look of friendship left on earth)"}
          - {w: "bendito", d: "blessed"}
          - {w: "impíreo", d: "= empíreo, empyrean: the highest heaven, seat of God and the blessed"}
          - {w: "señalar", d: "to point out, show"}
          - {w: "velo", d: "veil"}
          - {w: "traslucirse", d: "to show through, be glimpsed through"}
          - {w: "celo", d: "zeal (not 'celos', jealousy)"}
          - {w: "a la fin", d: "= al fin, in the end"}
        diagram:
          - s: "nos señalas"
            r: "main verb: you show us"
            under:
              - s: "Santa amistad"
                r: "addressed: holy friendship"
                under:
                  - s: "que con ligeras alas ... subiste alegre a las impíreas salas"
                    r: "describes 'amistad': who rose joyfully on light wings to the halls of heaven"
                    under:
                      - {s: "tu apariencia quedándose en el suelo", r: "while: your outward look staying on the ground"}
                      - {s: "entre benditas almas, en el cielo", r: "where: among blessed souls, in heaven"}
              - {s: "desde allá, cuando quieres", r: "from where and when: from there, when you wish"}
              - s: "la justa paz cubierta con un velo"
                r: "object: righteous peace covered with a veil"
                under:
                  - s: "por quien a veces se trasluce el celo de buenas obras"
                    r: "describes 'velo': through which the zeal of good works sometimes shows"
                    under:
                      - {s: "que, a la fin, son malas", r: "describes 'obras': that in the end are bad"}
        forms:
          - {w: "Santa", f: "sant- + -a → santo (holy), feminine to match 'amistad'."}
          - {w: "ligeras, benditas, impíreas", f: "feminine plural to match 'alas', 'almas', 'salas'."}
          - {w: "quedándose", f: "quedando, gerund of quedarse (to stay), + se, accent added; its subject 'tu apariencia' comes first."}
          - {w: "subiste", f: "sub- + -iste → subir (to rise), preterite, you (tú). The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "alegre", f: "adjective used as an adverb: 'joyfully', agreeing with the subject."}
          - {w: "quieres", f: "quier- + -es → querer (to wish), present, you. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "señalas", f: "señal- + -as → señalar (to show), present, you. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "cubierta", f: "irregular participle of cubrir (to cover), feminine to match 'paz'."}
          - {w: "por quien", f: "'through which': old Spanish uses 'quien' for things (the veil)."}
          - {w: "se trasluce", f: "trasluc- + -e → traslucirse (to show through), present, it. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "son", f: "ser (to be), present, they. soy, eres, es, somos, sois, son."}
      - es: "Deja el cielo, ¡oh amistad!, o no permitas que el engaño se vista tu librea, con que destruye a la intención sincera; que si tus apariencias no le quitas, presto ha de verse el mundo en la pelea de la discorde confusión primera."
        literal: "Leave the heaven, oh friendship!, or not permit that the deceit itself should-dress-in your livery, with which it-destroys [to] the intention sincere; for if your appearances not from-it you-take-away, soon has to see-itself the world in the fight of the discordant confusion first."
        ormsby: "Friendship, return to us, or force the cheat / That wears it now, thy livery to restore, / By aid whereof sincerity is slain. / If thou wilt not unmask thy counterfeit, / This earth will be the prey of strife once more, / As when primaeval discord held its reign."
