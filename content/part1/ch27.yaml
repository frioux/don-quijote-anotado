      - es: "¿Quién mejorará mi suerte? La muerte. Y el bien de amor, ¿quién le alcanza? Mudanza. Y sus males, ¿quién los cura? Locura. De ese modo, no es cordura querer curar la pasión cuando los remedios son muerte, mudanza y locura."
        literal: "Who will-improve my lot? The death. And the good of love, who it reaches? Change. And its ills, who them cures? Madness. Of that manner, not is sanity to-want to-cure the passion when the remedies are death, change and madness."
        ormsby: "What must I do to find a remedy? / Die. / What is the lure for love when coy and strange? / Change. / What, if all fail, will cure the heart of sadness? / Madness. / If that be so, it is but folly / To seek a cure for melancholy: / Ask where it lies; the answer saith / In Change, in Madness, or in Death."
        ormsby_match: false
        vocab:
          - {w: "suerte", d: "lot, fate"}
          - {w: "mudanza", d: "change, inconstancy (of feeling)"}
          - {w: "cordura", d: "good sense, sanity"}
          - {w: "pasión", d: "suffering, passion (love as a sickness)"}
        diagram:
          - s: "¿Quién mejorará mi suerte? La muerte."
            r: "question and answer 1: who will better my lot? death"
          - {s: "Y el bien de amor, ¿quién le alcanza? Mudanza.", r: "question and answer 2: who wins love's reward? change (inconstancy)"}
          - {s: "Y sus males, ¿quién los cura? Locura.", r: "question and answer 3: who cures its ills? madness"}
          - s: "no es cordura"
            r: "main verb of the conclusion: it is not sense"
            under:
              - {s: "De ese modo", r: "connector: that being so"}
              - {s: "querer curar la pasión", r: "subject: to want to cure the passion"}
              - {s: "cuando los remedios son muerte, mudanza y locura", r: "when: when the remedies are death, change and madness"}
        forms:
          - {w: "mejorará", f: "mejorar- + -á → mejorar (to improve), future, he/it. The future endings on the infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "le alcanza", f: "alcanz- + -a → alcanzar (to attain), present, he, with 'le' (it, el bien) as object: a leísmo, 'le' for a thing. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "los cura", f: "cur- + -a → curar (to cure), present, he, with 'los' (them, the ills) repeating 'sus males'. Same -ar present."}
          - {w: "sus", f: "'its' (love's), plural to match 'males'."}
          - {w: "querer curar", f: "infinitive querer (to want) + infinitive curar (to cure): 'wanting to cure', the subject of 'es'."}
          - {w: "son", f: "ser (to be), present, they. soy, eres, es, somos, sois, son."}
        note: "Death, change and madness are the three cures: the singer, as the reader will learn, is a lover who has gone mad."
