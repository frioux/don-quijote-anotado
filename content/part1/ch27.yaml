          - {w: "poner en ejecución", d: "to carry out"}
          - {w: "con ocasión de", d: "on the pretext of"}
          - {w: "dineros", d: "money (plural in old Spanish)"}
          - {w: "de industria", d: "on purpose, deliberately"}
          - {w: "ausentarse", d: "to go away, absent oneself"}
          - {w: "salir con", d: "to succeed in, carry off (a plan)"}
