          - {w: "al de", f: "a + el + de: 'to the one of', 'el' standing for 'padre'."}
      - es: "¡Oh Mario ambicioso, oh Catilina cruel, oh Sila facinoroso, oh Galalón embustero, oh Vellido traidor, oh Julián vengativo, oh Judas codicioso!"
        literal: "Oh Marius ambitious, oh Catiline cruel, oh Sulla villainous, oh Ganelon lying, oh Vellido traitorous, oh Julian vengeful, oh Judas greedy!"
        ormsby: "O, ambitious Marius! O, cruel Catiline! O, wicked Sylla! O, perfidious Ganelon! O, treacherous Vellido! O, vindictive Julian! O, covetous Judas!"
        vocab:
          - {w: "Mario", d: "Gaius Marius, Roman general, seven times consul; his ambition set off Rome's civil wars"}
          - {w: "Catilina", d: "Catiline, Roman noble who plotted to overthrow the Republic (63 BC), denounced by Cicero"}
          - {w: "Sila", d: "Sulla, Roman dictator famous for his proscriptions, Marius' enemy"}
          - {w: "facinoroso", d: "villainous, criminal"}
          - {w: "Galalón", d: "Ganelon, the traitor who betrayed Roland and the Twelve Peers at Roncesvalles"}
          - {w: "embustero", d: "lying, deceitful"}
          - {w: "Vellido", d: "Vellido Dolfos, who murdered King Sancho II at the siege of Zamora (1072) by treachery"}
          - {w: "Julián", d: "Count Julian, who in legend let the Moors into Spain (711) to avenge his daughter, wronged by King Rodrigo"}
          - {w: "Judas", d: "Judas Iscariot, who sold Christ for thirty pieces of silver"}
          - {w: "codicioso", d: "greedy"}
        diagram:
          - s: "¡Oh Mario ambicioso"
            r: "exclamation, no verb: a list of traitors addressed, each with an adjective"
            under:
              - {s: "oh Catilina cruel, oh Sila facinoroso", r: "two more Romans"}
              - {s: "oh Galalón embustero, oh Vellido traidor, oh Julián vengativo", r: "three traitors of epic and Spanish legend"}
              - {s: "oh Judas codicioso!", r: "the arch-traitor"}
        forms:
          - {w: "ambicioso, facinoroso, codicioso", f: "adjectives with the suffix -oso (full of): ambición → ambicioso, codicia → codicioso; masculine to match each name."}
          - {w: "traidor", f: "noun used as an adjective: 'traitor, treacherous'; the -dor ending marks the doer, as in 'robador' (robber); from Latin 'traditor', one who hands over."}
          - {w: "vengativo", f: "venga- + -tivo → vengar (to avenge): 'vengeful'."}
        ormsby_note: "Ganelon or Galalon, who betrayed Roland and the Peers at Roncesvalles; Vellido Dolfos, who treacherously slew Sancho II at the siege of Zamora in 1072; and Count Julian, who admitted the Arabs into Spain to revenge himself upon Roderic."
        note: "Cardenio breaks off his story to apostrophize Don Fernando through a catalogue of history's traitors, Roman, French and Spanish, a rhetorical outburst of the kind found in sentimental novels."
