part: 1
chapter: 27
title_es: "Capítulo XXVII. De cómo salieron con su intención el cura y el barbero, con otras cosas dignas de que se cuenten en esta grande historia"
title_en: "Of how the curate and the barber proceeded with their scheme; together with other matters worthy of record in this great history"
paragraphs:
  - sentences:
      - es: "No le pareció mal al barbero la invención del cura, sino tan bien, que luego la pusieron por obra."
        literal: "Not to-him seemed bad to-the barber the invention of-the priest, but so well, that at-once it they-put to work."
        ormsby: "The curate’s plan did not seem a bad one to the barber, but on the contrary so good that they immediately set about putting it in execution."
        vocab:
          - {w: "invención", d: "scheme, contrivance, trick (not 'invention' in the modern sense); here the plan to disguise themselves to lure Don Quijote home"}
          - {w: "cura", d: "parish priest, the curate (Pero Pérez of Don Quijote's village)"}
          - {w: "luego", d: "at once, immediately (the usual meaning in Cervantes, not 'later')"}
          - {w: "poner por obra", d: "to put into practice, carry out"}
        diagram:
          - s: "No le pareció mal"
            r: "main verb: it did not seem bad to him"
            under:
              - {s: "al barbero", r: "to whom: the barber (repeats 'le')"}
              - {s: "la invención del cura", r: "subject: the priest's scheme"}
              - s: "sino tan bien"
                r: "but rather: it seemed so good"
                under:
                  - {s: "que luego la pusieron por obra", r: "result: that they put it into practice at once"}
        forms:
          - {w: "pareció", f: "parec- + -ió → parecer (to seem), preterite, it. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "le ... al barbero", f: "'le' (to him) and 'al barbero' name the same person; Spanish often doubles the indirect object this way."}
          - {w: "del", f: "de + el fused: 'of the'."}
          - {w: "pusieron", f: "pus- + -ieron → poner (to put), preterite, they. Irregular stem: puse, pusiste, puso, pusimos, pusisteis, pusieron."}
          - {w: "la", f: "'it', feminine to stand for 'la invención'."}
      - es: "Pidiéronle a la ventera una saya y unas tocas, dejándole en prendas una sotana nueva del cura."
        literal: "They-asked-of-her to the innkeeper's-wife a skirt and some headdresses, leaving-her in pledge a cassock new of-the priest."
        ormsby: "They begged a petticoat and hood of the landlady, leaving her in pledge a new cassock of the curate’s;"
        vocab:
          - {w: "ventera", d: "the innkeeper's wife, landlady (of the inn where Don Quijote was tossed in a blanket)"}
          - {w: "saya", d: "woman's skirt or petticoat, worn as an outer skirt"}
          - {w: "tocas", d: "women's headdress: a linen veil or wimple covering head and neck"}
          - {w: "dejar en prendas", d: "to leave as a pledge, as security"}
          - {w: "sotana", d: "cassock, the long black gown of a priest"}
        diagram:
          - s: "Pidiéronle"
            r: "main verb: they asked of her"
            under:
              - {s: "a la ventera", r: "of whom: the landlady (repeats 'le')"}
              - {s: "una saya y unas tocas", r: "object: a skirt and a headdress"}
              - s: "dejándole en prendas"
                r: "how: leaving her as a pledge"
                under:
                  - {s: "una sotana nueva del cura", r: "object of 'dejando': a new cassock of the priest's"}
        forms:
          - {w: "Pidiéronle", f: "pid- + -ieron + le → pedir (to ask for), preterite, they, with 'le' (of her) stuck on the end; modern 'le pidieron'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron; pedir changes e to i in 'pidieron'. Cervantes hangs the pronoun on a verb that opens the clause."}
          - {w: "unas", f: "un- + -as → uno, feminine plural to match 'tocas': 'some', or just 'a' with a plural-only noun."}
          - {w: "dejándole", f: "dejando, the gerund of dejar (to leave), + le (to her), with an accent added to keep the stress."}
          - {w: "nueva", f: "nuev- + -a → nuevo (new), feminine to match 'sotana'."}
      - es: "El barbero hizo una gran barba de una cola rucia o roja de buey, donde el ventero tenía colgado el peine."
        literal: "The barber made a great beard from a tail grey or red of ox, where the innkeeper had hung the comb."
        ormsby: "and the barber made a beard out of a grey-brown or red oxtail in which the landlord used to stick his comb."
        vocab:
          - {w: "cola", d: "tail"}
          - {w: "rucio", d: "grey, greyish-brown (of an animal's coat); Sancho's donkey is called 'el rucio'"}
          - {w: "buey", d: "ox"}
          - {w: "ventero", d: "innkeeper"}
          - {w: "peine", d: "comb"}
        diagram:
          - s: "El barbero hizo"
            r: "subject and main verb: the barber made"
            under:
              - {s: "una gran barba", r: "object: a big beard"}
              - s: "de una cola rucia o roja de buey"
                r: "out of what: a grey or red ox-tail"
                under:
                  - {s: "donde el ventero tenía colgado el peine", r: "describes 'cola': where the innkeeper kept his comb hung"}
        forms:
          - {w: "hizo", f: "hiz- + -o → hacer (to make), preterite, he. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "gran", f: "grande (big) clipped before a singular noun ('barba'), like buen, algún, ningún."}
          - {w: "rucia o roja", f: "feminine of rucio (grey) and rojo (red), to match 'cola'."}
          - {w: "tenía colgado", f: "ten- + -ía → tener (to have), imperfect, he, + colgado, the participle of colgar (to hang): 'had (kept) hung'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían. 'tener' + participle stresses the resulting state."}
      - es: "Preguntóles la ventera que para qué le pedían aquellas cosas."
        literal: "Asked-them the innkeeper's-wife that for what to-her they-asked-for those things."
        ormsby: "The landlady asked them what they wanted these things for,"
        vocab:
          - {w: "para qué", d: "what for, for what purpose"}
        diagram:
          - s: "Preguntóles"
            r: "main verb: she asked them"
            under:
              - {s: "la ventera", r: "subject: the landlady"}
              - {s: "que para qué le pedían aquellas cosas", r: "what she asked: what they wanted those things for"}
        forms:
          - {w: "Preguntóles", f: "pregunt- + -ó + les → preguntar (to ask), preterite, she, with 'les' (them) on the end; modern 'les preguntó'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "que para qué", f: "the 'que' before a reported question is an old habit; modern Spanish drops it: 'les preguntó para qué'. The accent on 'qué' marks the question word."}
          - {w: "pedían", f: "ped- + -ían → pedir (to ask for), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "aquellas", f: "aquel (that) + -las, feminine plural to match 'cosas': 'those (over there)'."}
      - es: "El cura le contó en breves razones la locura de don Quijote, y cómo convenía aquel disfraz para sacarle de la montaña, donde a la sazón estaba."
        literal: "The priest to-her told in brief words the madness of don Quijote, and how was-fitting that disguise to get-him-out of the mountain, where at the time he-was."
        ormsby: "and the curate told her in a few words about the madness of Don Quixote, and how this disguise was intended to get him away from the mountain where he then was."
        vocab:
          - {w: "en breves razones", d: "in a few words; 'razones' here is 'words, sentences', not 'reasons'"}
          - {w: "convenir", d: "to be fitting, be needed, suit the purpose"}
          - {w: "disfraz", d: "disguise"}
          - {w: "sacar", d: "to take out, get (someone) out"}
          - {w: "montaña", d: "mountain, mountainous wild country; here the Sierra Morena"}
          - {w: "a la sazón", d: "at that time, just then"}
        diagram:
          - s: "El cura le contó"
            r: "subject and main verb: the priest told her"
            under:
              - {s: "en breves razones", r: "how: in a few words"}
              - {s: "la locura de don Quijote", r: "object 1: Don Quijote's madness"}
              - s: "y cómo convenía aquel disfraz"
                r: "object 2: and how that disguise was needed"
                under:
                  - s: "para sacarle de la montaña"
                    r: "purpose: to get him out of the mountains"
                    under:
                      - {s: "donde a la sazón estaba", r: "describes 'montaña': where he was at the time"}
        forms:
          - {w: "contó", f: "cont- + -ó → contar (to tell), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "breves", f: "breve (brief) + -s, plural to match 'razones'."}
          - {w: "convenía", f: "conven- + -ía → convenir (to be fitting), imperfect, it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "sacarle", f: "infinitive sacar (to get out) after 'para', with 'le' (him) attached."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
      - es: "Cayeron luego el ventero y la ventera en que el loco era su huésped, el del bálsamo, y el amo del manteado escudero, y contaron al cura todo lo que con él les había pasado, sin callar lo que tanto callaba Sancho."
        literal: "Fell at-once the innkeeper and the innkeeper's-wife in that the madman was their guest, the [one] of-the balsam, and the master of-the blanket-tossed squire, and they-told to-the priest all that which with him to-them had happened, without keeping-quiet what so-much kept-quiet Sancho."
        ormsby: "The landlord and landlady immediately came to the conclusion that the madman was their guest, the balsam man and master of the blanketed squire, and they told the curate all that had passed between him and them, not omitting what Sancho had been so silent about."
        vocab:
          - {w: "caer en", d: "to realize, twig, 'fall in' to an idea"}
          - {w: "huésped", d: "guest (also 'host' in old Spanish; here the guest)"}
          - {w: "bálsamo", d: "balm, balsam; Don Quijote's 'balsam of Fierabrás', which he brewed at this inn and which made him and Sancho violently sick"}
          - {w: "mantear", d: "to toss in a blanket; 'manteado' = blanket-tossed, as Sancho was by the guests at this inn"}
          - {w: "callar", d: "to keep quiet about, not mention"}
        diagram:
          - s: "Cayeron luego"
            r: "main verb 1: (they) realized at once"
            under:
              - {s: "el ventero y la ventera", r: "subject: the innkeeper and his wife"}
              - s: "en que el loco era su huésped"
                r: "what they realized: that the madman was their guest"
                under:
                  - {s: "el del bálsamo", r: "describes 'huésped': the one with the balsam"}
                  - {s: "y el amo del manteado escudero", r: "describes 'huésped': the master of the blanket-tossed squire"}
          - s: "y contaron al cura"
            r: "main verb 2: and they told the priest"
            under:
              - {s: "todo lo que con él les había pasado", r: "object: everything that had happened to them with him"}
              - {s: "sin callar lo que tanto callaba Sancho", r: "how: without keeping quiet what Sancho kept so quiet"}
        forms:
          - {w: "Cayeron", f: "cay- + -eron → caer (to fall), preterite, they. Its i turns to y between vowels: caí, caíste, cayó, caímos, caísteis, cayeron."}
          - {w: "el del bálsamo", f: "'el' standing alone for 'el huésped': 'the one of the balsam'."}
          - {w: "manteado", f: "mante- + -ado → mantear (to toss in a blanket), participle used as an adjective, masculine to match 'escudero'."}
          - {w: "contaron", f: "cont- + -aron → contar (to tell), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "había pasado", f: "hab- + -ía → haber, imperfect, + pasado, participle of pasar (to happen): pluperfect, it, 'had happened'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "callar", f: "infinitive (to keep quiet) after 'sin'."}
          - {w: "callaba", f: "call- + -aba → callar, imperfect, he (Sancho): 'kept quiet about'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
        note: "Sancho had kept quiet about his blanket-tossing because it was humiliating; the innkeepers now tell the priest everything. The inn is the one of chapters 16 and 17."
      - es: "En resolución, la ventera vistió al cura de modo que no había más que ver:"
        literal: "In conclusion, the innkeeper's-wife dressed [to] the priest in manner that not there-was more to see:"
        ormsby: "Finally the landlady dressed up the curate in a style that left nothing to be desired;"
        vocab:
          - {w: "en resolución", d: "in short, finally (a favorite Cervantine connector)"}
          - {w: "vestir", d: "to dress (someone)"}
          - {w: "de modo que", d: "in such a way that"}
          - {w: "no haber más que ver", d: "to leave nothing more to be seen: to be perfect of its kind (ironic here)"}
        diagram:
          - s: "la ventera vistió al cura"
            r: "subject, main verb and object: the landlady dressed the priest"
            under:
              - {s: "En resolución", r: "connector: in short"}
              - {s: "de modo que no había más que ver", r: "how: so that there was nothing more to see"}
        forms:
          - {w: "vistió", f: "vist- + -ió → vestir (to dress), preterite, she. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron; vestir changes e to i in 'vistió, vistieron'."}
          - {w: "al cura", f: "a + el fused; the 'a' marks a person as the object."}
          - {w: "había", f: "hab- + -ía → haber, imperfect, used alone as 'there was'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "ver", f: "infinitive (to see) after 'más que'."}
      - es: "púsole una saya de paño, llena de fajas de terciopelo negro de un palmo en ancho, todas acuchilladas, y unos corpiños de terciopelo verde, guarnecidos con unos ribetes de raso blanco, que se debieron de hacer, ellos y la saya, en tiempo del rey Wamba."
        literal: "she-put-on-him a skirt of wool-cloth, full of bands of velvet black of a palm in width, all slashed, and some bodices of velvet green, trimmed with some edgings of satin white, which themselves must have been made, they and the skirt, in time of-the king Wamba."
        ormsby: "she put on him a cloth petticoat with black velvet stripes a palm broad, all slashed, and a bodice of green velvet set off by a binding of white satin, which as well as the petticoat must have been made in the time of king Wamba."
        vocab:
          - {w: "paño", d: "woollen cloth"}
          - {w: "faja", d: "band, stripe of trimming"}
          - {w: "terciopelo", d: "velvet"}
          - {w: "palmo", d: "a span, a hand's breadth (about 21 cm)"}
          - {w: "acuchillado", d: "slashed: cut in decorative slits to show the lining beneath, a fashion of the 1500s"}
          - {w: "corpiños", d: "bodice (often plural for one garment)"}
          - {w: "guarnecido", d: "trimmed, edged"}
          - {w: "ribete", d: "edging, binding"}
          - {w: "raso", d: "satin"}
          - {w: "deber de", d: "must (probability): 'se debieron de hacer' = they must have been made"}
          - {w: "en tiempo del rey Wamba", d: "'in King Wamba's time': proverbially, ages ago; Wamba was a Visigothic king of Spain (672-680)"}
        diagram:
          - s: "púsole"
            r: "main verb: she put on him (continues 'vistió')"
            under:
              - s: "una saya de paño"
                r: "object 1: a woollen skirt"
                under:
                  - {s: "llena de fajas de terciopelo negro de un palmo en ancho", r: "describes 'saya': covered in black velvet bands a span wide"}
                  - {s: "todas acuchilladas", r: "describes 'fajas': all slashed"}
              - s: "y unos corpiños de terciopelo verde"
                r: "object 2: and a green velvet bodice"
                under:
                  - {s: "guarnecidos con unos ribetes de raso blanco", r: "describes 'corpiños': trimmed with white satin edging"}
              - {s: "que se debieron de hacer, ellos y la saya, en tiempo del rey Wamba", r: "describes both garments: which must have been made in King Wamba's time"}
        forms:
          - {w: "púsole", f: "pus- + -o + le → poner (to put on), preterite, she, with 'le' (on him) stuck on the end; modern 'le puso'. Irregular stem: puse, pusiste, puso, pusimos, pusisteis, pusieron."}
          - {w: "llena", f: "llen- + -a → lleno (full), feminine to match 'saya'."}
          - {w: "todas acuchilladas", f: "todo (all) and acuchillado, participle of acuchillar (to slash), both feminine plural to match 'fajas'."}
          - {w: "guarnecidos", f: "guarnec- + -idos → guarnecer (to trim), participle, masculine plural to match 'corpiños'."}
          - {w: "se debieron de hacer", f: "deb- + -ieron → deber (must), preterite, they, + 'de' + hacer (to make) with passive 'se': 'they must have been made'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
        ormsby_note: "Wamba, a king of the Gothic line who reigned from 672 to 680."
      - es: "No consintió el cura que le tocasen, sino púsose en la cabeza un birretillo de lienzo colchado que llevaba para dormir de noche, y ciñóse por la frente una liga de tafetán negro, y con otra liga hizo un antifaz, con que se cubrió muy bien las barbas y el rostro;"
        literal: "Not allowed the priest that him they-should-coif, but put-on-himself on the head a little-cap of linen quilted that he-carried for to-sleep at night, and bound-himself around the forehead a garter of taffeta black, and with another garter he-made a mask, with which himself he-covered very well the beard and the face;"
        ormsby: "The curate would not let them hood him, but put on his head a little quilted linen cap which he used for a nightcap, and bound his forehead with a strip of black silk, while with another he made a mask with which he concealed his beard and face very well."
        vocab:
          - {w: "consentir", d: "to allow, agree to"}
          - {w: "tocar", d: "here 'to put the 'tocas' (woman's headdress) on someone', not 'to touch'; Ormsby: 'hood him'"}
          - {w: "birretillo", d: "little cap, skullcap (diminutive of 'birrete', biretta)"}
          - {w: "lienzo", d: "linen cloth"}
          - {w: "colchado", d: "quilted (modern 'acolchado')"}
          - {w: "ceñirse", d: "to bind around oneself, gird"}
          - {w: "liga", d: "band, garter, strip of cloth"}
          - {w: "tafetán", d: "taffeta, a thin silk"}
          - {w: "antifaz", d: "mask covering the face"}
          - {w: "barbas", d: "beard (plural for one beard, as often in old Spanish)"}
        diagram:
          - s: "No consintió el cura"
            r: "main verb 1: the priest would not allow"
            under:
              - {s: "que le tocasen", r: "what he refused: that they put the woman's headdress on him"}
          - s: "sino púsose en la cabeza"
            r: "main verb 2: but instead put on his head"
            under:
              - s: "un birretillo de lienzo colchado"
                r: "object: a little quilted linen cap"
                under:
                  - {s: "que llevaba para dormir de noche", r: "describes 'birretillo': which he wore to sleep at night"}
          - s: "y ciñóse por la frente"
            r: "main verb 3: and bound round his forehead"
            under:
              - {s: "una liga de tafetán negro", r: "object: a band of black taffeta"}
          - s: "y con otra liga hizo un antifaz"
            r: "main verb 4: and with another band made a mask"
            under:
              - {s: "con que se cubrió muy bien las barbas y el rostro", r: "describes 'antifaz': with which he covered beard and face well"}
        forms:
          - {w: "consintió", f: "consint- + -ió → consentir (to allow), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron; the stem e becomes i in 'consintió, consintieron'."}
          - {w: "tocasen", f: "toc- + -asen → tocar (to put a headdress on), imperfect subjunctive (-se form), they. Subjunctive after 'no consintió que'. The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "púsose", f: "pus- + -o + se → ponerse (to put on oneself), preterite, he; modern 'se puso'. Irregular stem: puse, pusiste, puso, pusimos, pusisteis, pusieron. Cervantes hangs the pronoun on a clause-opening verb."}
          - {w: "birretillo", f: "birrete + -illo, a diminutive: 'little cap'."}
          - {w: "llevaba", f: "llev- + -aba → llevar (to wear, carry), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "ciñóse", f: "ciñ- + -ó + se → ceñirse (to bind round oneself), preterite, he; modern 'se ciñó'. After ñ the -ió ending loses its i: ceñí, ceñiste, ciñó, ceñimos, ceñisteis, ciñeron."}
          - {w: "hizo", f: "hiz- + -o → hacer (to make), preterite, he. hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "se cubrió", f: "cubr- + -ió → cubrirse (to cover on oneself), preterite, he. Same -ió preterite. The 'se' means he covered his own beard and face."}
      - es: "encasquetóse su sombrero, que era tan grande que le podía servir de quitasol, y, cubriéndose su herreruelo, subió en su mula a mujeriegas, y el barbero en la suya, con su barba que le llegaba a la cintura, entre roja y blanca, como aquella que, como se ha dicho, era hecha de la cola de un buey barroso."
        literal: "he-jammed-on-himself his hat, which was so big that to-him it-could serve as sunshade, and, covering-himself [with] his cloak, he-got-up on his mule in women's-fashion, and the barber on his [own], with his beard that to-him reached to the waist, between red and white, as that [one] which, as has-been said, was made of the tail of an ox clay-coloured."
        ormsby: "He then put on his hat, which was broad enough to serve him for an umbrella, and enveloping himself in his cloak seated himself woman-fashion on his mule, while the barber mounted his with a beard down to the waist of mingled red and white, for it was, as has been said, the tail of a clay-red ox."
        vocab:
          - {w: "encasquetarse", d: "to jam (a hat) firmly on one's head"}
          - {w: "servir de", d: "to serve as"}
          - {w: "quitasol", d: "parasol, sunshade"}
          - {w: "herreruelo", d: "short cloak with a collar, worn by men (also 'ferreruelo')"}
          - {w: "a mujeriegas", d: "side-saddle, woman-fashion (with both legs on one side)"}
          - {w: "cintura", d: "waist"}
          - {w: "barroso", d: "clay-coloured, reddish-brown (of cattle)"}
        diagram:
          - s: "encasquetóse su sombrero"
            r: "main verb 1: he jammed on his hat"
            under:
              - s: "que era tan grande"
                r: "describes 'sombrero': which was so big"
                under:
                  - {s: "que le podía servir de quitasol", r: "result: that it could serve him as a sunshade"}
          - s: "subió en su mula"
            r: "main verb 2 (after 'y'): he mounted his mule"
            under:
