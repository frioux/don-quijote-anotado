        forms:
          - {w: "era, tenía", f: "era: ser (to be), imperfect, he (era, eras, era, éramos, erais, eran); ten- + -ía → tener (to have), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "había conocido", f: "había (haber, imperfect) + conocido, participle of conocer (here 'to recognize'): pluperfect, he. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "se llegó", f: "lleg- + -ó → llegarse (to approach), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "rogó y persuadió", f: "rog- + -ó → rogar (to beg), preterite, he; persuad- + -ió → persuadir (to urge), preterite, he (the -ir preterite: -í, -iste, -ió, -imos, -isteis, -ieron)."}
          - {w: "dejase", f: "dej- + -ase → dejar (to leave), imperfect subjunctive (-se form), he. The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "perdiese", f: "perd- + -iese → perder (to lose), imperfect subjunctive (-se form), he. 'porque' = 'so that' takes the subjunctive. The -se imperfect subjunctive of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen."}
