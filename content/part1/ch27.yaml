      - es: "»Digo, pues, que, pareciéndole a don Fernando que mi presencia le era inconveniente para poner en ejecución su falso y mal pensamiento, determinó de enviarme a su hermano mayor, con ocasión de pedirle unos dineros para pagar seis caballos, que de industria, y sólo para este efeto de que me ausentase (para poder mejor salir con su dañado intento), el mesmo día que se ofreció hablar a mi padre los compró, y quiso que yo viniese por el dinero."
        literal: "I-say, then, that, seeming-to-him to don Fernando that my presence to-him was inconvenient for to-put into execution his false and bad thought, he-resolved to send-me to his brother elder, with pretext of asking-him-for some monies for to-pay six horses, which on purpose, and only for this effect of that I-should-absent-myself (for to-be-able better to come-out with his wicked intent), the same day that himself he-offered to-speak to my father them he-bought, and he-wanted that I should-come for the money."
        ormsby: "“To proceed, then: Don Fernando finding my presence an obstacle to the execution of his treacherous and wicked design, resolved to send me to his elder brother under the pretext of asking money from him to pay for six horses which, purposely, and with the sole object of sending me away that he might the better carry out his infernal scheme, he had purchased the very day he offered to speak to my father, and the price of which he now desired me to fetch."
