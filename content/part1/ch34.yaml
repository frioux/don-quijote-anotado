      - es: "Y así, ya que, en todo o en parte, has seguido siempre mis consejos, sigue y guarda uno que ahora te diré, para que sin engaño y con medroso advertimento te satisfagas de aquello que más vieres que te convenga."
        literal: "And so, since, in all or in part, you-have followed always my counsels, follow and keep one that now to-you I-will-tell, so-that without deceit and with fearful attention yourself you-may-satisfy of that which most you-may-see that to-you may-suit."
