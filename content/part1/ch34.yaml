      - es: "y, pues a pie enjuto has pasado el mar de las dificultades y sospechas que de las mujeres suelen y pueden tenerse, no quieras entrar de nuevo en el profundo piélago de nuevos inconvenientes, ni quieras hacer experiencia con otro piloto de la bondad y fortaleza del navío que el cielo te dio en suerte para que en él pasases la mar deste mundo, sino haz cuenta que estás ya en seguro puerto, y aférrate con las áncoras de la buena consideración, y déjate estar hasta que te vengan a pedir la deuda que no hay hidalguía humana que de pagarla se escuse."
