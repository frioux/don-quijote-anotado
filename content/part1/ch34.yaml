          - {w: "mío", f: "'of mine', after the noun, masculine to match 'pecho'."}
        note: "Camila begins a performance for her hidden husband: every word is meant to be overheard. Cervantes stresses the theatre of it at the end of the chapter, calling it a 'tragedy'."
