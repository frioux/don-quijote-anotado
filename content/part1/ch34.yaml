              - s: "pues le alabó, y dijo"
                r: "why: since he praised it and said"
                under:
                  - s: "que era demasiadamente cruel la dama"
                    r: "what he said: that the lady was too cruel"
                    under:
                      - {s: "que a tan claras verdades no correspondía", r: "describes 'dama': who did not respond to such plain truths"}
          - {s: "A lo que dijo Camila", r: "main verb 2: to which Camila said"}
        forms:
          - {w: "pareció", f: "parec- + -ió → parecer (to seem), preterite, it. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "alabó", f: "alab- + -ó → alabar (to praise), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he / she. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "demasiadamente", f: "demasiada (excessive) + -mente → adverb."}
          - {w: "correspondía", f: "correspond- + -ía → corresponder (to respond), imperfect, she. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
