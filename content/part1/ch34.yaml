          - {w: "intentó", f: "intent- + -ó → intentar (to attempt), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "sepa", f: "sep- + -a → saber (to know), present subjunctive, it (the world), as a wish: 'let the world know'. Irregular: sepa, sepas, sepa, sepamos, sepáis, sepan."}
          - {w: "llegare", f: "lleg- + -are → llegar (to come to), future subjunctive, it, after 'si'. The future subjunctive of -ar verbs: -are, -ares, -are, -áremos, -areis, -aren. Cervantes uses it for an open future after 'si'; modern Spanish uses the present 'llega'."}
          - {w: "saberlo", f: "saber (to know) + lo (it), infinitive after 'llegar a'."}
          - {w: "guardó", f: "guard- + -ó → guardar (to keep), preterite, she. Same -ó preterite as 'intentó'."}
          - {w: "dio", f: "dar (to give), preterite, she. Irregular: di, diste, dio, dimos, disteis, dieron."}
          - {w: "se atrevió", f: "atrev- + -ió → atreverse (to dare), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "ofendelle", f: "ofender (to offend) + le (him), with -rl- turned into -ll-, a common sound change in Cervantes' day: modern 'ofenderle'."}
      - es: "Mas, con todo, creo que fuera mejor dar cuenta desto a Anselmo, pero ya se la apunté a dar en la carta que le escribí al aldea, y creo que el no acudir él al remedio del daño que allí le señalé, debió de ser que, de puro bueno y confiado, no quiso ni pudo creer que en el pecho de su tan firme amigo pudiese caber género de pensamiento que contra su honra fuese;"
        literal: "But, with all, I-believe that it-would-be better to give account of-this to Anselmo, but already to-him it I-hinted to give in the letter that to-him I-wrote at-the village, and I-believe that the not coming he to-the remedy of-the harm that there to-him I-pointed-out, must have been that, from pure good and trusting, not he-would nor could believe that in the breast of his so firm friend could fit [any] kind of thought that against his honor might-go;"
        ormsby: "Still, I think it might be better to disclose this to Anselmo. But then I have called his attention to it in the letter I wrote to him in the country, and, if he did nothing to prevent the mischief I there pointed out to him, I suppose it was that from pure goodness of heart and trustfulness he would not and could not believe that any thought against his honour could harbour in the breast of so stanch a friend;"
        vocab:
