      - es: "Y, a no estar avisada Camila de Lotario de que eran fingidos aquellos amores de Clori, y que él se lo había dicho a Anselmo por poder ocuparse algunos ratos en las mismas alabanzas de Camila, ella, sin duda, cayera en la desesperada red de los celos;"
