  - sentences:
      - es: "»Y, diciendo estas razones, con una increíble fuerza y ligereza arremetió a Lotario con la daga desenvainada, con tales muestras de querer enclavársela en el pecho, que casi él estuvo en duda si aquellas demostraciones eran falsas o verdaderas, porque le fue forzoso valerse de su industria y de su fuerza para estorbar que Camila no le diese."
        literal: "And, saying these words, with an incredible strength and swiftness she-rushed at Lotario with the dagger unsheathed, with such signs of wanting to-nail-it-into-him in the breast, that almost he was in doubt whether those demonstrations were false or true, because to-him it-was necessary to-avail-himself of his skill and of his strength to prevent that Camila not him might-strike."
        ormsby: "As she uttered these words, with incredible energy and swiftness she flew upon Lothario with the naked dagger, so manifestly bent on burying it in his breast that he was almost uncertain whether these demonstrations were real or feigned, for he was obliged to have recourse to all his skill and strength to prevent her from striking him;"
