  - sentences:
      - es: "»Al principio que Camila esto decía creyó Lotario que era artificio para desmentille que el hombre que había visto salir era de Leonela, y no suyo; pero, viéndola llorar y afligirse, y pedirle remedio, vino a creer la verdad, y, en creyéndola, acabó de estar confuso y arrepentido del todo."
        literal: "At-the beginning that Camila this said believed Lotario that it-was trick for to-mislead-him that the man that he-had seen go-out was of Leonela, and not hers; but, seeing-her weep and grieve, and ask-him remedy, he-came to believe the truth, and, on believing-it, he-finished of being confused and repentant entirely."
        ormsby: "As Camilla said this Lothario at first imagined it was some device to delude him into the idea that the man he had seen going out was Leonela’s lover and not hers; but when he saw how she wept and suffered, and begged him to help her, he became convinced of the truth, and the conviction completed his confusion and remorse;"
