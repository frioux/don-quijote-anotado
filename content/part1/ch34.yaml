      - es: "Pero, como naturalmente tiene la mujer ingenio presto para el bien y para el mal más que el varón, puesto que le va faltando cuando de propósito se pone a hacer discursos, luego al instante halló Camila el modo de remediar tan al parecer inremediable negocio, y dijo a Lotario que procurase que otro día se escondiese Anselmo donde decía, porque ella pensaba sacar de su escondimiento comodidad para que desde allí en adelante los dos se gozasen sin sobresalto alguno;"
        literal: "But, as naturally has the woman wit quick for the good and for the bad more than the man, although to-her it goes failing when on purpose herself she-puts to make reasonings, then at-the instant found Camila the way of remedying so to-the seeming irremediable business, and said to Lotario that he-should-see-to-it that next day himself should-hide Anselmo where he-said, because she intended to-draw from his hiding convenience so-that from there on the two each-other might-enjoy without alarm any;"
        ormsby: "but as woman has by nature a nimbler wit than man for good and for evil, though it is apt to fail when she sets herself deliberately to reason, Camilla on the spur of the moment thought of a way to remedy what was to all appearance irremediable, and told Lothario to contrive that the next day Anselmo should conceal himself in the place he mentioned, for she hoped from his concealment to obtain the means of their enjoying themselves for the future without any apprehension;"
