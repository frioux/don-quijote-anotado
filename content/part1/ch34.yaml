  - sentences:
      - es: "»Mucho se hizo de rogar Leonela antes que saliese a llamar a Lotario, pero, en fin, salió; y, entre tanto que volvía, quedó Camilia diciendo, como que hablaba consigo misma:"
        literal: "Much herself made of to-beg Leonela before that she-might-go-out to call [to] Lotario, but, in end, she-went-out; and, while that she-was-returning, remained Camilia saying, as that she-spoke with-herself same:"
