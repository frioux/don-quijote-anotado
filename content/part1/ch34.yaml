          - {w: "hablaba", f: "habl- + -aba → hablar (to speak), imperfect, she. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "consigo misma", f: "con + sí fused into 'consigo' (with oneself), + misma, feminine for Camila: 'with herself'."}
  - sentences:
      - es: "»—¡Válame Dios! ¿No fuera más acertado haber despedido a Lotario, como otras muchas veces lo he hecho, que no ponerle en condición, como ya le he puesto, que me tenga por deshonesta y mala, siquiera este tiempo que he de tardar en desengañarle?"
        literal: "— God help-me! Not would-it-be more wise to-have dismissed [to] Lotario, as other many times it I-have done, than not to-put-him in condition, as already him I-have put, that me he-may-hold for unchaste and bad, if-only this time that I-have to delay in undeceiving-him?"
        ormsby: "“Good God! would it not have been more prudent to have repulsed Lothario, as I have done many a time before, than to allow him, as I am now doing, to think me unchaste and vile, even for the short time I must wait until I undeceive him?"
        vocab:
