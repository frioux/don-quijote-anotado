        forms:
          - {w: "Válame", f: "val- + -a → valer (to help, protect), present subjunctive, it (God), as a wish: 'may God help me', with 'me' hung on the end because the verb opens the sentence. Old form of modern 'válgame': valga, valgas, valga, valgamos, valgáis, valgan."}
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), it, used as a conditional: 'would it (not) have been'. Irregular: fuera, fueras, fuera, fuéramos, fuerais, fueran."}
          - {w: "haber despedido", f: "perfect infinitive: haber (to have) + despedido, the participle of despedir (to dismiss): 'to have sent away'."}
          - {w: "lo he hecho, le he puesto", f: "he, from haber (to have), present, I, + hecho and puesto, the irregular participles of hacer (to do) and poner (to put): 'I have done it', 'I have put him'. haber in the present: he, has, ha, hemos, habéis, han. 'le' for Lotario as direct object is leísmo: 'le' (properly 'to him') used where the standard rule wants 'lo' (him) for a male person."}
          - {w: "ponerle", f: "poner (to put) + le (him), the pronoun hung on the infinitive; again 'le' for 'lo' (leísmo) because Lotario is a man."}
          - {w: "tenga", f: "teng- + -a → tener (to hold), present subjunctive, he, in a result that is feared, not certain. Irregular: tenga, tengas, tenga, tengamos, tengáis, tengan."}
          - {w: "deshonesta y mala", f: "deshonest- + -a, mal- + -a → deshonesto (unchaste), malo (bad), feminine for Camila ('me')."}
          - {w: "he de tardar", f: "he, from haber (to have), present, I, + de + tardar (to take time): 'I must take'. Same present of haber as in 'lo he hecho'."}
          - {w: "desengañarle", f: "desengañar (to undeceive) + le (him), infinitive after 'en'."}
        note: "Camila is speaking for the hidden Anselmo, who she knows is listening behind the tapestries. Every line of her soliloquy is a performance of outraged virtue."
      - es: "Mejor fuera, sin duda; pero no quedara yo vengada, ni la honra de mi marido satisfecha, si tan a manos lavadas y tan a paso llano se volviera a salir de donde sus malos pensamientos le entraron."
        literal: "Better it-would-be, without doubt; but not would-remain I avenged, nor the honor of my husband satisfied, if so with hands washed and so at step level himself he-were-to-turn to go-out from where his bad thoughts him brought-in."
        ormsby: "No doubt it would have been better; but I should not be avenged, nor the honour of my husband vindicated, should he find so clear and easy an escape from the strait into which his depravity has led him."
        vocab:
          - {w: "a manos lavadas", d: "with clean hands, i.e. scot-free, without paying for it"}
          - {w: "a paso llano", d: "at an easy walk, i.e. without any trouble"}
          - {w: "volver a salir", d: "to go out again; 'volver a' + infinitive = to do again"}
          - {w: "salirse de", d: "to get out of, escape from"}
          - {w: "entrar", d: "here transitive: to lead in, bring in"}
        diagram:
          - {s: "Mejor fuera, sin duda", r: "main verb 1: it would be better, no doubt"}
          - s: "pero no quedara yo vengada"
            r: "main verb 2: but I would not be left avenged"
            under:
              - {s: "ni la honra de mi marido satisfecha", r: "and also: nor my husband's honor satisfied"}
              - s: "si tan a manos lavadas y tan a paso llano se volviera a salir"
                r: "condition: if he got away again so scot-free and so easily"
                under:
                  - {s: "de donde sus malos pensamientos le entraron", r: "from where: from where his wicked thoughts led him in"}
        forms:
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), it, used as a conditional: 'it would be'. Irregular: fuera, fueras, fuera, fuéramos, fuerais, fueran."}
          - {w: "quedara", f: "qued- + -ara → quedar (to remain), imperfect subjunctive (-ra form), I, used as a conditional: 'I would (not) be left'. The -ra form of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran."}
          - {w: "vengada, satisfecha", f: "participles of vengar (to avenge) and satisfacer (to satisfy; irregular satisfecho), feminine to match 'yo' (Camila) and 'honra'."}
          - {w: "se volviera a salir", f: "volv- + -iera → volver (to return), imperfect subjunctive (-ra form), he, in the 'if' clause, + a salir (to go out): 'if he went out again'; 'se' belongs to 'salirse' (to get out) but rides in front of the whole group. The -ra form of -er and -ir verbs: -iera, -ieras, -iera, -iéramos, -ierais, -ieran."}
          - {w: "entraron", f: "entr- + -aron → entrar (to bring in), preterite, they (his thoughts). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. 'le' (him) is leísmo: 'le', properly 'to him', used for 'lo' when the object is a man."}
      - es: "Pague el traidor con la vida lo que intentó con tan lascivo deseo: sepa el mundo, si acaso llegare a saberlo, de que Camila no sólo guardó la lealtad a su esposo, sino que le dio venganza del que se atrevió a ofendelle."
        literal: "Let-pay the traitor with the life that-which he-attempted with so lustful desire: let-know the world, if perhaps it-should-come to know-it, of that Camila not only kept the loyalty to her husband, but that to-him she-gave vengeance on-the [one] who dared to offend-him."
        ormsby: "Let the traitor pay with his life for the temerity of his wanton wishes, and let the world know (if haply it shall ever come to know) that Camilla not only preserved her allegiance to her husband, but avenged him of the man who dared to wrong him."
        vocab:
