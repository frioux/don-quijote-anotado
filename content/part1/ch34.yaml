        ormsby: "The sonnet pleased Camilla, and still more Anselmo, for he praised it and said the lady was excessively cruel who made no return for sincerity so manifest. On which Camilla said,"
        vocab:
          - {w: "parecer bien", d: "to seem good, please"}
          - {w: "alabar", d: "to praise"}
          - {w: "demasiadamente", d: "excessively, too (old form; modern 'demasiado')"}
          - {w: "corresponder a", d: "to return, repay (love, affection)"}
