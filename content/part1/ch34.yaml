  - sentences:
      - es: "»—¿Por qué no vas, Leonela, a llamar al más leal amigo de amigo que vio el sol o cubrió la noche?"
        literal: "— Why not do-you-go, Leonela, to call [to-]the most loyal friend of friend that saw the sun or covered the night?"
        ormsby: "“Why do you not go, Leonela, to call hither that friend, the falsest to his friend the sun ever shone upon or night concealed?"
        vocab:
          - {w: "leal", d: "loyal, faithful; here said in bitter irony, meaning the most disloyal"}
          - {w: "amigo de amigo", d: "friend to a friend"}
          - {w: "que vio el sol o cubrió la noche", d: "that the sun ever saw or night ever covered, i.e. in the whole world"}
        diagram:
          - s: "¿Por qué no vas"
            r: "main verb: why don't you go"
            under:
              - {s: "Leonela", r: "addressed to"}
              - s: "a llamar al más leal amigo de amigo"
                r: "purpose: to call the most loyal friend to a friend"
                under:
                  - {s: "que vio el sol o cubrió la noche?", r: "describes 'amigo': that the sun ever saw or night covered"}
        forms:
          - {w: "vas", f: "ir (to go), present, you. Irregular: voy, vas, va, vamos, vais, van."}
          - {w: "al", f: "a + el, the contraction modern Spanish still makes."}
          - {w: "más leal", f: "'el más' + adjective makes the superlative: 'the most loyal'; 'leal' has one form for both genders."}
          - {w: "vio", f: "ver (to see), preterite, it (the sun). Irregular: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "cubrió", f: "cubr- + -ió → cubrir (to cover), preterite, it (the night). The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
        note: "Camila speaks for the hidden Anselmo: 'the most loyal friend' is sarcasm, and Ormsby turns it straight into 'the falsest'."
      - es: "Acaba, corre, aguija, camina, no se esfogue con la tardanza el fuego de la cólera que tengo, y se pase en amenazas y maldiciones la justa venganza que espero."
        literal: "Finish, run, spur, go, [so-that] not itself may-vent with the delay the fire of the anger that I-have, and itself may-pass in threats and curses the just vengeance that I-hope."
        ormsby: "Away, run, haste, speed! lest the fire of my wrath burn itself out with delay, and the righteous vengeance that I hope for melt away in menaces and maledictions.”"
        vocab:
          - {w: "acabar", d: "here 'get on with it, hurry up'"}
          - {w: "aguijar", d: "to spur on, hurry (from 'aguijón', a goad)"}
          - {w: "esfogarse", d: "to vent itself, burn itself out (archaic; modern 'desfogarse')"}
          - {w: "tardanza", d: "delay"}
          - {w: "cólera", d: "anger, wrath"}
          - {w: "pasarse en", d: "to fade away into, be spent in"}
          - {w: "amenaza", d: "threat"}
          - {w: "maldición", d: "curse"}
        diagram:
          - {s: "Acaba, corre, aguija, camina", r: "main verbs: hurry up, run, spur on, go"}
          - s: "no se esfogue con la tardanza el fuego de la cólera"
            r: "purpose 1 ('que', so that, left out): lest the fire of my anger burn itself out with delay"
            under:
              - {s: "que tengo", r: "describes 'cólera': that I feel"}
          - s: "y se pase en amenazas y maldiciones la justa venganza"
            r: "purpose 2: and lest the just vengeance be spent in threats and curses"
            under:
              - {s: "que espero", r: "describes 'venganza': that I hope for"}
        forms:
          - {w: "Acaba, corre, aguija, camina", f: "tú commands of acabar (to finish), correr (to run), aguijar (to spur on) and caminar (to go), each the same as the he-form of the present. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an; of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "no se esfogue", f: "esfogu- + -e → esfogarse (to vent itself), present subjunctive, it; g becomes gu before e. 'no' + subjunctive here means 'lest'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "se pase", f: "pas- + -e → pasarse (to pass away), present subjunctive, it. Same -e subjunctive as 'esfogue'."}
          - {w: "justa", f: "just- + -a → justo (just), feminine to match 'venganza'."}
          - {w: "espero", f: "esper- + -o → esperar (to hope for), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
  - sentences:
      - es: "»—Ya voy a llamarle, señora mía —dijo Leonela—, mas hasme de dar primero esa daga, porque no hagas cosa, en tanto que falto, que dejes con ella que llorar toda la vida a todos los que bien te quieren."
        literal: "— Already I-go to call-him, lady mine — said Leonela —, but you-have-to-me to give first that dagger, so-that not you-may-do [a] thing, while that I-am-away, that you-may-leave with it [something] to weep all the life to all those who well you love."
        ormsby: "“I am just going to call him, señora,” said Leonela; “but you must first give me that dagger, lest while I am gone you should by means of it give cause to all who love you to weep all their lives.”"
        vocab:
          - {w: "ya voy", d: "I'm going this minute; 'ya' here means 'right now', not 'already'"}
          - {w: "mas", d: "but (literary; no accent, unlike 'más', more)"}
          - {w: "haber de", d: "to have to, must; 'hasme de dar' = you must give me"}
          - {w: "daga", d: "dagger"}
          - {w: "porque no", d: "here 'so that ... not, lest' (with the subjunctive), not 'because'"}
          - {w: "en tanto que", d: "while"}
          - {w: "faltar", d: "here 'to be away, be absent'"}
          - {w: "dejar que llorar", d: "to leave (people) something to weep over; 'que' + infinitive = something to (do)"}
          - {w: "los que bien te quieren", d: "those who love you; 'querer bien' = to love, wish well"}
        diagram:
          - s: "Ya voy a llamarle"
            r: "main verb 1: I'm going to call him right now"
            under:
              - {s: "señora mía", r: "addressed to: my lady"}
          - {s: "dijo Leonela", r: "speech tag: said Leonela"}
          - s: "mas hasme de dar primero esa daga"
            r: "main verb 2: but first you must give me that dagger"
            under:
              - s: "porque no hagas cosa"
                r: "purpose: so that you do nothing"
                under:
                  - {s: "en tanto que falto", r: "when: while I am away"}
                  - s: "que dejes con ella que llorar toda la vida"
                    r: "describes 'cosa': that would leave, with it, cause for a lifetime of weeping"
                    under:
                      - {s: "a todos los que bien te quieren", r: "to whom: to all who love you"}
        forms:
          - {w: "voy", f: "ir (to go), present, I. Irregular: voy, vas, va, vamos, vais, van. 'ir a' + infinitive = to be going to."}
          - {w: "llamarle", f: "llamar (to call) + le (him), the pronoun hung on the infinitive after 'a'. 'le' for a male person as direct object is leísmo: Cervantes, like much of Castile, uses 'le' (properly 'to him') where the standard rule wants 'lo' (him)."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, she. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "hasme de dar", f: "has, from haber (to have), present, you, + me (to me) stuck on the end, + de + dar (to give): 'you must give me'; modern 'me has de dar'. haber in the present: he, has, ha, hemos, habéis, han. Cervantes hangs the pronoun on a verb that opens its clause (here after 'mas')."}
          - {w: "hagas", f: "hag- + -as → hacer (to do), present subjunctive, you, after 'porque' meaning 'so that'. Irregular: haga, hagas, haga, hagamos, hagáis, hagan."}
          - {w: "falto", f: "falt- + -o → faltar (to be away), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "dejes", f: "dej- + -es → dejar (to leave), present subjunctive, you, because the deed is only feared, not real. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "ella", f: "'it', feminine because it stands for 'daga'."}
          - {w: "quieren", f: "quier- + -en → querer (to love), present, they. The e of the stem becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
        note: "Camila has just called for Lotario to be fetched so that she can take revenge on him, dagger in hand. Leonela plays her part in the act: she pretends to fear that her mistress will turn the dagger on herself."
