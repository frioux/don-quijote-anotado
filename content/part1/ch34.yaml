          - {w: "saliese", f: "sal- + -iese → salir (to go out), imperfect subjunctive (-se form), she, after 'antes que'. The -se form of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen."}
          - {w: "salió", f: "sal- + -ió → salir (to go out), preterite, she. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "volvía", f: "volv- + -ía → volver (to return), imperfect, she. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
