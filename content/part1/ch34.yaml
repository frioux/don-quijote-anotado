  - sentences:
      - es: "»—En cuanto poetas, no la dicen —respondió Lotario—; mas, en cuanto enamorados, siempre quedan tan cortos como verdaderos."
        literal: "In as-much [as] poets, not it they-tell, answered Lotario; but, in as-much [as] lovers, always they-remain as short as truthful."
        ormsby: "“As poets they do not tell the truth,” replied Lothario; “but as lovers they are not more defective in expression than they are truthful.”"
        vocab:
          - {w: "en cuanto", d: "as, in so far as (being)"}
          - {w: "quedar corto", d: "to fall short, say too little"}
        diagram:
          - s: "no la dicen"
            r: "main verb 1: they do not tell it (the truth)"
            under:
              - {s: "En cuanto poetas", r: "as what: as poets"}
              - {s: "—respondió Lotario—", r: "speech tag: answered Lotario"}
          - s: "siempre quedan tan cortos como verdaderos"
            r: "main verb 2 (after 'mas'): they always fall as short as they are truthful"
            under:
              - {s: "en cuanto enamorados", r: "as what: as lovers"}
        forms:
          - {w: "la dicen", f: "dic- + -en → decir (to tell), present, they; 'la' = it, standing for 'la verdad'. decir in the present: digo, dices, dice, decimos, decís, dicen."}
          - {w: "quedan", f: "qued- + -an → quedar (to remain), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "tan cortos como verdaderos", f: "tan ... como = as ... as; masculine plural to match the poets."}
        note: "Lotario's answer is double: as poets they exaggerate, but as lovers their words fall short of what they feel, so they are both truthful and inadequate. It is aimed at Camila."
  - sentences:
      - es: "»—No hay duda deso —replicó Anselmo, todo por apoyar y acreditar los pensamientos de Lotario con Camila, tan descuidada del artificio de Anselmo como ya enamorada de Lotario."
        literal: "Not there-is doubt of-that, replied Anselmo, all for to-support and to-accredit the thoughts of Lotario with Camila, as careless of-the artifice of Anselmo as already in-love with Lotario."
        ormsby: "“There is no doubt of that,” observed Anselmo, anxious to support and uphold Lothario’s ideas with Camilla, who was as regardless of his design as she was deep in love with Lothario;"
        vocab:
          - {w: "deso", d: "= de eso (of that)"}
          - {w: "replicar", d: "to reply, answer back"}
          - {w: "apoyar", d: "to support, back up"}
          - {w: "acreditar", d: "to give credit to, make believable"}
          - {w: "descuidado de", d: "unaware of, paying no heed to"}
          - {w: "artificio", d: "scheme, contrivance"}
        diagram:
          - s: "No hay duda deso"
