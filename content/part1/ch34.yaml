          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, it. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "comenzó", f: "comenz- + -ó → comenzar (to begin), preterite, she. Same -ar preterite."}
          - {w: "amargamente", f: "amarga (bitter) + -mente → adverb."}
      - es: "»—¡Ay, desdichada de mí si fuese tan sin ventura que se me muriese aquí entre mis brazos la flor de la honestidad del mundo, la corona de las buenas mujeres, el ejemplo de la castidad...!"
        literal: "Ah, unhappy of me if I-were so without fortune that on-me might-die here between my arms the flower of the chastity of-the world, the crown of the good women, the example of the chastity...!"
        ormsby: "“Woe is me! that I should be fated to have dying here in my arms the flower of virtue upon earth, the crown of true wives, the pattern of chastity!”"
        vocab:
          - {w: "¡desdichada de mí!", d: "woe is me! (said by a woman)"}
          - {w: "sin ventura", d: "unfortunate, unlucky"}
          - {w: "honestidad", d: "chastity, virtue"}
          - {w: "castidad", d: "chastity"}
        diagram:
          - s: "¡Ay, desdichada de mí"
            r: "main exclamation, no verb: ah, woe is me"
            under:
              - s: "si fuese tan sin ventura"
                r: "condition: if I were so unlucky"
                under:
                  - {s: "que se me muriese aquí entre mis brazos la flor de la honestidad del mundo, la corona de las buenas mujeres, el ejemplo de la castidad...!", r: "result: that the flower of chastity, the crown of good women, the model of purity should die here in my arms"}
        forms:
          - {w: "desdichada", f: "desdichado (unhappy), feminine for Leonela."}
          - {w: "fuese", f: "fu- + -ese → ser (to be), imperfect subjunctive (-se form), I. fuese, fueses, fuese, fuésemos, fueseis, fuesen."}
          - {w: "se me muriese", f: "mur- + -iese → morirse (to die), imperfect subjunctive (-se form), she, + me (on me, to my grief). The o of the stem becomes u: muriese, murieses, muriese, muriésemos, murieseis, muriesen."}
        note: "Leonela's lament uses the same praise Lotario gave Camila earlier ('corona de todas las mujeres buenas'), now as a performance for the hidden husband."
  - sentences:
      - es: "»Con otras cosas a éstas semejantes, que ninguno la escuchara que no la tuviera por la más lastimada y leal doncella del mundo, y a su señora por otra nueva y perseguida Penélope."
        literal: "With other things to these similar, so-that nobody her would-hear who not her would-hold for the most grieved and loyal maid of-the world, and [to] her lady for another new and persecuted Penelope."
        ormsby: "with more to the same effect, so that anyone who heard her would have taken her for the most tenderhearted and faithful handmaid in the world, and her mistress for another persecuted Penelope."
        vocab:
          - {w: "semejante a", d: "similar to"}
