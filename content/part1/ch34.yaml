  - sentences:
      - es: "»—No corre por ti esa razón —respondió Leonela—, porque el amor, según he oído decir, unas veces vuela y otras anda, con éste corre y con aquél va despacio, a unos entibia y a otros abrasa, a unos hiere y a otros mata, en un mesmo punto comienza la carrera de sus deseos y en aquel mesmo punto la acaba y concluye, por la mañana suele poner el cerco a una fortaleza y a la noche la tiene rendida, porque no hay fuerza que le resista."
        literal: "Not runs for you that reasoning, answered Leonela, because the love, according-to I-have heard say, some times flies and others walks, with this-one runs and with that-one goes slowly, [to] some cools and [to] others burns, [to] some wounds and [to] others kills, in one same point begins the race of its desires and in that same point it ends and concludes, in the morning is-wont to-put the siege to a fortress and at the night it has surrendered, because not there-is force that it may-resist."
