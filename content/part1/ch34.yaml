      - es: "Mira, señora, que somos flacas mujeres, y él es hombre y determinado; y, como viene con aquel mal propósito, ciego y apasionado, quizá antes que tú pongas en ejecución el tuyo, hará él lo que te estaría más mal que quitarte la vida."
