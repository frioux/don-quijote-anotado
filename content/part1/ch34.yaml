          - {w: "acertado", d: "wise, sensible, the right thing"}
          - {w: "despedir", d: "to send away, dismiss"}
          - {w: "que no", d: "than; the 'no' after a comparison is redundant"}
          - {w: "poner en condición que", d: "to put (someone) in a position where ..., run the risk that"}
          - {w: "tener por", d: "to take for, consider"}
          - {w: "deshonesto", d: "unchaste, immodest (false friend: not 'dishonest')"}
          - {w: "siquiera", d: "at least, if only"}
          - {w: "desengañar", d: "to undeceive, open someone's eyes"}
        diagram:
          - {s: "¡Válame Dios!", r: "exclamation: God help me"}
          - s: "¿No fuera más acertado"
            r: "main verb: would it not have been wiser"
            under:
              - s: "haber despedido a Lotario"
                r: "subject: to have sent Lotario away"
