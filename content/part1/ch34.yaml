                  - s: "por mar no usado y peligrosa vía"
                    r: "where: over an unsailed sea and dangerous route"
                    under:
                      - {s: "adonde norte o puerto no se ofrece!", r: "describes the sea: where no pole star or harbor appears"}
        forms:
          - {w: "navega", f: "naveg- + -a → navegar (to sail), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "el cielo escuro", f: "an absolute phrase with no verb: 'the sky (being) dark'; escuro = oscuro."}
