  - sentences:
      - es: "»Con esto, se fue Lotario; y Anselmo, otro día, con la escusa de ir aquella aldea de su amigo, se partió y volvió a esconderse:"
        literal: "With this, himself went Lotario; and Anselmo, next day, with the excuse of going [to] that village of his friend, himself departed and returned to hide-himself:"
        ormsby: "Lothario then retired, and the next day Anselmo, under pretence of going to his friend’s country house, took his departure, and then returned to conceal himself,"
        vocab:
          - {w: "escusa", d: "= excusa (excuse, pretext), old spelling"}
          - {w: "aldea", d: "village; here a friend's country place"}
          - {w: "partirse", d: "to depart, set off"}
          - {w: "volver a + infinitive", d: "here: to come back to (do), 'volvió a esconderse' = came back and hid"}
        diagram:
