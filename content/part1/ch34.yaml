        note: "In the honor code of the Spanish stage, a husband who discovered his wife's adultery was expected to take revenge in secret, 'with silence', so as not to publish his shame."
  - sentences:
      - es: "»Absorto, suspenso y admirado quedó Anselmo con las razones de Lotario, porque le cogieron en tiempo donde menos las esperaba oír, porque ya tenía a Camila por vencedora de los fingidos asaltos de Lotario y comenzaba a gozar la gloria del vencimiento."
        literal: "Absorbed, suspended and astonished remained Anselmo with the words of Lotario, because him they-caught in time where least them he-expected to-hear, because already he-held [to] Camila as victor of the feigned assaults of Lotario and began to enjoy the glory of-the victory."
        ormsby: "Anselmo was amazed, overwhelmed, and astounded at the words of Lothario, which came upon him at a time when he least expected to hear them, for he now looked upon Camilla as having triumphed over the pretended attacks of Lothario, and was beginning to enjoy the glory of her victory."
        vocab:
          - {w: "absorto", d: "amazed, lost in thought"}
          - {w: "suspenso", d: "astonished, stunned, at a loss"}
          - {w: "admirado", d: "amazed (false friend)"}
          - {w: "coger", d: "to catch, take"}
          - {w: "tener por", d: "to consider"}
          - {w: "vencedora", d: "victor, winner (feminine)"}
          - {w: "asalto", d: "assault, attack"}
          - {w: "vencimiento", d: "victory, conquest"}
        diagram:
          - s: "Absorto, suspenso y admirado quedó Anselmo"
            r: "main verb: Anselmo was left amazed, stunned and astonished"
            under:
              - {s: "con las razones de Lotario", r: "at what: at Lotario's words"}
              - {s: "porque le cogieron en tiempo donde menos las esperaba oír", r: "why: because they caught him when he least expected to hear them"}
              - s: "porque ya tenía a Camila por vencedora de los fingidos asaltos de Lotario"
                r: "why, 2: because he already counted Camila victorious over Lotario's pretended assaults"
                under:
                  - {s: "y comenzaba a gozar la gloria del vencimiento", r: "and was beginning to enjoy the glory of the victory"}
        forms:
          - {w: "Absorto, suspenso, admirado", f: "irregular participles of absorber (to absorb) and suspender (to hold in suspense), and the participle of admirar (to amaze), masculine to match Anselmo; put first for emphasis."}
          - {w: "quedó", f: "qued- + -ó → quedar (to be left), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "cogieron", f: "cog- + -ieron → coger (to catch), preterite, they (the words). The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "esperaba, comenzaba", f: "esper- + -aba, comenz- + -aba → esperar (to expect), comenzar (to begin), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "tenía", f: "ten- + -ía → tener (to hold), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
      - es: "Callando estuvo por un buen espacio, mirando al suelo sin mover pestaña, y al cabo dijo:"
        literal: "Being-silent he-was for a good space, looking at-the ground without moving eyelash, and at-the end said:"
        ormsby: "He remained silent for a considerable time, looking on the ground with fixed gaze, and at length said,"
        vocab:
          - {w: "buen espacio", d: "a good while"}
          - {w: "sin mover pestaña", d: "without moving an eyelash, without blinking"}
          - {w: "al cabo", d: "at last, finally"}
