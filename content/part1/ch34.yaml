      - es: "Y, haciendo fuerza para soltar la mano de la daga, que Lotario la tenía asida, la sacó, y, guiando su punta por parte que pudiese herir no profundamente, se la entró y escondió por más arriba de la islilla del lado izquierdo, junto al hombro, y luego se dejó caer en el suelo, como desmayada."
