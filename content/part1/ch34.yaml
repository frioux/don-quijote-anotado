  - sentences:
      - es: "»—Sabed, amigo Lotario, que tengo una pena en el corazón que me le aprieta de suerte que parece que quiere reventar en el pecho, y ha de ser maravilla si no lo hace, pues ha llegado la desvergüenza de Leonela a tanto, que cada noche encierra a un galán suyo en esta casa y se está con él hasta el día, tan a costa de mi crédito cuanto le quedará campo abierto de juzgarlo al que le viere salir a horas tan inusitadas de mi casa."
        literal: "Know, friend Lotario, that I-have a grief in the heart that to-me it squeezes in way that it-seems that it-wants to-burst in the breast, and it-has to be marvel if not it does, since has arrived the shamelessness of Leonela at so-much, that each night she-shuts-in [to] a gallant hers in this house and herself stays with him until the day, as-much at cost of my reputation as to-him will-remain field open of judging-it to-the [one] who him may-see go-out at hours so unusual from my house."
        ormsby: "“Lothario my friend, I must tell thee I have a sorrow in my heart which fills it so that it seems ready to burst; and it will be a wonder if it does not; for the audacity of Leonela has now reached such a pitch that every night she conceals a gallant of hers in this house and remains with him till morning, at the expense of my reputation; inasmuch as it is open to anyone to question it who may see him quitting my house at such unseasonable hours;"
        vocab:
          - {w: "sabed", d: "know (command, to vos); Camila here addresses Lotario as 'vos'"}
          - {w: "pena", d: "grief, sorrow"}
          - {w: "de suerte que", d: "so that, in such a way that"}
          - {w: "reventar", d: "to burst"}
          - {w: "desvergüenza", d: "shamelessness, insolence"}
          - {w: "llegar a tanto", d: "to go so far, reach such a pitch"}
          - {w: "galán", d: "lover, suitor"}
          - {w: "a costa de", d: "at the cost of"}
          - {w: "campo abierto", d: "open field, free rein"}
          - {w: "inusitado", d: "unusual, untimely"}
        diagram:
          - s: "Sabed"
            r: "main verb: know"
            under:
              - {s: "amigo Lotario", r: "address"}
              - s: "que tengo una pena en el corazón"
                r: "what: that I have a grief in my heart"
                under:
                  - s: "que me le aprieta de suerte que parece que quiere reventar en el pecho"
                    r: "describes 'pena': which squeezes it so that it seems about to burst in my breast"
                  - {s: "y ha de ser maravilla si no lo hace", r: "and it will be a wonder if it does not"}
              - s: "pues ha llegado la desvergüenza de Leonela a tanto"
                r: "why: since Leonela's shamelessness has gone so far"
                under:
                  - {s: "que cada noche encierra a un galán suyo en esta casa y se está con él hasta el día", r: "result: that every night she shuts a lover of hers in this house and stays with him till daylight"}
                  - s: "tan a costa de mi crédito"
                    r: "how: so much at the cost of my good name"
                    under:
                      - {s: "cuanto le quedará campo abierto de juzgarlo al que le viere salir a horas tan inusitadas de mi casa", r: "as: as anyone who sees him leave my house at such hours will be free to judge it"}
        forms:
          - {w: "Sabed", f: "sabed, the command of saber (to know) for vos/vosotros: infinitive with -r replaced by -d."}
          - {w: "me le aprieta", f: "apriet- + -a → apretar (to squeeze), present, it. 'le' = it (the heart), 'me' = for me. The e becomes ie when stressed: aprieto, aprietas, aprieta, apretamos, apretáis, aprietan."}
          - {w: "quiere", f: "quier- + -e → querer (to want), present, it. quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "ha de ser", f: "ha, from haber (to have), present, it, + de + ser (to be): 'it will be'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "ha llegado", f: "ha, from haber (to have), present, it, + llegado (participle of llegar, to arrive): 'has reached'. Same present of haber as in 'ha de ser'."}
          - {w: "encierra", f: "encierr- + -a → encerrar (to shut in), present, she. encierro, encierras, encierra, encerramos, encerráis, encierran."}
          - {w: "se está", f: "está, from estar (to be), present, she, with 'se': 'stays'. estar in the present: estoy, estás, está, estamos, estáis, están."}
          - {w: "quedará", f: "quedar- + -á → quedar (to remain), future, it. Future endings: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "viere", f: "vi- + -ere → ver (to see), future subjunctive, he: 'whoever may see'. viere, vieres, viere, viéremos, viereis, vieren. Modern 'vea'."}
