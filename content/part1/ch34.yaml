  - sentences:
      - es: "»—Si eso confiesas —respondió Camila—, enemigo mortal de todo aquello que justamente merece ser amado, ¿con qué rostro osas parecer ante quien sabes que es el espejo donde se mira aquel en quien tú te debieras mirar, para que vieras con cuán poca ocasión le agravias?"
        literal: "— If that you-confess — answered Camila —, enemy mortal of all that which justly deserves to-be loved, with what face do-you-dare to-appear before [her] who you-know that is the mirror where himself looks that-one in whom you yourself ought to-look, so-that you-might-see with how little cause him you-wrong?"
        ormsby: "“If thou dost confess that,” returned Camilla, “mortal enemy of all that rightly deserves to be loved, with what face dost thou dare to come before one whom thou knowest to be the mirror wherein he is reflected on whom thou shouldst look to see how unworthily thou wrongest him?"
        vocab:
          - {w: "confesar", d: "to admit, confess"}
          - {w: "justamente", d: "rightly, justly (not 'just' in the sense of 'only')"}
          - {w: "con qué rostro", d: "with what face, i.e. how dare you"}
          - {w: "osar", d: "to dare"}
          - {w: "parecer", d: "here = aparecer, to appear, show oneself"}
          - {w: "espejo", d: "mirror"}
          - {w: "mirarse en", d: "to look at oneself in; also to take as one's model"}
          - {w: "con cuán poca ocasión", d: "with how little cause"}
          - {w: "agraviar", d: "to wrong, injure (someone's honor)"}
        diagram:
          - {s: "respondió Camila", r: "speech tag: answered Camila"}
          - s: "¿con qué rostro osas parecer"
            r: "main verb: with what face do you dare to appear"
            under:
