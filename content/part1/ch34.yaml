          - {w: "amenaza", f: "amenaz- + -a → amenazar (to threaten), present, it. Same -ar present."}
          - {w: "se fortalece", f: "fortalec- + -e → fortalecerse (to grow strong), present, it. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (with 'fortalezco' for I)."}
          - {w: "mismo", f: "after 'tu' and before the noun it means 'very': 'your very harshness'."}
      - es: "¡Ay de aquel que navega, el cielo escuro, por mar no usado y peligrosa vía, adonde norte o puerto no se ofrece!"
        literal: "Alas for him who sails, the sky dark, through sea not used and dangerous way, where north-star or port not itself offers!"
