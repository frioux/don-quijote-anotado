            r: "main verb 1: for he could do it easily"
            under:
              - {s: "porque de industria se la dieron Camila y Leonela", r: "why: because Camila and Leonela gave him the chance on purpose"}
          - s: "íbase a pique de perder el sumo bien"
            r: "main verb 2, new paragraph: he was on the point of losing the highest good"
            under:
              - {s: "Escondido, pues, Anselmo", r: "when: Anselmo being hidden, then"}
