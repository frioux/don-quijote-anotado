        literal: "Leonela her took in arms and her put on the bed, begging [to] Lotario [that] he-should-go to look-for [someone] who secretly [to] Camila might-treat; she-was-asking-him likewise counsel and opinion of what they-would-say to Anselmo of that wound of her lady, if perhaps he-should-come before that she-might-be healed."
