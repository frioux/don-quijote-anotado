          - {w: "quiero", f: "quier- + -o → querer (to want), present, I. quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "sepas", f: "sep- + -as → saber (to know), present subjunctive, you. sepa, sepas, sepa, sepamos, sepáis, sepan."}
