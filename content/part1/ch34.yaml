      - es: "y si fuere la maldad que se puede temer antes que esperar, con silencio, sagacidad y discreción podrás ser el verdugo de tu agravio."
        literal: "and if it-may-be the wickedness that can-be feared rather than expected, with silence, sagacity and discretion you-will-be-able to-be the executioner of your wrong."
        ormsby: "And if it be a guilty one, which may be feared rather than expected, with silence, prudence, and discretion thou canst thyself become the instrument of punishment for the wrong done thee.”"
