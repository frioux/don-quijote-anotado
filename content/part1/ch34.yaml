      - es: "La cual tan vivamente fingía aquel estraño embuste y fealdad que, por dalle color de verdad, la quiso matizar con su misma sangre; porque, viendo que no podía haber a Lotario, o fingiendo que no podía, dijo:"
        literal: "The which so vividly was-feigning that strange trick and ugliness that, to give-it color of truth, it she-wanted to-tint with her same blood; because, seeing that not she-could get [to] Lotario, or pretending that not she-could, she-said:"
        ormsby: "and with such reality did she act this strange farce and mystification that, to give it a colour of truth, she determined to stain it with her own blood; for perceiving, or pretending, that she could not wound Lothario, she said,"
