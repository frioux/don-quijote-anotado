  - sentences:
      - es: "»—No te dé pena eso, señora mía —respondió Leonela—, que no está la monta, ni es causa para menguar la estimación, darse lo que se da presto, si, en efecto, lo que se da es bueno, y ello por sí digno de estimarse."
        literal: "Not to-you may-give grief that, lady mine, answered Leonela, for not is the worth, nor is cause for to-lessen the esteem, to-give-itself that which is-given quickly, if, in effect, that which is-given is good, and it by itself worthy of to-be-esteemed."
        ormsby: "“Let not that trouble you, my lady,” said Leonela, “for it does not take away the value of the thing given or make it the less precious to give it quickly if it be really valuable and worthy of being prized;"
