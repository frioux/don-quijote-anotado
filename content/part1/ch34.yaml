      - es: "Finge que te ausentas por dos o tres días, como otras veces sueles, y haz de manera que te quedes escondido en tu recámara, pues los tapices que allí hay y otras cosas con que te puedas encubrir te ofrecen mucha comodidad, y entonces verás por tus mismos ojos, y yo por los míos, lo que Camila quiere;"
        literal: "Pretend that yourself you-absent for two or three days, as other times you-are-wont, and make in manner that yourself you-stay hidden in your closet, since the tapestries that there there-are and other things with which yourself you-may-cover offer-you much convenience, and then you-will-see through your same eyes, and I through mine, that which Camila wants;"
        ormsby: "pretend to absent thyself for two or three days as thou hast been wont to do on other occasions, and contrive to hide thyself in the closet; for the tapestries and other things there afford great facilities for thy concealment, and then thou wilt see with thine own eyes and I with mine what Camilla’s purpose may be."
