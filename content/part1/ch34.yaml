          - {w: "era", f: "ser (to be), imperfect, it. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "daba", f: "d- + -aba → dar (to give), imperfect, it (the absence). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "aquella", f: "'that', feminine to match 'fortaleza'."}
        note: "From here the seduction is told as a siege, the standard metaphor of love poetry: the fortress, the towers of vanity, the mining of the rock, the engines of war."
