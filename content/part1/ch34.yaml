  - sentences:
      - es: "»—¿Qué, amiga? —respondió Camila—: dejarémosle para que Anselmo le entierre, pues será justo que tenga por descanso el trabajo que tomare en poner debajo de la tierra su misma infamia."
        literal: "What, friend? answered Camila: we-will-leave-him so-that Anselmo him may-bury, since it-will-be just that he-may-hold as rest the labor that he-may-take in putting under the earth his own infamy."
        ormsby: "“What, my friend?” replied Camilla, “we shall leave him for Anselmo to bury him; for in reason it will be to him a light labour to hide his own infamy under ground."
        vocab:
          - {w: "enterrar", d: "to bury"}
          - {w: "tener por descanso", d: "to count as a relief, find restful"}
          - {w: "infamia", d: "infamy, disgrace"}
        diagram:
          - {s: "¿Qué, amiga?", r: "question: what (shall we do), my friend"}
          - {s: "—respondió Camila—", r: "speech tag: answered Camila"}
          - s: "dejarémosle"
            r: "main verb: we will leave him"
            under:
              - {s: "para que Anselmo le entierre", r: "purpose: for Anselmo to bury"}
              - s: "pues será justo"
                r: "why: since it will be fitting"
                under:
                  - s: "que tenga por descanso el trabajo"
                    r: "what: that he count as a rest the labor"
                    under:
                      - {s: "que tomare en poner debajo de la tierra su misma infamia", r: "describes 'trabajo': which he may take in putting his own disgrace underground"}
        forms:
          - {w: "dejarémosle", f: "dejar- + -emos → dejar (to leave), future, we, + le (him); modern 'le dejaremos'. Future endings: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "entierre", f: "entierr- + -e → enterrar (to bury), present subjunctive, he, after 'para que'. The e becomes ie when stressed: entierre, entierres, entierre, enterremos, enterréis, entierren."}
          - {w: "será", f: "ser- + -á → ser (to be), future, it. seré, serás, será, seremos, seréis, serán."}
          - {w: "tenga", f: "teng- + -a → tener (to hold), present subjunctive, he. tenga, tengas, tenga, tengamos, tengáis, tengan."}
          - {w: "tomare", f: "tom- + -are → tomar (to take), future subjunctive, he. The future subjunctive of -ar verbs: -are, -ares, -are, -áremos, -areis, -aren. Modern 'tome'."}
        note: "Camila's line is a double game: Anselmo, listening, hears that burying Lotario would bury his own disgrace."
