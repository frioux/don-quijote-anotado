          - {w: "afeaba", f: "afe- + -aba → afear (to censure), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "sabía", f: "sab- + -ía → saber (to know), imperfect, he. Same -ía imperfect."}
          - {w: "lo hecho", f: "'lo' + hecho (participle of hacer, to do): 'what was done'."}
