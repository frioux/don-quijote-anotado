          - {w: "vivamente", f: "viva (lively) + -mente → adverb 'vividly'."}
          - {w: "fingía", f: "fing- + -ía → fingir (to feign), imperfect, she. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "dalle", f: "dar (to give) + le (to it), with -rl- turned into -ll-, a common sound change in Cervantes' day."}
          - {w: "la quiso matizar", f: "quis- + -o → querer (to want), preterite, she, + matizar (to tint); 'la' (it, the trick) belongs to 'matizar' but stands before 'quiso'. Irregular: quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
