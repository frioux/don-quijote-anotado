          - {w: "llegar a saber", d: "to come to know, find out"}
          - {w: "saber de que", d: "to know that; the 'de' is an old pleonasm (modern 'saber que')"}
          - {w: "lealtad", d: "loyalty, faithfulness"}
          - {w: "dar venganza de", d: "to give (someone) vengeance on, avenge (someone) on"}
          - {w: "ofendelle", d: "= ofenderle, to offend him, wrong him"}
        diagram:
