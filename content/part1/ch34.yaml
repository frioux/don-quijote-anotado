        literal: "but held-him-back the desire of seeing in what ended so-much gallantry and chaste resolution, with purpose of going-out at time that it he-might-hinder."
        ormsby: "but in his anxiety to see the issue of a resolution so bold and virtuous he restrained himself, intending to come forth in time to prevent the deed."
        vocab:
