          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, she. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
      - es: "porque, ya que sea atrevida y simple a tu parecer en volver por mi honra, no lo he de ser tanto como aquella Lucrecia de quien dicen que se mató sin haber cometido error alguno, y sin haber muerto primero a quien tuvo la causa de su desgracia."
        literal: "because, granted that I-may-be bold and simple to your opinion in turning for my honor, not it I-have to be so-much as that Lucretia of whom they-say that herself she-killed without having committed error any, and without having killed first [to] him-who had the cause of her misfortune."
        ormsby: "“for rash and foolish as I may be, to your mind, in defending my honour, I am not going to be so much so as that Lucretia who they say killed herself without having done anything wrong, and without having first killed him on whom the guilt of her misfortune lay."
        vocab:
          - {w: "ya que", d: "here 'granted that, even if' (with the subjunctive); in modern Spanish usually 'since'"}
          - {w: "atrevido", d: "bold, rash"}
          - {w: "simple", d: "foolish, naive (a false friend: not just 'simple')"}
          - {w: "a tu parecer", d: "in your opinion"}
          - {w: "volver por", d: "to stand up for, defend (someone's honor or cause)"}
          - {w: "Lucrecia", d: "Lucretia, the Roman wife raped by Sextus Tarquinius; she told her husband and father, then stabbed herself, and her death brought down the Roman kings. The classic model of the chaste wife"}
          - {w: "error alguno", d: "any error at all; 'alguno' after the noun in a negative sentence = none whatever"}
          - {w: "muerto", d: "here 'killed': 'haber muerto a alguien' = to have killed someone, an old transitive use of morir"}
          - {w: "tener la causa de", d: "to be to blame for"}
        diagram:
          - s: "no lo he de ser tanto"
            r: "main verb (after 'porque'): I am not going to be so (rash)"
            under:
              - s: "ya que sea atrevida y simple a tu parecer"
                r: "concession: granted I am bold and foolish, in your view"
                under:
                  - {s: "en volver por mi honra", r: "in what: in standing up for my honor"}
              - s: "como aquella Lucrecia"
                r: "compared with: as that Lucretia"
                under:
                  - s: "de quien dicen que se mató"
                    r: "describes 'Lucrecia': who, they say, killed herself"
                    under:
                      - {s: "sin haber cometido error alguno", r: "how: without having done anything wrong"}
                      - {s: "y sin haber muerto primero a quien tuvo la causa de su desgracia", r: "how, 2: and without first killing the man to blame for her misfortune"}
        forms:
          - {w: "sea", f: "ser (to be), present subjunctive, I, after 'ya que' in a concession. Irregular: sea, seas, sea, seamos, seáis, sean."}
          - {w: "atrevida", f: "atrev- + -ida → participle of atreverse (to dare), used as an adjective, 'bold', feminine for Camila."}
          - {w: "lo he de ser", f: "he, from haber (to have), present, I, + de + ser (to be): 'I am (not) going to be'; 'lo' (it) stands for 'atrevida y simple'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "dicen", f: "dic- + -en → decir (to say), present, they (people in general): 'they say'. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "se mató", f: "mat- + -ó → matarse (to kill oneself), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "haber cometido, haber muerto", f: "perfect infinitives after 'sin': haber (to have) + cometido, participle of cometer (to commit), and + muerto, the irregular participle of morir (to die, here 'to kill')."}
          - {w: "a quien", f: "'him who', with the personal 'a' because he is the one killed."}
          - {w: "tuvo", f: "tuv- + -o → tener (to have), preterite, he. Irregular: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron."}
        note: "Lucretia did not kill Tarquin; she made her husband and kinsmen swear to avenge her and then killed herself. Camila boasts she will improve on the most famous chaste wife of antiquity by killing the offender first, all the while acting a part."
      - es: "Yo moriré, si muero, pero ha de ser vengada y satisfecha del que me ha dado ocasión de venir a este lugar a llorar sus atrevimientos, nacidos tan sin culpa mía."
        literal: "I will-die, if I-die, but it-has to be [as one] avenged and satisfied of-the [one] who me has given occasion to come to this place to weep his audacities, born so without fault mine."
        ormsby: "I shall die, if I am to die; but it must be after full vengeance upon him who has brought me here to weep over audacity that no fault of mine gave birth to.”"
        vocab:
