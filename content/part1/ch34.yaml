                r: "how: with that anxiety"
                under:
                  - {s: "que se puede imaginar que tendría el que esperaba ver por sus ojos hacer notomía de las entrañas de su honra", r: "describes 'sobresalto': which one can imagine in a man expecting to see his honor dissected before his eyes"}
              - {s: "que él pensaba que tenía en su querida Camila", r: "describes 'bien': which he thought he had in his beloved Camila"}
        forms:
          - {w: "pudo", f: "pud- + -o → poder (can), preterite, he. pude, pudiste, pudo, pudimos, pudisteis, pudieron."}
          - {w: "se la dieron", f: "di- + -eron → dar (to give), preterite, they; 'se' = to him (le before la), 'la' = it (the comodidad). di, diste, dio, dimos, disteis, dieron."}
          - {w: "Escondido", f: "participle of esconder (to hide), in an absolute phrase: 'Anselmo being hidden'."}
          - {w: "tendría", f: "tendr- + -ía → tener (to have), conditional, he. tendría, tendrías, tendría, tendríamos, tendríais, tendrían."}
          - {w: "esperaba, pensaba", f: "imperfect, he, of esperar (to expect) and pensar (to think). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "íbase", f: "iba, from ir (to go), imperfect, he, + se on the end; modern 'se iba'. iba, ibas, iba, íbamos, ibais, iban."}
          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "querida", f: "participle of querer (to love), feminine: 'beloved'."}
      - es: "Seguras ya y ciertas Camila y Leonela que Anselmo estaba escondido, entraron en la recámara; y apenas hubo puesto los pies en ella Camilia, cuando, dando un grande suspiro, dijo:"
        literal: "Sure now and certain Camila and Leonela that Anselmo was hidden, they-entered into the closet; and hardly had put the feet in it Camila, when, giving a great sigh, she-said:"
