          - {w: "dar cuenta de", d: "to report, give an account of"}
          - {w: "desto", d: "= de esto, of this"}
          - {w: "apuntar", d: "to hint at, sketch; 'se la apunté a dar' = I began to give him (the account), I hinted it to him"}
