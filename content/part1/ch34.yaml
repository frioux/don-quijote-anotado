          - {w: "apretar el cerco", d: "to tighten the siege, press the attack"}
          - {w: "fortaleza", d: "fortress; also 'strength, fortitude' (a pun: Camila's virtue is the fortress)"}
        diagram:
          - s: "a él le pareció"
            r: "main verb: it seemed to him"
