          - {w: "queriendo", f: "gerund of querer (to want)."}
          - {w: "pensaba", f: "pens- + -aba → pensar (to intend), imperfect, she. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "quisiese, siguiese, buscase", f: "imperfect subjunctive (-se form), he, after 'temerosa que': querer (to want): quisiese, quisieses, quisiese, quisiésemos, quisieseis, quisiesen; seguir (to follow, stem e → i): siguiese, siguieses, siguiese, siguiésemos, siguieseis, siguiesen; buscar (to seek), with the -ar endings -ase, -ases, -ase, -ásemos, -aseis, -asen."}
