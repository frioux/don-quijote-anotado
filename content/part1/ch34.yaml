      - es: "Y no parece sino que le faltó a Lotario en este punto todo su buen entendimiento, y se le fueron de la memoria todos sus advertidos discursos, pues, sin hacer alguno que bueno fuese, ni aun razonable, sin más ni más, antes que Anselmo se levantase, impaciente y ciego de la celosa rabia que las entrañas le roía, muriendo por vengarse de Camila, que en ninguna cosa le había ofendido, se fue a Anselmo y le dijo:"
        literal: "And not it-seems but that to-him failed to Lotario at this point all his good understanding, and to-him went from the memory all his prudent reasonings, since, without making any that good might-be, nor even reasonable, without more nor more, before that Anselmo himself might-rise, impatient and blind with the jealous rage that the entrails to-him gnawed, dying for to-avenge-himself on Camila, who in no thing him had offended, himself he-went to Anselmo and to-him said:"
        ormsby: "All Lothario’s good sense seems to have failed him at this juncture; all his prudent maxims escaped his memory; for without once reflecting rationally, and without more ado, in his impatience and in the blindness of the jealous rage that gnawed his heart, and dying to revenge himself upon Camilla, who had done him no wrong, before Anselmo had risen he hastened to him and said to him,"
