  - sentences:
      - es: "»—Tú lo has hecho, Lotario, como yo esperaba de tu amistad; en todo he de seguir tu consejo: haz lo que quisieres y guarda aquel secreto que ves que conviene en caso tan no pensado."
        literal: "You it have done, Lotario, as I expected from your friendship; in all I-have to follow your counsel: do that which you-may-wish and keep that secret that you-see that is-fitting in case so not thought."
        ormsby: "“Thou hast behaved, Lothario, as I expected of thy friendship: I will follow thy advice in everything; do as thou wilt, and keep this secret as thou seest it should be kept in circumstances so unlooked for.”"
        vocab:
          - {w: "haber de + infinitive", d: "to be going to, must"}
          - {w: "convenir", d: "to be fitting, advisable"}
          - {w: "no pensado", d: "unexpected, unforeseen"}
        diagram:
          - s: "Tú lo has hecho"
            r: "main verb 1: you have done it (behaved)"
            under:
              - {s: "Lotario", r: "address"}
              - {s: "como yo esperaba de tu amistad", r: "how: as I expected of your friendship"}
          - {s: "en todo he de seguir tu consejo", r: "main verb 2: I will follow your advice in everything"}
          - {s: "haz lo que quisieres", r: "main verb 3: do what you wish"}
          - s: "y guarda aquel secreto"
            r: "main verb 4: and keep that secret"
            under:
              - {s: "que ves que conviene en caso tan no pensado", r: "describes 'secreto': which you see is fitting in so unexpected a case"}
        forms:
          - {w: "has hecho", f: "has, from haber (to have), present, you, + hecho (participle of hacer, to do): 'you have done'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "esperaba", f: "esper- + -aba → esperar (to expect), imperfect, I. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "he de seguir", f: "he, from haber (to have), present, I, + de + seguir (to follow): 'I will follow'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "haz, guarda", f: "tú commands of hacer (to do; irregular 'haz') and guardar (to keep)."}
          - {w: "quisieres", f: "quis- + -ieres → querer (to want), future subjunctive, you. quisiere, quisieres, quisiere, quisiéremos, quisiereis, quisieren. Modern 'quieras'."}
          - {w: "ves, conviene", f: "ver (to see), present, you: veo, ves, ve, vemos, veis, ven; conveni- → conviene, present, it, of convenir (to be fitting): convengo, convienes, conviene, convenimos, convenís, convienen."}
  - sentences:
      - es: "»Prometióselo Lotario, y, en apartándose dél, se arrepintió totalmente de cuanto le había dicho, viendo cuán neciamente había andado, pues pudiera él vengarse de Camila, y no por camino tan cruel y tan deshonrado."
        literal: "Promised-to-him-it Lotario, and, on parting-himself from-him, himself he-repented totally of all-that to-him he-had said, seeing how foolishly he-had gone, since could he avenge-himself on Camila, and not by road so cruel and so dishonored."
        ormsby: "Lothario gave him his word, but after leaving him he repented altogether of what he had said to him, perceiving how foolishly he had acted, as he might have revenged himself upon Camilla in some less cruel and degrading way."
        vocab:
          - {w: "en + gerund", d: "as soon as, on (doing): 'en apartándose' = as soon as he left"}
          - {w: "apartarse de", d: "to leave, move away from"}
          - {w: "arrepentirse de", d: "to repent, regret"}
          - {w: "neciamente", d: "foolishly"}
          - {w: "andar", d: "here: to act, behave"}
          - {w: "deshonrado", d: "dishonorable, shameful"}
        diagram:
          - {s: "Prometióselo Lotario", r: "main verb 1: Lotario promised it to him"}
          - s: "se arrepintió totalmente"
            r: "main verb 2 (after 'y'): he utterly repented"
            under:
              - {s: "en apartándose dél", r: "when: as soon as he left him"}
              - {s: "de cuanto le había dicho", r: "of what: of all he had told him"}
              - s: "viendo cuán neciamente había andado"
                r: "why: seeing how foolishly he had acted"
                under:
                  - {s: "pues pudiera él vengarse de Camila, y no por camino tan cruel y tan deshonrado", r: "why: since he could have taken revenge on Camila, and not in so cruel and shameful a way"}
        forms:
          - {w: "Prometióselo", f: "promet- + -ió → prometer (to promise), preterite, he, + se (to him, le turned into se before lo) + lo (it); modern 'se lo prometió'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "apartándose", f: "gerund of apartarse (to move away), accent added."}
          - {w: "dél", f: "= de + él (from him)."}
          - {w: "se arrepintió", f: "arrepint- + -ió → arrepentirse (to repent), preterite, he; the e of the stem becomes i in this form. The -ir preterite: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "había dicho, había andado", f: "había, from haber (to have), imperfect, he, + dicho (participle of decir, to say), andado (participle of andar, to act): 'had said', 'had acted'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "pudiera", f: "pud- + -iera → poder (can), imperfect subjunctive (-ra form), he, used as a conditional: 'could have'. pudiera, pudieras, pudiera, pudiéramos, pudierais, pudieran."}
      - es: "Maldecía su entendimiento, afeaba su ligera determinación, y no sabía qué medio tomarse para deshacer lo hecho, o para dalle alguna razonable salida."
        literal: "He-cursed his understanding, he-censured his light determination, and not he-knew what means to-take-himself for to-undo the done, or for to-give-it some reasonable exit."
        ormsby: "He cursed his want of sense, condemned his hasty resolution, and knew not what course to take to undo the mischief or find some ready escape from it."
        vocab:
          - {w: "maldecir", d: "to curse"}
          - {w: "afear", d: "to censure, reproach"}
          - {w: "ligero", d: "rash, hasty"}
          - {w: "medio", d: "means, way"}
          - {w: "dalle", d: "= darle (to give it)"}
          - {w: "salida", d: "way out"}
        diagram:
