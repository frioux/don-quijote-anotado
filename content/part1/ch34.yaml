part: 1
chapter: 34
title_es: "Capítulo XXXIV. Donde se prosigue la novela del Curioso impertinente"
title_en: "In which is continued the novel of The Ill-Advised Curiosity"
paragraphs:
  - sentences:
      - es: "»Así como suele decirse que parece mal el ejército sin su general y el castillo sin su castellano, digo yo que parece muy peor la mujer casada y moza sin su marido, cuando justísimas ocasiones no lo impiden."
        literal: "Just as is-wont to-be-said that looks bad the army without its general and the castle without its castellan, say I that looks very worse the woman married and young without her husband, when most-just occasions not it prevent."
        ormsby: "“It is commonly said that an army looks ill without its general and a castle without its castellan, and I say that a young married woman looks still worse without her husband unless there are very good reasons for it."
        vocab:
          - {w: "soler", d: "to be in the habit of, be wont to; 'suele decirse' = it is commonly said"}
          - {w: "parecer mal", d: "to look bad, be unseemly"}
          - {w: "castellano", d: "here: castellan, the governor of a castle (not 'Castilian')"}
          - {w: "muy peor", d: "much worse; old Spanish allowed 'muy' before 'peor', modern 'mucho peor'"}
          - {w: "moza", d: "young (of a woman); also 'girl, maid'"}
          - {w: "ocasión", d: "cause, reason, occasion"}
        diagram:
          - s: "digo yo"
            r: "main verb: I say"
            under:
              - s: "Así como suele decirse"
                r: "comparison: just as it is commonly said"
                under:
                  - {s: "que parece mal el ejército sin su general y el castillo sin su castellano", r: "what is said: an army looks bad without its general, a castle without its castellan"}
              - s: "que parece muy peor la mujer casada y moza sin su marido"
                r: "what I say: a young married woman looks much worse without her husband"
                under:
                  - {s: "cuando justísimas ocasiones no lo impiden", r: "condition: when very good reasons do not prevent it"}
        forms:
          - {w: "suele decirse", f: "suel- + -e → soler (to be wont), present, it, + decirse, the infinitive of decir (to say) with 'se' on the end: 'it is usually said'. The o of the stem becomes ue when stressed: suelo, sueles, suele, solemos, soléis, suelen."}
          - {w: "parece", f: "parec- + -e → parecer (to seem, look), present, it. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (with 'parezco' for I)."}
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "casada", f: "participle of casar (to marry), feminine to match 'mujer': 'married'."}
          - {w: "justísimas", f: "just- + -ísimas → justo (just), '-ísimo' = 'very', feminine plural to match 'ocasiones'."}
          - {w: "impiden", f: "impid- + -en → impedir (to prevent), present, they. The e of the stem becomes i when stressed: impido, impides, impide, impedimos, impedís, impiden."}
        note: "This is Camila's letter to her absent husband, begun at the end of the previous chapter. She writes to Anselmo as 'vos', the polite form a wife used to her husband."
      - es: "Yo me hallo tan mal sin vos, y tan imposibilitada de no poder sufrir esta ausencia, que si presto no venís, me habré de ir a entretener en casa de mis padres, aunque deje sin guarda la vuestra;"
        literal: "I myself find so bad without you, and so made-unable of not to-be-able to-bear this absence, that if soon not you-come, myself I-will-have to go to pass-the-time in house of my parents, although I-leave without guard the yours;"
        ormsby: "I find myself so ill at ease without you, and so incapable of enduring this separation, that unless you return quickly I shall have to go for relief to my parents’ house, even if I leave yours without a protector;"
        vocab:
          - {w: "hallarse", d: "to find oneself, be (in a state)"}
          - {w: "vos", d: "you (polite, to one person); takes the verb forms of 'vosotros': venís, sois"}
          - {w: "imposibilitado", d: "made unable, incapacitated; 'de no poder' is a doubled negative, just 'unable to'"}
          - {w: "presto", d: "soon, quickly (literary)"}
          - {w: "haber de + infinitive", d: "to have to, be going to"}
          - {w: "entretenerse", d: "to pass the time, keep oneself occupied"}
          - {w: "guarda", d: "guard, keeper, protection"}
        diagram:
          - s: "Yo me hallo"
            r: "main verb: I find myself"
            under:
              - {s: "tan mal sin vos", r: "how: so badly off without you"}
              - {s: "y tan imposibilitada de no poder sufrir esta ausencia", r: "how, 2: so unable to bear this absence"}
              - s: "que si presto no venís, me habré de ir a entretener en casa de mis padres"
                r: "result of 'tan': that I will have to go to my parents' house"
                under:
                  - {s: "si presto no venís", r: "condition: if you do not come soon"}
                  - {s: "aunque deje sin guarda la vuestra", r: "concession: even if I leave yours (your house) unguarded"}
        forms:
          - {w: "me hallo", f: "hall- + -o → hallarse (to find oneself), present, I, with 'me'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "imposibilitada", f: "participle of imposibilitar (to make unable), feminine because the writer is a woman."}
          - {w: "venís", f: "ven- + -ís → venir (to come), present, you (vos). venir in the present: vengo, vienes, viene, venimos, venís, vienen; 'vos' takes the 'venís' form."}
          - {w: "me habré de ir", f: "habr- + -é → haber (to have), future, I, + de + ir: 'I will have to go'. Future endings: -é, -ás, -á, -emos, -éis, -án, on the shortened stem habr-. 'me' belongs to 'ir' (irse, to go away) but rides in front of the whole group."}
          - {w: "deje", f: "dej- + -e → dejar (to leave), present subjunctive, I, after 'aunque' for a possibility. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "la vuestra", f: "'yours' (vos), feminine to match the unspoken 'casa'."}
      - es: "porque la que me dejastes, si es que quedó con tal título, creo que mira más por su gusto que por lo que a vos os toca;"
        literal: "because the [one] that to-me you-left, if [it] is that she-remained with such title, I-believe that she-looks more for her pleasure than for that which to you to-you touches;"
        ormsby: "for the one you left me, if indeed he deserved that title, has, I think, more regard to his own pleasure than to what concerns you:"
        vocab:
          - {w: "la que me dejastes", d: "the one (guard, 'guarda') you left me, i.e. Lotario"}
          - {w: "si es que", d: "if indeed"}
          - {w: "mirar por", d: "to look after, care for"}
          - {w: "gusto", d: "pleasure, liking, own wishes"}
          - {w: "tocar a uno", d: "to concern someone, be one's business"}
        diagram:
          - s: "creo"
            r: "main verb: I believe"
            under:
              - s: "que mira más por su gusto"
                r: "what I believe: that she (the guard) looks after her own pleasure more"
                under:
                  - {s: "la que me dejastes", r: "subject of 'mira', put first: the one (guard) you left me"}
                  - {s: "si es que quedó con tal título", r: "aside: if indeed she kept that title"}
                  - {s: "que por lo que a vos os toca", r: "than: than what concerns you"}
        forms:
          - {w: "la que", f: "feminine because it stands for 'guarda' (a guard), though the guard is Lotario; Ormsby turns it into 'he'."}
          - {w: "dejastes", f: "dej- + -astes → dejar (to leave), preterite, you (vos). Old form of 'dejasteis'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis (old -astes), -aron."}
          - {w: "quedó", f: "qued- + -ó → quedar (to remain), preterite, she (the guard). Same -ar preterite."}
          - {w: "creo", f: "cre- + -o → creer (to believe), present, I. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "mira", f: "mir- + -a → mirar (to look), present, she. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "a vos os toca", f: "toc- + -a → tocar (to concern), present, it; 'os' is the object pronoun of vos, doubled by 'a vos' for emphasis. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
        note: "Camila's complaint is veiled: she calls Lotario the 'guard' Anselmo left her and hints that he is pursuing his own pleasure, without naming the courtship outright."
      - es: "y, pues sois discreto, no tengo más que deciros, ni aun es bien que más os diga."
        literal: "and, since you-are discerning, not I-have more that to-say-to-you, nor even is [it] good that more to-you I-say."
        ormsby: "as you are possessed of discernment I need say no more to you, nor indeed is it fitting I should say more.”"
        vocab:
          - {w: "pues", d: "since, as (here a conjunction of cause)"}
          - {w: "discreto", d: "false friend: wise, sensible, quick to understand (not just 'discreet')"}
          - {w: "no tener más que decir", d: "to have nothing more to say"}
          - {w: "es bien que", d: "it is right, fitting that"}
        diagram:
          - s: "no tengo más que deciros"
            r: "main verb 1: I have nothing more to tell you"
            under:
              - {s: "pues sois discreto", r: "why: since you are wise"}
          - s: "ni aun es bien"
            r: "main verb 2: nor is it even right"
            under:
              - {s: "que más os diga", r: "what is not right: that I say more to you"}
        forms:
          - {w: "sois", f: "ser (to be), present, you (vos). soy, eres, es, somos, sois, son; 'vos' takes 'sois'."}
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "deciros", f: "decir (to say), infinitive, + os (to you), hanging on the end."}
          - {w: "diga", f: "dig- + -a → decir (to say), present subjunctive, I, after 'es bien que'. decir in the present subjunctive: diga, digas, diga, digamos, digáis, digan."}
  - sentences:
      - es: "»Esta carta recibió Anselmo, y entendió por ella que Lotario había ya comenzado la empresa, y que Camila debía de haber respondido como él deseaba;"
        literal: "This letter received Anselmo, and understood by it that Lotario had already begun the enterprise, and that Camila must of to-have responded as he desired;"
        ormsby: "Anselmo received this letter, and from it he gathered that Lothario had already begun his task and that Camilla must have replied to him as he would have wished;"
        vocab:
          - {w: "empresa", d: "enterprise, undertaking; in chivalric language a knight's 'emprise'"}
          - {w: "deber de + infinitive", d: "must (probability): 'debía de haber respondido' = must have answered"}
        diagram:
          - s: "Esta carta recibió Anselmo"
            r: "main verb 1: Anselmo received this letter (object first, subject after the verb)"
          - s: "y entendió"
            r: "main verb 2: and he understood"
            under:
              - {s: "por ella", r: "how: from it (the letter)"}
              - {s: "que Lotario había ya comenzado la empresa", r: "what he understood, 1: that Lotario had already begun the attempt"}
              - s: "y que Camila debía de haber respondido"
                r: "what he understood, 2: that Camila must have responded"
                under:
                  - {s: "como él deseaba", r: "how: as he wished"}
        forms:
          - {w: "recibió, entendió", f: "recib- + -ió → recibir (to receive), entend- + -ió → entender (to understand), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "había ya comenzado", f: "hab- + -ía → haber (to have), imperfect, he, + comenzado, the participle of comenzar (to begin): pluperfect 'had begun'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "debía de haber respondido", f: "deb- + -ía → deber (must), imperfect, she, + de + the perfect infinitive 'haber respondido' (to have answered). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "deseaba", f: "dese- + -aba → desear (to wish), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
        note: "Anselmo is delighted because the letter shows his test is working: Lotario is courting Camila in earnest, and Camila is resisting, which is what he wants to prove."
      - es: "y, alegre sobremanera de tales nuevas, respondió a Camila, de palabra, que no hiciese mudamiento de su casa en modo ninguno, porque él volvería con mucha brevedad."
        literal: "and, glad beyond-measure of such news, he-responded to Camila, by word, that not she-should-make change from her house in way none, because he would-return with much briefness."
        ormsby: "and delighted beyond measure at such intelligence he sent word to her not to leave his house on any account, as he would very shortly return."
        vocab:
          - {w: "sobremanera", d: "beyond measure, exceedingly"}
          - {w: "nuevas", d: "news, tidings (plural noun)"}
          - {w: "de palabra", d: "by word of mouth (by a messenger), not in writing"}
          - {w: "mudamiento", d: "change, move (old word; modern 'mudanza')"}
          - {w: "en modo ninguno", d: "in no way, on no account"}
          - {w: "con brevedad", d: "shortly, soon"}
        diagram:
          - s: "respondió a Camila"
            r: "main verb: he answered Camila"
            under:
              - {s: "alegre sobremanera de tales nuevas", r: "describes Anselmo: delighted beyond measure at such news"}
              - {s: "de palabra", r: "how: by word of mouth"}
              - s: "que no hiciese mudamiento de su casa en modo ninguno"
                r: "what he answered: that she should on no account move from his house"
                under:
                  - {s: "porque él volvería con mucha brevedad", r: "why: because he would come back very soon"}
        forms:
          - {w: "tales", f: "plural of tal (such), to match 'nuevas'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "hiciese", f: "hic- + -iese → hacer (to make, do), imperfect subjunctive (-se form), she: reported command 'that she should not make'. Irregular stem hic-: hiciese, hicieses, hiciese, hiciésemos, hicieseis, hiciesen."}
          - {w: "volvería", f: "volver- + -ía → volver (to return), conditional, he: 'would return'. Conditional endings on the infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
      - es: "Admirada quedó Camila de la respuesta de Anselmo, que la puso en más confusión que primero, porque ni se atrevía a estar en su casa, ni menos irse a la de sus padres;"
        literal: "Astonished remained Camila at the response of Anselmo, which her put in more confusion than first, because neither herself she-dared to stay in her house, nor less to-go-off to that of her parents;"
        ormsby: "Camilla was astonished at Anselmo’s reply, which placed her in greater perplexity than before, for she neither dared to remain in her own house, nor yet to go to her parents’;"
        vocab:
          - {w: "admirado", d: "false friend: amazed, astonished (not 'admired')"}
          - {w: "primero", d: "here: before, at first ('than before')"}
          - {w: "atreverse a", d: "to dare to"}
          - {w: "ni menos", d: "nor still less, nor yet"}
        diagram:
          - s: "Admirada quedó Camila"
            r: "main verb: Camila was left astonished"
            under:
              - s: "de la respuesta de Anselmo"
                r: "why: at Anselmo's answer"
                under:
                  - {s: "que la puso en más confusión que primero", r: "describes 'respuesta': which put her in more confusion than before"}
              - s: "porque ni se atrevía a estar en su casa"
                r: "why: because she did not dare stay in her house"
                under:
                  - {s: "ni menos irse a la de sus padres", r: "nor still less go to her parents' house"}
        forms:
          - {w: "Admirada", f: "participle of admirar (to amaze), feminine to match 'Camila'; put first for emphasis."}
          - {w: "quedó", f: "qued- + -ó → quedar (to be left, end up), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "puso", f: "pus- + -o → poner (to put), preterite, it. Irregular: puse, pusiste, puso, pusimos, pusisteis, pusieron."}
          - {w: "se atrevía", f: "atrev- + -ía → atreverse (to dare), imperfect, she. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "irse", f: "infinitive of ir (to go) with 'se': 'to go away', still governed by 'se atrevía'."}
          - {w: "la de sus padres", f: "'la' stands for 'casa': 'the one of her parents'."}
      - es: "porque en la quedada corría peligro su honestidad, y en la ida iba contra el mandamiento de su esposo."
        literal: "because in the staying ran danger her chastity, and in the going she-went against the command of her husband."
        ormsby: "for in remaining her virtue was imperilled, and in going she was opposing her husband’s commands."
        vocab:
          - {w: "quedada", d: "staying, remaining (noun from quedar)"}
          - {w: "correr peligro", d: "to be in danger"}
          - {w: "honestidad", d: "false friend: chastity, virtue (not 'honesty')"}
          - {w: "ida", d: "going, departure (noun from ir)"}
          - {w: "mandamiento", d: "command, order"}
        diagram:
          - s: "corría peligro su honestidad"
            r: "main verb 1: her chastity ran a risk"
            under:
              - {s: "en la quedada", r: "when: in staying"}
          - s: "y en la ida iba"
            r: "main verb 2: and in going she went"
            under:
              - {s: "contra el mandamiento de su esposo", r: "against her husband's order"}
        forms:
          - {w: "quedada, ida", f: "feminine participles of quedar (to stay) and ir (to go) used as nouns: 'the staying', 'the going'."}
          - {w: "corría", f: "corr- + -ía → correr (to run), imperfect, it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "iba", f: "ir (to go), imperfect, she. Irregular: iba, ibas, iba, íbamos, ibais, iban."}
  - sentences:
      - es: "»En fin, se resolvió en lo que le estuvo peor, que fue en el quedarse, con determinación de no huir la presencia de Lotario, por no dar que decir a sus criados;"
        literal: "In end, herself she-resolved on that which to-her was worse, which was on the staying, with determination of not to-flee the presence of Lotario, for not to-give what to-say to her servants;"
        ormsby: "Finally she decided upon what was the worse course for her, to remain, resolving not to fly from the presence of Lothario, that she might not give food for gossip to her servants;"
        vocab:
          - {w: "resolverse en", d: "to decide on"}
          - {w: "estarle mal a uno", d: "to be bad for someone, go badly for one; 'lo que le estuvo peor' = what was worse for her"}
          - {w: "huir", d: "to flee; here transitive, 'to avoid' (huir la presencia)"}
          - {w: "dar que decir", d: "to give people something to talk about, cause gossip"}
          - {w: "criado", d: "servant"}
        diagram:
          - s: "se resolvió"
            r: "main verb: she decided"
            under:
              - s: "en lo que le estuvo peor"
                r: "on what: on what was worse for her"
                under:
                  - {s: "que fue en el quedarse", r: "which was: staying"}
              - {s: "con determinación de no huir la presencia de Lotario", r: "how: resolved not to avoid Lotario's presence"}
              - {s: "por no dar que decir a sus criados", r: "why: so as not to give her servants cause to talk"}
        forms:
          - {w: "se resolvió", f: "resolv- + -ió → resolverse (to decide), preterite, she. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "estuvo", f: "estuv- + -o → estar (to be), preterite, it. Irregular: estuve, estuviste, estuvo, estuvimos, estuvisteis, estuvieron."}
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, it. ser's preterite is irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "el quedarse", f: "infinitive of quedarse (to stay) used as a noun with 'el': 'the staying'."}
          - {w: "por no dar", f: "'por' + infinitive = 'so as to'; here 'so as not to give'."}
      - es: "y ya le pesaba de haber escrito lo que escribió a su esposo, temerosa de que no pensase que Lotario había visto en ella alguna desenvoltura que le hubiese movido a no guardalle el decoro que debía."
        literal: "and already to-her it-weighed of to-have written that which she-wrote to her husband, fearful of that not he-might-think that Lotario had seen in her some forwardness that him might-have moved to not keep-to-her the decorum that he-owed."
        ormsby: "and she now began to regret having written as she had to her husband, fearing he might imagine that Lothario had perceived in her some lightness which had impelled him to lay aside the respect he owed her;"
        vocab:
          - {w: "pesarle a uno (de)", d: "to regret, be sorry for; 'le pesaba' = she regretted"}
          - {w: "temeroso de que", d: "fearful that; the 'no' after it is redundant, as after verbs of fearing in Latin"}
          - {w: "desenvoltura", d: "forwardness, free manner, boldness (in a woman, a lack of modesty)"}
          - {w: "guardar el decoro", d: "to keep the proper respect, behave with decorum"}
          - {w: "guardalle", d: "= guardarle (to keep to her); -rl- becomes -ll-"}
        diagram:
          - s: "y ya le pesaba"
            r: "main verb: and now she regretted"
            under:
              - {s: "de haber escrito lo que escribió a su esposo", r: "what she regretted: having written what she wrote to her husband"}
              - s: "temerosa de que no pensase"
                r: "describes Camila: afraid he might think"
                under:
                  - s: "que Lotario había visto en ella alguna desenvoltura"
                    r: "what he might think: that Lotario had seen some forwardness in her"
                    under:
                      - {s: "que le hubiese movido a no guardalle el decoro que debía", r: "describes 'desenvoltura': which had moved him not to show her the respect he owed"}
        forms:
          - {w: "pesaba", f: "pes- + -aba → pesar (to weigh, grieve), imperfect, it: 'it grieved her'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "haber escrito", f: "perfect infinitive: haber (to have) + escrito, the irregular participle of escribir (to write): 'to have written'."}
          - {w: "escribió", f: "escrib- + -ió → escribir (to write), preterite, she. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "temerosa", f: "temer (to fear) + -oso → temeroso (fearful), feminine to match Camila."}
          - {w: "pensase", f: "pens- + -ase → pensar (to think), imperfect subjunctive (-se form), he, after a verb of fearing. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "había visto", f: "había, from haber (to have), imperfect, he, + visto, the irregular participle of ver (to see): pluperfect 'had seen'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "hubiese movido", f: "hub- + -iese → haber (to have), imperfect subjunctive (-se form), it, + movido (participle of mover, to move): 'might have moved'. hubiese, hubieses, hubiese, hubiésemos, hubieseis, hubiesen."}
          - {w: "guardalle", f: "guardar (to keep) + le (to her), with -rl- turned into -ll-, a common sound change in Cervantes' day."}
