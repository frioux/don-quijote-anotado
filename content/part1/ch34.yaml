        forms:
          - {w: "moriré", f: "morir- + -é → morir (to die), future, I. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "muero", f: "muer- + -o → morir (to die), present, I. The o of the stem becomes ue when stressed: muero, mueres, muere, morimos, morís, mueren."}
          - {w: "ha de ser", f: "ha, from haber (to have), present, it, + de + ser (to be): 'it must be'. haber in the present: he, has, ha, hemos, habéis, han. The verb is 'it', though the sense is 'I must die avenged'."}
