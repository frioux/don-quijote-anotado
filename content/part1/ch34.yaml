      - es: "Lloró, rogó, ofreció, aduló, porfió, y fingió Lotario con tantos sentimientos, con muestras de tantas veras, que dio al través con el recato de Camila y vino a triunfar de lo que menos se pensaba y más deseaba. »Rindióse Camila, Camila se rindió;"
        literal: "Wept, begged, offered, flattered, insisted, and feigned Lotario with so-many feelings, with shows of so-many truths, that he-gave to-the across with the modesty of Camila and came to triumph over that which least was-thought and most he-desired. Surrendered-herself Camila, Camila herself surrendered;"
        ormsby: "He wept, he entreated, he promised, he flattered, he importuned, he pretended with so much feeling and apparent sincerity, that he overthrew the virtuous resolves of Camilla and won the triumph he least expected and most longed for. Camilla yielded, Camilla fell;"
