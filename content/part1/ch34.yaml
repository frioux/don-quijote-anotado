                  - {s: "en el espacio y lugar que daba la ausencia de Anselmo", r: "when: in the time and room that Anselmo's absence gave"}
                  - {s: "apretar el cerco a aquella fortaleza", r: "what was necessary: to tighten the siege on that fortress"}
