summary: |
  In the inn, the priest goes on reading the tale of the Ill-Advised Curiosity. Camila writes to her absent husband Anselmo that Lotario, the friend he left to guard her, is pursuing her, and begs him to come home. Anselmo, who arranged the test himself, is delighted and stays away. Camila decides to remain and keep her silence, Lotario presses his siege, and in the end she yields. When Anselmo returns, Lotario tells him that Camila is the model of all good wives, and they agree that Lotario will go on writing love sonnets to an imaginary 'Clori', which he reads at table to husband and wife.

  Camila's maid Leonela, who knows everything and has a lover of her own, is soon bringing him into the house at night. Lotario sees a man slipping out at dawn, takes him for Camila's new lover, and in a fit of jealousy tells Anselmo that Camila has given in and advises him to hide in her dressing room to see for himself. Almost at once he learns from Camila that the man was Leonela's lover. Repenting, he confesses everything, and Camila quickly devises a way out: Anselmo is to hide as planned, and Lotario must come when Leonela calls and answer whatever she says.

  With Anselmo behind the tapestries, Camila stages a tragedy. Dagger in hand, she tells Leonela she means to kill the treacherous friend and then herself, faints, recovers, and has Lotario fetched. She draws a line on the floor, accuses him of betraying his friend, blames her own carelessness for his hopes, and rushes at him with the dagger. Unable to reach him, she stabs herself lightly near the shoulder and falls as if dead. Lotario laments over her, Leonela binds the wound, and the two women discuss, for the listener's benefit, how to hide the wound from Anselmo.

  Anselmo comes out convinced that his wife is a second Portia. He embraces Lotario, praises Camila, and asks his friend to write verses that will make her famous for ever. He is left 'the most deliciously deceived man in the world'. The narrator ends by announcing that a few months later Fortune turned her wheel, the truth came out, and Anselmo's curiosity cost him his life.
context: |
  Honor and the household. The tale turns on honor in its Spanish sense: a man's public reputation, which rested on the chastity of his wife. A husband who learned he had been wronged was expected to take revenge, preferably in secret; this is why Leonela advises Camila to say nothing, lest Anselmo be obliged to fight Lotario at the risk of his life. Wives of good family lived in seclusion, so the maid ('doncella') was the indispensable go-between, and comedies and novellas made her worldly, talkative and ready with proverbs, like Leonela with her lover and her alphabet of a good suitor. Camila addresses her husband as 'vos' in her letter, the respectful form, while the two friends, and later the lovers, speak to each other as 'tú'.

  The novella and the stage. The story is an Italian 'novella' set in Florence, and the chapter borrows the stock furniture of that genre and of love poetry: the seduction told as a siege (towers, mines, engines of war), Petrarchan sonnets to a cruel lady with a pastoral name, Clori, and a final scene played as theatre. Ormsby notes that the first sonnet, like the one in Chapter XXIII, was reused by Cervantes in his play 'La casa de los celos'. Camila's performance borrows the gestures of the honor plays of the Spanish stage: the dagger, the line drawn on the floor, the swoon, the speech of outraged virtue. The narrator says so outright at the end, calling it 'the tragedy of the death of his honor', acted by its 'characters'.

  Models of chastity. Camila measures herself against the two classical heroines every reader knew. Lucretia, raped by Tarquin, killed herself, and Camila boasts that she will do better by killing the offender first. Portia, the wife of Brutus, stabbed herself in the thigh to prove her constancy, as Plutarch tells, and Camila's light wound near the shoulder is a copy of hers, which is why Lotario thinks Anselmo will believe he has 'a second Portia'. The friend as a mirror and a second self is the classical ideal of friendship that the whole tale betrays.

  The narrator's games. The tale is read aloud by the priest from a manuscript found at the inn, so Don Quijote and Sancho do not appear in this chapter. Inside it, almost every speech has two audiences: Camila and Leonela talk for the hidden husband, Lotario curses 'the man who brought him to this' to Anselmo's face without his knowing, and Leonela swears she cannot lie even in jest. The narrator's own comments are full of paradox: 'Rindióse Camila, Camila se rindió', 'the most deliciously deceived man', 'the lie and the most disguised truth'. At the end he gives the outcome away in advance, with Fortune turning her wheel, the medieval image of the goddess who lifts people up and casts them down.

  Medicine and religion. Wine was the usual first dressing for a wound, cleaning it and helping to stanch the blood, which Leonela calls 'taking the blood'. Lotario crosses himself in amazement once he is alone. Anselmo's 'precious pearl' (margarita) recalls the pearl of great price in the Gospel, for which a man sells all he has. Ormsby notes that Leonela's alphabet plays on the four S's of a good lover: sabio, solo, solícito, secreto (wise, single-minded, attentive, secret).

  Names and words. Anselmo, Lotario and Camila are Italianate names suited to a Florentine tale; Ariosto's 'Orlando Furioso' (Canto 43), discussed with the previous chapter, has a jealous Mantuan doctor called Anselmo, the likely source of the name. Clori is the Greek Chloris, a goddess of flowers and a stock name for a poet's lady. 'Curioso impertinente', the title, means a man whose curiosity is ill-judged and out of place, and the word 'impertinencia' returns in Camila's speech for Lotario's persistence.

  Reading Cervantes' Spanish. The archaisms of the chapter: mesmo (mismo), ansí (así), estraño (extraño), escuro (oscuro), efeto (efecto), subjeto (sujeto), satisfación (satisfacción), resulución (resolución), recebir (recibir), proprio (propio), luengo (largo), yerro (error), cayo (caigo), válame (válgame), rompido (roto), 'al aldea' with the old article, desta, della, dél, deso, desto, and Leonela's alphabet spellings onesto, quantioso, zelador. The -rl- of an infinitive with a pronoun becomes -ll- (guardalle, huilla, vella, ofendelle, dalle, quitalle, poseello, perdella, habelle). Pronouns hang on clause-opening verbs (Rindióse, Díjole, Juntáronse, Recebíale, hasme de dar), and 'le' stands for 'lo' with a male object (leísmo). The future subjunctive marks open futures (llegare, sucediere, fuere, viere, quisiere, te atrevieres, agradare), the -ra form serves as a conditional (fuera, quedara, creyera), and 'haber de' and 'tener de' mean 'must'. Watch the false friends: deshonesto and honestidad (unchaste, chastity), industria (ingenuity), suceso (event), entretener (to put off), dilatar (to delay), discreción (wit), afectos (passions), alteración (agitation), comodidad (opportunity), admirarse (to marvel), simple (foolish) and largo (lavish).
