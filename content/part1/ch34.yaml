          - {w: "hacerse de rogar", d: "to need a lot of asking, make people beg"}
          - {w: "antes que", d: "before (modern 'antes de que')"}
          - {w: "en fin", d: "at last, in the end"}
          - {w: "entre tanto que", d: "while, meanwhile"}
          - {w: "quedar diciendo", d: "to stay saying, go on saying"}
