  - sentences:
      - es: "»—¡Ay, Leonela amiga! ¿No sería mejor que, antes que llegase a poner en ejecución lo que no quiero que sepas, porque no procures estorbarlo, que tomases la daga de Anselmo, que te he pedido, y pasases con ella este infame pecho mío?"
        literal: "Ah, Leonela friend! Not would-it-be better that, before that I-should-come to put in execution that which not I-want that you-know, so-that not you-try to-hinder-it, that you-should-take the dagger of Anselmo, which of-you I-have asked, and should-pierce with it this infamous breast mine?"
        ormsby: "“Ah! dear Leonela, would it not be better, before I do what I am unwilling you should know lest you should seek to prevent it, that you should take Anselmo’s dagger that I have asked of you and with it pierce this vile heart of mine?"
        vocab:
          - {w: "poner en ejecución", d: "to carry out"}
          - {w: "estorbar", d: "to hinder, prevent"}
          - {w: "daga", d: "dagger"}
          - {w: "pasar", d: "here: to pierce, run through"}
          - {w: "infame", d: "infamous, vile, dishonored"}
