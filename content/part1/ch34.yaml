  - sentences:
      - es: "»—Digo —dijo Camila— que no hay más que guardar, si no fuere responderme como yo os preguntare (no queriendo Camila darle antes cuenta de lo que pensaba hacer, temerosa que no quisiese seguir el parecer que a ella tan bueno le parecía, y siguiese o buscase otros que no podrían ser tan buenos)."
        literal: "I-say, said Camila, that not there-is more to observe, if not it-be to-answer-me as I you may-ask (not wanting Camila to-give-him beforehand account of that which she-intended to-do, fearful that not he-might-want to-follow the opinion that to her so good to-her seemed, and might-follow or seek others that not could be so good)."
        ormsby: "“I tell you,” said Camilla, “there is nothing to take care of except to answer me what I shall ask you;” for she did not wish to explain to him beforehand what she meant to do, fearing lest he should be unwilling to follow out an idea which seemed to her such a good one, and should try or devise some other less practicable plan."
        vocab:
          - {w: "si no fuere", d: "unless it be, except"}
          - {w: "dar cuenta de", d: "to tell about"}
          - {w: "temeroso que", d: "fearing that"}
          - {w: "parecer", d: "opinion, plan (noun)"}
