      - es: "Al fin, acordó de dar cuenta de todo a Camila; y, como no faltaba lugar para poderlo hacer, aquel mismo día la halló sola, y ella, así como vio que le podía hablar, le dijo."
        literal: "At-the end, he-resolved of to-give account of all to Camila; and, as not was-lacking place for to-be-able-it to-do, that same day her he-found alone, and she, as-soon as she-saw that to-him she-could speak, to-him said."
