          - {w: "el no acudir él", f: "acudir (to come to help), infinitive used as a noun with 'el' and with its own subject 'él': 'his not coming'."}
          - {w: "señalé", f: "señal- + -é → señalar (to point out), preterite, I. Same -é preterite as 'apunté'."}
          - {w: "debió de ser", f: "deb- + -ió → deber (must), preterite, it, + de + ser (to be): 'it must have been'. Same -er/-ir preterite as 'escribí'."}
