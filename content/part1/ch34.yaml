          - s: "y Anselmo ... se partió y volvió a esconderse"
            r: "main verb 2: and Anselmo set off and came back to hide"
            under:
              - {s: "otro día", r: "when: the next day"}
              - {s: "con la escusa de ir aquella aldea de su amigo", r: "how: on the pretext of going to his friend's village"}
        forms:
          - {w: "se fue", f: "fu- + -e → irse (to leave), preterite, he. ir (to go) shares its preterite with ser (to be): fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "ir aquella aldea", f: "the 'a' of 'ir a' has merged with the 'a' of 'aquella' in this edition: read 'ir a aquella aldea'."}
          - {w: "se partió", f: "part- + -ió → partirse (to depart), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "volvió", f: "volv- + -ió → volver (to return), preterite, he. Same -ió ending."}
          - {w: "esconderse", f: "infinitive of esconder (to hide) with 'se'."}
      - es: "que lo pudo hacer con comodidad, porque de industria se la dieron Camila y Leonela. »Escondido, pues, Anselmo, con aquel sobresalto que se puede imaginar que tendría el que esperaba ver por sus ojos hacer notomía de las entrañas de su honra, íbase a pique de perder el sumo bien que él pensaba que tenía en su querida Camila."
        literal: "for it he-could do with ease, because on purpose to-him it gave Camila and Leonela. Hidden, then, Anselmo, with that alarm that can-be imagined that would-have he who expected to-see by his eyes make anatomy of the entrails of his honor, he-was-going to [the] point of losing the supreme good that he thought that he-had in his dear Camila."
        ormsby: "which he was able to do easily, as Camilla and Leonela took care to give him the opportunity; and so he placed himself in hiding in the state of agitation that it may be imagined he would feel who expected to see the vitals of his honour laid bare before his eyes, and found himself on the point of losing the supreme blessing he thought he possessed in his beloved Camilla."
        vocab:
          - {w: "comodidad", d: "ease, opportunity"}
          - {w: "de industria", d: "on purpose, deliberately (false friend: 'industria' = skill, cunning)"}
          - {w: "sobresalto", d: "alarm, anxiety"}
          - {w: "notomía", d: "= anatomía: dissection; 'hacer notomía de' = to dissect, lay bare"}
          - {w: "entrañas", d: "entrails, innermost parts"}
          - {w: "a pique de", d: "on the point of, about to"}
          - {w: "sumo bien", d: "the highest good (a philosophical term)"}
        diagram:
