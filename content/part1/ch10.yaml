            r: "main verb 1: don't worry (a command)"
            under:
              - {s: "Pues", r: "then"}
              - {s: "amigo", r: "who is addressed"}
          - {s: "respondió don Quijote", r: "speech tag"}
          - s: "yo te sacaré de las manos de los caldeos"
            r: "main verb 2, after loose 'que' = for: I will rescue you from the Chaldeans"
            under:
              - {s: "cuanto más de las de la Hermandad", r: "let alone from those of the Brotherhood"}
        forms:
