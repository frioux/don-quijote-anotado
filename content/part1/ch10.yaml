  - sentences:
      - es: "— Advierta vuestra merced, señor don Quijote, que si el caballero cumplió lo que se le dejó ordenado de irse a presentar ante mi señora Dulcinea del Toboso, ya habrá cumplido con lo que debía, y no merece otra pena si no comete nuevo delito."
        literal: "— May-notice your grace, lord Don Quijote, that if the knight fulfilled that which to-him was-left ordered of going-himself to present before my lady Dulcinea del Toboso, already he-will-have complied with that which he-owed, and not he-deserves other penalty if not he-commits new offense."
        ormsby: "“Your worship should bear in mind, Señor Don Quixote, that if the knight has done what was commanded him in going to present himself before my lady Dulcinea del Toboso, he will have done all that he was bound to do, and does not deserve further punishment unless he commits some new offence.”"
        vocab:
          - {w: "advertir", d: "to bear in mind, take note"}
          - {w: "cumplir", d: "to carry out, fulfill; 'cumplir con' = to do one's duty by"}
          - {w: "dejar ordenado", d: "to leave as an order, to order"}
          - {w: "presentarse ante", d: "to present oneself before"}
          - {w: "deber", d: "to owe, be bound to"}
          - {w: "pena", d: "penalty, punishment"}
          - {w: "delito", d: "offense, crime"}
        diagram:
          - s: "Advierta vuestra merced"
            r: "main verb: may your grace bear in mind"
            under:
              - {s: "señor don Quijote", r: "who is addressed"}
              - s: "ya habrá cumplido con lo que debía"
                r: "what to bear in mind, 1: he will already have done his duty"
                under:
                  - s: "que si el caballero cumplió lo"
                    r: "condition: if the knight carried out what"
                    under:
                      - {s: "que se le dejó ordenado de irse a presentar ante mi señora Dulcinea del Toboso", r: "describes 'lo': what he was ordered, to go and present himself to Dulcinea"}
              - s: "y no merece otra pena"
                r: "what to bear in mind, 2: and deserves no other penalty"
                under:
                  - {s: "si no comete nuevo delito", r: "condition: unless he commits a new offense"}
        forms:
          - {w: "Advierta", f: "adviert- + -a → advertir (to bear in mind), present subjunctive, you (vuestra merced), as a polite command. The stem e becomes ie when stressed: advierta, adviertas, advierta, advirtamos, advirtáis, adviertan."}
          - {w: "cumplió", f: "cumpl- + -ió → cumplir (to carry out), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "se le dejó ordenado", f: "dej- + -ó → dejar (to leave), preterite, it, with passive 'se' and 'le' (to him): 'was left ordered to him'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. 'ordenado' is the participle of ordenar (to order)."}
          - {w: "irse a presentar", f: "ir + se → irse (to go off), then 'a' + presentar (to present); the 'se' also belongs to 'presentar': 'to go and present himself'."}
          - {w: "habrá cumplido", f: "habr- + -á + cumplido → haber + the participle of cumplir: future perfect, he: 'will have done'. haber's future: habré, habrás, habrá, habremos, habréis, habrán. Here it is a conclusion: 'he must have done'."}
          - {w: "debía", f: "deb- + -ía → deber (to owe), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "merece", f: "merec- + -e → merecer (to deserve), present, he. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (the 'I' form is merezco)."}
          - {w: "comete", f: "comet- + -e → cometer (to commit), present, he. Same -er present."}
        note: "In the last chapter Don Quijote spared the Basque on condition that he go to El Toboso and present himself to Dulcinea. Sancho argues like a village lawyer that the sentence has been served."
