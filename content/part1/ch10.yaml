part: 1
chapter: 10
title_es: "Capítulo X. De lo que más le avino a don Quijote con el vizcaíno, y del peligro en que se vio con una turba de yangüeses"
title_en: "Of the pleasant discourse that passed between Don Quixote and his squire Sancho Panza"
paragraphs:
  - sentences:
      - es: "Ya en este tiempo se había levantado Sancho Panza, algo maltratado de los mozos de los frailes, y había estado atento a la batalla de su señor don Quijote, y rogaba a Dios en su corazón fuese servido de darle vitoria y que en ella ganase alguna ínsula de donde le hiciese gobernador, como se lo había prometido."
        literal: "Already in this time himself had raised Sancho Panza, somewhat mistreated by the lads of the friars, and had been attentive to the battle of his lord Don Quijote, and he-begged to God in his heart [that He] might-be pleased to give-him victory and that in it he-might-win some isle of where him he-might-make governor, as to-him it he-had promised."
        ormsby: "Now by this time Sancho had risen, rather the worse for the handling of the friars’ muleteers, and stood watching the battle of his master, Don Quixote, and praying to God in his heart that it might be his will to grant him the victory, and that he might thereby win some island to make him governor of, as he had promised."
        vocab:
          - {w: "ya en este tiempo", d: "by now, by this time"}
          - {w: "levantarse", d: "to get up (Sancho had been knocked down)"}
          - {w: "maltratado de", d: "roughly handled by; 'de' marks the doer, as 'by' does in English"}
          - {w: "mozos", d: "lads, servants; here the friars' mule-boys who beat Sancho in the last chapter"}
          - {w: "frailes", d: "friars, monks"}
          - {w: "atento a", d: "watching closely, attentive to"}
          - {w: "rogar", d: "to beg, pray"}
          - {w: "ser servido de", d: "to be pleased to, to deign to; a courtly formula"}
          - {w: "vitoria", d: "= victoria, victory; old spelling without the c"}
          - {w: "ínsula", d: "isle; the bookish Latin word from the romances, instead of everyday 'isla'"}
          - {w: "de donde", d: "of which, from where"}
          - {w: "gobernador", d: "governor"}
        diagram:
          - s: "se había levantado"
            r: "main verb 1: had got up"
            under:
              - {s: "Ya en este tiempo", r: "when: by now"}
              - s: "Sancho Panza"
                r: "subject"
                under:
                  - {s: "algo maltratado de los mozos de los frailes", r: "describes Sancho: rather knocked about by the friars' servants"}
          - s: "y había estado atento"
            r: "main verb 2: and had been watching"
            under:
              - {s: "a la batalla de su señor don Quijote", r: "what he watched"}
          - s: "y rogaba a Dios"
            r: "main verb 3: and was praying to God"
            under:
              - {s: "en su corazón", r: "where: in his heart"}
              - {s: "fuese servido de darle vitoria", r: "what he prayed, 1: that God might please to give him victory ('que' left out)"}
              - s: "y que en ella ganase alguna ínsula"
                r: "what he prayed, 2: that in it he might win some isle"
                under:
                  - {s: "de donde le hiciese gobernador", r: "describes 'ínsula': of which he would make Sancho governor"}
                  - {s: "como se lo había prometido", r: "as he had promised him"}
        forms:
          - {w: "se había levantado", f: "hab- + -ía + levantado → haber + the participle of levantarse (to get up): pluperfect, he: 'had got up'. haber in the imperfect: había, habías, había, habíamos, habíais, habían. 'se' = himself: the verb is reflexive."}
          - {w: "maltratado", f: "mal + tratado, participle of maltratar (to mistreat), used as an adjective, masculine singular to match Sancho."}
          - {w: "había estado", f: "haber (había) + estado, participle of estar (to be): pluperfect, he: 'had been'."}
          - {w: "atento", f: "masculine singular, matching Sancho."}
          - {w: "rogaba", f: "rog- + -aba → rogar (to beg), imperfect, he: 'was praying'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "fuese servido", f: "fu- + -ese → ser (to be), imperfect subjunctive (-se form), he (God): 'might be pleased'. ser's -se forms: fuese, fueses, fuese, fuésemos, fueseis, fuesen. Subjunctive because it is what Sancho prays for; the 'que' that should introduce it is dropped, as often in Cervantes."}
          - {w: "darle", f: "dar (to give) + le (to him), the pronoun hung on the end of the infinitive."}
          - {w: "ella", f: "'it', feminine because it stands for 'vitoria'."}
          - {w: "ganase", f: "gan- + -ase → ganar (to win), imperfect subjunctive (-se form), he (Don Quijote). The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "alguna", f: "algun- + -a → alguno (some), feminine to match 'ínsula'."}
          - {w: "hiciese", f: "hic- + -iese → hacer (to make), imperfect subjunctive (-se form), he: 'might make'. Built on the preterite hicieron: hiciese, hicieses, hiciese, hiciésemos, hicieseis, hiciesen."}
          - {w: "le", f: "him (Sancho); strict grammar wants 'lo', but Castilian uses 'le' for a male person (leísmo)."}
          - {w: "se lo había prometido", f: "haber (había) + prometido, participle of prometer (to promise): pluperfect, he: 'had promised'. 'se' stands in for 'le' (to him), because le / les turns into 'se' before lo / la / los / las; 'lo' = it."}
        note: "The last chapter ended with the Basque beaten and spared. The chapter title promises more of the Basque and a fight with Yangüeses, but neither happens here. The mismatched title is usually explained as a slip left over from Cervantes rearranging his chapters."
      - es: "Viendo, pues, ya acabada la pendencia, y que su amo volvía a subir sobre Rocinante, llegó a tenerle el estribo; y antes que subiese se hincó de rodillas delante dél, y, asiéndole de la mano, se la besó y le dijo:"
        literal: "Seeing, then, already finished the quarrel, and that his master was-returning to climb upon Rocinante, he-came to hold-him the stirrup; and before that he-might-climb himself he-knelt on knees in-front of-him, and, seizing-him by the hand, to-him it he-kissed and to-him said:"
        ormsby: "Seeing, therefore, that the struggle was now over, and that his master was returning to mount Rocinante, he approached to hold the stirrup for him, and, before he could mount, he went on his knees before him, and taking his hand, kissed it saying,"
        vocab:
          - {w: "pues", d: "then, so; a connective, not 'because' here"}
          - {w: "pendencia", d: "quarrel, fight, brawl"}
          - {w: "amo", d: "master (of a servant)"}
          - {w: "volver a + inf.", d: "to do again: 'volvía a subir' = was getting back up"}
          - {w: "subir sobre", d: "to climb onto, mount"}
          - {w: "llegar a", d: "here: to come up to (do something)"}
          - {w: "estribo", d: "stirrup"}
          - {w: "antes que", d: "before (+ subjunctive)"}
          - {w: "hincarse de rodillas", d: "to kneel down, go down on one's knees"}
          - {w: "dél", d: "= de él, 'of him'; Cervantes contracts de + él/ella/este (dél, della, deste)"}
          - {w: "asir de", d: "to seize by, take hold of"}
        diagram:
          - s: "llegó a tenerle el estribo"
            r: "main verb 1: he came up to hold his stirrup"
            under:
              - {s: "Viendo, pues, ya acabada la pendencia", r: "why: seeing the fight now over"}
              - {s: "y que su amo volvía a subir sobre Rocinante", r: "what he saw, 2: that his master was remounting"}
          - s: "se hincó de rodillas delante dél"
            r: "main verb 2 (after 'y'): he knelt before him"
            under:
              - {s: "antes que subiese", r: "when: before he could mount"}
          - s: "se la besó"
            r: "main verb 3: he kissed it"
            under:
              - {s: "asiéndole de la mano", r: "how: taking him by the hand"}
          - {s: "y le dijo:", r: "main verb 4: and said to him"}
        forms:
          - {w: "Viendo", f: "v- + -iendo → gerund of ver (to see): 'seeing'. A gerund at the head of a sentence gives the reason or the moment."}
          - {w: "acabada", f: "acab- + -ada → participle of acabar (to finish), feminine to match 'pendencia': 'the fight [being] finished'."}
          - {w: "volvía", f: "volv- + -ía → volver (to return; 'volver a' = to do again), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "llegó", f: "lleg- + -ó → llegar (to arrive, come up), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (the 'I' form is llegué, with gu to keep the hard g)."}
          - {w: "tenerle", f: "tener (to hold) + le (for him), pronoun hung on the infinitive."}
          - {w: "subiese", f: "sub- + -iese → subir (to climb up), imperfect subjunctive (-se form), he. The -se imperfect subjunctive of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen. 'antes que' always takes the subjunctive."}
          - {w: "se hincó", f: "hinc- + -ó → hincarse (to kneel), preterite, he, with 'se' (himself). Same -ar preterite (the 'I' form is hinqué)."}
          - {w: "dél", f: "de + él (of him)."}
          - {w: "asiéndole", f: "as- + -iendo + le → gerund of asir (to seize) + le (him), accent added to keep the stress. 'asir de la mano' = to take by the hand."}
          - {w: "se la besó", f: "bes- + -ó → besar (to kiss), preterite, he. 'la' = it (la mano); 'se' stands in for 'le' (to him), because le / les turns into 'se' before lo / la / los / las. Same -ar preterite."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Sea vuestra merced servido, señor don Quijote mío, de darme el gobierno de la ínsula que en esta rigurosa pendencia se ha ganado; que, por grande que sea, yo me siento con fuerzas de saberla gobernar tal y tan bien como otro que haya gobernado ínsulas en el mundo."
        literal: "— May-be your grace pleased, lord Don Quijote mine, to give-me the government of the isle that in this rigorous quarrel has-been-won; for, for big that it-may-be, I myself feel with strengths to know-[how]-it to-govern such and so well as another who may-have governed isles in the world."
        ormsby: "“May it please your worship, Señor Don Quixote, to give me the government of that island which has been won in this hard fight, for be it ever so big I feel myself in sufficient force to be able to govern it as much and as well as anyone in the world who has ever governed islands.”"
        vocab:
          - {w: "vuestra merced", d: "'your grace', the polite address that became modern 'usted'; it takes a he/she verb"}
          - {w: "ser servido de", d: "to be pleased to, to deign to"}
          - {w: "don Quijote mío", d: "my lord Don Quijote; 'mío' after the name is affectionate and respectful"}
          - {w: "gobierno", d: "government, governorship"}
          - {w: "riguroso", d: "harsh, hard-fought"}
          - {w: "por grande que sea", d: "however big it may be"}
          - {w: "sentirse con fuerzas de", d: "to feel strong enough to, to feel up to"}
          - {w: "saber + inf.", d: "to know how to"}
          - {w: "tal y tan bien como", d: "just as well as"}
        diagram:
          - s: "Sea vuestra merced servido"
            r: "main verb 1: may your grace be pleased"
            under:
              - {s: "señor don Quijote mío", r: "who is addressed"}
              - s: "de darme el gobierno de la ínsula"
                r: "to do what: to give me the governorship of the isle"
                under:
                  - {s: "que en esta rigurosa pendencia se ha ganado", r: "describes 'ínsula': that has been won in this hard fight"}
          - s: "yo me siento con fuerzas"
            r: "main verb 2, after loose 'que' = for: I feel strong enough"
            under:
              - {s: "por grande que sea", r: "concession: however big it may be"}
              - s: "de saberla gobernar tal y tan bien como otro"
                r: "for what: to know how to govern it as well as anyone"
                under:
                  - {s: "que haya gobernado ínsulas en el mundo", r: "describes 'otro': who has ever governed isles"}
        forms:
          - {w: "Sea", f: "se- + -a → ser (to be), present subjunctive, he (your grace): 'may [you] be'. ser's present subjunctive: sea, seas, sea, seamos, seáis, sean. Used as a polite command to 'vuestra merced'."}
          - {w: "servido", f: "participle of servir (to serve), masculine to match Don Quijote: 'ser servido' = to be pleased."}
          - {w: "darme", f: "dar (to give) + me (to me), pronoun hung on the infinitive."}
          - {w: "esta rigurosa", f: "'this', feminine, and rigur- + -osa → riguroso (harsh), feminine, both to match 'pendencia'."}
          - {w: "se ha ganado", f: "ha + ganado → haber + the participle of ganar (to win): present perfect, it, with 'se' making it passive: 'has been won'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "sea", f: "ser (to be), present subjunctive, it: 'may be'. sea, seas, sea, seamos, seáis, sean. 'por ... que' (however ...) takes the subjunctive."}
          - {w: "me siento", f: "sient- + -o → sentirse (to feel), present, I, with 'me' (myself). The e in the stem becomes ie when stressed: siento, sientes, siente, sentimos, sentís, sienten."}
          - {w: "saberla gobernar", f: "saber (to know how) + la (it, the ínsula) + gobernar (to govern). The pronoun belongs to 'gobernar' but hangs on the first infinitive; modern Spanish would say 'saber gobernarla'."}
          - {w: "haya gobernado", f: "hay- + -a + gobernado → haber + the participle of gobernar: present perfect subjunctive, he: 'may have governed'. haber's present subjunctive: haya, hayas, haya, hayamos, hayáis, hayan. Subjunctive because 'otro' is anyone at all, not a known person."}
        note: "Sancho uses the bookish word 'ínsula' he learned from his master, and cannot see that a roadside brawl in La Mancha is an unlikely place to win an island."
  - sentences:
      - es: "A lo cual respondió don Quijote:"
        literal: "To the which answered Don Quijote:"
        ormsby: "To which Don Quixote replied,"
        vocab:
          - {w: "a lo cual", d: "to which; 'lo cual' points back to a whole statement"}
        diagram:
          - s: "respondió"
            r: "main verb: answered"
            under:
              - {s: "A lo cual", r: "to what: to Sancho's request"}
              - {s: "don Quijote", r: "subject"}
        forms:
          - {w: "lo cual", f: "neuter relative 'which', used for a whole idea rather than a noun."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
  - sentences:
      - es: "— Advertid, hermano Sancho, que esta aventura y las a ésta semejantes no son aventuras de ínsulas, sino de encrucijadas, en las cuales no se gana otra cosa que sacar rota la cabeza o una oreja menos."
        literal: "— Take-note, brother Sancho, that this adventure and those to this-one similar not are adventures of isles, but of crossroads, in the which not one-wins other thing than to-come-away-with broken the head or an ear less."
        ormsby: "“Thou must take notice, brother Sancho, that this adventure and those like it are not adventures of islands, but of crossroads, in which nothing is got except a broken head or an ear the less:"
        vocab:
          - {w: "advertir", d: "to notice, take note, bear in mind"}
          - {w: "hermano", d: "brother; a friendly address, not kinship"}
          - {w: "semejante a", d: "like, similar to"}
          - {w: "no ... sino", d: "not ... but"}
          - {w: "encrucijada", d: "crossroads; 'aventuras de encrucijadas' = chance roadside encounters"}
          - {w: "no ... otra cosa que", d: "nothing but"}
          - {w: "sacar", d: "here: to come away with"}
          - {w: "rota", d: "broken (participle of romper)"}
          - {w: "oreja", d: "ear"}
        diagram:
          - s: "Advertid"
            r: "main verb: take note (a command)"
            under:
              - {s: "hermano Sancho", r: "who is addressed"}
              - s: "que esta aventura y las a ésta semejantes no son aventuras de ínsulas, sino de encrucijadas"
                r: "what to note: these are crossroads adventures, not island ones"
                under:
                  - {s: "en las cuales no se gana otra cosa que sacar rota la cabeza o una oreja menos", r: "describes 'encrucijadas': where you win only a broken head or one ear fewer"}
        forms:
          - {w: "Advertid", f: "advert- + -id → advertir (to take note), command to 'vos' / vosotros. The vosotros command drops the -r of the infinitive and adds -d: advertid, tened, mirad. Don Quijote here addresses Sancho with the formal 'vos'; elsewhere he uses 'tú'."}
          - {w: "las a ésta semejantes", f: "'those similar to this one': 'las' = las aventuras; 'ésta' is the demonstrative used as a pronoun, written with an accent in Cervantes' editions; semejante + -s → plural to match 'las'."}
          - {w: "son", f: "ser (to be), present, they. soy, eres, es, somos, sois, son."}
          - {w: "las cuales", f: "'which', feminine plural to match 'encrucijadas'."}
          - {w: "se gana", f: "gan- + -a → ganar (to win), present, with 'se' meaning 'one': 'one wins'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "sacar", f: "infinitive (to come away with) after 'otra cosa que'."}
          - {w: "rota", f: "irregular participle of romper (to break), feminine to match 'cabeza'."}
        note: "Don Quijote had half an ear sliced off by the Basque in the last chapter, so 'una oreja menos' is not a figure of speech."
      - es: "Tened paciencia, que aventuras se ofrecerán donde no solamente os pueda hacer gobernador, sino más adelante."
        literal: "Have patience, for adventures themselves-will-offer where not only you I-may make governor, but more further."
        ormsby: "have patience, for adventures will present themselves from which I may make you, not only a governor, but something more.”"
        vocab:
          - {w: "tener paciencia", d: "to be patient"}
          - {w: "ofrecerse", d: "to present itself, come up"}
          - {w: "no solamente ... sino", d: "not only ... but"}
          - {w: "más adelante", d: "further on; here 'something higher still'"}
        diagram:
          - s: "Tened paciencia"
            r: "main verb 1: have patience (a command)"
          - s: "aventuras se ofrecerán"
            r: "main verb 2, after loose 'que' = for: adventures will come"
            under:
              - {s: "donde no solamente os pueda hacer gobernador, sino más adelante", r: "describes the adventures: where I can make you not only governor but more"}
        forms:
          - {w: "Tened", f: "ten- + -ed → tener (to have), command to 'vos' / vosotros: the infinitive loses -r and adds -d."}
          - {w: "que", f: "loose 'que' = 'for, because'."}
          - {w: "se ofrecerán", f: "ofrecer + -án → ofrecerse (to present itself), future, they. The future is the whole infinitive + -é, -ás, -á, -emos, -éis, -án."}
          - {w: "os", f: "the object pronoun of vos / vosotros: 'you'."}
          - {w: "pueda", f: "pued- + -a → poder (to be able), present subjunctive, I. The stem o becomes ue when stressed: pueda, puedas, pueda, podamos, podáis, puedan. Subjunctive because these adventures have not happened yet."}
          - {w: "hacer", f: "infinitive (to make) after 'pueda'."}
  - sentences:
      - es: "Agradecióselo mucho Sancho, y, besándole otra vez la mano y la falda de la loriga, le ayudó a subir sobre Rocinante;"
        literal: "Thanked-him-for-it much Sancho, and, kissing-him another time the hand and the skirt of the hauberk, him he-helped to climb upon Rocinante;"
        ormsby: "Sancho gave him many thanks, and again kissing his hand and the skirt of his hauberk, helped him to mount Rocinante,"
        vocab:
          - {w: "agradecer", d: "to be grateful for, to thank for"}
          - {w: "otra vez", d: "again"}
          - {w: "falda", d: "skirt; here the lower flap of the mail coat"}
          - {w: "loriga", d: "coat of mail, hauberk"}
          - {w: "ayudar a", d: "to help (to do)"}
        diagram:
          - s: "Agradecióselo mucho Sancho"
            r: "main verb 1: Sancho thanked him warmly for it"
          - s: "le ayudó a subir sobre Rocinante"
            r: "main verb 2 (after 'y'): he helped him onto Rocinante"
            under:
              - {s: "besándole otra vez la mano y la falda de la loriga", r: "how: kissing his hand and the skirt of his mail again"}
        forms:
          - {w: "Agradecióselo", f: "agradec- + -ió + se + lo → agradecer (to thank for), preterite, he, with 'se lo' stuck on the end: 'thanked him for it'. 'se' stands in for 'le' (to him), because le / les turns into 'se' before lo / la / los / las. Cervantes hangs pronouns on the end of a conjugated verb that opens its clause; modern Spanish says 'se lo agradeció'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "besándole", f: "bes- + -ando + le → gerund of besar (to kiss) + le (his, literally 'to him'), accent added to keep the stress."}
          - {w: "le ayudó", f: "ayud- + -ó → ayudar (to help), preterite, he: 'helped him'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. 'le' for 'him' as direct object is leísmo, the Castilian habit of using 'le' for a male person."}
          - {w: "subir", f: "infinitive (to climb) after 'ayudar a'."}
      - es: "y él subió sobre su asno y comenzó a seguir a su señor, que, a paso tirado, sin despedirse ni hablar más con las del coche, se entró por un bosque que allí junto estaba."
        literal: "and he climbed upon his ass and began to follow [to] his lord, who, at pace drawn-out, without taking-leave-himself nor speaking more with those of-the coach, himself entered through a wood that there near was."
        ormsby: "and mounting his ass himself, proceeded to follow his master, who at a brisk pace, without taking leave, or saying anything further to the ladies belonging to the coach, turned into a wood that was hard by."
        vocab:
          - {w: "asno", d: "ass, donkey"}
          - {w: "comenzar a", d: "to begin to"}
          - {w: "a paso tirado", d: "at a brisk pace, briskly"}
          - {w: "despedirse", d: "to say goodbye, take one's leave"}
          - {w: "las del coche", d: "the ladies of the coach, the Basque lady and her women from the last chapter"}
          - {w: "entrarse por", d: "to go off into"}
          - {w: "bosque", d: "wood, forest"}
          - {w: "allí junto", d: "close by there"}
        diagram:
          - s: "y él subió sobre su asno"
            r: "main verb 1: and he got on his donkey"
          - s: "y comenzó a seguir a su señor"
            r: "main verb 2: and began to follow his master"
            under:
              - s: "que, a paso tirado, sin despedirse ni hablar más con las del coche, se entró por un bosque"
                r: "describes 'señor': who briskly, without a goodbye to the ladies, went into a wood"
                under:
                  - {s: "que allí junto estaba", r: "describes 'bosque': that was close by"}
        forms:
          - {w: "subió", f: "sub- + -ió → subir (to climb up), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "comenzó", f: "comenz- + -ó → comenzar (to begin), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (the 'I' form is comencé, z becoming c before e)."}
          - {w: "a su señor", f: "the 'personal a' marks a person as the direct object."}
