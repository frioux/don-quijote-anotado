summary: |
  The fight with the Basque is over. Sancho, bruised by the friars' servants, kneels and asks for the governorship of the island he thinks his master has just won. Don Quijote explains that roadside adventures like this one win nothing but broken heads, and promises better ones to come. He rides off into a wood without a word to the ladies of the coach, and Sancho, trotting after on his donkey, suggests they hide in a church before the Holy Brotherhood arrests them. Don Quijote scoffs: no knight-errant was ever brought to trial, whatever he had done.

  Sancho asks him to dress his bleeding ear. Don Quijote says the balm of Fierabrás would make that unnecessary: two swallows of it would heal him even if he were cut in half, provided Sancho fitted the halves back together before the blood set. Sancho at once offers to give up his island for the recipe so he can sell the balm, and learns that it costs almost nothing to make.

  Seeing his broken helmet, Don Quijote swears, in the words of the ballad of the Marquis of Mantua, to eat off no tablecloth and sleep with no wife until he is avenged. Sancho points out that the Basque has been sentenced already, so Don Quijote changes the oath: he will live that way until he takes as good a helmet from another knight, as happened with Mambrino's helmet. Sancho objects that no one on these roads wears a helmet; Don Quijote assures him there will be more armed men than at the siege of Albraca, and offers him a kingdom in place of an island.

  They eat Sancho's onion, cheese and bread. Don Quijote explains that knights-errant hardly eat, and then only country food and wild herbs; Sancho promises dried fruit for his master and poultry for himself. Night falls before they reach a village, and they stop by some goatherds' huts. Sancho is sorry; Don Quijote is delighted, since every night under the open sky proves him a knight.
context: |
  The chapter and its title. The Spanish title promises more of the Basque and 'the danger he was in with a crowd of Yangüeses', but neither happens. Most editors take this as a slip left over from Cervantes moving his chapter breaks, one of several signs of hasty revision in the 1605 edition. Ormsby, like most translators, gives the chapter a title that fits what actually happens.

  Law and the roads. The Santa Hermandad (Holy Brotherhood), as Ormsby's note explains, was a rural police force with summary powers over crimes committed on the highways and outside the towns; its officers could punish offenders summarily. Sancho's fear is realistic, and his idea of hiding in a church relies on the right of sanctuary, which let a fugitive escape the secular courts. His 'omecillos' is the village word for the fine paid by an absent defendant in an assault case, which he uses in place of Don Quijote's grand 'homicidios'. Later in the chapter Sancho argues like a lawyer that the Basque has served his sentence, and the last sentence borrows from property law: an 'acto posesivo' was a deed, like sleeping on the land, that proved a claim to it.

  The books. The balm of Fierabrás comes from the French romance of Fierabras, known in Spain through Nicolás de Piamonte's 'Historia del emperador Carlomagno y de los doce pares de Francia', as Ormsby notes: the giant Fierabrás owns the balm used to embalm Christ, which heals any wound. The oath comes from the popular ballad of the Marquis of Mantua, whose nephew Valdovinos was murdered by Charlemagne's son; Don Quijote recited this ballad in Chapter 5. Mambrino, Sacripante, Albraca and Angélica come from Boiardo's 'Orlando innamorato' and Ariosto's 'Orlando furioso'. Ormsby notes that Cervantes gets a detail wrong: it was Dardinel, not Sacripante, whom Mambrino's helmet cost dear. Denmark and Sobradisa (Cervantes writes Soliadisa) are kingdoms from Amadís de Gaula.

  Food and class. Onion, cheese and stale bread were what a peasant carried on the road. Don Quijote's claim that knights-errant hardly ate is literally true of the romances, which rarely mention meals, and he turns it into a rule. Sancho's reply, dried fruit for the knight and 'cosas volátiles' (poultry) for himself, sets up the book's lasting contrast between the knight who lives on ideals and the squire who lives on his stomach. His first thought on hearing of the miracle balm is to sell it by the ounce.

  The squire's character. This is the first long conversation between the two, and Sancho's voice is set here: country forms (trayo, prazga, omecillos), proverbs, the thrice-repeated 'que' of excited speech, practical fear of the law, and a sly sense of humor ('some day we will need to know those herbs'). Don Quijote moves between the formal 'vos' and the familiar 'tú' in speaking to him.

  Reading Cervantes' Spanish. This chapter adds several things to the list from earlier chapters. The future subjunctive (vieres, hubiere caído, quedare, faltare, hallaren) marks a possible future event, where modern Spanish uses the present subjunctive. The old vos preterite in -istes (combatistes) is modern -isteis. Pronouns stuck to the end of a clause-opening verb are everywhere (Agradecióselo, Seguíale, Hízolo, Paréceme, verásme, Hágote, Engáñaste, hase, diéronse, faltóles). An infinitive + le or lo melts into -ll- (hacelle, encajallo). Old spellings and forms: vitoria, escrebir, agora, ansí, ferida, fizo, folgar, sotileza, estremado, escusado, efeto, priesa, yerbas, Criador, compaña, mesmo, dél, della, dellas. The -ra form still does duty as a conditional (fuera, se ahorraran, se te hiciera), and 'haber de' + infinitive ('qué hemos de hacer') means 'to be supposed to'.
