  - sentences:
      - es: "— Todo eso fuera bien escusado —respondió don Quijote— si a mí se me acordara de hacer una redoma del bálsamo de Fierabrás, que con sola una gota se ahorraran tiempo y medicinas."
        literal: "— All that would-be well excused —answered Don Quijote— if to me itself to-me had-remembered to make a flask of-the balm of Fierabrás, for with only one drop would-be-saved time and medicines."
        ormsby: "“All that might be well dispensed with,” said Don Quixote, “if I had remembered to make a vial of the balsam of Fierabras, for time and medicine are saved by one single drop.”"
        vocab:
          - {w: "escusado", d: "= excusado, unnecessary, needless"}
          - {w: "acordársele a uno de", d: "to occur to one, to remember: 'se me acordara' = I had remembered"}
          - {w: "redoma", d: "glass flask, vial"}
          - {w: "bálsamo", d: "balm, balsam, healing ointment"}
          - {w: "Fierabrás", d: "a Saracen giant in the French Charlemagne romances, who stole the balm used to embalm Christ"}
          - {w: "gota", d: "drop"}
          - {w: "ahorrar", d: "to save, spare"}
        diagram:
          - s: "Todo eso fuera bien escusado"
            r: "main verb: all that would be quite unnecessary"
            under:
              - {s: "respondió don Quijote", r: "speech tag"}
              - s: "si a mí se me acordara de hacer una redoma del bálsamo de Fierabrás"
                r: "condition: if I had remembered to make a flask of the balm of Fierabrás"
                under:
                  - {s: "que con sola una gota se ahorraran tiempo y medicinas", r: "loose 'que': with a single drop both time and medicine would be saved"}
        forms:
          - {w: "Todo eso", f: "'all that', neuter: eso points at a whole idea."}
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), it: here 'would be'. ser's -ra forms: fuera, fueras, fuera, fuéramos, fuerais, fueran. Cervantes uses the -ra form where modern Spanish says 'sería'."}
          - {w: "escusado", f: "participle of escusar = excusar (to spare), masculine: 'needless'."}
          - {w: "se me acordara", f: "acord- + -ara → acordar (to remember), imperfect subjunctive (-ra form), it, with 'se' and 'me': 'it had occurred to me'. The -ra imperfect subjunctive of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran. After 'si' the -ra form is the counterfactual."}
          - {w: "del", f: "de + el."}
          - {w: "sola una gota", f: "sol- + -a → solo (only), feminine to match 'gota': 'one single drop'."}
          - {w: "se ahorraran", f: "ahorr- + -aran → ahorrar (to save), imperfect subjunctive (-ra form), they, with 'se' making it passive: 'would be saved'. Same -ara endings; here the -ra form stands for a conditional ('se ahorrarían')."}
        note: "In the French romance of Fierabras, the giant has two barrels of the balm with which Christ's body was embalmed, and it heals any wound at once. Don Quijote treats the recipe as practical first aid."
        ormsby_note: "Fierabras, i.e. Fier à Bras = 'Arm-strong,' a giant in Nicolás de Piamonte's history of Charlemagne and the Peers."
