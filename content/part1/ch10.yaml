          - {w: "alto", d: "halt!, enough!"}
          - {w: "sea ansí", d: "so be it; ansí = así"}
          - {w: "a Dios prazga", d: "may it please God; 'prazga' is a rustic form of 'plazca' (from placer, to please)"}
          - {w: "suceder bien", d: "to turn out well"}
          - {w: "llegarse", d: "to come, draw near"}
          - {w: "costar caro", d: "to cost dear"}
          - {w: "luego", d: "at once, right after"}
