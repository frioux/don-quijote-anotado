  - sentences:
      - es: "— Calla, amigo —respondió don Quijote—, que mayores secretos pienso enseñarte y mayores mercedes hacerte; y, por agora, curémonos, que la oreja me duele más de lo que yo quisiera."
        literal: "— Be-quiet, friend —answered Don Quijote—, for greater secrets I-intend to-teach-you and greater favors to-do-you; and, for now, let-us-treat-ourselves, for the ear to-me hurts more than that which I would-wish."
        ormsby: "“Peace, friend,” answered Don Quixote; “greater secrets I mean to teach thee and greater favours to bestow upon thee; and for the present let us see to the dressing, for my ear pains me more than I could wish.”"
        vocab:
          - {w: "pensar + inf.", d: "to intend to, mean to"}
          - {w: "merced", d: "favor, grace, reward"}
          - {w: "por agora", d: "= por ahora, for now"}
          - {w: "curarse", d: "to treat one's wounds"}
          - {w: "doler", d: "to hurt, ache"}
          - {w: "más de lo que", d: "more than"}
        diagram:
          - s: "Calla"
            r: "main verb 1: be quiet (a command)"
            under:
              - {s: "amigo", r: "who is addressed"}
              - {s: "respondió don Quijote", r: "speech tag"}
          - s: "mayores secretos pienso enseñarte"
            r: "main verb 2, after loose 'que' = for: greater secrets I mean to teach you"
            under:
              - {s: "y mayores mercedes hacerte", r: "and greater favors to do you"}
          - s: "curémonos"
            r: "main verb 3: let us treat our wounds"
            under:
              - {s: "por agora", r: "when: for now"}
              - s: "que la oreja me duele"
                r: "why, loose 'que': my ear hurts"
                under:
                  - {s: "más de lo que yo quisiera", r: "how much: more than I would like"}
        forms:
          - {w: "Calla", f: "call- + -a → callar (to be quiet), command to tú. The tú command looks like the he-form of the present."}
          - {w: "mayores", f: "mayor + -es → 'greater' (the comparative of grande), plural to match 'secretos' and 'mercedes'."}
          - {w: "pienso", f: "piens- + -o → pensar (to think; + infinitive = to intend), present, I. The stem e becomes ie when stressed: pienso, piensas, piensa, pensamos, pensáis, piensan."}
          - {w: "enseñarte, hacerte", f: "enseñar (to teach) and hacer (to do) + te (you), pronouns hung on the infinitives."}
          - {w: "curémonos", f: "cur- + -emos + nos → curarse (to treat one's wounds), 'let us' command (from the present subjunctive curemos); the final -s drops before 'nos' and an accent is added."}
          - {w: "me duele", f: "duel- + -e → doler (to hurt), present, it, with 'me' (to me): built like gustar, the ear is the subject. The stem o becomes ue when stressed: duelo, dueles, duele, dolemos, doléis, duelen."}
          - {w: "quisiera", f: "quis- + -iera → querer (to want), imperfect subjunctive (-ra form), I: 'would like'. Built on the preterite quisieron: quisiera, quisieras, quisiera, quisiéramos, quisierais, quisieran. The -ra form softens a wish, as it still does today."}
