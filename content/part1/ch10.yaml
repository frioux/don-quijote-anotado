          - {w: "sacar de las manos de", d: "to rescue from the hands of"}
          - {w: "caldeos", d: "Chaldeans, the Babylonians of the Bible who carried the Jews into captivity; proverbial for the worst of captors"}
          - {w: "cuanto más", d: "let alone, all the more"}
        diagram:
