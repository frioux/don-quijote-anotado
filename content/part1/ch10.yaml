          - {w: "valeroso", d: "valiant, brave"}
          - {w: "lo descubierto de la tierra", d: "the discovered part of the earth, the known world"}
        diagram:
          - s: "Pero dime"
            r: "main verb 1: but tell me (a command)"
            under:
              - {s: "por tu vida", r: "oath: on your life"}
          - s: "¿has visto más valeroso caballero que yo"
            r: "main verb 2, the question: have you seen a braver knight than me"
            under:
              - {s: "en todo lo descubierto de la tierra?", r: "where: in all the known world"}
        forms:
