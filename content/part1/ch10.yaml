        vocab:
          - {w: "si eso hay", d: "if there is such a thing"}
          - {w: "renunciar", d: "to renounce, give up (today 'renunciar a')"}
          - {w: "desde aquí", d: "from now on, henceforth"}
          - {w: "no ... otra cosa ... sino", d: "nothing else but"}
          - {w: "en pago de", d: "in payment for"}
          - {w: "estremado", d: "= extremado, superb, outstanding"}
          - {w: "licor", d: "liquid, potion; not necessarily alcohol"}
