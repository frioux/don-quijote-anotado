        forms:
          - {w: "que ... que ... que", f: "Sancho's 'que' is repeated three times in one breath, a mark of his loose country speech; only one is needed."}
          - {w: "hacen", f: "hac- + -en → hacer (to do), present, they. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (the 'I' form is hago)."}
          - {w: "salgamos", f: "salg- + -amos → salir (to get out), present subjunctive, we. Built on the irregular 'salgo': salga, salgas, salga, salgamos, salgáis, salgan. 'primero que' (before) takes the subjunctive."}
          - {w: "ha de sudar", f: "ha → haber, present, it, + de + sudar (to sweat): 'will have to sweat'. haber in the present: he, has, ha, hemos, habéis, han. 'nos' = for us: it is 'the tuft' that sweats on us."}
  - sentences:
      - es: "— Calla —dijo don Quijote—. Y ¿dónde has visto tú, o leído jamás, que caballero andante haya sido puesto ante la justicia, por más homicidios que hubiese cometido?"
        literal: "— Be-quiet —said Don Quijote—. And where have-you seen you, or read ever, that knight errant may-have been put before the justice, for more homicides that he-might-have committed?"
        ormsby: "“Peace,” said Don Quixote; “where hast thou ever seen or heard that a knight-errant has been arraigned before a court of justice, however many homicides he may have committed?”"
        vocab:
          - {w: "callar", d: "to be quiet; 'calla' = hush, be quiet"}
          - {w: "jamás", d: "ever (in a question), never"}
          - {w: "caballero andante", d: "knight-errant"}
          - {w: "la justicia", d: "the law, the courts, the officers of the law"}
          - {w: "por más ... que", d: "however many ... (+ subjunctive)"}
          - {w: "homicidio", d: "homicide, killing"}
          - {w: "cometer", d: "to commit"}
        diagram:
          - {s: "Calla", r: "main verb 1: be quiet (a command)"}
          - {s: "dijo don Quijote", r: "speech tag: said Don Quijote"}
          - s: "has visto tú, o leído jamás"
            r: "main verb 2: have you ever seen or read"
            under:
              - {s: "Y ¿dónde", r: "where (the question word)"}
              - s: "que caballero andante haya sido puesto ante la justicia"
                r: "what: that a knight-errant has been brought before the law"
                under:
                  - {s: "por más homicidios que hubiese cometido", r: "concession: however many killings he had done"}
        forms:
          - {w: "Calla", f: "call- + -a → callar (to be quiet), command to tú. The tú command looks like the he-form of the present: calla, come, sube."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "has visto", f: "has + visto → haber + visto, the irregular participle of ver (to see): present perfect, you: 'have you seen'. haber in the present: he, has, ha, hemos, habéis, han. Don Quijote now uses 'tú' to Sancho."}
          - {w: "leído", f: "le- + -ído → participle of leer (to read), sharing 'has': 'have you read'."}
          - {w: "haya sido puesto", f: "haya + sido + puesto → haber + the participle of ser + the irregular participle of poner (to put): present perfect subjunctive, passive, he: 'has been put'. haber's present subjunctive: haya, hayas, haya, hayamos, hayáis, hayan. Subjunctive because the question expects 'never'."}
          - {w: "hubiese cometido", f: "hub- + -iese + cometido → haber + the participle of cometer (to commit): pluperfect subjunctive, he: 'might have committed'. haber in the -se imperfect subjunctive: hubiese, hubieses, hubiese, hubiésemos, hubieseis, hubiesen. 'por más ... que' takes the subjunctive."}
  - sentences:
      - es: "— Yo no sé nada de omecillos —respondió Sancho—, ni en mi vida le caté a ninguno; sólo sé que la Santa Hermandad tiene que ver con los que pelean en el campo, y en esotro no me entremeto."
        literal: "— I not know nothing of homicide-fines —answered Sancho—, nor in my life it I-looked-at to none; only I-know that the Holy Brotherhood has to see with those who fight in the countryside, and in that-other not myself I-meddle."
        ormsby: "“I know nothing about omecils,” answered Sancho, “nor in my life have had anything to do with one; I only know that the Holy Brotherhood looks after those who fight in the fields, and in that other matter I do not meddle.”"
        vocab:
          - {w: "omecillo", d: "old form of 'homicidio'; in popular speech the fine for failing to answer an assault charge, and also 'a grudge'"}
          - {w: "catar", d: "to look at, taste; 'no catar' = to have nothing to do with (archaic)"}
          - {w: "tener que ver con", d: "to have to do with, deal with"}
          - {w: "pelear", d: "to fight"}
          - {w: "en el campo", d: "in the open country, outside the towns"}
          - {w: "esotro", d: "= eso otro, 'that other [matter]'"}
          - {w: "entremeterse", d: "= entrometerse, to meddle, interfere"}
        diagram:
          - s: "Yo no sé nada de omecillos"
            r: "main verb 1: I know nothing of 'omecillos'"
          - {s: "respondió Sancho", r: "speech tag: answered Sancho"}
          - s: "ni en mi vida le caté a ninguno"
            r: "main verb 2: nor ever in my life had to do with one"
          - s: "sólo sé"
            r: "main verb 3: I only know"
            under:
              - s: "que la Santa Hermandad tiene que ver con los"
                r: "what he knows: that the Brotherhood deals with those"
                under:
                  - {s: "que pelean en el campo", r: "describes 'los': who fight out in the country"}
          - {s: "y en esotro no me entremeto", r: "main verb 4: and in that other matter I don't meddle"}
        forms:
          - {w: "sé", f: "saber (to know), present, I. Irregular 'I' form: sé, sabes, sabe, sabemos, sabéis, saben. The accent tells it from 'se'."}
          - {w: "no ... nada", f: "Spanish doubles the negative: 'not ... nothing' = nothing at all."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "le caté a ninguno", f: "cat- + -é → catar (to look at), preterite, I. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. 'le' announces 'a ninguno' in advance, a doubling Spanish often uses."}
          - {w: "tiene que ver", f: "tien- + -e → tener (to have), present, it: 'tener que ver con' = to deal with. tener's present: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "pelean", f: "pele- + -an → pelear (to fight), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "esotro", f: "eso + otro fused: 'that other [thing]', neuter."}
          - {w: "me entremeto", f: "entremet- + -o → entremeterse (to meddle), present, I, with 'me' (myself). The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
        note: "Sancho mishears the learned 'homicidios' as the rustic 'omecillos', a word he knows only from village law. It is the first of many such mangled words from him."
        ormsby_note: "Omecillo or hornecillo was an old form of the word homecidio, but in popular parlance it meant the fine imposed in default of appearance to answer a charge of assault and battery."
  - sentences:
      - es: "— Pues no tengas pena, amigo —respondió don Quijote—, que yo te sacaré de las manos de los caldeos, cuanto más de las de la Hermandad."
