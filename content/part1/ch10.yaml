  - sentences:
      - es: "— Yo hago juramento al Criador de todas las cosas y a los santos cuatro Evangelios, donde más largamente están escritos, de hacer la vida que hizo el grande marqués de Mantua cuando juró de vengar la muerte de su sobrino Valdovinos, que fue de no comer pan a manteles, ni con su mujer folgar, y otras cosas que, aunque dellas no me acuerdo, las doy aquí por expresadas, hasta tomar entera venganza del que tal desaguisado me fizo."
        literal: "— I make oath to-the Creator of all the things and to the holy four Gospels, where most at-length they-are written, to lead the life that led the great marquis of Mantua when he-swore to avenge the death of his nephew Valdovinos, which was of not to-eat bread on tablecloths, nor with his wife to-take-pleasure, and other things that, although of-them not myself I-remember, them I-give here as expressed, until to-take entire vengeance on-the-one who such outrage to-me did."
        ormsby: "“I swear by the Creator of all things and the four Gospels in their fullest extent, to do as the great Marquis of Mantua did when he swore to avenge the death of his nephew Baldwin (and that was not to eat bread from a tablecloth, nor embrace his wife, and other points which, though I cannot now call them to mind, I here grant as expressed) until I take complete vengeance upon him who has committed such an offence against me.”"
        vocab:
          - {w: "hacer juramento", d: "to swear an oath"}
          - {w: "Criador", d: "= Creador, the Creator (old form)"}
          - {w: "Evangelios", d: "the Gospels; oaths were sworn on them"}
          - {w: "largamente", d: "at length, in full"}
          - {w: "hacer la vida", d: "to lead the life, live the way"}
          - {w: "marqués de Mantua", d: "hero of a popular Spanish ballad who swears to avenge his murdered nephew Valdovinos"}
          - {w: "Valdovinos", d: "Baldwin, the marquis's nephew, killed by Charlemagne's son Carloto in the ballad"}
          - {w: "jurar de", d: "to swear to"}
          - {w: "vengar", d: "to avenge"}
          - {w: "comer pan a manteles", d: "to eat at a table laid with a cloth, i.e. to dine properly"}
          - {w: "folgar", d: "= holgar, to take one's ease; here to sleep with (his wife)"}
          - {w: "dar por expresado", d: "to take as stated, count as said"}
          - {w: "desaguisado", d: "outrage, wrong, injury"}
          - {w: "fizo", d: "= hizo, did (old f- form, from the ballads)"}
        diagram:
          - s: "Yo hago juramento"
            r: "main verb: I swear an oath"
            under:
              - {s: "al Criador de todas las cosas y a los santos cuatro Evangelios", r: "by whom: the Creator and the four Gospels"}
              - {s: "donde más largamente están escritos", r: "describes the Gospels: where they are written out in full"}
              - s: "de hacer la vida"
                r: "what he swears: to live the life"
                under:
                  - s: "que hizo el grande marqués de Mantua"
                    r: "describes 'vida': that the great marquis of Mantua lived"
                    under:
                      - {s: "cuando juró de vengar la muerte de su sobrino Valdovinos", r: "when: when he swore to avenge his nephew"}
                  - {s: "que fue de no comer pan a manteles, ni con su mujer folgar", r: "describes 'vida': not dining at table nor sleeping with his wife"}
                  - s: "y otras cosas"
                    r: "and other things"
                    under:
                      - {s: "que, aunque dellas no me acuerdo, las doy aquí por expresadas", r: "describes 'cosas': which, though I don't remember them, I count as said"}
              - {s: "hasta tomar entera venganza del que tal desaguisado me fizo", r: "until when: until I take full revenge on the man who did me such wrong"}
        forms:
          - {w: "hago", f: "hag- + -o → hacer (to make), present, I. Irregular 'I' form: hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "al", f: "a + el."}
          - {w: "santos cuatro", f: "sant- + -os → santo (holy), masculine plural to match 'Evangelios', put before the number in the old solemn order."}
          - {w: "están escritos", f: "est- + -án → estar (to be), present, they, + escritos, the irregular participle of escribir (to write), plural to match the Gospels. estoy, estás, está, estamos, estáis, están."}
          - {w: "hizo", f: "hiz- + -o → hacer (to do; 'hacer la vida' = to lead the life), preterite, he. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "grande", f: "Cervantes keeps the full form before the noun in this solemn phrase; modern Spanish clips it to 'gran'."}
          - {w: "juró", f: "jur- + -ó → jurar (to swear), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "fue", f: "ser (to be), preterite, it. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "folgar", f: "old form of holgar (to take pleasure), the initial f- kept from the ballad; the infinitive is placed last for the rhythm of verse."}
          - {w: "dellas", f: "de + ellas (of them, the 'cosas')."}
          - {w: "me acuerdo", f: "acuerd- + -o → acordarse de (to remember), present, I, with 'me'. The stem o becomes ue when stressed: acuerdo, acuerdas, acuerda, acordamos, acordáis, acuerdan."}
          - {w: "las doy", f: "doy → dar (to give; 'dar por' = to count as), present, I, with 'las' (them). dar's present: doy, das, da, damos, dais, dan."}
          - {w: "expresadas", f: "participle of expresar (to express), feminine plural to match 'las' (the cosas)."}
          - {w: "del que", f: "de + el que: 'of the one who'."}
          - {w: "fizo", f: "old form of hizo (did), preterite of hacer, he; the f- is ballad language."}
        note: "The ballad of the Marquis of Mantua, which Don Quijote recited in Chapter 5, has the marquis swear 'de no comer a manteles ... ni con la Marquesa holgar' until he is avenged. Don Quijote swears an oath from a ballad over a cardboard helmet."
