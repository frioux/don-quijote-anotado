  - sentences:
      - es: "— Ya te he dicho, Sancho, que no te dé eso cuidado alguno; que, cuando faltare ínsula, ahí está el reino de Dinamarca o el de Soliadisa, que te vendrán como anillo al dedo; y más, que, por ser en tierra firme, te debes más alegrar."
        literal: "— Already to-you I-have said, Sancho, that not to-you may-give that care any; for, when there-shall-lack isle, there is the kingdom of Denmark or that of Soliadisa, which to-you will-come like ring to-the finger; and more, that, for being on land firm, yourself you-ought more to-rejoice."
        ormsby: "“I have already told thee, Sancho,” said Don Quixote, “not to give thyself any uneasiness on that score; for if an island should fail, there is the kingdom of Denmark, or of Sobradisa, which will fit thee as a ring fits the finger, and all the more that, being on terra firma, thou wilt all the better enjoy thyself."
        vocab:
          - {w: "dar cuidado", d: "to worry, trouble: 'no te dé eso cuidado' = don't let that worry you"}
          - {w: "faltar", d: "to be lacking, fail"}
          - {w: "reino", d: "kingdom"}
          - {w: "Dinamarca", d: "Denmark, a kingdom that turns up in the romances"}
          - {w: "Soliadisa", d: "Cervantes' version of Sobradisa, a kingdom in 'Amadís de Gaula'"}
          - {w: "venir como anillo al dedo", d: "to fit like a ring on the finger, to suit perfectly"}
          - {w: "y más, que", d: "and what is more"}
          - {w: "tierra firme", d: "mainland, terra firma"}
          - {w: "alegrarse", d: "to be glad"}
        diagram:
          - s: "Ya te he dicho"
            r: "main verb 1: I have already told you"
            under:
              - {s: "Sancho", r: "who is addressed"}
              - {s: "que no te dé eso cuidado alguno", r: "what: not to let that worry you at all"}
          - s: "ahí está el reino de Dinamarca o el de Soliadisa"
            r: "main verb 2, after loose 'que' = for: there is the kingdom of Denmark or Soliadisa"
            under:
              - {s: "cuando faltare ínsula", r: "when: if an isle should be lacking"}
              - {s: "que te vendrán como anillo al dedo", r: "describes the kingdoms: which will fit you perfectly"}
          - s: "te debes más alegrar"
            r: "main verb 3, after 'y más, que': you ought to be all the gladder"
            under:
              - {s: "por ser en tierra firme", r: "why: because it is on the mainland"}
        forms:
          - {w: "te he dicho", f: "he + dicho → haber + dicho, the irregular participle of decir (to say): present perfect, I, with 'te' (to you). haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "no te dé", f: "dé → dar (to give), present subjunctive, it, with 'te' (to you): 'that it not give you'. dar's present subjunctive: dé, des, dé, demos, deis, den."}
          - {w: "cuidado alguno", f: "'alguno' after the noun in a negative = 'any at all'."}
          - {w: "faltare", f: "falt- + -are → faltar (to be lacking), future subjunctive, it: 'if [an isle] shall be lacking'. The -ar future subjunctive: -are, -ares, -are, -áremos, -areis, -aren; obsolete today."}
          - {w: "está", f: "est- + -á → estar (to be, of place), present, it. estoy, estás, está, estamos, estáis, están."}
          - {w: "el de", f: "'that of': 'el' stands for 'el reino'."}
          - {w: "vendrán", f: "vendr- + -án → venir (to come), future, they. venir has an irregular future stem: vendré, vendrás, vendrá, vendremos, vendréis, vendrán."}
          - {w: "al", f: "a + el."}
          - {w: "por ser", f: "por + infinitive = 'because of being'."}
          - {w: "te debes más alegrar", f: "deb- + -es → deber (ought), present, you, + alegrar (to gladden); 'te' belongs to 'alegrar' (alegrarse, to be glad) but sits before 'debes'. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
        note: "Sancho was promised an 'ínsula'; Don Quijote now throws in whole kingdoms and assures him a mainland one is better. A kingdom was the usual reward for a knight's faithful squire in the romances."
      - es: "Pero dejemos esto para su tiempo, y mira si traes algo en esas alforjas que comamos, porque vamos luego en busca de algún castillo donde alojemos esta noche y hagamos el bálsamo que te he dicho; porque yo te voto a Dios que me va doliendo mucho la oreja."
