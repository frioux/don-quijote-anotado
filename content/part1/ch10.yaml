      - es: "Y ansí, cuando yo le haga y te le dé, no tienes más que hacer sino que, cuando vieres que en alguna batalla me han partido por medio del cuerpo (como muchas veces suele acontecer), bonitamente la parte del cuerpo que hubiere caído en el suelo, y con mucha sotileza, antes que la sangre se yele, la pondrás sobre la otra mitad que quedare en la silla, advirtiendo de encajallo igualmente y al justo;"
        literal: "And so, when I it may-make and to-you it may-give, not you-have more to do but that, when you-shall-see that in some battle me they-have split through middle of-the body (as many times is-wont to-happen), neatly the part of-the body that shall-have fallen on the ground, and with much subtlety, before that the blood itself may-freeze, it you-will-put upon the other half that shall-remain in the saddle, taking-care of fitting-it evenly and to-the exact;"
