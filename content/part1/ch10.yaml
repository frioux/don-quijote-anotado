  - sentences:
      - es: "— Si eso hay —dijo Panza—, yo renuncio desde aquí el gobierno de la prometida ínsula, y no quiero otra cosa, en pago de mis muchos y buenos servicios, sino que vuestra merced me dé la receta de ese estremado licor;"
