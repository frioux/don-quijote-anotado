          - {w: "tu", f: "'your' (tú's possessive), no accent; one form for both genders (tu, tus)."}
          - {w: "has visto", f: "has + visto → haber + visto, the irregular participle of ver (to see): present perfect, you. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "más valeroso ... que", f: "más + adjective + que = 'more ... than'."}
          - {w: "lo descubierto", f: "neuter 'lo' + descubierto, participle of descubrir (to discover): 'the discovered [part]'."}
