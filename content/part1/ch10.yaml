  - sentences:
      - es: "— Paréceme, señor, que sería acertado irnos a retraer a alguna iglesia;"
        literal: "— Seems-to-me, sir, that it-would-be wise to-go-ourselves to take-refuge in some church;"
        ormsby: "“It seems to me, señor, it would be prudent in us to go and take refuge in some church,"
        vocab:
          - {w: "parecer", d: "to seem; 'paréceme' = it seems to me"}
          - {w: "acertado", d: "wise, the right thing"}
          - {w: "irse", d: "to go off, go away"}
          - {w: "retraerse a", d: "to take refuge in; used of fugitives claiming sanctuary"}
          - {w: "iglesia", d: "church"}
        diagram:
          - s: "Paréceme"
            r: "main verb: it seems to me"
            under:
              - {s: "señor", r: "who is addressed"}
              - s: "que sería acertado"
                r: "what seems: that it would be wise"
                under:
                  - {s: "irnos a retraer a alguna iglesia", r: "what would be wise: to go and take refuge in a church"}
        forms:
          - {w: "Paréceme", f: "parec- + -e + me → parecer (to seem), present, it, with 'me' (to me) stuck on the end; modern 'me parece'. Cervantes hangs pronouns on the end of a conjugated verb that opens its clause. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (the 'I' form is parezco)."}
          - {w: "sería", f: "ser + -ía → ser (to be), conditional, it: 'would be'. The conditional is the whole infinitive + -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "acertado", f: "participle of acertar (to hit the mark), used as an adjective: 'right, wise'."}
          - {w: "irnos a retraer", f: "ir + nos → irse (to go off) with 'nos' (ourselves), then 'a' + retraer (to withdraw; 'retraerse' = to take refuge). The 'nos' also serves 'retraer': 'for us to go and take refuge'."}
          - {w: "alguna", f: "algun- + -a → alguno (some), feminine to match 'iglesia'."}
        note: "A fugitive who reached a church could claim sanctuary ('acogerse a sagrado'), and the secular officers could not take him out of it. Sancho already assumes they are criminals on the run."
      - es: "que, según quedó maltrecho aquel con quien os combatistes, no será mucho que den noticia del caso a la Santa Hermandad y nos prendan;"
        literal: "for, according-as remained battered that-one with whom yourself you-fought, not it-will-be much that they-give notice of-the case to the Holy Brotherhood and us they-seize;"
        ormsby: "for, seeing how mauled he with whom you fought has been left, it will be no wonder if they give information of the affair to the Holy Brotherhood and arrest us,"
        vocab:
          - {w: "según", d: "here: seeing how, given how"}
          - {w: "quedar", d: "to be left, end up"}
          - {w: "maltrecho", d: "battered, badly hurt"}
          - {w: "combatirse con", d: "to fight with"}
          - {w: "no será mucho que", d: "it would be no wonder if"}
          - {w: "dar noticia de", d: "to report, inform about"}
          - {w: "caso", d: "affair, incident"}
          - {w: "Santa Hermandad", d: "the Holy Brotherhood, the rural police force of Castile"}
          - {w: "prender", d: "to arrest, seize"}
        diagram:
          - s: "no será mucho"
            r: "main verb, after loose 'que' = for: it will be no wonder"
            under:
              - s: "según quedó maltrecho aquel"
                r: "why: seeing how battered that man was left"
                under:
                  - {s: "con quien os combatistes", r: "describes 'aquel': the one you fought with"}
              - {s: "que den noticia del caso a la Santa Hermandad", r: "what is no wonder, 1: that they report it to the Holy Brotherhood"}
              - {s: "y nos prendan", r: "what is no wonder, 2: and arrest us"}
        forms:
          - {w: "quedó", f: "qued- + -ó → quedar (to be left), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "maltrecho", f: "mal + trecho, an old participle of traer (to bring, treat): 'badly treated'; masculine to match 'aquel'."}
          - {w: "aquel", f: "'that one', the far demonstrative used as a pronoun: the Basque."}
          - {w: "os combatistes", f: "combat- + -istes → combatirse (to fight), preterite, you (vos), with 'os' (yourself). The old vos ending -istes is modern -isteis. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis (old -istes), -ieron."}
          - {w: "será", f: "ser + -á → ser (to be), future, it. The future is the whole infinitive + -é, -ás, -á, -emos, -éis, -án."}
          - {w: "den", f: "d- + -en → dar (to give), present subjunctive, they (people in general). dar's present subjunctive: dé, des, dé, demos, deis, den. Subjunctive after 'no será mucho que'."}
          - {w: "del", f: "de + el."}
          - {w: "nos prendan", f: "prend- + -an → prender (to arrest), present subjunctive, they, with 'nos' (us). The present subjunctive of -er verbs: -a, -as, -a, -amos, -áis, -an."}
        ormsby_note: "The Santa Hermandad, a tribunal established in the thirteenth century, but revived in the reign of Ferdinand and Isabella, with summary jurisdiction over offenders against life and property on the highways and outside of the municipal boundaries."
      - es: "y a fe que si lo hacen, que primero que salgamos de la cárcel que nos ha de sudar el hopo."
        literal: "and by faith that if it they-do, that first that we-may-get-out from the jail that to-us has to sweat the tuft."
        ormsby: "and, faith, if they do, before we come out of gaol we shall have to sweat for it.”"
