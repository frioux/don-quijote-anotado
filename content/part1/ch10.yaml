          - s: "yo renuncio"
            r: "main verb 1: I give up"
            under:
              - {s: "Si eso hay", r: "condition: if that exists"}
              - {s: "dijo Panza", r: "speech tag"}
              - {s: "desde aquí", r: "when: from now on"}
              - {s: "el gobierno de la prometida ínsula", r: "object: the governorship of the promised isle"}
          - s: "y no quiero otra cosa"
            r: "main verb 2: and I want nothing else"
