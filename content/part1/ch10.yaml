          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "te sacaré", f: "sacar + -é → sacar (to take out), future, I, with 'te' (you). The future is the whole infinitive + -é, -ás, -á, -emos, -éis, -án."}
          - {w: "las de", f: "'those of': 'las' stands for 'las manos'."}
      - es: "Pero dime, por tu vida: ¿has visto más valeroso caballero que yo en todo lo descubierto de la tierra?"
        literal: "But tell-me, by your life: have-you seen more valiant knight than I in all the discovered of the earth?"
        ormsby: "But tell me, as thou livest, hast thou seen a more valiant knight than I in all the known world;"
        vocab:
