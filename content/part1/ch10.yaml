  - sentences:
      - es: "— Engáñaste en eso —dijo don Quijote—, porque no habremos estado dos horas por estas encrucijadas, cuando veamos más armados que los que vinieron sobre Albraca a la conquista de Angélica la Bella."
        literal: "— You-deceive-yourself in that —said Don Quijote—, because not we-will-have been two hours through these crossroads, when we-may-see more armed-men than those who came upon Albraca to the conquest of Angélica the Fair."
        ormsby: "“Thou art wrong there,” said Don Quixote, “for we shall not have been above two hours among these crossroads before we see more men in armour than came to Albraca to win the fair Angelica.”"
        vocab:
          - {w: "engañarse", d: "to be mistaken, fool oneself"}
          - {w: "no ... cuando", d: "no sooner ... than: 'no habremos estado dos horas ... cuando veamos' = we won't have been two hours before we see"}
          - {w: "encrucijada", d: "crossroads"}
          - {w: "armados", d: "armed men (adjective used as a noun)"}
          - {w: "venir sobre", d: "to come against, attack"}
          - {w: "Albraca", d: "fortress in Cathay besieged in Boiardo's 'Orlando innamorato'"}
          - {w: "Angélica la Bella", d: "Angelica the Fair, princess of Cathay, whom half the knights of Christendom and Islam pursue in the Orlando poems"}
        diagram:
          - s: "Engáñaste en eso"
            r: "main verb: you are wrong there"
            under:
              - {s: "dijo don Quijote", r: "speech tag"}
              - s: "porque no habremos estado dos horas por estas encrucijadas"
                r: "why: because we won't have spent two hours at these crossroads"
                under:
                  - s: "cuando veamos más armados"
                    r: "before: before we see more armed men"
                    under:
                      - {s: "que los que vinieron sobre Albraca a la conquista de Angélica la Bella", r: "than those who came against Albraca to win Angélica"}
        forms:
          - {w: "Engáñaste", f: "engañ- + -as + te → engañarse (to be mistaken), present, you, with 'te' (yourself) stuck on the end; modern 'te engañas'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. Cervantes hangs pronouns on the end of a conjugated verb that opens its clause."}
          - {w: "habremos estado", f: "habr- + -emos + estado → haber + the participle of estar (to be): future perfect, we: 'will have been'. haber's future: habré, habrás, habrá, habremos, habréis, habrán."}
          - {w: "estas", f: "'these', feminine plural to match 'encrucijadas'."}
          - {w: "veamos", f: "ve- + -amos → ver (to see), present subjunctive, we. Built on 'veo': vea, veas, vea, veamos, veáis, vean. 'cuando' about the future takes the subjunctive."}
          - {w: "los que", f: "'those who': the article as a pronoun + relative 'que'."}
          - {w: "vinieron", f: "vin- + -ieron → venir (to come), preterite, they. Irregular stem: vine, viniste, vino, vinimos, vinisteis, vinieron."}
        ormsby_note: "Albraca, a stronghold of Galafron, King of Cathay and father of Angelica. The siege is one of the incidents in the Orlando of Boiardo."
  - sentences:
      - es: "— Alto, pues; sea ansí —dijo Sancho—, y a Dios prazga que nos suceda bien, y que se llegue ya el tiempo de ganar esta ínsula que tan cara me cuesta, y muérame yo luego."
        literal: "— Halt, then; be-it thus —said Sancho—, and to God may-it-please that to-us it-may-turn-out well, and that itself may-arrive now the time of winning this isle that so dear to-me costs, and may-die-myself I straightaway."
