          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "renuncio", f: "renunci- + -o → renunciar (to give up), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "prometida", f: "participle of prometer (to promise), feminine to match 'ínsula', placed before the noun."}
          - {w: "quiero", f: "quier- + -o → querer (to want), present, I. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "mis muchos y buenos", f: "mis = 'my', plural to match 'servicios'; much- + -os and buen- + -os, masculine plural."}
