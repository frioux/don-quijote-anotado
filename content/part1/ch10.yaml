          - {w: "ese estremado", f: "'that', masculine, and estremad- + -o → estremado (= extremado), both to match 'licor'."}
      - es: "que para mí tengo que valdrá la onza adondequiera más de a dos reales, y no he menester yo más para pasar esta vida honrada y descansadamente."
        literal: "for for me I-hold that will-be-worth the ounce anywhere more than at two reals, and not I-have need I more to pass this life honorably and restfully."
        ormsby: "for I am persuaded it will be worth more than two reals an ounce anywhere, and I want no more to pass the rest of my life in ease and honour;"
        vocab:
          - {w: "tener para sí", d: "to be convinced, believe privately"}
          - {w: "valer", d: "to be worth, sell for"}
          - {w: "onza", d: "ounce"}
          - {w: "adondequiera", d: "anywhere, wherever"}
          - {w: "real", d: "the real, a silver coin; a laborer earned only a few reals a day"}
          - {w: "haber menester", d: "to need (old; modern 'necesitar')"}
          - {w: "honrado", d: "honorable, respectable"}
          - {w: "descansadamente", d: "restfully, at ease"}
        diagram:
          - s: "para mí tengo"
            r: "main verb 1, after loose 'que' = for: I am convinced"
            under:
              - {s: "que valdrá la onza adondequiera más de a dos reales", r: "what he is convinced of: an ounce will fetch over two reals anywhere"}
          - s: "y no he menester yo más"
            r: "main verb 2: and I need nothing more"
            under:
              - {s: "para pasar esta vida honrada y descansadamente", r: "what for: to live this life honorably and at ease"}
        forms:
          - {w: "tengo", f: "teng- + -o → tener (to have, hold), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "valdrá", f: "valdr- + -á → valer (to be worth), future, it. valer has an irregular future stem: valdré, valdrás, valdrá, valdremos, valdréis, valdrán."}
          - {w: "más de a dos reales", f: "'more than at two reals': 'más de' before a number, 'a' giving the price."}
          - {w: "he menester", f: "he → haber (to have), present, I, + menester (need): 'I need'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "pasar", f: "infinitive (to spend) after 'para'."}
          - {w: "honrada y descansadamente", f: "two adverbs joined by 'y': only the last takes -mente, the first keeps the feminine form (honrada), as in 'clara y concisamente'."}
        note: "Sancho's first thought is to sell the miracle cure by the ounce. The contrast between the knight who wants glory and the squire who wants a living is set up here for the rest of the book."
