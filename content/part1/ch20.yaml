          - {w: "sé", f: "saber (to know), present, I. sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "se acaba", f: "acab- + -a → acabarse (to come to an end), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "comienza", f: "comienz- + -a → comenzar (to begin), present, it. The stem e becomes ie when stressed: comienzo, comienzas, comienza, comenzamos, comenzáis, comienzan."}
          - {w: "do", f: "the old short form of donde (where)."}
        ormsby_note: "The story of the passage of the goats is a very old one. It is the 30th of the Cento Norelle Antiche, into which it was imported, no doubt, from the Latin of the Aragonese Jew, Pedro Alfonso. There is a Provençal tale to the same effect; but the original was probably Oriental."
