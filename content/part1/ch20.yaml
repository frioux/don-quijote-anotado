  - sentences:
      - es: "— ¿Cómo puedes tú, Sancho —dijo don Quijote—, ver dónde hace esa línea, ni dónde está esa boca o ese colodrillo que dices, si hace la noche tan escura que no parece en todo el cielo estrella alguna?"
        literal: "— How can you, Sancho —said Don Quijote—, see where makes that line, nor where is that mouth or that back-of-the-head that you-say, if makes the night so dark that not appears in all the sky star any?"
        ormsby: "“How canst thou see, Sancho,” said Don Quixote, “where it makes that line, or where this mouth or this occiput is that thou talkest of, when the night is so dark that there is not a star to be seen in the whole heaven?”"
        vocab:
