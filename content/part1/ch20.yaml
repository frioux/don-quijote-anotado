          - {w: "esforzarse a", d: "to strive to, make an effort to"}
          - {w: "acertar a", d: "to manage to, succeed in"}
          - {w: "ir a la mano a alguien", d: "to stop someone, interrupt, check them"}
          - {w: "estar atento", d: "to pay attention"}
