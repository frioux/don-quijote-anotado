      - es: "Como Rocinante se vio libre, aunque él de suyo no era nada brioso, parece que se resintió, y comenzó a dar manotadas; porque corvetas —con perdón suyo— no las sabía hacer."
        literal: "As Rocinante himself saw free, although he of his-own not was nothing spirited, it-seems that himself he-felt-it, and he-began to give pawings; because curvets —with pardon his— not them he-knew to-do."
