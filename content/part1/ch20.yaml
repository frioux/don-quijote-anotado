          - {w: "oía", f: "o- + -ía → oír (to hear), imperfect, he. oía, oías, oía, oíamos, oíais, oían."}
  - sentences:
      - es: "— Pero, con todo eso, yo me esforzaré a decir una historia que, si la acierto a contar y no me van a la mano, es la mejor de las historias; y estéme vuestra merced atento, que ya comienzo."
        literal: "— But, with all that, I myself will-strive to tell a story which, if it I-manage to tell and not to-me they-go to the hand, is the best of the stories; and be-to-me your grace attentive, for already I-begin."
        ormsby: "“Still,” said he, “I will strive to tell a story which, if I can manage to relate it, and nobody interferes with the telling, is the best of stories, and let your worship give me your attention, for here I begin."
        vocab:
