          - {w: "parece", f: "parec- + -e → parecer (to seem), present, it. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "se resintió", f: "resint- + -ió → resentirse (to feel it), preterite, he. The e of the stem becomes i in this form: resentí, resentiste, resintió, resentimos, resentisteis, resintieron."}
