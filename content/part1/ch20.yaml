          - {w: "se debe creer", f: "deb- + -e → deber (ought), present, with the impersonal 'se', + creer (to believe): 'one should believe'."}
          - {w: "a él le vino", f: "vin- + -o → venir (to come), preterite, it, with 'le' (to him) doubled by 'a él'. vine, viniste, vino, vinimos, vinisteis, vinieron."}
