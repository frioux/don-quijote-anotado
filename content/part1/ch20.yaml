  - sentences:
      - es: "— No señor, en ninguna manera —respondió Sancho—; porque, así como yo pregunté a vuestra merced que me dijese cuántas cabras habían pasado y me respondió que no sabía, en aquel mesmo instante se me fue a mí de la memoria cuanto me quedaba por decir, y a fe que era de mucha virtud y contento."
        literal: "— No lord, in no manner —answered Sancho—; because, just as I asked [to] your grace that to-me you-should-say how-many goats had passed and to-me you-answered that not you-knew, in that same instant itself to-me went to me from the memory all-that to-me remained to say, and by faith that it-was of much virtue and pleasure."
