        ormsby_note: "'What was, was': Proverb 96. 'Cato Zonzorino': I.e. Caton Censorino, Cato the Censor; but Sancho's impression was that the name was derived from zonzo, 'stupid,' or zonzorrion, 'a blockhead.'"
