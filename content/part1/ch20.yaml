      - es: "— No hay que llorar —respondió Sancho—, que yo entretendré a vuestra merced contando cuentos desde aquí al día, si ya no es que se quiere apear y echarse a dormir un poco sobre la verde yerba, a uso de caballeros andantes, para hallarse más descansado cuando llegue el día y punto de acometer esta tan desemejable aventura que le espera."
