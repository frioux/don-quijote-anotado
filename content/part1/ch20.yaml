          - {w: "acierto", f: "aciert- + -o → acertar (to manage), present, I. The stem e becomes ie when stressed: acierto, aciertas, acierta, acertamos, acertáis, aciertan."}
          - {w: "van", f: "ir (to go), present, they (people in general). voy, vas, va, vamos, vais, van."}
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "la mejor", f: "mejor (better) with the article: the superlative 'the best', feminine to match 'historia'."}
          - {w: "estéme", f: "esté, estar (to be), present subjunctive, he/she for 'vuestra merced', used as a command, + me (for me) stuck on the end. esté, estés, esté, estemos, estéis, estén."}
          - {w: "comienzo", f: "comienz- + -o → comenzar (to begin), present, I. The stem e becomes ie when stressed: comienzo, comienzas, comienza, comenzamos, comenzáis, comienzan."}
      - es: "«Érase que se era, el bien que viniere para todos sea, y el mal, para quien lo fuere a buscar...» Y advierta vuestra merced, señor mío, que el principio que los antiguos dieron a sus consejas no fue así comoquiera, que fue una sentencia de Catón Zonzorino, romano, que dice:"
        literal: "«There-was-once that there-was, the good that may-come for all may-it-be, and the evil, for whom it may-go to seek...» And note your grace, lord mine, that the beginning that the ancients gave to their tales not was so any-old-way, for it-was a maxim of Cato Zonzorino, Roman, which says:"
        ormsby: "What was, was; and may the good that is to come be for all, and the evil for him who goes to look for it—your worship must know that the beginning the old folk used to put to their tales was not just as each one pleased; it was a maxim of Cato Zonzorino the Roman, that says,"
