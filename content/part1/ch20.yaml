part: 1
chapter: 20
title_es: "Capítulo XX. De la jamás vista ni oída aventura que con más poco peligro fue acabada de famoso caballero en el mundo, como la que acabó el valeroso don Quijote de la Mancha"
title_en: "Of the unexampled and unheard-of adventure which was achieved by the valiant Don Quixote of La Mancha with less peril than any ever achieved by any famous knight in the world"
paragraphs:
  - sentences:
      - es: "— No es posible, señor mío, sino que estas yerbas dan testimonio de que por aquí cerca debe de estar alguna fuente o arroyo que estas yerbas humedece;"
        literal: "— Not is possible, lord mine, but that these grasses give testimony of that around here near must of be some spring or stream that these grasses moistens;"
        ormsby: "“It cannot be, señor, but that this grass is a proof that there must be hard by some spring or brook to give it moisture,"
        vocab:
          - {w: "no es posible sino que", d: "it can only be that, it must be that"}
          - {w: "yerba", d: "= hierba, grass; the old spelling with y-"}
          - {w: "dar testimonio de", d: "to bear witness to, be proof of"}
          - {w: "por aquí cerca", d: "somewhere near here"}
          - {w: "deber de + infinitive", d: "must, probably (a guess), as against 'deber' alone = ought to"}
          - {w: "fuente", d: "spring (of water); also fountain"}
          - {w: "arroyo", d: "stream, brook"}
          - {w: "humedecer", d: "to moisten, water"}
        diagram:
          - s: "No es posible"
            r: "main verb: it is not possible"
            under:
              - s: "sino que estas yerbas dan testimonio"
                r: "except that this grass gives proof: the only possibility"
                under:
                  - s: "de que por aquí cerca debe de estar alguna fuente o arroyo"
                    r: "proof of what: that a spring or stream must be close by"
                    under:
                      - {s: "que estas yerbas humedece", r: "describes 'fuente o arroyo': which waters this grass"}
        forms:
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "señor mío", f: "mío, the long form of 'my', used after the noun: 'lord of mine'. Before the noun it is 'mi'."}
          - {w: "estas", f: "est- + -as → este (this), feminine plural to match 'yerbas'."}
          - {w: "dan", f: "d- + -an → dar (to give), present, they (the yerbas). dar: doy, das, da, damos, dais, dan."}
          - {w: "debe de estar", f: "deb- + -e → deber (must), present, it, + 'de' + estar (to be): 'there must be, there is probably'. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "alguna", f: "algun- + -a → alguno (some), feminine to match 'fuente'."}
          - {w: "humedece", f: "humedec- + -e → humedecer (to moisten), present, it (the spring). Its object 'estas yerbas' comes first, before the 'que'. Same -er present; the I form adds a z: humedezco."}
      - es: "y así, será bien que vamos un poco más adelante, que ya toparemos donde podamos mitigar esta terrible sed que nos fatiga, que, sin duda, causa mayor pena que la hambre."
        literal: "and so, it-will-be well that we-go a little more forward, for already we-shall-run-into where we-may-be-able to-relieve this terrible thirst that us wearies, which, without doubt, causes greater pain than the hunger."
        ormsby: "so it would be well to move a little farther on, that we may find some place where we may quench this terrible thirst that plagues us, which beyond a doubt is more distressing than hunger.”"
        vocab:
          - {w: "será bien que", d: "it will be well to, we had better"}
          - {w: "vamos", d: "here the old present subjunctive of ir (to go), 'that we go'; modern 'vayamos'"}
          - {w: "más adelante", d: "farther on"}
          - {w: "topar", d: "to run into, come upon, stumble on"}
          - {w: "mitigar", d: "to relieve, ease, slake"}
          - {w: "fatigar", d: "to weary, torment, plague"}
          - {w: "pena", d: "pain, suffering, distress"}
          - {w: "la hambre", d: "hunger; Cervantes keeps the feminine 'la' before the stressed a-, where modern Spanish says 'el hambre'"}
        diagram:
          - s: "será bien"
            r: "main verb: it will be well"
            under:
              - {s: "que vamos un poco más adelante", r: "what will be well: that we go a little farther"}
              - s: "que ya toparemos"
                r: "why: for we shall soon come upon"
                under:
                  - s: "donde podamos mitigar esta terrible sed"
                    r: "come upon what: a place where we can relieve this terrible thirst"
                    under:
                      - {s: "que nos fatiga", r: "describes 'sed': that is wearing us out"}
                      - {s: "que, sin duda, causa mayor pena que la hambre", r: "describes 'sed': which hurts more than hunger"}
        forms:
          - {w: "será", f: "ser (to be), future, it: 'it will be'. seré, serás, será, seremos, seréis, serán."}
          - {w: "vamos", f: "ir (to go), present subjunctive, we, in its old form; modern Spanish says 'vayamos'. Subjunctive because it follows 'será bien que' (it will be well that). ir's modern present subjunctive: vaya, vayas, vaya, vayamos, vayáis, vayan."}
          - {w: "toparemos", f: "topar (to run into) + -emos → future, we: 'we shall run into'. The future adds -é, -ás, -á, -emos, -éis, -án to the whole infinitive."}
          - {w: "podamos", f: "pod- + -amos → poder (to be able), present subjunctive, we. Subjunctive because the place is not yet found ('donde podamos' = wherever we may be able). pueda, puedas, pueda, podamos, podáis, puedan."}
          - {w: "mitigar", f: "infinitive (to relieve) after 'podamos'."}
          - {w: "esta", f: "est- + -a → este (this), feminine to match 'sed'."}
          - {w: "fatiga", f: "fatig- + -a → fatigar (to weary), present, it (the thirst), with 'nos' (us). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "causa", f: "caus- + -a → causar (to cause), present, it. Same -ar present."}
          - {w: "mayor", f: "the comparative of grande: 'greater'; 'mayor ... que' = greater than."}
  - sentences:
      - es: "Parecióle bien el consejo a don Quijote, y, tomando de la rienda a Rocinante, y Sancho del cabestro a su asno, después de haber puesto sobre él los relieves que de la cena quedaron, comenzaron a caminar por el prado arriba a tiento, porque la escuridad de la noche no les dejaba ver cosa alguna;"
        literal: "Seemed-to-him good the advice to Don Quijote, and, taking by the rein [to] Rocinante, and Sancho by-the halter [to] his donkey, after of having put upon him the leftovers that from the supper remained, they-began to walk through the meadow upward by feel, because the darkness of the night not them let see thing any;"
        ormsby: "The advice seemed good to Don Quixote, and, he leading Rocinante by the bridle and Sancho the ass by the halter, after he had packed away upon him the remains of the supper, they advanced the meadow feeling their way, for the darkness of the night made it impossible to see anything;"
        vocab:
          - {w: "parecer bien a alguien", d: "to seem good to someone, meet with their approval"}
          - {w: "consejo", d: "advice, counsel"}
          - {w: "tomar de la rienda", d: "to take by the rein, lead"}
          - {w: "cabestro", d: "halter, the rope on a donkey's head"}
          - {w: "asno", d: "donkey, ass"}
          - {w: "relieves", d: "leftovers, scraps from a meal (a learned word: Latin 'reliquiae')"}
          - {w: "prado arriba", d: "up the meadow; 'arriba' after a noun = up along"}
          - {w: "a tiento", d: "groping, feeling one's way"}
          - {w: "escuridad", d: "= oscuridad, darkness"}
          - {w: "cosa alguna", d: "anything at all; 'alguno' after its noun in a negative sentence means 'none, any at all'"}
        diagram:
          - s: "Parecióle bien el consejo"
            r: "main verb 1: the advice seemed good to him"
            under:
              - {s: "a don Quijote", r: "to whom"}
          - s: "comenzaron a caminar"
            r: "main verb 2 (after 'y'): they began to walk"
            under:
              - {s: "tomando de la rienda a Rocinante, y Sancho del cabestro a su asno", r: "how: he leading Rocinante by the rein and Sancho his donkey by the halter"}
              - s: "después de haber puesto sobre él los relieves"
                r: "when: after putting the leftovers on the donkey"
                under:
                  - {s: "que de la cena quedaron", r: "describes 'relieves': that were left from supper"}
              - {s: "por el prado arriba", r: "where: up the meadow"}
              - {s: "a tiento", r: "how: feeling their way"}
              - {s: "porque la escuridad de la noche no les dejaba ver cosa alguna", r: "why: because the dark let them see nothing"}
        forms:
          - {w: "Parecióle", f: "parec- + -ió + le → parecer (to seem), preterite, it, with 'le' (to him) stuck on the end. Cervantes hangs pronouns on the end of a conjugated verb that opens its clause; modern Spanish says 'le pareció'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "tomando", f: "gerund of tomar (to take): 'taking', telling how they set off."}
          - {w: "del", f: "de + el, the contraction."}
          - {w: "haber puesto", f: "haber (to have) in the infinitive + puesto, the irregular participle of poner (to put): 'having put', after 'después de'."}
          - {w: "quedaron", f: "qued- + -aron → quedar (to remain), preterite, they (the relieves). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "comenzaron", f: "comenz- + -aron → comenzar (to begin), preterite, they. Same -ar preterite. 'comenzar a' + infinitive = to begin to."}
          - {w: "caminar", f: "infinitive (to walk) after 'comenzaron a'."}
          - {w: "dejaba", f: "dej- + -aba → dejar (to let), imperfect, it (the darkness), with 'les' (them). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "ver", f: "infinitive (to see) after 'dejaba': 'let them see'."}
          - {w: "alguna", f: "algun- + -a → alguno, feminine to match 'cosa'. After the noun in a negative sentence it means 'any at all' (= ninguna)."}
      - es: "mas, no hubieron andado docientos pasos, cuando llegó a sus oídos un grande ruido de agua, como que de algunos grandes y levantados riscos se despeñaba."
        literal: "but, not they-had walked two-hundred paces, when arrived at their ears a great noise of water, as that from some great and raised crags it-was-hurling-itself-down."
        ormsby: "but they had not gone two hundred paces when a loud noise of water, as if falling from great rocks, struck their ears."
        vocab:
          - {w: "mas", d: "but (literary; = pero); no accent, unlike 'más' = more"}
          - {w: "no hubieron andado ... cuando", d: "they had hardly gone ... when"}
          - {w: "docientos", d: "= doscientos, two hundred"}
          - {w: "oídos", d: "ears (the organ of hearing); 'llegar a los oídos' = to reach the ears"}
          - {w: "grande", d: "big, great; Cervantes keeps the full form before a noun where modern Spanish clips it to 'gran'"}
          - {w: "como que", d: "as if"}
          - {w: "levantado", d: "high, lofty, raised"}
          - {w: "risco", d: "crag, cliff"}
          - {w: "despeñarse", d: "to hurl oneself down a cliff, plunge ('peña' = rock)"}
        diagram:
          - s: "no hubieron andado docientos pasos"
            r: "main verb 1: they had not gone two hundred paces"
          - s: "cuando llegó"
            r: "main verb 2: when there arrived"
            under:
              - {s: "a sus oídos", r: "where: at their ears"}
              - s: "un grande ruido de agua"
                r: "subject: a great noise of water"
                under:
                  - {s: "como que de algunos grandes y levantados riscos se despeñaba", r: "describes 'ruido': as if it were plunging down from some high crags"}
        forms:
          - {w: "hubieron andado", f: "hub- + -ieron → haber (to have), preterite, they, + andado, the participle of andar (to walk): 'had walked'. The preterite of haber with a participle is used after 'no ... cuando' or 'apenas' for 'had hardly ... when'. haber's preterite: hube, hubiste, hubo, hubimos, hubisteis, hubieron."}
          - {w: "docientos", f: "old spelling of doscientos (two hundred), masculine to match 'pasos'."}
          - {w: "llegó", f: "lleg- + -ó → llegar (to arrive), preterite, it (the noise). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "sus", f: "su (their), plural to match 'oídos', not the owners."}
          - {w: "grande", f: "the full form of grande before 'ruido'; modern Spanish clips it to 'gran' before any singular noun."}
          - {w: "algunos grandes y levantados", f: "algun- + -os, grande + -s, levantad- + -os: all masculine plural to match 'riscos'. 'levantados' is the participle of levantar (to raise) used as an adjective."}
          - {w: "se despeñaba", f: "despeñ- + -aba → despeñarse (to plunge down a cliff), imperfect, it (the water), with 'se'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
      - es: "Alegróles el ruido en gran manera, y, parándose a escuchar hacia qué parte sonaba, oyeron a deshora otro estruendo que les aguó el contento del agua, especialmente a Sancho, que naturalmente era medroso y de poco ánimo."
        literal: "Gladdened-them the noise in great manner, and, stopping-themselves to listen toward which direction it-sounded, they-heard at untimely-hour another din that for-them watered-down the contentment of-the water, especially to Sancho, who by-nature was fearful and of little spirit."
        ormsby: "The sound cheered them greatly; but halting to make out by listening from what quarter it came they heard unseasonably another noise which spoiled the satisfaction the sound of the water gave them, especially for Sancho, who was by nature timid and fainthearted."
        vocab:
          - {w: "alegrar", d: "to gladden, cheer"}
          - {w: "en gran manera", d: "greatly, very much"}
          - {w: "pararse a", d: "to stop to (do something)"}
          - {w: "hacia qué parte", d: "from which direction"}
          - {w: "a deshora", d: "at an untimely moment, unexpectedly"}
          - {w: "estruendo", d: "din, roar, crash"}
          - {w: "aguar", d: "to water down (wine), hence to spoil (a pleasure); 'aguar la fiesta' = to spoil the party"}
          - {w: "contento", d: "contentment, joy (a noun here)"}
          - {w: "medroso", d: "timid, fearful"}
          - {w: "de poco ánimo", d: "fainthearted, of little courage"}
        diagram:
          - s: "Alegróles el ruido"
            r: "main verb 1: the noise cheered them"
            under:
              - {s: "en gran manera", r: "how much: greatly"}
          - s: "oyeron a deshora otro estruendo"
            r: "main verb 2 (after 'y'): they suddenly heard another din"
            under:
              - {s: "parándose a escuchar hacia qué parte sonaba", r: "when: as they stopped to listen which way it came from"}
              - {s: "que les aguó el contento del agua", r: "describes 'estruendo': which spoiled their joy at the water"}
              - s: "especialmente a Sancho"
                r: "for whom above all"
                under:
                  - {s: "que naturalmente era medroso y de poco ánimo", r: "describes Sancho: who was timid by nature"}
        forms:
          - {w: "Alegróles", f: "alegr- + -ó + les → alegrar (to gladden), preterite, it (the noise), with 'les' (them) stuck on the end. Cervantes hangs pronouns on the end of a conjugated verb that opens its clause; modern Spanish says 'les alegró'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "parándose", f: "parando, the gerund of parar (to stop), + se (themselves), with an accent added to keep the stress."}
          - {w: "escuchar", f: "infinitive (to listen) after 'pararse a'."}
          - {w: "sonaba", f: "son- + -aba → sonar (to sound), imperfect, it. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "oyeron", f: "o- + -yeron → oír (to hear), preterite, they. oí, oíste, oyó, oímos, oísteis, oyeron: the i of the ending turns to y between vowels."}
          - {w: "aguó", f: "agu- + -ó → aguar (to water down), preterite, it, with 'les' (for them). Same -ar preterite."}
          - {w: "naturalmente", f: "natural + -mente, the adverb: 'by nature'."}
          - {w: "era", f: "ser (to be), imperfect, he. era, eras, era, éramos, erais, eran."}
        ormsby_note: "Literally, 'watered the satisfaction.'"
        note: "'Aguar' is to water down wine, and so to spoil a pleasure; Cervantes puns on the water they were seeking: the second noise 'watered' their joy at the water."
      - es: "Digo que oyeron que daban unos golpes a compás, con un cierto crujir de hierros y cadenas, que, acompañados del furioso estruendo del agua, que pusieran pavor a cualquier otro corazón que no fuera el de don Quijote."
        literal: "I-say that they-heard that [people] were-giving some blows in rhythm, with a certain creaking of irons and chains, which, accompanied by-the furious din of-the water, [such] that they-would-have-put dread into any other heart that not were the [one] of Don Quijote."
        ormsby: "They heard, I say, strokes falling with a measured beat, and a certain rattling of iron and chains that, together with the furious din of the water, would have struck terror into any heart but Don Quixote’s."
        vocab:
          - {w: "digo que", d: "I mean, that is to say; the narrator stepping in to be exact"}
          - {w: "dar golpes", d: "to strike blows; 'daban' with no subject = blows were being struck"}
          - {w: "a compás", d: "in time, with a regular beat"}
          - {w: "crujir", d: "to creak, rattle, grind; here the infinitive is a noun, 'un cierto crujir' = a certain rattling"}
          - {w: "hierros", d: "irons, iron fittings"}
          - {w: "cadena", d: "chain"}
          - {w: "poner pavor a", d: "to strike dread into"}
          - {w: "pavor", d: "dread, terror"}
          - {w: "cualquier otro", d: "any other"}
        diagram:
          - s: "Digo"
            r: "main verb: I say"
            under:
              - s: "que oyeron"
                r: "what I say: that they heard"
                under:
                  - s: "que daban unos golpes a compás"
                    r: "what they heard: that blows were being struck in time"
                    under:
                      - {s: "con un cierto crujir de hierros y cadenas", r: "with what: with a rattling of iron and chains"}
                      - s: "que ... pusieran pavor a cualquier otro corazón"
                        r: "describes 'golpes': such as would have struck dread into any other heart"
                        under:
                          - {s: "acompañados del furioso estruendo del agua", r: "describes 'golpes': joined to the furious roar of the water"}
                          - {s: "que no fuera el de don Quijote", r: "describes 'corazón': any heart but Don Quijote's"}
        forms:
          - {w: "Digo", f: "dig- + -o → decir (to say), present, I. digo, dices, dice, decimos, decís, dicen."}
          - {w: "oyeron", f: "o- + -yeron → oír (to hear), preterite, they. oí, oíste, oyó, oímos, oísteis, oyeron."}
          - {w: "daban", f: "d- + -aban → dar (to give), imperfect, they, with no subject named: 'blows were being struck'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "crujir", f: "infinitive (to rattle) used as a noun after 'un cierto'."}
          - {w: "acompañados", f: "participle of acompañar (to accompany), masculine plural to match 'golpes'."}
          - {w: "pusieran", f: "pus- + -ieran → poner (to put), imperfect subjunctive (-ra form), they: here 'would have struck'. Built on the preterite pusieron: pusiera, pusieras, pusiera, pusiéramos, pusierais, pusieran. Cervantes uses the -ra form where modern Spanish says 'habrían puesto'."}
          - {w: "cualquier", f: "cualquiera (any) clipped before a noun ('otro corazón')."}
          - {w: "fuera", f: "ser (to be), imperfect subjunctive (-ra form), it: 'that were not'. fuera, fueras, fuera, fuéramos, fuerais, fueran. Subjunctive because the heart is hypothetical."}
          - {w: "el de", f: "'the one of': 'el' stands for 'corazón', so 'el de don Quijote' = Don Quijote's."}
        note: "The sentence loses its thread: the 'que' after 'cadenas' is picked up again by a second 'que' after 'agua' and the clause never gets a main verb. Cervantes wrote fast and such slips are common in long sentences."
      - es: "Era la noche, como se ha dicho, escura, y ellos acertaron a entrar entre unos árboles altos, cuyas hojas, movidas del blando viento, hacían un temeroso y manso ruido;"
        literal: "Was the night, as itself it-has been-said, dark, and they happened to enter among some trees tall, whose leaves, moved by-the soft wind, made a fearsome and gentle noise;"
        ormsby: "The night was, as has been said, dark, and they had happened to reach a spot in among some tall trees, whose leaves stirred by a gentle breeze made a low ominous sound;"
        vocab:
          - {w: "escuro", d: "= oscuro, dark"}
          - {w: "como se ha dicho", d: "as has been said"}
          - {w: "acertar a + infinitive", d: "to happen to, chance to"}
          - {w: "cuyo", d: "whose"}
          - {w: "movido de", d: "moved by; old Spanish marks the doer of a passive with 'de'"}
          - {w: "blando", d: "soft, gentle"}
          - {w: "temeroso", d: "here 'fearsome, frightening' (causing fear); elsewhere 'fearful' (feeling fear)"}
          - {w: "manso", d: "gentle, mild, tame"}
        diagram:
          - s: "Era"
            r: "main verb 1: was"
            under:
              - {s: "la noche", r: "subject: the night"}
              - {s: "como se ha dicho", r: "aside: as has been said"}
              - {s: "escura", r: "what it was: dark"}
          - s: "ellos acertaron a entrar"
            r: "main verb 2 (after 'y'): they happened to go in"
            under:
              - s: "entre unos árboles altos"
                r: "where: among some tall trees"
                under:
                  - {s: "cuyas hojas, movidas del blando viento, hacían un temeroso y manso ruido", r: "describes 'árboles': whose leaves, stirred by the soft wind, made a frightening, gentle noise"}
        forms:
          - {w: "Era", f: "ser (to be), imperfect, it. era, eras, era, éramos, erais, eran."}
          - {w: "se ha dicho", f: "ha, haber (to have), present, it, + dicho, the irregular participle of decir (to say): 'has been said', with the impersonal 'se'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "escura", f: "escur- + -a → escuro (= oscuro, dark), feminine to match 'noche'."}
          - {w: "acertaron", f: "acert- + -aron → acertar (to hit the mark; 'acertar a' + infinitive = to happen to), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "entrar", f: "infinitive (to enter) after 'acertaron a'."}
          - {w: "cuyas", f: "cuy- + -as → cuyo (whose), feminine plural to match 'hojas', the thing owned, not the owner."}
          - {w: "movidas", f: "participle of mover (to move), feminine plural to match 'hojas'."}
          - {w: "hacían", f: "hac- + -ían → hacer (to make), imperfect, they (the leaves). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "temeroso y manso", f: "both masculine singular to match 'ruido'."}
      - es: "de manera que la soledad, el sitio, la escuridad, el ruido del agua con el susurro de las hojas, todo causaba horror y espanto, y más cuando vieron que ni los golpes cesaban, ni el viento dormía, ni la mañana llegaba;"
