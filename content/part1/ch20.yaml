      - es: "Alborotóse Rocinante con el estruendo del agua y de los golpes, y, sosegándole don Quijote, se fue llegando poco a poco a las casas, encomendándose de todo corazón a su señora, suplicándole que en aquella temerosa jornada y empresa le favoreciese, y de camino se encomendaba también a Dios, que no le olvidase."
