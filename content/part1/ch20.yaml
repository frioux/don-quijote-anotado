      - es: "— Retírate tres o cuatro allá, amigo —dijo don Quijote (todo esto sin quitarse los dedos de las narices)—, y desde aquí adelante ten más cuenta con tu persona y con lo que debes a la mía; que la mucha conversación que tengo contigo ha engendrado este menosprecio."
        literal: "— Withdraw-yourself three or four over-there, friend —said Don Quijote (all this without taking-off-himself the fingers from the nostrils)—, and from here forward have more care with your person and with what you-owe to the mine; for the much familiarity that I-have with-you has engendered this contempt."
        ormsby: "“Then go back three or four, my friend,” said Don Quixote, all the time with his fingers to his nose; “and for the future pay more attention to thy person and to what thou owest to mine; for it is my great familiarity with thee that has bred this contempt.”"
