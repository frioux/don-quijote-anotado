      - es: "\"Y el mal, para quien le fuere a buscar\", que viene aquí como anillo al dedo, para que vuestra merced se esté quedo y no vaya a buscar el mal a ninguna parte, sino que nos volvamos por otro camino, pues nadie nos fuerza a que sigamos éste, donde tantos miedos nos sobresaltan."
        literal: "'And the evil, for whom it may-go to seek', which comes here like ring to-the finger, so that your grace yourself may-stay still and not may-go to seek the evil to any part, but that we may-turn-back by another road, since nobody us forces to that we-follow this-one, where so-many fears us startle."
