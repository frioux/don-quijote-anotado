        vocab:
          - {w: "andar enamorado de", d: "to be in love with; 'andar' + adjective = to be (going about) in a state"}
          - {w: "pastora", d: "shepherdess"}
          - {w: "ganadero", d: "stock-owner, cattle or sheep farmer, grazier"}
        diagram:
          - s: "andaba enamorado"
            r: "main verb 1: was in love"
            under:
              - {s: "este Lope Ruiz", r: "subject"}
              - s: "de una pastora"
                r: "with whom: with a shepherdess"
                under:
                  - {s: "que se llamaba Torralba", r: "describes 'pastora': named Torralba"}
                  - {s: "la cual pastora llamada Torralba era hija de un ganadero rico", r: "describes 'pastora': which shepherdess was a rich farmer's daughter"}
          - {s: "y este ganadero rico...", r: "main clause 2, broken off: and this rich farmer"}
        forms:
          - {w: "este", f: "'this', masculine to match 'Lope Ruiz' and later 'ganadero'."}
          - {w: "andaba enamorado", f: "and- + -aba → andar (to go about), imperfect, he, + enamorado, the participle of enamorar (to make fall in love). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "se llamaba", f: "llam- + -aba → llamarse (to be called), imperfect, she. Same -aba imperfect."}
          - {w: "la cual ... llamada", f: "la cual, feminine 'which', before the repeated noun 'pastora'; llamad- + -a → llamado (called), feminine to match 'pastora'."}
          - {w: "era", f: "ser (to be), imperfect, she. era, eras, era, éramos, erais, eran."}
