          - {w: "cuanto", d: "all that, everything that"}
          - {w: "quedar por decir", d: "to remain to be said"}
          - {w: "a fe que", d: "upon my word, in faith"}
          - {w: "virtud", d: "worth, power, value (of a story: edifying content)"}
          - {w: "contento", d: "pleasure, enjoyment"}
        diagram:
