          - s: "que la mucha conversación ... ha engendrado este menosprecio"
            r: "main verb 3: for the great familiarity has bred this contempt"
            under:
              - {s: "que tengo contigo", r: "describes 'conversación': that I have with you"}
        forms:
          - {w: "Retírate", f: "retira, the tú command of retirar (to withdraw), + te (yourself), with an accent added."}
          - {w: "quitarse", f: "quitar (to take away) + se (from himself), the pronoun hung on the infinitive after 'sin'."}
          - {w: "ten", f: "the irregular tú command of tener (to have)."}
          - {w: "debes", f: "deb- + -es → deber (to owe), present, you. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "la mía", f: "'mine', feminine to match 'persona'."}
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "contigo", f: "con + ti fused into one word: 'with you'."}
