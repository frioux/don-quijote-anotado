summary: |
  Thirsty after their supper, Don Quijote and Sancho grope their way across a dark meadow towards the sound of falling water. Soon they hear another noise: rhythmic pounding and the clank of iron and chains, which in the darkness, among rustling trees, terrifies Sancho. Don Quijote declares that he was born in this Iron Age to revive the Golden Age, prepares to charge, and tells Sancho to wait three days and then carry the news of his death to Dulcinea.

  Sancho weeps and begs him to wait for daylight, and when pleading fails he secretly ties Rocinante's legs with the donkey's halter, so the horse can only hop. Don Quijote takes this for a sign from heaven and agrees to wait for dawn. To pass the time Sancho begins a folktale about the goatherd Lope Ruiz and the mannish shepherdess Torralba, told with endless repetitions. When the shepherd ferries his three hundred goats across the Guadiana one at a time, Sancho makes his master keep count, and when Don Quijote cannot say how many have crossed, the story ends.

  Too frightened to leave his master's side even for a moment, Sancho relieves himself where he stands. Don Quijote, holding his nose, remarks that Sancho seems very afraid and tells him to keep his distance. At daybreak Sancho unties Rocinante, Don Quijote again says goodbye, Sancho weeps again, and the two ride towards the noise. It turns out to be six fulling-mill hammers pounding cloth.

  Don Quijote is mortified. Sancho bursts out laughing and mimics his master's grand speech, and Don Quijote hits him twice with his pike. Once they have made peace, Don Quijote lectures Sancho on the respect a squire owes his knight, pointing to the silent squires of the Amadís. Sancho asks what squires used to be paid. Don Quijote says they served for favour, not wages, though he has provided for Sancho in his will, and Sancho promises to speak of his master only with honour.
context: |
  Mills and money. The night's terror is a 'batán', a fulling mill, in which water-driven wooden hammers pounded woollen cloth in water to thicken and felt it. Mills like this stood on many streams in La Mancha and Extremadura, which were wool country, so any peasant would know the sound. Don Quijote's excuse, that a gentleman cannot be expected to recognize such things, is snobbery covering embarrassment. The talk of wages is just as realistic. Masters often gave servants clothing ('unas calzas') to make up for harsh words. Wages were reckoned by the day for labourers like a bricklayer's hod-carrier and by the month or year for servants. Don Quijote's will, which pays Sancho in proportion to the time he has served, follows the usual legal practice.

  Chivalry and its parody. Don Quijote's call to arms repeats the Golden Age theme of chapter 11 and lists the heroes he means to outdo: the Round Table, the Twelve Peers of France, the Nine Worthies, and the knights of the later Spanish romances (Platir, Tablante, Olivante, Tirante, the Caballero del Febo, Belianís). His closing lecture uses the Amadís de Gaula. Gandalín, Amadís's squire, ends up a count and always speaks cap in hand, while Galaor's squire Gasabal is so silent that he is named only once. Ormsby notes that the Rev. John Bowle checked this and found it true, which shows how closely Cervantes knew the book. Sancho's story is parody of another kind. The tale of goats ferried across a river one by one, which ends when the listener loses count, is very old. Ormsby traces it to the Cento Novelle Antiche, to the Latin collection of Petrus Alfonsi, and probably further back to an Eastern source.

  The narrator's games. The chapter title promises an adventure finished 'with less danger than any famous knight ever faced', and the narrator keeps up the mock suspense until he apologises directly to the reader ('if you won't take it amiss, reader') for the anticlimax of the fulling mill. In the middle he gives the scene of Sancho's bowels the pompous causes and diagnoses of a medical treatise. He then credits Cide Hamete with inferring from Sancho's tears that he must be an 'old Christian', a Christian of untainted descent. Ormsby points out that this is an odd thing for a Moorish author to say.

  Religion, law and medicine. Sancho quotes the preacher's proverb 'he who seeks danger perishes in it' (Ecclesiasticus 3:27) and the warning against tempting God. Don Quijote excuses his blows with the moralists' doctrine of 'first movements', impulses not fully under the will. He worries that an unpaid servant could keep his soul suffering in purgatory, which is why careful testators provided for servants. His last words echo the Fifth Commandment's promise of long life to those who honour their parents. Sancho's star-clock is shepherds' lore: as Ormsby explains, the Little Bear, 'the Horn', was read against the arms of a man standing with his arms stretched out, and its position gave the hour. The belief that fear loosens the bowels underlies Don Quijote's remark that Sancho seems 'very afraid'.

  Names and proverbs. Sancho's 'Catón Zonzorino' garbles Cato the Censor (Censorino) into something like 'Cato the Dimwit', from 'zonzo', stupid, as Ormsby notes. The heroine Torralba with her little moustache and the goatherd Lope Ruiz have plain village names. The chapter is thick with proverbs, which Ormsby numbers in his own list: greed bursts the sack, it will all come out in the wash, he loves you who makes you cry, the less said the better ('peor es meneallo'), familiarity breeds contempt, and the pitcher that always loses whether it hits the stone or the stone hits it.

  Reading Cervantes' Spanish. The chapter sets three registers side by side. There is Don Quijote's chivalric style, with the old f- for h- (fechos, ficieron, faga) and words like 'desaguisado', which Sancho borrows when he begs and again when he mocks. There is Sancho's village storytelling, with relatives that repeat their nouns ('la cual pastora llamada Torralba') and the article before first names ('la Torralba', 'el Lope'). And there is the narrator's mock-solemn prose, with the verb last ('aquel estruendo formaban'). The usual archaisms are here: escuro, escuridad, yerba, vee, mesmo, agora, docientos, trecientas, estraño, cudicia, destinguir, do; contractions with 'de' (dél, della, dellos, desta, destos, desa, désta); -rl- written -ll- (decille, dalle, averiguallo, meneallo, emprendella, acaballa); pronouns attached to conjugated verbs (Parecióle, Alegróles, Desesperábase, Díjole, Tornóle, Miróle, pasmóse); and the future subjunctive (volviere, faltare, quisieres, viere, tardare, diere, quisiéredes, with the old vos ending -edes). Watch how Don Quijote moves between 'tú' and the colder 'vos' when he is angry, and for false friends: industria (cunning), suceso (outcome), discreto (wise), discurso (reasoning), rumor (noise), condición (nature), empresa (undertaking), villano (peasant).
