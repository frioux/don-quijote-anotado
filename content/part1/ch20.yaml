        literal: "And along here he-went repeating all or the most words that Don Quijote said the time first that they-heard the fearsome blows."
        ormsby: "and here he went on repeating the words that Don Quixote uttered the first time they heard the awful strokes."
        vocab:
          - {w: "por aquí", d: "in this vein, along these lines"}
          - {w: "ir repitiendo", d: "to go on repeating"}
          - {w: "las más", d: "most (of them)"}
          - {w: "razones", d: "words, speech"}
        diagram:
          - s: "fue repitiendo"
            r: "main verb: he went on repeating"
            under:
              - {s: "por aquí", r: "how: in this vein"}
              - s: "todas o las más razones"
                r: "object: all or most of the words"
                under:
                  - {s: "que don Quijote dijo la vez primera que oyeron los temerosos golpes", r: "describes 'razones': that Don Quijote said the first time they heard the blows"}
        forms:
          - {w: "fue repitiendo", f: "fu- + -e → ir (to go), preterite, he, + repitiendo, the gerund of repetir: 'went on repeating'. fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "oyeron", f: "o- + -yeron → oír (to hear), preterite, they. oí, oíste, oyó, oímos, oísteis, oyeron."}
          - {w: "temerosos", f: "temeros- + -os → temeroso (fearsome), masculine plural to match 'golpes'."}
        ormsby_match: false
  - sentences:
      - es: "Viendo, pues, don Quijote que Sancho hacía burla dél, se corrió y enojó en tanta manera, que alzó el lanzón y le asentó dos palos, tales que, si, como los recibió en las espaldas, los recibiera en la cabeza, quedara libre de pagarle el salario, si no fuera a sus herederos."
        literal: "Seeing, then, Don Quijote that Sancho made mockery of-him, himself he-was-shamed and angered in such manner, that he-raised the pike and to-him landed two blows, such that, if, as them he-received on the shoulders, them he-had-received on the head, he-would-have-remained free of paying-him the wages, if not it-were to his heirs."
        ormsby: "Don Quixote, then, seeing that Sancho was turning him into ridicule, was so mortified and vexed that he lifted up his pike and smote him two such blows that if, instead of catching them on his shoulders, he had caught them on his head there would have been no wages to pay, unless indeed to his heirs."
        vocab:
          - {w: "hacer burla de", d: "to make fun of"}
          - {w: "correrse", d: "to be mortified, ashamed"}
          - {w: "en tanta manera", d: "so much"}
          - {w: "lanzón", d: "short lance, pike"}
          - {w: "asentar un palo", d: "to land a blow with a stick"}
          - {w: "espaldas", d: "back, shoulders"}
          - {w: "herederos", d: "heirs"}
        diagram:
          - s: "se corrió y enojó en tanta manera"
            r: "main verb: he was so mortified and angry"
            under:
              - {s: "Viendo, pues, don Quijote que Sancho hacía burla dél", r: "why: Don Quijote seeing that Sancho was mocking him"}
              - s: "que alzó el lanzón y le asentó dos palos"
                r: "result: that he raised his pike and gave him two blows"
                under:
                  - s: "tales que ... quedara libre de pagarle el salario"
                    r: "describes 'palos': such that he would have been spared paying his wages"
                    under:
                      - {s: "si, como los recibió en las espaldas, los recibiera en la cabeza", r: "condition: if he had taken them on the head instead of the back"}
                      - {s: "si no fuera a sus herederos", r: "except: unless to his heirs"}
        forms:
          - {w: "hacía", f: "hac- + -ía → hacer (to make), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "dél", f: "de + él (of him)."}
          - {w: "se corrió y enojó", f: "corr- + -ió → correrse (to be ashamed) and enoj- + -ó → enojarse (to get angry), preterite, he, sharing one 'se'. -ió is the -er preterite (-í, -iste, -ió, -imos, -isteis, -ieron); -ó the -ar (-é, -aste, -ó, -amos, -asteis, -aron)."}
          - {w: "alzó, asentó", f: "alz- + -ó → alzar (to raise), asent- + -ó → asentar (to land), preterite, he. Same -ar preterite."}
          - {w: "recibió", f: "recib- + -ió → recibir (to receive), preterite, he. Same -ió preterite."}
          - {w: "recibiera", f: "recib- + -iera → recibir, imperfect subjunctive (-ra form), he: 'if he had received'. recibiera, recibieras, recibiera, recibiéramos, recibierais, recibieran."}
          - {w: "quedara", f: "qued- + -ara → quedar (to remain), -ra form used as a conditional: 'he would have been'. quedara, quedaras, quedara, quedáramos, quedarais, quedaran."}
          - {w: "pagarle", f: "pagar (to pay) + le (to him)."}
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), it: 'unless it were'. fuera, fueras, fuera, fuéramos, fuerais, fueran."}
      - es: "Viendo Sancho que sacaba tan malas veras de sus burlas, con temor de que su amo no pasase adelante en ellas, con mucha humildad le dijo:"
        literal: "Seeing Sancho that he-was-drawing such bad earnests from his jests, with fear of that his master not should-go forward in them, with much humility to-him he-said:"
        ormsby: "Sancho seeing that he was getting an awkward return in earnest for his jest, and fearing his master might carry it still further, said to him very humbly,"
        vocab:
          - {w: "veras", d: "earnest, seriousness; 'burlas' and 'veras' = jest and earnest"}
          - {w: "sacar malas veras de sus burlas", d: "to get a painful earnest out of his jokes"}
          - {w: "pasar adelante en", d: "to go further with"}
          - {w: "humildad", d: "humility"}
        diagram:
          - s: "con mucha humildad le dijo:"
            r: "main verb: very humbly he said to him"
            under:
              - {s: "Viendo Sancho que sacaba tan malas veras de sus burlas", r: "why: Sancho seeing that his jokes were earning him real blows"}
              - {s: "con temor de que su amo no pasase adelante en ellas", r: "why, 2: afraid his master would go further"}
        forms:
          - {w: "sacaba", f: "sac- + -aba → sacar (to draw out), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "malas", f: "mal- + -as → malo, feminine plural to match 'veras'."}
          - {w: "pasase", f: "pas- + -ase → pasar, imperfect subjunctive (-se form), he, after 'temor de que'; the 'no' is redundant after a verb of fearing. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Sosiéguese vuestra merced; que, por Dios, que me burlo."
        literal: "— Calm-yourself your grace; for, by God, that myself I-jest."
        ormsby: "“Calm yourself, sir, for by God I am only joking.”"
        vocab:
          - {w: "sosegarse", d: "to calm down"}
          - {w: "burlarse", d: "to joke, jest"}
        diagram:
          - {s: "Sosiéguese vuestra merced", r: "command: calm down, sir"}
          - s: "que me burlo"
            r: "main verb (after 'que, por Dios'): I'm only joking"
            under:
              - {s: "por Dios", r: "oath: by God"}
        forms:
          - {w: "Sosiéguese", f: "sosiegue, the present subjunctive of sosegar (to calm) for 'vuestra merced', used as a command, + se, with an accent added. The stem e becomes ie when stressed, and g adds u before e: sosiegue, sosiegues, sosiegue, soseguemos, soseguéis, sosieguen."}
          - {w: "me burlo", f: "burl- + -o → burlarse (to joke), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
  - sentences:
      - es: "— Pues, porque os burláis, no me burlo yo —respondió don Quijote—."
        literal: "— Well, because you jest, not myself jest I —answered Don Quijote—."
        ormsby: "“Well, then, if you are joking I am not,” replied Don Quixote."
        vocab:
          - {w: "os burláis", d: "you are joking; Don Quijote switches from 'tú' to 'vos', a cold, angry distance"}
        diagram:
          - s: "no me burlo yo"
            r: "main verb: I am not joking"
            under:
              - {s: "porque os burláis", r: "reason: because you are joking"}
              - {s: "respondió don Quijote", r: "speech tag"}
        forms:
          - {w: "os burláis", f: "burl- + -áis → burlarse (to joke), present, you (vos/vosotros), with 'os'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "me burlo", f: "burl- + -o → burlarse, present, I. Same -ar present."}
        note: "Until now Don Quijote has called Sancho 'tú'; in his anger he switches to the colder 'vos' for the rest of this speech."
      - es: "Venid acá, señor alegre: ¿paréceos a vos que, si como éstos fueron mazos de batán, fueran otra peligrosa aventura, no había yo mostrado el ánimo que convenía para emprendella y acaballa?"
        literal: "Come here, sir merry: does-it-seem-to-you to you that, if as these were hammers of fulling-mill, they-had-been another perilous adventure, not had I shown the courage that was-fitting for undertaking-it and finishing-it?"
        ormsby: "“Look here, my lively gentleman, if these, instead of being fulling hammers, had been some perilous adventure, have I not, think you, shown the courage required for the attempt and achievement?"
        vocab:
          - {w: "venid acá", d: "come here (now listen)"}
          - {w: "señor alegre", d: "Mr. Merry, my merry gentleman (sarcastic)"}
          - {w: "convenir", d: "to be fitting, be needed"}
          - {w: "emprendella", d: "= emprenderla, to undertake it"}
          - {w: "acaballa", d: "= acabarla, to finish it, achieve it"}
        diagram:
          - {s: "Venid acá, señor alegre", r: "command: come here, my merry sir"}
          - s: "¿paréceos a vos"
            r: "main verb: does it seem to you"
            under:
              - s: "que ... no había yo mostrado el ánimo"
                r: "what: that I had not shown the courage"
                under:
                  - {s: "si como éstos fueron mazos de batán, fueran otra peligrosa aventura", r: "condition: if, instead of fulling hammers, these had been a perilous adventure"}
                  - {s: "que convenía para emprendella y acaballa", r: "describes 'ánimo': that was needed to undertake and finish it"}
        forms:
          - {w: "Venid", f: "the vos/vosotros command of venir (to come): ven- + -id."}
          - {w: "paréceos", f: "parec- + -e + os → parecer (to seem), present, it, with 'os' (to you) stuck on the end; 'a vos' repeats it. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "fueron", f: "fu- + -eron → ser (to be), preterite, they. fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "fueran", f: "fu- + -eran → ser, imperfect subjunctive (-ra form), they: 'if they had been'. fuera, fueras, fuera, fuéramos, fuerais, fueran."}
          - {w: "había ... mostrado", f: "hab- + -ía → haber, imperfect, I, + mostrado, participle of mostrar (to show): 'had shown', here meaning 'would I not have shown'. había, habías, había, habíamos, habíais, habían."}
          - {w: "convenía", f: "conven- + -ía → convenir (to be fitting), imperfect, it. Same -ía imperfect."}
          - {w: "emprendella, acaballa", f: "emprender (to undertake) + la and acabar (to finish) + la, with -rl- turned into -ll-; modern 'emprenderla y acabarla'."}
      - es: "¿Estoy yo obligado, a dicha, siendo, como soy, caballero, a conocer y destinguir los sones y saber cuáles son de batán o no?"
        literal: "Am I obliged, by chance, being, as I-am, knight, to know and distinguish the sounds and know which are of fulling-mill or not?"
        ormsby: "Am I, perchance, being, as I am, a gentleman, bound to know and distinguish sounds and tell whether they come from fulling mills or not;"
        vocab:
          - {w: "estar obligado a", d: "to be bound to, obliged to"}
          - {w: "a dicha", d: "perchance, by any chance"}
          - {w: "destinguir", d: "= distinguir, to distinguish"}
          - {w: "son", d: "sound (literary)"}
        diagram:
          - s: "¿Estoy yo obligado"
            r: "main verb: am I bound"
            under:
              - {s: "a dicha", r: "by any chance"}
              - {s: "siendo, como soy, caballero", r: "being, as I am, a knight"}
              - {s: "a conocer y destinguir los sones", r: "bound to what, 1: to know and tell apart sounds"}
              - {s: "y saber cuáles son de batán o no?", r: "bound to what, 2: and know which come from fulling mills"}
        forms:
          - {w: "Estoy ... obligado", f: "estoy, estar (to be), present, I (estoy, estás, está, estamos, estáis, están), + obligado, participle of obligar (to oblige)."}
          - {w: "siendo", f: "gerund of ser (to be)."}
          - {w: "soy", f: "ser (to be), present, I. soy, eres, es, somos, sois, son."}
          - {w: "destinguir", f: "old spelling of distinguir."}
          - {w: "cuáles", f: "cuál (which) + -es, plural to match 'sones'."}
      - es: "Y más, que podría ser, como es verdad, que no los he visto en mi vida, como vos los habréis visto, como villano ruin que sois, criado y nacido entre ellos."
        literal: "And more, that it-could be, as it-is truth, that not them I-have seen in my life, as you them will-have seen, as peasant base that you-are, raised and born among them."
        ormsby: "and that, when perhaps, as is the case, I have never in my life seen any as you have, low boor as you are, that have been born and bred among them?"
        vocab:
          - {w: "y más, que", d: "and what's more"}
          - {w: "villano", d: "peasant, commoner (not 'villain'); an insult in a gentleman's mouth"}
          - {w: "ruin", d: "base, mean, low"}
          - {w: "criado y nacido", d: "bred and born"}
        diagram:
          - s: "podría ser"
            r: "main verb: it could be"
            under:
              - {s: "como es verdad", r: "aside: as is true"}
              - s: "que no los he visto en mi vida"
                r: "what could be: that I have never seen them"
                under:
                  - s: "como vos los habréis visto"
                    r: "comparison: as you must have seen them"
                    under:
                      - {s: "como villano ruin que sois, criado y nacido entre ellos", r: "why: being a low peasant, bred and born among them"}
        forms:
          - {w: "podría", f: "podr- + -ía → poder, conditional, it. podría, podrías, podría, podríamos, podríais, podrían."}
          - {w: "he visto", f: "he, haber, present, I, + visto, irregular participle of ver (to see). he, has, ha, hemos, habéis, han."}
          - {w: "habréis visto", f: "habr- + -éis → haber, future, you (vos), + visto: the future perfect used for a guess, 'you must have seen'. habré, habrás, habrá, habremos, habréis, habrán."}
          - {w: "sois", f: "ser (to be), present, you (vos). soy, eres, es, somos, sois, son."}
          - {w: "criado y nacido", f: "participles of criar (to raise) and nacer (to be born), masculine to match 'vos'."}
        note: "Fulling mills were common in La Mancha; the 'gentleman' who claims never to have seen one is calling Sancho a peasant to save face."
      - es: "Si no, haced vos que estos seis mazos se vuelvan en seis jayanes, y echádmelos a las barbas uno a uno, o todos juntos, y, cuando yo no diere con todos patas arriba, haced de mí la burla que quisiéredes."
        literal: "If not, make you that these six hammers themselves turn into six giants, and throw-them-at-me to the beards one by one, or all together, and, when I not should-hit with all feet up, make of me the mockery that you-may-wish."
        ormsby: "But turn me these six hammers into six giants, and bring them to beard me, one by one or all together, and if I do not knock them head over heels, then make what mockery you like of me.”"
        vocab:
          - {w: "si no", d: "otherwise, just try"}
          - {w: "volverse en", d: "to turn into"}
          - {w: "jayán", d: "giant (of the romances)"}
          - {w: "echar a las barbas", d: "to set (an enemy) in someone's face, to beard"}
          - {w: "dar con alguien patas arriba", d: "to knock someone head over heels"}
          - {w: "cuando + subjunctive", d: "if"}
        diagram:
          - s: "haced vos"
            r: "command 1: you make"
            under:
              - {s: "Si no", r: "otherwise"}
              - {s: "que estos seis mazos se vuelvan en seis jayanes", r: "what: these six hammers turn into six giants"}
          - s: "y echádmelos a las barbas"
            r: "command 2: and set them in my face"
            under:
              - {s: "uno a uno, o todos juntos", r: "how: one by one or all together"}
          - s: "haced de mí la burla"
            r: "command 3: make a mockery of me"
            under:
              - {s: "cuando yo no diere con todos patas arriba", r: "condition: if I don't knock them all head over heels"}
              - {s: "que quisiéredes", r: "describes 'burla': whatever you like"}
        forms:
          - {w: "haced", f: "the vos/vosotros command of hacer (to make): hac- + -ed."}
          - {w: "se vuelvan", f: "vuelv- + -an → volverse (to turn into), present subjunctive, they, after 'haced que'. The stem o becomes ue when stressed: vuelva, vuelvas, vuelva, volvamos, volváis, vuelvan."}
          - {w: "echádmelos", f: "echad, the vos command of echar (to throw), + me (at me) + los (them), with an accent added."}
          - {w: "diere", f: "d- + -iere → dar (to strike), future subjunctive, I: 'if I don't knock'. diere, dieres, diere, diéremos, diereis, dieren. Modern 'si no doy'."}
          - {w: "quisiéredes", f: "quis- + -iéredes → querer (to want), future subjunctive, you (vos), with the old ending -ades/-edes for 'vos': modern -iereis. quisiere, quisieres, quisiere, quisiéremos, quisiereis (old quisiéredes), quisieren."}
  - sentences:
      - es: "— No haya más, señor mío —replicó Sancho—, que yo confieso que he andado algo risueño en demasía."
        literal: "— Not let-there-be more, lord mine —replied Sancho—, for I confess that I-have gone somewhat laughing in excess."
        ormsby: "“No more of that, señor,” returned Sancho; “I own I went a little too far with the joke."
        vocab:
          - {w: "no haya más", d: "let's say no more, enough of that"}
          - {w: "confesar", d: "to confess, admit"}
          - {w: "andar risueño", d: "to be in a laughing mood"}
          - {w: "en demasía", d: "too much, excessively"}
        diagram:
          - {s: "No haya más, señor mío", r: "main verb 1 (a wish): let there be no more, sir"}
          - {s: "replicó Sancho", r: "speech tag"}
          - s: "que yo confieso"
            r: "main verb 2: for I admit"
            under:
              - {s: "que he andado algo risueño en demasía", r: "what: that I have been rather too merry"}
        forms:
          - {w: "haya", f: "hay- + -a → haber, present subjunctive, as a wish: 'let there be'. haya, hayas, haya, hayamos, hayáis, hayan."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "confieso", f: "confies- + -o → confesar (to admit), present, I. The stem e becomes ie when stressed: confieso, confiesas, confiesa, confesamos, confesáis, confiesan."}
          - {w: "he andado", f: "he, haber, present, I, + andado, participle of andar: 'I have been'. he, has, ha, hemos, habéis, han."}
          - {w: "risueño", f: "risa (laughter) + -eño: 'laughing, merry', masculine to match 'yo'."}
      - es: "Pero dígame vuestra merced, ahora que estamos en paz (así Dios le saque de todas las aventuras que le sucedieren tan sano y salvo como le ha sacado désta), ¿no ha sido cosa de reír, y lo es de contar, el gran miedo que hemos tenido?"
        literal: "But tell-me your grace, now that we-are in peace (so God you may-bring-out of all the adventures that to-you may-happen as healthy and safe as you he-has brought-out of-this-one), not has been thing of laughing, and it is of telling, the great fear that we-have had?"
        ormsby: "But tell me, your worship, now that peace is made between us (and may God bring you out of all the adventures that may befall you as safe and sound as he has brought you out of this one), was it not a thing to laugh at, and is it not a good story, the great fear we were in?—"
        vocab:
          - {w: "estar en paz", d: "to be at peace, reconciled"}
          - {w: "así Dios le saque", d: "so may God bring you out (a blessing; 'así' + subjunctive = may ...)"}
          - {w: "sucedieren", d: "future subjunctive of suceder: 'that may happen'"}
          - {w: "sano y salvo", d: "safe and sound"}
          - {w: "désta", d: "= de ésta, from this one"}
          - {w: "cosa de reír", d: "something to laugh at"}
        diagram:
          - s: "dígame vuestra merced"
            r: "main verb (a request): tell me, sir"
            under:
              - {s: "ahora que estamos en paz", r: "when: now that we are at peace"}
              - s: "así Dios le saque de todas las aventuras"
                r: "aside, a blessing: so may God bring you out of all adventures"
                under:
                  - {s: "que le sucedieren", r: "describes 'aventuras': that may befall you"}
                  - {s: "tan sano y salvo como le ha sacado désta", r: "how: as safe and sound as he brought you out of this one"}
              - s: "¿no ha sido cosa de reír, y lo es de contar"
                r: "what I ask: hasn't it been something to laugh at, and to tell"
                under:
                  - {s: "el gran miedo que hemos tenido?", r: "subject: the great fear we have had"}
        forms:
          - {w: "dígame", f: "diga, the command for 'vuestra merced' (the present subjunctive of decir), + me (to me), with an accent added. diga, digas, diga, digamos, digáis, digan."}
          - {w: "estamos", f: "est- + -amos → estar (to be), present, we. estoy, estás, está, estamos, estáis, están."}
          - {w: "saque", f: "saqu- + -e → sacar (to bring out), present subjunctive, he (God), as a wish; c turns to qu before e. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "sucedieren", f: "suced- + -ieren → suceder (to happen), future subjunctive, they. The future subjunctive of -er and -ir verbs: -iere, -ieres, -iere, -iéremos, -iereis, -ieren. Modern 'sucedan'."}
          - {w: "ha sacado", f: "ha, haber, present, he, + sacado, participle of sacar. he, has, ha, hemos, habéis, han."}
