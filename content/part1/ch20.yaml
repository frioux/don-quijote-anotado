          - {w: "contase", f: "cont- + -ase → contar (to tell), imperfect subjunctive (-se form), he. Subjunctive because it is a request ('decir que' = to tell to). The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun ('cuento')."}
          - {w: "entretenerle", f: "entretener (to entertain) + le (him), the pronoun hung on the infinitive."}
          - {w: "se lo había prometido", f: "hab- + -ía → haber, imperfect, he, + prometido, the participle of prometer (to promise): the pluperfect 'had promised'. 'se lo': le (to him) turns into 'se' before 'lo' (it). haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
