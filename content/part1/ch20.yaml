  - sentences:
      - es: "— Falte lo que faltare —respondió don Quijote—; que no se ha de decir por mí, ahora ni en ningún tiempo, que lágrimas y ruegos me apartaron de hacer lo que debía a estilo de caballero; y así, te ruego, Sancho, que calles;"
        literal: "— Let-be-lacking what may-be-lacking —answered Don Quijote—; for not it has to be-said of me, now nor in any time, that tears and pleas me turned-aside from doing what I-ought by style of knight; and so, you I-beg, Sancho, that you-be-silent;"
        ormsby: "“Let it want what it may,” replied Don Quixote, “it shall not be said of me now or at any time that tears or entreaties turned me aside from doing what was in accordance with knightly usage; and so I beg of thee, Sancho, to hold thy peace,"
        vocab:
          - {w: "falte lo que faltare", d: "let it lack what it may, however long it is till day; 'faltar' = to be lacking"}
          - {w: "decir por", d: "to say of, about (someone)"}
          - {w: "ruego", d: "plea, entreaty"}
          - {w: "apartar de", d: "to turn aside from, deter from"}
          - {w: "a estilo de caballero", d: "in the manner of a knight, as knighthood requires"}
          - {w: "rogar", d: "to beg, entreat"}
          - {w: "callar", d: "to be silent, hold one's tongue"}
        diagram:
          - {s: "Falte lo que faltare", r: "main verb 1 (a concession): let what is lacking be lacking"}
          - {s: "respondió don Quijote", r: "speech tag: answered Don Quijote"}
          - s: "que no se ha de decir por mí"
            r: "main verb 2: for it shall not be said of me"
            under:
              - {s: "ahora ni en ningún tiempo", r: "when: now or ever"}
              - s: "que lágrimas y ruegos me apartaron de hacer lo"
                r: "what shall not be said: that tears and pleas kept me from doing what"
                under:
                  - {s: "que debía a estilo de caballero", r: "describes 'lo': that I owed as a knight"}
          - s: "y así, te ruego, Sancho"
            r: "main verb 3: and so I beg you, Sancho"
            under:
              - {s: "que calles", r: "what I beg: that you be quiet"}
        forms:
          - {w: "Falte", f: "falt- + -e → faltar (to be lacking), present subjunctive, it, as a wish: 'let it lack'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "faltare", f: "falt- + -are → faltar, future subjunctive, it: 'whatever it may lack'. The future subjunctive of -ar verbs: -are, -ares, -are, -áremos, -areis, -aren. Modern Spanish says 'falte lo que falte'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "se ha de decir", f: "ha, haber (to have), present, it, + 'de' + decir (to say), with the impersonal 'se': 'it shall be said'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "ningún", f: "ninguno (no, any) clipped before a masculine singular noun ('tiempo')."}
          - {w: "apartaron", f: "apart- + -aron → apartar (to turn aside), preterite, they (tears and pleas), with 'me'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "debía", f: "deb- + -ía → deber (to owe, ought), imperfect, I. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "te ruego", f: "rueg- + -o → rogar (to beg), present, I, with 'te' (you). The stem o becomes ue when stressed: ruego, ruegas, ruega, rogamos, rogáis, ruegan."}
          - {w: "calles", f: "call- + -es → callar (to be silent), present subjunctive, you. Subjunctive because it is what I beg ('ruego que'). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
      - es: "que Dios, que me ha puesto en corazón de acometer ahora esta tan no vista y tan temerosa aventura, tendrá cuidado de mirar por mi salud y de consolar tu tristeza."
        literal: "for God, who to-me has put in heart to attack now this so not seen and so fearsome adventure, will-have care to look after my health and to console your sadness."
        ormsby: "for God, who has put it into my heart to undertake now this so unexampled and terrible adventure, will take care to watch over my safety and console thy sorrow;"
        vocab:
          - {w: "poner en corazón", d: "to put it into someone's heart, inspire"}
          - {w: "no visto", d: "unseen, unheard-of, unexampled"}
          - {w: "tener cuidado de", d: "to take care to, see to"}
          - {w: "mirar por", d: "to look after, watch over"}
          - {w: "salud", d: "safety, welfare (also health)"}
          - {w: "tristeza", d: "sadness, sorrow"}
        diagram:
          - s: "tendrá cuidado"
            r: "main verb (after 'que', for): will take care"
            under:
              - s: "Dios"
                r: "subject: God"
                under:
                  - {s: "que me ha puesto en corazón de acometer ahora esta tan no vista y tan temerosa aventura", r: "describes 'Dios': who has inspired me to attempt this unheard-of, fearful adventure"}
              - {s: "de mirar por mi salud", r: "care of what, 1: to watch over my safety"}
              - {s: "y de consolar tu tristeza", r: "care of what, 2: and to console your sorrow"}
        forms:
          - {w: "ha puesto", f: "ha, haber (to have), present, he, + puesto, the irregular participle of poner (to put): 'has put'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "acometer", f: "infinitive (to undertake) after 'corazón de'."}
          - {w: "esta tan no vista y tan temerosa", f: "vista, the irregular participle of ver (to see), and temeros- + -a: feminine to match 'aventura'."}
          - {w: "tendrá", f: "tendr- + -á → tener (to have), future, he. Irregular stem: tendré, tendrás, tendrá, tendremos, tendréis, tendrán."}
          - {w: "mirar, consolar", f: "infinitives after 'cuidado de'."}
      - es: "Lo que has de hacer es apretar bien las cinchas a Rocinante y quedarte aquí, que yo daré la vuelta presto, o vivo o muerto."
        literal: "That which you-have to do is to-tighten well the girths to Rocinante and to-stay-yourself here, for I will-give the turn soon, either alive or dead."
        ormsby: "what thou hast to do is to tighten Rocinante’s girths well, and wait here, for I shall come back shortly, alive or dead.”"
        vocab:
          - {w: "cincha", d: "girth, the strap that holds the saddle on"}
          - {w: "dar la vuelta", d: "to come back, return"}
          - {w: "presto", d: "soon, quickly"}
          - {w: "o vivo o muerto", d: "either alive or dead"}
        diagram:
          - s: "es"
            r: "main verb: is"
            under:
              - {s: "Lo que has de hacer", r: "subject: what you must do"}
              - {s: "apretar bien las cinchas a Rocinante", r: "what it is, 1: tighten Rocinante's girths well"}
              - {s: "y quedarte aquí", r: "what it is, 2: and stay here"}
              - s: "que yo daré la vuelta presto"
                r: "why: for I shall soon come back"
                under:
                  - {s: "o vivo o muerto", r: "how: alive or dead"}
        forms:
          - {w: "has de hacer", f: "has, haber (to have), present, you, + 'de' + hacer (to do): 'you must do'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "apretar", f: "infinitive (to tighten), naming what you must do."}
          - {w: "quedarte", f: "quedar (to stay) + te (yourself), the pronoun hung on the infinitive."}
          - {w: "daré", f: "dar (to give) + -é → future, I. daré, darás, dará, daremos, daréis, darán."}
          - {w: "vivo o muerto", f: "vivo (alive) and muerto, the irregular participle of morir (to die), masculine to match 'yo'."}
  - sentences:
      - es: "Viendo, pues, Sancho la última resolución de su amo y cuán poco valían con él sus lágrimas, consejos y ruegos, determinó de aprovecharse de su industria y hacerle esperar hasta el día, si pudiese;"
        literal: "Seeing, then, Sancho the last resolution of his master and how little were-worth with him his tears, counsels and pleas, he-determined of availing-himself of his ingenuity and to-make-him wait until the day, if he-could;"
        ormsby: "Sancho perceiving it his master’s final resolve, and how little his tears, counsels, and entreaties prevailed with him, determined to have recourse to his own ingenuity and compel him, if he could, to wait till daylight;"
        vocab:
          - {w: "última resolución", d: "final decision"}
          - {w: "cuán poco", d: "how little"}
          - {w: "valer con", d: "to count with, carry weight with"}
          - {w: "determinar de", d: "to decide to; modern Spanish drops the 'de'"}
          - {w: "aprovecharse de", d: "to make use of, avail oneself of"}
          - {w: "industria", d: "ingenuity, cunning, a trick (false friend: not 'industry')"}
        diagram:
          - s: "determinó"
            r: "main verb: he decided"
            under:
              - s: "Viendo, pues, Sancho la última resolución de su amo"
                r: "why: Sancho seeing his master's final decision"
                under:
                  - {s: "y cuán poco valían con él sus lágrimas, consejos y ruegos", r: "seeing what, 2: and how little his tears, advice and pleas counted"}
              - {s: "de aprovecharse de su industria", r: "what he decided, 1: to use his wits"}
              - s: "y hacerle esperar hasta el día"
                r: "what he decided, 2: and make him wait till day"
                under:
                  - {s: "si pudiese", r: "condition: if he could"}
        forms:
          - {w: "Viendo", f: "gerund of ver (to see): 'seeing', with its subject 'Sancho' after it."}
          - {w: "última", f: "últim- + -a → último (last), feminine to match 'resolución'."}
          - {w: "valían", f: "val- + -ían → valer (to be worth), imperfect, they (the tears). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "determinó", f: "determin- + -ó → determinar (to decide), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "aprovecharse", f: "aprovechar (to make use) + se (himself), the pronoun hung on the infinitive."}
          - {w: "hacerle esperar", f: "hacer (to make) + le (him) + esperar (to wait): 'to make him wait'."}
          - {w: "pudiese", f: "pud- + -iese → poder (to be able), imperfect subjunctive (-se form), he. Built on the preterite pudieron: pudiese, pudieses, pudiese, pudiésemos, pudieseis, pudiesen. Subjunctive after 'si' for a doubtful past condition."}
      - es: "y así, cuando apretaba las cinchas al caballo, bonitamente y sin ser sentido, ató con el cabestro de su asno ambos pies a Rocinante, de manera que cuando don Quijote se quiso partir, no pudo, porque el caballo no se podía mover sino a saltos."
        literal: "and so, when he-was-tightening the girths to-the horse, nicely and without being felt, he-tied with the halter of his donkey both feet to Rocinante, in manner that when Don Quijote himself wanted to-depart, not he-could, because the horse not itself could move except by jumps."
        ormsby: "and so, while tightening the girths of the horse, he quietly and without being felt, with his ass’ halter tied both Rocinante’s legs, so that when Don Quixote strove to go he was unable as the horse could only move by jumps."
        vocab:
          - {w: "bonitamente", d: "neatly, quietly, on the sly ('bonito' = pretty)"}
          - {w: "sin ser sentido", d: "without being noticed"}
          - {w: "atar", d: "to tie"}
          - {w: "cabestro", d: "halter"}
          - {w: "ambos", d: "both"}
          - {w: "pies", d: "feet; of a horse, the hind legs"}
          - {w: "partirse", d: "to set off, depart"}
          - {w: "a saltos", d: "in jumps, by hops"}
