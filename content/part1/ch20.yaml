  - sentences:
      - es: "Y, llegándose a él, puso la una mano en el arzón delantero y la otra en el otro, de modo que quedó abrazado con el muslo izquierdo de su amo, sin osarse apartar dél un dedo: tal era el miedo que tenía a los golpes, que todavía alternativamente sonaban."
        literal: "And, bringing-himself-close to him, he-put the one hand on the saddle-bow front and the other on the other, in way that he-remained embraced with the thigh left of his master, without daring-himself to-move-away from-him a finger: such was the fear that he-had of the blows, which still alternately sounded."
        ormsby: "and coming close to him he laid one hand on the pommel of the saddle and the other on the cantle so that he held his master’s left thigh in his embrace, not daring to separate a finger’s width from him; so much afraid was he of the strokes which still resounded with a regular beat."
        vocab:
          - {w: "llegarse a", d: "to come up close to"}
          - {w: "arzón", d: "saddle-bow; 'arzón delantero' = pommel (front), 'arzón trasero' = cantle (back)"}
          - {w: "de modo que", d: "so that"}
          - {w: "muslo", d: "thigh"}
          - {w: "osar", d: "to dare"}
          - {w: "dél", d: "= de él, 'from him'"}
          - {w: "un dedo", d: "a finger's breadth"}
          - {w: "todavía", d: "still"}
          - {w: "alternativamente", d: "by turns, one after another"}
        diagram:
          - s: "puso la una mano en el arzón delantero y la otra en el otro"
            r: "main verb: he put one hand on the pommel and the other on the cantle"
            under:
              - {s: "llegándose a él", r: "first: coming up close to him"}
              - s: "de modo que quedó abrazado con el muslo izquierdo de su amo"
                r: "result: so that he was left hugging his master's left thigh"
                under:
                  - {s: "sin osarse apartar dél un dedo", r: "how: not daring to move a finger's breadth from him"}
          - s: "tal era el miedo"
            r: "main verb 2 (after the colon): such was the fear"
            under:
              - s: "que tenía a los golpes"
                r: "describes 'miedo': that he had of the blows"
                under:
                  - {s: "que todavía alternativamente sonaban", r: "describes 'golpes': which still sounded by turns"}
        forms:
          - {w: "llegándose", f: "llegando, the gerund of llegar (to come), + se (himself), with an accent added."}
          - {w: "puso", f: "pus- + -o → poner (to put), preterite, he. Irregular stem: puse, pusiste, puso, pusimos, pusisteis, pusieron."}
          - {w: "la una ... la otra", f: "'the one ... the other', both feminine to match 'mano'; 'el otro' is masculine for the other 'arzón'."}
          - {w: "quedó abrazado", f: "qued- + -ó → quedar (to remain), preterite, he, + abrazado, the participle of abrazar (to embrace): 'was left hugging'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "osarse apartar", f: "osar (to dare) + apartar (to move away), with the 'se' of apartarse hung on 'osar'; modern 'osar apartarse'."}
          - {w: "dél", f: "de + él (from him)."}
          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "alternativamente", f: "alternativa + -mente, the adverb: 'by turns'."}
          - {w: "sonaban", f: "son- + -aban → sonar (to sound), imperfect, they (the blows). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
      - es: "Díjole don Quijote que contase algún cuento para entretenerle, como se lo había prometido, a lo que Sancho dijo que sí hiciera si le dejara el temor de lo que oía."
        literal: "Said-to-him Don Quijote that he-should-tell some story to entertain-him, as to-him it he-had promised, to which Sancho said that yes he-would-do if him let the fear of that which he-heard."
        ormsby: "Don Quixote bade him tell some story to amuse him as he had proposed, to which Sancho replied that he would if his dread of what he heard would let him;"
        vocab:
