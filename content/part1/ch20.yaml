  - sentences:
      - es: "En esto, parece ser, o que el frío de la mañana, que ya venía, o que Sancho hubiese cenado algunas cosas lenitivas, o que fuese cosa natural —que es lo que más se debe creer—, a él le vino en voluntad y deseo de hacer lo que otro no pudiera hacer por él;"
        literal: "In this, it-seems to-be, either that the cold of the morning, which already was-coming, or that Sancho had supped some things laxative, or that it-were thing natural —which is what most one should believe—, to him to-him came into will and desire to do that which another not could do for him;"
        ormsby: "Just then, whether it was the cold of the morning that was now approaching, or that he had eaten something laxative at supper, or that it was only natural (as is most likely), Sancho felt a desire to do what no one could do for him;"
        vocab:
          - {w: "en esto", d: "at this point, meanwhile"}
          - {w: "parece ser", d: "it seems, apparently"}
          - {w: "cenar", d: "to have for supper"}
          - {w: "lenitivo", d: "laxative, loosening (a medical word)"}
          - {w: "venirle a uno en voluntad", d: "to take a fancy to, feel the urge to"}
          - {w: "lo que otro no pudiera hacer por él", d: "what nobody else could do for him: a polite way to say he needed to relieve himself"}
        diagram:
          - s: "a él le vino en voluntad y deseo"
            r: "main verb: there came to him the urge and desire"
            under:
              - {s: "En esto, parece ser", r: "at this point, it seems"}
              - s: "o que el frío de la mañana"
                r: "possible cause 1: either the morning cold"
                under:
                  - {s: "que ya venía", r: "describes 'mañana': which was now coming"}
              - {s: "o que Sancho hubiese cenado algunas cosas lenitivas", r: "possible cause 2: or that Sancho had eaten something laxative for supper"}
              - s: "o que fuese cosa natural"
                r: "possible cause 3: or that it was just nature"
                under:
                  - {s: "que es lo que más se debe creer", r: "aside: which is the likeliest"}
              - s: "de hacer lo"
                r: "desire for what: to do the thing"
                under:
                  - {s: "que otro no pudiera hacer por él", r: "describes 'lo': that no one else could do for him"}
        forms:
          - {w: "parece", f: "parec- + -e → parecer (to seem), present, it. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "venía", f: "ven- + -ía → venir (to come), imperfect, it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "hubiese cenado", f: "hub- + -iese → haber, imperfect subjunctive (-se form), he, + cenado, the participle of cenar (to sup): the pluperfect subjunctive 'had eaten for supper'. hubiese, hubieses, hubiese, hubiésemos, hubieseis, hubiesen. Subjunctive because it is only a guess."}
