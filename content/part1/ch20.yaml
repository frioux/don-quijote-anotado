          - {w: "he hecho", f: "he, haber (to have), present, I, + hecho, the irregular participle of hacer (to do). he, has, ha, hemos, habéis, han."}
          - {w: "deba", f: "deb- + -a → deber (ought), present subjunctive, I. Subjunctive because the thing is only supposed. The present subjunctive of -er and -ir verbs: -a, -as, -a, -amos, -áis, -an."}
