          - {w: "tres o cuatro", d: "three or four (paces)"}
          - {w: "desde aquí adelante", d: "from now on"}
          - {w: "tener cuenta con", d: "to take care of, pay attention to"}
          - {w: "conversación", d: "familiarity, close dealings (old sense), not just 'talk'"}
          - {w: "engendrar", d: "to breed, give rise to"}
          - {w: "menosprecio", d: "contempt, disrespect"}
