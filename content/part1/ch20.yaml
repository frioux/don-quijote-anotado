          - {w: "advertir", d: "to note, observe, take notice"}
          - {w: "conseja", d: "old wives' tale, fable"}
          - {w: "así comoquiera", d: "just any old way, at random"}
          - {w: "sentencia", d: "maxim, saying (not a court sentence)"}
          - {w: "Catón Zonzorino", d: "Sancho's mangling of Catón Censorino, Cato the Censor, the Roman moralist; 'zonzo' = stupid"}
