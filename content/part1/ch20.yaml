  - sentences:
      - es: "— Todo puede ser —respondió Sancho—, mas yo sé que en lo de mi cuento no hay más que decir: que allí se acaba do comienza el yerro de la cuenta del pasaje de las cabras."
        literal: "— All can be —answered Sancho—, but I know that in that of my story not there-is more to say: that there itself ends where begins the error of the count of-the passage of the goats."
        ormsby: "“All that may be,” replied Sancho, “but I know that as to my story, all that can be said is that it ends there where the mistake in the count of the passage of the goats begins.”"
        vocab:
          - {w: "todo puede ser", d: "anything is possible, that may be"}
          - {w: "en lo de", d: "as for, in the matter of"}
          - {w: "do", d: "= donde, where (old, poetic)"}
          - {w: "yerro", d: "error, mistake"}
          - {w: "pasaje", d: "crossing, passage"}
        diagram:
          - {s: "Todo puede ser", r: "main verb 1: anything may be"}
          - {s: "respondió Sancho", r: "speech tag"}
          - s: "mas yo sé"
            r: "main verb 2: but I know"
            under:
              - {s: "que en lo de mi cuento no hay más que decir", r: "what I know: that as for my story there is no more to say"}
              - s: "que allí se acaba"
                r: "that is: that it ends there"
                under:
