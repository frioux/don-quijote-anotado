              - {s: "bonitamente y sin ser sentido", r: "how: quietly and unnoticed"}
              - {s: "con el cabestro de su asno", r: "with what: with his donkey's halter"}
              - {s: "ambos pies a Rocinante", r: "object: both Rocinante's feet"}
              - s: "de manera que cuando don Quijote se quiso partir, no pudo"
                r: "result: so that when Don Quijote tried to go, he could not"
                under:
                  - {s: "porque el caballo no se podía mover sino a saltos", r: "why: because the horse could only move in jumps"}
        forms:
          - {w: "apretaba", f: "apret- + -aba → apretar (to tighten), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "bonitamente", f: "bonita + -mente, the adverb: 'neatly'."}
          - {w: "ser sentido", f: "ser (to be) + sentido, the participle of sentir (to feel, notice): the passive infinitive 'being noticed'."}
          - {w: "ató", f: "at- + -ó → atar (to tie), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "se quiso partir", f: "quis- + -o → querer (to want), preterite, he, + partir (to leave), with 'se' set before the whole group. quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "pudo", f: "pud- + -o → poder (to be able), preterite, he. pude, pudiste, pudo, pudimos, pudisteis, pudieron."}
