          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "hace", f: "hac- + -e → hacer (to make), present, it. hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "esa, ese", f: "'that' (near you), feminine to match 'línea' and 'boca', masculine to match 'colodrillo': the things you talk of."}
          - {w: "dices", f: "dic- + -es → decir (to say), present, you. digo, dices, dice, decimos, decís, dicen."}
