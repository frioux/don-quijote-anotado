              - {s: "como se lo había prometido", r: "as: as he had promised him"}
          - s: "a lo que Sancho dijo"
            r: "main verb 2: to which Sancho said"
            under:
              - s: "que sí hiciera"
                r: "what he said: that he would"
                under:
                  - {s: "si le dejara el temor de lo que oía", r: "condition: if his fear of what he heard let him"}
