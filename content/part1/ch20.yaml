              - {s: "y el mal, para quien lo fuere a buscar", r: "wish 2: and the evil for whoever goes looking for it"}
          - s: "Y advierta vuestra merced"
            r: "main verb (a request): and note"
            under:
              - {s: "señor mío", r: "whom he addresses"}
              - s: "que el principio ... no fue así comoquiera"
                r: "what to note: that the opening was not chosen at random"
