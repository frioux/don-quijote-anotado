  - sentences:
      - es: "— «Has de saber, ¡oh Sancho amigo!, que yo nací, por querer del cielo, en esta nuestra edad de hierro, para resucitar en ella la dorada, o de oro."
        literal: "— «You-have to know, oh Sancho friend!, that I was-born, by wish of-the heaven, in this our age of iron, to revive in it the golden, or of gold."
        ormsby: "“Thou must know, friend Sancho, that of Heaven’s will I was born in this our iron age to revive in it the golden or age of gold;"
        vocab:
          - {w: "has de saber", d: "you must know"}
          - {w: "por querer del cielo", d: "by heaven's will"}
          - {w: "edad de hierro", d: "Iron Age, the worst of the classical ages of the world"}
          - {w: "resucitar", d: "to revive"}
        diagram:
          - s: "Has de saber"
            r: "main verb: you must know"
            under:
              - {s: "¡oh Sancho amigo!", r: "whom he addresses"}
              - s: "que yo nací"
                r: "what: that I was born"
                under:
                  - {s: "por querer del cielo", r: "how: by heaven's will"}
                  - {s: "en esta nuestra edad de hierro", r: "when: in this iron age of ours"}
                  - {s: "para resucitar en ella la dorada, o de oro", r: "why: to revive in it the golden age"}
        forms:
          - {w: "Has de saber", f: "has, haber (to have), present, you, + 'de' + saber: 'you must know'. he, has, ha, hemos, habéis, han."}
          - {w: "nací", f: "nac- + -í → nacer (to be born), preterite, I. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "esta nuestra", f: "'this our', two determiners together, feminine to match 'edad'."}
          - {w: "la dorada", f: "dorad- + -a → dorado (golden), feminine, standing for 'edad'."}
        note: "Sancho repeats his master's speech almost word for word but swaps the order ('la dorada, o de oro', 'las hazañas grandes'), the way a mimic does."
