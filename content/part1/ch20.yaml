        forms:
          - {w: "misma", f: "mism- + -a → mismo (same), feminine to match 'manera'."}
          - {w: "cuento", f: "cuent- + -o → contar (to tell), present, I. The stem o becomes ue when stressed: cuento, cuentas, cuenta, contamos, contáis, cuentan."}
          - {w: "se cuentan", f: "cuent- + -an → contar, present, they, with 'se': the passive 'are told'."}
