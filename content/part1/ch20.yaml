          - {w: "hacer escuro", d: "to be dark (of the weather or night): 'hace la noche tan escura' = the night is so dark"}
          - {w: "parecer", d: "here 'to appear, be seen' (the old sense), not 'to seem'"}
          - {w: "estrella alguna", d: "not a single star; 'alguno' after its noun in a negative = none at all"}
        diagram:
          - s: "¿Cómo puedes tú"
            r: "main verb: how can you"
            under:
              - {s: "Sancho", r: "whom he addresses"}
              - {s: "dijo don Quijote", r: "speech tag: said Don Quijote"}
              - s: "ver dónde hace esa línea"
                r: "infinitive after 'puedes': see where it makes that line"
                under:
                  - s: "ni dónde está esa boca o ese colodrillo"
                    r: "see what, 2: nor where that mouth or that occiput is"
                    under:
                      - {s: "que dices", r: "describes 'boca o colodrillo': that you talk of"}
              - s: "si hace la noche tan escura"
                r: "condition: when the night is so dark"
                under:
                  - {s: "que no parece en todo el cielo estrella alguna", r: "result: that not one star shows in the whole sky"}
        forms:
