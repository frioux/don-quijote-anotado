  - sentences:
      - es: "— Ea, señor, que el cielo, conmovido de mis lágrimas y plegarias, ha ordenado que no se pueda mover Rocinante; y si vos queréis porfiar, y espolear, y dalle, será enojar a la fortuna y dar coces, como dicen, contra el aguijón."
        literal: "— Come, lord, for the heaven, moved by my tears and prayers, has ordained that not itself can move Rocinante; and if you want to-persist, and to-spur, and to-hit-him, it-will-be to-anger [to] the fortune and to-give kicks, as they-say, against the goad."
        ormsby: "“See there, señor! Heaven, moved by my tears and prayers, has so ordered it that Rocinante cannot stir; and if you will be obstinate, and spur and strike him, you will only provoke fortune, and kick, as they say, against the pricks.”"
        vocab:
          - {w: "ea", d: "come on! there! (an interjection)"}
          - {w: "conmovido de", d: "moved by, touched by"}
          - {w: "plegaria", d: "prayer"}
          - {w: "ordenar", d: "to ordain, arrange"}
          - {w: "vos", d: "'you', a plain, even blunt address between 'tú' and 'vuestra merced'; Sancho slips into it in his excitement"}
          - {w: "porfiar", d: "to persist, insist stubbornly"}
          - {w: "espolear", d: "to spur"}
          - {w: "dalle", d: "= darle, to hit him; 'dar' alone often means 'to strike'"}
          - {w: "dar coces contra el aguijón", d: "to kick against the goad (Acts 9:5): to fight a battle you cannot win"}
        diagram:
          - {s: "Ea, señor", r: "exclamation and address"}
          - s: "el cielo ... ha ordenado"
            r: "main verb 1 (after 'que'): heaven has ordained"
            under:
              - {s: "conmovido de mis lágrimas y plegarias", r: "describes 'cielo': moved by my tears and prayers"}
              - {s: "que no se pueda mover Rocinante", r: "what it ordained: that Rocinante cannot move"}
          - s: "será enojar a la fortuna y dar coces"
            r: "main verb 2: it will be angering fortune and kicking"
            under:
              - {s: "si vos queréis porfiar, y espolear, y dalle", r: "condition: if you insist on spurring and hitting him"}
              - {s: "como dicen", r: "aside: as they say"}
              - {s: "contra el aguijón", r: "against what: against the goad"}
        forms:
          - {w: "conmovido", f: "participle of conmover (to move), masculine to match 'cielo'."}
          - {w: "ha ordenado", f: "ha, haber (to have), present, it, + ordenado, the participle of ordenar (to ordain). haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "se pueda mover", f: "pued- + -a → poder (to be able), present subjunctive, he (Rocinante), with 'se' (himself) before the group. Subjunctive after 'ha ordenado que'. pueda, puedas, pueda, podamos, podáis, puedan."}
          - {w: "queréis", f: "quer- + -éis → querer (to want), present, you (vos). With 'vos' the verb takes the plural you-form. quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "dalle", f: "dar (to give, strike) + le (him), with the -rl- turned into -ll-; modern 'darle'."}
          - {w: "será", f: "ser (to be), future, it. seré, serás, será, seremos, seréis, serán."}
          - {w: "dicen", f: "dic- + -en → decir (to say), present, they (people). digo, dices, dice, decimos, decís, dicen."}
  - sentences:
      - es: "Desesperábase con esto don Quijote, y, por más que ponía las piernas al caballo, menos le podía mover;"
        literal: "Was-despairing-himself with this Don Quijote, and, for more that he-put the legs to-the horse, less him he-could move;"
        ormsby: "Don Quixote at this grew desperate, but the more he drove his heels into the horse, the less he stirred him;"
        vocab:
          - {w: "desesperarse", d: "to despair, be beside oneself"}
          - {w: "por más que", d: "however much"}
          - {w: "poner las piernas", d: "to put the legs to (a horse), i.e. spur it with the heels"}
        diagram:
          - s: "Desesperábase"
            r: "main verb 1: was in despair"
            under:
              - {s: "con esto", r: "why: at this"}
              - {s: "don Quijote", r: "subject"}
          - s: "menos le podía mover"
            r: "main verb 2 (after 'y'): the less he could move him"
            under:
              - {s: "por más que ponía las piernas al caballo", r: "concession: however much he spurred the horse"}
        forms:
          - {w: "Desesperábase", f: "desesper- + -aba + se → desesperarse (to despair), imperfect, he, with 'se' stuck on the end. Cervantes hangs pronouns on the end of a conjugated verb that opens its clause; modern 'se desesperaba'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "ponía", f: "pon- + -ía → poner (to put), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "le podía mover", f: "pod- + -ía → poder (to be able), imperfect, he, + mover (to move); 'le' = him (the horse). Same -ía imperfect."}
      - es: "y, sin caer en la cuenta de la ligadura, tuvo por bien de sosegarse y esperar, o a que amaneciese, o a que Rocinante se menease, creyendo, sin duda, que aquello venía de otra parte que de la industria de Sancho; y así, le dijo:"
        literal: "and, without falling into the account of the tying, he-held for good to calm-himself and to-wait, either for that it-should-dawn, or for that Rocinante should-stir-himself, believing, without doubt, that that came from other part than from the ingenuity of Sancho; and so, to-him he-said:"
        ormsby: "and not having any suspicion of the tying, he was fain to resign himself and wait till daybreak or until Rocinante could move, firmly persuaded that all this came of something other than Sancho’s ingenuity. So he said to him,"
        vocab:
          - {w: "caer en la cuenta de", d: "to realize, twig, catch on to"}
          - {w: "ligadura", d: "tying, binding"}
          - {w: "tener por bien de", d: "to see fit to, decide to"}
          - {w: "sosegarse", d: "to calm down, settle"}
          - {w: "amanecer", d: "to dawn"}
          - {w: "menearse", d: "to stir, move"}
          - {w: "de otra parte que", d: "from some other source than"}
          - {w: "industria", d: "ingenuity, trick (false friend)"}
        diagram:
          - s: "tuvo por bien"
            r: "main verb 1: he saw fit"
            under:
              - {s: "sin caer en la cuenta de la ligadura", r: "how: without realizing the horse was tied"}
              - s: "de sosegarse y esperar"
                r: "what he saw fit: to calm down and wait"
                under:
                  - {s: "o a que amaneciese, o a que Rocinante se menease", r: "wait for what: for day to dawn or for Rocinante to stir"}
              - {s: "creyendo, sin duda, que aquello venía de otra parte que de la industria de Sancho", r: "why: believing this came from anything but Sancho's trick"}
          - {s: "y así, le dijo:", r: "main verb 2: and so he said to him"}
        forms:
          - {w: "caer", f: "infinitive (to fall) after 'sin'."}
          - {w: "tuvo", f: "tuv- + -o → tener (to have, hold), preterite, he. tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron."}
          - {w: "sosegarse", f: "sosegar (to calm) + se (himself), the pronoun hung on the infinitive."}
          - {w: "amaneciese", f: "amanec- + -iese → amanecer (to dawn), imperfect subjunctive (-se form), it. The -se form of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen. Subjunctive because it is still awaited ('esperar a que')."}
          - {w: "se menease", f: "mene- + -ase → menearse (to stir), imperfect subjunctive (-se form), he. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "creyendo", f: "gerund of creer (to believe); the i of -iendo becomes y between vowels."}
          - {w: "venía", f: "ven- + -ía → venir (to come), imperfect, it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Pues así es, Sancho, que Rocinante no puede moverse, yo soy contento de esperar a que ría el alba, aunque yo llore lo que ella tardare en venir."
        literal: "— Since so it-is, Sancho, that Rocinante not can move-himself, I am content to wait for that may-laugh the dawn, although I may-weep what she may-delay in coming."
        ormsby: "“As it is so, Sancho, and as Rocinante cannot move, I am content to wait till dawn smiles upon us, even though I weep while it delays its coming.”"
        vocab:
          - {w: "pues así es que", d: "since it is so that"}
