  - sentences:
      - es: "— De la misma manera que yo lo cuento —respondió Sancho—, se cuentan en mi tierra todas las consejas, y yo no sé contarlo de otra, ni es bien que vuestra merced me pida que haga usos nuevos."
        literal: "— In the same manner that I it tell —answered Sancho—, themselves are-told in my land all the tales, and I not know to-tell-it in another, nor is well that your grace of-me may-ask that I-make customs new."
        ormsby: "“Tales are always told in my country in the very way I am telling this,” answered Sancho, “and I cannot tell it in any other, nor is it right of your worship to ask me to make new customs.”"
        vocab:
          - {w: "conseja", d: "folk tale, old wives' tale"}
          - {w: "saber + infinitive", d: "to know how to"}
          - {w: "no es bien que", d: "it is not right that"}
          - {w: "usos", d: "customs, usages"}
