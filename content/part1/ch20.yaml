  - sentences:
      - es: "— «Digo, pues —prosiguió Sancho—, que en un lugar de Estremadura había un pastor cabrerizo (quiero decir que guardaba cabras), el cual pastor o cabrerizo, como digo, de mi cuento, se llamaba Lope Ruiz;"
        literal: "— «I-say, then —continued Sancho—, that in a village of Estremadura there-was a shepherd goat-keeping (I-mean to-say that he-kept goats), the which shepherd or goatherd, as I-say, of my story, himself called Lope Ruiz;"
        ormsby: "“I say then,” continued Sancho, “that in a village of Estremadura there was a goat-shepherd—that is to say, one who tended goats—which shepherd or goatherd, as my story goes, was called Lope Ruiz,"
        vocab:
          - {w: "proseguir", d: "to go on, continue"}
          - {w: "Estremadura", d: "= Extremadura, the region of western Spain bordering Portugal"}
          - {w: "pastor cabrerizo", d: "goat-shepherd, goatherd"}
          - {w: "quiero decir", d: "I mean"}
          - {w: "guardar", d: "to tend, keep (animals)"}
          - {w: "el cual pastor", d: "which shepherd; the relative repeats the noun, the legal-sounding redundancy of village storytellers"}
        diagram:
          - s: "Digo, pues"
            r: "main verb: I say, then"
            under:
              - {s: "prosiguió Sancho", r: "speech tag: Sancho went on"}
              - s: "que en un lugar de Estremadura había un pastor cabrerizo"
                r: "what I say: that in a village of Extremadura there was a goatherd"
                under:
                  - {s: "quiero decir que guardaba cabras", r: "aside: I mean he kept goats"}
                  - {s: "el cual pastor o cabrerizo, como digo, de mi cuento, se llamaba Lope Ruiz", r: "describes 'pastor': which shepherd of my story was called Lope Ruiz"}
        forms:
          - {w: "Digo", f: "dig- + -o → decir (to say), present, I. digo, dices, dice, decimos, decís, dicen."}
          - {w: "prosiguió", f: "prosig- + -uió → proseguir (to continue), preterite, he. The stem e becomes i in this form: proseguí, proseguiste, prosiguió, proseguimos, proseguisteis, prosiguieron."}
          - {w: "había", f: "hab- + -ía → haber, imperfect, used alone as 'there was'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "quiero decir", f: "quier- + -o → querer (to want), present, I, + decir: 'I mean'. quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "guardaba", f: "guard- + -aba → guardar (to tend), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "el cual", f: "the relative 'which', masculine to match 'pastor', here used before the noun it repeats."}
          - {w: "se llamaba", f: "llam- + -aba → llamarse (to be called), imperfect, he. Same -aba imperfect."}
      - es: "y este Lope Ruiz andaba enamorado de una pastora que se llamaba Torralba, la cual pastora llamada Torralba era hija de un ganadero rico, y este ganadero rico...»"
        literal: "and this Lope Ruiz went-about in-love with a shepherdess who herself called Torralba, the which shepherdess called Torralba was daughter of a stock-owner rich, and this stock-owner rich...»"
