  - sentences:
      - es: "— «Así que, señor mío de mi ánima —prosiguió Sancho—, que, como ya tengo dicho, este pastor andaba enamorado de Torralba, la pastora, que era una moza rolliza, zahareña y tiraba algo a hombruna, porque tenía unos pocos de bigotes, que parece que ahora la veo.»"
        literal: "— «So that, lord mine of my soul —continued Sancho—, that, as already I-have said, this shepherd went-about in-love with Torralba, the shepherdess, who was a girl plump, wild and pulled somewhat to mannish, because she-had a few of moustaches, for it-seems that now her I-see.»"
