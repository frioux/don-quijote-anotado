          - {w: "admirar", d: "to amaze, fill with wonder (not 'to admire')"}
          - {w: "alborozar", d: "to delight, gladden"}
          - {w: "entretener", d: "to entertain"}
          - {w: "admiración", d: "wonder, astonishment (false friend)"}
        diagram:
