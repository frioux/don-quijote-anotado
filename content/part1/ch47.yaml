  - sentences:
      - es: "En esto, volvió el cura el rostro, y vio que a sus espaldas venían hasta seis o siete hombres de a caballo, bien puestos y aderezados, de los cuales fueron presto alcanzados, porque caminaban no con la flema y reposo de los bueyes, sino como quien iba sobre mulas de canónigos y con deseo de llegar presto a sestear a la venta, que menos de una legua de allí se parecía."
        literal: "In this, turned the priest the face, and saw that at his backs were-coming up-to six or seven men of on horse, well turned-out and equipped, by the which they-were soon overtaken, because they-travelled not with the phlegm and repose of the oxen, but like one-who went upon mules of canons and with desire of arriving soon to take-the-noon-rest at the inn, which less of one league from there itself showed."
        ormsby: "Just at that moment the curate, looking back, saw coming on behind them six or seven mounted men, well found and equipped, who soon overtook them, for they were travelling, not at the sluggish, deliberate pace of oxen, but like men who rode canons’ mules, and in haste to take their noontide rest as soon as possible at the inn which was in sight not a league off."
