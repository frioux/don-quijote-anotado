          - {w: "se escribe", f: "escrib- + -e → escribir (to write), present, it, with 'se' making it passive: 'what is written'. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
      - es: "No he visto ningún libro de caballerías que haga un cuerpo de fábula entero con todos sus miembros, de manera que el medio corresponda al principio, y el fin al principio y al medio;"
