part: 1
chapter: 47
title_es: "Capítulo XLVII. Del estraño modo con que fue encantado don Quijote de la Mancha, con otros famosos sucesos"
title_en: "Of the strange manner in which Don Quixote of La Mancha was carried away enchanted, together with other remarkable incidents"
paragraphs:
  - sentences:
      - es: "Cuando don Quijote se vio de aquella manera enjaulado y encima del carro, dijo:"
        literal: "When Don Quijote himself saw in that manner caged and on-top of-the cart, he-said:"
        ormsby: "When Don Quixote saw himself caged and hoisted on the cart in this way, he said,"
        vocab:
          - {w: "enjaulado", d: "caged, shut in a cage (jaula)"}
          - {w: "encima de", d: "on top of, up on"}
          - {w: "carro", d: "cart, wagon (here an ox-cart)"}
        diagram:
          - s: "dijo:"
            r: "main verb: he said"
            under:
              - s: "Cuando don Quijote se vio"
                r: "when: when Don Quijote saw himself"
                under:
                  - {s: "de aquella manera", r: "how: in that way"}
                  - {s: "enjaulado y encima del carro", r: "how he saw himself: caged and up on the cart"}
        forms:
          - {w: "se vio", f: "vi- + -o → verse (to see oneself), preterite, he, with 'se' (himself). ver (to see) in the preterite: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "aquella", f: "aquell- + -a → aquel (that), feminine to match 'manera'."}
          - {w: "enjaulado", f: "enjaul- + -ado → enjaular (to cage), participle used as an adjective, masculine to match Don Quijote."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
        note: "At the end of the previous chapter the priest, the barber and the others, masked as phantoms, shut the sleeping Don Quijote in a wooden cage and loaded it onto an ox-cart, to take him home to his village."
  - sentences:
      - es: "— Muchas y muy graves historias he yo leído de caballeros andantes, pero jamás he leído, ni visto, ni oído, que a los caballeros encantados los lleven desta manera y con el espacio que prometen estos perezosos y tardíos animales;"
        literal: "— Many and very grave histories have I read of knights errant, but never have-I read, nor seen, nor heard, that [as for] the knights enchanted them they-carry of-this manner and with the slowness that promise these lazy and tardy animals;"
        ormsby: "“Many grave histories of knights-errant have I read; but never yet have I read, seen, or heard of their carrying off enchanted knights-errant in this fashion, or at the slow pace that these lazy, sluggish animals promise;"
        vocab:
          - {w: "grave", d: "serious, weighty, of authority"}
          - {w: "caballero andante", d: "knight-errant, a knight who wanders in search of adventures"}
          - {w: "desta", d: "= de esta, of this (old contraction)"}
          - {w: "espacio", d: "slowness, leisure (old sense), not 'space'; 'con espacio' = slowly"}
          - {w: "perezoso", d: "lazy, sluggish"}
          - {w: "tardío", d: "slow, tardy"}
        diagram:
          - s: "Muchas y muy graves historias he yo leído"
            r: "main verb 1: I have read many very serious histories"
            under:
              - {s: "de caballeros andantes", r: "about what: of knights-errant"}
          - s: "pero jamás he leído, ni visto, ni oído"
            r: "main verb 2: but I have never read, seen or heard"
            under:
              - s: "que a los caballeros encantados los lleven"
                r: "what: that they carry enchanted knights"
                under:
                  - {s: "desta manera", r: "how: in this way"}
                  - s: "y con el espacio"
                    r: "how, 2: and at the slow pace"
                    under:
                      - {s: "que prometen estos perezosos y tardíos animales", r: "describes 'espacio': that these lazy, slow beasts promise"}
        forms:
          - {w: "he yo leído", f: "he (haber (to have), present, I: he, has, ha, hemos, habéis, han) + leído, the participle of leer (to read): the present perfect, 'I have read'. Cervantes puts the subject 'yo' between the helper and the participle, which modern Spanish never does."}
          - {w: "he leído, ni visto, ni oído", f: "one 'he' (haber (to have), present, I: he, has, ha, hemos, habéis, han) serves three participles: leído from leer (to read), visto (irregular) from ver (to see), oído from oír (to hear)."}
          - {w: "a los caballeros encantados los lleven", f: "llev- + -en → llevar (to carry), present subjunctive, they (people in general). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. The object is put first with 'a' and repeated by 'los': 'the enchanted knights, that they carry them'."}
          - {w: "desta", f: "de + esta (of this): Cervantes fuses 'de' with these pronouns."}
          - {w: "prometen", f: "promet- + -en → prometer (to promise), present, they (the animals). The present of -er verbs: -o, -es, -e, -emos, -éis, -en. The subject comes after the verb."}
          - {w: "estos perezosos y tardíos", f: "estos (these) and the adjectives perezoso (lazy) and tardío (slow), all masculine plural to match 'animales'."}
        note: "The cage, the ox-cart and the slow procession are the plot of the priest and Don Fernando's party to get Don Quijote home; he takes them, as they intended, for enchantment."
      - es: "porque siempre los suelen llevar por los aires, con estraña ligereza, encerrados en alguna parda y escura nube, o en algún carro de fuego, o ya sobre algún hipogrifo o otra bestia semejante;"
        literal: "because always them they-are-wont to-carry through the airs, with strange swiftness, shut-up in some dun and dark cloud, or in some chariot of fire, or else upon some hippogriff or other beast similar;"
        ormsby: "for they always take them away through the air with marvellous swiftness, enveloped in a dark thick cloud, or on a chariot of fire, or it may be on some hippogriff or other beast of the kind;"
        vocab:
          - {w: "soler", d: "to be in the habit of; 'suelen llevar' = they usually carry"}
          - {w: "estraño", d: "= extraño, strange, extraordinary (old spelling)"}
          - {w: "ligereza", d: "swiftness, lightness"}
          - {w: "encerrado", d: "shut in, enclosed"}
          - {w: "pardo", d: "dun, dark grey-brown"}
          - {w: "escuro", d: "= oscuro, dark (old spelling)"}
          - {w: "carro de fuego", d: "chariot of fire, as Elijah was carried to heaven (2 Kings 2)"}
          - {w: "hipogrifo", d: "hippogriff, a winged horse with a griffin's head, ridden in Ariosto's Orlando Furioso"}
          - {w: "o ya", d: "or else, or again"}
          - {w: "semejante", d: "similar, of the kind"}
        diagram:
          - s: "porque siempre los suelen llevar"
            r: "why: because they usually carry them (the knights)"
            under:
              - {s: "por los aires", r: "where: through the air"}
              - {s: "con estraña ligereza", r: "how: with extraordinary speed"}
              - s: "encerrados en alguna parda y escura nube"
                r: "how, 2: shut inside some dark cloud"
                under:
                  - {s: "o en algún carro de fuego", r: "or: in a chariot of fire"}
                  - {s: "o ya sobre algún hipogrifo o otra bestia semejante", r: "or: on a hippogriff or some such beast"}
        forms:
          - {w: "suelen", f: "suel- + -en → soler (to be in the habit of), present, they. The stem o becomes ue when stressed: suelo, sueles, suele, solemos, soléis, suelen. Always followed by an infinitive, here 'llevar'."}
          - {w: "los suelen llevar", f: "the object pronoun 'los' (them, the knights) goes before the whole group 'suelen llevar'; modern Spanish also allows 'suelen llevarlos'."}
          - {w: "estraña", f: "estrañ- + -a → estraño (strange), feminine to match 'ligereza'; old spelling of extraño."}
          - {w: "encerrados", f: "encerr- + -ados → encerrar (to shut in), participle, masculine plural to match 'los' (the knights)."}
          - {w: "alguna parda y escura", f: "alguno (some), pardo (dun) and escuro (dark), all feminine to match 'nube'; escura is the old spelling of oscura."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun ('carro', 'hipogrifo'), like un, buen, ningún."}
        note: "These are real conveyances of romance: magicians in the books of chivalry whisk knights away in clouds, and Ariosto's knights ride the hippogriff to the moon. An ox-cart is the comic opposite."
      - es: "pero que me lleven a mí agora sobre un carro de bueyes, ¡vive Dios que me pone en confusión!"
        literal: "but that me they-carry to me now upon a cart of oxen, lives God that me it-puts in confusion!"
        ormsby: "but to carry me off like this on an ox-cart! By God, it puzzles me!"
        vocab:
          - {w: "agora", d: "= ahora, now (old form)"}
          - {w: "buey", d: "ox; plural 'bueyes'"}
          - {w: "¡vive Dios!", d: "'as God lives!', an oath: by God!"}
          - {w: "poner en confusión", d: "to bewilder, puzzle"}
        diagram:
          - s: "¡vive Dios que me pone en confusión!"
            r: "main verb: by God, it puzzles me"
            under:
              - s: "pero que me lleven a mí"
                r: "subject of 'pone': but the fact that they carry me"
                under:
                  - {s: "agora", r: "when: now"}
                  - {s: "sobre un carro de bueyes", r: "how: on an ox-cart"}
        forms:
          - {w: "me lleven a mí", f: "llev- + -en → llevar (to carry), present subjunctive, they. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. Subjunctive because 'que ...' is a fact being reacted to. 'a mí' doubles 'me' for emphasis: 'me, of all people'."}
          - {w: "agora", f: "old form of ahora (now)."}
          - {w: "bueyes", f: "plural of buey (ox): a noun ending in -y adds -es."}
          - {w: "vive", f: "viv- + -e → vivir (to live), present, he (God): 'as God lives'. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "pone", f: "pon- + -e → poner (to put), present, it (the whole business). Irregular: pongo, pones, pone, ponemos, ponéis, ponen."}
      - es: "Pero quizá la caballería y los encantos destos nuestros tiempos deben de seguir otro camino que siguieron los antiguos."
        literal: "But perhaps the chivalry and the enchantments of-these our times must follow another road than followed the ancient [ones]."
        ormsby: "But perhaps the chivalry and enchantments of our day take a different course from that of those in days gone by;"
        vocab:
          - {w: "encanto", d: "enchantment, spell"}
          - {w: "destos", d: "= de estos, of these (old contraction)"}
          - {w: "deber de", d: "must (probability): 'deben de seguir' = they must be following, probably follow"}
          - {w: "otro ... que", d: "other ... than; modern Spanish says 'otro ... distinto del que'"}
          - {w: "los antiguos", d: "the ancient ones, those of old times"}
        diagram:
          - s: "deben de seguir otro camino"
            r: "main verb: must follow another road"
            under:
              - {s: "quizá", r: "how sure: perhaps"}
              - s: "la caballería y los encantos"
                r: "subject: chivalry and enchantments"
                under:
                  - {s: "destos nuestros tiempos", r: "describes them: of these times of ours"}
              - {s: "que siguieron los antiguos", r: "compared with: than the ones of old followed"}
        forms:
          - {w: "destos", f: "de + estos (of these): Cervantes fuses 'de' with these pronouns."}
          - {w: "deben", f: "deb- + -en → deber (must), present, they. The present of -er verbs: -o, -es, -e, -emos, -éis, -en. With 'de' + infinitive it expresses a guess: 'must (probably) follow'."}
          - {w: "siguieron", f: "sigu- + -ieron → seguir (to follow), preterite, they. The e of the stem turns to i in this form: seguí, seguiste, siguió, seguimos, seguisteis, siguieron."}
      - es: "Y también podría ser que, como yo soy nuevo caballero en el mundo, y el primero que ha resucitado el ya olvidado ejercicio de la caballería aventurera, también nuevamente se hayan inventado otros géneros de encantamentos y otros modos de llevar a los encantados. ¿Qué te parece desto, Sancho hijo?"
        literal: "And also it-could be that, as I am new knight in the world, and the first who has revived the already forgotten profession of the chivalry adventurous, also newly themselves may-have invented other kinds of enchantments and other ways of carrying the enchanted [ones]. What to-you seems of-this, Sancho son?"
        ormsby: "and it may be, too, that as I am a new knight in the world, and the first to revive the already forgotten calling of knight-adventurers, they may have newly invented other kinds of enchantments and other modes of carrying off the enchanted. What thinkest thou of the matter, Sancho my son?”"
        vocab:
          - {w: "podría ser que", d: "it could be that (takes the subjunctive)"}
          - {w: "resucitar", d: "to revive, bring back to life"}
          - {w: "ejercicio", d: "profession, calling (not 'exercise')"}
          - {w: "caballería aventurera", d: "adventuring chivalry, knight-errantry"}
          - {w: "nuevamente", d: "newly, afresh (not 'again', its usual modern sense)"}
          - {w: "género", d: "kind, sort"}
          - {w: "encantamento", d: "= encantamiento, enchantment (old form)"}
          - {w: "¿qué te parece desto?", d: "what do you think of this?; 'desto' = de esto"}
          - {w: "Sancho hijo", d: "'Sancho, my son', an affectionate address"}
        diagram:
          - s: "podría ser"
            r: "main verb 1: it could be"
            under:
              - s: "como yo soy nuevo caballero en el mundo"
                r: "why: since I am a new knight in the world"
                under:
                  - s: "y el primero"
                    r: "and (I am) the first"
                    under:
                      - {s: "que ha resucitado el ya olvidado ejercicio de la caballería aventurera", r: "describes 'primero': who has revived the forgotten calling of knight-errantry"}
              - {s: "también nuevamente se hayan inventado otros géneros de encantamentos y otros modos de llevar a los encantados", r: "what could be: that new kinds of enchantment and new ways of carrying the enchanted have been invented"}
          - s: "¿Qué te parece desto, Sancho hijo?"
            r: "main verb 2, a question: what do you think of this, Sancho my son?"
        forms:
          - {w: "podría", f: "podr- + -ía → poder (to be able), conditional, it: 'it could'. Irregular stem podr-: podría, podrías, podría, podríamos, podríais, podrían."}
          - {w: "soy", f: "ser (to be), present, I. soy, eres, es, somos, sois, son."}
          - {w: "ha resucitado", f: "ha (haber (to have), present, he: he, has, ha, hemos, habéis, han) + resucitado, the participle of resucitar (to revive): 'has revived'."}
          - {w: "olvidado", f: "olvid- + -ado → olvidar (to forget), participle used as an adjective, masculine to match 'ejercicio'."}
          - {w: "nuevamente", f: "nuev- + -a + -mente → nuevo (new) made into an adverb: '-mente' is added to the feminine form."}
          - {w: "se hayan inventado", f: "hay- + -an → haber (to have), present subjunctive, they, + inventado, the participle of inventar (to invent): 'may have been invented'. haber (to have) in the present subjunctive: haya, hayas, haya, hayamos, hayáis, hayan. 'se' makes it passive; subjunctive after 'podría ser que'."}
          - {w: "parece", f: "parec- + -e → parecer (to seem), present, it: 'what seems to you', i.e. what do you think. parezco, pareces, parece, parecemos, parecéis, parecen."}
          - {w: "desto", f: "de + esto (of this): Cervantes fuses 'de' with these pronouns."}
  - sentences:
      - es: "— No sé yo lo que me parece —respondió Sancho—, por no ser tan leído como vuestra merced en las escrituras andantes; pero, con todo eso, osaría afirmar y jurar que estas visiones que por aquí andan, que no son del todo católicas."
        literal: "— Not know I that which to-me seems —answered Sancho—, through not being so read as your grace in the writings errant; but, with all that, I-would-dare to-affirm and to-swear that these visions that around here go-about, that not are entirely catholic."
        ormsby: "“I don’t know what to think,” answered Sancho, “not being as well read as your worship in errant writings; but for all that I venture to say and swear that these apparitions that are about us are not quite catholic.”"
        vocab:
          - {w: "leído", d: "well-read (of a person)"}
          - {w: "vuestra merced", d: "'your grace', the polite 'you' (source of modern 'usted'); takes a he/she verb"}
          - {w: "escrituras andantes", d: "'errant writings', Sancho's muddle for books of knight-errantry"}
          - {w: "con todo eso", d: "for all that, nevertheless"}
          - {w: "osar", d: "to dare"}
          - {w: "visión", d: "apparition, ghost"}
          - {w: "del todo", d: "entirely, altogether"}
          - {w: "católico", d: "Catholic; colloquially 'sound, all right, as it should be' ('no muy católico' = not quite kosher)"}
        diagram:
          - s: "No sé yo"
            r: "main verb 1: I don't know"
            under:
              - {s: "lo que me parece", r: "object: what I think"}
              - {s: "—respondió Sancho—", r: "speech tag: Sancho answered"}
              - s: "por no ser tan leído"
                r: "why: through not being so well-read"
                under:
                  - {s: "como vuestra merced en las escrituras andantes", r: "compared with: as your grace, in errant writings"}
          - s: "pero, con todo eso, osaría afirmar y jurar"
            r: "main verb 2: but even so I would dare to state and swear"
            under:
              - s: "que estas visiones"
                r: "what he would swear: that these apparitions"
                under:
                  - {s: "que por aquí andan", r: "describes 'visiones': that are going about here"}
                  - {s: "que no son del todo católicas", r: "what they are: not altogether catholic (the 'que' is repeated)"}
        forms:
          - {w: "sé", f: "s- + -é → saber (to know), present, I. Irregular: sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "parece", f: "parec- + -e → parecer (to seem), present, it. parezco, pareces, parece, parecemos, parecéis, parecen."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "por no ser", f: "infinitive of ser (to be) after 'por', giving a reason: 'because of not being'."}
          - {w: "leído", f: "le- + -ído → leer (to read), participle used as an adjective: 'well-read'."}
          - {w: "osaría", f: "osar- + -ía → osar (to dare), conditional, I. The conditional adds endings to the whole infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "andan", f: "and- + -an → andar (to go about), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "son", f: "ser (to be), present, they. soy, eres, es, somos, sois, son."}
          - {w: "católicas", f: "católic- + -as → católico (Catholic), feminine plural to match 'visiones'."}
        note: "Sancho has recognized the 'phantoms' (he says so below), but hides his meaning in a joke: 'no muy católico' was everyday slang for something fishy. Don Quijote takes the word in its religious sense."
  - sentences:
      - es: "— ¿Católicas? ¡Mi padre! —respondió don Quijote—. ¿Cómo han de ser católicas si son todos demonios que han tomado cuerpos fantásticos para venir a hacer esto y a ponerme en este estado?"
        literal: "— Catholic? My father! —answered Don Quijote—. How have-they to be catholic if they-are all demons that have taken bodies fantastic in-order-to come to do this and to put-me in this state?"
        ormsby: "“Catholic!” said Don Quixote. “Father of me! how can they be Catholic when they are all devils that have taken fantastic shapes to come and do this, and bring me to this condition?"
        vocab:
          - {w: "¡Mi padre!", d: "'my father!', an exclamation of surprise, like 'good heavens!'"}
          - {w: "haber de", d: "to be bound to, must; '¿cómo han de ser?' = how can they possibly be?"}
          - {w: "demonio", d: "devil, demon"}
          - {w: "fantástico", d: "illusory, made of fantasy (not 'wonderful')"}
          - {w: "estado", d: "state, condition"}
        diagram:
          - {s: "¿Católicas? ¡Mi padre!", r: "exclamation: Catholic? Good heavens!"}
          - {s: "—respondió don Quijote—", r: "speech tag: Don Quijote answered"}
          - s: "¿Cómo han de ser católicas"
            r: "main verb, a question: how can they be catholic"
            under:
              - s: "si son todos demonios"
                r: "condition: if (since) they are all devils"
                under:
                  - s: "que han tomado cuerpos fantásticos"
                    r: "describes 'demonios': who have taken illusory bodies"
                    under:
                      - {s: "para venir a hacer esto y a ponerme en este estado", r: "why: to come and do this and put me in this state"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "han de ser", f: "han (haber (to have), present, they: he, has, ha, hemos, habéis, han) + de + ser (to be): 'haber de' + infinitive = must, are bound to."}
          - {w: "son", f: "ser (to be), present, they. soy, eres, es, somos, sois, son."}
          - {w: "han tomado", f: "han (haber (to have), present, they: he, has, ha, hemos, habéis, han) + tomado, the participle of tomar (to take): 'have taken'."}
          - {w: "ponerme", f: "poner (to put) + me, the pronoun hung on the infinitive after 'a'; 'venir a hacer ... y a ponerme' = come to do ... and to put me."}
          - {w: "este", f: "'this', masculine singular to match 'estado'."}
      - es: "Y si quieres ver esta verdad, tócalos y pálpalos, y verás como no tienen cuerpo sino de aire, y como no consiste más de en la apariencia."
        literal: "And if you-want to-see this truth, touch-them and feel-them, and you-will-see how not they-have body except of air, and how not it-consists more than in the appearance."
        ormsby: "And if thou wouldst prove it, touch them, and feel them, and thou wilt find they have only bodies of air, and no consistency except in appearance.”"
        vocab:
          - {w: "palpar", d: "to feel, touch with the hands"}
          - {w: "como", d: "here 'that, how' (introducing what he will see)"}
          - {w: "no ... sino", d: "only, nothing but"}
          - {w: "no ... más de", d: "no more than, only"}
          - {w: "consistir en", d: "to consist in, lie in"}
          - {w: "apariencia", d: "appearance, outward show"}
        diagram:
          - s: "tócalos y pálpalos"
            r: "main verb 1: touch them and feel them"
            under:
              - {s: "Y si quieres ver esta verdad", r: "condition: and if you want to see this truth"}
          - s: "y verás"
            r: "main verb 2: and you will see"
            under:
              - {s: "como no tienen cuerpo sino de aire", r: "what you will see, 1: that they have only bodies of air"}
              - {s: "y como no consiste más de en la apariencia", r: "what you will see, 2: and that (their body) is nothing but appearance"}
        forms:
          - {w: "quieres", f: "quier- + -es → querer (to want), present, you (tú). The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
