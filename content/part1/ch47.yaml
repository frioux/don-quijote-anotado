  - sentences:
      - es: "— Señor, lo que significa ir este caballero desta manera, dígalo él, porque nosotros no lo sabemos."
        literal: "— Sir, that which means to-go this knight of-this manner, let-him-say-it he, because we not it know."
        ormsby: "“Let the gentleman himself tell you the meaning of his going this way, señor, for we do not know.”"
        vocab:
          - {w: "desta", d: "= de esta, of this (old contraction)"}
        diagram:
          - s: "dígalo él"
            r: "main verb: let him say it himself"
            under:
              - {s: "lo que significa ir este caballero desta manera", r: "object, put first: what it means for this knight to travel like this"}
              - {s: "porque nosotros no lo sabemos", r: "why: because we don't know"}
        forms:
          - {w: "significa", f: "signific- + -a → significar (to mean), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "ir este caballero", f: "infinitive of ir (to go) with its own subject 'este caballero': 'this knight's going'."}
          - {w: "desta", f: "de + esta (of this), fused as Cervantes often does."}
          - {w: "dígalo", f: "dig- + -a + lo → decir (to say), present subjunctive, he, with 'lo' (it) stuck on the end: 'let him say it'. Irregular: diga, digas, diga, digamos, digáis, digan. A subjunctive command hangs the pronoun on the end."}
          - {w: "sabemos", f: "sab- + -emos → saber (to know), present, we. Irregular in 'I': sé, sabes, sabe, sabemos, sabéis, saben."}
        note: "The trooper slyly passes the question on: the troopers know the 'enchantment' is a trick, and let the madman explain himself."
