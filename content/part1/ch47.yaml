          - {w: "del todo", d: "completely, wholly"}
          - {w: "inculto", d: "uncultured, uneducated"}
          - {w: "contentarse", d: "to be satisfied, take pleasure"}
          - {w: "la mar", d: "the sea; 'mar' was often feminine in older and poetic Spanish"}
          - {w: "por la mar adelante", d: "onward across the sea"}
          - {w: "próspero viento", d: "favorable wind"}
          - {w: "anochecer", d: "to be somewhere at nightfall; 'anochece en Lombardía' = is in Lombardy by night"}
          - {w: "amanecer", d: "to be somewhere at daybreak"}
          - {w: "Preste Juan de las Indias", d: "Prester John, the legendary Christian priest-king of the East, placed in India or Ethiopia"}
