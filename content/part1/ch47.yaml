                  - {s: "cuando tuviese comodidad", r: "when: when he had the chance"}
        forms:
          - {w: "guardó", f: "guard- + -ó → guardar (to keep), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "la, leerla", f: "'la' = it, feminine for 'novela'; in 'leerla' it is hung on the infinitive leer (to read) after 'de'."}
          - {w: "tuviese", f: "tuv- + -iese → tener (to have), imperfect subjunctive (-se form), he: tuviese, tuvieses, tuviese, tuviésemos, tuvieseis, tuviesen. Subjunctive after 'cuando' for a time still to come."}
  - sentences:
      - es: "Subió a caballo, y también su amigo el barbero, con sus antifaces, porque no fuesen luego conocidos de don Quijote, y pusiéronse a caminar tras el carro."
        literal: "He-climbed on horse, and also his friend the barber, with their masks, so-that not they-might-be at-once recognized by Don Quijote, and put-themselves to travel behind the cart."
        ormsby: "He then mounted and his friend the barber did the same, both masked, so as not to be recognised by Don Quixote, and set out following in the rear of the cart."
        vocab:
          - {w: "subir a caballo", d: "to mount, get on horseback (here on a mule)"}
          - {w: "antifaz", d: "mask, a cloth over the face; plural 'antifaces'"}
          - {w: "porque", d: "here 'so that' (purpose, with the subjunctive), not 'because'"}
          - {w: "luego", d: "at once, straight away"}
          - {w: "conocer", d: "here 'to recognize'"}
          - {w: "ponerse a", d: "to start to, set about"}
          - {w: "tras", d: "behind, after"}
        diagram:
          - s: "Subió a caballo"
            r: "main verb 1: he (the priest) mounted"
            under:
              - {s: "y también su amigo el barbero", r: "subject added: and his friend the barber too"}
              - {s: "con sus antifaces", r: "how: with their masks on"}
              - {s: "porque no fuesen luego conocidos de don Quijote", r: "why: so they would not be recognized by Don Quijote right away"}
          - s: "y pusiéronse a caminar"
            r: "main verb 2: and they set off"
            under:
              - {s: "tras el carro", r: "where: behind the cart"}
        forms:
          - {w: "Subió", f: "sub- + -ió → subir (to climb, go up), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "antifaces", f: "plural of antifaz (mask): z becomes c before -es."}
          - {w: "fuesen ... conocidos", f: "fu- + -esen → ser (to be), imperfect subjunctive (-se form), they: fuese, fueses, fuese, fuésemos, fueseis, fuesen; + conocidos, the participle of conocer (to recognize), plural to match the priest and barber: the passive, 'be recognized'. Subjunctive after 'porque' meaning 'so that'."}
          - {w: "pusiéronse", f: "pus- + -ieron + se → ponerse (to set about), preterite, they, with 'se' stuck on the end; modern 'se pusieron'. Irregular: puse, pusiste, puso, pusimos, pusisteis, pusieron. Cervantes hangs the pronoun on a verb that opens its clause."}
        note: "The priest and the barber wear masks so that Don Quijote will not recognize them as his neighbours; to him they are part of the enchantment."
      - es: "Y la orden que llevaban era ésta: iba primero el carro, guiándole su dueño; a los dos lados iban los cuadrilleros, como se ha dicho, con sus escopetas; seguía luego Sancho Panza sobre su asno, llevando de rienda a Rocinante."
        literal: "And the order that they-kept was this: went first the cart, guiding-it its owner; at the two sides went the troopers, as itself has said, with their muskets; followed then Sancho Panza upon his donkey, leading by rein [to] Rocinante."
        ormsby: "The order of march was this: first went the cart with the owner leading it; at each side of it marched the officers of the Brotherhood, as has been said, with their muskets; then followed Sancho Panza on his ass, leading Rocinante by the bridle;"
        vocab:
          - {w: "la orden", d: "the order of march; Cervantes makes 'orden' feminine here, modern 'el orden' for arrangement"}
          - {w: "llevar", d: "here 'to keep, follow' (an order of march)"}
          - {w: "guiar", d: "to guide, lead"}
          - {w: "cuadrilleros", d: "troopers of the Holy Brotherhood (Santa Hermandad), the rural police"}
          - {w: "como se ha dicho", d: "as has been said"}
          - {w: "escopeta", d: "musket, firearm"}
          - {w: "llevar de rienda", d: "to lead by the rein"}
        diagram:
          - s: "Y la orden que llevaban era ésta:"
            r: "main verb 1: and the order they kept was this"
          - s: "iba primero el carro"
            r: "main verb 2: first went the cart"
            under:
              - {s: "guiándole su dueño", r: "how: its owner leading it"}
          - s: "a los dos lados iban los cuadrilleros"
            r: "main verb 3: on both sides went the troopers"
            under:
              - {s: "como se ha dicho", r: "aside: as has been said"}
              - {s: "con sus escopetas", r: "with what: with their muskets"}
          - s: "seguía luego Sancho Panza sobre su asno"
            r: "main verb 4: then came Sancho Panza on his donkey"
            under:
              - {s: "llevando de rienda a Rocinante", r: "how: leading Rocinante by the rein"}
        forms:
          - {w: "llevaban", f: "llev- + -aban → llevar (to keep, carry), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "era", f: "ser (to be), imperfect, it. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "ésta", f: "este (this) as a pronoun, feminine to match 'la orden', written with an accent."}
          - {w: "iba, iban", f: "ir (to go), imperfect, it / they. Irregular: iba, ibas, iba, íbamos, ibais, iban."}
          - {w: "guiándole", f: "gerund of guiar (to guide) + le (it, the cart; masculine 'le' for a thing, a leísmo); accent added. Its subject 'su dueño' follows."}
          - {w: "se ha dicho", f: "ha (haber (to have), present, it: he, has, ha, hemos, habéis, han) + dicho, the irregular participle of decir (to say); 'se' makes it impersonal: 'as has been said'."}
          - {w: "seguía", f: "segu- + -ía → seguir (to follow), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "llevando", f: "gerund of llevar (to lead): 'leading'."}
          - {w: "a Rocinante", f: "the personal 'a' before a named animal used as object."}
        note: "In Chapter 45 the troopers were three, and Ormsby notes that later in the book they carry crossbows, not muskets: one of Cervantes' small inconsistencies."
      - es: "Detrás de todo esto iban el cura y el barbero sobre sus poderosas mulas, cubiertos los rostros, como se ha dicho, con grave y reposado continente, no caminando más de lo que permitía el paso tardo de los bueyes."
        literal: "Behind of all this went the priest and the barber upon their mighty mules, covered the faces, as itself has said, with grave and composed bearing, not travelling more than that which allowed the pace slow of the oxen."
        ormsby: "and behind all came the curate and the barber on their mighty mules, with faces covered, as aforesaid, and a grave and serious air, measuring their pace to suit the slow steps of the oxen."
        vocab:
          - {w: "poderoso", d: "mighty, powerful: mock-heroic for their mules"}
          - {w: "rostro", d: "face"}
          - {w: "reposado", d: "calm, sedate, composed"}
          - {w: "continente", d: "bearing, countenance, demeanour (false friend)"}
          - {w: "tardo", d: "slow, sluggish (literary)"}
        diagram:
          - s: "Detrás de todo esto iban el cura y el barbero"
            r: "main verb: behind all this went the priest and the barber"
            under:
              - {s: "sobre sus poderosas mulas", r: "on what: on their mighty mules"}
              - {s: "cubiertos los rostros", r: "how: their faces covered"}
              - {s: "como se ha dicho", r: "aside: as has been said"}
              - {s: "con grave y reposado continente", r: "how: with a grave and composed air"}
              - s: "no caminando más"
                r: "how: going no faster"
                under:
                  - {s: "de lo que permitía el paso tardo de los bueyes", r: "than what: than the oxen's slow pace allowed"}
        forms:
          - {w: "iban", f: "ir (to go), imperfect, they. Irregular: iba, ibas, iba, íbamos, ibais, iban."}
          - {w: "poderosas", f: "poderos- + -as → poderoso (mighty), feminine plural to match 'mulas'."}
          - {w: "cubiertos los rostros", f: "cubiertos is the irregular participle of cubrir (to cover), plural to match 'rostros': an absolute participle, 'with their faces covered'."}
          - {w: "se ha dicho", f: "ha (haber (to have), present, it: he, has, ha, hemos, habéis, han) + dicho, participle of decir (to say), with impersonal 'se': 'as has been said'."}
          - {w: "reposado", f: "participle of reposar (to rest), used as an adjective: 'calm'."}
          - {w: "caminando", f: "gerund of caminar (to travel, walk): 'going'."}
          - {w: "permitía", f: "permit- + -ía → permitir (to allow), imperfect, it (the pace). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
      - es: "Don Quijote iba sentado en la jaula, las manos atadas, tendidos los pies, y arrimado a las verjas, con tanto silencio y tanta paciencia como si no fuera hombre de carne, sino estatua de piedra."
        literal: "Don Quijote went seated in the cage, the hands tied, stretched-out the feet, and leaning against the bars, with so-much silence and so-much patience as if not he-were man of flesh, but statue of stone."
        ormsby: "Don Quixote was seated in the cage, with his hands tied and his feet stretched out, leaning against the bars as silent and as patient as if he were a stone statue and not a man of flesh."
        vocab:
          - {w: "jaula", d: "cage"}
          - {w: "tendido", d: "stretched out"}
          - {w: "arrimado a", d: "leaning against"}
          - {w: "verja", d: "bar, grating (of the cage)"}
          - {w: "tanto ... como", d: "as much ... as"}
        diagram:
          - s: "Don Quijote iba sentado"
            r: "main verb: Don Quijote rode seated"
            under:
              - {s: "en la jaula", r: "where: in the cage"}
              - {s: "las manos atadas", r: "how, 1: his hands tied"}
              - {s: "tendidos los pies", r: "how, 2: his feet stretched out"}
              - {s: "y arrimado a las verjas", r: "how, 3: and leaning against the bars"}
              - s: "con tanto silencio y tanta paciencia"
                r: "how, 4: with as much silence and patience"
                under:
                  - {s: "como si no fuera hombre de carne, sino estatua de piedra", r: "as what: as if he were not a man of flesh but a stone statue"}
        forms:
          - {w: "iba sentado", f: "iba (ir (to go), imperfect, he: iba, ibas, iba, íbamos, ibais, iban) + sentado, the participle of sentar (to seat): 'ir' + participle is a vivid way of saying 'was (sitting)'."}
          - {w: "las manos atadas", f: "atadas is the participle of atar (to tie), feminine plural to match 'manos': an absolute participle, 'with his hands tied'."}
          - {w: "tendidos los pies", f: "tendidos, the participle of tender (to stretch out), masculine plural for 'pies', put first: 'his feet stretched out'."}
          - {w: "arrimado", f: "participle of arrimar (to lean), masculine singular to match Don Quijote."}
          - {w: "tanto, tanta", f: "tanto (so much), masculine to match 'silencio', feminine 'tanta' to match 'paciencia'."}
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), he: fuera, fueras, fuera, fuéramos, fuerais, fueran. 'como si' (as if) always takes the imperfect subjunctive."}
  - sentences:
      - es: "Y así, con aquel espacio y silencio caminaron hasta dos leguas, que llegaron a un valle, donde le pareció al boyero ser lugar acomodado para reposar y dar pasto a los bueyes;"
        literal: "And so, with that slowness and silence they-travelled up-to two leagues, when they-arrived at a valley, where to-him it-seemed to-the ox-driver to-be place suitable to rest and to-give pasture to the oxen;"
        ormsby: "Thus slowly and silently they made, it might be, two leagues, until they reached a valley which the carter thought a convenient place for resting and feeding his oxen,"
        vocab:
          - {w: "espacio", d: "slowness, leisure (old sense); 'con espacio' = slowly"}
          - {w: "hasta", d: "here 'about, as many as' before a number"}
          - {w: "legua", d: "league, about three miles; an hour's walk"}
          - {w: "boyero", d: "ox-driver, the owner of the ox-cart"}
          - {w: "acomodado", d: "suitable, convenient"}
          - {w: "reposar", d: "to rest"}
          - {w: "pasto", d: "pasture, grazing; 'dar pasto' = to feed, let graze"}
        diagram:
          - s: "caminaron hasta dos leguas"
            r: "main verb: they went some two leagues"
            under:
              - {s: "Y así, con aquel espacio y silencio", r: "how: and so, slowly and silently"}
              - s: "que llegaron a un valle"
                r: "when: until they came to a valley"
                under:
                  - s: "donde le pareció al boyero"
                    r: "describes 'valle': where it seemed to the ox-driver"
                    under:
                      - {s: "ser lugar acomodado para reposar y dar pasto a los bueyes", r: "what seemed: to be a good place to rest and graze the oxen"}
        forms:
          - {w: "caminaron, llegaron", f: "camin- + -aron → caminar (to travel), lleg- + -aron → llegar (to arrive), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "aquel", f: "'that', masculine to match 'espacio'."}
          - {w: "le pareció al boyero", f: "parec- + -ió → parecer (to seem), preterite, it. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron. 'le' and 'al boyero' both name the same person, a doubling Spanish likes."}
          - {w: "ser", f: "infinitive of ser (to be) after 'pareció': 'it seemed (to be)'."}
          - {w: "acomodado", f: "participle of acomodar (to suit), used as an adjective, masculine to match 'lugar'."}
      - es: "y, comunicándolo con el cura, fue de parecer el barbero que caminasen un poco más, porque él sabía, detrás de un recuesto que cerca de allí se mostraba, había un valle de más yerba y mucho mejor que aquel donde parar querían."
        literal: "and, communicating-it with the priest, was of opinion the barber that they-should-travel a little more, because he knew, behind a slope that near from there itself showed, there-was a valley of more grass and much better than that-one where to-stop they-wanted."
        ormsby: "and he said so to the curate, but the barber was of opinion that they ought to push on a little farther, as at the other side of a hill which appeared close by he knew there was a valley that had more grass and much better than the one where they proposed to halt;"
        vocab:
          - {w: "comunicar con", d: "to discuss with, tell"}
          - {w: "ser de parecer", d: "to be of the opinion"}
          - {w: "recuesto", d: "slope, hillside (rare)"}
          - {w: "mostrarse", d: "to appear, be seen"}
          - {w: "yerba", d: "= hierba, grass (old spelling, still used)"}
        diagram:
          - {s: "comunicándolo con el cura", r: "when: when he (the ox-driver) told the priest"}
          - s: "fue de parecer el barbero"
            r: "main verb: the barber was of the opinion"
            under:
              - {s: "que caminasen un poco más", r: "his opinion: that they should go on a little farther"}
              - s: "porque él sabía"
                r: "why: because he knew"
                under:
                  - s: "detrás de un recuesto"
                    r: "where: behind a slope"
                    under:
                      - {s: "que cerca de allí se mostraba", r: "describes 'recuesto': which could be seen near there"}
                  - s: "había un valle de más yerba y mucho mejor"
                    r: "what he knew: there was a valley with more grass and much better"
                    under:
                      - {s: "que aquel donde parar querían", r: "than what: than the one where they wanted to stop"}
        forms:
          - {w: "comunicándolo", f: "gerund of comunicar (to tell, discuss) + lo (it); accent added once the pronoun is hung on."}
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, he. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "caminasen", f: "camin- + -asen → caminar (to travel), imperfect subjunctive (-se form), they: 'that they should go on'. The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "sabía", f: "sab- + -ía → saber (to know), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían. 'que' is left out before 'había'."}
          - {w: "se mostraba", f: "mostr- + -aba → mostrarse (to appear), imperfect, it, with 'se'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "había", f: "hab- + -ía → haber (there to be), imperfect: 'there was'. había, habías, había, habíamos, habíais, habían."}
          - {w: "parar querían", f: "quer- + -ían → querer (to want), imperfect, they, with its infinitive parar (to stop) put first. Same -ía imperfect."}
      - es: "Tomóse el parecer del barbero, y así, tornaron a proseguir su camino."
        literal: "Took-itself the opinion of-the barber, and so, they-returned to continue their way."
        ormsby: "and his advice was taken and they continued their journey."
        vocab:
          - {w: "parecer", d: "opinion, advice (as a noun)"}
          - {w: "tornar a", d: "to do again; 'tornaron a proseguir' = they went on again"}
          - {w: "proseguir", d: "to continue, go on"}
        diagram:
          - s: "Tomóse el parecer del barbero"
            r: "main verb 1: the barber's advice was taken"
          - s: "y así, tornaron a proseguir su camino"
            r: "main verb 2: and so they went on their way again"
