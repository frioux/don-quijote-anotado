          - {w: "estaban", f: "est- + -aban → estar (to be), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "fuese descubierto", f: "fuese (ser (to be), imperfect subjunctive, -se form, it: fuese, fueses, fuese, fuésemos, fueseis, fuesen) + descubierto, the irregular participle of descubrir (to discover): the passive, 'be discovered'. Subjunctive after 'de modo que' for purpose."}
