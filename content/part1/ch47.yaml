              - {s: "de la cofradía de vuestro amo", r: "what: of your master's brotherhood"}
        forms:
          - {w: "Adóbame", f: "adob- + -a + me → adobar (to trim, fix), imperative, you (tú), with 'me' stuck on the end ('for me', a pronoun of interest); accent added to keep the stress. The tú imperative of -ar verbs looks like the he form of the present: adoba, mira, toma."}
          - {w: "esos", f: "ese (that), masculine plural to match 'candiles'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "sois", f: "ser (to be), present, you (vos): soy, eres, es, somos, sois, son. 'vos' takes the plural form even when it means one person."}
          - {w: "vuestro", f: "the possessive that goes with 'vos': 'your'."}
        note: "The barber now uses 'vos', the you of a master to a servant. The 'brotherhood' is Don Quijote's madness: the barber pretends that Sancho is catching it."
