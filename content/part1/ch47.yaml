          - {w: "me ha puesto", f: "ha (haber (to have), present, he: he, has, ha, hemos, habéis, han) + puesto, the irregular participle of poner (to put): 'has put me'."}
      - es: "que si de ellas me veo libre, no se me caerá de la memoria las mercedes que en este castillo me habedes fecho, para gratificallas, servillas y recompensallas como ellas merecen."
        literal: "for if from them myself I-see free, not itself from-me will-fall from the memory the favors that in this castle to-me you-have done, in-order to-reward-them, to-serve-them and to-repay-them as they deserve."
        ormsby: "and should I find myself released therefrom, the favours that ye have bestowed upon me in this castle shall be held in memory by me, that I may acknowledge, recognise, and requite them as they deserve.”"
        vocab:
          - {w: "verse libre de", d: "to find oneself free of"}
          - {w: "caerse de la memoria", d: "to slip from one's memory"}
          - {w: "merced", d: "favor, kindness"}
          - {w: "castillo", d: "castle: Don Quijote still takes the inn for a castle"}
          - {w: "habedes", d: "= habéis, you have (old form of the chivalric romances)"}
          - {w: "gratificar", d: "to reward, show gratitude for"}
          - {w: "recompensar", d: "to repay, requite"}
        diagram:
          - s: "no se me caerá de la memoria las mercedes"
            r: "main verb (after 'que', for): the favours will not slip from my memory"
            under:
              - {s: "si de ellas me veo libre", r: "condition: if I find myself free of them (the prisons)"}
              - {s: "que en este castillo me habedes fecho", r: "describes 'mercedes': that you have done me in this castle"}
              - s: "para gratificallas, servillas y recompensallas"
                r: "why: so as to reward, serve and repay them"
                under:
                  - {s: "como ellas merecen", r: "how: as they deserve"}
        forms:
          - {w: "ellas", f: "'them', feminine plural because it stands for 'prisiones'; the second 'ellas' stands for 'mercedes'."}
          - {w: "me veo", f: "ve- + -o → verse (to see oneself), present, I, with 'me'. ver (to see) in the present: veo, ves, ve, vemos, veis, ven."}
          - {w: "no se me caerá", f: "caer- + -á → caerse (to fall), future, it, with 'se' and 'me' (from me). The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án. Singular although the subject 'las mercedes' is plural: a loose agreement with a subject that comes later."}
          - {w: "este", f: "'this', masculine singular to match 'castillo'."}
          - {w: "me habedes fecho", f: "habedes, the old form of habéis (haber (to have), present, you plural: he, has, ha, hemos, habéis, han) + fecho, old form of hecho, participle of hacer (to do): 'you have done me'."}
          - {w: "gratificallas, servillas, recompensallas", f: "gratificar (to reward), servir (to serve), recompensar (to repay) + las (them, the favours): the -r of the infinitive plus l- of the pronoun becomes -ll-, so gratificallas = gratificarlas, servillas = servirlas, recompensallas = recompensarlas."}
          - {w: "merecen", f: "merec- + -en → merecer (to deserve), present, they. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (but merezco, with z, for I)."}
        note: "To the end Don Quijote treats the inn as a castle and the landlady's family as noble ladies, though they are pretending to weep and helped to cage him."
  - sentences:
      - es: "En tanto que las damas del castillo esto pasaban con don Quijote, el cura y el barbero se despidieron de don Fernando y sus camaradas, y del capitán y de su hermano y todas aquellas contentas señoras, especialmente de Dorotea y Luscinda."
        literal: "In so-much that the ladies of-the castle this were-passing with Don Quijote, the priest and the barber themselves took-leave of Don Fernando and his comrades, and of-the captain and of his brother and all those contented ladies, especially of Dorotea and Luscinda."
        ormsby: "While this was passing between the ladies of the castle and Don Quixote, the curate and the barber bade farewell to Don Fernando and his companions, to the captain, his brother, and the ladies, now all made happy, and in particular to Dorothea and Luscinda."
        vocab:
          - {w: "en tanto que", d: "while, meanwhile (temporal, not 'in so far as')"}
          - {w: "damas del castillo", d: "the 'ladies of the castle': the innkeeper's wife, her daughter and Maritornes, as Don Quijote sees them"}
          - {w: "pasar algo con alguien", d: "to go through something with someone, have an exchange with them"}
          - {w: "despedirse de", d: "to take leave of, say goodbye to"}
          - {w: "camarada", d: "companion, comrade"}
          - {w: "contento", d: "happy, contented: all their love stories have ended well"}
        diagram:
          - s: "el cura y el barbero se despidieron"
            r: "main verb: the priest and the barber took their leave"
            under:
              - {s: "En tanto que las damas del castillo esto pasaban con don Quijote", r: "when: while the ladies of the castle were going through this with Don Quijote"}
              - {s: "de don Fernando y sus camaradas", r: "of whom, 1: of Don Fernando and his companions"}
              - {s: "y del capitán y de su hermano y todas aquellas contentas señoras", r: "of whom, 2: of the captain, his brother and all those happy ladies"}
              - {s: "especialmente de Dorotea y Luscinda", r: "of whom, 3: especially of Dorotea and Luscinda"}
        forms:
          - {w: "pasaban", f: "pas- + -aban → pasar (to pass, go through), imperfect, they (the ladies). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. 'esto' (this) is its object, placed before the verb."}
          - {w: "se despidieron", f: "despid- + -ieron → despedirse (to take leave), preterite, they, with 'se' (themselves). The e of the stem turns to i in the 'he' and 'they' forms: me despedí, te despediste, se despidió, nos despedimos, os despedisteis, se despidieron."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
          - {w: "aquellas contentas", f: "aquell- + -as → aquel (that), and content- + -as → contento (happy), both feminine plural to match 'señoras'."}
          - {w: "especialmente", f: "especial (special) + -mente, the ending that turns an adjective into an adverb: 'especially'."}
        note: "The cast that gathered at the inn now scatters: Don Fernando and Dorotea, Cardenio and Luscinda, the captive captain and Zoraida, and his brother the judge. Only Don Quijote's party leaves for his village."
      - es: "Todos se abrazaron y quedaron de darse noticia de sus sucesos, diciendo don Fernando al cura dónde había de escribirle para avisarle en lo que paraba don Quijote, asegurándole que no habría cosa que más gusto le diese que saberlo;"
        literal: "All themselves embraced and they-agreed of to-give-themselves news of their happenings, saying Don Fernando to-the priest where he-had to write-him to inform-him in that which was-ending-up Don Quijote, assuring-him that not there-would-be thing that more pleasure to-him might-give than to-know-it;"
        ormsby: "They all embraced one another, and promised to let each other know how things went with them, and Don Fernando directed the curate where to write to him, to tell him what became of Don Quixote, assuring him that there was nothing that could give him more pleasure than to hear of it,"
        vocab:
          - {w: "quedar de", d: "to agree to, promise to (modern 'quedar en')"}
          - {w: "darse noticia", d: "to give each other news, keep each other informed"}
          - {w: "sucesos", d: "what happens to them, their fortunes (not 'successes')"}
          - {w: "haber de", d: "to have to, be to; 'había de escribirle' = he was to write to him"}
          - {w: "avisar", d: "to inform, let know (not 'advise')"}
          - {w: "parar en", d: "to end up as, come to; 'en lo que paraba' = how he ended up"}
          - {w: "asegurar", d: "to assure"}
        diagram:
          - s: "Todos se abrazaron"
            r: "main verb 1: they all embraced"
          - s: "y quedaron"
            r: "main verb 2: and they agreed"
            under:
              - {s: "de darse noticia de sus sucesos", r: "what they agreed: to send each other news of how things went"}
              - s: "diciendo don Fernando al cura"
                r: "how: Don Fernando telling the priest"
                under:
                  - s: "dónde había de escribirle"
                    r: "what he told: where he was to write to him"
                    under:
                      - {s: "para avisarle en lo que paraba don Quijote", r: "why: to let him know what became of Don Quijote"}
              - s: "asegurándole"
                r: "how, 2: assuring him"
                under:
                  - {s: "que no habría cosa que más gusto le diese que saberlo", r: "what he assured: nothing would please him more than knowing it"}
        forms:
          - {w: "se abrazaron", f: "abraz- + -aron → abrazarse (to embrace each other), preterite, they; 'se' is reciprocal here, 'each other'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "quedaron", f: "qued- + -aron → quedar (to agree), preterite, they. Same -ar preterite: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "darse", f: "dar (to give) + se (each other), the pronoun hung on the infinitive after 'de'."}
          - {w: "diciendo", f: "gerund of decir (to say): 'saying, telling'; its subject 'don Fernando' follows it, as is common with a gerund."}
          - {w: "había de escribirle", f: "hab- + -ía → haber (to have), imperfect, he: había, habías, había, habíamos, habíais, habían; 'haber de' + infinitive = to be to, have to. escribir (to write) + le (to him) hung on the end."}
          - {w: "avisarle", f: "avisar (to inform) + le (him), the pronoun hung on the infinitive after 'para'."}
          - {w: "paraba", f: "par- + -aba → parar (to end up), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "asegurándole", f: "gerund of asegurar (to assure) + le (him); an accent is added to keep the stress on -rán- once the pronoun is hung on."}
          - {w: "habría", f: "habr- + -ía → haber (there to be), conditional, it: 'there would be'. Irregular stem habr-: habría, habrías, habría, habríamos, habríais, habrían."}
          - {w: "diese", f: "d- + -iese → dar (to give), imperfect subjunctive (-se form), it: 'that could give'. diese, dieses, diese, diésemos, dieseis, diesen. Subjunctive because the 'cosa' is denied ('no habría cosa que')."}
          - {w: "saberlo", f: "saber (to know) + lo (it), infinitive used as a noun after 'que' (than): 'than knowing it'."}
      - es: "y que él, asimesmo, le avisaría de todo aquello que él viese que podría darle gusto, así de su casamiento como del bautismo de Zoraida, y suceso de don Luis, y vuelta de Luscinda a su casa."
        literal: "and that he, likewise, him would-inform of all that which he might-see that could give-him pleasure, as-much of his marriage as of-the baptism of Zoraida, and outcome of Don Luis, and return of Luscinda to her house."
        ormsby: "and that he too, on his part, would send him word of everything he thought he would like to know, about his marriage, Zoraida’s baptism, Don Luis’s affair, and Luscinda’s return to her home."
        vocab:
          - {w: "asimesmo", d: "= asimismo, likewise, also (old form)"}
