  - sentences:
      - es: "El ventero se llegó al cura y le dio unos papeles, diciéndole que los había hallado en un aforro de la maleta donde se halló la Novela del curioso impertinente, y que, pues su dueño no había vuelto más por allí, que se los llevase todos;"
        literal: "The innkeeper himself drew-near to-the priest and to-him gave some papers, telling-him that them he-had found in a lining of the valise where itself was-found the Novel of-the curious impertinent, and that, since its owner not had returned more by there, that them-to-himself he-should-take all;"
        ormsby: "The landlord approached the curate and handed him some papers, saying he had discovered them in the lining of the valise in which the novel of The Ill-Advised Curiosity had been found, and that he might take them all away with him as their owner had not since returned;"
        vocab:
          - {w: "llegarse a", d: "to come up to, approach"}
          - {w: "aforro", d: "lining (of a bag or garment); modern 'forro'"}
          - {w: "maleta", d: "valise, travelling bag (the one left at the inn by an unknown guest)"}
          - {w: "Novela del curioso impertinente", d: "'The Tale of the Ill-Advised Curiosity', the story the priest read aloud at the inn in earlier chapters"}
          - {w: "pues", d: "since, as (giving a reason)"}
          - {w: "volver por allí", d: "to come back that way"}
        diagram:
          - s: "El ventero se llegó al cura"
            r: "main verb 1: the innkeeper came up to the priest"
          - s: "y le dio unos papeles"
            r: "main verb 2: and gave him some papers"
            under:
              - s: "diciéndole"
                r: "how: telling him"
                under:
                  - s: "que los había hallado en un aforro de la maleta"
                    r: "what he said, 1: that he had found them in a lining of the valise"
                    under:
                      - {s: "donde se halló la Novela del curioso impertinente", r: "describes 'maleta': where the tale of the Ill-Advised Curiosity was found"}
                  - s: "y que ... que se los llevase todos"
                    r: "what he said, 2: and that he should take them all"
                    under:
                      - {s: "pues su dueño no había vuelto más por allí", r: "why: since their owner had never come back that way"}
        forms:
          - {w: "se llegó", f: "lleg- + -ó → llegarse (to come up to), preterite, he, with 'se'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (llegué, with g → gu before e)."}
          - {w: "dio", f: "d- + -io → dar (to give), preterite, he. Irregular, with -er/-ir endings: di, diste, dio, dimos, disteis, dieron."}
          - {w: "diciéndole", f: "gerund of decir (to say) + le (to him); accent added to keep the stress once the pronoun is hung on."}
          - {w: "había hallado", f: "había (haber (to have), imperfect, he: había, habías, había, habíamos, habíais, habían) + hallado, the participle of hallar (to find): the pluperfect, 'he had found'."}
          - {w: "se halló", f: "hall- + -ó → hallar (to find), preterite, it, with 'se' making it passive: 'was found'. Same -ar preterite: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "había vuelto", f: "había (haber (to have), imperfect, he: había, habías, había, habíamos, habíais, habían) + vuelto, the irregular participle of volver (to return): 'had returned'."}
          - {w: "que se los llevase", f: "llev- + -ase → llevarse (to take away), imperfect subjunctive (-se form), he: 'that he should take them'. The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. 'se' + 'los' = for himself + them. The 'que' is repeated after the 'pues' clause, a common habit in Cervantes' reported speech."}
          - {w: "todos", f: "masculine plural to match 'los' (the papers)."}
        note: "The valise was left at the inn by a traveller, and the innkeeper had produced 'The Ill-Advised Curiosity' from it for the priest to read aloud. Now more papers turn up in its lining."
