        ormsby: "“Haply, gentlemen, you are versed and learned in matters of errant chivalry?"
        vocab:
          - {w: "por dicha", d: "by chance, perhaps (old)"}
          - {w: "vuestras mercedes", d: "your worships, the polite 'you' (plural), taking a 'they' verb"}
          - {w: "versado en", d: "versed in, knowledgeable about"}
          - {w: "perictos", d: "= peritos, expert, skilled (old spelling)"}
          - {w: "esto de", d: "this matter of"}
