        forms:
          - {w: "sabía", f: "sab- + -ía → saber (to know how), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "quería", f: "quer- + -ía → querer (to want), imperfect, he. Same -ía imperfect."}
          - {w: "los", f: "'them', masculine plural for 'papeles', placed before the verb."}
        note: "Yet the same innkeeper was a keen listener to books of chivalry read aloud at harvest time; reading was a shared, spoken pleasure for the many who could not read."
      - es: "El cura se lo agradeció, y, abriéndolos luego, vio que al principio de lo escrito decía:"
        literal: "The priest to-him it thanked, and, opening-them at-once, he-saw that at-the beginning of that written it-said:"
        ormsby: "The curate thanked him, and opening them he saw at the beginning of the manuscript the words,"
        vocab:
          - {w: "agradecer", d: "to thank for; 'se lo agradeció' = thanked him for it"}
          - {w: "luego", d: "at once, right away (the old meaning), not 'later'"}
          - {w: "lo escrito", d: "what was written, the manuscript"}
        diagram:
          - s: "El cura se lo agradeció"
            r: "main verb 1: the priest thanked him for it"
          - s: "vio"
            r: "main verb 2 (after 'y'): he saw"
            under:
              - {s: "abriéndolos luego", r: "when: opening them at once"}
              - s: "que al principio de lo escrito decía:"
                r: "what he saw: that at the top of the manuscript it said"
        forms:
          - {w: "se lo", f: "le (to him) becomes 'se' before 'lo' (it): 'se lo agradeció' = thanked him for it."}
          - {w: "agradeció", f: "agradec- + -ió → agradecer (to thank for), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "abriéndolos", f: "gerund of abrir (to open) + los (them, the papers); accent added once the pronoun is hung on."}
          - {w: "vio", f: "v- + -io → ver (to see), preterite, he. vi, viste, vio, vimos, visteis, vieron."}
          - {w: "escrito", f: "irregular participle of escribir (to write), made a noun with neuter 'lo': 'what was written'."}
          - {w: "decía", f: "dec- + -ía → decir (to say), imperfect, it: 'it said', the usual way to say what a text reads. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
      - es: "Novela de Rinconete y Cortadillo, por donde entendió ser alguna novela y coligió que, pues la del Curioso impertinente había sido buena, que también lo sería aquélla, pues podría ser fuesen todas de un mesmo autor;"
        literal: "Novel of Rinconete and Cortadillo, by where he-understood to-be some novel and he-gathered that, since the [one] of-the Curious impertinent had been good, that also it would-be that-one, since it-could be they-were all of one same author;"
        ormsby: "“Novel of Rinconete and Cortadillo,” by which he perceived that it was a novel, and as that of The Ill-Advised Curiosity had been good he concluded this would be so too, as they were both probably by the same author;"
        ormsby_note: "Rinconete y Cortadillo is the third of the Novelas Ejemplares published by Cervantes in 1613. From this we may assume that the Curioso Impertinente was written about the same time, i.e. during his residence in Seville."
        vocab:
          - {w: "novela", d: "a short tale, novella (in the Italian sense), not a full-length novel"}
          - {w: "Rinconete y Cortadillo", d: "Cervantes' own tale of two boy thieves in the underworld of Seville, later printed among his Novelas ejemplares"}
          - {w: "por donde", d: "from which, whereby"}
          - {w: "colegir", d: "to gather, infer, conclude"}
          - {w: "mesmo", d: "= mismo, same (old form)"}
        diagram:
          - s: "Novela de Rinconete y Cortadillo"
            r: "what the manuscript said (after 'decía' in the previous sentence)"
          - s: "entendió"
            r: "main verb 1: he understood"
            under:
              - {s: "por donde", r: "from what: from which"}
              - {s: "ser alguna novela", r: "what he understood: that it was some tale"}
          - s: "y coligió"
            r: "main verb 2: and he concluded"
            under:
              - s: "que ... que también lo sería aquélla"
                r: "what he concluded: that that one too would be (good)"
                under:
                  - {s: "pues la del Curioso impertinente había sido buena", r: "why, 1: since the one about the Ill-Advised Curiosity had been good"}
                  - {s: "pues podría ser fuesen todas de un mesmo autor", r: "why, 2: since they might all be by the same author"}
        forms:
          - {w: "entendió", f: "entend- + -ió → entender (to understand), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "ser", f: "infinitive of ser (to be) with the subject 'alguna novela': 'that it was'; Cervantes often uses the infinitive where modern Spanish says 'que era'."}
          - {w: "alguna", f: "algun- + -a → alguno (some), feminine to match 'novela'."}
          - {w: "coligió", f: "colig- + -ió → colegir (to infer), preterite, he. The e of the stem turns to i in the 'he' and 'they' forms: colegí, colegiste, coligió, colegimos, colegisteis, coligieron."}
          - {w: "había sido", f: "había (haber (to have), imperfect, it: había, habías, había, habíamos, habíais, habían) + sido, the participle of ser (to be): 'had been'."}
          - {w: "sería", f: "ser- + -ía → ser (to be), conditional, it: 'would be'. The conditional adds endings to the whole infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "lo sería", f: "'lo' stands for the adjective 'buena': 'would be so too'."}
          - {w: "aquélla", f: "aquel (that) as a pronoun, feminine for 'novela', written with an accent: 'that one'."}
          - {w: "podría ser", f: "podr- + -ía → poder (to be able), conditional, it: 'it might be'. Irregular stem podr-: podría, podrías, podría, podríamos, podríais, podrían."}
          - {w: "fuesen", f: "fu- + -esen → ser (to be), imperfect subjunctive (-se form), they: fuese, fueses, fuese, fuésemos, fueseis, fuesen. 'que' is left out after 'podría ser'."}
          - {w: "mesmo", f: "old form of mismo (same)."}
        note: "An in-joke: Cervantes advertises his own unpublished story inside his novel. The priest guesses that both tales are by one author, and indeed they are, Cervantes himself."
      - es: "y así, la guardó, con prosupuesto de leerla cuando tuviese comodidad."
        literal: "and so, it he-kept, with intention of reading-it when he-might-have convenience."
        ormsby: "so he kept it, intending to read it when he had an opportunity."
