summary: |
  Shut in a wooden cage on an ox-cart, Don Quijote is puzzled: enchanted knights in his books are carried off through the air in clouds or chariots of fire, not at the pace of oxen, so perhaps enchantments have changed along with chivalry. Sancho suspects the 'apparitions' are not quite Catholic, but notes that the devil bustling about them smells of amber, not brimstone. Don Quijote explains that devils carry hell with them and cannot smell sweet, so this one must be deceiving him.

  Fearing Sancho will see through the trick, Don Fernando and Cardenio hurry the departure. The priest hires the officers of the Holy Brotherhood to escort the cart to the village. The landlady, her daughter and Maritornes pretend to weep, and Don Quijote makes them a courtly farewell. The priest and the barber take leave of Don Fernando, the captain and the ladies, with promises to exchange news, and the landlord gives the priest some papers found in the same trunk as the 'Curioso impertinente': another novel, 'Rinconete y Cortadillo', which the priest keeps to read later. The procession sets off, the masked priest and barber riding behind, Don Quijote silent as a statue in his cage.

  On the road a canon of Toledo and his servants overtake them and ask why the man is caged. Don Quijote declares himself a knight-errant enchanted by envious magicians, and the priest backs him up in the same high style, to the canon's astonishment. Sancho then tells everyone that his master is no more enchanted than his mother, since he eats, drinks and answers the calls of nature, and accuses the priest, whom he recognizes behind the mask, of robbing him of his countship. The barber mocks him, and Sancho answers with a string of proverbs.

  The priest draws the canon ahead and tells him the whole story of Don Quijote's madness. The canon replies with a long criticism of the books of chivalry: they delight without teaching, are full of absurdities, lack unity and verisimilitude, and deserve banishment from a Christian commonwealth. The priest tells him how he burned Don Quijote's library, and the canon admits one good thing in the books: their open field lets a gifted writer show every kind of knowledge and character, and write an epic in prose.
context: |
  The cage and the road home. The priest's plan from the previous chapter is now in motion: Don Quijote is going home caged on an ox-cart, escorted by the officers of the Santa Hermandad, the rural police of Castile, who are paid by the day. Ormsby points out an inconsistency here: earlier the officers were three, and later we learn they carried crossbows, not the muskets mentioned now. The ox-cart is slow and humble, which is exactly what troubles Don Quijote; in the romances enchanted knights travel through the air in clouds, fiery chariots, or on a hippogriff, the winged horse of Ariosto's Orlando Furioso.

  Devils and perfume. Sancho's test is a popular belief: devils were said to stink of sulphur ('piedra azufre', brimstone), the smell of hell. Don Fernando smells of amber because he is a great lord, and perfumed gloves and clothes scented with ambergris were a luxury of the nobility. Don Quijote's theological reply, that devils carry hell with them wherever they go, echoes a commonplace of the preachers. Zoroaster, whom he names as the inventor of magic, was traditionally credited with that role in Renaissance learning.

  Books inside the book. The landlord's papers contain 'Rinconete y Cortadillo', a novella Cervantes himself later published among his Novelas ejemplares (1613), as Ormsby notes; it is a little joke that his own unpublished work turns up in the inn's lost luggage. The canon of Toledo, a learned churchman, is a new kind of reader: he has read the beginnings of almost all the books of chivalry and can finish none. His critique draws on Renaissance literary theory derived from Aristotle and Horace: fiction should 'teach and delight together', keep a unity of beginning, middle and end, and be 'verisimilar', plausible even when invented. The 'Milesian fables' were the racy, frivolous tales of antiquity, while 'apologues' were fables with a moral. Villalpando's 'Súmulas', which the canon says he knows less well than chivalry, was a logic textbook used at the universities, as Ormsby notes. Belianís de Grecia, the sixteen-year-old who cuts a giant in two, was one of the romances in Don Quijote's library.

  The narrator's games. The canon's attack on the books of chivalry is the most direct statement of literary theory in Part I, and it is often read as close to Cervantes' own views; but the canon then praises the 'open field' of the romance as a place where a writer can show every skill, from astrology to statecraft, and an epic in prose. That is a fair description of Don Quijote itself. Sancho, meanwhile, sees through the masks, and his complaint that the priest has cost him his countship is the most clear-sighted speech in the chapter.

  Sancho's proverbs. Ormsby numbers most of Sancho's sayings as proverbs from the collections of the time: the wheel of Fortune that turns faster than a mill-wheel; each man is the son of his own works; 'there is some difference between Peter and Peter'; not throwing false dice; 'it is worse to stir it'. The barber's 'Adóbame esos candiles' ('trim those lamps for me') is a set exclamation of disbelief. Sancho's boast that he is an 'old Christian' means he has no Jewish or Moorish ancestry, a point of honour in a society obsessed with 'purity of blood'.

  Reading Cervantes' Spanish. The chapter is full of archaisms: estraño (extraño), escuro (oscuro), agora (ahora), ansí (así), fermosas and fecho (hermosas, hecho) in Don Quijote's chivalric speech, habedes and sepades (habéis, sepáis), perictos (peritos), vitoria, perfeción, escrebir, disignio, asimesmo, and fused forms like desta, deso, dellos, destos. Infinitives with -rl- become -ll- (decillas, gratificallas, meneallo, dallas). Pronouns hang on clause-opening verbs (Tomóse, saludáronse, Hízolo, adelantóse, parecióle), the future subjunctive marks open futures (dijere, quisiéredes, leyeren, huyere, quisiere), the -ra form serves as conditional (fuera, estuviera), and 'responderles hía' is the old split conditional, the pronoun set between the infinitive and the ending. Watch the false friends: discreto (sensible), curioso (meddlesome), república (commonwealth), ejercicio (profession), sucesos (events, not successes).
