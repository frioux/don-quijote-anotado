  - sentences:
      - es: "— Ahora, señores, quiéranme bien o quiéranme mal por lo que dijere, el caso de ello es que así va encantado mi señor don Quijote como mi madre;"
        literal: "— Now, sirs, may-you-wish-me well or may-you-wish-me ill for that which I-may-say, the case of it is that as-much goes enchanted my lord Don Quijote as my mother;"
        ormsby: "“Well, sirs, you may like or dislike what I am going to say, but the fact of the matter is, my master, Don Quixote, is just as much enchanted as my mother."
        vocab:
          - {w: "querer bien / querer mal", d: "to like, wish well / to dislike, wish ill; 'quiéranme bien o quiéranme mal' = like it or not"}
          - {w: "el caso de ello es que", d: "the fact of the matter is that"}
          - {w: "así ... como", d: "as much ... as; 'así va encantado ... como mi madre' = he is no more enchanted than my mother, i.e. not at all"}
          - {w: "ir encantado", d: "to be (travelling) under enchantment; 'ir' + participle often just means 'to be'"}
        diagram:
          - s: "el caso de ello es"
            r: "main verb: the fact of it is"
            under:
              - {s: "Ahora, señores", r: "address: now, gentlemen"}
              - {s: "quiéranme bien o quiéranme mal por lo que dijere", r: "concession: whether you like me or not for what I say"}
              - {s: "que así va encantado mi señor don Quijote como mi madre", r: "what the fact is: that my master is as enchanted as my mother"}
        forms:
          - {w: "quiéranme", f: "quier- + -an + me → querer (to want; 'querer bien', to like), present subjunctive, they (you, sirs: 'vuestras mercedes' takes the they form), with 'me' stuck on the end: 'like me'. querer (to want) in the present subjunctive: quiera, quieras, quiera, queramos, queráis, quieran. A subjunctive that opens a clause as a wish or command carries its pronoun on the end; the accent is added to keep the stress."}
          - {w: "dijere", f: "dij- + -ere → decir (to say), future subjunctive, I: 'whatever I may say'. Built on the preterite dijeron: dijere, dijeres, dijere, dijéremos, dijereis, dijeren. Cervantes uses it after 'lo que' for an open future; modern Spanish uses the present subjunctive 'diga'."}
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "va encantado", f: "va → ir (to go), present, he: voy, vas, va, vamos, vais, van; + encantado, the participle of encantar (to enchant), masculine to match 'don Quijote': 'goes enchanted', i.e. is enchanted. The subject comes after the verb."}
        note: "Sancho's comparison is a flat denial: his master is exactly as enchanted as Sancho's own mother, that is, not at all. He has guessed that the 'enchantment' is a trick."
