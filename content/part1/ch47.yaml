          - {w: "candil", d: "oil lamp (a hanging iron lamp with a wick)"}
          - {w: "a este punto", d: "at this moment"}
          - {w: "cofradía", d: "confraternity, brotherhood (a lay religious guild); here 'gang, set'"}
          - {w: "vos", d: "you: here the form used to an inferior, with the plural verb"}
        diagram:
          - {s: "¡Adóbame esos candiles!", r: "exclamation: well, listen to that!"}
