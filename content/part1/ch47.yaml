          - {w: "casar con", d: "to marry to, match with"}
          - {w: "fábulas mentirosas", d: "lying fables: works of fiction"}
          - {w: "de suerte que", d: "in such a way that"}
          - {w: "facilitar los imposibles", d: "to make the impossible seem easy, believable"}
          - {w: "allanar", d: "to level, smooth over"}
