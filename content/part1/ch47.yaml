      - es: "Y, si a esto se me respondiese que los que tales libros componen los escriben como cosas de mentira, y que así, no están obligados a mirar en delicadezas ni verdades, responderles hía yo que tanto la mentira es mejor cuanto más parece verdadera, y tanto más agrada cuanto tiene más de lo dudoso y posible."
        literal: "And, if to this one to-me answered that those who such books compose them write as things of lie, and that thus, not they-are obliged to look into niceties nor truths, to-answer-them-would I that so-much the lie is better the-more it-seems true, and so-much more it-pleases the-more it-has more of the doubtful and possible."
        ormsby: "And if, in answer to this, I am told that the authors of books of the kind write them as fiction, and therefore are not bound to regard niceties of truth, I would reply that fiction is all the better the more it looks like truth, and gives the more pleasure the more probability and possibility there is about it."
        ormsby_note: "Literally, \"the more of the doubtful,\" meaning the more of that which is not manifestly impossible."
        vocab:
          - {w: "cosas de mentira", d: "made-up things, fiction"}
          - {w: "estar obligado a", d: "to be bound to"}
          - {w: "mirar en", d: "to pay attention to, be careful about"}
          - {w: "delicadeza", d: "nicety, fine point"}
          - {w: "responderles hía", d: "= les respondería, I would answer them: the old split conditional, infinitive + 'hía'"}
          - {w: "tanto ... cuanto más", d: "the more ... the more; 'tanto es mejor cuanto más parece' = it is the better the more it seems"}
          - {w: "agradar", d: "to please"}
          - {w: "lo dudoso", d: "the doubtful: what might or might not be true, the plausible"}
        diagram:
          - s: "responderles hía yo"
            r: "main verb: I would answer them"
            under:
              - s: "si a esto se me respondiese"
                r: "condition: if it were answered me to this"
                under:
                  - {s: "que los que tales libros componen los escriben como cosas de mentira", r: "the answer, 1: that those who write such books write them as fiction"}
                  - {s: "y que así, no están obligados a mirar en delicadezas ni verdades", r: "the answer, 2: and so need not mind niceties or truth"}
              - {s: "que tanto la mentira es mejor cuanto más parece verdadera", r: "my reply, 1: that a lie is the better the truer it seems"}
              - {s: "y tanto más agrada cuanto tiene más de lo dudoso y posible", r: "my reply, 2: and pleases the more, the more of the plausible and possible it has"}
        forms:
          - {w: "se me respondiese", f: "respond- + -iese → responder (to answer), imperfect subjunctive (-se form), it, with 'se' (impersonal: 'one') and 'me' (to me): 'if it were answered me'. responder in the -se form: respondiese, respondieses, respondiese, respondiésemos, respondieseis, respondiesen."}
          - {w: "componen", f: "compon- + -en → componer (to compose), present, they. Irregular like poner (to put): compongo, compones, compone, componemos, componéis, componen."}
          - {w: "escriben", f: "escrib- + -en → escribir (to write), present, they. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "los", f: "'them' (the books), repeated though 'tales libros' already came earlier."}
          - {w: "están obligados", f: "est- + -án → estar (to be), present, they: estoy, estás, está, estamos, estáis, están; + obligados, the participle of obligar (to oblige), masculine plural."}
          - {w: "responderles hía", f: "responder (to answer) + les (to them) + hía, the old form of the -ía ending: the conditional, I, split open so the pronoun can sit inside; modern 'les respondería'. The conditional adds -ía, -ías, -ía, -íamos, -íais, -ían to the infinitive."}
          - {w: "parece", f: "parec- + -e → parecer (to seem), present, it. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (with parezco for I)."}
          - {w: "verdadera", f: "verdader- + -a → verdadero (true), feminine to match 'mentira'."}
          - {w: "agrada", f: "agrad- + -a → agradar (to please), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, it. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
        note: "The canon is restating Aristotle's preference for the probable over the merely true: fiction succeeds when the reader can believe it might have happened. This idea of verisimilitude was central to 16th-century literary theory in Italy and Spain."
      - es: "Hanse de casar las fábulas mentirosas con el entendimiento de los que las leyeren, escribiéndose de suerte que, facilitando los imposibles, allanando las grandezas, suspendiendo los ánimos, admiren, suspendan, alborocen y entretengan, de modo que anden a un mismo paso la admiración y la alegría juntas;"
        literal: "Have-themselves to marry the fables lying with the understanding of those who them may-read, writing-themselves in way that, making-easy the impossibles, smoothing the greatnesses, holding-in-suspense the minds, they-may-amaze, hold-in-suspense, gladden and entertain, in manner that may-go at one same pace the wonder and the joy together;"
        ormsby: "Plots in fiction should be wedded to the understanding of the reader, and be constructed in such a way that, reconciling impossibilities, smoothing over difficulties, keeping the mind on the alert, they may surprise, interest, divert, and entertain, so that wonder and delight joined may keep pace one with the other;"
        vocab:
