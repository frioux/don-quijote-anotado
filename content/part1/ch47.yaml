          - {w: "se os entró", f: "entr- + -ó → entrar (to enter), preterite, it (the isle), with 'se' and 'os' (into you): 'got into your head'. Same -ar preterite: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "deseáis", f: "dese- + -áis → desear (to desire), present, you (vos): deseo, deseas, desea, deseamos, deseáis, desean."}
