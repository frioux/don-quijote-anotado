          - {w: "casamiento", d: "marriage, wedding"}
          - {w: "bautismo", d: "baptism: Zoraida, a Moorish woman, is to become a Christian"}
          - {w: "suceso", d: "outcome, what happens (to someone), not 'success'"}
          - {w: "don Luis", d: "the young nobleman in love with doña Clara, the judge's daughter; his affair is still unsettled"}
          - {w: "vuelta", d: "return"}
        diagram:
          - s: "y que él, asimesmo, le avisaría"
            r: "continues 'asegurándole' from the previous sentence: and that he likewise would inform him"
            under:
              - s: "de todo aquello"
                r: "of what: of everything"
                under:
                  - {s: "que él viese que podría darle gusto", r: "describes 'aquello': that he saw might please him"}
              - {s: "así de su casamiento", r: "of what, 1: both of his marriage"}
              - {s: "como del bautismo de Zoraida", r: "of what, 2: and of Zoraida's baptism"}
              - {s: "y suceso de don Luis", r: "of what, 3: and Don Luis's outcome"}
              - {s: "y vuelta de Luscinda a su casa", r: "of what, 4: and Luscinda's return home"}
        forms:
          - {w: "avisaría", f: "avisar- + -ía → avisar (to inform), conditional, he: 'he would inform', reporting what Don Fernando said he 'will' do. The conditional adds endings to the whole infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "asimesmo", f: "old form of asimismo (likewise): así + mesmo, with mesmo = mismo."}
          - {w: "aquello", f: "neuter form of aquel (that): 'all that', standing for things in general, not a noun."}
          - {w: "viese", f: "v- + -iese → ver (to see), imperfect subjunctive (-se form), he: 'whatever he might see'. viese, vieses, viese, viésemos, vieseis, viesen. Subjunctive because the things are not yet known."}
          - {w: "podría", f: "podr- + -ía → poder (to be able), conditional, it: 'could'. Irregular stem podr-: podría, podrías, podría, podríamos, podríais, podrían."}
          - {w: "darle", f: "dar (to give) + le (to him), the pronoun hung on the infinitive after 'podría'."}
          - {w: "del", f: "de + el: 'of the'."}
        note: "Luscinda goes back to her parents' house until her marriage with Cardenio can be arranged. The loose ends are tied up off stage, by letter."
