          - {w: "me saque", f: "saqu- + -e → sacar (to take out), present subjunctive, he (God); c becomes qu before e. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en (saque, saques, saque, saquemos, saquéis, saquen). Cervantes leaves out the 'que' after 'rogad'."}
          - {w: "destas", f: "de + estas (of these): Cervantes fuses 'de' with these pronouns."}
