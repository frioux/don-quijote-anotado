      - es: "¿Qué ingenio, si no es del todo bárbaro e inculto, podrá contentarse leyendo que una gran torre llena de caballeros va por la mar adelante, como nave con próspero viento, y hoy anochece en Lombardía, y mañana amanezca en tierras del Preste Juan de las Indias, o en otras que ni las descubrió Tolomeo ni las vio Marco Polo?"
        literal: "What wit, if not it-is wholly barbarous and uncultured, will-be-able to-content-itself reading that a great tower full of knights goes over the sea onward, like ship with favorable wind, and today night-falls-on-it in Lombardy, and tomorrow dawns-on-it in lands of-the Prester John of the Indies, or in others that neither them discovered Ptolemy nor them saw Marco Polo?"
        ormsby: "What mind, that is not wholly barbarous and uncultured, can find pleasure in reading of how a great tower full of knights sails away across the sea like a ship with a fair wind, and will be tonight in Lombardy and tomorrow morning in the land of Prester John of the Indies, or some other that Ptolemy never described nor Marco Polo saw?"
        vocab:
