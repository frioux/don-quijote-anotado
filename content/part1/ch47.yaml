  - sentences:
      - es: "— ¡Adóbame esos candiles! —dijo a este punto el barbero—. ¿También vos, Sancho, sois de la cofradía de vuestro amo?"
        literal: "— Trim-me those oil-lamps! —said at this point the barber—. Also you, Sancho, are of the brotherhood of your master?"
        ormsby: "“Trim those lamps there!” exclaimed the barber at this; “so you are of the same fraternity as your master, too, Sancho?"
        ormsby_note: "Proverbial phrase, \"Adobadme esos candiles.\""
        vocab:
          - {w: "¡adóbame esos candiles!", d: "'trim me those lamps!': an exclamation at nonsense, 'well, listen to that!', 'here's a fine thing!'"}
