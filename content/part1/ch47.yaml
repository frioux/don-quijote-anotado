          - {w: "se le mandaba", f: "mand- + -aba → mandar (to order), imperfect, it, with 'se' making it impersonal ('was ordered') and 'le' = to him. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
      - es: "Tornaron a abrazarse otra vez, y otra vez tornaron a nuevos ofrecimientos."
