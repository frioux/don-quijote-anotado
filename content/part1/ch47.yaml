      - es: "— En verdad, hermano, que sé más de libros de caballerías que de las Súmulas de Villalpando."
        literal: "— In truth, brother, that I-know more of books of chivalries than of the Summulae of Villalpando."
        ormsby: "“In truth, brother, I know more about books of chivalry than I do about Villalpando’s elements of logic;"
        ormsby_note: "Suma de las Súmulas, Alcalá 1557, by Gaspar Carillo de Villalpando, a theologian who distinguished himself for learning and eloquence at the Council of Trent."
        vocab:
          - {w: "en verdad", d: "truly, in truth"}
          - {w: "hermano", d: "brother: a friendly, slightly condescending address"}
          - {w: "Súmulas", d: "'summulae', a textbook of elementary logic studied by every university student"}
          - {w: "Villalpando", d: "Gaspar Cardillo de Villalpando, a 16th-century theologian and author of a well-known logic textbook"}
        diagram:
          - s: "que sé más de libros de caballerías"
            r: "main verb: I know more about books of chivalry"
            under:
              - {s: "En verdad, hermano", r: "opening: truly, brother"}
              - {s: "que de las Súmulas de Villalpando", r: "than what: than about Villalpando's logic primer"}
        forms:
          - {w: "que sé", f: "s- + -é → saber (to know), present, I. Irregular in 'I': sé, sabes, sabe, sabemos, sabéis, saben. The 'que' after 'en verdad' just introduces the statement and is not translated."}
          - {w: "caballerías", f: "plural of caballería (chivalry); Spanish says 'libros de caballerías', books of chivalries."}
        note: "A churchman is expected to know his logic and theology; the canon admits, half joking, that he knows the romances better than his university textbook."
      - es: "Ansí que, si no está más que en esto, seguramente podéis comunicar conmigo lo que quisiéredes."
        literal: "So that, if not it-is more than in this, safely you-can communicate with-me that which you-may-wish."
        ormsby: "so if that be all, you may safely tell me what you please.”"
        vocab:
          - {w: "ansí que", d: "= así que, so, therefore (old form)"}
          - {w: "no estar más que en", d: "to depend only on, be no more than"}
          - {w: "seguramente", d: "safely, with confidence (not 'surely')"}
        diagram:
          - s: "seguramente podéis comunicar conmigo"
            r: "main verb: you can safely tell me"
            under:
              - {s: "Ansí que", r: "linking: so"}
              - {s: "si no está más que en esto", r: "condition: if that is all it depends on"}
              - {s: "lo que quisiéredes", r: "object: whatever you like"}
        forms:
          - {w: "está", f: "est- + -á → estar (to be), present, it. estoy, estás, está, estamos, estáis, están."}
          - {w: "podéis", f: "pod- + -éis → poder (to be able), present, you (vosotros, said to one man as a polite 'you'). The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "conmigo", f: "con + mí becomes 'conmigo', 'with me'."}
          - {w: "quisiéredes", f: "quis- + -iéredes → querer (to want), future subjunctive, you (vosotros), old ending -edes for modern -eis: 'whatever you may wish'. The future subjunctive of querer (to want): quisiere, quisieres, quisiere, quisiéremos, quisiereis (old quisiéredes), quisieren. Modern Spanish uses the present subjunctive 'queráis'."}
  - sentences:
      - es: "— A la mano de Dios —replicó don Quijote—. Pues así es, quiero, señor caballero, que sepades que yo voy encantado en esta jaula, por envidia y fraude de malos encantadores; que la virtud más es perseguida de los malos que amada de los buenos."
        literal: "— To the hand of God —replied Don Quijote—. Since so it-is, I-want, sir knight, that you-may-know that I go enchanted in this cage, through envy and fraud of evil enchanters; for the virtue more is persecuted by the wicked than loved by the good."
        ormsby: "“In God’s name, then, señor,” replied Don Quixote; “if that be so, I would have you know that I am held enchanted in this cage by the envy and fraud of wicked enchanters; for virtue is more persecuted by the wicked than loved by the good."
        vocab:
          - {w: "a la mano de Dios", d: "in God's name, so be it: a formula for starting something"}
          - {w: "replicar", d: "to reply, answer back"}
          - {w: "pues así es", d: "since that is so"}
          - {w: "sepades", d: "= sepáis, that you know (old ending -ades, the language of the romances)"}
          - {w: "fraude", d: "fraud, deceit"}
          - {w: "perseguido de", d: "persecuted by; old Spanish uses 'de' for the agent where modern uses 'por'"}
        diagram:
          - {s: "A la mano de Dios", r: "opening formula: in God's name"}
          - {s: "replicó don Quijote", r: "speech tag: Don Quijote replied"}
          - s: "quiero"
            r: "main verb: I want"
            under:
              - {s: "Pues así es", r: "why: since that is so"}
              - {s: "señor caballero", r: "addressed: sir knight"}
              - s: "que sepades"
                r: "what I want: that you know"
                under:
                  - s: "que yo voy encantado en esta jaula"
                    r: "what you should know: that I am travelling enchanted in this cage"
                    under:
                      - {s: "por envidia y fraude de malos encantadores", r: "why: through the envy and deceit of evil enchanters"}
                      - {s: "que la virtud más es perseguida de los malos que amada de los buenos", r: "why, 2: for virtue is more hated by the wicked than loved by the good"}
        forms:
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (repliqué, with c → qu before e)."}
          - {w: "quiero", f: "quier- + -o → querer (to want), present, I. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "sepades", f: "sep- + -ades → saber (to know), present subjunctive, you (vosotros, polite to one man), with the old ending -ades for modern -áis. sepa, sepas, sepa, sepamos, sepáis (old sepades), sepan. Subjunctive after 'quiero que'. Don Quijote uses the archaic form to sound like the romances."}
          - {w: "voy", f: "ir (to go), present, I. Irregular: voy, vas, va, vamos, vais, van. 'voy encantado' = I travel enchanted, I am enchanted."}
          - {w: "encantado", f: "participle of encantar (to enchant), masculine to match 'yo'."}
          - {w: "es perseguida, amada", f: "es (ser (to be), present, it: soy, eres, es, somos, sois, son) + perseguida, participle of perseguir (to persecute), and amada, participle of amar (to love), feminine to match 'la virtud': passives, 'is persecuted ... (is) loved'."}
        note: "Don Quijote explains his cage by the stock reason of the romances: envious enchanters persecute the best knights."
      - es: "Caballero andante soy, y no de aquellos de cuyos nombres jamás la Fama se acordó para eternizarlos en su memoria, sino de aquellos que, a despecho y pesar de la mesma envidia, y de cuantos magos crió Persia, bracmanes la India, ginosofistas la Etiopía, ha de poner su nombre en el templo de la inmortalidad para que sirva de ejemplo y dechado en los venideros siglos, donde los caballeros andantes vean los pasos que han de seguir, si quisieren llegar a la cumbre y alteza honrosa de las armas."
        literal: "Knight errant I-am, and not of those of whose names never the Fame herself remembered to eternalize-them in her memory, but of those that, in spite and sorrow of the same envy, and of as-many magi [as] bred Persia, brahmins the India, gymnosophists the Ethiopia, has to put his name in the temple of the immortality so-that it-may-serve as example and model in the coming centuries, where the knights errant may-see the steps that they-have to follow, if they-should-wish to-arrive at the summit and height honourable of the arms."
        ormsby: "I am a knight-errant, and not one of those whose names Fame has never thought of immortalising in her record, but of those who, in defiance and in spite of envy itself, and all the magicians that Persia, or Brahmans that India, or Gymnosophists that Ethiopia ever produced, will place their names in the temple of immortality, to serve as examples and patterns for ages to come, whereby knights-errant may see the footsteps in which they must tread if they would attain the summit and crowning point of honour in arms.”"
        vocab:
          - {w: "la Fama", d: "Fame personified, the goddess who keeps the record of great deeds"}
          - {w: "acordarse de", d: "to remember"}
          - {w: "eternizar", d: "to make eternal, immortalize"}
          - {w: "a despecho y pesar de", d: "in spite of, in defiance of (a doubled phrase)"}
          - {w: "mesmo", d: "= mismo; 'la mesma envidia' = envy itself"}
          - {w: "magos", d: "magi, the wise men and magicians of Persia"}
          - {w: "criar", d: "to breed, rear, produce"}
          - {w: "bracmanes", d: "Brahmins, the priestly caste of India, famed in the West as sages"}
          - {w: "ginosofistas", d: "gymnosophists, 'naked philosophers', ascetic sages the Greeks placed in India and Ethiopia"}
          - {w: "templo de la inmortalidad", d: "the temple of immortality, an allegorical place where the famous are honoured"}
          - {w: "dechado", d: "model, pattern (originally a needlework sampler)"}
          - {w: "venidero", d: "coming, future"}
          - {w: "cumbre", d: "summit, peak"}
          - {w: "alteza", d: "height, eminence (here not the title 'Highness')"}
        diagram:
          - s: "Caballero andante soy"
            r: "main verb: a knight-errant I am"
          - s: "y no de aquellos"
            r: "what kind, not: and not one of those"
            under:
              - s: "de cuyos nombres jamás la Fama se acordó"
                r: "describes 'aquellos': whose names Fame never remembered"
                under:
                  - {s: "para eternizarlos en su memoria", r: "why: to make them eternal in her memory"}
          - s: "sino de aquellos"
            r: "what kind: but one of those"
            under:
              - s: "que ... ha de poner su nombre en el templo de la inmortalidad"
                r: "describes 'aquellos': who is to put his name in the temple of immortality"
                under:
                  - {s: "a despecho y pesar de la mesma envidia", r: "in spite of what: in spite of envy itself"}
                  - {s: "y de cuantos magos crió Persia, bracmanes la India, ginosofistas la Etiopía", r: "in spite of what, 2: and of all the magi Persia, Brahmins India and gymnosophists Ethiopia ever bred"}
                  - s: "para que sirva de ejemplo y dechado en los venideros siglos"
                    r: "purpose: so that it serves as example and model in ages to come"
                    under:
                      - s: "donde los caballeros andantes vean los pasos"
                        r: "where: in which knights-errant may see the steps"
                        under:
                          - {s: "que han de seguir", r: "describes 'pasos': that they must follow"}
                          - {s: "si quisieren llegar a la cumbre y alteza honrosa de las armas", r: "condition: if they wish to reach the honoured summit of arms"}
        forms:
          - {w: "soy", f: "ser (to be), present, I. soy, eres, es, somos, sois, son. The predicate 'Caballero andante' comes first for emphasis."}
          - {w: "cuyos", f: "'whose', masculine plural to match the thing owned ('nombres'), not the owner."}
          - {w: "se acordó", f: "acord- + -ó → acordarse (to remember), preterite, she (Fame). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "eternizarlos", f: "eternizar (to immortalize) + los (them, the names), hung on the infinitive after 'para'."}
          - {w: "crió", f: "cri- + -ó → criar (to breed), preterite, it (Persia); the verb is understood again with 'la India' and 'la Etiopía'. Same -ar preterite."}
          - {w: "ha de poner", f: "h- + -a → haber (to have), present, he: he, has, ha, hemos, habéis, han; 'haber de' + infinitive = is to, will: 'is to put'. poner (to put) infinitive. Singular, as if Don Quijote were already speaking of himself, though after plural 'aquellos' grammar would want 'han'."}
          - {w: "sirva", f: "sirv- + -a → servir (to serve), present subjunctive, it. sirva, sirvas, sirva, sirvamos, sirváis, sirvan. Subjunctive after 'para que'."}
          - {w: "venideros", f: "venider- + -os → venidero (coming), masculine plural to match 'siglos'; from venir (to come) + -dero."}
          - {w: "vean", f: "ve- + -an → ver (to see), present subjunctive, they. vea, veas, vea, veamos, veáis, vean."}
          - {w: "han de seguir", f: "han (haber (to have), present, they: he, has, ha, hemos, habéis, han) + de + seguir (to follow): 'they must follow'."}
          - {w: "quisieren", f: "quis- + -ieren → querer (to want), future subjunctive, they: 'if they should wish'. quisiere, quisieres, quisiere, quisiéremos, quisiereis, quisieren. Used after 'si' for an open future; modern Spanish says 'si quieren'."}
          - {w: "honrosa", f: "honros- + -a → honroso (honourable), feminine to match 'cumbre y alteza'."}
        note: "The Persian magi, Indian Brahmins and Ethiopian gymnosophists are the stock wise men and wizards of ancient lore, piled up to show how great the envy is that Don Quijote will overcome."
  - sentences:
      - es: "— Dice verdad el señor don Quijote de la Mancha —dijo a esta sazón el cura—; que él va encantado en esta carreta, no por sus culpas y pecados, sino por la mala intención de aquellos a quien la virtud enfada y la valentía enoja."
        literal: "— Says truth the lord Don Quijote of la Mancha —said at this moment the priest—; for he goes enchanted in this cart, not through his faults and sins, but through the bad intention of those to whom the virtue annoys and the valor angers."
        ormsby: "“What Señor Don Quixote of La Mancha says,” observed the curate, “is the truth; for he goes enchanted in this cart, not from any fault or sins of his, but because of the malevolence of those to whom virtue is odious and valour hateful."
        vocab:
          - {w: "decir verdad", d: "to tell the truth, be right"}
          - {w: "a esta sazón", d: "at this moment, just then"}
          - {w: "carreta", d: "cart (a long narrow cart)"}
          - {w: "enfadar", d: "to annoy, vex"}
          - {w: "enojar", d: "to anger"}
        diagram:
          - s: "Dice verdad el señor don Quijote de la Mancha"
            r: "main verb 1: Señor Don Quijote of la Mancha speaks the truth"
          - {s: "dijo a esta sazón el cura", r: "speech tag: said the priest just then"}
          - s: "que él va encantado en esta carreta"
            r: "reason (after 'que', for): he travels enchanted in this cart"
            under:
              - {s: "no por sus culpas y pecados", r: "why, not: not for his faults and sins"}
              - s: "sino por la mala intención de aquellos"
                r: "why: but through the ill will of those"
                under:
                  - {s: "a quien la virtud enfada y la valentía enoja", r: "describes 'aquellos': whom virtue annoys and courage angers"}
        forms:
          - {w: "Dice, dijo", f: "dic- + -e → decir (to say), present, he: digo, dices, dice, decimos, decís, dicen; dij- + -o, preterite, he: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "va", f: "ir (to go), present, he. Irregular: voy, vas, va, vamos, vais, van."}
          - {w: "a quien", f: "'quien' used for a plural ('aquellos'); in Cervantes' day 'quien' served for both numbers, modern Spanish says 'a quienes'."}
          - {w: "enfada, enoja", f: "enfad- + -a → enfadar (to annoy) and enoj- + -a → enojar (to anger), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
        note: "The priest plays along in Don Quijote's own high style, so that the madman's 'enchantment' is confirmed by the man who arranged it."
      - es: "Éste es, señor, el Caballero de la Triste Figura, si ya le oístes nombrar en algún tiempo, cuyas valerosas hazañas y grandes hechos serán escritas en bronces duros y en eternos mármoles, por más que se canse la envidia en escurecerlos y la malicia en ocultarlos."
        literal: "This-one is, sir, the Knight of the Sad Face, if already him you-heard name at some time, whose valiant exploits and great deeds will-be written in bronzes hard and in eternal marbles, for more that may-tire-itself the envy in darkening-them and the malice in hiding-them."
        ormsby: "This, señor, is the Knight of the Rueful Countenance, if you have ever heard him named, whose valiant achievements and mighty deeds shall be written on lasting brass and imperishable marble, notwithstanding all the efforts of envy to obscure them and malice to hide them.”"
        vocab:
          - {w: "Caballero de la Triste Figura", d: "Knight of the Sad Face (Rueful Countenance), the title Sancho gave Don Quijote in Chapter 19"}
          - {w: "si ya", d: "if indeed, if ever"}
          - {w: "oístes", d: "= oísteis, you heard (old form)"}
          - {w: "hazaña", d: "exploit, deed of valour"}
          - {w: "bronces y mármoles", d: "bronze and marble, the materials of lasting monuments and inscriptions"}
          - {w: "por más que", d: "however much, no matter how much"}
          - {w: "escurecer", d: "= oscurecer, to darken, obscure (old spelling)"}
        diagram:
          - s: "Éste es, señor, el Caballero de la Triste Figura"
            r: "main verb: this, sir, is the Knight of the Sad Face"
            under:
              - {s: "si ya le oístes nombrar en algún tiempo", r: "condition: if you ever heard him named"}
              - s: "cuyas valerosas hazañas y grandes hechos serán escritas"
                r: "describes 'Caballero': whose valiant exploits and great deeds will be written"
                under:
                  - {s: "en bronces duros y en eternos mármoles", r: "where: in hard bronze and eternal marble"}
                  - {s: "por más que se canse la envidia en escurecerlos y la malicia en ocultarlos", r: "concession: however hard envy tries to obscure them and malice to hide them"}
        forms:
          - {w: "Éste", f: "este (this) as a pronoun, written with an accent: 'this man'."}
          - {w: "oístes", f: "o- + -ístes → oír (to hear), preterite, you (vosotros, polite to one man); old form of modern 'oísteis'. oí, oíste, oyó, oímos, oísteis (old oístes), oyeron."}
          - {w: "nombrar", f: "infinitive of nombrar (to name) after a verb of hearing: 'heard (someone) name him'."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun ('tiempo')."}
          - {w: "cuyas", f: "'whose', feminine plural to match the first thing owned ('hazañas')."}
          - {w: "valerosas", f: "valeros- + -as → valeroso (valiant), feminine plural to match 'hazañas'."}
          - {w: "serán escritas", f: "ser- + -án → ser (to be), future, they: seré, serás, será, seremos, seréis, serán; + escritas, the irregular participle of escribir (to write), feminine plural to agree with 'hazañas' (the nearer 'hechos' is ignored): the future passive, 'will be written'."}
          - {w: "se canse", f: "cans- + -e → cansarse (to tire oneself), present subjunctive, it (envy). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. Subjunctive after 'por más que'."}
          - {w: "escurecerlos, ocultarlos", f: "escurecer (= oscurecer, to obscure) and ocultar (to hide), each with 'los' (them, the deeds) hung on the infinitive after 'en'."}
  - sentences:
      - es: "Cuando el canónigo oyó hablar al preso y al libre en semejante estilo, estuvo por hacerse la cruz, de admirado, y no podía saber lo que le había acontencido; y en la mesma admiración cayeron todos los que con él venían."
        literal: "When the canon heard speak [to] the prisoner and [to] the free [man] in such style, he-was for making-himself the cross, from amazed, and not could know that which to-him had happened; and in the same amazement fell all those who with him were-coming."
        ormsby: "When the canon heard both the prisoner and the man who was at liberty talk in such a strain he was ready to cross himself in his astonishment, and could not make out what had befallen him; and all his attendants were in the same state of amazement."
        vocab:
          - {w: "preso", d: "prisoner (Don Quijote in the cage)"}
          - {w: "libre", d: "free man (the priest)"}
          - {w: "semejante", d: "such, like that"}
          - {w: "estar por", d: "to be on the point of, be inclined to"}
          - {w: "hacerse la cruz", d: "to cross oneself, in astonishment or to ward off evil"}
          - {w: "de admirado", d: "out of amazement; 'admirado' = astonished (false friend)"}
          - {w: "acontencido", d: "= acontecido, happened (a slip or old variant of the participle of acontecer)"}
          - {w: "admiración", d: "amazement, astonishment (not 'admiration')"}
        diagram:
          - s: "estuvo por hacerse la cruz"
            r: "main verb 1: he was ready to cross himself"
            under:
              - {s: "Cuando el canónigo oyó hablar al preso y al libre en semejante estilo", r: "when: when the canon heard the prisoner and the free man talk in such a style"}
              - {s: "de admirado", r: "why: out of amazement"}
          - s: "y no podía saber"
            r: "main verb 2: and could not tell"
            under:
              - {s: "lo que le había acontencido", r: "what: what had happened to him"}
          - s: "y en la mesma admiración cayeron todos"
            r: "main verb 3: and all fell into the same amazement"
            under:
              - {s: "los que con él venían", r: "describes 'todos': those who came with him"}
        forms:
          - {w: "oyó", f: "o- + -yó → oír (to hear), preterite, he; the i becomes y between vowels. oí, oíste, oyó, oímos, oísteis, oyeron."}
          - {w: "al preso y al libre", f: "a + el = al, the personal 'a' before people heard speaking; the adjectives are used as nouns."}
          - {w: "estuvo", f: "estuv- + -o → estar (to be), preterite, he. Irregular: estuve, estuviste, estuvo, estuvimos, estuvisteis, estuvieron."}
          - {w: "hacerse", f: "hacer (to make) + se (himself), hung on the infinitive after 'por'."}
          - {w: "podía", f: "pod- + -ía → poder (to be able), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "había acontencido", f: "había (haber (to have), imperfect, it: había, habías, había, habíamos, habíais, habían) + acontencido (= acontecido), the participle of acontecer (to happen): 'had happened'."}
          - {w: "mesma", f: "= misma (same), feminine to match 'admiración'."}
          - {w: "cayeron", f: "ca- + -yeron → caer (to fall), preterite, they; i becomes y between vowels. caí, caíste, cayó, caímos, caísteis, cayeron."}
          - {w: "venían", f: "ven- + -ían → venir (to come), imperfect, they. Same -ía imperfect."}
        note: "The canon is shocked less by the madman than by the sane-looking priest who talks the same nonsense: he cannot tell who is mad."
      - es: "En esto, Sancho Panza, que se había acercado a oír la plática, para adobarlo todo, dijo:"
        literal: "In this, Sancho Panza, who himself had approached to hear the talk, to fix-it all, said:"
