                  - {s: "admiren, suspendan, alborocen y entretengan", r: "result: they amaze, enthral, gladden and entertain"}
                  - {s: "de modo que anden a un mismo paso la admiración y la alegría juntas", r: "result: so that wonder and delight keep pace together"}
        forms:
          - {w: "Hanse de casar", f: "han (haber (to have), present, they: he, has, ha, hemos, habéis, han) + se, stuck on the end, + de + casar (to marry): 'haber de' = must, and 'se' makes it passive: 'they must be wedded'. Modern 'se han de casar'. Cervantes hangs the pronoun on a verb that opens the sentence."}
          - {w: "leyeren", f: "ley- + -eren → leer (to read), future subjunctive, they: 'whoever may read them'. The future subjunctive of -er verbs: -iere, -ieres, -iere, -iéremos, -iereis, -ieren; for leer (to read) the i is written y: leyere, leyeres, leyere, leyéremos, leyereis, leyeren. Modern Spanish uses the present subjunctive 'lean'."}
          - {w: "escribiéndose", f: "gerund of escribir (to write) + se (passive: 'being written'), accent added to keep the stress."}
          - {w: "facilitando, allanando, suspendiendo", f: "gerunds of facilitar (to make easy), allanar (to smooth) and suspender (to hold in suspense): -ando for -ar verbs, -iendo for -er/-ir verbs."}
          - {w: "admiren, suspendan, alborocen, entretengan", f: "present subjunctive, they (the fables), after 'de suerte que' (so that): admir- + -en → admirar (to amaze), suspend- + -an → suspender (to hold in suspense), alboroc- + -en → alborozar (to gladden, z → c before e), entreteng- + -an → entretener (to entertain). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en; of -er verbs: -a, -as, -a, -amos, -áis, -an (entretener like tener (to have): entretenga, entretengas, entretenga, entretengamos, entretengáis, entretengan)."}
          - {w: "anden", f: "and- + -en → andar (to go), present subjunctive, they, after 'de modo que'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "juntas", f: "junt- + -as → junto (together), feminine plural to match 'la admiración y la alegría'."}
      - es: "y todas estas cosas no podrá hacer el que huyere de la verisimilitud y de la imitación, en quien consiste la perfeción de lo que se escribe."
        literal: "and all these things not will-be-able to-do he who may-flee from the verisimilitude and from the imitation, in which consists the perfection of that which itself writes."
