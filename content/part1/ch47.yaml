  - sentences:
      - es: "— No te maravilles deso, Sancho amigo —respondió don Quijote—, porque te hago saber que los diablos saben mucho, y, puesto que traigan olores consigo, ellos no huelen nada, porque son espíritus, y si huelen, no pueden oler cosas buenas, sino malas y hidiondas."
        literal: "— Not yourself marvel at-that, Sancho friend —answered Don Quijote—, because you I-make know that the devils know much, and, although they-may-bring smells with-them, they not smell nothing, because they-are spirits, and if they-smell, not they-can smell things good, but bad and stinking."
        ormsby: "“Marvel not at that, Sancho my friend,” said Don Quixote; “for let me tell thee devils are crafty; and even if they do carry odours about with them, they themselves have no smell, because they are spirits; or, if they have any smell, they cannot smell of anything sweet, but of something foul and fetid;"
        vocab:
          - {w: "maravillarse de", d: "to marvel at, be surprised at"}
          - {w: "deso", d: "= de eso, at that (old contraction)"}
