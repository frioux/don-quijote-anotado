          - {w: "le enjaulasen", f: "enjaul- + -asen → enjaular (to cage), imperfect subjunctive (-se form), they: subjunctive after 'antes que' (before). The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. 'le' = him: Cervantes often uses 'le' for a male direct object where modern standard Spanish prefers 'lo' (leísmo)."}
