          - {w: "cautivaron, quedaron", f: "cautiv- + -aron → cautivar (to capture) and qued- + -aron → quedar (to remain), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "cierta y clara", f: "feminine to match 'señal'."}
