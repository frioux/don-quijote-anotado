          - {w: "es", f: "ser (to be), present, he: soy, eres, es, somos, sois, son. 'es mi hermano' with ser for who he is."}
          - {w: "está", f: "est- + -á → estar (to be), present, he: estoy, estás, está, estamos, estáis, están. 'está en nuestro lugar' with estar for where he is."}
