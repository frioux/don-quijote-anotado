summary: |
  The captive begins his story. His family comes from the mountains of León. His father, a former soldier, is so open-handed that he fears he will waste his sons' inheritance, so he divides his estate into four parts, keeps one, and asks each of his three sons to choose one of the roads named in the proverb 'Iglesia, o mar, o casa real': letters, trade, or the king's service in war. The captive, the eldest, chooses arms; the second brother takes his share to the Indies as a merchant; the youngest goes to study at Salamanca for the Church. The captive persuades his father to keep two thousand of his three thousand ducats, his brothers each give a thousand more, and the three set off on the same day.

  The captive sails from Alicante to Genoa and Milan, joins the Duke of Alba in Flanders, sees the execution of the counts of Egmont and Horn, and becomes ensign to Captain Diego de Urbina. Hearing of the Holy League against the Turks, he comes back to Italy to serve under Don Juan de Austria, and at the battle of Lepanto, already a captain, he leaps aboard an enemy galley, is cut off from his men and taken prisoner by Uchalí, king of Algiers: the only captive on a day when fifteen thousand Christian galley slaves were set free.

  As a slave at the oar he sees the chance of trapping the Turkish fleet at Navarino lost, the capture of the galley La Presa, whose rowers bite their cruel captain to death, Don Juan's taking of Tunis, and finally the Turkish capture of the Goletta and the new fort in 1574. He describes the siege, the bravery of the defenders, and the deaths of Puertocarrero and Pagán de Oria, and says he thinks the loss of the costly Goletta was a mercy to Spain. He has not written to his father, so he has no hope of ransom.

  Among the prisoners was Don Pedro de Aguilar, an ensign and a poet who rowed on the captive's own bench and wrote two sonnets on the fall of the Goletta and the fort. At his name Don Fernando's companions smile, and one of them asks what became of him. The captive says he escaped disguised as an Albanian with a Greek spy; the gentleman reveals that Don Pedro is his brother, now home, married and rich. The captive thanks God, saying nothing on earth equals regaining lost liberty, and the gentleman begins to recite his brother's sonnets.
context: |
  Younger sons and the three roads. The father's plan rests on a real social fact. A gentleman's estate was small, and only the eldest could hope to live on it; the others had to find a way up. The proverb 'Iglesia, o mar, o casa real' names the three roads: the Church (through university study, here at Salamanca), the sea (trade, above all with the Indies through Seville), and service to the crown, which for a hidalgo meant the army. 'Más vale migaja de rey que merced de señor' adds that the king's service, however meagre, is worth more than a noble patron's favour. Three thousand ducats each was a handsome stake; the uncle buys the land 'so that it would not leave the family stock', the instinct of every old family.

  The wars of the 1560s and 1570s. The captive's career runs through the great events of Philip II's reign: the Duke of Alba's march to Flanders in 1567 and the beheading of the Flemish counts Egmont and Horn in 1568; the Holy League of Spain, Venice and the Pope against the Ottomans after the fall of Cyprus; the victory of Lepanto on 7 October 1571 under Don Juan de Austria; the failed attempt to trap the Turkish fleet at Navarino in 1572; Don Juan's capture of Tunis in 1573; and the loss of the Goletta and the new fort in 1574. Ormsby points out that, since Alba went to Flanders in 1567, the scene at the inn would have to be set about 1589, 'but Cervantes paid no attention to chronology'.

  Cervantes' own life. Much of this is autobiography, lightly shifted. Ormsby notes that Diego de Urbina was the captain of the company in which Cervantes first served. Cervantes fought at Lepanto, where he was wounded and lost the use of his left hand, and served in the campaigns that followed. He was not captured in the battle, as the captive is, but in 1575, by Barbary corsairs on his way home, and spent five years as a slave in Algiers before he was ransomed. The captive's tale is a soldier's version of his author's life, and his praise of 'la libertad perdida' is Cervantes speaking.

  Corsairs, galleys and ransom. Uchalí (Uluj Ali), a Calabrian renegade who rose to be king of Algiers and, after Lepanto, grand admiral, was one of the few Ottoman commanders to come out of the battle with credit; Barbarroja (Barbarossa) was the most famous corsair of the century. The galleys of both sides were rowed by slaves and convicts chained to the benches, which is why fifteen thousand Christians were freed at Lepanto and why the rowers of La Presa took such revenge on their captain. Captives of standing were held for ransom, raised by their families or by the Trinitarian and Mercedarian friars; that is why the captive's refusal to write to his father leaves him without hope.

  The narrator's games. The captive's first words, 'En un lugar de las Montañas de León', echo the opening of the whole book, 'En un lugar de la Mancha', but this time the place is named. The captive insists on brevity and then gives a soldier's dense chronicle of campaigns and names. At the end the frame breaks in: the poet Don Pedro de Aguilar, whom the captive knew at the oar, turns out to be the brother of one of the listeners. Ormsby notes that memoirs of a Don Pedro de Aguilar were printed in 1755. Coincidences like this one, which tie the stories told at the inn to the people listening, are typical of this part of the novel.

  Religion and providence. The captive explains the lost chance at Navarino not by any fault of the commander but 'por los pecados de la cristiandad': God allows the Turk as a scourge, a 'verdugo', to punish Christian sin. The Christians who died at Lepanto were luckier than the survivors because they died fighting the infidel. The Goletta, kept at great cost only to honour Charles V's conquest of 1535, is called a 'gomia', a devouring monster, and its loss a mercy.

  Reading Cervantes' Spanish. The archaisms of the chapter: mesmo (mismo), joventud (juventud), estrecheza (estrechez), luengo (largo), ginovés (genovés), efeto (efecto), felice (feliz), Costantinopla, cosario (corsario), trincheas (trincheras), trecientos (trescientos), ansimesmo (asimismo), alárabe (árabe), apriesa (aprisa), summa (suma), ánima (alma), trujo and trujeron (trajo, trajeron), and 'ha muchos días' for 'hace muchos días'. Infinitives with a pronoun turn -rl- into -ll- (gastalla, socorrella). Pronouns hang on the end of verbs that open a clause, which gives the soldier's report its clipped rhythm: Embarquéme, fuime, servíle, halléme, Lleváronme, Súpose, Divulgóse, Tomóla, Rindióse, Perdióse, Prometímosselo. The future subjunctive marks open possibilities (quisiere, tocare, fuere servido), the -se subjunctive fills the reported speech (siguiese, gastase, hiciésemos), 'haber de' means 'must' and 'tener de' 'have to', and the -ra form serves as a conditional (lo fuera, pareciera, pudiera). Watch the false friends: condición (nature), discreto (wise), miserable (stingy), razones (words), ejercicio (profession), sucesos (fortunes), comodidad (opportunity), desgracia (misfortune), puesto que (although), fuerza (fortress), oficina (workshop), and caballero, which here is not a knight but a raised gun platform.
