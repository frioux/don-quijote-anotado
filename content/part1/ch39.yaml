          - {w: "soltaron", f: "solt- + -aron → soltar (to drop), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "asieron", f: "as- + -ieron → asir (to seize), preterite, they. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "bogasen", f: "bog- + -asen → bogar (to row), imperfect subjunctive (-se form), they, after a command ('gritando que'). The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
