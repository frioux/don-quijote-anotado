  - sentences:
      - es: "— Lo que sé es —respondió el cautivo— que, al cabo de dos años que estuvo en Constantinopla, se huyó en traje de arnaúte con un griego espía, y no sé si vino en libertad, puesto que creo que sí, porque de allí a un año vi yo al griego en Constantinopla, y no le pude preguntar el suceso de aquel viaje."
        literal: "— That which I-know is —answered the captive— that, at-the end of two years that he-was in Constantinople, himself he-fled in dress of Albanian with a Greek spy, and not I-know if he-came in liberty, although I-believe that yes, because from there to a year saw I [to-]the Greek in Constantinople, and not him I-could ask the outcome of that journey."
        ormsby: "“All I know is,” replied the captive, “that after having been in Constantinople two years, he escaped in the disguise of an Arnaut, in company with a Greek spy; but whether he regained his liberty or not I cannot tell, though I fancy he did, because a year afterwards I saw the Greek at Constantinople, though I was unable to ask him what the result of the journey was.”"
        vocab:
          - {w: "al cabo de", d: "at the end of, after"}
          - {w: "huirse", d: "to run away, escape"}
          - {w: "traje", d: "dress, costume; 'en traje de' = dressed as"}
          - {w: "arnaúte", d: "Arnaut, an Albanian, especially an Albanian soldier in Ottoman service"}
          - {w: "venir en libertad", d: "to reach freedom, get home free"}
          - {w: "puesto que", d: "here 'although' (false friend: now 'since')"}
          - {w: "de allí a un año", d: "a year later"}
          - {w: "suceso", d: "outcome, what happened (false friend: not 'success')"}
