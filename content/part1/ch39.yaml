      - es: "»Entre los cristianos que en el fuerte se perdieron, fue uno llamado don Pedro de Aguilar, natural no sé de qué lugar del Andalucía, el cual había sido alférez en el fuerte, soldado de mucha cuenta y de raro entendimiento: especialmente tenía particular gracia en lo que llaman poesía."
