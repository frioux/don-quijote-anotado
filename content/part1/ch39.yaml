  - sentences:
      - es: "»Perdióse también el fuerte; pero fuéronle ganando los turcos palmo a palmo, porque los soldados que lo defendían pelearon tan valerosa y fuertemente, que pasaron de veinte y cinco mil enemigos los que mataron en veinte y dos asaltos generales que les dieron."
        literal: "»Was-lost-itself also the fort; but went-it winning the Turks span by span, because the soldiers who it defended fought so valiantly and strongly, that passed of twenty and five thousand enemies those whom they-killed in twenty and two assaults general that them they-gave."
        ormsby: "The fort also fell; but the Turks had to win it inch by inch, for the soldiers who defended it fought so gallantly and stoutly that the number of the enemy killed in twenty-two general assaults exceeded twenty-five thousand."
        vocab:
          - {w: "palmo a palmo", d: "inch by inch (a 'palmo' is a hand's span)"}
          - {w: "valeroso", d: "valiant, brave"}
          - {w: "pasar de", d: "to exceed, be more than"}
          - {w: "asalto general", d: "general assault, an all-out storming of the walls"}
          - {w: "dar asalto a", d: "to storm, assault"}
        diagram:
          - {s: "»Perdióse también el fuerte", r: "main verb 1: the fort was lost too"}
          - s: "pero fuéronle ganando los turcos palmo a palmo"
            r: "main verb 2: but the Turks won it span by span"
            under:
              - s: "porque los soldados que lo defendían pelearon tan valerosa y fuertemente"
                r: "why: because the soldiers who defended it fought so bravely and hard"
                under:
                  - s: "que pasaron de veinte y cinco mil enemigos los"
                    r: "result: that more than twenty-five thousand enemies were those"
                    under:
                      - {s: "que mataron en veinte y dos asaltos generales", r: "describes 'los': whom they killed in twenty-two general assaults"}
                      - {s: "que les dieron", r: "describes 'asaltos': that (the Turks) made on them"}
        forms:
          - {w: "Perdióse", f: "perd- + -ió → perderse (to be lost), preterite, it, with 'se' stuck on the end: modern 'se perdió'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron. Cervantes hangs pronouns on a verb that opens the clause."}
          - {w: "fuéronle ganando", f: "fu- + -eron → ir (to go), preterite, they, + le (it, the fort), + ganando, gerund of ganar (to win): 'they went on winning it', ir + gerund for a slow, step-by-step action. ir borrows the preterite of ser (to be): fui, fuiste, fue, fuimos, fuisteis, fueron. Modern 'se lo fueron ganando'."}
          - {w: "defendían", f: "defend- + -ían → defender (to defend), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "pelearon", f: "pele- + -aron → pelear (to fight), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "valerosa y fuertemente", f: "two -mente adverbs joined by 'y': Spanish drops the '-mente' from the first and keeps it on the last; 'valerosa' is the feminine of valeroso (brave), the form -mente is built on."}
          - {w: "pasaron, mataron, dieron", f: "pas- + -aron → pasar (to exceed) and mat- + -aron → matar (to kill), preterite, they: the preterite of -ar verbs is -é, -aste, -ó, -amos, -asteis, -aron. d- + -ieron → dar (to give), preterite, they: di, diste, dio, dimos, disteis, dieron."}
          - {w: "veinte y cinco, veinte y dos", f: "the old way of writing 25 and 22; modern 'veinticinco', 'veintidós'."}
      - es: "Ninguno cautivaron sano de trecientos que quedaron vivos, señal cierta y clara de su esfuerzo y valor, y de lo bien que se habían defendido y guardado sus plazas."
