  - sentences:
      - es: "— Gracias sean dadas a Dios —dijo el cautivo— por tantas mercedes como le hizo; porque no hay en la tierra, conforme mi parecer, contento que se iguale a alcanzar la libertad perdida."
        literal: "— Thanks may-be given to God —said the captive— for so-many favors as to-him he-did; because not there-is on the earth, according-to my opinion, contentment that itself may-equal to attaining the liberty lost."
        ormsby: "“Thanks be to God for all the mercies he has shown him,” said the captive; “for to my mind there is no happiness on earth to compare with recovering lost liberty.”"
        vocab:
          - {w: "gracias sean dadas a Dios", d: "thanks be to God (a set formula)"}
          - {w: "merced", d: "favor, mercy"}
          - {w: "tantos ... como", d: "as many ... as, all the ... that"}
          - {w: "conforme", d: "according to (modern 'conforme a')"}
          - {w: "contento", d: "as a noun: happiness, contentment"}
          - {w: "igualarse a", d: "to equal, compare with"}
        diagram:
          - s: "Gracias sean dadas a Dios"
            r: "main verb 1: thanks be given to God"
            under:
              - {s: "dijo el cautivo", r: "who speaks: said the captive"}
              - {s: "por tantas mercedes como le hizo", r: "for what: for all the favors he did him"}
          - s: "porque no hay en la tierra"
            r: "why: because there is not on earth"
            under:
              - {s: "conforme mi parecer", r: "aside: in my opinion"}
              - s: "contento"
                r: "what there is not: a happiness"
                under:
                  - {s: "que se iguale a alcanzar la libertad perdida", r: "describes 'contento': that equals regaining lost freedom"}
        forms:
          - {w: "sean dadas", f: "se- + -an → ser (to be), present subjunctive, they (the thanks), as a wish: sea, seas, sea, seamos, seáis, sean; + dadas, participle of dar (to give), feminine plural to match 'gracias': the passive 'be given'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "tantas", f: "tant- + -as → tanto (so many), feminine plural to match 'mercedes'."}
          - {w: "hizo", f: "hiz- + -o → hacer (to do), preterite, he (God). Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "hay", f: "the form of haber (to have) used alone for 'there is'; its ordinary present runs he, has, ha, hemos, habéis, han, but 'there is' is 'hay'."}
          - {w: "se iguale", f: "igual- + -e → igualarse (to equal), present subjunctive, it, because the thing is denied to exist ('no hay ... que'). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
