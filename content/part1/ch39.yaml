        ormsby: "“Well then, you are right,” returned the gentleman, “for that Don Pedro is my brother, and he is now in our village in good health, rich, married, and with three children.”"
        ormsby_note: "The memories of this Don Pedro de Aguilar were printed in 1755 by the Sociedad de Bibliofilos Españoles."
