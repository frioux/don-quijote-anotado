          - {w: "sea", f: "ser (to be), present subjunctive, she: sea, seas, sea, seamos, seáis, sean. Subjunctive because they doubt she exists."}
          - {w: "esa", f: "'that', feminine to match 'señora': ese, esa, esos, esas."}
          - {w: "decís", f: "dec- + -ís → decir (to say), present, you (vos). Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "mostrádnosla", f: "mostrad + nos + la → mostrar (to show), the imperative for vos with 'nos' (to us) and 'la' (her) on the end. The vos/vosotros imperative drops the -r of the infinitive and adds -d; pronouns always attach to a positive command."}
