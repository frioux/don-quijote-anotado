          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "lo mucho que", f: "neuter 'lo' + mucho + que: 'how much'."}
          - {w: "quiero", f: "quier- + -o → querer (to love / to want), present, I, used twice in both senses. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
