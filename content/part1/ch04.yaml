        forms:
          - {w: "vio", f: "ver (to see), preterite, he: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "sí", f: "'himself' after a preposition, with an accent to set it apart from 'si' (if)."}
          - {w: "aquella", f: "aquell- + -a → 'that' (over there), feminine to match 'figura'."}
          - {w: "llena", f: "llen- + -a → lleno (full), feminine to match 'figura'."}
          - {w: "blandiendo", f: "bland- + -iendo → blandir (to brandish), gerund: 'brandishing'."}
          - {w: "túvose", f: "tuv- + -o + se → tener (to hold; 'tenerse por' = to consider oneself), preterite, he, with 'se' stuck on the end: modern 'se tuvo'. Cervantes hangs the pronoun on a conjugated verb that opens its clause. tener's preterite: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron."}
          - {w: "muerto", f: "irregular participle of morir (to die): 'dead'."}
          - {w: "buenas", f: "buen- + -as → bueno, feminine plural to match 'palabras'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
  - sentences:
      - es: "— Señor caballero, este muchacho que estoy castigando es un mi criado, que me sirve de guardar una manada de ovejas que tengo en estos contornos, el cual es tan descuidado, que cada día me falta una;"
        literal: "— Sir knight, this boy whom I-am punishing is a my servant, who to-me serves of to-guard a flock of sheep that I-have in these surroundings, the which is so careless, that each day to-me is-missing one;"
        ormsby: "“Sir Knight, this youth that I am chastising is my servant, employed by me to watch a flock of sheep that I have hard by, and he is so careless that I lose one every day,"
        vocab:
          - {w: "castigar", d: "to punish"}
          - {w: "un mi criado", d: "a servant of mine; article + possessive together is old usage"}
          - {w: "criado", d: "servant (literally 'one brought up' in the house)"}
          - {w: "servir de", d: "to serve as, work at"}
          - {w: "manada", d: "flock, herd"}
          - {w: "contornos", d: "surroundings, the country round about"}
          - {w: "descuidado", d: "careless"}
          - {w: "faltar", d: "to be missing; 'me falta una' = I'm one short"}
        diagram:
          - s: "es un mi criado"
            r: "main verb: is a servant of mine"
            under:
              - {s: "Señor caballero", r: "addressed: sir knight"}
              - s: "este muchacho"
                r: "subject: this boy"
                under:
                  - {s: "que estoy castigando", r: "describes 'muchacho': whom I'm punishing"}
              - s: "que me sirve de guardar una manada de ovejas"
                r: "describes 'criado': who works for me minding a flock of sheep"
                under:
                  - {s: "que tengo en estos contornos", r: "describes 'ovejas': that I keep round here"}
              - s: "el cual es tan descuidado"
                r: "describes 'criado': who is so careless"
                under:
                  - {s: "que cada día me falta una", r: "result: that every day I'm a sheep short"}
        forms:
          - {w: "este", f: "'this', masculine singular to match 'muchacho': este, esta, estos, estas."}
          - {w: "estoy castigando", f: "estoy = estar, present, I: estoy, estás, está, estamos, estáis, están; + castigando (gerund of castigar, to punish): 'I am punishing'."}
          - {w: "es", f: "ser (to be), present, he: soy, eres, es, somos, sois, son."}
          - {w: "un mi", f: "indefinite article + possessive, 'a my servant' = a servant of mine; modern Spanish says 'un criado mío'."}
          - {w: "sirve", f: "sirv- + -e → servir (to serve), present, he. The stem e becomes i: sirvo, sirves, sirve, servimos, servís, sirven."}
          - {w: "guardar", f: "infinitive (to guard) after 'de'."}
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "estos", f: "est- + -os → 'these', masculine plural to match 'contornos'."}
          - {w: "el cual", f: "'who', masculine singular for the servant: el cual, la cual, los cuales, las cuales."}
          - {w: "falta", f: "falt- + -a → faltar (to be missing), present, it, with 'me' (to me): built like gustar, the missing sheep is the subject. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "una", f: "'one', feminine because it means 'una oveja'."}
