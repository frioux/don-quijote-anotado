part: 1
chapter: 4
title_es: "Capítulo IV. De lo que le sucedió a nuestro caballero cuando salió de la venta"
title_en: "Of what happened to our knight when he left the inn"
paragraphs:
  - sentences:
      - es: "La del alba sería cuando don Quijote salió de la venta, tan contento, tan gallardo, tan alborozado por verse ya armado caballero, que el gozo le reventaba por las cinchas del caballo."
        literal: "The [hour] of-the dawn it-would-be when don Quijote went-out of the inn, so content, so gallant, so overjoyed for to-see-himself already armed knight, that the joy to-him was-bursting through the girths of-the horse."
        ormsby: "Day was dawning when Don Quixote quitted the inn, so happy, so gay, so exhilarated at finding himself now dubbed a knight, that his joy was like to burst his horse-girths."
        vocab:
          - {w: "la del alba", d: "'the [hour] of dawn', i.e. daybreak; 'la' stands for an understood 'hora'"}
          - {w: "sería", d: "'it would be' = it must have been; the conditional used for a guess about the past"}
          - {w: "venta", d: "roadside inn, the lonely kind on the highway (the one where he was just 'knighted')"}
          - {w: "gallardo", d: "gallant, dashing, spirited"}
          - {w: "alborozado", d: "overjoyed, elated"}
          - {w: "armar caballero", d: "to dub (someone) a knight; 'armado caballero' = dubbed a knight"}
          - {w: "gozo", d: "joy, delight"}
          - {w: "reventar", d: "to burst"}
          - {w: "cincha", d: "saddle girth, the strap under the horse's belly"}
        diagram:
          - s: "sería"
            r: "main verb: it must have been"
            under:
              - {s: "La del alba", r: "subject: the hour of dawn"}
              - s: "cuando don Quijote salió de la venta"
                r: "when: when Don Quijote left the inn"
                under:
                  - s: "tan contento, tan gallardo, tan alborozado"
                    r: "how he left: so happy, so dashing, so elated"
                    under:
                      - {s: "por verse ya armado caballero", r: "why: at seeing himself a dubbed knight at last"}
                      - {s: "que el gozo le reventaba por las cinchas del caballo", r: "result: that his joy was bursting through the horse's girths"}
        forms:
          - {w: "sería", f: "ser + -ía → ser (to be), conditional, it: 'it would be', here 'it must have been'. The conditional adds its endings to the whole infinitive: -ía, -ías, -ía, -íamos, -íais, -ían (sería, serías, sería, seríamos, seríais, serían)."}
          - {w: "salió", f: "sal- + -ió → salir (to go out, leave), preterite, he: 'left'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "contento, gallardo, alborozado", f: "masculine singular, matching Don Quijote. alborozado is the participle of alborozar (to fill with joy): alboroz- + -ado."}
          - {w: "verse", f: "ver + se → ver (to see), infinitive with 'se' (himself) hung on the end, after 'por' (at, because of): 'at seeing himself'. A pronoun attaches to the end of an infinitive."}
          - {w: "armado", f: "arm- + -ado → armar (to arm; 'armar caballero' = to dub a knight), past participle, masculine to match Don Quijote: 'dubbed'."}
          - {w: "le reventaba", f: "revent- + -aba → reventar (to burst), imperfect, it (the joy), with 'le' = 'on him, for him': the joy was bursting out of him. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "del", f: "de + el (of the), the one contraction modern Spanish still writes."}
        note: "The comic image turns the horse into the container of the rider's joy: his happiness swells until it threatens to burst Rocinante's girths. Chapter 2 made fun of the romances' flowery dawns; here the dawn gets four plain words."
      - es: "Mas, viniéndole a la memoria los consejos de su huésped cerca de las prevenciones tan necesarias que había de llevar consigo, especial la de los dineros y camisas, determinó volver a su casa y acomodarse de todo, y de un escudero, haciendo cuenta de recebir a un labrador vecino suyo, que era pobre y con hijos, pero muy a propósito para el oficio escuderil de la caballería."
        literal: "But, coming-to-him to the memory the counsels of his host about of the provisions so necessary that he-had to carry with-himself, especially the [one] of the moneys and shirts, he-determined to-return to his house and to-supply-himself with everything, and with a squire, making account of to-receive [to] a farmer neighbor of-his, who was poor and with children, but very to purpose for the office squirely of the chivalry."
        ormsby: "However, recalling the advice of his host as to the requisites he ought to carry with him, especially that referring to money and shirts, he determined to go home and provide himself with all, and also with a squire, for he reckoned upon securing a farm-labourer, a neighbour of his, a poor man with a family, but very well qualified for the office of squire to a knight."
        vocab:
          - {w: "mas", d: "but (literary; no accent, unlike 'más' = more)"}
          - {w: "venir a la memoria", d: "to come to mind"}
          - {w: "huésped", d: "host, here the innkeeper; the word also means 'guest'"}
          - {w: "cerca de", d: "here in its old sense 'concerning, about', not 'near'"}
          - {w: "prevención", d: "provision, thing prepared in advance; a false friend, not 'prevention'"}
          - {w: "haber de", d: "to have to, to be supposed to"}
          - {w: "consigo", d: "with himself, on his person"}
          - {w: "especial", d: "here used as an adverb, = especialmente, especially"}
          - {w: "acomodarse de", d: "to supply oneself with, fit oneself out with"}
          - {w: "escudero", d: "squire, a knight's attendant (literally 'shield-bearer', from escudo)"}
          - {w: "hacer cuenta de", d: "to plan on, reckon on"}
          - {w: "recebir", d: "= recibir, to receive; here 'to take on' a servant. Archaic spelling used throughout"}
          - {w: "labrador", d: "peasant farmer, tiller of the soil, whether he owns the land or works it for others"}
          - {w: "vecino", d: "neighbor; also 'resident, fellow townsman'"}
          - {w: "con hijos", d: "with children, i.e. with a family to feed"}
          - {w: "a propósito para", d: "suited for, just right for"}
          - {w: "escuderil", d: "squirely, belonging to a squire"}
        diagram:
          - s: "determinó"
            r: "main verb: he decided; the subject 'he' is in the ending"
            under:
              - s: "Mas, viniéndole a la memoria los consejos de su huésped"
                r: "when/why: as his host's advice came back to him"
                under:
                  - s: "cerca de las prevenciones tan necesarias"
                    r: "what the advice was about: necessary provisions"
                    under:
                      - {s: "que había de llevar consigo", r: "describes 'prevenciones': that he was to carry with him"}
                      - {s: "especial la de los dineros y camisas", r: "especially the one about money and shirts"}
              - {s: "volver a su casa", r: "what he decided, 1: to go home"}
              - {s: "y acomodarse de todo, y de un escudero", r: "what he decided, 2: to fit himself out with everything, and with a squire"}
              - s: "haciendo cuenta de recebir a un labrador vecino suyo"
                r: "how: planning to take on a farmer, a neighbor of his"
                under:
                  - {s: "que era pobre y con hijos, pero muy a propósito para el oficio escuderil de la caballería", r: "describes 'labrador': poor, with children, but just right for a squire"}
        forms:
          - {w: "viniéndole", f: "vin- + -iendo + le → venir (to come), gerund, with 'le' (to him) hung on the end; the accent is added to keep the stress on -ien-: 'coming to him'. venir's gerund has i: viniendo. A pronoun attaches to the end of a gerund."}
          - {w: "había de llevar", f: "hab- + -ía → haber (to have), imperfect, he, + de + the infinitive llevar (to carry): 'haber de' = 'was to, had to carry'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían (había, habías, había, habíamos, habíais, habían)."}
          - {w: "consigo", f: "con + sí fused: 'with himself'. Same family as conmigo (with me) and contigo (with you)."}
          - {w: "la de", f: "'the one about': 'la' stands for 'la prevención'."}
          - {w: "determinó", f: "determin- + -ó → determinar (to decide), preterite, he: 'decided'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "volver, acomodarse", f: "infinitives after determinó: 'to go back', 'to fit himself out'. acomodar + se: the pronoun hangs on the end of the infinitive."}
          - {w: "haciendo", f: "hac- + -iendo → hacer (to make), gerund: 'making [account]'; 'hacer cuenta de' = to plan on."}
          - {w: "recebir", f: "old spelling of recibir (to receive, take on), infinitive after 'de'."}
          - {w: "a un labrador", f: "personal 'a': Spanish puts 'a' before a direct object that is a particular person."}
          - {w: "suyo", f: "suy- + -o → 'of his', the long possessive placed after the noun, masculine to match 'vecino': 'un vecino suyo' = a neighbor of his."}
          - {w: "era", f: "ser (to be), imperfect, he: 'was'. ser's imperfect is irregular: era, eras, era, éramos, erais, eran."}
          - {w: "escuderil", f: "escuder(o) + -il → adjective 'squirely', like varonil (manly) from varón."}
        ormsby_note: "Labrador, the word used here to describe the status of Sancho, means, generally, a tiller of the soil, and includes farmers employing laborers, like Juan Haldudo the Rich, who is so described lower down, as well as those who tilled their land themselves or worked for others. Sancho was one of the latter class, as appears from a remark of his own in the Second Part."
      - es: "Con este pensamiento guió a Rocinante hacia su aldea, el cual, casi conociendo la querencia, con tanta gana comenzó a caminar, que parecía que no ponía los pies en el suelo."
        literal: "With this thought he-guided [to] Rocinante toward his village, the which, almost knowing the home-haunt, with such eagerness began to walk, that it-seemed that not he-put the feet on the ground."
        ormsby: "With this object he turned his horse’s head towards his village, and Rocinante, thus reminded of his old quarters, stepped out so briskly that he hardly seemed to tread the earth."
        vocab:
          - {w: "guiar", d: "to guide, steer"}
          - {w: "aldea", d: "village"}
          - {w: "el cual", d: "which, who; here it refers back to Rocinante"}
          - {w: "querencia", d: "an animal's attachment to its home ground or stable; 'conocer la querencia' = to sense it is heading home"}
          - {w: "gana", d: "eagerness, will; 'con tanta gana' = so eagerly"}
          - {w: "comenzar a", d: "to begin to"}
          - {w: "no poner los pies en el suelo", d: "to go so fast the feet hardly touch the ground"}
        diagram:
          - s: "guió"
            r: "main verb 1: he steered; the subject 'he' is in the ending"
            under:
              - {s: "Con este pensamiento", r: "with what in mind"}
              - {s: "a Rocinante", r: "object"}
              - {s: "hacia su aldea", r: "where to"}
          - s: "comenzó a caminar"
            r: "main verb 2: began to walk"
            under:
              - {s: "el cual", r: "subject: which (Rocinante)"}
              - {s: "casi conociendo la querencia", r: "why: almost as if he sensed home"}
              - s: "con tanta gana"
                r: "how: so eagerly"
                under:
                  - {s: "que parecía que no ponía los pies en el suelo", r: "result: that he seemed not to touch the ground"}
        forms:
          - {w: "guió", f: "gui- + -ó → guiar (to guide), preterite, he: 'steered'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "el cual", f: "'which', masculine singular to match Rocinante: el cual, la cual, los cuales, las cuales."}
          - {w: "conociendo", f: "conoc- + -iendo → conocer (to know, recognize), gerund: 'sensing'."}
          - {w: "tanta", f: "tant- + -a → tanto (so much), feminine to match 'gana'. 'tanta ... que' = so much ... that."}
          - {w: "comenzó", f: "comenz- + -ó → comenzar (to begin), preterite, he: 'began'; 'comenzar a' + infinitive. Same -ar preterite."}
          - {w: "parecía", f: "parec- + -ía → parecer (to seem), imperfect, it: 'it seemed'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "ponía", f: "pon- + -ía → poner (to put), imperfect, he: 'was putting'. Same -ía imperfect; poner is regular in this tense."}
        note: "Horses head home eagerly, and the knight's route is in effect chosen by his nag. Rocinante's wish to get back to the stable will decide the road again later in this chapter."
  - sentences:
      - es: "No había andado mucho, cuando le pareció que a su diestra mano, de la espesura de un bosque que allí estaba, salían unas voces delicadas, como de persona que se quejaba; y apenas las hubo oído, cuando dijo:"
        literal: "Not he-had gone much, when to-him it-seemed that at his right hand, from the thickness of a wood that there was, came-out some voices faint, as of person who herself-was-complaining; and scarcely them he-had heard, when he-said:"
        ormsby: "He had not gone far, when out of a thicket on his right there seemed to come feeble cries as of someone in distress, and the instant he heard them he exclaimed,"
        vocab:
          - {w: "andar", d: "to go, travel (on foot or horseback)"}
          - {w: "a su diestra mano", d: "on his right hand, on his right; diestro = right (as in 'dexterous')"}
          - {w: "espesura", d: "thicket, dense growth"}
          - {w: "bosque", d: "wood, woodland"}
          - {w: "voces", d: "cries, shouts; 'voz' is often 'shout' rather than 'voice'"}
          - {w: "delicado", d: "here: faint, thin, weak"}
          - {w: "quejarse", d: "to moan, cry out in pain; also 'to complain'"}
          - {w: "apenas ... cuando", d: "no sooner ... than, scarcely ... when"}
        diagram:
          - s: "No había andado mucho"
            r: "main clause 1: he had not gone far"
            under:
              - s: "cuando le pareció"
                r: "when: when it seemed to him"
                under:
                  - s: "que a su diestra mano, de la espesura de un bosque que allí estaba, salían unas voces delicadas"
                    r: "what seemed: that faint cries came from a thicket on his right"
                    under:
                      - {s: "como de persona que se quejaba", r: "like whose: like someone in pain"}
          - s: "dijo:"
            r: "main verb 2 (after 'y'): he said"
            under:
              - {s: "apenas las hubo oído, cuando", r: "when: the moment he had heard them"}
        forms:
          - {w: "había andado", f: "hab- + -ía → haber, imperfect, he, + andado (participle of andar, to go): pluperfect, 'had gone'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "le pareció", f: "parec- + -ió → parecer (to seem), preterite, it, with 'le' (to him): 'it seemed to him'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "diestra", f: "diestr- + -a → diestro (right), feminine to match 'mano', which is feminine despite its -o."}
          - {w: "estaba", f: "est- + -aba → estar (to be, of place), imperfect, it: 'that was there'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "salían", f: "sal- + -ían → salir (to come out), imperfect, they (the cries). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "unas", f: "un- + -as → 'some', feminine plural to match 'voces'."}
          - {w: "delicadas", f: "delicad- + -as → delicado, feminine plural to match 'voces' (voz, plural voces: z becomes c before e)."}
          - {w: "se quejaba", f: "quej- + -aba → quejarse (to moan), imperfect, she/he (the person), with 'se' before it; this verb always carries its pronoun. Same -aba imperfect as estaba."}
          - {w: "las", f: "'them', feminine plural object pronoun standing for 'voces'."}
          - {w: "hubo oído", f: "hub- + -o → haber, preterite, he, + oído (participle of oír, to hear): the past anterior, 'had heard', used after apenas and cuando for 'the moment he had'. haber's preterite: hube, hubiste, hubo, hubimos, hubisteis, hubieron."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he: 'said'. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Gracias doy al cielo por la merced que me hace, pues tan presto me pone ocasiones delante donde yo pueda cumplir con lo que debo a mi profesión, y donde pueda coger el fruto de mis buenos deseos."
        literal: "— Thanks I-give to-the heaven for the favor that to-me it-does, since so soon to-me it-puts occasions in-front where I may fulfill with that which I-owe to my profession, and where I-may gather the fruit of my good desires."
        ormsby: "“Thanks be to heaven for the favour it accords me, that it so soon offers me an opportunity of fulfilling the obligation I have undertaken, and gathering the fruit of my ambition."
        vocab:
          - {w: "dar gracias", d: "to give thanks"}
          - {w: "cielo", d: "heaven; also 'sky'"}
          - {w: "merced", d: "favor, grace, kindness (also in 'vuestra merced', your worship)"}
          - {w: "presto", d: "quickly, soon (literary)"}
          - {w: "delante", d: "in front, before (one)"}
          - {w: "cumplir con", d: "to fulfill, discharge (a duty)"}
          - {w: "profesión", d: "here: his calling, the vows he has taken, as a monk 'professes'"}
          - {w: "coger", d: "to gather, pick"}
        diagram:
          - s: "Gracias doy"
            r: "main verb: I give thanks"
            under:
              - {s: "al cielo", r: "to whom: to heaven"}
              - s: "por la merced"
                r: "for what: for the favor"
                under:
                  - {s: "que me hace", r: "describes 'merced': that it does me"}
              - s: "pues tan presto me pone ocasiones delante"
                r: "why: since it so soon puts chances in front of me"
                under:
                  - {s: "donde yo pueda cumplir con lo que debo a mi profesión", r: "describes 'ocasiones', 1: where I can do what I owe my calling"}
                  - {s: "y donde pueda coger el fruto de mis buenos deseos", r: "describes 'ocasiones', 2: where I can reap the fruit of my good intentions"}
        forms:
          - {w: "doy", f: "dar (to give), present, I: 'I give'. Irregular only in this person: doy, das, da, damos, dais, dan."}
          - {w: "al", f: "a + el (to the)."}
          - {w: "hace", f: "hac- + -e → hacer (to do), present, it (heaven): 'does'. hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "pone", f: "pon- + -e → poner (to put), present, it: 'puts'. pongo, pones, pone, ponemos, ponéis, ponen."}
          - {w: "pueda", f: "pued- + -a → poder (can), present subjunctive, I: 'where I may'. The stem o becomes ue when stressed: pueda, puedas, pueda, podamos, podáis, puedan. Subjunctive because the chances are hoped for, not yet found."}
          - {w: "cumplir, coger", f: "infinitives after pueda: 'fulfill', 'gather'."}
          - {w: "debo", f: "deb- + -o → deber (to owe), present, I. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "mis buenos", f: "plural to match 'deseos': mi → mis, bueno → buenos."}
        note: "He speaks of knighthood as a 'profesión' in the religious sense, as if he had taken vows; the romances treat knight-errantry as a sacred order, and he thanks heaven for sending him wrongs to right."
      - es: "Estas voces, sin duda, son de algún menesteroso o menesterosa, que ha menester mi favor y ayuda."
        literal: "These cries, without doubt, are of some needy-man or needy-woman, who has need [of] my favor and help."
        ormsby: "These cries, no doubt, come from some man or woman in want of help, and needing my aid and protection;”"
        vocab:
          - {w: "menesteroso", d: "needy person, one in distress"}
          - {w: "haber menester", d: "to need (archaic): 'ha menester' = needs"}
          - {w: "favor", d: "help, protection"}
        diagram:
          - s: "son"
            r: "main verb: are"
            under:
              - {s: "Estas voces", r: "subject: these cries"}
              - {s: "sin duda", r: "how sure: no doubt"}
              - s: "de algún menesteroso o menesterosa"
                r: "whose: of some needy man or woman"
                under:
                  - {s: "que ha menester mi favor y ayuda", r: "describes 'menesteroso': who needs my help"}
        forms:
          - {w: "Estas", f: "est- + -as → 'these', feminine plural to match 'voces': este, esta, estos, estas."}
          - {w: "son", f: "ser (to be), present, they: 'are'. soy, eres, es, somos, sois, son."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun, like un, ningún, buen, primer."}
          - {w: "menesteroso o menesterosa", f: "the same adjective used as a noun in both genders: -o for a man, -a for a woman."}
          - {w: "ha menester", f: "ha = haber (to have), present, he/she; 'haber menester' = to have need of. haber's present: he, has, ha, hemos, habéis, han."}
        note: "'Menesteroso o menesterosa' covers both sexes with lawyerly care: the knight-errant's duty is to all the distressed, and he does not yet know whom he is rescuing."
  - sentences:
      - es: "Y, volviendo las riendas, encaminó a Rocinante hacia donde le pareció que las voces salían."
        literal: "And, turning the reins, he-directed [to] Rocinante toward where to-him it-seemed that the cries came-out."
        ormsby: "and wheeling, he turned Rocinante in the direction whence the cries seemed to proceed."
        vocab:
          - {w: "volver las riendas", d: "to turn (the horse) round; rienda = rein"}
          - {w: "encaminar", d: "to direct, set on the way (from camino)"}
        diagram:
          - s: "encaminó"
            r: "main verb: he steered; the subject 'he' is in the ending"
            under:
              - {s: "volviendo las riendas", r: "how: turning the reins"}
              - {s: "a Rocinante", r: "object"}
              - {s: "hacia donde le pareció que las voces salían", r: "where to: to where the cries seemed to come from"}
        forms:
          - {w: "volviendo", f: "volv- + -iendo → volver (to turn), gerund: 'turning'."}
          - {w: "encaminó", f: "encamin- + -ó → encaminar (to direct), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "le pareció", f: "parec- + -ió → parecer (to seem), preterite, it, with 'le' (to him). The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "salían", f: "sal- + -ían → salir (to come out), imperfect, they (the cries). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
      - es: "Y, a pocos pasos que entró por el bosque, vio atada una yegua a una encina, y atado en otra a un muchacho, desnudo de medio cuerpo arriba, hasta de edad de quince años, que era el que las voces daba;"
        literal: "And, at few steps that he-entered through the wood, he-saw tied a mare to an oak, and tied on another [to] a boy, naked from half body up, up-to of age of fifteen years, who was the one who the cries was-giving;"
        ormsby: "He had gone but a few paces into the wood, when he saw a mare tied to an oak, and tied to another, and stripped from the waist upwards, a youth of about fifteen years of age, from whom the cries came."
        vocab:
          - {w: "a pocos pasos que", d: "a few steps after, when he had gone a few steps"}
          - {w: "yegua", d: "mare"}
          - {w: "encina", d: "holm oak, the evergreen oak of the Spanish countryside"}
