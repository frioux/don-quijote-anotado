                under:
                  - {s: "que vos pagastes", r: "describes 'zapatos': that you paid for"}
        forms:
          - {w: "rompió", f: "romp- + -ió → romper (to break), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "vos", f: "the pronoun 'you' used by Don Quijote to address one person of lower rank; it takes the vosotros endings."}
          - {w: "pagastes", f: "pag- + -astes → pagar (to pay), preterite, you (vos): an old form of 'pagasteis'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis (old -astes), -aron."}
          - {w: "habéis rompido", f: "habéis (haber, present, you: he, has, ha, hemos, habéis, han) + rompido, the old regular participle of romper; today 'roto'."}
          - {w: "el de", f: "'that of': 'el' stands for 'el cuero'."}
        note: "A pun on 'cuero', which is both shoe leather and a person's hide: the boy wore out the master's leather, the master has torn the boy's."
