  - sentences:
      - es: "Y, en diciendo esto, picó a su Rocinante, y en breve espacio se apartó dellos."
        literal: "And, on saying this, he-spurred [to] his Rocinante, and in brief space himself-separated from-them."
        ormsby: "So saying, he gave Rocinante the spur and was soon out of reach."
        vocab:
          - {w: "en diciendo", d: "on saying, as soon as he said"}
          - {w: "picar", d: "to spur (a horse)"}
          - {w: "en breve espacio", d: "in a short while, soon"}
          - {w: "apartarse de", d: "to move away from"}
          - {w: "dellos", d: "= de ellos, from them; Cervantes fuses de with él, ella, ellos, este"}
        diagram:
          - s: "picó a su Rocinante"
            r: "main verb 1: he spurred his Rocinante"
            under:
              - {s: "en diciendo esto", r: "when: as soon as he'd said this"}
          - s: "se apartó dellos"
            r: "main verb 2 (after 'y'): moved away from them"
            under:
              - {s: "en breve espacio", r: "when: shortly"}
        forms:
          - {w: "diciendo", f: "dic- + -iendo → decir (to say), gerund; the stem e becomes i. 'en' + gerund = as soon as."}
          - {w: "picó", f: "pic- + -ó → picar (to spur), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (the I-form is 'piqué', qu keeping the hard c)."}
          - {w: "se apartó", f: "apart- + -ó → apartarse (to move away), preterite, he, with 'se'. Same -ar preterite."}
          - {w: "dellos", f: "de + ellos (from them). Modern Spanish keeps only 'del'."}
      - es: "Siguióle el labrador con los ojos, y, cuando vio que había traspuesto del bosque y que ya no parecía, volvióse a su criado Andrés y díjole:"
        literal: "Followed-him the farmer with the eyes, and, when he-saw that he-had crossed-out of-the wood and that already not he-appeared, turned-himself to his servant Andrés and said-to-him:"
        ormsby: "The farmer followed him with his eyes, and when he saw that he had cleared the wood and was no longer in sight, he turned to his boy Andrés, and said,"
        vocab:
          - {w: "trasponer", d: "to pass beyond, go out of sight behind"}
          - {w: "parecer", d: "here in its old sense 'to appear, be seen' (cf. aparecer)"}
          - {w: "volverse a", d: "to turn to"}
        diagram:
          - s: "Siguióle"
            r: "main verb 1: followed him"
            under:
              - {s: "el labrador", r: "subject, after the verb"}
              - {s: "con los ojos", r: "how: with his eyes"}
          - s: "volvióse a su criado Andrés"
            r: "main verb 2: turned to his servant Andrés"
            under:
              - s: "cuando vio"
                r: "when: when he saw"
                under:
                  - {s: "que había traspuesto del bosque", r: "what he saw, 1: that he had passed out of the wood"}
