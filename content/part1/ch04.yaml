  - sentences:
      - es: "— ¿Irme yo con él? —dijo el muchacho—. Mas, ¡mal año! No, señor, ni por pienso; porque, en viéndose solo, me desuelle como a un San Bartolomé."
        literal: "— To-go-myself I with him? —said the boy—. But, bad year! No, sir, not even in thought; because, on seeing-himself alone, me he-would-flay like [to] a Saint Bartholomew."
        ormsby: "“I go with him!” said the youth. “Nay, God forbid! No, señor, not for the world; for once alone with me, he would flay me like a Saint Bartholomew.”"
        vocab:
          - {w: "irse", d: "to go off, go away"}
          - {w: "¡mal año!", d: "'bad year!', an exclamation of refusal: no way, God forbid"}
          - {w: "ni por pienso", d: "not on your life, not even in thought"}
          - {w: "en + gerund", d: "as soon as: 'en viéndose' = as soon as he sees himself"}
          - {w: "desollar", d: "to flay, skin"}
          - {w: "San Bartolomé", d: "St Bartholomew, the apostle martyred by being flayed alive; painted holding his own skin"}
        diagram:
          - s: "Irme yo con él"
            r: "outraged question, no conjugated verb: me, go with him?"
          - {s: "dijo el muchacho", r: "speech tag"}
          - {s: "Mas, ¡mal año!", r: "exclamation: no way!"}
          - {s: "No, señor, ni por pienso", r: "refusal: no, sir, not on your life"}
          - s: "me desuelle como a un San Bartolomé"
            r: "why (after 'porque'): he'd flay me like a St Bartholomew"
            under:
