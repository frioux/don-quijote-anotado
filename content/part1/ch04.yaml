          - {w: "cuál", f: "'which', accented in a reported question."}
          - {w: "aquéllos", f: "'those', masculine plural for the roads; the old accent marks it as a pronoun."}
          - {w: "tomarían", f: "tomar + -ían → tomar (to take), conditional, they: 'would take'. The conditional adds its endings to the whole infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "imitarlos", f: "imitar + los: 'to imitate them', infinitive with 'los' on the end, after 'por' (in order to)."}
          - {w: "estuvo", f: "estuv- + -o → estar (to be), preterite, he. Irregular: estuve, estuviste, estuvo, estuvimos, estuvisteis, estuvieron."}
          - {w: "quedo", f: "the adjective 'still', masculine to match him; not the verb quedar."}
