          - {w: "está acabado", f: "está (estar, present, it: estoy, estás, está, estamos, estáis, están) + acabado (participle of acabar, to finish): 'is finished'."}
          - {w: "viene", f: "vien- + -e → venir (to come), present, it: 'comes [to me]'. vengo, vienes, viene, venimos, venís, vienen."}
