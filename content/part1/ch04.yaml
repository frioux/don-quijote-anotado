  - sentences:
      - es: "— Señor caballero —replicó el mercader—, suplico a vuestra merced, en nombre de todos estos príncipes que aquí estamos, que, porque no encarguemos nuestras conciencias confesando una cosa por nosotros jamás vista ni oída, y más siendo tan en perjuicio de las emperatrices y reinas del Alcarria y Estremadura, que vuestra merced sea servido de mostrarnos algún retrato de esa señora, aunque sea tamaño como un grano de trigo;"
        literal: "— Sir knight —replied the merchant—, I-beg [to] your grace, in name of all these princes who here we-are, that, so-that not we-burden our consciences confessing a thing by us never seen nor heard, and more being so in prejudice of the empresses and queens of-the Alcarria and Estremadura, that your grace be served of to-show-us some portrait of that lady, although it-be size as a grain of wheat;"
        ormsby: "“Sir Knight,” replied the trader, “I entreat your worship in the name of this present company of princes, that, to save us from charging our consciences with the confession of a thing we have never seen or heard of, and one moreover so much to the prejudice of the Empresses and Queens of the Alcarria and Estremadura, your worship will be pleased to show us some portrait of this lady, though it be no bigger than a grain of wheat;"
        vocab:
          - {w: "suplicar", d: "to beg, entreat"}
          - {w: "príncipes", d: "princes; the merchant mockingly adopts the knight's view of them"}
          - {w: "encargar la conciencia", d: "to burden one's conscience"}
          - {w: "y más", d: "and all the more"}
          - {w: "en perjuicio de", d: "to the detriment of, prejudicial to"}
          - {w: "Alcarria", d: "a bare, thinly peopled district east of Madrid, in the upper Tagus valley"}
          - {w: "Estremadura", d: "Extremadura, a poor, backward province in the west of Spain"}
          - {w: "ser servido de", d: "to be pleased to (a courtly formula)"}
          - {w: "retrato", d: "portrait"}
          - {w: "tamaño como", d: "as big as, the size of"}
          - {w: "trigo", d: "wheat"}
        diagram:
