  - sentences:
      - es: "En esto, llegó a un camino que en cuatro se dividía, y luego se le vino a la imaginación las encrucejadas donde los caballeros andantes se ponían a pensar cuál camino de aquéllos tomarían, y, por imitarlos, estuvo un rato quedo;"
        literal: "In this, he-arrived at a road that in four itself-divided, and at-once itself to-him came to the imagination the crossroads where the knights errant themselves-put to think which road of those they-would-take, and, for to-imitate-them, he-was a while still;"
        ormsby: "He now came to a road branching in four directions, and immediately he was reminded of those crossroads where knights-errant used to stop to consider which road they should take. In imitation of them he halted for a while,"
        vocab:
          - {w: "en esto", d: "at this point, just then"}
          - {w: "luego", d: "at once, straightaway (old sense)"}
          - {w: "venírsele a la imaginación", d: "to come into his head"}
          - {w: "encrucejada", d: "= encrucijada, crossroads (old spelling)"}
          - {w: "caballero andante", d: "knight-errant, a wandering knight in search of adventures"}
          - {w: "ponerse a", d: "to start to, set about"}
          - {w: "rato", d: "a while"}
          - {w: "quedo", d: "still, motionless"}
        diagram:
          - s: "llegó a un camino"
            r: "main verb 1: he came to a road"
            under:
              - {s: "En esto", r: "when: just then"}
              - {s: "que en cuatro se dividía", r: "describes 'camino': that split into four"}
          - s: "se le vino a la imaginación"
            r: "main verb 2 (after 'y luego'): there came into his head"
            under:
              - s: "las encrucejadas"
                r: "subject: the crossroads"
                under:
                  - {s: "donde los caballeros andantes se ponían a pensar cuál camino de aquéllos tomarían", r: "describes 'encrucejadas': where knights-errant would stop to think which road to take"}
          - s: "estuvo un rato quedo"
            r: "main verb 3 (after 'y'): he stayed still for a while"
            under:
              - {s: "por imitarlos", r: "why: to imitate them"}
        forms:
          - {w: "llegó", f: "lleg- + -ó → llegar (to arrive), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (the I-form is 'llegué', gu keeping the hard g)."}
          - {w: "se dividía", f: "divid- + -ía → dividirse (to split), imperfect, it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "se le vino", f: "vino → venir (to come; 'venírsele' = to come to someone), preterite, it, with 'se' and 'le' (to him). Irregular: vine, viniste, vino, vinimos, vinisteis, vinieron. Singular although 'encrucejadas' is plural: a verb placed before its subject is often left singular in Cervantes."}
