          - {s: "le desató", r: "main verb 1 (after 'Pero, al fin'): untied him"}
          - s: "le dio licencia"
            r: "main verb 2 (after 'y'): gave him leave"
            under:
              - s: "que fuese a buscar su juez"
                r: "leave for what: to go and look for his judge"
                under:
                  - {s: "para que ejecutase la pronunciada sentencia", r: "why: so that he might carry out the sentence he'd pronounced"}
        forms:
          - {w: "desató", f: "desat- + -ó → desatar (to untie), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "le", f: "'him' / 'to him', the boy; 'le' as direct object for a male person is leísmo, normal in Castile."}
          - {w: "dio", f: "dar (to give), preterite, he. Irregular: di, diste, dio, dimos, disteis, dieron."}
          - {w: "fuese", f: "ir (to go), imperfect subjunctive (-se form), he; identical to ser's: fuese, fueses, fuese, fuésemos, fueseis, fuesen. Subjunctive because it is what he was permitted to do."}
          - {w: "buscar su juez", f: "infinitive (to look for) after 'a'; no personal 'a' before 'su juez', which modern Spanish would add."}
          - {w: "ejecutase", f: "ejecut- + -ase → ejecutar (to carry out), imperfect subjunctive (-se form), he (the judge). The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. Subjunctive after 'para que'."}
          - {w: "pronunciada", f: "pronunci- + -ada → pronunciar (to pronounce), participle, feminine to match 'sentencia', placed before the noun as in legal style."}
      - es: "Andrés se partió algo mohíno, jurando de ir a buscar al valeroso don Quijote de la Mancha y contalle punto por punto lo que había pasado, y que se lo había de pagar con las setenas."
        literal: "Andrés himself-departed somewhat sulky, swearing of to-go to seek [to] the valorous don Quijote of La Mancha and to-tell-him point by point that which had happened, and that to-him it he-had to pay with the sevenfolds."
        ormsby: "Andrés went off rather down in the mouth, swearing he would go to look for the valiant Don Quixote of La Mancha and tell him exactly what had happened, and that all would have to be repaid him sevenfold;"
