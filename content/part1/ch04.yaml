          - {w: "había traspuesto", f: "había (haber, imperfect, he: había, habías, había, habíamos, habíais, habían) + traspuesto (irregular participle of trasponer, like puesto from poner): 'had passed out of sight'."}
          - {w: "parecía", f: "parec- + -ía → parecer (to appear), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "volvióse", f: "volv- + -ió + se → volverse (to turn round), preterite, he, with 'se' on the end: modern 'se volvió'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "díjole", f: "dij- + -o + le → decir (to say), preterite, he, with 'le' (to him) on the end: modern 'le dijo'. dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Venid acá, hijo mío, que os quiero pagar lo que os debo, como aquel deshacedor de agravios me dejó mandado."
        literal: "— Come here, son mine, for to-you I-want to-pay that which to-you I-owe, as that undoer of wrongs to-me left ordered."
        ormsby: "“Come here, my son, I want to pay you what I owe you, as that undoer of wrongs has commanded me.”"
        vocab:
          - {w: "acá", d: "here, over here (with motion)"}
          - {w: "hijo mío", d: "my son, my boy"}
          - {w: "deshacedor de agravios", d: "undoer of wrongs, Don Quijote's own title in its modern h- spelling"}
          - {w: "dejar mandado", d: "to leave (someone) with orders, to have ordered"}
        diagram:
          - s: "Venid acá"
            r: "command: come here"
            under:
              - {s: "hijo mío", r: "addressed: my son"}
          - s: "que os quiero pagar lo que os debo"
            r: "why: for I want to pay you what I owe you"
            under:
              - {s: "como aquel deshacedor de agravios me dejó mandado", r: "how: as that undoer of wrongs ordered me"}
        forms:
          - {w: "Venid", f: "the imperative of venir (to come) for vos: drop the -r and add -d."}
          - {w: "mío", f: "the long possessive after the noun, masculine to match 'hijo'."}
          - {w: "quiero", f: "quier- + -o → querer (to want), present, I. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "os ... pagar", f: "'to pay you': the pronoun of vos, placed before quiero though it belongs to pagar."}
          - {w: "debo", f: "deb- + -o → deber (to owe), present, I. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "aquel", f: "'that' (over there), masculine singular: aquel, aquella, aquellos, aquellas."}
          - {w: "deshacedor", f: "deshac- + -edor → deshacer (to undo) + the -dor ending that makes a doer. The farmer uses the modern h-, mocking the knight's 'desfacedor'."}
          - {w: "dejó mandado", f: "dej- + -ó → dejar (to leave), preterite, he, + mandado (participle of mandar, to order): 'left [me] ordered'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
  - sentences:
      - es: "— Eso juro yo —dijo Andrés—; y ¡cómo que andará vuestra merced acertado en cumplir el mandamiento de aquel buen caballero, que mil años viva; que, según es de valeroso y de buen juez, vive Roque, que si no me paga, que vuelva y ejecute lo que dijo!"
        literal: "— That swear I —said Andrés—; and how that will-go your grace right in to-fulfill the command of that good knight, who thousand years may-he-live; for, according-as he-is of valiant and of good judge, lives Roque, that if not me you-pay, that he-return and carry-out that which he-said!"
        ormsby: "“My oath on it,” said Andrés, “your worship will be well advised to obey the command of that good knight—may he live a thousand years—for, as he is a valiant and just judge, by Roque, if you do not pay me, he will come back and do as he said.”"
        vocab:
          - {w: "eso juro yo", d: "I'll swear to that, and how"}
          - {w: "¡cómo que ...!", d: "and how ...! how right that ...!"}
          - {w: "andar acertado", d: "to act wisely, do the right thing"}
          - {w: "mandamiento", d: "command, order"}
          - {w: "que mil años viva", d: "may he live a thousand years, long live he"}
          - {w: "según es de valeroso", d: "valiant as he is"}
          - {w: "vive Roque", d: "an oath, 'as Roque lives'; nobody knows who Roque was"}
          - {w: "ejecutar", d: "to carry out, execute"}
        diagram:
          - {s: "Eso juro yo", r: "main clause 1: I swear to that"}
          - {s: "dijo Andrés", r: "speech tag"}
          - s: "andará vuestra merced acertado"
            r: "main clause 2 (after 'y ¡cómo que'): how wise your worship will be"
            under:
              - s: "en cumplir el mandamiento de aquel buen caballero"
                r: "in what: in obeying that good knight's order"
                under:
                  - {s: "que mil años viva", r: "blessing on 'caballero': may he live a thousand years"}
              - s: "que vuelva y ejecute lo que dijo"
                r: "why: for he'd come back and do what he said"
                under:
                  - {s: "según es de valeroso y de buen juez", r: "why he would: valiant and good judge that he is"}
                  - {s: "vive Roque", r: "oath: by Roque"}
                  - {s: "si no me paga", r: "condition: if you don't pay me"}
        forms:
          - {w: "juro", f: "jur- + -o → jurar (to swear), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "andará", f: "andar + -á → andar (to go; 'andar acertado' = to act wisely), future, you (vuestra merced). The future adds its endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "acertado", f: "acert- + -ado → acertar (to get right), participle, masculine to match the farmer."}
          - {w: "buen", f: "bueno clipped before a masculine singular noun."}
          - {w: "viva", f: "viv- + -a → vivir (to live), present subjunctive, he, as a wish: 'may he live'. The present subjunctive of -er and -ir verbs: -a, -as, -a, -amos, -áis, -an."}
          - {w: "es", f: "ser (to be), present, he: soy, eres, es, somos, sois, son. 'según es de valeroso' = valiant as he is."}
          - {w: "vive", f: "viv- + -e → vivir (to live), present, he: 'as Roque lives', an oath formula."}
          - {w: "paga", f: "pag- + -a → pagar (to pay), present, you (vuestra merced takes the he form). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "vuelva, ejecute", f: "vuelv- + -a → volver (to come back); ejecut- + -e → ejecutar (to carry out): present subjunctive, he. volver: vuelva, vuelvas, vuelva, volvamos, volváis, vuelvan; -ar verbs: -e, -es, -e, -emos, -éis, -en. The subjunctive after an oath's 'que' makes a sworn prediction: 'he'll come back, I swear'."}
        ormsby_note: "An obscure oath, of which there is no satisfactory explanation as to who or what Roque was, whether the San Roque who gave the name to the town near Gibraltar, or some Manchegan celebrity."
  - sentences:
