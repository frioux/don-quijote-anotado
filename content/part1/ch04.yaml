  - sentences:
      - es: "— ¿\"Miente\", delante de mí, ruin villano? —dijo don Quijote—. Por el sol que nos alumbra, que estoy por pasaros de parte a parte con esta lanza."
        literal: "— 'He-lies', in-front of me, base peasant? —said don Quijote—. By the sun that us lights, that I-am for to-pass-you from side to side with this lance."
        ormsby: "“Lies before me, base clown!” said Don Quixote. “By the sun that shines on us I have a mind to run you through with this lance."
        vocab:
          - {w: "delante de", d: "in front of, in the presence of"}
          - {w: "ruin", d: "base, vile, low"}
          - {w: "villano", d: "peasant, commoner (a 'villa' dweller, not noble); as an insult 'churl, lout'"}
          - {w: "alumbrar", d: "to light, shine on"}
          - {w: "estar por", d: "with an infinitive: to be inclined to, have half a mind to"}
          - {w: "pasar de parte a parte", d: "to run through, pierce from side to side"}
        diagram:
          - s: "Miente"
            r: "his word thrown back at him in outrage: 'he lies'?"
            under:
              - {s: "delante de mí", r: "where: in my presence"}
              - {s: "ruin villano", r: "addressed: base churl"}
          - {s: "dijo don Quijote", r: "speech tag: said Don Quijote"}
          - s: "que estoy por pasaros de parte a parte con esta lanza"
            r: "main clause, with emphatic 'que': I have half a mind to run you through with this lance"
            under:
              - {s: "Por el sol que nos alumbra", r: "oath: by the sun that shines on us"}
        forms:
          - {w: "Miente", f: "mient- + -e → mentir (to lie), present, he. The stem e becomes ie when stressed: miento, mientes, miente, mentimos, mentís, mienten."}
          - {w: "mí", f: "'me' after a preposition, with an accent to set it apart from 'mi' (my)."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "alumbra", f: "alumbr- + -a → alumbrar (to light), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "nos", f: "'us', object pronoun before the verb."}
          - {w: "estoy", f: "estar (to be), present, I: estoy, estás, está, estamos, estáis, están; 'estar por' + infinitive = to be on the point of, inclined to."}
          - {w: "pasaros", f: "pasar + os → 'to pass you [through]', infinitive with 'os' (you, the pronoun of 'vos') hung on the end. A pronoun attaches to the end of an infinitive."}
          - {w: "esta", f: "'this', feminine to match 'lanza'."}
        note: "To be given the lie ('you lie') in a gentleman's presence was an affront that called for satisfaction; Don Quijote takes the word as an insult to himself, though it was said of a shepherd boy."
      - es: "Pagadle luego sin más réplica; si no, por el Dios que nos rige, que os concluya y aniquile en este punto. Desatadlo luego."
        literal: "Pay-him at-once without more answer-back; if not, by the God who us rules, that you I-may-finish and annihilate in this point. Untie-him at-once."
        ormsby: "Pay him at once without another word; if not, by the God that rules us I will make an end of you, and annihilate you on the spot; release him instantly.”"
        vocab:
          - {w: "luego", d: "at once, right away (the old sense; today usually 'later')"}
          - {w: "réplica", d: "answering back, retort"}
          - {w: "regir", d: "to rule, govern"}
          - {w: "concluir", d: "here: to finish off, make an end of"}
          - {w: "aniquilar", d: "to annihilate"}
          - {w: "en este punto", d: "this instant, on the spot"}
          - {w: "desatar", d: "to untie"}
        diagram:
          - s: "Pagadle luego"
            r: "command 1: pay him at once"
            under:
              - {s: "sin más réplica", r: "how: without another word"}
          - s: "que os concluya y aniquile en este punto"
            r: "threat: I'll finish you off and annihilate you on the spot"
            under:
              - {s: "si no", r: "condition: if not"}
              - {s: "por el Dios que nos rige", r: "oath: by the God who rules us"}
          - {s: "Desatadlo luego.", r: "command 2: untie him at once"}
        forms:
          - {w: "Pagadle", f: "pagad + le → pagar (to pay), the imperative for vos, with 'le' (him) hung on the end: 'pay him'. The vos/vosotros imperative drops the -r of the infinitive and adds -d: pagar → pagad, desatar → desatad. Pronouns always attach to the end of a positive command."}
          - {w: "rige", f: "rig- + -e → regir (to rule), present, he. The stem e becomes i: rijo, riges, rige, regimos, regís, rigen."}
          - {w: "concluya", f: "conclu- + -ya → concluir (to finish off), present subjunctive, I. Verbs in -uir add a y: concluya, concluyas, concluya, concluyamos, concluyáis, concluyan. After an oath ('por Dios que ...') the subjunctive makes a vow: 'I'll finish you, I swear'."}
          - {w: "aniquile", f: "aniquil- + -e → aniquilar (to annihilate), present subjunctive, I. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "os", f: "'you', the object pronoun of vos."}
          - {w: "Desatadlo", f: "desatad + lo → desatar (to untie), vos imperative with 'lo' (him) on the end: 'untie him'."}
  - sentences:
      - es: "El labrador bajó la cabeza y, sin responder palabra, desató a su criado, al cual preguntó don Quijote que cuánto le debía su amo."
        literal: "The farmer lowered the head and, without to-answer word, untied [to] his servant, to-the whom asked don Quijote that how-much to-him owed his master."
        ormsby: "The farmer hung his head, and without a word untied his servant, of whom Don Quixote asked how much his master owed him."
        vocab:
          - {w: "bajar la cabeza", d: "to hang one's head, bow the head"}
          - {w: "sin responder palabra", d: "without a word in reply"}
          - {w: "amo", d: "master, employer"}
        diagram:
          - s: "bajó la cabeza"
            r: "main verb 1: hung his head"
            under:
              - {s: "El labrador", r: "subject"}
          - s: "desató a su criado"
            r: "main verb 2 (after 'y'): untied his servant"
            under:
              - {s: "sin responder palabra", r: "how: without a word"}
              - s: "al cual preguntó don Quijote"
                r: "describes 'criado': whom Don Quijote asked"
                under:
                  - {s: "que cuánto le debía su amo", r: "what he asked: how much his master owed him"}
        forms:
          - {w: "bajó, desató", f: "baj- + -ó → bajar (to lower); desat- + -ó → desatar (to untie); preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "responder", f: "infinitive (to answer) after 'sin' (without): English uses '-ing' here."}
          - {w: "al cual", f: "a + el cual: 'to whom', masculine singular for the servant."}
          - {w: "preguntó", f: "pregunt- + -ó → preguntar (to ask), preterite, he. Same -ar preterite."}
          - {w: "que cuánto", f: "an extra 'que' before a reported question, common in old Spanish; modern 'le preguntó cuánto'. cuánto takes an accent as a question word."}
          - {w: "debía", f: "deb- + -ía → deber (to owe), imperfect, he (the master). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
      - es: "Él dijo que nueve meses, a siete reales cada mes."
        literal: "He said that nine months, at seven reals each month."
        ormsby: "He replied, nine months at seven reals a month."
        vocab:
          - {w: "real", d: "silver coin worth 34 maravedís, the everyday unit for wages and prices; plural reales"}
          - {w: "a ... cada mes", d: "at ... a month"}
        diagram:
          - s: "Él dijo"
            r: "main verb: he said"
            under:
              - {s: "que nueve meses, a siete reales cada mes", r: "what he said: nine months, at seven reals a month"}
        forms:
          - {w: "Él", f: "'he', with an accent to set it apart from the article 'el'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "reales", f: "real + -es → plural of real; nouns ending in a consonant add -es."}
      - es: "Hizo la cuenta don Quijote y halló que montaban setenta y tres reales, y díjole al labrador que al momento los desembolsase, si no quería morir por ello."
        literal: "Made the account don Quijote and found that they-amounted-to seventy and three reals, and told-him to-the farmer that at-the moment them he-should-pay-out, if not he-wanted to-die for it."
        ormsby: "Don Quixote added it up, found that it came to sixty-three reals, and told the farmer to pay it down immediately, if he did not want to die for it."
        vocab:
          - {w: "hacer la cuenta", d: "to do the sum, work it out"}
          - {w: "hallar", d: "to find"}
          - {w: "montar", d: "here: to amount to, come to"}
          - {w: "al momento", d: "at once, this minute"}
          - {w: "desembolsar", d: "to pay out, disburse (from bolsa, purse)"}
        diagram:
          - s: "Hizo la cuenta"
            r: "main verb 1: did the sum"
            under:
              - {s: "don Quijote", r: "subject, put after the verb"}
          - s: "halló"
            r: "main verb 2 (after 'y'): found"
            under:
              - {s: "que montaban setenta y tres reales", r: "what he found: that it came to seventy-three reals"}
          - s: "díjole al labrador"
            r: "main verb 3 (after 'y'): told the farmer"
            under:
              - s: "que al momento los desembolsase"
                r: "what he told him: to pay them out at once"
                under:
                  - {s: "si no quería morir por ello", r: "condition: if he didn't want to die for it"}
        forms:
          - {w: "Hizo", f: "hizo → hacer (to do, make), preterite, he. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron (the z keeps the sound before o)."}
          - {w: "halló", f: "hall- + -ó → hallar (to find), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "montaban", f: "mont- + -aban → montar (to amount to), imperfect, they (the wages). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "díjole", f: "dij- + -o + le → decir (to say), preterite, he, with 'le' (to him) stuck on the end: modern 'le dijo'. Cervantes hangs the pronoun on a conjugated verb that opens its clause; 'le' is then repeated by 'al labrador'. decir's preterite: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "los", f: "'them', masculine plural for the reals."}
          - {w: "desembolsase", f: "desembols- + -ase → desembolsar (to pay out), imperfect subjunctive (-se form), he. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. Subjunctive because it reports an order."}
          - {w: "quería", f: "quer- + -ía → querer (to want), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "ello", f: "neuter 'it', the whole matter, after a preposition."}
        note: "Nine months at seven reals is sixty-three, not seventy-three. Whether the slip is Cervantes' or a joke on Don Quijote's arithmetic, Ormsby quietly corrects it."
      - es: "Respondió el medroso villano que para el paso en que estaba y juramento que había hecho —y aún no había jurado nada—, que no eran tantos, porque se le habían de descontar y recebir en cuenta tres pares de zapatos que le había dado y un real de dos sangrías que le habían hecho estando enfermo."
        literal: "Answered the fearful peasant that by the plight in which he-was and oath that he-had made —and still not he-had sworn nothing—, that not they-were so-many, because to-him had to-be discounted and received in account three pairs of shoes that to-him he-had given and one real of two bleedings that to-him they-had done being sick."
        ormsby: "The trembling clown replied that as he lived and by the oath he had sworn (though he had not sworn any) it was not so much; for there were to be taken into account and deducted three pairs of shoes he had given him, and a real for two blood-lettings when he was sick."
        vocab:
          - {w: "medroso", d: "fearful, timid (from miedo)"}
          - {w: "villano", d: "peasant, commoner, not noble"}
          - {w: "para el paso en que estoy", d: "an oath: 'by the plight I am in', as sure as I stand here"}
          - {w: "juramento", d: "oath"}
          - {w: "aún", d: "still, yet (with accent; 'aun' without it means 'even')"}
          - {w: "descontar", d: "to deduct"}
          - {w: "recebir en cuenta", d: "to take into account, credit; recebir = recibir, old spelling"}
          - {w: "sangría", d: "bloodletting, the standard cure of the day, done by the barber"}
          - {w: "enfermo", d: "sick"}
        diagram:
          - s: "Respondió"
            r: "main verb: answered"
            under:
              - {s: "el medroso villano", r: "subject: the frightened peasant"}
              - {s: "que para el paso en que estaba y juramento que había hecho", r: "oath he opens with: by his plight and the oath he had taken"}
              - {s: "y aún no había jurado nada", r: "narrator's aside: and he hadn't sworn anything yet"}
              - {s: "que no eran tantos", r: "what he answered: that it wasn't that many"}
              - s: "porque se le habían de descontar y recebir en cuenta tres pares de zapatos"
                r: "why: because three pairs of shoes had to be deducted"
                under:
                  - {s: "que le había dado", r: "describes 'zapatos': that he had given him"}
              - s: "y un real de dos sangrías"
                r: "also deducted: a real for two bleedings"
                under:
                  - {s: "que le habían hecho estando enfermo", r: "describes 'sangrías': done on him when he was sick"}
        forms:
          - {w: "Respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "había hecho", f: "hab- + -ía → haber, imperfect, he, + hecho (irregular participle of hacer, to make): pluperfect, 'had made'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "había jurado", f: "había + jurado (participle of jurar, to swear): 'had sworn'. Same pluperfect."}
          - {w: "que no eran", f: "the 'que' is repeated after the long aside, as in speech. eran = ser, imperfect, they: era, eras, era, éramos, erais, eran."}
          - {w: "tantos", f: "tant- + -os → tanto, masculine plural: 'so many [reals]'."}
          - {w: "se le habían de descontar", f: "habían (haber, imperfect, they) + de + infinitive descontar (to deduct): 'were to be deducted'. 'se' makes it passive; 'le' = from him."}
          - {w: "había dado", f: "había + dado (participle of dar, to give): 'had given'."}
          - {w: "habían hecho", f: "habían (they) + hecho: 'they had done'; 'they' = whoever bled him."}
          - {w: "estando", f: "est- + -ando → estar (to be), gerund: 'being [sick]', i.e. when he was sick."}
        note: "Bloodletting was the barber's job; barbers were also surgeons. The farmer charges the boy for the medical care and the shoes as deductions from his wages."
  - sentences:
      - es: "— Bien está todo eso —replicó don Quijote—, pero quédense los zapatos y las sangrías por los azotes que sin culpa le habéis dado;"
        literal: "— Well is all that —replied don Quijote—, but let-remain the shoes and the bleedings for the lashes that without guilt to-him you-have given;"
        ormsby: "“All that is very well,” said Don Quixote; “but let the shoes and the blood-lettings stand as a setoff against the blows you have given him without any cause;"
        vocab:
          - {w: "bien está", d: "that's all very well"}
          - {w: "replicar", d: "to reply, retort"}
          - {w: "quedar ... por", d: "to stand against, be set off against"}
          - {w: "sin culpa", d: "without guilt, i.e. undeservedly"}
        diagram:
          - s: "Bien está todo eso"
            r: "main clause 1: all that is very well"
          - {s: "replicó don Quijote", r: "speech tag"}
          - s: "quédense los zapatos y las sangrías"
            r: "main clause 2 (after 'pero'): let the shoes and the bleedings stand"
            under:
              - s: "por los azotes"
                r: "against what: against the lashes"
                under:
                  - {s: "que sin culpa le habéis dado", r: "describes 'azotes': that you have given him undeservedly"}
        forms:
          - {w: "está", f: "estar (to be), present, it: estoy, estás, está, estamos, estáis, están."}
          - {w: "eso", f: "neuter 'that [matter]'; esto, eso, aquello point at ideas and take no accent."}
          - {w: "replicó", f: "replic- + -ó → replicar (to retort), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "quédense", f: "qued- + -en + se → quedar (to remain), present subjunctive, they, with 'se' on the end: 'let them stand'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. A subjunctive used as a command ('let them') takes its pronoun on the end."}
          - {w: "habéis dado", f: "habéis = haber, present, you (vos): he, has, ha, hemos, habéis, han; + dado (participle of dar, to give): 'you have given'."}
      - es: "que si él rompió el cuero de los zapatos que vos pagastes, vos le habéis rompido el de su cuerpo;"
