  - sentences:
      - es: "— Descortés caballero, mal parece tomaros con quien defender no se puede; subid sobre vuestro caballo y tomad vuestra lanza —que también tenía una lanza arrimada a la encima adonde estaba arrendada la yegua—, que yo os haré conocer ser de cobardes lo que estáis haciendo."
        literal: "— Discourteous knight, ill it-looks to-take-on-yourself with whom defend not himself can; get-up on your horse and take your lance —for also he-had a lance leaned against the oak where was tethered the mare—, for I you will-make know to-be of cowards that which you-are doing."
        ormsby: "“Discourteous knight, it ill becomes you to assail one who cannot defend himself; mount your steed and take your lance” (for there was a lance leaning against the oak to which the mare was tied), “and I will make you know that you are behaving as a coward.”"
        vocab:
          - {w: "descortés", d: "discourteous; the stock insult of one knight to another in the romances"}
          - {w: "mal parece", d: "it looks bad, it is unbecoming"}
          - {w: "tomarse con", d: "to pick a fight with, set upon"}
          - {w: "subir sobre", d: "to mount, get up on"}
          - {w: "arrimado a", d: "leaning against, propped on"}
          - {w: "encima", d: "a misprint in the source for 'encina' (holm oak); 'encima' means 'on top'"}
          - {w: "adonde", d: "where (old: also for place without motion)"}
          - {w: "arrendar", d: "here: to tether a horse by the reins (from rienda); not 'to rent'"}
          - {w: "ser de cobardes", d: "to be a coward's act, to be what cowards do"}
        diagram:
          - s: "mal parece"
            r: "main verb 1: it looks bad"
            under:
              - {s: "Descortés caballero", r: "addressed: discourteous knight"}
              - {s: "tomaros con quien defender no se puede", r: "subject: picking on one who cannot defend himself"}
          - {s: "subid sobre vuestro caballo", r: "command 1: mount your horse"}
          - s: "y tomad vuestra lanza"
            r: "command 2: take your lance"
            under:
              - {s: "que también tenía una lanza arrimada a la encima adonde estaba arrendada la yegua", r: "narrator's aside: the farmer did have a lance, propped on the oak where the mare was tied"}
              - {s: "que yo os haré conocer ser de cobardes lo que estáis haciendo", r: "why: for I'll make you see that what you're doing is cowardly"}
        forms:
          - {w: "parece", f: "parec- + -e → parecer (to seem, look), present, it. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "tomaros", f: "tomar + os → tomarse (to take on) with 'os' (yourself) hung on the end; 'os' is the pronoun of 'vos'. A pronoun attaches to the end of an infinitive."}
          - {w: "defender no se puede", f: "pued- + -e → poder (can), present, he, with 'se' (himself) for defender: 'cannot defend himself', in a poetic order (plain: 'no se puede defender'). poder: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "subid, tomad", f: "the imperative for vos and vosotros: drop the -r of the infinitive and add -d: subir → subid (get up), tomar → tomad (take). Don Quijote addresses the farmer as 'vos', as knights do in the romances."}
          - {w: "vuestro, vuestra", f: "'your' for vos: masculine to match 'caballo', feminine to match 'lanza'."}
          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, he (the farmer). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "arrimada", f: "arrim- + -ada → arrimar (to lean), past participle, feminine to match 'lanza'."}
          - {w: "estaba arrendada", f: "est- + -aba → estar, imperfect, it, + arrendada (participle of arrendar, feminine for 'yegua'): 'was tethered'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "os haré conocer", f: "har- + -é → hacer (to make), future, I, + infinitive conocer (to know): 'I will make you know'. hacer's future: haré, harás, hará, haremos, haréis, harán. 'os' = you (vos)."}
          - {w: "ser", f: "infinitive (to be) after conocer: 'know [it] to be'."}
          - {w: "estáis haciendo", f: "estáis = estar, present, you (vos): estoy, estás, está, estamos, estáis, están; + haciendo (gerund of hacer, to do): 'you are doing'."}
        note: "Gutenberg prints 'encima' (on top) where the sense needs 'encina' (holm oak); it is a misprint, kept here because the Spanish text is never altered. Don Quijote hails a peasant as a knight and calls on him to fight on horseback with lances, as in a romance."
  - sentences:
