                  - {s: "y más siendo tan en perjuicio de las emperatrices y reinas del Alcarria y Estremadura", r: "all the more as it wrongs the empresses and queens of the Alcarria and Estremadura"}
              - s: "que vuestra merced sea servido de mostrarnos algún retrato de esa señora"
                r: "what he begs: that your worship be pleased to show us a portrait of the lady"
                under:
                  - {s: "aunque sea tamaño como un grano de trigo", r: "concession: even one as small as a grain of wheat"}
        forms:
          - {w: "replicó", f: "replic- + -ó → replicar (to retort), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "suplico", f: "suplic- + -o → suplicar (to beg), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "estamos", f: "estar (to be), present, we: estoy, estás, está, estamos, estáis, están. 'estos príncipes que aquí estamos' = we princes who are here."}
          - {w: "encarguemos", f: "encargu- + -emos → encargar (to burden), present subjunctive, we; g becomes gu before e. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. Subjunctive after 'porque' meaning 'so that'."}
          - {w: "nuestras", f: "nuestr- + -as → 'our', feminine plural to match 'conciencias'."}
          - {w: "confesando", f: "confes- + -ando → confesar (to confess), gerund: 'by confessing'."}
          - {w: "vista ni oída", f: "vista (irregular participle of ver, to see) and oída (participle of oír, to hear), feminine to match 'cosa'."}
          - {w: "siendo", f: "gerund of ser (to be): 'being'."}
          - {w: "del Alcarria", f: "old usage: 'el' before Alcarria's stressed a-; modern 'de la Alcarria'."}
          - {w: "sea servido", f: "sea (ser, present subjunctive, you (vuestra merced): sea, seas, sea, seamos, seáis, sean) + servido (participle of servir): 'be pleased'. Subjunctive after 'suplico que'."}
          - {w: "mostrarnos", f: "mostrar + nos: 'to show us', infinitive with 'nos' on the end."}
          - {w: "algún", f: "alguno clipped before a masculine singular noun."}
          - {w: "sea", f: "ser, present subjunctive, it (the portrait): after 'aunque' for a mere possibility."}
        ormsby_note: "The Alcarria is a bare, thinly populated district, in the upper valley of the Tagus, stretching from Guadalajara to the confines of Aragón. Estremadura is the most backward of all the provinces of Spain. In elevating these two regions into the rank of empires, the waggish trader falls in with the craze of Don Quixote."
