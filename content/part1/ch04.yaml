        forms:
          - {w: "quitó", f: "quit- + -ó → quitar (to take away), preterite, he (Don Quijote, still in the third person). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "a aquel", f: "'from that': with quitar, 'a' marks the person something is taken from."}
