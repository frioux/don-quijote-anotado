        forms:
          - {w: "Irme", f: "ir + me → irse (to go off), infinitive with 'me' on the end, used on its own for an indignant question: 'Me, go?'"}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "viéndose", f: "vi- + -endo + se → ver (to see), gerund with 'se' (himself) on the end; accent added to keep the stress. After 'en': 'as soon as he sees himself'."}
