  - sentences:
      - es: "— ¡Non fuyáis, gente cobarde; gente cautiva, atended!; que no por culpa mía, sino de mi caballo, estoy aquí tendido."
        literal: "— Not flee, people cowardly; people wretched, wait!; for not by fault mine, but of my horse, I-am here stretched-out."
        ormsby: "“Fly not, cowards and caitiffs! stay, for not by my fault, but my horse’s, am I stretched here.”"
        vocab:
          - {w: "non", d: "= no; archaic, the language of the romances"}
          - {w: "fuir", d: "= huir, to flee; the old f- form"}
          - {w: "cautivo", d: "wretched, caitiff (literally 'captive'; in old Spanish also 'miserable')"}
          - {w: "atender", d: "here: to wait, stay"}
          - {w: "tendido", d: "stretched out, lying"}
        diagram:
          - s: "Non fuyáis"
            r: "command 1: don't flee"
            under:
              - {s: "gente cobarde", r: "addressed: cowardly lot"}
          - s: "atended!"
            r: "command 2: wait!"
            under:
              - {s: "gente cautiva", r: "addressed: wretched lot"}
          - s: "estoy aquí tendido"
            r: "why (after 'que'): I'm lying here"
            under:
              - {s: "no por culpa mía, sino de mi caballo", r: "why: not through my fault, but my horse's"}
        forms:
          - {w: "Non", f: "old form of no."}
          - {w: "fuyáis", f: "fuy- + -áis → fuir, old f- form of huir (to flee), present subjunctive, you (vosotros). huya, huyas, huya, huyamos, huyáis, huyan. A negative command always uses the subjunctive."}
          - {w: "cobarde, cautiva", f: "agreeing with 'gente', feminine singular though it means many people; cobarde has one form for both genders."}
          - {w: "atended", f: "the imperative of atender (to wait) for vosotros: drop the -r and add -d."}
          - {w: "mía", f: "'my, of mine', the long possessive after the noun, feminine to match 'culpa'."}
          - {w: "estoy tendido", f: "estoy (estar, present, I: estoy, estás, está, estamos, estáis, están) + tendido (participle of tender, to stretch out): 'I am lying'."}
        note: "Knocked flat, Don Quijote slips into the archaic speech of the romances ('non fuyáis' for 'no huyáis'). Blaming the horse is a knight's excuse Cervantes will give him again."
