          - {w: "a un San Bartolomé", f: "personal 'a' before a person: 'as [he would flay] a St Bartholomew'."}
  - sentences:
      - es: "— No hará tal —replicó don Quijote—: basta que yo se lo mande para que me tenga respeto; y con que él me lo jure por la ley de caballería que ha recebido, le dejaré ir libre y aseguraré la paga."
        literal: "— Not he-will-do such —replied don Quijote—: it-suffices that I to-him it command for that me he-have respect; and with that he to-me it swear by the law of chivalry that he-has received, him I-will-let go free and I-will-assure the pay."
        ormsby: "“He will do nothing of the kind,” said Don Quixote; “I have only to command, and he will obey me; and as he has sworn to me by the order of knighthood which he has received, I leave him free, and I guarantee the payment.”"
        vocab:
          - {w: "tal", d: "such a thing"}
          - {w: "basta que", d: "it is enough that"}
          - {w: "tener respeto a", d: "to respect, obey"}
          - {w: "con que", d: "provided that, as long as"}
          - {w: "ley de caballería", d: "the law of knighthood, the code of the order"}
          - {w: "recebir", d: "= recibir, to receive (old spelling)"}
          - {w: "asegurar", d: "to guarantee"}
          - {w: "paga", d: "payment, pay"}
        diagram:
          - {s: "No hará tal", r: "main verb 1: he won't do such a thing"}
          - {s: "replicó don Quijote", r: "speech tag"}
          - s: "basta"
            r: "main verb 2: it is enough"
            under:
              - s: "que yo se lo mande"
                r: "what is enough: that I order it"
                under:
                  - {s: "para que me tenga respeto", r: "result: for him to respect me"}
          - s: "le dejaré ir libre"
            r: "main verb 3 (after 'y'): I will let him go free"
            under:
              - {s: "con que él me lo jure por la ley de caballería que ha recebido", r: "condition: as long as he swears it to me by the law of knighthood he has received"}
          - {s: "y aseguraré la paga", r: "main verb 4: and I will guarantee the pay"}
        forms:
          - {w: "hará", f: "har- + -á → hacer (to do), future, he. hacer's future has the short stem har-: haré, harás, hará, haremos, haréis, harán."}
          - {w: "replicó", f: "replic- + -ó → replicar (to retort), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "basta", f: "bast- + -a → bastar (to be enough), present, it. 'basta que' is followed by the subjunctive."}
          - {w: "se lo", f: "'it to him': le becomes se before lo, la, los, las."}
          - {w: "mande", f: "mand- + -e → mandar (to order), present subjunctive, I. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. Subjunctive after 'basta que'."}
          - {w: "tenga", f: "teng- + -a → tener (to have), present subjunctive, he. tenga, tengas, tenga, tengamos, tengáis, tengan. Subjunctive after 'para que' (so that)."}
          - {w: "jure", f: "jur- + -e → jurar (to swear), present subjunctive, he. Same -e subjunctive; after 'con que' (provided that)."}
          - {w: "ha recebido", f: "ha = haber, present, he: he, has, ha, hemos, habéis, han; + recebido (old spelling of recibido, participle of recibir, to receive): 'has received'."}
          - {w: "dejaré, aseguraré", f: "dejar + -é, asegurar + -é → dejar (to let), asegurar (to guarantee), future, I. The future adds its endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "le", f: "'him', the boy, as direct object: using 'le' rather than 'lo' for a male person is leísmo, normal in Castile."}
  - sentences:
      - es: "— Mire vuestra merced, señor, lo que dice —dijo el muchacho—, que este mi amo no es caballero ni ha recebido orden de caballería alguna; que es Juan Haldudo el rico, el vecino del Quintanar."
        literal: "— Look your grace, sir, that which you-say —said the boy—, for this my master not is knight nor has received order of chivalry any; for he-is Juan Haldudo the rich, the resident of-the Quintanar."
        ormsby: "“Consider what you are saying, señor,” said the youth; “this master of mine is not a knight, nor has he received any order of knighthood; for he is Juan Haldudo the Rich, of Quintanar.”"
        vocab:
          - {w: "vuestra merced", d: "'your grace', the polite 'you'; it takes the he/she form of the verb and later shrank to 'usted'"}
          - {w: "este mi amo", d: "this master of mine (demonstrative + possessive, old usage)"}
          - {w: "alguna", d: "after a noun in a negative sentence: 'no ... at all'"}
          - {w: "vecino", d: "here: resident, householder of a town"}
          - {w: "Quintanar", d: "Quintanar de la Orden, a town in La Mancha near El Toboso"}
        diagram:
          - s: "Mire vuestra merced"
            r: "main verb: consider, your worship"
            under:
              - {s: "señor", r: "addressed"}
              - {s: "lo que dice", r: "object: what you are saying"}
          - {s: "dijo el muchacho", r: "speech tag"}
          - s: "que este mi amo no es caballero"
            r: "why, 1: for this master of mine is not a knight"
            under:
              - {s: "ni ha recebido orden de caballería alguna", r: "why, 2: nor has he received any order of knighthood"}
          - {s: "que es Juan Haldudo el rico, el vecino del Quintanar", r: "why, 3: he's Juan Haldudo the Rich, of Quintanar"}
        forms:
          - {w: "Mire", f: "mir- + -e → mirar (to look), present subjunctive, you (vuestra merced) used as a polite command: 'consider'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. vuestra merced takes the he/she form."}
          - {w: "dice", f: "dic- + -e → decir (to say), present, you (vuestra merced). Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "dijo", f: "dij- + -o → decir, preterite, he: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "este mi", f: "demonstrative + possessive, 'this my master'; modern 'este amo mío'."}
          - {w: "es", f: "ser (to be), present, he: soy, eres, es, somos, sois, son."}
          - {w: "ha recebido", f: "ha (haber, present, he: he, has, ha, hemos, habéis, han) + recebido, old spelling of recibido: 'has received'."}
          - {w: "alguna", f: "algun- + -a → alguno, feminine to match 'orden'; after the noun in a negative it means 'none at all'."}
          - {w: "del", f: "de + el: towns are sometimes given the article in old usage ('el Quintanar')."}
  - sentences:
      - es: "— Importa eso poco —respondió don Quijote—, que Haldudos puede haber caballeros; cuanto más, que cada uno es hijo de sus obras."
        literal: "— Matters that little —answered don Quijote—, for Haldudos there-can be knights; how-much more, that each one is son of his works."
        ormsby: "“That matters little,” replied Don Quixote; “there may be Haldudos knights; moreover, everyone is the son of his works.”"
        vocab:
          - {w: "importar", d: "to matter"}
          - {w: "Haldudo", d: "the farmer's surname, built on 'halda' (skirt): 'long-skirts'"}
          - {w: "puede haber", d: "there can be"}
          - {w: "cuanto más", d: "all the more, besides, what's more"}
          - {w: "cada uno es hijo de sus obras", d: "proverb: every man is the son of his own deeds, i.e. worth comes from conduct, not birth"}
        diagram:
          - s: "Importa eso poco"
            r: "main verb: that matters little"
          - {s: "respondió don Quijote", r: "speech tag"}
          - {s: "que Haldudos puede haber caballeros", r: "why, 1: there can be knights among the Haldudos"}
          - s: "cuanto más"
            r: "why, 2: what's more"
            under:
              - {s: "que cada uno es hijo de sus obras", r: "the proverb: each man is the son of his deeds"}
        forms:
          - {w: "Importa", f: "import- + -a → importar (to matter), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "Haldudos", f: "a surname made plural, 'people named Haldudo', put first for emphasis."}
          - {w: "puede haber", f: "pued- + -e → poder (can), present, it, + haber in its 'there is' sense: 'there can be'. puedo, puedes, puede, podemos, podéis, pueden. It stays singular even with a plural noun."}
          - {w: "es", f: "ser (to be), present, he: soy, eres, es, somos, sois, son."}
          - {w: "sus", f: "su + -s → 'his', plural to match 'obras', not the owner."}
        ormsby_note: "Haldudos, wearers of long skirts."
        note: "'Cada uno es hijo de sus obras' is a proverb: a man is what he does, not what he was born. It sits oddly with the idea of an hereditary gentry like the hidalgos, and Don Quijote uses it to wave away the objection that the farmer is no knight."
