          - {w: "llorando", f: "llor- + -ando → llorar (to cry), gerund: 'crying'."}
          - {w: "se quedó", f: "qued- + -ó → quedarse (to stay), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "riendo", f: "ri- + -endo → reír (to laugh), gerund: 'laughing'; the accent drops."}
  - sentences:
      - es: "Y desta manera deshizo el agravio el valeroso don Quijote; el cual, contentísimo de lo sucedido, pareciéndole que había dado felicísimo y alto principio a sus caballerías, con gran satisfación de sí mismo iba caminando hacia su aldea, diciendo a media voz:"
        literal: "And of-this manner undid the wrong the valorous don Quijote; the who, most-content of the happened, seeming-to-him that he-had given most-happy and high beginning to his chivalries, with great satisfaction of himself was-going walking toward his village, saying at half voice:"
        ormsby: "Thus did the valiant Don Quixote right that wrong, and, thoroughly satisfied with what had taken place, as he considered he had made a very happy and noble beginning with his knighthood, he took the road towards his village in perfect self-content, saying in a low voice,"
        vocab:
          - {w: "desta manera", d: "= de esta manera, in this way"}
          - {w: "deshacer el agravio", d: "to undo the wrong, right the wrong"}
          - {w: "lo sucedido", d: "what had happened"}
          - {w: "principio", d: "beginning"}
          - {w: "caballerías", d: "his deeds of chivalry, his knight-errantry"}
          - {w: "satisfación", d: "= satisfacción, satisfaction (old spelling)"}
          - {w: "a media voz", d: "under his breath, in a low voice"}
        diagram:
          - s: "deshizo el agravio"
            r: "main verb 1: undid the wrong"
            under:
              - {s: "Y desta manera", r: "how: and in this way"}
              - {s: "el valeroso don Quijote", r: "subject, put last"}
          - s: "iba caminando hacia su aldea"
            r: "main verb 2: was riding toward his village"
            under:
              - {s: "el cual", r: "subject: who (Don Quijote)"}
              - {s: "contentísimo de lo sucedido", r: "describes him: delighted with what had happened"}
              - {s: "pareciéndole que había dado felicísimo y alto principio a sus caballerías", r: "why: thinking he had made a most happy and lofty start to his knighthood"}
              - {s: "con gran satisfación de sí mismo", r: "how: very pleased with himself"}
              - {s: "diciendo a media voz:", r: "how: saying under his breath"}
        forms:
          - {w: "desta", f: "de + esta (of this)."}
          - {w: "deshizo", f: "deshiz- + -o → deshacer (to undo), preterite, he. Like hacer: deshice, deshiciste, deshizo, deshicimos, deshicisteis, deshicieron."}
          - {w: "contentísimo", f: "content(o) + -ísimo → 'extremely pleased'. -ísimo means 'very, extremely'."}
          - {w: "lo sucedido", f: "neuter 'lo' + sucedido (participle of suceder, to happen): 'what had happened'."}
          - {w: "pareciéndole", f: "parec- + -iendo + le → parecer (to seem), gerund with 'le' (to him) on the end; accent added: 'it seeming to him'."}
          - {w: "había dado", f: "había (haber, imperfect, he: había, habías, había, habíamos, habíais, habían) + dado (participle of dar, to give): pluperfect, 'had given'."}
          - {w: "felicísimo", f: "feliz + -ísimo → 'most happy'; the z becomes c before i."}
          - {w: "gran", f: "grande clipped before a singular noun."}
          - {w: "satisfación", f: "old spelling of satisfacción."}
          - {w: "sí mismo", f: "'himself', after a preposition; sí takes an accent."}
          - {w: "iba caminando", f: "iba = ir (to go), imperfect, he: iba, ibas, iba, íbamos, ibais, iban; + caminando (gerund of caminar, to walk, travel): 'was making his way'."}
          - {w: "diciendo", f: "dic- + -iendo → decir (to say), gerund; the stem e becomes i."}
        note: "The narrator says flatly that this is how Don Quijote 'undid the wrong', just after showing the boy flogged worse than before: the irony is left for the reader."
  - sentences:
      - es: "— Bien te puedes llamar dichosa sobre cuantas hoy viven en la tierra, ¡oh sobre las bellas bella Dulcinea del Toboso!, pues te cupo en suerte tener sujeto y rendido a toda tu voluntad e talante a un tan valiente y tan nombrado caballero como lo es y será don Quijote de la Mancha, el cual, como todo el mundo sabe, ayer rescibió la orden de caballería, y hoy ha desfecho el mayor tuerto y agravio que formó la sinrazón y cometió la crueldad:"
        literal: "— Well yourself you-can call fortunate above as-many-as today live on the earth, oh above the beautiful beautiful Dulcinea of-the Toboso!, since to-you it-fell in lot to-have subject and surrendered to all your will and pleasure [to] a so valiant and so renowned knight as it is and will-be don Quijote of La Mancha, the who, as all the world knows, yesterday received the order of chivalry, and today has undone the greatest wrong and injury that formed the unreason and committed the cruelty:"
        ormsby: "“Well mayest thou this day call thyself fortunate above all on earth, O Dulcinea del Toboso, fairest of the fair! since it has fallen to thy lot to hold subject and submissive to thy full will and pleasure a knight so renowned as is and will be Don Quixote of La Mancha, who, as all the world knows, yesterday received the order of knighthood, and hath today righted the greatest wrong and grievance that ever injustice conceived and cruelty perpetrated:"
        vocab:
          - {w: "dichoso", d: "fortunate, lucky, blessed"}
          - {w: "sobre cuantas", d: "above all the women who"}
          - {w: "sobre las bellas bella", d: "'beautiful above the beautiful', fairest of the fair"}
          - {w: "caber en suerte", d: "to fall to one's lot"}
          - {w: "sujeto", d: "subject, subjected"}
          - {w: "rendido", d: "surrendered, devoted, at one's feet"}
          - {w: "talante", d: "pleasure, will, disposition"}
          - {w: "e", d: "= y, and; the old form, now used only before i-/hi-"}
          - {w: "nombrado", d: "renowned, famous"}
          - {w: "rescibió", d: "= recibió, received (old spelling)"}
          - {w: "desfecho", d: "= deshecho, undone (old f- form)"}
          - {w: "tuerto", d: "wrong, injury (archaic noun); also 'one-eyed'"}
          - {w: "sinrazón", d: "injustice, unreason"}
        diagram:
          - s: "Bien te puedes llamar dichosa"
            r: "main verb: well may you call yourself fortunate"
            under:
              - {s: "sobre cuantas hoy viven en la tierra", r: "above whom: above all women alive today"}
              - {s: "¡oh sobre las bellas bella Dulcinea del Toboso!", r: "addressed: O fairest of the fair, Dulcinea del Toboso"}
              - s: "pues te cupo en suerte"
                r: "why: since it fell to your lot"
                under:
                  - s: "tener sujeto y rendido a toda tu voluntad e talante a un tan valiente y tan nombrado caballero"
                    r: "what fell to you: to hold so valiant and famous a knight subject to your every wish"
                    under:
                      - {s: "como lo es y será don Quijote de la Mancha", r: "as ... as: as Don Quijote is and will be"}
                      - s: "el cual"
                        r: "describes Don Quijote: who"
                        under:
                          - {s: "como todo el mundo sabe", r: "aside: as all the world knows"}
                          - {s: "ayer rescibió la orden de caballería", r: "1: yesterday received the order of knighthood"}
                          - s: "y hoy ha desfecho el mayor tuerto y agravio"
                            r: "2: and today has undone the greatest wrong"
                            under:
                              - {s: "que formó la sinrazón y cometió la crueldad:", r: "describes 'tuerto': that injustice devised and cruelty committed"}
        forms:
          - {w: "te puedes llamar", f: "pued- + -es → poder (can), present, you (tú): puedo, puedes, puede, podemos, podéis, pueden. 'te' (yourself) belongs to llamar but sits before puedes; 'puedes llamarte' is the same."}
          - {w: "dichosa", f: "dichos- + -a → dichoso (fortunate), feminine to match Dulcinea."}
          - {w: "cuantas", f: "cuant- + -as → 'as many as', feminine plural: 'all the women who'."}
          - {w: "viven", f: "viv- + -en → vivir (to live), present, they. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "bellas bella", f: "bello (beautiful): feminine plural 'the beautiful ones', then feminine singular for Dulcinea."}
          - {w: "te cupo", f: "cupo → caber (to fit; 'caber en suerte' = to fall to one's lot), preterite, it, with 'te' (to you). Irregular: cupe, cupiste, cupo, cupimos, cupisteis, cupieron."}
          - {w: "tu", f: "'your' for tú, no accent (tú with an accent is the pronoun)."}
          - {w: "sujeto y rendido", f: "masculine singular, matching 'caballero'; rendido is the participle of rendir (to surrender)."}
          - {w: "es y será", f: "ser (to be), present and future, he: soy, eres, es, somos, sois, son; seré, serás, será, seremos, seréis, serán. 'lo' stands for 'valiente y nombrado'."}
          - {w: "sabe", f: "sab- + -e → saber (to know), present, it (the world). sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "rescibió", f: "old spelling of recibió: recib- + -ió → recibir (to receive), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "ha desfecho", f: "ha (haber, present, he: he, has, ha, hemos, habéis, han) + desfecho, old form of deshecho (participle of deshacer, to undo): 'has undone'."}
          - {w: "mayor", f: "the comparative of grande: with 'el' it means 'the greatest'."}
          - {w: "formó, cometió", f: "form- + -ó → formar (to form); comet- + -ió → cometer (to commit): preterite, it. -ar: -é, -aste, -ó, -amos, -asteis, -aron; -er/-ir: -í, -iste, -ió, -imos, -isteis, -ieron."}
        note: "He speaks of himself in the third person and addresses Dulcinea as 'tú', the style of a romance knight's apostrophe to his absent lady. 'Tuerto' and the old f- in 'desfecho' come straight from the romances' 'desfacer tuertos'."
