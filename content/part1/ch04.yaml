  - sentences:
      - es: "— No niego, hermano Andrés —respondió el labrador—; y hacedme placer de veniros conmigo, que yo juro por todas las órdenes que de caballerías hay en el mundo de pagaros, como tengo dicho, un real sobre otro, y aun sahumados."
        literal: "— Not I-deny, brother Andrés —answered the farmer—; and do-me pleasure of to-come-yourself with-me, for I swear by all the orders that of chivalries there-are in the world of to-pay-you, as I-have said, one real upon another, and even perfumed."
        ormsby: "“I do not refuse, brother Andrés,” said the farmer, “be good enough to come along with me, and I swear by all the orders of knighthood there are in the world to pay you as I have agreed, real by real, and perfumed.”"
        vocab:
          - {w: "hermano", d: "brother; here a friendly form of address"}
          - {w: "hacer placer de", d: "to do (someone) the kindness of"}
          - {w: "venirse", d: "to come along"}
          - {w: "tener dicho", d: "to have said (tener + participle, stressing that it stands)"}
          - {w: "un real sobre otro", d: "every last real, counted out one on another"}
          - {w: "aun", d: "even (no accent)"}
          - {w: "sahumado", d: "perfumed with incense smoke; of money or goods, 'in perfect condition, and then some'"}
        diagram:
          - {s: "No niego", r: "main verb 1: I don't deny it"}
          - {s: "hermano Andrés", r: "addressed"}
          - {s: "respondió el labrador", r: "speech tag"}
          - s: "hacedme placer de veniros conmigo"
            r: "main verb 2 (after 'y'): do me the kindness of coming with me"
            under:
              - s: "que yo juro"
                r: "why: for I swear"
                under:
                  - {s: "por todas las órdenes que de caballerías hay en el mundo", r: "by what: by all the orders of knighthood in the world"}
                  - {s: "de pagaros", r: "what he swears: to pay you"}
                  - {s: "como tengo dicho", r: "as I've said"}
                  - {s: "un real sobre otro, y aun sahumados", r: "how: every real, and perfumed besides"}
        forms:
          - {w: "niego", f: "nieg- + -o → negar (to deny), present, I. The stem e becomes ie when stressed: niego, niegas, niega, negamos, negáis, niegan."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "hacedme", f: "haced + me → hacer (to do), the imperative for vos with 'me' (for me) hung on the end. The vos/vosotros imperative drops the -r of the infinitive and adds -d: hacer → haced. The farmer addresses the boy as 'vos', usual from a master to a servant at the time."}
          - {w: "veniros", f: "venir + os → venirse (to come along), infinitive with 'os' (yourself, the pronoun of vos) hung on the end."}
          - {w: "juro", f: "jur- + -o → jurar (to swear), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "hay", f: "haber, the special present form 'there is / there are'; it never changes."}
          - {w: "pagaros", f: "pagar + os: 'to pay you', infinitive with 'os' on the end, after 'de'."}
          - {w: "tengo dicho", f: "teng- + -o → tener, present, I, + dicho (irregular participle of decir, to say): 'I have said'. tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "sahumados", f: "sahum- + -ados → sahumar (to perfume with incense), participle, masculine plural to match the 'reales'."}
        ormsby_note: "'Perfumed', a way of expressing completeness or perfection of condition."
        note: "The farmer swears by the orders of knighthood to please Don Quijote, and calls the boy 'brother' while the knight is watching."
