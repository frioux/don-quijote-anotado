        ormsby_note: "It is strange that this passage should have escaped the notice of those ingenious critics whose mania it is to hunt for hidden meanings in Don Quixote. With a moderate amount of acumen it ought to be easy to extract from these words a manifest 'covert attack' on Church, Faith, and Dogma."
