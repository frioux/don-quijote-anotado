          - {w: "jurando", f: "jur- + -ando → jurar (to swear), gerund: 'swearing'."}
          - {w: "al valeroso", f: "a + el: personal 'a' before a person as direct object."}
          - {w: "contalle", f: "contar + le → 'to tell him': old spelling in which the -r of the infinitive melts into the l- of le and is written -ll-; modern 'contarle'."}
          - {w: "había pasado", f: "había (haber, imperfect, it: había, habías, había, habíamos, habíais, habían) + pasado (participle of pasar, to happen): pluperfect, 'had happened'."}
          - {w: "se lo había de pagar", f: "había (haber, imperfect, he) + de + pagar (to pay): 'he was to pay'. se lo = 'it to him': le becomes se before lo, la, los, las."}
      - es: "Pero, con todo esto, él se partió llorando y su amo se quedó riendo."
