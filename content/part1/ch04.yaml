  - sentences:
      - es: "— Todo el mundo se tenga, si todo el mundo no confiesa que no hay en el mundo todo doncella más hermosa que la emperatriz de la Mancha, la sin par Dulcinea del Toboso."
        literal: "— All the world itself halt, if all the world not confesses that not there-is in the world all maiden more beautiful than the empress of La Mancha, the without equal Dulcinea of-the Toboso."
        ormsby: "“All the world stand, unless all the world confess that in all the world there is no maiden fairer than the Empress of La Mancha, the peerless Dulcinea del Toboso.”"
        vocab:
          - {w: "tenerse", d: "to halt, stand still"}
          - {w: "confesar", d: "to confess, acknowledge"}
          - {w: "el mundo todo", d: "the whole world (adjective after the noun, for emphasis)"}
          - {w: "doncella", d: "maiden, damsel"}
          - {w: "emperatriz", d: "empress"}
          - {w: "sin par", d: "peerless, matchless"}
        diagram:
          - s: "Todo el mundo se tenga"
            r: "main verb: let all the world halt"
            under:
              - s: "si todo el mundo no confiesa"
                r: "condition: unless all the world confesses"
                under:
                  - s: "que no hay en el mundo todo doncella más hermosa"
                    r: "what to confess: that there is no maiden in the whole world more beautiful"
                    under:
                      - {s: "que la emperatriz de la Mancha, la sin par Dulcinea del Toboso", r: "than whom: the empress of La Mancha, the peerless Dulcinea"}
        forms:
          - {w: "se tenga", f: "teng- + -a → tenerse (to halt), present subjunctive, it (the world), used as a command: 'let it halt'. tenga, tengas, tenga, tengamos, tengáis, tengan."}
          - {w: "confiesa", f: "confies- + -a → confesar (to confess), present, it. The stem e becomes ie when stressed: confieso, confiesas, confiesa, confesamos, confesáis, confiesan."}
          - {w: "hay", f: "haber, the special present form 'there is / there are'; it never changes."}
          - {w: "hermosa", f: "hermos- + -a → hermoso (beautiful), feminine to match 'doncella'."}
          - {w: "del", f: "de + el: 'el Toboso' takes the article, like 'la Mancha'."}
        note: "The challenge is copied from the romances, where a knight holding a road demands that all passers confess his lady the fairest. 'El mundo' three times over is Don Quijote's own flourish."
