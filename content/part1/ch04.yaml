summary: |
  Don Quijote leaves the inn at dawn, delighted to be a knight at last, and heads home to fetch money, shirts and a squire, as the innkeeper advised. He has in mind a poor neighbor, a farm laborer with a family.

  In a wood he hears cries and finds a farmer, Juan Haldudo of Quintanar, flogging a fifteen-year-old shepherd boy, Andrés, tied to an oak. The farmer says the boy loses sheep; the boy says he is owed his wages. Don Quijote threatens the farmer with his lance, works out the debt (getting the sum wrong), and accepts the farmer's oath to pay in full, though Andrés warns that his master is no knight and will turn on him. As soon as Don Quijote rides off, the farmer ties Andrés up again, beats him half to death, and sends him off to fetch his 'judge'. Don Quijote rides on, congratulating Dulcinea on the wrong he has righted.

  At a crossroads he lets Rocinante choose the road, and the horse heads for home. He meets six merchants from Toledo on their way to Murcia to buy silk, blocks the road and demands that they confess Dulcinea the most beautiful woman in the world. One merchant jokes that they will confess it gladly if he shows them a portrait, even if she proves one-eyed and oozing sulphur. Don Quijote charges, Rocinante stumbles, and the knight, weighed down by his old armor, cannot get up. A muleteer breaks his lance and beats him with the pieces while he goes on shouting threats. The merchants ride away, and Don Quijote lies on the road, unable to rise, still sure that this is a proper knight-errant's misfortune and that it was all the horse's fault.
context: |
  Masters and servants. A labrador was anyone who worked the land, from a rich farmer like Juan Haldudo to a laborer like the neighbor Don Quijote means to make his squire (Ormsby's note). Seven reals a month is a boy's wage; a real was a silver coin of 34 maravedís, and servants' wages were often held back or eaten up by deductions like the shoes and the bloodletting the farmer claims. Barbers let blood as well as cutting hair. Masters commonly beat their servants; what Don Quijote objects to is the unpaid wages and the lack of cause. Masters and knights alike address inferiors as 'vos' (with the vosotros verb endings), while Andrés and the merchant speak up to 'vuestra merced', the ancestor of 'usted'.

  The romances. The two adventures are both set pieces of chivalric fiction. A damsel or child cries out in a wood; the knight rescues the victim and binds the villain by oath, and in the romances the oath holds. Here it lasts until the knight is out of sight. The second is the 'passage of arms' (Ormsby's note cites Suero de Quiñones, who held the bridge of Órbigo in 1434 against all comers): a knight blocks a road and demands that passers confess his lady's beauty or fight. Letting the horse choose the road at a crossroads is another convention; Rocinante simply heads for his stable. The archaic phrases Don Quijote uses when excited ('desfacedor de agravios', 'tuerto', 'non fuyáis', 'malandrines') are the language of Amadís de Gaula and its successors.

  The narrator's irony. 'And in this way the valiant Don Quijote undid the wrong' comes right after the boy is flogged worse than before. Don Quijote's speech to Dulcinea claims a victory the reader has just seen fail. The merchants, who are sharp-witted city men, humor his madness at first ('all these princes', 'the empresses of the Alcarria and Estremadura', two of the poorest regions of Spain) and then mock it. The muleteer answers with a stick. The chapter ends with the knight explaining a disaster away as the normal lot of knights-errant.

  Faith and the lady. Don Quijote demands that the merchants believe in Dulcinea without seeing her, and calls their joke 'blasphemy'. Ormsby notes, tongue in cheek, that critics hunting for hidden attacks on the Church could have made much of this. The courtly-love tradition had always borrowed the language of religion for the lady.

  Names and oaths. Haldudo means 'long-skirted' (Ormsby). Quintanar de la Orden is a real town near El Toboso. St Bartholomew was flayed alive, so 'to flay like a St Bartholomew' was a stock phrase. 'Vive Roque' is an oath nobody has explained. Spindles and pines from the Guadarrama mountains north of Madrid were proverbially straight, and ambergris and civet were the costliest perfumes, shipped packed in cotton.

  The numbers. Nine months at seven reals comes to sixty-three reals, not the seventy-three Don Quijote calculates. Whether it is Cervantes' slip or a joke on the knight, Ormsby corrects it silently.

  Reading Cervantes' Spanish. This chapter has many enclitic pronouns on conjugated verbs (túvose, díjole, Siguióle, volvióse, Paráronse, Dábanle, Cansóse); -rl- written -ll- (pagalle, contalle); de fused with pronouns (dellos, desta, destas); old f- for h- in the knight's romance speech (desfacedor, desface, desfecho, fuyáis); the old vos endings (pagastes for pagasteis, temíades for temíais, hiciérades for hicierais); the future subjunctive (fuere, quisiere); the -ra form as a conditional or pluperfect (hiciera, pasara); 'haber de' and 'tener de' for 'must'; and spellings such as recebir, rescibió, ansí, estraño, satisfación, reprehensión, encrucejada, aquéste and vía for veía. Note also that the Gutenberg text prints 'encima' where 'encina' (oak) is meant.
