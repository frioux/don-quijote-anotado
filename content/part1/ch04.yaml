  - sentences:
      - es: "— El daño está, señor caballero, en que no tengo aquí dineros: véngase Andrés conmigo a mi casa, que yo se los pagaré un real sobre otro."
        literal: "— The harm is, sir knight, in that not I-have here moneys: let-come-himself Andrés with-me to my house, for I to-him them will-pay one real upon another."
        ormsby: "“The difficulty is, Sir Knight, that I have no money here; let Andrés come home with me, and I will pay him all, real by real.”"
        vocab:
          - {w: "el daño está en que", d: "the trouble is that"}
          - {w: "dineros", d: "money (the plural was common)"}
          - {w: "venirse", d: "to come along"}
          - {w: "conmigo", d: "with me"}
          - {w: "un real sobre otro", d: "every last real, counted out one on top of another"}
        diagram:
          - s: "El daño está"
            r: "main verb 1: the trouble is"
            under:
              - {s: "señor caballero", r: "addressed"}
              - {s: "en que no tengo aquí dineros", r: "in what: that I have no money here"}
          - s: "véngase Andrés conmigo a mi casa"
            r: "main verb 2: let Andrés come home with me"
            under:
              - {s: "que yo se los pagaré un real sobre otro", r: "why: for I'll pay him every real"}
