          - {s: "díjole:", r: "main verb 3 (after 'y'): said to him"}
        forms:
          - {w: "Siguióle", f: "sigu- + -ió + le → seguir (to follow), preterite, he, with 'le' (him) stuck on the end: modern 'le siguió'. Cervantes hangs the pronoun on a conjugated verb that opens its clause. The stem e becomes i: seguí, seguiste, siguió, seguimos, seguisteis, siguieron."}
