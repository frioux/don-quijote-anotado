  - sentences:
      - es: "— No lo haré otra vez, señor mío; por la pasión de Dios, que no lo haré otra vez; y yo prometo de tener de aquí adelante más cuidado con el hato."
        literal: "— Not it I-will-do another time, sir mine; by the passion of God, that not it I-will-do another time; and I promise of to-have from here forward more care with the flock."
        ormsby: "“I won’t do it again, master mine; by God’s passion I won’t do it again, and I’ll take more care of the flock another time.”"
        vocab:
          - {w: "señor mío", d: "my master, sir; the possessive after the noun is more emphatic"}
          - {w: "por la pasión de Dios", d: "by the Passion of God, i.e. by Christ's suffering; a common oath"}
          - {w: "que", d: "here just emphasis before the repeated promise: 'I swear I won't'"}
          - {w: "prometer de", d: "to promise to; the 'de' before the infinitive is old usage"}
          - {w: "de aquí adelante", d: "from now on"}
          - {w: "hato", d: "flock, herd (also a shepherd's bundle of gear)"}
        diagram:
          - s: "No lo haré otra vez"
            r: "main verb 1: I won't do it again"
            under:
              - {s: "señor mío", r: "addressed: master"}
          - s: "que no lo haré otra vez"
            r: "main verb 1 repeated, with emphatic 'que'"
            under:
              - {s: "por la pasión de Dios", r: "oath: by God's Passion"}
          - s: "prometo"
            r: "main verb 2 (after 'y'): I promise"
            under:
              - {s: "yo", r: "subject: I, stressed"}
              - {s: "de tener de aquí adelante más cuidado con el hato", r: "what: to take more care of the flock from now on"}
        forms:
          - {w: "haré", f: "har- + -é → hacer (to do), future, I: 'I will do'. hacer's future has the short stem har-: haré, harás, hará, haremos, haréis, harán."}
          - {w: "lo", f: "'it', the neuter object: whatever he did wrong."}
          - {w: "mío", f: "mí- + -o → 'my, of mine', the long possessive placed after the noun, masculine to match 'señor'."}
          - {w: "prometo", f: "promet- + -o → prometer (to promise), present, I. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "tener", f: "infinitive (to have) after 'prometo de'."}
