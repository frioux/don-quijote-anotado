  - sentences:
      - es: "— Llamad, señor Andrés, ahora —decía el labrador— al desfacedor de agravios, veréis cómo no desface aquéste; aunque creo que no está acabado de hacer, porque me viene gana de desollaros vivo, como vos temíades."
        literal: "— Call, sir Andrés, now —was-saying the farmer— [to] the undoer of wrongs, you-will-see how not he-undoes this-one; although I-believe that not it-is finished of doing, because to-me comes desire of to-flay-you alive, as you feared."
