          - {w: "armas", d: "here: armor (the plural 'armas' covers weapons and armor)"}
          - {w: "blandir", d: "to brandish"}
          - {w: "rostro", d: "face"}
          - {w: "tenerse por", d: "to consider oneself; 'tenerse por muerto' = to give oneself up for dead"}
          - {w: "con buenas palabras", d: "civilly, meekly"}
