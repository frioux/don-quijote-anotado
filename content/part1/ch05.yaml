  - sentences:
      - es: "— ¿Qué le parece a vuestra merced, señor licenciado Pero Pérez —que así se llamaba el cura—, de la desgracia de mi señor?"
        literal: "— What to-you seems to your mercy, sir licentiate Pero Pérez —for thus himself called the priest—, of the misfortune of my master?"
        ormsby: "“What does your worship think can have befallen my master, Señor Licentiate Pero Pérez?” for so the curate was called;"
        vocab:
          - {w: "¿qué le parece?", d: "what do you think?, what do you make of it?"}
          - {w: "licenciado", d: "licentiate, holder of a university degree (between bachelor and doctor); used as a title"}
          - {w: "Pero", d: "old form of the name Pedro"}
          - {w: "desgracia", d: "misfortune, mishap"}
          - {w: "mi señor", d: "my master"}
        diagram:
          - s: "Qué le parece a vuestra merced"
            r: "main verb (the question): what do you think"
            under:
              - {s: "señor licenciado Pero Pérez", r: "addressed to: the priest"}
              - {s: "que así se llamaba el cura", r: "narrator's aside: for that was the priest's name"}
              - {s: "de la desgracia de mi señor", r: "about what: my master's misfortune"}
        forms:
          - {w: "le parece", f: "parec- + -e → parecer (to seem), present, it, + 'le' (to you), doubled by 'a vuestra merced'. Built like gustar: 'what seems to you' = 'what do you think'. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (parecer adds -zc- in 'parezco')."}
          - {w: "se llamaba", f: "llam- + -aba → llamarse (to be called), imperfect, he, with 'se'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "mi", f: "'my', the unstressed possessive; one form for both genders (mi, mis)."}
        note: "The priest now gets a name, Pero Pérez, and a degree; Chapter 1 mentioned that he was 'a learned man, graduated at Sigüenza'."
