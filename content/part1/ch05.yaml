  - sentences:
      - es: "— Mire vuestra merced, señor, pecador de mí, que yo no soy don Rodrigo de Narváez, ni el marqués de Mantua, sino Pedro Alonso, su vecino; ni vuestra merced es Valdovinos, ni Abindarráez, sino el honrado hidalgo del señor Quijana."
        literal: "— May-look your mercy, sir, sinner of me, that I not am don Rodrigo de Narváez, nor the marquis of Mantua, but Pedro Alonso, your neighbor; nor your mercy is Valdovinos, nor Abindarráez, but the honorable gentleman of-the señor Quijana."
        ormsby: "“Señor—sinner that I am!—cannot your worship see that I am not Don Rodrigo de Narváez nor the Marquis of Mantua, but Pedro Alonso your neighbour, and that your worship is neither Baldwin nor Abindarráez, but the worthy gentleman Señor Quixada?”"
        vocab:
          - {w: "mire vuestra merced", d: "look, your worship; consider, please see"}
          - {w: "pecador de mí", d: "sinner that I am!, poor me!; an exclamation of dismay"}
          - {w: "sino", d: "but rather (after a negative)"}
          - {w: "vecino", d: "neighbor, fellow villager"}
          - {w: "honrado", d: "honorable, respectable, worthy"}
          - {w: "el honrado hidalgo del señor Quijana", d: "that worthy gentleman Señor Quijana; the pattern 'el bueno de Juan' = good old Juan"}
        diagram:
          - s: "Mire vuestra merced"
            r: "main verb: look, your worship"
            under:
              - {s: "señor, pecador de mí", r: "address and exclamation: sir, sinner that I am"}
              - s: "que yo no soy don Rodrigo de Narváez, ni el marqués de Mantua"
                r: "what to see 1: that I am not Narváez, nor the Marquis"
                under:
                  - {s: "sino Pedro Alonso, su vecino", r: "but rather: Pedro Alonso, your neighbor"}
              - s: "ni vuestra merced es Valdovinos, ni Abindarráez"
                r: "what to see 2: nor are you Valdovinos or Abindarráez"
                under:
                  - {s: "sino el honrado hidalgo del señor Quijana", r: "but rather: the worthy gentleman Señor Quijana"}
        forms:
          - {w: "Mire", f: "mir- + -e → mirar (to look), present subjunctive, you (vuestra merced): the polite command 'look'. -ar verbs swap to -e endings in the present subjunctive: mire, mires, mire, miremos, miréis, miren."}
          - {w: "mí", f: "'me' after a preposition, with the accent ('mi' without it = my)."}
          - {w: "soy", f: "ser (to be), present, I: soy, eres, es, somos, sois, son."}
          - {w: "su vecino", f: "'your neighbor': 'su' goes with 'vuestra merced', which takes 'he/she' forms."}
          - {w: "es", f: "ser (to be), present, you (vuestra merced), which takes the 'he/she' form 'es'."}
          - {w: "honrado", f: "honr- + -ado → participle of honrar (to honor), used as an adjective: 'honorable'."}
          - {w: "del señor Quijana", f: "de + el: 'the good gentleman of a Señor Quijana' = 'that good gentleman, Señor Quijana'; the 'de' links a noun to the name it describes."}
        note: "The peasant finally has a name, Pedro Alonso, and so does the hero, from the peasant's point of view: plain Señor Quijana. Ormsby turns the statement into a question and uses his own 'Quixada'."
  - sentences:
      - es: "— Yo sé quién soy —respondió don Quijote—; y sé que puedo ser no sólo los que he dicho, sino todos los Doce Pares de Francia, y aun todos los Nueve de la Fama, pues a todas las hazañas que ellos todos juntos y cada uno por sí hicieron, se aventajarán las mías."
        literal: "— I know who I-am —answered Don Quijote—; and I-know that I-can be not only those that I-have said, but all the Twelve Peers of France, and even all the Nine of the Fame, since to all the exploits that they all together and each one by himself did, themselves will-surpass the mine."
        ormsby: "“I know who I am,” replied Don Quixote, “and I know that I may be not only those I have named, but all the Twelve Peers of France and even all the Nine Worthies, since my achievements surpass all that they have done all together and each of them on his own account.”"
        vocab:
          - {w: "no sólo ... sino", d: "not only ... but"}
          - {w: "los Doce Pares de Francia", d: "the Twelve Peers of France, Charlemagne's paladins (Roland, Oliver and the rest) in the epics and ballads"}
          - {w: "los Nueve de la Fama", d: "the Nine Worthies: three pagans (Hector, Alexander, Julius Caesar), three Jews (Joshua, David, Judas Maccabeus) and three Christians (Arthur, Charlemagne, Godfrey of Bouillon)"}
          - {w: "pues", d: "here: since, for"}
          - {w: "hazaña", d: "exploit, great deed"}
          - {w: "por sí", d: "on his own, by himself"}
          - {w: "aventajarse a", d: "to surpass, outdo"}
        diagram:
          - s: "Yo sé quién soy"
            r: "main verb 1: I know who I am"
          - {s: "respondió don Quijote", r: "speech tag: answered Don Quijote"}
          - s: "y sé"
            r: "main verb 2: and I know"
            under:
              - s: "que puedo ser"
                r: "what I know: that I can be"
                under:
                  - {s: "no sólo los que he dicho", r: "not only those I have named"}
                  - {s: "sino todos los Doce Pares de Francia", r: "but all the Twelve Peers of France"}
                  - {s: "y aun todos los Nueve de la Fama", r: "and even all the Nine Worthies"}
              - s: "pues a todas las hazañas"
                r: "why: since, all the exploits ..."
                under:
                  - {s: "que ellos todos juntos y cada uno por sí hicieron", r: "describes 'hazañas': that they did all together and each alone"}
                  - {s: "se aventajarán las mías", r: "... mine will surpass them"}
        forms:
          - {w: "sé", f: "saber (to know), present, I, with an accent to tell it from 'se': sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "quién", f: "'who', accented as a question word even inside a statement."}
          - {w: "soy", f: "ser (to be), present, I: soy, eres, es, somos, sois, son."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "puedo", f: "pued- + -o → poder (can), present, I; the stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "los que", f: "'those that': the article as a pronoun + relative 'que', masculine plural for the heroes."}
          - {w: "he dicho", f: "he + dicho → haber, present, I, + the irregular participle of decir (to say): 'I have named'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "todas", f: "tod- + -as → todo (all), feminine plural to match 'hazañas'."}
          - {w: "juntos", f: "junt- + -os → junto (together), masculine plural to match 'ellos'."}
          - {w: "sí", f: "'himself' after a preposition, with the accent."}
          - {w: "hicieron", f: "hic- + -ieron → hacer (to do), preterite, they. Irregular stem: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "se aventajarán", f: "aventajar + -án → aventajarse (to surpass), future, they (las mías), with 'se'. The future adds to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "las mías", f: "'mine', the stressed possessive with the article, feminine plural to match 'hazañas': el mío, la mía, los míos, las mías."}
        note: "His answer is the mad knight's creed: he may not be any one hero in particular, but he can be all of them at once."
  - sentences:
      - es: "En estas pláticas y en otras semejantes, llegaron al lugar a la hora que anochecía, pero el labrador aguardó a que fuese algo más noche, porque no viesen al molido hidalgo tan mal caballero."
        literal: "In these talks and in others similar, they-arrived at-the village at the hour that it-was-getting-dark, but the farmer waited for that it-should-be somewhat more night, so-that not they-should-see the beaten gentleman so badly mounted."
        ormsby: "With this talk and more of the same kind they reached the village just as night was beginning to fall, but the peasant waited until it was a little later that the belaboured gentleman might not be seen riding in such a miserable trim."
        vocab:
          - {w: "plática", d: "talk, conversation"}
          - {w: "semejante", d: "similar, of that kind"}
          - {w: "lugar", d: "village"}
          - {w: "anochecer", d: "to grow dark, fall (of night)"}
          - {w: "aguardar a que", d: "to wait until"}
          - {w: "porque no", d: "here: so that ... not (with the subjunctive), not 'because'"}
          - {w: "molido", d: "beaten, battered, sore all over (literally 'ground')"}
          - {w: "mal caballero", d: "badly mounted, a poor rider; also 'a poor knight', a pun, since 'caballero' means both rider and knight"}
        diagram:
          - s: "llegaron al lugar"
            r: "main verb 1: they reached the village"
            under:
              - {s: "En estas pláticas y en otras semejantes", r: "how: amid this talk and more like it"}
              - {s: "a la hora que anochecía", r: "when: at the hour night was falling"}
          - s: "pero el labrador aguardó"
            r: "main verb 2: but the farmer waited"
            under:
              - {s: "a que fuese algo más noche", r: "until when: until it was a little darker"}
              - {s: "porque no viesen al molido hidalgo tan mal caballero", r: "why: so that no one would see the battered gentleman so poorly mounted"}
        forms:
          - {w: "estas", f: "est- + -as → 'these', feminine plural to match 'pláticas'."}
          - {w: "semejantes", f: "semejante + -s → plural to match 'otras [pláticas]'; one form for both genders."}
          - {w: "llegaron", f: "lleg- + -aron → llegar (to arrive), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "al", f: "a + el."}
          - {w: "anochecía", f: "anochec- + -ía → anochecer (to grow dark), imperfect, it (weather verbs have no real subject). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "aguardó", f: "aguard- + -ó → aguardar (to wait), preterite, he. Same -ar preterite as 'llegaron'."}
          - {w: "fuese", f: "fu- + -ese → ser (to be), imperfect subjunctive (-se form), it: 'should be'. Built on 'fueron': fuese, fueses, fuese, fuésemos, fueseis, fuesen. Subjunctive after 'aguardar a que' (wait until), a time still to come."}
          - {w: "viesen", f: "vi- + -esen → ver (to see), imperfect subjunctive (-se form), they (people in general). Built on 'vieron': viese, vieses, viese, viésemos, vieseis, viesen. Subjunctive because 'porque' here means 'so that'."}
          - {w: "al molido hidalgo", f: "a + el: the personal 'a' before a person as object; 'molido' is the participle of moler (to grind), masculine to match 'hidalgo'."}
          - {w: "mal", f: "malo clipped before a masculine singular noun, like buen, gran, algún."}
      - es: "Llegada, pues, la hora que le pareció, entró en el pueblo, y en la casa de don Quijote, la cual halló toda alborotada; y estaban en ella el cura y el barbero del lugar, que eran grandes amigos de don Quijote, que estaba diciéndoles su ama a voces:"
