  - sentences:
      - es: "— Sepa vuestra merced, señor don Rodrigo de Narváez, que esta hermosa Jarifa que he dicho es ahora la linda Dulcinea del Toboso, por quien yo he hecho, hago y haré los más famosos hechos de caballerías que se han visto, vean ni verán en el mundo."
        literal: "— May-know your mercy, sir don Rodrigo de Narváez, that this beautiful Jarifa that I-have said is now the lovely Dulcinea of-El Toboso, for whom I have done, I-do and will-do the most famous deeds of chivalries that themselves have seen, may-see nor will-see in the world."
        ormsby: "“Señor Don Rodrigo de Narváez, your worship must know that this fair Xarifa I have mentioned is now the lovely Dulcinea del Toboso, for whom I have done, am doing, and will do the most famous deeds of chivalry that in this world have been seen, are to be seen, or ever shall be seen.”"
        vocab:
          - {w: "sepa vuestra merced", d: "be it known to your worship, your worship must know"}
          - {w: "don", d: "title of respect before a gentleman's first name; in 1605 it still implied real rank"}
          - {w: "Jarifa", d: "the beautiful Moorish lady whom Abindarráez was going to marry when he was captured"}
          - {w: "hermoso", d: "beautiful, fair"}
          - {w: "linda", d: "lovely, pretty"}
          - {w: "Dulcinea del Toboso", d: "the name Don Quijote gave in Chapter 1 to Aldonza Lorenzo, a farm girl of El Toboso, as his lady"}
          - {w: "por quien", d: "for whom, for whose sake"}
          - {w: "hechos", d: "deeds, feats (from 'hecho', done); it rhymes with 'he hecho' just before"}
          - {w: "ni", d: "nor; here after a positive list, the old way of saying 'or ever'"}
        diagram:
          - s: "Sepa vuestra merced"
            r: "main verb: may your worship know"
            under:
              - {s: "señor don Rodrigo de Narváez", r: "addressed to: the farmer, taken for Narváez"}
              - s: "que esta hermosa Jarifa"
                r: "what he should know: that this fair Jarifa ..."
                under:
                  - {s: "que he dicho", r: "describes 'Jarifa': whom I have mentioned"}
                  - s: "es ahora la linda Dulcinea del Toboso"
                    r: "... is now the lovely Dulcinea del Toboso"
                    under:
                      - s: "por quien yo he hecho, hago y haré los más famosos hechos de caballerías"
                        r: "describes 'Dulcinea': for whom I have done, do and will do the most famous deeds of chivalry"
                        under:
                          - {s: "que se han visto, vean ni verán en el mundo", r: "describes 'hechos': that have been, may be or will be seen in the world"}
        forms:
          - {w: "Sepa", f: "sep- + -a → saber (to know), present subjunctive, you (vuestra merced): 'may your worship know' = 'you must know'. The polite command is the present subjunctive, built on the irregular stem sep-: sepa, sepas, sepa, sepamos, sepáis, sepan."}
          - {w: "esta", f: "est- + -a → 'this', feminine to match 'Jarifa'."}
          - {w: "hermosa", f: "hermos- + -a → hermoso (beautiful), feminine; placed before the name as an epithet."}
          - {w: "he dicho", f: "he + dicho → haber, present, I, + dicho, the irregular participle of decir (to say): 'I have said'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "es", f: "ser (to be), present, she: soy, eres, es, somos, sois, son."}
          - {w: "he hecho, hago y haré", f: "hacer (to do) in three tenses, all 'I': present perfect 'he hecho' (hecho is the irregular participle), present 'hago' (hago, haces, hace, hacemos, hacéis, hacen), future 'haré' (irregular stem har-: haré, harás, hará, haremos, haréis, harán)."}
          - {w: "famosos", f: "famos- + -os → famoso (famous), masculine plural to match 'hechos'; 'los más famosos' = the most famous."}
          - {w: "se han visto", f: "han + visto → haber, present, they, + visto, the irregular participle of ver (to see); 'se' makes it passive: 'have been seen'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "vean", f: "ve- + -an → ver (to see), present subjunctive, they (still with the passive 'se'): 'may be seen'. Built on 'veo': vea, veas, vea, veamos, veáis, vean."}
          - {w: "verán", f: "ver + -án → ver, future, they: 'will be seen'. The future adds to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
        note: "He now casts himself as Abindarráez, the captured Moor who tells his captor about his beloved Jarifa, and the farmer as the captor Narváez. The triple 'have done, do and will do' and 'have been, may be, will be seen' parodies the swelling rhetoric of the romances."
