summary: |
  Still lying on the road where the muleteer left him at the end of Chapter 4, too bruised and weighed down by armor to get up, Don Quijote falls back on his usual remedy: he finds a scene in his reading that fits. He remembers the ballad of Valdovinos, left wounded in the forest by the Emperor's son, and starts rolling on the ground reciting the dying knight's lines to his absent lady.

  A farmer from his own village, Pedro Alonso, comes by on his way back from the mill. Don Quijote takes him for the Marquis of Mantua, Valdovinos' uncle, and answers his questions only with more ballad. The farmer wipes the dust off his face, recognizes his neighbor Señor Quijana, finds no wound, loads him onto his donkey and leads him home. On the way Don Quijote switches stories and becomes the captive Moor Abindarráez speaking to his captor Rodrigo de Narváez, and announces that the beautiful Jarifa is now Dulcinea del Toboso. When the farmer protests that he is only Pedro Alonso, Don Quijote replies, 'I know who I am,' and claims he can be all the Twelve Peers and Nine Worthies at once.

  The farmer waits for dark so nobody will see the gentleman in such a state. At the house the housekeeper is lamenting to the priest, Pero Pérez, and the barber, Master Nicolás, that the books of chivalry have turned her master's brain; the niece adds stories of his reading for days on end, slashing at the walls, and drinking water he called a magic potion, and blames herself for not warning them sooner. The priest vows the books will be publicly condemned to the fire.

  The farmer, catching on, shouts for them to open to Valdovinos, the Marquis of Mantua and Abindarráez. They carry Don Quijote to bed; he has no wounds, only bruises, which he blames on a fall with Rocinante while fighting ten giants. He asks only for food and sleep. The priest questions the farmer at length, and the next day he calls the barber to go with him to Don Quijote's house.
context: |
  The village household. The chapter fills in the people of the hero's life. The farmer Pedro Alonso is a 'labrador', a peasant who works his own land and is a social step below an hidalgo but his neighbor in every other sense. The priest, Pero Pérez, is a 'licenciado', a university graduate, and in a village he is the reading man, which is why he knows exactly what 'jayanes' means. The barber, Master Nicolás, is a tradesman ('maese' is a craftsman's title) who also let blood and pulled teeth. The housekeeper and niece speak the language of women at home: oaths, proverbs, and mangled names. 'Vuestra merced' (your worship) is how everyone addresses the gentleman and the priest.

  The ballads. Spanish 'romances' were narrative poems in eight-syllable lines, sung and recited by everyone, printed in cheap chapbooks and collected in the Cancioneros of the mid-sixteenth century. The Carolingian ballad of the Marquis of Mantua tells how Carloto, son of Charlemagne, ambushes Valdovinos (Baldwin) in the forest to win his wife Sevilla, and how the Marquis, his uncle, finds him dying while out hunting. Ormsby notes that it is really a chanson de geste of over 800 lines. The narrator's remark that it is 'known to children, believed by old men, and no truer than the miracles of Muhammad' is the same complaint moralists made against the romances of chivalry.

  The Moorish novella. The second story Don Quijote borrows is 'El Abencerraje', the most famous Moorish tale of the Spanish Renaissance: Abindarráez, a young Moor of the Abencerraje family, is captured by Rodrigo de Narváez, the Christian governor ('alcaide') of Antequera, while riding to marry his beloved Jarifa; Narváez lets him go on his word to return in three days, and he keeps it. The story circulated separately and was added to later editions of Jorge de Montemayor's pastoral 'Diana'; Ormsby suggests that Cervantes' careful 'where it is written' shows he doubted Montemayor wrote it. Don Quijote swaps Jarifa for Dulcinea without blinking.

  The heroes. The Twelve Peers of France are Charlemagne's paladins, Roland and Oliver among them. The Nine Worthies were the medieval canon of heroes: three pagans (Hector, Alexander, Julius Caesar), three Jews (Joshua, David, Judas Maccabeus) and three Christians (Arthur, Charlemagne, Godfrey of Bouillon). Urganda the Unknown is the enchantress who protects Amadís of Gaul; the niece's 'sage Esquife' is a garbling of Alquife, her husband in the Amadís sequels ('esquife' is a skiff), and the housekeeper turns Urganda into 'Hurgada', something like 'the Prodder'.

  The Inquisition and the books. The niece says the books deserve burning 'as if they were heretics', and the priest promises an 'acto público', echoing the 'auto de fe', the Inquisition's public ceremony where heretics were sentenced and, sometimes, burned along with prohibited books. Romances of chivalry were never actually banned in Spain, though moralists called for it; the joke is in treating entertainment as heresy.

  Madness and its handling. Don Quijote's first sally ends with him brought home across a donkey, and his madness has become visible to everyone: the farmer diagnoses it on the road, the household has already guessed it, and the peasant's decision to play along with the ballad names is the first time anyone humors him. Don Quijote himself makes the tell-tale move of converting a humiliating beating into a heroic fall against ten giants, and his reply 'Yo sé quién soy' (I know who I am) is one of the most quoted lines in the book.

  Reading Cervantes' Spanish. This chapter adds several archaisms to those seen before: initial f- for modern h- (feridas, malferido, fallar = hallar); 'truje' for 'traje' (trújole); 'efeto', 'recebido', 'escusar', 'priesa', 'fee', 'mesmo' and 'mesma'; 'descomulgados' for 'excomulgados'; 'ha' for 'hace' in 'tres días ha'; 'otro día' meaning 'the next day'; 'luego' meaning 'at once'; and the dropped final -d of the rustic plural command 'mirá'. Grammatically, look for pronouns hung on the end of verbs that open a clause (trújole, liólas, dábale, bebíase, Lleváronle, Hiciéronle, Hízose), the polite commands in the present subjunctive (Sepa, Mire, Abran, Ténganse, Llévenme, Suba), the future subjunctive (fuere, leyere), which survives today only in legal language, and 'que' placed before reported questions ('le preguntó que quién era').
