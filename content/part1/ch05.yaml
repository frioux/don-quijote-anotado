      - es: "y así, no le respondió otra cosa si no fue proseguir en su romance, donde le daba cuenta de su desgracia y de los amores del hijo del Emperante con su esposa, todo de la mesma manera que el romance lo canta."
        literal: "and so, not to-him he-answered other thing if not [it] was to-continue in his ballad, where to-him he-gave account of his misfortune and of the loves of-the son of-the Emperor with his wife, all of the same manner that the ballad it sings."
        ormsby: "so the only answer he made was to go on with his ballad, in which he told the tale of his misfortune, and of the loves of the Emperor’s son and his wife all exactly as the ballad sings it."
