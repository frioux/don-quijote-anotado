          - {w: "parecer", d: "here: to appear, turn up (modern 'aparecer'), not 'to seem'"}
          - {w: "rocín", d: "nag, workhorse (Rocinante)"}
          - {w: "adarga", d: "oval leather shield"}
          - {w: "armas", d: "arms, armor"}
