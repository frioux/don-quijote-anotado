            under:
              - {s: "Tres días ha que", r: "how long: for three days now"}
              - {s: "él, ni el rocín, ni la adarga, ni la lanza ni las armas", r: "subject: he, the nag, the shield, the lance, the armor"}
        forms:
          - {w: "ha", f: "haber (to have), present, it. Old for 'hace': 'tres días ha que' = 'hace tres días que', 'it is three days since'."}
          - {w: "parecen", f: "parec- + -en → parecer (to appear), present, they: plural because five things are missing. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (parecer adds -zc- in 'parezco'). Spanish uses the present for 'have not appeared for three days'."}
