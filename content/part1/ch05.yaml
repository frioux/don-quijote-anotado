                under:
                  - s: "donde le daba cuenta de su desgracia y de los amores del hijo del Emperante con su esposa"
                    r: "describes 'romance': in which he told him of his mishap and of the Emperor's son's love for his wife"
                    under:
                      - {s: "todo de la mesma manera que el romance lo canta", r: "how: all exactly as the ballad tells it"}
        forms:
          - {w: "le respondió", f: "respond- + -ió → responder (to answer), preterite, he, + 'le' (to him). The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "fue", f: "ser (to be), preterite, it: 'if it was not' = 'except'. ser's preterite: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "proseguir", f: "infinitive (to continue) used as a noun after 'fue'."}
          - {w: "le daba", f: "d- + -aba → dar (to give), imperfect, he, + 'le' (to him): 'was giving him [an account]'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "del hijo del Emperante", f: "de + el, twice: 'of the son of the Emperor'."}
          - {w: "su esposa", f: "'his wife' = the wife of Valdovinos, whom Carloto loved; 'su' is ambiguous in Spanish as in the ballad."}
          - {w: "mesma", f: "old spelling of misma, feminine to match 'manera'."}
          - {w: "lo canta", f: "cant- + -a → cantar (to sing), present, it (the ballad), + 'lo' (it). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
        note: "In the ballad Carloto, son of the Emperor Charlemagne, wants Valdovinos' wife Sevilla and so ambushes and wounds her husband. Don Quijote is reciting the husband's lines to a farmer who has no idea what he is talking about."
  - sentences:
      - es: "El labrador estaba admirado oyendo aquellos disparates; y, quitándole la visera, que ya estaba hecha pedazos de los palos, le limpió el rostro, que le tenía cubierto de polvo; y apenas le hubo limpiado, cuando le conoció y le dijo:"
        literal: "The farmer was astonished hearing those nonsenses; and, removing-from-him the visor, which already was made pieces from the blows, to-him he-wiped the face, which he it had covered with dust; and scarcely it he-had wiped, when him he-knew and to-him said:"
        ormsby: "The peasant stood amazed at hearing such nonsense, and relieving him of the visor, already battered to pieces by blows, he wiped his face, which was covered with dust, and as soon as he had done so he recognised him and said,"
        vocab:
          - {w: "admirado", d: "astonished, amazed; a false friend, not 'admiring'"}
          - {w: "disparate", d: "piece of nonsense, absurdity"}
          - {w: "quitar", d: "to take off, remove"}
          - {w: "visera", d: "visor, the movable front of a helmet (his was pasteboard, patched in Chapter 1)"}
          - {w: "hecho pedazos", d: "broken to pieces"}
          - {w: "palos", d: "blows with a stick; the beating he took in Chapter 4"}
          - {w: "limpiar", d: "to wipe, clean"}
          - {w: "rostro", d: "face"}
          - {w: "cubierto de polvo", d: "covered with dust"}
          - {w: "apenas ... cuando", d: "scarcely ... when, no sooner ... than"}
          - {w: "conocer", d: "here: to recognize (modern 'reconocer')"}
        diagram:
          - s: "estaba admirado"
            r: "main verb 1: was astonished"
            under:
              - {s: "El labrador", r: "subject"}
              - {s: "oyendo aquellos disparates", r: "why: hearing all that nonsense"}
          - s: "le limpió el rostro"
            r: "main verb 2 (after 'y'): he wiped his face"
            under:
              - s: "quitándole la visera"
                r: "how, first: taking off his visor"
                under:
                  - {s: "que ya estaba hecha pedazos de los palos", r: "describes 'visera': already smashed to bits by the blows"}
              - {s: "que le tenía cubierto de polvo", r: "describes 'rostro': which he had all covered in dust"}
          - s: "le conoció"
            r: "main verb 3 (after 'y ... cuando'): he recognized him"
            under:
              - {s: "apenas le hubo limpiado", r: "when: no sooner had he wiped it"}
          - {s: "y le dijo:", r: "main verb 4: and said to him ..."}
        forms:
          - {w: "estaba", f: "est- + -aba → estar (to be, for states), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "admirado", f: "admir- + -ado → participle of admirar (to astonish), masculine to match 'labrador'."}
          - {w: "oyendo", f: "o- + -yendo → gerund of oír (to hear); the i of -iendo becomes y between vowels."}
          - {w: "aquellos", f: "aquell- + -os → 'those' (far off), masculine plural to match 'disparates'."}
          - {w: "quitándole", f: "quit- + -ando + le → gerund of quitar (to take off) + 'le' (from him), with an accent added to keep the stress. Pronouns hang on the end of a gerund."}
          - {w: "hecha", f: "irregular participle of hacer (to make), feminine to match 'visera': 'hecha pedazos' = made into pieces."}
          - {w: "le limpió", f: "limpi- + -ó → limpiar (to wipe), preterite, he, + 'le' (for him: whose face). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. Spanish uses 'le ... el rostro' where English says 'his face'."}
          - {w: "le tenía cubierto", f: "ten- + -ía → tener (to have), imperfect, he, + cubierto, the irregular participle of cubrir (to cover): 'had it covered'. 'le' here stands for 'rostro', a thing, where strict grammar wants 'lo'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "hubo limpiado", f: "hub- + -o + limpiado → haber, preterite, + the participle of limpiar: 'had wiped', the literary preterite anterior used after 'apenas' for 'no sooner had he'. haber in the preterite: hube, hubiste, hubo, hubimos, hubisteis, hubieron."}
          - {w: "le conoció", f: "conoc- + -ió → conocer (to know, recognize), preterite, he, + 'le' (him). 'le' for a male person as direct object is leísmo, normal in Cervantes' Castile. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "le dijo", f: "dij- + -o → decir (to say), preterite, he, + 'le' (to him). Irregular stem: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Señor Quijana —que así se debía de llamar cuando él tenía juicio y no había pasado de hidalgo sosegado a caballero andante—, ¿quién ha puesto a vuestra merced desta suerte?"
        literal: "— Sir Quijana —for thus himself he-must of to-call when he had judgment and not had passed from gentleman quiet to knight errant—, who has put your mercy of-this sort?"
        ormsby: "“Señor Quixada” (for so he appears to have been called when he was in his senses and had not yet changed from a quiet country gentleman into a knight-errant), “who has brought your worship to this pass?”"
        vocab:
          - {w: "Señor", d: "Mr., sir; the ordinary polite title before a surname"}
          - {w: "Quijana", d: "yet another version of the hero's real name; Chapter 1 offered Quijada, Quesada and Quejana"}
          - {w: "deber de", d: "must (probably); 'se debía de llamar' = he must have been called"}
          - {w: "juicio", d: "judgment, sanity; 'tener juicio' = to be in one's right mind"}
          - {w: "pasar de ... a", d: "to change from ... into"}
          - {w: "hidalgo", d: "gentleman, member of the minor untitled nobility"}
          - {w: "sosegado", d: "quiet, calm, settled"}
          - {w: "caballero andante", d: "knight-errant"}
          - {w: "vuestra merced", d: "your worship, your grace; polite address taking a 'he/she' verb, later shrunk into 'usted'"}
          - {w: "desta suerte", d: "= de esta suerte, in this state, like this"}
        diagram:
          - s: "quién ha puesto a vuestra merced desta suerte"
            r: "main verb (the question): who has put your worship in this state?"
            under:
              - {s: "Señor Quijana", r: "addressed to"}
              - s: "que así se debía de llamar"
                r: "narrator's aside: for that must have been his name"
                under:
                  - {s: "cuando él tenía juicio", r: "when 1: when he was sane"}
                  - {s: "y no había pasado de hidalgo sosegado a caballero andante", r: "when 2: and had not yet turned from quiet gentleman into knight-errant"}
        forms:
          - {w: "se debía de llamar", f: "deb- + -ía → deber (must), imperfect, he, + 'de' + llamar (to call); 'se' belongs to llamarse (to be called) and has climbed in front of the first verb. 'deber de' + infinitive = probably. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, he. Same -ía imperfect."}
          - {w: "había pasado", f: "hab- + -ía + pasado → haber, imperfect, + the participle of pasar (to pass): pluperfect, he: 'had passed'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "sosegado", f: "soseg- + -ado → participle of sosegar (to calm), used as an adjective, masculine to match 'hidalgo'."}
          - {w: "andante", f: "and- + -ante → from andar (to walk, wander): 'wandering', the -ante ending that makes an adjective from a verb."}
          - {w: "ha puesto", f: "ha + puesto → haber, present, he, + puesto, the irregular participle of poner (to put): present perfect: 'has put'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "a vuestra merced", f: "the personal 'a' before a person as direct object; 'vuestra merced' takes 'he/she' verbs."}
          - {w: "desta", f: "de + esta (of this), feminine to match 'suerte'. Cervantes fuses 'de' with the demonstratives and él / ella: deste, desta, dél, della."}
        note: "The narrator's aside keeps up the joke from Chapter 1 that nobody is sure of the hero's surname. This is also the first time anyone recognizes the knight as the ordinary villager he is."
