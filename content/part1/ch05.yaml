                        r: "at the end of which he would fling the book from his hands"
                        under:
                          - {s: "y ponía mano a la espada", r: "and draw his sword"}
                          - {s: "y andaba a cuchilladas con las paredes", r: "and go slashing at the walls"}
        forms:
          - {w: "Sepa", f: "sep- + -a → saber (to know), present subjunctive, you (vuestra merced, understood): the polite command 'you must know'. Built on the irregular stem sep-: sepa, sepas, sepa, sepamos, sepáis, sepan."}
          - {w: "éste", f: "'this', masculine pronoun (for Nicolás); older spelling puts an accent on the pronoun."}
          - {w: "era", f: "ser (to be), imperfect, it. ser's imperfect is irregular: era, eras, era, éramos, erais, eran."}
          - {w: "le aconteció", f: "acontec- + -ió → acontecer (to happen), preterite, it, + 'le' (to him), doubled by 'a mi señor tío'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "estarse leyendo", f: "estar (to be) + se + le- + -yendo, the gerund of leer (to read), the i turned to y between vowels: 'to stay on reading'. The 'se' adds the sense of lingering."}
          - {w: "desalmados", f: "des- + alm(a) (soul) + -ados → 'soulless', masculine plural to match 'libros'."}
          - {w: "los cuales", f: "'which', the heavy relative (el cual, la cual, los cuales, las cuales), masculine plural for 'días'."}
          - {w: "arrojaba", f: "arroj- + -aba → arrojar (to fling), imperfect, he: 'would fling', the habitual past. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "ponía", f: "pon- + -ía → poner (to put), imperfect, he: 'would put'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "andaba", f: "and- + -aba → andar (to go about), imperfect, he. Same -aba imperfect as 'arrojaba'."}
          - {w: "cuchilladas", f: "cuchill(o) (knife) + -adas → 'slashes'; the -ada ending makes a blow with something (puñalada, stab; patada, kick)."}
        note: "The barber gets his name, Master Nicolás; 'maese' is the title for a tradesman. The niece's 'libros de desventuras' (books of misadventures) is either a slip or a sharp pun on 'aventuras'."
