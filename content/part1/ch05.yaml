  - sentences:
      - es: "— Sepa, señor maese Nicolás —que éste era el nombre del barbero—, que muchas veces le aconteció a mi señor tío estarse leyendo en estos desalmados libros de desventuras dos días con sus noches, al cabo de los cuales, arrojaba el libro de las manos, y ponía mano a la espada y andaba a cuchilladas con las paredes;"
        literal: "— May-you-know, sir master Nicolás —for this-one was the name of-the barber—, that many times to-him it-happened to my lord uncle to-stay-himself reading in these soulless books of misadventures two days with their nights, at-the end of which, he-flung the book from the hands, and put hand to the sword and went-about at slashes with the walls;"
        ormsby: "“You must know, Master Nicholas”—for that was the name of the barber—“it was often my uncle’s way to stay two days and nights together poring over these unholy books of misventures, after which he would fling the book away and snatch up his sword and fall to slashing the walls;"
        vocab:
          - {w: "sepa", d: "may you know, you must know (polite command)"}
          - {w: "maese", d: "master; title for a craftsman such as a barber, below 'señor' but above a bare name"}
          - {w: "acontecer", d: "to happen"}
          - {w: "mi señor tío", d: "my uncle, sir; 'señor' added out of respect"}
          - {w: "estarse leyendo", d: "to stay reading, sit on and on reading"}
          - {w: "desalmado", d: "soulless, heartless, wicked"}
          - {w: "desventuras", d: "misfortunes; a pun on 'aventuras', adventures"}
          - {w: "dos días con sus noches", d: "two days and nights on end"}
          - {w: "al cabo de", d: "at the end of"}
          - {w: "arrojar", d: "to fling, throw"}
          - {w: "poner mano a la espada", d: "to draw one's sword"}
          - {w: "andar a cuchilladas", d: "to go at it with slashes, to be slashing away"}
          - {w: "pared", d: "wall"}
        diagram:
          - s: "Sepa"
            r: "main verb: you must know"
            under:
              - {s: "señor maese Nicolás", r: "addressed to: the barber"}
              - {s: "que éste era el nombre del barbero", r: "narrator's aside: for that was the barber's name"}
              - s: "que muchas veces le aconteció a mi señor tío"
                r: "what to know: that it often happened to my uncle"
                under:
                  - s: "estarse leyendo en estos desalmados libros de desventuras dos días con sus noches"
                    r: "what happened: to sit reading these wicked books two days and nights"
                    under:
