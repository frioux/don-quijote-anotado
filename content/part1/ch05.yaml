          - {w: "estaban", f: "est- + -aban → estar (to be, of place), imperfect, they (the priest and barber). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "ella", f: "'it' (the house), feminine pronoun after a preposition."}
          - {w: "eran", f: "ser (to be), imperfect, they. ser's imperfect is irregular: era, eras, era, éramos, erais, eran."}
