  - sentences:
      - es: "— Esto digo yo también —dijo el cura—, y a fee que no se pase el día de mañana sin que dellos no se haga acto público y sean condenados al fuego, porque no den ocasión a quien los leyere de hacer lo que mi buen amigo debe de haber hecho."
        literal: "— This say I also —said the priest—, and by faith that not itself may-pass the day of tomorrow without that of-them not itself be-made act public and they-be condemned to-the fire, so-that not they-give occasion to whoever them shall-read of doing that which my good friend must of have done."
        ormsby: "“So say I too,” said the curate, “and by my faith tomorrow shall not pass without public judgment upon them, and may they be condemned to the flames lest they lead those that read to behave as my good friend seems to have behaved.”"
        vocab:
          - {w: "a fee", d: "= a fe, by my faith, I swear; 'fee' is the old spelling of 'fe'"}
          - {w: "el día de mañana", d: "tomorrow (the whole day)"}
          - {w: "acto público", d: "public act, formal hearing; an echo of the 'auto de fe', the Inquisition's public sentencing of heretics"}
          - {w: "condenar", d: "to condemn, sentence"}
          - {w: "dar ocasión a", d: "to give occasion to, lead (someone) to"}
          - {w: "leyere", d: "shall read, may read (future subjunctive of leer)"}
          - {w: "deber de", d: "must (probably); 'debe de haber hecho' = must have done"}
        diagram:
          - s: "Esto digo yo también"
            r: "main verb 1: I say so too"
          - {s: "dijo el cura", r: "speech tag: said the priest"}
          - s: "y a fee que no se pase el día de mañana"
            r: "main verb 2: and by my faith, tomorrow shall not go by"
            under:
              - s: "sin que dellos no se haga acto público y sean condenados al fuego"
                r: "without what: without a public act being held on them and their being sentenced to the fire"
                under:
                  - s: "porque no den ocasión a quien los leyere"
                    r: "purpose: so that they give no occasion to whoever may read them"
                    under:
                      - s: "de hacer lo que mi buen amigo debe de haber hecho"
                        r: "occasion for what: to do what my good friend must have done"
        forms:
          - {w: "digo", f: "dig- + -o → decir (to say), present, I: digo, dices, dice, decimos, decís, dicen."}
          - {w: "dijo", f: "dij- + -o → decir, preterite, he. Irregular stem: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "fee", f: "old spelling of fe (faith)."}
          - {w: "se pase", f: "pas- + -e → pasarse (to go by), present subjunctive, it, with 'se'. -ar verbs swap to -e endings in the present subjunctive: pase, pases, pase, pasemos, paséis, pasen. The subjunctive after 'a fe que' makes it a vow: 'may it not pass'."}
          - {w: "dellos", f: "de + ellos (of them, the books). Cervantes fuses 'de' with él, ella, ellos, este: dél, della, dellos, deste. Modern Spanish keeps only 'del'."}
          - {w: "no se haga", f: "hag- + -a → hacer (to do, hold), present subjunctive, it, with passive 'se': 'be held'. Built on 'hago': haga, hagas, haga, hagamos, hagáis, hagan. 'sin que' always takes the subjunctive; the extra 'no' is redundant, an old habit after 'sin que'."}
          - {w: "sean condenados", f: "se- + -an → ser (to be), present subjunctive, they, + condenados, participle of condenar (to condemn), masculine plural for the books: 'be condemned'. ser's present subjunctive: sea, seas, sea, seamos, seáis, sean."}
          - {w: "al", f: "a + el."}
          - {w: "den", f: "dar (to give), present subjunctive, they: dé, des, dé, demos, deis, den. Subjunctive because 'porque' here means 'so that'."}
          - {w: "los leyere", f: "ley- + -ere → leer (to read), future subjunctive, he (whoever), + 'los' (them). The future subjunctive, built on 'leyeron': leyere, leyeres, leyere, leyéremos, leyereis, leyeren. It is used for an open 'whoever may' in old Spanish and survives today only in legal language."}
          - {w: "hacer", f: "infinitive (to do) after 'ocasión de'."}
          - {w: "buen", f: "bueno clipped before a masculine singular noun, like un, algún, gran."}
          - {w: "debe de haber hecho", f: "deb- + -e → deber (must), present, he, + de + haber hecho (the perfect infinitive: to have done; hecho is the irregular participle of hacer). 'deber de' = probably: 'must have done'. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
        note: "The priest's 'acto público' deliberately echoes the Inquisition's 'auto de fe', the public act at which heretics were sentenced and burned; the books are to be tried like people."
