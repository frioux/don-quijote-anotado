part: 1
chapter: 5
title_es: "Capítulo V. Donde se prosigue la narración de la desgracia de nuestro caballero"
title_en: "In which the narrative of our knight's mishap is continued"
paragraphs:
  - sentences:
      - es: "Viendo, pues, que, en efeto, no podía menearse, acordó de acogerse a su ordinario remedio, que era pensar en algún paso de sus libros;"
        literal: "Seeing, then, that, in effect, not he-could stir-himself, he-resolved of to-take-refuge-himself in his ordinary remedy, which was to-think of some passage of his books;"
        ormsby: "Finding, then, that, in fact he could not move, he thought himself of having recourse to his usual remedy, which was to think of some passage in his books,"
        vocab:
          - {w: "pues", d: "then, so; a connective picking up the story from the last chapter, not 'because'"}
          - {w: "en efeto", d: "= en efecto, in fact, indeed; 'efeto' is the old spelling of 'efecto'"}
          - {w: "menearse", d: "to move, stir oneself"}
          - {w: "acordar de", d: "to resolve to, decide to; the 'de' before the infinitive is old usage (modern 'acordó acogerse')"}
          - {w: "acogerse a", d: "to take refuge in, fall back on"}
          - {w: "ordinario", d: "usual, customary"}
          - {w: "paso", d: "passage, episode (of a book); also 'step' and 'predicament'"}
        diagram:
          - s: "acordó de acogerse a su ordinario remedio"
            r: "main verb: he resolved to fall back on his usual remedy; the subject 'he' is in the ending"
            under:
              - s: "Viendo, pues, que, en efeto, no podía menearse"
                r: "why: seeing that he really could not move"
              - s: "que era pensar en algún paso de sus libros"
                r: "describes 'remedio': which was to think of some episode in his books"
        forms:
          - {w: "Viendo", f: "v- + -iendo → ver (to see), gerund: 'seeing'. The gerund opens the sentence to give the reason for the main verb."}
          - {w: "efeto", f: "old spelling of efecto; Cervantes often drops the c of -ct- (efeto, dotor, perfeto)."}
          - {w: "podía", f: "pod- + -ía → poder (to be able), imperfect, he: 'could'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "menearse", f: "menear (to move) + se (himself): the infinitive after 'podía' with its pronoun hung on the end."}
          - {w: "acordó", f: "acord- + -ó → acordar (to resolve), preterite, he: 'he resolved'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "acogerse", f: "acoger (to shelter) + se (himself): infinitive after 'acordó de', with the pronoun hung on the end: 'to take refuge'."}
          - {w: "ordinario", f: "masculine singular to match 'remedio', placed before the noun."}
          - {w: "era", f: "ser (to be), imperfect, it: 'was'. ser's imperfect is irregular: era, eras, era, éramos, erais, eran."}
          - {w: "pensar", f: "infinitive (to think) used as a noun after 'era': 'was to think'."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun ('paso'), like un, ningún, buen, primer."}
          - {w: "sus", f: "su + -s → 'his', plural to match 'libros', not the owner."}
        note: "At the end of Chapter 4 a muleteer had beaten Don Quijote with the pieces of his own lance and left him lying on the road, too weighed down by his armor to get up. This chapter opens where that one stopped."
      - es: "y trújole su locura a la memoria aquel de Valdovinos y del marqués de Mantua, cuando Carloto le dejó herido en la montiña, historia sabida de los niños, no ignorada de los mozos, celebrada y aun creída de los viejos;"
        literal: "and brought-to-him his madness to the memory that [one] of Valdovinos and of-the marquis of Mantua, when Carloto him left wounded on the mountain, story known by the children, not unknown by the youths, celebrated and even believed by the old-men;"
        ormsby: "and his craze brought to his mind that about Baldwin and the Marquis of Mantua, when Carloto left him wounded on the mountain side, a story known by heart by the children, not forgotten by the young men, and lauded and even believed by the old folk;"
        vocab:
          - {w: "trújole", d: "= le trajo, 'brought to him'; 'truje' is the old form of 'traje'"}
          - {w: "locura", d: "madness"}
          - {w: "traer a la memoria", d: "to bring to mind"}
          - {w: "aquel de", d: "that [story] of, the one about"}
          - {w: "Valdovinos", d: "Baldwin, a knight of Charlemagne's court in Spanish ballads, treacherously wounded by the emperor's son"}
          - {w: "marqués de Mantua", d: "the Marquis of Mantua, Valdovinos' uncle in the ballad, who finds him dying while out hunting"}
          - {w: "Carloto", d: "Charlot, son of Charlemagne in the ballad, who wounds Valdovinos to win his wife"}
          - {w: "montiña", d: "= montaña, wild wooded country, forest; the old form used in the ballad"}
          - {w: "sabido de", d: "known by; old Spanish uses 'de' where modern uses 'por' for the doer"}
          - {w: "ignorado", d: "unknown"}
          - {w: "celebrado", d: "praised, famous"}
          - {w: "aun", d: "even (no accent; 'aún' with accent means 'still')"}
        diagram:
          - s: "trújole"
            r: "main verb (after 'y'): brought to him"
            under:
              - {s: "su locura", r: "subject: his madness"}
              - {s: "a la memoria", r: "where to: to his memory"}
              - s: "aquel de Valdovinos y del marqués de Mantua"
                r: "object: the story of Valdovinos and the Marquis of Mantua"
                under:
                  - {s: "cuando Carloto le dejó herido en la montiña", r: "which moment: when Carloto left him wounded in the forest"}
                  - s: "historia"
                    r: "in apposition to 'aquel': a story ..."
                    under:
                      - {s: "sabida de los niños", r: "describes 'historia' 1: known by children"}
                      - {s: "no ignorada de los mozos", r: "describes 'historia' 2: not unknown to young men"}
                      - {s: "celebrada y aun creída de los viejos", r: "describes 'historia' 3: praised and even believed by old men"}
        forms:
          - {w: "trújole", f: "truj- + -o + le → traer (to bring), preterite, it (his madness), with 'le' (to him) stuck on the end; modern 'le trajo'. Cervantes hangs pronouns on a conjugated verb that opens its clause; modern Spanish puts them before the verb. His preterite of traer: truje, trujiste, trujo, trujimos, trujisteis, trujeron (modern traje, trajiste, trajo, trajimos, trajisteis, trajeron). The accent is added to keep the stress on 'tru-'."}
          - {w: "su", f: "'his'; the possessive agrees with the thing owned ('locura', singular), never with the owner: su, sus."}
          - {w: "aquel", f: "'that [one]', masculine, a pronoun standing for an unspoken 'paso' or 'romance'."}
          - {w: "del", f: "de + el."}
          - {w: "le dejó", f: "dej- + -ó → dejar (to leave), preterite, he (Carloto), + 'le' (him). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. 'le' for a male person as the direct object is leísmo, normal in Cervantes' Castile (strict grammar wants 'lo')."}
          - {w: "herido", f: "her- + -ido → participle of herir (to wound): 'wounded', masculine to match Valdovinos."}
          - {w: "sabida, ignorada, celebrada, creída", f: "four participles (of saber, to know; ignorar, to not know; celebrar, to praise; creer, to believe), all feminine singular to match 'historia'. -ar verbs make -ado, -er and -ir verbs make -ido; 'creída' takes an accent to keep the i separate."}
        ormsby_note: "The subject of the old ballad, De Mantua Salió el Marques (Duran's Romancero General, No. 355); a chanson de geste, indeed, rather than a ballad, as it runs to something over 800 lines. Pellicer wrongly assigns it to Geronimo Trevifio, a sixteenth century author. It is in the Antwerp Cancionero of 1550 and the Saragossa Silva of the same date."
      - es: "y, con todo esto, no más verdadera que los milagros de Mahoma."
        literal: "and, with all this, not more true than the miracles of Muhammad."
        ormsby: "and for all that not a whit truer than the miracles of Muhammad."
        vocab:
          - {w: "con todo esto", d: "for all that, nevertheless"}
          - {w: "verdadero", d: "true"}
          - {w: "milagro", d: "miracle"}
          - {w: "Mahoma", d: "Muhammad; to a Christian writer of 1605, the stock example of something false"}
        diagram:
          - s: "no más verdadera"
            r: "continues 'historia' from the previous sentence: a story no truer"
            under:
              - {s: "con todo esto", r: "concession: for all that"}
              - {s: "que los milagros de Mahoma", r: "compared with what: the miracles of Muhammad"}
        forms:
          - {w: "esto", f: "neuter 'this [matter]'; esto, eso, aquello point at ideas rather than nouns and take no accent."}
          - {w: "verdadera", f: "verdader- + -a → verdadero (true), feminine to match 'historia' in the previous sentence."}
          - {w: "no más ... que", f: "'no more ... than': the comparison of inequality, más + adjective + que."}
        note: "The narrator's jab turns the whole Carolingian ballad tradition into something only fools believe, the same complaint moralists made about the romances of chivalry."
      - es: "Ésta, pues, le pareció a él que le venía de molde para el paso en que se hallaba; y así, con muestras de grande sentimiento, se comenzó a volcar por la tierra y a decir con debilitado aliento lo mesmo que dicen decía el herido caballero del bosque:"
        literal: "This-one, then, to-him seemed to him that to-him came of mould for the pass in which himself he-found; and so, with shows of great grief, himself he-began to roll along the ground and to say with weakened breath the same that they-say said the wounded knight of-the wood:"
        ormsby: "This seemed to him to fit exactly the case in which he found himself, so, making a show of severe suffering, he began to roll on the ground and with feeble breath repeat the very words which the wounded knight of the wood is said to have uttered:"
        vocab:
          - {w: "ésta", d: "this one (the story); old accent on the pronoun"}
          - {w: "venir de molde", d: "to fit perfectly, suit exactly (literally 'come from the mould')"}
          - {w: "paso", d: "here: plight, predicament (it meant 'episode' in the first sentence of the chapter)"}
          - {w: "hallarse", d: "to find oneself, to be"}
          - {w: "muestras", d: "signs, shows"}
          - {w: "sentimiento", d: "grief, pain (not just 'feeling')"}
          - {w: "volcarse", d: "to roll over, tumble"}
          - {w: "debilitado", d: "weakened, feeble"}
          - {w: "aliento", d: "breath"}
          - {w: "mesmo", d: "= mismo, 'same'; archaic form used throughout the book"}
          - {w: "bosque", d: "wood, forest"}
        diagram:
          - s: "le pareció a él"
            r: "main verb 1: it seemed to him"
            under:
              - {s: "Ésta, pues,", r: "subject put first: this story"}
              - s: "que le venía de molde"
                r: "what seemed: that it fit him perfectly"
                under:
                  - s: "para el paso"
                    r: "for what: for the plight"
                    under:
                      - {s: "en que se hallaba", r: "describes 'paso': in which he found himself"}
          - s: "se comenzó a volcar por la tierra"
            r: "main verb 2 (after 'y así'): he began to roll on the ground"
            under:
              - {s: "con muestras de grande sentimiento", r: "how: with signs of great pain"}
              - s: "y a decir con debilitado aliento lo mesmo"
                r: "and he began to say, with feeble breath, the same thing"
                under:
                  - {s: "que dicen decía el herido caballero del bosque", r: "describes 'lo mesmo': which they say the wounded knight of the wood said"}
        forms:
          - {w: "Ésta", f: "est- + -a → 'this one', feminine to stand for 'historia'. Older spelling puts an accent on the pronoun."}
          - {w: "le pareció a él", f: "parec- + -ió → parecer (to seem), preterite, it, + 'le' (to him), doubled by 'a él' for emphasis. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "venía", f: "ven- + -ía → venir (to come), imperfect, it: 'came' ('venir de molde' = to fit). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "se hallaba", f: "hall- + -aba → hallar (to find), imperfect, he, with 'se': 'found himself'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "grande", f: "Cervantes often keeps the full form before a noun; modern Spanish clips it to 'gran' before a singular noun."}
          - {w: "se comenzó a volcar", f: "comenz- + -ó → comenzar (to begin), preterite, he; the 'se' belongs to volcarse (to roll) but has climbed up in front of the first verb, as it may (= 'comenzó a volcarse'). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "decir", f: "infinitive (to say) after 'comenzó a', second of the two things he began."}
          - {w: "debilitado", f: "debilit- + -ado → participle of debilitar (to weaken), masculine to match 'aliento', placed before the noun."}
          - {w: "lo mesmo", f: "= lo mismo: neuter 'lo' + adjective = 'the same [thing]'. 'mesmo' is the old spelling of mismo."}
          - {w: "dicen decía", f: "dic- + -en → decir (to say), present, they: 'they say', + dec- + -ía → decir, imperfect, he: 'he said'. The 'que' between them is left out: 'dicen [que] decía'. The present of decir: digo, dices, dice, decimos, decís, dicen. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "herido", f: "participle of herir (to wound), masculine to match 'caballero', placed before the noun."}
          - {w: "del", f: "de + el."}
  - sentences:
      - es: "-¿Donde estás, señora mía, que no te duele mi mal?"
        literal: "-Where are-you, lady mine, that not to-you hurts my ill?"
        ormsby: "Where art thou, lady mine, that thou / My sorrow dost not rue?"
        vocab:
          - {w: "Donde", d: "= dónde, 'where'; Gutenberg prints it without the accent a question word takes today"}
          - {w: "señora mía", d: "my lady; the possessive after the noun is emphatic and courtly"}
          - {w: "doler", d: "to hurt, grieve; 'no te duele mi mal' = my pain does not grieve you"}
          - {w: "mal", d: "pain, suffering, affliction (as a noun)"}
        diagram:
          - s: "Donde estás"
            r: "main verb 1: where are you?"
            under:
              - {s: "señora mía", r: "addressed to: my lady"}
          - s: "que no te duele mi mal"
            r: "loose 'que' = 'since': that my pain does not grieve you"
        forms:
          - {w: "estás", f: "est- + -ás → estar (to be, for place and state), present, you (tú): 'you are'. estar in the present: estoy, estás, está, estamos, estáis, están."}
          - {w: "mía", f: "mí- + -a → 'my, of mine', the stressed possessive placed after the noun, feminine to match 'señora': mío, mía, míos, mías."}
          - {w: "te duele", f: "duel- + -e → doler (to hurt), present, it (my pain), + 'te' (to you). Built like gustar: the pain is the subject, the one who feels it is the pronoun. The stem o becomes ue when stressed: duelo, dueles, duele, dolemos, doléis, duelen."}
          - {w: "mi", f: "'my', the unstressed possessive before the noun; one form for both genders (mi, mis)."}
        note: "These are the opening lines of the Valdovinos ballad, which the wounded knight speaks to his absent wife Sevilla. The ballad uses 'tú', the intimate address; the dash-hyphen before the line is Gutenberg's typography."
      - es: "O no lo sabes, señora, o eres falsa y desleal."
        literal: "Either not it you-know, lady, or you-are false and disloyal."
        ormsby: "Thou canst not know it, lady mine, / Or else thou art untrue."
        vocab:
          - {w: "o ... o", d: "either ... or"}
          - {w: "falso", d: "false, faithless"}
          - {w: "desleal", d: "disloyal, unfaithful"}
        diagram:
          - s: "O no lo sabes"
            r: "main verb 1: either you don't know it"
            under:
              - {s: "señora", r: "addressed to: lady"}
          - s: "o eres falsa y desleal"
            r: "main verb 2: or you are false and faithless"
        forms:
          - {w: "lo", f: "'it' (my pain), the direct object pronoun before the verb."}
          - {w: "sabes", f: "sab- + -es → saber (to know), present, you (tú). Irregular only in the 'I' form: sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "eres", f: "ser (to be), present, you (tú): soy, eres, es, somos, sois, son."}
          - {w: "falsa", f: "fals- + -a → falso (false), feminine to match the lady."}
          - {w: "desleal", f: "des- (un-) + leal (loyal); adjectives in -al have one form for both genders."}
  - sentences:
      - es: "Y, desta manera, fue prosiguiendo el romance hasta aquellos versos que dicen:"
        literal: "And, of-this manner, he-went continuing the ballad up-to those verses that say:"
        ormsby: "And so he went on with the ballad as far as the lines:"
        vocab:
          - {w: "desta", d: "= de esta, 'of this'; Cervantes fuses 'de' with este, esta, él, ella (deste, desta, dél, della)"}
          - {w: "desta manera", d: "in this way"}
          - {w: "proseguir", d: "to continue, go on with"}
          - {w: "romance", d: "ballad; a narrative poem in eight-syllable lines, not a 'romance' in the English sense"}
          - {w: "verso", d: "line of verse"}
        diagram:
          - s: "fue prosiguiendo el romance"
            r: "main verb: he went on continuing the ballad"
            under:
              - {s: "desta manera", r: "how: in this way"}
              - s: "hasta aquellos versos"
                r: "how far: up to those lines"
                under:
                  - {s: "que dicen:", r: "describes 'versos': which say ..."}
        forms:
          - {w: "desta", f: "de + esta (of this), feminine to match 'manera'. Cervantes fuses 'de' with the demonstratives and él / ella: deste, desta, dél, della. Modern Spanish keeps only 'del'."}
          - {w: "fue prosiguiendo", f: "fue = ir (to go), preterite, he: fui, fuiste, fue, fuimos, fuisteis, fueron; + prosigu- + -iendo, the gerund of proseguir (to continue). 'ir' + gerund = to go on doing, little by little."}
          - {w: "aquellos", f: "aquell- + -os → 'those' (far off), masculine plural to match 'versos': aquel, aquella, aquellos, aquellas."}
          - {w: "dicen", f: "dic- + -en → decir (to say), present, they (the lines). The present of decir: digo, dices, dice, decimos, decís, dicen."}
  - sentences:
      - es: "-¡Oh noble marqués de Mantua, mi tío y señor carnal!"
        literal: "-Oh noble marquis of Mantua, my uncle and lord by-blood!"
        ormsby: "O noble Marquis of Mantua, / My Uncle and liege lord!"
        vocab:
          - {w: "noble", d: "noble"}
          - {w: "marqués", d: "marquis"}
          - {w: "señor", d: "lord, liege"}
          - {w: "carnal", d: "by blood, of one's own flesh; 'tío carnal' = a blood uncle, not an uncle by marriage"}
        diagram:
          - s: "Oh noble marqués de Mantua"
            r: "address: the one he is crying out to"
            under:
              - {s: "mi tío y señor carnal", r: "in apposition: my uncle and lord by blood"}
        forms:
          - {w: "noble", f: "one form for both genders; placed before the noun, as ballads like to do."}
          - {w: "mi", f: "'my', the unstressed possessive; one form for both genders (mi, mis). It covers both nouns: 'tío' and 'señor'."}
          - {w: "carnal", f: "carn(e) (flesh) + -al → 'of the flesh', one form for both genders."}
        note: "In the ballad the Marquis of Mantua finds his nephew Valdovinos dying in the forest and hears these words. Don Quijote is casting himself as the wounded nephew, and in a moment he will cast the first passer-by as the uncle."
  - sentences:
      - es: "Y quiso la suerte que, cuando llegó a este verso, acertó a pasar por allí un labrador de su mesmo lugar y vecino suyo, que venía de llevar una carga de trigo al molino;"
        literal: "And willed the luck that, when he-arrived at this verse, happened to pass by there a farmer of his same village and neighbor of-his, who was-coming from carrying a load of wheat to-the mill;"
        ormsby: "As chance would have it, when he had got to this line there happened to come by a peasant from his own village, a neighbour of his, who had been with a load of wheat to the mill,"
        vocab:
          - {w: "quiso la suerte que", d: "as luck would have it (literally 'luck wanted that')"}
          - {w: "acertar a", d: "to happen to, chance to"}
          - {w: "labrador", d: "farmer, peasant who works his own land"}
          - {w: "lugar", d: "village (its common sense in Cervantes)"}
          - {w: "mesmo", d: "= mismo, 'same'"}
          - {w: "vecino", d: "neighbor, fellow villager"}
          - {w: "venir de", d: "to be coming back from"}
          - {w: "carga", d: "load"}
          - {w: "trigo", d: "wheat"}
          - {w: "molino", d: "mill"}
        diagram:
          - s: "quiso"
            r: "main verb: willed"
            under:
              - {s: "la suerte", r: "subject: luck"}
              - s: "que, cuando llegó a este verso, acertó a pasar por allí un labrador"
                r: "what luck willed: that, just as he reached this line, a farmer happened to pass by"
                under:
                  - {s: "de su mesmo lugar y vecino suyo", r: "describes 'labrador': from his own village, and his neighbor"}
                  - {s: "que venía de llevar una carga de trigo al molino", r: "describes 'labrador': who was coming back from taking wheat to the mill"}
        forms:
          - {w: "quiso", f: "quis- + -o → querer (to want), preterite, it (luck). Irregular stem: quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "llegó", f: "lleg- + -ó → llegar (to arrive, reach), preterite, he (Don Quijote). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "este", f: "'this', masculine to match 'verso'."}
          - {w: "acertó", f: "acert- + -ó → acertar (to happen to), preterite, he (the farmer). Same -ar preterite. The subject 'un labrador' comes after the verb."}
          - {w: "pasar", f: "infinitive (to pass) after 'acertó a'."}
          - {w: "mesmo", f: "old spelling of mismo; 'su mesmo lugar' = his own village."}
          - {w: "suyo", f: "suy- + -o → 'of his', the stressed possessive after the noun, masculine to match 'vecino': suyo, suya, suyos, suyas."}
          - {w: "venía", f: "ven- + -ía → venir (to come), imperfect, he: 'was coming'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "llevar", f: "infinitive (to carry, take) after 'de'."}
          - {w: "al", f: "a + el."}
      - es: "el cual, viendo aquel hombre allí tendido, se llegó a él y le preguntó que quién era y qué mal sentía que tan tristemente se quejaba."
        literal: "who, seeing that man there stretched-out, himself came-up to him and to-him asked that who he-was and what ill he-felt that so sadly himself he-complained."
        ormsby: "and he, seeing the man stretched there, came up to him and asked him who he was and what was the matter with him that he complained so dolefully."
        vocab:
          - {w: "el cual", d: "who, which; the heavy relative used to start a new unit"}
          - {w: "tendido", d: "stretched out, lying flat"}
          - {w: "llegarse a", d: "to go up to, approach"}
          - {w: "sentir", d: "to feel"}
          - {w: "qué mal sentía", d: "what was wrong with him, what pain he felt"}
          - {w: "tristemente", d: "sadly, dolefully"}
          - {w: "quejarse", d: "to complain, moan"}
        diagram:
