          - {w: "mucha", f: "much- + -a → mucho (much, great), feminine to match 'virtud'."}
          - {w: "subió", f: "sub- + -ió → subir (to rise), preterite, he. The preterite of -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
