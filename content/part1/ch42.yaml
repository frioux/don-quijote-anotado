  - sentences:
      - es: "Estas y otras semejantes palabras decía el oidor, lleno de tanta compasión con las nuevas que de su hermano le habían dado, que todos los que le oían le acompañaban en dar muestras del sentimiento que tenían de su lástima."
        literal: "These and other similar words was-saying the judge, full of so-much compassion with the news that of his brother to-him they-had given, that all those who him were-hearing him were-accompanying in giving signs of-the feeling that they-had of his grief."
        ormsby: "All this and more the Judge uttered with such deep emotion at the news he had received of his brother that all who heard him shared in it, showing their sympathy with his sorrow."
