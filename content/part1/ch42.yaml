          - {w: "semejante", d: "similar, like it"}
          - {w: "oidor", d: "judge of a royal appeal court (an 'Audiencia'); literally 'hearer', the one who hears cases"}
          - {w: "nuevas", d: "news (plural noun), not 'new ones'"}
          - {w: "dar muestras de", d: "to show signs of, to show"}
          - {w: "sentimiento", d: "grief, sorrow; here not just 'feeling' but sad feeling"}
          - {w: "lástima", d: "pity, grief, distress; 'su lástima' = his distress (the judge's)"}
