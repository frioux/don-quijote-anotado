          - {w: "los pusieron", f: "pus- + -ieron → poner (to put), preterite, they (the Frenchmen); 'los' = them (the captain and Zoraida). Irregular: puse, pusiste, puso, pusimos, pusisteis, pusieron. 'Los franceses' is picked up again by the verb ending, and 'los' points forward to the pair."}
          - {w: "veis", f: "v- + -eis → ver (to see), present, you (vos). veo, ves, ve, vemos, veis, ven."}
          - {w: "mostréis", f: "mostr- + -éis → mostrar (to show), present subjunctive, you (vos), after 'para que'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en (the stressed forms take ue: muestre, muestres, muestre, mostremos, mostréis, muestren)."}
          - {w: "buen", f: "bueno (good) clipped before a masculine singular noun ('pecho')."}
