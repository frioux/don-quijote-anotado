summary: |
  The captive finishes his story, and Don Fernando praises it as strange and wonderful. Everyone offers him help; Don Fernando promises that his brother the marquis will stand godfather at Zoraida's baptism and that he will set the captain up to return home with the standing he deserves. The captive thanks them all but accepts nothing.

  At nightfall a coach arrives with horsemen, bringing an oidor, a judge of the royal courts, and his daughter of about sixteen, so beautiful that only Dorotea, Luscinda and Zoraida can match her. Don Quijote welcomes them to his 'castle' with a high-flown speech on arms, letters and beauty that leaves the judge bewildered. The women go to the garret together, the men stay outside, and the beds are shared out as well as they can be.

  The captive learns from a servant that the judge is the licentiate Juan Pérez de Viedma from the mountains of León, his own brother, who followed letters and is now on his way to a post in the Audiencia of Mexico. Afraid his brother may be ashamed of his poverty, he asks for advice, and the priest offers to test the ground. At supper the priest tells, as if it were his own memory of captivity in Constantinople, the story of a captain named Ruy Pérez de Viedma, breaking off where the French robbed him and Zoraida. The judge weeps, says this is his eldest brother, and wishes he knew where he was. The priest then brings in Zoraida and the captain, and the brothers embrace amid the tears of all; they agree that the captain and Zoraida will go back to Seville with the judge and send word to their old father, so that he can come to the wedding and the baptism.

  Don Quijote, who sees enchantments in all of it, offers to keep watch over the castle and goes out to stand sentry. Sancho settles down on his ass's trappings, which, the narrator warns, will cost him dear. Shortly before dawn the women hear a fine voice singing, unaccompanied, somewhere in the yard or the stable. Cardenio comes to tell them it is a young mule driver who 'so sings that he enchants', and Dorotea, lying awake beside the judge's daughter, Doña Clara de Viedma, listens to the words of the song.
context: |
  Judges and the Indies. An 'oidor', literally 'hearer', was a judge of one of the royal Audiencias, the high courts of appeal that also governed in the King's name, in Spain and in the Indies. The Audiencia of Mexico had been set up in the late 1520s, and posts in the American courts were a common step in a lawyer's career. Juan Pérez de Viedma is a 'licenciado', a university graduate in law, and his long gown with its ruffled sleeves told everyone at a glance what he was. To reach Mexico he must sail with the 'flota', the convoy that left Seville for New Spain about once a year, which is why he cannot wait a month for his father. The three brothers fulfil the father's advice of chapter 39, 'Iglesia, o mar, o casa real' (letters, trade and the King's service in war): the eldest took arms, the judge took letters, and the third went to the Indies as a merchant and grew rich in Peru. In chapter 39 it was the youngest who chose letters and the second who went to the Indies, yet here the judge calls the brother in Peru 'mi menor hermano', one of Cervantes' small slips. The new arrival thus turns the arms-and-letters speech of chapter 38 into a family.

  The narrator's games. The priest, who has never been to Constantinople, tells the story of Viedma as if he had shared his captivity, a fiction inside the fiction that tests the judge's heart before the truth is revealed. Ormsby points out two slips: the company sits down to supper although they already ate supper earlier that evening, before Don Quijote's speech, and the priest knows the French robbed the fugitives yet claims not to know what became of them. The narrator puns that the judge was never so much an 'oidor', a hearer, as then, and Cardenio's muleteer 'de tal manera canta que encanta', sings so that he enchants. The scene of recognition, with its embraces and tears that the narrator says cannot be described, much less written, follows the pattern of the romances and the stage.

  Don Quijote in the inn. The knight greets the judge as he greeted everyone else at the inn, as a lord arriving at a castle, and his speech joins the two themes of his own oration: arms and letters, led by beauty. He takes the reunion of the brothers for one more marvel of knight-errantry and keeps guard against giants and 'follones' (rogues), while the narrator, as usual, hints at trouble ahead for Sancho.

  Religion and society. Zoraida is still unbaptised; Don Fernando's offer of a marquis as godfather would give her a powerful sponsor in Christian society, and the judge's wish to be present at 'the rebirth of her soul' speaks of baptism as a new birth. The judge's wealth comes from his late wife's dowry, which stayed in his house with the daughter she died giving birth to. The Cato of the father's counsels is the 'Disticha Catonis', the collection of moral maxims every schoolboy learnt, so 'better than Cato's' means 'wiser than the proverbs'.

  Reading Cervantes' Spanish. The archaisms of the chapter: estraño and estrañeza (extraño), mesmo (mismo), recebir (recibir), acetar (aceptar), eceto (excepto), estremo (extremo), luengo (largo), agora (ahora), ansí and ansimesmo (así, asimismo), afliciones (aflicciones), güéspeda (huéspeda), Costantinopla, Pirú, and fused forms like della, dello, desta. Don Quijote uses the chivalric f- (fermosura, fermosa) and devidirse for dividirse. Infinitives with a pronoun turn -rl- into -ll- (escuchalle, respondelle, dalle). Pronouns hang on the end of verbs that open a clause (Hallóse, Habíale, Pidióles, Llamábase, Déjeseme, Agradeciéronselo), the -ra form serves as a conditional (creyeran, holgáramos, tuviera), the -se imperfect subjunctive carries the plans and requests (fuese, pudiese, volviesen), the future subjunctive marks an open future (acertare), and the old vosotros forms appear in supiésedes and oístes. Watch 'en diciendo' (as soon as he had said), 'acabar de' (to finish, here 'fully'), 'haber de' (must), 'la ofreció' with 'la' for 'le', and the false friends peregrino (rare), suceso (event), accidente (incident) and discreción (good sense).
