  - sentences:
      - es: "Ya, en esto, estaba aderezada la cena, y todos se sentaron a la mesa, eceto el cautivo y las señoras, que cenaron de por sí en su aposento."
        literal: "Already, in this, was prepared the supper, and all themselves sat at the table, except the captive and the ladies, who supped of by themselves in their room."
        ormsby: "By this time supper was ready, and they all took their seats at the table, except the captive, and the ladies, who supped by themselves in their own room."
        ormsby_note: "Cervantes apparently forgets that they had supped already."
        vocab:
          - {w: "en esto", d: "meanwhile, at this point"}
          - {w: "aderezar", d: "to prepare, get ready (a meal)"}
          - {w: "eceto", d: "= excepto, except (old spelling)"}
          - {w: "de por sí", d: "by themselves, separately"}
          - {w: "aposento", d: "room, lodging"}
        diagram:
          - s: "estaba aderezada la cena"
            r: "main verb 1: supper was ready"
            under:
              - {s: "Ya, en esto", r: "when: by now, meanwhile"}
          - s: "y todos se sentaron a la mesa"
            r: "main verb 2: and all sat down at the table"
            under:
              - s: "eceto el cautivo y las señoras"
                r: "except: the captive and the ladies"
                under:
                  - {s: "que cenaron de por sí en su aposento", r: "describes them: who ate supper by themselves in their room"}
        forms:
          - {w: "estaba aderezada", f: "est- + -aba → estar (to be), imperfect, it, + aderezada, participle of aderezar (to prepare), feminine to match 'cena': 'was prepared'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "se sentaron", f: "sent- + -aron → sentarse (to sit down), preterite, they, with 'se'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "eceto", f: "old spelling of excepto (except): Cervantes' printers often drop the x/c before a consonant (acetar, eceto)."}
