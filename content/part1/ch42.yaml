          - {w: "cautivo", d: "captive, the former prisoner of the Moors"}
          - {w: "las dos partes", d: "two thirds (of three parts); the night was two-thirds over"}
          - {w: "jornada", d: "a day's journey; here the night's course"}
          - {w: "acordar de", d: "to agree to, decide to (modern 'acordar' without 'de')"}
          - {w: "recogerse", d: "to retire, go to bed"}
          - {w: "reposar", d: "to rest"}
