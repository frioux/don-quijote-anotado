  - sentences:
      - es: "— Llamábase —respondió el cura— Ruy Pérez de Viedma, y era natural de un lugar de las montañas de León, el cual me contó un caso que a su padre con sus hermanos le había sucedido, que, a no contármelo un hombre tan verdadero como él, lo tuviera por conseja de aquellas que las viejas cuentan el invierno al fuego."
        literal: "— He-called-himself —answered the priest— Ruy Pérez de Viedma, and he-was native of a village of the mountains of León, the which [man] to-me told a case that to his father with his brothers to-him had happened, which, if not to-tell-it-to-me a man so truthful as he, it I-would-have-held for fable of those that the old-women tell the winter by-the fire."
        ormsby: "“He was called Ruy Pérez de Viedma,” replied the curate, “and he was born in a village in the mountains of León; and he mentioned a circumstance connected with his father and his brothers which, had it not been told me by so truthful a man as he was, I should have set down as one of those fables the old women tell over the fire in winter;"
        vocab:
          - {w: "llamarse", d: "to be called; 'llamábase' = he was called"}
          - {w: "natural de", d: "a native of, born in"}
          - {w: "lugar", d: "village, small town (its usual sense in Cervantes), not just 'place'"}
          - {w: "montañas de León", d: "the mountain country of León in north-west Spain, a region proud of its old Christian lineage"}
          - {w: "caso", d: "event, happening, story (not a legal 'case')"}
          - {w: "a no + infinitive", d: "if it were not for, had it not been that: 'a no contármelo' = had he not told me it"}
          - {w: "verdadero", d: "truthful (of a person), not only 'true'"}
          - {w: "tener por", d: "to take for, consider as"}
          - {w: "conseja", d: "old wives' tale, fable told for amusement"}
          - {w: "al fuego", d: "by the fire, at the fireside"}
        diagram:
          - s: "Llamábase"
            r: "main verb 1: he was called"
            under:
              - {s: "respondió el cura", r: "speech tag: answered the priest"}
              - {s: "Ruy Pérez de Viedma", r: "the name"}
          - s: "y era natural de un lugar de las montañas de León"
            r: "main verb 2: and he was a native of a village in the León mountains"
          - s: "el cual me contó un caso"
            r: "describes Ruy: who told me a story"
            under:
              - {s: "que a su padre con sus hermanos le había sucedido", r: "describes 'caso': that had happened to his father and his brothers"}
              - s: "lo tuviera por conseja de aquellas"
                r: "describes 'caso', 2: which I would have taken for an old wives' tale"
                under:
                  - {s: "a no contármelo un hombre tan verdadero como él", r: "condition: had it not been told me by a man as truthful as he"}
                  - {s: "que las viejas cuentan el invierno al fuego", r: "describes 'aquellas': that old women tell in winter by the fire"}
        forms:
          - {w: "Llamábase", f: "llam- + -aba + se → llamarse (to be called), imperfect, he, with 'se' stuck on the end, accent added; modern 'se llamaba'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. Cervantes hangs the pronoun on a verb that opens the sentence."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "era", f: "ser (to be), imperfect, he. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "el cual", f: "'who, which', masculine singular to match Ruy; a heavier relative than 'que', used after a comma."}
          - {w: "contó", f: "cont- + -ó → contar (to tell), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "había sucedido", f: "hab- + -ía → haber (to have), imperfect, it, + sucedido, the participle of suceder (to happen): the pluperfect, 'had happened'. haber (to have) in the imperfect: había, habías, había, habíamos, habíais, habían. The 'le' repeats 'a su padre': Spanish doubles an indirect object with a pronoun."}
          - {w: "contármelo", f: "contar (to tell) + me (to me) + lo (it), infinitive after 'a no', accent added; 'a no contármelo' = had he not told me it."}
          - {w: "tuviera", f: "tuv- + -iera → tener (to hold), imperfect subjunctive (-ra form), I, used as a conditional: 'I would have held'. Built on the preterite tuvieron: tuviera, tuvieras, tuviera, tuviéramos, tuvierais, tuvieran."}
          - {w: "aquellas", f: "aquell- + -as → aquel (that), feminine plural, standing for 'consejas' (tales of that kind)."}
          - {w: "cuentan", f: "cuent- + -an → contar (to tell), present, they (the old women). The stem o becomes ue when stressed: cuento, cuentas, cuenta, contamos, contáis, cuentan."}
        note: "The priest is playing the game the captive asked for: he tells the judge his own brother's story as if it were a far-off anecdote, to see how the judge reacts. The 'caso' is the father's choice of 'church, sea or royal house' told in chapter 39."
