part: 1
chapter: 42
title_es: "Capítulo XLII. Que trata de lo que más sucedió en la venta y de otras muchas cosas dignas de saberse"
title_en: "Which treats of what further took place in the inn, and of several other things worth knowing"
paragraphs:
  - sentences:
      - es: "Calló, en diciendo esto, el cautivo, a quien don Fernando dijo:"
        literal: "Fell-silent, on saying this, the captive, to whom Don Fernando said:"
        ormsby: "With these words the captive held his peace, and Don Fernando said to him,"
        vocab:
          - {w: "callar", d: "to fall silent, stop talking"}
          - {w: "en diciendo esto", d: "on saying this, as soon as he had said this; 'en' + gerund = immediately after doing"}
          - {w: "cautivo", d: "captive: the soldier ransomed from Algiers who has just told his story (chapters 39 to 41)"}
        diagram:
          - s: "Calló"
            r: "main verb 1: fell silent"
            under:
              - {s: "en diciendo esto", r: "when: as soon as he had said this"}
              - s: "el cautivo"
                r: "subject: the captive"
                under:
                  - s: "a quien don Fernando dijo:"
                    r: "describes 'cautivo': to whom Don Fernando said"
        forms:
          - {w: "Calló", f: "call- + -ó → callar (to fall silent), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. The verb comes first and the subject 'el cautivo' only after the aside."}
          - {w: "en diciendo", f: "gerund of decir (to say), with the stem e turned to i: decir → diciendo. 'en' + gerund is an old construction meaning 'as soon as ...ing'; modern Spanish says 'al decir esto'."}
          - {w: "a quien", f: "'to whom': 'quien' is the relative for people, here with 'a' because the captive is the person spoken to."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
        note: "The captive, Ruy Pérez de Viedma, has just finished the long tale of his captivity in Algiers and his escape with the Moorish woman Zoraida, told over three chapters to the company at the inn."
  - sentences:
      - es: "— Por cierto, señor capitán, el modo con que habéis contado este estraño suceso ha sido tal, que iguala a la novedad y estrañeza del mesmo caso."
        literal: "— For certain, sir captain, the manner with which you-have told this strange event has been such, that it-equals to the novelty and strangeness of-the same case."
        ormsby: "“In truth, captain, the manner in which you have related this remarkable adventure has been such as befitted the novelty and strangeness of the matter."
        vocab:
          - {w: "por cierto", d: "indeed, truly, certainly"}
          - {w: "estraño", d: "= extraño, strange, remarkable (old spelling)"}
          - {w: "suceso", d: "event, adventure, what happened (false friend: not 'success')"}
          - {w: "igualar a", d: "to equal, match, be equal to"}
          - {w: "novedad", d: "novelty, newness, unusualness"}
          - {w: "estrañeza", d: "= extrañeza, strangeness (old spelling)"}
          - {w: "mesmo", d: "= mismo, same; here 'itself' (old form)"}
          - {w: "caso", d: "case, affair, the matter itself"}
        diagram:
          - s: "ha sido tal"
            r: "main verb: has been such"
            under:
              - {s: "Por cierto, señor capitán", r: "opening: truly, captain"}
              - s: "el modo"
                r: "subject: the manner"
                under:
                  - {s: "con que habéis contado este estraño suceso", r: "describes 'modo': in which you have told this strange story"}
              - {s: "que iguala a la novedad y estrañeza del mesmo caso", r: "result: that it matches the novelty and strangeness of the affair itself"}
        forms:
          - {w: "habéis contado", f: "habéis (haber (to have), present, you-all) + contado, the participle of contar (to tell): the present perfect, 'you have told'. haber (to have) in the present: he, has, ha, hemos, habéis, han. Don Fernando uses 'vos'/'vosotros' forms to address the captain politely."}
          - {w: "este", f: "est- + -e → este (this), masculine singular to match 'suceso'."}
          - {w: "estraño", f: "estrañ- + -o → estraño (strange), masculine to match 'suceso'; old spelling of 'extraño'."}
          - {w: "ha sido", f: "ha (haber (to have), present, it) + sido, the participle of ser (to be): 'has been'. haber (to have) in the present: he, has, ha, hemos, habéis, han."}
          - {w: "iguala", f: "igual- + -a → igualar (to equal), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "del mesmo", f: "del = de + el; mesmo = mismo (same), masculine to match 'caso'. After the noun's article it means 'the affair itself'."}
      - es: "Todo es peregrino y raro, y lleno de accidentes que maravillan y suspenden a quien los oye; y es de tal manera el gusto que hemos recebido en escuchalle, que, aunque nos hallara el día de mañana entretenidos en el mesmo cuento, holgáramos que de nuevo se comenzara."
        literal: "All is rare and unusual, and full of incidents that amaze and hold-spellbound to whoever them hears; and is of such manner the pleasure that we-have received in listening-to-him, that, although us might-find the day of tomorrow entertained in the same tale, we-would-be-glad that anew itself it-might-begin."
        ormsby: "The whole story is curious and uncommon, and abounds with incidents that fill the hearers with wonder and astonishment; and so great is the pleasure we have found in listening to it that we should be glad if it were to begin again, even though tomorrow were to find us still occupied with the same tale.”"
        vocab:
          - {w: "peregrino", d: "rare, extraordinary (false friend here: not 'pilgrim')"}
          - {w: "accidente", d: "incident, turn of events (false friend: not 'accident')"}
          - {w: "maravillar", d: "to astonish, fill with wonder"}
          - {w: "suspender", d: "to hold spellbound, astonish (not 'suspend')"}
          - {w: "de tal manera", d: "in such a way, so (great), setting up a result clause with 'que'"}
          - {w: "gusto", d: "pleasure, enjoyment"}
          - {w: "recebir", d: "= recibir, to receive (old spelling)"}
          - {w: "escuchalle", d: "= escucharle, to listen to him (-rl- became -ll- in old Spanish)"}
          - {w: "el día de mañana", d: "tomorrow's day, i.e. the morning (dawn) of tomorrow"}
          - {w: "entretenido", d: "occupied, kept busy, absorbed"}
          - {w: "holgar", d: "to be glad, take pleasure (literary); 'holgáramos' = we would be glad"}
          - {w: "de nuevo", d: "again, anew"}
        diagram:
          - s: "Todo es peregrino y raro"
            r: "main verb 1: it is all rare and unusual"
            under:
              - s: "y lleno de accidentes"
                r: "also what it is: and full of incidents"
                under:
                  - {s: "que maravillan y suspenden a quien los oye", r: "describes 'accidentes': that astonish and hold spellbound whoever hears them"}
          - s: "es de tal manera el gusto"
            r: "main verb 2 (after 'y'): the pleasure is so great"
            under:
              - {s: "que hemos recebido en escuchalle", r: "describes 'gusto': that we have had in listening to him"}
              - s: "holgáramos"
                r: "result (after 'que'): we would be glad"
                under:
                  - {s: "aunque nos hallara el día de mañana entretenidos en el mesmo cuento", r: "even if: even if dawn found us still busy with the same tale"}
                  - {s: "que de nuevo se comenzara", r: "what we would be glad of: that it should begin again"}
        forms:
          - {w: "maravillan, suspenden", f: "maravill- + -an → maravillar (to astonish), present, they; the present of -ar verbs: -o, -as, -a, -amos, -áis, -an. suspend- + -en → suspender (to hold spellbound), present, they; the present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "los oye", f: "oy- + -e → oír (to hear), present, he (whoever). Irregular: oigo, oyes, oye, oímos, oís, oyen. 'los' = them, the incidents."}
          - {w: "lleno", f: "llen- + -o → lleno (full), masculine singular to match 'todo'."}
          - {w: "hemos recebido", f: "hemos (haber (to have), present, we) + recebido, the participle of recebir (to receive), old spelling of recibido: 'we have received'. haber (to have) in the present: he, has, ha, hemos, habéis, han."}
          - {w: "escuchalle", f: "escuchar (to listen to) + le (him), with the -r- of the infinitive turned into -l- before the pronoun: escuchar-le → escuchalle. Modern 'escucharle'. Infinitive after 'en'."}
          - {w: "hallara", f: "hall- + -ara → hallar (to find), imperfect subjunctive (-ra form), it (tomorrow's day): 'even if it found'. The -ra imperfect subjunctive of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran. 'aunque' + this tense = even if (unlikely)."}
          - {w: "entretenidos", f: "participle of entretener (to keep busy), masculine plural to match 'nos' (us)."}
          - {w: "holgáramos", f: "holg- + -áramos → holgar (to be glad), imperfect subjunctive (-ra form), we, used as a conditional: 'we would be glad'. The -ra imperfect subjunctive of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran. Cervantes often uses the -ra form where modern Spanish says 'holgaríamos'."}
          - {w: "se comenzara", f: "comenz- + -ara → comenzar (to begin), imperfect subjunctive (-ra form), it (the tale), with 'se' making it 'begin itself, be begun'. Same -ara subjunctive, after 'holgáramos que'."}
  - sentences:
      - es: "Y, en diciendo esto, don Fernando y todos los demás se le ofrecieron, con todo lo a ellos posible para servirle, con palabras y razones tan amorosas y tan verdaderas que el capitán se tuvo por bien satisfecho de sus voluntades."
        literal: "And, on saying this, Don Fernando and all the rest themselves to-him offered, with all that to them possible to serve-him, with words and speeches so loving and so true that the captain himself held for well satisfied of their goodwills."
        ormsby: "And while he said this Cardenio and the rest of them offered to be of service to him in any way that lay in their power, and in words and language so kindly and sincere that the captain was much gratified by their goodwill."
        vocab:
          - {w: "los demás", d: "the others, the rest"}
          - {w: "ofrecerse a alguien", d: "to offer oneself, put oneself at someone's service"}
          - {w: "todo lo a ellos posible", d: "everything in their power, all that was possible to them"}
          - {w: "razones", d: "words, speeches (not 'reasons')"}
          - {w: "amoroso", d: "affectionate, kind (not only 'amorous')"}
          - {w: "tenerse por", d: "to consider oneself; 'se tuvo por satisfecho' = he felt satisfied"}
          - {w: "voluntades", d: "goodwill, kind intentions (plural of 'voluntad')"}
        diagram:
          - s: "se le ofrecieron"
            r: "main verb: offered themselves to him"
            under:
              - {s: "en diciendo esto", r: "when: as he said this"}
              - {s: "don Fernando y todos los demás", r: "subject: Don Fernando and all the rest"}
              - {s: "con todo lo a ellos posible para servirle", r: "with what: with everything in their power to serve him"}
              - s: "con palabras y razones tan amorosas y tan verdaderas"
                r: "how: with words so kind and so sincere"
                under:
                  - {s: "que el capitán se tuvo por bien satisfecho de sus voluntades", r: "result: that the captain felt well satisfied with their goodwill"}
        forms:
          - {w: "en diciendo", f: "gerund of decir (to say), stem e turned to i: diciendo. 'en' + gerund = 'as soon as / while ...ing'; modern 'al decir'."}
          - {w: "se le ofrecieron", f: "ofrec- + -ieron → ofrecer (to offer), preterite, they, with 'se' (themselves) and 'le' (to him). The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "servirle", f: "servir (to serve) + le (him), pronoun hung on the infinitive after 'para'."}
          - {w: "amorosas, verdaderas", f: "amoros- + -as, verdader- + -as: feminine plural to match 'palabras y razones'."}
          - {w: "se tuvo", f: "tuv- + -o → tenerse (to consider oneself), preterite, he. Irregular: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron."}
          - {w: "satisfecho", f: "irregular participle of satisfacer (to satisfy), masculine to match 'el capitán'."}
          - {w: "sus voluntades", f: "sus = plural to match 'voluntades', not the owners; 'their goodwill'."}
        note: "Ormsby puts Cardenio where the Spanish has Don Fernando. Don Fernando is the young nobleman whose tangled love affair with Dorotea and Luscinda was resolved at this inn a few chapters ago."
      - es: "Especialmente, le ofreció don Fernando que si quería volverse con él, que él haría que el marqués, su hermano, fuese padrino del bautismo de Zoraida, y que él, por su parte, le acomodaría de manera que pudiese entrar en su tierra con el autoridad y cómodo que a su persona se debía."
        literal: "Especially, to-him offered Don Fernando that if he-wanted to-return-himself with him, that he would-make that the marquis, his brother, should-be godfather of-the baptism of Zoraida, and that he, for his part, him would-equip in-such manner that he-might enter into his land with the authority and comfort that to his person itself was-owed."
        ormsby: "In particular Don Fernando offered, if he would go back with him, to get his brother the marquis to become godfather at the baptism of Zoraida, and on his own part to provide him with the means of making his appearance in his own country with the credit and comfort he was entitled to."
        vocab:
          - {w: "volverse", d: "to go back, return"}
          - {w: "marqués", d: "marquis; Don Fernando is the younger son of a duke, so his elder brother bears a title"}
          - {w: "padrino", d: "godfather (at baptism) or sponsor"}
          - {w: "bautismo", d: "baptism: Zoraida, a Moor, wants to become a Christian"}
          - {w: "por su parte", d: "for his part, on his own account"}
          - {w: "acomodar", d: "to provide for, fit out, set someone up (with money and clothes)"}
          - {w: "tierra", d: "here one's home region, native country"}
          - {w: "el autoridad", d: "= la autoridad, dignity, standing; old usage put 'el' before feminine nouns beginning with a vowel"}
          - {w: "cómodo", d: "comfort, convenience (used as a noun)"}
          - {w: "deberse a", d: "to be owed to, be due to"}
        diagram:
          - s: "le ofreció don Fernando"
            r: "main verb: Don Fernando offered him"
            under:
              - {s: "Especialmente", r: "linking: in particular"}
              - s: "que si quería volverse con él"
                r: "what he offered, condition: (that) if he wanted to go back with him"
                under:
                  - s: "que él haría"
                    r: "offer 1: that he would see to it"
                    under:
                      - {s: "que el marqués, su hermano, fuese padrino del bautismo de Zoraida", r: "what he would arrange: that his brother the marquis be godfather at Zoraida's baptism"}
                  - s: "y que él, por su parte, le acomodaría"
                    r: "offer 2: and that he himself would fit him out"
                    under:
                      - s: "de manera que pudiese entrar en su tierra"
                        r: "result: so that he could enter his homeland"
                        under:
                          - s: "con el autoridad y cómodo"
                            r: "how: with the dignity and comfort"
                            under:
                              - {s: "que a su persona se debía", r: "describes 'autoridad y cómodo': that were due to someone like him"}
        forms:
          - {w: "ofreció", f: "ofrec- + -ió → ofrecer (to offer), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "quería", f: "quer- + -ía → querer (to want), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "volverse", f: "volver (to return) + se, pronoun hung on the infinitive after 'quería'."}
          - {w: "que si ..., que él", f: "the 'que' is repeated after the 'si' clause, a habit of spoken Spanish of the time to pick up the reported speech again; modern Spanish drops the second 'que'."}
          - {w: "haría", f: "har- + -ía → hacer (to make), conditional, he: 'he would see to it'. Irregular stem har-: haría, harías, haría, haríamos, haríais, harían."}
          - {w: "fuese", f: "fu- + -ese → ser (to be), imperfect subjunctive (-se form), he (the marquis), after 'haría que' (would make it so that). ser (to be) in this tense: fuese, fueses, fuese, fuésemos, fueseis, fuesen."}
          - {w: "acomodaría", f: "acomodar- + -ía → acomodar (to fit out), conditional, he. The conditional adds -ía to the whole infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "pudiese", f: "pud- + -iese → poder (to be able), imperfect subjunctive (-se form), he, after 'de manera que' (so that). Irregular: pudiese, pudieses, pudiese, pudiésemos, pudieseis, pudiesen."}
          - {w: "se debía", f: "deb- + -ía → deber (to owe), imperfect, it, with 'se' making it passive: 'was owed'. The imperfect of -er verbs: -ía, -ías, -ía, -íamos, -íais, -ían. It agrees with the nearer of the two nouns."}
        note: "Don Fernando is the younger son of a grandee of Spain. A titled godfather at Zoraida's baptism would give the convert and her future husband standing in Christian society."
      - es: "Todo lo agradeció cortesísimamente el cautivo, pero no quiso acetar ninguno de sus liberales ofrecimientos."
        literal: "All it thanked-for most-courteously the captive, but not he-wanted to-accept none of their generous offers."
        ormsby: "For all this the captive returned thanks very courteously, although he would not accept any of their generous offers."
        vocab:
          - {w: "agradecer", d: "to be grateful for, thank someone for"}
          - {w: "acetar", d: "= aceptar, to accept (old spelling)"}
          - {w: "liberal", d: "generous, open-handed (not political)"}
          - {w: "ofrecimiento", d: "offer"}
        diagram:
          - s: "Todo lo agradeció"
            r: "main verb 1: he thanked them for everything"
            under:
              - {s: "cortesísimamente", r: "how: most courteously"}
              - {s: "el cautivo", r: "subject: the captive"}
          - s: "pero no quiso acetar"
            r: "main verb 2: but he would not accept"
            under:
              - {s: "ninguno de sus liberales ofrecimientos", r: "object: any of their generous offers"}
        forms:
          - {w: "Todo lo agradeció", f: "agradec- + -ió → agradecer (to thank for), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron. 'Todo' is put first for emphasis and repeated by 'lo' (it)."}
          - {w: "cortesísimamente", f: "cortés (courteous) + -ísima (very) + -mente (-ly): 'most courteously'. -mente is added to the feminine form of the adjective."}
          - {w: "quiso", f: "quis- + -o → querer (to want), preterite, he: with 'no', 'he refused'. Irregular: quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "acetar", f: "old spelling of aceptar (to accept), infinitive after 'quiso'."}
          - {w: "no ... ninguno", f: "Spanish keeps both negatives: 'no quiso acetar ninguno' = he did not want to accept none, i.e. any."}
          - {w: "liberales ofrecimientos", f: "liberal + -es, plural to match 'ofrecimientos'; the adjective goes before the noun for emphasis."}
  - sentences:
      - es: "En esto, llegaba ya la noche, y, al cerrar della, llegó a la venta un coche, con algunos hombres de a caballo."
        literal: "In this, was-arriving already the night, and, at-the closing of-it, arrived at the inn a coach, with some men of on horse."
        ormsby: "By this time night closed in, and as it did, there came up to the inn a coach attended by some men on horseback,"
        vocab:
          - {w: "en esto", d: "at this point, meanwhile"}
          - {w: "al cerrar della", d: "as it (the night) closed in; 'della' = de ella"}
          - {w: "venta", d: "roadside inn (the one Don Quijote takes for a castle)"}
          - {w: "coche", d: "coach, carriage: a sign of a wealthy or important traveller"}
          - {w: "de a caballo", d: "on horseback, mounted; 'hombres de a caballo' = horsemen"}
        diagram:
          - s: "llegaba ya la noche"
            r: "main verb 1: night was already coming on"
            under:
              - {s: "En esto", r: "when: at this point"}
          - s: "llegó a la venta un coche"
            r: "main verb 2 (after 'y'): a coach arrived at the inn"
            under:
              - {s: "al cerrar della", r: "when: as it closed in"}
              - {s: "con algunos hombres de a caballo", r: "with whom: with some men on horseback"}
        forms:
          - {w: "llegaba", f: "lleg- + -aba → llegar (to arrive), imperfect, it (the night): 'was coming on'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "al cerrar", f: "al = a + el, + the infinitive cerrar (to close): 'on closing, as it closed'. 'al' + infinitive marks the moment something happens."}
          - {w: "della", f: "= de + ella, 'of it' (the night); old contraction, modern 'de ella'."}
          - {w: "llegó", f: "lleg- + -ó → llegar (to arrive), preterite, it (the coach). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. Verb before subject, as often in Cervantes."}
          - {w: "algunos", f: "algun- + -os → alguno (some), masculine plural to match 'hombres'."}
      - es: "Pidieron posada; a quien la ventera respondió que no había en toda la venta un palmo desocupado."
        literal: "They-asked-for lodging; to whom the innkeeper's-wife answered that not there-was in all the inn a handspan unoccupied."
        ormsby: "who demanded accommodation; to which the landlady replied that there was not a hand’s breadth of the whole inn unoccupied."
        vocab:
          - {w: "posada", d: "lodging, a place to stay the night"}
          - {w: "ventera", d: "the innkeeper's wife, the landlady"}
          - {w: "palmo", d: "handspan, about 21 cm; 'ni un palmo' = not an inch"}
          - {w: "desocupado", d: "unoccupied, free"}
        diagram:
          - s: "Pidieron posada"
            r: "main verb 1: they asked for lodging"
          - s: "a quien la ventera respondió"
            r: "main verb 2: to whom the landlady answered"
            under:
              - {s: "que no había en toda la venta un palmo desocupado", r: "what she answered: that there was not a free inch in the whole inn"}
        forms:
          - {w: "Pidieron", f: "pid- + -ieron → pedir (to ask for), preterite, they. The e of the stem becomes i in the he and they forms: pedí, pediste, pidió, pedimos, pedisteis, pidieron."}
          - {w: "a quien", f: "'to whom', used loosely here for 'to them' (the horsemen); Cervantes often begins a new clause with a relative that links back to the last sentence."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, she. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "no había", f: "hab- + -ía → haber (there to be), imperfect, 'there was'; 'hay' in the past is 'había'. The imperfect of -er verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "desocupado", f: "des- (un-) + ocupado, the participle of ocupar (to occupy), masculine to match 'palmo'."}
  - sentences:
      - es: "— Pues, aunque eso sea —dijo uno de los de a caballo que habían entrado—, no ha de faltar para el señor oidor que aquí viene."
        literal: "— Well, although that may-be —said one of those of on horse who had entered—, not it-has to be-lacking for the lord judge who here comes."
        ormsby: "“Still, for all that,” said one of those who had entered on horseback, “room must be found for his lordship the Judge here.”"
        vocab:
          - {w: "aunque eso sea", d: "even if that is so, for all that"}
          - {w: "los de a caballo", d: "the horsemen, the mounted men"}
          - {w: "haber de", d: "must, to have to; 'no ha de faltar' = there must not be lacking, there will have to be room"}
          - {w: "faltar", d: "to be lacking, be missing"}
          - {w: "oidor", d: "judge of a royal appeal court (an Audiencia or Chancillería); literally 'hearer', because he hears cases"}
        diagram:
          - s: "no ha de faltar"
            r: "main verb: there must not be lacking (room)"
