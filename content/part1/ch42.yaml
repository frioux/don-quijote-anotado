      - es: "Y sé yo decir que el que él escogió de venir a la guerra le había sucedido tan bien que en pocos años, por su valor y esfuerzo, sin otro brazo que el de su mucha virtud, subió a ser capitán de infantería, y a verse en camino y predicamento de ser presto maestre de campo."
        literal: "And know I to-say that the [counsel] that he chose of coming to the war to-him had turned-out so well that in few years, by his valor and effort, without other arm than that of his much virtue, he-rose to be captain of infantry, and to see-himself on road and standing of being soon master of camp."
        ormsby: "But I can say this much, that the choice he made of going to the wars was attended with such success, that by his gallant conduct and courage, and without any help save his own merit, he rose in a few years to be captain of infantry, and to see himself on the high road and in position to be given the command of a corps before long;"
        vocab:
