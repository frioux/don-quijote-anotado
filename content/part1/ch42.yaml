          - {w: "contraria", f: "contrari- + -a → contrario (against), feminine to match 'fortuna'."}
          - {w: "pudiera", f: "pud- + -iera → poder (to be able), imperfect subjunctive (-ra form), he, used as a conditional: 'he might have'. Built on the preterite pudieron: pudiera, pudieras, pudiera, pudiéramos, pudierais, pudieran."}
          - {w: "la ... buena", f: "'la' = la fortuna; 'buena' feminine to match it: 'to have it good', i.e. have good fortune."}
          - {w: "perdió", f: "perd- + -ió → perder (to lose), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
