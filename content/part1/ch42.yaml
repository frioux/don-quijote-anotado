          - {w: "grande", f: "the full form of 'gran'; Cervantes often keeps 'grande' before a noun where modern Spanish clips it."}
        note: "The Spanish treasure fleets ('flotas') sailed in convoy from Seville to the Americas; a passenger who missed the sailing might wait months for the next one, so a judge bound for Mexico could not delay."
  - sentences:
      - es: "En resolución, todos quedaron contentos y alegres del buen suceso del cautivo; y, como ya la noche iba casi en las dos partes de su jornada, acordaron de recogerse y reposar lo que de ella les quedaba."
        literal: "In resolution, all remained content and cheerful at-the good outcome of-the captive; and, as already the night was-going almost in the two parts of its journey, they-agreed to withdraw-themselves and to-rest that which of it to-them was-remaining."
