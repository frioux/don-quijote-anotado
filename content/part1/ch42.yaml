  - sentences:
      - es: "— Del mesmo nombre de vuestra merced, señor oidor, tuve yo una camarada en Costantinopla, donde estuve cautivo algunos años; la cual camarada era uno de los valientes soldados y capitanes que había en toda la infantería española, pero tanto cuanto tenía de esforzado y valeroso lo tenía de desdichado."
        literal: "— Of-the same name of your grace, sir judge, had I a comrade in Constantinople, where I-was captive some years; the which comrade was one of the brave soldiers and captains that there-were in all the infantry Spanish, but as-much as he-had of courageous and valiant it he-had of unlucky."
        ormsby: "“I had a comrade of your worship’s name, Señor Judge, in Constantinople, where I was a captive for several years, and that same comrade was one of the stoutest soldiers and captains in the whole Spanish infantry; but he had as large a share of misfortune as he had of gallantry and courage.”"
        vocab:
          - {w: "mesmo", d: "= mismo, same (old form)"}
          - {w: "vuestra merced", d: "your grace, your worship: the polite 'you', ancestor of 'usted'"}
          - {w: "camarada", d: "comrade, companion (here feminine in form, 'una camarada', though meaning a man)"}
          - {w: "Costantinopla", d: "= Constantinopla, Constantinople (Istanbul), capital of the Ottoman Turks"}
          - {w: "esforzado", d: "brave, valiant"}
          - {w: "desdichado", d: "unlucky, unfortunate"}
          - {w: "tanto cuanto ... lo ...", d: "as much as he had of X, so much he had of Y: he was as unlucky as he was brave"}
        diagram:
          - s: "tuve yo una camarada"
            r: "main verb 1: I had a comrade"
            under:
              - {s: "Del mesmo nombre de vuestra merced", r: "describes 'camarada': with the same name as your worship"}
              - {s: "señor oidor", r: "addressed to: sir judge"}
              - s: "en Costantinopla"
                r: "where: in Constantinople"
                under:
                  - {s: "donde estuve cautivo algunos años", r: "describes 'Costantinopla': where I was a captive some years"}
          - s: "la cual camarada era uno de los valientes soldados y capitanes"
            r: "main verb 2: this comrade was one of the brave soldiers and captains"
            under:
              - {s: "que había en toda la infantería española", r: "describes 'soldados y capitanes': that there were in the whole Spanish infantry"}
          - s: "pero ... lo tenía de desdichado"
            r: "main verb 3: but he had just as much of bad luck"
            under:
              - {s: "tanto cuanto tenía de esforzado y valeroso", r: "how much: as much as he had of courage and valour"}
        forms:
          - {w: "Del", f: "de + el, 'of the'."}
          - {w: "mesmo", f: "= mismo (same), masculine to match 'nombre'."}
          - {w: "tuve", f: "tuv- + -e → tener (to have), preterite, I. Irregular: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron."}
          - {w: "estuve", f: "estuv- + -e → estar (to be), preterite, I. Irregular: estuve, estuviste, estuvo, estuvimos, estuvisteis, estuvieron."}
          - {w: "la cual camarada", f: "'which comrade', feminine 'la cual' to match the feminine noun 'camarada'; the relative repeats the noun, an old legal-sounding construction."}
          - {w: "era", f: "ser (to be), imperfect, it (the comrade). Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "había", f: "hab- + -ía → haber (to have), imperfect, used impersonally: 'there were'. había, habías, había, habíamos, habíais, habían."}
          - {w: "española", f: "español (Spanish) + -a, feminine to match 'infantería'."}
          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, he, used twice. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
        note: "The priest was never a captive in Constantinople: this is the 'roundabout way' he promised, a harmless fiction to test the judge's feelings before the captive shows himself."
