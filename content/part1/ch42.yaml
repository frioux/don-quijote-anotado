                    under:
                      - s: "como la traen las letras de vuestra merced en esta fermosa doncella"
                        r: "how: as your worship's letters bring it, in this beautiful maiden"
                        under:
                          - s: "a quien deben"
                            r: "describes 'doncella': to whom ... ought"
                            under:
                              - {s: "no sólo abrirse y manifestarse los castillos", r: "what ought to happen, 1: not only castles open up and lay themselves open"}
                              - {s: "sino apartarse los riscos", r: "what ought to happen, 2: but crags step aside"}
                              - {s: "y devidirse y abajarse las montañas", r: "what ought to happen, 3: and mountains split and bow down"}
                              - {s: "para dalle acogida", r: "why: to give her welcome"}
        forms:
          - {w: "Seguramente", f: "segur- + -a + -mente → seguro (safe) + -mente (-ly): 'safely, without risk'."}
          - {w: "puede", f: "pued- + -e → poder (to be able), present, you (vuestra merced takes the he/she form). The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "espaciarse", f: "espaciar (to spread out) + se (yourself), infinitive after 'puede' like 'entrar'."}
