  - sentences:
      - es: "— ¡Oh, señor, si supiésedes las nuevas que me habéis contado, y cómo me tocan tan en parte que me es forzoso dar muestras dello con estas lágrimas que, contra toda mi discreción y recato, me salen por los ojos!"
        literal: "— Oh, sir, if you-knew the news that to-me you-have told, and how me they-touch so in part that to-me it-is forced to-give signs of-it with these tears which, against all my discretion and reserve, to-me come-out through the eyes!"
        ormsby: "“Oh, señor, if you only knew what news you have given me and how it comes home to me, making me show how I feel it with these tears that spring from my eyes in spite of all my worldly wisdom and self-restraint!"
        vocab:
          - {w: "nuevas", d: "news (always plural in this sense)"}
          - {w: "tocar en parte", d: "to concern closely, touch personally; 'tan en parte' = so nearly"}
          - {w: "forzoso", d: "unavoidable, necessary: 'me es forzoso' = I cannot help"}
          - {w: "dar muestras de", d: "to show signs of"}
          - {w: "dello", d: "= de ello, of it (old contraction)"}
          - {w: "discreción", d: "good sense, judgment, self-command (not only 'discretion')"}
          - {w: "recato", d: "reserve, self-restraint, decorum"}
        diagram:
          - s: "si supiésedes las nuevas"
            r: "exclamation, an 'if' with no 'then': if you knew the news"
            under:
              - {s: "Oh, señor", r: "address: oh, sir"}
              - {s: "que me habéis contado", r: "describes 'nuevas': that you have told me"}
              - s: "y cómo me tocan tan en parte"
                r: "if you knew, 2: and how closely they touch me"
                under:
                  - s: "que me es forzoso dar muestras dello"
                    r: "result: that I cannot help showing it"
                    under:
                      - s: "con estas lágrimas"
                        r: "with what: with these tears"
                        under:
                          - {s: "que, contra toda mi discreción y recato, me salen por los ojos", r: "describes 'lágrimas': which come from my eyes in spite of all my self-command"}
        forms:
          - {w: "supiésedes", f: "sup- + -iésedes → saber (to know), imperfect subjunctive (-se form), you (vosotros, used to one person as a courtesy): 'if you knew'. Old ending -ésedes for modern -eseis: supiese, supieses, supiese, supiésemos, supiésedes (supieseis), supiesen."}
          - {w: "habéis contado", f: "hab- + -éis → haber (to have), present, you (vosotros): he, has, ha, hemos, habéis, han; + contado, participle of contar (to tell): 'you have told'."}
          - {w: "tocan", f: "toc- + -an → tocar (to touch), present, they (the news). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son. 'me es forzoso' = it is unavoidable for me."}
          - {w: "dello", f: "de + ello, 'of it', written as one word in the old spelling."}
          - {w: "estas", f: "est- + -as → este (this), feminine plural to match 'lágrimas'."}
          - {w: "salen", f: "sal- + -en → salir (to come out), present, they (the tears). salgo, sales, sale, salimos, salís, salen."}
          - {w: "toda", f: "tod- + -a → todo (all), feminine to match 'discreción'."}
      - es: "Ese capitán tan valeroso que decís es mi mayor hermano, el cual, como más fuerte y de más altos pensamientos que yo ni otro hermano menor mío, escogió el honroso y digno ejercicio de la guerra, que fue uno de los tres caminos que nuestro padre nos propuso, según os dijo vuestra camarada en la conseja que, a vuestro parecer, le oístes."
        literal: "That captain so valiant that you-speak-of is my elder brother, the which, as more strong and of more high thoughts than I nor [the] other brother younger of-mine, chose the honorable and worthy profession of the war, which was one of the three roads that our father to-us proposed, according-as to-you said your comrade in the fable that, to your seeming, from-him you-heard."
        ormsby: "That brave captain that you speak of is my eldest brother, who, being of a bolder and loftier mind than my other brother or myself, chose the honourable and worthy calling of arms, which was one of the three careers our father proposed to us, as your comrade mentioned in that fable you thought he was telling you."
        vocab:
          - {w: "valeroso", d: "brave, valiant"}
          - {w: "mayor hermano", d: "elder (here eldest) brother; 'menor' = younger"}
          - {w: "como", d: "here 'being, as one who is', giving a reason"}
          - {w: "altos pensamientos", d: "lofty ambitions, high-mindedness"}
          - {w: "ejercicio", d: "profession, calling (not 'exercise')"}
          - {w: "proponer", d: "to put before, offer as a choice"}
          - {w: "según", d: "as, according to what"}
          - {w: "conseja", d: "old wives' tale, fable"}
          - {w: "a vuestro parecer", d: "as you thought, in your opinion"}
        diagram:
          - s: "Ese capitán tan valeroso"
            r: "subject: that very brave captain"
            under:
              - {s: "que decís", r: "describes 'capitán': whom you speak of"}
          - s: "es mi mayor hermano"
            r: "main verb 1: is my eldest brother"
          - s: "el cual"
            r: "describes 'hermano': who"
            under:
              - {s: "como más fuerte y de más altos pensamientos que yo ni otro hermano menor mío", r: "why: being stronger and more high-minded than I or my other, younger brother"}
              - s: "escogió el honroso y digno ejercicio de la guerra"
                r: "verb of 'el cual': chose the honorable and worthy profession of war"
                under:
                  - s: "que fue uno de los tres caminos"
                    r: "describes 'ejercicio': which was one of the three paths"
                    under:
                      - {s: "que nuestro padre nos propuso", r: "describes 'caminos': that our father offered us"}
                  - s: "según os dijo vuestra camarada"
                    r: "as: as your comrade told you"
                    under:
                      - {s: "en la conseja que, a vuestro parecer, le oístes", r: "where: in the tale which, as you thought, you heard from him"}
        forms:
          - {w: "Ese", f: "es- + -e → ese (that), masculine singular to match 'capitán': 'that' near the listener, the one you mentioned."}
          - {w: "decís", f: "dec- + -ís → decir (to say), present, you (vosotros, said to one person as a courtesy). decir in the present: digo, dices, dice, decimos, decís, dicen."}
          - {w: "es", f: "ser (to be), present, he: soy, eres, es, somos, sois, son."}
          - {w: "altos", f: "alt- + -os → alto (high), masculine plural to match 'pensamientos'."}
          - {w: "menor mío", f: "'a younger brother of mine': the possessive 'mío' after the noun, used when 'otro' already stands before it."}
          - {w: "escogió", f: "escog- + -ió → escoger (to choose), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "honroso, digno", f: "honros- + -o → honroso (honorable) and dign- + -o → digno (worthy), masculine to match 'ejercicio'."}
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, it. fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "propuso", f: "propus- + -o → proponer (to propose), preterite, he. Irregular like poner: propuse, propusiste, propuso, propusimos, propusisteis, propusieron."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he (your comrade). Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "vuestra camarada", f: "'camarada' is feminine in form, so Cervantes makes the possessive feminine ('vuestra', 'la cual camarada') even for a man; modern Spanish says 'vuestro camarada'."}
          - {w: "oístes", f: "o- + -ístes → oír (to hear), preterite, you (vosotros). Old ending -istes for modern -isteis: oí, oíste, oyó, oímos, oísteis (oístes), oyeron. 'le' = from him."}
        note: "The three paths come from the father's proverb in chapter 39, 'Iglesia, o mar, o casa real', which he explained as letters, trade and the king's service in war. The eldest took arms, the second went to the Indies, and the youngest chose letters; here the judge seems to call the Peru brother his younger one, a small slip (Ormsby says 'my other brother')."
