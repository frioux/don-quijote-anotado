  - sentences:
      - es: "— Cesen, señor oidor, vuestras lágrimas, y cólmese vuestro deseo de todo el bien que acertare a desearse, pues tenéis delante a vuestro buen hermano y a vuestra buena cuñada."
        literal: "— Let-cease, sir judge, your tears, and let-fill-itself your desire with all the good that may-happen to be-wished, since you-have before [you] your good brother and your good sister-in-law."
        ormsby: "“Let your tears cease to flow, Señor Judge, and the wish of your heart be gratified as fully as you could desire, for you have before you your worthy brother and your good sister-in-law."
        vocab:
          - {w: "cesar", d: "to stop, cease"}
          - {w: "colmarse", d: "to be filled to the brim, be fulfilled ('colmo' = the heap above the brim)"}
          - {w: "acertar a", d: "to manage to, happen to; 'que acertare a desearse' = that can possibly be wished"}
          - {w: "cuñada", d: "sister-in-law"}
          - {w: "tener delante", d: "to have before one, in front of one"}
        diagram:
          - s: "Cesen"
            r: "main verb 1: let ... stop"
            under:
              - {s: "señor oidor", r: "addressed: sir judge"}
              - {s: "vuestras lágrimas", r: "subject: your tears"}
          - s: "y cólmese vuestro deseo"
            r: "main verb 2: and let your desire be filled"
            under:
              - s: "de todo el bien"
                r: "with what: with all the good"
                under:
                  - {s: "que acertare a desearse", r: "describes 'bien': that can possibly be wished"}
              - s: "pues tenéis delante"
                r: "why: since you have before you"
                under:
                  - {s: "a vuestro buen hermano y a vuestra buena cuñada", r: "object: your good brother and your good sister-in-law"}
        forms:
          - {w: "Cesen", f: "ces- + -en → cesar (to cease), present subjunctive, they (the tears): 'let them cease'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. A subjunctive opening the sentence gives a wish or command."}
          - {w: "vuestras, vuestro, vuestra", f: "vuestr- + -as / -o / -a → vuestro (your, of 'vos'), agreeing with the thing owned: 'lágrimas', 'deseo', 'cuñada'."}
          - {w: "cólmese", f: "colm- + -e + se → colmarse (to be filled), present subjunctive, it (your desire), with 'se' stuck on the end and an accent added to keep the stress: 'let it be filled'. Same -e subjunctive: colme, colmes, colme, colmemos, colméis, colmen. When the subjunctive opens the clause as a wish, the pronoun hangs on the end (modern 'que se colme')."}
          - {w: "acertare", f: "acert- + -are → acertar (to manage, happen), future subjunctive, it: 'that may happen to'. The future subjunctive of -ar verbs: -are, -ares, -are, -áremos, -areis, -aren. Cervantes uses it for an open future after 'que'; modern Spanish uses the present subjunctive 'acierte'."}
          - {w: "desearse", f: "desear (to wish) + se, infinitive after 'acertare a'; 'se' makes it passive: 'to be wished'."}
          - {w: "tenéis", f: "ten- + -éis → tener (to have), present, you (vos, said to one person politely). Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "buen, buena", f: "bueno (good) clipped to 'buen' before a masculine singular noun ('hermano'); feminine 'buena' to match 'cuñada'."}
        note: "The priest addresses the judge as 'vos' with the plural verb forms (tenéis), a respectful address between equals in Cervantes' day; it sits halfway between the very formal 'vuestra merced' and familiar 'tú'."
