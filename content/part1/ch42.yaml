              - {s: "ni si habían llegado a España", r: "what he had not learned, 2: nor whether they had reached Spain"}
              - {s: "o llevádolos los franceses a Francia", r: "what he had not learned, 3: or the Frenchmen had carried them off to France"}
        forms:
          - {w: "los cuales", f: "'whom', masculine plural to cover the comrade and the Moorish woman together (a mixed pair takes the masculine)."}
          - {w: "había sabido", f: "había (haber (to have), imperfect, he: había, habías, había, habíamos, habíais, habían) + sabido, participle of saber (to know): 'had learned'."}
          - {w: "habían parado", f: "habían (haber (to have), imperfect, they: había, habías, había, habíamos, habíais, habían) + parado, participle of parar (to end up): 'had ended up'."}
          - {w: "habían llegado", f: "habían (haber (to have), imperfect, they) + llegado, participle of llegar (to arrive): 'had arrived'. haber (to have) in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "llevádolos", f: "llevado (participle of llevar (to carry off)) + los (them), with the pronoun hung on the participle and an accent added; the 'habían' before 'llegado' does duty for it too: '(had) carried them off'. Modern Spanish never attaches a pronoun to a participle: 'o los habían llevado'."}
        note: "There is a slip here, which Ormsby points out: if the priest never learned whether they reached Spain, he could not know that the French robbed them. The judge, too moved to notice, does not ask."
  - sentences:
      - es: "Todo lo que el cura decía estaba escuchando, algo de allí desviado, el capitán, y notaba todos los movimientos que su hermano hacía; el cual, viendo que ya el cura había llegado al fin de su cuento, dando un grande suspiro y llenándosele los ojos de agua, dijo:"
        literal: "All that which the priest was-saying was listening, somewhat from there turned-aside, the captain, and he-noted all the movements that his brother was-making; the which, seeing that already the priest had arrived at-the end of his tale, giving a great sigh and filling-themselves-to-him the eyes with water, said:"
        ormsby: "The captain, standing a little to one side, was listening to all the curate said, and watching every movement of his brother, who, as soon as he perceived the curate had made an end of his story, gave a deep sigh and said with his eyes full of tears,"
        vocab:
          - {w: "algo", d: "here 'somewhat, a little' (adverb), not 'something'"}
          - {w: "desviado", d: "set apart, off to one side"}
          - {w: "notar", d: "to observe, watch closely"}
          - {w: "movimiento", d: "movement; here every gesture and change of expression"}
          - {w: "suspiro", d: "sigh"}
          - {w: "llenársele los ojos de agua", d: "to have one's eyes fill with tears ('agua', water, for tears)"}
        diagram:
          - s: "estaba escuchando"
            r: "main verb 1: was listening"
            under:
              - {s: "Todo lo que el cura decía", r: "object, put first: everything the priest was saying"}
              - {s: "algo de allí desviado", r: "where: a little way off"}
              - {s: "el capitán", r: "subject: the captain"}
          - s: "y notaba todos los movimientos"
            r: "main verb 2: and was watching every movement"
            under:
              - {s: "que su hermano hacía", r: "describes 'movimientos': that his brother made"}
          - s: "el cual"
            r: "the brother (the judge), subject of 'dijo'"
            under:
              - {s: "viendo que ya el cura había llegado al fin de su cuento", r: "when: seeing that the priest had come to the end of his tale"}
              - {s: "dando un grande suspiro", r: "how, 1: heaving a deep sigh"}
              - {s: "llenándosele los ojos de agua", r: "how, 2: his eyes filling with tears"}
              - {s: "dijo:", r: "main verb 3: said"}
        forms:
          - {w: "decía", f: "dec- + -ía → decir (to say), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "estaba escuchando", f: "est- + -aba → estar (to be), imperfect, he: estaba, estabas, estaba, estábamos, estabais, estaban; + escuchando, gerund of escuchar (to listen): 'was listening'."}
          - {w: "desviado", f: "desvi- + -ado → desviar (to turn aside), participle used as an adjective, masculine to match 'el capitán'."}
          - {w: "notaba", f: "not- + -aba → notar (to note), imperfect, he. Same -aba imperfect."}
          - {w: "hacía", f: "hac- + -ía → hacer (to make), imperfect, he. Same -ía imperfect as 'decía'."}
          - {w: "el cual", f: "'who', masculine singular to match 'su hermano'; a heavier relative than 'que', used after a pause."}
          - {w: "viendo", f: "gerund of ver (to see): 'seeing'."}
          - {w: "había llegado", f: "había (haber (to have), imperfect, he: había, habías, había, habíamos, habíais, habían) + llegado, participle of llegar (to arrive): 'had come'."}
          - {w: "dando", f: "gerund of dar (to give): 'giving', here 'heaving' a sigh."}
          - {w: "grande", f: "grande (great) kept whole before a noun; modern Spanish clips it to 'gran suspiro'."}
          - {w: "llenándosele", f: "gerund of llenar (to fill) + se (themselves) + le (to him), accent added: 'his eyes filling'. The 'le' marks whose eyes, where English uses 'his'."}
