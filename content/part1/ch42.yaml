        note: "A captain commanded a company of some two or three hundred men; the 'maestre de campo' commanded a whole tercio of several companies. Rising from the ranks to captain on merit alone, 'sin otro brazo', was rare in an army where birth and patrons counted."
      - es: "Pero fuele la fortuna contraria, pues donde la pudiera esperar y tener buena, allí la perdió, con perder la libertad en la felicísima jornada donde tantos la cobraron, que fue en la batalla de Lepanto."
