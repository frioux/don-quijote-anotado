      - es: "Allí concertaron que el capitán y Zoraida se volviesen con su hermano a Sevilla y avisasen a su padre de su hallazgo y libertad, para que, como pudiese, viniese a hallarse en las bodas y bautismo de Zoraida, por no le ser al oidor posible dejar el camino que llevaba, a causa de tener nuevas que de allí a un mes partía la flota de Sevilla a la Nueva España, y fuérale de grande incomodidad perder el viaje."
        literal: "There they-agreed that the captain and Zoraida themselves should-return with his brother to Seville and should-inform [to] his father of his finding and freedom, so that, as he-might-be-able, he-should-come to find-himself at the wedding and baptism of Zoraida, for not to-him being to-the judge possible to-leave the road that he-was-taking, by cause of having news that from then to a month was-leaving the fleet from Seville to the New Spain, and it-would-have-been-to-him of great inconvenience to-lose the voyage."
        ormsby: "Then they agreed that the captain and Zoraida should return with his brother to Seville, and send news to his father of his having been delivered and found, so as to enable him to come and be present at the marriage and baptism of Zoraida, for it was impossible for the Judge to put off his journey, as he was informed that in a month from that time the fleet was to sail from Seville for New Spain, and to miss the passage would have been a great inconvenience to him."
