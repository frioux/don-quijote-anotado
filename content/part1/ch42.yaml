          - {w: "partía", f: "part- + -ía → partir (to leave, sail), imperfect, it (the fleet), used for a planned future seen from the past: 'was to sail'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
