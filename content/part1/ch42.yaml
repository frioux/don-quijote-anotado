  - sentences:
      - es: "De aquí fue prosiguiendo el cura, y, con brevedad sucinta, contó lo que con Zoraida a su hermano había sucedido; a todo lo cual estaba tan atento el oidor, que ninguna vez había sido tan oidor como entonces."
        literal: "From here went continuing the priest, and, with brevity succinct, he-told that which with Zoraida to his brother had happened; to all which was so attentive the judge, that no time he-had been so-much hearer as then."
        ormsby: "Here the curate went on to relate briefly his brother’s adventure with Zoraida; to all which the Judge gave such an attentive hearing as he had never yet given to any cause he heard."
        ormsby_note: "If so, the judge's views of the value of evidence were peculiar. How could the curate, for instance, have known that the Frenchmen robbed his friend, if he had never been able to learn whether he reached Spain or had been carried off to France?"
        vocab:
          - {w: "de aquí", d: "from this point, from here on"}
          - {w: "ir + gerund", d: "to go on doing: 'fue prosiguiendo' = went on continuing, carried on"}
          - {w: "brevedad sucinta", d: "succinct brevity, i.e. briefly and to the point"}
          - {w: "atento", d: "attentive, listening closely"}
          - {w: "oidor", d: "judge of a royal appeal court (Audiencia); literally 'hearer', from 'oír' (to hear)"}
          - {w: "ninguna vez", d: "never, not once"}
        diagram:
          - s: "De aquí fue prosiguiendo el cura"
            r: "main verb 1: from here the priest went on"
          - s: "contó"
            r: "main verb 2 (after 'y'): he told"
            under:
              - {s: "con brevedad sucinta", r: "how: briefly"}
              - {s: "lo que con Zoraida a su hermano había sucedido", r: "object: what had happened to his brother with Zoraida"}
          - s: "estaba tan atento el oidor"
            r: "main verb 3: the judge was so attentive"
            under:
              - {s: "a todo lo cual", r: "to what: to all of which"}
              - {s: "que ninguna vez había sido tan oidor como entonces", r: "result: that never had he been so much of a 'hearer' as then"}
        forms:
          - {w: "fue prosiguiendo", f: "fu- + -e → ir (to go), preterite, he: fui, fuiste, fue, fuimos, fuisteis, fueron; + prosiguiendo, gerund of proseguir (to continue), the e of the stem turning to i: 'went on continuing'. ir (to go) and ser (to be) share the same preterite; the gerund after it shows this is ir (to go)."}
          - {w: "contó", f: "cont- + -ó → contar (to tell), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "había sucedido", f: "había (haber (to have), imperfect, it: había, habías, había, habíamos, habíais, habían) + sucedido, participle of suceder (to happen): 'had happened'."}
          - {w: "lo cual", f: "'which', neuter: it refers to the whole story just told, not one noun."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "atento", f: "atent- + -o → atento (attentive), masculine to match 'el oidor'."}
          - {w: "había sido", f: "había (haber (to have), imperfect, he: había, habías, había, habíamos, habíais, habían) + sido, participle of ser (to be): 'had been'."}
        note: "A pun: an 'oidor' was a judge of one of the royal Audiencias (appeal courts), so called because he 'heard' cases (oír, to hear). Never had this hearer been so much a hearer, so all ears, as now."
      - es: "Sólo llegó el cura al punto de cuando los franceses despojaron a los cristianos que en la barca venían, y la pobreza y necesidad en que su camarada y la hermosa mora habían quedado;"
        literal: "Only arrived the priest to-the point of when the Frenchmen stripped [the] Christians who in the boat were-coming, and the poverty and need in which his comrade and the beautiful Moorish-woman had remained;"
        ormsby: "The curate, however, only went so far as to describe how the Frenchmen plundered those who were in the boat, and the poverty and distress in which his comrade and the fair Moor were left,"
        vocab:
          - {w: "sólo", d: "only (adverb, with accent in the old spelling)"}
          - {w: "llegar al punto de", d: "to get as far as, come up to the point of"}
          - {w: "despojar", d: "to strip, rob, plunder"}
          - {w: "barca", d: "boat, small vessel"}
          - {w: "necesidad", d: "want, destitution (not only 'need')"}
          - {w: "mora", d: "Moorish woman, Muslim woman of North Africa (here Zoraida)"}
        diagram:
          - s: "Sólo llegó el cura"
            r: "main verb: the priest only got as far as"
            under:
              - s: "al punto de cuando los franceses despojaron a los cristianos"
                r: "how far, 1: the point when the Frenchmen robbed the Christians"
                under:
                  - {s: "que en la barca venían", r: "describes 'cristianos': who were coming in the boat"}
              - s: "y la pobreza y necesidad"
                r: "how far, 2: and the poverty and want"
                under:
                  - {s: "en que su camarada y la hermosa mora habían quedado", r: "describes 'pobreza': in which his comrade and the fair Moor had been left"}
        forms:
          - {w: "llegó", f: "lleg- + -ó → llegar (to arrive), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (llegué, with g → gu before e)."}
          - {w: "al", f: "a + el, the contraction modern Spanish still makes."}
          - {w: "despojaron", f: "despoj- + -aron → despojar (to rob), preterite, they. Same -ar preterite: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "a los cristianos", f: "'a' marks a person as the object: Spanish puts 'a' before a human direct object."}
          - {w: "venían", f: "ven- + -ían → venir (to come), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "hermosa", f: "hermos- + -a → hermoso (beautiful), feminine to match 'mora'."}
          - {w: "habían quedado", f: "habían (haber (to have), imperfect, they: había, habías, había, habíamos, habíais, habían) + quedado, participle of quedar (to remain): 'had been left'."}
        note: "In the captive's story (chapter 41) French corsairs robbed the fugitives near the Spanish coast and set them ashore with almost nothing; the priest stops there, so the judge cannot know his brother is in the room."
      - es: "de los cuales no había sabido en qué habían parado, ni si habían llegado a España, o llevádolos los franceses a Francia."
        literal: "of the whom not he-had known in what they-had stopped, nor if they-had arrived to Spain, or carried-them the Frenchmen to France."
        ormsby: "of whom he said he had not been able to learn what became of them, or whether they had reached Spain, or been carried to France by the Frenchmen."
        vocab:
          - {w: "parar en", d: "to end up in, come to: 'en qué habían parado' = what had become of them"}
          - {w: "llevar", d: "to carry off, take away"}
