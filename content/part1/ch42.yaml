  - sentences:
      - es: "Pero, a este tiempo, ya había salido del coche un hombre, que en el traje mostró luego el oficio y cargo que tenía, porque la ropa luenga, con las mangas arrocadas, que vestía, mostraron ser oidor, como su criado había dicho."
        literal: "But, at this time, already had come-out from-the coach a man, who in the dress showed at-once the office and post that he-had, because the robe long, with the sleeves ruffled, that he-wore, showed [him] to-be judge, as his servant had said."
        ormsby: "but in the meantime a man had got out of the coach whose dress indicated at a glance the office and post he held, for the long robe with ruffled sleeves that he wore showed that he was, as his servant said, a Judge of appeal."
        vocab:
          - {w: "a este tiempo", d: "at this moment, meanwhile"}
          - {w: "traje", d: "dress, clothes, costume"}
          - {w: "luego", d: "at once, immediately (its usual sense in Cervantes, not 'later')"}
          - {w: "oficio y cargo", d: "office and post, his profession and position"}
          - {w: "ropa", d: "here a gown, robe (the long gown of a lawyer or judge), not 'clothes' in general"}
          - {w: "luengo", d: "= largo, long (archaic)"}
          - {w: "mangas arrocadas", d: "sleeves gathered in puffs or ruffles, shaped like the bulge of a distaff ('rueca'); part of a judge's robe"}
          - {w: "criado", d: "servant"}
        diagram:
          - s: "ya había salido del coche un hombre"
            r: "main verb 1: a man had already got out of the coach"
            under:
              - {s: "Pero, a este tiempo", r: "when: but meanwhile"}
              - s: "que en el traje mostró luego el oficio y cargo"
                r: "describes 'hombre': whose dress showed at once his office and post"
                under:
                  - {s: "que tenía", r: "describes 'oficio y cargo': that he held"}
          - s: "mostraron ser oidor"
            r: "main verb 2 (after 'porque', because): showed him to be a judge"
            under:
              - s: "la ropa luenga, con las mangas arrocadas"
                r: "subject: the long gown with ruffled sleeves"
                under:
                  - {s: "que vestía", r: "describes 'ropa': that he wore"}
              - {s: "como su criado había dicho", r: "how: as his servant had said"}
        forms:
          - {w: "había salido", f: "había (haber (to have), imperfect, he) + salido, the participle of salir (to come out): the pluperfect, 'had got out'. haber (to have) in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "mostró", f: "mostr- + -ó → mostrar (to show), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "tenía", f: "ten- + -ía → tener (to hold), imperfect, he. The imperfect of -er verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "luenga", f: "lueng- + -a → luengo (long), feminine to match 'ropa'; archaic for 'larga'."}
          - {w: "arrocadas", f: "arroc- + -adas → arrocado (gathered like a distaff), participle-adjective, feminine plural to match 'mangas'."}
          - {w: "vestía", f: "vest- + -ía → vestir (to wear), imperfect, he. The imperfect of -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "mostraron", f: "mostr- + -aron → mostrar (to show), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. Plural because Cervantes counts the gown and its sleeves as two things."}
          - {w: "había dicho", f: "había (haber (to have), imperfect, he) + dicho, the irregular participle of decir (to say): 'had said'. Same imperfect of haber (to have): había, habías, había, habíamos, habíais, habían."}
        note: "Judges and lawyers wore the long gown ('ropa larga') and were known as 'men of the long robe'; soldiers and courtiers wore short cloaks. So the robe identifies a man of letters, just after Don Quijote's speech on arms and letters."
