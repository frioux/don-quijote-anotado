        forms:
          - {w: "quedaron", f: "qued- + -aron → quedar (to remain, be left), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "contentos y alegres", f: "content- + -os → contento (pleased), masculine plural; alegr- + -es → alegre (glad), plural: both to match 'todos'."}
          - {w: "buen", f: "bueno (good) clipped before a masculine singular noun ('suceso')."}
          - {w: "iba", f: "ir (to go), imperfect, it (the night). Irregular: iba, ibas, iba, íbamos, ibais, iban."}
