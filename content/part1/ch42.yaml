  - sentences:
      - es: "— Señor, lo que en ello hay es que no tengo camas: si es que su merced del señor oidor la trae, que sí debe de traer, entre en buen hora, que yo y mi marido nos saldremos de nuestro aposento por acomodar a su merced."
        literal: "— Sir, that which in it there-is is that not I-have beds: if it-is that his worship of-the lord judge it brings, for yes he-must bring, let-him-enter in good hour, for I and my husband ourselves will-go-out from our room to accommodate to his worship."
        ormsby: "“Señor, the fact is I have no beds; but if his lordship the Judge carries one with him, as no doubt he does, let him come in and welcome; for my husband and I will give up our room to accommodate his worship.”"
        vocab:
          - {w: "lo que en ello hay es que", d: "the fact of the matter is that"}
          - {w: "su merced", d: "his worship, your worship: polite title, the source of modern 'usted'"}
          - {w: "deber de", d: "must (probability): 'sí debe de traer' = he surely brings one"}
          - {w: "en buen hora", d: "and welcome, by all means (literally 'in good hour'; modern 'en buena hora')"}
          - {w: "salirse de", d: "to move out of, leave"}
          - {w: "aposento", d: "room, bedroom"}
          - {w: "por", d: "here 'in order to' (= para)"}
        diagram:
          - s: "lo que en ello hay es"
            r: "main verb 1: the fact is"
            under:
              - {s: "que no tengo camas", r: "what the fact is: that I have no beds"}
          - s: "entre en buen hora"
            r: "main verb 2: let him come in and welcome"
            under:
              - s: "si es que su merced del señor oidor la trae"
                r: "condition: if his lordship the judge brings one (a bed)"
                under:
                  - {s: "que sí debe de traer", r: "aside: as he surely must"}
              - s: "que yo y mi marido nos saldremos de nuestro aposento"
                r: "why: for my husband and I will move out of our room"
                under:
                  - {s: "por acomodar a su merced", r: "purpose: to accommodate his worship"}
        forms:
          - {w: "hay", f: "from haber (there to be), present: 'there is'. In 'lo que en ello hay' = what there is in it."}
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "la trae", f: "tra- + -e → traer (to bring), present, he. Irregular: traigo, traes, trae, traemos, traéis, traen. 'la' = it, the bed (feminine like 'cama')."}
          - {w: "debe", f: "deb- + -e → deber (must), present, he. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "entre", f: "entr- + -e → entrar (to enter), present subjunctive, he, used as a polite command: 'let him come in'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "nos saldremos", f: "saldr- + -emos → salir (to go out), future, we, with 'nos' (ourselves): 'we will move out'. Irregular stem saldr-: saldré, saldrás, saldrá, saldremos, saldréis, saldrán."}
          - {w: "nuestro", f: "nuestr- + -o → nuestro (our), masculine singular to match 'aposento'."}
        note: "Travellers of rank carried their own bedding, since inns often had few beds or none. The landlady will give up her own room, but cannot conjure a bed."
