          - s: "decía el oidor"
            r: "main verb: the judge was saying"
            under:
              - {s: "Estas y otras semejantes palabras", r: "object, placed first: these and similar words"}
              - s: "lleno de tanta compasión"
                r: "describes 'el oidor': full of such compassion"
                under:
                  - s: "con las nuevas"
                    r: "why: at the news"
                    under:
                      - {s: "que de su hermano le habían dado", r: "describes 'nuevas': that they had given him about his brother"}
                  - s: "que todos los que le oían le acompañaban"
                    r: "result of 'tanta': that everyone who heard him joined him"
                    under:
                      - {s: "en dar muestras del sentimiento", r: "in what: in showing the grief"}
                      - {s: "que tenían de su lástima", r: "describes 'sentimiento': that they felt at his distress"}
        forms:
          - {w: "Estas", f: "est- + -as → este (this), feminine plural to match 'palabras'."}
          - {w: "decía", f: "dec- + -ía → decir (to say), imperfect, he: 'was saying'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "lleno", f: "llen- + -o → lleno (full), masculine singular to match 'el oidor'."}
          - {w: "tanta", f: "tant- + -a → tanto (so much), feminine to match 'compasión'; it sets up the result clause 'que todos ...'."}
          - {w: "habían dado", f: "hab- + -ían → haber (to have, as a helper), imperfect, they (people in general), + dado, participle of dar (to give): pluperfect, 'they had given'. haber (to have) in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "oían", f: "o- + -ían → oír (to hear), imperfect, they. Same -ía imperfect: oía, oías, oía, oíamos, oíais, oían."}
          - {w: "acompañaban", f: "acompañ- + -aban → acompañar (to accompany, join), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "dar", f: "infinitive of dar (to give) after 'en': 'in giving'. Spanish uses the infinitive where English uses '-ing' after a preposition."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
          - {w: "tenían", f: "ten- + -ían → tener (to have), imperfect, they. Same -ía imperfect: tenía, tenías, tenía, teníamos, teníais, tenían."}
          - {w: "le oían, le acompañaban", f: "'le' = him (the judge) as a direct object: leísmo, the Castilian habit of using 'le' instead of 'lo' for a male person."}
  - sentences:
      - es: "Viendo, pues, el cura que tan bien había salido con su intención y con lo que deseaba el capitán, no quiso tenerlos a todos más tiempo tristes, y así, se levantó de la mesa, y, entrando donde estaba Zoraida, la tomó por la mano, y tras ella se vinieron Luscinda, Dorotea y la hija del oidor."
        literal: "Seeing, then, the priest that so well he-had come-out with his intention and with that which was-wishing the captain, not he-wanted to-keep-them all more time sad, and so, himself he-raised from the table, and, entering where was Zoraida, her he-took by the hand, and behind her themselves came Luscinda, Dorotea and the daughter of-the judge."
        ormsby: "The curate, seeing, then, how well he had succeeded in carrying out his purpose and the captain’s wishes, had no desire to keep them unhappy any longer, so he rose from the table and going into the room where Zoraida was he took her by the hand, Luscinda, Dorothea, and the Judge’s daughter following her."
        vocab:
          - {w: "salir con", d: "to succeed in, pull off ('salir con su intención' = to achieve his aim)"}
          - {w: "más tiempo", d: "any longer"}
          - {w: "levantarse", d: "to get up, rise"}
          - {w: "tras", d: "behind, after"}
          - {w: "venirse", d: "to come along (the 'se' adds 'off, along')"}
        diagram:
          - s: "no quiso tenerlos a todos más tiempo tristes"
            r: "main verb 1: he did not want to keep them all sad any longer"
            under:
              - s: "Viendo, pues, el cura"
                r: "why: the priest, seeing"
                under:
                  - {s: "que tan bien había salido con su intención", r: "what he saw: that he had carried out his plan so well"}
                  - {s: "y con lo que deseaba el capitán", r: "and with what the captain wanted"}
          - {s: "y así, se levantó de la mesa", r: "main verb 2: and so he got up from the table"}
          - s: "la tomó por la mano"
            r: "main verb 3: he took her by the hand"
            under:
              - {s: "entrando donde estaba Zoraida", r: "when: going in where Zoraida was"}
          - s: "y tras ella se vinieron"
            r: "main verb 4: and behind her came"
            under:
              - {s: "Luscinda, Dorotea y la hija del oidor", r: "subject: Luscinda, Dorotea and the judge's daughter"}
        forms:
          - {w: "Viendo", f: "gerund of ver (to see): 'seeing'. Its subject 'el cura' comes after it."}
          - {w: "había salido", f: "hab- + -ía → haber (to have, as a helper), imperfect, he, + salido, participle of salir (to come out): pluperfect, 'he had come out (with)'. haber (to have) in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "deseaba", f: "dese- + -aba → desear (to wish), imperfect, he (the captain). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "quiso", f: "quis- + -o → querer (to want), preterite, he. Irregular: quise, quisiste, quiso, quisimos, quisisteis, quisieron. In the negative preterite 'no quiso' means 'he would not, he chose not to'."}
          - {w: "tenerlos", f: "tener (to keep) + los (them), the pronoun hung on the infinitive after 'quiso'."}
          - {w: "tristes", f: "trist- + -es → triste (sad), plural to match 'los ... todos'."}
          - {w: "se levantó", f: "levant- + -ó → levantarse (to get up), preterite, he, with 'se' (himself). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "entrando", f: "entr- + -ando → gerund of entrar (to go in): 'going in'."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, she (Zoraida). Same -aba imperfect: estaba, estabas, estaba, estábamos, estabais, estaban."}
          - {w: "la tomó", f: "tom- + -ó → tomar (to take), preterite, he; 'la' = her (Zoraida). Same -ar preterite: tomé, tomaste, tomó, tomamos, tomasteis, tomaron."}
