          - {w: "ha enviado", f: "ha (haber (to have), present, he: he, has, ha, hemos, habéis, han) + enviado, participle of enviar (to send): 'has sent'."}
          - {w: "a mí", f: "'mí' with an accent is the pronoun 'me' after a preposition; 'mi' without it is 'my'."}
