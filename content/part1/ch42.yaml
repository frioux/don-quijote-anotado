                    r: "why: because he had news"
                    under:
                      - {s: "que de allí a un mes partía la flota de Sevilla a la Nueva España", r: "what news: that in a month the fleet sailed from Seville to New Spain"}
                  - {s: "y fuérale de grande incomodidad perder el viaje", r: "why, 2: and missing the voyage would have been very inconvenient for him"}
        forms:
          - {w: "concertaron", f: "concert- + -aron → concertar (to agree), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "se volviesen", f: "volv- + -iesen → volverse (to go back), imperfect subjunctive (-se form), they, after 'concertaron que'. The -se imperfect subjunctive of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen."}
          - {w: "avisasen", f: "avis- + -asen → avisar (to inform), imperfect subjunctive (-se form), they. The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "pudiese", f: "pud- + -iese → poder (to be able), imperfect subjunctive (-se form), he (the father). Built on the preterite pudieron: pudiese, pudieses, pudiese, pudiésemos, pudieseis, pudiesen."}
          - {w: "viniese", f: "vin- + -iese → venir (to come), imperfect subjunctive (-se form), he, after 'para que'. Built on the preterite vinieron: viniese, vinieses, viniese, viniésemos, vinieseis, viniesen."}
          - {w: "hallarse", f: "hallar (to find) + se, infinitive after 'viniese a': 'to find himself, be present'."}
          - {w: "por no le ser", f: "por + infinitive ser (to be) = 'because it was not'; Cervantes puts the pronoun 'le' (to him) before the infinitive, where modern Spanish says 'por no serle'. 'al oidor' repeats who 'le' is."}
          - {w: "al", f: "a + el, the contraction modern Spanish still makes."}
          - {w: "llevaba", f: "llev- + -aba → llevar (to take, travel), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
