  - sentences:
      - es: "— Seguramente puede vuestra merced entrar y espaciarse en este castillo, que, aunque es estrecho y mal acomodado, no hay estrecheza ni incomodidad en el mundo que no dé lugar a las armas y a las letras, y más si las armas y letras traen por guía y adalid a la fermosura, como la traen las letras de vuestra merced en esta fermosa doncella, a quien deben no sólo abrirse y manifestarse los castillos, sino apartarse los riscos, y devidirse y abajarse las montañas, para dalle acogida."
        literal: "— Safely can your worship enter and spread-yourself in this castle, for, although it-is narrow and badly furnished, not there-is narrowness nor discomfort in the world that not may-give room to the arms and to the letters, and more if the arms and letters bring as guide and captain to the beauty, as it they-bring the letters of your worship in this beautiful maiden, to whom ought not only to-open-themselves and to-show-themselves the castles, but to-draw-aside-themselves the crags, and to-divide-themselves and to-lower-themselves the mountains, to give-her welcome."
        ormsby: "“Your worship may with confidence enter and take your ease in this castle; for though the accommodation be scanty and poor, there are no quarters so cramped or inconvenient that they cannot make room for arms and letters; above all if arms and letters have beauty for a guide and leader, as letters represented by your worship have in this fair maiden, to whom not only ought castles to throw themselves open and yield themselves up, but rocks should rend themselves asunder and mountains divide and bow themselves down to give her a reception."
        vocab:
          - {w: "seguramente", d: "safely, with confidence (not 'surely, probably' as in modern Spanish)"}
          - {w: "vuestra merced", d: "your worship, the polite 'you' (it later shrank to 'usted'); takes he/she verb forms"}
          - {w: "espaciarse", d: "to make oneself at ease, spread out, relax"}
          - {w: "estrecho", d: "narrow, cramped"}
          - {w: "mal acomodado", d: "poorly furnished, inconvenient"}
          - {w: "estrecheza", d: "narrowness, lack of room (old form of 'estrechez')"}
          - {w: "dar lugar a", d: "to make room for"}
          - {w: "las armas y las letras", d: "arms and letters: the soldier's and the scholar's professions, the theme of Don Quijote's speech two chapters earlier"}
          - {w: "y más si", d: "and all the more if, above all if"}
          - {w: "adalid", d: "leader, captain in war (from Arabic); a chivalric word"}
          - {w: "fermosura", d: "= hermosura, beauty (the old f- spelling of the romances of chivalry)"}
          - {w: "fermoso", d: "= hermoso, beautiful (old chivalric spelling)"}
          - {w: "manifestarse", d: "to reveal oneself; here to lay oneself open"}
          - {w: "risco", d: "crag, steep rock"}
          - {w: "devidirse", d: "= dividirse, to split apart (old spelling)"}
          - {w: "abajarse", d: "= bajarse, to lower oneself, bow down (archaic)"}
          - {w: "dalle", d: "= darle, to give her (-rl- became -ll- in old Spanish)"}
          - {w: "acogida", d: "welcome, reception, shelter"}
        diagram:
          - s: "Seguramente puede vuestra merced entrar y espaciarse en este castillo"
            r: "main verb: your worship may safely come in and make yourself at home in this castle"
            under:
              - s: "que, aunque es estrecho y mal acomodado, no hay estrecheza ni incomodidad en el mundo"
                r: "why: for, though it is cramped and poorly furnished, there is no narrowness or discomfort in the world"
                under:
