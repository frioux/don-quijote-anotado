        vocab:
          - {w: "razones", d: "words, speech, what someone says (not 'reasons')"}
          - {w: "clara y distintamente", d: "clearly and distinctly; with two -mente adverbs, only the last takes the ending"}
          - {w: "como quien", d: "as one who, being someone who"}
          - {w: "junto de", d: "close to, next to (modern 'junto a')"}
          - {w: "estar en medio", d: "to be in between"}
          - {w: "así como", d: "as soon as"}
          - {w: "dar una voz", d: "to give a shout, cry out"}
        diagram:
          - s: "Oyó estas razones Cardenio"
            r: "main verb 1: Cardenio heard these words"
            under:
