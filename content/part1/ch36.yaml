      - es: "mas, hallándose Cardenio allí junto, que a las espaldas de don Fernando se había puesto porque no le conociese, prosupuesto todo temor y aventurando a todo riesgo, acudió a sostener a Luscinda, y, cogiéndola entre sus brazos, le dijo:"
