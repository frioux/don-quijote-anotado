      - es: "Y no es de maravillar que no sepamos más de lo que habemos dicho, porque mi compañero y yo no ha más de dos días que los acompañamos; porque, habiéndolos encontrado en el camino, nos rogaron y persuadieron que viniésemos con ellos hasta el Andalucía, ofreciéndose a pagárnoslo muy bien."
