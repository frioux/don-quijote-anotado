        literal: "In effect, to these words added all others, such and so-many, that the valiant breast of Don Fernando (in end, as nourished with illustrious blood) itself softened and itself let conquer by the truth, which he not could-have denied although he-might-have-wanted;"
        ormsby: "To be brief, they added to these such other forcible arguments that Don Fernando’s manly heart, being after all nourished by noble blood, was touched, and yielded to the truth which, even had he wished it, he could not gainsay;"
