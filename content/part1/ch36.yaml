part: 1
chapter: 36
title_es: "Capítulo XXXVI. Que trata de la brava y descomunal batalla que don Quijote tuvo con unos cueros de vino tinto, con otros raros sucesos que en la venta le sucedieron"
title_en: "Which treats of more curious incidents that occurred at the inn"
paragraphs:
  - sentences:
      - es: "Estando en esto, el ventero, que estaba a la puerta de la venta, dijo:"
        literal: "Being in this, the innkeeper, who was at the door of the inn, said:"
        ormsby: "Just at that instant the landlord, who was standing at the gate of the inn, exclaimed,"
        vocab:
          - {w: "estando en esto", d: "just then, at this point (literally 'being in this')"}
          - {w: "ventero", d: "innkeeper, landlord of a 'venta' (roadside inn)"}
          - {w: "venta", d: "roadside inn, out in the country (as opposed to a 'posada' in town)"}
        diagram:
          - s: "dijo:"
            r: "main verb: said"
            under:
              - {s: "Estando en esto", r: "when: just then"}
              - s: "el ventero"
                r: "subject: the innkeeper"
                under:
                  - {s: "que estaba a la puerta de la venta", r: "describes 'ventero': who was at the inn door"}
        forms:
          - {w: "Estando", f: "gerund of estar (to be): 'being'. 'Estando en esto' is a set way of opening a scene: 'while things stood so'."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Esta que viene es una hermosa tropa de huéspedes: si ellos paran aquí, gaudeamus tenemos."
        literal: "— This that comes is a fine troop of guests: if they stop here, gaudeamus we-have."
        ormsby: "“Here comes a fine troop of guests; if they stop here we may say gaudeamus.”"
        vocab:
          - {w: "tropa", d: "troop, band, company of people"}
          - {w: "huésped", d: "guest (at an inn); in old Spanish it can also mean the host"}
          - {w: "parar", d: "to stop, halt, put up (for the night)"}
          - {w: "gaudeamus", d: "Latin 'let us rejoice', the opening of a hymn; colloquially a feast, a good time. 'Gaudeamus tenemos' = we're in for a party (and a good profit)"}
        diagram:
          - s: "es"
            r: "main verb 1: is"
            under:
              - {s: "Esta que viene", r: "subject: this (company) that is coming"}
              - {s: "una hermosa tropa de huéspedes", r: "what it is: a fine troop of guests"}
          - s: "gaudeamus tenemos"
            r: "main verb 2: we have a feast"
            under:
              - {s: "si ellos paran aquí", r: "condition: if they stop here"}
        forms:
          - {w: "Esta", f: "est- + -a → este (this), feminine, standing alone for 'esta gente' or 'esta tropa'. Older spelling without the accent that marks it as a pronoun (modern 'ésta' or 'esta')."}
          - {w: "viene", f: "vien- + -e → venir (to come), present, it. Irregular: vengo, vienes, viene, venimos, venís, vienen."}
          - {w: "paran", f: "par- + -an → parar (to stop), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "tenemos", f: "ten- + -emos → tener (to have), present, we. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
        note: "An innkeeper sees a party of gentlemen with servants as money in the till; the church Latin 'gaudeamus' had passed into everyday speech for a feast or a spree."
  - sentences:
      - es: "— ¿Qué gente es? —dijo Cardenio."
        literal: "— What people is-it? —said Cardenio."
        ormsby: "“What are they?” said Cardenio."
        vocab:
          - {w: "gente", d: "people; singular in Spanish, so 'qué gente es' = what sort of people are they"}
        diagram:
          - s: "¿Qué gente es?"
            r: "the question: what people are they?"
          - s: "dijo"
            r: "main verb: said"
            under:
              - {s: "Cardenio", r: "subject"}
        forms:
          - {w: "es", f: "ser (to be), present, it, singular because 'gente' is a singular noun. soy, eres, es, somos, sois, son."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Cuatro hombres —respondió el ventero— vienen a caballo, a la jineta, con lanzas y adargas, y todos con antifaces negros; y junto con ellos viene una mujer vestida de blanco, en un sillón, ansimesmo cubierto el rostro, y otros dos mozos de a pie."
        literal: "— Four men —answered the innkeeper— come on horse, in the jineta-style, with lances and leather-shields, and all with masks black; and together with them comes a woman dressed in white, on a side-saddle, likewise covered the face, and other two lads on foot."
        ormsby: "“Four men,” said the landlord, “riding a la jineta, with lances and bucklers, and all with black veils, and with them there is a woman in white on a sidesaddle, whose face is also veiled, and two attendants on foot.”"
        ormsby_note: "I.e. on high saddles with short stirrups."
        vocab:
          - {w: "a la jineta", d: "riding Moorish-style, with short stirrups and bent knees, on a high saddle (opposite of 'a la brida', long stirrups)"}
          - {w: "adarga", d: "oval leather shield, of Moorish origin, used by light horsemen"}
          - {w: "antifaz", d: "mask or veil over the face; travellers wore them against dust and sun, and to go unrecognized"}
          - {w: "sillón", d: "side-saddle, a saddle with a back and footrest for a woman (not 'armchair' here)"}
          - {w: "ansimesmo", d: "= asimismo, likewise, also (old form)"}
          - {w: "cubierto el rostro", d: "with her face covered (absolute participle phrase)"}
          - {w: "mozo de a pie", d: "servant or lad who goes on foot beside the riders; 'de a pie' = on foot"}
        diagram:
          - s: "vienen"
            r: "main verb 1: come"
            under:
              - {s: "Cuatro hombres", r: "subject: four men"}
              - {s: "respondió el ventero", r: "speech tag: answered the innkeeper"}
              - {s: "a caballo, a la jineta", r: "how: on horseback, with short stirrups"}
              - {s: "con lanzas y adargas", r: "with what: lances and shields"}
              - {s: "y todos con antifaces negros", r: "how: all with black masks"}
          - s: "viene"
            r: "main verb 2 (after 'y junto con ellos'): comes"
            under:
              - {s: "y junto con ellos", r: "with whom: together with them"}
              - s: "una mujer vestida de blanco"
                r: "subject 1: a woman dressed in white"
                under:
                  - {s: "en un sillón", r: "how she rides: on a side-saddle"}
                  - {s: "ansimesmo cubierto el rostro", r: "how: her face also covered"}
              - {s: "y otros dos mozos de a pie", r: "subject 2: and two more lads on foot"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "vienen, viene", f: "vien- + -en / -e → venir (to come), present, they / she. Irregular: vengo, vienes, viene, venimos, venís, vienen. 'viene' is singular because the first subject, 'una mujer', is singular."}
          - {w: "adargas", f: "adarg- + -as → adarga (shield), plural."}
          - {w: "antifaces negros", f: "antifaz → antifaces: z becomes c before -es; 'negros' masculine plural to match."}
          - {w: "vestida", f: "vest- + -ida → participle of vestir (to dress), feminine to match 'mujer': 'dressed'."}
          - {w: "cubierto", f: "irregular participle of cubrir (to cover), masculine to match 'el rostro': 'the face covered'. A participle with its own noun makes an absolute phrase, 'with her face covered'."}
          - {w: "ansimesmo", f: "= asimismo (likewise), old spelling with 'ansí' (= así) and 'mesmo' (= mismo)."}
  - sentences:
      - es: "— ¿Vienen muy cerca? —preguntó el cura."
        literal: "— Do-they-come very near? —asked the priest."
        ormsby: "“Are they very near?” said the curate."
        vocab:
          - {w: "cura", d: "parish priest, the curate of Don Quijote's village (Pero Pérez)"}
        diagram:
          - s: "¿Vienen muy cerca?"
            r: "the question: are they very near?"
          - s: "preguntó"
            r: "main verb: asked"
            under:
              - {s: "el cura", r: "subject: the priest"}
        forms:
          - {w: "Vienen", f: "vien- + -en → venir (to come), present, they. Irregular: vengo, vienes, viene, venimos, venís, vienen. 'vienen cerca' = they are coming close, they are near."}
          - {w: "preguntó", f: "pregunt- + -ó → preguntar (to ask), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
  - sentences:
      - es: "— Tan cerca —respondió el ventero—, que ya llegan."
        literal: "— So near —answered the innkeeper—, that already they-arrive."
        ormsby: "“So near,” answered the landlord, “that here they come.”"
        vocab:
          - {w: "tan ... que", d: "so ... that (result)"}
          - {w: "ya llegan", d: "they're arriving now, here they are"}
        diagram:
          - s: "Tan cerca"
            r: "the answer: so near (they come)"
            under:
              - {s: "que ya llegan", r: "result: that they are arriving already"}
          - s: "respondió"
            r: "main verb: answered"
            under:
              - {s: "el ventero", r: "subject: the innkeeper"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "llegan", f: "lleg- + -an → llegar (to arrive), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
  - sentences:
      - es: "Oyendo esto Dorotea, se cubrió el rostro, y Cardenio se entró en el aposento de don Quijote;"
        literal: "Hearing this Dorotea, herself she-covered the face, and Cardenio himself went-in into the room of Don Quijote;"
        ormsby: "Hearing this Dorothea covered her face, and Cardenio retreated into Don Quixote’s room,"
        vocab:
          - {w: "rostro", d: "face (literary; everyday 'cara')"}
          - {w: "entrarse en", d: "to go in, withdraw into (the 'se' stresses going in and staying there)"}
          - {w: "aposento", d: "room, chamber (at the inn, the room where Don Quijote is sleeping)"}
        diagram:
          - s: "se cubrió el rostro"
            r: "main verb 1: (she) covered her face"
            under:
              - {s: "Oyendo esto Dorotea", r: "when: Dorotea, hearing this; Dorotea is also the subject"}
          - s: "y Cardenio se entró"
            r: "main verb 2: and Cardenio went in"
            under:
              - {s: "en el aposento de don Quijote", r: "where: into Don Quijote's room"}
        forms:
          - {w: "Oyendo", f: "gerund of oír (to hear): 'hearing'. The i between vowels is written y: oír → oyendo. Its subject, Dorotea, follows it."}
          - {w: "se cubrió", f: "cubr- + -ió → cubrirse (to cover oneself), preterite, she, with 'se': 'she covered her face'. Spanish uses 'se' + 'el rostro' where English says 'her face'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "se entró", f: "entr- + -ó → entrarse (to go in), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
        note: "Dorotea covers her face because she is in the dress of a woman of quality, and Cardenio hides because both have reasons not to be seen by strangers who might be from their own city."
      - es: "y casi no habían tenido lugar para esto, cuando entraron en la venta todos los que el ventero había dicho;"
        literal: "and almost not they-had had place for this, when entered into the inn all those that the innkeeper had said;"
        ormsby: "and they hardly had time to do so before the whole party the host had described entered the inn,"
        vocab:
          - {w: "tener lugar para", d: "to have time or room to (do something); not 'take place'"}
          - {w: "casi no ... cuando", d: "hardly ... when, scarcely ... before"}
        diagram:
          - s: "casi no habían tenido lugar para esto"
            r: "main verb: they had hardly had time for this"
            under:
              - s: "cuando entraron en la venta todos los"
                r: "when: when all those came into the inn"
                under:
                  - {s: "que el ventero había dicho", r: "describes 'los': that the innkeeper had said"}
        forms:
          - {w: "habían tenido", f: "hab- + -ían → haber + tenido, the participle of tener (to have): pluperfect, they: 'had had'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "entraron", f: "entr- + -aron → entrar (to enter), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "había dicho", f: "había (haber, imperfect, he) + dicho, the irregular participle of decir (to say): pluperfect, 'had said'. había, habías, había, habíamos, habíais, habían."}
      - es: "y, apeándose los cuatro de a caballo, que de muy gentil talle y disposición eran, fueron a apear a la mujer que en el sillón venía;"
        literal: "and, dismounting-themselves the four on horse, who of very fine figure and bearing were, they-went to dismount [to] the woman who on the side-saddle came;"
        ormsby: "and the four that were on horseback, who were of highbred appearance and bearing, dismounted, and came forward to take down the woman who rode on the sidesaddle,"
        vocab:
          - {w: "apearse", d: "to dismount, get down (from a horse or carriage)"}
          - {w: "apear a alguien", d: "to help someone down, lift them off a horse"}
          - {w: "de a caballo", d: "on horseback, mounted (the riders, as opposed to 'de a pie')"}
          - {w: "gentil", d: "fine, elegant, handsome (not 'gentle' or 'gentile')"}
          - {w: "talle", d: "figure, build, bearing"}
          - {w: "disposición", d: "build, physique, bearing (false friend: not 'mood')"}
        diagram:
          - s: "fueron a apear a la mujer"
            r: "main verb: they went to help the woman down"
            under:
              - s: "apeándose los cuatro de a caballo"
                r: "when: the four horsemen dismounting; they are also the subject"
                under:
                  - {s: "que de muy gentil talle y disposición eran", r: "describes 'los cuatro': who were of very fine figure and bearing"}
              - {s: "que en el sillón venía", r: "describes 'mujer': who was riding on the side-saddle"}
        forms:
          - {w: "apeándose", f: "apeando, the gerund of apear (to dismount), + se (themselves), with an accent added to keep the stress on '-an-'."}
          - {w: "eran", f: "ser (to be), imperfect, they. ser's imperfect is irregular: era, eras, era, éramos, erais, eran. The verb comes last, Latin-style."}
          - {w: "fueron a apear", f: "fu- + -eron → ir (to go), preterite, they, + 'a' + infinitive: 'went to help down'. ir's preterite is irregular (shared with ser): fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "venía", f: "ven- + -ía → venir (to come), imperfect, she. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
      - es: "y, tomándola uno dellos en sus brazos, la sentó en una silla que estaba a la entrada del aposento donde Cardenio se había escondido."
        literal: "and, taking-her one of-them in his arms, her he-sat in a chair that was at the entrance of-the room where Cardenio himself had hidden."
        ormsby: "and one of them taking her in his arms placed her in a chair that stood at the entrance of the room where Cardenio had hidden himself."
        vocab:
          - {w: "dellos", d: "= de ellos, 'of them'; Cervantes fuses 'de' with él, ella, ellos, este (dél, della, dellos, deste)"}
          - {w: "sentar a alguien", d: "to seat someone, set them down"}
          - {w: "esconderse", d: "to hide (oneself)"}
        diagram:
          - s: "la sentó"
            r: "main verb: (he) sat her down"
            under:
              - {s: "tomándola uno dellos en sus brazos", r: "how: one of them, taking her in his arms; 'uno dellos' is also the subject"}
              - s: "en una silla"
                r: "where: in a chair"
                under:
                  - s: "que estaba a la entrada del aposento"
                    r: "describes 'silla': that stood at the doorway of the room"
                    under:
                      - {s: "donde Cardenio se había escondido", r: "describes 'aposento': where Cardenio had hidden"}
        forms:
          - {w: "tomándola", f: "tomando, the gerund of tomar (to take), + la (her), with an accent added."}
          - {w: "dellos", f: "de + ellos (of them)."}
          - {w: "sus", f: "'his', plural to match 'brazos', not the owner."}
          - {w: "la sentó", f: "sent- + -ó → sentar (to seat), preterite, he, with 'la' (her) in front. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, it. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "del", f: "de + el: 'of the'."}
          - {w: "se había escondido", f: "había (haber, imperfect, he) + escondido, the participle of esconder (to hide), with 'se' (himself): pluperfect, 'had hidden himself'. había, habías, había, habíamos, habíais, habían."}
      - es: "En todo este tiempo, ni ella ni ellos se habían quitado los antifaces, ni hablado palabra alguna; sólo que, al sentarse la mujer en la silla, dio un profundo suspiro y dejó caer los brazos, como persona enferma y desmayada."
        literal: "In all this time, neither she nor they themselves had taken-off the masks, nor spoken word any; only that, at-the sitting-herself the woman in the chair, she-gave a deep sigh and let fall the arms, like person sick and fainting."
        ormsby: "All this time neither she nor they had removed their veils or spoken a word, only on sitting down on the chair the woman gave a deep sigh and let her arms fall like one that was ill and weak."
        vocab:
          - {w: "ni ... ni", d: "neither ... nor"}
          - {w: "quitarse", d: "to take off (one's clothes, mask, hat)"}
          - {w: "palabra alguna", d: "a single word; 'alguno' after the noun in a negative sentence = none at all"}
          - {w: "sólo que", d: "except that, only"}
          - {w: "al + infinitive", d: "on doing, as (someone) did; 'al sentarse' = as she sat down"}
          - {w: "dar un suspiro", d: "to heave a sigh"}
          - {w: "dejar caer", d: "to let fall, drop"}
          - {w: "desmayado", d: "faint, swooning, limp"}
        diagram:
          - s: "ni ella ni ellos se habían quitado los antifaces"
            r: "main verb 1: neither she nor they had taken off their masks"
            under:
              - {s: "En todo este tiempo", r: "when: all this time"}
              - {s: "ni hablado palabra alguna", r: "main verb 1, second half: nor spoken a single word"}
          - s: "dio un profundo suspiro"
            r: "main verb 2 (after 'sólo que'): she gave a deep sigh"
            under:
              - {s: "sólo que", r: "link: except that"}
              - {s: "al sentarse la mujer en la silla", r: "when: as the woman sat down in the chair"}
          - s: "y dejó caer los brazos"
            r: "main verb 3: and let her arms drop"
            under:
              - {s: "como persona enferma y desmayada", r: "how: like someone ill and faint"}
        forms:
          - {w: "se habían quitado", f: "habían (haber, imperfect, they) + quitado, the participle of quitar (to take off), with 'se' (from themselves): pluperfect, 'had taken off'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "hablado", f: "participle of hablar (to speak), still hanging on 'habían': 'nor had spoken'."}
          - {w: "alguna", f: "algun- + -a → alguno (any), feminine to match 'palabra'. Placed after the noun in a negative sentence it means 'not a single one'."}
          - {w: "al sentarse", f: "al (a + el) + the infinitive sentarse (to sit down): 'on sitting down'."}
          - {w: "dio", f: "di- + -o → dar (to give), preterite, she. Irregular: di, diste, dio, dimos, disteis, dieron."}
          - {w: "dejó caer", f: "dej- + -ó → dejar (to let), preterite, she, + the infinitive caer (to fall): 'let fall'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "enferma y desmayada", f: "feminine to match 'persona'; desmayada is the participle of desmayar (to faint)."}
      - es: "Los mozos de a pie llevaron los caballos a la caballeriza."
        literal: "The lads on foot took the horses to the stable."
        ormsby: "The attendants on foot then led the horses away to the stable."
        vocab:
          - {w: "mozo de a pie", d: "servant or lad who goes on foot; 'de a pie' = on foot"}
          - {w: "caballeriza", d: "stable"}
        diagram:
          - s: "llevaron"
            r: "main verb: took"
            under:
              - {s: "Los mozos de a pie", r: "subject: the servants on foot"}
              - {s: "los caballos", r: "object: the horses"}
              - {s: "a la caballeriza", r: "where to: to the stable"}
        forms:
          - {w: "llevaron", f: "llev- + -aron → llevar (to take, lead), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
  - sentences:
      - es: "Viendo esto el cura, deseoso de saber qué gente era aquella que con tal traje y tal silencio estaba, se fue donde estaban los mozos, y a uno dellos le preguntó lo que ya deseaba; el cual le respondió:"
        literal: "Seeing this the priest, desirous of knowing what people was that which with such dress and such silence was, himself went where were the lads, and [to] one of-them to-him he-asked that which already he-desired; the which to-him answered:"
        ormsby: "Observing this the curate, curious to know who these people in such a dress and preserving such silence were, went to where the servants were standing and put the question to one of them, who answered him."
        vocab:
          - {w: "deseoso de", d: "eager to, wanting to"}
          - {w: "traje", d: "dress, garb, costume"}
          - {w: "irse donde", d: "to go (off) to where; 'donde' without 'a' = to the place where"}
          - {w: "lo que ya deseaba", d: "what he already wanted (to know)"}
          - {w: "el cual", d: "who, which (formal relative; here 'and he')"}
        diagram:
          - s: "se fue donde estaban los mozos"
            r: "main verb 1: he went to where the servants were"
            under:
              - s: "Viendo esto el cura"
                r: "when: the priest, seeing this; 'el cura' is also the subject"
                under:
                  - s: "deseoso de saber qué gente era aquella"
                    r: "why: wanting to know what people those were"
                    under:
                      - {s: "que con tal traje y tal silencio estaba", r: "describes 'aquella': that went about so dressed and so silent"}
          - s: "y a uno dellos le preguntó"
            r: "main verb 2: and asked one of them"
            under:
              - {s: "lo que ya deseaba", r: "object: what he already wanted to know"}
          - s: "el cual le respondió:"
            r: "main verb 3: who answered him"
        forms:
          - {w: "Viendo", f: "gerund of ver (to see): 'seeing'; its subject 'el cura' follows."}
          - {w: "deseoso", f: "dese- + -oso → from desear (to desire): 'desirous, eager'. -oso makes adjectives 'full of'."}
