summary: |
  A party arrives at the inn: four masked horsemen, a woman in white on a side-saddle with her face veiled, and two servants on foot. Dorotea covers her face and Cardenio hides in Don Quijote's room. The priest questions a servant, who knows only that the leader is a man of rank and that the lady sighs constantly and seems to be going unwillingly, perhaps to a convent. When Dorotea kindly offers to help the lady, the leader says she will only tell lies; the lady answers that her truthfulness has brought her to this, and his falseness.

  Cardenio, behind the door, recognizes the voice and cries out. The lady tries to go to him; her veil falls, the leader's falls too, and Dorotea sees that he is Don Fernando and the lady Luscinda. Dorotea faints into the barber's arms, Cardenio rushes out, and all four stand staring at one another. Luscinda begs Fernando to let her go to her true husband or kill her.

  Dorotea kneels at Fernando's feet and makes a long plea: she is the humble farmer's daughter he swore to marry; he cannot belong to Luscinda, who is Cardenio's, and true nobility lies in virtue. Moved, Fernando releases Luscinda, who falls into Cardenio's arms. When Fernando seems to reach for his sword, Dorotea clasps his knees and begs him to let the lovers be. The priest, the barber, Sancho and Fernando's friends all add their arguments, and Fernando gives way, raises Dorotea and accepts her as his wife.

  Everyone weeps, Sancho included, though he later says he wept only because Dorotea was not the queen Micomicona. Cardenio and Luscinda thank Fernando on their knees. Dorotea tells her story again, and Fernando tells his: after the failed wedding he learned Luscinda had fled to a convent, broke in with three companions, carried her off, and so came to the inn, which for him is heaven.
context: |
  Rank and marriage. The resolution turns on the social gap between Dorotea, the daughter of rich farmers who are vassals of Fernando's father, the duke, and Fernando, a grandee's younger son. Her plea and the priest's both rest on accepted facts: nobility passed through the father, so a nobleman lost nothing by marrying a commoner, and a promise of marriage before a witness bound the conscience. Against this stands the practice of placing unwanted or inconvenient daughters in convents, which is how the servant explains the veiled lady.

  Literary models. The scene is the knot of the Italianate 'novela' that runs through these chapters: two pairs of lovers separated by a seducer, disguises, a chance meeting at an inn, recognitions by voice, faints, tears and set speeches. The coincidence is so great that the characters themselves call it Providence. It is the opposite world to Don Quijote's books of chivalry, and he sleeps through the whole of it.

  The narrator's games. The tone is high, but small touches undercut it: the innkeeper's 'gaudeamus' at the sight of paying guests, the aside that Fernando's heart softened because it was fed on noble blood, Sancho's tears for a lost kingdom, and the inn called heaven. Ormsby notes a slip of haste: Dorotea has just fainted, yet she is counted among those standing dumbstruck. He also notes that the first edition has 'firma que hiciste' (the signature you made), though in Dorotea's story Fernando gave her a ring, not a written promise. The Spanish chapter heading here belongs to the wineskin battle, which comes at the start of the previous chapter; Ormsby, like most modern editors, swaps the two headings, and this file uses his.

  Religion and law. Dorotea speaks like an advocate: Fernando cannot plead 'engaño' (deception), the ground for annulling a promise, because he knew her rank. The priest appeals to Christian duty and to the idea that God, not chance, has brought them together. Fernando's raid on the convent was both abduction and sacrilege, which his rank allows him to recount as an adventure.

  Names. Micomicona, the princess Dorotea played for the priest's plan to bring Don Quijote home, is the joke name that vanishes with her disguise, and with it Sancho's hopes of a governorship.

  Reading Cervantes' Spanish. The speeches use 'tú' and 'vos' with meaning: Dorotea says 'tú' to Fernando as a wife, Luscinda 'vos' to Cardenio, Fernando 'vos' to Dorotea once he has accepted her. The old spellings are many: ansimesmo, asimesmo, mesmo, efeto, estraño, estremo, proprio, monesterio, inremediable, impedimiento, decendencias, captiva, acetar, reprehender, prosupuesto, yedra, luengo, heciste. Watch -rl- turned -ll- (replicalle, ponella, cumplille, traella), pronouns hung on the verb (dígolo, Teníala, Escuchóla, Parecióle, quisístelo, mirábanse), the -ra subjunctive as a conditional (diera, fuera, hiciera, pudiera), the future subjunctive (quisiere), the past anterior after 'apenas' and 'así como' (hubo conocido, hubo acabado), and 'como' + subjunctive for 'provided that'. False friends: razones (words), discreción (good sense), honestidad (chastity), suceso (event), admiración (wonder), ofender (to attack), ignorar (not to know), calidad (rank), otro día (the next day).
