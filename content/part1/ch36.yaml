          - {w: "conocerle", f: "conocer (to recognize) + le (him); 'le' for a male person is leísmo."}
          - {w: "asegurándose", f: "asegurando, the gerund of asegurar (to make sure), + se, accent added."}
          - {w: "era", f: "ser (to be), imperfect, he. era, eras, era, éramos, erais, eran."}
          - {w: "ningún", f: "ninguno clipped before a masculine singular noun ('respeto')."}
          - {w: "echó", f: "ech- + -ó → echar (to throw), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "juntando", f: "gerund of juntar (to join)."}
          - {w: "el de Cardenio", f: "'that of Cardenio': 'el' stands for 'rostro'."}
          - {w: "le dijo", f: "dij- + -o → decir (to say), preterite, she, with 'le' (to him). Same irregular preterite: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Vos sí, señor mío, sois el verdadero dueño desta vuestra captiva, aunque más lo impida la contraria suerte, y, aunque más amenazas le hagan a esta vida que en la vuestra se sustenta."
        literal: "— You yes, lord mine, are the true master of-this your captive, although more it may-hinder the contrary luck, and, although more threats to-it they-make to this life that in the yours itself sustains."
        ormsby: "“Yes, my dear lord, you are the true master of this your slave, even though adverse fate interpose again, and fresh dangers threaten this life that hangs on yours.”"
        vocab:
          - {w: "dueño", d: "master, owner (used by lovers in courtly speech)"}
          - {w: "captivo", d: "= cautivo, captive, slave (old spelling 'captiva')"}
          - {w: "aunque más", d: "however much, even if ... more"}
          - {w: "impedir", d: "to prevent, hinder"}
          - {w: "contraria suerte", d: "adverse fortune"}
          - {w: "amenaza", d: "threat"}
          - {w: "sustentarse en", d: "to be sustained by, live on"}
        diagram:
          - s: "Vos sí, señor mío, sois el verdadero dueño desta vuestra captiva"
            r: "main verb: you, my lord, are the true master of this your captive"
            under:
              - {s: "aunque más lo impida la contraria suerte", r: "concession 1: however much adverse fate may hinder it"}
              - s: "y, aunque más amenazas le hagan a esta vida"
                r: "concession 2: and however many threats they make against this life"
                under:
                  - {s: "que en la vuestra se sustenta", r: "describes 'vida': that lives on yours"}
        forms:
          - {w: "Vos sí", f: "'you, yes, you': 'sí' with the accent stresses 'vos'. Luscinda uses 'vos', the respectful lovers' address, where Fernando and Dorotea used 'tú'."}
          - {w: "sois", f: "ser (to be), present, you (vos). soy, eres, es, somos, sois, son."}
          - {w: "desta vuestra captiva", f: "desta = de + esta; vuestra (your), feminine; captiva = cautiva (captive), the Latinate spelling with -pt-."}
          - {w: "impida", f: "impid- + -a → impedir (to hinder), present subjunctive, it, after 'aunque más'. impedir changes e to i: impida, impidas, impida, impidamos, impidáis, impidan."}
          - {w: "hagan", f: "hag- + -an → hacer (to make), present subjunctive, they (impersonal). haga, hagas, haga, hagamos, hagáis, hagan."}
          - {w: "la vuestra", f: "vuestro (yours), feminine to match 'vida'."}
          - {w: "se sustenta", f: "sustent- + -a → sustentarse (to live on), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
  - sentences:
      - es: "Estraño espectáculo fue éste para don Fernando y para todos los circunstantes, admirándose de tan no visto suceso."
        literal: "Strange spectacle was this for Don Fernando and for all the bystanders, marveling-themselves at so not seen event."
        ormsby: "A strange sight was this for Don Fernando and those that stood around, filled with surprise at an incident so unlooked for."
        vocab:
          - {w: "estraño", d: "= extraño, strange (old spelling)"}
          - {w: "circunstantes", d: "bystanders, those present"}
          - {w: "admirarse de", d: "to be amazed at, marvel at"}
          - {w: "no visto", d: "unheard-of, never seen before"}
          - {w: "suceso", d: "event, happening (false friend: not 'success')"}
        diagram:
          - s: "Estraño espectáculo fue éste"
            r: "main verb: this was a strange sight"
            under:
              - {s: "para don Fernando y para todos los circunstantes", r: "for whom: for Don Fernando and all the bystanders"}
              - {s: "admirándose de tan no visto suceso", r: "how they felt: marvelling at so unheard-of an event"}
        forms:
          - {w: "Estraño", f: "= extraño: Cervantes writes 's' for 'x' before a consonant (estraño, estremo)."}
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, it. fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "éste", f: "este (this), masculine to match 'espectáculo', with the accent of a pronoun."}
          - {w: "admirándose", f: "admirando, the gerund of admirar (to amaze), + se, accent added: 'marvelling'."}
          - {w: "visto", f: "irregular participle of ver (to see); 'no visto' = never seen."}
      - es: "Parecióle a Dorotea que don Fernando había perdido la color del rostro y que hacía ademán de querer vengarse de Cardenio, porque le vio encaminar la mano a ponella en la espada;"
        literal: "It-seemed-to-her to Dorotea that Don Fernando had lost the color of-the face and that he-was-making gesture of wanting to-avenge-himself on Cardenio, because him she-saw direct the hand to put-it on the sword;"
        ormsby: "Dorothea fancied that Don Fernando changed colour and looked as though he meant to take vengeance on Cardenio, for she observed him put his hand to his sword;"
        vocab:
          - {w: "la color", d: "colour; 'color' was often feminine in Cervantes' day"}
          - {w: "hacer ademán de", d: "to make as if to, show signs of"}
          - {w: "vengarse de", d: "to take revenge on"}
          - {w: "encaminar", d: "to direct, move towards"}
          - {w: "ponella", d: "= ponerla, to put it; -rl- becomes -ll-"}
        diagram:
          - s: "Parecióle a Dorotea"
            r: "main verb: it seemed to Dorotea"
            under:
              - {s: "que don Fernando había perdido la color del rostro", r: "what 1: that Don Fernando had lost the colour in his face"}
              - {s: "y que hacía ademán de querer vengarse de Cardenio", r: "what 2: and that he was making as if to take revenge on Cardenio"}
              - {s: "porque le vio encaminar la mano a ponella en la espada", r: "why: because she saw him move his hand to put it on his sword"}
        forms:
          - {w: "Parecióle", f: "parec- + -ió + le → parecer (to seem), preterite, it, with 'le' (to her) stuck on the end; modern 'le pareció'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "había perdido", f: "había (haber, imperfect, he) + perdido, participle of perder (to lose): 'had lost'. había, habías, había, habíamos, habíais, habían."}
          - {w: "hacía", f: "hac- + -ía → hacer (to make), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "vengarse", f: "vengar (to avenge) + se (himself), infinitive after 'querer'."}
          - {w: "le vio", f: "vi- + -o → ver (to see), preterite, she, with 'le' (him, leísmo). vi, viste, vio, vimos, visteis, vieron."}
          - {w: "ponella", f: "poner (to put) + la (it, the hand): the -r and the l merge into -ll- (ponerla → ponella)."}
      - es: "y, así como lo pensó, con no vista presteza se abrazó con él por las rodillas, besándoselas y teniéndole apretado, que no le dejaba mover, y, sin cesar un punto de sus lágrimas, le decía:"
        literal: "and, as-soon as it she-thought, with not seen quickness herself she-clasped with him by the knees, kissing-to-him-them and holding-him squeezed, so-that not him she-let move, and, without ceasing a point from her tears, to-him she-was-saying:"
        ormsby: "and the instant the idea struck her, with wonderful quickness she clasped him round the knees, and kissing them and holding him so as to prevent his moving, she said, while her tears continued to flow,"
        vocab:
          - {w: "presteza", d: "speed, quickness"}
          - {w: "abrazarse con", d: "to clasp, throw one's arms round"}
          - {w: "rodilla", d: "knee"}
          - {w: "apretado", d: "held tight"}
          - {w: "cesar de", d: "to stop, cease"}
          - {w: "un punto", d: "for a moment"}
        diagram:
          - s: "se abrazó con él por las rodillas"
            r: "main verb 1: she clasped him by the knees"
            under:
              - {s: "así como lo pensó", r: "when: as soon as she thought it"}
              - {s: "con no vista presteza", r: "how: with unheard-of speed"}
              - {s: "besándoselas y teniéndole apretado", r: "how: kissing them and holding him tight"}
              - {s: "que no le dejaba mover", r: "result: so that she would not let him move"}
          - s: "le decía:"
            r: "main verb 2 (after 'y'): she said to him"
            under:
              - {s: "sin cesar un punto de sus lágrimas", r: "how: without stopping her tears for a moment"}
        forms:
          - {w: "pensó", f: "pens- + -ó → pensar (to think), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "vista", f: "irregular participle of ver (to see), feminine to match 'presteza': 'no vista' = never seen."}
          - {w: "se abrazó", f: "abraz- + -ó → abrazarse (to clasp), preterite, she. Same -ar preterite."}
          - {w: "besándoselas", f: "besando, the gerund of besar (to kiss), + se (his, 'to him') + las (them, the knees), accent added. 'le' turns into 'se' before 'las'."}
          - {w: "teniéndole apretado", f: "teniendo, the gerund of tener (to hold), + le (him), + apretado (squeezed), masculine to match him."}
          - {w: "dejaba", f: "dej- + -aba → dejar (to let), imperfect, she. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "le decía", f: "dec- + -ía → decir (to say), imperfect, she, with 'le' (to him). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
  - sentences:
      - es: "— ¿Qué es lo que piensas hacer, único refugio mío, en este tan impensado trance?"
        literal: "— What is it that you-think to-do, only refuge mine, in this so unthought-of moment?"
        ormsby: "“What is it thou wouldst do, my only refuge, in this unforeseen event?"
        vocab:
          - {w: "pensar + infinitive", d: "to intend to, mean to"}
          - {w: "refugio", d: "refuge"}
          - {w: "impensado", d: "unexpected, unforeseen"}
          - {w: "trance", d: "critical moment, crisis"}
        diagram:
          - s: "¿Qué es lo"
            r: "main verb: what is it"
            under:
              - {s: "que piensas hacer", r: "describes 'lo': that you mean to do"}
              - {s: "único refugio mío", r: "address: my only refuge"}
              - {s: "en este tan impensado trance?", r: "when: at this unforeseen moment"}
        forms:
          - {w: "piensas", f: "piens- + -as → pensar (to intend), present, you. The stem e becomes ie when stressed: pienso, piensas, piensa, pensamos, pensáis, piensan."}
          - {w: "hacer", f: "infinitive (to do) after 'pensar': 'intend to do'."}
          - {w: "único ... mío", f: "masculine to match 'refugio'; mío after the noun."}
          - {w: "impensado", f: "in- + pensado (participle of pensar): 'unthought-of'."}
      - es: "Tú tienes a tus pies a tu esposa, y la que quieres que lo sea está en los brazos de su marido."
        literal: "You have at your feet [to] your wife, and she whom you-want that it she-be is in the arms of her husband."
        ormsby: "Thou hast thy wife at thy feet, and she whom thou wouldst have for thy wife is in the arms of her husband:"
        vocab:
          - {w: "esposa", d: "wife (also betrothed)"}
          - {w: "marido", d: "husband"}
        diagram:
          - s: "Tú tienes a tus pies a tu esposa"
            r: "main verb 1: you have your wife at your feet"
          - s: "y la ... está en los brazos de su marido"
            r: "main verb 2: and the one ... is in her husband's arms"
            under:
              - {s: "que quieres que lo sea", r: "describes 'la': whom you want to be (your wife)"}
        forms:
          - {w: "tienes", f: "tien- + -es → tener (to have), present, you. tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "a tu esposa", f: "the 'a' that marks a person as object."}
          - {w: "quieres", f: "quier- + -es → querer (to want), present, you. quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "lo sea", f: "se- + -a → ser (to be), present subjunctive, she, after 'quieres que'; 'lo' = it (your wife). sea, seas, sea, seamos, seáis, sean."}
          - {w: "está", f: "est- + -á → estar (to be), present, she. estoy, estás, está, estamos, estáis, están."}
      - es: "Mira si te estará bien o te será posible deshacer lo que el cielo ha hecho, o si te convendrá querer levantar a igualar a ti mismo a la que, pospuesto todo inconveniente, confirmada en su verdad y firmeza, delante de tus ojos tiene los suyos, bañados de licor amoroso el rostro y pecho de su verdadero esposo."
        literal: "Look if to-you it-will-be well or to-you it-will-be possible to-undo that which the heaven has done, or if to-you it-will-suit to-want to-raise to equal to you yourself [to] her who, set-aside every obstacle, confirmed in her truth and firmness, before of your eyes has the hers, bathed with liquor loving the face and breast of her true husband."
        ormsby: "reflect whether it will be right for thee, whether it will be possible for thee to undo what Heaven has done, or whether it will be becoming in thee to seek to raise her to be thy mate who in spite of every obstacle, and strong in her truth and constancy, is before thine eyes, bathing with the tears of love the face and bosom of her lawful husband."
        vocab:
          - {w: "estar bien a alguien", d: "to suit someone, be fitting for them"}
          - {w: "deshacer", d: "to undo"}
          - {w: "convenir", d: "to be fitting, advisable"}
          - {w: "igualar a sí", d: "to make equal to oneself (by marriage)"}
          - {w: "pospuesto", d: "set aside, put behind (participle of posponer)"}
          - {w: "inconveniente", d: "obstacle, difficulty"}
          - {w: "licor amoroso", d: "loving liquid, i.e. tears (a high-style periphrasis)"}
          - {w: "pecho", d: "breast, chest"}
        diagram:
          - s: "Mira"
            r: "main verb: consider"
            under:
              - s: "si te estará bien o te será posible deshacer lo"
                r: "whether 1: whether it will suit you or be possible to undo what"
                under:
                  - {s: "que el cielo ha hecho", r: "describes 'lo': that heaven has done"}
              - s: "o si te convendrá querer levantar a igualar a ti mismo a la"
                r: "whether 2: or whether it will become you to raise to your level the woman"
                under:
                  - s: "que ... delante de tus ojos tiene los suyos"
                    r: "describes 'la': who, before your eyes, has hers"
                    under:
                      - {s: "pospuesto todo inconveniente", r: "how 1: every obstacle set aside"}
                      - {s: "confirmada en su verdad y firmeza", r: "how 2: confirmed in her truth and constancy"}
                      - {s: "bañados de licor amoroso el rostro y pecho de su verdadero esposo", r: "describes 'los suyos' (her eyes): bathing her true husband's face and breast with loving tears"}
        forms:
          - {w: "Mira", f: "mir- + -a → mirar (to look, consider), tú command (same as the he-form of the present)."}
          - {w: "estará, será, convendrá", f: "future, it: estar- + -á, ser- + -á, and convendr- + -á from convenir (to suit), which shortens and adds d. The future adds -é, -ás, -á, -emos, -éis, -án to the infinitive."}
          - {w: "deshacer", f: "des- + hacer (to do): 'to undo'."}
          - {w: "ha hecho", f: "ha (haber, present, it) + hecho, the irregular participle of hacer (to do): 'has done'. he, has, ha, hemos, habéis, han."}
          - {w: "a ti mismo", f: "'to yourself': ti after a preposition, mismo for emphasis."}
          - {w: "pospuesto", f: "irregular participle of posponer (to set aside), masculine to match 'inconveniente', in an absolute phrase."}
          - {w: "confirmada", f: "participle of confirmar, feminine to match 'la que' (Luscinda)."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, she. tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "los suyos", f: "suyo (hers), masculine plural to match 'ojos' understood."}
          - {w: "bañados", f: "participle of bañar (to bathe), masculine plural to match 'los suyos' (her eyes): her eyes bathing his face."}
      - es: "Por quien Dios es te ruego, y por quien tú eres te suplico, que este tan notorio desengaño no sólo no acreciente tu ira, sino que la mengüe en tal manera, que con quietud y sosiego permitas que estos dos amantes le tengan, sin impedimiento tuyo, todo el tiempo que el cielo quisiere concedérsele;"
        literal: "By who God is I-beg you, and by who you are I-implore you, that this so manifest undeceiving not only not may-increase your anger, but that it may-lessen in such manner, that with quiet and calm you-may-allow that these two lovers it may-have, without hindrance yours, all the time that the heaven may-wish to-grant-them-it;"
        ormsby: "For God’s sake I entreat of thee, for thine own I implore thee, let not this open manifestation rouse thy anger; but rather so calm it as to allow these two lovers to live in peace and quiet without any interference from thee so long as Heaven permits them;"
        vocab:
          - {w: "por quien Dios es", d: "for God's sake (literally 'by who God is'), a set oath"}
          - {w: "por quien tú eres", d: "by your own honour, for your own sake"}
          - {w: "suplicar", d: "to implore, beseech"}
          - {w: "notorio", d: "evident, public, manifest"}
          - {w: "desengaño", d: "disillusionment, the plain truth revealed"}
          - {w: "acrecentar", d: "to increase"}
          - {w: "menguar", d: "to lessen, diminish"}
          - {w: "sosiego", d: "calm, peace"}
          - {w: "impedimiento", d: "= impedimento, hindrance (old form)"}
          - {w: "conceder", d: "to grant"}
        diagram:
          - s: "te ruego ... te suplico"
            r: "main verbs: I beg you, I implore you"
            under:
              - {s: "Por quien Dios es", r: "by what 1: for God's sake"}
              - {s: "y por quien tú eres", r: "by what 2: by who you are"}
              - {s: "que este tan notorio desengaño no sólo no acreciente tu ira", r: "what 1: that this plain truth not increase your anger"}
              - s: "sino que la mengüe en tal manera"
                r: "what 2: but lessen it so much"
                under:
                  - s: "que con quietud y sosiego permitas"
                    r: "result: that you calmly allow"
                    under:
                      - {s: "que estos dos amantes le tengan, sin impedimiento tuyo", r: "what: that these two lovers have it (quiet), with no hindrance from you"}
                      - {s: "todo el tiempo que el cielo quisiere concedérsele", r: "how long: as long as heaven may wish to grant it to them"}
        forms:
          - {w: "es, eres", f: "ser (to be), present, he / you. soy, eres, es, somos, sois, son."}
          - {w: "ruego, suplico", f: "rueg- + -o → rogar (to beg; o becomes ue when stressed: ruego, ruegas, ruega, rogamos, rogáis, ruegan); suplic- + -o → suplicar (to implore), present, I."}
          - {w: "acreciente", f: "acrecient- + -e → acrecentar (to increase), present subjunctive, it, after 'ruego que'. e becomes ie when stressed: acreciente, acrecientes, acreciente, acrecentemos, acrecentéis, acrecienten."}
          - {w: "la mengüe", f: "mengü- + -e → menguar (to lessen), present subjunctive, it, with 'la' (it, the anger). The dieresis keeps the u sounded before e. Present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "permitas", f: "permit- + -as → permitir (to allow), present subjunctive, you, in a result clause still hanging on 'ruego'. The -er and -ir subjunctive: -a, -as, -a, -amos, -áis, -an."}
          - {w: "le tengan", f: "teng- + -an → tener (to have), present subjunctive, they, with 'le' (it, the quiet; leísmo). tenga, tengas, tenga, tengamos, tengáis, tengan."}
          - {w: "tuyo", f: "'yours', masculine to match 'impedimiento': 'hindrance of yours'."}
          - {w: "quisiere", f: "quis- + -iere → querer (to want), future subjunctive, it: 'may wish'. quisiere, quisieres, quisiere, quisiéremos, quisiereis, quisieren. Used for an open future; modern Spanish says 'quiera'."}
          - {w: "concedérsele", f: "conceder (to grant) + se (to them, impersonal or 'les' turned 'se') + le (it), accent added."}
      - es: "y en esto mostrarás la generosidad de tu ilustre y noble pecho, y verá el mundo que tiene contigo más fuerza la razón que el apetito."
        literal: "and in this you-will-show the generosity of your illustrious and noble breast, and will-see the world that has with-you more force the reason than the appetite."
        ormsby: "and in so doing thou wilt prove the generosity of thy lofty noble spirit, and the world shall see that with thee reason has more influence than passion.”"
        vocab:
          - {w: "generosidad", d: "nobility of spirit, magnanimity (from 'generoso', well-born)"}
          - {w: "pecho", d: "breast, heart, spirit"}
          - {w: "apetito", d: "appetite, desire, passion (opposed to reason)"}
        diagram:
          - {s: "en esto mostrarás la generosidad de tu ilustre y noble pecho", r: "main verb 1: by this you will show the nobility of your heart"}
          - s: "y verá el mundo"
            r: "main verb 2: and the world will see"
            under:
              - {s: "que tiene contigo más fuerza la razón que el apetito", r: "what: that in you reason is stronger than desire"}
        forms:
          - {w: "mostrarás", f: "mostrar- + -ás → mostrar (to show), future, you. The future adds -é, -ás, -á, -emos, -éis, -án to the infinitive."}
          - {w: "ilustre y noble", f: "one form for both genders; singular to match 'pecho'."}
          - {w: "verá", f: "ver- + -á → ver (to see), future, it (the world). Same future endings."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, it. tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "contigo", f: "con + ti fused: 'with you' (also conmigo, consigo)."}
        note: "Reason against appetite is the moral frame of the whole Cardenio-Dorotea story: the nobleman ruled by appetite must be brought back to reason, and Dorotea's speeches do it with the rhetoric of a sermon."
  - sentences:
