          - {w: "volverse", d: "to go back, return"}
          - {w: "adonde", d: "to where"}
          - {w: "embozado", d: "muffled, with the face covered by a cloak or veil; 'la embozada' = the veiled woman"}
          - {w: "movido de", d: "moved by ('de' marks the cause, where modern Spanish often uses 'por')"}
          - {w: "llegarse a", d: "to go up to, approach"}
        diagram:
          - s: "se volvió"
            r: "main verb: he (the priest) went back"
            under:
              - {s: "dejándolos", r: "when: leaving them"}
              - s: "adonde estaba Dorotea"
                r: "where to: to where Dorotea was"
                under:
                  - s: "la cual ... se llegó a ella"
                    r: "describes 'Dorotea': who went up to her"
                    under:
                      - {s: "como había oído suspirar a la embozada", r: "why: since she had heard the veiled lady sigh"}
                      - {s: "movida de natural compasión", r: "how: moved by natural compassion"}
                      - {s: "y le dijo:", r: "and said to her"}
        forms:
          - {w: "dejándolos", f: "dejando, the gerund of dejar (to leave), + los (them), with an accent added."}
          - {w: "se volvió", f: "volv- + -ió → volverse (to go back), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, she. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "había oído", f: "había (haber, imperfect, she) + oído, the participle of oír (to hear): pluperfect, 'had heard'. había, habías, había, habíamos, habíais, habían."}
          - {w: "suspirar", f: "infinitive (to sigh) after 'oír': 'heard (her) sigh'."}
          - {w: "embozada, movida", f: "participles of embozar (to muffle) and mover (to move), feminine: 'embozada' as a noun (the veiled woman), 'movida' agreeing with Dorotea."}
          - {w: "se llegó", f: "lleg- + -ó → llegarse (to go up to), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "le dijo", f: "dij- + -o → decir (to say), preterite, she, with 'le' (to her). Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— ¿Qué mal sentís, señora mía? Mirad si es alguno de quien las mujeres suelen tener uso y experiencia de curarle, que de mi parte os ofrezco una buena voluntad de serviros."
        literal: "— What ill do-you-feel, lady mine? Look if it-is any of which the women are-accustomed to-have use and experience of curing-it, for on my part to-you I-offer a good will of serving-you."
        ormsby: "“What are you suffering from, señora? If it be anything that women are accustomed and know how to relieve, I offer you my services with all my heart.”"
        vocab:
          - {w: "mal", d: "illness, ailment, pain (as a noun)"}
          - {w: "sentir", d: "to feel, suffer from"}
          - {w: "señora mía", d: "my lady; polite address, the possessive after the noun"}
          - {w: "soler", d: "to be in the habit of, usually (do)"}
          - {w: "tener uso y experiencia de", d: "to be practised and experienced in"}
          - {w: "curar", d: "to treat, nurse, look after (not necessarily 'cure')"}
          - {w: "de mi parte", d: "for my part, on my side"}
          - {w: "buena voluntad", d: "goodwill, willingness"}
        diagram:
          - s: "¿Qué mal sentís, señora mía?"
            r: "question: what ails you, my lady?"
          - s: "Mirad"
            r: "main verb: look, consider"
            under:
              - s: "si es alguno"
                r: "whether: whether it is one (an ailment)"
                under:
                  - {s: "de quien las mujeres suelen tener uso y experiencia de curarle", r: "describes 'alguno': which women are used to treating"}
              - {s: "que de mi parte os ofrezco una buena voluntad de serviros", r: "why I ask: for I, for my part, offer you my willing service"}
        forms:
          - {w: "sentís", f: "sent- + -ís → sentir (to feel), present, you (polite 'vos'). sentir changes e to ie when stressed: siento, sientes, siente, sentimos, sentís, sienten."}
          - {w: "Mirad", f: "mir- + -ad → mirar (to look), command, you (vosotros or polite 'vos'). The -ar plural command ends in -ad: mirad, hablad, tomad."}
          - {w: "quien", f: "here 'which', of a thing (the ailment); old Spanish uses 'quien' for things too."}
          - {w: "suelen", f: "suel- + -en → soler (to usually do), present, they. The o becomes ue when stressed: suelo, sueles, suele, solemos, soléis, suelen."}
          - {w: "curarle", f: "curar (to treat) + le (it, the ailment), the pronoun on the infinitive; 'le' for a masculine thing as object is Castilian leísmo."}
          - {w: "ofrezco", f: "ofrezc- + -o → ofrecer (to offer), present, I. Verbs in -ecer add z before c in the I-form: ofrezco, ofreces, ofrece, ofrecemos, ofrecéis, ofrecen."}
          - {w: "serviros", f: "servir (to serve) + os (you), the pronoun on the infinitive."}
  - sentences:
      - es: "A todo esto callaba la lastimada señora; y, aunque Dorotea tornó con mayores ofrecimientos, todavía se estaba en su silencio, hasta que llegó el caballero embozado que dijo el mozo que los demás obedecían, y dijo a Dorotea:"
        literal: "To all this was-silent the afflicted lady; and, although Dorotea returned with greater offers, still herself she-stayed in her silence, until that arrived the gentleman veiled who said the lad that the others obeyed, and said to Dorotea:"
        ormsby: "To this the unhappy lady made no reply; and though Dorothea repeated her offers more earnestly she still kept silence, until the gentleman with the veil, who, the servant said, was obeyed by the rest, approached and said to Dorothea,"
        vocab:
          - {w: "a todo esto", d: "to all this, meanwhile"}
          - {w: "callar", d: "to be silent, say nothing"}
          - {w: "lastimado", d: "afflicted, grieving, pitiable"}
          - {w: "tornar", d: "to return, go back; 'tornar con' = come back with, repeat"}
          - {w: "ofrecimiento", d: "offer"}
          - {w: "todavía", d: "still, even so"}
          - {w: "estarse en", d: "to remain in, keep to"}
          - {w: "caballero", d: "gentleman, man of rank (also 'knight')"}
          - {w: "obedecer", d: "to obey"}
        diagram:
          - s: "callaba la lastimada señora"
            r: "main verb 1: the grieving lady said nothing"
            under:
              - {s: "A todo esto", r: "to what: to all this"}
          - s: "todavía se estaba en su silencio"
            r: "main verb 2: she still kept silent"
            under:
              - {s: "aunque Dorotea tornó con mayores ofrecimientos", r: "concession: although Dorotea repeated her offers more warmly"}
              - s: "hasta que llegó el caballero embozado"
                r: "until: until the veiled gentleman came up"
                under:
                  - {s: "que dijo el mozo que los demás obedecían", r: "describes 'caballero': whom (the lad said) the others obeyed"}
                  - {s: "y dijo a Dorotea:", r: "and said to Dorotea"}
        forms:
          - {w: "callaba", f: "call- + -aba → callar (to be silent), imperfect, she. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "lastimada", f: "participle of lastimar (to hurt), feminine to match 'señora', before the noun."}
          - {w: "tornó", f: "torn- + -ó → tornar (to return), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "mayores", f: "mayor (greater) + -es, plural to match 'ofrecimientos'."}
          - {w: "se estaba", f: "est- + -aba → estarse (to stay), imperfect, she; 'se' stresses staying put. Same -aba imperfect."}
          - {w: "llegó", f: "lleg- + -ó → llegar (to arrive, come up), preterite, he. Same -ar preterite."}
          - {w: "embozado", f: "participle of embozar (to muffle the face), masculine to match 'caballero'."}
          - {w: "que dijo el mozo que los demás obedecían", f: "a relative clause with a clause inside it: 'whom the lad said the others obeyed'. dijo: decir (to say), preterite, he (dije, dijiste, dijo, dijimos, dijisteis, dijeron); obedecían: obedec- + -ían → obedecer (to obey), imperfect, they (-ía, -ías, -ía, -íamos, -íais, -ían)."}
  - sentences:
      - es: "— No os canséis, señora, en ofrecer nada a esa mujer, porque tiene por costumbre de no agradecer cosa que por ella se hace, ni procuréis que os responda, si no queréis oír alguna mentira de su boca."
        literal: "— Not yourself tire, lady, in offering anything to that woman, because she-has for custom of not to-thank-for thing that for her is done, nor try that to-you she-answer, if not you-want to-hear some lie from her mouth."
        ormsby: "“Do not give yourself the trouble, señora, of making any offers to that woman, for it is her way to give no thanks for anything that is done for her; and do not try to make her answer unless you want to hear some lie from her lips.”"
        vocab:
          - {w: "cansarse en", d: "to tire oneself out doing, bother to"}
          - {w: "tener por costumbre", d: "to be in the habit of"}
          - {w: "agradecer", d: "to be grateful for, thank for"}
          - {w: "procurar", d: "to try, endeavour (not 'procure')"}
          - {w: "mentira", d: "lie"}
        diagram:
          - s: "No os canséis"
            r: "main verb 1: don't trouble yourself"
            under:
              - {s: "señora", r: "address"}
              - {s: "en ofrecer nada a esa mujer", r: "in what: offering anything to that woman"}
              - s: "porque tiene por costumbre de no agradecer cosa"
                r: "why: because she makes a habit of thanking for nothing"
                under:
                  - {s: "que por ella se hace", r: "describes 'cosa': that is done for her"}
          - s: "ni procuréis"
            r: "main verb 2: nor try"
            under:
              - {s: "que os responda", r: "what: (to get) her to answer you"}
              - {s: "si no queréis oír alguna mentira de su boca", r: "condition: unless you want to hear a lie from her mouth"}
        forms:
          - {w: "No os canséis", f: "cans- + -éis → cansarse (to tire oneself), present subjunctive, you (polite 'vos'), with 'os' (yourself): a negative command uses the subjunctive. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "esa", f: "ese (that), feminine to match 'mujer'; a little contemptuous here."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, she. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "se hace", f: "hac- + -e → hacer (to do), present, it, with 'se' making it passive: 'is done'. hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "procuréis", f: "procur- + -éis → procurar (to try), present subjunctive, you, again a negative command after 'ni'. Same -e subjunctive."}
          - {w: "responda", f: "respond- + -a → responder (to answer), present subjunctive, she, after 'procurar que'. The present subjunctive of -er and -ir verbs: -a, -as, -a, -amos, -áis, -an."}
          - {w: "queréis", f: "quer- + -éis → querer (to want), present, you. quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "alguna", f: "algun- + -a → alguno (some), feminine to match 'mentira'."}
  - sentences:
      - es: "— Jamás la dije —dijo a esta sazón la que hasta allí había estado callando—;"
        literal: "— Never it I-said —said at this moment she who until there had been keeping-silent—;"
        ormsby: "“I have never told a lie,” was the immediate reply of her who had been silent until now;"
        vocab:
          - {w: "jamás", d: "never"}
          - {w: "a esta sazón", d: "at this moment, just then"}
          - {w: "hasta allí", d: "until then"}
        diagram:
          - s: "Jamás la dije"
            r: "what she said: I never told one (a lie)"
          - s: "dijo"
            r: "main verb: said"
            under:
              - {s: "a esta sazón", r: "when: at that moment"}
              - s: "la"
                r: "subject: she"
                under:
                  - {s: "que hasta allí había estado callando", r: "describes 'la': who had been silent until then"}
        forms:
          - {w: "la dije", f: "dij- + -e → decir (to say, tell), preterite, I, with 'la' (it, the lie, 'mentira'). Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, she. Same irregular preterite."}
          - {w: "había estado callando", f: "había (haber, imperfect, she) + estado (participle of estar) + callando (gerund of callar, to be silent): 'had been keeping silent'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
      - es: "antes, por ser tan verdadera y tan sin trazas mentirosas, me veo ahora en tanta desventura;"
        literal: "rather, for being so truthful and so without schemes lying, myself I-see now in such-great misfortune;"
        ormsby: "“on the contrary, it is because I am so truthful and so ignorant of lying devices that I am now in this miserable condition;"
        vocab:
          - {w: "antes", d: "rather, on the contrary (after a negative)"}
          - {w: "por + infinitive", d: "because of (doing / being)"}
          - {w: "verdadero", d: "truthful (of a person); true"}
          - {w: "traza", d: "scheme, plan, device"}
          - {w: "desventura", d: "misfortune, misery"}
        diagram:
          - s: "me veo ahora en tanta desventura"
            r: "main verb: I find myself now in such misery"
            under:
              - {s: "antes", r: "link: on the contrary"}
              - {s: "por ser tan verdadera y tan sin trazas mentirosas", r: "why: because I am so truthful and so free of lying tricks"}
        forms:
          - {w: "ser", f: "infinitive (to be) after 'por': 'because of being'."}
          - {w: "verdadera, mentirosas", f: "verdader- + -a → verdadero (truthful), feminine to match the speaker; mentiros- + -as → mentiroso (lying), feminine plural to match 'trazas'."}
          - {w: "me veo", f: "ve- + -o → verse (to find oneself), present, I, with 'me' (myself). veo, ves, ve, vemos, veis, ven."}
          - {w: "tanta", f: "tant- + -a → tanto (so much), feminine to match 'desventura'."}
      - es: "y desto vos mesmo quiero que seáis el testigo, pues mi pura verdad os hace a vos ser falso y mentiroso."
        literal: "and of-this you yourself I-want that you-be the witness, since my pure truth you makes [to] you to-be false and lying."
        ormsby: "and this I call you yourself to witness, for it is my unstained truth that has made you false and a liar.”"
        vocab:
          - {w: "desto", d: "= de esto, 'of this' (old fused form)"}
          - {w: "vos", d: "you; here formal but cold, the speaker addressing a man she reproaches"}
          - {w: "mesmo", d: "= mismo, self, same (old form)"}
          - {w: "testigo", d: "witness"}
          - {w: "pues", d: "since, for"}
        diagram:
          - s: "quiero"
            r: "main verb: I want"
            under:
              - {s: "que seáis el testigo", r: "what: that you be the witness"}
              - {s: "desto vos mesmo", r: "of what, and who: of this, you yourself (put first for emphasis)"}
              - {s: "pues mi pura verdad os hace a vos ser falso y mentiroso", r: "why: since my plain truth makes you a false liar"}
        forms:
          - {w: "desto", f: "de + esto (of this)."}
          - {w: "vos mesmo", f: "'you yourself'; mesmo = mismo, masculine to match the man addressed."}
          - {w: "quiero", f: "quier- + -o → querer (to want), present, I. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "seáis", f: "se- + -áis → ser (to be), present subjunctive, you (vos), after 'quiero que'. sea, seas, sea, seamos, seáis, sean."}
          - {w: "os hace a vos ser", f: "hac- + -e → hacer (to make), present, it, + infinitive ser: 'makes you be'. 'os' is doubled by 'a vos' for emphasis. hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "falso y mentiroso", f: "masculine singular, to match the man addressed."}
  - sentences:
      - es: "Oyó estas razones Cardenio bien clara y distintamente, como quien estaba tan junto de quien las decía que sola la puerta del aposento de don Quijote estaba en medio; y, así como las oyó, dando una gran voz dijo:"
        literal: "Heard these words Cardenio well clearly and distinctly, as one-who was so close to whom them was-saying that only the door of-the room of Don Quijote was in between; and, as soon as them he-heard, giving a great cry he-said:"
