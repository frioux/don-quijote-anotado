  - sentences:
      - es: "— Tampoco sabré decir eso —respondió el mozo—, porque en todo el camino no la he visto el rostro; suspirar sí la he oído muchas veces, y dar unos gemidos que parece que con cada uno dellos quiere dar el alma."
        literal: "— Neither will-I-know-how to-say that —answered the lad—, because in all the road not of-her I-have seen the face; sigh yes her I-have heard many times, and give some groans that it-seems that with each one of-them she-wants to-give the soul."
