  - sentences:
      - es: "Volvió la cabeza a estos gritos aquella señora, toda sobresaltada, y, no viendo quién las daba, se levantó en pie y fuese a entrar en el aposento; lo cual visto por el caballero, la detuvo, sin dejarla mover un paso."
        literal: "Turned the head at these cries that lady, all startled, and, not seeing who them gave, herself she-raised on foot and went-herself to enter into the room; which seen by the gentleman, her he-held-back, without letting-her move a step."
        ormsby: "Startled at the voice the lady turned her head; and not seeing the speaker she stood up and attempted to enter the room; observing which the gentleman held her back, preventing her from moving a step."
        vocab:
          - {w: "sobresaltado", d: "startled, alarmed"}
          - {w: "dar gritos (voces)", d: "to shout, cry out; 'quién las daba' = who was giving them (the cries)"}
          - {w: "levantarse en pie", d: "to stand up, get to one's feet"}
          - {w: "lo cual visto", d: "which being seen, upon seeing which (absolute participle)"}
          - {w: "detener", d: "to hold back, stop"}
        diagram:
          - s: "Volvió la cabeza"
            r: "main verb 1: turned her head"
            under:
              - {s: "a estos gritos", r: "at what: at these cries"}
              - {s: "aquella señora, toda sobresaltada", r: "subject: that lady, all startled"}
          - s: "se levantó en pie"
            r: "main verb 2: she stood up"
            under:
              - {s: "no viendo quién las daba", r: "why: not seeing who was crying out"}
          - {s: "y fuese a entrar en el aposento", r: "main verb 3: and went to go into the room"}
          - s: "la detuvo"
            r: "main verb 4: (he) held her back"
            under:
              - {s: "lo cual visto por el caballero", r: "when: this seen by the gentleman; he is the subject"}
              - {s: "sin dejarla mover un paso", r: "how: not letting her move a step"}
        forms:
          - {w: "Volvió", f: "volv- + -ió → volver (to turn), preterite, she. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
