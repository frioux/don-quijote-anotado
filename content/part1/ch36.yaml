  - sentences:
      - es: "— Venciste, hermosa Dorotea, venciste; porque no es posible tener ánimo para negar tantas verdades juntas."
        literal: "— You-conquered, beautiful Dorotea, you-conquered; because not is-it possible to-have courage to deny so-many truths together."
        ormsby: "“Thou hast conquered, fair Dorothea, thou hast conquered, for it is impossible to have the heart to deny the united force of so many truths.”"
        vocab:
          - {w: "vencer", d: "to win, conquer, overcome"}
          - {w: "tener ánimo para", d: "to have the heart, the courage to"}
          - {w: "negar", d: "to deny"}
        diagram:
          - s: "Venciste, hermosa Dorotea, venciste"
            r: "main verb: you have won, fair Dorotea"
            under:
              - s: "porque no es posible"
                r: "why: because it is not possible"
                under:
                  - {s: "tener ánimo para negar tantas verdades juntas", r: "what: to have the heart to deny so many truths together"}
        forms:
          - {w: "Venciste", f: "venc- + -iste → vencer (to win), preterite, you (tú). The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "tantas verdades juntas", f: "feminine plural, all matching 'verdades' (verdad + -es)."}
        note: "'Venciste' is the formula of a duel or a debate conceded: Fernando admits defeat in the language of honour. He uses 'tú' in this outburst, then turns to the courteous 'vos' when he speaks to her at length."
