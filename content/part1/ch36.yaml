      - es: "y sin duda tenemos creído que ella va forzada dondequiera que va, y, según se puede colegir por su hábito, ella es monja, o va a serlo, que es lo más cierto, y quizá porque no le debe de nacer de voluntad el monjío, va triste, como parece."
        literal: "and without doubt we-have believed that she goes forced wherever that she-goes, and, according-as one can gather by her habit, she is nun, or goes to be-it, which is the most certain, and perhaps because not to-her must of to-be-born from will the nunhood, she-goes sad, as it-seems."
