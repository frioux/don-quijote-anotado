        forms:
          - {w: "Oyó, oyó", f: "oy- + -ó → oír (to hear), preterite, he. The i between vowels is written y: oí, oíste, oyó, oímos, oísteis, oyeron."}
          - {w: "clara y distintamente", f: "clara + distinta + -mente: '-mente' (= -ly) is added to the feminine form, and in a pair only the second word carries it."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, he / it. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "decía", f: "dec- + -ía → decir (to say), imperfect, she. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "sola", f: "sol- + -a → solo (alone, only), feminine to match 'puerta': 'only the door'."}
          - {w: "dando", f: "gerund of dar (to give)."}
