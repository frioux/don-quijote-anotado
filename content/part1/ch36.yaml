  - sentences:
      - es: "— Dejadme, señor don Fernando, por lo que debéis a ser quien sois, ya que por otro respeto no lo hagáis; dejadme llegar al muro de quien yo soy yedra, al arrimo de quien no me han podido apartar vuestras importunaciones, vuestras amenazas, vuestras promesas ni vuestras dádivas."
        literal: "— Leave-me, sir Don Fernando, for that which you-owe to being who you-are, since for other regard not it you-may-do; let-me reach to-the wall of which I am ivy, to-the support from which not me have been-able to-separate your importunings, your threats, your promises nor your gifts."
        ormsby: "“Leave me, Señor Don Fernando, for the sake of what you owe to yourself; if no other reason will induce you, leave me to cling to the wall of which I am the ivy, to the support from which neither your importunities, nor your threats, nor your promises, nor your gifts have been able to detach me."
        vocab:
          - {w: "por lo que debéis a ser quien sois", d: "for the sake of what you owe to your own rank and name (a noble's duty to his station)"}
          - {w: "ya que", d: "since, if (here 'if for no other reason')"}
          - {w: "respeto", d: "consideration, reason, regard"}
          - {w: "muro", d: "wall"}
          - {w: "yedra", d: "= hiedra, ivy; ivy clinging to a wall or elm is the classic image of a faithful wife"}
          - {w: "arrimo", d: "support, prop, something to lean on"}
          - {w: "apartar", d: "to separate, draw away"}
          - {w: "importunación", d: "pestering, insistent pleading"}
          - {w: "dádiva", d: "gift, present"}
        diagram:
          - s: "Dejadme"
            r: "main verb 1: let me go"
            under:
              - {s: "señor don Fernando", r: "address"}
              - {s: "por lo que debéis a ser quien sois", r: "for whose sake: for what you owe to being who you are"}
              - {s: "ya que por otro respeto no lo hagáis", r: "condition: if you won't do it for any other reason"}
          - s: "dejadme llegar al muro"
            r: "main verb 2: let me reach the wall"
            under:
              - {s: "de quien yo soy yedra", r: "describes 'muro': of which I am the ivy"}
              - s: "al arrimo"
                r: "restates 'muro': to the support"
                under:
                  - {s: "de quien no me han podido apartar vuestras importunaciones, vuestras amenazas, vuestras promesas ni vuestras dádivas", r: "describes 'arrimo': from which your pleading, threats, promises and gifts could not part me"}
        forms:
          - {w: "Dejadme", f: "dej- + -ad + me → dejar (to let, leave), command, you (vos), with 'me' on the end. The -ar plural or 'vos' command ends in -ad: dejad, mirad, hablad."}
          - {w: "debéis", f: "deb- + -éis → deber (to owe), present, you (vos). The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "sois", f: "ser (to be), present, you (vos). soy, eres, es, somos, sois, son."}
          - {w: "hagáis", f: "hag- + -áis → hacer (to do), present subjunctive, you. Irregular stem hag-: haga, hagas, haga, hagamos, hagáis, hagan."}
          - {w: "llegar", f: "infinitive (to reach) after 'dejadme': 'let me reach'."}
          - {w: "quien", f: "'which', for things (the wall, the support): old Spanish uses 'quien' where modern says 'el cual' or 'que'."}
          - {w: "han podido apartar", f: "han (haber, present, they) + podido, participle of poder (to be able), + apartar (to separate): 'have been able to part'. he, has, ha, hemos, habéis, han."}
          - {w: "vuestras", f: "vuestr- + -as → vuestro (your), feminine plural to match each noun."}
        note: "Ivy clinging to a wall (or to an elm) was a stock emblem of the faithful wife who lives by her husband's support; Luscinda turns it into a claim that she is already Cardenio's wife."
