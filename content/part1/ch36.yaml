  - sentences:
      - es: "— Si ya no es, señor mío, que los rayos deste sol que en tus brazos eclipsado tienes te quitan y ofuscan los de tus ojos, ya habrás echado de ver que la que a tus pies está arrodillada es la sin ventura, hasta que tú quieras, y la desdichada Dorotea."
        literal: "— If now not it-is, lord mine, that the rays of-this sun that in your arms eclipsed you-have to-you take-away and darken those of your eyes, already you-will-have noticed that she who at your feet is kneeling is the without fortune, until that you may-want, and the unhappy Dorotea."
        ormsby: "“If, my lord, the beams of that sun that thou holdest eclipsed in thine arms did not dazzle and rob thine eyes of sight thou wouldst have seen by this time that she who kneels at thy feet is, so long as thou wilt have it so, the unhappy and unfortunate Dorothea."
        vocab:
          - {w: "si ya no es que", d: "unless (it be that)"}
          - {w: "rayo", d: "ray, beam"}
          - {w: "deste", d: "= de este, 'of this' (old fused form)"}
