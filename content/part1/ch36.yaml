  - sentences:
      - es: "Callaban todos y mirábanse todos: Dorotea a don Fernando, don Fernando a Cardenio, Cardenio a Luscinda y Luscinda a Cardenio."
        literal: "Were-silent all and looked-at-each-other all: Dorotea at Don Fernando, Don Fernando at Cardenio, Cardenio at Luscinda and Luscinda at Cardenio."
        ormsby: "They gazed at one another without speaking, Dorothea at Don Fernando, Don Fernando at Cardenio, Cardenio at Luscinda, and Luscinda at Cardenio."
        vocab:
          - {w: "callar", d: "to be silent"}
          - {w: "mirarse", d: "to look at one another"}
        diagram:
          - {s: "Callaban todos", r: "main verb 1: all were silent"}
          - s: "y mirábanse todos:"
            r: "main verb 2: and all looked at one another"
            under:
              - {s: "Dorotea a don Fernando, don Fernando a Cardenio, Cardenio a Luscinda y Luscinda a Cardenio", r: "who at whom: the verb 'miraba' understood in each pair"}
        forms:
          - {w: "Callaban", f: "call- + -aban → callar (to be silent), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "mirábanse", f: "mir- + -aban + se → mirarse (to look at each other), imperfect, they, with 'se' stuck on the end (modern 'se miraban'). Same -aba imperfect."}
