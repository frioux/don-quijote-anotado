  - sentences:
      - es: "— Si el piadoso cielo gusta y quiere que ya tengas algún descanso, leal, firme y hermosa señora mía, en ninguna parte creo yo que le tendrás más seguro que en estos brazos que ahora te reciben, y otro tiempo te recibieron, cuando la fortuna quiso que pudiese llamarte mía."
        literal: "— If the merciful heaven likes and wants that now you-may-have some rest, loyal, firm and beautiful lady mine, in no part believe I that it you-will-have more secure than in these arms that now you receive, and other time you received, when the fortune wanted that I-could call-you mine."
        ormsby: "“If Heaven in its compassion is willing to let thee rest at last, mistress of my heart, true, constant, and fair, nowhere canst thou rest more safely than in these arms that now receive thee, and received thee before when fortune permitted me to call thee mine.”"
