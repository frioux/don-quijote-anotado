          - {w: "gustar", d: "to be pleased (to), like (to); here of heaven willing something"}
          - {w: "descanso", d: "rest, repose, relief"}
          - {w: "leal", d: "loyal, faithful"}
          - {w: "otro tiempo", d: "once, formerly"}
          - {w: "fortuna", d: "fortune, fate"}
