  - sentences:
      - es: "A estas razones, puso Luscinda en Cardenio los ojos, y, habiendo comenzado a conocerle, primero por la voz, y asegurándose que él era con la vista, casi fuera de sentido y sin tener cuenta a ningún honesto respeto, le echó los brazos al cuello, y, juntando su rostro con el de Cardenio, le dijo:"
        literal: "At these words, put Luscinda on Cardenio the eyes, and, having begun to recognize-him, first by the voice, and making-sure-herself that he it-was with the sight, almost out of sense and without having account to any modest respect, to-him she-threw the arms to-the neck, and, joining her face with that of Cardenio, to-him said:"
        ormsby: "At these words Luscinda looked up at Cardenio, at first beginning to recognise him by his voice and then satisfying herself by her eyes that it was he, and hardly knowing what she did, and heedless of all considerations of decorum, she flung her arms around his neck and pressing her face close to his, said,"
