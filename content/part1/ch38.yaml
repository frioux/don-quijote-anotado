      - es: "A lo cual respondió el cautivo que de muy buena gana haría lo que se le mandaba, y que sólo temía que el cuento no había de ser tal, que les diese el gusto que él deseaba; pero que, con todo eso, por no faltar en obedecelle, le contaría."
