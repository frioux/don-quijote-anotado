  - sentences:
      - es: "Todo este largo preámbulo dijo don Quijote, en tanto que los demás cenaban, olvidándose de llevar bocado a la boca, puesto que algunas veces le había dicho Sancho Panza que cenase, que después habría lugar para decir todo lo que quisiese."
        literal: "All this long preamble said Don Quijote, while that the others were-supping, forgetting-himself of carrying mouthful to the mouth, although some times to-him had said Sancho Panza that he-should-sup, for afterwards there-would-be room to say all that which he-might-wish."
        ormsby: "All this lengthy discourse Don Quixote delivered while the others supped, forgetting to raise a morsel to his lips, though Sancho more than once told him to eat his supper, as he would have time enough afterwards to say all he wanted."
        vocab:
          - {w: "preámbulo", d: "preamble, introduction; here, with irony, the whole long speech"}
          - {w: "en tanto que", d: "while"}
          - {w: "los demás", d: "the others, everyone else"}
          - {w: "cenar", d: "to have supper"}
          - {w: "olvidarse de", d: "to forget to"}
          - {w: "bocado", d: "mouthful, bite"}
          - {w: "puesto que", d: "although (a false friend: not 'since')"}
          - {w: "haber lugar", d: "there to be time, room, opportunity"}
        diagram:
          - s: "dijo don Quijote"
            r: "main verb: Don Quijote said"
            under:
              - {s: "Todo este largo preámbulo", r: "object, put first: all this long preamble"}
              - {s: "en tanto que los demás cenaban", r: "when: while the others ate supper"}
              - {s: "olvidándose de llevar bocado a la boca", r: "how: forgetting to put a bite in his mouth"}
              - s: "puesto que algunas veces le había dicho Sancho Panza"
                r: "concession: although Sancho had told him several times"
                under:
                  - {s: "que cenase", r: "what Sancho said: that he should eat"}
                  - {s: "que después habría lugar para decir todo lo que quisiese", r: "why: for there would be time later to say all he wanted"}
        forms:
          - {w: "este", f: "este (this), masculine to match 'preámbulo'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "cenaban", f: "cen- + -aban → cenar (to have supper), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "olvidándose", f: "olvidando, the gerund of olvidar (to forget), + se (himself), with an accent added."}
          - {w: "había dicho", f: "había (haber, imperfect, he: había, habías, había, habíamos, habíais, habían) + dicho, the irregular participle of decir: the pluperfect 'had told'."}
          - {w: "cenase", f: "cen- + -ase → cenar (to eat supper), imperfect subjunctive (-se form), he: what Sancho told him to do. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "habría", f: "habr- + -ía → haber, conditional, used alone: 'there would be'. habría, habrías, habría, habríamos, habríais, habrían."}
          - {w: "quisiese", f: "quis- + -iese → querer (to want), imperfect subjunctive (-se form), he. Built on the preterite quisieron: quisiese, quisieses, quisiese, quisiésemos, quisieseis, quisiesen."}
        note: "The narrator dryly calls the whole long speech a mere 'preamble'. Don Quijote, carried away, has eaten nothing while everyone else had supper."
      - es: "En los que escuchado le habían sobrevino nueva lástima de ver que hombre que, al parecer, tenía buen entendimiento y buen discurso en todas las cosas que trataba, le hubiese perdido tan rematadamente, en tratándole de su negra y pizmienta caballería."
        literal: "In those who listened-to him had came-over new pity at seeing that [a] man who, by-the seeming, had good understanding and good reasoning in all the things that he-dealt-with, it had-lost so utterly, on dealing-with-him of his black and pitch-black chivalry."
        ormsby: "It excited fresh pity in those who had heard him to see a man of apparently sound sense, and with rational views on every subject he discussed, so hopelessly wanting in all, when his wretched unlucky chivalry was in question."
