          - {w: "cautivo", d: "captive: a Christian just freed from captivity among the Moors"}
          - {w: "discurso de su vida", d: "the course, the story of his life"}
          - {w: "no podría ser sino que", d: "it could only be that, it could not fail to be"}
          - {w: "peregrino", d: "rare, strange, extraordinary (a false friend: not only 'pilgrim')"}
          - {w: "gustoso", d: "pleasant, enjoyable"}
          - {w: "muestras", d: "signs, hints"}
          - {w: "Zoraida", d: "the veiled Moorish woman who arrived at the inn with the captive"}
