summary: |
  At supper in the inn Don Quijote goes on with his speech on arms and letters. Having shown how poor the student is, he argues that the soldier is poorer still: his pay comes late or never, he must plunder at the risk of his life and soul, a slashed leather jerkin serves him for shirt and finery, and his only bed is the bare ground. His 'graduation' is a day of battle, where instead of a doctor's tassel he gets a wad of lint on a bullet wound. Few soldiers are ever rewarded, while men of letters always find a living; and it is easier to reward a few thousand lawyers with posts than tens of thousands of soldiers, who can only be paid out of their lord's own purse.

  He then returns to the question of which is superior. Letters say arms need laws; arms answer that laws cannot stand without arms to defend states, cities, roads and seas. What costs more is worth more, and the soldier pays with his life: standing guard over an enemy mine, waiting to be blown into the air, or crossing the narrow spur of a galley under cannon fire while comrades fall into the sea one after another. He curses the inventor of artillery, which lets a cowardly arm kill a brave knight with a stray bullet, and says he almost regrets taking up knight-errantry in such an age, though facing greater dangers will make him all the more honoured.

  Don Quijote has eaten nothing during the whole speech, despite Sancho's urging. His listeners pity a man so sensible on every subject but this one, and the priest, although a man of letters himself, agrees with him on arms.

  After supper, while the hostess, her daughter and Maritornes prepare the garret where the women will sleep, Don Fernando asks the captive to tell the story of his life. The captive agrees, warning that his story may not please them, but promising a true account better than any invented one. Everyone falls silent and he begins.
context: |
  Soldiers and letrados. Don Quijote's picture of the soldier's life is real. The infantry of Philip II's tercios were paid months or years late, lived by pillage, went in rags, and were often turned loose crippled and penniless at the end of a campaign; discharged veterans begging in the streets were a familiar sight. The 'letrados', on the other hand, were the university-trained lawyers who filled the courts, councils and offices of the Habsburg state, where posts could only go to men of their profession. As Ormsby notes, 'by skirts, to say nothing of sleeves' may mean their regular salary (the long gown) and their gifts and perquisites (things slipped into the sleeve): Don Quijote hints at corruption while pretending not to.

  Arms and letters. Which is nobler, the soldier or the scholar, was an old set theme of Renaissance debate (Castiglione's Courtier argues it), and Don Quijote's speech, begun in the previous chapter, follows the pattern closely, matching the student's poverty, degree and reward item by item with the soldier's. The lament on artillery is also a commonplace: in Ariosto's Orlando Furioso, which Don Quijote knows well, Orlando throws the first firearm into the sea as an invention of the devil. Gunpowder let any coward kill a knight from a distance, and so it really did put an end to the world of single combat that Don Quijote is trying to bring back.

  Cervantes' own war. The siege and galley scenes are written from experience. Ormsby notes that the boarding of galleys stem to stem is 'no doubt a personal reminiscence of Lepanto', the great sea battle of 1571 against the Turks, where Cervantes was shot twice in the chest and lost the use of his left hand. He was captured by Barbary corsairs in 1575 and held in Algiers for five years. The captive who is about to tell his story is a soldier just back from captivity among the Moors, so the chapter moves from Cervantes' memories of battle towards his memories of captivity.

  The narrator's games. The narrator calls the whole long oration a 'preamble', notes that Don Quijote forgot to eat, and has the listeners pity a man so sane on every subject except his own chivalry. The priest, a university man, agrees that arms win. Then the captive promises a 'true' story better than artful fictions, inside a book that is itself an artful fiction.

  Medicine and religion. The joke that the soldier's breath comes out cold 'against all nature' rests on Galen's physiology, in which the body's innate heat, fed by food, warms the breath. Wounds are dressed with 'hilas', shredded linen lint. The drowned soldier lies at the bottom of the sea 'until the end of the world', when the dead will rise at the Last Judgment, and the inventor of artillery is placed in hell.

  Names and words. 'Caballero' in a fortress is a raised gun platform, the 'cavalier', so the word Don Quijote uses for himself turns up as a piece of military engineering. Neptune stands for the sea. Maritornes is the Asturian serving-girl of the inn, Don Fernando the nobleman lodging there, and Zoraida the veiled Moorish woman who came with the captive.

  Reading Cervantes' Spanish. The archaisms of the chapter: mesmo (mismo), recebir (recibir), cosarios (corsarios), previlegios (privilegios), aquestos (estos), luengos (largos), váguidos (vahídos), 'la fin' for 'el fin', desta, uncontracted 'a el', and obedecelle with -rl- turned into -ll-. Pronouns hang on the end of conjugated verbs that open a clause (Lléguese, vense). The future subjunctive appears for open futures (garbeare, quisiere, fuere servido), the -se subjunctive throughout (fuese, cenase, quisiese, contase, recogiesen), 'haber de' for 'must, be going to', 'deber de' for 'ought to', and the old blessing 'bien hayan'. Watch the false friends: ejercicio (profession), fuerza (fortress), blanco (target), curioso (careful), peregrino (rare), discurso (reasoning, story), puesto que (although), pretender (to aim at), entretenerse (to make a living), suceder (to take the place of).
