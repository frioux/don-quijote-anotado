  - sentences:
      - es: "Acabaron de cenar, levantaron los manteles, y, en tanto que la ventera, su hija y Maritornes aderezaban el camaranchón de don Quijote de la Mancha, donde habían determinado que aquella noche las mujeres solas en él se recogiesen, don Fernando rogó al cautivo les contase el discurso de su vida, porque no podría ser sino que fuese peregrino y gustoso, según las muestras que había comenzado a dar, viniendo en compañía de Zoraida."
        literal: "They-finished of supping, they-lifted the tablecloths, and, while that the innkeeper's-wife, her daughter and Maritornes were-preparing the garret of Don Quijote of La Mancha, where they-had decided that that night the women alone in it should-retire, Don Fernando begged [to-]the captive [that] to-them he-should-tell the course of his life, because not it-could be but that it-were rare and pleasing, according-to the signs that he-had begun to give, coming in company of Zoraida."
        ormsby: "They finished their supper, the cloth was removed, and while the hostess, her daughter, and Maritornes were getting Don Quixote of La Mancha’s garret ready, in which it was arranged that the women were to be quartered by themselves for the night, Don Fernando begged the captive to tell them the story of his life, for it could not fail to be strange and interesting, to judge by the hints he had let fall on his arrival in company with Zoraida."
        vocab:
          - {w: "acabar de", d: "to finish (doing)"}
          - {w: "levantar los manteles", d: "to clear the table; 'mantel' = tablecloth"}
          - {w: "ventera", d: "the innkeeper's wife"}
