part: 1
chapter: 38
title_es: "Capítulo XXXVIII. Que trata del curioso discurso que hizo don Quijote de las armas y las letras"
title_en: "Which treats of the curious discourse Don Quixote delivered on arms and letters"
paragraphs:
  - sentences:
      - es: "Prosiguiendo don Quijote, dijo:"
        literal: "Continuing Don Quijote, he-said:"
        ormsby: "Continuing his discourse Don Quixote said:"
        vocab:
          - {w: "proseguir", d: "to continue, go on (with a speech)"}
        diagram:
          - s: "dijo:"
            r: "main verb: he said"
            under:
              - {s: "Prosiguiendo", r: "how: continuing (his speech)"}
              - {s: "don Quijote", r: "subject: also the one who continues"}
        forms:
          - {w: "Prosiguiendo", f: "gerund of proseguir (to continue): 'continuing'. The e of the stem turns to i in the gerund: proseguir → prosiguiendo."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
        note: "Don Quijote is in the middle of his speech on arms and letters, begun at the end of the previous chapter over supper at the inn. He has just described the student's hardships (hunger, cold, ragged clothes) and now turns to the soldier."
  - sentences:
      - es: "— Pues comenzamos en el estudiante por la pobreza y sus partes, veamos si es más rico el soldado."
        literal: "— Since we-began in the student with the poverty and its parts, let-us-see if is more rich the soldier."
        ormsby: "“As we began in the student’s case with poverty and its accompaniments, let us see now if the soldier is richer,"
        vocab:
          - {w: "pues", d: "here 'since, as' (giving a reason), not 'well'"}
          - {w: "comenzar por", d: "to begin with"}
          - {w: "partes", d: "aspects, accompaniments, the things that go with it"}
        diagram:
          - s: "veamos"
            r: "main verb: let us see"
            under:
              - s: "Pues comenzamos en el estudiante"
                r: "why: since we began, with the student"
                under:
                  - {s: "por la pobreza y sus partes", r: "with what: with poverty and all that goes with it"}
              - {s: "si es más rico el soldado", r: "what we see: whether the soldier is richer"}
        forms:
          - {w: "comenzamos", f: "comenz- + -amos → comenzar (to begin), preterite, we: 'we began'. In -ar verbs the 'we' form is the same in the present and the preterite; the sense decides. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (comencé, with z → c before e)."}
          - {w: "veamos", f: "ve- + -amos → ver (to see), present subjunctive, we: 'let us see', the usual way to say 'let's'. ver in the present subjunctive: vea, veas, vea, veamos, veáis, vean."}
          - {w: "es más rico", f: "es (ser, present, he: soy, eres, es, somos, sois, son) + más rico, 'richer': Spanish makes the comparative with 'más'. The subject 'el soldado' comes after the verb."}
        note: "In the previous chapter Don Quijote argued that the student's life is hard, but the soldier's is harder. He now proves it point by point, matching the student's poverty, the 'degree' at the end, and the reward."
      - es: "Y veremos que no hay ninguno más pobre en la misma pobreza, porque está atenido a la miseria de su paga, que viene o tarde o nunca, o a lo que garbeare por sus manos, con notable peligro de su vida y de su conciencia."
        literal: "And we-shall-see that not there-is none more poor in the same poverty, because he-is held-to the meagerness of his pay, which comes either late or never, or to that which he-may-snatch by his hands, with notable danger of his life and of his conscience."
        ormsby: "and we shall find that in poverty itself there is no one poorer; for he is dependent on his miserable pay, which comes late or never, or else on what he can plunder, seriously imperilling his life and conscience;"
        vocab:
          - {w: "en la misma pobreza", d: "in poverty itself, as far as poverty goes"}
          - {w: "atenido a", d: "dependent on, reduced to (from 'atenerse a', to rely on)"}
          - {w: "miseria", d: "meagerness, a pittance; also wretchedness"}
          - {w: "paga", d: "pay, a soldier's wages"}
          - {w: "o tarde o nunca", d: "either late or never"}
          - {w: "garbear", d: "to snatch, plunder, forage (soldiers' slang)"}
          - {w: "notable", d: "considerable, great"}
          - {w: "conciencia", d: "conscience: plunder puts his soul in danger"}
        diagram:
          - s: "Y veremos"
            r: "main verb: and we shall see"
            under:
              - {s: "que no hay ninguno más pobre en la misma pobreza", r: "what we shall see: that no one is poorer, as far as poverty goes"}
              - s: "porque está atenido a la miseria de su paga"
                r: "why: because he depends on his meager pay"
                under:
                  - {s: "que viene o tarde o nunca", r: "describes 'paga': which comes late or never"}
                  - s: "o a lo"
                    r: "or depends on: or on what"
                    under:
                      - {s: "que garbeare por sus manos", r: "describes 'lo': what he may snatch with his own hands"}
                  - {s: "con notable peligro de su vida y de su conciencia", r: "how: at great risk to his life and his soul"}
        forms:
          - {w: "veremos", f: "ver- + -emos → ver (to see), future, we. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "no hay ninguno", f: "hay, 'there is', from haber; Spanish keeps both negatives: 'no hay ninguno' = there is not none, i.e. there is no one."}
          - {w: "está atenido", f: "est- + -á → estar (to be), present, he: estoy, estás, está, estamos, estáis, están; + atenido, the participle of atenerse (to rely on): 'he is dependent'."}
          - {w: "viene", f: "vien- + -e → venir (to come), present, it (the pay). Irregular: vengo, vienes, viene, venimos, venís, vienen."}
          - {w: "garbeare", f: "garbe- + -are → garbear (to plunder), future subjunctive, he: 'whatever he may snatch'. The future subjunctive of -ar verbs: -are, -ares, -are, -áremos, -areis, -aren. Cervantes uses it after 'lo que', 'si', 'donde' for an open future; modern Spanish uses the present subjunctive 'garbee'."}
          - {w: "sus manos", f: "sus = plural to match 'manos', not the owner; 'his hands'."}
        note: "The pay of Spanish soldiers was notoriously months or years in arrears, and soldiers lived by pillage; mutinies over back-pay were common in the armies of Flanders. Cervantes, an old soldier, knew this at first hand."
      - es: "Y a veces suele ser su desnudez tanta, que un coleto acuchillado le sirve de gala y de camisa, y en la mitad del invierno se suele reparar de las inclemencias del cielo, estando en la campaña rasa, con sólo el aliento de su boca, que, como sale de lugar vacío, tengo por averiguado que debe de salir frío, contra toda naturaleza."
        literal: "And at times is-wont to-be his nakedness so-great, that a leather-jerkin slashed to-him serves as finery and as shirt, and in the middle of-the winter himself he-is-wont to-shield from the inclemencies of-the sky, being in the open-country flat, with only the breath of his mouth, which, as it-comes-out from place empty, I-hold as ascertained that it-must come-out cold, against all nature."
        ormsby: "and sometimes his nakedness will be so great that a slashed doublet serves him for uniform and shirt, and in the depth of winter he has to defend himself against the inclemency of the weather in the open field with nothing better than the breath of his mouth, which I need not say, coming from an empty place, must come out cold, contrary to the laws of nature."
        vocab:
          - {w: "soler", d: "to be in the habit of; 'suele ser' = usually is, often is"}
          - {w: "desnudez", d: "nakedness; here raggedness, lack of clothes"}
          - {w: "coleto", d: "leather jerkin, the buff coat soldiers wore"}
          - {w: "acuchillado", d: "slashed: cut by blades, and also 'slashed' in the fashion sense of sleeves cut to show the lining"}
          - {w: "servir de", d: "to serve as"}
          - {w: "gala", d: "finery, best clothes"}
          - {w: "repararse de", d: "to shield oneself from"}
          - {w: "inclemencias del cielo", d: "the harshness of the weather; 'cielo' = sky, weather"}
          - {w: "campaña rasa", d: "open country with no shelter; 'campaña' = campo (field), 'raso' = flat, bare"}
          - {w: "aliento", d: "breath"}
          - {w: "tener por averiguado", d: "to take as proven, be certain"}
          - {w: "deber de", d: "must (probability): 'debe de salir' = it must come out"}
        diagram:
          - s: "suele ser su desnudez tanta"
            r: "main verb 1: his nakedness is often so great"
            under:
              - {s: "a veces", r: "when: sometimes"}
              - {s: "que un coleto acuchillado le sirve de gala y de camisa", r: "result: that a slashed leather jerkin is both his finery and his shirt"}
          - s: "se suele reparar"
            r: "main verb 2 (after 'y'): he usually shields himself"
            under:
              - {s: "en la mitad del invierno", r: "when: in midwinter"}
              - {s: "de las inclemencias del cielo", r: "from what: from the harsh weather"}
              - {s: "estando en la campaña rasa", r: "where: being out in the open country"}
              - s: "con sólo el aliento de su boca"
                r: "with what: with nothing but the breath of his mouth"
                under:
                  - s: "tengo por averiguado"
                    r: "aside: I take it as certain"
                    under:
                      - {s: "como sale de lugar vacío", r: "why: since it comes from an empty place (his stomach)"}
                      - {s: "que debe de salir frío, contra toda naturaleza", r: "what I take as certain: that it must come out cold, against nature"}
        forms:
          - {w: "suele", f: "suel- + -e → soler (to be in the habit of), present, it / he. The stem o becomes ue when stressed: suelo, sueles, suele, solemos, soléis, suelen. Always followed by an infinitive ('suele ser', 'se suele reparar')."}
          - {w: "tanta", f: "tant- + -a → tanto (so much, so great), feminine to match 'desnudez'; it sets up the result clause 'que ...'."}
          - {w: "acuchillado", f: "acuchill- + -ado → acuchillar (to slash), participle used as an adjective, masculine to match 'coleto'."}
          - {w: "sirve", f: "sirv- + -e → servir (to serve), present, it. The e of the stem becomes i when stressed: sirvo, sirves, sirve, servimos, servís, sirven."}
          - {w: "se suele reparar", f: "suele (soler, present, he) + reparar (to shield) with 'se' (himself) placed before the whole group; modern Spanish also allows 'suele repararse'."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
          - {w: "estando", f: "gerund of estar (to be): 'being (out in)'."}
          - {w: "sale", f: "sal- + -e → salir (to come out), present, it (the breath). salgo, sales, sale, salimos, salís, salen."}
          - {w: "tengo", f: "teng- + -o → tener (to hold), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "debe", f: "deb- + -e → deber (must), present, it. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "averiguado", f: "participle of averiguar (to ascertain), in the set phrase 'tener por averiguado' (to take as proven)."}
        note: "A medical joke: in Galen's physiology the body's innate heat warms the breath, and food feeds that heat. The soldier's stomach is so empty that his breath must come out cold, 'against all nature'."
      - es: "Pues esperad que espere que llegue la noche, para restaurarse de todas estas incomodidades, en la cama que le aguarda, la cual, si no es por su culpa, jamás pecará de estrecha;"
        literal: "Well wait that he-may-wait that may-arrive the night, to restore-himself from all these discomforts, in the bed that him awaits, the which, if not it-is through his fault, never will-sin of narrow;"
        ormsby: "To be sure he looks forward to the approach of night to make up for all these discomforts on the bed that awaits him, which, unless by some fault of his, never sins by being over narrow,"
        vocab:
          - {w: "esperad que espere", d: "'just wait till he waits', a play on 'esperar' (to wait, to hope)"}
          - {w: "restaurarse de", d: "to recover from, make up for"}
          - {w: "incomodidades", d: "discomforts, hardships"}
          - {w: "aguardar", d: "to wait for, await"}
          - {w: "si no es por su culpa", d: "unless it is his own fault"}
          - {w: "pecar de", d: "to err by being too ...; 'pecar de estrecha' = to be too narrow"}
          - {w: "estrecho", d: "narrow, tight"}
        diagram:
          - s: "Pues esperad"
            r: "main verb: well, wait (said to the listeners)"
            under:
              - s: "que espere"
                r: "what to wait for: till he waits"
                under:
                  - {s: "que llegue la noche", r: "what he waits for: for night to come"}
                  - {s: "para restaurarse de todas estas incomodidades", r: "why: to recover from all these hardships"}
                  - s: "en la cama"
                    r: "where: in the bed"
                    under:
                      - {s: "que le aguarda", r: "describes 'cama': that waits for him"}
                      - s: "la cual"
                        r: "describes 'cama': which"
                        under:
                          - {s: "si no es por su culpa", r: "condition: unless it is his own fault"}
                          - {s: "jamás pecará de estrecha", r: "will never be too narrow"}
        forms:
          - {w: "esperad", f: "esper- + -ad → esperar (to wait), imperative, you (vosotros, the listeners): 'wait!'. The vosotros imperative swaps the final -r of the infinitive for -d: esperad, comed, vivid."}
          - {w: "espere", f: "esper- + -e → esperar (to wait), present subjunctive, he. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "llegue", f: "llegu- + -e → llegar (to arrive), present subjunctive, it (the night); g becomes gu before e to keep the hard sound. Same -e subjunctive: llegue, llegues, llegue, lleguemos, lleguéis, lleguen."}
          - {w: "restaurarse", f: "restaurar (to restore) + se (himself), the pronoun hung on the infinitive after 'para'."}
          - {w: "estas", f: "est- + -as → este (this), feminine plural to match 'incomodidades'."}
          - {w: "aguarda", f: "aguard- + -a → aguardar (to await), present, it (the bed). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "la cual", f: "'which', feminine to match 'cama'; a heavier relative than 'que', used after a comma."}
          - {w: "pecará", f: "pecar- + -á → pecar (to sin), future, it. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "estrecha", f: "estrech- + -a → estrecho (narrow), feminine to match 'cama'."}
        note: "The bed that awaits the soldier is the bare ground, so it can never be too narrow. The whole passage parodies the student's hardships, item by item, from the previous chapter."
      - es: "que bien puede medir en la tierra los pies que quisiere, y revolverse en ella a su sabor, sin temor que se le encojan las sábanas."
        literal: "for well he-can measure on the earth the feet that he-may-wish, and roll-about-himself in it at his pleasure, without fear that on-him may-shrink the sheets."
        ormsby: "for he can easily measure out on the ground as he likes, and roll himself about in it to his heart’s content without any fear of the sheets slipping away from him."
        vocab:
          - {w: "que", d: "here 'for, since', giving the reason"}
          - {w: "medir los pies", d: "to measure out feet, i.e. stretch out as long as he likes"}
          - {w: "revolverse", d: "to roll about, toss and turn"}
          - {w: "a su sabor", d: "to his heart's content, as he pleases"}
          - {w: "encogerse", d: "to shrink, draw up, ride up"}
          - {w: "sábana", d: "bedsheet"}
        diagram:
          - s: "puede medir"
            r: "main verb 1 (after 'que', for): he can measure out"
            under:
              - {s: "bien", r: "how: easily, well"}
              - {s: "en la tierra", r: "where: on the ground"}
              - s: "los pies"
                r: "object: the feet (of length)"
                under:
                  - {s: "que quisiere", r: "describes 'pies': as many as he likes"}
          - s: "y revolverse en ella"
            r: "main verb 2, also after 'puede': and roll about in it"
            under:
              - {s: "a su sabor", r: "how: to his heart's content"}
              - {s: "sin temor que se le encojan las sábanas", r: "how: without fear that the sheets ride up on him"}
        forms:
          - {w: "puede", f: "pued- + -e → poder (to be able), present, he. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "quisiere", f: "quis- + -iere → querer (to want), future subjunctive, he: 'as many as he may want'. Built on the preterite quisieron: quisiere, quisieres, quisiere, quisiéremos, quisiereis, quisieren. Modern Spanish uses the present subjunctive 'quiera'."}
          - {w: "revolverse", f: "revolver (to turn over) + se (himself), infinitive hung on 'puede' like 'medir'."}
          - {w: "ella", f: "'it', feminine because it stands for 'la tierra'."}
          - {w: "se le encojan", f: "encoj- + -an → encogerse (to shrink), present subjunctive, they (the sheets), with 'se' (themselves) and 'le' (on him). g becomes j before a: encoja, encojas, encoja, encojamos, encojáis, encojan. Subjunctive after 'temor que' (fear that); modern Spanish says 'temor de que'."}
      - es: "Lléguese, pues, a todo esto, el día y la hora de recebir el grado de su ejercicio;"
        literal: "Let-it-arrive, then, on-top-of all this, the day and the hour of receiving the degree of his profession;"
        ormsby: "Then, after all this, suppose the day and hour for taking his degree in his calling to have come;"
        vocab:
          - {w: "llegarse", d: "to come, draw near; 'lléguese' = let there come, suppose there comes"}
          - {w: "a todo esto", d: "on top of all this, after all this"}
          - {w: "recebir", d: "= recibir, to receive (old spelling)"}
          - {w: "grado", d: "degree, as in a university degree"}
          - {w: "ejercicio", d: "profession, calling (not 'exercise')"}
        diagram:
          - s: "Lléguese"
            r: "main verb: let there come"
            under:
              - {s: "pues, a todo esto", r: "linking: then, after all this"}
              - s: "el día y la hora"
                r: "subject: the day and the hour"
                under:
                  - {s: "de recebir el grado de su ejercicio", r: "describes 'día y hora': for receiving the degree of his profession"}
        forms:
          - {w: "Lléguese", f: "llegu- + -e + se → llegarse (to come near), present subjunctive, it, with 'se' stuck on the end: 'let there come'. g becomes gu before e. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. A subjunctive opening the sentence gives a command or wish, and the pronoun then must hang on the end (modern 'que se llegue')."}
          - {w: "recebir", f: "old spelling of recibir (to receive), infinitive after 'de'."}
        note: "The parallel with the student goes on: a student's long labour ends in the degree ceremony, where the new doctor receives the tasseled cap. The soldier's 'graduation day' is a battle."
      - es: "lléguese un día de batalla, que allí le pondrán la borla en la cabeza, hecha de hilas, para curarle algún balazo, que quizá le habrá pasado las sienes, o le dejará estropeado de brazo o pierna."
        literal: "let-arrive a day of battle, for there on-him they-will-put the tassel on the head, made of lint, to cure-him some bullet-wound, which perhaps him will-have passed-through the temples, or him will-leave maimed of arm or leg."
        ormsby: "suppose the day of battle to have arrived, when they invest him with the doctor’s cap made of lint, to mend some bullet-hole, perhaps, that has gone through his temples, or left him with a crippled arm or leg."
        vocab:
          - {w: "borla", d: "tassel; the tassel of a doctor's cap ('tomar la borla' = to take a doctorate)"}
          - {w: "hilas", d: "lint, shredded linen used to dress wounds"}
          - {w: "curar", d: "to treat, dress (a wound), not only 'to cure'"}
          - {w: "balazo", d: "bullet wound, gunshot"}
          - {w: "quizá", d: "perhaps"}
          - {w: "sienes", d: "temples (of the head); singular 'sien'"}
          - {w: "estropeado", d: "maimed, crippled; 'estropeado de brazo' = crippled in the arm"}
        diagram:
          - s: "lléguese un día de batalla"
            r: "main verb 1: let a day of battle come"
          - s: "le pondrán la borla en la cabeza"
            r: "main verb 2 (after 'que', for): they will put the tassel on his head"
            under:
              - {s: "allí", r: "where: there, in the battle"}
              - {s: "hecha de hilas", r: "describes 'borla': made of lint"}
              - s: "para curarle algún balazo"
                r: "why: to dress some bullet wound"
                under:
                  - {s: "que quizá le habrá pasado las sienes", r: "describes 'balazo': which perhaps has gone through his temples"}
                  - {s: "o le dejará estropeado de brazo o pierna", r: "describes 'balazo', 2: or will leave him crippled in arm or leg"}
        forms:
          - {w: "lléguese", f: "llegu- + -e + se → llegarse (to come), present subjunctive, it, with 'se' on the end: 'let come'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "pondrán", f: "pondr- + -án → poner (to put), future, they (people in general). Irregular stem pondr-: pondré, pondrás, pondrá, pondremos, pondréis, pondrán."}
          - {w: "hecha", f: "irregular participle of hacer (to make), feminine to match 'borla'."}
          - {w: "curarle", f: "curar (to treat) + le (for him), the pronoun hung on the infinitive after 'para'."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun ('balazo'), like un, buen, ningún."}
          - {w: "habrá pasado", f: "habr- + -á → haber, future, it, + pasado, the participle of pasar (to pass through): the future perfect, 'will have gone through', here a guess about the past ('has perhaps gone through'). haber in the future: habré, habrás, habrá, habremos, habréis, habrán."}
          - {w: "dejará", f: "dejar- + -á → dejar (to leave), future, it. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "estropeado", f: "participle of estropear (to maim), masculine to match 'le' (the soldier)."}
        note: "The doctor's tassel becomes a wad of lint on a head wound. Cervantes himself was shot twice in the chest and lost the use of his left hand at Lepanto (1571), so 'crippled in arm' is his own case."
      - es: "Y, cuando esto no suceda, sino que el cielo piadoso le guarde y conserve sano y vivo, podrá ser que se quede en la mesma pobreza que antes estaba, y que sea menester que suceda uno y otro rencuentro, una y otra batalla, y que de todas salga vencedor, para medrar en algo; pero estos milagros vense raras veces."
        literal: "And, when this not may-happen, but that the heaven merciful him may-guard and may-keep healthy and alive, it-will-be-able to-be that he-may-remain in the same poverty that before he-was, and that it-be needful that may-happen one and another skirmish, one and another battle, and that from all he-may-come-out victor, to prosper in something; but these miracles see-themselves rare times."
        ormsby: "Or if this does not happen, and merciful Heaven watches over him and keeps him safe and sound, it may be he will be in the same poverty he was in before, and he must go through more engagements and more battles, and come victorious out of all before he betters himself; but miracles of that sort are seldom seen."
        vocab:
          - {w: "cuando", d: "here 'even supposing, if' (with the subjunctive)"}
          - {w: "piadoso", d: "merciful, compassionate"}
          - {w: "podrá ser que", d: "it may be that"}
          - {w: "mesmo", d: "= mismo, same (old form)"}
          - {w: "ser menester", d: "to be necessary"}
