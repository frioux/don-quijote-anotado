          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "tengo", f: "teng- + -o → tener (to hold), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "averiguado", f: "participle of averiguar (to ascertain), in the set phrase 'tener por averiguado' (to take as proven)."}
          - {w: "esta", f: "est- + -a → este (this), feminine to match 'señora'."}
          - {w: "se dice ser", f: "dic- + -e → decir (to say), present, she, with 'se' (herself) + ser (to be): 'says herself to be', calls herself. decir in the present: digo, dices, dice, decimos, decís, dicen."}
          - {w: "lo es", f: "es → ser (to be), present, she: soy, eres, es, somos, sois, son. 'lo' stands for 'reina': Spanish repeats a predicate with neuter 'lo' ('she is it')."}
      - es: "porque, a ser lo que ella dice, no se anduviera hocicando con alguno de los que están en la rueda, a vuelta de cabeza y a cada traspuesta."
