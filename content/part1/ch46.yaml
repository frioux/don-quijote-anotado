          - {w: "manchado", f: "manch- + -ado → participle of manchar (to spot, stain), masculine to match 'león'; it also sounds like 'manchego' (from La Mancha)."}
          - {w: "tobosina", f: "Toboso + -ina, an adjective made up for the occasion, feminine to match 'paloma'."}
