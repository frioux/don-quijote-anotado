          - {w: "aldegüela", f: "alde(a) + -güela, a diminutive suffix (-uelo, -uela): 'little village'."}
          - {w: "se suena", f: "suen- + -a → sonarse (to be rumoured), present, it, with 'se' making it impersonal, 'than is talked about'. The stressed o becomes ue: sueno, suenas, suena, sonamos, sonáis, suenan."}
          - {w: "sea dicho", f: "se- + -a → ser (to be), present subjunctive, it: sea, seas, sea, seamos, seáis, sean; + dicho, the irregular participle of decir (to say): passive 'be it said'."}
          - {w: "tocadas honradas", f: "tocad- + -as → tocado, participle of tocar (to put a headdress on), used as a noun, feminine plural ('the coifed women'); honradas = honrado (honest) also feminine plural to match."}
