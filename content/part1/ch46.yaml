          - {w: "gremio", d: "bosom, lap; 'reducir al gremio' = to take back into the fold (a churchy phrase, as of a sinner received back into the Church)"}
          - {w: "sicut erat in principio", d: "Latin: 'as it was in the beginning', from the Gloria Patri said at the end of every psalm"}
