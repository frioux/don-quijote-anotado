          - {w: "debido", d: "due, proper, lawful"}
          - {w: "felice", d: "= feliz, happy, blessed (old poetic form)"}
          - {w: "vientre", d: "womb; also belly"}
          - {w: "cachorro", d: "cub, whelp"}
          - {w: "perpetuo", d: "everlasting, perpetual"}
        diagram:
          - s: "y vio"
            r: "main verb: and he saw"
            under:
              - s: "que le prometían el verse ayuntados"
                r: "what he saw: that they promised him to see themselves joined"
                under:
                  - {s: "en santo y debido matrimonio", r: "how: in holy and lawful matrimony"}
