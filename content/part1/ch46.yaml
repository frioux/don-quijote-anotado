          - {w: "haber andado, pasado", f: "haber (to have), infinitive after 'de' + andado and pasado, participles of andar (to walk) and pasar (to spend): perfect infinitive, 'having walked, having spent'."}
          - {w: "malas, peores", f: "mal- + -as → malo (bad), feminine plural to match 'noches'; peores = plural of peor (worse), to match 'días'."}
          - {w: "ha de venir", f: "h- + -a → haber (to have), present, he: he, has, ha, hemos, habéis, han; + de + venir (to come): 'haber de' + infinitive = is going to, is to."}
          - {w: "coger", f: "coger (to gather, reap), infinitive after 'venir a'."}
          - {w: "se está holgando", f: "est- + -á → estar (to be), present, he: estoy, estás, está, estamos, estáis, están; + holgando, gerund of holgarse (to take one's ease), with 'se' in front: 'is enjoying himself'."}
          - {w: "esta", f: "est- + -a → este (this), feminine to match 'venta'."}
          - {w: "darme", f: "dar (to give) + me (myself): 'darse priesa' = to hurry; infinitive after 'para qué'."}
          - {w: "ensille, albarde, aderece", f: "ensill- + -e → ensillar (to saddle), albard- + -e → albardar (to packsaddle), aderec- + -e → aderezar (to make ready; z → c before e), present subjunctive, I, after 'a que'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "será", f: "ser- + -á → ser (to be), future, it. The future adds endings to the whole infinitive: seré, serás, será, seremos, seréis, serán."}
          - {w: "nos estemos", f: "est- + -emos → estar (to be), present subjunctive, we, with 'nos' (ourselves): esté, estés, esté, estemos, estéis, estén. Subjunctive after 'será mejor que'."}
          - {w: "quedos", f: "qued- + -os → quedo (still, quiet), masculine plural to match 'nos'."}
          - {w: "hile", f: "hil- + -e → hilar (to spin), present subjunctive, she (each whore): 'let her spin'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "comamos", f: "com- + -amos → comer (to eat), present subjunctive, we: 'let us eat'. The present subjunctive of -er verbs: -a, -as, -a, -amos, -áis, -an."}
        note: "Sancho fears that Don Fernando, not his master, will end up with Micomicona's kingdom, so the whole quest (and his own island) would be wasted. The coarse proverb is aimed at Dorotea, which is what sets off Don Quijote's fury."
  - sentences:
      - es: "¡Oh, válame Dios, y cuán grande que fue el enojo que recibió don Quijote, oyendo las descompuestas palabras de su escudero!"
        literal: "Oh, may-help-me God, and how great that was the anger that received Don Quijote, hearing the impudent words of his squire!"
        ormsby: "Good God, what was the indignation of Don Quixote when he heard the audacious words of his squire!"
        vocab:
          - {w: "válame Dios", d: "God help me! good God! (= 'válgame Dios', old form)"}
          - {w: "cuán", d: "how (before an adjective; literary form of 'qué' / 'cuanto')"}
          - {w: "enojo", d: "anger"}
          - {w: "descompuesto", d: "insolent, impudent, unseemly (not 'decomposed')"}
        diagram:
          - s: "Oh, válame Dios"
            r: "exclamation: oh, God help me"
          - s: "y cuán grande que fue el enojo"
            r: "main verb: and how great was the anger"
            under:
              - {s: "que recibió don Quijote", r: "describes 'enojo': that Don Quijote felt"}
              - {s: "oyendo las descompuestas palabras de su escudero", r: "when: hearing his squire's insolent words"}
        forms:
          - {w: "válame", f: "val- + -a + me → valer (to help), present subjunctive, he (God), with 'me' stuck on the end: 'may God help me'. Modern 'válgame': valga, valgas, valga, valgamos, valgáis, valgan. A wish puts the pronoun at the end."}
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, it. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron. The 'que' after 'cuán grande' is an extra, emphatic que of popular speech."}
          - {w: "recibió", f: "recib- + -ió → recibir (to receive, feel), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "oyendo", f: "gerund of oír (to hear): the i between vowels becomes y, 'hearing'."}
          - {w: "descompuestas", f: "descompuest- + -as → descompuesto, irregular participle of descomponer (to upset), used as an adjective, feminine plural to match 'palabras'."}
        note: "The narrator himself breaks in with an exclamation, mocking the high style of the chivalric romances that Don Quijote's rage now imitates."
