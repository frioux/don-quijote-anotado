          - {w: "gran", f: "grande (great) clipped to gran before a singular noun ('cuita')."}
          - {w: "es", f: "es → ser (to be), present, it: soy, eres, es, somos, sois, son. Subject is the infinitive 'favorecer': 'to help ... is [his] duty'."}
