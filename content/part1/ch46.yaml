          - {w: "consolado", f: "consol- + -ado → participle of consolar (to comfort), masculine to match 'don Quijote'."}
          - {w: "escuchada", f: "escuch- + -ada → participle of escuchar (to listen to), used as an adjective before the noun, feminine to match 'profecía'."}
          - {w: "coligió", f: "colig- + -ió → colegir (to infer), preterite, he: the e of the stem turns to i in the he/they forms. colegí, colegiste, coligió, colegimos, colegisteis, coligieron."}
          - {w: "de ella", f: "'of it', feminine because it stands for 'profecía'; here written apart, where Cervantes often writes 'della'."}
      - es: "y vio que le prometían el verse ayuntados en santo y debido matrimonio con su querida Dulcinea del Toboso, de cuyo felice vientre saldrían los cachorros, que eran sus hijos, para gloria perpetua de la Mancha."
        literal: "and he-saw that to-him they-were-promising the seeing-themselves joined in holy and due matrimony with his beloved Dulcinea del Toboso, from whose happy womb would-come-out the cubs, which were his sons, for glory perpetual of La Mancha."
        ormsby: "and perceived it was promised to him that he should see himself united in holy and lawful matrimony with his beloved Dulcinea del Toboso, from whose blessed womb should proceed the whelps, his sons, to the eternal glory of La Mancha;"
