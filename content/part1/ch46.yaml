  - sentences:
      - es: "— Yo os agradezco, señor caballero, el deseo que mostráis tener de favorecerme en mi gran cuita, bien así como caballero, a quien es anejo y concerniente favorecer los huérfanos y menesterosos;"
        literal: "— I to-you thank, sir knight, the desire that you-show to-have of to-favor-me in my great affliction, well thus as knight, to whom it-is annexed and pertaining to-favor the orphans and needy;"
        ormsby: "“I give you thanks, sir knight, for the eagerness you, like a good knight to whom it is a natural obligation to succour the orphan and the needy, display to afford me aid in my sore trouble;"
        vocab:
          - {w: "agradecer", d: "to thank for, be grateful for; the thing thanked for is the direct object ('os agradezco el deseo')"}
          - {w: "favorecer", d: "to help, aid, come to the aid of (stronger than English 'favor')"}
          - {w: "cuita", d: "trouble, affliction, distress (old, chivalric word)"}
          - {w: "bien así como", d: "just as, exactly like, as befits"}
          - {w: "anejo", d: "attached, annexed; 'ser anejo a' = to go with, belong to (a duty that comes with the office)"}
          - {w: "concerniente", d: "pertaining, belonging (legal-sounding word)"}
          - {w: "menesteroso", d: "needy, in want"}
