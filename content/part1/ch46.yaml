        literal: "I-say that it-was so-much, that, with voice hurried and stammering tongue, hurling live fire through the eyes, he-said:"
        ormsby: "So great was it, that in a voice inarticulate with rage, with a stammering tongue, and eyes that flashed living fire, he exclaimed,"
        vocab:
          - {w: "atropellado", d: "rushed, tumbling over itself, garbled (from 'atropellar', to trample)"}
          - {w: "tartamudo", d: "stammering, stuttering"}
          - {w: "lanzar", d: "to hurl, throw out"}
          - {w: "vivo fuego", d: "living fire, blazing fire"}
        diagram:
          - s: "Digo"
            r: "main verb: I (the narrator) say"
            under:
              - s: "que fue tanto"
                r: "what I say: that it was so great"
                under:
                  - s: "que ... dijo"
                    r: "result: that he said"
                    under:
                      - {s: "con voz atropellada y tartamuda lengua", r: "how: with a garbled voice and stammering tongue"}
                      - {s: "lanzando vivo fuego por los ojos", r: "how: shooting living fire from his eyes"}
        forms:
          - {w: "Digo", f: "dig- + -o → decir (to say), present, I (the narrator). Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, it (the anger). Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "tanto", f: "tant- + -o → tanto (so much, so great), masculine to match 'enojo'; it sets up the result clause 'que ...'."}
          - {w: "atropellada, tartamuda", f: "atropellad- + -a → atropellado (participle of atropellar, to trample) and tartamud- + -a → tartamudo (stammering), feminine to match 'voz' and 'lengua'."}
          - {w: "lanzando", f: "lanz- + -ando → lanzar (to hurl), gerund: 'hurling'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— ¡Oh bellaco villano, mal mirado, descompuesto, ignorante, infacundo, deslenguado, atrevido, murmurador y maldiciente!"
        literal: "— Oh rascally peasant, ill regarded, insolent, ignorant, ill-spoken, unbridled-of-tongue, impudent, backbiter and slanderer!"
        ormsby: "“Rascally clown, boorish, insolent, and ignorant, ill-spoken, foul-mouthed, impudent backbiter and slanderer!"
        vocab:
          - {w: "bellaco", d: "rascally, knavish; a rogue"}
          - {w: "villano", d: "peasant, boor, low-born fellow: an insult of class, not English 'villain'"}
          - {w: "mal mirado", d: "ill-mannered, inconsiderate, disrespectful"}
          - {w: "descompuesto", d: "insolent, unseemly (not 'decomposed')"}
          - {w: "infacundo", d: "ineloquent, clumsy of speech (a learned Latinism, from 'facundo', eloquent)"}
          - {w: "deslenguado", d: "foul-mouthed, loose-tongued"}
          - {w: "atrevido", d: "impudent, insolent, bold"}
          - {w: "murmurador", d: "backbiter, gossip, one who speaks ill behind people's backs"}
          - {w: "maldiciente", d: "slanderer, evil-tongued"}
        diagram:
          - s: "Oh bellaco villano"
            r: "exclamation: oh rascally peasant (no verb)"
            under:
              - {s: "mal mirado, descompuesto, ignorante, infacundo, deslenguado, atrevido, murmurador y maldiciente", r: "string of insults, all describing 'villano'"}
        forms:
          - {w: "mal mirado", f: "mal (badly) + mirad- + -o → mirar (to look, to consider), participle used as an adjective: 'ill-considered, disrespectful', masculine to match 'villano'."}
          - {w: "descompuesto", f: "irregular participle of descomponer (to upset, disorder), used as an adjective: 'out of order, insolent'."}
          - {w: "infacundo", f: "in- (not) + facundo (eloquent): the Latin prefix in- makes the opposite."}
          - {w: "deslenguado", f: "des- (without) + lengua (tongue) + -ado: 'unbridled of tongue', built like a participle."}
          - {w: "atrevido", f: "atrev- + -ido → atreverse (to dare), participle used as an adjective: 'daring, impudent'."}
          - {w: "murmurador", f: "murmur(ar) (to murmur, backbite) + -ador: the -dor suffix makes a noun for the doer, 'backbiter'."}
          - {w: "maldiciente", f: "mal (ill) + diciente, old present participle of decir (to say): 'ill-saying, slanderer'."}
        note: "Don Quijote's tirade is a parody of the heaped-up insults of the romances. Most of these words describe speech, because Sancho's offence was what he said."
      - es: "¿Tales palabras has osado decir en mi presencia y en la destas ínclitas señoras, y tales deshonestidades y atrevimientos osaste poner en tu confusa imaginación?"
        literal: "Such words have-you dared to-say in my presence and in the [presence] of-these illustrious ladies, and such indecencies and impudences you-dared to-put in your confused imagination?"
        ormsby: "Hast thou dared to utter such words in my presence and in that of these illustrious ladies? Hast thou dared to harbour such gross and shameless thoughts in thy muddled imagination?"
        vocab:
          - {w: "osar", d: "to dare"}
          - {w: "destas", d: "= de estas, of these (old contraction)"}
          - {w: "ínclito", d: "illustrious, renowned (literary)"}
          - {w: "deshonestidad", d: "indecency, lewdness (not 'dishonesty')"}
          - {w: "atrevimiento", d: "impudence, insolence, effrontery"}
          - {w: "confuso", d: "muddled, confused"}
        diagram:
          - s: "Tales palabras has osado decir"
            r: "main verb 1: have you dared to say such words"
            under:
              - {s: "en mi presencia y en la destas ínclitas señoras", r: "where: in my presence and in that of these illustrious ladies"}
          - s: "y tales deshonestidades y atrevimientos osaste poner"
            r: "main verb 2: and did you dare to put such indecencies and impudences"
            under:
              - {s: "en tu confusa imaginación", r: "where: into your muddled imagination"}
        forms:
          - {w: "Tales", f: "plural of tal (such), to match 'palabras'; it comes first for emphasis, before the verb."}
          - {w: "has osado", f: "h- + -as → haber (to have), present, you (tú): he, has, ha, hemos, habéis, han; + osado, participle of osar (to dare): present perfect, 'you have dared'."}
          - {w: "decir", f: "decir (to say), infinitive after 'has osado'."}
          - {w: "la destas", f: "la = 'that' (the presence), standing for 'presencia' so as not to repeat it; destas = de + estas (of these), feminine plural to match 'señoras'."}
          - {w: "ínclitas", f: "íncli- + -tas → ínclito (illustrious), feminine plural to match 'señoras'."}
          - {w: "osaste", f: "os- + -aste → osar (to dare), preterite, you (tú). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "poner", f: "poner (to put), infinitive after 'osaste'."}
          - {w: "confusa", f: "confus- + -a → confuso (muddled), feminine to match 'imaginación', placed before the noun."}
      - es: "¡Vete de mi presencia, monstruo de naturaleza, depositario de mentiras, almario de embustes, silo de bellaquerías, inventor de maldades, publicador de sandeces, enemigo del decoro que se debe a las reales personas!"
        literal: "Go-away from my presence, monster of nature, repository of lies, cupboard of frauds, grain-pit of knaveries, inventor of wickednesses, publisher of nonsenses, enemy of-the decorum that itself is-owed to the royal persons!"
        ormsby: "Begone from my presence, thou born monster, storehouse of lies, hoard of untruths, garner of knaveries, inventor of scandals, publisher of absurdities, enemy of the respect due to royal personages!"
        vocab:
          - {w: "monstruo de naturaleza", d: "freak of nature, monster"}
          - {w: "depositario", d: "depository, keeper of things deposited"}
          - {w: "almario", d: "= armario, cupboard, chest (old form)"}
          - {w: "embuste", d: "lie, trick, fraud"}
          - {w: "silo", d: "underground grain store, pit"}
          - {w: "bellaquería", d: "knavery, roguish trick"}
          - {w: "maldad", d: "wickedness, evil deed"}
          - {w: "sandez", d: "foolishness, piece of nonsense"}
          - {w: "decoro", d: "respect, decorum, the honour owed to rank"}
          - {w: "reales personas", d: "royal persons, royalty ('real' = royal here, not 'real')"}
        diagram:
          - s: "Vete de mi presencia"
            r: "main verb: get out of my sight"
            under:
              - {s: "monstruo de naturaleza, depositario de mentiras, almario de embustes, silo de bellaquerías, inventor de maldades, publicador de sandeces", r: "addressee: a string of names for Sancho, each a container or maker of lies"}
              - s: "enemigo del decoro"
                r: "addressee, last name: enemy of the respect"
                under:
                  - {s: "que se debe a las reales personas", r: "describes 'decoro': which is owed to royal persons"}
        forms:
          - {w: "Vete", f: "ve + te → irse (to go away), imperative, you (tú), with 'te' stuck on the end: 'go away!'. The tú command of ir is the short irregular 've'; a command always takes the pronoun at the end."}
          - {w: "almario", f: "old form of armario (cupboard): r and l often swap in Golden Age Spanish."}
          - {w: "publicador", f: "public(ar) (to publish, spread) + -ador: the -dor suffix makes a noun for the doer, 'publisher, spreader'."}
          - {w: "sandeces", f: "plural of sandez (piece of folly): z becomes c before -es."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
          - {w: "se debe", f: "deb- + -e → deber (to owe), present, it, with 'se' making it passive: 'is owed'. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "reales", f: "plural of real (royal), to match 'personas', placed before the noun."}
        note: "Don Quijote defends Dorotea as a real queen, so Sancho's slur is also treason against royalty. The insults move from a cupboard to a grain pit, all places where things are stored up."
      - es: "¡Vete; no parezcas delante de mí, so pena de mi ira!"
