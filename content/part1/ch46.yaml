  - sentences:
      - es: "Tomáronle luego en hombros, y, al salir del aposento, se oyó una voz temerosa, todo cuanto la supo formar el barbero, no el del albarda, sino el otro, que decía:"
        literal: "They-took-him then on shoulders, and, at-the going-out of-the room, itself was-heard a voice fearsome, all as-much-as it knew-how to-form the barber, not the [one] of-the packsaddle, but the other, which was-saying:"
        ormsby: "They then took him on their shoulders, and as they passed out of the room an awful voice—as much so as the barber, not he of the packsaddle but the other, was able to make it—was heard to say,"
        vocab:
          - {w: "en hombros", d: "on their shoulders"}
          - {w: "al salir", d: "on going out, as they went out (al + infinitive = 'on doing')"}
          - {w: "aposento", d: "room, chamber"}
          - {w: "temeroso", d: "fearsome, dreadful (here causing fear, not feeling it)"}
          - {w: "todo cuanto", d: "as much as, all that"}
          - {w: "saber + infinitive", d: "to know how to, manage to"}
          - {w: "el del albarda", d: "the one of the packsaddle: the barber whose basin and packsaddle were taken; 'el albarda' is the old masculine article before stressed a-, modern 'la albarda'"}
        diagram:
          - s: "Tomáronle"
            r: "main verb 1: they took him up"
            under:
              - {s: "luego", r: "when: then, at once"}
              - {s: "en hombros", r: "how: on their shoulders"}
          - s: "se oyó una voz temerosa"
            r: "main verb 2 (after 'y'): a fearsome voice was heard"
            under:
              - {s: "al salir del aposento", r: "when: as they left the room"}
              - s: "todo cuanto la supo formar el barbero"
                r: "how fearsome: as much as the barber could make it"
                under:
                  - {s: "no el del albarda, sino el otro", r: "which barber: not the packsaddle one, but the other (Master Nicolás)"}
              - {s: "que decía:", r: "describes 'voz': which said"}
        forms:
          - {w: "Tomáronle", f: "tom- + -aron + le → tomar (to take), preterite, they, with 'le' (him) stuck on the end; modern 'le tomaron'. Cervantes hangs the pronoun on a verb that opens the clause. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "al salir", f: "al = a + el, before the infinitive salir (to go out): 'on going out'."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
          - {w: "se oyó", f: "oy- + -ó → oír (to hear), preterite, it, with passive 'se': 'was heard'. Irregular: oí, oíste, oyó, oímos, oísteis, oyeron."}
          - {w: "supo", f: "sup- + -o → saber (to know how), preterite, he. Irregular: supe, supiste, supo, supimos, supisteis, supieron."}
          - {w: "la", f: "'it', feminine because it stands for 'voz'."}
          - {w: "decía", f: "dec- + -ía → decir (to say), imperfect, it (the voice). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
        note: "There are two barbers at the inn: the village barber, Master Nicolás, Don Quijote's friend, and the travelling barber whose basin became Mambrino's helmet. The prophet is Master Nicolás."
  - sentences:
      - es: "— ¡Oh Caballero de la Triste Figura!, no te dé afincamiento la prisión en que vas, porque así conviene para acabar más presto la aventura en que tu gran esfuerzo te puso;"
        literal: "— Oh Knight of the Sad Figure!, not to-you may-give distress the imprisonment in which you-go, because thus it-is-fitting for to-finish more quickly the adventure in which your great valor you put;"
        ormsby: "“O Knight of the Rueful Countenance, let not this captivity in which thou art placed afflict thee, for this must needs be, for the more speedy accomplishment of the adventure in which thy great heart has engaged thee;"
        vocab:
          - {w: "Caballero de la Triste Figura", d: "Knight of the Sad Figure (Ormsby's 'Rueful Countenance'), the title Sancho gave Don Quijote"}
          - {w: "afincamiento", d: "distress, anguish (an old word, chosen to sound antique)"}
          - {w: "prisión", d: "imprisonment, captivity; also the bonds themselves"}
          - {w: "convenir", d: "to be fitting, necessary: 'así conviene' = so it must be"}
          - {w: "presto", d: "quickly, soon"}
          - {w: "esfuerzo", d: "valor, courage (old sense), not 'effort'"}
        diagram:
          - s: "no te dé afincamiento"
            r: "main verb: let it not give you distress"
            under:
              - {s: "¡Oh Caballero de la Triste Figura!", r: "who is addressed"}
              - s: "la prisión"
                r: "subject: the captivity"
                under:
                  - {s: "en que vas", r: "describes 'prisión': in which you travel"}
              - s: "porque así conviene"
                r: "why: because so it must be"
                under:
                  - s: "para acabar más presto la aventura"
                    r: "why: to finish the adventure sooner"
                    under:
                      - {s: "en que tu gran esfuerzo te puso", r: "describes 'aventura': which your great courage set you on"}
        forms:
          - {w: "dé", f: "d- + -é → dar (to give), present subjunctive, it: 'may it (not) give'; the accent tells it from 'de' (of). After 'no' it makes a negative command: dé, des, dé, demos, deis, den."}
          - {w: "vas", f: "v- + -as → ir (to go), present, you (tú). Irregular: voy, vas, va, vamos, vais, van."}
          - {w: "conviene", f: "convien- + -e → convenir (to be fitting), present, it. Like venir (to come): convengo, convienes, conviene, convenimos, convenís, convienen."}
          - {w: "acabar", f: "infinitive of acabar (to finish), after 'para'."}
          - {w: "puso", f: "pus- + -o → poner (to put), preterite, it (your courage). Irregular: puse, pusiste, puso, pusimos, pusisteis, pusieron."}
          - {w: "te", f: "'you, to you', the tú pronoun: the prophet speaks to Don Quijote as 'tú', as oracles and enchanters do in the romances."}
        note: "The barber imitates the prophecies of enchanters in the books of chivalry, with a solemn 'tú', old words like 'afincamiento', and dark animal allegories that follow."
      - es: "la cual se acabará cuando el furibundo león manchado con la blanca paloma tobosina yoguieren en uno, ya después de humilladas las altas cervices al blando yugo matrimoñesco;"
        literal: "the which itself will-finish when the furious lion Manchegan with the white dove Tobosan shall-lie in one, already after of humbled the high necks to-the soft yoke matrimonial;"
