part: 1
chapter: 46
title_es: "Capítulo XLVI. De la notable aventura de los cuadrilleros, y la gran ferocidad de nuestro buen caballero don Quijote"
title_en: "Of the end of the notable adventure of the officers of the holy brotherhood; and of the great ferocity of our worthy knight, Don Quixote"
paragraphs:
  - sentences:
      - es: "En tanto que don Quijote esto decía, estaba persuadiendo el cura a los cuadrilleros como don Quijote era falto de juicio, como lo veían por sus obras y por sus palabras, y que no tenían para qué llevar aquel negocio adelante, pues, aunque le prendiesen y llevasen, luego le habían de dejar por loco;"
        literal: "While that Don Quijote this was-saying, was persuading the priest to the troopers how Don Quijote was lacking of judgment, as it they-were-seeing by his deeds and by his words, and that not they-had for-what to-carry that business forward, since, although him they-might-arrest and might-carry-off, soon him they-would-have to-let-go as mad;"
        ormsby: "While Don Quixote was talking in this strain, the curate was endeavouring to persuade the officers that he was out of his senses, as they might perceive by his deeds and his words, and that they need not press the matter any further, for even if they arrested him and carried him off, they would have to release him by-and-by as a madman;"
        vocab:
          - {w: "en tanto que", d: "while, during the time that"}
          - {w: "cuadrillero", d: "trooper of the Santa Hermandad (Holy Brotherhood), the rural police that hunted highwaymen; they came to arrest Don Quijote for freeing the galley slaves"}
          - {w: "como", d: "here 'that' (introducing what he persuades them of), not 'as' or 'how'"}
          - {w: "falto de juicio", d: "lacking in judgment, out of his mind; 'falto de' = short of"}
          - {w: "obras", d: "deeds, actions (not 'works' in the artistic sense)"}
          - {w: "no tener para qué", d: "to have no reason to, need not"}
          - {w: "llevar adelante", d: "to carry forward, press on with"}
          - {w: "negocio", d: "business, matter, affair (not only commerce)"}
          - {w: "prender", d: "to arrest, seize"}
          - {w: "luego", d: "at once, soon (the old sense), not 'later'"}
          - {w: "dejar por loco", d: "to let go as a madman: a madman could not be held answerable for a crime"}
        diagram:
          - s: "estaba persuadiendo el cura a los cuadrilleros"
            r: "main verb: the priest was persuading the troopers"
            under:
              - {s: "En tanto que don Quijote esto decía", r: "when: while Don Quijote was saying this"}
              - s: "como don Quijote era falto de juicio"
                r: "what he urged, 1: that Don Quijote was out of his mind"
                under:
                  - {s: "como lo veían por sus obras y por sus palabras", r: "how they could tell: as they saw from his deeds and words"}
              - s: "y que no tenían para qué llevar aquel negocio adelante"
                r: "what he urged, 2: and that they had no reason to press the matter"
                under:
                  - s: "pues"
                    r: "why: since"
                    under:
                      - {s: "aunque le prendiesen y llevasen", r: "concession: even if they arrested him and took him away"}
                      - {s: "luego le habían de dejar por loco", r: "main idea: they would soon have to let him go as a madman"}
        forms:
          - {w: "decía", f: "dec- + -ía → decir (to say), imperfect, he: 'was saying'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "estaba persuadiendo", f: "est- + -aba → estar (to be), imperfect, he, + persuadiendo, gerund of persuadir (to persuade): 'was persuading', an action in progress. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "era", f: "ser (to be), imperfect, he. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "veían", f: "ve- + -ían → ver (to see), imperfect, they. ver keeps its e: veía, veías, veía, veíamos, veíais, veían."}
          - {w: "tenían", f: "ten- + -ían → tener (to have), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "aquel", f: "'that', masculine singular to match 'negocio'; aquel points to something farther off than ese."}
          - {w: "prendiesen, llevasen", f: "prend- + -iesen → prender (to arrest) and llev- + -asen → llevar (to carry off), imperfect subjunctive (-se form), they, after 'aunque' for a supposition: 'even if they arrested'. -er/-ir: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen; -ar: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "habían de dejar", f: "hab- + -ían → haber (to have), imperfect, they, + de + infinitive dejar (to let go): 'haber de' = must, would have to. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
        note: "In the previous chapter the troopers of the Holy Brotherhood produced a warrant against Don Quijote for freeing the galley slaves. The priest's argument is a legal one: a madman could not be punished, so an arrest would be a waste of their effort."
      - es: "a lo que respondió el del mandamiento que a él no tocaba juzgar de la locura de don Quijote, sino hacer lo que por su mayor le era mandado, y que una vez preso, siquiera le soltasen trecientas."
        literal: "to which answered the [one] of-the warrant that to him not it-belonged to-judge of the madness of Don Quijote, but to-do that which by his superior to-him was ordered, and that once arrested, even-if him they-might-release three-hundred [times]."
        ormsby: "to which the holder of the warrant replied that he had nothing to do with inquiring into Don Quixote’s madness, but only to execute his superior’s orders, and that once taken they might let him go three hundred times if they liked."
        vocab:
          - {w: "el del mandamiento", d: "the one with the warrant; 'mandamiento' = a written order of arrest"}
          - {w: "tocar a uno", d: "to be one's business, fall to one: 'a él no tocaba' = it was not his place"}
          - {w: "juzgar de", d: "to judge, give a ruling on"}
          - {w: "mayor", d: "superior, the officer above him"}
          - {w: "una vez preso", d: "once he was arrested"}
          - {w: "siquiera", d: "even if, for all he cared"}
          - {w: "trecientas", d: "= trescientas, three hundred (old spelling); '[veces]' (times) is understood"}
        diagram:
          - s: "respondió el del mandamiento"
            r: "main verb: the man with the warrant answered"
            under:
              - {s: "a lo que", r: "linking: to which (to the priest's argument)"}
              - s: "que a él no tocaba juzgar de la locura de don Quijote"
                r: "what he said, 1: that it was not his job to rule on Don Quijote's madness"
                under:
                  - s: "sino hacer lo"
                    r: "contrast: but to do what"
                    under:
                      - {s: "que por su mayor le era mandado", r: "describes 'lo': what he was ordered by his superior"}
              - s: "y que una vez preso"
                r: "what he said, 2: and that once he was arrested"
                under:
                  - {s: "siquiera le soltasen trecientas", r: "they could release him three hundred times for all he cared"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "del", f: "de + el; 'el del mandamiento' = the one of the warrant, the article standing alone for a person."}
          - {w: "tocaba", f: "toc- + -aba → tocar (to belong to, be one's business), imperfect, it. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "le era mandado", f: "era, ser (to be), imperfect, it (era, eras, era, éramos, erais, eran), + mandado, participle of mandar (to order): the passive, 'was ordered to him'."}
          - {w: "preso", f: "irregular participle of prender (to arrest), masculine to match the man arrested; 'una vez preso' is an absolute phrase, 'once arrested'."}
          - {w: "soltasen", f: "solt- + -asen → soltar (to release), imperfect subjunctive (-se form), they, after 'siquiera' (even if). The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "trecientas", f: "= trescientas, feminine to agree with the understood 'veces' (times)."}
  - sentences:
      - es: "— Con todo eso —dijo el cura—, por esta vez no le habéis de llevar, ni aun él dejará llevarse, a lo que yo entiendo."
        literal: "— With all that —said the priest—, for this time not him you-have to carry-off, nor even he will-allow to-carry-himself-off, to what I understand."
        ormsby: "“For all that,” said the curate, “you must not take him away this time, nor will he, it is my opinion, let himself be taken away.”"
        vocab:
          - {w: "con todo eso", d: "for all that, nevertheless"}
          - {w: "haber de", d: "must, be going to: 'no le habéis de llevar' = you are not to take him"}
          - {w: "ni aun", d: "nor even"}
          - {w: "a lo que yo entiendo", d: "as far as I understand, in my opinion"}
        diagram:
          - s: "dijo el cura"
            r: "speech tag: said the priest"
          - s: "no le habéis de llevar"
            r: "main verb 1: you are not to take him"
            under:
              - {s: "Con todo eso", r: "linking: for all that"}
              - {s: "por esta vez", r: "when: this time"}
          - s: "ni aun él dejará llevarse"
            r: "main verb 2: nor will he even let himself be taken"
            under:
              - {s: "a lo que yo entiendo", r: "aside: as I understand it"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "esta", f: "est- + -a → este (this), feminine to match 'vez'."}
          - {w: "habéis de llevar", f: "hab- + -éis → haber (to have), present, you (vosotros, the troopers), + de + llevar (to carry off): 'you must (not) take'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "dejará", f: "dejar- + -á → dejar (to let, allow), future, he. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "llevarse", f: "llevar (to carry off) + se (himself), the pronoun hung on the infinitive after 'dejará': 'let himself be taken'."}
          - {w: "entiendo", f: "entiend- + -o → entender (to understand), present, I. The stem e becomes ie when stressed: entiendo, entiendes, entiende, entendemos, entendéis, entienden."}
  - sentences:
      - es: "En efeto, tanto les supo el cura decir, y tantas locuras supo don Quijote hacer, que más locos fueran que no él los cuadrilleros si no conocieran la falta de don Quijote;"
        literal: "In effect, so-much to-them knew-how the priest to-say, and so-many madnesses knew-how Don Quijote to-do, that more mad would-have-been than not he the troopers if not they-had-recognized the lack of Don Quijote;"
        ormsby: "In short, the curate used such arguments, and Don Quixote did such mad things, that the officers would have been more mad than he was if they had not perceived his want of wits,"
        vocab:
          - {w: "en efeto", d: "= en efecto, in fact, in short (old spelling 'efeto')"}
          - {w: "saber + infinitive", d: "to know how to, manage to: 'tanto les supo decir' = he managed to say so much to them"}
          - {w: "locuras", d: "mad acts, crazy things"}
          - {w: "que no", d: "after a comparison, 'than' (the 'no' is redundant, as often in old Spanish)"}
          - {w: "falta", d: "lack, defect: here his lack of wits"}
        diagram:
          - s: "tanto les supo el cura decir"
            r: "main verb 1: the priest managed to say so much to them"
            under:
              - {s: "En efeto", r: "linking: in short"}
          - s: "y tantas locuras supo don Quijote hacer"
            r: "main verb 2: and Don Quijote managed to do so many mad things"
            under:
              - s: "que más locos fueran que no él los cuadrilleros"
                r: "result of 'tanto ... tantas': that the troopers would have been madder than he"
                under:
                  - {s: "si no conocieran la falta de don Quijote", r: "condition: if they had not recognized Don Quijote's defect"}
        forms:
          - {w: "supo", f: "sup- + -o → saber (to know, know how), preterite, he. Irregular: supe, supiste, supo, supimos, supisteis, supieron. Followed by an infinitive ('decir', 'hacer') it means 'managed to'."}
          - {w: "tantas", f: "tant- + -as → tanto (so many), feminine plural to match 'locuras'; with 'tanto' before it, it sets up the result clause 'que ...'."}
          - {w: "locos", f: "loc- + -os → loco (mad), masculine plural to match 'los cuadrilleros'."}
          - {w: "fueran", f: "fu- + -eran → ser (to be), imperfect subjunctive (-ra form), they, used as a conditional: 'would have been'. fuera, fueras, fuera, fuéramos, fuerais, fueran. The -ra form often stands for the conditional in Cervantes."}
          - {w: "conocieran", f: "conoc- + -ieran → conocer (to recognize), imperfect subjunctive (-ra form), they, after 'si': 'if they had not recognized'. The -ra form of -er verbs: -iera, -ieras, -iera, -iéramos, -ierais, -ieran."}
      - es: "y así, tuvieron por bien de apaciguarse, y aun de ser medianeros de hacer las paces entre el barbero y Sancho Panza, que todavía asistían con gran rancor a su pendencia."
        literal: "and so, they-held as good to calm-themselves, and even to be mediators of making the peaces between the barber and Sancho Panza, who still were-attending with great rancor to their quarrel."
        ormsby: "and so they thought it best to allow themselves to be pacified, and even to act as peacemakers between the barber and Sancho Panza, who still continued their altercation with much bitterness."
        vocab:
          - {w: "tener por bien", d: "to see fit, think it best"}
          - {w: "apaciguarse", d: "to calm down, be pacified"}
          - {w: "medianero", d: "mediator, go-between"}
          - {w: "hacer las paces", d: "to make peace, make it up (between two people)"}
          - {w: "asistir a", d: "to keep at, be engaged in (not 'to assist')"}
          - {w: "rancor", d: "= rencor, rancor, bitterness (old form)"}
          - {w: "pendencia", d: "quarrel, brawl"}
        diagram:
          - s: "tuvieron por bien"
            r: "main verb: they saw fit"
            under:
              - {s: "y así", r: "linking: and so"}
              - {s: "de apaciguarse", r: "what they saw fit, 1: to calm down"}
              - s: "y aun de ser medianeros"
                r: "what they saw fit, 2: and even to be go-betweens"
                under:
                  - s: "de hacer las paces entre el barbero y Sancho Panza"
                    r: "for what: to make peace between the barber and Sancho"
                    under:
                      - {s: "que todavía asistían con gran rancor a su pendencia", r: "describes the barber and Sancho: who were still keeping up their quarrel bitterly"}
        forms:
          - {w: "tuvieron", f: "tuv- + -ieron → tener (to hold), preterite, they. Irregular: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron."}
          - {w: "apaciguarse", f: "apaciguar (to pacify) + se (themselves), the pronoun hung on the infinitive after 'de'."}
          - {w: "medianeros", f: "mediane- + -ro + -s → medianero (go-between), plural to match the troopers; from 'mediano' (middle) plus the agent suffix -ero."}
          - {w: "asistían", f: "asist- + -ían → asistir (to be engaged in), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "gran", f: "grande (great) clipped before a singular noun ('rancor')."}
        note: "The barber is the man whose basin Don Quijote took as Mambrino's helmet and whose donkey's packsaddle Sancho took as spoils; he and Sancho came to blows over it in the previous chapter."
      - es: "Finalmente, ellos, como miembros de justicia, mediaron la causa y fueron árbitros della, de tal modo que ambas partes quedaron, si no del todo contentas, a lo menos en algo satisfechas, porque se trocaron las albardas, y no las cinchas y jáquimas;"
        literal: "Finally, they, as members of justice, mediated the case and were arbiters of-it, in such way that both parties remained, if not wholly content, at the least in something satisfied, because themselves were-exchanged the packsaddles, and not the girths and halters;"
        ormsby: "In the end they, as officers of justice, settled the question by arbitration in such a manner that both sides were, if not perfectly contented, at least to some extent satisfied; for they changed the packsaddles, but not the girths or headstalls;"
        vocab:
          - {w: "miembros de justicia", d: "officers of the law"}
          - {w: "mediar", d: "to mediate, settle as a go-between"}
          - {w: "causa", d: "case, lawsuit (legal sense)"}
          - {w: "árbitro", d: "arbiter, arbitrator"}
          - {w: "della", d: "= de ella, of it (old contraction)"}
          - {w: "del todo", d: "entirely, completely"}
          - {w: "a lo menos", d: "at least (= al menos)"}
          - {w: "trocar", d: "to exchange, swap"}
          - {w: "albarda", d: "packsaddle, the padded saddle of a donkey"}
          - {w: "cincha", d: "girth, the strap that holds a saddle on"}
          - {w: "jáquima", d: "halter, headstall of rope"}
        diagram:
          - s: "mediaron la causa y fueron árbitros della"
            r: "main verbs: they mediated the case and were its arbiters"
            under:
              - {s: "Finalmente, ellos", r: "subject: finally, they (the troopers)"}
              - {s: "como miembros de justicia", r: "in what role: as officers of the law"}
              - s: "de tal modo que ambas partes quedaron"
                r: "result: so that both parties were left"
                under:
                  - {s: "si no del todo contentas", r: "if not entirely content"}
                  - {s: "a lo menos en algo satisfechas", r: "at least somewhat satisfied"}
                  - s: "porque se trocaron las albardas"
                    r: "why: because the packsaddles were swapped"
                    under:
                      - {s: "y no las cinchas y jáquimas", r: "but not the girths and halters"}
        forms:
          - {w: "mediaron", f: "medi- + -aron → mediar (to mediate), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "fueron", f: "fu- + -eron → ser (to be), preterite, they. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "della", f: "= de + ella, 'of it' (la causa); the old contraction, now always written apart."}
          - {w: "ambas", f: "amb- + -as → ambos (both), feminine to match 'partes'."}
          - {w: "quedaron", f: "qued- + -aron → quedar (to be left, end up), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "contentas, satisfechas", f: "feminine plural to match 'partes'; satisfechas is the irregular participle of satisfacer (to satisfy), built like hecho from hacer (to make)."}
          - {w: "se trocaron", f: "troc- + -aron → trocar (to swap), preterite, they, with 'se' making it passive: 'the packsaddles were swapped'. Same -aron preterite."}
        note: "The settlement is comic justice: the barber gets his packsaddle back, but Sancho keeps the better girths and halter, so the 'spoils of war' are only half returned."
      - es: "y en lo que tocaba a lo del yelmo de Mambrino, el cura, a socapa y sin que don Quijote lo entendiese, le dio por la bacía ocho reales, y el barbero le hizo una cédula del recibo y de no llamarse a engaño por entonces, ni por siempre jamás amén."
        literal: "and in that which touched on the [matter] of-the helmet of Mambrino, the priest, on-the-sly and without that Don Quijote it might-understand, to-him gave for the basin eight reals, and the barber to-him made a note of-the receipt and of not calling-himself to deceit for then, nor for ever ever amen."
        ormsby: "and as to Mambrino’s helmet, the curate, under the rose and without Don Quixote’s knowing it, paid eight reals for the basin, and the barber executed a full receipt and engagement to make no further demand then or thenceforth forevermore, amen."
        vocab:
          - {w: "en lo que tocaba a", d: "as for, as regards"}
          - {w: "yelmo de Mambrino", d: "Mambrino's helmet, the enchanted golden helmet of a Moorish king in Boiardo and Ariosto; Don Quijote's name for the barber's brass basin"}
          - {w: "a socapa", d: "on the sly, secretly"}
          - {w: "bacía", d: "barber's basin, a brass shaving bowl with a notch for the chin"}
          - {w: "real", d: "real, a silver coin; eight reals made a 'piece of eight'"}
          - {w: "cédula", d: "a signed paper, a written note or receipt"}
          - {w: "llamarse a engaño", d: "to claim one was cheated, go back on a deal"}
          - {w: "por siempre jamás amén", d: "for ever and ever, amen: legal and prayer formula used jokingly"}
        diagram:
          - s: "el cura"
            r: "subject 1: the priest"
            under:
              - {s: "en lo que tocaba a lo del yelmo de Mambrino", r: "as for: as for the matter of Mambrino's helmet"}
              - {s: "a socapa y sin que don Quijote lo entendiese", r: "how: on the sly, without Don Quijote knowing"}
              - s: "le dio por la bacía ocho reales"
                r: "main verb 1: gave him eight reals for the basin"
          - s: "y el barbero le hizo una cédula"
            r: "main verb 2: and the barber made him out a paper"
            under:
              - {s: "del recibo", r: "what it recorded, 1: of receipt"}
              - s: "y de no llamarse a engaño"
                r: "what it recorded, 2: and that he would not claim to be cheated"
                under:
                  - {s: "por entonces, ni por siempre jamás amén", r: "when: then or ever after, amen"}
        forms:
          - {w: "tocaba", f: "toc- + -aba → tocar (to concern), imperfect, it. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "del", f: "de + el; 'lo del yelmo' = the business of the helmet, 'lo' standing for an unnamed matter."}
          - {w: "entendiese", f: "entend- + -iese → entender (to understand, notice), imperfect subjunctive (-se form), he, required after 'sin que'. The -se form of -er verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen."}
          - {w: "dio", f: "d- + -io → dar (to give), preterite, he. Irregular: di, diste, dio, dimos, disteis, dieron."}
          - {w: "hizo", f: "hiz- + -o → hacer (to make), preterite, he. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "llamarse", f: "llamar (to call) + se (himself), the pronoun hung on the infinitive after 'de no'."}
        note: "The priest quietly buys the basin so Don Quijote can keep his 'helmet'. The barber's receipt mimics a notary's quittance, which waived all future claims; 'por siempre jamás amén' turns it into a prayer."
  - sentences:
      - es: "Sosegadas, pues, estas dos pendencias, que eran las más principales y de más tomo, restaba que los criados de don Luis se contentasen de volver los tres, y que el uno quedase para acompañarle donde don Fernando le quería llevar;"
        literal: "Calmed, then, these two quarrels, which were the most principal and of most weight, it-remained that the servants of Don Luis themselves might-content to return the three, and that the one might-stay to accompany-him where Don Fernando him was-wanting to-take;"
        ormsby: "These two disputes, which were the most important and gravest, being settled, it only remained for the servants of Don Luis to consent that three of them should return while one was left to accompany him whither Don Fernando desired to take him;"
        vocab:
          - {w: "sosegar", d: "to calm, settle, quiet"}
          - {w: "de más tomo", d: "of more weight, more serious; 'tomo' = bulk, importance"}
          - {w: "restar", d: "to remain, be left (to do)"}
          - {w: "contentarse de", d: "to be content to, agree to"}
          - {w: "los tres ... el uno", d: "three of them ... the other one: Don Luis came with four servants sent by his father"}
        diagram:
          - s: "restaba"
            r: "main verb: there remained"
            under:
              - s: "Sosegadas, pues, estas dos pendencias"
                r: "when: these two quarrels being settled"
                under:
