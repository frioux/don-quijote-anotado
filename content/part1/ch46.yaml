      - es: "y así, se ha de creer, sin poner duda en ello, que, como en este castillo, según vos, señor caballero, decís, todas las cosas van y suceden por modo de encantamento, podría ser, digo, que Sancho hubiese visto por esta diabólica vía lo que él dice que vio, tan en ofensa de mi honestidad."
