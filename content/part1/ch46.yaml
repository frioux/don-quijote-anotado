  - sentences:
      - es: "— ¡Oh tú, quienquiera que seas, que tanto bien me has pronosticado!, ruégote que pidas de mi parte al sabio encantador que mis cosas tiene a cargo, que no me deje perecer en esta prisión donde agora me llevan, hasta ver cumplidas tan alegres e incomparables promesas como son las que aquí se me han hecho;"
