  - sentences:
      - es: "Zoraida, aunque no entendía bien todos los sucesos que había visto, se entristecía y alegraba a bulto, conforme veía y notaba los semblantes a cada uno, especialmente de su español, en quien tenía siempre puestos los ojos y traía colgada el alma."
        literal: "Zoraida, although not she-understood well all the events that she-had seen, herself was-saddening and was-gladdening at bulk, according-as she-saw and noted the faces to each one, especially of her Spaniard, on whom she-had always placed the eyes and was-carrying hung the soul."
        ormsby: "Zoraida, though she did not fully comprehend all she saw, was grave or gay without knowing why, as she watched and studied the various countenances, but particularly her Spaniard’s, whom she followed with her eyes and clung to with her soul."
        vocab:
          - {w: "sucesos", d: "events, happenings (false friend: not 'successes')"}
          - {w: "entristecerse", d: "to become sad"}
          - {w: "alegrarse", d: "to be glad, cheer up"}
          - {w: "a bulto", d: "roughly, by guesswork, without knowing exactly why"}
          - {w: "conforme", d: "according as, in step with"}
          - {w: "semblante", d: "face, expression"}
          - {w: "su español", d: "her Spaniard: the captive, the Spanish soldier she fled Algiers with"}
          - {w: "traer colgada el alma", d: "to have one's soul hanging on someone, be utterly devoted"}
