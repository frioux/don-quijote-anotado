      - es: "Y, pues no ha criado el cielo, ni visto el infierno, ninguno que me espante ni acobarde, ensilla, Sancho, a Rocinante, y apareja tu jumento y el palafrén de la reina, y despidámonos del castellano y destos señores, y vamos de aquí luego al punto."
