summary: |
  While Don Quijote rants, the priest persuades the troopers of the Holy Brotherhood that he is mad and that arresting him would be pointless. They let the matter drop and even settle the quarrel between Sancho and the barber: the packsaddles are swapped back, and the priest secretly pays the barber eight reals for the basin, Mambrino's 'helmet'. Don Luis's servants agree to his plans, to Doña Clara's joy, and Don Fernando pays the innkeeper for Don Quijote's bill and the slashed wineskins. The inn, lately Agramante's camp, is at peace.

  Don Quijote kneels to Dorotea, as Princess Micomicona, and urges an immediate departure to fight her giant before he can fortify himself; she answers in his own high style. But Sancho shakes his head: this 'queen', he says, is no more a queen than his mother, for he has seen her kissing someone at the inn. Dorotea blushes, since he has seen her with Don Fernando. Don Quijote explodes with a torrent of insults and drives Sancho from his presence.

  Dorotea calms him by suggesting that Sancho saw it through the enchantments of the castle. Don Quijote agrees, Don Fernando asks him to forgive his squire, and Sancho kneels and kisses his hand, though he insists the blanket-tossing was real. The innkeeper tells the company the story of it, to general laughter.

  After two days the priest and the barber put their plan into action. They hire an ox-cart and build a wooden cage; the company, masked and disguised, tie up the sleeping Don Quijote and shut him in it. He decides he is enchanted. The barber, in a solemn voice, delivers a mock prophecy of his marriage to Dulcinea and of Sancho's wages; Don Quijote is consoled, promises Sancho his wages in his will, and is lifted onto the ox-cart.
context: |
  Troopers, judges and money. The 'cuadrilleros' belong to the Santa Hermandad, the rural police of Castile that hunted bandits on the roads; they came with a warrant because Don Quijote freed the galley slaves in chapter 22. The priest's defence, that a madman cannot be held to account, is real law: madness excused a person from criminal punishment. The settlement is drawn up like a lawsuit: the troopers act as 'árbitros', and the barber signs a 'cédula', a receipt waiving all future claims 'for ever, amen'. The money is precise: eight reals, a silver 'piece of eight', for a brass basin, and the innkeeper wants his 'escote' to the last 'ardite', a copper coin of almost no value. The 'oidor' is a judge of one of the royal high courts.

  Chivalry and its parodies. Don Quijote's speech to the princess is a model of chivalric strategy, with a proverb, a commonplace about war, and the fear that the giant will learn of his plans through spies; Dorotea answers 'in Don Quijote's style', with the knight's duty to help 'orphans and the needy'. The cage is a chivalric device too: knights in the romances are carried off by enchanters, and Ormsby notes that the binding of the sleeping Don Quijote resembles the scene in Pulci's Morgante Maggiore where Orlando is seized and bound by the pagans. The barber's prophecy parodies the riddling prophecies of wizards like Merlin: the 'furious spotted lion' (manchado, a pun on Mancha) and the 'white dove of El Toboso' will marry and have cubs, and all this before 'the pursuer of the fleeing nymph', Apollo the sun who chased Daphne, has twice made the round of the zodiac, that is, within two years.

  Peace of Agramante and of Augustus. The quarrels at the inn were, in Don Quijote's eyes, the discord of Agramante's camp in Ariosto's Orlando Furioso, where the Moorish champions besieging Paris fall out among themselves. The narrator now replaces it with the peace of Octavian, whom Ormsby glosses as Augustus: his reign was remembered as the time of universal peace in which Christ was born.

  Sancho's truth and the narrator's games. Sancho, for once, sees exactly what is happening: Don Fernando has been stealing kisses from Dorotea, and the 'queen' is behaving like a 'dama cortesana'. His bluntness is punished by the longest string of insults in the book so far. Dorotea rescues him by using Don Quijote's own logic: if everything in the castle is enchantment, Sancho may have seen the kiss through enchantment. Sancho accepts enchantment for everything except the blanket-tossing, which he knows was done by men of flesh and blood. Don Fernando closes the scene with 'sicut erat in principio', 'as it was in the beginning', from the Latin doxology sung at the end of the psalms, as if Sancho's restoration to favour were a liturgy.

  Names and words. The barber speaks in the name of 'la sabia Mentironiana', the wise lady Liar-ella, a name Ormsby explains as formed from 'mentir', to lie. 'Matrimoñesco' is a mock-heroic coinage on 'matrimonio', and 'tobosina' turns El Toboso into an epic adjective. Sancho's proverbs are coarse: 'cada puta hile' (let every whore spin, i.e. let each mind her own business) is Ormsby's 'let every jade mind her spinning', and Ormsby points out that 'hay más mal en el aldegüela que se suena' means 'than is talked of' (suena), not 'than is dreamt of' (sueña).

  Reading Cervantes' Spanish. The chapter has two voices. The narrator and Don Quijote use the ordinary old spellings: efeto (efecto), trecientas (trescientas), rancor (rencor), vitoria (victoria), felice (feliz), estraño (extraño), mesmo (mismo), agora (ahora), ansí (así), and the contractions della, desta, deste. Don Quijote fuses infinitive and pronoun (obedecella, destruille, levantalla, ponella, perdonalle, reducille), hangs pronouns on clause-opening verbs (ruégote, asegúrote, dejóle) and keeps the old f- (fermosa). The barber's prophecy then piles on deliberately antique forms from the chivalry books: faga (haga), fecho (hecho), vegadas (veces), yoguieren (old future subjunctive of yogar, a by-form of yacer, to lie together), imágines (imágenes), afincamiento (distress). Watch the future subjunctive (ordenare, quisieres, yoguieren), the -ra form as a conditional (fueran, mirara, se holgara), 'haber de' for 'must', 'puesto que' meaning 'although', and the false friends suceso (outcome), discursos (schemes), solicitud (zeal) and asistir (to keep at).
