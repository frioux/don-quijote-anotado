        forms:
          - {w: "Vete", f: "ve + te → irse (to go away), imperative, you (tú), with 'te' stuck on the end. The tú command of ir is the short irregular 've'; a command always takes the pronoun at the end."}
          - {w: "no parezcas", f: "parezc- + -as → parecer (to appear), present subjunctive, you (tú): a negative command uses the present subjunctive. Verbs in -ecer add z before c: parezca, parezcas, parezca, parezcamos, parezcáis, parezcan."}
          - {w: "mí", f: "'me' after a preposition ('delante de mí'), with the accent that sets it apart from 'mi' (my)."}
  - sentences:
      - es: "Y, diciendo esto, enarcó las cejas, hinchó los carrillos, miró a todas partes, y dio con el pie derecho una gran patada en el suelo, señales todas de la ira que encerraba en sus entrañas."
        literal: "And, saying this, he-arched the eyebrows, he-puffed-out the cheeks, he-looked to all parts, and he-gave with the foot right a great stamp on the ground, signs all of the wrath that he-was-shutting-in in his entrails."
        ormsby: "and so saying he knitted his brows, puffed out his cheeks, gazed around him, and stamped on the ground violently with his right foot, showing in every way the rage that was pent up in his heart;"
        vocab:
          - {w: "enarcar las cejas", d: "to arch the eyebrows, raise or knit the brows (from 'arco', bow, arch)"}
          - {w: "hinchar", d: "to swell, puff out"}
          - {w: "carrillo", d: "cheek (the fleshy part); 'hinchar los carrillos' = puff out the cheeks in rage"}
          - {w: "dar una patada", d: "to give a stamp or kick; 'dar con el pie una patada en el suelo' = stamp on the ground"}
          - {w: "encerrar", d: "to shut in, contain, hold pent up"}
          - {w: "entrañas", d: "entrails, bowels; figuratively the heart, the innermost self"}
        diagram:
          - s: "enarcó las cejas"
            r: "main verb 1: he arched his eyebrows"
            under:
              - {s: "diciendo esto", r: "when: while saying this"}
          - {s: "hinchó los carrillos", r: "main verb 2: he puffed out his cheeks"}
          - {s: "miró a todas partes", r: "main verb 3: he looked all around"}
          - s: "y dio"
            r: "main verb 4: and he gave"
            under:
              - {s: "con el pie derecho", r: "with what: with his right foot"}
              - {s: "una gran patada", r: "object: a great stamp"}
              - {s: "en el suelo", r: "where: on the floor"}
          - s: "señales todas de la ira"
            r: "summing up all four actions: all signs of the wrath"
            under:
              - {s: "que encerraba en sus entrañas", r: "describes 'ira': that he held pent up inside him"}
        forms:
          - {w: "diciendo", f: "gerund of decir (to say): 'saying'. The e of the stem turns to i in the gerund: decir → diciendo."}
          - {w: "enarcó, hinchó, miró", f: "enarc- + -ó → enarcar (to arch), hinch- + -ó → hinchar (to puff out), mir- + -ó → mirar (to look), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "dio", f: "di- + -o → dar (to give), preterite, he. Irregular, with -er/-ir endings and no accent: di, diste, dio, dimos, disteis, dieron."}
          - {w: "gran", f: "grande (great) clipped to 'gran' before a singular noun ('patada')."}
          - {w: "señales todas", f: "plural of señal (sign); 'todas' (all), feminine plural to match 'señales', placed after the noun for emphasis: 'all of them signs'."}
          - {w: "encerraba", f: "encerr- + -aba → encerrar (to shut in), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "sus entrañas", f: "sus = plural to match 'entrañas', not the owner; 'his entrails'."}
        note: "The arched brows, puffed cheeks and stamping foot are the stock gestures of a stage tyrant or an angry giant in the chivalric books; Don Quijote performs his fury rather than simply feeling it."
      - es: "A cuyas palabras y furibundos ademanes quedó Sancho tan encogido y medroso, que se holgara que en aquel instante se abriera debajo de sus pies la tierra y le tragara."
        literal: "At whose words and furious gestures remained Sancho so shrunken and fearful, that himself he-would-have-been-glad that in that instant itself might-open beneath of his feet the earth and him might-swallow."
        ormsby: "and at his words and furious gestures Sancho was so scared and terrified that he would have been glad if the earth had opened that instant and swallowed him,"
        vocab:
          - {w: "cuyo", d: "whose; 'a cuyas palabras' = at which words (linking back to what was just said)"}
          - {w: "furibundo", d: "furious, raging (literary)"}
          - {w: "ademán", d: "gesture, attitude, bearing"}
          - {w: "encogido", d: "shrunk, cowed, cringing (from 'encoger', to shrink)"}
          - {w: "medroso", d: "fearful, frightened"}
          - {w: "holgarse", d: "to be glad, take pleasure"}
          - {w: "tragar", d: "to swallow"}
        diagram:
          - s: "quedó Sancho tan encogido y medroso"
            r: "main verb: Sancho was left so cowed and frightened"
            under:
              - {s: "A cuyas palabras y furibundos ademanes", r: "why: at his words and furious gestures"}
              - s: "que se holgara"
                r: "result: that he would have been glad"
                under:
                  - s: "que en aquel instante se abriera debajo de sus pies la tierra"
                    r: "what would have pleased him: that the earth open under his feet that instant"
                  - {s: "y le tragara", r: "and swallow him"}
        forms:
          - {w: "cuyas", f: "cuy- + -as → cuyo (whose), feminine plural to match 'palabras', the thing owned, not the owner."}
          - {w: "furibundos", f: "furibund- + -os → furibundo (furious), masculine plural to match 'ademanes'."}
          - {w: "ademanes", f: "plural of ademán (gesture): add -es, and the written accent drops because the stress now falls naturally on the -ma-."}
          - {w: "quedó", f: "qued- + -ó → quedar (to remain, be left), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. 'quedar' + adjective = to end up, be left (so)."}
          - {w: "encogido", f: "encog- + -ido → encoger (to shrink), participle used as an adjective, masculine to match 'Sancho'."}
          - {w: "se holgara", f: "holg- + -ara → holgarse (to be glad), imperfect subjunctive (-ra form), he, used as a conditional: 'he would have been glad'. The -ra imperfect subjunctive of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran."}
