                          - {s: "para gloria perpetua de la Mancha", r: "why: for the everlasting glory of La Mancha"}
        forms:
          - {w: "vio", f: "vi- + -o → ver (to see), preterite, he. Irregular: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "prometían", f: "promet- + -ían → prometer (to promise), imperfect, they (the prophecy's speakers, impersonal). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "el verse", f: "el + infinitive ver (to see) + se: the infinitive used as a noun, 'the seeing themselves'; 'se' refers to him and Dulcinea together."}
          - {w: "ayuntados", f: "ayunt- + -ados → participle of ayuntar (to join), masculine plural for the pair (him and Dulcinea)."}
          - {w: "cuyo", f: "cuy- + -o → cuyo (whose), masculine to match 'vientre', the thing owned."}
          - {w: "felice", f: "old form of feliz (happy), used in poetry and high style."}
          - {w: "saldrían", f: "saldr- + -ían → salir (to come out), conditional, they. Irregular stem saldr-: saldría, saldrías, saldría, saldríamos, saldríais, saldrían."}
          - {w: "eran", f: "ser (to be), imperfect, they. Irregular: era, eras, era, éramos, erais, eran."}
        note: "Don Quijote reads the barber's riddle exactly as intended: lion = himself, dove = Dulcinea, cubs = their sons."
