  - sentences:
      - es: "Paróse colorada con las razones de Sancho Dorotea, porque era verdad que su esposo don Fernando, alguna vez, a hurto de otros ojos, había cogido con los labios parte del premio que merecían sus deseos (lo cual había visto Sancho, y pareciéndole que aquella desenvoltura más era de dama cortesana que de reina de tan gran reino), y no pudo ni quiso responder palabra a Sancho, sino dejóle proseguir en su plática, y él fue diciendo:"
        literal: "Turned-herself red with the words of Sancho Dorotea, because it-was truth that her husband Don Fernando, some time, by stealth of other eyes, had gathered with the lips part of-the reward that were-deserving his desires (the which had seen Sancho, and seeming-to-him that that freedom more was of lady courtesan than of queen of so great kingdom), and not she-could nor wanted to-answer word to Sancho, but let-him to-continue in his talk, and he went saying:"
        ormsby: "Dorothea turned red at Sancho’s words, for the truth was that her husband Don Fernando had now and then, when the others were not looking, gathered from her lips some of the reward his love had earned, and Sancho seeing this had considered that such freedom was more like a courtesan than a queen of a great kingdom; she, however, being unable or not caring to answer him, allowed him to proceed, and he continued,"
        vocab:
          - {w: "pararse", d: "to turn, become (old sense, of a colour or state); 'pararse colorada' = to blush"}
          - {w: "colorado", d: "red, flushed (not 'coloured')"}
          - {w: "razones", d: "words, remarks (old sense of 'razón'), not 'reasons'"}
          - {w: "a hurto de", d: "on the sly, hidden from; 'a hurto de otros ojos' = when no one was looking"}
          - {w: "coger con los labios", d: "to gather with the lips: a polite way of saying 'to kiss'"}
          - {w: "premio", d: "reward, prize"}
          - {w: "desenvoltura", d: "free and easy manners, forwardness, lack of modesty"}
          - {w: "dama cortesana", d: "courtesan, kept woman (not 'court lady')"}
          - {w: "plática", d: "talk, speech, conversation"}
          - {w: "ir + gerund", d: "to go on doing; 'fue diciendo' = he went on saying"}
