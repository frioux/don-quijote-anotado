  - sentences:
      - es: "Y, al acabar de la profecía, alzó la voz de punto, y diminuyóla después, con tan tierno acento, que aun los sabidores de la burla estuvieron por creer que era verdad lo que oían."
        literal: "And, at-the finishing of the prophecy, he-raised the voice of pitch, and diminished-it afterward, with so tender accent, that even the knowers of the hoax were for believing that was truth that which they-were-hearing."
        ormsby: "and as he brought the prophecy to a close he raised his voice to a high pitch, and then lowered it to such a soft tone, that even those who knew it was all a joke were almost inclined to take what they heard seriously."
        vocab:
          - {w: "al acabar de", d: "on finishing, at the end of"}
          - {w: "alzar la voz de punto", d: "to raise the voice a pitch, to a high note ('punto' = musical pitch)"}
          - {w: "diminuir", d: "= disminuir, to lower, lessen (old form)"}
          - {w: "acento", d: "tone of voice (not 'accent' of a region)"}
          - {w: "sabidor", d: "one who knows, in on the secret"}
          - {w: "burla", d: "joke, hoax, trick"}
          - {w: "estar por", d: "to be inclined to, on the point of"}
        diagram:
          - s: "alzó la voz de punto"
            r: "main verb 1: he raised his voice a pitch"
            under:
              - {s: "al acabar de la profecía", r: "when: as the prophecy ended"}
          - s: "y diminuyóla después"
            r: "main verb 2: and afterwards lowered it"
            under:
              - s: "con tan tierno acento"
                r: "how: in so tender a tone"
                under:
                  - s: "que aun los sabidores de la burla estuvieron por creer"
                    r: "result: that even those in on the joke were inclined to believe"
                    under:
                      - {s: "que era verdad lo que oían", r: "what they almost believed: that what they heard was true"}
        forms:
          - {w: "al acabar", f: "al = a + el, before the infinitive acabar (to finish): 'on finishing'."}
          - {w: "alzó", f: "alz- + -ó → alzar (to raise), preterite, he (the barber). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (alcé, with z → c before e)."}
          - {w: "diminuyóla", f: "diminuy- + -ó + la → diminuir (to lower), preterite, he, with 'la' (it, the voice) stuck on the end; modern 'la disminuyó'. Like huir: diminuí, diminuiste, diminuyó, diminuimos, diminuisteis, diminuyeron (y between vowels)."}
          - {w: "sabidores", f: "sab- + -idor + -es → saber (to know): -dor makes the doer, 'knowers', plural."}
          - {w: "estuvieron", f: "estuv- + -ieron → estar (to be), preterite, they. Irregular: estuve, estuviste, estuvo, estuvimos, estuvisteis, estuvieron."}
          - {w: "era", f: "ser (to be), imperfect, it. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "oían", f: "o- + -ían → oír (to hear), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
