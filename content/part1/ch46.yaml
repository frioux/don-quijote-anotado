  - sentences:
      - es: "— Ansí es y ansí será —dijo don Fernando—; por lo cual debe vuestra merced, señor don Quijote, perdonalle y reducille al gremio de su gracia, sicut erat in principio, antes que las tales visiones le sacasen de juicio."
        literal: "— So it-is and so it-will-be —said Don Fernando—; for which reason must your grace, sir Don Quijote, to-pardon-him and to-bring-back-him to-the bosom of your favor, as it-was in [the] beginning, before that the such visions him should-take out of judgment."
        ormsby: "“True, no doubt,” said Don Fernando, “for which reason, Señor Don Quixote, you ought to forgive him and restore him to the bosom of your favour, sicut erat in principio, before illusions of this sort had taken away his senses.”"
