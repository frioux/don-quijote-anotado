  - sentences:
      - es: "— ¿Qué mal puede haber en ninguna aldea, ni en todas las ciudades del mundo, que pueda sonarse en menoscabo mío, villano?"
        literal: "— What evil can there-be in any village, nor in all the cities of-the world, that may-be-able to-be-rumoured to-the detriment mine, peasant?"
        ormsby: "“What mischief can there be in any village, or in all the cities of the world, you booby, that can hurt my reputation?” said Don Quixote."
        vocab:
          - {w: "ninguna", d: "any (in a question that expects 'none'); literally 'no'"}
          - {w: "sonarse", d: "to be rumoured, be talked about"}
          - {w: "en menoscabo mío", d: "to my detriment, to my discredit; 'menoscabo' = damage, lessening"}
          - {w: "villano", d: "peasant, boor, low-born fellow: an insult of class, not English 'villain'"}
        diagram:
          - s: "Qué mal puede haber"
            r: "main verb: what wrong can there be"
            under:
              - {s: "en ninguna aldea, ni en todas las ciudades del mundo", r: "where: in any village, or in all the cities of the world"}
              - {s: "que pueda sonarse en menoscabo mío", r: "describes 'mal': that could be rumoured to my discredit"}
              - {s: "villano", r: "addressee: you peasant"}
        forms:
          - {w: "puede haber", f: "pued- + -e → poder (to be able), present, it: puedo, puedes, puede, podemos, podéis, pueden; + haber (to have) in its impersonal sense 'there be': 'can there be'."}
          - {w: "pueda", f: "pued- + -a → poder (to be able), present subjunctive, it: pueda, puedas, pueda, podamos, podáis, puedan. Subjunctive because he denies such a wrong exists."}
          - {w: "sonarse", f: "sonar (to sound) + se, 'to be rumoured', infinitive after 'pueda'."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
          - {w: "mío", f: "possessive placed after the noun: 'menoscabo mío' = my detriment; masculine to match 'menoscabo'."}
        note: "Don Quijote's line has no speech tag in the Spanish; Ormsby adds 'said Don Quixote'. He takes Sancho's proverb as a slur on his own honour."
  - sentences:
      - es: "— Si vuestra merced se enoja —respondió Sancho—, yo callaré, y dejaré de decir lo que soy obligado como buen escudero, y como debe un buen criado decir a su señor."
        literal: "— If your grace himself angers —answered Sancho—, I will-be-silent, and will-leave-off of saying that which I-am obliged as good squire, and as must a good servant say to his master."
        ormsby: "“If your worship is angry,” replied Sancho, “I will hold my tongue and leave unsaid what as a good squire I am bound to say, and what a good servant should tell his master.”"
        vocab:
          - {w: "vuestra merced", d: "your grace, your worship: the polite 'you', origin of modern 'usted', taking he-forms of the verb"}
          - {w: "enojarse", d: "to get angry"}
          - {w: "callar", d: "to be silent, hold one's tongue"}
          - {w: "dejar de", d: "to stop, leave off, fail to (+ infinitive)"}
          - {w: "ser obligado", d: "to be obliged, bound (to do something)"}
          - {w: "criado", d: "servant"}
        diagram:
          - s: "yo callaré"
            r: "main verb 1: I will be silent"
            under:
              - {s: "Si vuestra merced se enoja", r: "condition: if your worship gets angry"}
          - s: "y dejaré de decir"
            r: "main verb 2: and I will leave off saying"
            under:
              - s: "lo"
                r: "object: what"
                under:
                  - {s: "que soy obligado como buen escudero", r: "describes 'lo': what I am bound to say as a good squire"}
                  - {s: "y como debe un buen criado decir a su señor", r: "describes 'lo', 2: and as a good servant ought to tell his master"}
        forms:
          - {w: "se enoja", f: "enoj- + -a → enojarse (to get angry), present, you (vuestra merced takes he-forms), with 'se'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "callaré, dejaré", f: "callar- + -é → callar (to be silent) and dejar- + -é → dejar (to leave off), future, I. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "soy obligado", f: "soy → ser (to be), present, I: soy, eres, es, somos, sois, son; + obligado, participle of obligar (to oblige): 'I am bound'."}
          - {w: "buen", f: "bueno (good) clipped to buen before a masculine singular noun ('escudero', 'criado')."}
          - {w: "debe", f: "deb- + -e → deber (must, ought), present, he. The present of -er verbs: -o, -es, -e, -emos, -éis, -en. The subject 'un buen criado' follows the verb."}
  - sentences:
      - es: "— Di lo que quisieres —replicó don Quijote—, como tus palabras no se encaminen a ponerme miedo; que si tú le tienes, haces como quien eres, y si yo no le tengo, hago como quien soy."
        literal: "— Say that which you-may-wish —replied Don Quijote—, as-long-as your words not themselves direct to to-put-me fear; for if you it have, you-do as who you-are, and if I not it have, I-do as who I-am."
        ormsby: "“Say what thou wilt,” returned Don Quixote, “provided thy words be not meant to work upon my fears; for thou, if thou fearest, art behaving like thyself; but I like myself, in not fearing.”"
        vocab:
          - {w: "replicar", d: "to reply, retort"}
          - {w: "como", d: "here 'provided that, as long as' (with the subjunctive)"}
          - {w: "encaminarse a", d: "to be aimed at, tend toward"}
          - {w: "poner miedo", d: "to frighten, make afraid"}
          - {w: "hacer como quien es", d: "to act like the person one is, behave true to one's nature (a set phrase)"}
        diagram:
          - s: "Di lo"
            r: "main verb 1: say what"
            under:
              - {s: "que quisieres", r: "describes 'lo': what you like"}
              - {s: "como tus palabras no se encaminen a ponerme miedo", r: "condition: as long as your words aren't meant to frighten me"}
          - s: "haces como quien eres"
            r: "main verb 2 (after 'que', for): you act like who you are"
            under:
              - {s: "si tú le tienes", r: "condition: if you have it (fear)"}
          - s: "hago como quien soy"
            r: "main verb 3 (after 'y'): I act like who I am"
            under:
              - {s: "si yo no le tengo", r: "condition: if I don't have it"}
        forms:
          - {w: "Di", f: "decir (to say), imperative, you (tú): 'say!'. Irregular short command, like haz (hacer), pon (poner), ven (venir)."}
          - {w: "quisieres", f: "quis- + -ieres → querer (to want), future subjunctive, you (tú): 'whatever you may want'. Built on the preterite quisieron: quisiere, quisieres, quisiere, quisiéremos, quisiereis, quisieren. Modern Spanish uses the present subjunctive 'quieras'."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (repliqué, with c → qu before e)."}
          - {w: "se encaminen", f: "encamin- + -en → encaminarse (to be aimed), present subjunctive, they (your words), with 'se'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. Subjunctive after 'como' meaning 'provided that'."}
          - {w: "ponerme", f: "poner (to put) + me (in me), the pronoun hung on the infinitive after 'a'."}
          - {w: "le tienes, le tengo", f: "tien- + -es / teng- + -o → tener (to have), present, you / I: tengo, tienes, tiene, tenemos, tenéis, tienen. 'le' stands for 'miedo' (fear), a thing: Cervantes often uses 'le' where modern Spanish wants 'lo'."}
          - {w: "haces, hago", f: "hac- + -es / hag- + -o → hacer (to do), present, you / I. Irregular I-form: hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "eres, soy", f: "ser (to be), present, you / I: soy, eres, es, somos, sois, son."}
        note: "Don Quijote switches to 'tú' with Sancho, the form for a servant. His retort is a neat paradox: fear is natural to Sancho's low birth, fearlessness to his own knighthood."
  - sentences:
      - es: "— No es eso, ¡pecador fui yo a Dios! —respondió Sancho—, sino que yo tengo por cierto y por averiguado que esta señora que se dice ser reina del gran reino Micomicón no lo es más que mi madre;"
        literal: "— Not it-is that, sinner was I to God! —answered Sancho—, but that I hold as certain and as ascertained that this lady who herself calls to-be queen of-the great kingdom Micomicón not it is more than my mother;"
        ormsby: "“It is nothing of the sort, as I am a sinner before God,” said Sancho, “but that I take it to be sure and certain that this lady, who calls herself queen of the great kingdom of Micomicon, is no more so than my mother;"
        vocab:
          - {w: "¡pecador fui yo a Dios!", d: "as I'm a sinner before God! An oath echoing the confession prayer 'Yo pecador me confieso a Dios' (I, a sinner, confess to God)"}
          - {w: "sino que", d: "but rather (after a negative)"}
          - {w: "tener por cierto y por averiguado", d: "to hold as certain and proven, be quite sure"}
          - {w: "decirse", d: "to call oneself, claim to be"}
          - {w: "no lo es más que mi madre", d: "is no more one than my mother is, i.e. is not one at all"}
          - {w: "Micomicón", d: "the made-up African kingdom of Dorotea's role as Princess Micomicona; the name suggests 'mico', monkey"}
