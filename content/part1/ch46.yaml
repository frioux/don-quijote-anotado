  - sentences:
      - es: "— Esto digo, señor, porque, si al cabo de haber andado caminos y carreras, y pasado malas noches y peores días, ha de venir a coger el fruto de nuestros trabajos el que se está holgando en esta venta, no hay para qué darme priesa a que ensille a Rocinante, albarde el jumento y aderece al palafrén, pues será mejor que nos estemos quedos, y cada puta hile, y comamos."
        literal: "— This I-say, sir, because, if at-the end of having walked roads and highways, and passed bad nights and worse days, has to come to gather the fruit of our labors he who himself is enjoying in this inn, not there-is for what to-give-myself haste to that I-may-saddle Rocinante, may-pack-saddle the donkey and may-make-ready the palfrey, since it-will-be better that ourselves we-may-stay still, and each whore may-spin, and let-us-eat."
        ormsby: "“This I say, señor, because, if after we have travelled roads and highways, and passed bad nights and worse days, one who is now enjoying himself in this inn is to reap the fruit of our labours, there is no need for me to be in a hurry to saddle Rocinante, put the pad on the ass, or get ready the palfrey; for it will be better for us to stay quiet, and let every jade mind her spinning, and let us go to dinner.”"
        ormsby_note: "Proverb 196."
        vocab:
          - {w: "al cabo de", d: "at the end of, after"}
          - {w: "caminos y carreras", d: "roads and highways: a doublet for all the travelling they have done"}
          - {w: "coger el fruto", d: "to reap the fruit, enjoy the reward"}
          - {w: "holgarse", d: "to take one's ease, enjoy oneself"}
          - {w: "no hay para qué", d: "there is no reason to, no point in"}
          - {w: "darse priesa", d: "to hurry; 'priesa' = prisa (old form)"}
          - {w: "albardar", d: "to put the packsaddle on (from 'albarda', packsaddle)"}
          - {w: "aderezar", d: "to get ready, equip"}
          - {w: "estarse quedo", d: "to stay still, stay put"}
          - {w: "cada puta hile", d: "proverb: 'let every whore spin', i.e. let everyone mind their own business (and leave the rest to their betters)"}
        diagram:
          - s: "Esto digo"
            r: "main verb 1: I say this"
            under:
              - {s: "señor", r: "addressee: sir"}
              - s: "porque ... no hay para qué darme priesa"
                r: "why: because there is no point in my hurrying"
                under:
                  - s: "si al cabo de haber andado caminos y carreras, y pasado malas noches y peores días"
                    r: "condition: if after travelling roads and highways and spending bad nights and worse days"
                    under:
                      - {s: "ha de venir a coger el fruto de nuestros trabajos", r: "condition's verb: is going to reap the fruit of our labours"}
                      - {s: "el que se está holgando en esta venta", r: "subject of 'ha de venir': the one who is taking his ease in this inn"}
                  - {s: "a que ensille a Rocinante, albarde el jumento y aderece al palafrén", r: "hurry to what: to saddle Rocinante, packsaddle the donkey and get the palfrey ready"}
