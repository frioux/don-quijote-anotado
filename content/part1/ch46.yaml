        ormsby: "“Oh thou, whoever thou art, who hast foretold me so much good, I implore of thee that on my part thou entreat that sage enchanter who takes charge of my interests, that he leave me not to perish in this captivity in which they are now carrying me away, ere I see fulfilled promises so joyful and incomparable as those which have been now made me;"
