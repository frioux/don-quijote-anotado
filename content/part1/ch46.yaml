      - es: "El ventero, a quien no se le pasó por alto la dádiva y recompensa que el cura había hecho al barbero, pidió el escote de don Quijote, con el menoscabo de sus cueros y falta de vino, jurando que no saldría de la venta Rocinante, ni el jumento de Sancho, sin que se le pagase primero hasta el último ardite."
