                  - {s: "a quien es anejo y concerniente favorecer los huérfanos y menesterosos", r: "describes 'caballero': whose duty it is to help orphans and the needy"}
        forms:
          - {w: "agradezco", f: "agradezc- + -o → agradecer (to thank), present, I. Verbs in -ecer add z before c in the I-form: agradezco, agradeces, agradece, agradecemos, agradecéis, agradecen."}
          - {w: "os", f: "'you', object pronoun of vos/vosotros; Dorotea, as a princess, addresses Don Quijote with the respectful 'vos'."}
          - {w: "mostráis", f: "mostr- + -áis → mostrar (to show), present, you (vos). Stressed o becomes ue elsewhere: muestro, muestras, muestra, mostramos, mostráis, muestran."}
