          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
      - es: "¿No vees, ladrón, que la sangre y la fuente no es otra cosa que estos cueros que aquí están horadados y el vino tinto que nada en este aposento, que nadando vea yo el alma en los infiernos de quien los horadó?"
        literal: "Not you-see, thief, that the blood and the fountain not is other thing than these skins that here are pierced and the wine red that swims in this room, for swimming may-see I the soul in the hells of [him] who them pierced?"
        ormsby: "“Don’t you see, you thief, that the blood and the fountain are only these skins here that have been stabbed and the red wine swimming all over the room?—and I wish I saw the soul of him that stabbed them swimming in hell.”"
