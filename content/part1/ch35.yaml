          - {w: "dieron", f: "d- + -ieron → dar (to give), preterite, they. dar takes -er endings in the preterite: di, diste, dio, dimos, disteis, dieron."}
          - {w: "me los daba", f: "d- + -aba → dar (to give), imperfect, he; 'me' = to me, 'los' = them (the blows). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "pude", f: "pud- + -e → poder (to be able), preterite, I. Irregular: pude, pudiste, pudo, pudimos, pudisteis, pudieron."}
