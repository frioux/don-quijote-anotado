          - {w: "que ... la halló", f: "hall- + -ó → hallar (to find), preterite, he (the governor). 'que ... la' = 'whom', the old way of saying 'a quien'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "descolgándose", f: "descolgando, the gerund of descolgar (to let down), + se (herself), accent added."}
      - es: "En efeto, no sé puntualmente cómo pasó el negocio; sólo sé que toda la ciudad está admirada deste suceso, porque no se podía esperar tal hecho de la mucha y familiar amistad de los dos, que dicen que era tanta, que los llamaban los dos amigos."
        literal: "In effect, not I-know precisely how passed the business; only I-know that all the city is astonished of-this event, because not itself could expect such deed from the much and intimate friendship of the two, which they-say that it-was so-great, that them they-called the two friends."
        ormsby: "I know not indeed, precisely, how the affair came to pass; all I know is that the whole city is wondering at the occurrence, for no one could have expected a thing of the kind, seeing the great and intimate friendship that existed between them, so great, they say, that they were called ‘The Two Friends.’ ”"
        vocab:
