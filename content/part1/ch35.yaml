  - sentences:
      - es: "»—Por ahora será imposible —dijo Leonela—, según estoy de turbada; déjame hasta mañana, que entonces sabrás de mí lo que te ha de admirar; y está seguro que el que saltó por esta ventana es un mancebo desta ciudad, que me ha dado la mano de ser mi esposo."
