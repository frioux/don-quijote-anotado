          - {w: "sé", f: "saber (to know), present, I. Irregular: sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "pasó", f: "pas- + -ó → pasar (to happen), preterite, it. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "está admirada", f: "está (estar, present, it: estoy, estás, está, estamos, estáis, están) + admirada, participle of admirar (to astonish), feminine to match 'ciudad'."}
          - {w: "deste", f: "de + este (of this), fused."}
          - {w: "se podía", f: "pod- + -ía → poder (can), imperfect, with 'se': 'one could'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "dicen", f: "dic- + -en → decir (to say), present, they: 'people say'. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "era", f: "ser (to be), imperfect, it. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "llamaban", f: "llam- + -aban → llamar (to call), imperfect, they (people). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
