          - {w: "vees", d: "= ves, you see (old spelling)"}
          - {w: "no ... otra cosa que", d: "nothing other than, nothing but"}
          - {w: "horadar", d: "to pierce, bore a hole in"}
          - {w: "nadar", d: "to swim; here the wine 'swims', i.e. floods the floor"}
          - {w: "los infiernos", d: "hell (the plural is old and biblical)"}
