                  - {s: "que aquí están horadados", r: "describes 'cueros': which lie here pierced"}
                  - s: "y el vino tinto"
                    r: "and: and the red wine"
                    under:
                      - {s: "que nada en este aposento", r: "describes 'vino': that is swimming in this room"}
          - s: "que nadando vea yo el alma en los infiernos"
            r: "main verb 2, a curse: may I see swimming in hell the soul"
            under:
              - {s: "de quien los horadó?", r: "whose soul: of the man who pierced them"}
        forms:
          - {w: "vees", f: "ve- + -es → ver (to see), present, you (tú): the old spelling of 'ves'. veo, vees (ves), ve, vemos, veis, ven."}
          - {w: "es", f: "ser (to be), present, it, singular although the subject is 'la sangre y la fuente', taken as one thing. soy, eres, es, somos, sois, son."}
          - {w: "están horadados", f: "están (estar, present, they: estoy, estás, está, estamos, estáis, están) + horadados, participle of horadar (to pierce), masculine plural to match 'cueros'."}
          - {w: "nada", f: "nad- + -a → nadar (to swim), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "nadando", f: "gerund of nadar (to swim): 'swimming'."}
          - {w: "vea", f: "ve- + -a → ver (to see), present subjunctive, I: 'may I see', a curse. vea, veas, vea, veamos, veáis, vean."}
          - {w: "los horadó", f: "horad- + -ó → horadar (to pierce), preterite, he, with 'los' (them, the skins). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
        note: "The innkeeper's curse plays on his own words: the wine 'swims' in the room, so may the culprit's soul swim in hell."
