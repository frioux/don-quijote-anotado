  - sentences:
      - es: "»—Las más estrañas que muchos días ha se han oído en ella; porque se dice públicamente que Lotario, aquel grande amigo de Anselmo el rico, que vivía a San Juan, se llevó esta noche a Camila, mujer de Anselmo, el cual tampoco parece."
        literal: "»—The most strange that many days ago themselves have heard in it; because itself says publicly that Lotario, that great friend of Anselmo the rich, who lived at San Juan, himself carried-off this night [to] Camila, wife of Anselmo, the which neither appears."
        ormsby: "“The strangest that have been heard for many a day; for it is reported abroad that Lothario, the great friend of the wealthy Anselmo, who lived at San Giovanni, carried off last night Camilla, the wife of Anselmo, who also has disappeared."
        vocab:
          - {w: "estraño", d: "= extraño, strange"}
          - {w: "muchos días ha", d: "for many days, in many a day; 'ha' = hace (ago)"}
          - {w: "públicamente", d: "openly, all over town"}
          - {w: "vivir a San Juan", d: "to live by (the church of) San Juan, i.e. San Giovanni, the Baptistery quarter of Florence"}
          - {w: "esta noche", d: "here 'last night' (the night just past)"}
          - {w: "tampoco", d: "neither, not either"}
          - {w: "parecer", d: "here 'to appear, be found' (old sense; modern 'aparecer')"}
        diagram:
          - s: "Las más estrañas"
            r: "answer: the strangest (news)"
            under:
              - {s: "que muchos días ha se han oído en ella", r: "describes 'estrañas': that have been heard in it (the city) for many days"}
          - s: "porque se dice públicamente"
            r: "why: because it is said openly"
            under:
              - s: "que Lotario ... se llevó esta noche a Camila, mujer de Anselmo"
                r: "what is said: that Lotario carried off Camila, Anselmo's wife, last night"
                under:
                  - s: "aquel grande amigo de Anselmo el rico"
                    r: "describes 'Lotario': that great friend of rich Anselmo"
                    under:
                      - {s: "que vivía a San Juan", r: "describes 'Anselmo': who lived by San Juan"}
                  - {s: "el cual tampoco parece", r: "describes 'Anselmo': who can't be found either"}
        forms:
          - {w: "Las más estrañas", f: "the superlative 'the strangest', feminine plural to match 'nuevas' (news), which is understood."}
          - {w: "ha", f: "haber in the old sense of 'ago' (modern 'hace'): 'muchos días ha' = many days ago."}
          - {w: "se han oído", f: "han (haber, present, they: he, has, ha, hemos, habéis, han) + oído, participle of oír (to hear), with 'se' making it passive: 'have been heard'."}
          - {w: "se dice", f: "dic- + -e → decir (to say), present, it, with 'se': 'it is said'. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "grande", f: "Cervantes keeps the full form before a noun where modern Spanish says 'gran'."}
          - {w: "vivía", f: "viv- + -ía → vivir (to live), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "se llevó", f: "llev- + -ó → llevarse (to carry off), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "parece", f: "parec- + -e → parecer (to appear), present, he. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
        note: "The townsman does not know he is speaking to Anselmo himself, so the news of his own disgrace reaches him as common gossip."
