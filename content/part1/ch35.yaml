part: 1
chapter: 35
title_es: "Capítulo XXXV. Donde se da fin a la novela del Curioso impertinente"
title_en: "Which treats of the heroic and prodigious battle Don Quixote had with certain skins of red wine, and brings the novel of The Ill-Advised Curiosity to a close"
paragraphs:
  - sentences:
      - es: "Poco más quedaba por leer de la novela, cuando del caramanchón donde reposaba don Quijote salió Sancho Panza todo alborotado, diciendo a voces:"
        literal: "Little more remained to read of the novel, when from-the garret where was-resting Don Quijote came-out Sancho Panza all stirred-up, saying at voices:"
        ormsby: "There remained but little more of the novel to be read, when Sancho Panza burst forth in wild excitement from the garret where Don Quixote was lying, shouting,"
        vocab:
          - {w: "quedar por + infinitive", d: "to remain to be done; 'quedaba por leer' = was still left to read"}
          - {w: "novela", d: "short story, novella (in Cervantes' time a 'novela' is a short tale in the Italian manner, not a long novel)"}
          - {w: "caramanchón", d: "garret, attic room under the roof (modern 'camaranchón')"}
          - {w: "reposar", d: "to rest, lie sleeping"}
          - {w: "alborotado", d: "agitated, in an uproar, all worked up"}
          - {w: "a voces", d: "shouting, at the top of his voice"}
        diagram:
          - s: "Poco más quedaba por leer de la novela"
            r: "main clause: little more of the story was left to read"
            under:
              - s: "cuando del caramanchón donde reposaba don Quijote salió Sancho Panza todo alborotado"
                r: "when: Sancho rushed out of the garret where Don Quijote was sleeping"
                under:
                  - {s: "diciendo a voces:", r: "how: shouting"}
        forms:
          - {w: "quedaba", f: "qued- + -aba → quedar (to remain), imperfect, it. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "leer", f: "infinitive (to read) after 'por': 'quedar por leer' = to be still unread."}
          - {w: "del", f: "de + el: 'from the'."}
          - {w: "reposaba", f: "repos- + -aba → reposar (to rest), imperfect, he. Same -aba imperfect."}
          - {w: "salió", f: "sal- + -ió → salir (to go out), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "alborotado", f: "participle of alborotar (to stir up), masculine to match Sancho: 'all worked up'."}
          - {w: "diciendo", f: "gerund of decir (to say); the stem e turns to i: decir → diciendo."}
  - sentences:
      - es: "— Acudid, señores, presto y socorred a mi señor, que anda envuelto en la más reñida y trabada batalla que mis ojos han visto."
        literal: "— Come-running, sirs, quickly and help [to] my master, who goes wrapped-up in the most fought and locked battle that my eyes have seen."
        ormsby: "“Run, sirs! quick; and help my master, who is in the thick of the toughest and stiffest battle I ever laid eyes on."
        vocab:
          - {w: "acudir", d: "to come running, hurry to help"}
          - {w: "presto", d: "quickly, at once (literary)"}
          - {w: "socorrer", d: "to help, come to the aid of"}
          - {w: "andar envuelto en", d: "to be caught up in, in the thick of"}
          - {w: "reñido", d: "hard-fought, fierce"}
          - {w: "trabado", d: "locked together, close-fought (of a battle)"}
        diagram:
          - s: "Acudid"
            r: "main verb 1: come quickly"
            under:
              - {s: "señores", r: "who is addressed: sirs"}
              - {s: "presto", r: "how: quickly"}
          - s: "y socorred a mi señor"
            r: "main verb 2: and help my master"
            under:
              - s: "que anda envuelto en la más reñida y trabada batalla"
                r: "describes 'señor': who is caught in the fiercest battle"
                under:
                  - {s: "que mis ojos han visto", r: "describes 'batalla': that my eyes have seen"}
        forms:
          - {w: "Acudid, socorred", f: "acud- + -id → acudir (to come running) and socorr- + -ed → socorrer (to help), commands, you all (vosotros). The vosotros command drops the -r of the infinitive and adds -d: hablad, comed, vivid."}
          - {w: "anda", f: "and- + -a → andar (to go about), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. 'andar' + participle = to be (in some state)."}
          - {w: "envuelto", f: "irregular participle of envolver (to wrap up), masculine to match the master."}
          - {w: "la más reñida y trabada", f: "más + adjective after the article = the superlative 'the fiercest and closest'; feminine to match 'batalla'."}
          - {w: "han visto", f: "han (haber, present, they: he, has, ha, hemos, habéis, han) + visto, the irregular participle of ver (to see): 'have seen'."}
      - es: "¡Vive Dios, que ha dado una cuchillada al gigante enemigo de la señora princesa Micomicona, que le ha tajado la cabeza, cercen a cercen, como si fuera un nabo!"
        literal: "Lives God, that he-has given a slash to-the giant enemy of the lady princess Micomicona, that to-him he-has sliced the head, clean to clean, as if it-were a turnip!"
        ormsby: "By the living God he has given the giant, the enemy of my lady the Princess Micomicona, such a slash that he has sliced his head clean off as if it were a turnip.”"
        vocab:
          - {w: "¡Vive Dios!", d: "'as God lives!', a common oath: by God!"}
          - {w: "cuchillada", d: "slash, cut with a sword or knife"}
          - {w: "Micomicona", d: "the princess Dorotea is pretending to be, invented by the curate to lure Don Quijote home; her kingdom is 'Micomicón'"}
          - {w: "tajar", d: "to cut, slice, hew"}
          - {w: "cercen a cercen", d: "clean through, right off at the root (modern 'a cercén')"}
          - {w: "nabo", d: "turnip"}
        diagram:
          - {s: "¡Vive Dios", r: "oath: by God"}
          - s: "que ha dado una cuchillada"
            r: "main verb: he has given a slash"
            under:
              - {s: "al gigante enemigo de la señora princesa Micomicona", r: "to whom: to the giant, the princess's enemy"}
              - s: "que le ha tajado la cabeza"
                r: "result: so that he has cut off his head"
                under:
                  - {s: "cercen a cercen", r: "how: clean off"}
                  - {s: "como si fuera un nabo", r: "comparison: as if it were a turnip"}
        forms:
          - {w: "Vive", f: "viv- + -e → vivir (to live), present, he (God): 'God lives', here an oath. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "ha dado", f: "ha (haber, present, he: he, has, ha, hemos, habéis, han) + dado, participle of dar (to give): 'has given'."}
          - {w: "al", f: "a + el: 'to the'."}
          - {w: "le ha tajado", f: "ha (haber, present, he) + tajado, participle of tajar (to slice); 'le' = from him, the giant: 'has sliced his head off'."}
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), it: 'as if it were'. 'como si' always takes the imperfect subjunctive. fuera, fueras, fuera, fuéramos, fuerais, fueran."}
        note: "In the inn's attic hang the innkeeper's wineskins. Sancho, half asleep and full of his master's stories, really believes he saw the giant's head fall."
  - sentences:
      - es: "— ¿Qué dices, hermano? —dijo el cura, dejando de leer lo que de la novela quedaba—. ¿Estáis en vos, Sancho?"
        literal: "— What say-you, brother? —said the priest, leaving-off of reading that which of the novel remained—. Are-you in yourself, Sancho?"
        ormsby: "“What are you talking about, brother?” said the curate, pausing as he was about to read the remainder of the novel. “Are you in your senses, Sancho?"
        vocab:
          - {w: "hermano", d: "brother; a friendly way to address a man of lower rank"}
          - {w: "cura", d: "parish priest (Ormsby's 'curate'), Pero Pérez, Don Quijote's friend from the village"}
          - {w: "dejar de + infinitive", d: "to stop doing"}
          - {w: "estar en sí", d: "to be in one's right mind; '¿Estáis en vos?' = are you in your senses?"}
        diagram:
          - s: "¿Qué dices, hermano?"
            r: "what he said, 1: what are you saying, brother?"
          - s: "dijo el cura"
            r: "speech tag: said the priest"
            under:
              - {s: "dejando de leer lo que de la novela quedaba", r: "how: stopping his reading of what was left of the story"}
          - {s: "¿Estáis en vos, Sancho?", r: "what he said, 2: are you in your right mind?"}
        forms:
          - {w: "dices", f: "dic- + -es → decir (to say), present, you (tú). Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "dejando", f: "gerund of dejar (to leave; 'dejar de' = to stop)."}
          - {w: "quedaba", f: "qued- + -aba → quedar (to remain), imperfect, it. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "Estáis", f: "est- + -áis → estar (to be), present, you (vos). estoy, estás, está, estamos, estáis, están. The priest switches from 'tú' (dices) to 'vos' (estáis) in the same breath; both were used to inferiors."}
          - {w: "vos", f: "'yourself' after a preposition, here the vos form instead of 'ti'."}
      - es: "¿Cómo diablos puede ser eso que decís, estando el gigante dos mil leguas de aquí?"
        literal: "How [the] devils can be that which you-say, being the giant two thousand leagues from here?"
        ormsby: "How the devil can it be as you say, when the giant is two thousand leagues away?”"
        vocab:
          - {w: "¿cómo diablos?", d: "how the devil? (an exclamation of disbelief)"}
          - {w: "legua", d: "league, about 5.5 km, roughly an hour's walk"}
        diagram:
          - s: "¿Cómo diablos puede ser eso"
            r: "main verb: how the devil can that be"
            under:
              - {s: "que decís", r: "describes 'eso': what you say"}
              - {s: "estando el gigante dos mil leguas de aquí", r: "why not: when the giant is two thousand leagues away"}
        forms:
          - {w: "puede", f: "pued- + -e → poder (to be able), present, it. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "decís", f: "dec- + -ís → decir (to say), present, you (vos). Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "estando", f: "gerund of estar (to be), with its own subject 'el gigante': 'the giant being', i.e. 'when the giant is'."}
  - sentences:
      - es: "En esto, oyeron un gran ruido en el aposento, y que don Quijote decía a voces:"
        literal: "In this, they-heard a great noise in the room, and that Don Quijote was-saying at voices:"
        ormsby: "Here they heard a loud noise in the chamber, and Don Quixote shouting out,"
        vocab:
          - {w: "en esto", d: "at this point, just then"}
          - {w: "aposento", d: "room, chamber"}
        diagram:
          - s: "oyeron"
            r: "main verb: they heard"
            under:
              - {s: "En esto", r: "when: just then"}
              - {s: "un gran ruido en el aposento", r: "object 1: a great noise in the room"}
              - {s: "y que don Quijote decía a voces:", r: "object 2: that Don Quijote was shouting"}
        forms:
          - {w: "oyeron", f: "oy- + -eron → oír (to hear), preterite, they. The i between vowels becomes y: oí, oíste, oyó, oímos, oísteis, oyeron."}
          - {w: "gran", f: "grande (great) clipped before a singular noun."}
          - {w: "decía", f: "dec- + -ía → decir (to say), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
  - sentences:
      - es: "— ¡Tente, ladrón, malandrín, follón, que aquí te tengo, y no te ha de valer tu cimitarra!"
        literal: "— Hold-yourself, thief, rogue, knave, for here you I-have, and not you has to avail your scimitar!"
        ormsby: "“Stand, thief, brigand, villain; now I have got thee, and thy scimitar shall not avail thee!”"
        vocab:
          - {w: "¡Tente!", d: "stop! stand! (command of 'tenerse', to hold oneself still)"}
          - {w: "malandrín", d: "scoundrel, rogue; a word from the books of chivalry"}
          - {w: "follón", d: "knave, coward, villain; another insult from the chivalric romances"}
          - {w: "haber de + infinitive", d: "to be going to, must; 'no te ha de valer' = shall not help you"}
          - {w: "valer", d: "to help, avail, protect"}
          - {w: "cimitarra", d: "scimitar, the curved sword of Moors and giants in the romances"}
        diagram:
          - s: "Tente"
            r: "main verb 1: stop"
            under:
              - {s: "ladrón, malandrín, follón", r: "who is addressed: the giant"}
              - {s: "que aquí te tengo", r: "why: for I have you here"}
          - s: "y no te ha de valer"
            r: "main verb 2: and will not help you"
            under:
              - {s: "tu cimitarra", r: "subject: your scimitar"}
        forms:
          - {w: "Tente", f: "ten (the irregular tú command of tener, to hold) + te (yourself): 'hold yourself still'. Pronouns are hung on the end of a positive command."}
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "ha de valer", f: "ha (haber, present, it: he, has, ha, hemos, habéis, han) + de + valer (to avail): 'is to avail', i.e. 'shall avail'."}
          - {w: "te, tu", f: "te = you (object); tu = your, no accent. Don Quijote addresses the giant as 'tú', as one does an inferior or an enemy."}
  - sentences:
      - es: "Y parecía que daba grandes cuchilladas por las paredes. Y dijo Sancho:"
        literal: "And it-seemed that he-was-giving great slashes along the walls. And said Sancho:"
        ormsby: "And then it seemed as though he were slashing vigorously at the wall."
        ormsby_match: false
        vocab:
          - {w: "parecer que", d: "to seem that, sound as if"}
          - {w: "dar cuchilladas", d: "to slash, hack with a sword"}
        diagram:
          - s: "Y parecía"
            r: "main verb 1: and it seemed"
            under:
              - {s: "que daba grandes cuchilladas por las paredes", r: "what it seemed: that he was slashing at the walls"}
          - s: "Y dijo"
            r: "main verb 2: and said"
            under:
              - {s: "Sancho", r: "subject"}
        forms:
          - {w: "parecía", f: "parec- + -ía → parecer (to seem), imperfect, it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "daba", f: "d- + -aba → dar (to give), imperfect, he: 'was giving'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "grandes", f: "plural of grande (great), to match 'cuchilladas'; it is clipped to 'gran' only in the singular."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— No tienen que pararse a escuchar, sino entren a despartir la pelea, o a ayudar a mi amo;"
        literal: "— Not they-have to stop-themselves to listen, but let-them-enter to separate the fight, or to help [to] my master;"
        ormsby: "“Don’t stop to listen,” said Sancho, “but go in and part them or help my master:"
        vocab:
          - {w: "no tener que", d: "not to have to; here 'there's no need to'"}
          - {w: "pararse", d: "to stop"}
          - {w: "despartir", d: "to separate, part (two fighters)"}
          - {w: "pelea", d: "fight"}
          - {w: "amo", d: "master (of a servant)"}
        diagram:
          - s: "No tienen que pararse a escuchar"
            r: "main verb 1: you (sirs) needn't stop to listen"
          - s: "sino entren"
            r: "main verb 2: but go in"
            under:
              - {s: "a despartir la pelea", r: "purpose 1: to break up the fight"}
              - {s: "o a ayudar a mi amo;", r: "purpose 2: or to help my master"}
        forms:
          - {w: "tienen", f: "tien- + -en → tener (to have), present, they (here 'you', vuestras mercedes, which takes the 'they' form). Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "pararse", f: "parar (to stop) + se (yourselves), the pronoun hung on the infinitive."}
          - {w: "entren", f: "entr- + -en → entrar (to enter), present subjunctive, they, used as a polite command to 'vuestras mercedes': 'go in'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
      - es: "aunque ya no será menester, porque, sin duda alguna, el gigante está ya muerto, y dando cuenta a Dios de su pasada y mala vida, que yo vi correr la sangre por el suelo, y la cabeza cortada y caída a un lado, que es tamaña como un gran cuero de vino."
        literal: "although already not it-will-be needful, because, without doubt any, the giant is already dead, and giving account to God of his past and bad life, for I saw run the blood over the floor, and the head cut and fallen to one side, which is as-big as a great skin of wine."
        ormsby: "though there is no need of that now, for no doubt the giant is dead by this time and giving account to God of his past wicked life; for I saw the blood flowing on the ground, and the head cut off and fallen on one side, and it is as big as a large wineskin.”"
        vocab:
          - {w: "ser menester", d: "to be necessary, needed"}
          - {w: "sin duda alguna", d: "without any doubt; 'alguna' after the noun in a negative phrase means 'any at all'"}
          - {w: "dar cuenta a Dios", d: "to give account to God, i.e. to face judgment after death"}
          - {w: "tamaño como", d: "as big as (old use of 'tamaño' as an adjective)"}
          - {w: "cuero de vino", d: "wineskin, a whole goat- or pigskin sewn up to hold wine"}
        diagram:
          - s: "aunque ya no será menester"
            r: "concession: though there's no need now"
            under:
              - s: "porque, sin duda alguna, el gigante está ya muerto"
                r: "why 1: because the giant is surely dead already"
                under:
                  - {s: "y dando cuenta a Dios de su pasada y mala vida", r: "and: giving account to God of his wicked life"}
              - s: "que yo vi correr la sangre por el suelo"
                r: "why 2: for I saw the blood run over the floor"
                under:
                  - s: "y la cabeza cortada y caída a un lado"
                    r: "what I saw, 2: and the head cut off and fallen to one side"
                    under:
                      - {s: "que es tamaña como un gran cuero de vino", r: "describes 'cabeza': as big as a big wineskin"}
        forms:
          - {w: "será", f: "ser + -á → ser (to be), future, it. The future adds -é, -ás, -á, -emos, -éis, -án to the infinitive."}
          - {w: "alguna", f: "algun- + -a → alguno (any), feminine to match 'duda'."}
          - {w: "está ... muerto", f: "está (estar, present, he: estoy, estás, está, estamos, estáis, están) + muerto, the irregular participle of morir (to die): 'is dead'."}
          - {w: "dando", f: "gerund of dar (to give): 'giving account'."}
          - {w: "pasada", f: "pasad- + -a → pasado (past), feminine to match 'vida'."}
          - {w: "vi", f: "ver (to see), preterite, I. vi, viste, vio, vimos, visteis, vieron."}
          - {w: "correr", f: "infinitive (to run) after 'vi': 'I saw the blood run'."}
          - {w: "cortada y caída", f: "participles of cortar (to cut) and caer (to fall), feminine to match 'cabeza'."}
          - {w: "tamaña", f: "tamañ- + -a → tamaño (so big), feminine to match 'cabeza'."}
        note: "Sancho's comparison gives the game away: the 'head' he saw was one of the innkeeper's wineskins, and the 'blood' was red wine."
  - sentences:
      - es: "— Que me maten —dijo a esta sazón el ventero— si don Quijote, o don diablo, no ha dado alguna cuchillada en alguno de los cueros de vino tinto que a su cabecera estaban llenos, y el vino derramado debe de ser lo que le parece sangre a este buen hombre."
        literal: "— That me they-may-kill —said at this season the innkeeper— if Don Quijote, or don devil, not has given some slash in some of the skins of wine red that at his bed-head were full, and the wine spilled must of be that which to-him seems blood to this good man."
        ormsby: "“May I die,” said the landlord at this, “if Don Quixote or Don Devil has not been slashing some of the skins of red wine that stand full at his bed’s head, and the spilt wine must be what this good fellow takes for blood;”"
        vocab:
          - {w: "¡Que me maten si...!", d: "'may they kill me if...': I'll be hanged if..."}
          - {w: "a esta sazón", d: "at this moment, just then"}
          - {w: "ventero", d: "innkeeper, landlord of a roadside inn (venta)"}
          - {w: "don diablo", d: "'Sir Devil', a mocking twist on 'don Quijote'"}
          - {w: "vino tinto", d: "red wine"}
          - {w: "cabecera", d: "head of the bed"}
          - {w: "derramar", d: "to spill, pour out"}
          - {w: "deber de + infinitive", d: "must (probability): 'must be'"}
          - {w: "buen hombre", d: "'good man', said slightly condescendingly of a peasant"}
        diagram:
          - s: "Que me maten"
            r: "main verb: may they kill me"
            under:
              - {s: "dijo a esta sazón el ventero", r: "speech tag: said the innkeeper just then"}
              - s: "si don Quijote, o don diablo, no ha dado alguna cuchillada"
                r: "condition: if Don Quijote has not slashed"
                under:
                  - s: "en alguno de los cueros de vino tinto"
                    r: "where: into one of the red-wine skins"
                    under:
                      - {s: "que a su cabecera estaban llenos", r: "describes 'cueros': which stood full at the head of his bed"}
          - s: "y el vino derramado debe de ser"
            r: "main verb 2: and the spilled wine must be"
            under:
              - {s: "lo que le parece sangre a este buen hombre", r: "what it must be: what this fellow takes for blood"}
        forms:
          - {w: "maten", f: "mat- + -en → matar (to kill), present subjunctive, they: 'may they kill'. A wish or curse in the subjunctive. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "ha dado", f: "ha (haber, present, he: he, has, ha, hemos, habéis, han) + dado, participle of dar (to give)."}
          - {w: "alguna, alguno", f: "alguna (some), feminine to match 'cuchillada'; alguno (one), standing alone as a pronoun keeps its full form."}
          - {w: "estaban", f: "est- + -aban → estar (to be), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "llenos", f: "llen- + -os → lleno (full), masculine plural to match 'cueros'."}
          - {w: "derramado", f: "participle of derramar (to spill), masculine to match 'vino'."}
          - {w: "debe", f: "deb- + -e → deber (must), present, it. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
