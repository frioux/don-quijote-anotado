          - s: "¿No vees"
            r: "main verb 1: don't you see"
            under:
              - {s: "ladrón", r: "who is addressed: thief"}
              - s: "que la sangre y la fuente no es otra cosa que estos cueros"
                r: "what: that the blood and fountain are only these skins"
