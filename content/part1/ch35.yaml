          - {w: "puntualmente", d: "precisely, in detail (not 'punctually')"}
          - {w: "negocio", d: "affair, business, matter"}
          - {w: "admirado", d: "astonished, amazed (false friend)"}
          - {w: "suceso", d: "event, happening (false friend: not 'success')"}
          - {w: "familiar", d: "intimate, close"}
          - {w: "los dos amigos", d: "'the two friends', the nickname given to Anselmo and Lotario at the start of the story"}
        diagram:
