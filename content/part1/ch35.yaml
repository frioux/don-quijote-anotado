summary: |
  The priest has nearly finished reading the story of the Ill-Advised Curiosity aloud at the inn when Sancho bursts in shouting that his master is fighting the giant who persecutes Princess Micomicona and has cut off its head. In the garret they find Don Quijote, asleep, in a short nightshirt and the innkeeper's greasy red cap, slashing with his sword at the innkeeper's wineskins. The room is swimming in red wine. The innkeeper pummels him until Cardenio and the priest pull him off, and the barber wakes the knight with a pot of cold well water.

  Sancho hunts the floor for the giant's head and, not finding it, decides that the inn is enchanted and fears his promised county will melt away like salt in water. Still dreaming, Don Quijote kneels to the priest as if he were the princess and declares his promise fulfilled. Everyone laughs except the innkeeper and his wife, who lists all the knight has cost her: the unpaid night of his first visit, the ox-tail spoiled as a false beard, and now the wine. The priest promises to pay for everything, and Dorotea promises Sancho the best county in her kingdom once the giant's death is confirmed.

  The priest then reads the end of the story. Anselmo, now sure of Camila's virtue, lives happily while she pretends to dislike Lotario. One night he surprises a man jumping from the window of Camila's maid Leonela, who in terror promises to reveal something important the next morning. Camila, fearing the maid will expose her, flees that night with her jewels to Lotario, who hides her in a convent where his sister is prioress and leaves the city. In the morning Anselmo finds Leonela gone, Camila gone, Lotario gone, and even his servants gone.

  On the road to his friend's village Anselmo learns from a passing townsman that all Florence is talking of Lotario's elopement with his wife. At his friend's house he goes to bed and starts a letter forgiving Camila, but dies before he can finish it. Lotario is later killed in a battle in the kingdom of Naples, and Camila takes her vows and soon dies of grief. The priest says he likes the story but cannot believe a husband would make so costly a test; told of a suitor and a lady it might pass, but between husband and wife it seems impossible. He has no complaint about the way it is told.
context: |
  The inn and its accounts. This chapter is about money as much as about giants. The innkeeper and his wife are small traders who live on supper, bed, straw and barley for travellers' beasts. A wineskin was a whole animal hide sewn up and pitched inside, and costly to replace; holes were patched with 'botanas', plugs or patches. On his first visit (chapters 16 and 17) Don Quijote refused to pay, claiming that knights-errant never did, and Sancho was tossed in a blanket for it; the innkeeper now swears it will not happen again. The landlady's complaint that the ox-tail came back 'more than two cuartillos the worse' prices the damage in small coin: Ormsby notes that a cuartillo was a quarter of a real. Her 'a cuarto on top of a cuarto' means to the last copper.

  The wineskin battle. A man who stabs wineskins thinking they are enemies is an old joke: in Apuleius' Golden Ass, Lucius slashes three wineskins at a door believing them to be robbers. Cervantes turns it into the climax of the Micomicona farce. Don Quijote fights in his sleep, dreaming he has reached the kingdom of Micomicón, so his madness now works even with his eyes shut. Sancho, awake, is worse: the wine is blood and the skin is a head as big as a wineskin. The narrator plays along with mock-heroic language, mourning 'the sudden death' of the skins and calling Don Quijote and the innkeeper 'her champion and her enemy'. Sancho's 'Ciertos son los toros' is, as Ormsby notes, a proverb probably born of the anxiety before a bullfight: the bulls are coming, it is a sure thing.

  Frame and story. The tale of the Ill-Advised Curiosity, set in Florence, has been read aloud from a manuscript left at the inn, and Cervantes interrupts its last pages with the wineskin farce: tragedy and slapstick side by side. The narrator's games go one step further when the priest, who is a character, judges the inserted novella as a critic: invented stories ought to be believable ('verisímil'), and a husband testing his own wife this way is not. The story itself follows the Italian novella in the manner of Boccaccio and Bandello, and its moral is spelled out: 'such an end, born of such a senseless beginning'. The chapter heading differs between editions: the Gutenberg text says only that the novella ends here, while Ormsby, following other editions, heads it with 'the heroic and prodigious battle' with the wineskins.

  History, religion and medicine. Ormsby points out an anachronism: Lautrec, the French marshal, and Gonzalo Fernández de Córdoba, the 'Great Captain' who won Naples for Spain, never fought each other; Lautrec's Italian campaigns came years after the Great Captain's death in 1515. A woman in Camila's position could retreat to a convent without becoming a nun; 'hacer profesión' means taking the final vows, and she takes them only when Lotario is dead. Dying of grief and melancholy was taken literally: melancholy was one of the four humors, and an excess of it was a real disease. The innkeeper complains of Sancho's 'flema', the cold, slow humor.

  Names. Micomicona and Micomicón are the priest's invention, a comic African-sounding name. The innkeeper's 'don diablo' mocks the 'don' Don Quijote gave himself. Lotario is the Italian Lothario; through Nicholas Rowe's play The Fair Penitent (1703), 'a Lothario' later became English slang for a seducer. Anselmo and Lotario were known in Florence as 'los dos amigos', the two friends, and the townsman uses the nickname without knowing he is speaking to Anselmo.

  Reading Cervantes' Spanish. The chapter keeps the usual archaisms: mesmo and mesma, ansí and ansimesmo, estraño, efeto, satisfación, recebir, sotilmente, previlegios, monesterio, encantamento, añudadas, vees for ves, and the old preterite 'trujo' for 'trajo'. Pronouns hang on verbs that open a clause (Consolóse, Sosegóse, Dejáronle, Contemplábase, Hízose, Dícese, Admiróse, Llegóse), and once haber is split from its participle to carry them: 'hámela vuelto'. The -ra subjunctive works as a conditional ('si no se le quitaran, él acabara la guerra'; 'pudiérase llevar'), the future subjunctive appears in Anselmo's letter ('si las nuevas ... llegaren'), and 'ha' still means 'ago' ('muchos días ha'). Watch the false friends: admirar (to astonish), suceso (event), pariente (relative), razones (words), experiencia (experiment), de industria (on purpose), acuerdo (awareness), puesto que (although).
