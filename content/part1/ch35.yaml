  - sentences:
      - es: "»En esto, el que tenía Leonela de verse cualificada, no de con sus amores, llegó a tanto que, sin mirar a otra cosa, se iba tras él a suelta rienda, fiada en que su señora la encubría, y aun la advertía del modo que con poco recelo pudiese ponerle en ejecución."
        literal: "»In this, the [pleasure] that had Leonela of seeing-herself qualified, not of with her loves, reached to so-much that, without looking at other thing, herself she-went after it at loose rein, trusting in that her mistress her covered-up, and even her advised of-the way that with little fear she-might put-it into execution."
        ormsby: "Meanwhile the satisfaction with which Leonela saw herself empowered to carry on her amour reached such a height that, regardless of everything else, she followed her inclinations unrestrainedly, feeling confident that her mistress would screen her, and even show her how to manage it safely."
        vocab:
          - {w: "en esto", d: "meanwhile, at this point"}
          - {w: "Leonela", d: "Camila's maid, who knows her mistress's secret and has a lover of her own"}
          - {w: "cualificado", d: "= calificado, made important, given standing (here: free to do as she liked)"}
          - {w: "amores", d: "love affair"}
          - {w: "llegar a tanto que", d: "to reach such a point that"}
          - {w: "a suelta rienda", d: "at full gallop, with loose rein: unrestrainedly"}
          - {w: "fiado en", d: "trusting in, relying on"}
          - {w: "encubrir", d: "to cover up for, conceal"}
          - {w: "advertir", d: "here 'to instruct, show' (also 'to warn, notice')"}
          - {w: "recelo", d: "fear, suspicion, caution"}
          - {w: "poner en ejecución", d: "to carry out, put into practice"}
