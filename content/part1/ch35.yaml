  - sentences:
      - es: "«Sucedió, pues, que, por la satisfación que Anselmo tenía de la bondad de Camila, vivía una vida contenta y descuidada, y Camila, de industria, hacía mal rostro a Lotario, porque Anselmo entendiese al revés de la voluntad que le tenía;"
        literal: "«It-happened, then, that, for the satisfaction that Anselmo had of the goodness of Camila, he-lived a life content and carefree, and Camila, of design, made bad face to Lotario, so-that Anselmo might-understand the reverse of the will that to-him she-had;"
        ormsby: "The result was, that from the confidence Anselmo felt in Camilla’s virtue, he lived happy and free from anxiety, and Camilla purposely looked coldly on Lothario, that Anselmo might suppose her feelings towards him to be the opposite of what they were;"
        vocab:
          - {w: "satisfación", d: "= satisfacción, here 'confidence, certainty'"}
          - {w: "bondad", d: "goodness, here 'virtue, chastity'"}
          - {w: "descuidado", d: "carefree, unsuspecting"}
          - {w: "de industria", d: "on purpose, deliberately (false friend: not 'industry')"}
          - {w: "hacer mal rostro a", d: "to look coldly on, scowl at"}
          - {w: "porque", d: "with the subjunctive, 'so that' (= para que), not 'because'"}
          - {w: "al revés de", d: "the opposite of"}
          - {w: "voluntad", d: "will, here 'affection, love'"}
