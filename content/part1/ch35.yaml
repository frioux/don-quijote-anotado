        vocab:
          - {w: "la otra vez", d: "the other time, last time (at this same inn, in chapters 16 and 17)"}
          - {w: "mesmo", d: "= mismo, same"}
          - {w: "hallarse", d: "to find oneself, be"}
          - {w: "mojicón", d: "punch in the face"}
          - {w: "porrazo", d: "thump, blow with a club"}
