          - s: "me dieron muchos mojicones y porrazos"
            r: "main verb 1: they gave me many punches and thumps"
            under:
              - {s: "la otra vez", r: "when: last time"}
              - s: "en este mesmo lugar"
                r: "where: in this very place"
                under:
                  - {s: "donde ahora me hallo", r: "describes 'lugar': where I am now"}
              - {s: "sin saber quién me los daba", r: "how: without my knowing who was giving them to me"}
          - {s: "y nunca pude ver a nadie;", r: "main verb 2: and I could never see anyone"}
