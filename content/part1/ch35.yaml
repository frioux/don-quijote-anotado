        ormsby: "“Be calm, señor; do not give way to passion or follow him who has escaped from this; he belongs to me, and in fact he is my husband.”"
        vocab:
          - {w: "sosegarse", d: "to calm down"}
          - {w: "alborotarse", d: "to get excited, fly into a rage"}
          - {w: "cosa mía", d: "'a thing of mine': my business, my man"}
          - {w: "esposo", d: "husband; also 'betrothed' (a promise of marriage counted as binding)"}
