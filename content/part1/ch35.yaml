        forms:
          - {w: "Sucedió", f: "suced- + -ió → suceder (to happen), preterite, it. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "satisfación", f: "the old spelling of satisfacción."}
          - {w: "tenía, vivía, hacía", f: "tener (to have), vivir (to live), hacer (to make), imperfect, he/she. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
