          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. Same -ió preterite."}
  - sentences:
      - es: "-Para mí, señor castellano, cualquiera cosa basta, porque mis arreos son las armas, mi descanso el pelear, etc."
        literal: "-For me, lord castellan, whatever thing suffices, because my finery are the arms, my rest the fighting, etc."
        ormsby: "“Sir Castellan, for me anything will suffice, for ‘My armour is my only wear, My only rest the fray.’ ”"
        vocab:
          - {w: "castellano", d: "castellan, governor of a castle; also 'Castilian', which the innkeeper hears"}
          - {w: "cualquiera cosa", d: "anything at all (modern 'cualquier cosa')"}
          - {w: "bastar", d: "to suffice, be enough"}
          - {w: "arreos", d: "finery, dress, trappings"}
          - {w: "descanso", d: "rest"}
          - {w: "pelear", d: "to fight; 'el pelear' = fighting"}
        diagram:
          - s: "cualquiera cosa basta"
            r: "main verb: anything will do"
            under:
              - {s: "Para mí, señor castellano", r: "for whom: for me, lord castellan"}
              - {s: "porque mis arreos son las armas", r: "why: for my finery is my armor (ballad line 1)"}
              - {s: "mi descanso el pelear, etc.", r: "why, continued: my rest is fighting (ballad line 2; 'es' understood)"}
        forms:
          - {w: "mí", f: "'me' after a preposition, with the accent ('mi' without it = my)."}
          - {w: "cualquiera", f: "'any at all'; before a noun modern Spanish clips it to 'cualquier'."}
          - {w: "basta", f: "bast- + -a → bastar (to suffice), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "mis", f: "'my', plural to match 'arreos'."}
          - {w: "son", f: "ser (to be), present, they: soy, eres, es, somos, sois, son."}
          - {w: "el pelear", f: "the infinitive pelear (to fight) used as a noun with 'el': 'fighting'."}
        note: "Don Quijote quotes two lines of an old ballad and breaks off with 'etc.', trusting his listener to know the rest. The innkeeper does, and caps it in his reply (see Ormsby's note there)."
  - sentences:
      - es: "Pensó el huésped que el haberle llamado castellano había sido por haberle parecido de los sanos de Castilla, aunque él era andaluz, y de los de la playa de Sanlúcar, no menos ladrón que Caco, ni menos maleante que estudiantado paje; y así, le respondió:"
        literal: "Thought the host that the having-him called castellan had been for having-to-him seemed of the sound-ones of Castilla, although he was Andalusian, and of those of the beach of Sanlúcar, not less thief than Caco, nor less rogue than studentish page; and thus, to-him he-answered:"
        ormsby: "The host fancied he called him Castellan because he took him for a “worthy of Castile,” though he was in fact an Andalusian, and one from the strand of San Lúcar, as crafty a thief as Cacus and as full of tricks as a student or a page."
        vocab:
          - {w: "huésped", d: "here 'host, innkeeper'; the word meant both host and guest"}
          - {w: "sano de Castilla", d: "thieves' slang for a thief who passes as honest (literally 'sound man of Castile'); see Ormsby's note"}
          - {w: "andaluz", d: "Andalusian"}
          - {w: "playa de Sanlúcar", d: "the beach of Sanlúcar de Barrameda, at the mouth of the Guadalquivir, a notorious haunt of rogues"}
          - {w: "Caco", d: "Cacus, the fire-breathing thief of Roman myth killed by Hercules"}
          - {w: "maleante", d: "rogue, trickster"}
          - {w: "estudiantado", d: "student-like; students and pages were proverbial pranksters and petty thieves"}
          - {w: "paje", d: "page, young servant in a great house"}
        diagram:
          - s: "Pensó el huésped"
            r: "main verb 1: the host thought"
            under:
              - {s: "que el haberle llamado castellano había sido por haberle parecido de los sanos de Castilla", r: "what he thought: that being called 'castellano' was because he looked to Don Quijote like one of the 'sound men of Castile'"}
              - s: "aunque él era andaluz"
                r: "concession: although he was Andalusian"
                under:
                  - {s: "y de los de la playa de Sanlúcar", r: "and one of those from the beach of Sanlúcar"}
                  - {s: "no menos ladrón que Caco", r: "no less a thief than Cacus"}
                  - {s: "ni menos maleante que estudiantado paje", r: "nor less a rogue than a student-like page"}
          - {s: "y así, le respondió:", r: "main verb 2: and so he answered him"}
        forms:
          - {w: "Pensó", f: "pens- + -ó → pensar (to think), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "el haberle llamado", f: "'el' + haber + llamado (participle of llamar, to call), with 'le' (him) hung on the end of 'haber': 'the having called him'. An infinitive can act as a noun with 'el'."}
          - {w: "había sido", f: "había + sido (participle of ser, to be) → pluperfect, it: 'had been'. The pluperfect is había, habías, había, habíamos, habíais, habían + participle."}
          - {w: "haberle parecido", f: "haber + parecido (participle of parecer, to seem) after 'por' = 'because of having seemed'; 'le' = to him (Don Quijote)."}
          - {w: "los sanos", f: "sano (sound, healthy) as a noun with the article: 'the sound ones'."}
          - {w: "era", f: "ser (to be), imperfect, he: era, eras, era, éramos, erais, eran."}
          - {w: "estudiantado", f: "estudiant(e) + -ado → 'student-like', an adjective made from the noun."}
          - {w: "le respondió", f: "respond- + -ió → responder (to answer), preterite, he, with 'le' (to him). The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
        ormsby_note: "Sano de Castilla, a slang phrase from the Germanía dialect for a thief in disguise (ladron disimilado, Vocabulario de Gemiania de Hidalgo). 'Castellano' and 'alcaide' both mean governor of a castle or fortress, but the former means also a Castilian."
  - sentences:
      - es: "— Según eso, las camas de vuestra merced serán duras peñas, y su dormir, siempre velar; y siendo así, bien se puede apear, con seguridad de hallar en esta choza ocasión y ocasiones para no dormir en todo un año, cuanto más en una noche."
        literal: "— According-to that, the beds of your mercy will-be hard rocks, and your sleeping, always to-keep-watch; and being thus, well yourself you-can dismount, with security of finding in this hut occasion and occasions for not sleeping in all a year, how-much more in one night."
        ormsby: "“In that case,” said he, “ ‘Your bed is on the flinty rock, Your sleep to watch alway;’ and if so, you may dismount and safely reckon upon any quantity of sleeplessness under this roof for a twelvemonth, not to say for a single night.”"
        vocab:
          - {w: "según eso", d: "in that case, by that reckoning"}
          - {w: "peña", d: "rock, crag"}
          - {w: "velar", d: "to stay awake, keep watch"}
          - {w: "apearse", d: "to dismount, get down"}
          - {w: "seguridad", d: "certainty, assurance"}
          - {w: "choza", d: "hut, hovel"}
          - {w: "ocasión", d: "opportunity, occasion"}
          - {w: "cuanto más", d: "let alone, much less"}
        diagram:
          - s: "las camas de vuestra merced serán duras peñas"
            r: "main clause 1 (ballad line 3): your worship's beds will be hard rocks"
            under:
              - {s: "Según eso", r: "in that case"}
          - {s: "y su dormir, siempre velar", r: "main clause 2 (ballad line 4): and your sleep, always keeping watch ('será' understood)"}
          - s: "bien se puede apear"
            r: "main verb 3: you may well dismount"
            under:
              - {s: "y siendo así", r: "condition: and this being so"}
              - s: "con seguridad de hallar en esta choza ocasión y ocasiones"
                r: "how: sure of finding in this hovel chance upon chance"
                under:
                  - s: "para no dormir en todo un año"
                    r: "for what: for not sleeping for a whole year"
                    under:
                      - {s: "cuanto más en una noche", r: "let alone one night"}
        forms:
          - {w: "eso", f: "neuter 'that [idea]'."}
          - {w: "serán", f: "ser + -án → ser (to be), future, they: seré, serás, será, seremos, seréis, serán (the infinitive + the ending)."}
          - {w: "duras", f: "feminine plural to match 'peñas'."}
          - {w: "su dormir", f: "'your sleeping': 'su' because vuestra merced is addressed in the third person; dormir (to sleep) is an infinitive used as a noun."}
          - {w: "velar", f: "infinitive (to keep watch)."}
          - {w: "siendo", f: "gerund of ser (to be): 'this being so'."}
          - {w: "se puede apear", f: "pued- + -e → poder (can), present, you (vuestra merced, with the he/she form); 'se' belongs to apearse (to dismount) and has moved up in front of 'puede'. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "hallar", f: "infinitive (to find) after 'de'."}
          - {w: "dormir", f: "infinitive (to sleep) after 'para no'."}
          - {w: "todo un año", f: "'a whole year'."}
        ormsby_note: "The lines quoted by Don Quixote and the host are, in the original: 'Mis arreos son las armas, Mi descanso el pelear, Mi cama, las duras peñas, Mi dormir, siempre velar.' They occur first in the old, probably fourteenth century, ballad of Moriana en un Castillo, and were afterwards adopted as the beginning of a serenade. In England it would be a daring improbability to represent the landlord of a roadside alehouse capping verses with his guest out of Chevy Chase or Sir Andrew Barton, but in Spain familiarity with the old national ballad-poetry and proverbs is an accomplishment that may, even to this day, be met with in quarters quite as unpromising."
        note: "The innkeeper caps the ballad with its next two lines and turns them into a joke about his wretched inn: here a guest can count on staying awake."
  - sentences:
