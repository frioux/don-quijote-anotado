          - {w: "peregrino", d: "rare, wondrous (also 'pilgrim')"}
          - {w: "rogar", d: "to beg, entreat"}
          - {w: "olvidarse de", d: "to forget"}
          - {w: "carrera", d: "course, journey; also 'gallop, run'"}
        diagram:
          - s: "ruégote"
