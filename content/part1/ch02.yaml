  - sentences:
      - es: "— ¿Quién duda sino que en los venideros tiempos, cuando salga a luz la verdadera historia de mis famosos hechos, que el sabio que los escribiere no ponga, cuando llegue a contar esta mi primera salidad tan de mañana, desta manera?:"
        literal: "— Who doubts but that in the coming times, when comes-out to light the true history of my famous deeds, that the sage who them shall-write not will-put, when he-comes to tell this my first sally so of morning, of-this manner?:"
        ormsby: "“Who knows but that in time to come, when the veracious history of my famous deeds is made known, the sage who writes it, when he has to set forth my first sally in the early morning, will do it after this fashion?"
        vocab:
          - {w: "¿quién duda sino que ...?", d: "who can doubt that ...?, i.e. surely"}
          - {w: "venidero", d: "coming, future"}
          - {w: "salir a luz", d: "to come to light, be published"}
          - {w: "hechos", d: "deeds, exploits"}
          - {w: "sabio", d: "sage, learned man; in the romances often a magician who writes the hero's chronicle"}
          - {w: "poner", d: "here: to set down, write"}
          - {w: "salidad", d: "a misprint in this edition for 'salida', sally, first outing; the text is left as printed"}
          - {w: "tan de mañana", d: "so early in the morning"}
          - {w: "desta manera", d: "= de esta manera, in this way"}
