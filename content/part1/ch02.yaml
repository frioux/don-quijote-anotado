        forms:
          - {w: "pasara", f: "pas- + -ara → pasar (to go on), imperfect subjunctive (-ra form), it: here 'would have gone'. Built on the preterite pasaron: pasara, pasaras, pasara, pasáramos, pasarais, pasaran. Cervantes uses the -ra form where modern Spanish says 'habría pasado'."}
