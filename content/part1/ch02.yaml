summary: |
  Having finished his preparations, Don Quijote slips out of the back gate of his yard before dawn on a hot July morning, armed from head to foot and mounted on Rocinante, without telling anyone. He has barely reached open country when he remembers that he has never been dubbed a knight: by the laws of chivalry he may not fight another knight, and even once dubbed he must wear plain white armor with no device on his shield. His madness wins the argument. He decides to have himself dubbed by the first person he meets, promises himself to scour his armor whiter than ermine, and lets Rocinante choose the road, as knights-errant do.

  As he rides he composes aloud the flowery opening his future chronicler will write about this very morning, all rosy dawns and singing birds, begs the enchanter-historian not to forget Rocinante, and addresses mock-antique love complaints to Dulcinea. The sun climbs hot enough to melt his brains, the narrator says, if he had any. Nothing worth telling happens all day.

  At nightfall, tired and starving, he sees a roadside inn and takes it for a castle with silver towers and a drawbridge. Two prostitutes at the door become noble damsels, and a swineherd's horn becomes the dwarf's trumpet announcing his arrival. He tells the frightened girls, in archaic chivalric Spanish, that they have nothing to fear; they burst out laughing at being called maidens, and he is growing angry when the fat, peaceable innkeeper comes out and politely offers him lodging. Don Quijote answers with a line from an old ballad, and the innkeeper, a retired Andalusian rogue, caps it with the next.

  The girls take off some of his armor, but his makeshift helmet is tied on with green ribbons that he will not let them cut, so he keeps it on all night. It is Friday, and the only food is badly cooked salt cod and black bread. He cannot feed himself: one girl puts the food in his mouth and the innkeeper pours wine into him through a hollow reed. A passing pig-gelder's panpipe convinces him he is being served with music in a castle. Only one thing still troubles him: he has not yet been dubbed a knight.
context: |
  Roads and inns. The venta was the lone roadside inn of the Spanish highways, and Ormsby notes that the one Cervantes had in mind was probably the Venta de Quesada on the Madrid-Seville road. Ventas were notorious: travelers often brought their own food, beds were few or none, and the innkeeper's cheerful admission that there is no bed was only a small exaggeration. The muleteers (arrieros) who stop there were the freight system of the country, and the two girls traveling with them to Seville, the great port of the American trade, are prostitutes. The text's words for them move down a ladder, from mozas to 'del partido', destraídas, 'traídas y llevadas' and finally rameras, while Don Quijote's move up, to doncellas, damas and princesas. Since 'doncella' implies a virgin, their laughter needs no explanation.

  Food and the calendar. Friday was a day of abstinence from meat, so an inn could offer only salt fish, which had to be soaked for hours before cooking. The fish had different regional names, and one of them, truchuela ('little trout'), allows Don Quijote to believe he is getting trout, a luxury. His argument that little trout must be better than big ones, like veal against beef, is his madness working as logic. The same week's diet in Chapter 1 had its own Saturday dish for the same religious reason.

  The rules of knighthood. A knight had to be dubbed by another knight, and a new one carried plain arms with no device until he earned one; Ormsby notes that 'armas blancas' properly meant 'blank', not white. Don Quijote forgot this in Chapter 1 and now solves it the way the books would: whoever he meets first will do it. The chapter is full of the romances' machinery: the dwarf on the battlements with a trumpet, the castle and its castellan, damsels who unarm the hero, and the wise enchanter who writes the hero's history, which Ormsby notes was a common claim in the later romances.

  Ballads. Spanish ballads (romances) were known to everyone. Don Quijote quotes 'Mis arreos son las armas, mi descanso el pelear' from the ballad of Moriana, and the innkeeper completes the next two lines, 'mi cama, las duras peñas, mi dormir, siempre velar'. Ormsby remarks that such familiarity with the old ballads could be found even in a roadside innkeeper. The verses about being served by damsels parody the ballad of Lancelot ('Nunca fuera caballero de damas tan bien servido como fuera Lanzarote'), and Ormsby guesses that its appeal was the word 'rocino' for Lancelot's horse.

  The innkeeper. He is from the beach of Sanlúcar de Barrameda, near Seville, a famous haunt of rogues and petty criminals, and the narrator gives him a thief's résumé: as much a thief as Cacus, the fire-breathing robber of Roman myth, and as full of tricks as a student or a page. He hears 'castellano' (castellan) as 'Castilian', and Ormsby explains that 'sano de Castilla' was thieves' slang for a crook who passes as honest. The man who will dub Don Quijote is a retired criminal, which is the joke the next chapter builds on.

  The narrator's games. The narrator pretends to weigh rival authorities ('Autores hay que dicen ...') and cites the invented 'Anales de la Mancha', as the romances claimed to reconcile ancient chronicles. He keeps undercutting his hero: 'if he had any' brains, the pig named 'without asking pardon', the plain nouns set against Don Quijote's fantasy at the end. The Apollo sunrise Don Quijote composes is a parody of the romances' high style, and the narrator deflates it with one flat fact: he really was crossing the Campo de Montiel, a dusty plain famous only for a fourteenth-century battle.

  Reading Cervantes' Spanish. This chapter has two layers of old Spanish. The first is Don Quijote's deliberate imitation of the romances, which was already quaint in 1605: initial f- for h- (fermosura, fecho, fazañas, fasta, facer, fuyan), the -edes verb endings (habedes, acuitedes, mostredes), ca for 'because', non for 'no', ál for 'anything else', and words like yantar, membrarse, cuita, afincamiento, desaguisado. The girls cannot follow it. The second is the ordinary Spanish of 1605: old spellings (efeto, emendar, mesmo, priesa, apriesa, estraño, destraídas, ñudos, recebir, ansí, coronista, bacallao), the old preterite trujo for trajo, -ll- for -rl- on infinitives (quitalle, dalle), pronouns attached to a verb that opens its clause (Diose, Fuese, Mirábanle, Miróle, Preguntáronle, Pusiéronle, trújole, ruégote, Plégaos), the -ra form used as a conditional or pluperfect (hiciera, fuera, pasara, saliera, horadara) and, in the ballad, as a plain past (Nunca fuera), the future subjunctive (escribiere, fuere), and 'puesto que' meaning 'although'. Ormsby's translation is faithful but Victorian; where the literal gloss and Ormsby disagree, the gloss follows the Spanish.
