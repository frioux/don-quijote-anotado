                    r: "with all those trappings"
                    under:
                      - {s: "que semejantes castillos se pintan", r: "describes 'adherentes': with which such castles are depicted"}
        forms:
          - {w: "nuestro", f: "nuestr- + -o → 'our', masculine singular to match 'aventurero'."}
          - {w: "cuanto", f: "'all that', after 'todo'."}
          - {w: "pensaba, imaginaba", f: "pens- + -aba → pensar (to think); imagin- + -aba → imaginar (to imagine); imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "veía", f: "ve- + -ía → ver (to see), imperfect, he: veía, veías, veía, veíamos, veíais, veían (ver keeps its e in the imperfect)."}
          - {w: "le parecía", f: "parec- + -ía → parecer (to seem), imperfect, it, with 'le' (to him), doubled by 'a nuestro aventurero'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "ser hecho", f: "infinitive ser + participle hecho (of hacer, to make): 'to be made', a passive."}
          - {w: "pasar", f: "infinitive (to happen)."}
          - {w: "al", f: "a + el."}
          - {w: "había leído", f: "había + leído (participle of leer, to read) → pluperfect, he: 'had read'. The pluperfect is había, habías, había, habíamos, habíais, habían + participle."}
          - {w: "vio", f: "ver (to see), preterite, he: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "se le representó", f: "represent- + -ó → representarse (to appear to the mind), preterite, it, with 'se' and 'le' (to him); 'se' always comes before 'le'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "era", f: "ser (to be), imperfect, it. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "luciente", f: "luc- + -iente → from lucir (to shine): 'shining'; an old present participle, now an adjective."}
          - {w: "faltarle", f: "faltar (to be missing) + le (to it), the pronoun hung on the end of the infinitive after 'sin'."}
          - {w: "levadiza", f: "lev- + -adiza → from levar (to raise) + -dizo (that can be ...ed): 'that can be raised', feminine to match 'puente'."}
          - {w: "honda", f: "feminine to match 'cava'."}
          - {w: "todos aquellos", f: "masculine plural to match 'adherentes'."}
          - {w: "se pintan", f: "pint- + -an → pintar (to paint), present, they, with 'se' making it passive: 'are painted, are depicted'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
      - es: "Fuese llegando a la venta, que a él le parecía castillo, y a poco trecho della detuvo las riendas a Rocinante, esperando que algún enano se pusiese entre las almenas a dar señal con alguna trompeta de que llegaba caballero al castillo."
        literal: "He-went-himself approaching to the inn, which to him to-him seemed castle, and at little distance from-it he-held-back the reins to Rocinante, hoping that some dwarf himself would-put among the battlements to give signal with some trumpet of that was-arriving knight to-the castle."
        ormsby: "To this inn, which to him seemed a castle, he advanced, and at a short distance from it he checked Rocinante, hoping that some dwarf would show himself upon the battlements, and by sound of trumpet give notice that a knight was approaching the castle."
        vocab:
          - {w: "irse llegando", d: "to draw near little by little"}
          - {w: "trecho", d: "distance, stretch; 'a poco trecho' = a short way off"}
          - {w: "della", d: "= de ella, 'from it'"}
          - {w: "detener las riendas", d: "to rein in"}
          - {w: "enano", d: "dwarf"}
          - {w: "almena", d: "battlement, merlon"}
          - {w: "dar señal", d: "to give a signal"}
        diagram:
          - s: "Fuese llegando a la venta"
            r: "main verb 1: he drew near the inn"
            under:
