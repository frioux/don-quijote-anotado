                    r: "to do what: to signal with a trumpet"
                    under:
                      - {s: "de que llegaba caballero al castillo", r: "signal of what: that a knight was arriving at the castle"}
        forms:
          - {w: "Fuese", f: "fu- + -e + se → ir (to go), preterite, he, with 'se' stuck on the end: modern 'se fue'. Cervantes hangs pronouns on the end of a conjugated verb that opens its clause. The preterite of ir: fui, fuiste, fue, fuimos, fuisteis, fueron. 'irse' + gerund = to go on doing."}
          - {w: "llegando", f: "lleg- + -ando → gerund of llegar (to arrive, approach)."}
          - {w: "a él le", f: "'a él' repeats 'le' (to him) for emphasis: to HIM it seemed a castle."}
          - {w: "parecía", f: "parec- + -ía → parecer (to seem), imperfect, it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "della", f: "de + ella (from it: the venta)."}
          - {w: "detuvo", f: "detuv- + -o → detener (to hold back), preterite, he. Irregular like tener: detuve, detuviste, detuvo, detuvimos, detuvisteis, detuvieron."}
          - {w: "a Rocinante", f: "the 'a' marks whose reins: 'Rocinante's reins'."}
          - {w: "esperando", f: "esper- + -ando → gerund of esperar (to hope)."}
          - {w: "algún, alguna", f: "alguno clipped to 'algún' before a masculine singular noun (enano); 'alguna' feminine for 'trompeta'."}
          - {w: "se pusiese", f: "pus- + -iese → ponerse (to place oneself, appear), imperfect subjunctive (-se form), he: 'would appear'. pusiese, pusieses, pusiese, pusiésemos, pusieseis, pusiesen (= pusiera). 'esperar que' takes the subjunctive."}
          - {w: "dar", f: "infinitive (to give) after 'a' of purpose."}
          - {w: "llegaba", f: "lleg- + -aba → llegar (to arrive), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. 'caballero' with no article = 'a knight'."}
          - {w: "al", f: "a + el."}
        note: "In the romances a dwarf on the battlements blows a trumpet to announce an arriving knight. Don Quijote waits for the ritual to begin."
      - es: "Pero, como vio que se tardaban y que Rocinante se daba priesa por llegar a la caballeriza, se llegó a la puerta de la venta, y vio a las dos destraídas mozas que allí estaban, que a él le parecieron dos hermosas doncellas o dos graciosas damas que delante de la puerta del castillo se estaban solazando."
