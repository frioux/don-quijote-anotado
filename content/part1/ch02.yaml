                  - {s: "cuando llegue a contar esta mi primera salidad tan de mañana", r: "when 2: when he comes to tell of my first sally so early in the morning"}
                  - {s: "desta manera?:", r: "how: in this way (the quotation follows)"}
        forms:
          - {w: "duda", f: "dud- + -a → dudar (to doubt), present, he (quién, who). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "venideros", f: "venid- + -ero → from venir (to come): 'coming', masculine plural to match 'tiempos', placed before the noun."}
          - {w: "salga", f: "salg- + -a → salir (to come out), present subjunctive, it, built on the irregular 'salgo': salga, salgas, salga, salgamos, salgáis, salgan. 'cuando' about the future takes the subjunctive."}
