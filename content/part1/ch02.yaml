      - es: "«Apenas había el rubicundo Apolo tendido por la faz de la ancha y espaciosa tierra las doradas hebras de sus hermosos cabellos, y apenas los pequeños y pintados pajarillos con sus arpadas lenguas habían saludado con dulce y meliflua armonía la venida de la rosada aurora, que, dejando la blanda cama del celoso marido, por las puertas y balcones del manchego horizonte a los mortales se mostraba, cuando el famoso caballero don Quijote de la Mancha, dejando las ociosas plumas, subió sobre su famoso caballo Rocinante, y comenzó a caminar por el antiguo y conocido campo de Montiel»."
        literal: "«Hardly had the ruddy Apolo spread over the face of the wide and spacious earth the golden threads of his beautiful hairs, and hardly the little and painted little-birds with their harp-like tongues had greeted with sweet and honeyed harmony the coming of the rosy dawn, who, leaving the soft bed of-the jealous husband, through the doors and balconies of-the Manchegan horizon to the mortals herself was-showing, when the famous knight Don Quijote of La Mancha, leaving the idle feathers, climbed onto his famous horse Rocinante, and began to travel through the ancient and known field of Montiel»."
        ormsby: "‘Scarce had the rubicund Apollo spread o’er the face of the broad spacious earth the golden threads of his bright hair, scarce had the little birds of painted plumage attuned their notes to hail with dulcet and mellifluous harmony the coming of the rosy Dawn, that, deserting the soft couch of her jealous spouse, was appearing to mortals at the gates and balconies of the Manchegan horizon, when the renowned knight Don Quixote of La Mancha, quitting the lazy down, mounted his celebrated steed Rocinante and began to traverse the ancient and famous Campo de Montiel;’ ”"
        vocab:
          - {w: "apenas ... cuando", d: "scarcely ... when"}
          - {w: "rubicundo", d: "ruddy, reddish-gold"}
          - {w: "Apolo", d: "Apollo, god of the sun; here simply the sun"}
          - {w: "tender", d: "to spread out, stretch"}
          - {w: "faz", d: "face, surface (literary)"}
          - {w: "espacioso", d: "spacious, broad"}
          - {w: "hebra", d: "thread, strand"}
          - {w: "cabellos", d: "hair (the poetic word, often plural)"}
          - {w: "pajarillo", d: "little bird"}
          - {w: "pintado", d: "painted, many-colored"}
          - {w: "arpado", d: "harp-voiced, sweet-singing (of birds)"}
          - {w: "meliflua", d: "honeyed, mellifluous"}
          - {w: "aurora", d: "dawn; personified as the goddess Aurora"}
          - {w: "celoso marido", d: "jealous husband: Tithonus, Aurora's aged mortal husband in myth"}
          - {w: "manchego", d: "of La Mancha, Manchegan"}
          - {w: "mortales", d: "mortals, human beings"}
          - {w: "ociosas plumas", d: "idle feathers, i.e. his feather bed"}
          - {w: "campo de Montiel", d: "a real plain in La Mancha, scene of a famous battle in 1369 (see Ormsby's note)"}
        diagram:
          - s: "subió sobre su famoso caballo Rocinante"
            r: "main verb 1: mounted his famous horse Rocinante"
            under:
              - {s: "Apenas había el rubicundo Apolo tendido por la faz de la ancha y espaciosa tierra las doradas hebras de sus hermosos cabellos", r: "when 1: scarcely had the ruddy sun spread the golden threads of his hair over the earth"}
              - s: "y apenas los pequeños y pintados pajarillos con sus arpadas lenguas habían saludado con dulce y meliflua armonía la venida de la rosada aurora"
                r: "when 2: and scarcely had the little painted birds greeted the coming of rosy dawn"
                under:
                  - {s: "que, dejando la blanda cama del celoso marido, por las puertas y balcones del manchego horizonte a los mortales se mostraba", r: "describes 'aurora': who, leaving her jealous husband's soft bed, was showing herself to mortals at the doors and balconies of the Manchegan horizon"}
              - {s: "cuando el famoso caballero don Quijote de la Mancha", r: "'cuando' answers 'apenas'; subject: the famous knight"}
              - {s: "dejando las ociosas plumas", r: "how: leaving his idle feather bed"}
          - {s: "y comenzó a caminar por el antiguo y conocido campo de Montiel", r: "main verb 2: and began to ride across the ancient, well-known plain of Montiel"}
        forms:
          - {w: "había tendido", f: "había (haber, imperfect) + tendido (participle of tender, to spread) → pluperfect, he (Apolo): 'had spread'. The pluperfect is había, habías, había, habíamos, habíais, habían + participle. The subject is set between the two parts, a Latin-style order."}
          - {w: "rubicundo", f: "masculine to match 'Apolo'."}
          - {w: "ancha y espaciosa", f: "feminine to match 'tierra', both before the noun, as in poetry."}
          - {w: "doradas", f: "dor- + -adas → participle of dorar (to gild), feminine plural to match 'hebras': 'golden'."}
          - {w: "sus hermosos", f: "plural to match 'cabellos'."}
          - {w: "pajarillos", f: "pájar(o) + -illo (little) + -s → 'little birds', the diminutive."}
          - {w: "pintados", f: "pint- + -ados → participle of pintar (to paint), masculine plural to match 'pajarillos'."}
          - {w: "arpadas", f: "arp- + -adas → from arpa (harp), feminine plural to match 'lenguas'."}
          - {w: "habían saludado", f: "habían + saludado (participle of saludar, to greet) → pluperfect, they: 'had greeted'. Same había, habías, había, habíamos, habíais, habían + participle."}
          - {w: "meliflua", f: "melifl- + -ua → melifluo (honeyed), feminine to match 'armonía'."}
          - {w: "rosada", f: "ros- + -ada → from rosa (rose), feminine to match 'aurora'."}
          - {w: "dejando", f: "dej- + -ando → gerund of dejar (to leave). It appears twice: once for the dawn, once for Don Quijote."}
          - {w: "blanda, celoso", f: "feminine to match 'cama'; masculine to match 'marido'."}
          - {w: "del", f: "de + el."}
          - {w: "manchego", f: "masculine to match 'horizonte', placed before it."}
          - {w: "se mostraba", f: "mostr- + -aba → mostrarse (to show oneself), imperfect, she (the dawn), with 'se' (herself). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. The verb comes last, Latin-style."}
          - {w: "ociosas", f: "feminine plural to match 'plumas'."}
          - {w: "subió", f: "sub- + -ió → subir (to climb up), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "comenzó", f: "comenz- + -ó → comenzar (to begin), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (the I form is 'comencé': z becomes c before e). 'comenzar a' + infinitive = to begin to."}
          - {w: "caminar", f: "infinitive (to travel) after 'a'."}
          - {w: "antiguo y conocido", f: "masculine to match 'campo'; conocido is the participle of conocer (to know): 'well-known'."}
        note: "A parody of the dawn openings of the romances and pastoral poems: the sun as Apollo with golden hair, Aurora leaving her old husband's bed, and nearly every noun with an adjective in front of it. The bathos is that all this frames a man getting on a skinny horse."
  - sentences:
      - es: "Y era la verdad que por él caminaba. Y añadió diciendo:"
        literal: "And it-was the truth that through it he-was-traveling. And he-added saying:"
        ormsby: "which in fact he was actually traversing."
        ormsby_match: false
        vocab:
          - {w: "era la verdad que", d: "it was true that, he really was"}
          - {w: "añadir", d: "to add"}
        diagram:
          - s: "Y era la verdad"
            r: "main verb 1: and it was true"
            under:
              - {s: "que por él caminaba", r: "what was true: that he was riding across it (él = the campo de Montiel)"}
          - {s: "Y añadió diciendo:", r: "main verb 2: and he added, saying"}
        forms:
          - {w: "era", f: "ser (to be), imperfect, it. ser's imperfect is irregular: era, eras, era, éramos, erais, eran."}
          - {w: "él", f: "'it', standing for the campo (a masculine noun), after a preposition."}
          - {w: "caminaba", f: "camin- + -aba → caminar (to travel), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "añadió", f: "añad- + -ió → añadir (to add), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "diciendo", f: "dic- + -iendo → gerund of decir (to say); the stem e becomes i."}
        ormsby_note: "The Campo de Montiel was 'famous' as being the scene of the battle, in 1369, in which Pedro the Cruel was defeated by his brother Henry of Trastamara supported by Du Gueselin. The actual battlefield, however, lies some considerable distance to the south of Argamasilla, on the slope of the Sierra Morena, near the castle of Montiel in which Pedro took refuge."
        note: "The narrator deflates the fantasy by confirming its one literal fact: he really was crossing the Campo de Montiel, an ordinary dusty plain. Ormsby's 'he continued' for 'añadió diciendo' comes inside the next quotation."
  - sentences:
      - es: "— Dichosa edad, y siglo dichoso aquel adonde saldrán a luz las famosas hazañas mías, dignas de entallarse en bronces, esculpirse en mármoles y pintarse en tablas para memoria en lo futuro."
        literal: "— Happy age, and century happy that where will-come-out to light the famous feats mine, worthy of carving-themselves in bronzes, sculpting-themselves in marbles and painting-themselves on panels for memory in the future."
        ormsby: "“Happy the age, happy the time,” he continued, “in which shall be made known my deeds of fame, worthy to be moulded in brass, carved in marble, limned in pictures, for a memorial forever."
        vocab:
          - {w: "dichoso", d: "happy, fortunate"}
          - {w: "siglo", d: "age, era; also 'century'"}
          - {w: "adonde", d: "where; here 'in which'"}
          - {w: "salir a luz", d: "to come to light, be published"}
          - {w: "hazaña", d: "feat, exploit"}
          - {w: "digno de", d: "worthy of"}
          - {w: "entallar", d: "to carve, engrave"}
          - {w: "esculpir", d: "to sculpt"}
          - {w: "tabla", d: "wooden panel for painting"}
          - {w: "para memoria en lo futuro", d: "as a memorial for times to come"}
        diagram:
          - s: "Dichosa edad, y siglo dichoso aquel"
            r: "the exclamation, with no verb: happy the age, and happy that century"
            under:
              - s: "adonde saldrán a luz las famosas hazañas mías"
                r: "describes 'siglo': in which my famous feats will come to light"
                under:
                  - s: "dignas de entallarse en bronces, esculpirse en mármoles y pintarse en tablas"
                    r: "describes 'hazañas': worthy to be cast in bronze, carved in marble, painted on panels"
                    under:
                      - {s: "para memoria en lo futuro", r: "what for: as a memorial for the future"}
        forms:
          - {w: "Dichosa, dichoso", f: "dich- + -osa / -oso → dichoso (happy), feminine for 'edad', masculine for 'siglo'. The second is put after its noun, a mirrored pattern for rhetorical effect."}
          - {w: "aquel", f: "'that', masculine to match 'siglo'."}
          - {w: "saldrán", f: "saldr- + -án → salir (to come out), future, they. Irregular stem saldr-: saldré, saldrás, saldrá, saldremos, saldréis, saldrán."}
          - {w: "famosas", f: "feminine plural to match 'hazañas'."}
          - {w: "hazañas mías", f: "mí- + -as → 'my', the stressed possessive placed after the noun, feminine plural to match 'hazañas': mío, mía, míos, mías. More emphatic and more formal than 'mis hazañas'."}
          - {w: "dignas", f: "feminine plural to match 'hazañas'."}
          - {w: "entallarse, esculpirse, pintarse", f: "infinitives with 'se' hung on the end, which makes them passive: 'to be carved, sculpted, painted'. A pronoun attaches to the end of an infinitive."}
          - {w: "lo futuro", f: "neuter 'lo' + adjective = 'what is future, the future'."}
      - es: "¡Oh tú, sabio encantador, quienquiera que seas, a quien ha de tocar el ser coronista desta peregrina historia, ruégote que no te olvides de mi buen Rocinante, compañero eterno mío en todos mis caminos y carreras!"
