        note: "Don Quijote speaks the fake-old Spanish of the romances: fuyan, ca, non, facer. The girls cannot follow it, which is half of why they laugh."
  - sentences:
      - es: "Mirábanle las mozas, y andaban con los ojos buscándole el rostro, que la mala visera le encubría; mas, como se oyeron llamar doncellas, cosa tan fuera de su profesión, no pudieron tener la risa, y fue de manera que don Quijote vino a correrse y a decirles:"
        literal: "Were-looking-at-him the girls, and they-went with the eyes seeking-to-him the face, which the bad visor to-him covered; but, as themselves they-heard to-call maidens, thing so outside of their profession, not they-could hold the laughter, and it-was of manner that Don Quijote came to be-mortified-himself and to say-to-them:"
        ormsby: "The girls were looking at him and straining their eyes to make out the features which the clumsy visor obscured, but when they heard themselves called maidens, a thing so much out of their line, they could not restrain their laughter, which made Don Quixote wax indignant, and say,"
