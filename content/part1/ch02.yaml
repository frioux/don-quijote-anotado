          - {w: "no ponga", f: "pong- + -a → poner (to put, set down), present subjunctive, he, built on the irregular 'pongo': ponga, pongas, ponga, pongamos, pongáis, pongan. After a verb of doubting the old language adds a 'no' that means nothing: 'who doubts he will set it down'."}
