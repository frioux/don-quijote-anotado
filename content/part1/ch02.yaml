        ormsby: "when, looking all around to see if he could discover any castle or shepherd’s shanty where he might refresh himself and relieve his sore wants, he perceived not far out of his road an inn, which was as welcome as a star guiding him to the portals, if not the palaces, of his redemption;"
        vocab:
          - {w: "por ver", d: "to see, in order to see"}
          - {w: "descubrir", d: "to spot, catch sight of"}
          - {w: "majada", d: "sheepfold, shepherds' shelter"}
          - {w: "recogerse", d: "to take shelter, retire for the night"}
          - {w: "remediar", d: "to remedy, relieve"}
          - {w: "venta", d: "roadside inn, standing alone on the highway (see Ormsby's note)"}
          - {w: "portal", d: "porch, entrance hall; also the stable of Bethlehem in Nativity scenes"}
          - {w: "alcázar", d: "fortress-palace (from Arabic)"}
          - {w: "redención", d: "redemption, rescue"}
          - {w: "encaminar", d: "to guide, direct"}
        diagram:
          - s: "vio"
            r: "main verb (still part of what the narrator found, after 'y que'): he saw"
            under:
              - s: "mirando a todas partes por ver"
                r: "how: looking all around to see"
                under:
                  - s: "si descubriría algún castillo o alguna majada de pastores"
                    r: "what he hoped: whether he would spot a castle or a shepherds' fold"
                    under:
                      - {s: "donde recogerse", r: "where to take shelter"}
                      - {s: "y adonde pudiese remediar su mucha hambre y necesidad", r: "and where he might relieve his great hunger and need"}
              - s: "no lejos del camino"
                r: "where: not far from the road"
                under:
                  - {s: "por donde iba", r: "describes 'camino': along which he was going"}
              - s: "una venta"
                r: "object: an inn"
                under:
                  - s: "que fue como si viera una estrella"
                    r: "describes 'venta': which was as if he saw a star"
                    under:
                      - {s: "que, no a los portales, sino a los alcázares de su redención le encaminaba", r: "describes 'estrella': that was guiding him not to the porch but to the very palace of his redemption"}
        forms:
          - {w: "mirando", f: "mir- + -ando → gerund of mirar (to look)."}
          - {w: "ver", f: "infinitive (to see) after 'por' (= in order to)."}
          - {w: "descubriría", f: "descubrir + -ía → descubrir (to spot), conditional, he: 'would spot'. The conditional is the infinitive + -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "algún, alguna", f: "alguno clipped to 'algún' before a masculine singular noun (castillo); 'alguna' feminine for 'majada'."}
          - {w: "recogerse", f: "recoger (to gather) + se, the infinitive with 'se' hung on the end: 'to take shelter'."}
          - {w: "pudiese", f: "pud- + -iese → poder (can), imperfect subjunctive (-se form), he: 'he might'. pudiese, pudieses, pudiese, pudiésemos, pudieseis, pudiesen (= pudiera). Subjunctive because the place was only hoped for."}
          - {w: "mucha", f: "feminine to match 'hambre', which is feminine though it takes 'el' (el hambre)."}
          - {w: "vio", f: "ver (to see), preterite, he. Irregular: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "del", f: "de + el."}
          - {w: "iba", f: "ir (to go), imperfect, he. Irregular: iba, ibas, iba, íbamos, ibais, iban."}
          - {w: "fue", f: "ser (to be), preterite, it: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "viera", f: "vi- + -era → ver (to see), imperfect subjunctive (-ra form), he: 'as if he saw'. viera, vieras, viera, viéramos, vierais, vieran. 'como si' always takes the imperfect subjunctive."}
          - {w: "le encaminaba", f: "encamin- + -aba → encaminar (to guide), imperfect, it (the star), with 'le' (him). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
        ormsby_note: "In Spain there are at least half a dozen varieties of inns each with its distinctive name. In Don Quixote the inn is almost always the venta, the solitary roadside inn where travellers of all sorts stop to bait; and it has remained to this day much what Cervantes has described. The particular venta that he had in his eye in this and the next chapter is said to be the Venta de Quesada, about 2½ leagues north of Manzanares, on the Madrid and Seville road. The house itself was burned down about a century ago, and has been rebuilt, but the yard at the back with its draw-well and stone trough are said to remain as they were in his day."
        note: "The star and the 'portal' borrow the language of the Nativity (the star of the Magi, the stable of Bethlehem), mock-solemn praise for a roadside inn."
      - es: "Diose priesa a caminar, y llegó a ella a tiempo que anochecía."
