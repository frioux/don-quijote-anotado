          - {w: "máquina", d: "here: great mass, huge pile (not 'machine')"}
          - {w: "pertrechos", d: "military gear, equipment"}
          - {w: "determinar de", d: "to decide to; the 'de' before the infinitive is old usage"}
          - {w: "comedidamente", d: "courteously, civilly"}
