      - es: "y pasara muy adelante si a aquel punto no saliera el ventero, hombre que, por ser muy gordo, era muy pacífico, el cual, viendo aquella figura contrahecha, armada de armas tan desiguales como eran la brida, lanza, adarga y coselete, no estuvo en nada en acompañar a las doncellas en las muestras de su contento."
        literal: "and it-would-have-passed very forward if at that point not had-come-out the innkeeper, man who, for being very fat, was very peaceable, the which, seeing that figure misshapen, armed with arms so unequal as were the bridle, lance, buckler and corselet, not he-was in nothing in accompanying [personal-a] the maidens in the shows of their contentment."
        ormsby: "and matters might have gone farther if at that moment the landlord had not come out, who, being a very fat man, was a very peaceful one. He, seeing this grotesque figure clad in armour that did not match any more than his saddle, bridle, lance, buckler, or corselet, was not at all indisposed to join the damsels in their manifestations of amusement;"
