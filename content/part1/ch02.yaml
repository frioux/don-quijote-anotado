        forms:
          - {w: "fuyan", f: "fuy- + -an → fuir (= huir, to flee), present subjunctive, they (your worships), used as a polite command. huya, huyas, huya, huyamos, huyáis, huyan, with the old f- for h-."}
          - {w: "las vuestras mercedes", f: "'your worships': vuestra merced takes the he/she and they forms of the verb. The article before the possessive is archaic."}
          - {w: "teman", f: "tem- + -an → temer (to fear), present subjunctive, they, as a polite command. -er verbs swap to -a endings in the subjunctive: tema, temas, tema, temamos, temáis, teman."}
