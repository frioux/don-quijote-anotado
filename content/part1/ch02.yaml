        forms:
          - {w: "Diose", f: "di- + -o + se → dar (to give), preterite, he, with 'se' (himself) stuck on the end: modern 'se dio'. Cervantes hangs pronouns on the end of a conjugated verb that opens its clause. Irregular preterite: di, diste, dio, dimos, disteis, dieron."}
          - {w: "priesa", f: "old form of prisa (haste)."}
          - {w: "caminar", f: "infinitive (to travel) after 'a'."}
          - {w: "llegó", f: "lleg- + -ó → llegar (to arrive), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (the I form is 'llegué', gu keeping the hard g)."}
          - {w: "ella", f: "'it', standing for 'la venta' (feminine), after a preposition."}
          - {w: "anochecía", f: "anochec- + -ía → anochecer (to grow dark), imperfect, impersonal 'it'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
  - sentences:
      - es: "Estaban acaso a la puerta dos mujeres mozas, destas que llaman del partido, las cuales iban a Sevilla con unos arrieros que en la venta aquella noche acertaron a hacer jornada;"
        literal: "There-were by-chance at the door two women young, of-these whom they-call of-the party, the which were-going to Sevilla with some muleteers who in the inn that night happened to make day's-stop;"
        ormsby: "At the door were standing two young women, girls of the district as they call them, on their way to Seville with some carriers who had chanced to halt that night at the inn;"
        vocab:
          - {w: "acaso", d: "by chance (today 'perhaps')"}
          - {w: "moza", d: "girl, young woman; also serving girl"}
          - {w: "del partido", d: "'of the party': the euphemism for prostitutes, 'mujeres del partido'"}
          - {w: "arriero", d: "muleteer, carrier who drives pack mules"}
          - {w: "acertar a", d: "to happen to"}
          - {w: "hacer jornada", d: "to stop for the night at the end of a day's travel"}
        diagram:
          - s: "Estaban acaso a la puerta"
            r: "main verb: were by chance at the door"
            under:
              - s: "dos mujeres mozas"
                r: "subject: two young women"
                under:
                  - {s: "destas que llaman del partido", r: "describes them: of the kind people call 'of the party', i.e. prostitutes"}
                  - s: "las cuales iban a Sevilla con unos arrieros"
                    r: "describes them: who were going to Seville with some muleteers"
                    under:
                      - {s: "que en la venta aquella noche acertaron a hacer jornada", r: "describes 'arrieros': who happened to stop at the inn that night"}
        forms:
          - {w: "Estaban", f: "est- + -aban → estar (to be), imperfect, they; the subject comes after. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "destas", f: "de + estas: 'of these [women]'. Cervantes fuses 'de' with este, esta, él, ella: deste, desta, dél, della."}
          - {w: "llaman", f: "llam- + -an → llamar (to call), present, they (people in general). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "del", f: "de + el."}
          - {w: "las cuales", f: "'who', the heavy relative used after a gap, feminine plural: el cual, la cual, los cuales, las cuales."}
          - {w: "iban", f: "ir (to go), imperfect, they. Irregular: iba, ibas, iba, íbamos, ibais, iban."}
          - {w: "aquella", f: "'that', feminine to match 'noche'."}
          - {w: "acertaron", f: "acert- + -aron → acertar (to happen to), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "hacer", f: "infinitive (to make) after 'acertaron a'."}
        note: "Ormsby's 'girls of the district' keeps the veil over 'mujeres del partido', which meant prostitutes. The narrator calls them mozas and, later, rameras; Don Quijote will see ladies."
      - es: "y, como a nuestro aventurero todo cuanto pensaba, veía o imaginaba le parecía ser hecho y pasar al modo de lo que había leído, luego que vio la venta, se le representó que era un castillo con sus cuatro torres y chapiteles de luciente plata, sin faltarle su puente levadiza y honda cava, con todos aquellos adherentes que semejantes castillos se pintan."
        literal: "and, as to our adventurer all as-much-as he-thought, saw or imagined to-him seemed to-be made and to-happen in-the manner of that which he-had read, as-soon as he-saw the inn, itself to-him represented that it-was a castle with its four towers and spires of shining silver, without lacking-to-it its bridge drawing and deep moat, with all those appurtenances [with] which similar castles themselves paint."
        ormsby: "and as, happen what might to our adventurer, everything he saw or imaged seemed to him to be and to happen after the fashion of what he read of, the moment he saw the inn he pictured it to himself as a castle with its four turrets and pinnacles of shining silver, not forgetting the drawbridge and moat and all the belongings usually ascribed to castles of the sort."
        vocab:
          - {w: "todo cuanto", d: "everything that"}
          - {w: "al modo de", d: "in the manner of"}
          - {w: "luego que", d: "as soon as"}
          - {w: "representársele a uno", d: "to appear in someone's mind, seem to someone"}
          - {w: "torre", d: "tower"}
          - {w: "chapitel", d: "spire, pinnacle"}
          - {w: "luciente", d: "shining, gleaming"}
          - {w: "faltar", d: "to be missing, be lacking"}
          - {w: "puente levadiza", d: "drawbridge; 'puente' was often feminine then (modern 'el puente levadizo')"}
          - {w: "cava", d: "moat"}
          - {w: "adherentes", d: "appurtenances, trappings, accessories"}
          - {w: "semejante", d: "such, similar"}
          - {w: "pintarse", d: "to be depicted, described"}
        diagram:
          - s: "se le representó"
            r: "main verb: it appeared to him"
            under:
              - {s: "como a nuestro aventurero todo cuanto pensaba, veía o imaginaba le parecía ser hecho y pasar al modo de lo que había leído", r: "why: since everything he thought, saw or imagined seemed to him to be made and to happen the way things did in his reading"}
              - {s: "luego que vio la venta", r: "when: as soon as he saw the inn"}
              - s: "que era un castillo con sus cuatro torres y chapiteles de luciente plata"
                r: "what appeared to him: that it was a castle with four towers and spires of shining silver"
