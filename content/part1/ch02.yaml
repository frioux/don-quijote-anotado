part: 1
chapter: 2
title_es: "Capítulo II. Que trata de la primera salida que de su tierra hizo el ingenioso don Quijote"
title_en: "Which treats of the first sally the ingenious Don Quixote made from home"
paragraphs:
  - sentences:
      - es: "Hechas, pues, estas prevenciones, no quiso aguardar más tiempo a poner en efeto su pensamiento, apretándole a ello la falta que él pensaba que hacía en el mundo su tardanza, según eran los agravios que pensaba deshacer, tuertos que enderezar, sinrazones que emendar, y abusos que mejorar y deudas que satisfacer."
        literal: "Done, then, these preparations, not he-wanted to-wait more time to put into effect his thought, pressing-him to it the lack that he thought that made in the world his delay, according-as were the grievances that he-thought to-undo, wrongs that to-straighten, unreasons that to-amend, and abuses that to-improve and debts that to-satisfy."
        ormsby: "These preliminaries settled, he did not care to put off any longer the execution of his design, urged on to it by the thought of all the world was losing by his delay, seeing what wrongs he intended to right, grievances to redress, injustices to repair, abuses to remove, and duties to discharge."
        vocab:
          - {w: "prevención", d: "preparation, precaution; not 'prevention' here"}
          - {w: "aguardar", d: "to wait"}
          - {w: "poner en efeto", d: "to put into effect, carry out; 'efeto' is the old spelling of 'efecto'"}
          - {w: "pensamiento", d: "thought; here 'plan, design'"}
          - {w: "apretar", d: "to press, urge"}
          - {w: "hacer falta", d: "to be missed, be needed; 'la falta que hacía su tardanza' = the loss his delay was causing"}
          - {w: "tardanza", d: "delay"}
          - {w: "según", d: "here 'seeing how many, given how great'"}
          - {w: "agravio", d: "wrong, grievance, injury"}
          - {w: "deshacer agravios", d: "to undo wrongs, the knight-errant's stock mission"}
          - {w: "tuerto", d: "wrong, injury (old noun, literally 'something twisted'); 'enderezar tuertos' = to right wrongs"}
          - {w: "enderezar", d: "to straighten, set right"}
          - {w: "sinrazón", d: "injustice, wrong"}
          - {w: "emendar", d: "= enmendar, to amend, correct; old spelling"}
          - {w: "satisfacer deudas", d: "to pay debts; here 'to discharge obligations'"}
        diagram:
          - s: "no quiso aguardar más tiempo"
            r: "main verb: he did not want to wait any longer; the subject 'he' is in the ending"
            under:
              - {s: "Hechas, pues, estas prevenciones", r: "when: these preparations being done (absolute participle)"}
              - {s: "a poner en efeto su pensamiento", r: "to do what: to put his plan into effect"}
              - s: "apretándole a ello la falta"
                r: "why: the lack pressing him to it"
                under:
                  - {s: "que él pensaba que hacía en el mundo su tardanza", r: "describes 'falta': that he thought his delay was causing in the world"}
                  - s: "según eran los agravios que pensaba deshacer"
                    r: "why he thought so: seeing how many wrongs he meant to undo"
                    under:
                      - {s: "tuertos que enderezar, sinrazones que emendar, y abusos que mejorar y deudas que satisfacer", r: "the rest of the list: wrongs to right, injustices to amend, abuses to fix, debts to pay"}
        forms:
          - {w: "Hechas", f: "hech- + -as → hecho, the irregular participle of hacer (to do, make), feminine plural to match 'prevenciones'. A participle with its noun at the head of a sentence ('these preparations made') is the absolute construction, like the Latin ablative absolute."}
          - {w: "estas", f: "est- + -as → 'these', feminine plural to match 'prevenciones': este, esta, estos, estas."}
          - {w: "quiso", f: "quis- + -o → querer (to want), preterite, he: 'no quiso' = he would not, refused. Irregular preterite: quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "aguardar, poner", f: "infinitives: aguardar (to wait) after 'quiso'; poner (to put) after 'a'."}
          - {w: "efeto", f: "old spelling of efecto (effect)."}
          - {w: "apretándole", f: "apret- + -ando + le → gerund of apretar (to press) with 'le' (him) stuck on the end and an accent added to keep the stress: 'pressing him'. Pronouns attach to the end of gerunds and infinitives."}
          - {w: "pensaba", f: "pens- + -aba → pensar (to think; 'pensar' + infinitive = to intend), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. It appears twice in this sentence."}
          - {w: "hacía", f: "hac- + -ía → hacer (to make; 'hacer falta' = to be missed), imperfect, it (his delay). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "eran", f: "ser (to be), imperfect, they (the wrongs). ser's imperfect is irregular: era, eras, era, éramos, erais, eran."}
          - {w: "que deshacer, que enderezar, que emendar, que mejorar, que satisfacer", f: "noun + 'que' + infinitive = something 'to be done': 'wrongs to undo, to straighten, to amend, to improve, to pay'. deshacer = des- (un-) + hacer."}
          - {w: "emendar", f: "old spelling of enmendar (to amend)."}
        note: "'Deshacer agravios y enderezar tuertos' was the stock motto of knight-errantry; Cervantes piles up five such pairs so the list jingles like a romance."
      - es: "Y así, sin dar parte a persona alguna de su intención, y sin que nadie le viese, una mañana, antes del día, que era uno de los calurosos del mes de julio, se armó de todas sus armas, subió sobre Rocinante, puesta su mal compuesta celada, embrazó su adarga, tomó su lanza, y, por la puerta falsa de un corral, salió al campo con grandísimo contento y alborozo de ver con cuánta facilidad había dado principio a su buen deseo."
        literal: "And thus, without giving part to person any of his intention, and without that nobody him should-see, one morning, before of-the day, which was one of the hot-ones of-the month of July, himself he-armed with all his arms, he-climbed onto Rocinante, put-on his badly assembled helmet, he-braced his buckler, he-took his lance, and, by the door false of a yard, he-went-out to-the field with very-great contentment and glee of seeing with how-much ease he-had given beginning to his good desire."
        ormsby: "So, without giving notice of his intention to anyone, and without anybody seeing him, one morning before the dawning of the day (which was one of the hottest of the month of July) he donned his suit of armour, mounted Rocinante with his patched-up helmet on, braced his buckler, took his lance, and by the back door of the yard sallied forth upon the plain in the highest contentment and satisfaction at seeing with what ease he had made a beginning with his grand purpose."
        vocab:
          - {w: "dar parte a alguien de algo", d: "to inform someone of something"}
          - {w: "persona alguna", d: "anyone at all; 'alguno' after the noun in a negative sentence means 'any at all'"}
          - {w: "antes del día", d: "before daybreak"}
          - {w: "caluroso", d: "hot"}
          - {w: "armarse de", d: "to arm oneself with, put on one's armor"}
          - {w: "celada", d: "helmet (a sallet); his is the patched pasteboard one from Chapter 1"}
          - {w: "mal compuesto", d: "badly put together, patched up"}
          - {w: "embrazar", d: "to put one's arm through the straps of a shield"}
          - {w: "adarga", d: "oval leather shield of Moorish origin"}
          - {w: "puerta falsa", d: "back door, side door (literally 'false door')"}
          - {w: "corral", d: "yard, farmyard"}
          - {w: "salir al campo", d: "to go out into the open country; also 'to take the field' as a knight"}
          - {w: "contento", d: "contentment, delight (a noun here)"}
          - {w: "alborozo", d: "glee, jubilation"}
          - {w: "dar principio a", d: "to begin, make a start on"}
        diagram:
          - s: "se armó de todas sus armas"
            r: "main verb 1: he armed himself with all his arms"
            under:
              - {s: "Y así", r: "link: and so"}
              - {s: "sin dar parte a persona alguna de su intención", r: "how 1: without telling anyone his plan"}
              - {s: "y sin que nadie le viese", r: "how 2: and without anyone seeing him"}
              - s: "una mañana, antes del día"
                r: "when: one morning before daybreak"
                under:
                  - {s: "que era uno de los calurosos del mes de julio", r: "describes 'día': which was one of the hot days of July"}
          - s: "subió sobre Rocinante"
            r: "main verb 2: he mounted Rocinante"
            under:
              - {s: "puesta su mal compuesta celada", r: "how: with his patched helmet on (absolute participle)"}
          - {s: "embrazó su adarga", r: "main verb 3: he took up his shield"}
          - {s: "tomó su lanza", r: "main verb 4: he took his lance"}
          - s: "salió al campo"
            r: "main verb 5 (after 'y'): he went out into the open country"
            under:
              - {s: "por la puerta falsa de un corral", r: "which way: by the back gate of a yard"}
              - s: "con grandísimo contento y alborozo"
                r: "how: in the greatest delight and glee"
                under:
                  - {s: "de ver con cuánta facilidad había dado principio a su buen deseo", r: "why delighted: at seeing how easily he had made a start on his great wish"}
        forms:
          - {w: "dar", f: "infinitive (to give) after 'sin': 'without giving'."}
          - {w: "alguna", f: "algun- + -a → alguno (some), feminine to match 'persona'. After the noun in a negative sentence it means 'any at all'."}
          - {w: "le viese", f: "vi- + -ese → ver (to see), imperfect subjunctive (-se form), he (nadie, 'anyone'): 'should see him'. viese, vieses, viese, viésemos, vieseis, viesen; it means the same as the -ra form (viera). 'sin que' always takes the subjunctive. 'le' = him: using 'le' rather than 'lo' for a male person as direct object is leísmo, normal in Cervantes."}
          - {w: "del", f: "de + el, the one contraction modern Spanish keeps."}
          - {w: "era", f: "ser (to be), imperfect, it (the day). ser's imperfect is irregular: era, eras, era, éramos, erais, eran."}
          - {w: "calurosos", f: "calor (heat) + -oso (full of) + -s → 'hot', masculine plural standing for 'días'."}
          - {w: "se armó", f: "arm- + -ó → armarse de (to arm oneself with), preterite, he, with 'se' (himself) before the verb. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "todas sus", f: "feminine plural to match 'armas'; 'sus' agrees with the things owned, not with the owner."}
          - {w: "subió", f: "sub- + -ió → subir (to climb up), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "puesta", f: "irregular participle of poner (to put), feminine to match 'celada': 'his helmet [being] on'. Participle + noun = the absolute construction."}
          - {w: "mal compuesta", f: "mal (badly) + compuesta, irregular participle of componer (to put together), feminine to match 'celada'."}
          - {w: "embrazó, tomó", f: "embraz- + -ó → embrazar (to put one's arm through a shield's straps); tom- + -ó → tomar (to take); preterite, he. Same -ó preterite of -ar verbs."}
          - {w: "salió", f: "sal- + -ió → salir (to go out), preterite, he. Same -ió preterite of -er and -ir verbs."}
          - {w: "al", f: "a + el."}
          - {w: "grandísimo", f: "grand- + -ísimo → grande (great) + -ísimo (very): 'the very greatest'."}
          - {w: "ver", f: "infinitive (to see) after 'de': 'at seeing'."}
          - {w: "cuánta", f: "cuánt- + -a → 'how much', feminine to match 'facilidad'; it carries an accent because it introduces an indirect exclamation."}
          - {w: "había dado", f: "había (haber, imperfect) + dado (participle of dar, to give) → pluperfect, he: 'had given'. The pluperfect is había, habías, había, habíamos, habíais, habían + participle."}
          - {w: "buen", f: "bueno clipped before a masculine singular noun, like un, algún, ningún, gran."}
      - es: "Mas, apenas se vio en el campo, cuando le asaltó un pensamiento terrible, y tal, que por poco le hiciera dejar la comenzada empresa;"
        literal: "But, hardly himself he-saw in the field, when him assaulted a thought terrible, and such, that by little him it-would-have-made to-abandon the begun enterprise;"
        ormsby: "But scarcely did he find himself upon the open plain, when a terrible thought struck him, one all but enough to make him abandon the enterprise at the very outset."
        vocab:
          - {w: "mas", d: "but (literary; without the accent, unlike 'más' = more)"}
          - {w: "apenas ... cuando", d: "hardly ... when, no sooner ... than"}
          - {w: "asaltar", d: "to assail, strike"}
          - {w: "por poco", d: "almost, all but"}
          - {w: "comenzado", d: "begun, already started"}
          - {w: "empresa", d: "enterprise, undertaking"}
        diagram:
          - s: "le asaltó un pensamiento terrible"
            r: "main verb: a terrible thought struck him"
            under:
              - {s: "Mas", r: "link: but"}
              - {s: "apenas se vio en el campo, cuando", r: "when: hardly was he out in the country when"}
              - s: "y tal"
                r: "describes 'pensamiento': and such a one"
                under:
                  - {s: "que por poco le hiciera dejar la comenzada empresa", r: "result: that it very nearly made him give up the enterprise he had begun"}
        forms:
          - {w: "se vio", f: "v- + -io → ver (to see), preterite, he, with 'se' (himself): 'found himself'. Irregular preterite: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "le asaltó", f: "asalt- + -ó → asaltar (to assail), preterite, it (the thought); 'le' = him. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "hiciera", f: "hic- + -iera → hacer (to make), imperfect subjunctive (-ra form), it: here 'would have made'. Built on the preterite hicieron: hiciera, hicieras, hiciera, hiciéramos, hicierais, hicieran. Cervantes uses the -ra form where modern Spanish says 'habría hecho'."}
          - {w: "dejar", f: "infinitive (to leave, give up) after 'hiciera': 'hacer' + infinitive = to make someone do something."}
          - {w: "comenzada", f: "comenz- + -ada → participle of comenzar (to begin), feminine to match 'empresa', placed before the noun."}
      - es: "y fue que le vino a la memoria que no era armado caballero, y que, conforme a ley de caballería, ni podía ni debía tomar armas con ningún caballero;"
        literal: "and it-was that to-him came to the memory that not he-was armed knight, and that, according to law of chivalry, neither he-could nor he-ought to-take arms with any knight;"
        ormsby: "It occurred to him that he had not been dubbed a knight, and that according to the law of chivalry he neither could nor ought to bear arms against any knight;"
        vocab:
          - {w: "venir a la memoria", d: "to come to mind, occur to"}
          - {w: "armar caballero", d: "to dub a knight; 'ser armado caballero' = to be dubbed"}
          - {w: "conforme a", d: "in accordance with"}
          - {w: "ley de caballería", d: "the code of chivalry"}
          - {w: "tomar armas con", d: "to take up arms against, fight"}
        diagram:
          - s: "y fue"
            r: "main verb: and it was (the terrible thought was)"
            under:
              - s: "que le vino a la memoria"
                r: "what it was: that it came to his mind"
                under:
                  - {s: "que no era armado caballero", r: "what came to mind 1: that he was not a dubbed knight"}
                  - {s: "y que, conforme a ley de caballería, ni podía ni debía tomar armas con ningún caballero", r: "what came to mind 2: that by the law of chivalry he neither could nor should fight any knight"}
        forms:
          - {w: "fue", f: "ser (to be), preterite, it. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron (the same forms as ir, to go)."}
          - {w: "le vino", f: "vin- + -o → venir (to come), preterite, it, with 'le' (to him). Irregular preterite: vine, viniste, vino, vinimos, vinisteis, vinieron."}
          - {w: "era armado", f: "era (ser, imperfect: era, eras, era, éramos, erais, eran) + armado (participle of armar, to arm; 'armar caballero' = to dub), masculine: 'he was [not] dubbed'."}
          - {w: "podía", f: "pod- + -ía → poder (can), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "debía", f: "deb- + -ía → deber (ought, must), imperfect, he. Same -ía imperfect."}
          - {w: "ni ... ni", f: "'neither ... nor'."}
          - {w: "tomar", f: "infinitive (to take) after 'podía' and 'debía'."}
          - {w: "ningún", f: "ninguno (no, any) clipped before a masculine singular noun, like un, algún, buen."}
      - es: "y, puesto que lo fuera, había de llevar armas blancas, como novel caballero, sin empresa en el escudo, hasta que por su esfuerzo la ganase."
        literal: "and, granted that it he-were, he-had to wear arms white, as new knight, without device on the shield, until that by his effort it he-should-win."
        ormsby: "and that even if he had been, still he ought, as a novice knight, to wear white armour, without a device upon the shield until by his prowess he had earned one."
        vocab:
          - {w: "puesto que", d: "here 'even if, granted that'; in Cervantes it is concessive, not 'since' as today"}
          - {w: "haber de", d: "to have to, be bound to"}
          - {w: "armas blancas", d: "plain white armor of a novice knight; today 'arma blanca' means a blade"}
          - {w: "novel", d: "new, novice"}
          - {w: "empresa", d: "here: device, emblem painted on a shield (the same word as 'enterprise')"}
          - {w: "escudo", d: "shield"}
          - {w: "esfuerzo", d: "valor, prowess (today 'effort')"}
        diagram:
          - s: "había de llevar armas blancas"
            r: "main verb (a further thing that came to mind, after 'y'): he would have to wear white armor"
            under:
              - {s: "puesto que lo fuera", r: "concession: even if he were [dubbed]"}
              - {s: "como novel caballero", r: "as what: as a new knight"}
              - {s: "sin empresa en el escudo", r: "how: with no device on his shield"}
              - {s: "hasta que por su esfuerzo la ganase", r: "until when: until he won one by his valor"}
        forms:
          - {w: "lo fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), he: 'were'. fuera, fueras, fuera, fuéramos, fuerais, fueran (the same as ir). 'lo' stands for 'armado caballero': 'even if he were so'."}
          - {w: "había de", f: "hab- + -ía → haber (to have), imperfect, he; 'haber de' + infinitive = to have to. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "llevar", f: "infinitive (to wear, carry) after 'había de'."}
          - {w: "blancas", f: "blanc- + -as → blanco (white), feminine plural to match 'armas'."}
          - {w: "novel", f: "one form for both genders; placed before the noun."}
          - {w: "la ganase", f: "gan- + -ase → ganar (to win), imperfect subjunctive (-se form), he: 'should win'. ganase, ganases, ganase, ganásemos, ganaseis, ganasen; it means the same as the -ra form (ganara). 'hasta que' about something not yet done takes the subjunctive. 'la' = the empresa (device)."}
        ormsby_note: "Properly 'blank' armour, but Don Quixote takes the word in its common sense of white."
      - es: "Estos pensamientos le hicieron titubear en su propósito; mas, pudiendo más su locura que otra razón alguna, propuso de hacerse armar caballero del primero que topase, a imitación de otros muchos que así lo hicieron, según él había leído en los libros que tal le tenían."
        literal: "These thoughts him made to-waver in his purpose; but, being-able more his madness than other reason any, he-resolved of to-make-himself arm knight by-the first that he-might-bump-into, in imitation of others many who thus it did, according-as he had read in the books that such him had."
        ormsby: "These reflections made him waver in his purpose, but his craze being stronger than any reasoning, he made up his mind to have himself dubbed a knight by the first one he came across, following the example of others in the same case, as he had read in the books that brought him to this pass."
        vocab:
          - {w: "titubear", d: "to waver, hesitate"}
          - {w: "propósito", d: "purpose, intention"}
          - {w: "poder más", d: "to prevail, be stronger"}
          - {w: "locura", d: "madness"}
          - {w: "proponer de", d: "to resolve to; the 'de' before the infinitive is old usage"}
          - {w: "hacerse armar caballero", d: "to get oneself dubbed a knight"}
          - {w: "topar", d: "to bump into, come across"}
          - {w: "a imitación de", d: "in imitation of, following the example of"}
          - {w: "tener tal", d: "to keep in such a state; 'los libros que tal le tenían' = the books that had him in this state"}
        diagram:
          - s: "Estos pensamientos le hicieron titubear en su propósito"
            r: "main clause 1: these thoughts made him waver in his purpose"
          - s: "propuso"
            r: "main verb 2 (after 'mas'): he resolved"
            under:
              - {s: "pudiendo más su locura que otra razón alguna", r: "why: his madness being stronger than any reason"}
              - s: "de hacerse armar caballero"
                r: "what he resolved: to get himself dubbed a knight"
                under:
                  - {s: "del primero que topase", r: "by whom: by the first person he met"}
                  - s: "a imitación de otros muchos"
                    r: "how: following many others"
                    under:
                      - {s: "que así lo hicieron", r: "describes 'otros': who did just that"}
                      - {s: "según él había leído en los libros que tal le tenían", r: "source: as he had read in the books that had him in this state"}
        forms:
          - {w: "Estos", f: "est- + -os → 'these', masculine plural to match 'pensamientos': este, esta, estos, estas."}
          - {w: "le hicieron", f: "hic- + -ieron → hacer (to make), preterite, they, with 'le' (him). Irregular preterite: hice, hiciste, hizo, hicimos, hicisteis, hicieron. 'hacer' + infinitive (titubear, to waver) = to make someone do something."}
          - {w: "pudiendo", f: "pud- + -iendo → gerund of poder (can): 'being able'; 'poder más' = to be stronger. The stem o becomes u in the gerund."}
          - {w: "alguna", f: "algun- + -a → alguno, feminine to match 'razón'; after the noun it means 'any at all'."}
          - {w: "propuso", f: "propus- + -o → proponer (to resolve), preterite, he. Irregular like poner: puse, pusiste, puso, pusimos, pusisteis, pusieron."}
          - {w: "hacerse armar", f: "hacer (to make) + se (himself), the infinitive with 'se' hung on the end, + armar (to arm, dub): 'to have himself dubbed'. A pronoun attaches to the end of an infinitive."}
          - {w: "del primero", f: "de + el + primero: 'by the first one'."}
          - {w: "topase", f: "top- + -ase → topar (to come across), imperfect subjunctive (-se form), he: 'he might meet'. topase, topases, topase, topásemos, topaseis, topasen; it means the same as the -ra form (topara). Subjunctive because the person is not yet known."}
          - {w: "otros muchos", f: "masculine plural; the old order, where modern Spanish says 'muchos otros'."}
          - {w: "lo hicieron", f: "hacer, preterite, they: hice, hiciste, hizo, hicimos, hicisteis, hicieron; 'lo' = that (getting dubbed)."}
          - {w: "había leído", f: "había + leído (participle of leer, to read) → pluperfect, he: 'had read'. The pluperfect is había, habías, había, habíamos, habíais, habían + participle."}
          - {w: "tenían", f: "ten- + -ían → tener (to have; 'tener tal' = to keep in such a state), imperfect, they (the books). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
      - es: "En lo de las armas blancas, pensaba limpiarlas de manera, en teniendo lugar, que lo fuesen más que un armiño; y con esto se quietó y prosiguió su camino, sin llevar otro que aquel que su caballo quería, creyendo que en aquello consistía la fuerza de las aventuras."
        literal: "In the [matter] of the arms white, he-thought to-clean-them in manner, on having place, that it they-should-be more than an ermine; and with this himself he-quieted and continued his way, without taking other than that which his horse wanted, believing that in that consisted the force of the adventures."
