        literal: "Seeing Don Quijote the humility of-the warden of the fortress, for such to-him seemed to him the innkeeper and the inn, he-answered:"
        ormsby: "Don Quixote, observing the respectful bearing of the alcaide of the fortress (for so innkeeper and inn seemed in his eyes), made answer,"
        vocab:
          - {w: "humildad", d: "humility; here 'respectful manner'"}
          - {w: "alcaide", d: "governor, warden of a castle or fortress (from Arabic)"}
          - {w: "fortaleza", d: "fortress"}
        diagram:
          - s: "respondió:"
            r: "main verb: he answered"
            under:
              - s: "Viendo don Quijote la humildad del alcaide de la fortaleza"
                r: "when: Don Quijote (the subject), seeing the humble manner of the fortress's governor"
                under:
                  - {s: "que tal le pareció a él el ventero y la venta", r: "aside: for that is how innkeeper and inn looked to him"}
        forms:
          - {w: "Viendo", f: "vi- + -endo → gerund of ver (to see); its subject, don Quijote, follows it."}
          - {w: "del", f: "de + el."}
