  - sentences:
      - es: "— Si vuestra merced, señor caballero, busca posada, amén del lecho (porque en esta venta no hay ninguno), todo lo demás se hallará en ella en mucha abundancia."
        literal: "— If your mercy, lord knight, seeks lodging, apart-from the bed (because in this inn not there-is none), all the rest itself will-find in it in much abundance."
        ormsby: "“Señor Caballero, if your worship wants lodging, bating the bed (for there is not one in the inn) there is plenty of everything else here.”"
        vocab:
          - {w: "vuestra merced", d: "your worship; polite 'you' with a he/she verb, ancestor of 'usted'"}
          - {w: "posada", d: "lodging; also an inn"}
          - {w: "amén de", d: "apart from, except for (today 'besides')"}
          - {w: "lecho", d: "bed (literary)"}
          - {w: "lo demás", d: "the rest, everything else"}
        diagram:
          - s: "todo lo demás se hallará en ella en mucha abundancia"
            r: "main verb: everything else will be found in it in plenty"
            under:
              - {s: "Si vuestra merced, señor caballero, busca posada", r: "condition: if your worship, sir knight, seeks lodging"}
              - s: "amén del lecho"
                r: "exception: except the bed"
                under:
                  - {s: "(porque en esta venta no hay ninguno)", r: "why: there is none in this inn"}
        forms:
          - {w: "vuestra merced", f: "'your worship', which takes the he/she form of the verb."}
          - {w: "busca", f: "busc- + -a → buscar (to look for), present, you (vuestra merced, with the he/she form). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "del", f: "de + el."}
          - {w: "hay", f: "haber, 'there is'; it never changes."}
          - {w: "no hay ninguno", f: "the double negative is normal: 'there is not none' = there is none."}
          - {w: "se hallará", f: "hallar + -á → hallar (to find), future, it, with 'se' making it passive: 'will be found'. The future is the infinitive + -é, -ás, -á, -emos, -éis, -án."}
          - {w: "ella", f: "'it', standing for 'la venta'."}
          - {w: "mucha", f: "feminine to match 'abundancia'."}
        note: "An inn with everything except beds: the innkeeper's politeness is already a joke, and Don Quijote's ballad reply turns it into a virtue."
  - sentences:
