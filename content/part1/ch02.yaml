      - es: "En esto, sucedió acaso que un porquero que andaba recogiendo de unos rastrojos una manada de puercos —que, sin perdón, así se llaman— tocó un cuerno, a cuya señal ellos se recogen, y al instante se le representó a don Quijote lo que deseaba, que era que algún enano hacía señal de su venida;"
