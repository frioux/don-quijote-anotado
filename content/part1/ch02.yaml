        ormsby_note: "The commentators are somewhat exercised by the contradiction here. If Don Quixote raised his visor and disclosed his visage, how was it that the girls were unable 'to make out the features which the clumsy visor obscured'? Cervantes probably was thinking of the makeshift pasteboard visor (mala visera, as he calls it), which could not be put up completely, and so kept the face behind it in the shade. Hartzenbusch, however, believes the words to have been interpolated, and omits them."
  - sentences:
      - es: "— No fuyan las vuestras mercedes ni teman desaguisado alguno; ca a la orden de caballería que profeso non toca ni atañe facerle a ninguno, cuanto más a tan altas doncellas como vuestras presencias demuestran."
        literal: "— Not flee the your mercies nor fear outrage any; for to the order of chivalry that I-profess not touches nor concerns to-do-it to anyone, how-much more to such high maidens as your presences show."
        ormsby: "“Your ladyships need not fly or fear any rudeness, for that it belongs not to the order of knighthood which I profess to offer to anyone, much less to highborn maidens as your appearance proclaims you to be.”"
