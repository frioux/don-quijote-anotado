  - sentences:
      - es: "-Nunca fuera caballero de damas tan bien servido como fuera don Quijote cuando de su aldea vino: doncellas curaban dél; princesas, del su rocino,"
        literal: "-Never was knight by ladies so well served as was Don Quijote when from his village he-came: maidens tended of-him; princesses, of-the his nag,"
        ormsby: "“Oh, never, surely, was there knight So served by hand of dame, As served was he, Don Quixote hight, When from his town he came; With maidens waiting on himself, Princesses on his hack—"
        vocab:
          - {w: "fuera", d: "was; the -ra form as a plain past, a ballad archaism"}
          - {w: "servido de", d: "served by"}
          - {w: "aldea", d: "village"}
          - {w: "curar de", d: "to take care of, tend (today 'curar' = to cure)"}
          - {w: "dél", d: "= de él"}
          - {w: "del su", d: "archaic 'of his', with the article before the possessive"}
          - {w: "rocino", d: "= rocín, nag; the ballad's form, lengthened for the rhyme"}
        diagram:
          - s: "Nunca fuera caballero de damas tan bien servido"
            r: "main clause 1: never was a knight so well served by ladies"
            under:
              - s: "como fuera don Quijote"
                r: "comparison: as was Don Quijote"
                under:
                  - {s: "cuando de su aldea vino:", r: "when he came from his village"}
          - {s: "doncellas curaban dél", r: "main clause 2: maidens tended him"}
          - {s: "princesas, del su rocino,", r: "main clause 3: princesses [tended] his nag ('curaban' understood)"}
        forms:
          - {w: "fuera", f: "fu- + -era → ser (to be), the -ra form used as a plain past, he: 'was'. The -ra form comes from the Latin pluperfect, and the old ballads still use it this way. fuera, fueras, fuera, fuéramos, fuerais, fueran."}
          - {w: "servido", f: "serv- + -ido → participle of servir (to serve), masculine to match 'caballero'."}
          - {w: "vino", f: "vin- + -o → venir (to come), preterite, he: vine, viniste, vino, vinimos, vinisteis, vinieron."}
          - {w: "curaban", f: "cur- + -aban → curar (to tend), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "dél", f: "de + él (of him); 'curar de' = to look after."}
          - {w: "del su rocino", f: "de + el + su: the article before a possessive is archaic. rocino = rocín."}
        ormsby_note: "A parody of the opening lines of the ballad of Lancelot of the Lake. Their chief attraction for Cervantes was, no doubt, the occurrence of rocino (rocín) in the last line."
        note: "The ballad runs 'Nunca fuera caballero / de damas tan bien servido / como fuera Lanzarote / cuando de Bretaña vino, / que dueñas curaban dél, / doncellas del su rocino'. Don Quijote puts in his own name and village."
