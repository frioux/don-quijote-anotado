          - {w: "ser", f: "infinitive (to be) after 'por' = because of being."}
          - {w: "era", f: "ser (to be), imperfect, he: era, eras, era, éramos, erais, eran."}
          - {w: "el cual", f: "'who', the heavy relative used after a long gap: el cual, la cual, los cuales, las cuales."}
          - {w: "viendo", f: "vi- + -endo → gerund of ver (to see)."}
          - {w: "aquella", f: "'that', feminine to match 'figura'."}
          - {w: "contrahecha", f: "irregular participle of contrahacer (to counterfeit, deform), feminine to match 'figura'."}
          - {w: "armada", f: "arm- + -ada → participle of armar (to arm), feminine to match 'figura'."}
          - {w: "desiguales", f: "desigual + -es → plural to match 'armas'."}
