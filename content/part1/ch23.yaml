  - sentences:
      - es: "— Así será —dijo el de la Triste Figura—, y yo estoy muy contento de que te quieras valer de mi ánimo, el cual no te ha de faltar, aunque te falte el ánima del cuerpo."
        literal: "— So it-will-be —said he of the Sad Figure—, and I am very glad of that you may-want to-avail-yourself of my courage, which not to-you has to fail, although to-you may-fail the soul of-the body."
