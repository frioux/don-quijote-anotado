      - es: "— Engáñaste en eso, Sancho —respondió don Quijote—; que, ya que hemos caído en sospecha de quién es el dueño, cuasi delante, estamos obligados a buscarle y volvérselos;"
        literal: "— You-deceive-yourself in that, Sancho —answered Don Quijote—; for, since we-have fallen into suspicion of who is the owner, almost in-front, we-are obliged to seek-him and return-them-to-him;"
        ormsby: "“Thou art wrong there, Sancho,” said Don Quixote, “for now that we have a suspicion who the owner is, and have him almost before us, we are bound to seek him and make restitution;"
        vocab:
          - {w: "engañarse", d: "to be mistaken, deceive oneself"}
          - {w: "ya que", d: "since, now that"}
          - {w: "caer en sospecha de", d: "to come to suspect"}
          - {w: "cuasi", d: "= casi, almost"}
          - {w: "estar obligado a", d: "to be bound to, obliged to"}
        diagram:
          - {s: "Engáñaste en eso, Sancho", r: "main verb 1: you are wrong there, Sancho"}
          - {s: "respondió don Quijote", r: "speech tag"}
          - s: "estamos obligados a buscarle y volvérselos"
            r: "main verb 2 (after 'que' = for): we are bound to look for him and give them back to him"
            under:
              - {s: "ya que hemos caído en sospecha de quién es el dueño", r: "why: now that we suspect who the owner is"}
              - {s: "cuasi delante", r: "where: [having him] almost in front of us"}
        forms:
          - {w: "Engáñaste", f: "engañ- + -as → engañarse (to be mistaken), present, you, with 'te' stuck on and an accent added; modern 'te engañas'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "hemos caído", f: "hemos = haber, present, we (he, has, ha, hemos, habéis, han), + caído, participle of caer (to fall): 'we have fallen'."}
          - {w: "estamos obligados", f: "estamos = estar, present, we (estoy, estás, está, estamos, estáis, están), + obligados, participle of obligar, masculine plural."}
          - {w: "volvérselos", f: "infinitive volver (to give back) + se (to him; 'le' turns into 'se' before 'los') + los (them, the coins), accent added."}
          - {w: "cuasi", f: "= casi (almost), an old form."}
      - es: "y, cuando no le buscásemos, la vehemente sospecha que tenemos de que él lo sea nos pone ya en tanta culpa como si lo fuese."
        literal: "and, when not him we-might-seek, the vehement suspicion that we-have of that he it may-be us puts already in as-much guilt as if it he-were."
        ormsby: "and if we do not see him, the strong suspicion we have as to his being the owner makes us as guilty as if he were so;"
        ormsby_match: false
        vocab:
          - {w: "cuando", d: "here 'even if, if' (with the subjunctive)"}
          - {w: "vehemente", d: "strong, vehement"}
          - {w: "culpa", d: "guilt, blame"}
        diagram:
          - s: "la vehemente sospecha ... nos pone ya en tanta culpa"
            r: "main verb: the strong suspicion puts us in as much guilt"
            under:
              - {s: "cuando no le buscásemos", r: "condition: if we did not look for him"}
              - {s: "que tenemos de que él lo sea", r: "describes 'sospecha': that we have that he is [the owner]"}
              - {s: "como si lo fuese", r: "comparison: as if he were"}
        forms:
          - {w: "buscásemos", f: "busc- + -ásemos → buscar (to look for), imperfect subjunctive (-se form), we. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "tenemos", f: "ten- + -emos → tener (to have), present, we. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "sea", f: "ser (to be), present subjunctive, he: after 'sospecha de que'. sea, seas, sea, seamos, seáis, sean."}
          - {w: "pone", f: "pon- + -e → poner (to put), present, it. Irregular: pongo, pones, pone, ponemos, ponéis, ponen."}
          - {w: "fuese", f: "fu- + -ese → ser (to be), imperfect subjunctive (-se form), he: always after 'como si'. fuese, fueses, fuese, fuésemos, fueseis, fuesen."}
          - {w: "lo", f: "'lo' stands for 'the owner' after ser: 'that he is (it)'."}
        note: "Ormsby read 'if we do not see him'; the Spanish says 'if we do not look for him'."
      - es: "Así que, Sancho amigo, no te dé pena el buscalle, por la que a mí se me quitará si le hallo."
        literal: "So that, Sancho friend, not to-you may-give grief the seeking-him, for the [grief] that from me itself to-me will-be-taken if him I-find."
        ormsby: "and so, friend Sancho, let not our search for him give thee any uneasiness, for if we find him it will relieve mine.”"
        vocab:
          - {w: "Sancho amigo", d: "friend Sancho (affectionate address)"}
          - {w: "dar pena", d: "to trouble, grieve, worry"}
          - {w: "quitársele algo a uno", d: "to be relieved of something"}
        diagram:
          - s: "no te dé pena el buscalle"
            r: "main verb (after 'Así que'): don't let the search trouble you"
            under:
              - {s: "Sancho amigo", r: "address"}
              - s: "por la que a mí se me quitará"
                r: "why: because of the [worry] that will be taken from me"
                under:
                  - {s: "si le hallo", r: "condition: if I find him"}
        forms:
          - {w: "dé", f: "d- + -é → dar (to give), present subjunctive, it, as a negative command: 'let it not give'. dé, des, dé, demos, deis, den; the accent tells it from 'de' (of)."}
          - {w: "el buscalle", f: "= el buscarle: infinitive with 'el' as a noun, 'the looking for him', with 'le' and the r turned into l."}
          - {w: "se me quitará", f: "quitar + -á → quitarse (to be removed), future, it, with 'me' (from me). The future adds to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "hallo", f: "hall- + -o → hallar (to find), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "la que", f: "'the one that', feminine to stand for 'pena' (worry)."}
  - sentences:
      - es: "Y así, picó a Rocinante, y siguióle Sancho con su acostumbrado jumento;"
        literal: "And so, he-spurred [to] Rocinante, and followed-him Sancho with his accustomed donkey;"
        ormsby: "And so saying he gave Rocinante the spur, and Sancho followed him on foot and loaded,"
        ormsby_match: false
        vocab:
          - {w: "picar", d: "to spur (a horse)"}
          - {w: "acostumbrado", d: "usual, customary"}
          - {w: "jumento", d: "donkey, ass"}
        diagram:
          - {s: "picó a Rocinante", r: "main verb 1 (after 'Y así'): he spurred Rocinante"}
          - s: "y siguióle Sancho"
            r: "main verb 2: and Sancho followed him"
            under:
              - {s: "con su acostumbrado jumento", r: "how: with his usual donkey"}
        forms:
          - {w: "picó", f: "pic- + -ó → picar (to spur), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "a Rocinante", f: "the 'a' that marks a person as the object, used for a named horse."}
          - {w: "siguióle", f: "sigu- + -ió → seguir (to follow), preterite, he, with 'le' (him) stuck on; modern 'le siguió'. The e of the stem turns to i in he/they forms: seguí, seguiste, siguió, seguimos, seguisteis, siguieron."}
        note: "Here Sancho still has his donkey; Ormsby, following the second edition in which the ass was stolen, has him follow 'on foot and loaded'."
      - es: "y, habiendo rodeado parte de la montaña, hallaron en un arroyo, caída, muerta y medio comida de perros y picada de grajos, una mula ensillada y enfrenada;"
        literal: "and, having gone-round part of the mountain, they-found in a stream, fallen, dead and half eaten by dogs and pecked by jackdaws, a mule saddled and bridled;"
        ormsby: "and after having partly made the circuit of the mountain they found lying in a ravine, dead and half devoured by dogs and pecked by jackdaws, a mule saddled and bridled,"
        vocab:
          - {w: "rodear", d: "to go round, skirt"}
          - {w: "arroyo", d: "stream, brook; also its gully (Ormsby: 'ravine')"}
          - {w: "grajo", d: "rook, jackdaw"}
          - {w: "mula", d: "mule, the usual mount of travellers of rank who were not soldiers"}
          - {w: "ensillado", d: "saddled"}
          - {w: "enfrenado", d: "bridled"}
        diagram:
          - s: "hallaron"
            r: "main verb (after 'y'): they found"
            under:
              - {s: "habiendo rodeado parte de la montaña", r: "when: having gone round part of the mountain"}
              - {s: "en un arroyo", r: "where: in a stream bed"}
              - s: "una mula ensillada y enfrenada"
                r: "object: a saddled and bridled mule"
                under:
                  - {s: "caída, muerta y medio comida de perros y picada de grajos", r: "describes 'mula': fallen, dead, half eaten by dogs and pecked by jackdaws"}
        forms:
          - {w: "habiendo rodeado", f: "habiendo, the gerund of haber, + rodeado, the participle of rodear (to go round): 'having gone round'."}
          - {w: "hallaron", f: "hall- + -aron → hallar (to find), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "caída, muerta, comida, picada, ensillada, enfrenada", f: "participles of caer (to fall), morir (to die; irregular 'muerta'), comer (to eat), picar (to peck), ensillar (to saddle), enfrenar (to bridle), all feminine to match 'mula'."}
          - {w: "de perros, de grajos", f: "'de' marks the doer after a participle, where modern Spanish uses 'por': 'eaten by dogs'."}
      - es: "todo lo cual confirmó en ellos más la sospecha de que aquel que huía era el dueño de la mula y del cojín."
        literal: "all which confirmed in them more the suspicion of that that-one who was-fleeing was the owner of the mule and of-the cushion."
        ormsby: "all which still further strengthened their suspicion that he who had fled was the owner of the mule and the saddle-pad."
        vocab:
          - {w: "confirmar", d: "to confirm, strengthen"}
          - {w: "huir", d: "to flee, run away"}
        diagram:
          - s: "todo lo cual confirmó en ellos más la sospecha"
            r: "main verb: all of which further confirmed in them the suspicion"
            under:
              - s: "de que aquel ... era el dueño de la mula y del cojín"
                r: "what suspicion: that that man was the owner of the mule and the pad"
                under:
                  - {s: "que huía", r: "describes 'aquel': who was running away"}
        forms:
          - {w: "confirmó", f: "confirm- + -ó → confirmar (to confirm), preterite, it. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "huía", f: "hu- + -ía → huir (to flee), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "era", f: "ser (to be), imperfect, he. Irregular: era, eras, era, éramos, erais, eran."}
  - sentences:
      - es: "Estándola mirando, oyeron un silbo como de pastor que guardaba ganado, y a deshora, a su siniestra mano, parecieron una buena cantidad de cabras, y tras ellas, por cima de la montaña, pareció el cabrero que las guardaba, que era un hombre anciano."
        literal: "Being-it looking, they-heard a whistle as of shepherd who guarded flock, and suddenly, at their left hand, appeared a good quantity of goats, and behind them, over top of the mountain, appeared the goatherd who them guarded, who was a man old."
        ormsby: "As they stood looking at it they heard a whistle like that of a shepherd watching his flock, and suddenly on their left there appeared a great number of goats and behind them on the summit of the mountain the goatherd in charge of them, a man advanced in years."
        vocab:
          - {w: "silbo", d: "whistle"}
          - {w: "ganado", d: "livestock, flock"}
          - {w: "a deshora", d: "suddenly, unexpectedly"}
          - {w: "siniestro", d: "left (literary; 'mano siniestra' = left hand)"}
          - {w: "parecer", d: "here 'to appear' (old sense; modern 'aparecer')"}
          - {w: "cabrero", d: "goatherd"}
          - {w: "anciano", d: "old, elderly"}
        diagram:
          - s: "oyeron un silbo"
            r: "main verb 1: they heard a whistle"
            under:
              - {s: "Estándola mirando", r: "when: while they were looking at it"}
              - s: "como de pastor"
                r: "describes 'silbo': like a shepherd's"
                under:
                  - {s: "que guardaba ganado", r: "describes 'pastor': who was minding a flock"}
          - s: "parecieron una buena cantidad de cabras"
            r: "main verb 2: a good number of goats appeared"
            under:
              - {s: "a deshora, a su siniestra mano", r: "when and where: suddenly, on their left"}
          - s: "pareció el cabrero"
            r: "main verb 3: the goatherd appeared"
            under:
              - {s: "tras ellas, por cima de la montaña", r: "where: behind them, on top of the mountain"}
              - {s: "que las guardaba", r: "describes 'cabrero': who was minding them"}
              - {s: "que era un hombre anciano", r: "describes 'cabrero': who was an old man"}
        forms:
          - {w: "Estándola mirando", f: "estando, the gerund of estar (to be), + la (it, the mule), + mirando, the gerund of mirar (to look at): 'being looking at it'; accent added."}
          - {w: "oyeron", f: "oy- + -eron → oír (to hear), preterite, they. Irregular: oí, oíste, oyó, oímos, oísteis, oyeron."}
          - {w: "guardaba", f: "guard- + -aba → guardar (to mind, keep), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "parecieron, pareció", f: "parec- + -ieron / -ió → parecer (to appear), preterite, they / he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron. The plural goes with 'cantidad de cabras', thought of as many goats."}
          - {w: "siniestra", f: "siniestr- + -a → siniestro (left), feminine to match 'mano'."}
          - {w: "era", f: "ser (to be), imperfect, he. Irregular: era, eras, era, éramos, erais, eran."}
      - es: "Diole voces don Quijote, y rogóle que bajase donde estaban."
        literal: "Gave-him shouts Don Quijote, and begged-him that he-should-come-down where they-were."
        ormsby: "Don Quixote called aloud to him and begged him to come down to where they stood."
        vocab:
          - {w: "dar voces a", d: "to shout to, call out to"}
          - {w: "rogar", d: "to beg, ask"}
          - {w: "bajar", d: "to come down"}
        diagram:
          - {s: "Diole voces don Quijote", r: "main verb 1: Don Quijote shouted to him"}
          - s: "y rogóle"
            r: "main verb 2: and begged him"
            under:
              - {s: "que bajase donde estaban", r: "what he begged: to come down to where they were"}
        forms:
          - {w: "Diole", f: "d- + -io → dar (to give), preterite, he, with 'le' (to him) stuck on; modern 'le dio'. Irregular: di, diste, dio, dimos, disteis, dieron."}
          - {w: "rogóle", f: "rog- + -ó → rogar (to beg), preterite, he, with 'le' (him) stuck on. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "bajase", f: "baj- + -ase → bajar (to come down), imperfect subjunctive (-se form), he: after 'rogar que'. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "estaban", f: "est- + -aban → estar (to be), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
      - es: "Él respondió a gritos que quién les había traído por aquel lugar, pocas o ningunas veces pisado sino de pies de cabras o de lobos y otras fieras que por allí andaban."
        literal: "He answered with shouts that who them had brought through that place, few or no times trodden except by feet of goats or of wolves and other wild-beasts that around there went."
        ormsby: "He shouted in return, asking what had brought them to that spot, seldom or never trodden except by the feet of goats, or of the wolves and other wild beasts that roamed around."
        vocab:
          - {w: "a gritos", d: "shouting, at the top of his voice"}
          - {w: "pocas o ningunas veces", d: "seldom or never"}
          - {w: "pisado", d: "trodden"}
          - {w: "lobo", d: "wolf"}
          - {w: "fiera", d: "wild beast"}
        diagram:
          - s: "Él respondió a gritos"
            r: "main verb: he shouted back"
            under:
              - s: "que quién les había traído por aquel lugar"
                r: "what he asked: who had brought them to that place"
                under:
                  - {s: "pocas o ningunas veces pisado sino de pies de cabras o de lobos y otras fieras", r: "describes 'lugar': seldom or never trodden except by goats, wolves and other beasts"}
                  - {s: "que por allí andaban", r: "describes the beasts: that roamed there"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "que quién", f: "a reported question keeps 'que' before the question word: 'that who ...'."}
          - {w: "les había traído", f: "había = haber, imperfect, it (había, habías, había, habíamos, habíais, habían), + traído, the participle of traer (to bring), with 'les' (them): 'had brought them'."}
          - {w: "ningunas", f: "ninguna (no) made plural to match 'veces', an old usage."}
          - {w: "andaban", f: "and- + -aban → andar (to go about), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
      - es: "Respondióle Sancho que bajase, que de todo le darían buena cuenta."
        literal: "Answered-him Sancho that he-should-come-down, for of everything to-him they-would-give good account."
        ormsby: "Sancho in return bade him come down, and they would explain all to him."
        vocab:
          - {w: "dar buena cuenta de", d: "to give a full account of, explain fully"}
        diagram:
          - s: "Respondióle Sancho"
            r: "main verb: Sancho answered him"
            under:
              - {s: "que bajase", r: "what: that he should come down"}
              - {s: "que de todo le darían buena cuenta", r: "why (after 'que' = for): they would explain everything to him"}
        forms:
          - {w: "Respondióle", f: "respond- + -ió → responder (to answer), preterite, he, with 'le' (him) stuck on; modern 'le respondió'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "bajase", f: "baj- + -ase → bajar (to come down), imperfect subjunctive (-se form), he: a request. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "darían", f: "dar + -ían → dar (to give), conditional, they. The conditional adds to the whole infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
      - es: "Bajó el cabrero, y, en llegando adonde don Quijote estaba, dijo:"
        literal: "Came-down the goatherd, and, on arriving where Don Quijote was, he-said:"
        ormsby: "The goatherd descended, and reaching the place where Don Quixote stood, he said,"
        vocab:
          - {w: "en llegando", d: "on arriving, as soon as he arrived"}
          - {w: "adonde", d: "to where"}
        diagram:
          - {s: "Bajó el cabrero", r: "main verb 1: the goatherd came down"}
          - s: "dijo"
            r: "main verb 2 (after 'y'): he said"
            under:
              - {s: "en llegando adonde don Quijote estaba", r: "when: on reaching where Don Quijote was"}
        forms:
          - {w: "Bajó", f: "baj- + -ó → bajar (to come down), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "en llegando", f: "en + llegando, the gerund of llegar (to arrive): 'as soon as he arrived'."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
