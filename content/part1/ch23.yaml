          - {w: "cojín", d: "cushion; here a saddle-pad"}
          - {w: "maleta", d: "valise, saddlebag, small case carried on a horse"}
          - {w: "asido a", d: "fastened to, attached to (from asir, to grasp)"}
          - {w: "podrido", d: "rotten"}
          - {w: "del todo", d: "completely"}
          - {w: "deshecho", d: "falling apart, torn to pieces"}
        diagram:
