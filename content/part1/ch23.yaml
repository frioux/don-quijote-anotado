                  - {s: "que de ninguna otra se acordaba", r: "result: that he thought of nothing else"}
        forms:
          - {w: "Iba pensando", f: "iba = ir (to go), imperfect, he (iba, ibas, iba, íbamos, ibais, iban), + pensando, the gerund of pensar (to think): 'he went along thinking'."}
          - {w: "embebecido y trasportado", f: "participles of embebecer (to absorb) and trasportar (to carry away), masculine for Don Quijote."}
          - {w: "ninguna otra", f: "feminine to match the unspoken 'cosa'."}
          - {w: "se acordaba", f: "acord- + -aba → acordarse (to remember), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
      - es: "Ni Sancho llevaba otro cuidado —después que le pareció que caminaba por parte segura— sino de satisfacer su estómago con los relieves que del despojo clerical habían quedado;"
        literal: "Nor Sancho carried other care —after that to-him it-seemed that he-walked through part safe— but of satisfying his stomach with the leftovers that from-the spoil clerical had remained;"
        ormsby: "Nor had Sancho any other care (now that he fancied he was travelling in a safe quarter) than to satisfy his appetite with such remains as were left of the clerical spoils,"
        vocab:
          - {w: "llevar cuidado", d: "to have a concern, care about"}
