  - sentences:
      - es: "Subió don Quijote, sin replicarle más palabra, y, guiando Sancho sobre su asno, se entraron por una parte de Sierra Morena, que allí junto estaba, llevando Sancho intención de atravesarla toda e ir a salir al Viso, o a Almodóvar del Campo, y esconderse algunos días por aquellas asperezas, por no ser hallados si la Hermandad los buscase."
        literal: "Climbed-up Don Quijote, without replying-to-him more word, and, leading Sancho on his donkey, they-went-in through a part of Sierra Morena, which there near was, carrying Sancho intention of crossing-it all and to-go to come-out at-the Viso, or at Almodóvar del Campo, and to-hide-himself some days among those rough-places, for not to-be found if the Brotherhood them should-seek."
        ormsby: "Don Quixote mounted without replying, and, Sancho leading the way on his ass, they entered the side of the Sierra Morena, which was close by, as it was Sancho’s design to cross it entirely and come out again at El Viso or Almodóvar del Campo, and hide for some days among its crags so as to escape the search of the Brotherhood should they come to look for them."
        ormsby_note: "These are towns of La Mancha, though from the wording of the passage it might be supposed that they lay on the other, the Andalusian, side of the Sierra Morena. It is significant that Cervantes always speaks of 'entering' and 'coming out of' the Sierra Morena, never of ascending or descending it; and, in fact, on the north side the Sierra rises but little above the level of the great Castilian plateau and the road enters the gorge of Despeñaperros, and reaches the Andalusian slope with comparatively little ascent."
        vocab:
          - {w: "replicar", d: "to reply, answer back"}
          - {w: "guiar", d: "to lead, guide, go ahead"}
          - {w: "Sierra Morena", d: "the mountain range dividing La Mancha (Castile) from Andalusia; wild, thinly peopled, a haunt of outlaws"}
          - {w: "junto", d: "near, close by ('allí junto' = right there)"}
          - {w: "llevar intención de", d: "to intend to, have in mind to"}
          - {w: "atravesar", d: "to cross, go right through"}
          - {w: "ir a salir a", d: "to come out at (the far side)"}
          - {w: "el Viso, Almodóvar del Campo", d: "two towns of La Mancha near the Sierra Morena"}
          - {w: "aspereza", d: "rough, rugged ground; wilds"}
        diagram:
