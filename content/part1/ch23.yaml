          - {w: "se había escapado", f: "había = haber, imperfect, it (había, habías, había, habíamos, habíais, habían), + escapado, participle of escaparse (to escape): pluperfect, 'had escaped'."}
          - {w: "venía", f: "ven- + -ía → venir (to come), imperfect, it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "la juzgó", f: "juzg- + -ó → juzgar (to judge), preterite, he; 'la' repeats 'cosa', a redundant pronoun common in speech. Same -ar preterite: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "llevaron y buscaron", f: "llev- + -aron → llevar (to take), busc- + -aron → buscar (to search), preterite, they. Same -ar preterite."}
