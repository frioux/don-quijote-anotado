        ormsby: "and perhaps that will be when I shall have spent it, and then the king will hold me harmless.”"
        vocab:
          - {w: "a tiempo que", d: "at a time when"}
          - {w: "gastar", d: "to spend"}
          - {w: "hacer franco", d: "to make free, exempt from paying"}
