                  - {s: "que en semejantes soledades y asperezas habían sucedido a caballeros andantes", r: "describes them: that had befallen knights-errant in such wild places"}
        forms:
          - {w: "Reducíansele", f: "reduc- + -ían → reducir (to bring back), imperfect, they, + se (passive: 'were brought') + le (to him); modern 'se le reducían'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían. Cervantes hangs the pronouns on a verb that opens the clause."}
          - {w: "maravillosos", f: "maravill- + -oso → maravilloso (marvellous), masculine plural to match 'acaecimientos'."}
          - {w: "habían sucedido", f: "habían = haber, imperfect, they (había, habías, había, habíamos, habíais, habían), + sucedido, participle of suceder (to happen): pluperfect, 'had happened'."}
      - es: "Iba pensando en estas cosas, tan embebecido y trasportado en ellas que de ninguna otra se acordaba."
        literal: "He-went thinking about these things, so absorbed and transported in them that of no other himself he-remembered."
        ormsby: "and he went along reflecting on these things, so absorbed and carried away by them that he had no thought for anything else."
        vocab:
          - {w: "embebecido", d: "absorbed, wrapped up, entranced"}
          - {w: "trasportado", d: "carried away, enraptured; modern 'transportado'"}
