  - sentences:
      - es: "— Menos por ésta que por los versos se puede sacar más de que quien la escribió es algún desdeñado amante."
        literal: "— Less by this-one than by the verses one-can draw-out more than that who it wrote is some scorned lover."
        ormsby: "“There is less to be gathered from this than from the verses, except that he who wrote it is some rejected lover;”"
        vocab:
          - {w: "sacar", d: "to draw out, gather, deduce"}
          - {w: "más de que", d: "beyond the fact that, except that"}
          - {w: "desdeñado", d: "scorned, rejected"}
          - {w: "amante", d: "lover, one who loves"}
        diagram:
          - s: "se puede sacar"
            r: "main verb: one can gather"
            under:
              - {s: "Menos por ésta que por los versos", r: "how much: less from this than from the verses"}
              - s: "más de que"
                r: "nothing beyond the fact: except that"
                under:
                  - {s: "quien la escribió es algún desdeñado amante", r: "what: whoever wrote it is some scorned lover"}
        forms:
          - {w: "ésta", f: "'this one', feminine to match 'carta'; the accent marks the pronoun."}
          - {w: "se puede", f: "pued- + -e → poder (can), present, it, with 'se' (one): 'one can'. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "la escribió", f: "escrib- + -ió → escribir (to write), preterite, he, with 'la' (it, the letter). The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun."}
  - sentences:
      - es: "Y, hojeando casi todo el librillo, halló otros versos y cartas, que algunos pudo leer y otros no; pero lo que todos contenían eran quejas, lamentos, desconfianzas, sabores y sinsabores, favores y desdenes, solenizados los unos y llorados los otros."
        literal: "And, leafing-through almost all the little-book, he-found other verses and letters, which some he-could read and others not; but that which all contained were complaints, laments, distrusts, delights and sorrows, favors and scorns, celebrated the ones and wept the others."
        ormsby: "and turning over nearly all the pages of the book he found more verses and letters, some of which he could read, while others he could not; but they were all made up of complaints, laments, misgivings, desires and aversions, favours and rejections, some rapturous, some doleful."
        vocab:
          - {w: "hojear", d: "to leaf through"}
          - {w: "lamento", d: "lament, wail"}
          - {w: "desconfianza", d: "distrust, misgiving, jealousy"}
          - {w: "sabores y sinsabores", d: "delights and sorrows, ups and downs"}
          - {w: "desdén", d: "scorn, disdain"}
          - {w: "solenizar", d: "to celebrate; modern 'solemnizar'"}
        diagram:
          - s: "halló otros versos y cartas"
            r: "main verb 1: he found more verses and letters"
            under:
              - {s: "hojeando casi todo el librillo", r: "how: leafing through almost the whole book"}
              - {s: "que algunos pudo leer y otros no", r: "describes them: of which some he could read and others not"}
          - s: "pero lo que todos contenían eran quejas"
            r: "main verb 2: but what they all contained was complaints"
            under:
              - {s: "lamentos, desconfianzas, sabores y sinsabores, favores y desdenes", r: "the list continues: laments, misgivings, joys and sorrows, favors and scorns"}
              - {s: "solenizados los unos y llorados los otros", r: "how: the one kind celebrated, the other wept over"}
        forms:
          - {w: "hojeando", f: "gerund of hojear (to leaf through), from 'hoja' (page)."}
          - {w: "halló", f: "hall- + -ó → hallar (to find), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "pudo", f: "pud- + -o → poder (can), preterite, he. Irregular: pude, pudiste, pudo, pudimos, pudisteis, pudieron."}
          - {w: "contenían", f: "conten- + -ían → contener (to contain), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "eran", f: "ser (to be), imperfect, they, agreeing with the plural 'quejas' that follows. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "solenizados, llorados", f: "participles of solenizar (to celebrate) and llorar (to weep), masculine plural with 'los unos', 'los otros'."}
  - sentences:
      - es: "En tanto que don Quijote pasaba el libro, pasaba Sancho la maleta, sin dejar rincón en toda ella, ni en el cojín, que no buscase, escudriñase e inquiriese, ni costura que no deshiciese, ni vedija de lana que no escarmenase, porque no se quedase nada por diligencia ni mal recado:"
        literal: "While that Don Quijote went-through the book, went-through Sancho the valise, without leaving corner in all it, nor in the cushion, that not he-might-search, scrutinize and inquire-into, nor seam that not he-might-undo, nor tuft of wool that not he-might-tease-out, so-that not might-remain anything for diligence nor bad care:"
        ormsby: "While Don Quixote examined the book, Sancho examined the valise, not leaving a corner in the whole of it or in the pad that he did not search, peer into, and explore, or seam that he did not rip, or tuft of wool that he did not pick to pieces, lest anything should escape for want of care and pains;"
        vocab:
          - {w: "en tanto que", d: "while"}
          - {w: "pasar", d: "here 'to go through, look over'"}
          - {w: "escudriñar", d: "to scrutinize, search minutely"}
          - {w: "inquirir", d: "to inquire into, investigate"}
          - {w: "costura", d: "seam"}
          - {w: "vedija", d: "tuft, lock (of wool)"}
          - {w: "escarmenar", d: "to tease, pick apart (wool)"}
          - {w: "por diligencia ni mal recado", d: "for lack of diligence or through carelessness"}
        diagram:
          - s: "pasaba Sancho la maleta"
            r: "main verb: Sancho went through the valise"
            under:
              - {s: "En tanto que don Quijote pasaba el libro", r: "when: while Don Quijote went through the book"}
              - s: "sin dejar rincón en toda ella, ni en el cojín"
                r: "how: without leaving a corner in it or in the pad"
                under:
                  - {s: "que no buscase, escudriñase e inquiriese", r: "describes 'rincón': that he did not search, scrutinize and probe"}
              - {s: "ni costura que no deshiciese", r: "nor a seam he did not unpick"}
              - {s: "ni vedija de lana que no escarmenase", r: "nor a tuft of wool he did not pick apart"}
              - {s: "porque no se quedase nada por diligencia ni mal recado", r: "purpose: so that nothing would be missed for lack of care"}
        forms:
          - {w: "pasaba", f: "pas- + -aba → pasar (to go through), imperfect, he, twice. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "dejar", f: "infinitive (to leave) after 'sin'."}
          - {w: "buscase, escudriñase", f: "busc- + -ase → buscar (to search), escudriñ- + -ase → escudriñar (to scrutinize), imperfect subjunctive (-se form), he: subjunctive because the corner is one that might not exist. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "inquiriese, deshiciese", f: "inquir- + -iese → inquirir (to inquire), deshic- + -iese → deshacer (to undo), imperfect subjunctive (-se form), he. The -se form of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen; deshacer uses the stem deshic-."}
          - {w: "escarmenase", f: "escarmen- + -ase → escarmenar (to tease wool), same -ase form."}
          - {w: "se quedase", f: "qued- + -ase → quedarse (to be left), same -ase form, after 'porque' meaning 'so that'."}
          - {w: "e inquiriese", f: "'e' replaces 'y' (and) before a word starting with the sound i."}
      - es: "tal golosina habían despertado en él los hallados escudos, que pasaban de ciento."
        literal: "such greed had awakened in him the found crowns, which passed of hundred."
        ormsby: "so keen was the covetousness excited in him by the discovery of the crowns, which amounted to near a hundred;"
        vocab:
          - {w: "golosina", d: "greed, appetite, craving (also 'sweet, treat')"}
          - {w: "despertar", d: "to awaken, arouse"}
          - {w: "pasar de", d: "to exceed, be more than"}
        diagram:
          - s: "tal golosina habían despertado en él"
            r: "main verb (explains the line before): such greed had they awakened in him"
            under:
              - s: "los hallados escudos"
                r: "subject: the crowns he had found"
                under:
                  - {s: "que pasaban de ciento", r: "describes 'escudos': which were more than a hundred"}
        forms:
          - {w: "habían despertado", f: "habían = haber, imperfect, they (había, habías, había, habíamos, habíais, habían), + despertado, participle of despertar (to awaken): 'had awakened'."}
          - {w: "hallados", f: "participle of hallar (to find), masculine plural to match 'escudos', placed before the noun: 'the found crowns'."}
          - {w: "pasaban", f: "pas- + -aban → pasar (to exceed), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
        note: "Ormsby says 'near a hundred'; the Spanish says 'more than a hundred'. A hundred gold crowns was a small fortune for a farm labourer."
      - es: "Y, aunque no halló mas de lo hallado, dio por bien empleados los vuelos de la manta, el vomitar del brebaje, las bendiciones de las estacas, las puñadas del arriero, la falta de las alforjas, el robo del gabán y toda la hambre, sed y cansancio que había pasado en servicio de su buen señor, pareciéndole que estaba más que rebién pagado con la merced recebida de la entrega del hallazgo."
        literal: "And, although not he-found more than the found, he-gave as well spent the flights of the blanket, the vomiting of-the brew, the blessings of the stakes, the punches of-the muleteer, the lack of the saddlebags, the theft of-the coat and all the hunger, thirst and weariness that he-had suffered in service of his good master, seeming-to-him that he-was more than very-well paid with the favor received of the handing-over of-the find."
        ormsby: "and though he found no more booty, he held the blanket flights, balsam vomits, stake benedictions, carriers’ fisticuffs, missing alforjas, stolen coat, and all the hunger, thirst, and weariness he had endured in the service of his good master, cheap at the price; as he considered himself more than fully indemnified for all by the payment he received in the gift of the treasure-trove."
        vocab:
          - {w: "mas de", d: "more than ('mas' without the accent here = más)"}
          - {w: "dar por bien empleado", d: "to consider well spent, think it worth it"}
          - {w: "vuelos de la manta", d: "the flights in the blanket: Sancho was tossed in a blanket at the inn (Chapter 17)"}
          - {w: "brebaje", d: "brew, potion: the balsam of Fierabrás that made him vomit (Chapter 17)"}
          - {w: "bendiciones de las estacas", d: "'blessings of the stakes', ironic for the beating the Yanguesan carriers gave them with stakes (Chapter 15)"}
          - {w: "arriero", d: "muleteer, carrier: the one who punched Sancho at the inn (Chapter 16)"}
          - {w: "alforjas", d: "saddlebags (left at the inn, Chapter 17)"}
          - {w: "gabán", d: "coat, cloak (stolen by the galley slaves, Chapter 22)"}
          - {w: "rebién", d: "very well (re- intensifies)"}
          - {w: "recebir", d: "old form of 'recibir', to receive"}
          - {w: "entrega", d: "handing over, delivery"}
          - {w: "hallazgo", d: "find, treasure-trove"}
        diagram:
          - s: "dio por bien empleados"
            r: "main verb: he considered well spent"
            under:
              - {s: "aunque no halló mas de lo hallado", r: "concession: although he found nothing more than what he had found"}
              - s: "los vuelos de la manta, el vomitar del brebaje, las bendiciones de las estacas, las puñadas del arriero, la falta de las alforjas, el robo del gabán y toda la hambre, sed y cansancio"
                r: "object: all his misfortunes so far"
                under:
                  - {s: "que había pasado en servicio de su buen señor", r: "describes them: that he had suffered serving his good master"}
              - s: "pareciéndole"
                r: "why: it seeming to him"
                under:
                  - {s: "que estaba más que rebién pagado con la merced recebida de la entrega del hallazgo", r: "what: that he was more than well paid by the gift of the find"}
        forms:
          - {w: "halló", f: "hall- + -ó → hallar (to find), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "lo hallado", f: "'lo' + participle of hallar makes a noun: 'what had been found'."}
          - {w: "dio", f: "d- + -io → dar (to give), preterite, he. Irregular: di, diste, dio, dimos, disteis, dieron."}
          - {w: "empleados", f: "participle of emplear (to spend), masculine plural to match the list of misfortunes."}
          - {w: "el vomitar", f: "infinitive vomitar (to vomit) with 'el': 'the vomiting'."}
          - {w: "toda la hambre", f: "'hambre' is feminine ('toda'); 'la' before stressed a- is old usage, modern 'el hambre'."}
          - {w: "había pasado", f: "había = haber, imperfect, he (había, habías, había, habíamos, habíais, habían), + pasado, participle of pasar (to suffer): 'had gone through'."}
          - {w: "pareciéndole", f: "pareciendo, the gerund of parecer (to seem), + le (to him), accent added."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "recebida", f: "= recibida, participle of recebir (old form of recibir, to receive), feminine to match 'merced'."}
          - {w: "buen", f: "bueno (good) clipped before a masculine singular noun ('señor')."}
        note: "Sancho runs through the whole catalogue of his sufferings since Chapter 15 and finds them paid for by the gold."
  - sentences:
      - es: "Con gran deseo quedó el Caballero de la Triste Figura de saber quién fuese el dueño de la maleta, conjeturando, por el soneto y carta, por el dinero en oro y por las tan buenas camisas, que debía de ser de algún principal enamorado, a quien desdenes y malos tratamientos de su dama debían de haber conducido a algún desesperado término."
        literal: "With great desire remained the Knight of the Sad Figure of knowing who might-be the owner of the valise, conjecturing, by the sonnet and letter, by the money in gold and by the so good shirts, that he-must be of some distinguished lover, whom scorns and bad treatments of his lady must have led to some desperate end."
        ormsby: "The Knight of the Rueful Countenance was still very anxious to find out who the owner of the valise could be, conjecturing from the sonnet and letter, from the money in gold, and from the fineness of the shirts, that he must be some lover of distinction whom the scorn and cruelty of his lady had driven to some desperate course;"
        vocab:
          - {w: "el Caballero de la Triste Figura", d: "the Knight of the Sad Countenance (Ormsby: 'Rueful'), the name Sancho gave Don Quijote in Chapter 19"}
          - {w: "conjeturar", d: "to conjecture, guess"}
          - {w: "principal", d: "of high rank, distinguished, a gentleman"}
          - {w: "malos tratamientos", d: "ill treatment, cruelty"}
          - {w: "término", d: "end, state, extremity"}
          - {w: "desesperado", d: "desperate"}
        diagram:
          - s: "Con gran deseo quedó el Caballero de la Triste Figura"
            r: "main verb: the Knight of the Sad Countenance was left with a great desire"
            under:
              - {s: "de saber quién fuese el dueño de la maleta", r: "desire for what: to know who the owner of the valise might be"}
              - s: "conjeturando"
                r: "how: guessing"
                under:
                  - {s: "por el soneto y carta, por el dinero en oro y por las tan buenas camisas", r: "from what: from the sonnet, letter, gold and fine shirts"}
                  - s: "que debía de ser de algún principal enamorado"
                    r: "what he guessed: that it must belong to some distinguished lover"
                    under:
                      - {s: "a quien desdenes y malos tratamientos de su dama debían de haber conducido a algún desesperado término", r: "describes 'enamorado': whom his lady's scorn and cruelty must have driven to some desperate end"}
        forms:
          - {w: "gran", f: "grande (great) clipped before a singular noun ('deseo')."}
          - {w: "quedó", f: "qued- + -ó → quedar (to remain), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "fuese", f: "fu- + -ese → ser (to be), imperfect subjunctive (-se form), he: an open question. Irregular: fuese, fueses, fuese, fuésemos, fueseis, fuesen."}
          - {w: "conjeturando", f: "gerund of conjeturar (to guess)."}
          - {w: "debía de ser", f: "deb- + -ía → deber (must), imperfect, it, + de + ser: 'it must be' (a guess). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "debían de haber conducido", f: "deb- + -ían → deber, same -ía imperfect, they, + de + haber + conducido (participle of conducir, to lead): 'must have led'."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun."}
      - es: "Pero, como por aquel lugar inhabitable y escabroso no parecía persona alguna de quien poder informarse, no se curó de más que de pasar adelante, sin llevar otro camino que aquel que Rocinante quería, que era por donde él podía caminar, siempre con imaginación que no podía faltar por aquellas malezas alguna estraña aventura."
        literal: "But, as through that place uninhabitable and rugged not appeared person any of whom to-be-able to-inform-himself, not himself he-troubled of more than of going forward, without taking other road than that which Rocinante wanted, which was through where he could walk, always with imagination that not could be-lacking among those thickets some strange adventure."
        ormsby: "but as in that uninhabited and rugged spot there was no one to be seen of whom he could inquire, he saw nothing else for it but to push on, taking whatever road Rocinante chose—which was where he could make his way—firmly persuaded that among these wilds he could not fail to meet some rare adventure."
        vocab:
          - {w: "inhabitable", d: "uninhabitable, uninhabited"}
          - {w: "escabroso", d: "rugged, rough"}
          - {w: "parecer", d: "here 'to appear, be seen' (old sense)"}
          - {w: "persona alguna", d: "anyone at all ('alguna' after the noun in a negative = none)"}
          - {w: "informarse", d: "to inquire, get information"}
          - {w: "curarse de", d: "to bother about, care about (old sense of curar)"}
          - {w: "pasar adelante", d: "to go on, push on"}
          - {w: "maleza", d: "thicket, scrub, undergrowth"}
          - {w: "estraño", d: "strange, extraordinary; modern 'extraño'"}
        diagram:
          - s: "no se curó de más que de pasar adelante"
            r: "main verb (after 'Pero'): he did not bother with anything but pushing on"
            under:
              - s: "como por aquel lugar inhabitable y escabroso no parecía persona alguna"
                r: "why: as nobody at all was to be seen in that wild place"
                under:
                  - {s: "de quien poder informarse", r: "describes 'persona': of whom he could ask"}
              - s: "sin llevar otro camino que aquel"
                r: "how: taking no road but that one"
                under:
                  - {s: "que Rocinante quería", r: "describes 'aquel': which Rocinante wanted"}
                  - {s: "que era por donde él podía caminar", r: "which was wherever he could walk"}
              - s: "siempre con imaginación"
                r: "how: always with the idea"
                under:
                  - {s: "que no podía faltar por aquellas malezas alguna estraña aventura", r: "what idea: that some strange adventure could not fail to be found in those thickets"}
        forms:
          - {w: "parecía", f: "parec- + -ía → parecer (to appear), imperfect, he/it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "poder informarse", f: "infinitives: poder (to be able) + informarse (to inquire) with 'se'. After 'de quien' Spanish can use a bare infinitive: 'of whom to be able to ask'."}
          - {w: "se curó", f: "cur- + -ó → curarse (to care about), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "quería", f: "quer- + -ía → querer (to want), imperfect, it (Rocinante). Same -ía imperfect."}
          - {w: "era", f: "ser (to be), imperfect, it. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "podía", f: "pod- + -ía → poder (can), imperfect, he/it. Same -ía imperfect."}
          - {w: "alguna estraña", f: "feminine to match 'aventura'; 'estraña' = extraña."}
        note: "Letting the horse choose the road is a habit of the knights-errant in the romances, which Don Quijote adopted in Chapter 2."
  - sentences:
      - es: "Yendo, pues, con este pensamiento, vio que, por cima de una montañuela que delante de los ojos se le ofrecía, iba saltando un hombre, de risco en risco y de mata en mata, con estraña ligereza."
        literal: "Going, then, with this thought, he-saw that, over top of a little-mountain that before of the eyes itself to-him offered, went jumping a man, from crag to crag and from bush to bush, with strange lightness."
        ormsby: "As he went along, then, occupied with these thoughts, he perceived on the summit of a height that rose before their eyes a man who went springing from rock to rock and from tussock to tussock with marvellous agility."
        vocab:
          - {w: "por cima de", d: "over the top of (modern 'por encima de')"}
          - {w: "montañuela", d: "small mountain, hillock (montaña + -uela)"}
          - {w: "ofrecerse", d: "to present itself, appear"}
          - {w: "risco", d: "crag, rock"}
          - {w: "mata", d: "bush, shrub, tussock"}
          - {w: "ligereza", d: "lightness, agility, speed"}
        diagram:
          - s: "vio"
            r: "main verb: he saw"
            under:
              - {s: "Yendo, pues, con este pensamiento", r: "when: going along, then, with this thought"}
              - s: "que ... iba saltando un hombre"
                r: "what he saw: that a man was leaping along"
                under:
                  - s: "por cima de una montañuela"
                    r: "where: over the top of a hillock"
                    under:
                      - {s: "que delante de los ojos se le ofrecía", r: "describes 'montañuela': that rose before his eyes"}
                  - {s: "de risco en risco y de mata en mata", r: "how: from crag to crag and bush to bush"}
                  - {s: "con estraña ligereza", r: "how: with extraordinary agility"}
        forms:
          - {w: "Yendo", f: "the gerund of ir (to go): 'going'. Irregular: yendo."}
          - {w: "vio", f: "v- + -io → ver (to see), preterite, he. Irregular: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "se le ofrecía", f: "ofrec- + -ía → ofrecerse (to present itself), imperfect, it, with 'le' (to him). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "iba saltando", f: "iba = ir, imperfect, he (iba, ibas, iba, íbamos, ibais, iban), + saltando, gerund of saltar (to leap): 'was going along leaping'."}
          - {w: "montañuela", f: "montaña + -uela, a diminutive: 'little mountain'."}
      - es: "Figurósele que iba desnudo, la barba negra y espesa, los cabellos muchos y rabultados, los pies descalzos y las piernas sin cosa alguna; los muslos cubrían unos calzones, al parecer de terciopelo leonado, mas tan hechos pedazos que por muchas partes se le descubrían las carnes."
        literal: "It-seemed-to-him that he-went naked, the beard black and thick, the hairs many and tangled, the feet barefoot and the legs without thing any; the thighs covered some breeches, to-the seeming of velvet tawny, but so made pieces that through many parts themselves to-him were-uncovered the flesh."
        ormsby: "As well as he could make out he was unclad, with a thick black beard, long tangled hair, and bare legs and feet, his thighs were covered by breeches apparently of tawny velvet but so ragged that they showed his skin in several places."
        vocab:
          - {w: "figurársele a uno", d: "to seem to someone, appear to him"}
          - {w: "espeso", d: "thick, bushy"}
          - {w: "rabultado", d: "tangled, matted (a rare word, perhaps a misprint for 'rebultado', bulky)"}
          - {w: "descalzo", d: "barefoot"}
          - {w: "muslo", d: "thigh"}
          - {w: "calzones", d: "breeches"}
          - {w: "al parecer", d: "apparently, by the look of it"}
          - {w: "terciopelo", d: "velvet"}
          - {w: "leonado", d: "tawny, lion-colored"}
          - {w: "hecho pedazos", d: "in tatters, torn to pieces"}
          - {w: "carnes", d: "flesh, bare skin"}
        diagram:
          - s: "Figurósele"
            r: "main verb 1: it seemed to him"
            under:
              - s: "que iba desnudo"
                r: "what seemed: that he was naked"
                under:
                  - {s: "la barba negra y espesa, los cabellos muchos y rabultados, los pies descalzos y las piernas sin cosa alguna", r: "how he looked: black thick beard, a mass of tangled hair, bare feet and legs"}
          - s: "los muslos cubrían unos calzones"
            r: "main verb 2: some breeches covered his thighs (subject after the verb)"
            under:
              - {s: "al parecer de terciopelo leonado", r: "describes 'calzones': apparently of tawny velvet"}
              - s: "mas tan hechos pedazos"
                r: "but so torn"
                under:
                  - {s: "que por muchas partes se le descubrían las carnes", r: "result: that his skin showed through in many places"}
        forms:
          - {w: "Figurósele", f: "figur- + -ó → figurarse (to seem), preterite, it, with 'se' and 'le' (to him) stuck on; modern 'se le figuró'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "iba", f: "ir (to go), imperfect, he. Irregular: iba, ibas, iba, íbamos, ibais, iban."}
          - {w: "negra y espesa", f: "feminine to match 'barba'."}
          - {w: "cubrían", f: "cubr- + -ían → cubrir (to cover), imperfect, they (the breeches). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "hechos", f: "irregular participle of hacer (to make), masculine plural to match 'calzones'."}
          - {w: "se le descubrían", f: "descubr- + -ían → descubrirse (to be uncovered), imperfect, they (the flesh), with 'le' (his). Same -ía imperfect."}
      - es: "Traía la cabeza descubierta, y, aunque pasó con la ligereza que se ha dicho, todas estas menudencias miró y notó el Caballero de la Triste Figura;"
        literal: "He-wore the head uncovered, and, although he-passed with the lightness that has-been said, all these details looked and noted the Knight of the Sad Figure;"
        ormsby: "He was bareheaded, and notwithstanding the swiftness with which he passed as has been described, the Knight of the Rueful Countenance observed and noted all these trifles,"
        vocab:
          - {w: "traer", d: "here 'to wear, have on'"}
          - {w: "descubierto", d: "uncovered, bare"}
          - {w: "menudencia", d: "small detail, trifle"}
        diagram:
          - {s: "Traía la cabeza descubierta", r: "main verb 1: he had his head bare"}
          - s: "todas estas menudencias miró y notó el Caballero de la Triste Figura"
            r: "main verb 2 (after 'y'): the Knight of the Sad Countenance saw and noted all these details"
            under:
              - s: "aunque pasó con la ligereza"
                r: "concession: although he passed with the speed"
                under:
                  - {s: "que se ha dicho", r: "describes 'ligereza': that has been told"}
        forms:
          - {w: "Traía", f: "tra- + -ía → traer (to wear), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "descubierta", f: "irregular participle of descubrir (to uncover), feminine to match 'cabeza'."}
