      - es: "Quédate en paz, causadora de mi guerra, y haga el cielo que los engaños de tu esposo estén siempre encubiertos, porque tú no quedes arrepentida de lo que heciste y yo no tome venganza de lo que no deseo."
        literal: "Remain in peace, causer of my war, and may-make the heaven that the deceits of your husband be always hidden, so-that you not remain repentant of that which you-did and I not take vengeance of that which not I-desire."
        ormsby: "Peace be with thee who hast sent war to me, and Heaven grant that the deceit of thy husband be ever hidden from thee, so that thou repent not of what thou hast done, and I reap not a revenge I would not have."
        vocab:
          - {w: "quedarse en paz", d: "to stay in peace: a farewell, 'peace be with you'"}
          - {w: "causadora", d: "causer, the woman who caused (causar + -dora)"}
          - {w: "haga el cielo que", d: "may heaven grant that"}
          - {w: "engaño", d: "deceit, trick"}
          - {w: "esposo", d: "husband"}
          - {w: "encubierto", d: "hidden, covered up"}
          - {w: "heciste", d: "old form of 'hiciste', you did"}
          - {w: "tomar venganza de", d: "to take revenge for"}
        diagram:
          - s: "Quédate en paz"
            r: "main verb 1: stay in peace (farewell)"
