          - s: "y haga el cielo"
            r: "main verb 2: and may heaven grant"
            under:
              - s: "que los engaños de tu esposo estén siempre encubiertos"
                r: "what: that your husband's deceits be always hidden"
                under:
                  - {s: "porque tú no quedes arrepentida de lo que heciste", r: "purpose 1: so that you don't regret what you did"}
                  - {s: "y yo no tome venganza de lo que no deseo", r: "purpose 2: and I don't get revenge I don't want"}
        forms:
          - {w: "Quédate", f: "qued- + -a → quedarse (to stay), command for tú, with 'te' stuck on and an accent added. The tú command is the same as the he/she present: queda."}
          - {w: "haga", f: "hag- + -a → hacer (to make), present subjunctive, it (the heaven), as a wish: 'may heaven make'. Irregular: haga, hagas, haga, hagamos, hagáis, hagan."}
          - {w: "estén", f: "est- + -én → estar (to be), present subjunctive, they: after 'haga que'. esté, estés, esté, estemos, estéis, estén."}
          - {w: "encubiertos", f: "the irregular participle of encubrir (to hide), masculine plural to match 'engaños'."}
          - {w: "quedes", f: "qued- + -es → quedar (to remain), present subjunctive, you: after 'porque' meaning 'so that'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "arrepentida", f: "participle of arrepentirse (to repent), feminine for the lady."}
          - {w: "heciste", f: "hec- + -iste → hacer (to do), preterite, you: old form of 'hiciste'. Modern: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "tome", f: "tom- + -e → tomar (to take), present subjunctive, I: still after 'porque' (so that). Same -ar subjunctive: -e, -es, -e, -emos, -éis, -en."}
          - {w: "deseo", f: "dese- + -o → desear (to desire), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
        note: "The writer hints that the lady's new husband is not honest: if she found out, she would regret the match, and the deceived lover would be avenged against his will."
      - es: "Acabando de leer la carta, dijo don Quijote:"
