  - sentences:
      - es: "— Por esa trova —dijo Sancho— no se puede saber nada, si ya no es que por ese hilo que está ahí se saque el ovillo de todo."
        literal: "— By that rhyme —said Sancho— not one-can know nothing, if already not it-is that by that thread that is there one-may-draw-out the ball of all."
        ormsby: "“There is nothing to be learned from that rhyme,” said Sancho, “unless by that clue there’s in it, one may draw out the ball of the whole matter.”"
        ormsby_note: "A reference to the proverb, Por el hilo se saca el ovillo, 'by the thread (or clew) the ball is drawn out.' In the sonnet the lady's name is Fili, which Sancho mistakes for hilo or filo. The substitution of 'Chloe' by which the play on the words may be imitated is a happy idea of Jervas's which has been generally adopted by subsequent translators without any acknowledgment."
        vocab:
          - {w: "trova", d: "verse, rhyme, a piece of poetry"}
          - {w: "si ya no es que", d: "unless"}
          - {w: "hilo", d: "thread"}
          - {w: "ovillo", d: "ball of yarn"}
          - {w: "por el hilo se saca el ovillo", d: "proverb: by the thread you pull out the whole ball, i.e. from one clue you work out the rest"}
        diagram:
          - s: "no se puede saber nada"
            r: "main verb: nothing can be known"
            under:
              - {s: "Por esa trova", r: "from what: from that rhyme"}
              - s: "si ya no es que ... se saque el ovillo de todo"
                r: "exception: unless the ball of the whole thing is pulled out"
                under:
                  - s: "por ese hilo"
                    r: "by what: by that thread"
                    under:
                      - {s: "que está ahí", r: "describes 'hilo': that is there"}
          - {s: "dijo Sancho", r: "speech tag: Sancho said"}
        forms:
          - {w: "se puede", f: "pued- + -e → poder (can), present, it, with 'se' (one): 'one can'. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "nada", f: "'anything' here: after 'no', 'nada' makes a correct double negative."}
          - {w: "se saque", f: "saqu- + -e → sacar (to pull out), present subjunctive, it, with 'se' (passive): 'may be pulled out'. c becomes qu before e. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "esa, ese", f: "'that', feminine for 'trova', masculine for 'hilo'."}
        note: "Sancho has misheard 'Fili' as 'hilo' (thread), which leads him straight to his proverb."
