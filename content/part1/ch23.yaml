part: 1
chapter: 23
title_es: "Capítulo XXIII. De lo que le aconteció al famoso don Quijote en Sierra Morena, que fue una de las más raras aventuras que en esta verdadera historia se cuentan"
title_en: "Of what befell Don Quixote in the Sierra Morena, which was one of the rarest adventures related in this veracious history"
paragraphs:
  - sentences:
      - es: "Viéndose tan malparado don Quijote, dijo a su escudero:"
        literal: "Seeing-himself so badly-treated Don Quijote, he-said to his squire:"
        ormsby: "Seeing himself served in this way, Don Quixote said to his squire,"
        vocab:
          - {w: "malparado", d: "in a bad way, badly treated, battered"}
          - {w: "escudero", d: "squire, a knight's attendant"}
        diagram:
          - s: "dijo"
            r: "main verb: he said"
            under:
              - {s: "Viéndose tan malparado don Quijote", r: "when/why: Don Quijote, seeing himself so battered; he is also the subject of 'dijo'"}
              - {s: "a su escudero", r: "to whom: to his squire"}
        forms:
          - {w: "Viéndose", f: "viendo, the gerund of ver (to see), + se (himself), with an accent added to keep the stress: 'seeing himself'."}
          - {w: "malparado", f: "mal + parado, the participle of parar (to leave in a state): 'badly left', masculine to match Don Quijote."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "su", f: "'his', one form for both genders (su, sus); it agrees with 'escudero', not the owner."}
        note: "This follows straight on from Chapter 22, where the galley slaves Don Quijote had freed stoned him and Sancho and stripped them."
  - sentences:
      - es: "— Siempre, Sancho, lo he oído decir, que el hacer bien a villanos es echar agua en la mar."
        literal: "— Always, Sancho, it I-have heard say, that the doing good to peasants is throwing water in the sea."
        ormsby: "“I have always heard it said, Sancho, that to do good to boors is to throw water into the sea."
        ormsby_note: "Proverb. 246."
        vocab:
          - {w: "villano", d: "peasant, commoner, boor (not 'villain'); a person of low birth"}
          - {w: "hacer bien a", d: "to do good to, do a kindness to"}
          - {w: "echar agua en la mar", d: "to throw water into the sea: a wasted effort (proverb)"}
          - {w: "la mar", d: "the sea; 'mar' is often feminine in old and poetic Spanish"}
        diagram:
          - s: "lo he oído decir"
            r: "main verb: I have heard it said"
            under:
              - {s: "Siempre", r: "when: always"}
              - s: "que el hacer bien a villanos es echar agua en la mar"
                r: "what I heard said (repeats 'lo'): that doing good to boors is throwing water into the sea"
                under:
                  - {s: "el hacer bien a villanos", r: "subject: doing good to peasants"}
                  - {s: "echar agua en la mar", r: "what it is: throwing water into the sea"}
        forms:
          - {w: "he oído", f: "he = haber, present, I (he, has, ha, hemos, habéis, han), + oído, the participle of oír (to hear): 'I have heard'."}
          - {w: "lo", f: "'it', pointing forward to the 'que' clause; Spanish often announces a clause with 'lo' first."}
          - {w: "decir", f: "infinitive (to say) after 'oír': 'heard [it] said'. Spanish uses the infinitive where English uses the participle."}
          - {w: "el hacer", f: "the infinitive hacer (to do) with 'el' in front works as a noun: 'the doing'."}
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "echar", f: "infinitive (to throw), here as a noun after 'es': 'is throwing'."}
        note: "A proverb: kindness to the ungrateful is wasted. Don Quijote has just been stoned by the very galley slaves he freed."
      - es: "Si yo hubiera creído lo que me dijiste, yo hubiera escusado esta pesadumbre; pero ya está hecho: paciencia, y escarmentar para desde aquí adelante."
        literal: "If I had believed that which to-me you-said, I would-have avoided this grief; but already it-is done: patience, and to-learn-the-lesson for from here forward."
        ormsby: "If I had believed thy words, I should have avoided this trouble; but it is done now, it is only to have patience and take warning for the future.”"
        vocab:
          - {w: "escusar", d: "to avoid, spare oneself; modern 'excusar' (here 'to avoid', not 'to excuse')"}
          - {w: "pesadumbre", d: "grief, sorrow, trouble"}
          - {w: "escarmentar", d: "to learn one's lesson (from a bad experience), take warning"}
          - {w: "desde aquí adelante", d: "from now on"}
        diagram:
          - s: "yo hubiera escusado esta pesadumbre"
            r: "main clause 1: I would have spared myself this grief"
            under:
              - s: "Si yo hubiera creído"
                r: "condition: if I had believed"
                under:
                  - {s: "lo que me dijiste", r: "object: what you told me"}
          - {s: "pero ya está hecho", r: "main clause 2: but it is done now"}
          - s: "paciencia, y escarmentar"
            r: "what follows: patience, and learn the lesson"
            under:
              - {s: "para desde aquí adelante", r: "for when: from now on"}
        forms:
          - {w: "hubiera creído", f: "hubier- + -a → haber, imperfect subjunctive (-ra form), I, + creído, the participle of creer (to believe): 'if I had believed'. haber in the -ra form: hubiera, hubieras, hubiera, hubiéramos, hubierais, hubieran."}
          - {w: "me dijiste", f: "dij- + -iste → decir (to say), preterite, you, with 'me' (to me). Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "hubiera escusado", f: "the same -ra form of haber (hubiera, hubieras, hubiera, hubiéramos, hubierais, hubieran) + escusado, the participle of escusar (to avoid): here used as a conditional, 'I would have avoided'. Cervantes uses the -ra form in both halves of an 'if' sentence; modern Spanish prefers 'habría escusado' in the second."}
          - {w: "está hecho", f: "está = estar (to be), present, it (estoy, estás, está, estamos, estáis, están), + hecho, the irregular participle of hacer (to do): 'it is done'."}
          - {w: "escarmentar", f: "infinitive (to learn one's lesson) used on its own as a command or resolution: 'and [now] learn'."}
          - {w: "esta", f: "'this', feminine to match 'pesadumbre'."}
  - sentences:
      - es: "— Así escarmentará vuestra merced —respondió Sancho— como yo soy turco;"
        literal: "— So will-learn-the-lesson your grace —answered Sancho— as I am Turk;"
        ormsby: "“Your worship will take warning as much as I am a Turk,” returned Sancho;"
        vocab:
          - {w: "vuestra merced", d: "your worship, your grace: the polite 'you', ancestor of 'usted'; takes a he/she verb"}
          - {w: "así ... como yo soy turco", d: "as surely as I am a Turk, i.e. not at all: a way of saying something will never happen"}
          - {w: "turco", d: "Turk; to Spaniards of 1605 the Ottoman Turk was the great enemy and the opposite of a Christian"}
        diagram:
          - s: "Así escarmentará vuestra merced"
            r: "main verb: your worship will learn your lesson just as much..."
            under:
              - {s: "como yo soy turco", r: "how much: as much as I am a Turk (i.e. never)"}
          - {s: "respondió Sancho", r: "speech tag: Sancho answered"}
        forms:
          - {w: "escarmentará", f: "escarmentar + -á → escarmentar (to learn one's lesson), future, he/she (vuestra merced): 'will learn'. The future adds to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "soy", f: "ser (to be), present, I. soy, eres, es, somos, sois, son."}
        note: "Sancho addresses his master as 'vuestra merced', so the verb is in the he/she form; Don Quijote calls Sancho 'tú'. Swearing by 'as I am a Turk' is Sancho's comic way of saying 'never'."
      - es: "pero, pues dice que si me hubiera creído se hubiera escusado este daño, créame ahora y escusará otro mayor;"
        literal: "but, since you-say that if me you-had believed would-have-been avoided this harm, believe-me now and you-will-avoid another greater;"
        ormsby: "“but, as you say this mischief might have been avoided if you had believed me, believe me now, and a still greater one will be avoided;"
        vocab:
          - {w: "pues", d: "here 'since', giving a reason"}
          - {w: "escusar", d: "to avoid, spare oneself; modern 'excusar'"}
          - {w: "daño", d: "harm, damage, injury"}
          - {w: "otro mayor", d: "another, greater one"}
        diagram:
          - s: "créame ahora"
            r: "main verb 1: believe me now"
            under:
              - s: "pues dice"
                r: "why: since you say"
                under:
                  - s: "que si me hubiera creído se hubiera escusado este daño"
                    r: "what you say: that this harm would have been avoided if you had believed me"
          - s: "y escusará otro mayor"
            r: "main verb 2: and you will avoid a greater one"
        forms:
          - {w: "dice", f: "dic- + -e → decir (to say), present, he/she (vuestra merced): 'you say'. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "hubiera creído", f: "hubier- + -a → haber, imperfect subjunctive (-ra form), he/she (vuestra merced), + creído, participle of creer (to believe): 'if you had believed'. haber in the -ra form: hubiera, hubieras, hubiera, hubiéramos, hubierais, hubieran."}
          - {w: "se hubiera escusado", f: "the same -ra form of haber + escusado (from escusar, to avoid), with 'se' making it passive: 'would have been avoided'. The -ra form here does the work of a conditional."}
          - {w: "créame", f: "cre- + -a → creer (to believe), present subjunctive used as a polite command for vuestra merced, + me: 'believe me'. The present subjunctive of -er verbs: -a, -as, -a, -amos, -áis, -an. The accent is added because 'me' is stuck on."}
          - {w: "escusará", f: "escusar + -á → escusar (to avoid), future, he/she (vuestra merced). The future adds to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "este", f: "'this', masculine to match 'daño'."}
      - es: "porque le hago saber que con la Santa Hermandad no hay usar de caballerías, que no se le da a ella por cuantos caballeros andantes hay dos maravedís;"
        literal: "because to-you I-make know that with the Holy Brotherhood not there-is to-use of chivalries, for not it-matters to-it to her for as-many-as knights errant there-are two maravedís;"
        ormsby: "for I tell you chivalry is of no account with the Holy Brotherhood, and they don’t care two maravedis for all the knights-errant in the world;"
        vocab:
          - {w: "hacer saber", d: "to let someone know, inform"}
          - {w: "Santa Hermandad", d: "the Holy Brotherhood, a rural police force set up by Ferdinand and Isabella to hunt highwaymen; Don Quijote has just freed galley slaves, a crime they would punish"}
          - {w: "no hay usar de", d: "there is no using, it's no use; old construction 'no hay + infinitive'"}
          - {w: "caballerías", d: "deeds or customs of chivalry"}
          - {w: "no se le da (nada) por", d: "it doesn't care about, doesn't give a fig for"}
          - {w: "maravedí", d: "a small copper coin, the smallest unit of money; 'dos maravedís' = two farthings"}
        diagram:
          - s: "le hago saber"
            r: "main verb (after 'porque'): I let you know"
            under:
              - s: "que con la Santa Hermandad no hay usar de caballerías"
                r: "what I tell you: that with the Holy Brotherhood chivalry is no use"
                under:
                  - s: "que no se le da a ella"
                    r: "why: for it does not care"
                    under:
                      - {s: "por cuantos caballeros andantes hay", r: "about what: for all the knights-errant there are"}
                      - {s: "dos maravedís", r: "how much: two maravedís"}
        forms:
          - {w: "hago", f: "hag- + -o → hacer (to make), present, I. Irregular: hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "le", f: "'to you', for vuestra merced (le is the he/she/you-formal indirect pronoun)."}
          - {w: "saber", f: "infinitive (to know) after 'hacer': 'make [you] know'."}
          - {w: "hay", f: "the special present of haber (to have) meaning 'there is / there are'."}
          - {w: "usar", f: "infinitive (to use) after 'no hay': 'there is no using'."}
          - {w: "no se le da", f: "d- + -a → dar (to give), present, it, with 'se' (impersonal) and 'le' (to it): 'it does not matter to it'. Present of dar: doy, das, da, damos, dais, dan. 'a ella' repeats 'le' for the Hermandad."}
          - {w: "cuantos", f: "cuant- + -os → cuanto (as many as), masculine plural to match 'caballeros': 'all the knights that'."}
          - {w: "caballeros andantes", f: "andante, from andar (to walk, go about), is the old present participle: 'wandering'; plural with 'caballeros'."}
        note: "The Santa Hermandad, founded in 1476, had its own archers and summary justice in the countryside, which is why Sancho fears their arrows."
      - es: "y sepa que ya me parece que sus saetas me zumban por los oídos."
        literal: "and know that already to-me it-seems that their arrows to-me buzz by the ears."
        ormsby: "and I can tell you I fancy I hear their arrows whistling past my ears this minute.”"
        vocab:
          - {w: "saeta", d: "arrow, dart"}
          - {w: "zumbar", d: "to buzz, whizz, whistle (of something flying past)"}
          - {w: "oído", d: "ear (the inner ear, hearing); 'oreja' is the outer ear"}
        diagram:
          - s: "y sepa"
            r: "main verb: and know (you, polite)"
            under:
              - s: "que ya me parece"
                r: "what to know: that it already seems to me"
                under:
                  - s: "que sus saetas me zumban por los oídos"
                    r: "what seems: that their arrows are whizzing past my ears"
        forms:
          - {w: "sepa", f: "sep- + -a → saber (to know), present subjunctive used as a polite command for vuestra merced: 'know'. Irregular: sepa, sepas, sepa, sepamos, sepáis, sepan."}
          - {w: "me parece", f: "parec- + -e → parecer (to seem), present, it, with 'me' (to me): 'it seems to me'. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (but 'parezco' for I)."}
          - {w: "sus", f: "'their', plural to match 'saetas', not the owners."}
          - {w: "me zumban", f: "zumb- + -an → zumbar (to whizz), present, they, with 'me' (past me). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
  - sentences:
      - es: "— Naturalmente eres cobarde, Sancho —dijo don Quijote—, pero, porque no digas que soy contumaz y que jamás hago lo que me aconsejas, por esta vez quiero tomar tu consejo y apartarme de la furia que tanto temes; mas ha de ser con una condición:"
        literal: "— By-nature you-are coward, Sancho —said Don Quijote—, but, so-that not you-may-say that I-am stubborn and that never I-do that which me you-advise, for this time I-want to-take your counsel and to-remove-myself from the fury that so-much you-fear; but it-has to be with one condition:"
        ormsby: "“Thou art a coward by nature, Sancho,” said Don Quixote, “but lest thou shouldst say I am obstinate, and that I never do as thou dost advise, this once I will take thy advice, and withdraw out of reach of that fury thou so dreadest; but it must be on one condition,"
        vocab:
          - {w: "naturalmente", d: "by nature (not 'of course')"}
          - {w: "cobarde", d: "coward, cowardly"}
          - {w: "porque no", d: "here 'so that ... not, lest' (with the subjunctive)"}
          - {w: "contumaz", d: "stubborn, obstinate (a legal word: contumacious)"}
          - {w: "aconsejar", d: "to advise"}
          - {w: "apartarse de", d: "to move away from, withdraw from"}
          - {w: "haber de", d: "to have to, must ('ha de ser' = it must be)"}
          - {w: "mas", d: "but (no accent; 'más' = more)"}
        diagram:
          - s: "Naturalmente eres cobarde"
            r: "main clause 1: by nature you are a coward"
          - {s: "dijo don Quijote", r: "speech tag: said Don Quijote"}
          - s: "quiero tomar tu consejo y apartarme de la furia"
            r: "main verb 2 (after 'pero'): I am willing to take your advice and withdraw from the fury"
            under:
              - s: "porque no digas"
                r: "purpose: so that you do not say"
                under:
                  - {s: "que soy contumaz", r: "what you might say, 1: that I am stubborn"}
                  - {s: "y que jamás hago lo que me aconsejas", r: "what you might say, 2: that I never do what you advise"}
              - {s: "por esta vez", r: "when: this once"}
              - {s: "que tanto temes", r: "describes 'furia': which you so fear"}
          - s: "mas ha de ser"
            r: "main verb 3: but it must be"
            under:
              - {s: "con una condición", r: "how: on one condition"}
        forms:
          - {w: "eres", f: "ser (to be), present, you. soy, eres, es, somos, sois, son."}
          - {w: "digas", f: "dig- + -as → decir (to say), present subjunctive, you: subjunctive after 'porque' meaning 'so that'. Irregular: diga, digas, diga, digamos, digáis, digan."}
          - {w: "hago", f: "hag- + -o → hacer (to do), present, I. Irregular: hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "aconsejas", f: "aconsej- + -as → aconsejar (to advise), present, you. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "quiero", f: "quier- + -o → querer (to want), present, I. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "tomar, apartarme", f: "infinitives after 'quiero': tomar (to take) and apartarse (to withdraw), with 'me' stuck on the end."}
          - {w: "temes", f: "tem- + -es → temer (to fear), present, you. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "ha de ser", f: "ha = haber, present, it (he, has, ha, hemos, habéis, han), + de + ser (to be): 'it must be'."}
          - {w: "tu", f: "'your' (for tú), no accent; 'tú' with the accent is 'you'."}
      - es: "que jamás, en vida ni en muerte, has de decir a nadie que yo me retiré y aparté deste peligro de miedo, sino por complacer a tus ruegos;"
        literal: "that never, in life nor in death, you-have to say to nobody that I myself withdrew and moved-away from-this danger from fear, but for to-please [to] your pleas;"
        ormsby: "that never, in life or in death, thou art to say to anyone that I retired or withdrew from this danger out of fear, but only in compliance with thy entreaties;"
        vocab:
          - {w: "retirarse", d: "to withdraw, retreat"}
          - {w: "deste", d: "= de este, 'from this' (old contraction)"}
          - {w: "de miedo", d: "out of fear, from fear"}
          - {w: "complacer", d: "to please, to comply with (someone's wishes)"}
          - {w: "ruego", d: "plea, entreaty"}
        diagram:
          - s: "has de decir"
            r: "the condition (continues 'una condición'): you must say"
            under:
              - {s: "que jamás, en vida ni en muerte", r: "when: never, in life or in death; 'jamás' with 'has de decir' = you must never say"}
              - {s: "a nadie", r: "to whom: to anyone"}
              - s: "que yo me retiré y aparté deste peligro"
                r: "what you must never say: that I withdrew from this danger"
                under:
                  - {s: "de miedo", r: "why (the false reason): out of fear"}
                  - {s: "sino por complacer a tus ruegos", r: "the true reason: but to comply with your pleas"}
        forms:
          - {w: "has de decir", f: "has = haber, present, you (he, has, ha, hemos, habéis, han), + de + decir (to say): 'you must say'. With 'jamás' in front: 'you must never say'."}
          - {w: "nadie", f: "'anyone' here: in Spanish a negative ('jamás') before the verb pulls 'nadie' along, a double negative that is correct."}
          - {w: "me retiré y aparté", f: "retir- + -é → retirarse (to withdraw), apart- + -é → apartarse (to move away), preterite, I; one 'me' serves both. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "deste", f: "= de + este (from this), masculine to match 'peligro'."}
          - {w: "complacer", f: "infinitive (to please) after 'por': 'in order to please'."}
          - {w: "tus", f: "'your' (for tú), plural to match 'ruegos'."}
      - es: "que si otra cosa dijeres, mentirás en ello, y desde ahora para entonces, y desde entonces para ahora, te desmiento, y digo que mientes y mentirás todas las veces que lo pensares o lo dijeres."
        literal: "for if other thing you-should-say, you-will-lie in it, and from now for then, and from then for now, you I-give-the-lie, and I-say that you-lie and you-will-lie all the times that it you-should-think or it you-should-say."
        ormsby: "for if thou sayest otherwise thou wilt lie therein, and from this time to that, and from that to this, I give thee lie, and say thou liest and wilt lie every time thou thinkest or sayest it;"
        vocab:
          - {w: "desmentir", d: "to give the lie to, call a liar: the formal insult that started a duel"}
          - {w: "desde ahora para entonces", d: "from now until then (and back again): a legal formula making the statement hold for all time"}
          - {w: "otra cosa", d: "anything else, otherwise"}
        diagram:
          - s: "mentirás en ello"
            r: "main verb 1 (after 'que' = for): you will lie in it"
            under:
              - {s: "si otra cosa dijeres", r: "condition: if you say otherwise"}
          - s: "te desmiento"
            r: "main verb 2 (after 'y'): I give you the lie"
            under:
              - {s: "desde ahora para entonces, y desde entonces para ahora", r: "when: for all time, now and then"}
          - s: "y digo"
            r: "main verb 3: and I say"
            under:
              - s: "que mientes y mentirás"
                r: "what I say: that you lie and will lie"
                under:
                  - {s: "todas las veces que lo pensares o lo dijeres", r: "when: every time you think it or say it"}
        forms:
          - {w: "dijeres", f: "dij- + -eres → decir (to say), future subjunctive, you: 'if you should say'. The future subjunctive of -er and -ir verbs: -iere, -ieres, -iere, -iéremos, -iereis, -ieren; decir uses its preterite stem dij- and drops the i: dijere, dijeres, dijere, dijéremos, dijereis, dijeren. Modern Spanish uses the present 'dices'."}
          - {w: "mentirás", f: "mentir + -ás → mentir (to lie), future, you. The future adds to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "te desmiento", f: "desmient- + -o → desmentir (to give the lie), present, I, with 'te' (you). The stem e becomes ie when stressed: desmiento, desmientes, desmiente, desmentimos, desmentís, desmienten."}
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "mientes", f: "mient- + -es → mentir (to lie), present, you. The stem e becomes ie when stressed: miento, mientes, miente, mentimos, mentís, mienten."}
          - {w: "pensares", f: "pens- + -ares → pensar (to think), future subjunctive, you: 'whenever you should think'. The future subjunctive of -ar verbs: -are, -ares, -are, -áremos, -areis, -aren. Modern Spanish uses 'pienses'."}
        note: "Don Quijote parodies the formal challenge of the duel: to 'give the lie' (desmentir) was the gravest insult between gentlemen, and he gives it in advance, 'from now till then and from then till now', for something Sancho has not yet said."
      - es: "Y no me repliques más, que en sólo pensar que me aparto y retiro de algún peligro, especialmente déste, que parece que lleva algún es no es de sombra de miedo, estoy ya para quedarme, y para aguardar aquí solo, no solamente a la Santa Hermandad que dices y temes, sino a los hermanos de los doce tribus de Israel, y a los siete Macabeos, y a Cástor y a Pólux, y aun a todos los hermanos y hermandades que hay en el mundo."
        literal: "And not to-me answer-back more, for in only thinking that I-move-away and withdraw from some danger, especially from-this-one, which it-seems that carries some it-is-not-it-is of shadow of fear, I-am already for to-stay, and for to-await here alone, not only [to] the Holy Brotherhood that you-say and fear, but [to] the brothers of the twelve tribes of Israel, and [to] the seven Maccabees, and [to] Castor and [to] Pollux, and even [to] all the brothers and brotherhoods that there-are in the world."
        ormsby: "and answer me not again; for at the mere thought that I am withdrawing or retiring from any danger, above all from this, which does seem to carry some little shadow of fear with it, I am ready to take my stand here and await alone, not only that Holy Brotherhood you talk of and dread, but the brothers of the twelve tribes of Israel, and the Seven Maccabees, and Castor and Pollux, and all the brothers and brotherhoods in the world.”"
        vocab:
