            r: "main verb: it was just at the moment"
            under:
              - {s: "y cuando llegó", r: "when: when he arrived"}
              - s: "que alzaba con la punta del lanzón un cojín y una maleta"
                r: "which moment: when he was lifting a saddle-pad and a valise with the pike"
                under:
                  - {s: "asida a él", r: "describes 'maleta': attached to it (the pad)"}
                  - {s: "medio podridos, o podridos del todo, y deshechos", r: "describes both: half rotten, or wholly rotten, and torn"}
        forms:
          - {w: "llegó", f: "lleg- + -ó → llegar (to arrive), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, it. ser's preterite is irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "alzaba", f: "alz- + -aba → alzar (to lift), imperfect, he: 'was lifting'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "asida", f: "participle of asir (to grasp), feminine to match 'maleta'."}
          - {w: "podridos, deshechos", f: "participles of podrir (to rot) and deshacer (to undo), masculine plural because they describe the pad and the valise together: a masculine noun in a pair makes the whole pair masculine."}
      - es: "mas, pesaba tanto, que fue necesario que Sancho se apease a tomarlos, y mandóle su amo que viese lo que en la maleta venía."
        literal: "but, it-weighed so-much, that it-was necessary that Sancho should-dismount to take-them, and ordered-him his master that he-should-see that which in the valise came."
        ormsby: "but so heavy were they that Sancho had to help to take them up, and his master directed him to see what the valise contained."
        vocab:
          - {w: "pesar", d: "to weigh, be heavy"}
          - {w: "apearse", d: "to dismount, get down (from a horse or donkey)"}
          - {w: "mandar", d: "to order, tell (someone to do something)"}
        diagram:
          - s: "mas, pesaba tanto"
            r: "main verb 1: but it weighed so much"
            under:
              - s: "que fue necesario"
                r: "result: that it was necessary"
                under:
                  - {s: "que Sancho se apease a tomarlos", r: "what was needed: that Sancho get down to take them"}
          - s: "y mandóle su amo"
            r: "main verb 2: and his master told him"
            under:
              - {s: "que viese lo que en la maleta venía", r: "what he told him: to see what was in the valise"}
        forms:
          - {w: "pesaba", f: "pes- + -aba → pesar (to weigh), imperfect, it. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "se apease", f: "ape- + -ase → apearse (to dismount), imperfect subjunctive (-se form), he: subjunctive after 'fue necesario que'. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "tomarlos", f: "infinitive tomar (to take) with 'los' (them) stuck on."}
          - {w: "mandóle", f: "mand- + -ó → mandar (to order), preterite, he, with 'le' (him) stuck on; modern 'le mandó'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. Cervantes hangs the pronoun on a verb that opens the clause."}
          - {w: "viese", f: "v- + -iese → ver (to see), imperfect subjunctive (-se form), he: after 'mandar que' (to order that). The -se form of -er verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen."}
          - {w: "venía", f: "ven- + -ía → venir (to come), imperfect, it: here 'was (carried) in'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
  - sentences:
      - es: "Hízolo con mucha presteza Sancho, y, aunque la maleta venía cerrada con una cadena y su candado, por lo roto y podrido della vio lo que en ella había, que eran cuatro camisas de delgada holanda y otras cosas de lienzo, no menos curiosas que limpias, y en un pañizuelo halló un buen montoncillo de escudos de oro; y, así como los vio, dijo:"
        literal: "Did-it with much speed Sancho, and, although the valise came closed with a chain and its padlock, through the torn and rotten of-it he-saw that which in it there-was, which were four shirts of fine holland and other things of linen, not less neat than clean, and in a little-handkerchief he-found a good little-pile of crowns of gold; and, as soon as them he-saw, he-said:"
        ormsby: "Sancho did so with great alacrity, and though the valise was secured by a chain and padlock, from its torn and rotten condition he was able to see its contents, which were four shirts of fine holland, and other articles of linen no less curious than clean; and in a handkerchief he found a good lot of gold crowns, and as soon as he saw them he exclaimed:"
        vocab:
          - {w: "presteza", d: "speed, promptness"}
          - {w: "candado", d: "padlock"}
          - {w: "della", d: "= de ella, 'of it'"}
          - {w: "holanda", d: "holland, fine linen cloth from Holland"}
          - {w: "lienzo", d: "linen cloth"}
          - {w: "curioso", d: "neat, carefully made, fine (false friend: not 'curious')"}
          - {w: "pañizuelo", d: "handkerchief; modern 'pañuelo'"}
          - {w: "montoncillo", d: "little pile, small heap (montón + -cillo)"}
          - {w: "escudo de oro", d: "gold crown, a gold coin worth about 400 maravedís"}
        diagram:
          - {s: "Hízolo con mucha presteza Sancho", r: "main verb 1: Sancho did it very quickly"}
          - s: "vio lo que en ella había"
            r: "main verb 2 (after 'y'): he saw what was in it"
            under:
              - {s: "aunque la maleta venía cerrada con una cadena y su candado", r: "concession: although the valise was closed with a chain and padlock"}
              - {s: "por lo roto y podrido della", r: "how: through its torn and rotten parts"}
              - s: "que eran cuatro camisas de delgada holanda y otras cosas de lienzo"
                r: "describes 'lo que había': which were four fine shirts and other linen"
                under:
                  - {s: "no menos curiosas que limpias", r: "describes 'cosas': no less neat than clean"}
          - s: "halló un buen montoncillo de escudos de oro"
            r: "main verb 3: he found a good little pile of gold crowns"
            under:
              - {s: "en un pañizuelo", r: "where: in a handkerchief"}
          - s: "dijo"
            r: "main verb 4: he said"
            under:
              - {s: "así como los vio", r: "when: as soon as he saw them"}
        forms:
          - {w: "Hízolo", f: "hiz- + -o → hacer (to do), preterite, he, with 'lo' (it) stuck on; modern 'lo hizo'. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "venía cerrada", f: "venía = venir, imperfect, it (venía, venías, venía, veníamos, veníais, venían), + cerrada, participle of cerrar (to close), feminine for 'maleta': 'was (came) closed'."}
          - {w: "lo roto y podrido", f: "'lo' + masculine adjective makes an abstract noun: 'the torn and rotten part'."}
          - {w: "había", f: "hab- + -ía → haber, imperfect, used alone as 'there was' (the past of 'hay'). haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "eran", f: "ser (to be), imperfect, they. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "curiosas, limpias", f: "feminine plural to match 'cosas'."}
          - {w: "halló", f: "hall- + -ó → hallar (to find), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "pañizuelo, montoncillo", f: "diminutives: paño (cloth) + -izuelo, montón (pile) + -cillo, 'little'."}
          - {w: "los vio", f: "v- + -io → ver (to see), preterite, he, with 'los' (them, the coins). Irregular: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— ¡Bendito sea todo el cielo, que nos ha deparado una aventura que sea de provecho!"
        literal: "— Blessed be all the heaven, which to-us has provided an adventure that may-be of profit!"
        ormsby: "“Blessed be all Heaven for sending us an adventure that is good for something!”"
        vocab:
          - {w: "bendito", d: "blessed"}
          - {w: "deparar", d: "to provide, send one's way (said of fate or heaven)"}
          - {w: "de provecho", d: "profitable, useful, of some use"}
        diagram:
          - s: "¡Bendito sea todo el cielo"
            r: "main verb: blessed be all heaven"
