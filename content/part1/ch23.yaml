  - sentences:
      - es: "— Señor —respondió Sancho—, que el retirar no es huir, ni el esperar es cordura, cuando el peligro sobrepuja a la esperanza, y de sabios es guardarse hoy para mañana y no aventurarse todo en un día."
        literal: "— Sir —answered Sancho—, [I say] that the withdrawing not is fleeing, nor the waiting is good-sense, when the danger surpasses [to] the hope, and of wise-men it-is to-keep-oneself today for tomorrow and not to-risk-oneself all in one day."
        ormsby: "“Señor,” replied Sancho, “to retire is not to flee, and there is no wisdom in waiting when danger outweighs hope, and it is the part of wise men to preserve themselves today for tomorrow, and not risk all in one day;"
        vocab:
          - {w: "huir", d: "to flee, run away"}
          - {w: "cordura", d: "good sense, prudence, sanity"}
          - {w: "sobrepujar", d: "to exceed, outweigh, surpass"}
          - {w: "de sabios es", d: "it is the mark of wise men, wise men do"}
          - {w: "guardarse hoy para mañana", d: "to save oneself today for tomorrow (proverbial)"}
          - {w: "aventurarse", d: "to risk oneself, take a chance"}
        diagram:
          - s: "que el retirar no es huir"
            r: "main clause 1: [I say] that retreating is not fleeing"
          - s: "ni el esperar es cordura"
            r: "main clause 2: nor is waiting wisdom"
            under:
              - {s: "cuando el peligro sobrepuja a la esperanza", r: "when: when danger outweighs hope"}
          - s: "y de sabios es"
            r: "main clause 3: and it is the part of wise men"
            under:
              - {s: "guardarse hoy para mañana", r: "subject, 1: to keep oneself today for tomorrow"}
              - {s: "y no aventurarse todo en un día", r: "subject, 2: and not to risk everything in one day"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "el retirar, el esperar", f: "infinitives with 'el' used as nouns: 'retreating', 'waiting'."}
          - {w: "huir", f: "infinitive (to flee) after 'es': 'is fleeing'."}
          - {w: "sobrepuja", f: "sobrepuj- + -a → sobrepujar (to outweigh), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "guardarse, aventurarse", f: "infinitives with 'se' (oneself) stuck on: guardarse (to keep oneself safe), aventurarse (to risk oneself)."}
          - {w: "que", f: "the opening 'que' stands for an unspoken 'I say that': a common start to a reply in speech."}
        note: "Sancho talks in proverbs; 'guardarse hoy para mañana' is the peasant's answer to the knight's idea of honour."
