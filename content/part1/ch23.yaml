  - sentences:
      - es: "Tu falsa promesa y mi cierta desventura me llevan a parte donde antes volverán a tus oídos las nuevas de mi muerte que las razones de mis quejas."
        literal: "Your false promise and my certain misfortune me carry to place where sooner will-return to your ears the news of my death than the words of my complaints."
        ormsby: "Thy false promise and my sure misfortune carry me to a place whence the news of my death will reach thy ears before the words of my complaint."
        vocab:
          - {w: "desventura", d: "misfortune, bad luck"}
          - {w: "cierto", d: "after the noun or in poetry: sure, certain"}
          - {w: "a parte donde", d: "to a place where"}
          - {w: "antes ... que", d: "sooner ... than, before"}
          - {w: "nuevas", d: "news (plural noun)"}
          - {w: "razones", d: "words, speech (not 'reasons')"}
          - {w: "queja", d: "complaint, lament"}
        diagram:
          - s: "me llevan"
            r: "main verb: carry me"
            under:
              - {s: "Tu falsa promesa y mi cierta desventura", r: "subject: your false promise and my sure misfortune"}
              - s: "a parte"
                r: "where to: to a place"
                under:
                  - {s: "donde antes volverán a tus oídos las nuevas de mi muerte que las razones de mis quejas", r: "describes 'parte': where news of my death will reach you before my complaints"}
        forms:
          - {w: "Tu, tus", f: "'your' (for tú): 'tu' before a singular noun, 'tus' before a plural."}
          - {w: "me llevan", f: "llev- + -an → llevar (to carry), present, they, with 'me' (me). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "volverán", f: "volver + -án → volver (to return, reach), future, they. The future adds to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "falsa, cierta", f: "feminine to match 'promesa' and 'desventura'."}
        note: "This letter, in high rhetorical prose full of balanced contrasts, is the first trace of a story that will be told later by its writer."
      - es: "Desechásteme, ¡oh ingrata!, por quien tiene más, no por quien vale más que yo; mas si la virtud fuera riqueza que se estimara, no envidiara yo dichas ajenas ni llorara desdichas propias."
        literal: "You-cast-me-off, oh ungrateful-one!, for who has more, not for who is-worth more than I; but if the virtue were wealth that might-be-esteemed, not would-envy I fortunes of-others nor would-weep misfortunes own."
        ormsby: "Ungrateful one, thou hast rejected me for one more wealthy, but not more worthy; but if virtue were esteemed wealth I should neither envy the fortunes of others nor weep for misfortunes of my own."
        vocab:
          - {w: "desechar", d: "to reject, cast off, throw away"}
          - {w: "ingrato", d: "ungrateful; in love poetry, a cruel lady who doesn't return love"}
          - {w: "valer", d: "to be worth"}
          - {w: "dicha / desdicha", d: "good fortune, happiness / misfortune"}
          - {w: "ajeno", d: "belonging to others"}
          - {w: "propio", d: "one's own"}
        diagram:
          - s: "Desechásteme"
            r: "main verb 1: you rejected me"
            under:
              - {s: "¡oh ingrata!", r: "address: O ungrateful one"}
              - {s: "por quien tiene más", r: "for whom: for one who has more"}
              - {s: "no por quien vale más que yo", r: "not for whom: not for one worth more than I"}
          - s: "no envidiara yo dichas ajenas ni llorara desdichas propias"
            r: "main verb 2 (after 'mas'): I would not envy others' fortune nor weep my own misfortune"
            under:
              - s: "si la virtud fuera riqueza"
                r: "condition: if virtue were wealth"
                under:
                  - {s: "que se estimara", r: "describes 'riqueza': that was valued"}
        forms:
          - {w: "Desechásteme", f: "desech- + -aste → desechar (to reject), preterite, you, with 'me' stuck on and an accent added; modern 'me desechaste'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "ingrata", f: "ingrat- + -a → ingrato (ungrateful), feminine for the lady."}
          - {w: "tiene, vale", f: "tien- + -e → tener (to have), present, he (tengo, tienes, tiene, tenemos, tenéis, tienen); val- + -e → valer (to be worth), present, he (valgo, vales, vale, valemos, valéis, valen)."}
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), it: 'if it were'. Irregular: fuera, fueras, fuera, fuéramos, fuerais, fueran."}
          - {w: "se estimara", f: "estim- + -ara → estimar (to esteem), imperfect subjunctive (-ra form), it, with 'se' (passive): 'were valued'. The -ra form of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran."}
          - {w: "envidiara, llorara", f: "envidi- + -ara → envidiar (to envy), llor- + -ara → llorar (to weep), the same -ra form, I, used as a conditional: 'I would not envy, I would not weep'. Modern Spanish says 'envidiaría', 'lloraría'."}
      - es: "Lo que levantó tu hermosura han derribado tus obras: por ella entendí que eras ángel, y por ellas conozco que eres mujer."
        literal: "That which raised your beauty have thrown-down your deeds: by it I-understood that you-were angel, and by them I-know that you-are woman."
