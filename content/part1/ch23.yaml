        vocab:
          - {w: "el de la Triste Figura", d: "he of the Sad Countenance, i.e. Don Quijote"}
          - {w: "valerse de", d: "to make use of, rely on"}
          - {w: "ánimo", d: "courage, spirit"}
          - {w: "ánima", d: "soul (the life in the body)"}
          - {w: "faltar", d: "to fail, be lacking"}
