          - {w: "han derribado", f: "han = haber, present, they (he, has, ha, hemos, habéis, han), + derribado, participle of derribar (to knock down): 'have knocked down'."}
          - {w: "entendí", f: "entend- + -í → entender (to understand), preterite, I. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "eras", f: "ser (to be), imperfect, you. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "conozco", f: "conozc- + -o → conocer (to know), present, I. Verbs in -cer add z in the I form: conozco, conoces, conoce, conocemos, conocéis, conocen."}
          - {w: "eres", f: "ser (to be), present, you. soy, eres, es, somos, sois, son."}
