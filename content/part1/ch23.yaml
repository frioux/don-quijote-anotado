                  - s: "por no ser hallados"
                    r: "purpose: so as not to be found"
                    under:
                      - {s: "si la Hermandad los buscase", r: "condition: if the Brotherhood should look for them"}
        forms:
          - {w: "Subió", f: "sub- + -ió → subir (to climb up, mount), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "replicarle", f: "infinitive replicar (to reply) after 'sin', with 'le' (to him) stuck on."}
          - {w: "guiando, llevando", f: "gerunds of guiar (to lead) and llevar (to carry), each with its own subject, Sancho, after it: 'Sancho leading', 'Sancho having in mind'."}
          - {w: "se entraron", f: "entr- + -aron → entrarse (to go in), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, it. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "atravesarla", f: "infinitive atravesar (to cross) with 'la' (it, the Sierra) stuck on."}
          - {w: "e ir", f: "'e' replaces 'y' (and) before a word starting with the sound i."}
          - {w: "al Viso", f: "al = a + el: 'to El Viso', the article being part of the town's name."}
          - {w: "ser hallados", f: "ser (to be) + hallados, the participle of hallar (to find), masculine plural for Don Quijote and Sancho: 'be found'."}
          - {w: "buscase", f: "busc- + -ase → buscar (to look for), imperfect subjunctive (-se form), it (the Hermandad): 'should look for'. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
      - es: "Animóle a esto haber visto que de la refriega de los galeotes se había escapado libre la despensa que sobre su asno venía, cosa que la juzgó a milagro, según fue lo que llevaron y buscaron los galeotes."
