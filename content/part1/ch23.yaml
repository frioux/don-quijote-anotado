        vocab:
          - {w: "apostar", d: "to bet, wager"}
          - {w: "mula de alquiler", d: "hired mule, a hack (rented for a journey)"}
          - {w: "hondonada", d: "hollow, dip in the ground"}
        diagram:
          - s: "Apostaré"
            r: "main verb: I'll bet"
            under:
              - s: "que está mirando la mula de alquiler"
                r: "what: that you are looking at the hired mule"
                under:
                  - {s: "que está muerta en esa hondonada", r: "describes 'mula': that lies dead in that hollow"}
        forms:
          - {w: "Apostaré", f: "apostar + -é → apostar (to bet), future, I. The future adds to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "está mirando", f: "está = estar, present, he/she (polite you) (estoy, estás, está, estamos, estáis, están), + mirando, gerund of mirar (to look at): 'you are looking at'. The goatherd uses the polite he/she form to Don Quijote."}
