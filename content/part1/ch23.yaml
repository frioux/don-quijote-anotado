  - sentences:
      - es: "— Paréceme, Sancho, y no es posible que sea otra cosa, que algún caminante descaminado debió de pasar por esta sierra, y, salteándole malandrines, le debieron de matar, y le trujeron a enterrar en esta tan escondida parte."
        literal: "— It-seems-to-me, Sancho, and not it-is possible that it-be other thing, that some traveller lost must-have passed through this mountain-range, and, waylaying-him villains, him they-must-have killed, and him they-brought to bury in this so hidden part."
        ormsby: "“It seems to me, Sancho (and it is impossible it can be otherwise) that some strayed traveller must have crossed this sierra and been attacked and slain by footpads, who brought him to this remote spot to bury him.”"
        vocab:
          - {w: "caminante descaminado", d: "a traveller who has lost his way (a play on camino: 'walker' and 'off the road')"}
          - {w: "deber de", d: "must (probability): 'debió de pasar' = he must have passed"}
          - {w: "sierra", d: "mountain range"}
          - {w: "saltear", d: "to waylay, ambush, rob on the road"}
          - {w: "malandrín", d: "scoundrel, villain (a word from the books of chivalry)"}
          - {w: "trujeron", d: "old form of 'trajeron', they brought"}
        diagram:
          - s: "Paréceme"
            r: "main verb: it seems to me"
            under:
              - {s: "y no es posible que sea otra cosa", r: "aside: and it can't be otherwise"}
              - s: "que algún caminante descaminado debió de pasar por esta sierra"
                r: "what seems, 1: that some lost traveller must have crossed this sierra"
              - s: "le debieron de matar"
                r: "what seems, 2: that they must have killed him"
                under:
                  - {s: "salteándole malandrines", r: "how: villains waylaying him"}
              - s: "y le trujeron a enterrar"
                r: "what seems, 3: and they brought him to bury"
                under:
                  - {s: "en esta tan escondida parte", r: "where: in this so hidden spot"}
        forms:
          - {w: "Paréceme", f: "parec- + -e → parecer (to seem), present, it, with 'me' stuck on; modern 'me parece'. The present of -er verbs: -o, -es, -e, -emos, -éis, -en. Cervantes hangs the pronoun on a verb that opens the clause."}
          - {w: "sea", f: "ser (to be), present subjunctive, it: after 'no es posible que'. sea, seas, sea, seamos, seáis, sean."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun ('caminante')."}
          - {w: "debió de pasar", f: "deb- + -ió → deber (must), preterite, he, + de + pasar (to pass): 'he must have passed'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "salteándole", f: "salteando, the gerund of saltear (to waylay), + le (him), accent added; its subject 'malandrines' comes after."}
          - {w: "le debieron de matar", f: "deb- + -ieron → deber, preterite, they, + de + matar (to kill): 'they must have killed him'. Same -ió/-ieron preterite."}
          - {w: "trujeron", f: "truj- + -eron → traer (to bring), preterite, they: old form of 'trajeron'. Cervantes' forms: truje, trujiste, trujo, trujimos, trujistes, trujeron."}
          - {w: "enterrar", f: "infinitive (to bury) after 'a' of purpose."}
      - es: "— No puede ser eso —respondió Sancho—, porque si fueran ladrones, no se dejaran aquí este dinero."
        literal: "— Not can be that —answered Sancho—, because if they-were thieves, not themselves would-they-leave here this money."
        ormsby: "“That cannot be,” answered Sancho, “because if they had been robbers they would not have left this money.”"
