summary: |
  After being stoned and robbed by the galley slaves he freed, Don Quijote admits that doing good to the ungrateful is wasted effort. Sancho warns that the Holy Brotherhood will be after them for freeing the convicts. Don Quijote agrees to withdraw, on the condition that Sancho never says he did it out of fear, and the two head into the Sierra Morena to hide. Sancho is glad to find their food supply intact and rides along eating from the sack.

  In the mountains they find a rotten saddle-pad and valise. Inside are fine linen shirts, about a hundred gold crowns, which Don Quijote lets Sancho keep, and a notebook. The notebook holds a sonnet to a lady called Fili, whose name Sancho mishears as 'hilo' (thread), and a bitter letter from a rejected lover to a woman who left him for a richer man. Sancho feels that the gold has paid for all his past beatings.

  Soon they see a half-naked, bearded man leaping from rock to rock, too fast for Rocinante to follow. Don Quijote decides he must be the owner of the valise and resolves to find him; Sancho would rather not, since he would have to give back the money. They find the owner's dead mule, and an old goatherd tells them what he knows. Six months ago a well-bred youth came to the sierra asking for its wildest part. Since then he has lived wild and ragged, doing penance for his sins. He sometimes begs food courteously and sometimes, in fits of madness, takes it by force, raging against a 'treacherous Fernando'.

  Just as Don Quijote resolves to search the whole mountain, the youth himself appears, talking to himself. His tattered doublet is perfumed with amber, a sign of rank. He greets them courteously; Don Quijote embraces him at length, and the stranger, whom the narrator calls the Ragged One of the Bad Countenance, stares back at him in equal amazement. What he says is left for the next chapter.
context: |
  Outlaws and the law. The Sierra Morena, which separates La Mancha from Andalusia, was wild country where criminals went to ground; that is why Sancho, fearing arrest, leads his master there. The Santa Hermandad was a rural police force with summary powers, and freeing the king's galley slaves was a serious crime, so Sancho's fear is well-founded. Money matters too: a hundred gold escudos was a fortune to a labourer like Sancho, and his argument for keeping the find 'in good faith' parodies a real legal idea. Rank shows in clothes: fine holland shirts, and a doublet scented with ambergris, tell Don Quijote that the madman is a gentleman.

  The parodied books. A noble lover who goes mad with grief and lives naked in the wilderness is a stock figure of chivalric and pastoral fiction: Orlando in Ariosto's Orlando furioso, and Amadís of Gaul doing penance on the Peña Pobre as Beltenebros. The notebook with its sonnet and love-letter is straight out of the pastoral romances, and the sonnet's paradoxes (adored pain, an ignorant or cruel Love) are the stock in trade of Petrarchan verse. Ormsby notes that Cervantes later reused this sonnet in his play La casa de los celos, so he evidently thought well of it. Don Quijote's claim that knights-errant were all poets and musicians sets up the verse letter to Dulcinea of the coming chapters.

  The narrator's games and a famous slip. As Ormsby explains at length, the first edition of 1605 never says how Sancho lost his donkey, yet a few chapters later the donkey is gone. The second edition added a passage, here and in Ormsby's translation, in which Ginés de Pasamonte steals the ass at night. The Gutenberg text used here follows the first edition, so Sancho still rides his donkey; Ormsby's 'Dapple' paragraphs have no Spanish in this chapter. In Part II Cervantes refers to the matter himself and blames the printer. The narrator also plays with names, pairing the 'Roto de la Mala Figura' with the 'Caballero de la Triste Figura' as a matched pair of lovesick wanderers, and he ends the chapter on a cliffhanger in the manner of the romances.

  Medicine and religion. The goatherd describes the youth's madness as an 'accidente', a fit, with the signs physicians looked for: fixed staring, clenched lips, arched brows, sudden violence. Humoral medicine is behind the description of Rocinante as 'flemático'. The madman says he is doing penance imposed for his sins, and asks for food 'por amor de Dios', the beggar's formula. The goatherds plan to take him to Almodóvar to be treated, which suggests that a town might offer a physician or a hospital.

  Names. Fili (Phyllis) is a stock pastoral name, and Sancho's mishearing of it as 'hilo' leads him to the proverb 'por el hilo se saca el ovillo'. Ormsby, following Jervas, renders it Chloe to keep a pun ('clue'). 'Fementido Fernando' gives the villain of the coming story a name before we know anything else about him. El Viso and Almodóvar del Campo are real towns of La Mancha on the northern edge of the Sierra Morena.

  Reading Cervantes' Spanish. The chapter mixes high rhetorical prose (the letter's balanced antitheses), a Petrarchan sonnet, and the goatherd's rustic speech ('allombre', 'caya', 'sotil', 'víamos'). Look out for archaisms: mesmo, ansí, cuasi, priesa, estraño, recebir, heciste, trujeron, luengo; contractions with 'de' (deste, desta, destas, della, dellos); old -astes/-istes for -asteis/-isteis ('hallastes', 'vistes'); -rl- written -ll- ('buscalle', 'seguille', 'decille', 'pedillo'); pronouns hung on a verb that opens the clause ('Animóle', 'Reducíansele', 'Figurósele', 'Quitámossele'); the -ra form used as a conditional ('se dejaran', 'matara', 'fuera mejor'); the future subjunctive ('dijeres', 'pensares', 'pudieres'); 'ha seis meses' for 'hace seis meses'; and 'tener de' for 'tener que'. False friends here include curioso (neat, careful), razones (words), relieves (leftovers), calidad (rank), pariente (relative), desgracia (misfortune), puesto que (although) and ignorar (not to know).
