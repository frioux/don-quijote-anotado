                r: "except: than to satisfy his stomach with the leftovers"
                under:
                  - {s: "que del despojo clerical habían quedado", r: "describes 'relieves': that were left from the clerical spoils"}
        forms:
          - {w: "llevaba", f: "llev- + -aba → llevar (to carry, have), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "le pareció", f: "parec- + -ió → parecer (to seem), preterite, it, with 'le' (to him). The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "caminaba", f: "camin- + -aba → caminar (to travel), imperfect, he. Same -aba imperfect."}
          - {w: "satisfacer", f: "infinitive (to satisfy) after 'de'."}
          - {w: "del", f: "de + el fused: 'from the'."}
          - {w: "habían quedado", f: "habían = haber, imperfect, they (había, habías, había, habíamos, habíais, habían), + quedado, participle of quedar (to remain): 'had remained'."}
      - es: "y así, iba tras su amo sentado a la mujeriega sobre su jumento, sacando de un costal y embaulando en su panza;"
        literal: "and so, he-went behind his master seated in the woman's-way on his donkey, taking-out from a sack and packing in his belly;"
        ormsby: "and so he marched behind his master laden with what Dapple used to carry, emptying the sack and packing his paunch,"
        ormsby_match: false
        ormsby_note: "'Dapple,' as I have said elsewhere, is not a correct translation of rucio, but it has by long usage acquired a prescriptive right to remain the name of Sancho's ass. Rucio is properly a light or silvery gray, as pardo is a dark or iron gray. The passage (beginning at 'That night they reached the very heart,' etc., and ending with 'returned thanks for the kindness shown him by Don Quixote') does not appear in the first edition, in which there is no allusion to the loss of the ass until the middle of Chapter XXV, where, without any explanation of how it happened, Cervantes speaks of Dapple as having been lost. When the second edition was in the press, an attempt was made to remedy the oversight, and the printer, apparently proprio motu, supplied this passage. Chapter XXX, where Don Quixote laments the loss of his 'good sword,' suggested Ginés de Pasamonte as the thief, and Chapter XXV the promise of the ass-colts; but in such a bungling manner was the correction made that the references to the ass as if still in Sancho's possession (nine or ten in number) were left unaltered, though the first of them occurs only four or five lines after the inserted passage. In the third edition of 1608 some of these inconsistencies were removed, and in the Second Part Cervantes refers to the matter, and charges the printer with the blunder. What he originally intended, no doubt, was to supplement the burlesque of the penance of Amadís by a burlesque of Brunello's theft of Sacripante's horse and Marfisa's sword at the siege of Albracca, as described by Boiardo and Ariosto; and it was very possibly an afterthought written on a loose leaf and so mislaid or lost in transitu. The inserted passage is clearly not his, as it is completely ignored by him in chapters III, IV, and XXVII of Part II, and is inconsistent with the account of the affair which he gives there. Hartzenbusch removes the passage to what he conceives to be its proper place in Chapter Chapter XXV, but it is hardly worth while, perhaps, to alter the familiar arrangement of the next. See notes on Chapter XXC; and III, IV, and XXVII of Part II."
        vocab:
          - {w: "a la mujeriega", d: "side-saddle, sitting sideways as women rode"}
          - {w: "jumento", d: "donkey, ass"}
          - {w: "costal", d: "sack, large bag"}
          - {w: "embaular", d: "to pack into a trunk (baúl); here jokingly, to stuff into his belly"}
          - {w: "panza", d: "belly, paunch (a pun on Sancho's surname, Panza)"}
        diagram:
          - s: "iba tras su amo"
            r: "main verb (after 'y así'): he went behind his master"
            under:
              - {s: "sentado a la mujeriega sobre su jumento", r: "how: sitting side-saddle on his donkey"}
              - {s: "sacando de un costal", r: "what he did, 1: taking [food] out of a sack"}
              - {s: "y embaulando en su panza", r: "what he did, 2: and packing it into his belly"}
        forms:
          - {w: "iba", f: "ir (to go), imperfect, he. Irregular: iba, ibas, iba, íbamos, ibais, iban."}
          - {w: "sentado", f: "participle of sentar (to seat), masculine for Sancho: 'seated'."}
          - {w: "sacando, embaulando", f: "gerunds of sacar (to take out) and embaular (to pack in): 'taking out ... packing in'."}
          - {w: "su", f: "'his', one form for both genders (su, sus); it agrees with the noun, not the owner."}
        note: "In this text (the first edition) Sancho still rides his donkey. Ormsby follows the second edition, which inserts a passage where Ginés de Pasamonte steals the ass in the night; hence his 'laden with what Dapple used to carry'. That inserted passage has no Spanish here."
      - es: "y no se le diera por hallar otra ventura, entretanto que iba de aquella manera, un ardite."
        literal: "and not itself to-him would-it-matter for finding another adventure, meanwhile that he-went in that manner, a farthing."
        ormsby: "and so long as he could go that way, he would not have given a farthing to meet with another adventure."
        vocab:
          - {w: "no dársele a uno un ardite", d: "not to care a farthing; 'ardite' was a tiny old coin"}
          - {w: "ventura", d: "here 'adventure' (also 'luck')"}
          - {w: "entretanto que", d: "while, so long as"}
        diagram:
          - s: "y no se le diera ... un ardite"
            r: "main verb: and he would not have cared a farthing"
            under:
              - {s: "por hallar otra ventura", r: "for what: about finding another adventure"}
              - {s: "entretanto que iba de aquella manera", r: "when: so long as he went along that way"}
        forms:
          - {w: "se le diera", f: "d- + -iera → dar (to give), imperfect subjunctive (-ra form), it, with 'se' and 'le' (to him), used as a conditional: 'it would not matter to him'. dar in the -ra form: diera, dieras, diera, diéramos, dierais, dieran. Cervantes often uses the -ra form where modern Spanish says 'daría'."}
          - {w: "hallar", f: "infinitive (to find) after 'por'."}
          - {w: "iba", f: "ir (to go), imperfect, he. Irregular: iba, ibas, iba, íbamos, ibais, iban."}
          - {w: "aquella", f: "'that', feminine to match 'manera'."}
  - sentences:
      - es: "En esto, alzó los ojos y vio que su amo estaba parado, procurando con la punta del lanzón alzar no sé qué bulto que estaba caído en el suelo, por lo cual se dio priesa a llegar a ayudarle si fuese menester;"
        literal: "In this, he-raised the eyes and saw that his master was stopped, trying with the point of-the pike to-lift not I-know what bundle that was fallen on the ground, for which he-gave-himself haste to arrive to help-him if it-were needful;"
        ormsby: "While so engaged he raised his eyes and saw that his master had halted, and was trying with the point of his pike to lift some bulky object that lay upon the ground, on which he hastened to join him and help him if it were needful,"
        vocab:
          - {w: "en esto", d: "at this point, meanwhile"}
          - {w: "procurar", d: "to try to (not 'procure')"}
          - {w: "lanzón", d: "short thick pike; Don Quijote's lance was broken, and he now carries a pike"}
          - {w: "no sé qué", d: "some ... or other (literally 'I don't know what')"}
          - {w: "bulto", d: "bundle, bulky object, shape"}
          - {w: "darse priesa", d: "to hurry; 'priesa' = modern 'prisa'"}
          - {w: "ser menester", d: "to be needed, necessary"}
        diagram:
          - {s: "alzó los ojos", r: "main verb 1: he (Sancho) raised his eyes"}
          - s: "y vio"
            r: "main verb 2: and saw"
            under:
              - s: "que su amo estaba parado"
                r: "what he saw: that his master had stopped"
                under:
                  - s: "procurando con la punta del lanzón alzar no sé qué bulto"
                    r: "what the master was doing: trying to lift some bundle with the point of his pike"
                    under:
                      - {s: "que estaba caído en el suelo", r: "describes 'bulto': that lay on the ground"}
          - s: "por lo cual se dio priesa"
            r: "main verb 3: for which reason he hurried"
            under:
              - {s: "a llegar a ayudarle", r: "to do what: to get there and help him"}
              - {s: "si fuese menester", r: "condition: if it were needed"}
        forms:
          - {w: "alzó", f: "alz- + -ó → alzar (to raise), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "vio", f: "v- + -io → ver (to see), preterite, he. Irregular: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "estaba parado", f: "estaba = estar, imperfect, he (estaba, estabas, estaba, estábamos, estabais, estaban), + parado, participle of parar (to stop): 'was stopped, at a halt'."}
          - {w: "procurando", f: "gerund of procurar (to try): 'trying'."}
          - {w: "sé", f: "saber (to know), present, I. Irregular: sé, sabes, sabe, sabemos, sabéis, saben. The accent tells it from 'se'."}
          - {w: "estaba caído", f: "estar + caído, participle of caer (to fall): 'was lying fallen'."}
          - {w: "se dio", f: "d- + -io → darse (to give oneself), preterite, he. Irregular: di, diste, dio, dimos, disteis, dieron."}
          - {w: "ayudarle", f: "infinitive ayudar (to help) with 'le' (him) stuck on."}
          - {w: "fuese", f: "fu- + -ese → ser (to be), imperfect subjunctive (-se form), it: 'if it were'. Irregular: fuese, fueses, fuese, fuésemos, fueseis, fuesen."}
          - {w: "priesa", f: "= prisa (haste), an old spelling."}
      - es: "y cuando llegó fue a tiempo que alzaba con la punta del lanzón un cojín y una maleta asida a él, medio podridos, o podridos del todo, y deshechos;"
        literal: "and when he-arrived it-was at time that he-was-lifting with the point of-the pike a saddle-cushion and a valise attached to it, half rotten, or rotten of-the whole, and undone;"
        ormsby: "and reached him just as with the point of the pike he was raising a saddle-pad with a valise attached to it, half or rather wholly rotten and torn;"
