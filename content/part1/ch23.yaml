        ormsby_note: "This sonnet Cervantes afterwards inserted in his comedy of the Casa de los Zelos, a proof that he himself had as good an opinion of it as Don Quixote; though Clemencín says, and not without some reason, that 'it is no great things', 'no vale gran cosa.'"
