          - {w: "hubiera gastado", f: "hubier- + -a → haber, -ra form, I (hubiera, hubieras, hubiera, hubiéramos, hubierais, hubieran), + gastado, participle of gastar (to spend): 'I had spent'."}
          - {w: "hacía", f: "hac- + -ía → hacer (to make), imperfect, he, used for a vivid conditional: 'would make'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
