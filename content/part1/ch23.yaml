        ormsby: "They brought back to his memory the marvellous adventures that had befallen knights-errant in like solitudes and wilds,"
        vocab:
          - {w: "reducirse a la memoria", d: "to come back to mind (old use of reducir = to bring back)"}
          - {w: "acaecimiento", d: "happening, event, occurrence"}
          - {w: "semejante", d: "similar, such"}
          - {w: "soledad", d: "solitude; a lonely place"}
          - {w: "suceder", d: "to happen (not 'to succeed')"}
        diagram:
          - s: "Reducíansele a la memoria"
            r: "main verb: came back to his memory"
            under:
              - s: "los maravillosos acaecimientos"
