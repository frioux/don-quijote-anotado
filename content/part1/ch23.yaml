  - sentences:
      - es: "— Verdad dices —dijo don Quijote—, y así, no adivino ni doy en lo que esto pueda ser; mas, espérate: veremos si en este librillo de memoria hay alguna cosa escrita por donde podamos rastrear y venir en conocimiento de lo que deseamos."
        literal: "— Truth you-say —said Don Quijote—, and so, not I-guess nor I-hit on that which this may be; but, wait: we-will-see if in this little-book of memory there-is some thing written by where we-may trace and come into knowledge of that which we-desire."
        ormsby: "“Thou art right,” said Don Quixote, “and I cannot guess or explain what this may mean; but stay; let us see if in this memorandum book there is anything written by which we may be able to trace out or discover what we want to know.”"
        vocab:
          - {w: "adivinar", d: "to guess"}
          - {w: "dar en", d: "to hit upon, work out"}
          - {w: "rastrear", d: "to track, trace"}
          - {w: "venir en conocimiento de", d: "to come to know, find out"}
        diagram:
          - {s: "Verdad dices", r: "main verb 1: you are right"}
          - s: "no adivino ni doy en"
            r: "main verbs 2 and 3 (after 'y así'): I can't guess or work out"
            under:
              - {s: "lo que esto pueda ser", r: "object: what this may be"}
          - {s: "espérate", r: "main verb 4 (after 'mas'): wait"}
          - s: "veremos"
            r: "main verb 5: we'll see"
            under:
              - s: "si en este librillo de memoria hay alguna cosa escrita"
                r: "what we'll see: whether there's anything written in this notebook"
                under:
                  - {s: "por donde podamos rastrear y venir en conocimiento de lo que deseamos", r: "describes 'cosa': by which we can trace and find out what we want"}
        forms:
          - {w: "dices", f: "dic- + -es → decir (to say), present, you. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "adivino", f: "adivin- + -o → adivinar (to guess), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "doy", f: "dar (to give), present, I. doy, das, da, damos, dais, dan."}
          - {w: "pueda", f: "pued- + -a → poder (can), present subjunctive, it: a guess. The stem o becomes ue when stressed: pueda, puedas, pueda, podamos, podáis, puedan."}
          - {w: "espérate", f: "esper- + -a → esperar (to wait), command for tú, with 'te' stuck on and an accent added: 'wait'. The tú command is the same as the he/she present: espera."}
          - {w: "veremos", f: "ver + -emos → ver (to see), future, we. The future adds to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "escrita", f: "the irregular participle of escribir (to write), feminine to match 'cosa'."}
          - {w: "podamos", f: "pod- + -amos → poder (can), present subjunctive, we: subjunctive because it is a hoped-for thing. pueda, puedas, pueda, podamos, podáis, puedan."}
          - {w: "deseamos", f: "dese- + -amos → desear (to want), present, we. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
  - sentences:
