          - {w: "estoy", f: "estar (to be), present, I. estoy, estás, está, estamos, estáis, están."}
          - {w: "te quieras valer", f: "quier- + -as → querer (to want), present subjunctive, you, + valerse (to rely), with 'te' moved in front: 'that you want to rely'. Subjunctive after 'contento de que'. The stem e becomes ie: quiera, quieras, quiera, queramos, queráis, quieran."}
          - {w: "ha de faltar", f: "ha = haber, present, it (he, has, ha, hemos, habéis, han), + de + faltar (to fail): 'is to fail', a future."}
          - {w: "falte", f: "falt- + -e → faltar (to fail), present subjunctive, it: after 'aunque' for a supposition. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
