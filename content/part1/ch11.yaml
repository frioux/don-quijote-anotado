      - es: "Teresa del Berrocal, yo alabándote, me dijo: «Tal piensa que adora a un ángel, y viene a adorar a un jimio; merced a los muchos dijes y a los cabellos postizos, y a hipócritas hermosuras, que engañan al Amor mismo»."
        literal: "Teresa of-the Rocky-place, I praising-you, to-me said: «Such-a-one thinks that he-adores [to] an angel, and comes to adore [to] a monkey; thanks to the many trinkets and to the hairs false, and to hypocritical beauties, which deceive [to]-the Love himself»."
        ormsby: "For Teresa of the hillside / At my praise of thee was sore; / Said, “You think you love an angel; / It’s a monkey you adore; / “Caught by all her glittering trinkets, / And her borrowed braids of hair, / And a host of made-up beauties / That would Love himself ensnare.”"
        vocab:
          - {w: "Berrocal", d: "a place name meaning 'rocky ground' (berrueco = granite boulder); Teresa from the Rocks"}
          - {w: "alabar", d: "to praise"}
          - {w: "tal", d: "here a pronoun: such a one, a certain man"}
          - {w: "venir a", d: "+ infinitive: to end up (doing)"}
          - {w: "jimio", d: "= simio, ape, monkey"}
          - {w: "merced a", d: "thanks to"}
          - {w: "dije", d: "trinket, charm, small jewel"}
          - {w: "postizo", d: "false, artificial"}
          - {w: "hipócrita", d: "hypocritical, sham"}
          - {w: "hermosura", d: "beauty; here, painted-on beauties, make-up"}
          - {w: "Amor", d: "Love, Cupid"}
        diagram:
          - s: "me dijo:"
            r: "main verb: said to me"
            under:
              - {s: "Teresa del Berrocal", r: "subject"}
              - {s: "yo alabándote", r: "when: as I was praising you"}
              - {s: "Tal piensa que adora a un ángel", r: "what she said, 1: a man thinks he adores an angel"}
              - s: "y viene a adorar a un jimio"
                r: "what she said, 2: and ends up adoring a monkey"
                under:
                  - s: "merced a los muchos dijes y a los cabellos postizos, y a hipócritas hermosuras"
                    r: "why: thanks to the trinkets, the false hair and the sham beauties"
                    under:
                      - {s: "que engañan al Amor mismo", r: "describes these tricks: that fool Love himself"}
        forms:
          - {w: "alabándote", f: "alabando, the gerund of alabar (to praise), + te (you), with an accent added to keep the stress. With its own subject 'yo' before it, it means 'as I was praising you'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, she. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "piensa", f: "piens- + -a → pensar (to think), present, he. The stem e becomes ie when stressed: pienso, piensas, piensa, pensamos, pensáis, piensan."}
          - {w: "adora", f: "ador- + -a → adorar (to adore), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "viene", f: "vien- + -e → venir (to come), present, he. Irregular: vengo, vienes, viene, venimos, venís, vienen."}
          - {w: "adorar", f: "infinitive after 'viene a'."}
          - {w: "muchos, postizos", f: "masculine plural to match 'dijes' and 'cabellos'."}
          - {w: "hipócritas", f: "hipócrita + -s, plural; the -a ending serves both genders."}
          - {w: "engañan", f: "engañ- + -an → engañar (to deceive), present, they. Same -ar present."}
