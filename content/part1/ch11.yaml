            r: "main verb: I hold firm"
            under:
              - {s: "Porque sé que eres sabida", r: "why: because I know you are wise"}
              - {s: "en que me quieres", r: "in what: in the belief that you love me"}
          - s: "que nunca fue desdichado amor"
            r: "loose 'que' = for: love was never unlucky"
            under:
              - {s: "que fue conocido", r: "describes 'amor': that was known"}
        forms:
          - {w: "sé", f: "saber (to know), present, I. Irregular: sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "eres", f: "ser (to be), present, you. soy, eres, es, somos, sois, son."}
          - {w: "sabida", f: "sabid- + -a → sabido, the participle of saber, feminine for Olalla, in the old active sense 'knowing'."}
          - {w: "quieres", f: "quier- + -es → querer (to love), present, you. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "me afirmo", f: "afirm- + -o → afirmarse (to hold firm), present, I, with 'me' (myself). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, it, twice. ser's preterite is irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "desdichado, conocido", f: "masculine singular, matching 'amor'."}
        note: "The last two lines are proverbial: love that is known to its object is never unhappy, because a wise girl who knows she is loved cannot fail to respond."
      - es: "Bien es verdad que tal vez, Olalla, me has dado indicio que tienes de bronce el alma y el blanco pecho de risco."
