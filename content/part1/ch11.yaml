part: 1
chapter: 11
title_es: "Capítulo XI. De lo que le sucedió a don Quijote con unos cabreros"
title_en: "What befell Don Quixote with certain goatherds"
paragraphs:
  - sentences:
      - es: "Fue recogido de los cabreros con buen ánimo; y, habiendo Sancho, lo mejor que pudo, acomodado a Rocinante y a su jumento, se fue tras el olor que despedían de sí ciertos tasajos de cabra que hirviendo al fuego en un caldero estaban;"
        literal: "He-was taken-in by the goatherds with good spirit; and, having Sancho, the best that he-could, settled [to] Rocinante and [to] his donkey, he-went-off after the smell that gave-off from themselves certain strips-of-dried-meat of goat that boiling at-the fire in a cauldron were;"
        ormsby: "He was cordially welcomed by the goatherds, and Sancho, having as best he could put up Rocinante and the ass, drew towards the fragrance that came from some pieces of salted goat simmering in a pot on the fire;"
        vocab:
          - {w: "recoger", d: "to take in, give shelter to; 'fue recogido de' = was taken in by"}
          - {w: "cabrero", d: "goatherd"}
          - {w: "con buen ánimo", d: "kindly, with goodwill"}
          - {w: "lo mejor que pudo", d: "as best he could"}
          - {w: "acomodar", d: "to settle, put up, see to (animals for the night)"}
          - {w: "jumento", d: "donkey, ass"}
          - {w: "irse tras", d: "to go off after, follow"}
          - {w: "despedir de sí", d: "to give off, send out (a smell)"}
          - {w: "tasajo", d: "strip of salted, dried meat; jerky"}
          - {w: "cabra", d: "goat"}
          - {w: "hervir", d: "to boil, simmer"}
          - {w: "caldero", d: "cauldron, cooking pot"}
        diagram:
          - s: "Fue recogido"
            r: "main verb 1: he (Don Quijote) was taken in"
            under:
              - {s: "de los cabreros", r: "by whom: 'de' marks the doer, where modern Spanish uses 'por'"}
              - {s: "con buen ánimo", r: "how: kindly"}
          - s: "se fue"
            r: "main verb 2 (after 'y'): he (Sancho) went off"
            under:
              - {s: "habiendo Sancho, lo mejor que pudo, acomodado a Rocinante y a su jumento", r: "when: once Sancho had seen to Rocinante and his donkey as best he could; Sancho is also the subject of 'se fue'"}
              - s: "tras el olor"
                r: "where to: after the smell"
                under:
                  - s: "que despedían de sí ciertos tasajos de cabra"
                    r: "describes 'olor': that some strips of dried goat gave off"
                    under:
                      - {s: "que hirviendo al fuego en un caldero estaban", r: "describes 'tasajos': that were boiling over the fire in a pot"}
        forms:
          - {w: "Fue recogido", f: "fu- + -e → ser (to be), preterite, he, + recogido, the participle of recoger (to take in): the passive 'he was taken in'. ser's preterite is irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "buen", f: "bueno (good) clipped before a masculine singular noun ('ánimo'), like un, algún, ningún, gran."}
          - {w: "habiendo ... acomodado", f: "habiendo, the gerund of haber (to have), + acomodado, the participle of acomodar (to settle): 'having settled'. Its subject, Sancho, sits between the two parts."}
          - {w: "pudo", f: "pud- + -o → poder (to be able), preterite, he: 'could'. Irregular stem: pude, pudiste, pudo, pudimos, pudisteis, pudieron."}
          - {w: "a Rocinante", f: "the 'a' that marks a person as the object is used here for a horse with a name, and then 'a su jumento' follows along."}
          - {w: "se fue", f: "fu- + -e → irse (to go off), preterite, he, with 'se' (himself). ir borrows ser's preterite: fui, fuiste, fue, fuimos, fuisteis, fueron. The 'se' turns 'went' into 'went off, went away'."}
          - {w: "despedían", f: "desped- + -ían → despedir (to give off), imperfect, they (the tasajos). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "sí", f: "'themselves' after a preposition ('de sí'); the accent tells it from 'si' (if)."}
          - {w: "ciertos", f: "ciert- + -os → cierto (certain, some), masculine plural to match 'tasajos'. Before the noun it means 'some', with no article."}
          - {w: "hirviendo", f: "gerund of hervir (to boil): 'boiling'. The e of the stem turns to i in the gerund: hervir → hirviendo."}
          - {w: "estaban", f: "est- + -aban → estar (to be), imperfect, they: 'were'. With the gerund it makes 'were boiling'; the poetic order puts the gerund first and 'estaban' last. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
      - es: "y, aunque él quisiera en aquel mesmo punto ver si estaban en sazón de trasladarlos del caldero al estómago, lo dejó de hacer, porque los cabreros los quitaron del fuego, y, tendiendo por el suelo unas pieles de ovejas, aderezaron con mucha priesa su rústica mesa y convidaron a los dos, con muestras de muy buena voluntad, con lo que tenían."
        literal: "and, although he would-have-wanted at that same point to-see if they-were in ripeness of transferring-them from-the cauldron to-the stomach, it he-left-off of doing, because the goatherds them took-off from-the fire, and, spreading over the ground some skins of sheep, they-set-out with much haste their rustic table and invited [to] the two, with shows of very good will, with that which they-had."
        ormsby: "and though he would have liked at once to try if they were ready to be transferred from the pot to the stomach, he refrained from doing so as the goatherds removed them from the fire, and laying sheepskins on the ground, quickly spread their rude table, and with signs of hearty goodwill invited them both to share what they had."
        vocab:
          - {w: "en aquel mesmo punto", d: "at that very moment; 'mesmo' is the old form of 'mismo' (same), used throughout the book"}
          - {w: "estar en sazón", d: "to be ready, ripe, done (of food)"}
          - {w: "trasladar", d: "to move, transfer"}
          - {w: "dejar de hacer", d: "to refrain from doing, not do"}
          - {w: "quitar", d: "to take off, remove"}
          - {w: "tender", d: "to spread out, lay out"}
          - {w: "piel", d: "skin, hide"}
          - {w: "aderezar", d: "to prepare, set out, get ready"}
          - {w: "priesa", d: "= prisa, haste; 'con mucha priesa' = very quickly"}
          - {w: "rústico", d: "rustic, rough, of the countryside"}
          - {w: "convidar", d: "to invite, treat (to food or drink)"}
          - {w: "muestras", d: "signs, shows, tokens"}
          - {w: "buena voluntad", d: "goodwill"}
        diagram:
          - s: "lo dejó de hacer"
            r: "main verb 1: he did not do it"
            under:
              - s: "aunque él quisiera en aquel mesmo punto ver"
                r: "concession: although he would have liked, that very moment, to see"
                under:
                  - {s: "si estaban en sazón de trasladarlos del caldero al estómago", r: "what he wanted to see: whether they were ready to move from pot to stomach"}
              - {s: "porque los cabreros los quitaron del fuego", r: "why: because the goatherds took them off the fire"}
          - s: "aderezaron con mucha priesa su rústica mesa"
            r: "main verb 2 (after 'y'): they (the goatherds) quickly set their rustic table"
            under:
              - {s: "tendiendo por el suelo unas pieles de ovejas", r: "how: by spreading sheepskins on the ground"}
          - s: "y convidaron a los dos"
            r: "main verb 3: and invited the two"
            under:
              - {s: "con muestras de muy buena voluntad", r: "how: with signs of great goodwill"}
              - {s: "con lo que tenían", r: "to what: to what they had"}
        forms:
          - {w: "quisiera", f: "quis- + -iera → querer (to want), imperfect subjunctive (-ra form), he: here 'would have liked'. Built on the preterite quisieron: quisiera, quisieras, quisiera, quisiéramos, quisierais, quisieran. Cervantes often uses the -ra form where modern Spanish says 'habría querido'."}
          - {w: "aquel mesmo", f: "aquel (that), masculine to match 'punto'; mesmo is the old spelling of mismo (same)."}
          - {w: "estaban", f: "est- + -aban → estar (to be), imperfect, they (the tasajos). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "trasladarlos", f: "trasladar (to move) + los (them, the tasajos), the pronoun hung on the end of the infinitive."}
          - {w: "del, al", f: "de + el, a + el: the two contractions modern Spanish still makes."}
          - {w: "dejó", f: "dej- + -ó → dejar (to leave; 'dejar de' + infinitive = to stop, not do), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "quitaron", f: "quit- + -aron → quitar (to remove), preterite, they. Same -ar preterite."}
          - {w: "tendiendo", f: "gerund of tender (to spread): 'spreading', describing how they set the table."}
          - {w: "aderezaron, convidaron", f: "aderez- + -aron → aderezar (to set out) and convid- + -aron → convidar (to invite), preterite, they. Same -ar preterite."}
          - {w: "rústica", f: "rústic- + -a → rústico, feminine to match 'mesa', placed before the noun."}
          - {w: "tenían", f: "ten- + -ían → tener (to have), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
      - es: "Sentáronse a la redonda de las pieles seis dellos, que eran los que en la majada había, habiendo primero con groseras ceremonias rogado a don Quijote que se sentase sobre un dornajo que vuelto del revés le pusieron."
        literal: "Sat-themselves-down at the round of the skins six of-them, who were those that in the fold there-were, having first with rough ceremonies begged [to] Don Quijote that he-should-seat-himself on a trough that turned of-the reverse for-him they-put."
        ormsby: "Round the skins six of the men belonging to the fold seated themselves, having first with rough politeness pressed Don Quixote to take a seat upon a trough which they placed for him upside down."
        vocab:
          - {w: "a la redonda de", d: "in a circle round, all around"}
          - {w: "dellos", d: "= de ellos, 'of them'; Cervantes fuses 'de' with él, ella, ellos, este (dél, della, dellos, deste)"}
          - {w: "majada", d: "sheepfold, the shepherds' pen and hut where the flock spends the night"}
          - {w: "grosero", d: "coarse, rustic, unpolished (not necessarily 'rude' in the modern sense)"}
          - {w: "ceremonias", d: "formalities, polite insistence"}
          - {w: "rogar", d: "to beg, entreat"}
          - {w: "dornajo", d: "small round trough, for feeding pigs or washing"}
          - {w: "del revés", d: "upside down, inside out"}
        diagram:
          - s: "Sentáronse"
            r: "main verb: they sat down"
            under:
              - {s: "a la redonda de las pieles", r: "where: round the skins"}
              - s: "seis dellos"
                r: "subject: six of them"
                under:
                  - {s: "que eran los que en la majada había", r: "describes 'seis': who were all the men in the fold"}
              - s: "habiendo primero con groseras ceremonias rogado a don Quijote"
                r: "when: having first, with rough courtesy, begged Don Quijote"
                under:
                  - s: "que se sentase sobre un dornajo"
                    r: "what they begged: that he sit on a trough"
                    under:
                      - {s: "que vuelto del revés le pusieron", r: "describes 'dornajo': that they set upside down for him"}
        forms:
          - {w: "Sentáronse", f: "sent- + -aron + se → sentarse (to sit down), preterite, they, with 'se' (themselves) stuck on the end. Cervantes hangs pronouns on the end of a conjugated verb that opens its clause; modern Spanish says 'se sentaron'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "dellos", f: "de + ellos (of them)."}
          - {w: "eran", f: "ser (to be), imperfect, they. ser's imperfect is irregular: era, eras, era, éramos, erais, eran."}
          - {w: "había", f: "hab- + -ía → haber, imperfect, used alone as 'there were' (the past of 'hay'); it stays singular even with a plural. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "habiendo ... rogado", f: "habiendo, the gerund of haber, + rogado, the participle of rogar (to beg): 'having begged'. The words 'primero con groseras ceremonias' sit between the two parts."}
          - {w: "groseras", f: "groser- + -as → grosero (coarse), feminine plural to match 'ceremonias'."}
          - {w: "se sentase", f: "sent- + -ase → sentarse (to sit down), imperfect subjunctive (-se form), he, with 'se' (himself). Subjunctive because it is what they begged ('rogar que'); imperfect because the begging is past. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "vuelto", f: "irregular participle of volver (to turn), masculine to match 'dornajo': 'turned upside down'."}
          - {w: "le pusieron", f: "pus- + -ieron → poner (to put), preterite, they, with 'le' (for him). Irregular stem: puse, pusiste, puso, pusimos, pusisteis, pusieron."}
      - es: "Sentóse don Quijote, y quedábase Sancho en pie para servirle la copa, que era hecha de cuerno. Viéndole en pie su amo, le dijo:"
        literal: "Sat-himself-down Don Quijote, and remained-himself Sancho on foot to serve-him the cup, which was made of horn. Seeing-him on foot his master, to-him said:"
        ormsby: "Don Quixote seated himself, and Sancho remained standing to serve the cup, which was made of horn. Seeing him standing, his master said to him:"
        vocab:
          - {w: "quedarse", d: "to stay, remain"}
          - {w: "en pie", d: "standing, on his feet"}
          - {w: "servir la copa", d: "to serve the drink, act as cupbearer"}
          - {w: "copa", d: "cup, drinking vessel"}
          - {w: "cuerno", d: "horn"}
          - {w: "amo", d: "master (of a servant)"}
        diagram:
          - s: "Sentóse"
            r: "main verb 1: sat down"
            under:
              - {s: "don Quijote", r: "subject"}
          - s: "y quedábase"
            r: "main verb 2: and stayed"
            under:
              - {s: "Sancho", r: "subject"}
              - {s: "en pie", r: "how: standing"}
              - s: "para servirle la copa"
                r: "why: to serve him the cup"
                under:
                  - {s: "que era hecha de cuerno", r: "describes 'copa': which was made of horn"}
          - s: "le dijo:"
            r: "main verb 3 (new sentence): said to him"
            under:
              - {s: "su amo", r: "subject: his master"}
              - {s: "Viéndole en pie", r: "when: seeing him standing"}
        forms:
          - {w: "Sentóse", f: "sent- + -ó + se → sentarse (to sit down), preterite, he, with 'se' (himself) stuck on the end. Cervantes hangs pronouns on the end of a conjugated verb that opens its clause; modern Spanish says 'se sentó'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "quedábase", f: "qued- + -aba + se → quedarse (to stay), imperfect, he, with 'se' stuck on the end (the same pronoun rule; modern 'se quedaba'). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. The imperfect paints Sancho's standing as the background."}
          - {w: "servirle", f: "servir (to serve) + le (to him), the pronoun hung on the infinitive."}
          - {w: "era hecha", f: "era (ser, imperfect, it: era, eras, era, éramos, erais, eran) + hecha, the irregular participle of hacer (to make), feminine to match 'copa': 'was made'."}
          - {w: "Viéndole", f: "viendo, the gerund of ver (to see), + le (him), with an accent added to keep the stress on 'vien-'. 'le' for a male person as direct object is Castilian usage (leísmo); strict grammar wants 'lo'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Porque veas, Sancho, el bien que en sí encierra la andante caballería, y cuán a pique están los que en cualquiera ministerio della se ejercitan de venir brevemente a ser honrados y estimados del mundo, quiero que aquí a mi lado y en compañía desta buena gente te sientes, y que seas una mesma cosa conmigo, que soy tu amo y natural señor;"
        literal: "— So-that you-may-see, Sancho, the good that in itself encloses the errant chivalry, and how on-the-point are those who in whatever office of-it exercise-themselves of coming shortly to be honored and esteemed by-the world, I-want that here at my side and in company of-this good people you-sit-down, and that you-be one same thing with-me, who am your master and natural lord;"
        ormsby: "“That thou mayest see, Sancho, the good that knight-errantry contains in itself, and how those who fill any office in it are on the high-road to be speedily honoured and esteemed by the world, I desire that thou seat thyself here at my side and in the company of these worthy people, and that thou be one with me who am thy master and natural lord,"
        vocab:
          - {w: "porque", d: "with the subjunctive, 'so that' (= para que), not 'because'"}
          - {w: "encerrar", d: "to contain, hold, enclose"}
          - {w: "la andante caballería", d: "knight-errantry; 'andante' = walking, wandering (caballero andante = knight-errant)"}
          - {w: "cuán", d: "how (before an adjective or adverb); short for 'cuánto'"}
          - {w: "estar a pique de", d: "to be on the point of, well on the way to"}
          - {w: "cualquiera", d: "any; modern Spanish clips it to 'cualquier' before a noun"}
          - {w: "ministerio", d: "office, function, post"}
          - {w: "della", d: "= de ella, 'of it' (of knight-errantry)"}
          - {w: "ejercitarse en", d: "to be employed in, practice"}
          - {w: "brevemente", d: "soon, shortly (not 'briefly')"}
          - {w: "estimado", d: "esteemed, valued"}
          - {w: "del mundo", d: "by the world; old Spanish marks the doer of a passive with 'de'"}
          - {w: "desta", d: "= de esta, 'of this'"}
          - {w: "una mesma cosa", d: "one and the same thing; 'mesma' = misma"}
          - {w: "conmigo", d: "with me"}
          - {w: "natural señor", d: "lord by birth, liege lord (a feudal phrase)"}
        diagram:
          - s: "quiero"
            r: "main verb: I want"
            under:
              - s: "Porque veas, Sancho, el bien"
                r: "purpose 1: so that you may see the good"
                under:
                  - {s: "que en sí encierra la andante caballería", r: "describes 'bien': that knight-errantry holds in itself"}
              - s: "y cuán a pique están los"
                r: "purpose 2: and how close those people are"
                under:
                  - {s: "que en cualquiera ministerio della se ejercitan", r: "describes 'los': who serve in any office of it"}
                  - {s: "de venir brevemente a ser honrados y estimados del mundo", r: "close to what: to being soon honored and esteemed by the world"}
              - {s: "que aquí a mi lado y en compañía desta buena gente te sientes", r: "what I want, 1: that you sit here at my side with these good people"}
              - s: "y que seas una mesma cosa conmigo"
                r: "what I want, 2: that you be one and the same with me"
                under:
                  - {s: "que soy tu amo y natural señor", r: "describes 'conmigo': I, who am your master and lord"}
        forms:
          - {w: "veas", f: "ve- + -as → ver (to see), present subjunctive, you (tú): 'you may see'. Subjunctive because 'porque' here means 'so that'. ver in the present subjunctive: vea, veas, vea, veamos, veáis, vean."}
          - {w: "encierra", f: "encierr- + -a → encerrar (to contain), present, it. The stem e becomes ie when stressed: encierro, encierras, encierra, encerramos, encerráis, encierran."}
          - {w: "están", f: "est- + -án → estar (to be), present, they. estoy, estás, está, estamos, estáis, están."}
          - {w: "cualquiera", f: "the full form of cualquier (any); Cervantes keeps it before a masculine noun ('ministerio')."}
          - {w: "della, desta", f: "de + ella (of it), de + esta (of this). Cervantes fuses 'de' with these pronouns; modern Spanish keeps only 'del'."}
          - {w: "se ejercitan", f: "ejercit- + -an → ejercitarse (to be employed), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "venir", f: "infinitive (to come) after 'de'; 'venir a ser' = to come to be."}
          - {w: "honrados y estimados", f: "participles of honrar (to honor) and estimar (to esteem), masculine plural to match 'los'."}
          - {w: "quiero", f: "quier- + -o → querer (to want), present, I. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "te sientes", f: "sient- + -es → sentarse (to sit down), present subjunctive, you, with 'te' (yourself). Subjunctive because it is what I want ('quiero que'). The stem e becomes ie when stressed: siente, sientes, siente, sentemos, sentéis, sienten (the -ar subjunctive endings -e, -es, -e, -emos, -éis, -en)."}
          - {w: "seas", f: "ser (to be), present subjunctive, you. sea, seas, sea, seamos, seáis, sean. Also after 'quiero que'."}
          - {w: "mesma", f: "= misma, feminine to match 'cosa'."}
          - {w: "conmigo", f: "con + mí fused into one word: 'with me' (also contigo, consigo)."}
          - {w: "soy", f: "ser (to be), present, I. soy, eres, es, somos, sois, son."}
          - {w: "tu", f: "'your' (for tú), no accent; 'tú' with the accent is 'you'."}
        note: "Don Quijote calls Sancho 'tú', as a master does a servant; Sancho always answers 'vuestra merced'. The speech inviting him to sit as an equal is itself a piece of chivalric etiquette."
      - es: "que comas en mi plato y bebas por donde yo bebiere;"
        literal: "that you-eat in my plate and you-drink through where I may-drink;"
        ormsby: "and that thou eat from my plate and drink from whatever I drink from;"
        vocab:
          - {w: "plato", d: "plate, dish"}
          - {w: "beber por donde", d: "to drink from the same place, i.e. from the same cup"}
          - {w: "bebiere", d: "future subjunctive of beber: 'wherever I may drink'; modern 'beba'"}
        diagram:
          - s: "quiero"
            r: "carried over from the previous sentence: I want"
            under:
              - {s: "que comas en mi plato", r: "what I want, 3: that you eat from my plate"}
              - s: "y bebas"
                r: "what I want, 4: and that you drink"
                under:
                  - {s: "por donde yo bebiere", r: "from where: from wherever I drink"}
        forms:
          - {w: "comas", f: "com- + -as → comer (to eat), present subjunctive, you. Subjunctive because it still hangs on 'quiero que'. The present subjunctive of -er and -ir verbs: -a, -as, -a, -amos, -áis, -an."}
          - {w: "bebas", f: "beb- + -as → beber (to drink), present subjunctive, you. Same -a subjunctive."}
          - {w: "mi", f: "'my', one form for both genders (mi, mis)."}
          - {w: "bebiere", f: "beb- + -iere → beber (to drink), future subjunctive, I: 'wherever I may drink'. The future subjunctive of -er and -ir verbs: -iere, -ieres, -iere, -iéremos, -iereis, -ieren. Cervantes uses it after 'donde', 'si', 'quien' for an open future; modern Spanish uses the present subjunctive 'beba'."}
      - es: "porque de la caballería andante se puede decir lo mesmo que del amor se dice: que todas las cosas iguala."
        literal: "because of the chivalry errant one-can say the same that of-the love is-said: that all the things it-equalizes."
        ormsby: "for the same may be said of knight-errantry as of love, that it levels all.”"
        vocab:
          - {w: "lo mesmo que", d: "the same as; 'mesmo' = mismo"}
