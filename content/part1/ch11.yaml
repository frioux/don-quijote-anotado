  - sentences:
      - es: "Toda esta larga arenga —que se pudiera muy bien escusar— dijo nuestro caballero porque las bellotas que le dieron le trujeron a la memoria la edad dorada y antojósele hacer aquel inútil razonamiento a los cabreros, que, sin respondelle palabra, embobados y suspensos, le estuvieron escuchando."
        literal: "All this long harangue —which itself could very well be-spared— said our knight because the acorns that to-him they-gave to-him brought to the memory the age golden and it-took-the-fancy-to-him to make that useless discourse to the goatherds, who, without answering-him word, gaping and spellbound, him were listening."
        ormsby: "All this long harangue (which might very well have been spared) our knight delivered because the acorns they gave him reminded him of the golden age; and the whim seized him to address all this unnecessary argument to the goatherds, who listened to him gaping in amazement without saying a word in reply."
        vocab:
          - {w: "arenga", d: "harangue, speech"}
          - {w: "escusar", d: "= excusar, here: to spare, do without"}
          - {w: "traer a la memoria", d: "to bring to mind, remind of"}
          - {w: "trujeron", d: "= trajeron, 'they brought' (old form)"}
          - {w: "antojársele a uno", d: "to take a fancy to, get the whim to"}
          - {w: "inútil", d: "useless, pointless"}
          - {w: "razonamiento", d: "discourse, speech"}
          - {w: "respondelle", d: "= responderle, 'to answer him'"}
          - {w: "embobado", d: "open-mouthed, dumbfounded"}
          - {w: "suspenso", d: "spellbound, amazed"}
        diagram:
          - s: "dijo"
            r: "main verb: said, delivered"
            under:
              - s: "Toda esta larga arenga"
                r: "object, put first: all this long harangue"
                under:
                  - {s: "que se pudiera muy bien escusar", r: "aside: which could very well have been spared"}
              - {s: "nuestro caballero", r: "subject: our knight"}
              - s: "porque las bellotas"
                r: "why: because the acorns"
                under:
                  - {s: "que le dieron", r: "describes 'bellotas': that they gave him"}
                  - {s: "le trujeron a la memoria la edad dorada", r: "the verb: reminded him of the Golden Age"}
              - s: "y antojósele"
                r: "why, 2: and he took a fancy"
                under:
                  - s: "hacer aquel inútil razonamiento a los cabreros"
                    r: "fancy for what: to make that pointless speech to the goatherds"
                    under:
                      - {s: "que, sin respondelle palabra, embobados y suspensos, le estuvieron escuchando", r: "describes 'cabreros': who, gaping and spellbound, listened without a word"}
        forms:
          - {w: "Toda esta larga", f: "feminine singular to match 'arenga'."}
          - {w: "se pudiera escusar", f: "pud- + -iera → poder (can), imperfect subjunctive (-ra form), it, with passive 'se': here 'could have been spared'. Built on pudieron: pudiera, pudieras, pudiera, pudiéramos, pudierais, pudieran. Cervantes uses the -ra form where modern Spanish says 'se habría podido'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "nuestro", f: "'our', masculine to match 'caballero'."}
          - {w: "dieron", f: "d- + -ieron → dar (to give), preterite, they. Irregular: di, diste, dio, dimos, disteis, dieron."}
          - {w: "trujeron", f: "truj- + -eron → traer (to bring), preterite, they (the acorns). The old stem truj-: truje, trujiste, trujo, trujimos, trujisteis, trujeron; modern Spanish says traje, trajeron."}
          - {w: "antojósele", f: "antoj- + -ó + se + le → antojarse (to take a fancy), preterite, it, with 'se' and 'le' (to him) stuck on the end: modern 'se le antojó'. Cervantes hangs pronouns on the end of a conjugated verb that opens its clause. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. Built like gustar: the whim is the subject, he is 'le'."}
          - {w: "aquel inútil", f: "aquel, masculine to match 'razonamiento'; inútil has one form for both genders."}
          - {w: "respondelle", f: "responder + le, with -rl- turned into -ll-, an old sound change: modern 'responderle', 'to answer him'."}
          - {w: "embobados y suspensos", f: "masculine plural, matching the goatherds."}
          - {w: "estuvieron escuchando", f: "estuv- + -ieron → estar (to be), preterite, they, + escuchando, the gerund of escuchar (to listen): 'were listening' the whole time. Irregular stem: estuve, estuviste, estuvo, estuvimos, estuvisteis, estuvieron."}
        note: "The narrator steps in to call the speech unnecessary, a joke against his own hero's most eloquent moment. The goatherds understand none of it."
