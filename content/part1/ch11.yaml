      - es: "aún no se había atrevido la pesada reja del corvo arado a abrir ni visitar las entrañas piadosas de nuestra primera madre, que ella, sin ser forzada, ofrecía, por todas las partes de su fértil y espacioso seno, lo que pudiese hartar, sustentar y deleitar a los hijos que entonces la poseían."
        literal: "still not had dared the heavy share of-the curved plough to open nor visit the entrails tender of our first mother, who she, without being forced, offered, through all the parts of her fertile and spacious bosom, that which might satisfy, sustain and delight [to] the children who then her possessed."
