        ormsby_note: "The eulogy of the golden age is one of the loci classici of Don Quixote quoted in every Spanish anthology; the reader, however, must not judge of it by translation, which can not give the stately roll and flow of the original Castilian."
  - sentences:
      - es: "— Dichosa edad y siglos dichosos aquéllos a quien los antiguos pusieron nombre de dorados, y no porque en ellos el oro, que en esta nuestra edad de hierro tanto se estima, se alcanzase en aquella venturosa sin fatiga alguna, sino porque entonces los que en ella vivían ignoraban estas dos palabras de tuyo y mío."
        literal: "— Happy age and centuries happy those to whom the ancients put name of golden, and not because in them the gold, which in this our age of iron so-much is-prized, was-obtained in that fortunate [one] without toil any, but because then those who in it lived did-not-know these two words of yours and mine."
        ormsby: "“Happy the age, happy the time, to which the ancients gave the name of golden, not because in that fortunate age the gold so coveted in this our iron one was gained without toil, but because they that lived in it knew not the two words ‘mine’ and ‘thine’!"
        vocab:
          - {w: "dichoso", d: "happy, blessed, fortunate"}
          - {w: "siglos", d: "ages, times (literally 'centuries')"}
          - {w: "a quien", d: "to which; old Spanish uses 'quien' for plurals and for things"}
          - {w: "los antiguos", d: "the ancients: the Greek and Roman poets (Hesiod, Ovid, Virgil)"}
          - {w: "poner nombre de", d: "to give the name of, call"}
          - {w: "dorado", d: "golden"}
          - {w: "edad de hierro", d: "the Iron Age, last and worst of the poets' four ages (gold, silver, bronze, iron)"}
          - {w: "estimar", d: "to prize, value"}
          - {w: "alcanzar", d: "to obtain, get hold of"}
          - {w: "venturoso", d: "fortunate, happy"}
          - {w: "fatiga", d: "toil, hardship (stronger than 'fatigue')"}
          - {w: "sino", d: "but rather (after a negative)"}
          - {w: "ignorar", d: "to not know, be unaware of (a false friend: not 'to ignore')"}
          - {w: "tuyo y mío", d: "yours and mine: private property"}
        diagram:
          - s: "Dichosa edad y siglos dichosos aquéllos"
            r: "exclamation, no verb: happy the age and happy those times"
            under:
              - {s: "a quien los antiguos pusieron nombre de dorados", r: "describes 'aquéllos': that the ancients named golden"}
              - s: "y no porque en ellos el oro"
                r: "not because, in those times, the gold (subject of 'se alcanzase')"
                under:
                  - {s: "que en esta nuestra edad de hierro tanto se estima", r: "describes 'oro': so prized in this iron age of ours"}
                  - {s: "se alcanzase en aquella venturosa sin fatiga alguna", r: "the verb: was obtained without any toil in that happy age"}
              - {s: "sino porque entonces los que en ella vivían ignoraban estas dos palabras de tuyo y mío", r: "but because: those who lived then did not know the words 'yours' and 'mine'"}
        forms:
          - {w: "Dichosa, dichosos", f: "dichos- + -a → dichoso (happy), feminine to match 'edad'; dichos- + -os, masculine plural to match 'siglos'. The two phrases mirror each other: adjective-noun, noun-adjective."}
          - {w: "aquéllos", f: "aquell- + -os → 'those', masculine plural for 'siglos'; the accent is the old spelling of the pronoun."}
          - {w: "quien", f: "the old relative for people and things alike, singular even here where it stands for a plural."}
          - {w: "pusieron", f: "pus- + -ieron → poner (to put), preterite, they (the ancients). Irregular stem: puse, pusiste, puso, pusimos, pusisteis, pusieron."}
          - {w: "dorados", f: "dorad- + -os → dorado (golden), masculine plural to match 'siglos'."}
          - {w: "esta nuestra", f: "demonstrative + possessive together before the noun ('this our age'), an old, formal construction."}
          - {w: "se estima", f: "estim- + -a → estimar (to prize), present, it, with 'se' making it passive: 'is prized'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "se alcanzase", f: "alcanz- + -ase → alcanzar (to obtain), imperfect subjunctive (-se form), it, passive 'se': 'was obtained'. Subjunctive because 'no porque' denies the reason. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "aquella venturosa", f: "feminine to match 'edad', which is understood: 'that fortunate [age]'."}
          - {w: "alguna", f: "after the noun in a negative phrase = 'any at all': 'sin fatiga alguna'."}
          - {w: "vivían", f: "viv- + -ían → vivir (to live), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "ignoraban", f: "ignor- + -aban → ignorar (to not know), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "tuyo, mío", f: "the stressed possessives used as nouns: 'yours', 'mine'."}
        note: "The Golden Age speech is a set piece drawn from Ovid (Metamorphoses I), Virgil and Hesiod, where the first men lived on acorns and shared everything. The handful of acorns is what sets Don Quijote off."
      - es: "Eran en aquella santa edad todas las cosas comunes; a nadie le era necesario, para alcanzar su ordinario sustento, tomar otro trabajo que alzar la mano y alcanzarle de las robustas encinas, que liberalmente les estaban convidando con su dulce y sazonado fruto."
        literal: "Were in that holy age all the things common; to nobody to-him was necessary, to obtain his ordinary sustenance, to-take other labor than to-raise the hand and reach-it from the robust holm-oaks, which liberally to-them were inviting with their sweet and ripe fruit."
        ormsby: "In that blessed age all things were in common; to win the daily food no labour was required of any save to stretch forth his hand and gather it from the sturdy oaks that stood generously inviting him with their sweet ripe fruit."
