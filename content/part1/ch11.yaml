        note: "Teresa's jibe is that Olalla's beauty is all trinkets, false hair and make-up. Two stanzas are joined here because her words run across them."
      - es: "Desmentíla y enojóse; volvió por ella su primo: desafióme, y ya sabes lo que yo hice y él hizo."
