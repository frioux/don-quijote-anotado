      - es: "Abalánzase al señuelo mi fe, que nunca ha podido, ni menguar por no llamado, ni crecer por escogido."
        literal: "Hurls-itself at-the lure my faith, which never has been-able, neither to-shrink for not called, nor to-grow for chosen."
        ormsby: "Lures to faith are they, those glimpses, / And to faith in thee I hold; / Kindness cannot make it stronger, / Coldness cannot make it cold."
