        note: "Antonio means marriage: his honest intentions contrast with a lover who wants only a mistress."
      - es: "Coyundas tiene la Iglesia que son lazadas de sirgo; pon tú el cuello en la gamella; verás como pongo el mío."
        literal: "Yoke-straps has the Church that are loops of silk; put you the neck in the yoke; you-will-see how I-put the mine."
        ormsby: "Cunning cords the holy Church has, / Cords of softest silk they be; / Put thy neck beneath the yoke, dear; / Mine will follow, thou wilt see."
