      - es: "Y aun, si va a decir verdad, mucho mejor me sabe lo que como en mi rincón, sin melindres ni respetos, aunque sea pan y cebolla, que los gallipavos de otras mesas donde me sea forzoso mascar despacio, beber poco, limpiarme a menudo, no estornudar ni toser si me viene gana, ni hacer otras cosas que la soledad y la libertad traen consigo."
