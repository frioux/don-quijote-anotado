        ormsby_note: "Antonio's ballad is in imitation of a species of popular poetry that occupies nearly as large a space as the romantic and historical ballads in the old romanceros. These gay, naive, simple lays of peasant life and love are as thoroughly national and peculiar to Spain as the historical ballads themselves, and in every way present a striking contrast to the artificial pastoral sonnets and canciones of Italian importation. The imitation of this kind of poetry was a favorite pastime with the poets of the Spanish Augustan age, and strange to say the poet who showed the lightest touch and brightest fancy in these compositions, and caught most happily the simplicity and freshness of the originals, was Góngora, whose name is generally associated with poetry the exact opposite of this in every particular. Cervantes apparently valued himself more upon his sonnets and artificial verses; a preference regretted, I imagine, by most of his readers. This ballad has been hardly treated by the translators. The language and measures used by Shelton and Jervas are about as well adapted to represent a Spanish popular lyric as a dray-horse to draw a pony-chaise. The measure of the original is the ordinary ballad measure, an eight-syllable trochaic, with the assonant rhyme in the second and fourth lines. The latter peculiarity I have made no attempt to imitate here, but examples of it will be found farther on."
        note: "The ballad is in four-line stanzas of eight-syllable lines. Every even line ends on the vowels i-o (dicho, amoríos, afirmo, conocido, indicio, risco): the assonant rhyme Ormsby mentions, which he does not try to copy."
  - sentences:
      - es: "-Yo sé, Olalla, que me adoras, puesto que no me lo has dicho ni aun con los ojos siquiera, mudas lenguas de amoríos."
        literal: "-I know, Olalla, that me you-adore, even-though not to-me it you-have said not even with the eyes even, mute tongues of love-affairs."
        ormsby: "Thou dost love me well, Olalla; / Well I know it, even though / Love’s mute tongues, thine eyes, have never / By their glances told me so."
        vocab:
          - {w: "adorar", d: "to adore, love"}
          - {w: "puesto que", d: "here: although, even though (in modern Spanish it means 'since')"}
          - {w: "ni aun ... siquiera", d: "not even"}
          - {w: "mudo", d: "mute, silent"}
          - {w: "amoríos", d: "love affairs, flirtations, courting"}
        diagram:
          - s: "Yo sé"
            r: "main verb: I know"
            under:
              - {s: "Olalla", r: "address: the girl he loves"}
              - {s: "que me adoras", r: "what I know: that you adore me"}
              - s: "puesto que no me lo has dicho"
                r: "concession: although you have not told me so"
                under:
                  - s: "ni aun con los ojos siquiera"
                    r: "not even with your eyes"
                    under:
                      - {s: "mudas lenguas de amoríos", r: "describes 'ojos': the silent tongues of love"}
        forms:
          - {w: "sé", f: "saber (to know), present, I. Irregular: sé, sabes, sabe, sabemos, sabéis, saben. The accent tells it from 'se'."}
          - {w: "adoras", f: "ador- + -as → adorar (to adore), present, you. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "me lo has dicho", f: "has = haber, present, you (he, has, ha, hemos, habéis, han), + dicho, the irregular participle of decir (to say): 'you have told'. 'me' (to me) comes before 'lo' (it): the indirect pronoun always goes first."}
          - {w: "mudas", f: "mud- + -as → mudo (mute), feminine plural to match 'lenguas'."}
        note: "The line begins with a hyphen in the Gutenberg text, marking the start of Antonio's song. Olalla is a country form of Eulalia."
      - es: "Porque sé que eres sabida, en que me quieres me afirmo; que nunca fue desdichado amor que fue conocido."
        literal: "Because I-know that you-are knowing, in that me you-love I-affirm-myself; for never was unhappy love that was known."
        ormsby: "For I know my love thou knowest, / Therefore thine to claim I dare: / Once it ceases to be secret, / Love need never feel despair."
        ormsby_match: false
        vocab:
          - {w: "sabido", d: "here active: knowing, shrewd, wise (not 'known')"}
          - {w: "afirmarse en", d: "to be confirmed in, hold firmly to (a belief)"}
