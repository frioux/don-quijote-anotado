  - sentences:
      - es: "Con esto dio el cabrero fin a su canto; y, aunque don Quijote le rogó que algo más cantase, no lo consintió Sancho Panza, porque estaba más para dormir que para oír canciones. Y ansí, dijo a su amo:"
        literal: "With this gave the goatherd end to his song; and, although Don Quijote him begged that something more he-should-sing, not it allowed Sancho Panza, because he-was more for sleeping than for hearing songs. And so, he-said to his master:"
        ormsby: "Here the goatherd brought his song to an end, and though Don Quixote entreated him to sing more, Sancho had no mind that way, being more inclined for sleep than for listening to songs; so said he to his master,"
        vocab:
          - {w: "dar fin a", d: "to bring to an end, finish"}
          - {w: "canto", d: "song, singing"}
          - {w: "rogar", d: "to beg, entreat"}
          - {w: "consentir", d: "to allow, consent to"}
          - {w: "estar para", d: "to be in the mood for, fit for"}
          - {w: "canción", d: "song"}
          - {w: "ansí", d: "= así, so, thus (old form)"}
        diagram:
          - s: "dio"
            r: "main verb 1: gave, brought"
            under:
              - {s: "Con esto", r: "when: with this"}
              - {s: "el cabrero", r: "subject: the goatherd"}
              - {s: "fin a su canto", r: "object: an end to his song"}
          - s: "no lo consintió"
            r: "main verb 2 (after 'y'): did not allow it"
            under:
              - {s: "aunque don Quijote le rogó que algo más cantase", r: "concession: though Don Quijote begged him to sing some more"}
              - {s: "Sancho Panza", r: "subject"}
              - {s: "porque estaba más para dormir que para oír canciones", r: "why: because he was more in the mood for sleep than songs"}
          - s: "dijo a su amo:"
            r: "main verb 3 (new sentence): he said to his master"
            under:
              - {s: "Y ansí", r: "and so"}
        forms:
          - {w: "dio", f: "d- + -io → dar (to give), preterite, he. Irregular: di, diste, dio, dimos, disteis, dieron."}
          - {w: "rogó", f: "rog- + -ó → rogar (to beg), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (the I-form is 'rogué', gu keeping the hard g)."}
          - {w: "cantase", f: "cant- + -ase → cantar (to sing), imperfect subjunctive (-se form), he. Subjunctive because it is what he begged ('rogar que'); imperfect because 'rogó' is past. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "consintió", f: "consint- + -ió → consentir (to allow), preterite, he. The stem e becomes i in this form: consentí, consentiste, consintió, consentimos, consentisteis, consintieron."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "dormir, oír", f: "infinitives (to sleep, to hear) after 'para'."}
          - {w: "ansí", f: "old form of así (so)."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Bien puede vuestra merced acomodarse desde luego adonde ha de posar esta noche, que el trabajo que estos buenos hombres tienen todo el día no permite que pasen las noches cantando."
        literal: "— Well can your grace settle-yourself right-away where you-have to lodge this night, for the work that these good men have all the day not permits that they-spend the nights singing."
        ormsby: "“Your worship will do well to settle at once where you mean to pass the night, for the labour these good men are at all day does not allow them to spend the night in singing.”"
        vocab:
          - {w: "vuestra merced", d: "your worship: the polite address, ancestor of 'usted'; it takes the he/she form of the verb"}
          - {w: "acomodarse", d: "to settle down, make oneself comfortable"}
          - {w: "desde luego", d: "right away, at once (its old sense; today it means 'of course')"}
          - {w: "adonde", d: "where, to where"}
          - {w: "posar", d: "to lodge, put up for the night"}
          - {w: "permitir", d: "to allow"}
        diagram:
          - s: "Bien puede vuestra merced acomodarse"
            r: "main verb: your worship may well settle down"
            under:
              - {s: "desde luego", r: "when: right away"}
              - {s: "adonde ha de posar esta noche", r: "where: where you are to sleep tonight"}
          - s: "no permite"
            r: "main verb 2 (after a loose 'que' = for): does not allow"
            under:
              - s: "el trabajo"
                r: "subject: the work"
                under:
                  - {s: "que estos buenos hombres tienen todo el día", r: "describes 'trabajo': that these good men have all day"}
              - {s: "que pasen las noches cantando", r: "what it does not allow: that they spend the nights singing"}
        forms:
          - {w: "puede", f: "pued- + -e → poder (can), present, you (vuestra merced takes the he/she form). The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "acomodarse", f: "acomodar + se: 'to settle oneself'; the infinitive after 'puede'."}
          - {w: "ha de posar", f: "ha = haber, present, you (he, has, ha, hemos, habéis, han); 'haber de' + infinitive = to be going to, have to: 'where you are to lodge'."}
          - {w: "esta, estos buenos", f: "esta, feminine to match 'noche'; estos buenos, masculine plural to match 'hombres'."}
          - {w: "tienen", f: "tien- + -en → tener (to have), present, they. tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "permite", f: "permit- + -e → permitir (to allow), present, it. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "pasen", f: "pas- + -en → pasar (to spend), present subjunctive, they. Subjunctive after 'permite que'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "cantando", f: "gerund of cantar (to sing): 'singing'."}
  - sentences:
      - es: "— Ya te entiendo, Sancho —le respondió don Quijote—; que bien se me trasluce que las visitas del zaque piden más recompensa de sueño que de música."
        literal: "— Already you I-understand, Sancho —to-him answered Don Quijote—; for well itself to-me shows-through that the visits of-the wineskin ask more recompense of sleep than of music."
        ormsby: "“I understand thee, Sancho,” replied Don Quixote; “I perceive clearly that those visits to the wineskin demand compensation in sleep rather than in music.”"
        vocab:
          - {w: "ya te entiendo", d: "I see what you mean, I get you"}
          - {w: "traslucirse", d: "to show through, be evident"}
          - {w: "zaque", d: "wineskin"}
          - {w: "recompensa", d: "reward, compensation"}
          - {w: "sueño", d: "sleep (also 'dream')"}
        diagram:
          - s: "Ya te entiendo, Sancho"
            r: "main verb 1: I understand you, Sancho"
          - {s: "le respondió don Quijote", r: "speech tag: Don Quijote answered him"}
          - s: "bien se me trasluce"
            r: "main verb 2 (after a loose 'que' = for): it is plain to me"
            under:
              - {s: "que las visitas del zaque piden más recompensa de sueño que de música", r: "what is plain: that the visits to the wineskin call for sleep more than music"}
        forms:
          - {w: "entiendo", f: "entiend- + -o → entender (to understand), present, I. The stem e becomes ie when stressed: entiendo, entiendes, entiende, entendemos, entendéis, entienden."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "se me trasluce", f: "trasluc- + -e → traslucirse (to show through), present, it, with 'se' and 'me' (to me): 'it shows through to me'. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en (the I-form is 'trasluzco')."}
          - {w: "del", f: "de + el."}
          - {w: "piden", f: "pid- + -en → pedir (to ask for), present, they. The stem e becomes i when stressed: pido, pides, pide, pedimos, pedís, piden."}
  - sentences:
      - es: "— A todos nos sabe bien, bendito sea Dios —respondió Sancho."
        literal: "— To all us it-tastes well, blessed be God —answered Sancho."
        ormsby: "“It’s sweet to us all, blessed be God,” said Sancho."
        vocab:
          - {w: "saber bien", d: "to taste good; 'nos sabe bien' = we enjoy it"}
          - {w: "bendito sea Dios", d: "blessed be God, thank God"}
        diagram:
          - s: "A todos nos sabe bien"
            r: "main verb: it tastes good to all of us"
          - {s: "bendito sea Dios", r: "exclamation: God be praised"}
          - {s: "respondió Sancho", r: "speech tag: Sancho answered"}
        forms:
          - {w: "A todos nos", f: "'nos' (to us) repeats 'a todos' (to all); Spanish doubles an indirect object like this as a matter of course."}
          - {w: "sabe", f: "sab- + -e → saber (to taste), present, it. Irregular only in 'sé': sé, sabes, sabe, sabemos, sabéis, saben. Built like gustar: the wine is the subject."}
          - {w: "bendito sea", f: "bendito, the old participle of bendecir (to bless), + sea, ser in the present subjunctive (sea, seas, sea, seamos, seáis, sean) used for a wish: 'may God be blessed'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
        note: "Sancho does not deny the wine: the 'it' that tastes good to everyone is the drink Don Quijote has just hinted at."
  - sentences:
      - es: "— No lo niego —replicó don Quijote—, pero acomódate tú donde quisieres, que los de mi profesión mejor parecen velando que durmiendo."
        literal: "— Not it I-deny —replied Don Quijote—, but settle-yourself you where you-may-wish, for those of my profession better look keeping-watch than sleeping."
        ormsby: "“I do not deny it,” replied Don Quixote; “but settle thyself where thou wilt; those of my calling are more becomingly employed in watching than in sleeping;"
        vocab:
