        forms:
          - {w: "Eran", f: "ser (to be), imperfect, they. ser's imperfect is irregular: era, eras, era, éramos, erais, eran."}
          - {w: "santa", f: "sant- + -a → santo (holy), feminine to match 'edad'."}
          - {w: "comunes", f: "común + -es, plural to match 'cosas'; the accent drops because the stress now falls regularly."}
          - {w: "a nadie le", f: "'le' repeats 'a nadie' (to nobody); Spanish doubles an indirect object like this as a matter of course."}
          - {w: "era", f: "ser, imperfect, it: 'it was [necessary]'. Same irregular imperfect."}
