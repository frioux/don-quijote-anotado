summary: |
  Don Quijote and Sancho are taken in for the night by a group of goatherds, who spread sheepskins on the ground and share their supper of stewed dried goat. Don Quijote insists that Sancho sit beside him and eat from his plate, since knight-errantry, like love, makes all men equal. Sancho would rather eat alone in his corner without having to mind his manners, and asks to have the honor exchanged for something more useful; Don Quijote pulls him down beside him anyway.

  After the meat come dried acorns and a rock-hard cheese, while the drinking horn goes round until one wineskin is empty. Holding a handful of acorns, Don Quijote delivers a long speech on the Golden Age, when no one said 'yours' and 'mine', the oaks, rivers and bees fed everyone for free, girls roamed safely in simple dress, and there was no fraud and no need for judges. In today's Iron Age no maiden is safe, and so the order of knights-errant was founded to protect maidens, widows and orphans. He thanks the goatherds for their hospitality.

  The goatherds listen, amazed, without understanding a word. The narrator remarks that the speech could well have been spared. Sancho goes on eating acorns and visiting the second wineskin. To entertain their guest the goatherds call on Antonio, a young goatherd who can read and write and plays the rebec. He sings a ballad his uncle, a priest, wrote for him: a love song to Olalla, who has never said she loves him. He has worn his Sunday clothes on Mondays for her and fought her cousin over her, and he wants to marry her. If she refuses, he will leave the hills only as a Capuchin friar.

  Don Quijote asks for more, but Sancho, sleepy with wine, suggests they all go to bed. Don Quijote says that knights ought to keep watch rather than sleep, but asks Sancho to dress his wounded ear again. One of the goatherds covers it with chewed rosemary leaves and salt and bandages it, and the remedy works.
context: |
  Goatherds and their food. The goatherds are the poorest people Don Quijote has yet sat down with. They eat on sheepskins spread on the ground, sit on an upturned trough, drink from a horn, and eat 'tasajo' (salted, dried goat), sweet acorns from the holm oak, and hard cheese. Acorns were real food for the rural poor of Castile, not only for pigs. The scene of master and squire eating together also touches a real social rule: a servant stood and served while his master ate, and Sancho's list of table manners (chew slowly, drink little, wipe your mouth, don't sneeze) is the etiquette of the gentry seen by a peasant who wants none of it.

  The Golden Age. Don Quijote's speech follows a classical tradition: Hesiod's four ages of man, Ovid's Metamorphoses (Book I), Virgil and Boethius, where the first people lived on acorns, owned nothing and needed no laws. Renaissance writers repeated the theme constantly, and it was a school exercise in rhetoric. Cervantes writes it with real eloquence, in long, balanced, Latinate sentences that put verbs last. Ormsby calls it one of the classic passages of the book, found in every Spanish anthology. The comedy lies in the setting: a fine oration on the Golden Age delivered to illiterate goatherds, prompted by a handful of acorns, ending in a claim that knights-errant were invented to fix the Iron Age. The narrator then undercuts his hero by calling the speech useless.

  Pastoral. With Antonio the book turns towards the pastoral romance, the other fashionable fiction of the time (Montemayor's Diana, and Cervantes' own Galatea of 1585), where shepherds are lovesick poets. Antonio can read, write and sing, and his song was written by a priest, so he is halfway between a real goatherd and a literary one. His ballad, as Ormsby notes, imitates the popular 'romance' in eight-syllable lines with i-o assonance, not the Italian sonnets of the pastoral novels. It is full of village detail: Sunday clothes, late-night serenades, a jealous rival girl, a fight with a cousin.

  Religion and law. Don Quijote quotes the Gospel ('whoever humbles himself will be exalted', Luke 14:11). The Golden Age speech invokes 'natural law', the moral law every person knows by reason, and attacks the 'ley del encaje', a judge's arbitrary verdict. Antonio contrasts marriage (the Church's silken yoke) with 'barraganía', concubinage, and threatens to become a Capuchin, a strict Franciscan order then about a century old.

  Names. Olalla is a country form of Eulalia. Teresa del Berrocal is 'Teresa from the Rocks', a comic village nickname. Antonio's uncle is a 'beneficiado', a priest living on a church income, the kind of man who might write verses for a nephew.

  Reading Cervantes' Spanish. This chapter adds a new layer: the high style of the Golden Age speech, with Latin word order (verb last: 'sabrosas y transparentes aguas les ofrecían'), long participle phrases placed before the noun ('la por tantos modos martirizada seda'), and doubled adjectives. The usual archaisms continue: mesmo, ansí, agora, asimesmo, priesa, proprio, recebir, escrebir, prompto, concetos, interese; contractions with 'de' (della, dél, desta, destas, dellos); pronouns attached to conjugated verbs (Sentáronse, quedábase, antojósele, Preguntáronle, Hémosle, Desmentíla); the old preterite 'trujeron' for 'trajeron'; the -ra subjunctive as a conditional ('quisiera', 'se pudiera escusar'); the future subjunctive ('bebiere', 'quisieres'); and -rl- becoming -ll- ('respondelle'). Watch for false friends: puesto que (although), tal vez (sometimes), discreto (wise), honesto (chaste), ignorar (not to know), pretender (to court), romance (ballad), curar (to treat).
