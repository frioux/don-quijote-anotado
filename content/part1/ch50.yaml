        forms:
          - {w: "volvían", f: "volv- + -ían → volver (to return), imperfect, they: 'were coming back'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "habían ido", f: "hab- + -ían → haber (to have), imperfect, they: había, habías, había, habíamos, habíais, habían; + ido, the participle of ir (to go): the pluperfect, 'had gone'."}
          - {w: "haciendo", f: "gerund of hacer (to make): 'making'. The gerund of -er verbs ends in -iendo."}
