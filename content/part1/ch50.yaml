            r: "main verb 2 (after 'que', for): for I'm off to that brook"
            under:
              - {s: "con esta empanada", r: "with what: with this pie"}
              - {s: "donde pienso hartarme por tres días", r: "describes 'arroyo': where I mean to eat my fill for three days"}
