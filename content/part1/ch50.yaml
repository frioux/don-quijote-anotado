  - sentences:
      - es: "— ¡Ah cerrera, cerrera, Manchada, Manchada, y cómo andáis vos estos días de pie cojo! ¿Qué lobos os espantan, hija? ¿No me diréis qué es esto, hermosa?"
        literal: "— Ah wild-one, wild-one, Spotty, Spotty, and how go you these days of foot lame! What wolves you frighten, daughter? Not to-me will-you-tell what is this, beautiful?"
        ormsby: "“Ah wanderer, wanderer, Spotty, Spotty; how have you gone limping all this time? What wolves have frightened you, my daughter? Won’t you tell me what is the matter, my beauty?"
        vocab:
          - {w: "cerrero", d: "wild, untamed, running loose in the hills (from 'cerro', hill)"}
          - {w: "Manchada", d: "'Spotty', the goat's name, from 'manchado' (spotted)"}
          - {w: "andar de pie cojo", d: "to go lame, limp; figuratively, to be in a bad way, go astray"}
          - {w: "espantar", d: "to frighten, scare off"}
          - {w: "hija", d: "daughter; an affectionate address, 'my girl'"}
        diagram:
          - s: "cómo andáis vos"
            r: "exclamation 1: how you are going"
            under:
              - {s: "¡Ah cerrera, cerrera, Manchada, Manchada", r: "who is addressed: ah, wild one, Spotty"}
              - {s: "estos días", r: "when: these days"}
              - {s: "de pie cojo", r: "how: lame"}
          - s: "¿Qué lobos os espantan"
            r: "question 1: what wolves are frightening you"
            under:
              - {s: "hija", r: "who is addressed: my girl"}
          - s: "¿No me diréis"
            r: "question 2: won't you tell me"
            under:
              - {s: "qué es esto", r: "what to tell: what this is"}
              - {s: "hermosa", r: "who is addressed: beauty"}
        forms:
          - {w: "cerrera", f: "cerrer- + -a → cerrero (wild), feminine to match the goat, used as a name-call."}
          - {w: "andáis vos", f: "and- + -áis → andar (to go), present, you (vos): 'vos' was the polite-to-familiar 'you' of Cervantes' day, taking the vosotros endings even when it speaks to one being. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "estos", f: "est- + -os → este (this), masculine plural to match 'días'."}
          - {w: "os", f: "'you', the object pronoun that goes with 'vos'."}
          - {w: "espantan", f: "espant- + -an → espantar (to frighten), present, they (the wolves). Same -ar present: -o, -as, -a, -amos, -áis, -an."}
          - {w: "diréis", f: "dir- + -éis → decir (to tell), future, you (vos). Irregular stem dir-: diré, dirás, dirá, diremos, diréis, dirán. 'No me diréis' = won't you tell me."}
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
        note: "The goatherd talks to his goat as to a wayward girl, with the respectful 'vos'; the comedy is that he is really talking about women, as his story will show."
      - es: "Mas ¡qué puede ser sino que sois hembra, y no podéis estar sosegada; que mal haya vuestra condición, y la de todas aquellas a quien imitáis!"
        literal: "But what can it-be except that you-are female, and not you-can be calm; for evil may-have your nature, and the [one] of all those to whom you-imitate!"
        ormsby: "But what else can it be except that you are a she, and cannot keep quiet? A plague on your humours and the humours of those you take after!"
