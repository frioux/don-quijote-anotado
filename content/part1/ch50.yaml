                r: "answer, 1: except that you are a female"
              - {s: "y no podéis estar sosegada", r: "answer, 2: and cannot keep still"}
          - s: "que mal haya vuestra condición"
            r: "curse (after 'que'): a plague on your nature"
            under:
              - s: "y la de todas aquellas"
                r: "and on the nature of all those females"
                under:
