        note: "In the previous chapter the canon had chosen this green meadow so that the carter's oxen could graze; the narrator reminds us of it with 'como queda dicho'."
      - es: "Y, estando comiendo, a deshora oyeron un recio estruendo y un son de esquila, que por entre unas zarzas y espesas matas que allí junto estaban sonaba, y al mesmo instante vieron salir de entre aquellas malezas una hermosa cabra, toda la piel manchada de negro, blanco y pardo."
