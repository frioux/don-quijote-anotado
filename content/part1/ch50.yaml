        literal: "— Not are bad philosophies those, as you say, Sancho; but, with all that, there-is much to say about this matter of counties."
        ormsby: "“That is not bad philosophy thou art talking, Sancho,” said the canon; “but for all that there is a good deal to be said on this matter of counties.”"
        vocab:
          - {w: "filosofías", d: "philosophies, here 'reasonings', picking up Sancho's own word ('No sé esas filosofías')"}
          - {w: "con todo eso", d: "for all that, nevertheless"}
          - {w: "materia", d: "subject, matter, question"}
          - {w: "condado", d: "county, the estate of a count (conde)"}
        diagram:
          - s: "No son malas filosofías ésas"
            r: "main verb 1: those are not bad philosophies"
            under:
              - {s: "como tú dices, Sancho", r: "aside: as you call them, Sancho"}
          - s: "pero, con todo eso, hay mucho que decir"
            r: "main verb 2: but, for all that, there is much to say"
            under:
              - {s: "sobre esta materia de condados", r: "about what: on this matter of counties"}
        forms:
          - {w: "son", f: "ser (to be), present, they. soy, eres, es, somos, sois, son."}
          - {w: "malas", f: "mal- + -as → malo (bad), feminine plural to match 'filosofías'."}
          - {w: "ésas", f: "es- + -as → ese (that), feminine plural, standing alone as a pronoun ('those'), so written with an accent in the older spelling."}
          - {w: "dices", f: "dic- + -es → decir (to say), present, you (tú). Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "hay mucho que decir", f: "hay = 'there is', from haber (to have); 'hay ... que' + infinitive = there is ... to (say)."}
          - {w: "esta", f: "est- + -a → este (this), feminine to match 'materia'."}
        note: "The Spanish gives no speaker; Ormsby, like many editors, assigns the line to the canon, since Don Quijote answers it in the next paragraph. It uses 'tú', a superior talking to a peasant."
