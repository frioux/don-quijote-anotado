      - es: "y, cuando me faltare, yo he oído decir que hay hombres en el mundo que toman en arrendamiento los estados de los señores, y les dan un tanto cada año, y ellos se tienen cuidado del gobierno, y el señor se está a pierna tendida, gozando de la renta que le dan, sin curarse de otra cosa;"
