          - {w: "beber una vez", d: "to have a drink, take a sup"}
          - {w: "con que", d: "with which, and with that"}
          - {w: "templar", d: "to temper, soothe, cool"}
          - {w: "cólera", d: "anger; in the old physiology also 'choler', the yellow bile that causes it"}
          - {w: "en tanto", d: "meanwhile, in the meantime"}
        diagram:
          - s: "Tomad este bocado"
            r: "main verb 1: take this morsel"
          - s: "y bebed una vez"
            r: "main verb 2: and have a drink"
            under:
              - {s: "con que templaréis la cólera", r: "result: with which you will cool your anger"}
          - s: "descansará la cabra"
            r: "main verb 3 (after 'y'): the goat will rest"
            under:
              - {s: "en tanto", r: "when: meanwhile"}
        forms:
          - {w: "Tomad, bebed", f: "tom- + -ad → tomar (to take) and beb- + -ed → beber (to drink), imperative, you (vos or vosotros): 'take!', 'drink!'. The vosotros imperative swaps the final -r of the infinitive for -d: tomad, bebed, vivid. The canon uses it to the goatherd as the polite 'vos'."}
          - {w: "este", f: "'this', masculine singular to match 'bocado'."}
          - {w: "templaréis", f: "templar- + -éis → templar (to temper), future, you (vos). The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "descansará", f: "descansar- + -á → descansar (to rest), future, she (the goat). Same future: descansaré, descansarás, descansará, descansaremos, descansaréis, descansarán. The subject 'la cabra' comes after the verb."}
  - sentences:
      - es: "Y el decir esto y el darle con la punta del cuchillo los lomos de un conejo fiambre, todo fue uno."
        literal: "And the saying this and the giving-him with the point of-the knife the loins of a rabbit cold, all was one."
        ormsby: "and so saying, he handed him the loins of a cold rabbit on a fork."
        vocab:
          - {w: "el decir ... el darle", d: "the infinitive used as a noun with 'el': 'the saying ... the giving'"}
          - {w: "todo fue uno", d: "it was all one, i.e. he did both at the same moment"}
          - {w: "lomo", d: "loin; plural 'lomos' = the back meat, the saddle of a rabbit"}
          - {w: "fiambre", d: "cold (of cooked meat); today also 'cold cuts'"}
        diagram:
          - s: "todo fue uno"
            r: "main verb: it was all one, both at once"
            under:
              - {s: "el decir esto", r: "subject 1 (summed up by 'todo'): saying this"}
              - s: "y el darle"
                r: "subject 2: and giving him"
                under:
                  - {s: "con la punta del cuchillo", r: "how: on the point of the knife"}
                  - {s: "los lomos de un conejo fiambre", r: "object: the loins of a cold rabbit"}
        forms:
          - {w: "el decir", f: "decir (to say), infinitive used as a noun with the article 'el': 'the saying'."}
          - {w: "el darle", f: "dar (to give) + le (to him), infinitive used as a noun with 'el', the pronoun hung on the end: 'the giving him'."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
          - {w: "fue", f: "fue → ser (to be), preterite, it. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
        note: "Ormsby says 'on a fork', but the Spanish says the point of the knife: the canon spears the meat and hands it over on his knife."
      - es: "Tomólo y agradeciólo el cabrero; bebió y sosegóse, y luego dijo:"
        literal: "Took-it and thanked-for-it the goatherd; he-drank and calmed-himself, and then he-said:"
        ormsby: "The goatherd took it with thanks, and drank and calmed himself, and then said,"
        vocab:
          - {w: "agradecer", d: "to be grateful for, thank someone for something (the thing is the object)"}
          - {w: "sosegarse", d: "to calm down"}
          - {w: "luego", d: "then; in Cervantes often 'at once'"}
        diagram:
          - s: "Tomólo y agradeciólo"
            r: "main verbs 1 and 2: took it and thanked him for it"
            under:
              - {s: "el cabrero", r: "subject: the goatherd"}
          - {s: "bebió y sosegóse", r: "main verbs 3 and 4: drank and calmed down"}
          - s: "y luego dijo:"
            r: "main verb 5: and then said"
        forms:
          - {w: "Tomólo, agradeciólo", f: "tom- + -ó + lo → tomar (to take) and agradec- + -ió + lo → agradecer (to thank for), preterite, he, with 'lo' (it) stuck on the end; modern 'lo tomó y lo agradeció'. Cervantes hangs the pronoun on a verb that opens a clause. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron; of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron. The accent is kept on the ó when the pronoun is added."}
          - {w: "bebió", f: "beb- + -ió → beber (to drink), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "sosegóse", f: "soseg- + -ó + se → sosegarse (to calm down), preterite, he, with 'se' (himself) stuck on the end; modern 'se sosegó'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— No querría que por haber yo hablado con esta alimaña tan en seso, me tuviesen vuestras mercedes por hombre simple; que en verdad que no carecen de misterio las palabras que le dije."
        literal: "— Not I-would-want that for having I spoken with this beast so in sense, me might-hold your worships for man simple; for in truth that not lack of mystery the words that to-it I-said."
        ormsby: "“I should be sorry if your worships were to take me for a simpleton for having spoken so seriously as I did to this animal; but the truth is there is a certain mystery in the words I used."
        vocab:
          - {w: "alimaña", d: "animal, beast; today mostly 'vermin', a pest that preys on game"}
          - {w: "en seso", d: "seriously, sensibly, as if to a rational being ('seso' = brain, good sense)"}
          - {w: "tener por", d: "to take for, consider as"}
          - {w: "simple", d: "simple-minded, a simpleton (not just 'plain')"}
          - {w: "carecer de", d: "to lack, be without"}
          - {w: "misterio", d: "hidden meaning, a deeper sense"}
        diagram:
          - s: "No querría"
            r: "main verb 1: I would not want"
            under:
              - s: "que ... me tuviesen vuestras mercedes por hombre simple"
                r: "what I would not want: that your worships should take me for a simpleton"
                under:
                  - {s: "por haber yo hablado con esta alimaña tan en seso", r: "why: for having talked so seriously to this animal"}
          - s: "que en verdad que no carecen de misterio"
            r: "main verb 2 (after 'que', for): for truly they are not without hidden meaning"
            under:
              - s: "las palabras"
                r: "subject: the words"
                under:
                  - {s: "que le dije", r: "describes 'palabras': that I said to it"}
        forms:
          - {w: "querría", f: "querr- + -ía → querer (to want), conditional, I: 'I would want', the polite way of saying 'I would not like'. Irregular stem querr-: querría, querrías, querría, querríamos, querríais, querrían."}
          - {w: "haber ... hablado", f: "haber (to have), infinitive, + hablado, the participle of hablar (to speak): 'having spoken', the perfect infinitive after 'por' (for, because of). The subject 'yo' is put between them, as Cervantes often does."}
          - {w: "esta", f: "est- + -a → este (this), feminine to match 'alimaña'."}
          - {w: "tuviesen", f: "tuv- + -iesen → tener (to hold), imperfect subjunctive (-se form), they (your worships): 'that you should take me'. Built on the preterite tuvieron: tuviese, tuvieses, tuviese, tuviésemos, tuvieseis, tuviesen. Subjunctive because it depends on 'no querría que'."}
          - {w: "vuestras mercedes", f: "'your graces', the polite 'you' plural (modern ustedes); it takes the they-form of the verb, so 'tuviesen'."}
          - {w: "carecen", f: "carec- + -en → carecer (to lack), present, they (the words). The present of -er verbs: -o (carezco), -es, -e, -emos, -éis, -en."}
          - {w: "le dije", f: "dij- + -e → decir (to say), preterite, I. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron. 'le' = to it (the goat)."}
      - es: "Rústico soy, pero no tanto que no entienda cómo se ha de tratar con los hombres y con las bestias."
        literal: "Rustic I-am, but not so-much that not I-may-understand how one has to deal with the men and with the beasts."
        ormsby: "I am a clown, but not so much of one but that I know how to behave to men and to beasts.”"
        vocab:
          - {w: "rústico", d: "a countryman, peasant; also uncouth, a 'clown' in the old sense of a yokel"}
          - {w: "no tanto que no", d: "not so much that ... not: 'not such a one that I do not understand'"}
          - {w: "tratar con", d: "to deal with, behave towards"}
          - {w: "bestia", d: "beast, animal (especially livestock)"}
        diagram:
          - s: "Rústico soy"
            r: "main verb 1: I am a countryman"
          - s: "pero no tanto"
            r: "main clause 2: but not so much"
            under:
              - s: "que no entienda"
                r: "result: that I do not understand"
                under:
                  - {s: "cómo se ha de tratar con los hombres y con las bestias", r: "what: how one must behave with men and with beasts"}
        forms:
          - {w: "soy", f: "soy → ser (to be), present, I: soy, eres, es, somos, sois, son. The predicate 'Rústico' is put first for emphasis."}
          - {w: "entienda", f: "entiend- + -a → entender (to understand), present subjunctive, I. The stem e becomes ie when stressed: entienda, entiendas, entienda, entendamos, entendáis, entiendan. Subjunctive because the result after 'no tanto que' is denied."}
          - {w: "se ha de tratar", f: "h- + -a → haber (to have), present, one: he, has, ha, hemos, habéis, han; 'haber de' + infinitive = must; 'se' makes it impersonal: 'how one must deal'. tratar (to deal) is the infinitive."}
  - sentences:
      - es: "— Eso creo yo muy bien —dijo el cura—, que ya yo sé de esperiencia que los montes crían letrados y las cabañas de los pastores encierran filósofos."
