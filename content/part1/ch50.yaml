summary: |
  Don Quijote answers the canon's attack on the books of chivalry. Books printed with the king's licence, approved by the censors and enjoyed by every kind of reader, cannot be lies, especially when they give a knight's father, mother, country, age and deeds day by day. To show what pleasure they give, he improvises an adventure: a knight hears a voice from a lake of boiling pitch full of serpents, throws himself in armour and all, and lands in flowery meadows finer than the Elysian Fields, with a crystal brook, ornamental fountains and a castle of gold and jewels. Damsels come out, bathe and perfume him, dress him in fine linen and a priceless mantle, serve him a silent banquet to unseen music, and then a lovelier damsel sits beside him to tell him how she lies enchanted there.

  Reading such books, he says, banishes melancholy. Since he became a knight-errant he has been brave, courteous, generous and patient, and though he was lately shut in a cage like a madman, he hopes soon to be king of some realm, where he can show his gratitude and liberality, for a poor man cannot practise generosity and gratitude without deeds is as dead as faith without works. Above all he wants to give Sancho the county he promised him long ago, if only he were sure Sancho could govern it.

  Sancho overhears and says that if he lacks the skill he will lease the estate to someone who pays him a fixed sum each year and enjoy the rent like a duke. The canon replies that a lord must still do justice himself, which needs judgment and good intentions. Sancho answers with a chain of reasoning: he would be king of his estate, do as he liked, please himself, be content, and want nothing more. Don Quijote settles the question by the example of Amadís, who made his squire count of the Ínsula Firme. The canon marvels at the knight's well-ordered nonsense and the squire's simplicity.

  The servants come back with the provisions mule and they all eat on a carpet spread on the grass. A spotted goat bursts out of the bushes, pursued by a goatherd who scolds her as if she could understand him, blaming her restlessness on her being female. The canon gives him wine and a cold loin of rabbit; the goatherd, calmer, says his words were not as simple as they seemed and offers to tell a true story that will prove the priest's remark that the hills breed learned men. Don Quijote, sensing an adventure, accepts for everyone; Sancho goes off to the brook with a meat pie, and the goat lies down beside her master as he begins his tale.
context: |
  Licensed lies. Don Quijote's first argument is a real one. Every book printed in Castile needed a royal licence, granted after the text had been read and approved by an official censor, and the front pages of books of the time print the licence and, often, the censors' approvals. If the king's council has passed a book, how can it be false? The canon, like the moralists of Cervantes' day who wanted the romances banned, would answer that a licence certifies that a book is harmless, not that it is true; Don Quijote cannot see the difference between permitted fiction and history.

  The Knight of the Lake. The adventure Don Quijote improvises is not taken from any single romance but strings together their stock marvels: the voice that challenges the knight, the plunge into a lake that turns out to be a passage to an otherworld, the meadows compared to the Elysian Fields of classical myth, palaces of gold and jewels built by fays ('fadas', the old word for fairies), damsels who bathe, anoint and dress the hero, a banquet served in silence to music from no visible player, and the enchanted lady who tells him her story. The title 'Caballero del Lago' recalls Lancelot of the Lake, raised by the Lady of the Lake in the Arthurian romances. Cervantes lets Don Quijote describe it all with real beauty, and the narrator then calls it 'concertados disparates', well-ordered nonsense. The grotto-fountain decorated 'a lo brutesco' with shells and coloured glass is a fashion of Renaissance gardens, where art was praised for outdoing nature.

  Kings, counts and leases. Don Quijote's ambition to be a king so as to reward his friends rests on the old idea that liberality was the princely virtue, and he backs it with the Epistle of James, 'faith without works is dead', a text at the centre of the Catholic-Protestant quarrel over salvation. Sancho's plan to farm out his county is just as real: lords commonly leased the collection of their rents and dues to 'arrendadores' for a fixed annual sum. The canon's answer, that justice cannot be leased, is the standard view of the duties of a lord. Sancho's reply, a chain of 'and being so ... and doing so ...', ends with the saying 'a Dios y veámonos, como dijo un ciego a otro': 'goodbye and let us see each other', funny in the mouth of a blind man. Amadís and the Ínsula Firme, the 'Firm Island' that Amadís wins in the romance, are Don Quijote's precedent, as they have been since he first promised Sancho an island.

  Text and editions. Ormsby notes that the third edition printed by Juan de la Cuesta in 1608 inserts a passage at this point 'for which there is neither authority nor necessity'. The short speech 'No son malas filosofías ésas' has no speaker named in the Spanish; Ormsby gives it to the canon.

  The goatherd. With the goat and the goatherd the book turns back to the pastoral world of the first part, where in the Grisóstomo and Marcela story shepherds turned out to be former students: hence the priest's remark that the hills breed learned men and the shepherds' huts hold philosophers. The goatherd's scolding of his goat for being female sounds comic, but he says his words 'are not without mystery', which prepares the story he begins at the end of the chapter. Sancho's 'Saco la mía' is, as Ormsby explains, a gambler's phrase for drawing out his stake and leaving the game. His fear of being lost in a forest and turned into 'carne momia' refers to mummy, the dried flesh of embalmed bodies that apothecaries of the time sold as a medicine.

  Reading Cervantes' Spanish. The old spellings of this chapter: vee (ve), mesmo (mismo), esperiencia (experiencia), distilada (destilada), intricado (intrincado), alhombra (alfombra), yerba (hierba), carbuncos (carbunclos), leyentes (lectores), fadas (hadas), negregura (negrura), and the contractions desta, destas, deste, dello, della. 'Empero' is the old 'pero', 'mía fe' an oath, 'acullá' a far-off 'there', and 'ha tan poco' and 'muchos días ha' use 'ha' where modern Spanish says 'hace'. Pronouns hang on verbs that open a clause (ofrécesele, entiéndese, acabóse, Tomólo, agradeciólo, sosegóse). The future subjunctive marks open possibilities (leyere, tuviere, faltare, ofreciere, quisieres, pudieres), and the -se subjunctive runs through wishes and reported requests (dijésemos, pusiese, ofreciese, hiciese, quisiese, diese). The goatherd speaks to his goat with 'vos' and its plural verb forms (andáis, sois, podéis, Volved), the courteous form of the time used here with comic tenderness, while the canon also calls the goatherd 'vos' and Don Quijote addresses the canon as 'vuestra merced'.
