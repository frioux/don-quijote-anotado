        forms:
          - {w: "puede", f: "pued- + -e → poder (to be able), present, it. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "sois", f: "ser (to be), present, you (vos): soy, eres, es, somos, sois, son. 'vos' takes the vosotros ending even for one listener."}
          - {w: "podéis", f: "pod- + -éis → poder (to be able), present, you (vos). Same paradigm: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "sosegada", f: "participle of sosegar (to calm), feminine to match the goat: 'calm'."}
          - {w: "haya", f: "hay- + -a → haber (to have), present subjunctive, it: 'may (evil) have'. haya, hayas, haya, hayamos, hayáis, hayan. A wish or curse; 'mal haya X' = curse X."}
          - {w: "vuestra", f: "vuestr- + -a → vuestro (your, with vos), feminine to match 'condición'."}
          - {w: "la de", f: "'the one of': 'la' stands for 'condición', so 'la de todas aquellas' = the nature of all those."}
          - {w: "imitáis", f: "imit- + -áis → imitar (to imitate), present, you (vos). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
        note: "The goatherd's joke about the restlessness of females is a common misogynist commonplace of the period; it prepares his story about a woman who ran off."
      - es: "Volved, volved, amiga; que si no tan contenta, a lo menos, estaréis más segura en vuestro aprisco, o con vuestras compañeras; que si vos que las habéis de guardar y encaminar andáis tan sin guía y tan descaminada, ¿en qué podrán parar ellas?"
        literal: "Return, return, friend; for if not so content, at the least, you-will-be more safe in your fold, or with your companions; for if you who them have to guard and to-guide go so without guide and so astray, in what will-they-be-able to-end-up they?"
        ormsby: "Come back, come back, my darling; and if you will not be so happy, at any rate you will be safe in the fold or with your companions; for if you who ought to keep and lead them, go wandering astray, what will become of them?”"
        vocab:
          - {w: "amiga", d: "friend; here an affectionate 'my dear'"}
          - {w: "a lo menos", d: "at least (modern 'al menos')"}
          - {w: "aprisco", d: "fold, pen for sheep or goats"}
          - {w: "haber de", d: "to have to, be supposed to"}
          - {w: "encaminar", d: "to guide, lead on the right road"}
          - {w: "descaminado", d: "astray, off the road (the opposite of 'encaminar')"}
          - {w: "parar en", d: "to end up as, come to; '¿en qué podrán parar?' = what will become of them?"}
        diagram:
          - s: "Volved, volved, amiga"
            r: "main verb 1: come back, come back, dear"
          - s: "estaréis más segura"
            r: "main verb 2 (after 'que', for): you will be safer"
            under:
              - {s: "si no tan contenta", r: "concession: if not so happy"}
              - {s: "a lo menos", r: "how much: at least"}
              - {s: "en vuestro aprisco, o con vuestras compañeras", r: "where: in your fold or with your companions"}
          - s: "¿en qué podrán parar ellas?"
            r: "main verb 3 (after 'que', for): what will become of them?"
            under:
              - s: "si vos ... andáis tan sin guía y tan descaminada"
                r: "condition: if you go so unguided and so astray"
                under:
                  - {s: "que las habéis de guardar y encaminar", r: "describes 'vos': who are supposed to keep and lead them"}
        forms:
          - {w: "Volved", f: "volv- + -ed → volver (to return), imperative, you (vos/vosotros): 'come back!'. The vosotros imperative swaps the final -r of the infinitive for -d: volved, mirad, venid."}
          - {w: "contenta, segura", f: "feminine forms of contento (happy) and seguro (safe), to match the goat."}
          - {w: "estaréis", f: "estar- + -éis → estar (to be), future, you (vos). The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "vuestro, vuestras", f: "'your' for vos: vuestro to match 'aprisco', vuestras (feminine plural) to match 'compañeras'."}
          - {w: "las", f: "'them', feminine plural for the other goats ('compañeras'), placed before 'habéis'."}
          - {w: "habéis de guardar", f: "hab- + -éis → haber (to have), present, you (vos): he, has, ha, hemos, habéis, han; 'haber de' + infinitive = to have to, be supposed to: 'you are supposed to guard'. guardar = to keep, encaminar = to guide."}
          - {w: "andáis", f: "and- + -áis → andar (to go), present, you (vos). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "descaminada", f: "participle of descaminar (to lead astray), feminine to match the goat."}
          - {w: "podrán", f: "podr- + -án → poder (to be able), future, they. Irregular stem podr-: podré, podrás, podrá, podremos, podréis, podrán."}
        note: "The goat is the leader the flock follows, so her straying is serious: if the guide goes astray, the rest are lost. The moral is aimed at women again, as the goatherd will admit."
