  - sentences:
      - es: "— Por ver que tiene este caso un no sé qué de sombra de aventura de caballería, yo, por mi parte, os oiré, hermano, de muy buena gana, y así lo harán todos estos señores, por lo mucho que tienen de discretos y de ser amigos de curiosas novedades que suspendan, alegren y entretengan los sentidos, como, sin duda, pienso que lo ha de hacer vuestro cuento. Comenzad, pues, amigo, que todos escucharemos."
        literal: "— Because-of seeing that has this case a not I-know what of shadow of adventure of chivalry, I, for my part, you will-hear, brother, with very good will, and so it will-do all these gentlemen, for the much that they-have of sensible and of being friends of curious novelties that may-hold-in-suspense, may-gladden and may-entertain the senses, as, without doubt, I-think that it has to do your tale. Begin, then, friend, for all we-will-listen."
        ormsby: "“Seeing that this affair has a certain colour of chivalry about it, I for my part, brother, will hear you most gladly, and so will all these gentlemen, from the high intelligence they possess and their love of curious novelties that interest, charm, and entertain the mind, as I feel quite sure your story will do. So begin, friend, for we are all prepared to listen.”"
        vocab:
          - {w: "por ver que", d: "seeing that, because I see that"}
          - {w: "caso", d: "affair, matter, happening"}
          - {w: "un no sé qué", d: "a certain something, an indefinable something"}
          - {w: "sombra", d: "shadow; here a trace, a hint"}
          - {w: "de muy buena gana", d: "very willingly, most gladly"}
          - {w: "por lo mucho que tienen de discretos", d: "because they are so very sensible ('lo mucho que tienen de' = how much they have of)"}
          - {w: "discreto", d: "sensible, intelligent, witty (not 'discreet')"}
          - {w: "curioso", d: "curious in the sense of rare, interesting, finely made"}
          - {w: "suspender", d: "to hold in suspense, enthrall, amaze"}
          - {w: "entretener", d: "to entertain, amuse; also to keep occupied"}
        diagram:
          - s: "yo, por mi parte, os oiré"
            r: "main verb 1: I for my part will hear you"
            under:
              - {s: "Por ver que tiene este caso un no sé qué de sombra de aventura de caballería", r: "why: seeing this affair has a certain hint of a chivalric adventure"}
              - {s: "hermano", r: "address: brother"}
              - {s: "de muy buena gana", r: "how: most gladly"}
          - s: "y así lo harán todos estos señores"
            r: "main verb 2: and so will all these gentlemen"
            under:
              - s: "por lo mucho que tienen de discretos y de ser amigos de curiosas novedades"
                r: "why: because they are so sensible and fond of curious novelties"
                under:
                  - {s: "que suspendan, alegren y entretengan los sentidos", r: "describes 'novedades': that enthrall, gladden and entertain the senses"}
                  - s: "como, sin duda, pienso"
                    r: "aside: as I think, no doubt"
                    under:
                      - {s: "que lo ha de hacer vuestro cuento", r: "what I think: that your tale will do it (entertain)"}
          - s: "Comenzad, pues, amigo"
            r: "main verb 3 (new sentence): begin, then, friend"
            under:
              - {s: "que todos escucharemos", r: "why: for we will all listen"}
        forms:
          - {w: "ver", f: "infinitive of ver (to see) after 'por' (because of): 'because of seeing, seeing that'."}
          - {w: "tiene, tienen", f: "tien- + -e / -en → tener (to have), present, it (the affair) and they (the gentlemen). Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "este, estos", f: "'this', masculine singular to match 'caso'; 'these', masculine plural to match 'señores'."}
          - {w: "sé", f: "sé → saber (to know), present, I: sé, sabes, sabe, sabemos, sabéis, saben; frozen in the phrase 'un no sé qué', 'an I-know-not-what'."}
          - {w: "oiré", f: "oir- + -é → oír (to hear), future, I. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án (oiré, oirás, oirá, oiremos, oiréis, oirán)."}
          - {w: "os", f: "'you', object pronoun for 'vos' and 'vosotros'; Don Quijote addresses the goatherd as the polite 'vos'."}
          - {w: "harán", f: "har- + -án → hacer (to do), future, they. Irregular stem har-: haré, harás, hará, haremos, haréis, harán. 'lo harán' = they will do it (listen)."}
          - {w: "discretos", f: "discret- + -os → discreto (sensible), masculine plural to match the gentlemen, after 'tienen de'."}
          - {w: "curiosas", f: "curios- + -as → curioso (curious, rare), feminine plural to match 'novedades', placed before the noun."}
          - {w: "suspendan, alegren, entretengan", f: "suspend- + -an → suspender (to enthrall), alegr- + -en → alegrar (to gladden), entreteng- + -an → entretener (to entertain), present subjunctive, they (the novelties): 'such as to enthrall'. Subjunctive because the clause describes the kind of novelty, not a known one. -er verbs: -a, -as, -a, -amos, -áis, -an; -ar verbs: -e, -es, -e, -emos, -éis, -en; entretener: entretenga, entretengas, entretenga, entretengamos, entretengáis, entretengan."}
          - {w: "pienso", f: "piens- + -o → pensar (to think), present, I. The stem e becomes ie when stressed: pienso, piensas, piensa, pensamos, pensáis, piensan."}
          - {w: "ha de hacer", f: "h- + -a → haber (to have), present, it: he, has, ha, hemos, habéis, han; 'haber de' + infinitive = will, is bound to: 'your tale will do it'. hacer (to do) is the infinitive."}
          - {w: "vuestro", f: "'your' for 'vos', masculine to match 'cuento'."}
          - {w: "Comenzad", f: "comenz- + -ad → comenzar (to begin), imperative, you (vos): 'begin!'. The vosotros imperative swaps the final -r of the infinitive for -d: comenzad, comed, vivid."}
          - {w: "escucharemos", f: "escuchar- + -emos → escuchar (to listen), future, we. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
  - sentences:
      - es: "— Saco la mía —dijo Sancho—; que yo a aquel arroyo me voy con esta empanada, donde pienso hartarme por tres días;"
        literal: "— I-take-out the mine —said Sancho—; for I to that brook myself go with this pie, where I-intend to-stuff-myself for three days;"
        ormsby: "“I draw my stakes,” said Sancho, “and will retreat with this pasty to the brook there, where I mean to victual myself for three days;"
        ormsby_note: "The phrase used only by a player who wishes to withdraw from a game."
        vocab:
          - {w: "sacar la mía", d: "'I take out mine': a gambler's phrase for withdrawing his stake and leaving the game; Sancho is opting out of the story"}
          - {w: "arroyo", d: "brook, stream"}
          - {w: "irse", d: "to go off, go away"}
          - {w: "empanada", d: "a pie or pasty, meat or fish baked in pastry"}
          - {w: "pensar + infinitive", d: "to intend to, mean to"}
          - {w: "hartarse", d: "to eat one's fill, stuff oneself"}
