          - {w: "pienso", f: "piens- + -o → pensar (to think, intend), present, I. The stem e becomes ie when stressed: pienso, piensas, piensa, pensamos, pensáis, piensan."}
          - {w: "hartarme", f: "hartar (to fill) + me (myself), the pronoun hung on the infinitive after 'pienso'."}
      - es: "porque he oído decir a mi señor don Quijote que el escudero de caballero andante ha de comer, cuando se le ofreciere, hasta no poder más, a causa que se les suele ofrecer entrar acaso por una selva tan intricada que no aciertan a salir della en seis días;"
        literal: "because I-have heard say to my master Don Quijote that the squire of knight errant has to eat, when itself to-him may-offer, until not to-be-able more, by cause that itself to-them is-wont to-offer to-enter by-chance through a forest so tangled that not they-manage to come-out of-it in six days;"
        ormsby: "for I have heard my lord, Don Quixote, say that a knight-errant’s squire should eat until he can hold no more, whenever he has the chance, because it often happens them to get by accident into a wood so thick that they cannot find a way out of it for six days;"
