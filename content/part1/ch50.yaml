  - sentences:
      - es: "Admirado quedó el canónigo de los concertados disparates que don Quijote había dicho, del modo con que había pintado la aventura del Caballero del Lago, de la impresión que en él habían hecho las pensadas mentiras de los libros que había leído;"
        literal: "Amazed remained the canon at the orderly nonsenses that Don Quijote had said, at-the manner with which he-had painted the adventure of-the Knight of-the Lake, at the impression that in him had made the premeditated lies of the books that he-had read;"
        ormsby: "The canon was astonished at the methodical nonsense (if nonsense be capable of method) that Don Quixote uttered, at the way in which he had described the adventure of the knight of the lake, at the impression that the deliberate lies of the books he read had made upon him,"
        vocab:
          - {w: "admirado", d: "astonished, amazed (not 'admiring'); 'admirar' = to astonish"}
          - {w: "quedar", d: "to be left, end up; 'quedó admirado' = was left astonished"}
          - {w: "concertado", d: "well-ordered, methodical"}
          - {w: "disparate", d: "piece of nonsense, absurdity"}
          - {w: "pintar", d: "to paint; here 'to describe vividly'"}
          - {w: "Caballero del Lago", d: "the Knight of the Lake: the nameless hero of Don Quijote's tale of the boiling lake just told, not a particular romance knight (though it recalls Lancelot 'du Lac')"}
          - {w: "pensado", d: "premeditated, deliberate, thought-out"}
        diagram:
