          - {w: "alhombra", d: "= alfombra, carpet, rug (old form)"}
          - {w: "yerba", d: "= hierba, grass (old form, still used in some regions)"}
          - {w: "boyero", d: "ox-driver, the carter whose ox-cart carries Don Quijote's cage"}
          - {w: "comodidad", d: "convenience, advantage (of the good pasture for his oxen), not 'comfort' only"}
          - {w: "como queda dicho", d: "as has been said (literally 'as remains said')"}
