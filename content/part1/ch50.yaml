  - sentences:
      - es: "— Trabaje vuestra merced, señor don Quijote, en darme ese condado, tan prometido de vuestra merced como de mí esperado, que yo le prometo que no me falte a mí habilidad para gobernarle;"
        literal: "— Work your grace, sir Don Quijote, at giving-me that county, as-much promised by your grace as by me awaited, for I to-you promise that not to-me may-lack to me ability to govern-it;"
