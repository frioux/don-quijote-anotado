part: 1
chapter: 50
title_es: Capítulo L. De las discretas altercaciones que don Quijote y el canónigo tuvieron, con otros sucesos
title_en: "Of the shrewd controversy which Don Quixote and the canon held, together with other incidents"
paragraphs:
  - sentences:
      - es: "— ¡Bueno está eso! —respondió don Quijote—."
        literal: "— Good is that! — answered Don Quijote —."
        ormsby: "“A good joke, that!” returned Don Quixote."
        vocab:
          - {w: "¡Bueno está eso!", d: "'That's a good one!', ironic: 'a fine thing to say!', 'what nonsense!'"}
        diagram:
          - s: "¡Bueno está eso!"
            r: "what he said: that's a good one!"
            under:
              - {s: "eso", r: "subject: that (what the canon has just said)"}
          - s: "respondió don Quijote"
            r: "speech tag: Don Quijote answered"
        forms:
          - {w: "está", f: "est- + -á → estar (to be), present, it: 'is'. estar in the present: estoy, estás, está, estamos, estáis, están. 'Bueno está' with estar (to be) and the adjective first is an ironic exclamation."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
        note: "At the end of the previous chapter the canon told Don Quijote that the books of chivalry are lies and that a man of his understanding should not believe them. This is Don Quijote's indignant reply."
      - es: "Los libros que están impresos con licencia de los reyes y con aprobación de aquellos a quien se remitieron, y que con gusto general son leídos y celebrados de los grandes y de los chicos, de los pobres y de los ricos, de los letrados e ignorantes, de los plebeyos y caballeros, finalmente, de todo género de personas, de cualquier estado y condición que sean, ¿habían de ser mentira?;"
        literal: "The books that are printed with licence of the kings and with approval of those to whom themselves they-were-sent, and that with pleasure general are read and celebrated by the great and by the small, by the poor and by the rich, by the learned and ignorant, by the commoners and knights, finally, by every kind of persons, of whatever estate and condition that they-may-be, were-they to be lie?;"
        ormsby: "“Books that have been printed with the king’s licence, and with the approbation of those to whom they have been submitted, and read with universal delight, and extolled by great and small, rich and poor, learned and ignorant, gentle and simple, in a word by people of every sort, of whatever rank or condition they may be, that these should be lies!"
        vocab:
          - {w: "impreso", d: "printed (irregular participle of 'imprimir')"}
          - {w: "licencia", d: "licence: the royal permission to print that every book in Spain needed"}
          - {w: "aprobación", d: "approval: the censor's certificate printed at the front of a book"}
          - {w: "remitir", d: "to send, submit (a book to the censors)"}
          - {w: "celebrado de", d: "praised by; old Spanish often uses 'de' for 'by' after a passive"}
          - {w: "letrado", d: "learned man, scholar, lawyer"}
          - {w: "plebeyo", d: "commoner, plebeian"}
          - {w: "género", d: "kind, sort (not 'gender' here)"}
          - {w: "estado", d: "rank, social estate (not 'state' in the political sense)"}
          - {w: "haber de", d: "to be (supposed) to, must; '¿habían de ser mentira?' = were they then to be lies?"}
        diagram:
          - s: "¿habían de ser mentira?"
            r: "main verb: were they to be lies?"
            under:
              - s: "Los libros"
                r: "subject: the books"
                under:
                  - {s: "que están impresos con licencia de los reyes", r: "describes 'libros', 1: that are printed with royal licence"}
                  - s: "y con aprobación de aquellos"
                    r: "describes 'libros', 1 continued: and with the approval of those"
                    under:
                      - {s: "a quien se remitieron", r: "describes 'aquellos': to whom they were sent"}
                  - s: "y que con gusto general son leídos y celebrados"
                    r: "describes 'libros', 2: and that are read and praised with general pleasure"
                    under:
                      - {s: "de los grandes y de los chicos, de los pobres y de los ricos, de los letrados e ignorantes, de los plebeyos y caballeros", r: "by whom: by great and small, poor and rich, learned and ignorant, commoners and gentlemen"}
                      - {s: "finalmente, de todo género de personas", r: "by whom, summed up: in short, by every kind of person"}
                      - {s: "de cualquier estado y condición que sean", r: "describes 'personas': of whatever rank and condition they may be"}
        forms:
          - {w: "están impresos", f: "est- + -án → estar (to be), present, they: estoy, estás, está, estamos, estáis, están; + impresos, the irregular participle of imprimir (to print), masculine plural to match 'libros'."}
          - {w: "aquellos", f: "aquell- + -os → aquel (that, those over there), masculine plural: 'those people'."}
          - {w: "a quien", f: "'to whom'; Cervantes uses singular 'quien' even for a plural antecedent ('aquellos'); modern Spanish says 'a quienes'."}
          - {w: "se remitieron", f: "remit- + -ieron → remitir (to send), preterite, they, with 'se' making it passive: 'they were sent'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "son leídos y celebrados", f: "son (ser (to be), present, they: soy, eres, es, somos, sois, son) + the participles leídos (from leer (to read)) and celebrados (from celebrar (to praise)), masculine plural to match 'libros': the passive voice, 'are read and praised'."}
          - {w: "e", f: "'y' (and) becomes 'e' before a word starting with an i sound: 'letrados e ignorantes'."}
          - {w: "sean", f: "se- + -an → ser (to be), present subjunctive, they: sea, seas, sea, seamos, seáis, sean. Subjunctive after 'cualquier ... que' (whatever)."}
          - {w: "habían de ser", f: "hab- + -ían → haber (to have), imperfect, they: había, habías, había, habíamos, habíais, habían; + de + ser (to be): 'haber de' + infinitive = to be to, must. 'Were they to be lies?'"}
        note: "Every book printed in Spain carried at the front the king's licence and the approval of a censor. Don Quijote treats these legal formalities as a guarantee that the contents are true."
      - es: "y más llevando tanta apariencia de verdad, pues nos cuentan el padre, la madre, la patria, los parientes, la edad, el lugar y las hazañas, punto por punto y día por día, que el tal caballero hizo, o caballeros hicieron."
        literal: "and more carrying so-much appearance of truth, since to-us they-tell the father, the mother, the homeland, the relatives, the age, the place and the deeds, point by point and day by day, that the such knight did, or knights did."
        ormsby: "And above all when they carry such an appearance of truth with them; for they tell us the father, mother, country, kindred, age, place, and the achievements, step by step, and day by day, performed by such a knight or knights!"
        vocab:
          - {w: "y más", d: "and all the more, especially"}
          - {w: "apariencia", d: "appearance, semblance"}
          - {w: "patria", d: "homeland, native country"}
          - {w: "parientes", d: "relatives, kin (false friend: not 'parents', which is 'padres')"}
          - {w: "hazaña", d: "deed, exploit, feat"}
          - {w: "punto por punto", d: "point by point, in every detail"}
          - {w: "el tal caballero", d: "the knight in question, such-and-such a knight"}
        diagram:
          - s: "y más llevando tanta apariencia de verdad"
            r: "carries on the question before: and all the more as they carry so much appearance of truth"
            under:
              - s: "pues nos cuentan"
                r: "why: since they tell us"
                under:
                  - {s: "el padre, la madre, la patria, los parientes, la edad, el lugar y las hazañas", r: "objects: the father, mother, homeland, kin, age, place and deeds"}
                  - {s: "punto por punto y día por día", r: "how: in every detail, day by day"}
                  - {s: "que el tal caballero hizo, o caballeros hicieron", r: "describes 'hazañas': that such a knight, or knights, did"}
        forms:
          - {w: "llevando", f: "llev- + -ando → llevar (to carry), gerund: 'carrying, as they carry'. -ar verbs make the gerund with -ando."}
          - {w: "tanta", f: "tant- + -a → tanto (so much), feminine to match 'apariencia'."}
          - {w: "cuentan", f: "cuent- + -an → contar (to tell), present, they (the books). The stem o becomes ue when stressed: cuento, cuentas, cuenta, contamos, contáis, cuentan."}
          - {w: "hizo, hicieron", f: "hic-/hiz- + -o / -ieron → hacer (to do), preterite, he and they. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron (c becomes z before o)."}
      - es: "Calle vuestra merced, no diga tal blasfemia (y créame que le aconsejo en esto lo que debe de hacer como discreto), sino léalos, y verá el gusto que recibe de su leyenda."
        literal: "Be-silent your grace, not say such blasphemy (and believe-me that you I-advise in this that which you-ought to do as sensible [man]), but read-them, and you-will-see the pleasure that you-receive from their reading."
        ormsby: "Hush, sir; utter not such blasphemy; trust me I am advising you now to act as a sensible man should; only read them, and you will see the pleasure you will derive from them."
        vocab:
          - {w: "callar", d: "to be quiet, hold one's tongue"}
          - {w: "vuestra merced", d: "'your grace', the polite 'you'; takes a 'he/she' verb (the origin of modern 'usted')"}
          - {w: "blasfemia", d: "blasphemy; Don Quijote treats doubting the romances as an insult to something sacred"}
          - {w: "aconsejar", d: "to advise"}
          - {w: "deber de", d: "here 'ought to, must' (in Cervantes 'deber de' and 'deber' are used interchangeably)"}
          - {w: "discreto", d: "sensible, wise, judicious (not just 'discreet')"}
          - {w: "leyenda", d: "reading (old sense, from Latin 'legenda', things to be read); not 'legend'"}
        diagram:
          - s: "Calle vuestra merced"
            r: "main verb 1: be silent, sir"
          - s: "no diga tal blasfemia"
            r: "main verb 2: do not say such blasphemy"
          - s: "y créame"
            r: "aside: and believe me"
            under:
              - s: "que le aconsejo en esto lo"
                r: "what to believe: that I advise you in this that"
                under:
                  - {s: "que debe de hacer como discreto", r: "describes 'lo': what you ought to do as a sensible man"}
          - s: "sino léalos"
            r: "main verb 3: but read them"
          - s: "y verá el gusto"
            r: "main verb 4: and you will see the pleasure"
            under:
              - {s: "que recibe de su leyenda", r: "describes 'gusto': that you get from reading them"}
        forms:
          - {w: "Calle", f: "call- + -e → callar (to be quiet), present subjunctive, you (vuestra merced, a 'he' form): a polite command. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "diga", f: "dig- + -a → decir (to say), present subjunctive, you (vuestra merced): 'no diga' = do not say. Irregular: diga, digas, diga, digamos, digáis, digan. A negative command always uses the subjunctive."}
          - {w: "créame", f: "cre- + -a + me → creer (to believe), present subjunctive, you (vuestra merced), with 'me' stuck on the end: 'believe me'. creer in the present subjunctive: crea, creas, crea, creamos, creáis, crean. In a positive command the pronoun is attached to the end of the verb, and an accent is added to keep the stress."}
          - {w: "le aconsejo", f: "aconsej- + -o → aconsejar (to advise), present, I: aconsejo, aconsejas, aconseja, aconsejamos, aconsejáis, aconsejan; 'le' = to you (vuestra merced)."}
          - {w: "debe de hacer", f: "deb- + -e → deber (ought to), present, you (vuestra merced): debo, debes, debe, debemos, debéis, deben; + de + hacer (to do)."}
          - {w: "léalos", f: "le- + -a + los → leer (to read), present subjunctive, you (vuestra merced), with 'los' (them, the books) stuck on the end: 'read them'. leer in the present subjunctive: lea, leas, lea, leamos, leáis, lean. Positive command, so the pronoun is attached and an accent added."}
          - {w: "verá", f: "ver- + -á → ver (to see), future, you (vuestra merced). The future adds endings to the whole infinitive: veré, verás, verá, veremos, veréis, verán."}
          - {w: "recibe", f: "recib- + -e → recibir (to receive), present, you (vuestra merced). The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
      - es: "Si no, dígame: ¿hay mayor contento que ver, como si dijésemos:"
        literal: "If not, tell-me: is-there greater delight than to-see, as if we-were-to-say:"
        ormsby: "For, come, tell me, can there be anything more delightful than to see, as it were,"
        vocab:
          - {w: "si no", d: "otherwise, or else; here 'come now'"}
          - {w: "contento", d: "delight, pleasure (a noun here)"}
          - {w: "como si dijésemos", d: "as if we were to say, so to speak; 'for example'"}
        diagram:
          - s: "Si no, dígame:"
            r: "main verb 1: or else, tell me"
          - s: "¿hay mayor contento"
            r: "main verb 2: is there greater delight"
            under:
              - s: "que ver"
                r: "than what: than to see"
                under:
                  - {s: "como si dijésemos:", r: "aside: as if we were to say (an example follows)"}
        forms:
          - {w: "dígame", f: "dig- + -a + me → decir (to say), present subjunctive, you (vuestra merced), with 'me' stuck on the end: 'tell me'. Irregular: diga, digas, diga, digamos, digáis, digan. In a positive command the pronoun is attached and an accent added."}
          - {w: "hay", f: "the impersonal form of haber (to have): 'there is, is there'."}
          - {w: "mayor", f: "comparative of grande (great): 'greater'."}
          - {w: "dijésemos", f: "dij- + -ésemos → decir (to say), imperfect subjunctive (-se form), we. Built on the preterite dijeron: dijese, dijeses, dijese, dijésemos, dijeseis, dijesen. 'como si' always takes the imperfect subjunctive."}
      - es: "aquí ahora se muestra delante de nosotros un gran lago de pez hirviendo a borbollones, y que andan nadando y cruzando por él muchas serpientes, culebras y lagartos, y otros muchos géneros de animales feroces y espantables, y que del medio del lago sale una voz tristísima que dice:"
        literal: "here now itself shows before of us a great lake of pitch boiling in bubblings, and that go swimming and crossing through it many serpents, snakes and lizards, and other many kinds of animals fierce and frightful, and that from-the middle of-the lake comes-out a voice most-sad that says:"
        ormsby: "here now displayed before us a vast lake of bubbling pitch with a host of snakes and serpents and lizards, and ferocious and terrible creatures of all sorts swimming about in it, while from the middle of the lake there comes a plaintive voice saying:"
        vocab:
          - {w: "pez", d: "pitch, tar (feminine 'la pez'); not the fish 'el pez'"}
          - {w: "a borbollones", d: "bubbling up, in great bubbles, seething"}
          - {w: "culebra", d: "snake (smaller than 'serpiente')"}
          - {w: "lagarto", d: "lizard; also used of crocodiles in old texts"}
          - {w: "espantable", d: "frightful, terrifying (old form beside 'espantoso')"}
        diagram:
          - s: "se muestra"
            r: "main verb 1: there appears"
            under:
              - {s: "aquí ahora", r: "where and when: here, now"}
              - {s: "delante de nosotros", r: "where: before us"}
              - s: "un gran lago de pez"
                r: "subject: a great lake of pitch"
                under:
                  - {s: "hirviendo a borbollones", r: "describes 'lago': boiling and bubbling"}
          - s: "y que andan nadando y cruzando por él"
            r: "main verb 2 (still after 'ver, como si dijésemos'): and that there go swimming and crossing through it"
            under:
              - {s: "muchas serpientes, culebras y lagartos", r: "subject: many serpents, snakes and lizards"}
              - {s: "y otros muchos géneros de animales feroces y espantables", r: "subject, 2: and many other kinds of fierce and frightful animals"}
          - s: "y que del medio del lago sale una voz tristísima"
            r: "main verb 3: and that from the middle of the lake comes a most sorrowful voice"
            under:
              - {s: "que dice:", r: "describes 'voz': which says (the speech follows)"}
        forms:
          - {w: "se muestra", f: "muestr- + -a → mostrarse (to show oneself, appear), present, it, with 'se'. The stem o becomes ue when stressed: muestro, muestras, muestra, mostramos, mostráis, muestran."}
          - {w: "gran", f: "grande (great) clipped before a singular noun ('lago')."}
          - {w: "hirviendo", f: "gerund of hervir (to boil): the e of the stem turns to i in the gerund, hervir → hirviendo."}
          - {w: "andan nadando y cruzando", f: "and- + -an → andar (to go), present, they: ando, andas, anda, andamos, andáis, andan; + the gerunds nadando (from nadar (to swim)) and cruzando (from cruzar (to cross)). andar + gerund = to go about doing, keep doing."}
          - {w: "él", f: "'it', masculine because it stands for 'el lago'."}
          - {w: "del", f: "de + el, 'of the, from the', the contraction modern Spanish still makes."}
          - {w: "sale", f: "sal- + -e → salir (to come out), present, it (the voice). salgo, sales, sale, salimos, salís, salen."}
          - {w: "tristísima", f: "trist- + -ísima → triste (sad) + -ísimo (very, most), feminine to match 'voz': 'most sorrowful'."}
          - {w: "dice", f: "dic- + -e → decir (to say), present, it. Irregular: digo, dices, dice, decimos, decís, dicen."}
        note: "Don Quijote invents a typical romance adventure on the spot: an enchanted lake, a voice summoning the knight, and a paradise beneath the water. The scene recalls episodes of the chivalric romances, such as the enchanted lakes of the Arthurian cycle, without copying any one of them."
      - es: "«Tú, caballero, quienquiera que seas, que el temeroso lago estás mirando, si quieres alcanzar el bien que debajo destas negras aguas se encubre, muestra el valor de tu fuerte pecho y arrójate en mitad de su negro y encendido licor;"
        literal: "«You, knight, whoever that you-may-be, who the fearful lake are looking-at, if you-want to-attain the good that under of-these black waters itself hides, show the valour of your strong breast and throw-yourself into middle of its black and burning liquor;"
        ormsby: "‘Knight, whosoever thou art who beholdest this dread lake, if thou wouldst win the prize that lies hidden beneath these dusky waves, prove the valour of thy stout heart and cast thyself into the midst of its dark burning waters,"
        vocab:
          - {w: "quienquiera que seas", d: "whoever you may be"}
          - {w: "temeroso", d: "here 'fearful, dreadful' (causing fear), not 'afraid'"}
          - {w: "alcanzar", d: "to attain, win, reach"}
          - {w: "el bien", d: "the good thing, the prize, the treasure"}
          - {w: "destas", d: "= de estas, of these (old contraction)"}
          - {w: "encubrirse", d: "to lie hidden, be concealed"}
          - {w: "pecho", d: "breast, heart; the seat of courage"}
          - {w: "arrojarse", d: "to throw oneself, plunge"}
          - {w: "licor", d: "liquid (any liquid, not just alcohol)"}
        diagram:
          - s: "Tú, caballero, quienquiera que seas"
            r: "who is addressed: you, knight, whoever you are"
            under:
              - {s: "que el temeroso lago estás mirando", r: "describes 'tú': who are looking at the dreadful lake"}
          - s: "si quieres alcanzar el bien"
            r: "condition: if you want to win the prize"
            under:
              - {s: "que debajo destas negras aguas se encubre", r: "describes 'bien': that lies hidden under these black waters"}
          - s: "muestra el valor de tu fuerte pecho"
            r: "main verb 1: show the valour of your stout heart"
          - s: "y arrójate"
            r: "main verb 2: and throw yourself"
            under:
              - {s: "en mitad de su negro y encendido licor", r: "where: into the middle of its black, burning liquid"}
        forms:
          - {w: "seas", f: "se- + -as → ser (to be), present subjunctive, you (tú): sea, seas, sea, seamos, seáis, sean. Subjunctive after 'quienquiera que' (whoever)."}
          - {w: "estás mirando", f: "est- + -ás → estar (to be), present, you (tú): estoy, estás, está, estamos, estáis, están; + mirando, the gerund of mirar (to look at): 'you are looking at'. The object 'el temeroso lago' comes before the verb, a poetic order."}
          - {w: "quieres", f: "quier- + -es → querer (to want), present, you (tú). The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "destas", f: "de + estas (these), feminine plural to match 'aguas'; the old written contraction, modern 'de estas'."}
          - {w: "se encubre", f: "encubr- + -e → encubrirse (to lie hidden), present, it. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "muestra", f: "muestr- + -a → mostrar (to show), imperative, you (tú). The tú imperative is the same as the 'he' form of the present: muestra, like 'muestro, muestras, muestra' with o becoming ue when stressed."}
          - {w: "arrójate", f: "arroj- + -a + te → arrojarse (to throw oneself), imperative, you (tú), with 'te' (yourself) stuck on the end and an accent added to keep the stress. In a positive command the pronoun is always attached to the end."}
          - {w: "encendido", f: "participle of encender (to set on fire), used as an adjective: 'burning', masculine to match 'licor'."}
      - es: "porque si así no lo haces, no serás digno de ver las altas maravillas que en sí encierran y contienen los siete castillos de las siete fadas que debajo desta negregura yacen?»"
        literal: "because if thus not it you-do, not you-will-be worthy to see the high marvels that in themselves enclose and contain the seven castles of the seven fairies that under of-this blackness lie?»"
        ormsby: "else thou shalt not be worthy to see the mighty wonders contained in the seven castles of the seven Fays that lie beneath this black expanse;’"
        vocab:
          - {w: "digno de", d: "worthy of"}
          - {w: "encerrar", d: "to enclose, shut in, hold"}
          - {w: "fada", d: "fairy, fay (old word, modern 'hada'); the enchantresses of the romances"}
          - {w: "desta", d: "= de esta, of this (old contraction)"}
          - {w: "negregura", d: "blackness, darkness (rare word)"}
          - {w: "yacer", d: "to lie (be situated; also 'lie buried')"}
        diagram:
          - s: "no serás digno de ver las altas maravillas"
            r: "main verb (after 'porque'): you will not be worthy to see the high marvels"
            under:
              - {s: "si así no lo haces", r: "condition: if you do not do so"}
              - s: "que en sí encierran y contienen los siete castillos de las siete fadas"
                r: "describes 'maravillas': that the seven castles of the seven fays hold within them"
                under:
                  - {s: "que debajo desta negregura yacen", r: "describes 'castillos': which lie under this blackness"}
        forms:
          - {w: "haces", f: "hac- + -es → hacer (to do), present, you (tú). hago, haces, hace, hacemos, hacéis, hacen. 'lo' = it, standing for the plunge."}
          - {w: "serás", f: "ser- + -ás → ser (to be), future, you (tú). The future adds endings to the whole infinitive: seré, serás, será, seremos, seréis, serán."}
          - {w: "encierran, contienen", f: "encierr- + -an → encerrar (to enclose), present, they: encierro, encierras, encierra, encerramos, encerráis, encierran (e becomes ie when stressed). conten- → contener (to contain), present, they, conjugated like tener (to have): contengo, contienes, contiene, contenemos, contenéis, contienen. The subject 'los siete castillos' comes after the verbs."}
          - {w: "sí", f: "'themselves', the pronoun after a preposition referring back to the subject; written with an accent to tell it from 'si' (if)."}
