        vocab:
          - {w: "esperiencia", d: "= experiencia, experience (old spelling)"}
          - {w: "monte", d: "wooded hills, wild country, scrub (not only 'mountain')"}
          - {w: "criar", d: "to breed, raise, bring up"}
          - {w: "letrado", d: "a learned man, scholar; often specifically a lawyer"}
          - {w: "cabaña", d: "hut, shepherd's cabin"}
          - {w: "encerrar", d: "to shut in, contain, hold"}
        diagram:
          - s: "Eso creo yo muy bien"
            r: "main verb: that I quite believe"
            under:
              - {s: "dijo el cura", r: "speech tag: said the priest"}
              - s: "que ya yo sé de esperiencia"
                r: "why: for I already know from experience"
                under:
                  - {s: "que los montes crían letrados", r: "what he knows, 1: that the wilds breed scholars"}
                  - {s: "y las cabañas de los pastores encierran filósofos", r: "what he knows, 2: and shepherds' huts hold philosophers"}
        forms:
          - {w: "creo", f: "cre- + -o → creer (to believe), present, I. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "sé", f: "sé → saber (to know), present, I. Irregular in the I-form: sé, sabes, sabe, sabemos, sabéis, saben. The accent tells it from the pronoun 'se'."}
          - {w: "crían, encierran", f: "cri- + -an → criar (to breed) and encierr- + -an → encerrar (to enclose), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an; in encerrar the stem e becomes ie when stressed: encierro, encierras, encierra, encerramos, encerráis, encierran."}
        note: "The priest may be thinking of the pastoral episode of Grisóstomo and Marcela earlier in the book, where the 'shepherds' were students from Salamanca, and of Cardenio in the Sierra Morena."
  - sentences:
