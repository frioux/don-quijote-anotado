  - sentences:
      - es: "— Por vida vuestra, hermano, que os soseguéis un poco y no os acuciéis en volver tan presto esa cabra a su rebaño; que, pues ella es hembra, como vos decís, ha de seguir su natural distinto, por más que vos os pongáis a estorbarlo."
        literal: "— By life yours, brother, that yourself you-calm a little and not yourself you-hurry in returning so quickly that goat to its flock; for, since she is female, as you say, she-has to follow her natural instinct, for more that you yourself may-set to hinder-it."
        ormsby: "“As you live, brother, take it easy, and be not in such a hurry to drive this goat back to the fold; for, being a female, as you say, she will follow her natural instinct in spite of all you can do to prevent it."
        vocab:
          - {w: "por vida vuestra", d: "'as you live, upon your life', a polite oath used to press a request"}
          - {w: "sosegarse", d: "to calm down, take it easy"}
          - {w: "acuciarse", d: "to hurry, be in a rush (old and literary)"}
          - {w: "presto", d: "quickly, soon (literary)"}
          - {w: "rebaño", d: "flock, herd"}
          - {w: "hembra", d: "female (of animals; said of women, it is blunt or comic)"}
          - {w: "natural distinto", d: "natural instinct; 'distinto' here = instinto, an old popular form, not 'different'"}
          - {w: "por más que", d: "however much, no matter how much (+ subjunctive)"}
          - {w: "estorbar", d: "to hinder, prevent, get in the way of"}
        diagram:
          - s: "que os soseguéis un poco"
            r: "main verb 1 (a polite wish): that you calm down a little"
            under:
              - {s: "Por vida vuestra, hermano", r: "oath and address: upon your life, brother"}
          - s: "y no os acuciéis"
            r: "main verb 2: and don't hurry"
            under:
              - {s: "en volver tan presto esa cabra a su rebaño", r: "in what: in taking that goat back to its flock so quickly"}
          - s: "ha de seguir su natural distinto"
            r: "main verb 3 (after 'que', for): she has to follow her natural instinct"
            under:
              - {s: "pues ella es hembra", r: "why: since she is female"}
              - {s: "como vos decís", r: "aside: as you say"}
              - {s: "por más que vos os pongáis a estorbarlo", r: "concession: however much you set about stopping it"}
        forms:
          - {w: "os soseguéis", f: "soségu- + -éis → sosegarse (to calm down), present subjunctive, you (vos, polite singular), with 'os' (yourself). g becomes gu before e: sosiegue, sosiegues, sosiegue, soseguemos, soseguéis, sosieguen. The subjunctive after 'que' gives a wish or polite command: '(I beg) that you calm down'. Here the canon uses the old 'vos' to the goatherd, which takes the 'vosotros' verb forms and the pronoun 'os'."}
          - {w: "no os acuciéis", f: "acuci- + -éis → acuciarse (to hurry), present subjunctive, you (vos), with 'os' (yourself); a negative command always uses the subjunctive. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "volver", f: "infinitive of volver (to return, take back) after 'en'; Spanish uses the infinitive where English uses '-ing'."}
          - {w: "esa", f: "es- + -a → ese (that), feminine to match 'cabra'."}
          - {w: "es", f: "es → ser (to be), present, she: soy, eres, es, somos, sois, son."}
          - {w: "decís", f: "dec- + -ís → decir (to say), present, you (vos, polite singular, using the vosotros form): digo, dices, dice, decimos, decís, dicen."}
          - {w: "ha de seguir", f: "h- + -a → haber (to have), present, she: he, has, ha, hemos, habéis, han; 'haber de' + infinitive = must, is bound to: 'she has to follow'. seguir (to follow) is the infinitive."}
          - {w: "os pongáis", f: "pong- + -áis → ponerse (to set oneself, set about), present subjunctive, you (vos), with 'os' (yourself); subjunctive after 'por más que' (however much). ponga, pongas, ponga, pongamos, pongáis, pongan. 'ponerse a' + infinitive = to start doing."}
          - {w: "estorbarlo", f: "estorbar (to hinder) + lo (it, her following her instinct), the pronoun hung on the infinitive after 'a'."}
        note: "The canon teases the goatherd's complaint about the goat being female, and turns it into the old commonplace that women follow their nature whatever men do. It sets up the goatherd's story, which will be about a woman."
      - es: "Tomad este bocado y bebed una vez, con que templaréis la cólera, y en tanto, descansará la cabra."
        literal: "Take this mouthful and drink one time, with which you-will-temper the anger, and in-the-meantime, will-rest the goat."
        ormsby: "Take this morsel and drink a sup, and that will soothe your irritation, and in the meantime the goat will rest herself,”"
        vocab:
