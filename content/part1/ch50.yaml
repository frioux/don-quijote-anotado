        note: "The whole Knight of the Lake episode is Don Quijote's own pastiche of the romances: the voice from the lake, the plunge, the enchanted palace, the bath, the feast and the enchanted princess are all stock scenes. Even the toothpick is a detail of real table manners slipped into the fantasy."
      - es: "No quiero alargarme más en esto, pues dello se puede colegir que cualquiera parte que se lea, de cualquiera historia de caballero andante, ha de causar gusto y maravilla a cualquiera que la leyere."
