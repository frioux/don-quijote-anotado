          - {w: "comieron", f: "com- + -ieron → comer (to eat), preterite, they. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "perdiese", f: "perd- + -iese → perder (to lose), imperfect subjunctive (-se form), he. The -se imperfect subjunctive of -er verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen. 'porque' + subjunctive means 'so that', a purpose, not 'because'."}
