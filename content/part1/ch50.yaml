  - sentences:
      - es: "Ya en esto, volvían los criados del canónigo, que a la venta habían ido por la acémila del repuesto, y, haciendo mesa de una alhombra y de la verde yerba del prado, a la sombra de unos árboles se sentaron, y comieron allí, porque el boyero no perdiese la comodidad de aquel sitio, como queda dicho."
        literal: "Already at this, were-returning the servants of-the canon, who to the inn had gone for the pack-mule of-the provisions, and, making table of a carpet and of the green grass of-the meadow, at the shade of some trees themselves they-sat, and they-ate there, so-that the ox-driver not might-lose the convenience of that spot, as remains said."
        ormsby: "By this time the canon’s servants, who had gone to the inn to fetch the sumpter mule, had returned, and making a carpet and the green grass of the meadow serve as a table, they seated themselves in the shade of some trees and made their repast there, that the carter might not be deprived of the advantage of the spot, as has been already said."
        vocab:
          - {w: "ya en esto", d: "by this time, meanwhile"}
          - {w: "criado", d: "servant (literally 'one brought up' in the house)"}
          - {w: "venta", d: "roadside inn (not 'sale')"}
          - {w: "ir por", d: "to go for, go to fetch"}
          - {w: "acémila", d: "pack mule, sumpter mule"}
