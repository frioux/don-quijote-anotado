          - {w: "darme", f: "dar (to give) + me (to me), the pronoun hung on the infinitive after 'en'."}
          - {w: "ese", f: "ese (that), masculine singular to match 'condado'."}
          - {w: "prometido, esperado", f: "promet- + -ido → prometer (to promise) and esper- + -ado → esperar (to hope for), participles, masculine to match 'condado'. -ar verbs make the participle with -ado, -er and -ir verbs with -ido."}
          - {w: "prometo", f: "promet- + -o → prometer (to promise), present, I. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
