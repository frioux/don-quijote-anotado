      - es: "y para que creáis esta verdad y la toquéis con la mano, aunque parezca que sin ser rogado me convido, si no os enfadáis dello y queréis, señores, un breve espacio prestarme oído atento, os contaré una verdad que acredite lo que ese señor (señalando al cura) ha dicho, y la mía."
        literal: "and so that you-may-believe this truth and it you-may-touch with the hand, although it-may-seem that without being asked myself I-invite, if not yourselves you-are-annoyed of-it and you-want, sirs, a brief space to-lend-me ear attentive, to-you I-will-tell a truth that may-confirm that which that gentleman (pointing to-the priest) has said, and the mine."
        ormsby: "and that you may see the truth of this and grasp it, though I may seem to put myself forward without being asked, I will, if it will not tire you, gentlemen, and you will give me your attention for a little, tell you a true story which will confirm this gentleman’s word (and he pointed to the curate) as well as my own.”"
