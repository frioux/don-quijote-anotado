        vocab:
          - {w: "trabajar en", d: "to strive to, work at (doing something)"}
          - {w: "vuestra merced", d: "'your grace', the polite 'you' (source of modern 'usted'); it takes he/she verb forms"}
          - {w: "condado", d: "county, earldom: the lands and title of a count"}
          - {w: "prometido de", d: "promised by ('de' = by, with a participle)"}
          - {w: "esperado", d: "hoped for, awaited ('esperar' = both to hope and to wait)"}
          - {w: "faltar", d: "to be lacking, be wanting ('no me falte habilidad' = I won't lack the skill)"}
          - {w: "habilidad", d: "skill, ability, capacity"}
