      - es: "¿Y, después de la comida acabada y las mesas alzadas, quedarse el caballero recostado sobre la silla, y quizá mondándose los dientes, como es costumbre, entrar a deshora por la puerta de la sala otra mucho más hermosa doncella que ninguna de las primeras, y sentarse al lado del caballero, y comenzar a darle cuenta de qué castillo es aquél, y de cómo ella está encantada en él, con otras cosas que suspenden al caballero y admiran a los leyentes que van leyendo su historia?"
        literal: "And, after of the meal finished and the tables raised, to-remain-himself the knight reclined on the chair, and perhaps picking-himself the teeth, as is custom, to-enter at unexpected-hour through the door of the hall another much more beautiful damsel than any of the first [ones], and to-seat-herself at-the side of-the knight, and to-begin to give-him account of what castle is that-one, and of how she is enchanted in it, with other things that hold-spellbound [to] the knight and amaze [to] the readers who go reading his story?"
        ormsby: "And then when the repast is over and the tables removed, for the knight to recline in the chair, picking his teeth perhaps as usual, and a damsel, much lovelier than any of the others, to enter unexpectedly by the chamber door, and herself by his side, and begin to tell him what the castle is, and how she is held enchanted there, and other things that amaze the knight and astonish the readers who are perusing his history."
