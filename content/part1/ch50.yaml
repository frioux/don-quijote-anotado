          - {w: "hembra", d: "female, a she"}
          - {w: "sosegado", d: "calm, quiet, settled"}
          - {w: "mal haya", d: "curse ..., a plague on ... (literally 'may evil have')"}
          - {w: "condición", d: "nature, temperament, character (not 'condition')"}
          - {w: "a quien", d: "whom; Cervantes uses singular 'quien' for a plural antecedent ('aquellas'), modern 'a quienes'"}
