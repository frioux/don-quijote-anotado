        ormsby: "“I know not what more there is to be said;"
        ormsby_note: "In la Cuesta's third edition of 1608 a passage is inserted here for which there is neither authority nor necessity."
        vocab:
          - {w: "no sé que haya", d: "I don't know that there is; the subjunctive after 'no sé que' shows doubt"}
        diagram:
          - s: "Yo no sé"
            r: "main verb: I don't know"
            under:
              - {s: "que haya más que decir", r: "what I don't know: that there is more to say"}
        forms:
          - {w: "sé", f: "→ saber (to know), present, I. Irregular: sé, sabes, sabe, sabemos, sabéis, saben. The accent tells it from 'se' (himself)."}
          - {w: "haya", f: "hay- + -a → haber (to have; here 'there to be'), present subjunctive, it: 'that there is'. haya, hayas, haya, hayamos, hayáis, hayan. Subjunctive because 'no sé que' denies or doubts what follows."}
          - {w: "que decir", f: "'more to say': 'que' + infinitive after 'haber' (there to be) means 'something to (do)'. decir = to say."}
