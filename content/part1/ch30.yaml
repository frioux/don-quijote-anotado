                r: "what: that she doesn't come up to the shoe"
                under:
                  - {s: "de la que está delante", r: "whose shoe: of the lady standing here"}
        forms:
          - {w: "estoy", f: "estar (to be), present, I. estoy, estás, está, estamos, estáis, están."}
          - {w: "llega", f: "lleg- + -a → llegar (to reach), present, she. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "su ... de la que", f: "'su zapato de la que' doubles the possessive: 'her shoe, of the one who', a common popular construction."}
          - {w: "está", f: "estar (to be), present, she. Same as above: estoy, estás, está, estamos, estáis, están."}
      - es: "Así, noramala alcanzaré yo el condado que espero, si vuestra merced se anda a pedir cotufas en el golfo."
        literal: "So, in-an-evil-hour will-get I the county that I-hope-for, if your grace goes-about to ask-for tiger-nuts in the gulf."
        ormsby: "A poor chance I have of getting that county I am waiting for if your worship goes looking for dainties in the bottom of the sea."
        ormsby_note: "Proverb 60. Pedir cotufas en el golfo, a proverbial expression for seeking impossibilities. Cotufa, according to Salvá, is equivalent to golosina, a dainty: Clemencín says it is the same as Chufa the tuber of the Cyparus esculentus, used as an ingredient in horchata, and in other ways."
        vocab:
          - {w: "noramala", d: "= en hora mala, in an evil hour; here ironic: 'a fine chance I have'"}
          - {w: "alcanzar", d: "to get, attain"}
          - {w: "condado", d: "county, earldom (the reward Sancho has been promised)"}
          - {w: "andarse a", d: "to go about doing (+ infinitive)"}
          - {w: "pedir cotufas en el golfo", d: "proverb: to ask for tiger-nuts (sweets) in the open sea, to ask for the impossible"}
        diagram:
          - s: "noramala alcanzaré yo el condado"
            r: "main verb: a fine chance I'll have of getting the county"
            under:
              - {s: "que espero", r: "describes 'condado': that I am hoping for"}
              - {s: "si vuestra merced se anda a pedir cotufas en el golfo", r: "condition: if your grace goes about asking for the impossible"}
        forms:
          - {w: "alcanzaré", f: "alcanzar (to get) + -é, future, I. The future adds the endings to the infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "espero", f: "esper- + -o → esperar (to hope for), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "se anda", f: "and- + -a → andarse (to go about), present, you (vuestra merced). Same -ar present."}
          - {w: "noramala", f: "contraction of 'en hora mala' (in a bad hour), written as one word."}
      - es: "Cásese, cásese luego, encomiéndole yo a Satanás, y tome ese reino que se le viene a las manos de vobis, vobis, y, en siendo rey, hágame marqués o adelantado, y luego, siquiera se lo lleve el diablo todo."
        literal: "Marry-yourself, marry-yourself at-once, commend-you I to Satan, and take that kingdom which itself to-you comes to the hands de vobis, vobis, and, on being king, make-me marquis or governor, and then, even-if itself it may-carry-off the devil all."
        ormsby: "In the devil’s name, marry, marry, and take this kingdom that comes to hand without any trouble, and when you are king make me a marquis or governor of a province, and for the rest let the devil take it all.”"
        vocab:
          - {w: "luego", d: "at once, right away"}
          - {w: "encomiéndole yo a Satanás", d: "'I commend you to Satan', an exasperated curse: 'devil take you'"}
          - {w: "venírsele a uno a las manos", d: "to fall into one's hands"}
          - {w: "de vobis, vobis", d: "for nothing, without effort; Latin 'vobis' (to you), from church Latin"}
          - {w: "marqués", d: "marquis"}
          - {w: "adelantado", d: "governor of a frontier province, a high royal office"}
          - {w: "siquiera", d: "even if, let it be that; here 'and then let the devil take the lot for all I care'"}
        diagram:
          - {s: "Cásese, cásese luego", r: "main verb 1: marry, marry at once"}
          - {s: "encomiéndole yo a Satanás", r: "curse: devil take you"}
          - s: "y tome ese reino"
            r: "main verb 2: and take that kingdom"
            under:
              - {s: "que se le viene a las manos de vobis, vobis", r: "describes 'reino': which falls into your hands for nothing"}
          - s: "y, en siendo rey, hágame marqués o adelantado"
            r: "main verb 3: and, once you are king, make me a marquis or a governor"
          - {s: "y luego, siquiera se lo lleve el diablo todo", r: "main verb 4: and then let the devil take the lot"}
        forms:
          - {w: "Cásese", f: "cas- + -e + se → casarse (to marry), present subjunctive, you (vuestra merced), used as a polite command, with 'se' on the end. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "encomiéndole", f: "encomiend- + -o + le → encomendar (to commend), present, I, with 'le' (you) stuck on the end, accent added. The stem e becomes ie when stressed: encomiendo, encomiendas, encomienda, encomendamos, encomendáis, encomiendan."}
          - {w: "tome, hágame", f: "tom- + -e → tomar (to take) and hag- + -a → hacer (to make), present subjunctive, you (vuestra merced), as polite commands; 'hágame' carries 'me' on the end. hacer: haga, hagas, haga, hagamos, hagáis, hagan."}
          - {w: "se le viene", f: "vien- + -e → venirse (to come), present, it, with 'le' (to you). vengo, vienes, viene, venimos, venís, vienen."}
          - {w: "siendo", f: "gerund of ser (to be); 'en' + gerund = as soon as."}
          - {w: "se lo lleve", f: "llev- + -e → llevarse (to carry off), present subjunctive, he (the devil), as a wish: 'let him take it'. Same -e subjunctive endings as 'Cásese'."}
  - sentences:
      - es: "Don Quijote, que tales blasfemias oyó decir contra su señora Dulcinea, no lo pudo sufrir, y, alzando el lanzón, sin hablalle palabra a Sancho y sin decirle esta boca es mía, le dio tales dos palos que dio con él en tierra;"
        literal: "Don Quijote, who such blasphemies heard said against his lady Dulcinea, not it could bear, and, raising the lance, without speaking-him word to Sancho and without saying-to-him 'this mouth is mine', to-him gave such two blows that he-gave with him on ground;"
        ormsby: "Don Quixote, when he heard such blasphemies uttered against his lady Dulcinea, could not endure it, and lifting his pike, without saying anything to Sancho or uttering a word, he gave him two such thwacks that he brought him to the ground;"
        vocab:
          - {w: "blasfemia", d: "blasphemy; for Don Quijote, speaking ill of Dulcinea is sacrilege"}
          - {w: "sufrir", d: "to bear, put up with (not only 'to suffer')"}
          - {w: "lanzón", d: "short thick lance, a pike (the one he made from a branch)"}
          - {w: "hablalle", d: "= hablarle, to speak to him (old -rl- becoming -ll-)"}
          - {w: "sin decir esta boca es mía", d: "without saying a word (literally 'without saying this mouth is mine')"}
          - {w: "palo", d: "stick; a blow with a stick"}
          - {w: "dar con alguien en tierra", d: "to knock someone to the ground"}
        diagram:
          - s: "Don Quijote ... no lo pudo sufrir"
            r: "main verb 1: Don Quijote could not bear it"
            under:
              - {s: "que tales blasfemias oyó decir contra su señora Dulcinea", r: "describes 'Don Quijote': who heard such blasphemies spoken against Dulcinea"}
          - s: "le dio tales dos palos"
            r: "main verb 2 (after 'y'): he gave him two such blows"
            under:
              - {s: "alzando el lanzón", r: "how: raising his pike"}
              - {s: "sin hablalle palabra a Sancho y sin decirle esta boca es mía", r: "how: without a single word to Sancho"}
              - {s: "que dio con él en tierra", r: "result: that he knocked him to the ground"}
        forms:
          - {w: "oyó", f: "oír (to hear), preterite, he: the i between vowels becomes y. oí, oíste, oyó, oímos, oísteis, oyeron."}
          - {w: "pudo", f: "pud- + -o → poder (can), preterite, he. Irregular: pude, pudiste, pudo, pudimos, pudisteis, pudieron."}
          - {w: "alzando", f: "gerund of alzar (to raise)."}
          - {w: "hablalle", f: "hablar + le with the r of the infinitive turned into l: hablarle → hablalle. A common old pronunciation; modern 'hablarle'."}
          - {w: "decirle", f: "decir (to say) + le (to him), the pronoun hung on the infinitive."}
          - {w: "dio", f: "di- + -o → dar (to give), preterite, he. Irregular: di, diste, dio, dimos, disteis, dieron."}
          - {w: "tales", f: "plural of tal (such) to match 'palos', placed before 'dos'."}
      - es: "y si no fuera porque Dorotea le dio voces que no le diera más, sin duda le quitara allí la vida."
        literal: "and if not it-had-been because Dorotea to-him gave shouts that not to-him he-should-give more, without doubt from-him he-would-have-taken there the life."
        ormsby: "and had it not been that Dorothea cried out to him to spare him he would have no doubt taken his life on the spot."
        vocab:
