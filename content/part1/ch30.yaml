      - es: "Esto es de lo que yo me quejo; cásese vuestra merced una por una con esta reina, ahora que la tenemos aquí como llovida del cielo, y después puede volverse con mi señora Dulcinea; que reyes debe de haber habido en el mundo que hayan sido amancebados."
