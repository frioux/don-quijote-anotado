          - {w: "acertado", d: "accurate, right, well-judged"}
          - {w: "echar la culpa a", d: "to put the blame on"}
          - {w: "trabajos", d: "hardships, troubles (its usual sense in Cervantes), not 'work'"}
          - {w: "padecer", d: "to suffer"}
