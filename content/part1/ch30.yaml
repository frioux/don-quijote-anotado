            r: "main verb: blame it on what"
            under:
              - s: "si en alguna cosa he andado demasiada, o no tan acertada"
                r: "condition: if in anything I have gone too far or been less accurate"
                under:
                  - {s: "como debiera", r: "comparison: than I should have been"}
              - s: "que el señor licenciado dijo al principio de mi cuento:"
                r: "describes 'lo': which the licentiate said at the start of my tale"
                under:
                  - {s: "que los trabajos continuos y extraordinarios quitan la memoria al que los padece", r: "what he said: that constant, extraordinary hardships rob the sufferer of memory"}
        forms:
