      - es: "— Señor caballero, miémbresele a la vuestra merced el don que me tiene prometido, y que, conforme a él, no puede entremeterse en otra aventura, por urgente que sea;"
        literal: "— Sir knight, let-it-be-remembered-to [to] the your grace the boon that to-me you-have promised, and that, according to it, not you-can meddle in another adventure, however urgent that it-be;"
        ormsby: "“Sir Knight, remember the boon you have promised me, and that in accordance with it you must not engage in any other adventure, be it ever so pressing;"
        vocab:
          - {w: "miémbresele", d: "'let it be remembered by you', from the archaic 'membrar' (to remember); a chivalric archaism Dorotea uses to play the part"}
          - {w: "la vuestra merced", d: "your grace, with the article 'la', an old-fashioned courtly form from the romances"}
          - {w: "don", d: "boon, a gift or favor promised before it is named (a convention of the romances)"}
          - {w: "tener prometido", d: "to have promised (stresses that the promise stands)"}
          - {w: "conforme a", d: "according to, in keeping with"}
          - {w: "entremeterse", d: "= entrometerse, to meddle, get involved"}
          - {w: "por urgente que sea", d: "however urgent it may be"}
        diagram:
          - s: "miémbresele"
            r: "main verb: let it be remembered by"
            under:
              - {s: "Señor caballero", r: "address: sir knight"}
              - {s: "a la vuestra merced", r: "to whom: your grace"}
              - s: "el don"
                r: "subject, 1: the boon"
                under:
                  - {s: "que me tiene prometido", r: "describes 'don': which you have promised me"}
              - s: "y que, conforme a él, no puede entremeterse en otra aventura"
                r: "subject, 2: and that, by its terms, you cannot take on another adventure"
                under:
                  - {s: "por urgente que sea", r: "concession: however urgent it may be"}
        forms:
          - {w: "miémbresele", f: "miembr- + -e + se + le → membrar (to remember), present subjunctive, it, used as a polite command, with 'se' (passive: 'be remembered') and 'le' (to you) stuck on the end. The stem e becomes ie when stressed. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. Modern Spanish would say 'acuérdese'."}
          - {w: "tiene prometido", f: "tien- + -e → tener (to have), present, you (vuestra merced takes the 'he/she' form), + prometido, the participle of prometer (to promise). tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "puede", f: "pued- + -e → poder (can), present, you (vuestra merced). The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "entremeterse", f: "infinitive of entremeterse (to meddle) with 'se' on the end, after 'puede'."}
          - {w: "sea", f: "ser (to be), present subjunctive, it, after 'por ... que' (however). sea, seas, sea, seamos, seáis, sean."}
        note: "Dorotea, a well-read girl, slips straight into the language of the romances: the archaic 'membrar', 'la vuestra merced', and the 'don' or boon a knight grants before he hears what it is."
      - es: "sosiegue vuestra merced el pecho, que si el señor licenciado supiera que por ese invicto brazo habían sido librados los galeotes, él se diera tres puntos en la boca, y aun se mordiera tres veces la lengua, antes que haber dicho palabra que en despecho de vuestra merced redundara."
        literal: "let-calm your grace the breast, for if the sir licentiate had-known that by that unconquered arm had been freed the galley-slaves, he to-himself would-have-given three stitches in the mouth, and even would-have-bitten-himself three times the tongue, before than to-have said word that in despite of your grace might-redound."
        ormsby: "calm yourself, for if the licentiate had known that the galley slaves had been set free by that unconquered arm he would have stopped his mouth thrice over, or even bitten his tongue three times before he would have said a word that tended towards disrespect of your worship.”"
        vocab:
          - {w: "sosegar", d: "to calm, quiet; 'sosegar el pecho' = to calm one's heart"}
          - {w: "invicto", d: "unconquered, undefeated"}
          - {w: "librar", d: "to free, set free"}
          - {w: "darse puntos en la boca", d: "to sew one's mouth shut ('puntos' = stitches), keep silent"}
          - {w: "morderse la lengua", d: "to bite one's tongue"}
          - {w: "antes que", d: "rather than, before"}
          - {w: "en despecho de", d: "to the disrespect of, in spite of"}
          - {w: "redundar en", d: "to result in, tend to (here 'tend to your discredit')"}
        diagram:
          - s: "sosiegue vuestra merced el pecho"
            r: "main verb: calm your heart, your grace"
          - s: "él se diera tres puntos en la boca"
            r: "main clause 2 (after 'que', for): he would have stitched his mouth shut"
            under:
              - s: "si el señor licenciado supiera"
                r: "condition: if the licentiate had known"
                under:
                  - {s: "que por ese invicto brazo habían sido librados los galeotes", r: "what: that the galley slaves had been freed by that unconquered arm"}
              - {s: "y aun se mordiera tres veces la lengua", r: "and: and even bitten his tongue three times"}
              - s: "antes que haber dicho palabra"
                r: "rather than: before having said a word"
                under:
                  - {s: "que en despecho de vuestra merced redundara", r: "describes 'palabra': that would redound to your grace's discredit"}
        forms:
          - {w: "sosiegue", f: "sosieg- + -ue → sosegar (to calm), present subjunctive, you (vuestra merced), used as a polite command. The stem e becomes ie when stressed, and g becomes gu before e. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "supiera", f: "sup- + -iera → saber (to know), imperfect subjunctive (-ra form), he: 'if he had known'. Built on the preterite supieron: supiera, supieras, supiera, supiéramos, supierais, supieran."}
          - {w: "habían sido librados", f: "habían, the imperfect of haber, they (había, habías, había, habíamos, habíais, habían), + sido (been) + librados, the participle of librar (to free), masculine plural to match 'galeotes': the passive pluperfect 'had been freed'."}
          - {w: "se diera, se mordiera", f: "d- + -iera → dar (to give) and mord- + -iera → morder (to bite), imperfect subjunctive (-ra form), he, with 'se' (to himself), used for 'would have given, would have bitten'. The -ra form of -er and -ir verbs: -iera, -ieras, -iera, -iéramos, -ierais, -ieran (dar takes the same endings)."}
          - {w: "haber dicho", f: "the infinitive haber (to have) + dicho, the irregular participle of decir (to say): 'to have said'."}
          - {w: "redundara", f: "redund- + -ara → redundar (to redound), imperfect subjunctive (-ra form), it: 'that might tend to'. The -ra form of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran."}
  - sentences:
