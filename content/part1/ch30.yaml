  - sentences:
      - es: "— No es maravilla, señora mía, que la vuestra grandeza se turbe y empache contando sus desventuras, que ellas suelen ser tales, que muchas veces quitan la memoria a los que maltratan, de tal manera que aun de sus mesmos nombres no se les acuerda, como han hecho con vuestra gran señoría, que se ha olvidado que se llama la princesa Micomicona, legítima heredera del gran reino Micomicón;"
        literal: "— Not it-is wonder, lady mine, that the your greatness should-get-flustered and embarrassed telling her misfortunes, for they are-accustomed to-be such, that many times they-take-away the memory from those whom they-mistreat, in such manner that even of their very names not to-them it-remembers, as they-have done with your great ladyship, who has forgotten that she-is-called the princess Micomicona, lawful heiress of-the great kingdom Micomicón;"
        ormsby: "“It is no wonder, señora, that your highness should be confused and embarrassed in telling the tale of your misfortunes; for such afflictions often have the effect of depriving the sufferers of memory, so that they do not even remember their own names, as is the case now with your ladyship, who has forgotten that she is called the Princess Micomicona, lawful heiress of the great kingdom of Micomicon;"
        vocab:
          - {w: "no es maravilla", d: "it is no wonder"}
          - {w: "la vuestra grandeza", d: "your highness (literally 'the your greatness'), a royal title in the courtly old style"}
          - {w: "turbarse", d: "to become confused, flustered"}
          - {w: "empacharse", d: "to get embarrassed, tongue-tied (literally 'to have indigestion')"}
          - {w: "desventura", d: "misfortune"}
          - {w: "soler", d: "to be in the habit of, usually (+ infinitive)"}
          - {w: "maltratar", d: "to ill-treat, mistreat"}
          - {w: "mesmo", d: "= mismo, same, very; 'sus mesmos nombres' = their own names"}
          - {w: "acordársele a uno", d: "to come back to someone's memory; 'no se les acuerda' = they don't remember"}
          - {w: "vuestra señoría", d: "your ladyship, a title for nobles"}
          - {w: "Micomicona, Micomicón", d: "made-up names, 'Princess of Monkeyland': 'mico' is a long-tailed monkey, and the doubled syllable sounds like a far African kingdom"}
          - {w: "legítimo heredero", d: "lawful heir"}
        diagram:
