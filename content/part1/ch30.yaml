          - {w: "descomulgado", d: "= excomulgado, excommunicated; also a general insult, 'damned wretch'"}
          - {w: "poner lengua en", d: "to speak ill of, slander"}
          - {w: "sin par", d: "peerless, matchless"}
        diagram:
          - s: "Pues no lo penséis"
            r: "main verb: well, don't think it"
            under:
              - s: "bellaco descomulgado"
                r: "address: excommunicated scoundrel"
                under:
