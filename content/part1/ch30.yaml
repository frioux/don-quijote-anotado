        forms:
          - {w: "callaré, reprimiré, iré", f: "callar (to be silent), reprimir (to repress) and ir (to go), future, I: the future adds -é to the whole infinitive. The future endings: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "justa", f: "just- + -a → justo (just), feminine to match 'cólera'."}
          - {w: "se había levantado", f: "había, the imperfect of haber, it (había, habías, había, habíamos, habíais, habían), + levantado, the participle of levantarse (to rise): the pluperfect 'had risen'."}
          - {w: "quieto y pacífico", f: "masculine singular, agreeing with the speaker, I."}
          - {w: "os cumpla", f: "cumpl- + -a → cumplir (to fulfill), present subjunctive, I, with 'os' (for you). Subjunctive because 'hasta que' points to a future moment. The present subjunctive of -er and -ir verbs: -a, -as, -a, -amos, -áis, -an."}
