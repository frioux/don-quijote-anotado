          - {w: "callar", d: "to be silent, hold one's tongue"}
          - {w: "reprimir", d: "to repress, hold back"}
          - {w: "cólera", d: "anger, wrath (from the old medical 'choler', bile)"}
          - {w: "levantarse", d: "to rise up, arise"}
          - {w: "hasta tanto que", d: "until (a fuller form of 'hasta que')"}
          - {w: "cumplir", d: "to fulfill, carry out (a promise)"}
        diagram:
          - {s: "Yo callaré, señora mía", r: "main verb 1: I will be silent, my lady"}
