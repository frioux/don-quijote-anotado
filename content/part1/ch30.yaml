  - sentences:
      - es: "— Y después de habérsela tajado y puéstoos en pacífica posesión de vuestro estado, quedará a vuestra voluntad hacer de vuestra persona lo que más en talante os viniere;"
        literal: "— And after of having-cut-it-for-him and put-you in peaceful possession of your estate, it-will-remain to your will to-do with your person that which most in liking to-you may-come;"
        ormsby: "“and when it has been cut off and you have been put in peaceful possession of your realm it shall be left to your own decision to dispose of your person as may be most pleasing to you;"
        vocab:
          - {w: "estado", d: "estate, realm, domains"}
          - {w: "quedar a la voluntad de", d: "to be left to someone's choice"}
          - {w: "venirle a uno en talante", d: "to be to someone's liking, to please; 'talante' = mood, will (an old word of the romances)"}
        diagram:
          - s: "quedará a vuestra voluntad"
            r: "main verb: it will be left to your will"
            under:
              - {s: "después de habérsela tajado", r: "when, 1: after cutting it (his head) off"}
              - {s: "y puéstoos en pacífica posesión de vuestro estado", r: "when, 2: and putting you in peaceful possession of your realm"}
              - s: "hacer de vuestra persona lo"
                r: "subject: to do with your person what"
                under:
                  - {s: "que más en talante os viniere", r: "describes 'lo': whatever pleases you most"}
        forms:
          - {w: "habérsela tajado", f: "haber (to have) + se (from him, 'le' turned into 'se' before 'la') + la (it, the head) + tajado, the participle of tajar (to cut off): 'having cut it off him'."}
          - {w: "puéstoos", f: "puesto, the participle of poner (to put), + os (you), with an accent added; it shares 'haber' with 'tajado'. Modern Spanish could not hang a pronoun on a participle."}
          - {w: "pacífica", f: "pacífic- + -a → pacífico (peaceful), feminine to match 'posesión'."}
          - {w: "quedará", f: "quedar (to remain) + -á, future, it. The future adds the endings to the infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "viniere", f: "vin- + -iere → venir (to come), future subjunctive, it: 'whatever may come'. The future subjunctive of -er and -ir verbs: -iere, -ieres, -iere, -iéremos, -iereis, -ieren (venir builds it on vin-). Modern Spanish uses 'venga'."}
      - es: "porque, mientras que yo tuviere ocupada la memoria y cautiva la voluntad, perdido el entendimiento, a aquella..., y no digo más, no es posible que yo arrostre, ni por pienso, el casarme, aunque fuese con el ave fénix."
        literal: "because, while that I may-have occupied the memory and captive the will, lost the understanding, to that-one..., and not I-say more, not it-is possible that I face, not even by thought, the marrying-myself, even-if it-were with the bird phoenix."
        ormsby: "for so long as my memory is occupied, my will enslaved, and my understanding enthralled by her—I say no more—it is impossible for me for a moment to contemplate marriage, even with a Phoenix.”"
        vocab:
          - {w: "mientras que", d: "while, as long as"}
          - {w: "memoria, voluntad, entendimiento", d: "memory, will, understanding: the three powers of the soul in scholastic thought"}
          - {w: "cautivo", d: "captive, enslaved"}
          - {w: "aquella", d: "that lady (Dulcinea, whom he will not name in front of others)"}
          - {w: "arrostrar", d: "to face, bring oneself to, consider"}
          - {w: "ni por pienso", d: "not even in thought, not for a moment"}
          - {w: "ave fénix", d: "the phoenix, the unique bird reborn from its ashes; a byword for something matchless"}
        diagram:
          - s: "no es posible"
            r: "main verb: it is not possible"
            under:
              - s: "mientras que yo tuviere ocupada la memoria y cautiva la voluntad, perdido el entendimiento"
                r: "as long as: as long as my memory is taken up, my will captive and my understanding lost"
                under:
                  - {s: "a aquella..., y no digo más", r: "to whom: to that lady ..., and I say no more"}
              - s: "que yo arrostre, ni por pienso, el casarme"
                r: "subject: that I should even think of marrying"
                under:
                  - {s: "aunque fuese con el ave fénix", r: "concession: even if it were with the phoenix"}
        forms:
          - {w: "tuviere", f: "tuv- + -iere → tener (to have), future subjunctive, I: 'as long as I have'. The future subjunctive of -er and -ir verbs: -iere, -ieres, -iere, -iéremos, -iereis, -ieren (tener builds it on tuv-). Modern Spanish uses 'tenga'."}
          - {w: "ocupada, cautiva, perdido", f: "each agrees with its noun: ocupada with 'memoria', cautiva with 'voluntad', perdido with 'entendimiento'; 'tener' + adjective = to have something in that state."}
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "arrostre", f: "arrostr- + -e → arrostrar (to face), present subjunctive, I, after 'no es posible que'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "el casarme", f: "the infinitive casar (to marry) + me, used as a noun with 'el': 'marrying'."}
          - {w: "fuese", f: "fu- + -ese → ser (to be), imperfect subjunctive (-se form), it, after 'aunque' for a hypothetical. fuese, fueses, fuese, fuésemos, fueseis, fuesen."}
  - sentences:
      - es: "Parecióle tan mal a Sancho lo que últimamente su amo dijo acerca de no querer casarse, que, con grande enojo, alzando la voz, dijo:"
        literal: "Seemed-to-him so bad to Sancho that which lastly his master said about of not wanting to-marry, that, with great anger, raising the voice, he-said:"
        ormsby: "The last words of his master about not wanting to marry were so disagreeable to Sancho that raising his voice he exclaimed with great irritation:"
        vocab:
          - {w: "parecerle mal a uno", d: "to seem wrong to someone, displease"}
          - {w: "últimamente", d: "lastly, at the end (not 'lately')"}
          - {w: "acerca de", d: "about, concerning"}
          - {w: "enojo", d: "anger, annoyance"}
          - {w: "alzar la voz", d: "to raise one's voice"}
        diagram:
          - s: "Parecióle tan mal a Sancho"
            r: "main verb: it seemed so wrong to Sancho"
            under:
              - s: "lo que últimamente su amo dijo"
                r: "subject: what his master said last"
                under:
                  - {s: "acerca de no querer casarse", r: "about what: about not wanting to marry"}
              - s: "que, con grande enojo, alzando la voz, dijo:"
                r: "result: that, very angry, raising his voice, he said"
        forms:
          - {w: "Parecióle", f: "parec- + -ió + le → parecer (to seem), preterite, it, with 'le' (to him) stuck on the end; modern 'le pareció'. Cervantes hangs pronouns on a verb that opens its clause. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "últimamente", f: "última (last) + -mente: 'lastly'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "casarse", f: "casar (to marry) + se, the pronoun hung on the infinitive after 'querer'."}
          - {w: "grande", f: "Cervantes keeps the full 'grande' before 'enojo', where modern Spanish clips it to 'gran'."}
          - {w: "alzando", f: "gerund of alzar (to raise): 'raising'."}
  - sentences:
      - es: "— Voto a mí, y juro a mí, que no tiene vuestra merced, señor don Quijote, cabal juicio."
        literal: "— I-vow to me, and I-swear to me, that not has your grace, sir Don Quijote, complete judgment."
        ormsby: "“By my oath, Señor Don Quixote, you are not in your right senses;"
        vocab:
          - {w: "voto a mí, juro a mí", d: "a comic oath: Sancho swears by himself, mixing up 'voto a Dios' (I vow to God)"}
          - {w: "cabal", d: "complete, sound, whole"}
          - {w: "juicio", d: "judgment, sense, wits; 'no tener cabal juicio' = not to be in one's right mind"}
        diagram:
          - {s: "Voto a mí, y juro a mí", r: "oath: I vow by myself and swear by myself"}
          - s: "que no tiene vuestra merced, señor don Quijote, cabal juicio"
            r: "main clause: that your grace, Señor Don Quijote, is not in your right mind"
        forms:
          - {w: "Voto, juro", f: "vot- + -o → votar (to vow) and jur- + -o → jurar (to swear), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, you (vuestra merced). tengo, tienes, tiene, tenemos, tenéis, tienen."}
      - es: "Pues, ¿cómo es posible que pone vuestra merced en duda el casarse con tan alta princesa como aquésta?"
        literal: "Well, how is-it possible that puts your grace in doubt the marrying-yourself with so high princess as this-one?"
        ormsby: "for how can your worship possibly object to marrying such an exalted princess as this?"
        vocab:
          - {w: "poner en duda", d: "to call into question, hesitate over"}
          - {w: "alto", d: "high, noble, exalted"}
          - {w: "aquésta", d: "= ésta, this one (an old emphatic form)"}
        diagram:
          - s: "¿cómo es posible"
            r: "main verb: how is it possible"
            under:
              - s: "que pone vuestra merced en duda el casarse"
                r: "subject: that your grace hesitates over marrying"
                under:
                  - {s: "con tan alta princesa como aquésta?", r: "with whom: with so high a princess as this one"}
        forms:
          - {w: "pone", f: "pon- + -e → poner (to put), present, you (vuestra merced). The indicative after 'es posible que' is unusual (modern Spanish wants 'ponga'): Sancho treats it as a fact. pongo, pones, pone, ponemos, ponéis, ponen."}
          - {w: "el casarse", f: "the infinitive casar + se, used as a noun with 'el': 'marrying'."}
          - {w: "aquésta", f: "aqu- + ésta: the old emphatic form of 'esta' (this), feminine to match 'princesa'."}
      - es: "¿Piensa que le ha de ofrecer la fortuna, tras cada cantillo, semejante ventura como la que ahora se le ofrece?"
        literal: "Do-you-think that to-you is to offer the fortune, behind each little-stone, similar luck as that which now itself to-you offers?"
        ormsby: "Do you think Fortune will offer you behind every stone such a piece of luck as is offered you now?"
        vocab:
          - {w: "cantillo", d: "little stone, pebble (diminutive of 'canto'); 'tras cada cantillo' = round every corner"}
          - {w: "semejante", d: "such, similar"}
          - {w: "ventura", d: "good fortune, luck"}
        diagram:
          - s: "¿Piensa"
            r: "main verb: do you think"
            under:
              - s: "que le ha de ofrecer la fortuna, tras cada cantillo, semejante ventura"
                r: "what: that fortune will offer you such luck behind every pebble"
                under:
                  - {s: "como la que ahora se le ofrece?", r: "comparison: as the luck now offered you"}
        forms:
          - {w: "Piensa", f: "piens- + -a → pensar (to think), present, you (vuestra merced). The stem e becomes ie when stressed: pienso, piensas, piensa, pensamos, pensáis, piensan."}
          - {w: "ha de ofrecer", f: "ha, the present of haber, it (he, has, ha, hemos, habéis, han), + 'de' + ofrecer (to offer): 'is going to offer'."}
          - {w: "se le ofrece", f: "ofrec- + -e → ofrecer (to offer), present, it, with 'se' (passive: 'is offered') and 'le' (to you). The present of -er verbs: -o, -es, -e, -emos, -éis, -en (ofrecer: ofrezco in the first)."}
      - es: "¿Es, por dicha, más hermosa mi señora Dulcinea?"
        literal: "Is, by chance, more beautiful my lady Dulcinea?"
        ormsby: "Is my lady Dulcinea fairer, perchance?"
        vocab:
          - {w: "por dicha", d: "by chance, perhaps (= por ventura)"}
          - {w: "hermoso", d: "beautiful"}
        diagram:
