          - {w: "cásese", f: "cas- + -e + se → casarse (to marry), present subjunctive, you (vuestra merced), polite command, with 'se' on the end. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "tenemos", f: "ten- + -emos → tener (to have), present, we. tengo, tienes, tiene, tenemos, tenéis, tienen."}
