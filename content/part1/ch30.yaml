  - sentences:
      - es: "— Pues, ¿cómo se desembarcó vuestra merced en Osuna, señora mía —preguntó don Quijote—, si no es puerto de mar?"
        literal: "— Well, how yourself disembarked your grace in Osuna, lady mine —asked Don Quijote—, if not it-is port of sea?"
        ormsby: "“But how did you land at Osuna, señora,” asked Don Quixote, “when it is not a seaport?”"
        ormsby_note: "This is a sly hit of Cervantes at Mariana the historian, who makes the troops despatched against Viriatus land at Orsuna, now Osuna."
        vocab:
          - {w: "desembarcarse", d: "to land, disembark"}
          - {w: "puerto de mar", d: "seaport"}
        diagram:
          - s: "¿cómo se desembarcó vuestra merced en Osuna, señora mía"
            r: "main verb: how did your grace land at Osuna, my lady"
            under:
              - {s: "si no es puerto de mar?", r: "condition: if it isn't a seaport"}
          - {s: "preguntó don Quijote", r: "speech tag"}
        forms:
          - {w: "se desembarcó", f: "desembarc- + -ó → desembarcarse (to land), preterite, you (vuestra merced). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "preguntó", f: "pregunt- + -ó → preguntar (to ask), preterite, he. Same -ar preterite."}
        note: "Don Quijote, mad on chivalry, is perfectly sane on geography: Osuna lies far inland, a long way from any coast."
