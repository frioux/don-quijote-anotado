          - {w: "digáis", f: "dig- + -áis → decir (to tell), present subjunctive, you (vos). Subjunctive after 'suplico', with the 'que' dropped. decir in the present subjunctive: diga, digas, diga, digamos, digáis, digan."}
          - {w: "se os hace", f: "hac- + -e → hacer (to make), present, it, with 'se' and 'os' (to you): 'hacérsele a uno de mal' = to be a burden to someone. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (hacer: hago in the first)."}
