  - sentences:
      - es: "— Pues otra cosa hay en ello —dijo el cura—: que fuera de las simplicidades que este buen hidalgo dice tocantes a su locura, si le tratan de otras cosas, discurre con bonísimas razones y muestra tener un entendimiento claro y apacible en todo."
