              - {s: "como lo habréis notado", r: "as: as you will have noticed"}
        forms:
          - {w: "habréis notado", f: "habr- + -éis → haber, future, you (vosotros), + notado, the participle of notar (to notice): the future perfect of guessing, 'you must have noticed'. habré, habrás, habrá, habremos, habréis, habrán."}
      - es: "Y si en alguna cosa he andado demasiada, o no tan acertada como debiera, echad la culpa a lo que el señor licenciado dijo al principio de mi cuento: que los trabajos continuos y extraordinarios quitan la memoria al que los padece."
        literal: "And if in some thing I-have gone too-much, or not so accurate as I-should, throw the blame on that which the sir licentiate said at-the beginning of my tale: that the troubles continual and extraordinary take-away the memory from-the-one who them suffers."
        ormsby: "and if I have been over minute in any respect or not as precise as I ought, let it be accounted for by what the licentiate said at the beginning of my tale, that constant and excessive troubles deprive the sufferers of their memory.”"
        vocab:
