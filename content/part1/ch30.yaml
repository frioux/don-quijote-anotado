  - sentences:
      - es: "— Así es la verdad —dijo Dorotea—. «Dijo más: que había de ser alto de cuerpo, seco de rostro, y que en el lado derecho, debajo del hombro izquierdo, o por allí junto, había de tener un lunar pardo con ciertos cabellos a manera de cerdas.»"
        literal: "— So is the truth —said Dorotea—. «He-said more: that he-was to be tall of body, dry of face, and that on the side right, under the shoulder left, or there near, he-was to have a mole brown with certain hairs in manner of bristles.»"
        ormsby: "“That is it,” said Dorothea; “he said, moreover, that he would be tall of stature and lank featured; and that on his right side under the left shoulder, or thereabouts, he would have a grey mole with hairs like bristles.”"
        ormsby_note: "This was the mark from which the ancestor of the Dukes of Medinaceli, Fernando de la Cerda, took his name."
        vocab:
          - {w: "alto de cuerpo", d: "tall of body, tall"}
          - {w: "seco de rostro", d: "lean-faced, gaunt"}
          - {w: "por allí junto", d: "or thereabouts, close by there"}
          - {w: "lunar", d: "mole, birthmark"}
          - {w: "pardo", d: "brownish-grey, dun"}
          - {w: "a manera de", d: "like, in the manner of"}
          - {w: "cerda", d: "bristle (of a pig or a horse)"}
