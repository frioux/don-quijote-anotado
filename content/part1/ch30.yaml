            r: "main verb: is"
            under:
              - {s: "por dicha", r: "how: by any chance"}
              - {s: "más hermosa", r: "what: more beautiful"}
              - {s: "mi señora Dulcinea?", r: "subject: my lady Dulcinea"}
        forms:
          - {w: "Es", f: "ser (to be), present, she. soy, eres, es, somos, sois, son."}
          - {w: "hermosa", f: "hermos- + -a → hermoso (beautiful), feminine to match 'Dulcinea'."}
      - es: "No, por cierto, ni aun con la mitad, y aun estoy por decir que no llega a su zapato de la que está delante."
        literal: "No, for certain, nor even with the half, and even I-am for saying that not she-reaches to her shoe of the-one who is in-front."
        ormsby: "Not she; nor half as fair; and I will even go so far as to say she does not come up to the shoe of this one here."
        vocab:
          - {w: "por cierto", d: "certainly, indeed"}
          - {w: "ni aun con la mitad", d: "not even half as much"}
          - {w: "estar por", d: "to be inclined to, to feel like (+ infinitive)"}
          - {w: "no llegar a su zapato", d: "not to come up to someone's shoe, to be far beneath someone"}
        diagram:
          - {s: "No, por cierto, ni aun con la mitad", r: "answer: certainly not, not even half"}
          - s: "y aun estoy por decir"
            r: "main verb: and I'm even inclined to say"
