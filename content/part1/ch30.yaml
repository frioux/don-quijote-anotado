          - {s: "es mi historia:", r: "main verb: is my story"}
        forms:
          - {w: "Ésta", f: "the demonstrative 'esta' (this), feminine to match 'historia', with the accent once used when it stands alone as a pronoun."}
          - {w: "prosiguió", f: "prosigu- + -ió → proseguir (to go on), preterite, she. The stem e becomes i in this form: proseguí, proseguiste, prosiguió, proseguimos, proseguisteis, prosiguieron."}
      - es: "sólo resta por deciros que de cuanta gente de acompañamiento saqué de mi reino no me ha quedado sino sólo este buen barbado escudero, porque todos se anegaron en una gran borrasca que tuvimos a vista del puerto, y él y yo salimos en dos tablas a tierra, como por milagro;"
        literal: "only it-remains to tell-you that of as-many people of retinue [as] I-brought-out from my kingdom not to-me has remained but only this good bearded squire, because all themselves drowned in a great storm that we-had at sight of-the port, and he and I came-out on two planks to land, as by miracle;"
        ormsby: "it only remains to tell you that of all the attendants I took with me from my kingdom I have none left except this well-bearded squire, for all were drowned in a great tempest we encountered when in sight of port; and he and I came to land on a couple of planks as if by a miracle;"
        vocab:
          - {w: "restar", d: "to remain, be left"}
          - {w: "cuanta gente", d: "all the people that, as many people as"}
          - {w: "acompañamiento", d: "retinue, escort, following"}
          - {w: "no ... sino sólo", d: "nothing but, only"}
          - {w: "barbado", d: "bearded (the barber in his false beard)"}
          - {w: "anegarse", d: "to drown"}
          - {w: "borrasca", d: "storm, squall"}
          - {w: "a vista de", d: "within sight of"}
          - {w: "tabla", d: "plank, board"}
        diagram:
          - s: "sólo resta por deciros"
            r: "main verb: it only remains to tell you"
            under:
              - s: "que ... no me ha quedado sino sólo este buen barbado escudero"
                r: "what: that nobody is left to me but this good bearded squire"
                under:
                  - {s: "de cuanta gente de acompañamiento saqué de mi reino", r: "of whom: of all the retinue I brought from my kingdom"}
                  - s: "porque todos se anegaron en una gran borrasca"
                    r: "why: because they all drowned in a great storm"
                    under:
                      - {s: "que tuvimos a vista del puerto", r: "describes 'borrasca': which we met in sight of port"}
                  - {s: "y él y yo salimos en dos tablas a tierra, como por milagro", r: "and: and he and I reached land on two planks, as if by a miracle"}
        forms:
          - {w: "resta", f: "rest- + -a → restar (to remain), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "deciros", f: "decir (to tell) + os (to you), the pronoun hung on the infinitive."}
          - {w: "cuanta", f: "cuant- + -a → cuanto (as much as, all the), feminine to match 'gente'."}
          - {w: "saqué", f: "saqu- + -é → sacar (to bring out), preterite, I: c becomes qu before e. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "me ha quedado", f: "ha, the present of haber, he (he, has, ha, hemos, habéis, han), + quedado, the participle of quedar (to remain), with 'me' (to me): 'has remained to me'."}
          - {w: "se anegaron", f: "aneg- + -aron → anegarse (to drown), preterite, they. Same -ar preterite."}
          - {w: "tuvimos", f: "tuv- + -imos → tener (to have), preterite, we. Irregular: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron."}
          - {w: "salimos", f: "sal- + -imos → salir (to come out), preterite, we. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
        note: "The 'bearded squire' is the barber in his false oxtail beard; the shipwreck explains why a princess travels with only one attendant."
      - es: "y así, es todo milagro y misterio el discurso de mi vida, como lo habréis notado."
        literal: "and so, is all miracle and mystery the course of my life, as it you-will-have noticed."
        ormsby: "and indeed the whole course of my life is a miracle and a mystery as you may have observed;"
        vocab:
