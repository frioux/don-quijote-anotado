  - sentences:
      - es: "— Ahora te disculpo —dijo don Quijote—, y perdóname el enojo que te he dado, que los primeros movimientos no son en manos de los hombres."
        literal: "— Now you I-excuse —said Don Quijote—, and forgive-me the annoyance that to-you I-have given, for the first movements not are in hands of the men."
        ormsby: "“Now I forgive thee,” said Don Quixote; “and do thou forgive me the injury I have done thee; for our first impulses are not in our control.”"
        vocab:
          - {w: "disculpar", d: "to excuse, forgive"}
          - {w: "enojo", d: "annoyance, anger; here the harm done in anger"}
          - {w: "los primeros movimientos", d: "first impulses, sudden passions (a moral-theology term: impulses that come before reason and so are not sins)"}
          - {w: "ser en manos de", d: "to be in the power of (old 'ser' where modern Spanish says 'estar')"}
        diagram:
          - {s: "Ahora te disculpo", r: "main verb 1: now I excuse you"}
          - {s: "dijo don Quijote", r: "speech tag"}
          - s: "y perdóname el enojo"
            r: "main verb 2: and forgive me the harm"
            under:
              - {s: "que te he dado", r: "describes 'enojo': that I have done you"}
              - {s: "que los primeros movimientos no son en manos de los hombres", r: "why ('que' = for): for first impulses are not in men's control"}
        forms:
          - {w: "disculpo", f: "disculp- + -o → disculpar (to excuse), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "perdóname", f: "perdona, the tú command of perdonar (to forgive), + me, accent added. He is back to 'tú' now he is calm."}
          - {w: "te he dado", f: "he, the present of haber, I (he, has, ha, hemos, habéis, han), + dado, the participle of dar (to give), with 'te' (to you)."}
          - {w: "primeros", f: "primer- + -os → primero (first), masculine plural to match 'movimientos'."}
  - sentences:
      - es: "— Ya yo lo veo —respondió Sancho—; y así, en mí la gana de hablar siempre es primero movimiento, y no puedo dejar de decir, por una vez siquiera, lo que me viene a la lengua."
        literal: "— Already I it see —answered Sancho—; and so, in me the desire of speaking always is first movement, and not I-can leave-off of saying, for one time at-least, that which to-me comes to the tongue."
        ormsby: "“That I see,” replied Sancho, “and with me the wish to speak is always the first impulse, and I cannot help saying, once at any rate, what I have on the tip of my tongue.”"
        vocab:
          - {w: "gana", d: "desire, urge"}
          - {w: "primero movimiento", d: "first impulse (Sancho uses the full 'primero' where the phrase has 'primer')"}
          - {w: "no poder dejar de", d: "can't help (doing)"}
          - {w: "siquiera", d: "at least"}
          - {w: "venirle a uno a la lengua", d: "to come to the tip of one's tongue"}
        diagram:
          - {s: "Ya yo lo veo", r: "main verb 1: I see that well enough"}
          - {s: "respondió Sancho", r: "speech tag"}
          - {s: "en mí la gana de hablar siempre es primero movimiento", r: "main clause 2 (after 'y así'): in me the urge to speak is always a first impulse"}
          - s: "y no puedo dejar de decir, por una vez siquiera, lo"
            r: "main verb 3: and I can't help saying, once at least, what"
            under:
              - {s: "que me viene a la lengua", r: "describes 'lo': what comes to my tongue"}
        forms:
          - {w: "veo", f: "ve- + -o → ver (to see), present, I. veo, ves, ve, vemos, veis, ven."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "puedo", f: "pued- + -o → poder (can), present, I. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "viene", f: "vien- + -e → venir (to come), present, it. vengo, vienes, viene, venimos, venís, vienen."}
        note: "Sancho turns his master's excuse against him: if first impulses are not a man's fault, neither is his tongue."
  - sentences:
      - es: "— Con todo eso —dijo don Quijote—, mira, Sancho, lo que hablas, porque tantas veces va el cantarillo a la fuente..., y no te digo más."
        literal: "— With all that —said Don Quijote—, look, Sancho, what you-speak, because so-many times goes the little-pitcher to the fountain..., and not to-you I-say more."
        ormsby: "“For all that, Sancho,” said Don Quixote, “take heed of what thou sayest, for the pitcher goes so often to the well—I need say no more to thee.”"
        ormsby_note: "Proverb 33. In full it is, \"the pitcher that goes often to the well leaves behind either the handle or the spout.\""
        vocab:
          - {w: "con todo eso", d: "for all that, nevertheless"}
          - {w: "mirar lo que", d: "to watch what, be careful what"}
          - {w: "cantarillo", d: "little pitcher, jug (diminutive of 'cántaro')"}
          - {w: "tantas veces va el cantarillo a la fuente", d: "proverb, finished '... que deja el asa o la frente': the jug goes to the well so often that it breaks in the end"}
        diagram:
          - {s: "Con todo eso", r: "concession: for all that"}
          - {s: "dijo don Quijote", r: "speech tag"}
          - s: "mira, Sancho, lo que hablas"
            r: "main verb 1: watch what you say, Sancho"
            under:
              - {s: "porque tantas veces va el cantarillo a la fuente...", r: "why: because the pitcher goes to the well so often ..."}
          - {s: "y no te digo más", r: "main verb 2: and I say no more"}
        forms:
          - {w: "mira", f: "mira, the tú command of mirar (to look, watch)."}
          - {w: "hablas", f: "habl- + -as → hablar (to speak), present, you (tú). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "va", f: "ir (to go), present, it. voy, vas, va, vamos, vais, van."}
          - {w: "cantarillo", f: "cántaro (pitcher) + -illo, a diminutive."}
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. digo, dices, dice, decimos, decís, dicen."}
  - sentences:
      - es: "— Ahora bien —respondió Sancho—, Dios está en el cielo, que ve las trampas, y será juez de quién hace más mal: yo en no hablar bien, o vuestra merced en obrallo."
        literal: "— Now well —answered Sancho—, God is in the heaven, who sees the tricks, and will-be judge of who does more ill: I in not speaking well, or your grace in doing-it."
        ormsby: "“Well, well,” said Sancho, “God is in heaven, and sees all tricks, and will judge who does most harm, I in not speaking right, or your worship in not doing it.”"
        vocab:
          - {w: "ahora bien", d: "well then, all right"}
          - {w: "trampa", d: "trick, cheat, trap"}
          - {w: "juez", d: "judge"}
          - {w: "obrallo", d: "= obrarlo, to do it, act it (old -rl- becoming -ll-)"}
        diagram:
          - {s: "Ahora bien", r: "opening: well then"}
          - {s: "respondió Sancho", r: "speech tag"}
          - s: "Dios está en el cielo"
            r: "main verb 1: God is in heaven"
            under:
              - {s: "que ve las trampas", r: "describes 'Dios': who sees all tricks"}
          - s: "y será juez"
            r: "main verb 2: and will be judge"
            under:
              - s: "de quién hace más mal:"
                r: "of what: of who does more wrong"
                under:
                  - {s: "yo en no hablar bien, o vuestra merced en obrallo", r: "the two: me in not speaking well, or your grace in not doing (well)"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "ve", f: "ver (to see), present, he. veo, ves, ve, vemos, veis, ven."}
          - {w: "será", f: "ser (to be), future, he. seré, serás, será, seremos, seréis, serán."}
          - {w: "hace", f: "hac- + -e → hacer (to do), present, he. hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "obrallo", f: "obrar (to act, do) + lo with the r of the infinitive turned into l: obrarlo → obrallo. 'lo' stands for 'bien': 'in not doing well'."}
        note: "Sancho's retort is sharp: his sin is speaking badly, his master's is acting badly, by beating him."
  - sentences:
      - es: "— No haya más —dijo Dorotea—: corred, Sancho, y besad la mano a vuestro señor, y pedilde perdón, y de aquí adelante andad más atentado en vuestras alabanzas y vituperios, y no digáis mal de aquesa señora Tobosa, a quien yo no conozco si no es para servilla, y tened confianza en Dios, que no os ha de faltar un estado donde viváis como un príncipe."
        literal: "— Not let-there-be more —said Dorotea—: run, Sancho, and kiss the hand to your lord, and ask-him pardon, and from here forward go more careful in your praises and censures, and not say ill of that lady Tobosa, whom I not know if not it-is to serve-her, and have trust in God, for not to-you is to fail an estate where you-may-live like a prince."
        ormsby: "“That is enough,” said Dorothea; “run, Sancho, and kiss your lord’s hand and beg his pardon, and henceforward be more circumspect with your praise and abuse; and say nothing in disparagement of that lady Toboso, of whom I know nothing save that I am her servant; and put your trust in God, for you will not fail to obtain some dignity so as to live like a prince.”"
        vocab:
          - {w: "no haya más", d: "that's enough, let there be no more of this"}
          - {w: "pedilde", d: "= pedidle, ask him (the old order: the d of the command and the l of the pronoun swapped)"}
          - {w: "atentado", d: "careful, prudent, cautious (not 'attempted')"}
          - {w: "alabanza", d: "praise"}
          - {w: "vituperio", d: "censure, abuse"}
          - {w: "aquesa", d: "= esa, that (old emphatic form)"}
          - {w: "señora Tobosa", d: "'the lady of El Toboso', Dulcinea, named after her village as if it were a title"}
          - {w: "si no es para", d: "except to"}
          - {w: "servilla", d: "= servirla, to serve her (old -rl- becoming -ll-)"}
          - {w: "estado", d: "estate, rank, a position in life"}
        diagram:
          - {s: "— No haya más", r: "main verb 1: let there be no more"}
          - {s: "dijo Dorotea", r: "speech tag"}
          - {s: "corred, Sancho, y besad la mano a vuestro señor", r: "commands 1-2: run, Sancho, and kiss your lord's hand"}
          - {s: "y pedilde perdón", r: "command 3: and ask his pardon"}
          - {s: "y de aquí adelante andad más atentado en vuestras alabanzas y vituperios", r: "command 4: and from now on be more careful in your praise and abuse"}
          - s: "y no digáis mal de aquesa señora Tobosa"
            r: "command 5: and don't speak ill of that lady of El Toboso"
            under:
              - {s: "a quien yo no conozco si no es para servilla", r: "describes 'señora': whom I know only as one who would serve her"}
          - s: "y tened confianza en Dios"
            r: "command 6: and trust in God"
            under:
              - s: "que no os ha de faltar un estado"
                r: "why ('que' = for): for you will not lack an estate"
                under:
                  - {s: "donde viváis como un príncipe", r: "describes 'estado': where you may live like a prince"}
        forms:
          - {w: "haya", f: "the present subjunctive of haber used alone, as a wish: 'let there be'. haya, hayas, haya, hayamos, hayáis, hayan."}
          - {w: "corred, besad, andad, tened", f: "vosotros/vos commands of correr (to run), besar (to kiss), andar (to go) and tener (to have): the infinitive with -r turned into -d. Dorotea calls Sancho 'vos', a polite form for an inferior."}
          - {w: "pedilde", f: "pedid, the vos command of pedir (to ask), + le (him), with the d and l swapped: pedidle → pedilde, a common old form."}
          - {w: "atentado", f: "masculine to match Sancho; an adjective here, not a participle."}
          - {w: "digáis", f: "dig- + -áis → decir (to say), present subjunctive, you (vos): negative commands use the subjunctive. diga, digas, diga, digamos, digáis, digan."}
          - {w: "conozco", f: "conozc- + -o → conocer (to know), present, I. conozco, conoces, conoce, conocemos, conocéis, conocen."}
          - {w: "servilla", f: "servir + la with the r turned into l: servirla → servilla."}
          - {w: "ha de faltar", f: "ha, the present of haber, it (he, has, ha, hemos, habéis, han), + 'de' + faltar (to be lacking): 'will be lacking'."}
          - {w: "viváis", f: "viv- + -áis → vivir (to live), present subjunctive, you (vos): a place that may exist. The present subjunctive of -er and -ir verbs: -a, -as, -a, -amos, -áis, -an."}
