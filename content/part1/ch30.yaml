        forms:
          - {w: "tornes", f: "torn- + -es → tornar (to return), present subjunctive, you (tú): negative commands use the subjunctive. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "dan", f: "dar (to give), present, they. doy, das, da, damos, dais, dan."}
          - {w: "perdoné", f: "perdon- + -é → perdonar (to forgive), preterite, I. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
