  - sentences:
      - es: "— Echemos, Panza amigo, pelillos a la mar en esto de nuestras pendencias, y dime ahora, sin tener cuenta con enojo ni rencor alguno: ¿Dónde, cómo y cuándo hallaste a Dulcinea?"
