      - es: "— Yo callaré, señora mía —dijo don Quijote—, y reprimiré la justa cólera que ya en mi pecho se había levantado, y iré quieto y pacífico hasta tanto que os cumpla el don prometido;"
        literal: "— I will-be-silent, lady mine —said Don Quijote—, and I-will-repress the just anger that already in my breast itself had raised, and I-will-go quiet and peaceful until such that to-you I-fulfill the boon promised;"
