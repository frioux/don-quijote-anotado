          - s: "sin duda le quitara allí la vida"
            r: "main verb: he would no doubt have killed him there"
            under:
              - s: "si no fuera porque Dorotea le dio voces"
                r: "condition: if Dorotea had not shouted to him"
                under:
                  - {s: "que no le diera más", r: "what she shouted: not to hit him any more"}
        forms:
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), it: 'if it had not been'. fuera, fueras, fuera, fuéramos, fuerais, fueran."}
          - {w: "dio", f: "di- + -o → dar (to give), preterite, she. Irregular: di, diste, dio, dimos, disteis, dieron."}
          - {w: "diera", f: "d- + -iera → dar (to give), imperfect subjunctive (-ra form), he: what she told him (not) to do. diera, dieras, diera, diéramos, dierais, dieran."}
          - {w: "quitara", f: "quit- + -ara → quitar (to take), imperfect subjunctive (-ra form), he, used for 'would have taken'. The -ra form of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran. Cervantes often uses the -ra form where modern Spanish says 'habría quitado'."}
  - sentences:
      - es: "— ¿Pensáis —le dijo a cabo de rato—, villano ruin, que ha de haber lugar siempre para ponerme la mano en la horcajadura, y que todo ha de ser errar vos y perdonaros yo?"
        literal: "— Do-you-think —to-him he-said at end of while—, peasant vile, that there-is to be room always for to-put-me the hand in the crotch, and that all is to be to-err you and to-pardon-you I?"
        ormsby: "“Do you think,” he said to him after a pause, “you scurvy clown, that you are to be always interfering with me, and that you are to be always offending and I always pardoning?"
        vocab:
          - {w: "a cabo de rato", d: "after a while"}
          - {w: "villano", d: "peasant, base-born commoner; also 'villain'"}
          - {w: "ruin", d: "mean, base, vile"}
          - {w: "ponerle a uno la mano en la horcajadura", d: "to take liberties with someone, interfere with someone (literally 'put one's hand in his crotch')"}
          - {w: "horcajadura", d: "crotch, the fork of the legs"}
          - {w: "errar", d: "to err, do wrong"}
        diagram:
          - s: "¿Pensáis"
            r: "main verb: do you think"
            under:
              - {s: "le dijo a cabo de rato", r: "speech tag: he said to him after a while"}
              - {s: "villano ruin", r: "address: base peasant"}
              - {s: "que ha de haber lugar siempre para ponerme la mano en la horcajadura", r: "what, 1: that there'll always be room to take liberties with me"}
              - {s: "y que todo ha de ser errar vos y perdonaros yo?", r: "what, 2: and that it will always be you sinning and me forgiving"}
        forms:
          - {w: "Pensáis", f: "pens- + -áis → pensar (to think), present, you (vos). Don Quijote switches from 'tú' to the colder 'vos' in anger. pienso, piensas, piensa, pensamos, pensáis, piensan."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "ha de haber", f: "ha, the present of haber, + 'de' + haber (there to be): 'there will have to be'. he, has, ha, hemos, habéis, han."}
          - {w: "ponerme", f: "poner (to put) + me (on me), the pronoun hung on the infinitive."}
          - {w: "errar vos y perdonaros yo", f: "two infinitives with their subjects after them: 'you erring and me pardoning you'; 'perdonaros' = perdonar + os (you)."}
      - es: "Pues no lo penséis, bellaco descomulgado, que sin duda lo estás, pues has puesto lengua en la sin par Dulcinea."
        literal: "Well not it think, scoundrel excommunicated, for without doubt it you-are, since you-have put tongue on the without equal Dulcinea."
