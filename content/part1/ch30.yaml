  - sentences:
      - es: "— Así fuera —respondió Sancho—, si no la hubiera yo tomado en la memoria cuando vuestra merced me la leyó, de manera que se la dije a un sacristán, que me la trasladó del entendimiento, tan punto por punto, que dijo que en todos los días de su vida, aunque había leído muchas cartas de descomunión, no había visto ni leído tan linda carta como aquélla."
        literal: "— So it-would-have-been —answered Sancho—, if not it had I taken in the memory when your grace to-me it read, in manner that to-him it I-said to a sacristan, who for-me it copied from-the understanding, so point by point, that he-said that in all the days of his life, although he-had read many letters of excommunication, not he-had seen nor read so pretty letter as that-one."
        ormsby: "“So I should have done,” said Sancho, “if I had not got it by heart when your worship read it to me, so that I repeated it to a sacristan, who copied it out for me from hearing it, so exactly that he said in all the days of his life, though he had read many a letter of excommunication, he had never seen or read so pretty a letter as that.”"
        vocab:
          - {w: "así fuera", d: "so it would have been, so I would have done"}
          - {w: "tomar en la memoria", d: "to learn by heart"}
          - {w: "sacristán", d: "sacristan, sexton, the church caretaker who can read and write"}
          - {w: "del entendimiento", d: "from his (Sancho's) head, from memory"}
          - {w: "punto por punto", d: "word for word, exactly"}
          - {w: "carta de descomunión", d: "letter of excommunication, a church document read out against offenders; the only 'letters' a sacristan would know"}
          - {w: "lindo", d: "pretty, fine"}
        diagram:
          - {s: "Así fuera", r: "main verb 1: so it would have been"}
          - {s: "respondió Sancho", r: "speech tag"}
          - s: "si no la hubiera yo tomado en la memoria"
            r: "condition: if I hadn't learned it by heart"
            under:
              - {s: "cuando vuestra merced me la leyó", r: "when: when your grace read it to me"}
          - s: "de manera que se la dije a un sacristán"
            r: "result: so that I recited it to a sacristan"
            under:
              - s: "que me la trasladó del entendimiento, tan punto por punto"
                r: "describes 'sacristán': who copied it from my memory, so word for word"
                under:
                  - s: "que dijo"
                    r: "result: that he said"
                    under:
                      - {s: "que en todos los días de su vida ... no había visto ni leído tan linda carta como aquélla", r: "what: that never in his life had he seen or read so fine a letter"}
                      - {s: "aunque había leído muchas cartas de descomunión", r: "concession: though he had read many letters of excommunication"}
        forms:
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), it, used for 'would have been'. fuera, fueras, fuera, fuéramos, fuerais, fueran."}
          - {w: "hubiera ... tomado", f: "hub- + -iera → haber, imperfect subjunctive (-ra form), I, + tomado, the participle of tomar (to take): 'if I had not taken'. hubiera, hubieras, hubiera, hubiéramos, hubierais, hubieran."}
          - {w: "leyó", f: "le- + -yó → leer (to read), preterite, you (vuestra merced): the i between vowels becomes y. leí, leíste, leyó, leímos, leísteis, leyeron."}
          - {w: "se la dije", f: "dij- + -e → decir (to say), preterite, I, with 'se' (to him; 'le' turns into 'se' before 'la') and 'la' (it). dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "trasladó", f: "traslad- + -ó → trasladar (to copy), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "había leído, había visto", f: "había, the imperfect of haber, he (había, habías, había, habíamos, habíais, habían), + leído (read) and visto (seen, irregular): 'had read, had seen'."}
          - {w: "aquélla", f: "the demonstrative 'aquella' (that), feminine to match 'carta', with the accent once used for the pronoun."}
        note: "All of this is a lie: Sancho never reached a sacristan or Dulcinea. The sacristan's praise is comic, since the only letters he knows are excommunications."
