          - {w: "demasiada, acertada", f: "feminine to agree with 'I', the speaker, a woman."}
          - {w: "debiera", f: "deb- + -iera → deber (ought), imperfect subjunctive (-ra form), I: 'as I should have'. The -ra form of -er and -ir verbs: -iera, -ieras, -iera, -iéramos, -ierais, -ieran."}
          - {w: "echad", f: "the vosotros command of echar (to throw): echa (tú), echad (vosotros)."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "quitan", f: "quit- + -an → quitar (to take away), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "padece", f: "padec- + -e → padecer (to suffer), present, he. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (padecer: padezco in the first)."}
  - sentences:
      - es: "— Ésa no me quitarán a mí, ¡oh alta y valerosa señora! —dijo don Quijote—, cuantos yo pasare en serviros, por grandes y no vistos que sean;"
        literal: "— That not from-me they-will-take-away from me, oh high and valiant lady! —said Don Quijote—, as-many-as I may-undergo in serving-you, however great and not seen that they-be;"
        ormsby: "“They shall not deprive me of mine, exalted and worthy princess,” said Don Quixote, “however great and unexampled those which I shall endure in your service may be;"
        vocab:
          - {w: "ésa", d: "that one (the memory)"}
          - {w: "alto", d: "high, noble, exalted"}
          - {w: "valeroso", d: "valiant; here 'worthy, excellent'"}
          - {w: "cuantos", d: "as many as, all those (troubles) that"}
          - {w: "no visto", d: "unheard-of, unprecedented (literally 'not seen')"}
        diagram:
          - s: "Ésa no me quitarán a mí"
            r: "main verb: they shall not take that (memory) from me"
            under:
              - {s: "¡oh alta y valerosa señora!", r: "address: O high and worthy lady"}
              - {s: "dijo don Quijote", r: "speech tag"}
              - s: "cuantos yo pasare en serviros"
                r: "subject: all the troubles I may suffer in serving you"
                under:
                  - {s: "por grandes y no vistos que sean", r: "concession: however great and unheard-of they may be"}
        forms:
          - {w: "Ésa", f: "the demonstrative 'esa' (that), feminine to match 'memoria', with the accent once used for the pronoun."}
          - {w: "quitarán", f: "quitar (to take away) + -án, future, they. The future adds the endings to the infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "me ... a mí", f: "the pronoun 'me' doubled by 'a mí' for emphasis: 'from me, at least'."}
          - {w: "pasare", f: "pas- + -are → pasar (to undergo), future subjunctive, I: 'however many I may undergo'. The future subjunctive of -ar verbs: -are, -ares, -are, -áremos, -areis, -aren. Modern Spanish uses 'pase'."}
          - {w: "serviros", f: "servir (to serve) + os (you), the pronoun hung on the infinitive."}
          - {w: "sean", f: "ser (to be), present subjunctive, they, after 'por ... que' (however). sea, seas, sea, seamos, seáis, sean."}
      - es: "y así, de nuevo confirmo el don que os he prometido, y juro de ir con vos al cabo del mundo, hasta verme con el fiero enemigo vuestro, a quien pienso, con el ayuda de Dios y de mi brazo, tajar la cabeza soberbia con los filos desta... no quiero decir buena espada, merced a Ginés de Pasamonte, que me llevó la mía."
        literal: "and so, anew I-confirm the boon that to-you I-have promised, and I-swear of going with you to-the end of-the world, until seeing-myself with the fierce enemy yours, to whom I-intend, with the help of God and of my arm, to-cut the head proud with the edges of-this... not I-want to-say good sword, thanks to Ginés de Pasamonte, who from-me carried-off the mine."
        ormsby: "and here I confirm anew the boon I have promised you, and I swear to go with you to the end of the world until I find myself in the presence of your fierce enemy, whose haughty head I trust by the aid of my arm to cut off with the edge of this—I will not say good sword, thanks to Ginés de Pasamonte who carried away mine”—"
        ormsby_note: "Cervantes seems to have intended that Ginés de Pasamonte should carry off Don Quixote's sword, as Brunello did Marfisa's at the siege of Albracca."
        vocab:
          - {w: "de nuevo", d: "anew, again"}
          - {w: "jurar de", d: "to swear to (old 'de' before the infinitive)"}
          - {w: "al cabo del mundo", d: "to the end of the world"}
          - {w: "verse con", d: "to come face to face with"}
          - {w: "fiero", d: "fierce, savage"}
          - {w: "pensar", d: "here 'to intend, mean to' (+ infinitive)"}
          - {w: "el ayuda", d: "the help; 'el' before stressed a- was then used more widely than today"}
          - {w: "tajar", d: "to cut, slice off"}
          - {w: "soberbio", d: "proud, arrogant (not 'superb')"}
          - {w: "filo", d: "cutting edge of a blade"}
          - {w: "merced a", d: "thanks to"}
          - {w: "Ginés de Pasamonte", d: "the cleverest of the galley slaves Don Quijote freed (chapter 22), a thief and writer of his own life"}
        diagram:
          - s: "de nuevo confirmo el don"
            r: "main verb 1 (after 'y así'): I confirm the boon again"
            under:
              - {s: "que os he prometido", r: "describes 'don': that I have promised you"}
          - s: "y juro de ir con vos al cabo del mundo"
            r: "main verb 2: and I swear to go with you to the end of the world"
            under:
              - s: "hasta verme con el fiero enemigo vuestro"
                r: "until: until I face your fierce enemy"
                under:
                  - s: "a quien pienso ... tajar la cabeza soberbia"
                    r: "describes 'enemigo': whose proud head I intend to cut off"
                    under:
                      - {s: "con el ayuda de Dios y de mi brazo", r: "how: with God's help and my arm's"}
                      - {s: "con los filos desta... no quiero decir buena espada", r: "with what: with the edge of this ... I won't say good sword"}
                      - s: "merced a Ginés de Pasamonte"
                        r: "why: thanks to Ginés de Pasamonte"
                        under:
                          - {s: "que me llevó la mía", r: "describes 'Ginés': who carried off mine"}
        forms:
          - {w: "confirmo", f: "confirm- + -o → confirmar (to confirm), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "os he prometido", f: "he, the present of haber, I (he, has, ha, hemos, habéis, han), + prometido, the participle of prometer (to promise), with 'os' (to you)."}
          - {w: "juro", f: "jur- + -o → jurar (to swear), present, I. Same -ar present."}
          - {w: "verme", f: "ver (to see) + me (myself): 'to find myself face to face'."}
          - {w: "vuestro", f: "the possessive of 'vos' after the noun, masculine to match 'enemigo': 'your enemy'."}
          - {w: "pienso", f: "piens- + -o → pensar (to intend), present, I. The stem e becomes ie when stressed: pienso, piensas, piensa, pensamos, pensáis, piensan."}
          - {w: "desta", f: "de + esta (of this)."}
          - {w: "quiero", f: "quier- + -o → querer (to want), present, I. quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "llevó", f: "llev- + -ó → llevar (to carry off), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "la mía", f: "the long possessive with 'la', standing for 'la espada mía': 'mine'."}
        note: "Nowhere has the book told us that Ginés took the sword; this is one of Cervantes' famous loose ends."
