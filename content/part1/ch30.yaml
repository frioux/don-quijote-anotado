part: 1
chapter: 30
title_es: "Capítulo XXX. Que trata del gracioso artificio y orden que se tuvo en sacar a nuestro enamorado caballero de la asperísima penitencia en que se había puesto"
title_en: "Which treats of address displayed by the fair Dorothea, with other matters pleasant and amusing"
paragraphs:
  - sentences:
      - es: "No hubo bien acabado el cura, cuando Sancho dijo:"
        literal: "Not had well finished the priest, when Sancho said:"
        ormsby: "The curate had hardly ceased speaking, when Sancho said,"
        vocab:
          - {w: "no hubo bien acabado ... cuando", d: "hardly had he finished ... when; a set pattern for one action following straight on another"}
          - {w: "cura", d: "parish priest; Ormsby's 'curate' (the village priest, Pero Pérez)"}
        diagram:
          - s: "No hubo bien acabado"
            r: "time clause: hardly had he finished"
            under:
              - {s: "el cura", r: "subject: the priest"}
          - s: "cuando Sancho dijo:"
            r: "main verb: when Sancho said"
        forms:
          - {w: "hubo bien acabado", f: "hub- + -o → haber (to have), preterite, he, + acabado, the participle of acabar (to finish): the 'preterite anterior', 'had finished', used for something finished just before another past event. haber's preterite: hube, hubiste, hubo, hubimos, hubisteis, hubieron. 'bien' sits between the two parts."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Pues mía fe, señor licenciado, el que hizo esa fazaña fue mi amo, y no porque yo no le dije antes y le avisé que mirase lo que hacía, y que era pecado darles libertad, porque todos iban allí por grandísimos bellacos."
        literal: "— Well by-my faith, sir licentiate, the-one who did that deed was my master, and not because I not him told before and him warned that he-should-look-at what he-was-doing, and that it-was sin to-give-them freedom, because all were-going there as very-great scoundrels."
        ormsby: "“In faith, then, señor licentiate, he who did that deed was my master; and it was not for want of my telling him beforehand and warning him to mind what he was about, and that it was a sin to set them at liberty, as they were all on the march there because they were special scoundrels.”"
        vocab:
          - {w: "mía fe", d: "by my faith, upon my word; a mild oath (also 'a fe mía')"}
          - {w: "licenciado", d: "licentiate, a university graduate; the priest has a degree, and Sancho uses it as his title"}
          - {w: "fazaña", d: "= hazaña, deed, exploit; the old spelling with f- that the books of chivalry use, which Sancho has picked up from his master"}
          - {w: "y no porque yo no le dije", d: "and not for want of my telling him; the second 'no' is not a real negative"}
          - {w: "avisar", d: "to warn, advise (not 'to inform' only)"}
          - {w: "mirar lo que hacía", d: "to watch what he was doing, be careful"}
          - {w: "ir por", d: "to go as, be taken away as (here: sent to the galleys as)"}
          - {w: "bellaco", d: "scoundrel, rogue, villain"}
        diagram:
          - s: "el que hizo esa fazaña fue mi amo"
            r: "main clause: the one who did that deed was my master"
            under:
              - {s: "Pues mía fe, señor licenciado", r: "opening: well, by my faith, sir licentiate"}
          - s: "y no porque yo no le dije antes"
            r: "comment, 1: and not for lack of my telling him beforehand"
            under:
              - s: "y le avisé"
                r: "comment, 2: and warning him"
                under:
                  - {s: "que mirase lo que hacía", r: "what I warned, 1: that he should watch what he was doing"}
                  - s: "y que era pecado darles libertad"
                    r: "what I warned, 2: and that it was a sin to set them free"
                    under:
                      - {s: "porque todos iban allí por grandísimos bellacos", r: "why: because they were all being taken there as great scoundrels"}
        forms:
          - {w: "hizo", f: "hiz- + -o → hacer (to do), preterite, he. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron (the c becomes z before o)."}
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, he. ser's preterite is irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "dije", f: "dij- + -e → decir (to say), preterite, I. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "avisé", f: "avis- + -é → avisar (to warn), preterite, I. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "mirase", f: "mir- + -ase → mirar (to look, take care), imperfect subjunctive (-se form), he. Subjunctive because it is what he was warned to do. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "hacía", f: "hac- + -ía → hacer (to do), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "era", f: "ser (to be), imperfect, it. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "darles", f: "dar (to give) + les (to them), the pronoun hung on the end of the infinitive."}
          - {w: "iban", f: "ir (to go), imperfect, they. Irregular: iba, ibas, iba, íbamos, ibais, iban."}
          - {w: "grandísimos", f: "grand- + -ísimos → grande (great) with the superlative suffix -ísimo ('very, extremely'), masculine plural to match 'bellacos'."}
        note: "In the previous chapter the priest told, as if by hearsay, how some madman had freed the galley slaves, meaning to shame Don Quijote without naming him. Sancho innocently gives the game away."
      - es: "— ¡Majadero! —dijo a esta sazón don Quijote—, a los caballeros andantes no les toca ni atañe averiguar si los afligidos, encadenados y opresos que encuentran por los caminos van de aquella manera, o están en aquella angustia, por sus culpas o por sus gracias;"
        literal: "— Blockhead! —said at this moment Don Quijote—, to the knights errant not to-them it-falls nor concerns to-find-out whether the afflicted, chained and oppressed whom they-meet along the roads go in that manner, or are in that anguish, for their faults or for their graces;"
        ormsby: "“Blockhead!” said Don Quixote at this, “it is no business or concern of knights-errant to inquire whether any persons in affliction, in chains, or oppressed that they may meet on the high roads go that way and suffer as they do because of their faults or because of their misfortunes."
        vocab:
          - {w: "majadero", d: "blockhead, idiot, fool"}
          - {w: "a esta sazón", d: "at this moment, at that point"}
          - {w: "tocarle a uno", d: "to be someone's business, fall to someone"}
          - {w: "atañer", d: "to concern, pertain to (a formal, legal-sounding word)"}
          - {w: "averiguar", d: "to find out, inquire into"}
          - {w: "opreso", d: "= oprimido, oppressed (old Latin-style participle)"}
          - {w: "angustia", d: "anguish, distress"}
          - {w: "por sus culpas o por sus gracias", d: "through their own faults or their 'merits' (ironic: their fine deeds); Ormsby reads 'gracias' as 'misfortunes'"}
        diagram:
          - s: "no les toca ni atañe"
            r: "main verb: it is not their business nor their concern"
            under:
              - {s: "— ¡Majadero!", r: "outburst: blockhead!"}
              - {s: "dijo a esta sazón don Quijote", r: "speech tag: said Don Quijote at this moment"}
              - {s: "a los caballeros andantes", r: "to whom: to knights-errant (repeated by 'les')"}
              - s: "averiguar"
                r: "subject: to find out"
                under:
                  - s: "si los afligidos, encadenados y opresos"
                    r: "what: whether the afflicted, chained and oppressed"
                    under:
                      - {s: "que encuentran por los caminos", r: "describes them: whom they meet on the roads"}
                      - {s: "van de aquella manera, o están en aquella angustia", r: "verbs: go like that, or are in that distress"}
                      - {s: "por sus culpas o por sus gracias", r: "why: by their own fault or their own doing"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "les toca", f: "toc- + -a → tocar (to fall to, be the business of), present, it, with 'les' (to them) repeating 'a los caballeros andantes'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "atañe", f: "atañ- + -e → atañer (to concern), present, it. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (atañer is used almost only in the 'it' forms)."}
          - {w: "afligidos, encadenados y opresos", f: "participles of afligir (to afflict), encadenar (to chain) and the old Latin-style participle 'opreso' (oppressed), masculine plural, used as nouns: 'the afflicted', 'the chained'."}
          - {w: "encuentran", f: "encuentr- + -an → encontrar (to meet), present, they. The stem o becomes ue when stressed: encuentro, encuentras, encuentra, encontramos, encontráis, encuentran."}
          - {w: "van", f: "ir (to go), present, they. Irregular: voy, vas, va, vamos, vais, van."}
          - {w: "están", f: "est- + -án → estar (to be), present, they. estoy, estás, está, estamos, estáis, están."}
          - {w: "aquella", f: "aquell- + -a → aquel (that), feminine to match 'manera' and 'angustia'."}
      - es: "sólo le toca ayudarles como a menesterosos, poniendo los ojos en sus penas y no en sus bellaquerías."
        literal: "only to-him it-falls to-help-them as [to] needy-ones, putting the eyes on their pains and not on their knaveries."
        ormsby: "It only concerns them to aid them as persons in need of help, having regard to their sufferings and not to their rascalities."
        vocab:
          - {w: "menesteroso", d: "needy person, one in want (from 'menester', need)"}
          - {w: "poner los ojos en", d: "to look to, pay attention to"}
          - {w: "pena", d: "suffering, pain; also 'penalty'"}
          - {w: "bellaquería", d: "knavery, roguery, villainy (from 'bellaco', scoundrel)"}
        diagram:
          - s: "sólo le toca"
            r: "main verb: it is only his business"
            under:
              - s: "ayudarles"
                r: "subject: to help them"
                under:
                  - {s: "como a menesterosos", r: "how: as people in need"}
              - {s: "poniendo los ojos en sus penas y no en sus bellaquerías", r: "how: looking at their sufferings, not their crimes"}
        forms:
          - {w: "le toca", f: "toc- + -a → tocar (to fall to, be the business of), present, it, with 'le' (to him): singular now, thinking of each knight, though the last sentence said 'les'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "ayudarles", f: "ayudar (to help) + les (them), the pronoun hung on the infinitive; 'les' for people as direct object, where strict grammar has 'los'."}
          - {w: "como a menesterosos", f: "the 'a' that marks a person as object is repeated after 'como': help them 'as [one helps] the needy'."}
          - {w: "poniendo", f: "gerund of poner (to put): 'putting, setting'."}
          - {w: "sus", f: "'their', plural to match 'penas' and 'bellaquerías' (the things owned), not the owners."}
      - es: "Yo topé un rosario y sarta de gente mohína y desdichada, y hice con ellos lo que mi religión me pide, y lo demás allá se avenga;"
        literal: "I came-upon a rosary and string of people sullen and unfortunate, and I-did with them what my religion of-me asks, and the rest there let-it-settle-itself;"
        ormsby: "I encountered a chaplet or string of miserable and unfortunate people, and did for them what my sense of duty demands of me, and as for the rest be that as it may;"
        vocab:
          - {w: "topar", d: "to come upon, run into, meet by chance"}
          - {w: "rosario", d: "rosary; here a string of men chained one behind the other like rosary beads"}
          - {w: "sarta", d: "string (of beads, pearls), a strung-together row"}
          - {w: "mohíno", d: "sullen, gloomy, downcast"}
          - {w: "desdichado", d: "unfortunate, wretched"}
          - {w: "religión", d: "here the order of knighthood, a sworn way of life like a religious order (as in 'the religion of St John')"}
          - {w: "lo demás allá se avenga", d: "the rest can sort itself out, let the rest be as it may; 'avenirse' = to come to terms"}
        diagram:
          - s: "Yo topé"
            r: "main verb 1: I came upon"
            under:
              - {s: "un rosario y sarta de gente mohína y desdichada", r: "object: a string of gloomy, wretched people"}
          - s: "y hice con ellos"
            r: "main verb 2: and I did with them"
            under:
              - {s: "lo que mi religión me pide", r: "object: what my order asks of me"}
          - {s: "y lo demás allá se avenga", r: "main verb 3: and let the rest take care of itself"}
        forms:
          - {w: "topé", f: "top- + -é → topar (to come upon), preterite, I. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "mohína y desdichada", f: "mohín- + -a, desdichad- + -a → mohíno (sullen), desdichado (wretched), feminine singular to match 'gente', though the next words treat the people as plural ('ellos')."}
          - {w: "hice", f: "hic- + -e → hacer (to do), preterite, I. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "pide", f: "pid- + -e → pedir (to ask), present, it. The stem e becomes i when stressed: pido, pides, pide, pedimos, pedís, piden."}
          - {w: "se avenga", f: "aveng- + -a → avenirse (to come to terms), present subjunctive, it, used as a wish: 'let it sort itself out'. Like venir: avenga, avengas, avenga, avengamos, avengáis, avengan."}
      - es: "y a quien mal le ha parecido, salvo la santa dignidad del señor licenciado y su honrada persona, digo que sabe poco de achaque de caballería, y que miente como un hideputa y mal nacido;"
        literal: "and to whom badly to-him it-has seemed, saving the holy dignity of-the sir licentiate and his honored person, I-say that he-knows little of matter of chivalry, and that he-lies like a son-of-a-whore and ill born;"
        ormsby: "and whoever takes objection to it, saving the sacred dignity of the señor licentiate and his honoured person, I say he knows little about chivalry and lies like a whoreson villain,"
        vocab:
          - {w: "parecerle mal a uno", d: "to seem wrong to someone, to disapprove"}
          - {w: "salvo", d: "saving, except, with due respect to"}
          - {w: "dignidad", d: "dignity; here the rank of a priest"}
          - {w: "honrado", d: "honorable, respectable"}
          - {w: "achaque", d: "usually 'ailment'; 'en achaque de' or 'de achaque de' = in the matter of, as regards"}
          - {w: "mentir como", d: "to lie like ...; telling a man he lies is the formal insult that starts a duel"}
          - {w: "hideputa", d: "= hijo de puta, son of a whore; the strongest insult of the day"}
          - {w: "mal nacido", d: "low-born, base; also simply 'villain'"}
        diagram:
          - s: "digo"
            r: "main verb: I say"
            under:
              - s: "a quien mal le ha parecido"
                r: "to whom: to anyone who has disapproved"
                under:
                  - {s: "salvo la santa dignidad del señor licenciado y su honrada persona", r: "exception: saving the holy rank of the priest and his honored person"}
              - {s: "que sabe poco de achaque de caballería", r: "what I say, 1: that he knows little about chivalry"}
              - {s: "y que miente como un hideputa y mal nacido", r: "what I say, 2: and that he lies like a whoreson and low-born villain"}
        forms:
          - {w: "le ha parecido", f: "ha, the present of haber (to have), he, + parecido, the participle of parecer (to seem): 'it has seemed to him'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "sabe", f: "sab- + -e → saber (to know), present, he. sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "miente", f: "mient- + -e → mentir (to lie), present, he. The stem e becomes ie when stressed: miento, mientes, miente, mentimos, mentís, mienten."}
        note: "Don Quijote does what a gentleman did when insulted: he gives the lie to anyone who disapproves and offers to prove it with his sword. The priest, as a cleric, is carefully excepted, since a knight could not fight a churchman."
      - es: "y esto le haré conocer con mi espada, donde más largamente se contiene."
        literal: "and this to-him I-will-make know with my sword, where more at-length it-is-contained."
        ormsby: "and this I will give him to know to the fullest extent with my sword;”"
        vocab:
          - {w: "hacer conocer", d: "to make known, make someone understand"}
          - {w: "donde más largamente se contiene", d: "'where it is set out at greater length', the formula of legal documents and books referring to a fuller text; here the sword is the full text"}
        diagram:
          - s: "esto le haré conocer"
            r: "main verb: this I will make him know"
            under:
              - s: "con mi espada"
                r: "how: with my sword"
                under:
                  - {s: "donde más largamente se contiene", r: "describes 'espada': where it is set out at more length"}
        forms:
          - {w: "haré", f: "har- + -é → hacer (to make), future, I. Irregular stem har-, regular endings: haré, harás, hará, haremos, haréis, harán."}
          - {w: "le", f: "'to him', the person who disapproved; with 'hacer conocer' the person made to know is an indirect object."}
          - {w: "largamente", f: "larga (long) + -mente: 'at length, fully'. -mente is added to the feminine form of the adjective to make an adverb."}
          - {w: "se contiene", f: "contien- + -e → contener (to contain), present, it, with 'se' making it passive: 'is contained'. Like tener: contengo, contienes, contiene, contenemos, contenéis, contienen."}
        note: "The phrase is lifted from legal writing, where a summary refers the reader to the full document 'donde más largamente se contiene'. Don Quijote makes his sword the full document."
  - sentences:
      - es: "Y esto dijo afirmándose en los estribos y calándose el morrión; porque la bacía de barbero, que a su cuenta era el yelmo de Mambrino, llevaba colgado del arzón delantero, hasta adobarla del mal tratamiento que la hicieron los galeotes."
        literal: "And this he-said steadying-himself in the stirrups and pulling-down-on-himself the morion; because the basin of barber, which by his account was the helmet of Mambrino, he-carried hung from-the saddle-bow front, until mending-it from-the bad treatment that to-it did the galley-slaves."
        ormsby: "and so saying he settled himself in his stirrups and pressed down his morion; for the barber’s basin, which according to him was Mambrino’s helmet, he carried hanging at the saddlebow until he could repair the damage done to it by the galley slaves."
        vocab:
          - {w: "afirmarse en los estribos", d: "to settle firmly in the stirrups, brace oneself (ready to charge)"}
          - {w: "calarse", d: "to pull down firmly on one's head (a hat or helmet)"}
          - {w: "morrión", d: "morion, an open helmet with a crest and brim; here his old helmet, back in use"}
          - {w: "bacía", d: "basin; the barber's brass shaving basin"}
          - {w: "a su cuenta", d: "by his reckoning, as he saw it"}
          - {w: "yelmo de Mambrino", d: "the enchanted golden helmet of the Moorish king Mambrino in Boiardo and Ariosto, won by Rinaldo; Don Quijote thinks the barber's basin is it"}
          - {w: "arzón delantero", d: "front saddle-bow, the raised front of the saddle"}
          - {w: "adobar", d: "to mend, repair (also to season, to tan)"}
          - {w: "galeote", d: "galley slave, a convict condemned to row in the galleys"}
        diagram:
          - s: "Y esto dijo"
            r: "main verb 1: and this he said"
            under:
              - {s: "afirmándose en los estribos", r: "how, 1: bracing himself in the stirrups"}
              - {s: "y calándose el morrión", r: "how, 2: and pulling down his helmet"}
          - s: "llevaba colgado del arzón delantero"
            r: "main verb 2 (after 'porque'): he carried it hanging from the front saddle-bow"
            under:
              - s: "la bacía de barbero"
                r: "object, put first: the barber's basin"
                under:
                  - {s: "que a su cuenta era el yelmo de Mambrino", r: "describes 'bacía': which by his reckoning was Mambrino's helmet"}
              - s: "hasta adobarla del mal tratamiento"
                r: "until when: until he could mend it from the rough handling"
                under:
                  - {s: "que la hicieron los galeotes", r: "describes 'tratamiento': that the galley slaves gave it"}
        forms:
          - {w: "afirmándose, calándose", f: "afirmando, calando, the gerunds of afirmar (to steady) and calar (to pull down), + se (himself), with an accent added to keep the stress."}
          - {w: "era", f: "ser (to be), imperfect, it. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "llevaba", f: "llev- + -aba → llevar (to carry), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "colgado", f: "participle of colgar (to hang), masculine though 'bacía' is feminine: Cervantes is thinking of 'yelmo'."}
          - {w: "adobarla", f: "adobar (to mend) + la (it, the basin), the pronoun hung on the infinitive after 'hasta'."}
          - {w: "la hicieron", f: "hic- + -ieron → hacer (to do), preterite, they. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron. 'la' for 'to it' (the indirect object) is laísmo, Castilian usage; strict grammar wants 'le'."}
        note: "When the galley slaves stoned Don Quijote they also battered the basin he wears as Mambrino's helmet, so he has hung it from the saddle and gone back to his old morion."
  - sentences:
      - es: "Dorotea, que era discreta y de gran donaire, como quien ya sabía el menguado humor de don Quijote y que todos hacían burla dél, sino Sancho Panza, no quiso ser para menos, y, viéndole tan enojado, le dijo:"
        literal: "Dorotea, who was clever and of great grace, as one-who already knew the deficient humor of Don Quijote and that all made mockery of-him, except Sancho Panza, not wanted to-be for less, and, seeing-him so angered, to-him said:"
        ormsby: "Dorothea, who was shrewd and sprightly, and by this time thoroughly understood Don Quixote’s crazy turn, and that all except Sancho Panza were making game of him, not to be behind the rest said to him, on observing his irritation,"
        vocab:
          - {w: "discreto", d: "clever, sensible, quick-witted (false friend: not 'discreet')"}
          - {w: "donaire", d: "wit, grace, charm in speech and manner"}
          - {w: "como quien", d: "as one who, being someone who"}
          - {w: "menguado", d: "lacking, deficient; of the mind, 'crazy, cracked'"}
          - {w: "humor", d: "temper, disposition (the old medical 'humours'), not 'humour'"}
          - {w: "hacer burla de", d: "to make fun of, mock"}
          - {w: "sino", d: "except, but (after a negative or 'todos')"}
          - {w: "no ser para menos", d: "not to be outdone, not to be less than the others"}
          - {w: "enojado", d: "angry, annoyed"}
        diagram:
          - s: "no quiso ser para menos"
            r: "main verb 1: did not want to be outdone"
            under:
              - s: "Dorotea"
                r: "subject"
                under:
                  - {s: "que era discreta y de gran donaire", r: "describes 'Dorotea': who was clever and very witty"}
                  - s: "como quien ya sabía el menguado humor de don Quijote"
