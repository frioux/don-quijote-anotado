summary: |
  The priest has just told, as if by hearsay, of the madman who freed the galley slaves, when Sancho blurts out that it was his master, who would not listen to his warnings. Don Quijote calls him a blockhead: a knight helps the afflicted without asking whether they deserve their chains, and anyone who disagrees, the priest excepted, lies like a scoundrel. Dorotea calms him by reminding him of the boon he has promised her, and he asks to hear her story.

  Dorotea, playing the Princess Micomicona, forgets her made-up name at the start, and the priest slips it to her. She tells how her father, the enchanter-king Tinacrio the Wise, foresaw that a giant, Pandafilando of the Scowling Look, would seize her kingdom, and that she must seek out a Spanish knight called 'Don Azote or Don Gigote', tall and lean, with a hairy mole under his left shoulder on his right side. Don Quijote wants to strip to look for the mole; Sancho assures them he has one on his backbone. When she says she landed at Osuna, which is not a port, the priest rescues her: she meant Málaga. The prophecy ends with the knight marrying her and receiving her kingdom, and Sancho capers for joy and kisses her hands as his future queen.

  But Don Quijote says he can marry no one while his heart belongs to that other lady, not even the phoenix. Sancho, seeing his county slip away, tells him he is out of his mind, that Dulcinea is not half so beautiful, and that he should marry the princess and keep Dulcinea on the side. Don Quijote knocks him down with two blows of his pike and calls him every name he can think of. From behind Dorotea's mule Sancho lets slip that he has never seen Dulcinea, then says he only meant he did not see her at leisure. Master and servant make peace, and Sancho kisses his hand.

  While the priest praises Dorotea's performance and he and Cardenio marvel that Don Quijote is mad only on chivalry and wise on everything else, Don Quijote rides ahead with Sancho to ask about his embassy to Dulcinea. Sancho admits he carried no letter, but claims he had it by heart and had a sacristan write it down; all he now remembers is 'sobajada', meaning 'soberana', the closing words, and the three hundred 'my souls' he put in between.
context: |
  Masters and servants. Rank shapes every exchange here. Don Quijote calls Sancho 'tú' when calm and the colder 'vos' when angry ('¿Pensáis ...?'), and beats him with a stick, which a master could do to a servant without scandal. Dorotea addresses Sancho as 'vos', polite but from above. Sancho's insults are a catalogue of low occupations: 'gañán' (farmhand), 'faquín' (street porter), 'belitre' (beggar), 'villano' (peasant). His hopes are the titles a king could give: 'condado' (a county), 'marqués', 'adelantado' (governor of a frontier province), a 'señor de título'. His advice that his master marry the princess and keep Dulcinea as a mistress, as kings have done, is peasant realism; to Don Quijote it is blasphemy.

  The romances. Dorotea, who has read the books of chivalry, builds her tale from their stock: an enchanter-king who foresees the future, an orphaned princess, a giant usurper with a grotesque name, a far-off knight whose fame has spread across the world, a 'don' (boon) granted before it is named, and a prize of marriage and a kingdom. She even speaks their language, with the archaic 'miémbresele' and 'la vuestra merced'. Don Quijote's oath to cut off the giant's head 'with the edge of this ... I won't say good sword' leads to a loose end: we have never been told that Ginés de Pasamonte stole the sword. Ormsby notes that Cervantes seems to have meant to tell it, on the model of Brunello stealing Marfisa's sword in Boiardo's Orlando Innamorato. Mambrino's helmet, the barber's basin, hangs on the saddle-bow after the galley slaves battered it.

  The narrator's games. The chapter is theater within the story: Dorotea plays a princess, the priest acts as prompter, the barber is a bearded squire, and Cardenio watches. Her mistakes are the comedy: she forgets her own name, places a mole 'on the right side, under the left shoulder', and lands at Osuna, far inland. Ormsby suggests the Osuna slip is a sly hit at the historian Mariana, who has Roman troops land at Osuna. Cardenio's remark that no writer could invent such madness is a joke by an author who has done just that, and the priest states the book's central paradox: Don Quijote is mad only about chivalry and sensible about everything else.

  Religion and law. Don Quijote calls his order of chivalry his 'religión', speaks of Dulcinea as of a saint ('she fights in me ... and I live and breathe in her', echoing St Paul), and calls Sancho's words 'blasfemias'. Sancho calls Dulcinea a 'reliquia', a relic. The priest is excepted from Don Quijote's challenge because a knight could not fight a cleric. Don Quijote borrows legal formulas: 'donde más largamente se contiene' (where it is set out at more length) and 'cosa pasada en cosa juzgada' (res judicata, a case beyond appeal). His 'primeros movimientos' are a term of moral theology for impulses that come before reason and are not sins. The sacristan knows 'cartas de descomunión', letters of excommunication read out in church.

  Proverbs and names. Ormsby lists three proverbs in this chapter: 'pedir cotufas en el golfo' (to ask for tiger-nuts in the open sea, i.e. the impossible), 'tantas veces va el cantarillo a la fuente' (the jug goes to the well so often that in the end it breaks), and 'a pecado nuevo, penitencia nueva'. Others are 'echar pelillos a la mar' (let bygones be bygones) and 'de vobis, vobis' (for nothing). The names are jokes: Micomicona and Micomicón, from 'mico', monkey; Pandafilando de la Fosca Vista, 'of the Scowling Look', which Sancho turns into 'Pandahilado'; Tinacrio el Sabidor; Queen Jaramilla; and 'don Azote' (a whipping) and 'don Gigote' (minced meat) for Don Quijote. Ormsby's note on the hairy mole recalls Fernando de la Cerda ('bristle'), ancestor of the Dukes of Medinaceli. Ormsby's English also includes a passage in which Sancho recovers his donkey from Ginés, disguised as a gypsy; it was added in the second Madrid edition and is not in the Spanish text used here.

  Reading Cervantes' Spanish. This chapter is mostly dialogue, and it shows the old forms of address: 'vuestra merced' with the 'he' form of the verb, 'vos' with -áis and -éis, and polite commands in the subjunctive ('sosiegue', 'prosiga', 'cásese', 'dígame'), plus vos commands in -d ('corred', 'besad', 'tened') and the swapped 'pedilde'. Pronouns hang on verbs that open a clause (detúvose, Parecióle, Agradecióselo, Hízolo, apartáronse, díjole, tiénesla, Dígolo) and even on participles ('prevenídose', 'puéstoos', 'héchoos'). The infinitive's r turns into l before a pronoun: hablalle, preguntalle, servilla, obrallo, leellos, olvidalla. Archaic spellings and forms: fazaña, mesmo, escusar, estender, destruición, estraño, circustantes, trecientas, agora, aquésta, aquesa, entrambas, veniste and trujiste for viniste and trajiste. The future subjunctive is everywhere for an open future (quisiere, estuviere, llevare, pasare, tuviere, viniere, vieres), and the -ra form serves as a conditional ('se diera tres puntos', 'le quitara la vida'). Watch the false friends: discreto (clever), desgracia (misfortune), enfadar (to bore), alcanzar (to find out), suceder (to happen), luego (at once), puesto que (although), trabajos (hardships), continente (bearing), atentado (careful), departir (to talk over), soberbio (proud).
