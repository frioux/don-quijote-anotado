        vocab:
          - {w: "nunca visto", d: "unheard-of, never seen before"}
          - {w: "fabricar", d: "to make up, concoct"}
          - {w: "mentirosamente", d: "falsely, as a fiction"}
          - {w: "agudo", d: "sharp, keen"}
