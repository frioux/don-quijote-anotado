  - sentences:
      - es: "— Dígolo —respondió— porque estos palos de agora más fueron por la pendencia que entre los dos trabó el diablo la otra noche, que por lo que dije contra mi señora Dulcinea, a quien amo y reverencio como a una reliquia, aunque en ella no lo haya, sólo por ser cosa de vuestra merced."
        literal: "— I-say-it —he-answered— because these blows of now more were for the quarrel that between the two stirred-up the devil the other night, than for what I-said against my lady Dulcinea, whom I-love and revere like [to] a relic, although in her not it there-be, only for being thing of your grace."
        ormsby: "“I say it,” he returned, “because those blows just now were more because of the quarrel the devil stirred up between us both the other night, than for what I said against my lady Dulcinea, whom I love and reverence as I would a relic—though there is nothing of that about her—merely as something belonging to your worship.”"
        vocab:
          - {w: "agora", d: "= ahora, now (old form)"}
          - {w: "palo", d: "blow with a stick"}
          - {w: "pendencia", d: "quarrel, fight"}
          - {w: "trabar", d: "to start, stir up (a quarrel)"}
          - {w: "reverenciar", d: "to revere"}
          - {w: "reliquia", d: "relic (of a saint)"}
          - {w: "aunque en ella no lo haya", d: "though there is nothing of that (holiness) in her"}
        diagram:
          - s: "Dígolo"
            r: "main verb: I say it"
            under:
              - {s: "respondió", r: "speech tag: he answered"}
              - s: "porque estos palos de agora más fueron por la pendencia"
                r: "why: because these blows just now were more for the quarrel"
                under:
                  - {s: "que entre los dos trabó el diablo la otra noche", r: "describes 'pendencia': that the devil started between us the other night"}
                  - s: "que por lo que dije contra mi señora Dulcinea"
                    r: "than: than for what I said against my lady Dulcinea"
                    under:
                      - {s: "a quien amo y reverencio como a una reliquia", r: "describes 'Dulcinea': whom I love and revere like a relic"}
                      - {s: "aunque en ella no lo haya", r: "concession: though there's nothing of that in her"}
                      - {s: "sólo por ser cosa de vuestra merced", r: "why: only because she belongs to your grace"}
        forms:
          - {w: "Dígolo", f: "dig- + -o + lo → decir (to say), present, I, with 'lo' (it) on the end, accent added; modern 'lo digo'. digo, dices, dice, decimos, decís, dicen."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "fueron", f: "fu- + -eron → ser (to be), preterite, they. fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "trabó", f: "trab- + -ó → trabar (to stir up), preterite, he (the devil). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "dije", f: "dij- + -e → decir (to say), preterite, I. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "amo, reverencio", f: "am- + -o → amar (to love), reverenci- + -o → reverenciar (to revere), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "haya", f: "the present subjunctive of haber used alone: 'there be'; subjunctive after 'aunque'. haya, hayas, haya, hayamos, hayáis, hayan."}
        note: "The book has narrated no quarrel 'the other night'; editors take it as another of Cervantes' loose ends. 'Like a relic, though she is none' is his comic slip, half insult, half compliment."
  - sentences:
      - es: "— No tornes a esas pláticas, Sancho, por tu vida —dijo don Quijote—, que me dan pesadumbre; ya te perdoné entonces, y bien sabes tú que suele decirse: a pecado nuevo, penitencia nueva."
