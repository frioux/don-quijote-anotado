  - sentences:
      - es: "— Es el caso —replicó Sancho— que, como vuestra merced mejor sabe, todos estamos sujetos a la muerte, y que hoy somos y mañana no, y que tan presto se va el cordero como el carnero, y que nadie puede prometerse en este mundo más horas de vida de las que Dios quisiere darle, porque la muerte es sorda, y, cuando llega a llamar a las puertas de nuestra vida, siempre va depriesa y no la harán detener ni ruegos, ni fuerzas, ni ceptros, ni mitras, según es pública voz y fama, y según nos lo dicen por esos púlpitos."
        literal: "— It-is the case —replied Sancho— that, as your grace better knows, all we-are subject to the death, and that today we-are and tomorrow not, and that so soon itself goes the lamb as the sheep, and that nobody can promise-himself in this world more hours of life than those that God may-wish to-give-him, because the death is deaf, and, when she-comes to knock at the doors of our life, always she-goes in-a-hurry and not her will-make stop neither pleas, nor forces, nor sceptres, nor mitres, according-as is public voice and report, and according-as to-us it they-say through those pulpits."
        ormsby: "“The fact is,” continued Sancho, “that, as your worship knows better than I do, we are all of us liable to death, and today we are, and tomorrow we are not, and the lamb goes as soon as the sheep, and nobody can promise himself more hours of life in this world than God may be pleased to give him; for death is deaf, and when it comes to knock at our life’s door, it is always urgent, and neither prayers, nor struggles, nor sceptres, nor mitres, can keep it back, as common talk and report say, and as they tell us from the pulpits every day.”"
        ormsby_note: "Proverb 59, i.e. to butcher."
        vocab:
          - {w: "es el caso que", d: "the fact is that, the point is"}
          - {w: "sujeto a", d: "subject to, liable to"}
          - {w: "hoy somos y mañana no", d: "proverbial: here today, gone tomorrow"}
          - {w: "presto", d: "soon, quickly (literary)"}
          - {w: "tan presto se va el cordero como el carnero", d: "proverb: the lamb goes (to the butcher) as soon as the sheep; death takes young and old alike"}
          - {w: "carnero", d: "ram, wether: a grown sheep kept for meat"}
          - {w: "sordo", d: "deaf"}
          - {w: "depriesa", d: "= deprisa, in a hurry (old form; 'priesa' = prisa)"}
          - {w: "ruego", d: "plea, prayer, entreaty"}
          - {w: "ceptro", d: "= cetro, sceptre (old spelling), standing for kings"}
          - {w: "mitra", d: "mitre, the bishop's tall hat, standing for prelates"}
          - {w: "pública voz y fama", d: "common report, what everyone says (a legal formula)"}
          - {w: "púlpito", d: "pulpit"}
        diagram:
          - s: "Es el caso"
            r: "main verb: the fact is"
            under:
              - {s: "replicó Sancho", r: "speech tag: replied Sancho"}
              - {s: "como vuestra merced mejor sabe", r: "aside: as your worship knows better (than I)"}
              - {s: "todos estamos sujetos a la muerte", r: "the fact, 1 (after 'que'): that we are all subject to death"}
              - {s: "y que hoy somos y mañana no", r: "the fact, 2: here today, gone tomorrow"}
              - {s: "y que tan presto se va el cordero como el carnero", r: "the fact, 3: the lamb goes as soon as the sheep"}
              - s: "y que nadie puede prometerse en este mundo más horas de vida"
                r: "the fact, 4: that no one can promise himself more hours of life in this world"
                under:
                  - {s: "de las que Dios quisiere darle", r: "than what: than those God may please to give him"}
                  - s: "porque la muerte es sorda"
                    r: "why, 1: because death is deaf"
                  - s: "siempre va depriesa"
                    r: "why, 2 (after 'y'): it always goes in haste"
                    under:
                      - {s: "cuando llega a llamar a las puertas de nuestra vida", r: "when: when it comes to knock at our life's doors"}
                  - s: "y no la harán detener"
                    r: "why, 3: and will not make it stop"
                    under:
                      - {s: "ni ruegos, ni fuerzas, ni ceptros, ni mitras", r: "subject: neither prayers, nor force, nor kings, nor bishops"}
              - {s: "según es pública voz y fama", r: "source, 1: as common report has it"}
              - {s: "y según nos lo dicen por esos púlpitos", r: "source, 2: and as they tell us from the pulpits"}
        forms:
          - {w: "Es", f: "ser (to be), present, it. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "sabe", f: "sab- + -e → saber (to know), present, you (vuestra merced takes the he/she form). Irregular: sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "estamos sujetos", f: "est- + -amos → estar (to be), present, we: estoy, estás, está, estamos, estáis, están; sujetos, masculine plural to match 'todos'."}
          - {w: "somos", f: "ser (to be), present, we: 'we are (alive)'. soy, eres, es, somos, sois, son."}
          - {w: "se va", f: "va → irse (to go away), present, he (the lamb), with 'se'. Irregular: me voy, te vas, se va, nos vamos, os vais, se van."}
          - {w: "puede prometerse", f: "pued- + -e → poder (to be able), present, he; the stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden. + prometer (to promise) with se (himself) hung on the infinitive."}
