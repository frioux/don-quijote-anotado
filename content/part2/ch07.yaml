          - {w: "vale", f: "val- + -e → valer (to be worth), present, it. Irregular only in the 'I' form: valgo, vales, vale, valemos, valéis, valen."}
          - {w: "buena, mala", f: "buen- + -a → bueno (good), mal- + -a → malo (bad), feminine to match 'esperanza', 'queja', 'paga'."}
        note: "Two proverbs back to back. The second means that an unsettled claim is better than a poor settlement: while you still have a grievance you can hope for more."
