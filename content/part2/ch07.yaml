          - {w: "sabía", f: "sab- + -ía → saber (to know), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "sabía no se la negaría", f: "'que' (that) is left out after 'sabía', as Cervantes often does: 'he knew [that] ... would not'."}
          - {w: "se la negaría", f: "negar- + -ía → negar (to refuse), conditional, he (the friend), with 'se' (to him, from 'le' before 'la') and 'la' (it). The conditional adds -ía endings to the whole infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
