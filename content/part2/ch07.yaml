        note: "In Part I Don Quijote rode out in his great-grandfather's helmet with a pasteboard visor, and later wore a barber's brass basin that he took for the helmet of Mambrino. A 'celada de encaje' is a real closed helmet."
      - es: "Ofreciósela Sansón, porque sabía no se la negaría un amigo suyo que la tenía, puesto que estaba más escura por el orín y el moho que clara y limpia por el terso acero."
        literal: "Offered-it-to-him Sansón, because he-knew not to-him it would-deny a friend of-his who it had, granted that it-was more dark through the rust and the mould than bright and clean through the polished steel."
        ormsby: "Samson offered him one, as he knew a friend of his who had it would not refuse it to him, though it was more dingy with rust and mildew than bright and clean like burnished steel."
