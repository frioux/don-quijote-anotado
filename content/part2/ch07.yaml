        ormsby: "and bear in mind, my son, that a good hope is better than a bad holding, and a good grievance better than a bad compensation."
        ormsby_note: "Proverbs 97 and 197. In the second, Shelton and Jervas mistranslate queja \"demand;\" thereby weakening the force of a proverb, the truth of which has been always recognised by politicians, diplomatists, and agitators."
