          - {w: "quiero", f: "quier- + -o → querer (to want), present, I. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "os digo", f: "dig- + -o → decir (to say), present, I, with 'os' (to you). Irregular: digo, dices, dice, decimos, decís, dicen. 'os' goes with 'vos', the form Don Quijote now uses to Sancho."}
          - {w: "queréis", f: "quer- + -éis → querer (to want), present, you (vos). With 'vos' the verb takes the plural 'vosotros' ending even for one person: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "corriere", f: "corr- + -iere → correr (to run), future subjunctive, I: 'whatever fortune I may run'. The future subjunctive of -er and -ir verbs: -iere, -ieres, -iere, -iéremos, -iereis, -ieren. Cervantes uses it for an open future; modern Spanish uses the present subjunctive 'corra'."}
          - {w: "que Dios quede", f: "qued- + -e → quedar (to remain), present subjunctive, he (God): a wish, 'may God remain'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. The 'que' repeats the 'que' after 'digo', a common slip of speech."}
          - {w: "os haga", f: "hag- + -a → hacer (to make), present subjunctive, he (God), with 'os' (you): 'may he make you'. haga, hagas, haga, hagamos, hagáis, hagan."}
      - es: "que a mí no me faltarán escuderos más obedientes, más solícitos, y no tan empachados ni tan habladores como vos."
        literal: "for to me not to-me will-lack squires more obedient, more diligent, and not so clumsy nor so talkative as you."
        ormsby: "for I shall find plenty of squires more obedient and painstaking, and not so thickheaded or talkative as you are.”"
        vocab:
          - {w: "faltar", d: "to be lacking; 'no me faltarán escuderos' = I shall not lack squires"}
          - {w: "solícito", d: "diligent, painstaking, eager to serve (not 'solicitous' in the sense of anxious)"}
          - {w: "empachado", d: "awkward, clumsy, slow; literally 'stuffed, with indigestion'"}
          - {w: "hablador", d: "talkative, a chatterbox"}
        diagram:
          - s: "no me faltarán escuderos"
            r: "main verb (after 'que', for): I shall not lack squires"
            under:
              - {s: "a mí", r: "emphasis: to me, for my part"}
              - {s: "más obedientes, más solícitos", r: "describes 'escuderos', 1: more obedient, more diligent"}
              - {s: "y no tan empachados ni tan habladores como vos", r: "describes 'escuderos', 2: and not so clumsy or so talkative as you"}
        forms:
          - {w: "a mí no me", f: "the person is said twice, 'a mí' (stressed) and 'me', for emphasis: 'I, for my part'."}
          - {w: "faltarán", f: "faltar- + -án → faltar (to be lacking), future, they (the squires). The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án. Like gustar (to please), faltar has the thing lacking as subject."}
          - {w: "empachados", f: "empach- + -ados → empachar (to stuff, hamper), participle used as an adjective, masculine plural to match 'escuderos'."}
          - {w: "habladores", f: "habla- + -dor → hablador (talker), from hablar (to speak); the suffix -dor makes a 'doer' noun or adjective, plural -dores."}
          - {w: "como vos", f: "'as you': vos is the cooler form Don Quijote now uses instead of 'tú'."}
  - sentences:
      - es: "Cuando Sancho oyó la firme resolución de su amo se le anubló el cielo y se le cayeron las alas del corazón, porque tenía creído que su señor no se iría sin él por todos los haberes del mundo;"
        literal: "When Sancho heard the firm resolution of his master on-him clouded-itself the sky and on-him fell the wings of-the heart, because he-had believed that his lord not himself would-go without him for all the possessions of-the world;"
        ormsby: "When Sancho heard his master’s firm, resolute language, a cloud came over the sky with him and the wings of his heart drooped, for he had made sure that his master would not go without him for all the wealth of the world;"
        vocab:
          - {w: "resolución", d: "decision, resolve"}
          - {w: "anublarse", d: "= nublarse, to cloud over; 'se le anubló el cielo' = his sky clouded over, his spirits fell"}
          - {w: "caérsele a uno las alas del corazón", d: "idiom: to lose heart (literally 'the wings of one's heart fall')"}
          - {w: "tener creído", d: "to be convinced, take for certain"}
          - {w: "haberes", d: "possessions, wealth (noun use of 'haber')"}
        diagram:
          - s: "se le anubló el cielo"
            r: "main verb 1: his sky clouded over"
            under:
              - s: "Cuando Sancho oyó la firme resolución de su amo"
                r: "when: when Sancho heard his master's firm decision"
          - s: "y se le cayeron las alas del corazón"
            r: "main verb 2: and the wings of his heart drooped"
            under:
              - s: "porque tenía creído"
                r: "why: because he had been certain"
                under:
                  - {s: "que su señor no se iría sin él", r: "what he was certain of: that his master would not go without him"}
                  - {s: "por todos los haberes del mundo", r: "for what: not for all the wealth in the world"}
        forms:
          - {w: "oyó", f: "oy- + -ó → oír (to hear), preterite, he; the i between vowels becomes y. oí, oíste, oyó, oímos, oísteis, oyeron."}
          - {w: "se le anubló", f: "anubl- + -ó → anublarse (to cloud over), preterite, it (the sky), with 'se' (itself) and 'le' (on him, Sancho). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "se le cayeron", f: "cay- + -eron → caerse (to fall), preterite, they (the wings), with 'se' and 'le' (on him). Irregular: caí, caíste, cayó, caímos, caísteis, cayeron."}
          - {w: "del", f: "de + el, 'of the'."}
          - {w: "tenía creído", f: "ten- + -ía → tener (to have), imperfect, he: tenía, tenías, tenía, teníamos, teníais, tenían; + creído, participle of creer (to believe): 'tener' + participle = to hold as believed, 'he was convinced'."}
          - {w: "se iría", f: "ir- + -ía → irse (to go away), conditional, he, with 'se'. The conditional adds -ía endings to the whole infinitive: iría, irías, iría, iríamos, iríais, irían."}
        note: "Sancho had come to bargain, sure that his master could not do without him; Don Quijote's cold 'vos' and his talk of other squires have called his bluff."
      - es: "y así, estando suspenso y pensativo, entró Sansón Carrasco y la sobrina, deseosos de oír con qué razones persuadía a su señor que no tornarse a buscar las aventuras."
        literal: "and so, being astonished and thoughtful, entered Sansón Carrasco and the niece, eager to hear with what arguments he-was-persuading to their master that not to-return to seek the adventures."
        ormsby: "and as he stood there dumbfoundered and moody, Samson Carrasco came in with the housekeeper and niece, who were anxious to hear by what arguments he was about to dissuade their master from going to seek adventures."
        vocab:
          - {w: "y así", d: "and so, and thus"}
          - {w: "suspenso", d: "astonished, at a loss, struck dumb (not 'in suspense')"}
          - {w: "pensativo", d: "thoughtful, brooding"}
          - {w: "deseoso de", d: "eager to, wishing to"}
          - {w: "razones", d: "arguments, words (not only 'reasons')"}
          - {w: "persuadir a alguien que", d: "to persuade someone to; here 'persuade him not to'"}
          - {w: "tornar a", d: "to go back to, do again (literary for 'volver a')"}
        diagram:
          - s: "entró Sansón Carrasco y la sobrina"
            r: "main verb (after 'y así', and so): Sansón Carrasco and the niece came in"
            under:
              - {s: "estando suspenso y pensativo", r: "when: while he (Sancho) stood astonished and brooding"}
              - s: "deseosos de oír"
                r: "describes Sansón and the niece: eager to hear"
                under:
                  - s: "con qué razones persuadía a su señor"
                    r: "what they want to hear: with what arguments he (Sansón) would persuade their master"
                    under:
                      - {s: "que no tornarse a buscar las aventuras", r: "to what: not to go out looking for adventures again"}
        forms:
          - {w: "estando", f: "gerund of estar (to be): 'being, while he was'."}
          - {w: "entró", f: "entr- + -ó → entrar (to enter), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. Singular although two people follow: the verb agrees with the nearer subject, Sansón."}
          - {w: "deseosos", f: "dese- + -osos → deseoso (eager), masculine plural to cover Sansón and the niece together; a mixed pair takes the masculine."}
          - {w: "persuadía", f: "persuad- + -ía → persuadir (to persuade), imperfect, he (Sansón): 'was going to persuade'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "tornarse", f: "as printed, tornar (to return) + se, an infinitive; the sense wants 'tornase', imperfect subjunctive (-se form) of tornar, he: 'that he should not go back'. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. Most likely a misprint."}
        note: "The Spanish says only the niece comes in with Carrasco; the housekeeper is with them in the next lines, so Ormsby adds her. 'Su señor' is the women's master, Don Quijote."
      - es: "Llegó Sansón, socarrón famoso, y, abrazándole como la vez primera y con voz levantada, le dijo:"
        literal: "Arrived Sansón, joker famous, and, embracing-him as the time first and with voice raised, to-him he-said:"
        ormsby: "The arch wag Samson came forward, and embracing him as he had done before, said with a loud voice,"
        vocab:
          - {w: "llegar", d: "here 'to come up, step forward'"}
          - {w: "socarrón", d: "sly joker, a wag who mocks with a straight face"}
          - {w: "la vez primera", d: "the first time, i.e. when they met in Part II chapter 3"}
          - {w: "con voz levantada", d: "in a loud, raised voice"}
        diagram:
          - s: "Llegó Sansón"
            r: "main verb 1: Sansón came up"
            under:
              - {s: "socarrón famoso", r: "describes Sansón: a famous wag"}
          - s: "le dijo:"
            r: "main verb 2 (after 'y'): he said to him"
            under:
              - s: "abrazándole"
                r: "how: embracing him (Don Quijote)"
                under:
                  - {s: "como la vez primera", r: "how: as the first time"}
              - {s: "y con voz levantada", r: "how: and in a loud voice"}
        forms:
          - {w: "Llegó", f: "lleg- + -ó → llegar (to arrive, come up), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (llegué, with g → gu before e)."}
          - {w: "socarrón", f: "socarr- + -ón: the suffix -ón makes a noun for someone given to something, here mockery."}
          - {w: "abrazándole", f: "gerund of abrazar (to embrace) + le (him), with an accent added to keep the stress: 'embracing him'. 'le' for a male person as direct object (leísmo), as Castilian regularly allows."}
          - {w: "levantada", f: "levant- + -ada → levantar (to raise), participle, feminine to match 'voz'."}
          - {w: "le dijo", f: "dij- + -o → decir (to say), preterite, he, with 'le' (to him). Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— ¡Oh flor de la andante caballería; oh luz resplandeciente de las armas; oh honor y espejo de la nación española!"
        literal: "— Oh flower of the errant chivalry; oh light resplendent of the arms; oh honour and mirror of the nation Spanish!"
        ormsby: "“O flower of knight-errantry! O shining light of arms! O honour and mirror of the Spanish nation!"
        vocab:
          - {w: "flor de", d: "flower of, the finest example of"}
          - {w: "caballería andante", d: "knight-errantry; 'andante' (wandering) put first for grandeur"}
          - {w: "resplandeciente", d: "shining, resplendent"}
          - {w: "espejo", d: "mirror, model to look at and copy"}
        diagram:
          - s: "¡Oh flor de la andante caballería"
            r: "exclamation 1 (no verb): O flower of knight-errantry"
          - s: "oh luz resplandeciente de las armas"
            r: "exclamation 2: O shining light of arms"
          - s: "oh honor y espejo de la nación española!"
            r: "exclamation 3: O honour and mirror of the Spanish nation"
        forms:
          - {w: "andante", f: "and- + -ante → andar (to walk, wander), the old present participle used as an adjective: 'wandering, errant'. Placed before the noun for a solemn ring."}
          - {w: "resplandeciente", f: "resplandec- + -iente → resplandecer (to shine), present participle used as an adjective, 'shining'; same form for masculine and feminine, here with 'luz'."}
          - {w: "española", f: "español (Spanish) + -a, feminine to match 'nación'."}
        note: "Carrasco parodies the high style of the romances of chivalry, where heroes are hailed as 'flower' and 'mirror' of knighthood. He is mocking Don Quijote to his face, and Don Quijote takes it as homage."
      - es: "Plega a Dios todopoderoso, donde más largamente se contiene, que la persona o personas que pusieren impedimento y estorbaren tu tercera salida, que no la hallen en el laberinto de sus deseos, ni jamás se les cumpla lo que mal desearen."
        literal: "May-it-please to God all-powerful, where more at-length itself is-contained, that the person or persons who shall-put impediment and shall-hinder your third sally, that not it they-may-find in the labyrinth of their desires, nor ever to-them may-be-fulfilled that which ill they-shall-desire."
        ormsby: "may God Almighty in his infinite power grant that any person or persons, who would impede or hinder thy third sally, may find no way out of the labyrinth of their schemes, nor ever accomplish what they most desire!”"
        vocab:
          - {w: "plega a Dios", d: "may it please God (old form of 'plegue a Dios', from 'placer', to please)"}
          - {w: "todopoderoso", d: "almighty"}
          - {w: "donde más largamente se contiene", d: "'as is set out more fully elsewhere': a formula from legal documents, absurdly attached to God"}
          - {w: "la persona o personas", d: "'the person or persons': more notary's jargon"}
          - {w: "poner impedimento", d: "to raise an objection, put an obstacle in the way (also legal language, as in marriage banns)"}
          - {w: "estorbar", d: "to hinder, obstruct"}
          - {w: "salida", d: "sally, setting out; also 'way out, exit', which gives the pun with 'laberinto'"}
          - {w: "laberinto", d: "labyrinth, maze"}
          - {w: "cumplirse", d: "to be fulfilled, come true"}
        diagram:
          - s: "Plega a Dios todopoderoso"
            r: "main verb: may it please almighty God"
            under:
              - {s: "donde más largamente se contiene", r: "aside: as is set out more fully elsewhere (legal formula)"}
              - s: "que"
                r: "what should please God: that"
                under:
                  - s: "la persona o personas"
                    r: "topic: the person or persons"
                    under:
                      - {s: "que pusieren impedimento y estorbaren tu tercera salida", r: "describes 'personas': who may object to and hinder your third sally"}
                  - {s: "que no la hallen en el laberinto de sus deseos", r: "wish 1: may they not find it (the way out, 'salida') in the maze of their desires"}
                  - {s: "ni jamás se les cumpla lo que mal desearen", r: "wish 2: nor ever get what they wickedly desire"}
        forms:
          - {w: "Plega", f: "pleg- + -a → placer (to please), present subjunctive, it: an old form, kept only in wishes like 'plega a Dios' (also 'plegue'); the regular forms are plazca, plazcas, plazca, plazcamos, plazcáis, plazcan."}
          - {w: "se contiene", f: "contien- + -e → contenerse (to be contained), present, it, with 'se' making it passive: 'is contained, is set out'. Like tener (to have): contengo, contienes, contiene, contenemos, contenéis, contienen."}
          - {w: "pusieren", f: "pus- + -ieren → poner (to put), future subjunctive, they: 'whoever may put'. Built on the preterite pusieron: pusiere, pusieres, pusiere, pusiéremos, pusiereis, pusieren. Cervantes uses it after a relative for an open future; modern Spanish uses the present subjunctive 'pongan'."}
          - {w: "estorbaren", f: "estorb- + -aren → estorbar (to hinder), future subjunctive, they. The future subjunctive of -ar verbs: -are, -ares, -are, -áremos, -areis, -aren."}
          - {w: "tu", f: "'your' to a tú-listener: Carrasco slips into the familiar form of the romances, where knights are addressed as 'tú'."}
          - {w: "que no la hallen", f: "hall- + -en → hallar (to find), present subjunctive, they, after the repeated 'que' of the wish; 'la' = it, the 'salida' (sally, but also exit). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "se les cumpla", f: "cumpl- + -a → cumplirse (to be fulfilled), present subjunctive, it, with 'se' (passive) and 'les' (for them). The present subjunctive of -er and -ir verbs: -a, -as, -a, -amos, -áis, -an."}
          - {w: "desearen", f: "dese- + -aren → desear (to desire), future subjunctive, they: 'whatever they may desire'. Same -are future subjunctive: -are, -ares, -are, -áremos, -areis, -aren."}
        note: "A burlesque curse: Carrasco borrows the notary's 'where it is set out at greater length' and 'the person or persons' and fixes them to a prayer. The pun is on 'salida': let those who block his sally find no 'salida' (way out) from their own maze."
