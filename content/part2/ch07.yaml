                r: "how: on the advice and with the approval of the great Carrasco"
                under:
                  - {s: "que por entonces era su oráculo", r: "describes 'Carrasco': who was their oracle at the time"}
              - {s: "que de allí a tres días fuese su partida", r: "what was arranged: that they would leave three days later"}
        forms:
          - {w: "se abrazaron", f: "abraz- + -aron → abrazarse (to embrace each other), preterite, they; 'se' is 'each other'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "quedaron", f: "qued- + -aron → quedar (to remain), preterite, they. Same -aron preterite. quedar (to remain) + noun = to end up as: 'became friends'."}
          - {w: "gran", f: "grande (great) clipped before a singular noun ('Carrasco'), like buen, algún, ningún."}
          - {w: "era", f: "ser (to be), imperfect, he. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "se ordenó", f: "orden- + -ó → ordenar (to arrange), preterite, it, with 'se' making it impersonal: 'it was arranged'. Same -ó preterite."}
          - {w: "fuese", f: "fu- + -ese → ser (to be), imperfect subjunctive (-se form), it: subjunctive after a verb of arranging ('se ordenó que'). fuese, fueses, fuese, fuésemos, fueseis, fuesen."}
      - es: "en los cuales habría lugar de aderezar lo necesario para el viaje, y de buscar una celada de encaje, que en todas maneras dijo don Quijote que la había de llevar."
        literal: "in the which there-would-be place to prepare the necessary for the journey, and to look-for a helmet of fitting, that in all manners said Don Quijote that it he-had to carry."
        ormsby: "by which time they could have all that was requisite for the journey ready, and procure a closed helmet, which Don Quixote said he must by all means take."
