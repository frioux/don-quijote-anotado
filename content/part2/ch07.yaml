        note: "Don Quijote answers Sancho with a proverb of his own: as long as he has isles and titles to hand out, squires will come to him like pigeons to feed."
      - es: "Y advertid, hijo, que vale más buena esperanza que ruin posesión, y buena queja que mala paga."
