          - {w: "patria", d: "home town, native place (not only 'fatherland')"}
          - {w: "juntamente", d: "at the same time, together"}
          - {w: "canas", d: "grey hairs; 'honrar las canas' = to honour the old age of one's parents"}
          - {w: "anciano", d: "aged, elderly"}
          - {w: "ya que", d: "since, seeing that"}
          - {w: "dignarse (de)", d: "to deign to, condescend to; modern Spanish usually drops the 'de'"}
        diagram:
          - s: "Quédese el nuevo Sansón en su patria"
            r: "main verb 1: let the new Samson stay in his home town"
          - s: "honre juntamente las canas de sus ancianos padres"
            r: "main verb 2 (after 'y'): and let him honour his aged parents' grey hairs too"
            under:
              - {s: "honrándola", r: "how: by honouring it (his home town)"}
          - s: "que yo con cualquier escudero estaré contento"
            r: "main verb 3 (after 'que', for): for I shall be content with any squire"
            under:
              - {s: "ya que Sancho no se digna de venir conmigo", r: "why: since Sancho does not deign to come with me"}
        forms:
          - {w: "Quédese", f: "qued- + -e + se → quedarse (to stay), present subjunctive, he, with 'se' stuck on the end: 'let him stay'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. A subjunctive opening the sentence gives a command or wish, and the pronoun then hangs on the end (modern 'que se quede')."}
          - {w: "honrándola", f: "gerund of honrar (to honour) + la (it, feminine for 'patria'), with an accent added to keep the stress: 'honouring it'."}
          - {w: "honre", f: "honr- + -e → honrar (to honour), present subjunctive, he: 'let him honour'. Same -e subjunctive."}
          - {w: "sus ancianos", f: "sus = plural to match 'padres', not the owner; anciano + -s, masculine plural."}
