      - es: "Y, finalmente, quiero decir, y os digo, que si no queréis venir a merced conmigo y correr la suerte que yo corriere, que Dios quede con vos y os haga un santo;"
        literal: "And, finally, I-want to-say, and to-you I-say, that if not you-want to-come at favour with-me and to-run the luck that I may-run, that God may-remain with you and you may-make a saint;"
