      - es: "Si con estas esperanzas y aditamentos vos, Sancho, gustáis de volver a servirme, sea en buena hora: que pensar que yo he de sacar de sus términos y quicios la antigua usanza de la caballería andante es pensar en lo escusado."
        literal: "If with these hopes and additions you, Sancho, like to return to serve-me, be-it in good hour: for to-think that I have to take-out of its bounds and hinges the ancient custom of the chivalry errant is to-think on the needless."
