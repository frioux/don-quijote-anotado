          - {w: "hermoso", d: "handsome, fine: an epithet of the romances, absurd for the gaunt old hidalgo"}
          - {w: "bravo", d: "brave, valiant (in Cervantes also 'fierce')"}
          - {w: "antes hoy que mañana", d: "today rather than tomorrow, at once"}
          - {w: "ponerse en camino", d: "to set out, start on the road"}
          - {w: "vuestra merced", d: "your grace, your worship: the polite 'you', which takes a 'he/she' verb (modern 'usted')"}
          - {w: "grandeza", d: "greatness, highness; also the rank of a grandee of Spain, so a mock title"}
        diagram:
          - s: "se ponga vuestra merced y su grandeza en camino"
            r: "main verb: may your worship and your greatness set out"
            under:
              - {s: "¡Ea, señor don Quijote mío, hermoso y bravo", r: "call and address: come, my lord Don Quijote, handsome and brave"}
              - {s: "antes hoy que mañana", r: "when: today rather than tomorrow"}
        forms:
          - {w: "mío", f: "'mine', placed after the noun in address: 'my lord Don Quijote'."}
          - {w: "se ponga", f: "pong- + -a → ponerse (to set oneself), present subjunctive, it (your worship), with 'se': a polite command, 'may you set out'. ponga, pongas, ponga, pongamos, pongáis, pongan. Singular though it has two subjects, since 'vuestra merced y su grandeza' are one person."}
