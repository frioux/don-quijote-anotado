          - {w: "hacienda", d: "property, means, wealth (not only 'estate' or 'treasury')"}
          - {w: "con mi persona y hacienda", d: "with my person and my property: a formula of feudal service"}
        diagram:
          - s: "aquí estoy yo"
            r: "main verb: here I am"
            under:
              - s: "y si alguna cosa faltare"
                r: "condition: and if anything should be lacking"
