          - {w: "va", f: "ir (to go), present, she (death). Irregular: voy, vas, va, vamos, vais, van."}
          - {w: "la harán detener", f: "har- + -án → hacer (to make), future, they (the prayers, forces, sceptres and mitres), + detener (to stop): 'will make her stop'; 'la' = her, death (feminine). Irregular stem har-: haré, harás, hará, haremos, haréis, harán."}
          - {w: "depriesa", f: "de + priesa, old form of prisa (haste): modern 'deprisa'."}
          - {w: "nos lo dicen", f: "dic- + -en → decir (to say), present, they (preachers): 'they tell it to us'. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "esos", f: "es- + -os → ese (that), masculine plural to match 'púlpitos'."}
        note: "Sancho borrows the commonplaces of sermons on death, the great leveller who spares neither king nor bishop, only to reach a very practical point: get his wages fixed while there is time."
