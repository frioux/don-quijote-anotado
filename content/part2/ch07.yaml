  - sentences:
      - es: "— Pues no tenga pena —respondió el bachiller—, sino váyase en hora buena a su casa, y téngame aderezado de almorzar alguna cosa caliente, y, de camino, vaya rezando la oración de Santa Apolonia si es que la sabe, que yo iré luego allá, y verá maravillas."
        literal: "— Well not may-you-have sorrow —answered the bachelor—, but go-yourself in hour good to your house, and have-for-me prepared of to-breakfast some thing hot, and, on the-way, go praying the prayer of Saint Apollonia if it-is that it you-know, for I will-go presently there, and you-will-see wonders."
        ormsby: "“Well then,” returned the bachelor, “don’t be uneasy, but go home in peace; get me ready something hot for breakfast, and while you are on the way say the prayer of Santa Apollonia, that is if you know it; for I will come presently and you will see miracles.”"
        vocab:
          - {w: "tener pena", d: "to be worried, distressed"}
          - {w: "en hora buena", d: "in a good hour: in peace, and good luck to you (modern 'enhorabuena' = congratulations)"}
          - {w: "aderezar", d: "to prepare, get ready (food)"}
          - {w: "almorzar", d: "to have the late-morning meal; 'de almorzar' = for breakfast, something to eat"}
          - {w: "de camino", d: "on the way, while you are at it"}
          - {w: "rezar", d: "to pray, say (a prayer)"}
          - {w: "Santa Apolonia", d: "Saint Apollonia, martyr of Alexandria whose teeth were broken out; invoked against toothache"}
          - {w: "si es que", d: "if indeed, that is if"}
          - {w: "luego", d: "soon, presently (in old Spanish often 'at once'), not 'later'"}
          - {w: "maravillas", d: "wonders, marvels"}
        diagram:
          - s: "Pues no tenga pena"
            r: "main verb 1: well, don't worry"
            under:
              - {s: "—respondió el bachiller—", r: "speech tag: the bachelor answered"}
          - s: "sino váyase en hora buena a su casa"
            r: "main verb 2: but go home in peace"
          - s: "y téngame aderezado"
            r: "main verb 3: and have ready for me"
            under:
              - {s: "de almorzar alguna cosa caliente", r: "what: something hot for breakfast"}
          - s: "vaya rezando la oración de Santa Apolonia"
            r: "main verb 4 (after 'y'): keep saying the prayer of Saint Apollonia"
            under:
              - {s: "de camino", r: "when: on the way"}
              - {s: "si es que la sabe", r: "condition: if you know it"}
          - s: "que yo iré luego allá"
            r: "why: for I will go there soon"
          - {s: "y verá maravillas", r: "result: and you will see wonders"}
        forms:
          - {w: "tenga", f: "teng- + -a → tener (to have), present subjunctive, you (polite 'usted' form, here the housekeeper): 'no tenga' = don't have, a polite command. tenga, tengas, tenga, tengamos, tengáis, tengan."}
          - {w: "váyase", f: "vay- + -a + se → irse (to go away), present subjunctive used as a polite command, you, with 'se' stuck on the end and an accent added. ir (to go) in the present subjunctive: vaya, vayas, vaya, vayamos, vayáis, vayan. In a positive command the pronoun must hang on the end."}
          - {w: "téngame aderezado", f: "teng- + -a + me → tener (to have), present subjunctive as a polite command, you, with 'me' (for me) on the end: tenga, tengas, tenga, tengamos, tengáis, tengan; + aderezado, participle of aderezar (to prepare): 'have ready for me'."}
          - {w: "alguna", f: "alguno (some) + feminine -a to match 'cosa'."}
          - {w: "vaya rezando", f: "vay- + -a → ir (to go), present subjunctive as a polite command, you: vaya, vayas, vaya, vayamos, vayáis, vayan; + rezando, gerund of rezar (to pray): ir (to go) + gerund = 'keep praying as you go'."}
          - {w: "la sabe", f: "sab- + -e → saber (to know), present, you (polite): sé, sabes, sabe, sabemos, sabéis, saben; 'la' = it (the prayer)."}
          - {w: "iré", f: "ir- + -é → ir (to go), future, I. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "verá", f: "ver- + -á → ver (to see), future, you (polite). Same future endings: -é, -ás, -á, -emos, -éis, -án."}
        note: "Sansón speaks to the housekeeper with the polite third person (usted forms: tenga, váyase, sabe). The prayer to Saint Apollonia was a popular charm against toothache, so his advice is a joke at the housekeeper's expense."
  - sentences:
      - es: "— ¡Cuitada de mí! —replicó el ama—; ¿la oración de Santa Apolonia dice vuestra merced que rece?: eso fuera si mi amo lo hubiera de las muelas, pero no lo ha sino de los cascos."
        literal: "— Wretched of me! —replied the housekeeper—; the prayer of Saint Apollonia says your grace that I-may-pray?: that would-be if my master it had of the molars, but not it he-has except of the skull."
        ormsby: "“Woe is me,” cried the housekeeper, “is it the prayer of Santa Apollonia you would have me say? That would do if it was the toothache my master had; but it is in the brains, what he has got.”"
        ormsby_note: "According to an old popular rhyme, Santa Apollonia complained of a toothache to the Blessed Virgin, who thereupon forbad any tooth, double or single, ever to trouble her again. The spell is alluded to in the Celestina act IV."
        vocab:
          - {w: "¡cuitada de mí!", d: "woe is me! poor me! ('cuitado' = wretched, unfortunate)"}
          - {w: "replicar", d: "to reply, retort"}
          - {w: "vuestra merced", d: "your grace, your worship: the polite 'you' (the source of 'usted'), with a third-person verb"}
          - {w: "muela", d: "molar, back tooth; 'tenerlo de las muelas' = to have trouble with one's teeth"}
          - {w: "haberlo de", d: "old 'to have it in' (an ailment): 'lo ha de los cascos' = his trouble is in the head"}
          - {w: "cascos", d: "skull, head; 'estar mal de los cascos' = to be cracked, touched in the head"}
        diagram:
          - {s: "¡Cuitada de mí!", r: "exclamation: woe is me!"}
          - {s: "—replicó el ama—", r: "speech tag: the housekeeper retorted"}
          - s: "dice vuestra merced"
            r: "main verb 1 (question): does your worship say"
            under:
              - {s: "¿la oración de Santa Apolonia", r: "object of 'rece', put first for emphasis: the prayer of Saint Apollonia"}
              - {s: "que rece?", r: "what you say: that I should pray"}
          - s: "eso fuera"
            r: "main verb 2: that would be [fine]"
            under:
              - {s: "si mi amo lo hubiera de las muelas", r: "condition: if my master's trouble were in his teeth"}
          - s: "pero no lo ha sino de los cascos"
            r: "main verb 3: but his trouble is only in his head"
        forms:
          - {w: "Cuitada", f: "cuitado (wretched) + feminine -a to match the speaker, the housekeeper."}
          - {w: "replicó", f: "replic- + -ó → replicar (to retort), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "dice", f: "dic- + -e → decir (to say), present, you (vuestra merced takes a third-person verb). Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "rece", f: "rec- + -e → rezar (to pray), present subjunctive, I, after 'dice que' (tells me to); z becomes c before e. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), it, used as a conditional: 'that would be [right]'. fuera, fueras, fuera, fuéramos, fuerais, fueran. Cervantes often uses the -ra form where modern Spanish puts the conditional 'sería'."}
          - {w: "hubiera", f: "hub- + -iera → haber (to have), imperfect subjunctive (-ra form), he, after 'si': 'if he had it'. hubiera, hubieras, hubiera, hubiéramos, hubierais, hubieran. Here haber (to have) is the full verb 'to have', as in old Spanish, not a helper."}
          - {w: "lo ha", f: "h- + -a → haber (to have), present, he: he, has, ha, hemos, habéis, han; again the full verb 'to have': 'he has it (the trouble)'. 'lo' = it, the ailment."}
        note: "The housekeeper takes the joke literally: a toothache charm is no use, because her master's trouble is in his head, not his teeth."
