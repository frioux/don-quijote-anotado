          - {w: "valer más", d: "to be worth more, be better"}
          - {w: "ruin", d: "mean, paltry, wretched"}
          - {w: "posesión", d: "holding, possession"}
          - {w: "queja", d: "grievance, complaint: a claim you can still press"}
          - {w: "paga", d: "payment, settlement"}
