  - sentences:
      - es: "Finalmente, don Quijote y Sancho se abrazaron y quedaron amigos, y con parecer y beneplácito del gran Carrasco, que por entonces era su oráculo, se ordenó que de allí a tres días fuese su partida;"
        literal: "Finally, Don Quijote and Sancho themselves embraced and remained friends, and with opinion and approval of-the great Carrasco, who for then was their oracle, itself was-ordered that from there to three days might-be their departure;"
        ormsby: "In fine, Don Quixote and Sancho embraced one another and made friends, and by the advice and with the approval of the great Carrasco, who was now their oracle, it was arranged that their departure should take place three days thence,"
        vocab:
          - {w: "parecer", d: "as a noun: opinion, advice"}
          - {w: "beneplácito", d: "approval, consent (a formal word)"}
          - {w: "por entonces", d: "at that time, for the time being"}
          - {w: "oráculo", d: "oracle, the one whose word is law"}
          - {w: "de allí a tres días", d: "three days from then, three days later"}
          - {w: "partida", d: "departure"}
        diagram:
          - s: "don Quijote y Sancho se abrazaron y quedaron amigos"
            r: "main verb 1: Don Quijote and Sancho embraced and made friends"
            under:
              - {s: "Finalmente", r: "linking: finally"}
          - s: "se ordenó"
            r: "main verb 2 (after 'y'): it was arranged"
