  - sentences:
      - es: "— Teresa dice —dijo Sancho— que ate bien mi dedo con vuestra merced, y que hablen cartas y callen barbas, porque quien destaja no baraja, pues más vale un toma que dos te daré."
        literal: "— Teresa says —said Sancho— that I-may-tie well my finger with your grace, and that may-speak papers and may-be-silent beards, because who stipulates not wrangles, since more is-worth one take than two I-will-give-you."
        ormsby: "“Teresa says,” replied Sancho, “that I should make sure with your worship, and ‘let papers speak and beards be still,’ for ‘he who binds does not wrangle,’ since one ‘take’ is better than two ‘I’ll give thee’s;’"
        ormsby_note: "(On 'hablen cartas y callen barbas':) Proverb 40, if you have a thing in writing, words are unnecessary. (On 'quien destaja no baraja':) Proverb 74, Quien destaja no baraja; always mistranslated \"He who cuts does not shuffle,\" which would be meaningless here. It has nothing to do with cards. Destajar means to lay down conditions, to stipulate; Barajar certainly means to shuffle, to jumble things together, but in old Spanish it meant also to wrangle or dispute. (On 'más vale un toma que dos te daré':) Proverb 227."
        vocab:
          - {w: "atar bien el dedo", d: "to tie one's finger well: to make sure of a bargain, secure oneself"}
          - {w: "hablen cartas y callen barbas", d: "proverb: 'let papers speak and beards be silent', get it in writing rather than trust a man's word ('barbas' = beards, i.e. grave men talking)"}
          - {w: "destajar", d: "to stipulate, lay down terms beforehand (a 'destajo' is a job agreed at a fixed price)"}
          - {w: "barajar", d: "to shuffle cards; in old Spanish also to quarrel, wrangle"}
          - {w: "quien destaja no baraja", d: "proverb: he who fixes the terms first has no quarrel later"}
          - {w: "más vale un toma que dos te daré", d: "proverb: one 'here, take it' is worth more than two 'I'll give it to you', a bird in the hand"}
        diagram:
          - s: "Teresa dice"
            r: "main verb: Teresa says"
            under:
              - {s: "dijo Sancho", r: "speech tag: said Sancho"}
              - s: "que ate bien mi dedo con vuestra merced"
                r: "what she says, 1: that I make sure with your worship"
              - s: "y que hablen cartas y callen barbas"
                r: "what she says, 2: that papers should speak and beards keep quiet"
              - s: "porque quien destaja no baraja"
                r: "why: because he who sets terms doesn't wrangle"
                under:
                  - {s: "pues más vale un toma que dos te daré", r: "why, 2: since one 'take' is worth two 'I'll give you'"}
        forms:
          - {w: "dice", f: "dic- + -e → decir (to say), present, she. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "ate", f: "at- + -e → atar (to tie), present subjunctive, I: after 'dice que' when it reports advice or an order ('says that I should tie'). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "hablen, callen", f: "habl- + -en → hablar (to speak), call- + -en → callar (to be silent), present subjunctive, they: 'let papers speak, let beards be silent'. Same -e subjunctive: hable, hables, hable, hablemos, habléis, hablen."}
          - {w: "destaja, baraja", f: "destaj- + -a → destajar (to stipulate), baraj- + -a → barajar (to wrangle), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "vale", f: "val- + -e → valer (to be worth), present, it: 'más vale' = it is better. valgo, vales, vale, valemos, valéis, valen."}
          - {w: "toma", f: "tom- + -a → tomar (to take), imperative, you (tú): 'take!', here used as a noun, 'un toma'."}
          - {w: "te daré", f: "dar- + -é → dar (to give), future, I, with te (to you): 'I will give you', also used as a noun. The future adds endings to the whole infinitive: daré, darás, dará, daremos, daréis, darán."}
        note: "Sancho strings proverbs together, as he does throughout Part II; all three here say the same thing: get a fixed wage agreed in advance."
      - es: "Y yo digo que el consejo de la mujer es poco, y el que no le toma es loco."
