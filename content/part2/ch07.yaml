            r: "main verb (after 'que', for): he had never believed"
            under:
              - {s: "puesto que había leído la primera historia de su señor", r: "concession: although he had read the first history of his master"}
              - s: "que era tan gracioso"
                r: "what he never believed: that Sancho was so funny"
                under:
                  - {s: "como allí le pintan", r: "compared with: as they portray him there"}
        forms:
          - {w: "había leído", f: "hab- + -ía → haber (to have), imperfect, he (había, habías, había, habíamos, habíais, habían) + leído, participle of leer (to read): the pluperfect, 'he had read'."}
          - {w: "creyó", f: "crey- + -ó → creer (to believe), preterite, he; the i between vowels is written y. creí, creíste, creyó, creímos, creísteis, creyeron."}
          - {w: "era", f: "ser (to be), imperfect, he (Sancho). Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "le pintan", f: "pint- + -an → pintar (to paint, portray), present, they (people in general, the book). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. 'le' for 'him', a male person as object, as Castilian regularly allows (leísmo); modern standard 'lo pintan'."}
        note: "Part II plays with the fact that Part I has been printed and read: Sansón brought the news in chapter 3. Now he finds the real Sancho as funny as the one in the book."
      - es: "pero, oyéndole decir ahora testamento y codicilo que no se pueda revolcar, en lugar de testamento y codicilo que no se pueda revocar, creyó todo lo que dél había leído, y confirmólo por uno de los más solenes mentecatos de nuestros siglos;"
        literal: "but, hearing-him say now will and codicil that not itself may-be-able to-wallow, in place of will and codicil that not itself may-be-able to-revoke, he-believed all that which of-him he-had read, and confirmed-him as one of the most solemn fools of our centuries;"
        ormsby: "but now, hearing him talk of a “will and codicil that could not be provoked,” instead of “will and codicil that could not be revoked,” he believed all he had read of him, and set him down as one of the greatest simpletons of modern times;"
        vocab:
          - {w: "revolcar", d: "to knock down and roll about (in the mud); Sancho's slip for 'revocar'"}
          - {w: "revocar", d: "to revoke, annul (a will)"}
          - {w: "en lugar de", d: "instead of"}
          - {w: "dél", d: "= de él, of him (old contraction)"}
          - {w: "confirmar por", d: "to confirm as, set down as"}
          - {w: "solenes", d: "= solemnes (old spelling); 'solemne' here means 'utter, arrant, out-and-out'"}
          - {w: "mentecato", d: "fool, simpleton, half-wit"}
          - {w: "nuestros siglos", d: "our age, modern times"}
        diagram:
          - s: "creyó todo lo"
            r: "main verb 1: he believed everything"
            under:
              - s: "oyéndole decir ahora testamento y codicilo que no se pueda revolcar"
                r: "when/why: hearing him say 'a will that can't be wallowed'"
                under:
                  - {s: "en lugar de testamento y codicilo que no se pueda revocar", r: "instead of: instead of 'a will that can't be revoked'"}
              - {s: "que dél había leído", r: "describes 'lo': that he had read about him"}
          - s: "y confirmólo"
            r: "main verb 2: and confirmed him"
            under:
              - {s: "por uno de los más solenes mentecatos de nuestros siglos", r: "as what: as one of the most arrant fools of our times"}
        forms:
          - {w: "oyéndole", f: "oyendo, gerund of oír (to hear), + le (him): the pronoun hung on the gerund, with an accent added to keep the stress: 'hearing him'. 'le' for a male person, the Castilian leísmo."}
          - {w: "decir", f: "infinitive of decir (to say) after oír (to hear): 'hearing him say'."}
          - {w: "se pueda", f: "pued- + -a → poder (to be able), present subjunctive, it, with 'se' making it passive. The stem o becomes ue when stressed: pueda, puedas, pueda, podamos, podáis, puedan. Subjunctive because it describes the kind of will required."}
          - {w: "creyó", f: "crey- + -ó → creer (to believe), preterite, he; the i between vowels is written y. creí, creíste, creyó, creímos, creísteis, creyeron."}
          - {w: "dél", f: "de + él, 'of him': Cervantes fuses 'de' with the pronouns (della, dellos, deste)."}
          - {w: "había leído", f: "hab- + -ía → haber (to have), imperfect, he (había, habías, había, habíamos, habíais, habían) + leído, participle of leer (to read): 'he had read'."}
          - {w: "confirmólo", f: "confirm- + -ó + lo → confirmar (to confirm), preterite, he, with 'lo' (him) stuck on the end; modern 'lo confirmó'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. Cervantes often hangs the pronoun on a conjugated verb that opens a clause (here after 'y')."}
          - {w: "solenes", f: "= solemnes, plural of solemne (solemn, utter), to match 'mentecatos'; the old spelling drops the m."}
