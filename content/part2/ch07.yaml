          - {w: "escura, clara, limpia", f: "feminine to match 'celada': escura = oscura (dark), the old spelling without the o-, like 'escuridad'."}
  - sentences:
      - es: "Las maldiciones que las dos, ama y sobrina, echaron al bachiller no tuvieron cuento: mesaron sus cabellos, arañaron sus rostros, y, al modo de las endechaderas que se usaban, lamentaban la partida como si fuera la muerte de su señor."
        literal: "The curses that the two, housekeeper and niece, threw at-the bachelor not had count: they-tore their hair, they-scratched their faces, and, in-the manner of the hired-mourners that themselves used, they-lamented the departure as if it-were the death of their master."
        ormsby: "The curses which both housekeeper and niece poured out on the bachelor were past counting; they tore their hair, they clawed their faces, and in the style of the hired mourners that were once in fashion, they raised a lamentation over the departure of their master and uncle, as if it had been his death."
        vocab:
          - {w: "maldición", d: "curse"}
          - {w: "echar maldiciones", d: "to hurl curses"}
          - {w: "no tener cuento", d: "to be past counting, numberless ('cuento' = count, number, as well as 'story')"}
          - {w: "mesar", d: "to tear (one's hair), pull out in grief or rage"}
          - {w: "arañar", d: "to scratch, claw"}
          - {w: "rostro", d: "face"}
          - {w: "endechadera", d: "hired mourner, a woman paid to sing 'endechas' (dirges) and wail at funerals"}
          - {w: "usarse", d: "to be in use, be the custom"}
        diagram:
          - s: "Las maldiciones ... no tuvieron cuento"
            r: "main verb 1: the curses were past counting"
            under:
              - {s: "que las dos, ama y sobrina, echaron al bachiller", r: "describes 'maldiciones': that the two women hurled at the bachelor"}
          - {s: "mesaron sus cabellos", r: "main verb 2: they tore their hair"}
          - {s: "arañaron sus rostros", r: "main verb 3: they clawed their faces"}
          - s: "lamentaban la partida"
            r: "main verb 4 (after 'y'): they lamented the departure"
            under:
              - s: "al modo de las endechaderas"
                r: "how: in the manner of the hired mourners"
                under:
                  - {s: "que se usaban", r: "describes 'endechaderas': who were customary"}
              - {s: "como si fuera la muerte de su señor", r: "how, 2: as if it were their master's death"}
        forms:
          - {w: "echaron", f: "ech- + -aron → echar (to throw), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. Same for mesaron (mesar, to tear) and arañaron (arañar, to scratch)."}
          - {w: "al", f: "a + el, 'at the', 'in the'."}
          - {w: "tuvieron", f: "tuv- + -ieron → tener (to have), preterite, they (the curses). Irregular: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron."}
          - {w: "sus cabellos, sus rostros", f: "sus = plural to match 'cabellos' and 'rostros', not the owners: 'their hair, their faces'."}
          - {w: "se usaban", f: "us- + -aban → usar (to use), imperfect, they, with 'se' making it passive: 'who were in use, customary'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "lamentaban", f: "lament- + -aban → lamentar (to lament), imperfect, they: the imperfect for an action that went on. Same -aba imperfect."}
          - {w: "como si fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), it: 'como si' (as if) always takes the imperfect subjunctive. fuera, fueras, fuera, fuéramos, fuerais, fueran."}
        note: "Tearing the hair and scratching the face were the traditional gestures of mourning, performed at funerals by hired 'endechaderas'; Cervantes speaks of the custom as already old-fashioned. The two women mourn the departure as if Don Quijote were already dead."
