        literal: "— Sancho friend —answered Don Quijote—, at the times, as good is-wont to-be a she-cat as a rat."
        ormsby: "“Sancho, my friend,” replied Don Quixote, “sometimes proportion may be as good as promotion.”"
        ormsby_note: "The play upon the words here cannot be translated. Sancho, blundering as usual, changes the common phrase rata por cantidad, \"ratably,\" or \"in proportion,\" into gata (cat) por cantidad, and Don Quixote corrects him by saying, \"a rat (rata) may be sometimes as good as a cat.\""
