      - es: "Sólo sé que todos servían a merced, y que, cuando menos se lo pensaban, si a sus señores les había corrido bien la suerte, se hallaban premiados con una ínsula, o con otra cosa equivalente, y, por lo menos, quedaban con título y señoría."
        literal: "Only I-know that all served at favour, and that, when least themselves it they-thought, if to their lords to-them had run well the luck, themselves they-found rewarded with an isle, or with other thing equivalent, and, at the least, they-remained with title and lordship."
