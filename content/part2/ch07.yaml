        forms:
          - {w: "los cuales", f: "'which', masculine plural to match 'tres días'; a heavier relative than 'que', used after a comma."}
          - {w: "habría", f: "habr- + -ía → haber (to have), conditional, it, impersonal: 'there would be'. habría, habrías, habría, habríamos, habríais, habrían."}
          - {w: "aderezar, buscar", f: "infinitives of aderezar (to prepare) and buscar (to look for) after 'lugar de' (time to)."}
