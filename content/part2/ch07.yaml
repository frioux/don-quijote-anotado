  - sentences:
      - es: "— Una o dos veces —respondió Sancho—, si mal no me acuerdo, he suplicado a vuestra merced que no me emiende los vocablos, si es que entiende lo que quiero decir en ellos, y que, cuando no los entienda, diga: «Sancho, o diablo, no te entiendo»;"
        literal: "— One or two times —answered Sancho—, if badly not myself I-remember, I-have begged to your grace that not to-me you-may-amend the words, if it-is that you-understand that-which I-want to-say in them, and that, when not them you-may-understand, you-say: «Sancho, or devil, not you I-understand»;"
        ormsby: "“Once or twice, as well as I remember,” replied Sancho, “I have begged of your worship not to mend my words, if so be as you understand what I mean by them; and if you don’t understand them to say ‘Sancho,’ or ‘devil,’ ‘I don’t understand thee;’"
        vocab:
          - {w: "si mal no me acuerdo", d: "if I remember rightly (literally 'if I do not remember badly')"}
          - {w: "suplicar", d: "to beg, entreat"}
          - {w: "vuestra merced", d: "your grace, your worship: the polite 'you', taking a he/she verb (modern 'usted' comes from it)"}
          - {w: "emendar", d: "= enmendar, to correct, amend (old spelling)"}
          - {w: "vocablo", d: "word, term"}
          - {w: "querer decir", d: "to mean (literally 'to want to say')"}
          - {w: "Sancho, o diablo", d: "'Sancho, or devil': a half-joking form of address, roughly 'Sancho, you devil'"}
        diagram:
          - s: "he suplicado"
            r: "main verb: I have begged"
            under:
              - {s: "Una o dos veces", r: "how often: once or twice"}
              - {s: "si mal no me acuerdo", r: "aside: if I remember rightly"}
              - {s: "a vuestra merced", r: "whom: your worship"}
              - s: "que no me emiende los vocablos"
                r: "what I begged, 1: that you not correct my words"
                under:
                  - s: "si es que entiende lo"
                    r: "condition: if you understand what"
                    under:
                      - {s: "que quiero decir en ellos", r: "describes 'lo': what I mean by them"}
              - s: "y que"
                r: "what I begged, 2: and that"
                under:
                  - {s: "cuando no los entienda", r: "when: whenever you do not understand them"}
                  - s: "diga:"
                    r: "verb: you should say"
                    under:
                      - {s: "«Sancho, o diablo, no te entiendo»", r: "what you should say: 'Sancho, you devil, I don't understand you'"}
          - {s: "respondió Sancho", r: "speech tag: answered Sancho"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "me acuerdo", f: "acuerd- + -o → acordarse (to remember), present, I, with 'me' (myself). The stem o becomes ue when stressed: me acuerdo, te acuerdas, se acuerda, nos acordamos, os acordáis, se acuerdan."}
          - {w: "he suplicado", f: "he (haber (to have), present, I: he, has, ha, hemos, habéis, han) + suplicado, the participle of suplicar (to beg): the perfect, 'I have begged'."}
          - {w: "emiende", f: "emiend- + -e → emendar (to correct), old form of enmendar, present subjunctive, you (vuestra merced takes the he/she form); the stem e becomes ie when stressed. Subjunctive after 'suplicar que' (beg that). emiende, emiendes, emiende, emendemos, emendéis, emienden."}
          - {w: "entiende", f: "entiend- + -e → entender (to understand), present, you (vuestra merced). The stem e becomes ie when stressed: entiendo, entiendes, entiende, entendemos, entendéis, entienden."}
          - {w: "quiero", f: "quier- + -o → querer (to want), present, I: 'quiero decir' = I mean. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "ellos, los", f: "ellos (them, after 'en') and los (them, object before the verb) are masculine plural to match 'los vocablos'."}
          - {w: "entienda", f: "entiend- + -a → entender (to understand), present subjunctive, you (vuestra merced): subjunctive after 'cuando' for any future occasion. entienda, entiendas, entienda, entendamos, entendáis, entiendan."}
          - {w: "diga", f: "dig- + -a → decir (to say), present subjunctive, you (vuestra merced), still after 'he suplicado que'. diga, digas, diga, digamos, digáis, digan."}
          - {w: "te entiendo", f: "entiend- + -o → entender (to understand), present, I; te = you (familiar), the form a master uses to his servant. entiendo, entiendes, entiende, entendemos, entendéis, entienden."}
