          - {w: "faltare", f: "falt- + -are → faltar (to be lacking), future subjunctive, it: 'if anything should be lacking'. The future subjunctive of -ar verbs: -are, -ares, -are, -áremos, -areis, -aren. Cervantes uses it after 'si' for an open future; modern Spanish uses the present indicative 'si falta'."}
          - {w: "ponerle", f: "poner (to put) + le (it, the plan), the pronoun hung on the infinitive after 'para'."}
          - {w: "estoy", f: "est- + -oy → estar (to be), present, I. estoy, estás, está, estamos, estáis, están."}
          - {w: "suplirla", f: "suplir (to supply) + la (it, feminine for 'cosa'), the pronoun hung on the infinitive after 'para'."}
      - es: "y si fuere necesidad servir a tu magnificencia de escudero, lo tendré a felicísima ventura!"
        literal: "and if it-shall-be necessity to-serve to your magnificence as squire, it I-will-hold as most-happy fortune!"
        ormsby: "and were it requisite to attend your magnificence as squire, I should esteem it the happiest good fortune.”"
