          - {w: "soler", d: "to be in the habit of; 'suele ser' = usually is, often is"}
          - {w: "gata", d: "she-cat"}
          - {w: "rata", d: "rat; also 'proportion', in the phrase 'rata por cantidad' (pro rata) that Sancho garbled"}
