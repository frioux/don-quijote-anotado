summary: |
  As soon as the housekeeper sees Sancho shut himself in with Don Quijote, she guesses that a third sally is being planned. She runs to the bachelor Sansón Carrasco, throws herself at his feet and tells him that her master is 'breaking out' again, through the door of his madness: the first time he came home across a donkey, beaten black and blue, the second in an ox-cart, shut in a cage, and it cost her six hundred eggs to bring him round. Carrasco tells her not to worry, to go home, have something hot ready for his lunch and say the prayer of Saint Apollonia; she protests that the prayer is for toothache, and her master's trouble is in the head. He insists that he knows what he is saying, and goes off to find the priest.

  Meanwhile Sancho tells his master that he has 'relucida' (for 'reducida') his wife to let him go. After a tangle over his word 'fócil', which Don Quijote finally works out as 'dócil', Sancho reports Teresa's advice in a string of proverbs, reminds his master that we are all mortal, and comes to the point: he wants a fixed monthly wage paid out of Don Quijote's estate, not rewards that come late or never, and if the island ever arrives its rents can be deducted from his pay 'gata por cantidad'.

  Don Quijote answers that he has never read of any knight errant who paid his squire wages: squires served for reward and, if their masters' luck held, ended with an island or at least a title. He will not break the ancient usage of chivalry. If Sancho will not come on those terms, God be with him; there will be no lack of more obedient and less talkative squires.

  Sancho's heart sinks, and just then Carrasco comes in with the niece and the housekeeper. To their dismay he hails Don Quijote as the flower of chivalry, urges him to set out at once, and offers to serve as his squire himself. Don Quijote declines to deprive Salamanca of such a pillar of learning, and Sancho, in tears, says he will go after all: he only bargained to please his wife, and his master should make his will with a codicil that cannot be 'revolcado'. Carrasco marvels that Sancho is just as foolish as the book painted him. Master and squire make friends, the departure is fixed for three days later, and Carrasco promises a borrowed closed helmet, rusty but whole. The niece and housekeeper curse him and mourn as if for a death, though Carrasco is acting on a plan agreed with the priest and the barber. At nightfall Don Quijote on Rocinante and Sancho on his grey set out for El Toboso; Carrasco goes with them half a league, embraces Don Quijote, asks to be told of his fortunes, and turns back.
context: |
  Wages and 'mercedes'. Sancho's demand for a 'salario conocido' is the demand of a servant in a real household. Servants and farm hands were hired by the year or the month for a fixed sum plus keep, whereas the old relation between a lord and his retainers worked by 'merced', favours granted at the master's pleasure, which might be generous or might never come. Sancho has learned in Part I that promises of islands are slow to turn into rent, and he wants cash he can count. Don Quijote's answer is that of the romances: the squires of Amadís and the other knights served for love and hope, and, as he tells it, the lucky ones were rewarded with an island or a title. The chapter's comedy lies in the clash between a peasant's arithmetic ('many littles make a much') and a code that knows only reward. Sancho's proverbs are numbered in Ormsby's notes, and he explains the hardest of them: 'quien destaja no baraja' means that whoever settles terms in advance avoids quarrels later, not 'he who cuts does not shuffle'.

  The romances and their squires. Carrasco's greeting, 'flower of knight-errantry, shining light of arms, honour and mirror of the Spanish nation', imitates the inflated praise heaped on knights in the books of chivalry, and his list of the knight's duties (righting wrongs, protecting orphans, the honour of damsels, the support of widows) is the program Don Quijote set himself in Part I. Don Quijote's praise of Carrasco in return, 'pillar of letters', 'vessel of the sciences', 'towering palm of the liberal arts', is the same rhetoric turned on a university man. The 'celada de encaje' is a closed helmet that fits onto the armour; in Part I Don Quijote made do with a pasteboard visor and then with a barber's basin he took for Mambrino's helmet.

  The narrator's games. Carrasco has read the first part of the history, published in 1605, and he now finds Sancho just as droll as 'he is painted there': a character checks the book about himself against the man in front of him. The narrator says the history records the private talk of master and squire 'with great precision and true account', and holds back Carrasco's real purpose for later, noting only that he acts on the advice of the priest and the barber. Carrasco's mock-solemn blessing 'donde más largamente se contiene' borrows a formula of legal and notarial documents ('as is set out more fully elsewhere'), and Sancho's will and codicil 'que no se pueda revolcar' (for 'revocar', revoke) parodies the same legal world.

  Religion, medicine and custom. Saint Apollonia, a martyr of Alexandria whose teeth were broken before her death, was invoked against toothache; as Ormsby notes, a popular rhyme told how the Virgin promised her that no tooth would ever hurt her again, and the spell appears in the Celestina. The housekeeper's six hundred eggs belong to the household medicine of the time, which fed the weak and convalescent on eggs and broths. The 'endechaderas' whom the niece and housekeeper imitate were women paid to wail at funerals, a custom Ormsby describes as 'once in fashion', so by Cervantes' day an old-fashioned one. Sancho's 'death is deaf' passage strings together sermon commonplaces on mortality: death spares neither sceptres nor mitres, kings nor bishops.

  Names and their jokes. Sansón Carrasco carries the name of the biblical strongman Samson, so Don Quijote can call him 'el nuevo Sansón'; he is a 'bachiller', the lowest university degree, from Salamanca, the most famous university in Spain, and his boast 'no hay más que bachillear' plays on 'bachillear' (to chatter, show off learning). He is called a 'socarrón famoso', a sly joker. The Panzas are Sancho's lineage, a family of peasants of whom he is as proud as any hidalgo of his line. Rocinante is Don Quijote's horse and the 'rucio' Sancho's grey donkey; El Toboso is the village of Dulcinea, Don Quijote's lady.

  Reading Cervantes' Spanish. Sancho's malapropisms carry much of the chapter: relucida for reducida, fócil for dócil, emprincipio for principio, docientas for doscientas, 'gata por cantidad' for 'rata por cantidad' (pro rata), revolcar for revocar, lita for dicta, and 'Sí digno' for 'sí me digno'. Old spellings include celebro (cerebro), agora (ahora), emendar (enmendar), ceptros (cetros), depriesa (deprisa), escusado (excusado), inumerables (innumerables), coluna (columna), efeto (efecto), solenes (solemnes), escura (oscura), deciendo (desciendo), designo (designio), deste and dél (de este, de él). Pronouns hang on the verb that opens a clause (Hallóle, Hásele, Ofreciósela, Abrazóle, Prometióselo). The future subjunctive marks open conditions (quisiere, dijere, enseñare, sirviere, gustare, gustáredes, corriere, faltare, fuere, pusieren), the -ra form stands for a conditional (conociera, dejaran, fuera), and 'haber de' expresses obligation or the future (había de salir, has de decir, he de sacar). Don Quijote moves from 'tú' to the cooler 'vos' when he lays down the law to Sancho (gustáis, volveos, declarad, advertid), and uses the clipped vos imperative 'pasá' for 'pasad'. Watch the false friends: razones (words, arguments), relación (account), salario (wages, the point of the quarrel), ejecutar (to carry out), and término (manner of speaking).
