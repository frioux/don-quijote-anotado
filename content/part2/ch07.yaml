part: 2
chapter: 7
title_es: "Capítulo VII. De lo que pasó don Quijote con su escudero, con otros sucesos famosísimos"
title_en: "Of what passed between Don Quixote and his squire, together with other very notable incidents"
paragraphs:
  - sentences:
      - es: "Apenas vio el ama que Sancho Panza se encerraba con su señor, cuando dio en la cuenta de sus tratos;"
        literal: "Hardly saw the housekeeper that Sancho Panza himself shut-in with his master, when she-fell into the account of their dealings;"
        ormsby: "The instant the housekeeper saw Sancho Panza shut himself in with her master, she guessed what they were about;"
        vocab:
          - {w: "apenas ... cuando", d: "no sooner ... than; 'apenas vio ... cuando dio' = the moment she saw, she guessed"}
          - {w: "ama", d: "housekeeper (of a bachelor's or priest's house); 'el ama' takes 'el' because the noun begins with stressed a-"}
          - {w: "encerrarse", d: "to shut oneself in, lock oneself up"}
          - {w: "dar en la cuenta de", d: "to realize, catch on to, see what is going on"}
          - {w: "tratos", d: "dealings, plans, schemes (from 'tratar', to deal)"}
        diagram:
          - s: "cuando dio en la cuenta de sus tratos"
            r: "main verb: then she realized what they were plotting"
            under:
              - s: "Apenas vio el ama"
                r: "when: the moment the housekeeper saw"
                under:
                  - {s: "que Sancho Panza se encerraba con su señor", r: "what she saw: that Sancho was shutting himself in with her master"}
        forms:
          - {w: "vio", f: "vi- + -o → ver (to see), preterite, she. Irregular, with no accents: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "se encerraba", f: "encerr- + -aba → encerrarse (to shut oneself in), imperfect, he, with 'se' (himself). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "dio", f: "di- + -o → dar (to give), preterite, she; in 'dar en la cuenta' (to realize). dar (to give) in the preterite: di, diste, dio, dimos, disteis, dieron."}
          - {w: "sus", f: "sus = plural to match 'tratos', not the owners; here 'their' (Sancho's and the master's)."}
        note: "At the end of the previous chapter Sancho knocked at the door and Don Quijote shut himself in with him; the housekeeper, who has been trying to keep her master at home, guesses at once that a third sally is being planned."
      - es: "y, imaginando que de aquella consulta había de salir la resolución de su tercera salida y tomando su manto, toda llena de congoja y pesadumbre, se fue a buscar al bachiller Sansón Carrasco, pareciéndole que, por ser bien hablado y amigo fresco de su señor, le podría persuadir a que dejase tan desvariado propósito."
        literal: "and, imagining that from that consultation was-to come-out the resolution of his third sally and taking her mantle, all full of anguish and grief, she went-off to look-for [to] the bachelor Sansón Carrasco, seeming-to-her that, through being well spoken and friend fresh of her master, him he-could persuade to that he-might-leave so raving purpose."
        ormsby: "and suspecting that the result of the consultation would be a resolve to undertake a third sally, she seized her mantle, and in deep anxiety and distress, ran to find the bachelor Samson Carrasco, as she thought that, being a well-spoken man, and a new friend of her master’s, he might be able to persuade him to give up any such crazy notion."
        vocab:
          - {w: "consulta", d: "consultation, private conference"}
          - {w: "haber de", d: "to be going to, be bound to; 'había de salir' = was going to come out of it"}
          - {w: "resolución", d: "decision, resolve"}
          - {w: "salida", d: "sally, going out: the word used for each of Don Quijote's expeditions"}
          - {w: "manto", d: "mantle, the long cloak-veil a woman put on to go out in the street"}
          - {w: "congoja", d: "anguish, distress"}
          - {w: "pesadumbre", d: "grief, sorrow, heaviness of heart"}
          - {w: "irse a", d: "to go off to; 'se fue a buscar' = she went off to find"}
          - {w: "bachiller", d: "bachelor, holder of the first university degree"}
          - {w: "parecerle a uno", d: "to seem to someone; 'pareciéndole que' = as it seemed to her that, thinking that"}
          - {w: "bien hablado", d: "well-spoken, persuasive"}
          - {w: "amigo fresco", d: "new friend, recent acquaintance (Sansón met Don Quijote only in chapter 3)"}
          - {w: "persuadir a que", d: "to persuade (someone) to; with the subjunctive"}
          - {w: "desvariado", d: "raving, crazy, mad (from 'desvariar', to rave)"}
          - {w: "propósito", d: "purpose, plan, intention"}
        diagram:
          - s: "se fue a buscar al bachiller Sansón Carrasco"
            r: "main verb (after 'y'): she went off to find the bachelor Sansón Carrasco"
            under:
              - s: "imaginando"
                r: "why: imagining"
                under:
                  - {s: "que de aquella consulta había de salir la resolución de su tercera salida", r: "what she imagined: that this conference would end in the decision on his third sally"}
              - {s: "y tomando su manto", r: "how: and taking her mantle"}
              - {s: "toda llena de congoja y pesadumbre", r: "how: all full of anguish and grief"}
              - s: "pareciéndole"
                r: "why, 2: as it seemed to her"
                under:
                  - s: "que, por ser bien hablado y amigo fresco de su señor, le podría persuadir"
                    r: "what seemed: that, being well-spoken and a new friend of her master, he could persuade him"
                    under:
                      - {s: "a que dejase tan desvariado propósito", r: "to what: to give up so crazy a plan"}
        forms:
          - {w: "imaginando", f: "imagin- + -ando → imaginar (to imagine), gerund: 'imagining'. -ar verbs make the gerund in -ando."}
          - {w: "aquella", f: "aquel (that) + -a, feminine to match 'consulta'; 'that' for something away from the speaker."}
          - {w: "había de salir", f: "hab- + -ía → haber (to have), imperfect, it: había, habías, había, habíamos, habíais, habían; + de + salir (to come out): 'haber de' + infinitive = 'was going to, was bound to come out'."}
          - {w: "tercera", f: "tercero (third), feminine to match 'salida'."}
          - {w: "tomando", f: "tom- + -ando → tomar (to take), gerund: 'taking'."}
          - {w: "toda llena", f: "todo (all) and lleno (full), both feminine to match the housekeeper."}
          - {w: "se fue", f: "fu- + -e → irse (to go off), preterite, she, with 'se' (herself), which adds 'away, off'. ir (to go) in the preterite: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "al bachiller", f: "a + el = al; the 'a' marks a person as the object of 'buscar' (to look for)."}
          - {w: "pareciéndole", f: "parec- + -iendo + le → parecer (to seem), gerund, with 'le' (to her) stuck on the end, accent added to keep the stress: 'it seeming to her'. Pronouns are always hung on the end of a gerund."}
          - {w: "por ser", f: "por + ser (to be), infinitive: 'because of being, since he was'."}
          - {w: "hablado", f: "habl- + -ado → hablar (to speak), participle used as an adjective: 'bien hablado', well-spoken."}
          - {w: "le podría persuadir", f: "podr- + -ía → poder (to be able), conditional, he: podría, podrías, podría, podríamos, podríais, podrían; + persuadir (to persuade). 'le' (him, Don Quijote) goes before the group; 'le' for a male person as object (leísmo), which Castilian regularly allows."}
          - {w: "dejase", f: "dej- + -ase → dejar (to leave, give up), imperfect subjunctive (-se form), he; subjunctive after 'persuadir a que'. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "desvariado", f: "desvari- + -ado → desvariar (to rave), participle used as an adjective, masculine to match 'propósito'."}
        note: "Sansón Carrasco is the young Salamanca graduate who in chapter 3 told Don Quijote and Sancho that the first part of their history was in print; in chapter 4 he encouraged the new sally, which the housekeeper does not know."
  - sentences:
      - es: "Hallóle paseándose por el patio de su casa, y, viéndole, se dejó caer ante sus pies, trasudando y congojosa."
        literal: "She-found-him walking-himself through the courtyard of his house, and, seeing-him, herself she-let fall before his feet, sweating and anguished."
        ormsby: "She found him pacing the patio of his house, and, perspiring and flurried, she fell at his feet the moment she saw him."
        vocab:
          - {w: "pasearse", d: "to walk up and down, stroll"}
          - {w: "patio", d: "inner courtyard of a Spanish house"}
          - {w: "dejarse caer", d: "to let oneself fall, throw oneself down"}
          - {w: "ante", d: "before, in front of"}
          - {w: "trasudar", d: "to sweat lightly, break into a sweat (from anxiety or hurry)"}
          - {w: "congojoso", d: "anguished, distressed (from 'congoja', anguish)"}
        diagram:
          - s: "Hallóle"
            r: "main verb 1: she found him"
            under:
              - {s: "paseándose por el patio de su casa", r: "how: walking up and down the courtyard of his house"}
          - s: "se dejó caer"
            r: "main verb 2 (after 'y'): she threw herself down"
            under:
              - {s: "viéndole", r: "when: on seeing him"}
              - {s: "ante sus pies", r: "where: at his feet"}
              - {s: "trasudando y congojosa", r: "how: sweating and distressed"}
        forms:
          - {w: "Hallóle", f: "hall- + -ó + le → hallar (to find), preterite, she, with 'le' (him) stuck on the end; modern 'le halló' or 'lo halló'. Cervantes hangs the pronoun on a verb that opens the sentence. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. 'le' for a male person as object (leísmo), which Castilian regularly allows."}
          - {w: "paseándose", f: "pase- + -ando + se → pasearse (to walk up and down), gerund with 'se' (himself) on the end, accent added to keep the stress."}
          - {w: "viéndole", f: "vi- + -endo + le → ver (to see), gerund with 'le' (him) on the end, accent added: 'seeing him'."}
          - {w: "se dejó caer", f: "dej- + -ó → dejar (to let), preterite, she, with 'se' (herself) + caer (to fall): 'she let herself fall'. Same -ar preterite: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "trasudando", f: "trasud- + -ando → trasudar (to sweat), gerund: 'sweating'."}
          - {w: "congojosa", f: "congoj- + -osa → congojoso (anguished), feminine to match the housekeeper; the suffix -oso makes an adjective 'full of' a noun (congoja, anguish)."}
      - es: "Cuando la vio Carrasco con muestras tan doloridas y sobresaltadas, le dijo:"
        literal: "When her saw Carrasco with signs so pained and startled, to-her he-said:"
        ormsby: "Carrasco, seeing how distressed and overcome she was, said to her,"
        vocab:
          - {w: "muestras", d: "signs, outward show (of feeling)"}
          - {w: "dolorido", d: "pained, grieving, sorrowful"}
          - {w: "sobresaltado", d: "startled, alarmed, in a fright"}
        diagram:
          - s: "le dijo:"
            r: "main verb: he said to her"
            under:
              - s: "Cuando la vio Carrasco"
                r: "when: when Carrasco saw her"
                under:
                  - {s: "con muestras tan doloridas y sobresaltadas", r: "how she looked: with such pained and alarmed signs"}
        forms:
          - {w: "la vio", f: "vi- + -o → ver (to see), preterite, he, with 'la' (her) before it. Irregular, with no accents: vi, viste, vio, vimos, visteis, vieron. The subject 'Carrasco' comes after the verb."}
          - {w: "doloridas, sobresaltadas", f: "dolorido (pained) and sobresaltado (startled), participle-adjectives in the feminine plural to match 'muestras'."}
          - {w: "le dijo", f: "dij- + -o → decir (to say), preterite, he, with 'le' (to her) before it. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— ¿Qué es esto, señora ama? ¿Qué le ha acontecido, que parece que se le quiere arrancar el alma?"
        literal: "— What is this, lady housekeeper? What to-you has happened, that it-seems that itself from-you wants to-tear-out the soul?"
        ormsby: "“What is this, mistress housekeeper? What has happened to you? One would think you heartbroken.”"
        vocab:
          - {w: "señora ama", d: "mistress housekeeper: 'señora' as a polite title before her job"}
          - {w: "acontecer", d: "to happen, befall (a little more formal than 'pasar')"}
          - {w: "arrancarse el alma", d: "to have one's soul torn out: to be heartbroken, in agony"}
        diagram:
          - s: "¿Qué es esto, señora ama?"
            r: "question 1: what is this, mistress housekeeper?"
          - s: "¿Qué le ha acontecido"
            r: "question 2: what has happened to you?"
            under:
              - s: "que parece"
                r: "why I ask: for it seems"
                under:
                  - {s: "que se le quiere arrancar el alma", r: "what it seems: that your soul is about to be torn out of you"}
        forms:
          - {w: "le ha acontecido", f: "h- + -a → haber (to have), present, it: he, has, ha, hemos, habéis, han; + acontecido, participle of acontecer (to happen): the perfect, 'has happened'. 'le' = to you, the polite third-person form for the housekeeper."}
          - {w: "parece", f: "parec- + -e → parecer (to seem), present, it. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (but parezco in the 'I' form)."}
          - {w: "se le quiere arrancar", f: "quier- + -e → querer (to want), present, it: quiero, quieres, quiere, queremos, queréis, quieren; + arrancar (to tear out). 'se' makes it 'is getting torn out' and 'le' (from you) says whose: 'your soul wants to tear itself out of you', i.e. is about to."}
  - sentences:
      - es: "— No es nada, señor Sansón mío, sino que mi amo se sale; ¡sálese sin duda!"
        literal: "— Not it-is nothing, lord Sansón mine, but that my master himself goes-out; goes-out-himself without doubt!"
        ormsby: "“Nothing, Señor Samson,” said she, “only that my master is breaking out, plainly breaking out.”"
        vocab:
          - {w: "señor Sansón mío", d: "my dear Señor Sansón; the possessive after the name is affectionate"}
          - {w: "no es nada, sino que", d: "it's nothing, only that"}
          - {w: "salirse", d: "to go out, get out, leave; also 'to leak, overflow, burst out', which sets up Sansón's joke"}
          - {w: "sin duda", d: "certainly, without a doubt"}
        diagram:
          - s: "No es nada"
            r: "main verb 1: it's nothing"
            under:
              - {s: "señor Sansón mío", r: "addressed: my dear Señor Sansón"}
              - {s: "sino que mi amo se sale", r: "except: only that my master is getting out"}
          - s: "¡sálese sin duda!"
            r: "main verb 2: he's getting out, for sure!"
        forms:
          - {w: "No es nada", f: "es: ser (to be), present, it: soy, eres, es, somos, sois, son. Spanish keeps both negatives: 'no es nada' = it is not nothing, i.e. it is nothing."}
          - {w: "se sale", f: "sal- + -e → salirse (to go out, get out), present, he, with 'se'. salir (to go out) in the present: salgo, sales, sale, salimos, salís, salen."}
          - {w: "sálese", f: "sal- + -e + se → salirse (to get out), present, he, with 'se' stuck on the end and an accent added: modern 'se sale'. Cervantes hangs the pronoun on a verb that opens the clause. Same present: salgo, sales, sale, salimos, salís, salen."}
          - {w: "mío", f: "mío (mine), the long possessive placed after the noun, masculine to match 'señor Sansón'."}
        note: "'Salirse' means both 'to leave' and 'to leak, burst': the housekeeper means her master is running away again, and Sansón, as a joke, takes it in the bodily sense."
  - sentences:
      - es: "— Y ¿por dónde se sale, señora? —preguntó Sansón—. ¿Hásele roto alguna parte de su cuerpo?"
        literal: "— And through where himself goes-out, lady? —asked Sansón—. Has-itself-to-him broken some part of his body?"
        ormsby: "“Whereabouts is he breaking out, señora?” asked Samson; “has any part of his body burst?”"
        vocab:
          - {w: "¿por dónde?", d: "which way? through where? (as if asking where something leaks)"}
          - {w: "romperse", d: "to break, burst (said of a part of the body: to rupture, split open)"}
        diagram:
          - s: "¿por dónde se sale, señora?"
            r: "question 1: which way is he getting out, señora?"
          - {s: "—preguntó Sansón—", r: "speech tag: asked Sansón"}
          - s: "¿Hásele roto alguna parte de su cuerpo?"
            r: "question 2: has some part of his body burst?"
        forms:
          - {w: "se sale", f: "sal- + -e → salirse (to get out, leak), present, he, with 'se'. salir (to go out) in the present: salgo, sales, sale, salimos, salís, salen."}
          - {w: "preguntó", f: "pregunt- + -ó → preguntar (to ask), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "Hásele roto", f: "h- + -a + se + le → haber (to have), present, it, with 'se' and 'le' stuck on the end, accent added: modern 'se le ha roto'. haber (to have) in the present: he, has, ha, hemos, habéis, han. + roto, the irregular participle of romper (to break): 'has burst on him'. Cervantes hangs pronouns on a verb that opens the sentence; 'se' makes it 'got broken' and 'le' says to whom."}
          - {w: "alguna", f: "alguno (some) + feminine -a to match 'parte'."}
        note: "Sansón plays the wag: he takes 'se sale' as if Don Quijote were leaking or had a rupture, and asks which part of his body has burst."
  - sentences:
      - es: "— No se sale —respondió ella—, sino por la puerta de su locura."
        literal: "— Not himself he-goes-out —answered she—, except through the door of his madness."
        ormsby: "“He is only breaking out at the door of his madness,” she replied;"
        vocab:
          - {w: "no ... sino", d: "only, nothing but; 'no se sale sino por' = he gets out only through"}
          - {w: "locura", d: "madness"}
        diagram:
          - s: "No se sale"
            r: "main verb: he doesn't get out"
            under:
              - {s: "—respondió ella—", r: "speech tag: she answered"}
              - {s: "sino por la puerta de su locura", r: "except which way: only through the door of his madness"}
        forms:
          - {w: "se sale", f: "sal- + -e → salirse (to get out), present, he, with 'se'. salir (to go out) in the present: salgo, sales, sale, salimos, salís, salen."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, she. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
      - es: "Quiero decir, señor bachiller de mi ánima, que quiere salir otra vez, que con ésta será la tercera, a buscar por ese mundo lo que él llama venturas, que yo no puedo entender cómo les da este nombre."
        literal: "I-want to-say, lord bachelor of my soul, that he-wants to-go-out another time, for with this-one it-will-be the third, to look-for through that world that which he calls ventures, for I not can understand how to-them he-gives this name."
        ormsby: "“I mean, dear señor bachelor, that he is going to break out again (and this will be the third time) to hunt all over the world for what he calls ventures, though I can’t make out why he gives them that name."
        ormsby_note: "Venturas, which the honsekeeper mistakes for aventuras, would mean strokes of good fortune."
        vocab:
          - {w: "querer decir", d: "to mean"}
          - {w: "de mi ánima", d: "of my soul, my dear (an affectionate address); 'ánima' is the old, churchy form of 'alma'"}
          - {w: "otra vez", d: "again"}
          - {w: "por ese mundo", d: "all over the world, out there in the wide world ('ese' with a touch of contempt)"}
          - {w: "venturas", d: "strokes of luck, good fortune; she means 'aventuras' (adventures), and the confusion is pointed, since his 'adventures' bring nothing but bad luck"}
        diagram:
          - s: "Quiero decir"
            r: "main verb: I mean"
            under:
              - {s: "señor bachiller de mi ánima", r: "addressed: my dear señor bachelor"}
              - s: "que quiere salir otra vez"
                r: "what I mean: that he wants to go out again"
                under:
                  - {s: "que con ésta será la tercera", r: "aside: for with this it will be the third time"}
                  - s: "a buscar por ese mundo lo"
                    r: "why: to look all over the world for what"
                    under:
                      - {s: "que él llama venturas", r: "describes 'lo': what he calls 'ventures'"}
              - {s: "que yo no puedo entender cómo les da este nombre", r: "aside: for I can't understand how he gives them this name"}
        forms:
          - {w: "Quiero, quiere", f: "quier- + -o and quier- + -e → querer (to want), present, I and he. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "ésta", f: "esta (this one), feminine to stand for 'vez' (time); the accent marks the pronoun use in older spelling."}
          - {w: "será", f: "ser- + -á → ser (to be), future, it. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "ese", f: "ese (that), masculine to match 'mundo'."}
          - {w: "llama", f: "llam- + -a → llamar (to call), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "puedo", f: "pued- + -o → poder (to be able), present, I. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "les da", f: "d- + -a → dar (to give), present, he: doy, das, da, damos, dais, dan; 'les' = to them (the ventures)."}
        note: "She counts the sallies correctly: the first (Part I chapters 2-5) and the second (from chapter 7 to the end of Part I); this will be the third."
      - es: "La vez primera nos le volvieron atravesado sobre un jumento, molido a palos."
        literal: "The time first to-us him they-returned laid-crosswise upon a donkey, ground by sticks."
        ormsby: "The first time he was brought back to us slung across the back of an ass, and belaboured all over;"
        vocab:
          - {w: "volver", d: "here 'to bring back, return' (transitive)"}
          - {w: "atravesado", d: "laid crosswise, slung across"}
          - {w: "jumento", d: "donkey, ass"}
          - {w: "molido a palos", d: "beaten black and blue, thrashed with sticks ('moler' = to grind)"}
        diagram:
          - s: "nos le volvieron"
            r: "main verb: they brought him back to us"
            under:
              - {s: "La vez primera", r: "when: the first time"}
              - {s: "atravesado sobre un jumento", r: "how: slung across a donkey"}
              - {s: "molido a palos", r: "in what state: beaten black and blue"}
        forms:
          - {w: "nos le volvieron", f: "volv- + -ieron → volver (to bring back), preterite, they (people in general): 'he was brought back'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron. 'nos' = to us (an 'ethical' dative: to our cost), 'le' = him, 'le' for a male person as object (leísmo), which Castilian regularly allows."}
          - {w: "atravesado", f: "atraves- + -ado → atravesar (to lay across), participle, masculine to match 'le' (Don Quijote)."}
          - {w: "molido", f: "mol- + -ido → moler (to grind), participle, masculine to match 'le'."}
        note: "On his first sally Don Quijote was beaten by a muleteer and carried home across his neighbour's donkey (Part I chapters 4-5)."
      - es: "La segunda vino en un carro de bueyes, metido y encerrado en una jaula, adonde él se daba a entender que estaba encantado;"
        literal: "The second he-came in a cart of oxen, put and shut-in in a cage, where he himself gave to understand that he-was enchanted;"
