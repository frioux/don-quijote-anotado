        note: "Carrasco mixes registers on purpose: 'tú' and 'tu' as in the romances, 'vuestra merced' as in polite speech, and grand titles like 'grandeza' and 'magnificencia'."
      - es: "y si alguna cosa faltare para ponerle en ejecución, aquí estoy yo para suplirla con mi persona y hacienda;"
        literal: "and if some thing shall-be-lacking to put-it into execution, here am I to supply-it with my person and property;"
        ormsby: "and if anything be needed for the execution of your purpose, here am I ready in person and purse to supply the want;"
