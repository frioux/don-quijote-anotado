  - sentences:
      - es: "— ¿No te dije yo, Sancho, que me habían de sobrar escuderos?"
        literal: "— Not to-you said I, Sancho, that to-me were-going to be-left-over squires?"
        ormsby: "“Did I not tell thee, Sancho, there would be squires enough and to spare for me?"
        vocab:
          - {w: "sobrar", d: "to be more than enough, be left over; 'me habían de sobrar escuderos' = I would have squires to spare"}
          - {w: "haber de", d: "to be going to, to be bound to"}
        diagram:
          - s: "¿No te dije yo, Sancho"
            r: "main verb: did I not tell you, Sancho"
            under:
              - {s: "que me habían de sobrar escuderos?", r: "what I said: that I would have squires to spare"}
        forms:
          - {w: "te dije", f: "dij- + -e → decir (to say), preterite, I, with 'te' (to you). Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron. Don Quijote is back to the familiar 'tú' with Sancho, now that he is pleased."}
          - {w: "habían de sobrar", f: "hab- + -ían → haber (to have), imperfect, they (the squires): había, habías, había, habíamos, habíais, habían; 'haber de' + infinitive = to be going to: 'were going to be left over'. sobrar (to be left over) works like gustar (to please): the squires are the subject and 'me' is 'to me'."}
        note: "Don Quijote is answering what he told Sancho a moment ago, that he would not lack squires more obedient than he; Carrasco's offer seems to prove him right."
      - es: "Mira quién se ofrece a serlo, sino el inaudito bachiller Sansón Carrasco, perpetuo trastulo y regocijador de los patios de las escuelas salmanticenses, sano de su persona, ágil de sus miembros, callado, sufridor así del calor como del frío, así de la hambre como de la sed, con todas aquellas partes que se requieren para ser escudero de un caballero andante."
        literal: "Look who himself offers to be-it, but the unheard-of bachelor Sansón Carrasco, perpetual entertainer and cheerer of the courtyards of the schools Salamancan, healthy of his person, agile of his limbs, silent, endurer as-well of-the heat as of-the cold, as-well of the hunger as of the thirst, with all those parts that themselves are-required to be squire of a knight errant."
        ormsby: "See now who offers to become one; no less than the illustrious bachelor Samson Carrasco, the perpetual joy and delight of the courts of the Salamancan schools, sound in body, discreet, patient under heat or cold, hunger or thirst, with all the qualifications requisite to make a knight-errant’s squire!"
        vocab:
          - {w: "ofrecerse a", d: "to offer to, volunteer to"}
          - {w: "sino", d: "here 'none other than, but': 'who is it, but ...'"}
          - {w: "inaudito", d: "unheard-of, extraordinary, unparalleled"}
          - {w: "bachiller", d: "bachelor, holder of the first university degree"}
          - {w: "trastulo", d: "entertainer, delight, plaything (from Italian 'trastullo')"}
          - {w: "regocijador", d: "one who cheers, enlivens"}
          - {w: "patios de las escuelas", d: "the courtyards of the university buildings, where students gathered"}
          - {w: "salmanticense", d: "of Salamanca, the great Spanish university (from the Latin name Salmantica)"}
          - {w: "sano de su persona", d: "sound in body"}
          - {w: "callado", d: "quiet, discreet, able to keep a secret"}
          - {w: "sufridor", d: "able to endure, long-suffering"}
          - {w: "así ... como", d: "both ... and, as much ... as"}
          - {w: "partes", d: "qualities, qualifications (not 'parts')"}
        diagram:
          - s: "Mira"
            r: "main verb: look"
            under:
              - s: "quién se ofrece a serlo"
                r: "what to look at: who offers to be one (a squire)"
                under:
                  - s: "sino el inaudito bachiller Sansón Carrasco"
                    r: "the answer: none other than the extraordinary bachelor Sansón Carrasco"
                    under:
                      - {s: "perpetuo trastulo y regocijador de los patios de las escuelas salmanticenses", r: "describes Carrasco, 1: the constant delight and enlivener of the courtyards of Salamanca's schools"}
                      - {s: "sano de su persona, ágil de sus miembros, callado", r: "describes Carrasco, 2: sound in body, nimble of limb, discreet"}
                      - {s: "sufridor así del calor como del frío, así de la hambre como de la sed", r: "describes Carrasco, 3: able to endure heat and cold, hunger and thirst"}
                      - s: "con todas aquellas partes"
                        r: "describes Carrasco, 4: with all those qualities"
                        under:
                          - {s: "que se requieren para ser escudero de un caballero andante", r: "describes 'partes': that are required to be a knight errant's squire"}
        forms:
          - {w: "Mira", f: "mir- + -a → mirar (to look), imperative, you (tú): 'look!'. The tú imperative of regular verbs is the same as the present 'he' form: mira, come, vive."}
          - {w: "se ofrece", f: "ofrec- + -e → ofrecerse (to offer oneself), present, he, with 'se'. Irregular only in the 'I' form: ofrezco, ofreces, ofrece, ofrecemos, ofrecéis, ofrecen."}
          - {w: "serlo", f: "ser (to be) + lo (it, standing for 'escudero'): 'to be one'. Spanish uses 'lo' to replace a noun or adjective after ser (to be)."}
          - {w: "regocijador", f: "regocija- + -dor → regocijar (to gladden): the suffix -dor makes a 'doer' noun, 'gladdener'. Same with sufridor, from sufrir (to suffer, endure)."}
          - {w: "salmanticenses", f: "salmanticense (of Salamanca) + -s, plural to match 'escuelas'; adjectives in -e have one form for both genders."}
          - {w: "la hambre", f: "'la' before stressed 'ha-': modern Spanish says 'el hambre', though the noun is feminine; Cervantes' usage varies."}
          - {w: "aquellas", f: "aquell- + -as → aquel (that), feminine plural to match 'partes'."}
          - {w: "se requieren", f: "requier- + -en → requerirse (to be required), present, they (the qualities), with 'se' making it passive: 'are required'. The stem e becomes ie when stressed: requiero, requieres, requiere, requerimos, requerís, requieren."}
        note: "The praise is mock-heroic: the qualities listed are those of a squire of the romances, while Carrasco, described in chapter 3 as small and sallow, is an unlikely one."
      - es: "Pero no permita el cielo que, por seguir mi gusto, desjarrete y quiebre la coluna de las letras y el vaso de las ciencias, y tronque la palma eminente de las buenas y liberales artes."
        literal: "But not may-permit the heaven that, for to-follow my pleasure, I-may-hamstring and may-break the column of the letters and the vessel of the sciences, and may-lop the palm eminent of the good and liberal arts."
        ormsby: "But heaven forbid that, to gratify my own inclination, I should shake or shatter this pillar of letters and vessel of the sciences, and cut down this towering palm of the fair and liberal arts."
        vocab:
          - {w: "no permita el cielo", d: "heaven forbid"}
          - {w: "seguir mi gusto", d: "to follow my own wishes, please myself"}
          - {w: "desjarretar", d: "to hamstring (an animal); here, absurdly, to cripple a column"}
          - {w: "quebrar", d: "to break, shatter"}
          - {w: "coluna", d: "= columna, column, pillar (old spelling)"}
          - {w: "letras", d: "letters, learning"}
          - {w: "vaso", d: "vessel, container (biblical 'vessel'), not only 'glass'"}
          - {w: "troncar", d: "to lop off, cut down (a tree), truncate"}
          - {w: "palma", d: "palm tree; also the palm of victory"}
          - {w: "eminente", d: "lofty, towering"}
          - {w: "artes liberales", d: "the liberal arts, the seven subjects of the old university course"}
        diagram:
          - s: "Pero no permita el cielo"
            r: "main verb: but heaven forbid"
            under:
              - s: "que"
                r: "what heaven should not permit: that"
                under:
                  - {s: "por seguir mi gusto", r: "why: in order to please myself"}
                  - {s: "desjarrete y quiebre la coluna de las letras y el vaso de las ciencias", r: "verb 1: I hamstring and break the column of letters and the vessel of the sciences"}
                  - {s: "y tronque la palma eminente de las buenas y liberales artes", r: "verb 2: and cut down the towering palm of the good and liberal arts"}
        forms:
          - {w: "permita", f: "permit- + -a → permitir (to permit), present subjunctive, it (heaven): a wish, 'may heaven not permit'. The present subjunctive of -er and -ir verbs: -a, -as, -a, -amos, -áis, -an."}
          - {w: "seguir", f: "infinitive of seguir (to follow) after 'por' (in order to)."}
          - {w: "desjarrete", f: "desjarret- + -e → desjarretar (to hamstring), present subjunctive, I, after 'no permita que'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "quiebre", f: "quiebr- + -e → quebrar (to break), present subjunctive, I. The stem e becomes ie when stressed: quiebre, quiebres, quiebre, quebremos, quebréis, quiebren."}
          - {w: "coluna", f: "old spelling of columna (column)."}
          - {w: "tronque", f: "tronqu- + -e → troncar (to cut off), present subjunctive, I; c becomes qu before e to keep the hard sound. Same -e subjunctive: tronque, tronques, tronque, tronquemos, tronquéis, tronquen."}
          - {w: "buenas y liberales", f: "buen- + -as → bueno (good), feminine plural to match 'artes' (which is feminine in the plural); liberales = liberal + -es."}
        note: "The mixed metaphors (hamstringing a column, breaking a vessel, felling a palm) are a mock-heroic flourish. A column and a man named Sansón may recall the biblical Samson, who pulled down the pillars of the Philistines' temple."
      - es: "Quédese el nuevo Sansón en su patria, y, honrándola, honre juntamente las canas de sus ancianos padres; que yo con cualquier escudero estaré contento, ya que Sancho no se digna de venir conmigo."
        literal: "Let-remain-himself the new Sansón in his homeland, and, honouring-it, may-he-honour jointly the grey-hairs of his aged parents; for I with any squire will-be content, since Sancho not himself deigns to come with-me."
        ormsby: "Let this new Samson remain in his own country, and, bringing honour to it, bring honour at the same time on the grey heads of his venerable parents; for I will be content with any squire that comes to hand, as Sancho does not deign to accompany me.”"
        vocab:
