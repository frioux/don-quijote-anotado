  - sentences:
      - es: "— Señor, ya yo tengo relucida a mi mujer a que me deje ir con vuestra merced adonde quisiere llevarme."
        literal: "— Sir, already I have 'reluced' [to] my wife to that me she-may-let go with your grace where-to you-may-wish to-take-me."
        ormsby: "“Señor, I have educed my wife to let me go with your worship wherever you choose to take me.”"
        vocab:
          - {w: "relucida", d: "Sancho's blunder for 'reducida' (persuaded, brought round); 'relucir' really means 'to shine'"}
          - {w: "reducir a", d: "old 'to bring (someone) round to, persuade to'"}
          - {w: "vuestra merced", d: "your grace, your worship: the polite 'you' (the source of 'usted'), with a third-person verb"}
          - {w: "adonde", d: "wherever, to where"}
        diagram:
          - s: "ya yo tengo relucida a mi mujer"
            r: "main verb: I have now 'reluced' my wife"
            under:
              - {s: "Señor", r: "addressed: sir"}
              - s: "a que me deje ir con vuestra merced"
                r: "to what: to let me go with your worship"
                under:
                  - {s: "adonde quisiere llevarme", r: "where: wherever you may want to take me"}
        forms:
          - {w: "tengo relucida", f: "teng- + -o → tener (to have), present, I: tengo, tienes, tiene, tenemos, tenéis, tienen; + relucida, a participle agreeing (feminine) with 'mi mujer': 'tener' + participle = 'have got her persuaded', the result still in force."}
          - {w: "a mi mujer", f: "the 'a' marks a person ('mi mujer') as the object."}
          - {w: "deje", f: "dej- + -e → dejar (to let), present subjunctive, she, after 'a que' (to). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "quisiere", f: "quis- + -iere → querer (to want), future subjunctive, you (vuestra merced): 'wherever you may want'. Built on the preterite quisieron: quisiere, quisieres, quisiere, quisiéremos, quisiereis, quisieren. Cervantes uses it after 'si', 'donde', 'lo que' for an open future; modern Spanish uses the present subjunctive 'quiera'."}
          - {w: "llevarme", f: "llevar (to take) + me (me), the pronoun hung on the infinitive after 'quisiere'."}
        note: "Sancho's malapropisms are a running joke in Part II: here 'relucida' (shone) for 'reducida' (persuaded). Ormsby imitates it in English with 'educed' for 'induced'."
