          - {w: "magnificencia", d: "magnificence: a mock title like 'your highness'"}
          - {w: "tener a", d: "to consider, hold as; 'lo tendré a ventura' = I shall count it good fortune"}
          - {w: "ventura", d: "good fortune, luck"}
