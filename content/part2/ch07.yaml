  - sentences:
      - es: "— Bien puede la señora ama no rezar más la oración de Santa Apolonia, que yo sé que es determinación precisa de las esferas que el señor don Quijote vuelva a ejecutar sus altos y nuevos pensamientos, y yo encargaría mucho mi conciencia si no intimase y persuadiese a este caballero que no tenga más tiempo encogida y detenida la fuerza de su valeroso brazo y la bondad de su ánimo valentísimo, porque defrauda con su tardanza el derecho de los tuertos, el amparo de los huérfanos, la honra de las doncellas, el favor de las viudas y el arrimo de las casadas, y otras cosas deste jaez, que tocan, atañen, dependen y son anejas a la orden de la caballería andante."
        literal: "— Well can the lady housekeeper not pray more the prayer of Saint Apollonia, for I know that it-is determination fixed of the spheres that the señor Don Quijote return to carry-out his high and new thoughts, and I would-burden much my conscience if not I-should-urge and should-persuade to this knight that not he-keep more time shrunk and held-back the strength of his valorous arm and the goodness of his spirit most-valiant, because he-defrauds with his delay the righting of the wrongs, the protection of the orphans, the honour of the maidens, the favour of the widows and the support of the married-women, and other things of-this sort, that touch, concern, depend and are annexed to the order of the chivalry errant."
        ormsby: "“Mistress housekeeper may just as well give over saying the prayer of Santa Apollonia, for I know it is the positive determination of the spheres that Señor Don Quixote shall proceed to put into execution his new and lofty designs; and I should lay a heavy burden on my conscience did I not urge and persuade this knight not to keep the might of his strong arm and the virtue of his valiant spirit any longer curbed and checked, for by his inactivity he is defrauding the world of the redress of wrongs, of the protection of orphans, of the honour of virgins, of the aid of widows, and of the support of wives, and other matters of this kind appertaining, belonging, proper and peculiar to the order of knight-errantry."
        vocab:
          - {w: "bien puede", d: "may well, might as well"}
          - {w: "oración de Santa Apolonia", d: "the prayer to Saint Apollonia, patron saint of toothache, which Carrasco told the housekeeper to say"}
          - {w: "determinación precisa de las esferas", d: "a fixed decree of the heavenly spheres, i.e. the stars have ordained it (astrological language)"}
          - {w: "ejecutar", d: "to carry out, put into effect (not 'to execute' a person)"}
          - {w: "encargar la conciencia", d: "to burden one's conscience, take a sin upon oneself"}
          - {w: "intimar", d: "to urge, formally notify (legal word); false friend: not 'to be intimate'"}
          - {w: "encogido", d: "shrunk, held in, cramped"}
          - {w: "detenido", d: "held back, checked"}
          - {w: "ánimo", d: "spirit, courage (not 'animosity')"}
          - {w: "defraudar", d: "to cheat (someone) of what is due, deprive"}
          - {w: "tardanza", d: "delay"}
          - {w: "el derecho de los tuertos", d: "the righting of wrongs: 'derecho' (straight, right) against 'tuerto' (twisted, a wrong, an injury); Don Quijote's 'deshacer tuertos'"}
          - {w: "amparo", d: "protection, shelter"}
          - {w: "huérfano", d: "orphan"}
          - {w: "doncella", d: "maiden, damsel"}
          - {w: "arrimo", d: "support, something to lean on"}
          - {w: "casadas", d: "married women, wives"}
          - {w: "jaez", d: "kind, sort (literally a horse's harness); 'deste jaez' = of this sort"}
          - {w: "atañer", d: "to concern, pertain to (used only in the 'it/they' forms)"}
          - {w: "anejo", d: "annexed, attached, belonging"}
          - {w: "tocan, atañen, dependen y son anejas", d: "a string of near-synonyms in the manner of legal documents: pertain, concern, depend on and belong to"}
        diagram:
          - s: "Bien puede la señora ama no rezar más la oración de Santa Apolonia"
            r: "main verb 1: the housekeeper may as well stop saying the prayer of Saint Apollonia"
            under:
              - s: "que yo sé"
                r: "why: for I know"
                under:
                  - s: "que es determinación precisa de las esferas"
                    r: "what I know: that it is a fixed decree of the heavens"
                    under:
                      - {s: "que el señor don Quijote vuelva a ejecutar sus altos y nuevos pensamientos", r: "what is decreed: that Don Quijote carry out his high and new designs once more"}
          - s: "y yo encargaría mucho mi conciencia"
            r: "main verb 2: and I would weigh heavily on my conscience"
            under:
              - s: "si no intimase y persuadiese a este caballero"
                r: "condition: if I did not urge and persuade this knight"
                under:
                  - s: "que no tenga más tiempo encogida y detenida"
                    r: "what I urge: not to keep any longer held in and held back"
                    under:
                      - {s: "la fuerza de su valeroso brazo", r: "object, 1: the strength of his valiant arm"}
                      - {s: "y la bondad de su ánimo valentísimo", r: "object, 2: and the goodness of his most valiant spirit"}
              - s: "porque defrauda con su tardanza"
                r: "why: because by his delay he cheats (the world) of"
                under:
                  - {s: "el derecho de los tuertos", r: "what is lost, 1: the righting of wrongs"}
                  - {s: "el amparo de los huérfanos", r: "what is lost, 2: the protection of orphans"}
                  - {s: "la honra de las doncellas", r: "what is lost, 3: the honour of maidens"}
                  - {s: "el favor de las viudas y el arrimo de las casadas", r: "what is lost, 4 and 5: help for widows and support for wives"}
                  - s: "y otras cosas deste jaez"
                    r: "what is lost, 6: and other things of this sort"
                    under:
                      - {s: "que tocan, atañen, dependen y son anejas a la orden de la caballería andante", r: "describes 'cosas': that belong to the order of knight-errantry"}
        forms:
          - {w: "puede", f: "pued- + -e → poder (to be able), present, she (the housekeeper). The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden. Carrasco speaks of her in the third person, 'la señora ama', though she is in front of him."}
          - {w: "rezar", f: "infinitive of rezar (to pray), after 'puede'; 'no rezar más' = to pray no more."}
          - {w: "sé", f: "sé → saber (to know), present, I. Irregular in the 'I' form only: sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "vuelva a ejecutar", f: "vuelv- + -a → volver (to return), present subjunctive, he: after 'es determinación que' (it is decreed that). The stem o becomes ue when stressed: vuelva, vuelvas, vuelva, volvamos, volváis, vuelvan. 'volver a' + infinitive = to do again: 'carry out again'."}
          - {w: "altos y nuevos", f: "alt- + -os → alto (high), nuev- + -os → nuevo (new), masculine plural to match 'pensamientos'."}
          - {w: "encargaría", f: "encargar- + -ía → encargar (to burden), conditional, I: 'I would burden'. The conditional adds -ía endings to the whole infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "intimase y persuadiese", f: "intim- + -ase → intimar (to urge) and persuad- + -iese → persuadir (to persuade), imperfect subjunctive (-se form), I, in the unreal 'si' clause that goes with the conditional 'encargaría'. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen; of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen."}
          - {w: "a este caballero", f: "'a' before a person as object (the personal 'a'); este = this, masculine to match 'caballero'."}
          - {w: "tenga", f: "teng- + -a → tener (to have, keep), present subjunctive, he, after 'persuadir que' (persuade him that he should): tenga, tengas, tenga, tengamos, tengáis, tengan. Strictly the sequence of tenses would want 'tuviese'; Cervantes is free with it."}
          - {w: "encogida y detenida", f: "encog- + -ida → encoger (to shrink, hold in) and deten- + -ida → detener (to hold back), participles, feminine to match 'la fuerza', the first of the two objects: 'tener' + participle = to keep something in that state."}
          - {w: "valeroso", f: "valer (to be worth) + -oso, an adjective suffix meaning 'full of': 'valiant', masculine to match 'brazo'."}
          - {w: "valentísimo", f: "valient(e) + -ísimo → valiente (brave), superlative 'most valiant'; the ie of the stem goes back to e (valent-) before the suffix."}
          - {w: "defrauda", f: "defraud- + -a → defraudar (to cheat), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "deste", f: "de + este (of this): Cervantes fuses 'de' with the demonstrative."}
          - {w: "tocan, atañen, dependen", f: "toc- + -an → tocar (to touch, pertain), atañ- + -en → atañer (to concern), depend- + -en → depender (to depend), present, they (the things). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an; of -er verbs: -o, -es, -e, -emos, -éis, -en (atañer is used only in the 'it' and 'they' forms: atañe, atañen)."}
          - {w: "son anejas", f: "son → ser (to be), present, they: soy, eres, es, somos, sois, son; + anejas, feminine plural to match 'cosas'."}
        note: "The list of widows, orphans and maidens is the knight's duty as the romances of chivalry describe it, and the four verbs in a row ape the redundancy of legal documents. Carrasco is laying it on thick; the end of the chapter says he is following a plan agreed with the priest and the barber."
      - es: "¡Ea, señor don Quijote mío, hermoso y bravo, antes hoy que mañana se ponga vuestra merced y su grandeza en camino;"
        literal: "Come-on, señor Don Quijote mine, handsome and brave, rather today than tomorrow may-put-itself your grace and its greatness on road;"
        ormsby: "On, then, my lord Don Quixote, beautiful and brave, let your worship and highness set out today rather than tomorrow;"
