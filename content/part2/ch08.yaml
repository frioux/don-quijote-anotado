          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "a mí ... me parecieron", f: "parec- + -ieron → parecer (to seem), preterite, they (the walls), with 'me' (to me), doubled by 'a mí' for emphasis: 'to ME they looked like walls'. Same -ieron preterite: -í, -iste, -ió, -imos, -isteis, -ieron."}
