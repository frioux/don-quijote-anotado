  - sentences:
      - es: "— Cogido le tengo —dijo Sancho—: luego la fama del que resucita muertos, da vista a los ciegos, endereza los cojos y da salud a los enfermos, y delante de sus sepulturas arden lámparas, y están llenas sus capillas de gentes devotas que de rodillas adoran sus reliquias, mejor fama será, para este y para el otro siglo, que la que dejaron y dejaren cuantos emperadores gentiles y caballeros andantes ha habido en el mundo."
        literal: "— Caught him I-have —said Sancho—: then the fame of-the [one] who raises-again dead-men, gives sight to the blind, straightens the lame and gives health to the sick, and before his tombs burn lamps, and are full his chapels of people devout who on knees adore his relics, better fame will-be, for this and for the other world, than that which left and may-leave as-many emperors heathen and knights errant [as] there-have been in the world."
        ormsby: "“Now I have got you,” said Sancho; “in that case the fame of them who bring the dead to life, who give sight to the blind, cure cripples, restore health to the sick, and before whose tombs there are lamps burning, and whose chapels are filled with devout folk on their knees adoring their relics be a better fame in this life and in the other than that which all the heathen emperors and knights-errant that have ever been in the world have left or may leave behind them?”"
        vocab:
          - {w: "cogido le tengo", d: "I've got him, I've caught him out: Sancho has trapped his master in an argument"}
          - {w: "luego", d: "here 'therefore, then' (drawing a conclusion), not 'later'"}
          - {w: "resucitar", d: "to raise from the dead, bring back to life"}
          - {w: "enderezar", d: "to straighten; 'enderezar los cojos' = to make the lame walk straight"}
          - {w: "cojo", d: "lame, crippled person"}
          - {w: "sepultura", d: "tomb, grave"}
          - {w: "de rodillas", d: "on their knees, kneeling"}
          - {w: "reliquias", d: "relics: a saint's bones or belongings, venerated in churches"}
          - {w: "este y el otro siglo", d: "this world and the next; 'siglo' = age, the world, worldly life (not only 'century')"}
          - {w: "gentil", d: "heathen, pagan (not 'gentle')"}
        diagram:
          - {s: "Cogido le tengo", r: "Sancho's cry: I've caught him"}
          - s: "mejor fama será"
            r: "main verb (after 'luego', therefore): will be a better fame"
            under:
              - s: "la fama del que resucita muertos"
                r: "subject: the fame of the one who raises the dead"
                under:
                  - {s: "da vista a los ciegos, endereza los cojos y da salud a los enfermos", r: "describes 'el que', 2-4: who gives sight to the blind, straightens the lame and heals the sick"}
                  - {s: "y delante de sus sepulturas arden lámparas", r: "describes 'el que', 5: before whose tombs lamps burn"}
                  - s: "y están llenas sus capillas de gentes devotas"
                    r: "describes 'el que', 6: whose chapels are full of devout people"
                    under:
                      - {s: "que de rodillas adoran sus reliquias", r: "describes 'gentes': who worship his relics on their knees"}
              - {s: "para este y para el otro siglo", r: "for when: for this world and the next"}
              - s: "que la"
                r: "compared with: than the (fame)"
                under:
                  - {s: "que dejaron y dejaren cuantos emperadores gentiles y caballeros andantes ha habido en el mundo", r: "describes 'la': which all the heathen emperors and knights errant there have ever been left or may leave"}
        forms:
          - {w: "Cogido le tengo", f: "teng- + -o → tener (to have, hold), present, I: tengo, tienes, tiene, tenemos, tenéis, tienen; + cogido, participle of coger (to catch): 'I have him caught'. 'tener' + participle stresses the result, like English 'I've got him cornered'. 'le' for a male person as object (leísmo), which Castilian regularly allows."}
          - {w: "resucita, endereza, da", f: "resucit- + -a → resucitar (to raise from the dead), enderez- + -a → enderezar (to straighten), present, he: the present of -ar verbs: -o, -as, -a, -amos, -áis, -an. da → dar (to give), present, he: doy, das, da, damos, dais, dan."}
          - {w: "arden", f: "ard- + -en → arder (to burn), present, they (the lamps). The present of -er verbs: -o, -es, -e, -emos, -éis, -en. The subject 'lámparas' comes after the verb."}
          - {w: "están llenas", f: "est- + -án → estar (to be), present, they: estoy, estás, está, estamos, estáis, están; + llenas, lleno (full) in the feminine plural to match 'capillas'."}
          - {w: "adoran", f: "ador- + -an → adorar (to worship), present, they (the devout people). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "será", f: "ser- + -á → ser (to be), future, it (the fame). The future adds endings to the whole infinitive: seré, serás, será, seremos, seréis, serán."}
          - {w: "este", f: "este (this), masculine to match 'siglo', which is said once for both 'este' and 'el otro'."}
          - {w: "dejaron", f: "dej- + -aron → dejar (to leave), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "dejaren", f: "dej- + -aren → dejar (to leave), future subjunctive, they: 'may leave (in time to come)'. The future subjunctive of -ar verbs: -are, -ares, -are, -áremos, -areis, -aren. Cervantes uses it for an open future; modern Spanish would say 'dejen'."}
          - {w: "cuantos", f: "cuanto (as many as) in the masculine plural to match 'emperadores ... caballeros': 'all the emperors that'."}
          - {w: "ha habido", f: "h- + -a → haber (to have), present, it: he, has, ha, hemos, habéis, han; + habido, participle of haber (there to be): 'there have been'. The impersonal 'haber' (there is, there are) stays singular even with a plural subject, so 'ha habido' not 'han habido'."}
        note: "Sancho argues like a schoolman: having made his master grant that raising the dead is greater than killing giants, he concludes that the saints, who work miracles, have the better fame. The lamps, wax limbs and kneeling crowds are what he has seen at shrines in Spanish churches."
