        note: "The lady as a sun whose rays give the lover wisdom and strength is a commonplace of Petrarchan love poetry and the romances; Sancho will take the metaphor literally in his reply."
  - sentences:
      - es: "— Pues en verdad, señor —respondió Sancho—, que cuando yo vi ese sol de la señora Dulcinea del Toboso, que no estaba tan claro, que pudiese echar de sí rayos algunos, y debió de ser que, como su merced estaba ahechando aquel trigo que dije, el mucho polvo que sacaba se le puso como nube ante el rostro y se le escureció."
        literal: "— Well in truth, sir —answered Sancho—, that when I saw that sun of the lady Dulcinea of-the Toboso, that not it-was so bright, that it-could throw from itself rays any, and it-must [of] have-been that, as her grace was sifting that wheat that I-said, the much dust that she-raised itself to-her put like cloud before the face and itself on-her darkened."
        ormsby: "“Well, to tell the truth, señor,” said Sancho, “when I saw that sun of the lady Dulcinea del Toboso, it was not bright enough to throw out beams at all; it must have been, that as her grace was sifting that wheat I told you of, the thick dust she raised came before her face like a cloud and dimmed it.”"
