  - sentences:
      - es: "— A eso voy —replicó Sancho—. Y dígame agora: ¿cuál es más: resucitar a un muerto, o matar a un gigante?"
        literal: "— To that I-go —replied Sancho—. And tell-me now: which is more: to-resuscitate [to] a dead-man, or to-kill [to] a giant?"
        ormsby: "“That’s the point I’m coming to,” said Sancho; “and now tell me, which is the greater work, to bring a dead man to life or to kill a giant?”"
        vocab:
          - {w: "a eso voy", d: "that's what I'm getting at, that's my point"}
          - {w: "replicar", d: "to reply, answer back"}
          - {w: "agora", d: "= ahora, now (old form)"}
          - {w: "cuál es más", d: "which is more, which is the greater thing"}
          - {w: "resucitar", d: "to bring back to life, raise from the dead"}
        diagram:
          - s: "A eso voy"
            r: "main verb 1: that is what I am coming to"
            under:
              - {s: "—replicó Sancho—", r: "speaker tag: Sancho replied"}
          - {s: "Y dígame agora:", r: "main verb 2: and tell me now"}
          - s: "¿cuál es más:"
            r: "main verb 3, the question: which is greater"
            under:
              - {s: "resucitar a un muerto", r: "choice 1: to raise a dead man"}
              - {s: "o matar a un gigante?", r: "choice 2: or to kill a giant"}
        forms:
          - {w: "voy", f: "ir (to go), present, I. Irregular: voy, vas, va, vamos, vais, van."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "dígame", f: "dig- + -a + me → decir (to say), present subjunctive used as a polite command, he (vuestra merced), with 'me' stuck on the end, accent added: 'tell me'. decir (to say) in the present subjunctive: diga, digas, diga, digamos, digáis, digan."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "resucitar, matar", f: "infinitives used as nouns, the two things compared: 'raising', 'killing'."}
          - {w: "a un muerto, a un gigante", f: "'a' marks a person (or giant) as the object of the verb."}
        note: "Sancho is setting a trap in the manner of a scholastic disputation: get the opponent to grant small points one by one, then spring the conclusion. Raising the dead is the work of saints, killing giants that of knights."
