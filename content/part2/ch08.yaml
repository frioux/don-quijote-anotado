        note: "Don Quijote cannot let the sifting of wheat stand: in Part I (chapter 31) Sancho, who never delivered the letter, invented a Dulcinea winnowing grain in her yard. A great lady, by his code, does nothing so menial."
      - es: "Mal se te acuerdan a ti, ¡oh Sancho!, aquellos versos de nuestro poeta donde nos pinta las labores que hacían allá en sus moradas de cristal aquellas cuatro ninfas que del Tajo amado sacaron las cabezas, y se sentaron a labrar en el prado verde aquellas ricas telas que allí el ingenioso poeta nos describe, que todas eran de oro, sirgo y perlas contestas y tejidas."
        literal: "Badly themselves-come-to-mind to-you to you, oh Sancho!, those verses of our poet where to-us he-paints the needleworks that were-doing there in their dwellings of crystal those four nymphs who from-the Tajo beloved took-out the heads, and themselves sat to work in the meadow green those rich cloths that there the ingenious poet to-us describes, which all were of gold, silk and pearls interwoven and woven."
