          - {w: "ni pierdo ni gano", d: "I neither lose nor gain: it makes no difference to me"}
          - {w: "por", d: "here 'as long as, in return for' (for the sake of seeing myself in books)"}
          - {w: "de mano en mano", d: "from hand to hand"}
          - {w: "ese mundo", d: "'that world', i.e. the wide world out there"}
          - {w: "no se me da un higo", d: "I don't care a fig ('dársele a uno algo' = to matter to someone)"}
