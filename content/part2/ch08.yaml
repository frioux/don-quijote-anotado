          - {w: "descalzo", d: "barefoot: friars of the reformed 'discalced' orders, who went in sandals or bare feet as a mark of poverty"}
          - {w: "ceñir", d: "to gird, bind around the waist"}
          - {w: "atormentar", d: "to torment, mortify (the body, as penance)"}
          - {w: "tener a gran ventura", d: "to consider it great good fortune"}
          - {w: "veneración", d: "veneration, reverence"}
          - {w: "la espada de Roldán", d: "the sword of Roland, the paladin of Charlemagne; a sword said to be his was shown in the royal armoury in Madrid"}
          - {w: "que Dios guarde", d: "whom God keep: the set blessing added after naming the king"}
