      - es: "y así, temo que, en aquella historia que dicen que anda impresa de mis hazañas, si por ventura ha sido su autor algún sabio mi enemigo, habrá puesto unas cosas por otras, mezclando con una verdad mil mentiras, divertiéndose a contar otras acciones fuera de lo que requiere la continuación de una verdadera historia."
