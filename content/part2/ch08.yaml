          - {w: "claro", d: "bright, clear"}
          - {w: "echar de sí", d: "to give off, throw out from itself"}
          - {w: "algunos", d: "after the noun in a negative sentence it means 'any at all': 'no ... rayos algunos' = no rays whatever"}
          - {w: "su merced", d: "'her grace', a polite way of referring to a person, here Dulcinea"}
          - {w: "ahechar", d: "to sift or winnow (grain) through a sieve"}
          - {w: "sacar", d: "here 'to raise, throw up' (dust)"}
