          - {w: "Di", f: "decir (to say), imperative, you (tú): 'say!'. Irregular short form, like haz (do), pon (put), ven (come)."}
          - {w: "buen", f: "bueno (good) clipped before a singular noun; 'hora' is feminine but the old phrase keeps 'buen hora' (modern 'en buena hora' or 'enhorabuena')."}
          - {w: "responderé", f: "responder- + -é → responder (to answer), future, I. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "supiere", f: "sup- + -iere → saber (to know), future subjunctive, I: 'whatever I may know'. Built on the preterite supieron: supiere, supieres, supiere, supiéremos, supiereis, supieren. Cervantes uses it after 'lo que' for an open future; modern Spanish says 'lo que sepa'."}
  - sentences:
