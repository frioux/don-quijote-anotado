        literal: "Say in good hour, for I will-answer that which I-may-know."
        ormsby: "“say on, in God’s name, and I will answer as well as I can.”"
        vocab:
          - {w: "en buen hora", d: "by all means, in God's name, go ahead (literally 'in a good hour')"}
          - {w: "que", d: "here 'for, since'"}
        diagram:
          - s: "Di"
            r: "main verb 1: say (it)"
            under:
              - {s: "en buen hora", r: "how: by all means"}
          - s: "que yo responderé"
            r: "main verb 2 (after 'que', for): I will answer"
            under:
              - {s: "lo que supiere", r: "object: whatever I may know"}
