  - sentences:
      - es: "— Eso es lo que yo digo también —respondió Sancho—, y pienso que en esa leyenda o historia que nos dijo el bachiller Carrasco que de nosotros había visto debe de andar mi honra a coche acá, cinchado, y, como dicen, al estricote, aquí y allí, barriendo las calles."
        literal: "— That is what I say also —replied Sancho—, and I-think that in that legend or history which to-us said the bachelor Carrasco that of us he-had seen must go-about my honour at piggy-come-here, girthed, and, as they-say, from-pillar-to-post, here and there, sweeping the streets."
        ormsby: "“So I say too,” replied Sancho; “and I suspect in that legend or history of us that the bachelor Samson Carrasco told us he saw, my honour goes dragged in the dirt, knocked about, up and down, sweeping the streets, as they say."
        vocab:
          - {w: "leyenda", d: "legend; also, in the old sense, 'something written to be read', a story"}
          - {w: "bachiller", d: "bachelor, holder of the first university degree: Sansón Carrasco"}
          - {w: "honra", d: "honour, good name, reputation"}
          - {w: "a coche acá", d: "an obscure phrase; 'coche' was a call to pigs, so probably 'driven along like a pig'; Ormsby renders the whole run as 'dragged in the dirt'"}
          - {w: "cinchado", d: "girthed, strapped tight (from 'cincha', a saddle girth); here 'trussed up, ill-used'"}
          - {w: "al estricote", d: "from pillar to post, kicked about, mistreated"}
          - {w: "barrer", d: "to sweep; 'barriendo las calles' = dragged through the streets"}
        diagram:
          - s: "Eso es"
            r: "main verb 1: that is"
            under:
              - {s: "lo que yo digo también", r: "what that is: what I say too"}
              - {s: "—respondió Sancho—", r: "aside: replied Sancho"}
          - s: "y pienso"
            r: "main verb 2: and I think"
            under:
              - s: "que en esa leyenda o historia ... debe de andar mi honra"
                r: "what I think: that in that legend or history my honour must be going about"
                under:
                  - s: "que nos dijo el bachiller Carrasco que de nosotros había visto"
                    r: "describes 'historia': which the bachelor Carrasco told us he had seen about us"
                  - {s: "a coche acá, cinchado", r: "how, 1: driven like a pig, trussed up"}
                  - {s: "y, como dicen, al estricote", r: "how, 2: and, as they say, from pillar to post"}
                  - {s: "aquí y allí, barriendo las calles", r: "how, 3: here and there, sweeping the streets"}
        forms:
          - {w: "es", f: "ser (to be), present, it. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "respondió", f: "respond- + -ió → responder (to reply), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "pienso", f: "piens- + -o → pensar (to think), present, I. The stem e becomes ie when stressed: pienso, piensas, piensa, pensamos, pensáis, piensan."}
          - {w: "esa", f: "ese (that), feminine to match 'leyenda': 'that' for something near the listener or already mentioned."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he (Carrasco). Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron. The subject comes after the verb."}
          - {w: "había visto", f: "hab- + -ía → haber (to have), imperfect, he: había, habías, había, habíamos, habíais, habían; + visto, the irregular participle of ver (to see): the pluperfect, 'he had seen'."}
          - {w: "debe de andar", f: "deb- + -e → deber (must), present, it (my honour), + de + andar (to go about): 'must be going about' (a guess). The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "cinchado", f: "cinch- + -ado → cinchar (to girth, strap), participle; it stays masculine although 'honra' is feminine, a sign that the words are a set phrase."}
          - {w: "dicen", f: "dic- + -en → decir (to say), present, they (people): 'as they say'. Same irregular present: digo, dices, dice, decimos, decís, dicen."}
          - {w: "barriendo", f: "barr- + -iendo → barrer (to sweep), gerund: 'sweeping'. -er and -ir verbs make the gerund in -iendo."}
        note: "Sancho piles up popular phrases for being dragged about and abused; the exact sense of 'a coche acá, cinchado' is not certain, but the drift is that his good name is being trailed through the mud."
      - es: "Pues, a fe de bueno, que no he dicho yo mal de ningún encantador, ni tengo tantos bienes que pueda ser envidiado;"
        literal: "Well, on faith of good [man], that not have said I ill of no enchanter, nor I-have so-many goods that I-may be envied;"
        ormsby: "And yet, on the faith of an honest man, I never spoke ill of any enchanter, and I am not so well off that I am to be envied;"
