          - {w: "consigo", f: "con + sí, 'with itself': the fused form used when the subject is the same thing ('la buena fama')."}
          - {w: "trae", f: "tra- + -e → traer (to bring), present, it (good fame). Irregular 'I' form: traigo, traes, trae, traemos, traéis, traen. The subject comes after the verb."}
  - sentences:
      - es: "— Todo lo que vuestra merced hasta aquí me ha dicho —dijo Sancho— lo he entendido muy bien, pero, con todo eso, querría que vuestra merced me sorbiese una duda que agora en este punto me ha venido a la memoria."
        literal: "— All that which your grace up-to here to-me has said —said Sancho— it I-have understood very well, but, with all that, I-would-like that your grace for-me might-sip-up a doubt which now at this point to-me has come to the memory."
        ormsby: "“All that your worship has said so far,” said Sancho, “I have understood quite well; but still I would be glad if your worship would dissolve a doubt for me, which has just this minute come into my mind.”"
        vocab:
          - {w: "vuestra merced", d: "your grace, your worship: the polite 'you', taking a 'he/she' verb (origin of modern 'usted')"}
          - {w: "hasta aquí", d: "up to now, so far"}
          - {w: "con todo eso", d: "even so, all the same"}
          - {w: "sorber", d: "to sip, suck up; Sancho's blunder for 'absolver' (to resolve, clear up a doubt)"}
          - {w: "agora", d: "= ahora, now (old form)"}
          - {w: "en este punto", d: "at this moment, just now"}
          - {w: "venir a la memoria", d: "to come to mind, occur to one"}
        diagram:
          - s: "lo he entendido muy bien"
            r: "main verb 1: I have understood it very well"
            under:
              - s: "Todo lo"
                r: "object, put first and picked up by 'lo': all that"
                under:
                  - {s: "que vuestra merced hasta aquí me ha dicho", r: "describes 'lo': that your worship has told me so far"}
              - {s: "—dijo Sancho—", r: "speaker tag: said Sancho"}
          - s: "pero, con todo eso, querría"
            r: "main verb 2: but even so I would like"
            under:
              - s: "que vuestra merced me sorbiese una duda"
                r: "what he would like: that your worship 'sip up' (resolve) a doubt for me"
                under:
                  - {s: "que agora en este punto me ha venido a la memoria", r: "describes 'duda': which has just now come into my mind"}
        forms:
          - {w: "ha dicho", f: "ha → haber (to have), present, he (vuestra merced): he, has, ha, hemos, habéis, han; + dicho, irregular participle of decir (to say): 'has said'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "lo he entendido", f: "he → haber (to have), present, I: he, has, ha, hemos, habéis, han; + entendido, participle of entender (to understand): 'I have understood'. 'lo' (it) repeats the object 'Todo lo que ...' put at the front."}
          - {w: "querría", f: "querr- + -ía → querer (to want), conditional, I: 'I would like'. Irregular stem querr-: querría, querrías, querría, querríamos, querríais, querrían."}
          - {w: "sorbiese", f: "sorb- + -iese → sorber (to sip), imperfect subjunctive (-se form), he (vuestra merced); subjunctive after 'querría que'. The -se form of -er verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen. Sancho means 'absolviese', from absolver (to resolve)."}
          - {w: "ha venido", f: "ha → haber (to have), present, it (the doubt): he, has, ha, hemos, habéis, han; + venido, participle of venir (to come): 'has come'."}
        note: "Another of Sancho's malapropisms: 'sorber' means to slurp or suck up, so he asks his master to 'swallow down' his doubt instead of resolving it. Ormsby keeps the joke with 'dissolve'."
