          - {w: "replicar", d: "to reply, answer back"}
          - {w: "como", d: "here 'provided that, as long as' (with the subjunctive)"}
          - {w: "eso se me da que ... que", d: "it is all the same to me whether ... or; from 'dársele a uno' (to matter to someone)"}
          - {w: "resquicio", d: "chink, crack (in a door or wall)"}
          - {w: "verja", d: "grille, railing, iron grating"}
