        forms:
          - {w: "digan", f: "dig- + -an → decir (to say), present subjunctive, they: 'let them say'. Irregular: diga, digas, diga, digamos, digáis, digan. A subjunctive on its own gives a wish or permission; the second 'digan' is subjunctive after 'no se me da ... que'."}
          - {w: "quisieren", f: "quis- + -ieren → querer (to want), future subjunctive, they: 'whatever they may want'. Built on the preterite quisieron: quisiere, quisieres, quisiere, quisiéremos, quisiereis, quisieren. Cervantes uses it after 'lo que' for an open future; modern Spanish says 'lo que quieran'."}
