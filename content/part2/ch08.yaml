      - es: "y advierta, señor, que ayer o antes de ayer, que, según ha poco se puede decir desta manera, canonizaron o beatificaron dos frailecitos descalzos, cuyas cadenas de hierro con que ceñían y atormentaban sus cuerpos se tiene ahora a gran ventura el besarlas y tocarlas, y están en más veneración que está, según dije, la espada de Roldán en la armería del rey, nuestro señor, que Dios guarde."
        literal: "and note, sir, that yesterday or before of yesterday, for, according-as it-is little [time] one-can say [it] in-this way, they-canonized or beatified two little-friars barefoot, whose chains of iron with which they-girded and tormented their bodies it-is-held now as great good-fortune the kissing-them and touching-them, and they-are in more veneration than is, as I-said, the sword of Roldán in the armoury of-the king, our lord, whom God may-keep."
        ormsby: "for you know, señor, yesterday or the day before yesterday (for it is so lately one may say so) they canonised and beatified two little barefoot friars, and it is now reckoned the greatest good luck to kiss or touch the iron chains with which they girt and tortured their bodies, and they are held in greater veneration, so it is said, than the sword of Roland in the armoury of our lord the King, whom God preserve."
