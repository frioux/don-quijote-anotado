          - {w: "lo era", f: "er- + -a → ser (to be), imperfect, she: era, eras, era, éramos, erais, eran. 'lo' stands for the noun 'cortesana': 'whether she was one'."}
        note: "Don Quijote answers Sancho's 'let them say what they like, so long as I am in books' with three stories of people who wanted fame at any price. Cervantes names neither the poet nor the lady."
