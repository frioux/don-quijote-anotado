          - {w: "quieres decir", f: "quier- + -es → querer (to want), present, you (tú); the stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren; + decir (to say): 'querer decir' = to mean."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
