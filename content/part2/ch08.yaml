part: 2
chapter: 8
title_es: "Capítulo VIII. Donde se cuenta lo que le sucedió a don Quijote, yendo a ver su señora Dulcinea del Toboso"
title_en: "Wherein is related what befell Don Quixote on his way to see his lady Dulcinea del Toboso"
paragraphs:
  - sentences:
      - es: "«¡Bendito sea el poderoso Alá! —dice Hamete Benengeli al comienzo deste octavo capítulo—. ¡Bendito sea Alá!», repite tres veces;"
        literal: "«Blessed may-be the mighty Allah! —says Hamete Benengeli at-the beginning of-this eighth chapter—. Blessed may-be Allah!», he-repeats three times;"
        ormsby: "“Blessed be Allah the all-powerful!” says Hamete Benengeli on beginning this eighth chapter; “blessed be Allah!” he repeats three times;"
        vocab:
          - {w: "bendito", d: "blessed; '¡Bendito sea Dios!' is the everyday Spanish exclamation, here turned Muslim"}
          - {w: "Alá", d: "Allah, God in Arabic: the pious formula suits the Moorish historian"}
          - {w: "Hamete Benengeli", d: "Cide Hamete Benengeli, the invented Arab historian who, the novel pretends, wrote the original history of Don Quijote"}
          - {w: "comienzo", d: "beginning, start"}
          - {w: "deste", d: "= de este, of this (old contraction)"}
          - {w: "octavo", d: "eighth"}
        diagram:
          - s: "¡Bendito sea el poderoso Alá!"
            r: "what he says, 1: blessed be mighty Allah"
          - s: "dice Hamete Benengeli"
            r: "main verb 1: says Hamete Benengeli (inserted in the quote)"
            under:
              - {s: "al comienzo deste octavo capítulo", r: "when: at the start of this eighth chapter"}
          - s: "¡Bendito sea Alá!"
            r: "what he says, 2: blessed be Allah"
          - s: "repite tres veces"
            r: "main verb 2: he repeats (it) three times"
        forms:
          - {w: "Bendito sea", f: "se- + -a → ser (to be), present subjunctive, it: 'may [he] be', a wish. ser (to be) in the present subjunctive: sea, seas, sea, seamos, seáis, sean. 'Bendito' is the old participle of bendecir (to bless), used as an adjective."}
          - {w: "dice", f: "dic- + -e → decir (to say), present, he. Irregular: digo, dices, dice, decimos, decís, dicen. The present is used for an author 'saying' something in his book."}
          - {w: "al", f: "a + el = al, 'at the'."}
          - {w: "deste", f: "de + este = deste, 'of this'; Cervantes runs the two words together, modern Spanish writes 'de este'."}
          - {w: "repite", f: "repit- + -e → repetir (to repeat), present, he. The e of the stem becomes i when stressed: repito, repites, repite, repetimos, repetís, repiten."}
        note: "Cide Hamete, as a Muslim, praises Allah where a Christian chronicler would praise God. Part I closed its chapters with the claim that the story was translated from his Arabic manuscript, and Part II keeps the game going."
      - es: "y dice que da estas bendiciones por ver que tiene ya en campaña a don Quijote y a Sancho, y que los letores de su agradable historia pueden hacer cuenta que desde este punto comienzan las hazañas y donaires de don Quijote y de su escudero;"
        literal: "and he-says that he-gives these blessings for seeing that he-has now in the-field [to] Don Quijote and [to] Sancho, and that the readers of his pleasant history can make account that from this point begin the exploits and witticisms of Don Quijote and of his squire;"
        ormsby: "and he says he utters these thanksgivings at seeing that he has now got Don Quixote and Sancho fairly afield, and that the readers of his delightful history may reckon that the achievements and humours of Don Quixote and his squire are now about to begin;"
        vocab:
          - {w: "bendiciones", d: "blessings; here the thanks to Allah he has just given"}
          - {w: "por ver", d: "on seeing, because he sees"}
          - {w: "en campaña", d: "in the field, on campaign: out on the road, in action (a military term)"}
          - {w: "letor", d: "= lector, reader (old spelling)"}
          - {w: "agradable", d: "pleasant, delightful"}
          - {w: "hacer cuenta que", d: "to reckon that, take it that"}
          - {w: "desde este punto", d: "from this moment on; 'punto' = moment"}
          - {w: "hazaña", d: "exploit, deed"}
          - {w: "donaire", d: "wit, witty saying, comic grace; Ormsby's 'humours'"}
        diagram:
          - s: "y dice"
            r: "main verb: and he says"
            under:
              - s: "que da estas bendiciones"
                r: "what he says, 1: that he gives these blessings"
                under:
                  - s: "por ver"
                    r: "why: because he sees"
                    under:
                      - {s: "que tiene ya en campaña a don Quijote y a Sancho", r: "what he sees: that he now has Don Quijote and Sancho out in the field"}
              - s: "y que los letores de su agradable historia pueden hacer cuenta"
                r: "what he says, 2: and that the readers of his pleasant history may reckon"
                under:
                  - {s: "que desde este punto comienzan las hazañas y donaires de don Quijote y de su escudero", r: "what they may reckon: that from now on the exploits and jokes of Don Quijote and his squire begin"}
        forms:
          - {w: "dice", f: "dic- + -e → decir (to say), present, he. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "da", f: "d- + -a → dar (to give), present, he. Irregular in the 'I' form: doy, das, da, damos, dais, dan."}
          - {w: "estas", f: "est- + -as → este (this), feminine plural to match 'bendiciones'."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, he. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "a don Quijote y a Sancho", f: "the 'a' marks people as the object of 'tiene' (he has); it is not translated."}
          - {w: "letores", f: "letor (reader) + -es, the plural of a noun in a consonant; old spelling of 'lectores'."}
          - {w: "pueden", f: "pued- + -en → poder (to be able), present, they. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "comienzan", f: "comienz- + -an → comenzar (to begin), present, they. The stem e becomes ie when stressed: comienzo, comienzas, comienza, comenzamos, comenzáis, comienzan. The subject 'las hazañas y donaires' comes after the verb."}
        note: "In Part I Don Quijote's adventures ended with his return home in a cage; Part II has spent seven chapters at home. Cide Hamete now announces that the real story starts again, as if the third sally were a new beginning."
      - es: "persuádeles que se les olviden las pasadas caballerías del ingenioso hidalgo, y pongan los ojos en las que están por venir, que desde agora en el camino del Toboso comienzan, como las otras comenzaron en los campos de Montiel, y no es mucho lo que pide para tanto como él promete; y así prosigue diciendo:"
        literal: "he-persuades-them that to-themselves to-them may-be-forgotten the past chivalries of-the ingenious gentleman, and they-may-put the eyes on those that are for to-come, which from now on the road of-the Toboso begin, as the others began in the fields of Montiel, and not is much that which he-asks for so-much as he promises; and so he-goes-on saying:"
        ormsby: "and he urges them to forget the former chivalries of the ingenious gentleman and to fix their eyes on those that are to come, which now begin on the road to El Toboso, as the others began on the plains of Montiel; nor is it much that he asks in consideration of all he promises, and so he goes on to say:"
        vocab:
          - {w: "persuadir", d: "to urge, persuade; with 'que' + subjunctive"}
          - {w: "olvidársele a uno algo", d: "to forget something (literally 'something forgets itself to one'); 'que se les olviden' = that they forget"}
          - {w: "caballerías", d: "deeds of chivalry, knightly adventures"}
          - {w: "ingenioso hidalgo", d: "'ingenious gentleman', the phrase from the title of Part I, 'El ingenioso hidalgo don Quijote de la Mancha'"}
          - {w: "poner los ojos en", d: "to fix one's eyes on, pay attention to"}
          - {w: "estar por venir", d: "to be still to come"}
          - {w: "agora", d: "= ahora, now (old form)"}
          - {w: "el Toboso", d: "El Toboso, the village in La Mancha where Dulcinea lives"}
          - {w: "campos de Montiel", d: "the plain of Montiel in La Mancha, where Don Quijote rode out on his first sally in Part I"}
          - {w: "para tanto como", d: "considering how much, in return for all that"}
          - {w: "proseguir", d: "to go on, continue"}
        diagram:
          - s: "persuádeles"
            r: "main verb 1: he urges them (the readers)"
            under:
              - {s: "que se les olviden las pasadas caballerías del ingenioso hidalgo", r: "what he urges, 1: that they forget the gentleman's past deeds of chivalry"}
              - s: "y pongan los ojos en las"
                r: "what he urges, 2: and that they fix their eyes on those"
                under:
                  - {s: "que están por venir", r: "describes 'las': which are still to come"}
                  - s: "que desde agora en el camino del Toboso comienzan"
                    r: "describes 'las', 2: which begin now on the road to El Toboso"
                    under:
                      - {s: "como las otras comenzaron en los campos de Montiel", r: "how: as the others began on the plain of Montiel"}
          - s: "y no es mucho lo"
            r: "main verb 2: and it is not much, what"
            under:
              - {s: "que pide", r: "describes 'lo': that he asks"}
              - {s: "para tanto como él promete", r: "compared with what: for all that he promises"}
          - s: "y así prosigue diciendo:"
            r: "main verb 3: and so he goes on, saying"
        forms:
          - {w: "persuádeles", f: "persuad- + -e + les → persuadir (to urge), present, he, with 'les' (them) stuck on the end, accent added to keep the stress; modern 'les persuade'. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en. Cervantes hangs the pronoun on a verb that opens a clause."}
          - {w: "se les olviden", f: "olvid- + -en → olvidarse (to be forgotten), present subjunctive, they (the deeds), with 'se' and 'les' (to them): 'that the deeds forget themselves to them', i.e. that they forget them. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. Subjunctive after a verb of urging."}
          - {w: "pasadas", f: "pas- + -adas → pasar (to pass), participle used as an adjective, feminine plural to match 'caballerías': 'past'."}
          - {w: "del", f: "de + el = del, 'of the'."}
          - {w: "pongan", f: "pong- + -an → poner (to put), present subjunctive, they (the readers), still after 'persuádeles que'. Irregular: ponga, pongas, ponga, pongamos, pongáis, pongan."}
          - {w: "están", f: "est- + -án → estar (to be), present, they. Irregular: estoy, estás, está, estamos, estáis, están. 'estar por' + infinitive = to be still to (happen)."}
          - {w: "comienzan, comenzaron", f: "comienz- + -an → comenzar (to begin), present, they: comienzo, comienzas, comienza, comenzamos, comenzáis, comienzan (stem e becomes ie when stressed). comenz- + -aron → comenzar (to begin), preterite, they: comencé, comenzaste, comenzó, comenzamos, comenzasteis, comenzaron."}
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "pide", f: "pid- + -e → pedir (to ask), present, he. The e of the stem becomes i when stressed: pido, pides, pide, pedimos, pedís, piden."}
          - {w: "promete", f: "promet- + -e → prometer (to promise), present, he. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "prosigue diciendo", f: "prosig- + -ue → proseguir (to go on), present, he: prosigo, prosigues, prosigue, proseguimos, proseguís, prosiguen (e becomes i when stressed; gu before e, g before o). + diciendo, gerund of decir (to say): 'goes on saying'."}
        note: "Cide Hamete asks his readers to forget Part I's adventures and judge the new ones; the joke is that Part I is famous and the characters themselves have just heard about it from Sansón Carrasco."
  - sentences:
      - es: "Solos quedaron don Quijote y Sancho, y, apenas se hubo apartado Sansón, cuando comenzó a relinchar Rocinante y a sospirar el rucio, que de entrambos, caballero y escudero, fue tenido a buena señal y por felicísimo agüero;"
        literal: "Alone remained Don Quijote and Sancho, and, hardly himself had moved-away Sansón, when began to neigh Rocinante and to sigh the grey, which by both, knight and squire, was held as good sign and as most-happy omen;"
        ormsby: "Don Quixote and Sancho were left alone, and the moment Samson took his departure, Rocinante began to neigh, and Dapple to sigh, which, by both knight and squire, was accepted as a good sign and a very happy omen;"
        vocab:
          - {w: "apenas ... cuando", d: "no sooner ... than; 'apenas se hubo apartado ... cuando comenzó' = the moment he had left, began"}
          - {w: "apartarse", d: "to move away, depart"}
          - {w: "relinchar", d: "to neigh"}
          - {w: "sospirar", d: "= suspirar, to sigh (old form)"}
          - {w: "el rucio", d: "'the grey', Sancho's donkey; Ormsby calls him Dapple"}
          - {w: "entrambos", d: "both (old form of 'ambos')"}
          - {w: "tener a / por", d: "to take as, consider; 'fue tenido a buena señal' = was taken as a good sign"}
          - {w: "agüero", d: "omen, augury"}
        diagram:
          - s: "Solos quedaron don Quijote y Sancho"
            r: "main verb 1: Don Quijote and Sancho were left alone"
          - s: "cuando comenzó a relinchar Rocinante y a sospirar el rucio"
            r: "main verb 2: then Rocinante began to neigh and the grey to sigh"
            under:
              - {s: "apenas se hubo apartado Sansón", r: "when: no sooner had Sansón gone"}
              - s: "que de entrambos, caballero y escudero, fue tenido"
                r: "describes the neighing and sighing: which by both, knight and squire, was taken"
                under:
                  - {s: "a buena señal y por felicísimo agüero", r: "as what: as a good sign and a most happy omen"}
        forms:
          - {w: "quedaron", f: "qued- + -aron → quedar (to remain, be left), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "Solos", f: "solo (alone) + -s, masculine plural to match 'don Quijote y Sancho'; put first for emphasis."}
          - {w: "se hubo apartado", f: "hub- + -o → haber (to have), preterite, he, + apartado, participle of apartarse (to move away), with 'se' (himself): the past anterior, 'had gone away', used after 'apenas' for something just finished. haber (to have) in the preterite: hube, hubiste, hubo, hubimos, hubisteis, hubieron."}
          - {w: "comenzó", f: "comenz- + -ó → comenzar (to begin), preterite, he (Rocinante; the grey shares the verb). Same -ar preterite: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "a relinchar, a sospirar", f: "relinchar (to neigh) and sospirar (to sigh), infinitives after 'comenzar a' (to begin to)."}
          - {w: "fue tenido", f: "fu- + -e → ser (to be), preterite, it, + tenido, participle of tener (to hold): passive, 'was held, was taken'. ser (to be) in the preterite: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "felicísimo", f: "feliz (happy) + -ísimo, 'most happy'; z becomes c before i. The suffix -ísimo means 'very, extremely'."}
        note: "In the romances the departure of a knight came with omens; here the omens are a horse's neigh and a donkey's bray. The 'sigh' of the donkey is a mock-heroic word for its braying."
      - es: "aunque, si se ha de contar la verdad, más fueron los sospiros y rebuznos del rucio que los relinchos del rocín, de donde coligió Sancho que su ventura había de sobrepujar y ponerse encima de la de su señor, fundándose no sé si en astrología judiciaria que él se sabía, puesto que la historia no lo declara;"
        literal: "although, if itself has to be-told the truth, more were the sighs and brays of-the grey than the neighs of-the nag, from where inferred Sancho that his fortune was-to surpass and put-itself above that of his master, basing-himself not I-know if on astrology judicial that he himself knew, since the history not it declares;"
        ormsby: "though, if the truth is to be told, the sighs and brays of Dapple were louder than the neighings of the hack, from which Sancho inferred that his good fortune was to exceed and overtop that of his master, building, perhaps, upon some judicial astrology that he may have known, though the history says nothing about it;"
        vocab:
          - {w: "haber de", d: "to have to, be going to; 'si se ha de contar la verdad' = if the truth must be told"}
          - {w: "rebuzno", d: "bray (of a donkey)"}
          - {w: "relincho", d: "neigh, whinny"}
          - {w: "rocín", d: "nag, hack: a poor work-horse, the word Rocinante is built on"}
          - {w: "de donde", d: "from which, whence"}
          - {w: "colegir", d: "to infer, conclude"}
          - {w: "ventura", d: "fortune, luck"}
          - {w: "sobrepujar", d: "to surpass, outdo"}
          - {w: "fundarse en", d: "to base oneself on"}
          - {w: "no sé si", d: "'I don't know whether': the narrator's shrug, 'perhaps'"}
          - {w: "astrología judiciaria", d: "judicial astrology: foretelling a person's future from the stars, as opposed to natural astrology (weather, tides); condemned by the Church"}
          - {w: "puesto que", d: "here 'although' (old sense), not 'since'"}
          - {w: "declarar", d: "to state, make clear"}
        diagram:
          - s: "más fueron los sospiros y rebuznos del rucio"
            r: "main verb: the grey's sighs and brays were more"
            under:
              - {s: "aunque, si se ha de contar la verdad", r: "linking and condition: though, if the truth is to be told"}
              - {s: "que los relinchos del rocín", r: "compared with: than the nag's neighs"}
              - s: "de donde coligió Sancho"
                r: "result: from which Sancho inferred"
                under:
                  - {s: "que su ventura había de sobrepujar y ponerse encima de la de su señor", r: "what he inferred: that his luck would outdo and rise above his master's"}
                  - s: "fundándose no sé si en astrología judiciaria"
                    r: "how: basing himself, perhaps, on judicial astrology"
                    under:
                      - {s: "que él se sabía", r: "describes 'astrología': which he knew"}
                  - {s: "puesto que la historia no lo declara", r: "concession: although the history does not say so"}
        forms:
          - {w: "se ha de contar", f: "h- + -a → haber (to have), present, it: he, has, ha, hemos, habéis, han; + de + contar (to tell): 'haber de' = must, is to. 'se' makes it passive: 'the truth is to be told'."}
          - {w: "fueron", f: "fu- + -eron → ser (to be), preterite, they. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "del", f: "de + el = del, 'of the'."}
          - {w: "coligió", f: "colig- + -ió → colegir (to infer), preterite, he. The e of the stem becomes i in the 'he' and 'they' preterite: colegí, colegiste, coligió, colegimos, colegisteis, coligieron."}
          - {w: "había de sobrepujar", f: "hab- + -ía → haber (to have), imperfect, it: había, habías, había, habíamos, habíais, habían; + de + sobrepujar (to surpass): 'was going to surpass'."}
          - {w: "ponerse", f: "poner (to put) + se (itself), infinitive also after 'había de': 'to put itself above'."}
          - {w: "la de", f: "'la' stands for 'la ventura' (the fortune): 'that of his master'."}
          - {w: "fundándose", f: "fund- + -ando + se → fundarse (to base oneself), gerund with 'se' on the end, accent added to keep the stress."}
          - {w: "sé", f: "s- + -é → saber (to know), present, I. Irregular in the 'I' form: sé, sabes, sabe, sabemos, sabéis, saben; written with an accent to tell it from 'se'."}
          - {w: "se sabía", f: "sab- + -ía → saber (to know), imperfect, he, with 'se' for emphasis ('which he knew all by himself'). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "declara", f: "declar- + -a → declarar (to state), present, it (the history). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
        note: "Sancho reads the louder bray as a sign that the squire's fortune will outshine the knight's. The narrator pretends not to know where Sancho got his astrology, a gentle mockery of the historian who knows everything."
      - es: "sólo le oyeron decir que, cuando tropezaba o caía, se holgara no haber salido de casa, porque del tropezar o caer no se sacaba otra cosa sino el zapato roto o las costillas quebradas;"
        literal: "only him they-heard say that, when he-stumbled or fell, himself he-would-have-been-glad not to-have left from home, because from-the stumbling or falling not itself got other thing but the shoe torn or the ribs broken;"
        ormsby: "all that can be said is, that when he stumbled or fell, he was heard to say he wished he had not come out, for by stumbling or falling there was nothing to be got but a damaged shoe or a broken rib;"
        vocab:
          - {w: "tropezar", d: "to stumble, trip"}
          - {w: "holgarse", d: "to be glad, take pleasure; 'se holgara no haber salido' = he would have been glad not to have come out"}
          - {w: "sacar", d: "to get, obtain (out of something); 'no se sacaba otra cosa sino' = nothing was got from it but"}
          - {w: "costillas", d: "ribs"}
          - {w: "quebrado", d: "broken"}
        diagram:
          - s: "sólo le oyeron decir"
            r: "main verb: they only heard him say"
            under:
              - s: "que, cuando tropezaba o caía, se holgara no haber salido de casa"
                r: "what he said: that when he stumbled or fell, he wished he had not left home"
                under:
                  - {s: "porque del tropezar o caer no se sacaba otra cosa", r: "why: because nothing else came of stumbling or falling"}
                  - {s: "sino el zapato roto o las costillas quebradas", r: "except what: but a torn shoe or broken ribs"}
        forms:
          - {w: "le oyeron decir", f: "oy- + -eron → oír (to hear), preterite, they (people): oí, oíste, oyó, oímos, oísteis, oyeron; + decir (to say), infinitive after a verb of hearing. 'le' (him) is the person heard."}
          - {w: "tropezaba, caía", f: "tropez- + -aba → tropezar (to stumble), imperfect, he: -aba, -abas, -aba, -ábamos, -abais, -aban. ca- + -ía → caer (to fall), imperfect, he: -ía, -ías, -ía, -íamos, -íais, -ían. The imperfect for something that happened again and again: 'whenever he stumbled'."}
          - {w: "se holgara", f: "holg- + -ara → holgarse (to be glad), imperfect subjunctive (-ra form), he, with 'se': used as a conditional, 'he would have been glad'. The -ra form of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran."}
          - {w: "haber salido", f: "haber (to have) + salido, participle of salir (to go out): the perfect infinitive, 'to have gone out'."}
          - {w: "del tropezar o caer", f: "de + el = del; the infinitives tropezar (to stumble) and caer (to fall) used as nouns with 'el': 'from stumbling or falling'."}
          - {w: "se sacaba", f: "sac- + -aba → sacar (to get), imperfect, it, with 'se' making it impersonal: 'one got'. Same -aba imperfect."}
          - {w: "roto, quebradas", f: "roto, irregular participle of romper (to tear), masculine to match 'zapato'; quebr- + -adas → quebrar (to break), participle, feminine plural to match 'costillas'."}
      - es: "y, aunque tonto, no andaba en esto muy fuera de camino. Díjole don Quijote:"
        literal: "and, although foolish, not he-was-going in this very off-of road. Said-to-him Don Quijote:"
        ormsby: "and, fool as he was, he was not much astray in this. Said Don Quixote,"
        vocab:
          - {w: "tonto", d: "foolish, simple"}
          - {w: "andar fuera de camino", d: "to be off the road, astray; 'no andaba muy fuera de camino' = he was not far wrong"}
        diagram:
          - s: "no andaba en esto muy fuera de camino"
            r: "main verb 1: he was not far wrong in this"
            under:
