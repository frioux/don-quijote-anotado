          - {w: "maliciosa", f: "malici- + -osa → malicioso (malicious), feminine to match 'sátira'; -oso makes an adjective 'full of' a noun (malicia, malice)."}
          - {w: "cortesanas", f: "cortesan- + -as → cortesano (of the court; courtesan), feminine plural to match 'damas'."}
          - {w: "puso, nombró", f: "pus- + -o → poner (to put), preterite, he; irregular: puse, pusiste, puso, pusimos, pusisteis, pusieron. nombr- + -ó → nombrar (to name), preterite, he; the preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "a una dama", f: "the 'a' marks a person as the object of 'puso' and 'nombró'."}
