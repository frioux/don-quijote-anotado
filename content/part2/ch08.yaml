          - {w: "no ... ningún", f: "Spanish keeps both negatives: 'no he dicho mal de ningún encantador' = I have not spoken ill of any enchanter. 'ningún' is ninguno clipped before a masculine singular noun."}
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "tantos", f: "tant- + -os → tanto (so much, so many), masculine plural to match 'bienes'; it sets up the result clause 'que ...'."}
          - {w: "pueda ser envidiado", f: "pued- + -a → poder (to be able), present subjunctive, I: pueda, puedas, pueda, podamos, podáis, puedan; + ser (to be) + envidiado, the participle of envidiar (to envy): the passive, 'be envied'. Subjunctive because the result is denied."}
      - es: "bien es verdad que soy algo malicioso, y que tengo mis ciertos asomos de bellaco, pero todo lo cubre y tapa la gran capa de la simpleza mía, siempre natural y nunca artificiosa."
