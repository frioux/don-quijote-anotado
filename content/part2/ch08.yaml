        ormsby: "and so I fear that in that history of my achievements which they say is now in print, if haply its author was some sage who is an enemy of mine, he will have put one thing for another, mingling a thousand lies with one truth, and amusing himself by relating transactions which have nothing to do with the sequence of a true history."
