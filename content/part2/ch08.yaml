  - sentences:
      - es: "— Sancho amigo, la noche se nos va entrando a más andar, y con más escuridad de la que habíamos menester para alcanzar a ver con el día al Toboso, adonde tengo determinado de ir antes que en otra aventura me ponga, y allí tomaré la bendición y buena licencia de la sin par Dulcinea, con la cual licencia pienso y tengo por cierto de acabar y dar felice cima a toda peligrosa aventura, porque ninguna cosa desta vida hace más valientes a los caballeros andantes que verse favorecidos de sus damas."
        literal: "— Sancho friend, the night itself on-us goes coming-in at more going, and with more darkness than that which we-had need-of to manage to see with the day [to] the Toboso, where I-have determined [of] to go before that in another adventure myself I-may-put, and there I-shall-take the blessing and good leave of the without equal Dulcinea, with the which leave I-think and I-hold as certain [of] to finish and give happy top to every perilous adventure, because no thing of-this life makes more valiant [to] the knights errant than to-see-themselves favored by their ladies."
        ormsby: "“Sancho, my friend, night is drawing on upon us as we go, and more darkly than will allow us to reach El Toboso by daylight; for there I am resolved to go before I engage in another adventure, and there I shall obtain the blessing and generous permission of the peerless Dulcinea, with which permission I expect and feel assured that I shall conclude and bring to a happy termination every perilous adventure; for nothing in life makes knights-errant more valorous than finding themselves favoured by their ladies.”"
        vocab:
          - {w: "Sancho amigo", d: "'Sancho my friend', the affectionate form of address Don Quijote uses"}
          - {w: "entrarse", d: "to come in, close in; 'la noche se nos va entrando' = night is closing in on us"}
          - {w: "a más andar", d: "at full speed, fast (literally 'at more going')"}
          - {w: "escuridad", d: "= oscuridad, darkness (old form)"}
          - {w: "haber menester", d: "to need; 'de la que habíamos menester' = than we needed"}
          - {w: "alcanzar a", d: "to manage to, succeed in"}
          - {w: "con el día", d: "by daylight, while it is still day"}
          - {w: "tener determinado de", d: "to have decided to, be resolved to"}
          - {w: "ponerse en", d: "to engage in, embark on"}
          - {w: "licencia", d: "leave, permission: a knight asked his lady's leave before an adventure"}
          - {w: "sin par", d: "peerless, matchless: Don Quijote's standing epithet for Dulcinea"}
          - {w: "tener por cierto", d: "to be certain, hold for sure"}
          - {w: "felice", d: "= feliz, happy (poetic old form)"}
          - {w: "dar cima a", d: "to complete, bring to a successful end ('cima' = summit)"}
          - {w: "caballero andante", d: "knight errant, a knight who wanders in search of adventures"}
          - {w: "favorecido de", d: "favored by; 'de' marks the agent, where modern Spanish uses 'por'"}
        diagram:
          - s: "la noche se nos va entrando"
            r: "main verb 1: night is closing in on us"
            under:
              - {s: "Sancho amigo", r: "addressed: Sancho, my friend"}
              - {s: "a más andar", r: "how: fast"}
              - s: "y con más escuridad"
                r: "how, 2: and with more darkness"
                under:
                  - s: "de la que habíamos menester"
                    r: "compared with: than we needed"
                    under:
                      - {s: "para alcanzar a ver con el día al Toboso", r: "why: to manage to see El Toboso by daylight"}
                      - s: "adonde tengo determinado de ir"
                        r: "describes 'Toboso': where I have resolved to go"
                        under:
                          - {s: "antes que en otra aventura me ponga", r: "when: before I take on another adventure"}
          - s: "y allí tomaré la bendición y buena licencia de la sin par Dulcinea"
            r: "main verb 2: and there I will take the blessing and kind leave of the peerless Dulcinea"
            under:
              - s: "con la cual licencia pienso y tengo por cierto"
                r: "describes 'licencia': with which leave I expect and am certain"
                under:
                  - {s: "de acabar y dar felice cima a toda peligrosa aventura", r: "what I am certain of: to finish and happily complete every dangerous adventure"}
              - s: "porque ninguna cosa desta vida hace más valientes a los caballeros andantes"
                r: "why: because nothing in this life makes knights errant braver"
                under:
                  - {s: "que verse favorecidos de sus damas", r: "compared with: than seeing themselves favored by their ladies"}
        forms:
          - {w: "se nos va entrando", f: "v- + -a → ir (to go), present, it (the night): voy, vas, va, vamos, vais, van; + entrando, gerund of entrar (to come in), with 'se' and 'nos' (on us) before the group: 'ir' + gerund = a gradual action, 'is closing in'."}
          - {w: "habíamos menester", f: "hab- + -íamos → haber (to have), imperfect, we: había, habías, había, habíamos, habíais, habían; + menester (need): 'we needed'."}
          - {w: "al Toboso", f: "a + el = al; the 'a' marks the object of 'ver' (to see); towns with an article keep it: 'el Toboso'."}
          - {w: "tengo determinado", f: "teng- + -o → tener (to have), present, I: tengo, tienes, tiene, tenemos, tenéis, tienen; + determinado, participle of determinar (to decide): 'I have decided', with tener (to have) in place of haber (to have) for a settled state."}
          - {w: "me ponga", f: "pong- + -a → ponerse (to put oneself), present subjunctive, I, with 'me' (myself). Irregular: ponga, pongas, ponga, pongamos, pongáis, pongan. Subjunctive after 'antes que' (before)."}
          - {w: "tomaré", f: "tomar- + -é → tomar (to take), future, I. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "la cual", f: "'which', feminine to match 'licencia'; here used as an adjective before the repeated noun, 'with which leave'."}
          - {w: "pienso", f: "piens- + -o → pensar (to think, intend), present, I. The stem e becomes ie when stressed: pienso, piensas, piensa, pensamos, pensáis, piensan."}
          - {w: "tengo", f: "teng- + -o → tener (to hold), present, I, in 'tener por cierto' (to be sure). Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "desta", f: "de + esta = desta, 'of this'; modern 'de esta'."}
          - {w: "hace", f: "hac- + -e → hacer (to make), present, it. Irregular in the 'I' form: hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "verse favorecidos", f: "ver (to see) + se (themselves), infinitive used as a noun after 'que' (than); favorecidos, participle of favorecer (to favor), masculine plural to match 'caballeros'."}
        note: "In the romances a knight set out with his lady's blessing and fought in her name; Don Quijote has never actually seen Dulcinea, whom he invented out of a peasant girl, Aldonza Lorenzo, in Part I."
  - sentences:
      - es: "— Yo así lo creo —respondió Sancho—; pero tengo por dificultoso que vuestra merced pueda hablarla ni verse con ella, en parte, a lo menos, que pueda recebir su bendición, si ya no se la echa desde las bardas del corral, por donde yo la vi la vez primera, cuando le llevé la carta donde iban las nuevas de las sandeces y locuras que vuestra merced quedaba haciendo en el corazón de Sierra Morena."
        literal: "— I so it believe —answered Sancho—; but I-hold as difficult that your grace may-be-able to-speak-to-her nor see-yourself with her, in place, at the least, that you-may-be-able to-receive her blessing, if now not to-you it she-throws from the wall-tops of-the yard, through where I her saw the time first, when to-her I-took the letter where went the news of the follies and madnesses that your grace remained doing in the heart of Sierra Morena."
        ormsby: "“So I believe,” replied Sancho; “but I think it will be difficult for your worship to speak with her or see her, at any rate where you will be able to receive her blessing; unless, indeed, she throws it over the wall of the yard where I saw her the time before, when I took her the letter that told of the follies and mad things your worship was doing in the heart of Sierra Morena.”"
        vocab:
          - {w: "tener por dificultoso", d: "to think it difficult; 'dificultoso' = difficult, hard"}
          - {w: "vuestra merced", d: "'your grace', the polite 'you' (it later shrank to 'usted'), with a 'he/she' verb"}
          - {w: "verse con", d: "to meet, have an interview with"}
          - {w: "en parte que", d: "in a place where; 'parte' = place"}
          - {w: "a lo menos", d: "at least"}
          - {w: "recebir", d: "= recibir, to receive (old spelling)"}
          - {w: "si ya no", d: "unless"}
          - {w: "bardas", d: "thatch or brushwood laid along the top of a mud wall; the top of a farmyard wall"}
          - {w: "corral", d: "farmyard, yard"}
          - {w: "nuevas", d: "news"}
          - {w: "sandez", d: "folly, piece of nonsense"}
          - {w: "Sierra Morena", d: "the mountain range between La Mancha and Andalusia, where Don Quijote did penance in Part I"}
        diagram:
          - s: "Yo así lo creo"
            r: "main verb 1: I believe so"
            under:
              - {s: "respondió Sancho", r: "inserted: Sancho answered"}
          - s: "pero tengo por dificultoso"
            r: "main verb 2: but I think it difficult"
            under:
              - s: "que vuestra merced pueda hablarla ni verse con ella"
                r: "what is difficult: that your grace can speak to her or meet her"
                under:
                  - s: "en parte, a lo menos,"
                    r: "where: in a place, at least"
                    under:
                      - {s: "que pueda recebir su bendición", r: "describes 'parte': where you could receive her blessing"}
              - s: "si ya no se la echa desde las bardas del corral"
                r: "exception: unless she throws it to you over the yard wall"
                under:
                  - {s: "por donde yo la vi la vez primera", r: "describes 'bardas': over which I saw her the first time"}
                  - s: "cuando le llevé la carta"
                    r: "when: when I took her the letter"
                    under:
                      - s: "donde iban las nuevas de las sandeces y locuras"
                        r: "describes 'carta': in which went the news of the follies and mad acts"
                        under:
                          - {s: "que vuestra merced quedaba haciendo en el corazón de Sierra Morena", r: "describes 'sandeces y locuras': which your grace was busy doing in the heart of Sierra Morena"}
        forms:
          - {w: "creo", f: "cre- + -o → creer (to believe), present, I. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "tengo", f: "teng- + -o → tener (to hold), present, I, in 'tener por' (to consider). Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "pueda", f: "pued- + -a → poder (to be able), present subjunctive, you (vuestra merced takes the 'he/she' form). The stem o becomes ue when stressed: pueda, puedas, pueda, podamos, podáis, puedan. Subjunctive after 'tengo por dificultoso que' and again after 'parte que'."}
          - {w: "hablarla", f: "hablar (to speak) + la (her), the pronoun hung on the infinitive; modern Spanish says 'hablarle' or 'hablar con ella'."}
          - {w: "verse", f: "ver (to see) + se (yourself): 'verse con' = to meet, the pronoun hung on the infinitive."}
          - {w: "recebir", f: "old spelling of recibir (to receive), infinitive after 'pueda'."}
          - {w: "se la echa", f: "ech- + -a → echar (to throw), present, she, with 'la' (it, the blessing) and 'se' (to you; 'le' becomes 'se' before 'la'). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "vi", f: "v- + -i → ver (to see), preterite, I. Irregular, with no accents: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "le llevé", f: "llev- + -é → llevar (to take), preterite, I, with 'le' (to her). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "iban", f: "ib- + -an → ir (to go), imperfect, they (the news). Irregular: iba, ibas, iba, íbamos, ibais, iban."}
          - {w: "quedaba haciendo", f: "qued- + -aba → quedar (to remain), imperfect, you (vuestra merced): -aba, -abas, -aba, -ábamos, -abais, -aban; + haciendo, gerund of hacer (to do): 'you were staying behind doing'."}
        note: "In Part I (chapters 25-31) Don Quijote sent Sancho from Sierra Morena with a letter to Dulcinea; Sancho never delivered it and invented a meeting in which she was sifting wheat in her yard. He now has to keep his lie going."
  - sentences:
      - es: "— ¿Bardas de corral se te antojaron aquéllas, Sancho —dijo don Quijote—, adonde o por donde viste aquella jamás bastantemente alabada gentileza y hermosura?"
