        vocab:
          - {w: "proseguir", d: "to go on, continue (speaking)"}
          - {w: "Julios o Agostos", d: "Julys or Augusts: Sancho turns Julius Caesar into the month of July and adds August (Augustus) to match"}
          - {w: "hazañoso", d: "valiant, given to great deeds (from 'hazaña', exploit)"}
          - {w: "ser muerto", d: "to be dead: the old use of 'ser' with 'muerto' (modern 'estar muerto')"}
          - {w: "agora", d: "= ahora, now (old form)"}
