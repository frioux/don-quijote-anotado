  - sentences:
      - es: "— Pues esta fama, estas gracias, estas prerrogativas, como llaman a esto — respondió Sancho—, tienen los cuerpos y las reliquias de los santos que, con aprobación y licencia de nuestra santa madre Iglesia, tienen lámparas, velas, mortajas, muletas, pinturas, cabelleras, ojos, piernas, con que aumentan la devoción y engrandecen su cristiana fama."
        literal: "— Well this fame, these graces, these prerogatives, as they-call [to] this —answered Sancho—, have the bodies and the relics of the saints who, with approval and licence of our holy mother Church, have lamps, candles, shrouds, crutches, paintings, heads-of-hair, eyes, legs, with which they-increase the devotion and enlarge their Christian fame."
        ormsby: "“Then this fame, these favours, these privileges, or whatever you call it,” said Sancho, “belong to the bodies and relics of the saints who, with the approbation and permission of our holy mother Church, have lamps, tapers, winding-sheets, crutches, pictures, eyes and legs, by means of which they increase devotion and add to their own Christian reputation."
        vocab:
          - {w: "gracias", d: "graces, favours (gifts of God), not 'thanks' here"}
          - {w: "prerrogativa", d: "privilege, special right"}
          - {w: "aprobación y licencia", d: "approval and permission: the Church's official sanction of a cult"}
          - {w: "nuestra santa madre Iglesia", d: "our holy mother the Church, the standard pious formula"}
          - {w: "vela", d: "candle (also 'sail' and 'vigil')"}
          - {w: "mortaja", d: "shroud, winding-sheet; hung in shrines as thank-offerings by people who had escaped death"}
          - {w: "muleta", d: "crutch; left at a shrine by someone who was cured"}
          - {w: "cabellera", d: "head of hair, a tress: hair offered at a shrine in thanks or in a vow"}
          - {w: "engrandecer", d: "to enlarge, make greater, exalt"}
        diagram:
          - s: "tienen"
            r: "main verb: have"
            under:
              - {s: "esta fama, estas gracias, estas prerrogativas", r: "object, placed first for emphasis: this fame, these favours, these privileges"}
              - {s: "como llaman a esto", r: "aside: as they call it"}
              - {s: "respondió Sancho", r: "speech tag: answered Sancho"}
              - s: "los cuerpos y las reliquias de los santos"
                r: "subject: the bodies and relics of the saints"
                under:
                  - s: "que, con aprobación y licencia de nuestra santa madre Iglesia, tienen lámparas, velas, mortajas, muletas, pinturas, cabelleras, ojos, piernas"
                    r: "describes 'santos': who, with the Church's approval, have lamps, candles, shrouds, crutches, and so on"
                    under:
                      - {s: "con que aumentan la devoción y engrandecen su cristiana fama", r: "describes the list: with which they increase devotion and enlarge their Christian fame"}
        forms:
          - {w: "esta, estas", f: "est- + -a / -as → este (this), feminine singular to match 'fama' and feminine plural to match 'gracias', 'prerrogativas'."}
          - {w: "llaman", f: "llam- + -an → llamar (to call), present, they (people in general): 'as people call it'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "tienen", f: "tien- + -en → tener (to have), present, they. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen. The first 'tienen' has its object before it and its subject after it."}
          - {w: "nuestra santa madre", f: "nuestro (our) and santo (holy), feminine to match 'madre' (the Church)."}
          - {w: "con que", f: "'with which': 'que' after a preposition as a relative, where modern Spanish prefers 'con los que'."}
          - {w: "aumentan, engrandecen", f: "aument- + -an → aumentar (to increase) and engrandec- + -en → engrandecer (to enlarge), present, they (the saints). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an; of -er verbs: engrandezco, engrandeces, engrandece, engrandecemos, engrandecéis, engrandecen (zc before o)."}
          - {w: "su cristiana fama", f: "su = singular to match 'fama', though the owners (the saints) are many: 'their Christian fame'."}
        note: "Sancho's list describes real votive offerings: churches with a miracle-working image or relic were hung with wax eyes and legs, crutches, shrouds and locks of hair left by people who believed they had been cured or saved."
