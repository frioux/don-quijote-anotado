            r: "main verb 2: Don Quijote said to him"
        forms:
          - {w: "andaba", f: "and- + -aba → andar (to go, walk), imperfect, he; here 'andar' is 'to be' (in some state). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
