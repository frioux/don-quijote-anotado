                under:
                  - {s: "siempre natural y nunca artificiosa", r: "describes 'simpleza': always natural and never put on"}
        forms:
          - {w: "es", f: "ser (to be), present, it. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "soy", f: "ser (to be), present, I. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "mis ciertos", f: "mis (my), plural to match 'asomos', + cierto (certain) in the masculine plural: possessive and 'cierto' together, an old usage modern Spanish avoids ('ciertos asomos')."}
          - {w: "todo lo cubre y tapa", f: "'todo' (everything), put first, is picked up again by 'lo' (it) before the verbs. cubr- + -e → cubrir (to cover) and tap- + -a → tapar (to hide), present, it (the cloak). The present of -ir verbs: -o, -es, -e, -imos, -ís, -en; of -ar verbs: -o, -as, -a, -amos, -áis, -an. The subject 'la gran capa' comes after."}
          - {w: "gran", f: "grande (great) clipped before a singular noun ('capa')."}
          - {w: "mía", f: "the long possessive (mine), placed after the noun for emphasis, feminine to match 'simpleza'."}
          - {w: "artificiosa", f: "artifici- + -osa → artificioso (artful), feminine to match 'simpleza'; the suffix -oso makes an adjective 'full of' a noun (artificio, artifice)."}
        note: "Sancho's 'great cloak' echoes the saying 'una buena capa todo lo tapa' (a good cloak covers everything). The self-portrait is shrewd: a peasant's pose of simplicity covers a good deal of cunning."
        ormsby_note: "Cid Hamete Benengeli might have objected with more reason to this than to Sancho's speeches in Chapter V."
      - es: "Y cuando otra cosa no tuviese sino el creer, como siempre creo, firme y verdaderamente en Dios y en todo aquello que tiene y cree la Santa Iglesia Católica Romana, y el ser enemigo mortal, como lo soy, de los judíos, debían los historiadores tener misericordia de mí y tratarme bien en sus escritos."
        literal: "And even-if other thing not I-might-have but the believing, as always I-believe, firmly and truly in God and in all that which holds and believes the Holy Church Catholic Roman, and the being enemy mortal, as it I-am, of the Jews, ought the historians to-have mercy on me and to-treat-me well in their writings."
        ormsby: "and if I had no other merit save that I believe, as I always do, firmly and truly in God, and all the holy Roman Catholic Church holds and believes, and that I am a mortal enemy of the Jews, the historians ought to have mercy on me and treat me well in their writings."
