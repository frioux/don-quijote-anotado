        forms:
          - {w: "das", f: "d- + -as → dar (to give), present, you (tú): 'you give', here in 'dar en' (to persist in). dar (to give) in the present: doy, das, da, damos, dais, dan."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "decir, pensar, creer, porfiar", f: "four infinitives after 'en' (in): decir (to say), pensar (to think), creer (to believe), porfiar (to insist). After a preposition Spanish uses the infinitive where English uses '-ing'."}
          - {w: "ahechaba", f: "ahech- + -aba → ahechar (to sift), imperfect, she: 'was sifting'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
