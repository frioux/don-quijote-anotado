        note: "Sancho is claiming to be an 'old Christian', with no Jewish or Moorish ancestors. In Cervantes' Spain such 'purity of blood' (limpieza de sangre) was a mark of honour required for many offices, and loud hostility to Jews was a common way to advertise it."
      - es: "Pero digan lo que quisieren; que desnudo nací, desnudo me hallo: ni pierdo ni gano; aunque, por verme puesto en libros y andar por ese mundo de mano en mano, no se me da un higo que digan de mí todo lo que quisieren."
        literal: "But let-them-say that which they-may-wish; for naked I-was-born, naked myself I-find: neither I-lose nor I-gain; although, for seeing-myself put in books and going about this world from hand to hand, not itself to-me gives a fig that they-say of me all that which they-may-wish."
        ormsby: "But let them say what they like; naked was I born, naked I find myself, I neither lose nor gain; nay, while I see myself put into a book and passed on from hand to hand over the world, I don’t care a fig, let them say what they like of me.”"
