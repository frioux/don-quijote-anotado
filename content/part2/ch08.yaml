  - sentences:
      - es: "— Con todo eso, vamos allá, Sancho —replicó don Quijote—, que como yo la vea, eso se me da que sea por bardas que por ventanas, o por resquicios, o verjas de jardines;"
        literal: "— With all that, let-us-go there, Sancho —replied Don Quijote—, for as-long-as I her may-see, that itself to-me gives that it-may-be through wall-tops as through windows, or through chinks, or railings of gardens;"
        ormsby: "“At all events, let us go there, Sancho,” said Don Quixote; “for, so that I see her, it is the same to me whether it be over a wall, or at a window, or through the chink of a door, or the grate of a garden;"
