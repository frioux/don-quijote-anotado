  - sentences:
      - es: "— Está bien —dijo Sancho—, pero sepamos ahora: esas sepulturas donde están los cuerpos desos señorazos, ¿tienen delante de sí lámparas de plata, o están adornadas las paredes de sus capillas de muletas, de mortajas, de cabelleras, de piernas y de ojos de cera?"
        literal: "— It-is well —said Sancho—, but let-us-know now: those tombs where are the bodies of-those great-lords, do-they-have before of themselves lamps of silver, or are adorned the walls of their chapels with crutches, with shrouds, with heads-of-hair, with legs and with eyes of wax?"
        ormsby: "“Very good,” said Sancho; “but now I want to know—the tombs where the bodies of those great lords are, have they silver lamps before them, or are the walls of their chapels ornamented with crutches, winding-sheets, tresses of hair, legs and eyes in wax?"
        vocab:
          - {w: "sepultura", d: "tomb, grave"}
          - {w: "desos", d: "= de esos, of those (old contraction)"}
          - {w: "señorazo", d: "great lord, a bigwig (the suffix -azo makes it big and a little mocking)"}
          - {w: "delante de sí", d: "in front of themselves, before them"}
          - {w: "capilla", d: "chapel, especially a side chapel in a church where someone is buried"}
          - {w: "muleta", d: "crutch"}
          - {w: "mortaja", d: "shroud, winding-sheet"}
          - {w: "cabellera", d: "head of hair, a tress of hair (offered at a shrine)"}
          - {w: "de cera", d: "made of wax"}
        diagram:
          - {s: "Está bien", r: "opening: very well"}
          - {s: "—dijo Sancho—", r: "speaker tag: said Sancho"}
          - {s: "pero sepamos ahora", r: "main verb 1: but let us know now"}
          - s: "¿tienen delante de sí lámparas de plata"
            r: "main verb 2 (the question): do they have silver lamps before them?"
            under:
              - s: "esas sepulturas"
                r: "subject, put first: those tombs"
                under:
                  - {s: "donde están los cuerpos desos señorazos", r: "describes 'sepulturas': where the bodies of those great lords lie"}
          - s: "o están adornadas las paredes de sus capillas"
            r: "main verb 3: or are the walls of their chapels decorated"
            under:
              - {s: "de muletas, de mortajas, de cabelleras, de piernas y de ojos de cera", r: "with what: with crutches, shrouds, hair, wax legs and wax eyes"}
        forms:
          - {w: "Está", f: "est- + -á → estar (to be), present, it: estoy, estás, está, estamos, estáis, están. 'Está bien' = all right."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "sepamos", f: "sep- + -amos → saber (to know), present subjunctive, we: 'let us know'. Irregular stem sep-: sepa, sepas, sepa, sepamos, sepáis, sepan."}
          - {w: "esas", f: "es- + -as → ese (that), feminine plural to match 'sepulturas'."}
          - {w: "están", f: "est- + -án → estar (to be), present, they: estoy, estás, está, estamos, estáis, están. Used twice: 'where the bodies are', and with 'adornadas' for a state, 'are decorated'."}
          - {w: "desos", f: "de + esos (of those), run together as Cervantes often writes it; modern 'de esos'."}
          - {w: "señorazos", f: "señor (lord) + -azo, the augmentative suffix (big, grand, a touch of mockery), plural."}
          - {w: "tienen", f: "tien- + -en → tener (to have), present, they (the tombs). Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "sí", f: "'themselves' after a preposition, with the accent to tell it from 'si' (if)."}
          - {w: "adornadas", f: "adorn- + -adas → adornar (to decorate), participle, feminine plural to match 'paredes'."}
        note: "Sancho lists the ex-votos of Spanish shrines: grateful pilgrims hung up crutches they no longer needed, shrouds of those who escaped death, locks of hair, and wax models of healed legs and eyes. They were signs that the person buried there was a saint working miracles."
