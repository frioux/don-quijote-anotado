                              - {s: "que Dios guarde", r: "describes 'rey': God keep him"}
        forms:
          - {w: "advierta", f: "adviert- + -a → advertir (to note), present subjunctive, you (vuestra merced), used as a polite command: 'note'. The stem e becomes ie when stressed: advierta, adviertas, advierta, advirtamos, advirtáis, adviertan. 'vuestra merced' takes the he/she form."}
          - {w: "ha poco", f: "h- + -a → haber (to have), present, it: he, has, ha, hemos, habéis, han. Old use of 'haber' for time gone by: 'ha poco' = modern 'hace poco', a short time ago."}
          - {w: "se puede decir", f: "pued- + -e → poder (to be able), present, one, with 'se' (impersonal: 'one can'), + decir (to say). The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "desta", f: "de + esta (this), feminine to match 'manera'; the old contraction, modern 'de esta'."}
          - {w: "canonizaron, beatificaron", f: "canoniz- + -aron → canonizar (to canonize) and beatific- + -aron → beatificar (to beatify), preterite, they (the authorities of the Church). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "frailecitos", f: "fraile (friar) + -cito, the diminutive suffix: 'little friars', affectionate and humble; plural with 'descalzos' to match."}
          - {w: "cuyas", f: "cuyo (whose) agrees with the thing owned, not the owner: feminine plural to match 'cadenas'."}
          - {w: "ceñían, atormentaban", f: "ceñ- + -ían → ceñir (to gird), imperfect, they: the imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían. atorment- + -aban → atormentar (to torment), imperfect, they: the imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "se tiene", f: "tien- + -e → tener (to hold), present, it, with impersonal 'se': 'it is held'. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen. The sentence loses its thread: 'cuyas cadenas' never gets its own verb and is picked up by 'besarlas' instead, as happens in speech."}
          - {w: "el besarlas y tocarlas", f: "besar (to kiss) and tocar (to touch), infinitives used as nouns with 'el', each with 'las' (them, the chains) hung on the end: 'the kissing and touching of them'."}
          - {w: "están, está", f: "est- + -án / -á → estar (to be), present, they (the chains) and it (the sword): estoy, estás, está, estamos, estáis, están."}
          - {w: "dije", f: "dij- + -e → decir (to say), preterite, I. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron. Sancho says 'as I said', though he has not mentioned the sword before; Ormsby renders it 'so it is said'."}
          - {w: "del", f: "de + el: 'of the (king)'."}
          - {w: "guarde", f: "guard- + -e → guardar (to keep, protect), present subjunctive, he (God), expressing a wish. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
        note: "Commentators identify the friars with San Diego de Alcalá, a Franciscan lay brother canonized in 1588, and probably another recent Spanish saint or beatus of the reformed orders; Ormsby's own note gives his candidates. A sword said to be Roland's was among the treasures of the royal armoury in Madrid."
        ormsby_note: "San Diego de Alcalá, canonized in 1588, and San Salvador de Orta, or San Pedro de Alcántara, in 1562."
      - es: "Así que, señor mío, más vale ser humilde frailecito, de cualquier orden que sea, que valiente y andante caballero; mas alcanzan con Dios dos docenas de diciplinas que dos mil lanzadas, ora las den a gigantes, ora a vestiglos o a endrigos."
        literal: "So that, lord mine, more is-worth to-be humble little-friar, of whatever order that it-may-be, than valiant and errant knight; more achieve with God two dozens of scourgings than two thousand lance-thrusts, whether them they-may-give to giants, or to monsters or to dragons."
        ormsby: "So that, señor, it is better to be an humble little friar of no matter what order, than a valiant knight-errant; with God a couple of dozen of penance lashings are of more avail than two thousand lance-thrusts, be they given to giants, or monsters, or dragons.”"
        vocab:
          - {w: "así que", d: "so, therefore"}
          - {w: "más vale ... que", d: "it is better ... than"}
          - {w: "orden", d: "religious order (Franciscans, Dominicans and so on); feminine in this sense in modern Spanish ('la orden'), here 'cualquier orden'"}
          - {w: "mas", d: "here = más, more (spelled without the accent in old printing; not 'but')"}
          - {w: "alcanzar con Dios", d: "to obtain from God, avail with God"}
          - {w: "diciplinas", d: "= disciplinas (old spelling): lashes of the scourge given in penance; a 'disciplina' is also the scourge itself"}
          - {w: "lanzada", d: "lance-thrust, a blow with a lance"}
          - {w: "ora ... ora", d: "whether ... or, now ... now (literary)"}
          - {w: "vestiglo", d: "monster, horrible beast (word from the romances of chivalry)"}
          - {w: "endrigo", d: "Sancho's form of 'endriago', the dragon-like monster that Amadís of Gaul slays in the romance"}
        diagram:
          - s: "más vale ser humilde frailecito"
            r: "main verb 1: it is better to be a humble little friar"
            under:
              - {s: "Así que, señor mío", r: "linking: so, my lord"}
              - {s: "de cualquier orden que sea", r: "describes 'frailecito': of whatever order it may be"}
              - {s: "que valiente y andante caballero", r: "compared with: than a valiant knight errant"}
          - s: "mas alcanzan con Dios dos docenas de diciplinas"
            r: "main verb 2: two dozen lashes obtain more from God"
            under:
              - s: "que dos mil lanzadas"
                r: "compared with: than two thousand lance-thrusts"
                under:
                  - {s: "ora las den a gigantes, ora a vestiglos o a endrigos", r: "condition: whether they are given to giants or to monsters or dragons"}
        forms:
          - {w: "vale", f: "val- + -e → valer (to be worth), present, it: valgo, vales, vale, valemos, valéis, valen. 'más vale' = it is worth more, it is better."}
          - {w: "cualquier", f: "cualquiera (any, whatever) clipped before a noun ('orden'), like buen, gran, algún."}
          - {w: "sea", f: "ser (to be), present subjunctive, it: sea, seas, sea, seamos, seáis, sean. Subjunctive after 'cualquier ... que' (whatever)."}
          - {w: "alcanzan", f: "alcanz- + -an → alcanzar (to obtain), present, they (the lashes). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "docenas", f: "docena (a dozen), plural after 'dos'."}
          - {w: "las den", f: "d- + -en → dar (to give), present subjunctive, they (people in general), with 'las' (them, the lance-thrusts) before it. dar (to give) in the present subjunctive: dé, des, dé, demos, deis, den. Subjunctive after 'ora ... ora' (whether ... or)."}
        note: "Sancho's monsters come from the romances: the Endriago is the fearsome beast, part serpent part giant, that Amadís kills in the third book of 'Amadís de Gaula'. His logic is that of the confessional: penance counts with God, feats of arms do not."
  - sentences:
      - es: "— Todo eso es así —respondió don Quijote—, pero no todos podemos ser frailes, y muchos son los caminos por donde lleva Dios a los suyos al cielo: religión es la caballería; caballeros santos hay en la gloria."
        literal: "— All that is so —answered Don Quijote—, but not all we-can be friars, and many are the roads by where leads God [to] His-own to-the heaven: religion is the chivalry; knights saintly there-are in the glory."
        ormsby: "“All that is true,” returned Don Quixote, “but we cannot all be friars, and many are the ways by which God takes his own to heaven; chivalry is a religion, there are sainted knights in glory.”"
        vocab:
          - {w: "los suyos", d: "his own, his people: those who belong to God"}
          - {w: "religión", d: "here a religious order, a rule of life (as in 'entrar en religión', to become a monk or friar), as well as 'religion'"}
          - {w: "la gloria", d: "glory, i.e. heaven, the blessed in heaven"}
        diagram:
          - {s: "Todo eso es así", r: "main verb 1: all that is so"}
          - {s: "respondió don Quijote", r: "speech tag: answered Don Quijote"}
          - {s: "pero no todos podemos ser frailes", r: "main verb 2: but we cannot all be friars"}
          - s: "y muchos son los caminos"
            r: "main verb 3: and many are the roads"
            under:
              - {s: "por donde lleva Dios a los suyos al cielo", r: "describes 'caminos': by which God leads his own to heaven"}
          - {s: "religión es la caballería", r: "main verb 4: chivalry is a religious order"}
          - {s: "caballeros santos hay en la gloria", r: "main verb 5: there are saintly knights in heaven"}
        forms:
          - {w: "es, son", f: "ser (to be), present, it and they: soy, eres, es, somos, sois, son. 'religión es la caballería' puts the predicate first for emphasis."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "podemos", f: "pod- + -emos → poder (to be able), present, we. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "lleva", f: "llev- + -a → llevar (to take, lead), present, he (God). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. The subject 'Dios' follows the verb."}
          - {w: "los suyos", f: "suyo (his) as a pronoun with 'los': 'his own (people)', masculine plural."}
          - {w: "al", f: "a + el: 'to the (heaven)'."}
          - {w: "hay", f: "hay, 'there are', the impersonal form of haber (to have); it never takes a plural: 'hay caballeros', there are knights."}
        note: "The military orders of Santiago, Calatrava and Alcántara were religious orders of knights under a rule, so 'religión es la caballería' had a real sense. Saint knights such as Saint George, Saint Martin or Saint Louis of France were familiar from churches."
