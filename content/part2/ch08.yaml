        note: "Sancho turns Don Quijote's metaphor into a weather report: the sun was clouded by the chaff from the wheat. His invented meeting from Part I (chapter 31) had Dulcinea sifting wheat in her yard, a peasant's task that Don Quijote refuses to accept."
  - sentences:
      - es: "— ¡Que todavía das, Sancho —dijo don Quijote—, en decir, en pensar, en creer y en porfiar que mi señora Dulcinea ahechaba trigo, siendo eso un menester y ejercicio que va desviado de todo lo que hacen y deben hacer las personas principales que están constituidas y guardadas para otros ejercicios y entretenimientos, que muestran a tiro de ballesta su principalidad...!"
        literal: "— That still you-give, Sancho —said Don Quijote—, in saying, in thinking, in believing and in insisting that my lady Dulcinea was-sifting wheat, being that an occupation and task which goes turned-aside from all that which do and ought to-do the persons of-rank who are constituted and kept for other occupations and pastimes, which show at shot of crossbow their rank...!"
        ormsby: "“What! dost thou still persist, Sancho,” said Don Quixote, “in saying, thinking, believing, and maintaining that my lady Dulcinea was sifting wheat, that being an occupation and task entirely at variance with what is and should be the employment of persons of distinction, who are constituted and reserved for other avocations and pursuits that show their rank a bowshot off?"
        vocab:
          - {w: "¡Que ...!", d: "an exclamation opening with 'que': 'so you still ...!', 'to think that you still ...!'"}
          - {w: "dar en", d: "to persist in, keep on (doing something), take it into one's head to"}
          - {w: "porfiar", d: "to insist stubbornly, keep arguing"}
          - {w: "ahechar", d: "to sift or winnow grain with a sieve, to clean it of chaff and dust"}
          - {w: "menester", d: "occupation, job; elsewhere 'need' ('haber menester' = to need)"}
          - {w: "ejercicio", d: "occupation, task (not 'exercise')"}
          - {w: "ir desviado de", d: "to be far removed from, at odds with (literally 'to go turned aside from')"}
          - {w: "personas principales", d: "people of rank, the gentry ('principal' = noble, distinguished)"}
          - {w: "constituido", d: "set up, established, appointed (for a purpose)"}
          - {w: "entretenimiento", d: "pastime, amusement"}
          - {w: "a tiro de ballesta", d: "'at a crossbow-shot': from far off, at a glance, plainly"}
          - {w: "principalidad", d: "rank, nobility, high standing (a rare word)"}
