  - sentences:
      - es: "— Eso me parece, Sancho —dijo don Quijote—, a lo que sucedió a un famoso poeta destos tiempos, el cual, habiendo hecho una maliciosa sátira contra todas las damas cortesanas, no puso ni nombró en ella a una dama que se podía dudar si lo era o no;"
        literal: "— That to-me seems, Sancho —said Don Quijote—, like that which happened to a famous poet of-these times, the which, having made a malicious satire against all the ladies courtesan, not put nor named in it [to] a lady who one could doubt if it she-was or not;"
        ormsby: "“That, Sancho,” returned Don Quixote, “reminds me of what happened to a famous poet of our own day, who, having written a bitter satire against all the courtesan ladies, did not insert or name in it a certain lady of whom it was questionable whether she was one or not."
        vocab:
          - {w: "parecerse a", d: "to be like, resemble; 'eso me parece a lo que sucedió' = that seems to me like what happened"}
          - {w: "destos", d: "= de estos, of these (old contraction)"}
          - {w: "malicioso", d: "malicious, spiteful, biting"}
          - {w: "sátira", d: "satire, a mocking poem attacking people by name"}
          - {w: "dama cortesana", d: "courtesan: a high-class prostitute (not 'lady of the court')"}
          - {w: "si lo era o no", d: "whether she was one or not; 'lo' stands for 'cortesana'"}
        diagram:
          - s: "Eso me parece"
            r: "main verb: that seems to me (like)"
            under:
              - {s: "dijo don Quijote", r: "aside: said Don Quijote"}
