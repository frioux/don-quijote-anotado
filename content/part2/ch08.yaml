                r: "like what: like what happened to a famous poet of our day"
                under:
                  - s: "el cual"
                    r: "describes 'poeta': who"
                    under:
                      - {s: "habiendo hecho una maliciosa sátira contra todas las damas cortesanas", r: "when: having written a spiteful satire against all the courtesans"}
                      - {s: "no puso ni nombró en ella a una dama", r: "what he did: did not put or name in it a certain lady"}
                      - {s: "que se podía dudar si lo era o no", r: "describes 'dama': about whom one could doubt whether she was one or not"}
        forms:
          - {w: "parece", f: "parec- + -e → parecer (to seem), present, it. The present of -er verbs: -o (here parezco, with z), -es, -e, -emos, -éis, -en. Cervantes uses it with 'a' for 'to resemble', modern 'parecerse a'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "sucedió", f: "suced- + -ió → suceder (to happen), preterite, it. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "destos", f: "de + estos: the old contraction of the preposition with the demonstrative; modern Spanish writes 'de estos'. estos = masculine plural to match 'tiempos'."}
          - {w: "el cual", f: "'who', masculine singular to match 'poeta'; a heavier relative than 'que', used after a comma."}
