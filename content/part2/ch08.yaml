          - {w: "deben hacer", f: "deb- + -en → deber (ought, must), present, they, + hacer (to do): 'ought to do'. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "están constituidas y guardadas", f: "est- + -án → estar (to be), present, they: estoy, estás, está, estamos, estáis, están; + two participles, constituido from constituir (to establish) and guardado from guardar (to keep), feminine plural to match 'personas'."}
