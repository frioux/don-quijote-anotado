              - s: "y todos esos caballeros hazañosos"
                r: "subject, 2: and all those valiant knights"
                under:
                  - {s: "que ha dicho", r: "describes 'caballeros': whom you have mentioned"}
                  - {s: "que ya son muertos", r: "describes 'caballeros': who are now dead"}
        forms:
          - {w: "Dígame", f: "dig- + -a + me → decir (to say), present subjunctive used as a polite command, he (vuestra merced), with 'me' stuck on the end, accent added: 'tell me'. decir (to say) in the present subjunctive: diga, digas, diga, digamos, digáis, digan."}
          - {w: "prosiguió", f: "prosigu- + -ió → proseguir (to continue), preterite, he; the stem e becomes i in this form. proseguí, proseguiste, prosiguió, proseguimos, proseguisteis, prosiguieron."}
          - {w: "esos", f: "es- + -os → ese (that), masculine plural to match 'Julios', 'caballeros'."}
          - {w: "Julios, Agostos", f: "names made plural like common nouns: 'people like Julius'."}
          - {w: "ha dicho", f: "ha → haber (to have), present, you (vuestra merced): he, has, ha, hemos, habéis, han; + dicho, irregular participle of decir (to say): 'you have spoken of'."}
          - {w: "son muertos", f: "son → ser (to be), present, they: soy, eres, es, somos, sois, son; + muertos, participle of morir (to die), masculine plural: 'are dead'."}
          - {w: "están", f: "est- + -án → estar (to be), present, they: estoy, estás, está, estamos, estáis, están."}
