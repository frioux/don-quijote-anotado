summary: |
  Cide Hamete Benengeli opens the chapter by blessing Allah three times: at last he has Don Quijote and Sancho out in the field, and he asks his readers to forget the old adventures and watch the new ones, which begin on the road to El Toboso. As soon as Sansón Carrasco leaves them, Rocinante neighs and the grey sighs, and both men take it as a lucky omen; because the donkey's brays are louder, Sancho concludes that his fortune will outdo his master's.

  Night is falling, and Don Quijote announces that before any other adventure he will go to El Toboso for Dulcinea's blessing. Sancho, who in Part I invented his meeting with her, warns that the most his master can hope for is to see her over the wall of her farmyard, where she was sifting wheat. Don Quijote insists the walls must have been the galleries of a palace, and that any ray from the sun of her beauty will make him invincible; Sancho answers that the sun was clouded by the dust from the wheat. Don Quijote blames an envious enchanter who changes everything that should give him pleasure, and fears that the author of the printed history, if he is an enemy, has mixed a thousand lies with one truth. Sancho fears his own honour is dragged through the streets in that book, though he is an old Christian and harms no one; but naked he was born, and he does not care what they say as long as he is in print.

  This sets Don Quijote off on the desire for fame. He tells of a lady who insisted on being put into a satire on courtesans, of Herostratus burning the temple of Diana to make his name live, and of a Roman gentleman who confessed to Charles V that he had been tempted to throw the emperor and himself from the skylight of the Pantheon. Horatius, Mucius, Curtius, Caesar at the Rubicon and Cortés burning his ships were all moved by fame; but Christian knights must look to eternal glory and conquer the deadly sins one by one.

  Sancho asks where those heroes are now, and whether their tombs are hung with silver lamps and wax offerings like the shrines of saints. When Don Quijote admits that raising the dead is greater than killing a giant, Sancho springs his trap: saints win more fame than knights, so they should set about becoming saints, since two barefoot friars were lately canonized and their chains are kissed more devoutly than Roland's sword. Don Quijote replies that not everyone can be a friar and that chivalry too is a religion. Talking so, they spend a night and a day without adventure, and at dusk on the next day they sight El Toboso: Don Quijote's spirits rise and Sancho's sink, since neither of them has ever seen Dulcinea. They wait in an oak grove until nightfall and then ride into the town, where things happen to them that are things indeed.
context: |
  The narrator's games. Cide Hamete Benengeli, the Moorish historian Cervantes invented in Part I, here speaks in his own voice for the first time in Part II, blessing Allah as a pious Muslim would. Having spent seven chapters at home, the story now sets out again, and the historian presents the third sally as a fresh start, comparing the road to El Toboso with the plain of Montiel where the first sally began. The characters have just learned from Sansón Carrasco that their adventures are in print, and both react as authors' subjects: Don Quijote suspects that an enemy enchanter-historian has mixed lies with the truth, and Sancho fears his honour is being dragged through the streets, yet is pleased to pass from hand to hand in a book. The closing phrase, 'cosas que a cosas llegan', promises the next chapter without telling.

  Dulcinea and Sancho's lie. In Part I Sancho was sent from Sierra Morena with a letter to Dulcinea, never delivered it, and on his return described her sifting wheat in a farmyard, smelling of sweat, a peasant girl at work. Don Quijote has never seen her either: he made her up out of Aldonza Lorenzo, a farm girl he once admired from a distance. The trip to El Toboso therefore threatens to expose both of them, which is why at the end of the chapter one is uneasy at the thought of seeing her and the other at not having seen her. Don Quijote's way out is the enchanters, who change what he should enjoy into other shapes, an excuse that will matter a great deal in what follows. The farmyard 'bardas' (walls topped with brushwood) against Don Quijote's 'galerías, corredores, lonjas' of a royal palace is the whole quarrel between village and romance in two lists.

  Poetry and history. Don Quijote reproaches Sancho with the nymphs of the Tagus in Garcilaso de la Vega's third Eclogue, who rise from the river and weave tapestries of gold, silk and pearls in a green meadow: that, and not sifting wheat, is how a lady should spend her time (Ormsby's note identifies the poem). His examples of the hunger for fame come from the classical and modern stock of moralists. Herostratus burned the temple of Artemis (Diana) at Ephesus to make his name immortal, and his name was banned in vain. The Roman Pantheon, the 'Rotunda', became the church of Saint Mary and All Martyrs, hence 'of all the saints'; Ormsby notes that Charles V's visit to its dome in 1536 is historical but that the memoirs of the time do not mention the Roman gentleman. Horatius held the bridge over the Tiber and swam back in his armour, Mucius Scaevola burned his own right hand before the Etruscan king, Curtius rode into a chasm in the Forum, Caesar crossed the Rubicon in spite of omens, and Cortés destroyed his ships at Veracruz so that his men could not turn back. Don Quijote's tomb list is equally learned: the obelisk that stood beside Saint Peter's was popularly believed to hold Caesar's ashes in the ball on its top, Hadrian's mausoleum became the Castel Sant'Angelo, and the tomb Artemisia raised for her husband Mausolus gave us the word 'mausoleum'.

  Religion. The speech turns, as sermons did, from earthly fame to eternal glory, and matches the deadly sins (pride, envy, anger, gluttony with sleep, lust, and finally idleness) each with the knightly virtue that kills it. Sancho's counter-argument rests on the everyday religion of a Spanish village: shrines whose walls were hung with silver lamps, candles, shrouds, crutches, locks of hair, and wax legs and eyes left by those who had been cured, the visible signs that the body buried there was a saint's. The 'two little barefoot friars' recently canonized or beatified are identified by Ormsby as San Diego de Alcalá (1588) and San Salvador de Orta or San Pedro de Alcántara; the penitents' iron chains and 'diciplinas' (scourgings) were objects of devotion. Sancho's boast that he is a mortal enemy of the Jews is the claim of an 'old Christian', a peasant with no Jewish or Moorish ancestry, which in the Spain of 'limpieza de sangre' (purity of blood) was a peasant's chief source of pride; Ormsby adds that Cide Hamete might have objected to Sancho's speech here with more reason than to the speeches he doubted in chapter 5. Sancho's comparison assumes that a sword said to be Roland's was among the treasures of the royal armoury, the kind of relic of chivalry that the king's collection was proud to show.

  Reading Cervantes' Spanish. Old spellings include deste, desta, destos, desto, desos (de + este etc.), letores (lectores), agora (ahora), sospirar and sospiros (suspirar), escuridad and escureció (oscuridad, oscureció), recebir (recibir), felice (feliz), estremo (extremo), arquitetura (arquitectura), efeto (efecto), mesmo (mismo), diciplinas (disciplinas), habemos (hemos) and Agostos (Augustos). Sancho's 'sorbiese' (sip up) for 'absolviese' (resolve) is corrected by Don Quijote to the old form 'asolviese', and his 'endrigos' garble 'endriagos', the dragon-monsters of Amadís. Pronouns hang on a clause-opening verb (Díjole, persuádeles, Hízolo, púsola), 'haber de' expresses what must or will happen (había de sobrepujar, hemos de matar, se ha de acabar), and 'deber de' is a guess (debían de ser, debió de ser). The future subjunctive marks an open future (quisieren, supiere, estuviere, dejaren), and the -ra form stands for a conditional (se holgara). Watch the false friends: discreción (good sense), gentileza (grace), real (royal), lonja (portico), and puesto que, which in Cervantes usually means 'although'.
