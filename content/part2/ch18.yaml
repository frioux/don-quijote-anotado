          - {w: "irse", f: "ir (to go) + se, 'to go away', the pronoun hung on the infinitive after 'para'."}
          - {w: "diciéndole", f: "diciendo + le → decir (to say), gerund, with 'le' (to him) stuck on the end; the accent is added to keep the stress."}
          - {w: "agradecía", f: "agradec- + -ía → agradecer (to thank for), imperfect, he, in reported speech. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "había recebido", f: "hab- + -ía → haber (to have), imperfect, he: había, habías, había, habíamos, habíais, habían; + recebido, old spelling of recibido, participle of recibir (to receive): 'he had received', the pluperfect."}
      - es: "pero que, por no parecer bien que los caballeros andantes se den muchas horas a ocio y al regalo, se quería ir a cumplir con su oficio, buscando las aventuras, de quien tenía noticia que aquella tierra abundaba, donde esperaba entretener el tiempo hasta que llegase el día de las justas de Zaragoza, que era el de su derecha derrota;"
        literal: "but that, for not to-seem well that the knights errant themselves give many hours to idleness and to-the luxury, himself he-wanted to-go to fulfil with his office, seeking the adventures, of which he-had news that that land abounded, where he-hoped to-pass the time until that should-arrive the day of the jousts of Saragossa, which was the [one] of his straight course;"
        ormsby: "but that, as it did not become knights-errant to give themselves up for long to idleness and luxury, he was anxious to fulfill the duties of his calling in seeking adventures, of which he was informed there was an abundance in that neighbourhood, where he hoped to employ his time until the day came round for the jousts at Saragossa, for that was his proper destination;"
        vocab:
          - {w: "parecer bien", d: "to be fitting, look right, become"}
          - {w: "darse a", d: "to give oneself up to"}
          - {w: "ocio", d: "idleness, leisure"}
