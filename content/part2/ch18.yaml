          - {w: "sea", f: "ser (to be), present subjunctive, he: sea, seas, sea, seamos, seáis, sean. Subjunctive because the poet described does not exist ('no hay poeta que no sea')."}
          - {w: "piense", f: "piens- + -e → pensar (to think), present subjunctive, he; e becomes ie when stressed: piense, pienses, piense, pensemos, penséis, piensen. Same reason for the subjunctive; the 'no' of 'no sea' carries over."}
          - {w: "es", f: "ser (to be), present, he: soy, eres, es, somos, sois, son."}
          - {w: "mayor", f: "comparative of grande (great), 'greater'; with 'el' it becomes the superlative, 'the greatest'."}
          - {w: "del", f: "de + el, 'of the'; Spanish says 'in the world' as 'del mundo'."}
  - sentences:
      - es: "— No hay regla sin excepción —respondió don Lorenzo—, y alguno habrá que lo sea y no lo piense."
        literal: "— Not there-is rule without exception —answered Don Lorenzo—, and someone there-will-be who it may-be and not it may-think."
        ormsby: "“There is no rule without an exception,” said Don Lorenzo; “there may be some who are poets and yet do not think they are.”"
        vocab:
          - {w: "no hay regla sin excepción", d: "proverb: there is no rule without an exception"}
          - {w: "alguno", d: "someone, some one (person)"}
        diagram:
          - s: "No hay regla sin excepción"
            r: "main verb 1: there is no rule without exception"
          - {s: "respondió don Lorenzo", r: "speech tag: Don Lorenzo answered"}
          - s: "y alguno habrá"
            r: "main verb 2: and there will be someone"
            under:
              - {s: "que lo sea y no lo piense", r: "describes 'alguno': who is one (a great poet) and does not think so"}
        forms:
          - {w: "hay", f: "the 'there is' form of haber (to have), present."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "habrá", f: "habr- + -á → haber (to have), future, 'there will be', here a guess: 'there must be someone'. haber in the future: habré, habrás, habrá, habremos, habréis, habrán."}
          - {w: "lo sea", f: "sea → ser (to be), present subjunctive, he: sea, seas, sea, seamos, seáis, sean; 'lo' stands for 'gran poeta': 'who is one'. Subjunctive because the person is hypothetical."}
          - {w: "no lo piense", f: "piens- + -e → pensar (to think), present subjunctive, he; e becomes ie when stressed: piense, pienses, piense, pensemos, penséis, piensen. 'lo' = it (that he is a great poet)."}
  - sentences:
      - es: "— Pocos —respondió don Quijote—; pero dígame vuesa merced: ¿qué versos son los que agora trae entre manos, que me ha dicho el señor su padre que le traen algo inquieto y pensativo?"
        literal: "— Few —answered Don Quijote—; but tell-me your grace: what verses are those that now you-bring between hands, for to-me has said the lord your father that you they-bring somewhat restless and pensive?"
        ormsby: "“Very few,” said Don Quixote; “but tell me, what verses are those which you have now in hand, and which your father tells me keep you somewhat restless and absorbed?"
        vocab:
          - {w: "agora", d: "= ahora, now (old form)"}
          - {w: "traer entre manos", d: "to have in hand, be working on"}
          - {w: "el señor su padre", d: "your father: polite way of naming the listener's relative ('su' = your, with vuesa merced)"}
          - {w: "traer inquieto", d: "to keep (someone) restless; 'traer' + adjective = to keep in a state"}
          - {w: "algo", d: "somewhat, rather (before an adjective)"}
          - {w: "pensativo", d: "pensive, absorbed in thought"}
        diagram:
          - {s: "Pocos", r: "answer, no verb: few (such poets)"}
          - {s: "respondió don Quijote", r: "speech tag: Don Quijote answered"}
          - s: "pero dígame vuesa merced:"
            r: "main verb 2: but tell me"
            under:
              - s: "¿qué versos son los"
                r: "what to tell: what verses are the ones"
                under:
                  - {s: "que agora trae entre manos", r: "describes 'los': that you are working on now"}
                  - s: "que me ha dicho el señor su padre"
                    r: "why I ask: for your father has told me"
                    under:
                      - {s: "que le traen algo inquieto y pensativo", r: "what he told: that they keep you rather restless and absorbed"}
        forms:
          - {w: "Pocos", f: "poc- + -os → poco (few), masculine plural standing for 'poetas'."}
          - {w: "dígame", f: "dig- + -a + me → decir (to say), present subjunctive, you (vuesa merced), with 'me' stuck on the end: 'tell me'. Polite commands use the present subjunctive, and the pronoun hangs on the end of a positive command. decir in the present subjunctive: diga, digas, diga, digamos, digáis, digan."}
          - {w: "son", f: "ser (to be), present, they: soy, eres, es, somos, sois, son."}
          - {w: "trae", f: "tra- + -e → traer (to bring, carry), present, you (vuesa merced). traigo, traes, trae, traemos, traéis, traen."}
          - {w: "me ha dicho", f: "h- + -a → haber (to have), present, he: he, has, ha, hemos, habéis, han; + dicho, irregular participle of decir (to say): 'has told me'."}
          - {w: "traen", f: "tra- + -en → traer (to bring), present, they (the verses): 'keep you'. traigo, traes, trae, traemos, traéis, traen."}
          - {w: "le", f: "'you' (vuesa merced, a man) as direct object: le for a male person, called leísmo; modern standard Spanish prefers 'lo'."}
          - {w: "inquieto, pensativo", f: "masculine singular, to match 'le' (Don Lorenzo)."}
      - es: "Y si es alguna glosa, a mí se me entiende algo de achaque de glosas, y holgaría saberlos;"
        literal: "And if it-is some gloss, to me myself to-me understands something of matter of glosses, and I-would-be-glad to-know-them;"
        ormsby: "If it be some gloss, I know something about glosses, and I should like to hear them;"
        vocab:
          - {w: "glosa", d: "gloss: a poem that takes a short given text (a 'mote' of a few lines) and ends each of its stanzas with one of those lines, in order"}
          - {w: "entendérsele a uno algo de", d: "to know something about, have some understanding of: 'se me entiende algo' = I know a bit"}
          - {w: "achaque", d: "here 'matter, subject' ('en achaque de' = in the matter of); usually 'ailment, infirmity'"}
          - {w: "holgar", d: "to be glad, enjoy (old-fashioned); 'holgaría' = I should be glad"}
        diagram:
          - s: "a mí se me entiende algo"
            r: "main verb 1: I understand something"
            under:
              - {s: "Y si es alguna glosa", r: "condition: and if it is a gloss"}
              - {s: "de achaque de glosas", r: "about what: in the matter of glosses"}
          - s: "y holgaría saberlos"
            r: "main verb 2: and I should be glad to know them"
        forms:
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "alguna", f: "algun- + -a → alguno (some), feminine to match 'glosa'."}
          - {w: "a mí se me entiende", f: "entiend- + -e → entender (to understand), present, it, with 'se' (impersonal) and 'me' (to me), doubled by 'a mí' for emphasis: 'it is understood by me, I know'. The stem e becomes ie when stressed: entiendo, entiendes, entiende, entendemos, entendéis, entienden."}
          - {w: "holgaría", f: "holgar- + -ía → holgar (to be glad), conditional, I: 'I should be glad'. The conditional adds endings to the whole infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "saberlos", f: "saber (to know) + los (them, the verses), the pronoun hung on the infinitive."}
      - es: "y si es que son de justa literaria, procure vuestra merced llevar el segundo premio, que el primero siempre se lleva el favor o la gran calidad de la persona, el segundo se le lleva la mera justicia, y el tercero viene a ser segundo, y el primero, a esta cuenta, será el tercero, al modo de las licencias que se dan en las universidades;"
        literal: "and if it-is that they-are of contest literary, may-try your grace to-carry-off the second prize, for the first always itself carries-off the favor or the great rank of the person, the second itself it carries-off the mere justice, and the third comes to be second, and the first, at this reckoning, will-be the third, in-the manner of the licentiate-degrees that themselves give in the universities;"
        ormsby: "and if they are for a poetical tournament, contrive to carry off the second prize; for the first always goes by favour or personal standing, the second by simple justice; and so the third comes to be the second, and the first, reckoning in this way, will be third, in the same way as licentiate degrees are conferred at the universities;"
        vocab:
          - {w: "si es que", d: "if it is the case that, if"}
          - {w: "justa literaria", d: "poetry contest: a public competition with set themes and prizes, often held for a religious feast"}
          - {w: "procurar", d: "to try, endeavour (not 'procure')"}
          - {w: "llevarse", d: "to carry off, take (a prize)"}
          - {w: "calidad", d: "rank, social standing (a false friend: not 'quality' of work)"}
          - {w: "mero", d: "mere, pure, simple"}
          - {w: "venir a ser", d: "to turn out to be, end up as"}
          - {w: "a esta cuenta", d: "by this reckoning"}
          - {w: "al modo de", d: "in the manner of, like"}
          - {w: "licencias", d: "licentiate degrees, ranked in order of merit at the graduation (where favour also counted)"}
        diagram:
          - s: "procure vuestra merced llevar el segundo premio"
            r: "main verb: try to win the second prize"
            under:
              - {s: "y si es que son de justa literaria", r: "condition: and if they are for a poetry contest"}
              - s: "que el primero siempre se lleva el favor o la gran calidad de la persona"
                r: "why, 1: for favour or rank always takes the first"
              - {s: "el segundo se le lleva la mera justicia", r: "why, 2: plain justice takes the second"}
              - {s: "y el tercero viene a ser segundo", r: "result, 1: and the third becomes really second"}
              - s: "y el primero, a esta cuenta, será el tercero"
                r: "result, 2: and the first, by this reckoning, will be third"
                under:
                  - s: "al modo de las licencias"
                    r: "how: like licentiate degrees"
                    under:
                      - {s: "que se dan en las universidades", r: "describes 'licencias': that are given in the universities"}
        forms:
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "son", f: "ser (to be), present, they (the verses): same paradigm, soy, eres, es, somos, sois, son."}
          - {w: "procure", f: "procur- + -e → procurar (to try), present subjunctive, you (vuestra merced): a polite command, 'try'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "llevar", f: "infinitive of llevar (to carry off), after 'procure'."}
          - {w: "se lleva", f: "llev- + -a → llevarse (to carry off), present, it ('el favor'), with 'se'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. Word order is object first: 'el primero' (the first prize) is the object, 'el favor' the subject."}
          - {w: "se le lleva", f: "llev- + -a → llevarse (to carry off), present, it ('la mera justicia'), with 'se'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an; 'le' repeats the object 'el segundo' (a doubling Cervantes allows; modern 'se lo lleva')."}
          - {w: "viene", f: "vien- + -e → venir (to come), present, it; 'viene a ser' = turns out to be. Irregular: vengo, vienes, viene, venimos, venís, vienen."}
          - {w: "será", f: "ser- + -á → ser (to be), future, it. The future adds endings to the whole infinitive: seré, serás, será, seremos, seréis, serán."}
          - {w: "esta", f: "est- + -a → este (this), feminine to match 'cuenta'."}
          - {w: "al", f: "a + el."}
          - {w: "se dan", f: "d- + -an → dar (to give), present, they, with 'se' making it passive: 'are given'. doy, das, da, damos, dais, dan."}
        ormsby_note: "Cervantes himself won a first prize at Saragossa in 1595."
        note: "The joke: if the first prize always goes to influence and rank, the second is the real first, and the third the real second. University licentiate degrees were ranked too, and the top places were said to go by favour."
      - es: "pero, con todo esto, gran personaje es el nombre de primero."
        literal: "but, with all this, great personage is the name of first."
        ormsby: "but, for all that, the title of first is a great distinction.”"
        vocab:
          - {w: "con todo esto", d: "for all that, nevertheless"}
          - {w: "personaje", d: "personage, a figure of importance; 'gran personaje es' = it counts for a great deal"}
        diagram:
          - s: "gran personaje es"
            r: "main verb: is a great personage (counts for a lot)"
            under:
              - {s: "pero, con todo esto", r: "linking: but, for all that"}
              - {s: "el nombre de primero", r: "subject: the title of 'first'"}
        forms:
          - {w: "gran", f: "grande (great) clipped to 'gran' before a singular noun ('personaje')."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son. The predicate 'gran personaje' comes first for emphasis, the subject 'el nombre de primero' last."}
          - {w: "esto", f: "neuter 'this', standing for everything just said; neuter demonstratives (esto, eso, aquello) refer to ideas, not nouns."}
  - sentences:
      - es: "— Hasta ahora —dijo entre sí don Lorenzo—, no os podré yo juzgar por loco; vamos adelante."
        literal: "— Until now —said between himself Don Lorenzo—, not you shall-be-able I to-judge as mad; let-us-go forward."
        ormsby: "“So far,” said Don Lorenzo to himself, “I should not take you to be a madman; but let us go on.”"
        vocab:
          - {w: "entre sí", d: "to himself, under his breath"}
          - {w: "juzgar por", d: "to judge to be, take for"}
          - {w: "vamos adelante", d: "let's go on, let's see more"}
        diagram:
          - s: "no os podré yo juzgar por loco"
            r: "main verb 1: I shall not be able to judge you mad"
            under:
              - {s: "Hasta ahora", r: "when: so far"}
              - {s: "dijo entre sí don Lorenzo", r: "speech tag: Don Lorenzo said to himself"}
          - {s: "vamos adelante", r: "main verb 2: let us go on"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "os", f: "'you', object form of vos: Don Lorenzo, speaking to himself, addresses Don Quijote as 'vos' rather than the politer 'vuesa merced'."}
          - {w: "podré", f: "podr- + -é → poder (to be able), future, I. Irregular stem podr-: podré, podrás, podrá, podremos, podréis, podrán."}
          - {w: "juzgar", f: "infinitive of juzgar (to judge), after 'podré'."}
          - {w: "vamos", f: "v- + -amos → ir (to go), present, we, used as 'let's go'. ir in the present: voy, vas, va, vamos, vais, van."}
  - sentences:
      - es: "Y díjole:"
        literal: "And he-said-to-him:"
        ormsby: "So he said to him,"
        vocab:
          - {w: "díjole", d: "= le dijo, he said to him (pronoun hung on the end)"}
        diagram:
          - s: "Y díjole:"
            r: "main verb: and he said to him (Don Lorenzo to Don Quijote)"
        forms:
          - {w: "díjole", f: "dij- + -o + le → decir (to say), preterite, he, with 'le' (to him) stuck on the end; modern 'le dijo'. Cervantes often hangs the pronoun on a verb that opens its clause. decir in the preterite: dije, dijiste, dijo, dijimos, dijisteis, dijeron. The accent is added to keep the stress on 'dí-'."}
  - sentences:
      - es: "— Paréceme que vuesa merced ha cursado las escuelas: ¿qué ciencias ha oído?"
        literal: "— It-seems-to-me that your grace has attended the schools: what sciences have-you heard?"
        ormsby: "“Your worship has apparently attended the schools; what sciences have you studied?”"
        vocab:
          - {w: "paréceme", d: "= me parece, it seems to me"}
          - {w: "cursar", d: "to study, attend (courses at a university)"}
          - {w: "las escuelas", d: "the schools: the university"}
          - {w: "ciencia", d: "science in the old broad sense: any field of learning (law, theology, medicine)"}
          - {w: "oír", d: "to hear; here 'to study under', to attend lectures in: students 'heard' a subject"}
        diagram:
          - s: "Paréceme"
            r: "main verb 1: it seems to me"
            under:
              - {s: "que vuesa merced ha cursado las escuelas", r: "what seems: that you have attended the university"}
          - s: "¿qué ciencias ha oído?"
            r: "main verb 2, a question: what sciences have you studied?"
        forms:
          - {w: "Paréceme", f: "parec- + -e + me → parecer (to seem), present, it, with 'me' (to me) stuck on the end; modern 'me parece'. Cervantes hangs the pronoun on a verb that opens the sentence. parezco, pareces, parece, parecemos, parecéis, parecen."}
          - {w: "ha cursado", f: "h- + -a → haber (to have), present, you (vuesa merced): he, has, ha, hemos, habéis, han; + cursado, participle of cursar (to study): 'have studied'."}
          - {w: "ha oído", f: "ha (haber (to have), present, you: he, has, ha, hemos, habéis, han) + oído, participle of oír (to hear), with an accent to keep the i separate: 'have heard', i.e. studied."}
  - sentences:
      - es: "— La de la caballería andante —respondió don Quijote—, que es tan buena como la de la poesía, y aun dos deditos más."
        literal: "— That of the chivalry errant —answered Don Quijote—, which is as good as that of the poetry, and even two little-fingers more."
        ormsby: "“That of knight-errantry,” said Don Quixote, “which is as good as that of poetry, and even a finger or two above it.”"
        vocab:
          - {w: "caballería andante", d: "knight-errantry, the profession of the wandering knight"}
          - {w: "tan ... como", d: "as ... as"}
          - {w: "aun", d: "even (without accent)"}
          - {w: "dos deditos más", d: "a couple of little fingers more: a little bit better, a notch above"}
        diagram:
          - s: "La de la caballería andante"
            r: "answer, verb understood: (I have studied) the science of knight-errantry"
            under:
              - {s: "respondió don Quijote", r: "speech tag: Don Quijote answered"}
              - {s: "que es tan buena como la de la poesía", r: "describes 'la' (the science): which is as good as that of poetry"}
              - {s: "y aun dos deditos más", r: "and even: a couple of fingers better"}
        forms:
          - {w: "La de", f: "'la' stands for 'la ciencia' (feminine): 'the one of', 'that of'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "buena", f: "buen- + -a → bueno (good), feminine to match 'ciencia'."}
          - {w: "deditos", f: "ded- + -ito + -s → dedo (finger) with the diminutive -ito, plural: 'little fingers'."}
  - sentences:
      - es: "— No sé qué ciencia sea ésa —replicó don Lorenzo—, y hasta ahora no ha llegado a mi noticia."
        literal: "— Not I-know what science may-be that —replied Don Lorenzo—, and until now not it-has arrived to my knowledge."
        ormsby: "“I do not know what science that is,” said Don Lorenzo, “and until now I have never heard of it.”"
        vocab:
          - {w: "replicar", d: "to reply, answer back"}
          - {w: "llegar a la noticia de uno", d: "to come to someone's knowledge, be heard of"}
        diagram:
          - s: "No sé"
            r: "main verb 1: I do not know"
            under:
              - {s: "qué ciencia sea ésa", r: "what: what science that is"}
              - {s: "replicó don Lorenzo", r: "speech tag: Don Lorenzo replied"}
          - s: "y hasta ahora no ha llegado a mi noticia"
            r: "main verb 2: and so far it has not come to my knowledge"
        forms:
          - {w: "sé", f: "saber (to know), present, I. Irregular: sé, sabes, sabe, sabemos, sabéis, saben. The accent tells it apart from 'se'."}
          - {w: "sea", f: "ser (to be), present subjunctive, it: sea, seas, sea, seamos, seáis, sean. The subjunctive after 'no sé qué' stresses doubt about whether such a thing exists; modern Spanish would usually say 'qué ciencia es ésa'."}
          - {w: "ésa", f: "es- + -a → ese (that), feminine to match 'ciencia', with the accent once used on demonstratives standing alone as pronouns."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "ha llegado", f: "h- + -a → haber (to have), present, it: he, has, ha, hemos, habéis, han; + llegado, participle of llegar (to arrive): 'has come'."}
  - sentences:
      - es: "— Es una ciencia —replicó don Quijote— que encierra en sí todas o las más ciencias del mundo, a causa que el que la profesa ha de ser jurisperito, y saber las leyes de la justicia distributiva y comutativa, para dar a cada uno lo que es suyo y lo que le conviene;"
        literal: "— It-is a science —replied Don Quijote— which encloses in itself all or the most sciences of-the world, by reason that he who it professes has to be jurist, and to-know the laws of the justice distributive and commutative, in-order to-give to each one that which is his and that which to-him is-fitting;"
        ormsby: "“It is a science,” said Don Quixote, “that comprehends in itself all or most of the sciences in the world, for he who professes it must be a jurist, and must know the rules of justice, distributive and equitable, so as to give to each one what belongs to him and is due to him."
        vocab:
          - {w: "replicar", d: "to reply, answer back"}
          - {w: "encerrar en sí", d: "to contain, comprise within itself"}
          - {w: "las más", d: "most (of them)"}
          - {w: "a causa que", d: "= a causa de que, because"}
          - {w: "profesar", d: "to profess, practise (a calling); also to profess a faith"}
          - {w: "haber de", d: "to have to, must"}
          - {w: "jurisperito", d: "jurist, expert in law (learned word)"}
          - {w: "justicia distributiva", d: "distributive justice: giving rewards and burdens in proportion to merit (Aristotle's term)"}
          - {w: "comutativa", d: "= conmutativa, commutative justice: fairness in exchanges and contracts between persons"}
          - {w: "convenir", d: "to be due, be fitting; 'lo que le conviene' = what is due to him"}
        diagram:
          - s: "Es una ciencia"
            r: "main verb: it is a science"
            under:
              - {s: "replicó don Quijote", r: "speech tag: Don Quijote replied"}
              - {s: "que encierra en sí todas o las más ciencias del mundo", r: "describes 'ciencia': which contains all or most of the sciences in the world"}
              - s: "a causa que el que la profesa ha de ser jurisperito"
                r: "why: because whoever practises it must be a jurist"
                under:
                  - s: "y saber las leyes de la justicia distributiva y comutativa"
                    r: "must, 2: and know the laws of distributive and commutative justice"
                    under:
