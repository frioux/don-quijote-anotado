summary: |
  Don Quijote reaches the house of Don Diego de Miranda, the Knight of the Green Coat: a roomy village house with the family arms carved over the door and, in the cellar, earthenware wine jars from El Toboso. The jars remind him of his enchanted Dulcinea, and he sighs out a line of Garcilaso. Don Diego's wife, Doña Cristina, and his son, Don Lorenzo, the student poet, receive him courteously and are astonished at his figure. Sancho takes off his armour, and Don Quijote washes the last of the curds out of his hair in five or six cauldrons of water.

  Don Lorenzo asks his father what to make of their guest; Don Diego says he has seen him do the acts of a madman and speak like a wise man, and tells his son to sound him out. In conversation Don Quijote talks sensibly about poetry and prizes, then declares that his own science is knight-errantry, which contains all the others: law, theology, medicine, astronomy, mathematics, swimming, shoeing a horse, and every virtue. When Don Lorenzo doubts that knights-errant ever existed, Don Quijote prays heaven to free him from the error, and Don Lorenzo concludes that he is a madman full of lucid intervals.

  After a good dinner in a silence like a Carthusian monastery's, Don Lorenzo recites a gloss he has written for a poetry contest, and then a sonnet on Pyramus and Thisbe. Don Quijote praises him to the skies as the best poet in the world, and the narrator remarks on the power of flattery, since Don Lorenzo is pleased though he thinks his admirer mad.

  After four days of hospitality Don Quijote takes his leave, announcing that he will seek adventures in the region, visit the cave of Montesinos and the lagoons of Ruidera, and then go on to the jousts at Saragossa. Sancho is sorry to leave the plenty of the house but fills his saddlebags. Don Quijote advises Don Lorenzo to leave the narrow path of poetry for the narrower one of knight-errantry, and to trust other people's judgement of his verses more than his own. Father and son marvel once more at his mixture of sense and nonsense, and knight and squire ride away.
context: |
  The house of a rich gentleman-farmer. Don Diego's house is 'ancha como de aldea', roomy in the village way, and the narrator sums it up as the house of a 'caballero labrador y rico', a gentleman who lives off his own land. The family arms carved in rough stone over the street door mark it as the home of hidalgos; Ormsby notes that many houses in the old towns of northern and central Spain are still decorated in this way. The wine store is in the patio and the cellar opens off the entrance hall, ringed with big earthenware jars, the 'tinajas', which come from El Toboso, a village known for making them. Don Quijote's indoor dress is that of a gentleman of modest means: wide Walloon breeches (valones), a chamois doublet stained by the armour, a plain student's collar without starch or lace, a short cape (herreruelo) of good brown cloth, and his sword on a baldric of sealskin. The text says it is 'opinion' that he suffered from the kidneys; Ormsby explains that a baldric over the shoulder was easier to wear for such a sufferer than an ordinary sword-belt, and denies that the sealskin was a remedy in itself.

  The narrator's games. The author, we are told, described the whole house in detail, but 'the translator of this history' cut the description as a cold digression from the truth; Ormsby calls it a hit at the long-windedness of the romances of chivalry and of more modern books. The mock-scholarly doubt about whether Don Quijote needed five cauldrons of water or six, 'for there is some difference' about the number, plays the same game with sources. The water still comes out the colour of whey, a last echo of Sancho's curds in the previous chapter.

  Garcilaso, Virgil and Horace. Don Quijote's sigh at the jars is the opening of Garcilaso de la Vega's tenth sonnet, 'Oh dulces prendas, por mi mal halladas', which, as Ormsby notes, imitates the words of Virgil's Dido over the keepsakes Aeneas left her (Aeneid IV: 'dulces exuviae, dum fata deusque sinebant'). Turning the sweet keepsakes into wine jars from El Toboso is the joke. The poets who refuse to recite when asked and will not stop when not asked come, as Ormsby's note shows, from Horace (Satires I.3), and Ormsby connects 'poetas consumidos' with Horace's 'irritable race of poets'. Don Quijote's parting wish to teach Don Lorenzo 'to spare the humble and trample the proud' translates Virgil's line on Rome's mission, 'parcere subiectis et debellare superbos' (Aeneid VI).

  Poetry contests and the gloss. A 'justa literaria' or 'justa poética' was a public poetry competition, often held for a religious feast, with set themes and prizes. Ormsby notes that Cervantes himself won a first prize at Saragossa in 1595, which gives an edge to Don Quijote's theory that the first prize goes by favour, the second by justice. His comparison is with the order of merit in which university licentiates were ranked. The 'glosa' was a favourite exercise of Spanish poets of the sixteenth and seventeenth centuries: a short text, here four lines, is expanded into stanzas each ending with one of its lines in order. Don Quijote's friend lists its rules: no questions, no 'said I' or 'I will say', no turning verbs into nouns, no change of meaning. Ormsby's note traces the debate over its origins. Don Lorenzo's gloss, in four ten-line stanzas, is a lament on Fortune and lost happiness built on the conceit of verbs as nouns ('my was', 'is', 'will be').

  The sonnet on Pyramus and Thisbe. The story is Ovid's (Metamorphoses IV): two Babylonian lovers forbidden to meet speak through a crack in the wall between their houses, arrange a meeting at a tomb, and die there, he believing her killed by a lion, she on his sword. Don Lorenzo's sonnet crams it into fourteen lines of puns ('estrecho estrecho', 'a strait so strait') and a final line of three nouns matching three verbs (a sword kills, a tomb hides, a memory revives). Ormsby takes it as a caricature, 'by no means an overcharged one', of the 'culto' style of Góngora's followers; Don Quijote takes it as the work of a consummate poet.

  Knight-errantry as the science of sciences. Don Quijote's list of what a knight must know runs from law, with the scholastic distinction between distributive and commutative justice (giving each his due by merit, and in exchanges), through theology, medicine and herb lore, astronomy and mathematics, to swimming and horseshoeing, and ends with the three theological virtues (faith, hope and charity) and the four cardinal ones (prudence, justice, fortitude, temperance). The swimmer 'el peje Nicolás' is, Ormsby notes, the legendary Pesce Cola, Nicholas the Fish, a Sicilian of Catania said to have lived in the sea. Don Lorenzo's verdict on his guest, 'un entreverado loco, lleno de lúcidos intervalos', uses a word for bacon streaked fat and lean, as Ormsby explains; in the same speech the 'borrador', the rough draft of his madness, is something no doctors or good scribes could make a fair copy of.

  Where next. Don Quijote's plan names the cave of Montesinos and the lagoons of Ruidera, in La Mancha, places tied to the old ballads of Montesinos and Durandarte, and the jousts at Saragossa that Sansón Carrasco mentioned earlier in Part II. Ormsby suggests that the 'discreet' Don Diego is set beside Don Quijote as a deliberate contrast, a sensible country gentleman entertaining a mad one.

  Reading Cervantes' Spanish. The archaisms of this chapter: sospirando (suspirando), recebir and recebid (recibir), estraño (extraño), camuza (gamuza), agora (ahora), comutativa (conmutativa), yerbas (hierbas), decendiendo (descendiendo), peje (pez), ginasios (gimnasios), vees (ves), vitoria (victoria), estendido and estiendes (extendido, extiendes), juridición (jurisdicción), inacesible (inaccesible), entrambos (ambos), plega (plazca), and the contractions desta, deste, dellas and dél. Pronouns hang on the end of verbs that open a clause (Oyóle, desarmóle, Ciñóse, cubrióse, díjole, Paréceme, Llegóse, Reiteráronse), and on commands (háblale, Decidme, vuélveme). The future subjunctive marks open futures and conditions (estuviere, fuere, quisiere, quitaren), the -ra form serves as a conditional (fuera, fueran), and 'haber de' means 'must' all through the list of a knight's sciences (ha de ser jurisperito, ha de saber nadar). Don Diego speaks to his son as tú, Don Quijote and Don Lorenzo use vuesa merced, and Don Quijote's enthusiasm shifts him into vos ('sois el mejor poeta del orbe'). Watch the false friends: discreto (wise), razones (words), calidad (rank), bizarro (splendid), generoso (noble), honesto (decorous), derrota (route), tema (obsession), blanco (target) and discurso (reasoning).
