          - {w: "interrogante", d: "question, a sentence in the form of a question"}
          - {w: "ni dijo, ni diré", d: "neither 'he said' nor 'I shall say': quoting phrases were barred from a gloss"}
          - {w: "nombre", d: "here 'noun', the grammarians' term"}
          - {w: "mudar", d: "to change, alter"}
          - {w: "sentido", d: "sense, meaning"}
