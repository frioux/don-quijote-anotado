  - sentences:
      - es: "El muro rompe la doncella hermosa que de Píramo abrió el gallardo pecho: parte el Amor de Chipre, y va derecho a ver la quiebra estrecha y prodigiosa."
        literal: "The wall breaks the maiden beautiful who of Pyramus opened the gallant breast: sets-out the Love from Cyprus, and goes straight to see the crack narrow and prodigious."
        ormsby: "The lovely maid, she pierces now the wall; / Heart-pierced by her young Pyramus doth lie; / And Love spreads wing from Cyprus isle to fly, / A chink to view so wondrous great and small."
        ormsby_match: false
        vocab:
          - {w: "muro", d: "wall (here the wall between the lovers' houses)"}
          - {w: "doncella", d: "maiden: Thisbe"}
          - {w: "gallardo", d: "gallant, fine, handsome"}
          - {w: "abrir el pecho", d: "to open the breast: to wound with love, and also, darkly, the sword wound that will kill Pyramus"}
          - {w: "partir de", d: "to set out from"}
          - {w: "el Amor", d: "Love, i.e. Cupid, son of Venus, whose island is Cyprus"}
          - {w: "derecho", d: "straight, directly"}
          - {w: "quiebra", d: "crack, breach, chink"}
          - {w: "prodigioso", d: "marvellous, prodigious"}
        diagram:
          - s: "El muro rompe la doncella hermosa"
            r: "main verb 1: the beautiful maiden breaks the wall (object first)"
            under:
              - {s: "que de Píramo abrió el gallardo pecho", r: "describes 'doncella': who opened Pyramus' gallant breast"}
          - s: "parte el Amor de Chipre"
            r: "main verb 2: Love sets out from Cyprus"
          - s: "y va derecho"
            r: "main verb 3: and goes straight"
            under:
              - {s: "a ver la quiebra estrecha y prodigiosa", r: "why: to see the narrow, marvellous crack"}
        forms:
          - {w: "rompe", f: "romp- + -e → romper (to break), present, she. The present of -er verbs: -o, -es, -e, -emos, -éis, -en. The object 'El muro' comes first and the subject last, a Latin-style order that makes the line hard to parse."}
          - {w: "abrió", f: "abr- + -ió → abrir (to open), preterite, she. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "parte", f: "part- + -e → partir (to set out), present, he (Love). The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "va", f: "ir (to go), present, he. Irregular: voy, vas, va, vamos, vais, van."}
          - {w: "estrecha y prodigiosa", f: "estrech- + -a → estrecho (narrow) and prodigios- + -a → prodigioso (marvellous), feminine to match 'quiebra'."}
        note: "In Ovid the crack was already in the wall; here the maiden 'breaks' it, a muddle typical of the sonnet. The pile-up of inverted word order is part of the joke."
      - es: "Habla el silencio allí, porque no osa la voz entrar por tan estrecho estrecho; las almas sí, que amor suele de hecho facilitar la más difícil cosa."
        literal: "Speaks the silence there, because not dares the voice to-enter through so narrow [a] strait; the souls yes, for love is-wont in fact to-make-easy the most difficult thing."
        ormsby: "There silence speaketh, for no voice at all / Can pass so strait a strait; but love will ply / Where to all other power ’twere vain to try; / For love will find a way whate’er befall."
        ormsby_match: false
        vocab:
          - {w: "osar", d: "to dare"}
          - {w: "estrecho estrecho", d: "a pun: 'so narrow a strait', 'estrecho' as adjective (narrow) and noun (strait, narrow passage)"}
          - {w: "las almas sí", d: "the souls do (enter): 'sí' answers the 'no' of the voice"}
          - {w: "de hecho", d: "in fact, indeed; also 'in deed', by action"}
          - {w: "facilitar", d: "to make easy"}
        diagram:
          - s: "Habla el silencio allí"
            r: "main verb 1: silence speaks there"
            under:
              - {s: "porque no osa la voz entrar por tan estrecho estrecho", r: "why: because the voice dares not enter through so narrow a strait"}
          - s: "las almas sí"
            r: "main clause 2, verb understood: the souls do (enter)"
            under:
              - {s: "que amor suele de hecho facilitar la más difícil cosa", r: "why: for love usually makes the hardest thing easy"}
        forms:
          - {w: "Habla", f: "habl- + -a → hablar (to speak), present, it (silence). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "osa", f: "os- + -a → osar (to dare), present, it (the voice). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "entrar", f: "infinitive of entrar (to enter) after 'osa'."}
          - {w: "suele", f: "suel- + -e → soler (to be in the habit of), present, he (love). The stem o becomes ue when stressed: suelo, sueles, suele, solemos, soléis, suelen. Always followed by an infinitive ('suele facilitar')."}
          - {w: "la más difícil cosa", f: "superlative: article + más + adjective, 'the most difficult'; the adjective placed before the noun, as poetry allows."}
        note: "'Silence speaks': the lovers whisper, or speak with their souls, through a gap too narrow for a voice. The paradoxes and the 'estrecho estrecho' pun are the overwrought wit Cervantes is mocking."
      - es: "Salió el deseo de compás, y el paso de la imprudente virgen solicita por su gusto su muerte; ved qué historia: que a entrambos en un punto, ¡oh estraño caso!, los mata, los encubre y resucita una espada, un sepulcro, una memoria."
        literal: "Went-out the desire of measure, and the step of the imprudent virgin seeks by her pleasure her death; see what story: that to both in one instant, oh strange case!, them kills, them hides and revives a sword, a tomb, a memory."
        ormsby: "Impatient of delay, with reckless pace / The rash maid wins the fatal spot where she / Sinks not in lover’s arms but death’s embrace. / So runs the strange tale, how the lovers twain / One sword, one sepulchre, one memory, / Slays, and entombs, and brings to life again."
        ormsby_match: false
        vocab:
          - {w: "salir de compás", d: "to go out of measure, lose all restraint (from music: to go out of time)"}
          - {w: "solicitar", d: "to seek, bring about, court"}
          - {w: "por su gusto", d: "by her own wish, of her own accord"}
          - {w: "entrambos", d: "both (old form of 'ambos')"}
          - {w: "en un punto", d: "in one instant, at the same moment"}
          - {w: "caso", d: "event, happening; '¡oh estraño caso!' = oh strange event!"}
          - {w: "estraño", d: "= extraño, strange (old spelling)"}
          - {w: "encubrir", d: "to cover, hide"}
          - {w: "sepulcro", d: "tomb, sepulchre"}
        diagram:
          - s: "Salió el deseo de compás"
            r: "main verb 1: desire went out of measure"
          - s: "y el paso de la imprudente virgen solicita"
            r: "main verb 2: and the rash maiden's step seeks"
            under:
              - {s: "por su gusto", r: "how: of her own will"}
              - {s: "su muerte", r: "object: her death"}
          - s: "ved qué historia:"
            r: "main verb 3: see what a story"
            under:
              - s: "que a entrambos ... los mata, los encubre y resucita"
                r: "what the story is: that both of them are killed, hidden and brought back to life"
                under:
                  - {s: "en un punto", r: "when: at one stroke"}
                  - {s: "¡oh estraño caso!", r: "exclamation: oh strange event!"}
                  - {s: "una espada, un sepulcro, una memoria", r: "subjects, one for each verb: a sword (kills), a tomb (hides), a memory (revives)"}
        forms:
          - {w: "Salió", f: "sal- + -ió → salir (to go out), preterite, it (desire). The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "solicita", f: "solicit- + -a → solicitar (to seek), present, it (the step). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "ved", f: "ve- + -d → ver (to see), imperative, you (vosotros, the hearers): 'see!'. The vosotros imperative swaps the final -r of the infinitive for -d: ved, mirad, oíd."}
          - {w: "a entrambos ... los", f: "'a entrambos' (both) is the object, then repeated by the pronoun 'los' before each verb: 'both of them ... kills them, hides them'."}
          - {w: "mata, encubre, resucita", f: "mat- + -a → matar (to kill): -o, -as, -a, -amos, -áis, -an; encubr- + -e → encubrir (to hide): -o, -es, -e, -imos, -ís, -en; resucit- + -a → resucitar (to revive): -o, -as, -a, -amos, -áis, -an. All present, it, each with its own subject from the last line in order: the sword kills, the tomb hides, the memory revives."}
          - {w: "estraño", f: "old spelling of extraño (strange), masculine to match 'caso'."}
        note: "The last line pairs off with the verbs before it, a favourite device of the 'culto' poets: sword kills, tomb hides, memory revives. In Ovid, Thisbe arrives first at the meeting place, flees a lioness, and Pyramus, finding her bloodied veil, kills himself; she then dies on the same sword."
        ormsby_note: "This sonnet is a caricature, and by no means an overcharged one, of the sonnet style of the Culto school, which at this time had nearly attained its highest influence. Indeed, it might easily pass muster as a fair specimen, not perhaps of Góngora, but of any of the minor cultoristas."
  - sentences:
      - es: "— ¡Bendito sea Dios! —dijo don Quijote habiendo oído el soneto a don Lorenzo—, que entre los infinitos poetas consumidos que hay, he visto un consumado poeta, como lo es vuesa merced, señor mío; que así me lo da a entender el artificio deste soneto."
        literal: "— Blessed be God! — said Don Quijote having heard the sonnet from Don Lorenzo —, that among the infinite poets consumed that there-are, I-have seen a consummate poet, as it you-are your grace, sir my; for so to-me it gives to understand the artifice of-this sonnet."
        ormsby: "“Blessed be God,” said Don Quixote when he had heard Don Lorenzo’s sonnet, “that among the hosts there are of irritable poets I have found one consummate one, which, señor, the art of this sonnet proves to me that you are!”"
        vocab:
          - {w: "¡Bendito sea Dios!", d: "blessed be God!, thank God!"}
          - {w: "oír a", d: "to hear from; 'oído el soneto a don Lorenzo' = heard the sonnet from Don Lorenzo"}
          - {w: "consumido", d: "consumed, worn out, wasted; also fretful, irritable (a pun with 'consumado')"}
          - {w: "consumado", d: "consummate, perfect, accomplished"}
          - {w: "vuesa merced", d: "your grace, your worship (old form of 'vuestra merced', the polite 'you'; takes the verb of 'he')"}
          - {w: "dar a entender", d: "to make understand, show"}
          - {w: "artificio", d: "art, craft, skill (not 'artifice' in the bad sense)"}
          - {w: "deste", d: "= de este, of this (old contraction)"}
        diagram:
          - s: "¡Bendito sea Dios!"
            r: "main verb: blessed be God"
            under:
              - s: "dijo don Quijote"
                r: "speech tag: said Don Quijote"
                under:
                  - {s: "habiendo oído el soneto a don Lorenzo", r: "when: having heard the sonnet from Don Lorenzo"}
              - s: "que entre los infinitos poetas consumidos que hay, he visto un consumado poeta"
                r: "why God be blessed: that among the countless worn-out poets I have seen a perfect one"
                under:
                  - {s: "como lo es vuesa merced, señor mío", r: "describes 'consumado poeta': as your worship is, my lord"}
              - {s: "que así me lo da a entender el artificio deste soneto", r: "why: for the skill of this sonnet tells me so"}
        forms:
          - {w: "Bendito sea", f: "bendito, old participle of bendecir (to bless), masculine to match 'Dios'; + sea → ser (to be), present subjunctive, he, a wish: 'blessed be'. sea, seas, sea, seamos, seáis, sean."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "habiendo oído", f: "habiendo, gerund of haber (to have), + oído, participle of oír (to hear): 'having heard', the perfect gerund."}
          - {w: "hay", f: "the 'there is / there are' form of haber (to have), present; with plural 'poetas' it means 'there are'."}
          - {w: "he visto", f: "he → haber (to have), present, I: he, has, ha, hemos, habéis, han; + visto, the irregular participle of ver (to see): 'I have seen', the perfect."}
          - {w: "consumidos, consumado", f: "consum- + -idos → consumir (to consume), participle, masculine plural to match 'poetas'; consum- + -ado → consumar (to complete, perfect), participle, masculine singular to match 'poeta'. Two different verbs with the same stem: the pun is the point."}
          - {w: "lo es", f: "es → ser (to be), present, he (vuesa merced): soy, eres, es, somos, sois, son; 'lo' stands for 'consumado poeta': 'as you are one'."}
          - {w: "da", f: "d- + -a → dar (to give), present, it (the artifice). Irregular in the 'I' form: doy, das, da, damos, dais, dan."}
          - {w: "deste", f: "de + este, run together; modern 'de este'."}
        note: "The pun sets 'consumidos' (worn out, starving, fretful) against 'consumado' (perfect), two words from different verbs that look alike. Don Quijote here goes back from 'vos' to the polite 'vuesa merced'."
        ormsby_note: 'Literally, "among the hosts of consumed poets." Possibly Cervantes meant by the word "lean," "starving," but it also has the meaning I have given, which, perhaps ("genus irritabile vatum"), is the more likely one.'
  - sentences:
      - es: "Cuatro días estuvo don Quijote regaladísimo en la casa de don Diego, al cabo de los cuales le pidió licencia para irse, diciéndole que le agradecía la merced y buen tratamiento que en su casa había recebido;"
