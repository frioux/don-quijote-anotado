              - {s: "a entretener a don Quijote", r: "purpose: to keep Don Quijote company"}
              - {s: "como queda dicho", r: "aside: as has been said"}
          - s: "dijo don Quijote a don Lorenzo:"
            r: "main verb 2 (after 'y'): Don Quijote said to Don Lorenzo"
            under:
              - s: "entre otras pláticas"
                r: "when: among other talk"
                under:
                  - {s: "que los dos pasaron", r: "describes 'pláticas': that the two of them had"}
        forms:
          - {w: "se fue", f: "fue → irse (to go off), preterite, he, with 'se' marking 'going away'. ir (to go) in the preterite is irregular (and the same as ser (to be)): fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "entretener", f: "infinitive of entretener (to entertain), after 'a' expressing purpose with a verb of motion ('se fue a entretener'). Its present is built like that of tener (to have): entretengo, entretienes, entretiene, entretenemos, entretenéis, entretienen."}
          - {w: "queda dicho", f: "qued- + -a → quedar (to remain), present, it: 'it remains said', i.e. 'has been said'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. dicho is the irregular participle of decir (to say)."}
          - {w: "otras", f: "otr- + -as → otro (other), feminine plural to match 'pláticas'; note Spanish never puts 'un' before 'otro'."}
          - {w: "pasaron", f: "pas- + -aron → pasar (to pass, spend), preterite, they (the two). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
