          - s: "¡Oh fuerza de la adulación"
            r: "address: oh power of flattery"
          - s: "a cuánto te estiendes"
            r: "exclamation 1: how far you reach"
          - s: "y cuán dilatados límites son"
            r: "exclamation 2: and how wide are the bounds"
            under:
              - {s: "los de tu juridición agradable!", r: "which bounds: those of your pleasant domain"}
        forms:
          - {w: "te estiendes", f: "estiend- + -es → estenderse (to extend), present, you (tú, flattery addressed as a person), with 'te' (yourself); old spelling of 'te extiendes'. The stem e becomes ie when stressed: estiendo, estiendes, estiende, estendemos, estendéis, estienden."}
          - {w: "dilatados", f: "dilat- + -ados → dilatar (to widen), participle used as an adjective, masculine plural to match 'límites'."}
          - {w: "son", f: "ser (to be), present, they. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "los de", f: "'those of': 'los' stands in for 'límites' so the noun is not repeated."}
          - {w: "juridición", f: "old spelling of jurisdicción (jurisdiction); Cervantes' Spanish often drops the hard consonant clusters of Latin words."}
      - es: "Esta verdad acreditó don Lorenzo, pues concedió con la demanda y deseo de don Quijote, diciéndole este soneto a la fábula o historia de Píramo y Tisbe:"
        literal: "This truth proved Don Lorenzo, since he-agreed with the request and desire of Don Quijote, saying-to-him this sonnet to the fable or story of Pyramus and Thisbe:"
        ormsby: "Don Lorenzo gave a proof of it, for he complied with Don Quixote’s request and entreaty, and repeated to him this sonnet on the fable or story of Pyramus and Thisbe."
        vocab:
          - {w: "acreditar", d: "to prove, bear out, confirm"}
          - {w: "conceder con", d: "to agree to, comply with"}
          - {w: "demanda", d: "request (not 'demand')"}
          - {w: "soneto a", d: "a sonnet on, a sonnet to (a subject)"}
          - {w: "fábula", d: "fable, story from mythology"}
          - {w: "Píramo y Tisbe", d: "Pyramus and Thisbe, the young lovers of Babylon in Ovid's Metamorphoses (Book IV) who spoke through a crack in the wall between their houses and both died by the same sword"}
        diagram:
          - s: "Esta verdad acreditó don Lorenzo"
            r: "main verb: Don Lorenzo proved this truth (object first)"
            under:
              - s: "pues concedió con la demanda y deseo de don Quijote"
                r: "why: since he complied with Don Quijote's request and wish"
                under:
                  - {s: "diciéndole este soneto a la fábula o historia de Píramo y Tisbe:", r: "how: by reciting him this sonnet on Pyramus and Thisbe"}
        forms:
          - {w: "Esta", f: "est- + -a → este (this), feminine to match 'verdad'."}
          - {w: "acreditó", f: "acredit- + -ó → acreditar (to prove), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "concedió", f: "conced- + -ió → conceder (to grant), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "diciéndole", f: "diciendo + le → decir (to say), gerund, with 'le' (to him) stuck on the end; the accent is added to keep the stress: 'saying to him'."}
          - {w: "este", f: "'this', masculine to match 'soneto'."}
        note: "The narrator steps in to mock Don Lorenzo: he thinks his guest mad, yet is delighted to be praised by him, and at once recites more verse."
