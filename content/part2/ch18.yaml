          - {w: "merecéis", f: "merec- + -éis → merecer (to deserve), present, you (vos). The present of -er verbs: -o, -es, -e, -emos, -éis, -en (merezco in the 'I' form)."}
          - {w: "laureado", f: "laure- + -ado → laurear (to crown with laurel), participle after 'estar' (to be), masculine to match the poet."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "perdone", f: "perdon- + -e → perdonar (to pardon), present subjunctive, he (God), expressing a wish: 'may God forgive'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "vivieran", f: "viv- + -ieran → vivir (to live), imperfect subjunctive (-ra form), they, in an 'if' clause contrary to fact: 'if they were alive today'. The -ra imperfect subjunctive of -er and -ir verbs: -iera, -ieras, -iera, -iéramos, -ierais, -ieran."}
