          - {w: "entretener el tiempo", d: "to pass the time, keep oneself occupied"}
          - {w: "justas", d: "jousts, tournaments"}
          - {w: "derrota", d: "route, course (a false friend: not 'defeat' here)"}
          - {w: "derecho", d: "straight, direct; 'su derecha derrota' = his direct route, true destination"}
        diagram:
