part: 2
chapter: 18
title_es: "Capítulo XVIII. De lo que sucedió a don Quijote en el castillo o casa del Caballero del Verde Gabán, con otras cosas extravagantes"
title_en: "Of what happened Don Quixote in the castle or house of the Knight of the Green Gabán, together with other matters out of the common"
paragraphs:
  - sentences:
      - es: "Halló don Quijote ser la casa de don Diego de Miranda ancha como de aldea;"
        literal: "Found Don Quijote to-be the house of Don Diego de Miranda wide as of village;"
        ormsby: "Don Quixote found Don Diego de Miranda’s house built in village style,"
        vocab:
          - {w: "hallar", d: "to find; 'halló ... ser' = found [it] to be, an infinitive after a verb of perceiving, a Latin-style construction"}
          - {w: "ancho", d: "wide, spacious, roomy"}
          - {w: "como de aldea", d: "in the village way, as village houses are (big and sprawling rather than tall and elegant)"}
        diagram:
          - s: "Halló"
            r: "main verb: he found"
            under:
              - {s: "don Quijote", r: "subject: who found"}
              - s: "ser la casa de don Diego de Miranda"
                r: "what he found: the house of Don Diego to be"
                under:
                  - {s: "ancha como de aldea", r: "describes 'casa': roomy, in the village style"}
        forms:
          - {w: "Halló", f: "hall- + -ó → hallar (to find), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. The verb comes before its subject 'don Quijote', as often in narrative."}
          - {w: "ser", f: "infinitive of ser (to be) after 'halló': 'found [it] to be'. Modern Spanish would say 'halló que la casa era ancha'."}
          - {w: "ancha", f: "anch- + -a → ancho (wide), feminine to match 'casa'."}
        note: "The chapter begins at once with the house of the Knight of the Green Coat, Don Diego de Miranda, whom Don Quijote met on the road in Chapter XVI. Don Diego had described himself as a gentleman of moderate wealth living quietly in his village."
      - es: "las armas, empero, aunque de piedra tosca, encima de la puerta de la calle; la bodega, en el patio;"
        literal: "the arms, however, although of stone rough, above of the door of the street; the wine-store, in the courtyard;"
        ormsby: "with his arms in rough stone over the street door; in the patio was the storeroom,"
        vocab:
          - {w: "armas", d: "coat of arms, the family's heraldic shield (not 'weapons' here)"}
          - {w: "empero", d: "however, nevertheless (literary, old-fashioned even then)"}
          - {w: "tosco", d: "rough, crude, unpolished"}
          - {w: "puerta de la calle", d: "the street door, the front door of the house"}
          - {w: "bodega", d: "wine store, storeroom for wine and provisions (not a shop)"}
          - {w: "patio", d: "inner courtyard of a Spanish house"}
        diagram:
          - s: "las armas"
            r: "subject 1, verb understood ('were'): the coat of arms"
            under:
              - {s: "empero", r: "linking: however"}
              - {s: "aunque de piedra tosca", r: "concession: though of rough stone"}
              - {s: "encima de la puerta de la calle", r: "where: over the street door"}
          - s: "la bodega"
            r: "subject 2, verb understood: the wine store"
            under:
              - {s: "en el patio", r: "where: in the courtyard"}
        forms:
          - {w: "las armas", f: "plural noun used for one thing: 'las armas' of a family = its coat of arms. No verb in this unit: 'estaban' (were) is understood after each subject, a list in note style."}
          - {w: "tosca", f: "tosc- + -a → tosco (rough), feminine to match 'piedra'."}
          - {w: "encima de", f: "'above, on top of', a compound preposition: encima (on top) + de."}
        ormsby_note: "Many houses in the old towns of Northern and Central Spain are so decorated to this day."
        note: "A coat of arms over the door announced a hidalgo's house; Don Diego's is carved in rough local stone, a sign of country gentry rather than grand nobility."
      - es: "la cueva, en el portal, y muchas tinajas a la redonda, que, por ser del Toboso, le renovaron las memorias de su encantada y transformada Dulcinea;"
        literal: "the cellar, in the entrance-hall, and many great-jars round about, which, through being from-the Toboso, to-him renewed the memories of his enchanted and transformed Dulcinea;"
        ormsby: "and at the entrance the cellar, with plenty of wine-jars standing round, which, coming from El Toboso, brought back to his memory his enchanted and transformed Dulcinea;"
        vocab:
          - {w: "cueva", d: "cellar dug under the house (also 'cave'); here the wine cellar"}
          - {w: "portal", d: "entrance hall, porch, the covered space inside the street door"}
          - {w: "tinaja", d: "large earthenware jar for wine, oil or water, often taller than a man"}
          - {w: "a la redonda", d: "all around, round about"}
          - {w: "por ser", d: "because they were, on account of being"}
          - {w: "del Toboso", d: "made in El Toboso, which was famous for its earthenware wine jars"}
          - {w: "renovar las memorias", d: "to bring back the memory, revive the thought (of someone)"}
        diagram:
          - s: "la cueva"
            r: "subject 3, verb understood: the cellar"
            under:
              - {s: "en el portal", r: "where: in the entrance hall"}
          - s: "y muchas tinajas a la redonda"
            r: "subject 4, verb understood: and many big jars all round"
            under:
              - s: "que ... le renovaron las memorias de su encantada y transformada Dulcinea"
                r: "describes 'tinajas': which brought back to him his enchanted, transformed Dulcinea"
                under:
                  - {s: "por ser del Toboso", r: "why: because they came from El Toboso"}
        forms:
          - {w: "muchas", f: "much- + -as → mucho (many), feminine plural to match 'tinajas'."}
          - {w: "ser", f: "infinitive of ser (to be) after 'por': 'por ser' = because [they] were."}
          - {w: "del", f: "de + el, 'of the'; the town is 'El Toboso', so 'from El Toboso' is 'del Toboso'."}
          - {w: "renovaron", f: "renov- + -aron → renovar (to renew), preterite, they (the jars). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "encantada y transformada", f: "encant- + -ada → encantar (to enchant) and transform- + -ada → transformar (to transform), participles used as adjectives, feminine to match 'Dulcinea'."}
        note: "In Chapter X Sancho passed off a coarse peasant girl as Dulcinea, and Don Quijote believes enchanters have changed her into that shape. El Toboso's potteries were known for their big wine jars, so even the cellar reminds him of her."
      - es: "y sospirando, y sin mirar lo que decía, ni delante de quién estaba, dijo:"
        literal: "and sighing, and without looking-at what that he-was-saying, nor in-front of whom he-was, he-said:"
        ormsby: "and with a sigh, and not thinking of what he was saying, or in whose presence he was, he exclaimed—"
        vocab:
          - {w: "sospirar", d: "= suspirar, to sigh (old form)"}
          - {w: "mirar", d: "here 'to pay attention to, consider' (not just 'to look at')"}
          - {w: "delante de quién", d: "in front of whom, in whose presence"}
        diagram:
          - s: "dijo:"
            r: "main verb: he said"
            under:
              - {s: "y sospirando", r: "how: sighing"}
              - s: "y sin mirar lo que decía"
                r: "how, 2: without minding what he said"
              - {s: "ni delante de quién estaba", r: "how, 3: nor in whose presence he was"}
        forms:
          - {w: "sospirando", f: "gerund of sospirar (to sigh), old form of 'suspirando': 'sighing'."}
          - {w: "mirar", f: "infinitive of mirar (to heed) after 'sin': 'without heeding'."}
          - {w: "decía", f: "dec- + -ía → decir (to say), imperfect, he: 'was saying'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "quién", f: "'whom', with the accent because it is an indirect question ('in front of whom he was')."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— ¡Oh dulces prendas, por mi mal halladas,"
        literal: "— Oh sweet tokens, for my harm found,"
        ormsby: "“O ye sweet treasures, to my sorrow found!"
        vocab:
          - {w: "prenda", d: "token, keepsake, pledge; also a dear one, a beloved person ('prenda mía')"}
          - {w: "por mi mal", d: "to my sorrow, to my misfortune"}
        diagram:
          - s: "¡Oh dulces prendas"
            r: "address, no verb: O sweet keepsakes"
            under:
              - {s: "por mi mal halladas", r: "describes 'prendas': found to my sorrow"}
        forms:
          - {w: "dulces", f: "dulce (sweet) + -s, plural to match 'prendas'."}
          - {w: "halladas", f: "hall- + -adas → hallar (to find), participle, feminine plural to match 'prendas': 'found'."}
        ormsby_note: "The beginning of Garcilaso’s tenth sonnet, imitated from Virgil, Aeneid Lib. IV: “Dulces exuviae, dum fata deusque sinebant.”"
        note: "Garcilaso de la Vega (died 1536) was the great love poet of the Spanish Renaissance. In his sonnet the lover weeps over keepsakes left by his lost lady, as Virgil's Dido weeps over the things Aeneas left behind; Don Quijote applies it to wine jars."
  - sentences:
      - es: "dulces y alegres cuando Dios quería!"
        literal: "sweet and joyful when God wished!"
        ormsby: "Once sweet and welcome when ’twas heaven’s goodwill."
        vocab:
          - {w: "alegre", d: "joyful, glad, bringing joy"}
          - {w: "cuando Dios quería", d: "when God willed it, i.e. in the days when heaven allowed my happiness"}
        diagram:
          - s: "dulces y alegres"
            r: "carries on the address of the previous line, still describing 'prendas': sweet and joyful"
            under:
              - {s: "cuando Dios quería", r: "when: when God so willed"}
        forms:
          - {w: "dulces y alegres", f: "dulce (sweet) and alegre (joyful) + -s, plural to match 'prendas' in the previous line."}
          - {w: "quería", f: "quer- + -ía → querer (to want, to will), imperfect, he (God). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
        note: "The second line of Garcilaso's sonnet, quoted exactly; it echoes Virgil's 'while the fates and the god allowed'."
  - sentences:
      - es: "¡Oh tobosescas tinajas, que me habéis traído a la memoria la dulce prenda de mi mayor amargura!"
        literal: "Oh Toboso-ish great-jars, that to-me you-have brought to the memory the sweet beloved of my greatest bitterness!"
        ormsby: "O ye Tobosan jars, how ye bring back to my memory the sweet object of my bitter regrets!”"
        vocab:
          - {w: "tobosesco", d: "of El Toboso, Tobosan: a mock-solemn adjective Don Quijote coins, in the style of 'caballeresco'"}
          - {w: "traer a la memoria", d: "to bring to mind, remind of"}
          - {w: "prenda", d: "here 'beloved, darling' (Dulcinea), playing on 'prendas' = keepsakes in the line just quoted"}
          - {w: "amargura", d: "bitterness, grief"}
        diagram:
          - s: "¡Oh tobosescas tinajas"
            r: "address, no main verb: O jars of El Toboso"
            under:
              - s: "que me habéis traído a la memoria"
                r: "describes 'tinajas': who have brought back to my mind"
                under:
                  - s: "la dulce prenda"
                    r: "object: the sweet beloved"
                    under:
                      - {s: "de mi mayor amargura", r: "describes 'prenda': who causes my greatest grief"}
        forms:
          - {w: "tobosescas", f: "Toboso + -esco (adjective suffix 'of, in the manner of') + -as, feminine plural to match 'tinajas'."}
          - {w: "habéis traído", f: "hab- + -éis → haber (to have), present, you (vosotros, the jars), + traído, participle of traer (to bring): the present perfect, 'you have brought'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "mayor", f: "irregular comparative of grande (great): 'greater'; with 'mi' before it, 'my greatest'."}
        note: "Don Quijote parodies himself: Garcilaso's lover addressed his lady's keepsakes, and he addresses Toboso wine jars in the same high style, with Dulcinea as the 'sweet pledge'."
  - sentences:
      - es: "Oyóle decir esto el estudiante poeta, hijo de don Diego, que con su madre había salido a recebirle, y madre y hijo quedaron suspensos de ver la estraña figura de don Quijote;"
        literal: "Heard-him to-say this the student poet, son of Don Diego, who with his mother had come-out to receive-him, and mother and son remained astonished from seeing the strange figure of Don Quijote;"
        ormsby: "The student poet, Don Diego’s son, who had come out with his mother to receive him, heard this exclamation, and both mother and son were filled with amazement at the extraordinary figure he presented;"
        vocab:
          - {w: "estudiante poeta", d: "the student who writes poetry: Don Diego's son, whom his father described in Chapter XVI as wasting his studies on poetry"}
          - {w: "recebir", d: "= recibir, to receive, welcome (old spelling)"}
          - {w: "quedar suspenso", d: "to be left astonished, dumbfounded, at a loss"}
          - {w: "estraño", d: "= extraño, strange, odd (old spelling)"}
          - {w: "figura", d: "appearance, look, figure"}
        diagram:
          - s: "Oyóle decir esto"
            r: "main verb 1: heard him say this"
            under:
              - s: "el estudiante poeta, hijo de don Diego"
                r: "subject: the student poet, Don Diego's son"
                under:
                  - {s: "que con su madre había salido a recebirle", r: "describes 'estudiante': who had come out with his mother to welcome him"}
          - s: "y madre y hijo quedaron suspensos"
            r: "main verb 2: and mother and son were left astonished"
            under:
              - {s: "de ver la estraña figura de don Quijote", r: "why: at seeing Don Quijote's strange appearance"}
        forms:
          - {w: "Oyóle", f: "oy- + -ó + le → oír (to hear), preterite, he, with 'le' (him) stuck on the end; modern 'le oyó'. oír in the preterite: oí, oíste, oyó, oímos, oísteis, oyeron. Cervantes often hangs the pronoun on a verb that opens the sentence."}
          - {w: "decir", f: "infinitive of decir (to say) after 'oyóle': 'heard him say'."}
          - {w: "había salido", f: "hab- + -ía → haber (to have), imperfect, he, + salido, participle of salir (to go out): the pluperfect, 'had come out'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "recebirle", f: "recebir (to receive), old spelling of recibir, + le (him), the pronoun hung on the infinitive after 'a'."}
          - {w: "quedaron", f: "qued- + -aron → quedar (to remain, be left), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "suspensos", f: "suspens- + -os → suspenso (astonished), masculine plural because it covers mother and son together."}
          - {w: "estraña", f: "estrañ- + -a → estraño (strange), old spelling of extraño, feminine to match 'figura'."}
      - es: "el cual, apeándose de Rocinante, fue con mucha cortesía a pedirle las manos para besárselas, y don Diego dijo:"
        literal: "the which, getting-down-himself from Rocinante, went with much courtesy to ask-her the hands in-order-to kiss-them-to-her, and Don Diego said:"
        ormsby: "he, however, dismounting from Rocinante, advanced with great politeness to ask permission to kiss the lady’s hand, while Don Diego said,"
        vocab:
          - {w: "el cual", d: "who, he (Don Quijote): a heavy relative that picks up the last person named"}
          - {w: "apearse", d: "to dismount, get down from a horse"}
          - {w: "pedir las manos", d: "to ask for someone's hands (to kiss): the courtly greeting to a lady"}
        diagram:
          - s: "el cual"
            r: "subject 1: he (Don Quijote)"
            under:
              - {s: "apeándose de Rocinante", r: "when: getting down from Rocinante"}
              - s: "fue con mucha cortesía"
                r: "main verb 1: went with great courtesy"
                under:
                  - s: "a pedirle las manos"
                    r: "purpose: to ask for her hands"
                    under:
                      - {s: "para besárselas", r: "why: to kiss them"}
          - s: "y don Diego dijo:"
            r: "main verb 2: and Don Diego said"
        forms:
          - {w: "apeándose", f: "gerund of apearse (to dismount), with 'se' (himself) on the end and an accent added to keep the stress: 'getting down'."}
          - {w: "fue", f: "fu- + -e → ir (to go), preterite, he. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron (the same forms serve for ser (to be))."}
          - {w: "pedirle", f: "pedir (to ask for) + le (of her, the mother), the pronoun hung on the infinitive after 'a'."}
          - {w: "besárselas", f: "besar (to kiss) + se + las: 'to kiss them for her'. 'se' stands for 'le' (to her): le becomes se before lo, la, los, las. 'las' = las manos. Accent added to keep the stress on 'sar'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
        note: "Kissing a lady's hands, or asking leave to, was the formal greeting of a gentleman. The odd figure in armour behaves with perfect courtly manners."
  - sentences:
      - es: "— Recebid, señora, con vuestro sólito agrado al señor don Quijote de la Mancha, que es el que tenéis delante, andante caballero y el más valiente y el más discreto que tiene el mundo."
        literal: "— Receive, lady, with your accustomed kindness the señor Don Quijote de la Mancha, who is the-one whom you-have in-front, errant knight and the most valiant and the most wise that has the world."
        ormsby: "“Señora, pray receive with your wonted kindness Señor Don Quixote of La Mancha, whom you see before you, a knight-errant, and the bravest and wisest in the world.”"
        vocab:
          - {w: "sólito", d: "usual, wonted, customary (Latinism, literary)"}
          - {w: "agrado", d: "kindness, pleasant welcome, graciousness"}
          - {w: "tener delante", d: "to have before one, see in front of one"}
          - {w: "andante caballero", d: "knight-errant, with the adjective in front for emphasis"}
          - {w: "discreto", d: "wise, sensible, clever (a false friend: not 'discreet')"}
        diagram:
          - s: "Recebid"
            r: "main verb: receive (an order to his wife)"
            under:
              - {s: "señora", r: "addressed: madam (his wife)"}
              - {s: "con vuestro sólito agrado", r: "how: with your usual kindness"}
              - s: "al señor don Quijote de la Mancha"
                r: "object: Don Quijote de la Mancha"
                under:
                  - {s: "que es el que tenéis delante", r: "describes him: who is the one you see before you"}
                  - s: "andante caballero y el más valiente y el más discreto"
                    r: "describes him, 2: a knight-errant, the bravest and wisest"
                    under:
                      - {s: "que tiene el mundo", r: "describes 'el más ...': that the world has"}
        forms:
          - {w: "Recebid", f: "receb- + -id → recebir (to receive), old spelling of recibir, imperative, you (vos): 'receive'. The vos/vosotros imperative swaps the final -r of the infinitive for -d: recebid, tomad, comed. Don Diego addresses his wife as 'vos', the old respectful form between spouses."}
          - {w: "vuestro", f: "possessive for 'vos': 'your', masculine to match 'agrado'."}
          - {w: "al", f: "a + el. The 'a' marks a person as the object of 'recebid'."}
          - {w: "es", f: "ser (to be), present, he. soy, eres, es, somos, sois, son."}
          - {w: "tenéis", f: "ten- + -éis → tener (to have), present, you (vos). Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, it (the world); subject 'el mundo' follows. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "el más valiente, el más discreto", f: "el + más + adjective = the superlative, 'the bravest', 'the wisest'; 'que tiene el mundo' = in the world."}
        note: "Don Diego has watched the lion adventure, and his introduction is half courtesy, half a hint to his wife of what sort of guest this is."
  - sentences:
      - es: "La señora, que doña Cristina se llamaba, le recibió con muestras de mucho amor y de mucha cortesía, y don Quijote se le ofreció con asaz de discretas y comedidas razones."
        literal: "The lady, who Doña Cristina herself was-called, him received with signs of much love and of much courtesy, and Don Quijote himself to-her offered with plenty of wise and courteous words."
        ormsby: "The lady, whose name was Doña Christina, received him with every sign of goodwill and great courtesy, and Don Quixote placed himself at her service with an abundance of well-chosen and polished phrases."
        vocab:
          - {w: "llamarse", d: "to be called, be named"}
          - {w: "muestras", d: "signs, tokens, demonstrations"}
          - {w: "amor", d: "here 'goodwill, warmth' (not romantic love)"}
          - {w: "ofrecerse", d: "to offer oneself, place oneself at someone's service (a set courtesy)"}
          - {w: "asaz", d: "plenty, a good many, enough (old and literary even then); 'asaz de' + noun = plenty of"}
          - {w: "comedido", d: "polite, courteous, well-mannered"}
          - {w: "razones", d: "words, remarks, speeches (not 'reasons')"}
        diagram:
          - s: "La señora"
            r: "subject 1: the lady"
            under:
              - {s: "que doña Cristina se llamaba", r: "describes 'señora': whose name was Doña Cristina"}
              - s: "le recibió"
                r: "main verb 1: received him"
                under:
                  - {s: "con muestras de mucho amor y de mucha cortesía", r: "how: with signs of great warmth and courtesy"}
          - s: "y don Quijote se le ofreció"
            r: "main verb 2: and Don Quijote offered himself to her (at her service)"
            under:
              - {s: "con asaz de discretas y comedidas razones", r: "how: with plenty of clever and polite phrases"}
        forms:
          - {w: "se llamaba", f: "llam- + -aba → llamarse (to be called), imperfect, she, with 'se'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. The verb is moved to the end of the relative clause, a literary word order."}
          - {w: "recibió", f: "recib- + -ió → recibir (to receive), preterite, she. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "mucho, mucha", f: "much- + -o / -a → mucho (much), masculine to match 'amor', feminine to match 'cortesía'."}
          - {w: "se le ofreció", f: "ofrec- + -ió → ofrecerse (to offer oneself), preterite, he, with 'se' (himself) and 'le' (to her). The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "discretas y comedidas", f: "discret- + -as → discreto (wise), comedid- + -as → comedido (polite), feminine plural to match 'razones'."}
      - es: "Casi los mismos comedimientos pasó con el estudiante, que, en oyéndole hablar don Quijote, le tuvo por discreto y agudo."
        literal: "Almost the same courtesies he-went-through with the student, who, on hearing-him to-speak Don Quijote, him held for wise and sharp."
        ormsby: "Almost the same civilities were exchanged between him and the student, who listening to Don Quixote, took him to be a sensible, clearheaded person."
        vocab:
          - {w: "comedimiento", d: "courtesy, civility, polite gesture"}
          - {w: "pasar", d: "here 'to go through, exchange' (compliments)"}
          - {w: "en oyendo", d: "on hearing, as soon as he heard: 'en' + gerund = as soon as"}
          - {w: "tener por", d: "to take for, consider to be"}
          - {w: "agudo", d: "sharp, quick-witted, clever"}
        diagram:
          - s: "Casi los mismos comedimientos pasó"
            r: "main verb with its object in front: he went through almost the same courtesies"
            under:
              - s: "con el estudiante"
