          - {w: "regaladísimo", f: "regal- + -ado → regalar (to pamper), participle, + -ísimo, the 'very, most' ending: regalado → regaladísimo, 'most lavishly treated', masculine to match don Quijote."}
          - {w: "los cuales", f: "'which', masculine plural to match 'días'; a heavier relative than 'que', used after a preposition."}
