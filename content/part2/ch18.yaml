      - es: "pero al traductor desta historia le pareció pasar estas y otras semejantes menudencias en silencio, porque no venían bien con el propósito principal de la historia, la cual más tiene su fuerza en la verdad que en las frías digresiones."
        literal: "but to-the translator of-this history to-him it-seemed [good] to-pass these and other similar trifles in silence, because not they-came well with the purpose principal of the history, the which more has its strength in the truth than in the cold digressions."
        ormsby: "but the translator of the history thought it best to pass over these and other details of the same sort in silence, as they are not in harmony with the main purpose of the story, the strong point of which is truth rather than dull digressions."
        vocab:
          - {w: "traductor", d: "translator: the imaginary Spanish translator of Cide Hamete Benengeli's Arabic history"}
          - {w: "desta", d: "= de esta, of this (old contraction)"}
          - {w: "parecer", d: "to seem; 'le pareció' + infinitive = he thought fit to, decided to"}
          - {w: "pasar en silencio", d: "to pass over in silence, leave out"}
          - {w: "menudencia", d: "trifle, petty detail"}
          - {w: "venir bien con", d: "to fit, go well with, suit"}
          - {w: "propósito", d: "purpose, aim"}
          - {w: "frío", d: "cold; of writing, 'dull, lifeless, insipid'"}
        diagram:
          - s: "pero al traductor desta historia le pareció"
            r: "main verb: but it seemed [best] to the translator of this history"
            under:
              - s: "pasar estas y otras semejantes menudencias en silencio"
                r: "what seemed best: to pass over these and other such trifles in silence"
              - s: "porque no venían bien con el propósito principal de la historia"
                r: "why: because they did not suit the main purpose of the history"
                under:
                  - {s: "la cual más tiene su fuerza en la verdad que en las frías digresiones", r: "describes 'historia': whose strength lies more in truth than in dull digressions"}
        forms:
          - {w: "al traductor ... le", f: "al = a + el. The person to whom something 'seems' is named twice, with 'a' and with 'le' (to him), as Spanish still does: 'al traductor le pareció'."}
          - {w: "desta", f: "= de + esta, 'of this', feminine to match 'historia'."}
          - {w: "pareció", f: "parec- + -ió → parecer (to seem), preterite, it. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "estas", f: "est- + -as → este (this), feminine plural to match 'menudencias'."}
          - {w: "venían", f: "ven- + -ían → venir (to come), imperfect, they (the details); 'no venían bien' = did not fit. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "la cual", f: "'which', feminine to match 'historia'; a heavier relative than 'que', used after a comma."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, it (the history). Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "frías", f: "frí- + -as → frío (cold, dull), feminine plural to match 'digresiones'."}
        ormsby_note: "A hit at the prolixity not only of the romances of chivalry, but of more modern works."
        note: "The fiction of Part I continues: the history is by the Arab historian Cide Hamete Benengeli, and we read it in a Spanish translation. Here the translator boasts of cutting the author's description of the house, a joke against the long descriptions of the romances."
  - sentences:
      - es: "Entraron a don Quijote en una sala, desarmóle Sancho, quedó en valones y en jubón de camuza, todo bisunto con la mugre de las armas: el cuello era valona a lo estudiantil, sin almidón y sin randas; los borceguíes eran datilados, y encerados los zapatos."
        literal: "They-brought-in Don Quijote into a hall, disarmed-him Sancho, he-remained in breeches and in doublet of chamois, all greasy with the grime of the armour: the collar was a-Walloon-collar in-the-style student, without starch and without lace; the buskins were date-coloured, and waxed the shoes."
        ormsby: "They led Don Quixote into a room, and Sancho removed his armour, leaving him in loose Walloon breeches and chamois-leather doublet, all stained with the rust of his armour; his collar was a falling one of scholastic cut, without starch or lace, his buskins buff-coloured, and his shoes polished."
        vocab:
          - {w: "entrar a alguien", d: "to bring or show someone in (old transitive use of 'entrar')"}
          - {w: "sala", d: "hall, main room, reception room"}
          - {w: "desarmar", d: "to take off someone's armour, unarm"}
          - {w: "valones", d: "loose wide breeches in the Walloon fashion"}
          - {w: "jubón", d: "doublet, a close-fitting jacket"}
          - {w: "camuza", d: "= gamuza, chamois leather, suede (old form)"}
          - {w: "bisunto", d: "greasy, filthy, grimy (an Italianism)"}
          - {w: "mugre", d: "grime, greasy dirt"}
          - {w: "valona", d: "a wide falling collar lying flat over the shoulders, Walloon style"}
          - {w: "a lo estudiantil", d: "in student fashion, like a student's"}
          - {w: "almidón", d: "starch: a starched ruff was the fashionable collar"}
          - {w: "randas", d: "lace edging, lace trim"}
          - {w: "borceguíes", d: "buskins, soft high boots laced up the leg"}
          - {w: "datilado", d: "date-coloured, yellowish brown"}
          - {w: "encerado", d: "waxed, polished with wax"}
        diagram:
          - s: "Entraron a don Quijote en una sala"
            r: "main verb 1: they brought Don Quijote into a room"
          - {s: "desarmóle Sancho", r: "main verb 2: Sancho took his armour off"}
          - s: "quedó en valones y en jubón de camuza"
            r: "main verb 3: he was left in breeches and chamois doublet"
            under:
              - {s: "todo bisunto con la mugre de las armas", r: "describes his clothes: all greasy with the grime of the armour"}
          - s: "el cuello era valona a lo estudiantil"
            r: "main verb 4: his collar was a falling collar, student style"
            under:
              - {s: "sin almidón y sin randas", r: "how: unstarched and without lace"}
          - {s: "los borceguíes eran datilados", r: "main verb 5: the boots were date-coloured"}
          - {s: "y encerados los zapatos", r: "main verb 6, 'eran' understood: and the shoes waxed"}
        forms:
          - {w: "Entraron", f: "entr- + -aron → entrar (to bring in), preterite, they (people of the house). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "desarmóle", f: "desarm- + -ó + le → desarmar (to unarm), preterite, he (Sancho), with 'le' (him) stuck on the end; modern 'le desarmó'. Same -ar preterite. Cervantes hangs the pronoun on a verb that opens its clause."}
          - {w: "quedó", f: "qued- + -ó → quedar (to be left), preterite, he. Same -ar preterite."}
          - {w: "era, eran", f: "ser (to be), imperfect: era, eras, era, éramos, erais, eran. 'era' with 'el cuello', 'eran' with 'los borceguíes'."}
          - {w: "datilados", f: "dátil (date) + -ado (coloured like) + -s, masculine plural to match 'borceguíes'."}
          - {w: "encerados", f: "encer- + -ados → encerar (to wax), participle, masculine plural to match 'zapatos', put before its noun for balance."}
        note: "The sober dress of a scholar or plain gentleman: a flat unstarched collar instead of the fashionable lace-edged starched ruff. Ormsby reads 'mugre' as rust from the armour; it is grease and dirt in general."
      - es: "Ciñóse su buena espada, que pendía de un tahalí de lobos marinos; que es opinión que muchos años fue enfermo de los riñones; cubrióse un herreruelo de buen paño pardo;"
