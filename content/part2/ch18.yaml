          - {w: "estenderse", d: "= extenderse, to extend, reach (old spelling)"}
          - {w: "cuán", d: "how (before an adjective, in exclamations): 'cuán dilatados' = how wide"}
          - {w: "dilatado", d: "wide, extensive, far-reaching"}
          - {w: "juridición", d: "= jurisdicción, jurisdiction, domain (old spelling)"}
