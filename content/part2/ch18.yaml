        diagram:
          - s: "que no sufrían"
            r: "main verb, explaining 'estrechas': that they did not allow"
            under:
              - {s: "interrogantes, ni dijo, ni diré, ni hacer nombres de verbos, ni mudar el sentido", r: "objects: questions, nor 'he said', nor 'I shall say', nor turning verbs into nouns, nor changing the sense"}
              - s: "con otras ataduras y estrechezas"
                r: "along with: with other bonds and restrictions"
                under:
                  - {s: "con que van atados los que glosan", r: "describes 'ataduras': with which glossers are bound"}
              - {s: "como vuestra merced debe de saber", r: "aside: as your worship must know"}
        forms:
          - {w: "sufrían", f: "sufr- + -ían → sufrir (to allow), imperfect, they (the laws). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he, quoted here as a word: 'he said'. decir in the preterite: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "diré", f: "dir- + -é → decir (to say), future, I, quoted as a word: 'I shall say'. decir in the future: diré, dirás, dirá, diremos, diréis, dirán."}
          - {w: "hacer, mudar", f: "infinitives of hacer (to make) and mudar (to change), used as nouns alongside 'interrogantes': 'making', 'changing'."}
          - {w: "van atados", f: "v- + -an → ir (to go), present, they: voy, vas, va, vamos, vais, van; + atados, participle of atar (to tie), masculine plural to match 'los que glosan': 'go about bound'."}
          - {w: "glosan", f: "glos- + -an → glosar (to gloss), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "debe de saber", f: "deb- + -e → deber (must), present, you (vuestra merced): debo, debes, debe, debemos, debéis, deben; + de + saber (to know): 'deber de' marks a likelihood, 'you surely know'."}
        note: "The rules he lists are the kind the poets of his day applied to the gloss, a strict and fashionable form. Don Quijote talks shop like a practising poet, and Don Lorenzo cannot catch him out."
        ormsby_note: "Glossed verses, versos glosados, of the sort imitated here, were among the literary frivolities indulged in by the sixteenth and seventeenth century poets in Spain. Lope claims them as a Spanish invention, but Ticknor traces them to the Provençal poets. The Provençal glosses, however, were not constructed on the same principle. In Saa de Miranda's Obras (1595), a gloss on some lines of Jorge Manrique's is described as \"ao costume daquelles tempos,\" which may imply that they came into fashion at the beginning of the sixteenth century."
