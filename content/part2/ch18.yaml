  - sentences:
      - es: "¡Si mi fue tornase a es, sin esperar más será, o viniese el tiempo ya de lo que será después...!"
        literal: "If my was would-turn to is, without waiting-for more will-be, or would-come the time already of that which will-be afterwards...!"
        ormsby: "“Could ‘was’ become an ‘is’ for me, / Then would I ask no more than this; / Or could, for me, the time that is / Become the time that is to be!—"
        vocab:
          - {w: "tornar a", d: "to turn into, become; also 'to return' (literary)"}
          - {w: "mi fue", d: "'my was': the verb form 'fue' used as a noun, meaning my past happiness"}
          - {w: "es", d: "'is', the present, also used as a noun here"}
          - {w: "más será", d: "any more 'will be': the future, again a verb treated as a noun"}
          - {w: "ya", d: "now, at once"}
        diagram:
          - s: "¡Si mi fue tornase a es"
            r: "wish 1: if only my 'was' would turn into 'is'"
            under:
              - {s: "mi fue", r: "subject: my 'was', my past happiness"}
              - {s: "a es", r: "into what: into 'is', the present"}
              - {s: "sin esperar más será", r: "how: without waiting for any more 'will be'"}
          - s: "o viniese el tiempo ya"
            r: "wish 2 (after 'o'): or the time would come now"
            under:
              - {s: "de lo que será después", r: "describes 'tiempo': of what will be afterwards"}
        forms:
          - {w: "tornase", f: "torn- + -ase → tornar (to turn into), imperfect subjunctive (-se form), it: 'if it would turn'. The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. 'Si' with the imperfect subjunctive and no main clause makes a wish: 'if only'."}
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, it: 'was', here turned into a noun by 'mi'. ser in the preterite: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "es", f: "ser (to be), present, it: 'is', used as a noun. ser in the present: soy, eres, es, somos, sois, son."}
          - {w: "esperar", f: "esperar (to wait for), infinitive after 'sin' (without)."}
          - {w: "será", f: "ser- + -á → ser (to be), future, it: 'will be', used first as a noun ('más será') and then as a real verb ('lo que será'). ser in the future: seré, serás, será, seremos, seréis, serán."}
          - {w: "viniese", f: "vin- + -iese → venir (to come), imperfect subjunctive (-se form), it, still inside the 'si' wish. venir in the -se imperfect subjunctive: viniese, vinieses, viniese, viniésemos, vinieseis, viniesen."}
          - {w: "lo que", f: "'that which, what': neuter 'lo' + 'que'."}
        note: "These four lines are the 'texto' of the gloss: each of the four stanzas that follow must end with one of them, in order. The play on verb forms as nouns ('my was', 'is', 'will be') is the kind of conceit the genre loved."
