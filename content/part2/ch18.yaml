      - es: "— ¡Viven los cielos donde más altos están, mancebo generoso, que sois el mejor poeta del orbe, y que merecéis estar laureado, no por Chipre ni por Gaeta, como dijo un poeta, que Dios perdone, sino por las academias de Atenas, si hoy vivieran, y por las que hoy viven de París, Bolonia y Salamanca!"
        literal: "— Live the heavens where most high they-are, youth noble, that you-are the best poet of-the globe, and that you-deserve to-be laurelled, not by Cyprus nor by Gaeta, as said a poet, whom God may-pardon, but by the academies of Athens, if today they-were-alive, and by those that today live of Paris, Bologna and Salamanca!"
        ormsby: "“By the highest heavens, noble youth, but you are the best poet on earth, and deserve to be crowned with laurel, not by Cyprus or by Gaeta—as a certain poet, God forgive him, said—but by the Academies of Athens, if they still flourished, and by those that flourish now, Paris, Bologna, Salamanca."
        vocab:
          - {w: "¡Viven los cielos!", d: "an oath: 'as the heavens live!', 'by heaven!'; 'donde más altos están' = at their very highest"}
          - {w: "mancebo", d: "youth, young man"}
          - {w: "generoso", d: "noble, of good birth and spirit (a false friend: not 'generous' here)"}
          - {w: "orbe", d: "the globe, the world (literary)"}
          - {w: "laureado", d: "crowned with laurel, the poet's crown"}
          - {w: "Chipre", d: "Cyprus, the island sacred to Venus"}
          - {w: "Gaeta", d: "a port town in southern Italy, then under the Spanish crown of Naples"}
          - {w: "que Dios perdone", d: "God forgive him: said of a dead person, here with a wink at the bad poet"}
          - {w: "academias de Atenas", d: "the schools of ancient Athens, Plato's Academy and the rest"}
          - {w: "Bolonia", d: "Bologna, seat of the oldest university in Europe"}
