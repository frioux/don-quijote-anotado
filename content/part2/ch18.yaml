          - {w: "tan discretas", f: "tan (so) + discret- + -as → discreto (wise), feminine plural to match 'razones'; 'tan ... que' sets up the result."}
          - {w: "borran y deshacen", f: "borr- + -an → borrar (to erase), present, they: the present of -ar verbs: -o, -as, -a, -amos, -áis, -an. deshac- + -en → deshacer (to undo), present, they; like hacer (to do): deshago, deshaces, deshace, deshacemos, deshacéis, deshacen."}
