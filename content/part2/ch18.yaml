          - {w: "entretener", d: "to keep company, entertain (a guest) while waiting"}
          - {w: "como queda dicho", d: "as has been said: the narrator's formula for 'as mentioned before'"}
          - {w: "plática", d: "talk, conversation (old-fashioned; modern 'charla', 'conversación')"}
          - {w: "pasar pláticas", d: "to have conversations, exchange talk"}
