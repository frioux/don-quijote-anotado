          - {w: "tenía", f: "ten- + -ía → tener (to hold), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
      - es: "¡Oh fuerza de la adulación, a cuánto te estiendes, y cuán dilatados límites son los de tu juridición agradable!"
        literal: "Oh force of the flattery, to how-much yourself you-extend, and how wide limits are those of your jurisdiction pleasant!"
        ormsby: "Power of flattery, how far-reaching art thou, and how wide are the bounds of thy pleasant jurisdiction!"
        vocab:
