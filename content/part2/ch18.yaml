          - {w: "se den", f: "d- + -en → darse (to give oneself), present subjunctive, they, with 'se'. Subjunctive after 'no parecer bien que'. dar (to give) in the present subjunctive: dé, des, dé, demos, deis, den."}
          - {w: "al", f: "a + el, the contraction modern Spanish still makes."}
          - {w: "se quería ir", f: "quer- + -ía → querer (to want), imperfect, he: quería, querías, quería, queríamos, queríais, querían; + ir (to go) with 'se' placed before the whole group: 'he wanted to go away' (modern also 'quería irse')."}
          - {w: "buscando", f: "gerund of buscar (to seek): 'seeking'."}
          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "aquella", f: "aquel (that, over there), feminine to match 'tierra'."}
          - {w: "abundaba, esperaba", f: "abund- + -aba → abundar (to abound), imperfect, it (the land); esper- + -aba → esperar (to hope), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "llegase", f: "lleg- + -ase → llegar (to arrive), imperfect subjunctive (-se form), it (the day). Subjunctive after 'hasta que' for a time still to come. The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "era", f: "ser (to be), imperfect, it. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "derecha", f: "derech- + -a → derecho (straight), feminine to match 'derrota'."}
        note: "In Chapter IV of this Part, Sansón Carrasco advised Don Quijote to make for Saragossa and the jousts held there at the feast of Saint George; that is still his goal."
      - es: "y que primero había de entrar en la cueva de Montesinos, de quien tantas y tan admirables cosas en aquellos contornos se contaban, sabiendo e inquiriendo asimismo el nacimiento y verdaderos manantiales de las siete lagunas llamadas comúnmente de Ruidera."
        literal: "and that first he-had to enter into the cave of Montesinos, of which so-many and so admirable things in those surroundings themselves were-told, learning and inquiring likewise the birth and true springs of the seven lagoons called commonly of Ruidera."
        ormsby: "and that, first of all, he meant to enter the cave of Montesinos, of which so many marvellous things were reported all through the country, and at the same time to investigate and explore the origin and true source of the seven lakes commonly called the lakes of Ruidera."
        vocab:
          - {w: "haber de", d: "to be going to, have to: 'había de entrar' = he was to enter, meant to enter"}
          - {w: "cueva de Montesinos", d: "the Cave of Montesinos, a real cave in La Mancha near the lakes of Ruidera, named after Montesinos, a hero of the Carolingian ballads"}
          - {w: "de quien", d: "of which; old Spanish uses 'quien' for things too"}
          - {w: "admirable", d: "wondrous, marvellous (stronger than English 'admirable')"}
          - {w: "contornos", d: "surroundings, the country round about"}
          - {w: "inquirir", d: "to inquire into, investigate"}
          - {w: "asimismo", d: "likewise, also"}
          - {w: "nacimiento", d: "source (of a river); literally 'birth'"}
          - {w: "manantial", d: "spring, source of water"}
          - {w: "lagunas de Ruidera", d: "the lakes of Ruidera, a chain of lagoons in La Mancha in the upper course of the Guadiana"}
        diagram:
          - s: "y que primero había de entrar en la cueva de Montesinos"
            r: "main verb (continuing what he told him): and that first he meant to enter the cave of Montesinos"
            under:
              - {s: "de quien tantas y tan admirables cosas en aquellos contornos se contaban", r: "describes 'cueva': about which so many marvels were told in those parts"}
              - s: "sabiendo e inquiriendo asimismo el nacimiento y verdaderos manantiales"
                r: "how: also learning and investigating the source and true springs"
                under:
                  - {s: "de las siete lagunas llamadas comúnmente de Ruidera", r: "of what: of the seven lakes commonly called the lakes of Ruidera"}
        forms:
          - {w: "había de entrar", f: "hab- + -ía → haber (to have), imperfect, he: había, habías, había, habíamos, habíais, habían; + de + entrar (to enter): 'haber de' + infinitive = 'to be going to, to have to'."}
          - {w: "tantas y tan admirables", f: "tant- + -as → tanto (so many), feminine plural to match 'cosas'; 'tan' (so) is the short form used before an adjective."}
          - {w: "aquellos", f: "aquel (that), masculine plural to match 'contornos'."}
          - {w: "se contaban", f: "cont- + -aban → contar (to tell), imperfect, they (the things), with 'se' making it passive: 'were told'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "sabiendo e inquiriendo", f: "gerunds of saber (to know, learn) and inquirir (to inquire); 'y' becomes 'e' before a word beginning with the sound i."}
          - {w: "llamadas", f: "llam- + -adas → llamar (to call), participle, feminine plural to match 'lagunas'."}
          - {w: "comúnmente", f: "común (common) + -mente, the adverb ending: 'commonly'."}
        note: "In the ballads, Montesinos is the knight who, at his cousin Durandarte's dying request after Roncesvalles, cut out his heart to carry it to the lady Belerma; local legend tied him to this cave. The lakes of Ruidera, a string of lagoons that feed the Guadiana, lie close by."
  - sentences:
      - es: "Don Diego y su hijo le alabaron su honrosa determinación, y le dijeron que tomase de su casa y de su hacienda todo lo que en grado le viniese, que le servirían con la voluntad posible;"
        literal: "Don Diego and his son to-him praised his honourable determination, and to-him they-said that he-should-take from their house and from their property all that which in liking to-him might-come, for him they-would-serve with the goodwill possible;"
        ormsby: "Don Diego and his son commended his laudable resolution, and bade him furnish himself with all he wanted from their house and belongings, as they would most gladly be of service to him;"
        vocab:
          - {w: "alabar", d: "to praise"}
          - {w: "honroso", d: "honourable, creditable"}
          - {w: "determinación", d: "resolution, decision"}
          - {w: "hacienda", d: "property, estate, belongings (not 'ranch' here)"}
          - {w: "venir en grado", d: "to please, suit; 'lo que en grado le viniese' = whatever he liked"}
          - {w: "con la voluntad posible", d: "with all possible goodwill, as gladly as could be"}
        diagram:
          - s: "Don Diego y su hijo le alabaron su honrosa determinación"
            r: "main verb 1: Don Diego and his son praised his honourable resolve"
          - s: "y le dijeron"
            r: "main verb 2: and they told him"
            under:
              - s: "que tomase de su casa y de su hacienda todo lo"
                r: "what they told him: that he should take from their house and property all"
                under:
                  - {s: "que en grado le viniese", r: "describes 'todo lo': that he might like"}
              - {s: "que le servirían con la voluntad posible", r: "why: for they would serve him with all goodwill"}
        forms:
          - {w: "alabaron", f: "alab- + -aron → alabar (to praise), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "le ... su", f: "'le' (to him) and 'su' (his) both point to Don Quijote: 'praised him his resolve' = praised his resolve."}
          - {w: "honrosa", f: "honros- + -a → honroso (honourable), feminine to match 'determinación'."}
          - {w: "dijeron", f: "dij- + -eron → decir (to say), preterite, they. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "tomase", f: "tom- + -ase → tomar (to take), imperfect subjunctive (-se form), he, after 'dijeron que' reporting an offer. The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "viniese", f: "vin- + -iese → venir (to come), imperfect subjunctive (-se form), it: 'whatever might suit him'. viniese, vinieses, viniese, viniésemos, vinieseis, viniesen."}
          - {w: "servirían", f: "servir- + -ían → servir (to serve), conditional, they. The conditional adds endings to the whole infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
      - es: "que a ello les obligaba el valor de su persona y la honrosa profesión suya."
        literal: "for to it them obliged the worth of his person and the honourable profession his."
        ormsby: "which, indeed, his personal worth and his honourable profession made incumbent upon them."
        vocab:
          - {w: "obligar a", d: "to oblige to, bind to"}
          - {w: "valor", d: "worth, merit (also 'courage')"}
          - {w: "profesión", d: "profession, calling: here knight-errantry, as a religious order 'professes'"}
        diagram:
          - s: "que a ello les obligaba"
            r: "main verb (after 'que', for, continuing the previous sentence): for it obliged them to that"
            under:
              - {s: "el valor de su persona y la honrosa profesión suya", r: "subject: his personal worth and his honourable calling"}
        forms:
          - {w: "les", f: "'them' (Don Diego and his son), the old use of 'les' as the object of 'obligar'."}
          - {w: "obligaba", f: "oblig- + -aba → obligar (to oblige), imperfect, it; singular although it has two subjects, as often when they follow the verb. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "honrosa", f: "honros- + -a → honroso (honourable), feminine to match 'profesión'."}
          - {w: "suya", f: "suyo (his), the long possessive placed after the noun, feminine to match 'profesión'; 'la profesión suya' = his profession."}
  - sentences:
      - es: "Llegóse, en fin, el día de su partida, tan alegre para don Quijote como triste y aciago para Sancho Panza, que se hallaba muy bien con la abundancia de la casa de don Diego, y rehusaba de volver a la hambre que se usa en las florestas, despoblados, y a la estrecheza de sus mal proveídas alforjas."
        literal: "Arrived-itself, in end, the day of his departure, as joyful for Don Quijote as sad and ill-starred for Sancho Panza, who himself found very well with the abundance of the house of Don Diego, and refused of to-return to the hunger that itself is-customary in the woods, wildernesses, and to the narrowness of his badly provisioned saddlebags."
        ormsby: "The day of his departure came at length, as welcome to Don Quixote as it was sad and sorrowful to Sancho Panza, who was very well satisfied with the abundance of Don Diego’s house, and objected to return to the starvation of the woods and wilds and the short-commons of his ill-stocked alforjas;"
        vocab:
          - {w: "llegarse", d: "to come, draw near"}
          - {w: "en fin", d: "at last, in the end"}
          - {w: "partida", d: "departure"}
          - {w: "aciago", d: "ill-starred, ill-fated, black (of a day)"}
          - {w: "hallarse bien con", d: "to be well content with, be comfortable with"}
          - {w: "rehusar de", d: "to refuse to, be unwilling to (modern without 'de')"}
          - {w: "la hambre", d: "hunger; modern Spanish says 'el hambre'"}
          - {w: "usarse", d: "to be customary, be the usual thing"}
          - {w: "floresta", d: "wood, woodland (the leafy forests of the romances)"}
          - {w: "despoblado", d: "wilderness, uninhabited place"}
          - {w: "estrecheza", d: "narrowness, scarcity, short commons (modern 'estrechez')"}
          - {w: "proveído", d: "provisioned, stocked (modern 'provisto')"}
          - {w: "alforjas", d: "saddlebags"}
        diagram:
          - s: "Llegóse, en fin, el día de su partida"
            r: "main verb: at last the day of his departure came"
            under:
              - s: "tan alegre para don Quijote como triste y aciago para Sancho Panza"
                r: "describes 'día': as joyful for Don Quijote as sad and black for Sancho"
                under:
                  - s: "que se hallaba muy bien con la abundancia de la casa de don Diego"
                    r: "describes 'Sancho Panza': who was very comfortable with the plenty in Don Diego's house"
                  - s: "y rehusaba de volver a la hambre"
                    r: "describes 'Sancho Panza', 2: and was unwilling to go back to the hunger"
                    under:
                      - {s: "que se usa en las florestas, despoblados", r: "describes 'hambre': that is usual in woods and wilds"}
                      - {s: "y a la estrecheza de sus mal proveídas alforjas", r: "and back to what: the slim pickings of his ill-stocked saddlebags"}
        forms:
          - {w: "Llegóse", f: "lleg- + -ó + se → llegarse (to come), preterite, it, with 'se' stuck on the end; modern 'se llegó' or simply 'llegó'. Cervantes hangs the pronoun on a verb that opens the clause. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "tan ... como", f: "'as ... as': tan (so) is the short form of tanto used before an adjective."}
          - {w: "se hallaba", f: "hall- + -aba → hallarse (to find oneself), imperfect, he, with 'se'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. Same -aba imperfect: rehusaba."}
          - {w: "rehusaba", f: "rehus- + -aba → rehusar (to refuse), imperfect, he: 'was unwilling'. Same -aba imperfect: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "se usa", f: "us- + -a → usarse (to be customary), present, it, with 'se' making it impersonal: 'that is the usual thing'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "proveídas", f: "prove- + -ídas → proveer (to provide), regular old participle (modern 'provistas'), feminine plural to match 'alforjas'."}
        note: "Sancho has complained since Part I that a squire's life means eating little and badly; Don Diego's well-run house is the opposite, and he leaves it reluctantly."
      - es: "Con todo esto, las llenó y colmó de lo más necesario que le pareció; y al despedirse dijo don Quijote a don Lorenzo:"
        literal: "With all this, them he-filled and heaped-up with the most necessary that to-him seemed; and at-the taking-leave-themselves said Don Quijote to Don Lorenzo:"
        ormsby: "these, however, he filled and packed with what he considered needful. On taking leave, Don Quixote said to Don Lorenzo,"
        vocab:
          - {w: "con todo esto", d: "for all that, nevertheless"}
          - {w: "colmar", d: "to fill to the brim, heap up"}
          - {w: "lo más necesario", d: "what was most needed"}
          - {w: "despedirse", d: "to take one's leave, say goodbye"}
        diagram:
          - s: "las llenó y colmó"
            r: "main verb 1: he (Sancho) filled them up to the brim"
            under:
              - {s: "Con todo esto", r: "linking: for all that"}
              - s: "de lo más necesario"
                r: "with what: with the most necessary things"
                under:
                  - {s: "que le pareció", r: "describes 'lo más necesario': as it seemed to him"}
          - s: "dijo don Quijote a don Lorenzo:"
            r: "main verb 2 (after 'y'): Don Quijote said to Don Lorenzo"
            under:
              - {s: "al despedirse", r: "when: on taking leave"}
        forms:
          - {w: "las", f: "'them', feminine plural for 'alforjas' (saddlebags) in the previous sentence."}
          - {w: "llenó y colmó", f: "llen- + -ó → llenar (to fill) and colm- + -ó → colmar (to heap up), preterite, he (Sancho). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "pareció", f: "parec- + -ió → parecer (to seem), preterite, it. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "al despedirse", f: "al (a + el) + infinitive = 'on doing, when doing'; despedir (to dismiss) + se (themselves) = 'to take leave'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— No sé si he dicho a vuesa merced otra vez, y si lo he dicho lo vuelvo a decir, que cuando vuesa merced quisiere ahorrar caminos y trabajos para llegar a la inacesible cumbre del templo de la Fama, no tiene que hacer otra cosa sino dejar a una parte la senda de la poesía, algo estrecha, y tomar la estrechísima de la andante caballería, bastante para hacerle emperador en daca las pajas."
        literal: "— Not I-know if I-have said to your grace another time, and if it I-have said it I-return to say, that when your grace may-wish to-save roads and toils to arrive at the inaccessible summit of-the temple of the Fame, not you-have that to-do other thing but to-leave to one side the path of the poetry, somewhat narrow, and to-take the narrowest of the errant knighthood, enough to make-you emperor in give-here the straws."
        ormsby: "“I know not whether I have told you already, but if I have I tell you once more, that if you wish to spare yourself fatigue and toil in reaching the inaccessible summit of the temple of fame, you have nothing to do but to turn aside out of the somewhat narrow path of poetry and take the still narrower one of knight-errantry, wide enough, however, to make you an emperor in the twinkling of an eye.”"
        vocab:
          - {w: "volver a + infinitive", d: "to do again: 'lo vuelvo a decir' = I say it again"}
          - {w: "ahorrar", d: "to save, spare"}
          - {w: "trabajos", d: "toils, hardships (not 'jobs')"}
          - {w: "inacesible", d: "= inaccesible, inaccessible (old spelling)"}
          - {w: "cumbre", d: "summit, peak"}
          - {w: "templo de la Fama", d: "the Temple of Fame, an allegorical building on a mountain top, a commonplace of Renaissance poetry"}
          - {w: "no tener que hacer otra cosa sino", d: "to have nothing else to do but"}
          - {w: "dejar a una parte", d: "to leave aside"}
          - {w: "senda", d: "path, track"}
          - {w: "bastante para", d: "enough to, sufficient to"}
          - {w: "en daca las pajas", d: "in a trice, in a flash; literally 'in give-me-the-straws', the moment it takes to hand over a bit of straw ('daca' = da acá, give here)"}
        diagram:
          - s: "No sé"
            r: "main verb 1: I don't know"
            under:
              - {s: "si he dicho a vuesa merced otra vez", r: "what I don't know: whether I have told your worship before"}
          - s: "y si lo he dicho lo vuelvo a decir"
            r: "main verb 2: and if I have said it I say it again"
            under:
              - s: "que ... no tiene que hacer otra cosa"
                r: "what I say: that you have nothing else to do"
                under:
                  - s: "cuando vuesa merced quisiere ahorrar caminos y trabajos"
                    r: "condition: whenever your worship may wish to save roads and toil"
                    under:
                      - {s: "para llegar a la inacesible cumbre del templo de la Fama", r: "purpose: to reach the inaccessible summit of the temple of Fame"}
                  - s: "sino dejar a una parte la senda de la poesía, algo estrecha"
                    r: "what to do, 1: but leave aside the rather narrow path of poetry"
                  - s: "y tomar la estrechísima de la andante caballería"
                    r: "what to do, 2: and take the very narrowest one, of knight-errantry"
                    under:
                      - {s: "bastante para hacerle emperador en daca las pajas", r: "describes 'la estrechísima': enough to make you emperor in a trice"}
        forms:
