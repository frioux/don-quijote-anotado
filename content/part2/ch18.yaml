          - {w: "se me desliza", f: "desliz- + -a → deslizarse (to slip), present, you (vuestra merced, which takes the 'he' form), with 'se' and 'me' (from me): 'you slip away from me'. Same -ar present: deslizo, deslizas, desliza, deslizamos, deslizáis, deslizan."}
