          - {w: "cumplir", d: "to carry out, obey, fulfil"}
          - {w: "indubitablemente", d: "undoubtedly, without hesitation"}
          - {w: "contravenir", d: "to contravene, break (a law)"}
          - {w: "faltar a", d: "to fail in, break (a rule or promise)"}
          - {w: "reclusión", d: "seclusion, confinement"}
          - {w: "olvidársele algo a alguien", d: "to slip someone's mind, be forgotten by someone"}
          - {w: "vanidades", d: "follies, idle fancies (more than 'vanity')"}
          - {w: "dar lugar", d: "to give room, give an opportunity"}
          - {w: "conveniente", d: "suitable, fitting (not 'convenient')"}
        diagram:
