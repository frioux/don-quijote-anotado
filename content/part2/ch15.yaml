        forms:
          - {w: "Armóse", f: "arm- + -ó + se → armarse (to arm oneself), preterite, he, with 'se' stuck on the end; modern 'se armó'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. Cervantes hangs pronouns on a verb that opens its clause."}
          - {w: "queda referido", f: "qued- + -a → quedar (to remain), present, it, + referido, participle of referir (to relate): 'remains related', i.e. has been told. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "acomodó", f: "acomod- + -ó → acomodar (to fit), preterite, he. Same -ar preterite as 'Armóse'."}
          - {w: "sus naturales narices", f: "sus = plural to match 'narices', not the owner; natural-es, plural to match 'narices'."}
