                  - {s: "a su locura algún conveniente remedio", r: "what to look for: some suitable cure for his madness"}
        forms:
          - {w: "era", f: "er- + -a → ser (to be), imperfect, it. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "cumpliría", f: "cumplir- + -ía → cumplir (to carry out), conditional, he. The conditional adds endings to the whole infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "indubitablemente", f: "indubitable (undoubted) + -mente, the suffix that makes an adverb: 'undoubtedly'."}
          - {w: "contravenir, faltar", f: "infinitives of contravenir (to break a law) and faltar (to fail), after 'por no': 'so as not to break or fail in'."}
          - {w: "podría", f: "podr- + -ía → poder (to be able), conditional, it: 'it could be'. Irregular stem podr-: podría, podrías, podría, podríamos, podríais, podrían."}
          - {w: "se le olvidasen", f: "olvid- + -asen → olvidarse (to be forgotten), imperfect subjunctive (-se form), they (his follies), with 'se' and 'le' (to him): 'his follies would slip from his mind'. The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. Subjunctive after 'podría ser que'."}
          - {w: "se diese", f: "d- + -iese → dar (to give), imperfect subjunctive (-se form), it, with 'se' making it impersonal: 'room would be given'. dar takes -er endings here: diese, dieses, diese, diésemos, dieseis, diesen."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun ('remedio'), like un, buen, ningún."}
          - {w: "conveniente", f: "convenien- (from convenir, to suit) + -te, adjective, 'suitable'; placed before 'remedio' as Cervantes often does."}
        note: "The 'laws of chivalry' were binding on Don Quijote by his own logic: a knight who broke his word to his conqueror would cease to be a knight. The friends use his madness to cure it."
  - sentences:
      - es: "Aceptólo Carrasco, y ofreciósele por escudero Tomé Cecial, compadre y vecino de Sancho Panza, hombre alegre y de lucios cascos."
        literal: "Accepted-it Carrasco, and offered-himself-to-him as squire Tomé Cecial, gossip and neighbour of Sancho Panza, man cheerful and of shiny skulls."
        ormsby: "Carrasco undertook the task, and Tom Cecial, a gossip and neighbour of Sancho Panza’s, a lively, feather-headed fellow, offered himself as his squire."
        vocab:
          - {w: "Tomé Cecial", d: "a villager from Don Quijote and Sancho's village, Sancho's neighbour; he was the Squire of the Grove with the enormous false nose in chapters 13 and 14. Ormsby calls him 'Tom Cecial'"}
          - {w: "compadre", d: "gossip, close friend; strictly the godfather of one's child, or the father of one's godchild"}
          - {w: "vecino", d: "neighbour; also fellow villager, resident"}
          - {w: "de lucios cascos", d: "feather-brained, light-headed; 'lucio' = shiny, 'cascos' = skull, head, i.e. with a head polished smooth and empty"}
        diagram:
          - s: "Aceptólo Carrasco"
            r: "main verb 1 and subject: Carrasco accepted it"
          - s: "y ofreciósele por escudero"
            r: "main verb 2: and offered himself to him as squire"
            under:
              - s: "Tomé Cecial"
                r: "subject: Tomé Cecial"
                under:
                  - {s: "compadre y vecino de Sancho Panza", r: "who he is: Sancho Panza's gossip and neighbour"}
                  - {s: "hombre alegre y de lucios cascos", r: "what sort of man: cheerful and feather-headed"}
        forms:
          - {w: "Aceptólo", f: "acept- + -ó + lo → aceptar (to accept), preterite, he, with 'lo' (it, the task) stuck on the end; modern 'lo aceptó'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. Cervantes hangs pronouns on a verb that opens its clause."}
          - {w: "ofreciósele", f: "ofrec- + -ió + se + le → ofrecerse (to offer oneself), preterite, he, with 'se' (himself) and 'le' (to him, Carrasco) stuck on the end; modern 'se le ofreció'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron. The pronouns hang on the end because the verb opens its clause."}
          - {w: "lucios cascos", f: "luci- + -os → lucio (shiny), masculine plural to match 'cascos'."}
        note: "Tomé Cecial is the squire whose huge purple false nose so terrified Sancho at dawn in chapter 14. Being Sancho's compadre, he had to disguise himself to avoid being recognised."
      - es: "Armóse Sansón como queda referido y Tomé Cecial acomodó sobre sus naturales narices las falsas y de máscara ya dichas, porque no fuese conocido de su compadre cuando se viesen;"
        literal: "Armed-himself Sansón as remains related and Tomé Cecial fitted over his natural nostrils the false [ones] and of mask already said, so-that not he-might-be known by his gossip when themselves they-might-see;"
        ormsby: "Carrasco armed himself in the fashion described, and Tom Cecial, that he might not be known by his gossip when they met, fitted on over his own natural nose the false masquerade one that has been mentioned;"
