      - es: "y si no fuera por los pensamientos extraordinarios de don Quijote, que se dio a entender que el bachiller no era el bachiller, el señor bachiller quedara imposibilitado para siempre de graduarse de licenciado, por no haber hallado nidos donde pensó hallar pájaros."
        literal: "and if not it-were for the thoughts extraordinary of Don Quijote, who himself gave to understand that the bachelor not was the bachelor, the mister bachelor would-have-remained disabled for ever from graduating as licentiate, for not having found nests where he-thought to-find birds."
        ormsby: "and had it not been for the extraordinary fancies of Don Quixote, and his conviction that the bachelor was not the bachelor, señor bachelor would have been incapacitated for ever from taking his degree of licentiate, all through not finding nests where he thought to find birds."
