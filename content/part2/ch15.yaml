summary: |
  Don Quijote rides away from his victory over the Knight of the Mirrors proud and vainglorious, expecting that the beaten knight, bound by the laws of chivalry, will come back to tell him whether Dulcinea is still enchanted. The Knight of the Mirrors, meanwhile, is thinking of nothing but finding somewhere to have his bruises plastered.

  The history now explains the trick. When the bachelor Sansón Carrasco urged Don Quijote to set out again, he had already agreed with the priest and the barber on a plan: since he could not be kept at home, Sansón would follow him dressed as a knight-errant, pick a fight, beat him, and, under the agreed condition that the loser must obey the winner, order him home for two years, in the hope that he would forget his madness or that a cure might be found. Tomé Cecial, Sancho's neighbour and gossip, a cheerful, feather-headed man, offered to be his squire and wore a false carnival nose so that Sancho would not know him. They followed Don Quijote's track, nearly caught up with him at the cart of Death, and met him in the wood, with the result the reader knows. Had Don Quijote not believed the bachelor was not the bachelor, Sansón would never have taken another degree.

  On the road Tomé points out that Don Quijote rides off sane and laughing while Sansón is left beaten and sad, and asks who is madder, the man who is mad because he cannot help it or the man who is mad by choice. Sansón answers that the first will be mad for ever, the second can stop when he likes. Tomé takes the hint and decides to stop being mad and go home.

  Sansón, though, refuses to go home until he has thrashed Don Quijote: what drives him now is not the wish to cure him but revenge, since his ribs hurt too much for charitable thoughts. In a village they find a bonesetter who treats him. Tomé goes home, Sansón stays behind plotting his revenge, and the narrator leaves him to return to Don Quijote.
context: |
  The village conspiracy. The plan of the priest, the barber and the bachelor repeats the method of Part I, where the priest and the barber put on disguises and recruited Dorotea as the Princess Micomicona to lure Don Quijote home, and finally carried him back in a cage on an ox-cart. This time the friends go further and enter the fiction themselves: to cure a man who believes in knights-errant, a university man dresses up as one. Sansón Carrasco has a bachelor's degree from Salamanca, and the narrator's joke that he nearly never became a 'licenciado' turns his near-death into a failed exam. Tomé Cecial is Sancho's 'compadre', the word for the godparent of one's child and so for a close family friend, which is why he needed the false nose.

  The rules of chivalry. The whole plan depends on a convention of the romances that Don Quijote takes literally: a vanquished knight is at the victor's mercy and must carry out whatever task he is set, as Don Quijote himself made beaten opponents go and present themselves to Dulcinea. Sansón means to use that law against him by ordering him to stay at home for two years. Because the convention binds the loser absolutely, the plan cannot fail if Sansón wins; it fails only because he loses.

  The narrator's game. Chapter 14 told the fight from Don Quijote's side, with the reader as puzzled as Sancho by the mirrors and the monstrous nose. This chapter goes back in time to explain it, as the romances often explain a mysterious knight's identity after the event, and it addresses the 'prudent' reader who has already read everything that happened in the wood. Tomé's question, who is madder, the man who cannot help his madness or the man who chooses it, turns the joke on the sane: the doctors have caught their patient's disease. Ormsby's notes identify two proverbs behind the narration: 'the bay is of one mind, he who saddles him of another', and finding no nests where one expected birds.

  Medicine. Sansón wants to 'bizmarse', to have a 'bizma', a medicated plaster or poultice, put on his bruises. The man who treats him is an 'algebrista', a bonesetter: the word comes from Arabic 'al-jabr', the setting of broken parts, which also gave English 'algebra'. In Cervantes' Spain bonesetting was usually done by such practitioners and by barbers rather than by university-trained physicians.

  Names. Sansón is Samson, the biblical strongman, and here he is beaten flat; 'Carrasco' is the holm-oak scrub of Castile. 'Tomé' is a rustic form of Tomás. The Knight of the Mirrors and the Knight of the Grove are the same man, Sansón, and the squire with the nose is Tomé.

  Reading Cervantes' Spanish. This short chapter is mostly narrative in long sentences joined by semicolons, built on the -se imperfect subjunctive after verbs of advising, deciding and ordering (volviese, dejasen, saliese, trabase, venciese, quedase, se estuviese, se olvidasen), sometimes with the 'que' left out after 'mandar' ('le había de mandar ... se volviese'). Watch 'haber de' for 'to be to' (había de mandar, he de volver), the -ra form as a conditional ('quedara imposibilitado', would have been left), and the future subjunctive for an open future ('cuando quisiere'). Pronouns hang on verbs that open a clause (Aceptólo, ofreciósele, Armóse). The old spellings are estremo (extremo), vitoria (victoria), encantamento (encantamiento) and escusado (excusado), with the contractions della and dél. False friends: reducir (to bring round), particular (special), conveniente (suitable), empresa (enterprise), discursos (thoughts), desgraciado (unlucky), cobrar (to recover).
