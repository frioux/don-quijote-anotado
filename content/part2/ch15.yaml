          - {w: "se viesen", f: "v- + -iesen → verse (to see each other), imperfect subjunctive (-se form), they, with 'se' meaning 'each other'. ver (to see) in the -se imperfect subjunctive: viese, vieses, viese, viésemos, vieseis, viesen. Subjunctive after 'cuando' for a time still to come."}
