          - {w: "acomodar", d: "to fit, put on, adjust"}
          - {w: "narices", d: "nose (Spanish often uses the plural 'narices', nostrils, for the nose)"}
          - {w: "de máscara", d: "masquerade, carnival (nose), a stage or festival disguise"}
          - {w: "ya dichas", d: "already mentioned"}
          - {w: "porque", d: "here 'so that' (purpose, with the subjunctive), not 'because'"}
          - {w: "conocer", d: "here 'to recognise'"}
        diagram:
          - s: "Armóse Sansón"
