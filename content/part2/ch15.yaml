        forms:
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), it: 'if it were not for'. ser (to be) in the -ra imperfect subjunctive: fuera, fueras, fuera, fuéramos, fuerais, fueran."}
          - {w: "se dio a entender", f: "d- + -io → darse (to give oneself), preterite, he, + 'a entender' (to understand): 'he persuaded himself'. dar (to give) in the preterite: di, diste, dio, dimos, disteis, dieron."}
          - {w: "era", f: "er- + -a → ser (to be), imperfect, he. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "quedara", f: "qued- + -ara → quedar (to remain, be left), imperfect subjunctive (-ra form), he, used as a conditional: 'would have been left'; modern Spanish says 'habría quedado' or 'hubiera quedado'. The -ra imperfect subjunctive of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran."}
