        note: "Two years at home is the cure the friends hope for: away from roads and inns, Don Quijote might forget his chivalry."
      - es: "lo cual era claro que don Quijote vencido cumpliría indubitablemente, por no contravenir y faltar a las leyes de la caballería, y podría ser que en el tiempo de su reclusión se le olvidasen sus vanidades, o se diese lugar de buscar a su locura algún conveniente remedio."
        literal: "the which it-was clear that Don Quijote conquered would-fulfil undoubtedly, for not to-contravene and to-fail [in] the laws of the chivalry, and it-could be that in the time of his seclusion to-him might-forget-themselves his vanities, or itself might-give room to look-for for his madness some suitable remedy."
        ormsby: "all which it was clear Don Quixote would unhesitatingly obey, rather than contravene or fail to observe the laws of chivalry; and during the period of his seclusion he might perhaps forget his folly, or there might be an opportunity of discovering some ready remedy for his madness."
        vocab:
