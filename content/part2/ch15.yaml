  - sentences:
      - es: "— Por cierto, señor Sansón Carrasco, que tenemos nuestro merecido: con facilidad se piensa y se acomete una empresa, pero con dificultad las más veces se sale della."
        literal: "— For certain, mister Sansón Carrasco, that we-have our deserved: with ease itself is-thought and itself is-undertaken an enterprise, but with difficulty the most times itself goes-out of-it."
        ormsby: "“Sure enough, Señor Samson Carrasco, we are served right; it is easy enough to plan and set about an enterprise, but it is often a difficult matter to come well out of it."
        vocab:
          - {w: "por cierto", d: "certainly, to be sure (not 'by the way' as in modern Spanish)"}
          - {w: "tener su merecido", d: "to get what one deserves, be served right"}
          - {w: "acometer", d: "to undertake, set about; also 'to attack'"}
          - {w: "empresa", d: "enterprise, undertaking (not 'company')"}
          - {w: "las más veces", d: "most times, usually"}
          - {w: "della", d: "= de ella, of it, out of it (old contraction)"}
        diagram:
          - s: "que tenemos nuestro merecido:"
            r: "main verb 1: we have got what we deserve"
            under:
              - {s: "Por cierto, señor Sansón Carrasco", r: "opening and address: to be sure, Señor Sansón Carrasco"}
          - s: "con facilidad se piensa y se acomete una empresa"
            r: "main verb 2: an enterprise is easily planned and begun"
          - s: "pero con dificultad las más veces se sale della"
            r: "main verb 3: but most times it is hard to get out of it"
        forms:
          - {w: "tenemos", f: "ten- + -emos → tener (to have), present, we. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "que", f: "after 'Por cierto' the 'que' just introduces the statement ('certain [it is] that ...') and is left untranslated."}
          - {w: "merecido", f: "participle of merecer (to deserve) used as a noun: 'our deserts'."}
          - {w: "se piensa, se acomete", f: "piens- + -a → pensar (to think, plan) and acomet- + -e → acometer (to undertake), present, it, with 'se' making them passive: 'is planned, is undertaken'. pensar changes e to ie when stressed: pienso, piensas, piensa, pensamos, pensáis, piensan. acometer (to undertake) is regular: acometo, acometes, acomete, acometemos, acometéis, acometen."}
          - {w: "se sale", f: "sal- + -e → salir (to come out), present, one, with 'se' making it impersonal: 'one gets out'. salgo, sales, sale, salimos, salís, salen."}
          - {w: "della", f: "= de + ella, 'out of it', 'ella' standing for 'empresa'; modern Spanish writes 'de ella'."}
      - es: "Don Quijote loco, nosotros cuerdos: él se va sano y riendo, vuesa merced queda molido y triste."
        literal: "Don Quijote mad, we sane: he himself goes healthy and laughing, your grace remains ground and sad."
        ormsby: "Don Quixote a madman, and we sane; he goes off laughing, safe, and sound, and you are left sore and sorry!"
        vocab:
          - {w: "cuerdo", d: "sane, sensible (the opposite of 'loco')"}
