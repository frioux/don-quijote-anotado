part: 2
chapter: 15
title_es: "Capítulo XV. Donde se cuenta y da noticia de quién era el Caballero de los Espejos y su escudero"
title_en: "Wherein it is told and known who the Knight of the Mirrors and his squire were"
paragraphs:
  - sentences:
      - es: "En estremo contento, ufano y vanaglorioso iba don Quijote por haber alcanzado vitoria de tan valiente caballero como él se imaginaba que era el de los Espejos, de cuya caballeresca palabra esperaba saber si el encantamento de su señora pasaba adelante, pues era forzoso que el tal vencido caballero volviese, so pena de no serlo, a darle razón de lo que con ella le hubiese sucedido."
        literal: "In extreme pleased, proud and vainglorious went Don Quijote for having achieved victory over so valiant [a] knight as he himself-imagined that was the [one] of the Mirrors, from whose knightly word he-hoped to-know if the enchantment of his lady went forward, since it-was obligatory that the said conquered knight might-return, under penalty of not being-it, to give-him account of that which with her to-him might-have happened."
        ormsby: "Don Quixote went off satisfied, elated, and vainglorious in the highest degree at having won a victory over such a valiant knight as he fancied him of the Mirrors to be, and one from whose knightly word he expected to learn whether the enchantment of his lady still continued; inasmuch as the said vanquished knight was bound, under the penalty of ceasing to be one, to return and render him an account of what took place between him and her."
        vocab:
          - {w: "en estremo", d: "= en extremo, extremely, in the highest degree (old spelling 'estremo')"}
          - {w: "ufano", d: "proud, elated, pleased with oneself"}
          - {w: "vanaglorioso", d: "vainglorious, boastful"}
          - {w: "alcanzar", d: "to achieve, win (a victory)"}
          - {w: "vitoria", d: "= victoria, victory (old spelling)"}
          - {w: "el de los Espejos", d: "'the one of the Mirrors': the Knight of the Mirrors, Sansón Carrasco in disguise, beaten by Don Quijote in the previous chapter"}
          - {w: "caballeresco", d: "knightly, chivalrous"}
          - {w: "encantamento", d: "= encantamiento, enchantment (old form); here the spell Don Quijote believes has turned Dulcinea into a peasant girl"}
          - {w: "pasar adelante", d: "to go on, continue, still be in force"}
          - {w: "forzoso", d: "obligatory, unavoidable"}
          - {w: "el tal", d: "the said, the aforementioned"}
          - {w: "so pena de", d: "under penalty of, on pain of ('so' = under, archaic)"}
          - {w: "dar razón de", d: "to give an account of, report on"}
        diagram:
          - s: "iba don Quijote"
            r: "main verb and subject: Don Quijote went along"
            under:
              - {s: "En estremo contento, ufano y vanaglorioso", r: "how: extremely pleased, proud and vainglorious"}
              - s: "por haber alcanzado vitoria"
                r: "why: for having won a victory"
                under:
                  - s: "de tan valiente caballero"
                    r: "over whom: over so valiant a knight"
                    under:
                      - {s: "como él se imaginaba que era el de los Espejos", r: "how valiant: as he imagined the Knight of the Mirrors to be"}
                      - {s: "de cuya caballeresca palabra esperaba saber", r: "describes the knight: from whose knightly word he hoped to learn"}
                      - {s: "si el encantamento de su señora pasaba adelante", r: "what he hoped to learn: whether his lady's enchantment still went on"}
              - s: "pues era forzoso"
                r: "why he could hope so: since it was obligatory"
                under:
                  - s: "que el tal vencido caballero volviese"
                    r: "what was obligatory: that the said beaten knight should return"
                    under:
                      - {s: "so pena de no serlo", r: "condition: on pain of no longer being a knight"}
                      - {s: "a darle razón", r: "purpose: to give him an account"}
                      - {s: "de lo que con ella le hubiese sucedido", r: "of what: of what had happened to him with her"}
        forms:
          - {w: "iba", f: "ib- + -a → ir (to go), imperfect, he: 'was going along'. Irregular: iba, ibas, iba, íbamos, ibais, iban."}
          - {w: "haber alcanzado", f: "haber (to have), infinitive after 'por', + alcanzado, participle of alcanzar (to achieve): the perfect infinitive, 'for having won'."}
          - {w: "tan valiente ... como", f: "'as valiant ... as': tan (so, as) + adjective + como is the comparison of equality."}
          - {w: "se imaginaba", f: "imagin- + -aba → imaginarse (to imagine), imperfect, he, with 'se' (to himself). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "era", f: "er- + -a → ser (to be), imperfect, he (and in 'era forzoso', it). Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "cuya", f: "cuy- + -a → cuyo (whose), feminine to match 'palabra', the thing owned, not the owner."}
          - {w: "caballeresca", f: "caballeresc- + -a → caballeresco (knightly), feminine to match 'palabra'; placed before the noun for a literary tone."}
          - {w: "esperaba", f: "esper- + -aba → esperar (to hope), imperfect, he. Same -aba imperfect."}
          - {w: "saber", f: "infinitive of saber (to know, to learn), after 'esperaba'."}
          - {w: "pasaba", f: "pas- + -aba → pasar (to pass, go on), imperfect, it (the enchantment). Same -aba imperfect."}
          - {w: "volviese", f: "volv- + -iese → volver (to return), imperfect subjunctive (-se form), he: subjunctive after 'era forzoso que' (it was obligatory that). The -se imperfect subjunctive of -er verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen."}
          - {w: "serlo", f: "ser (to be) + lo (it, i.e. a knight), the pronoun hung on the infinitive after 'de': 'of not being one'."}
          - {w: "darle", f: "dar (to give) + le (to him, Don Quijote), the pronoun hung on the infinitive after 'a'."}
          - {w: "le hubiese sucedido", f: "hub- + -iese → haber (to have), imperfect subjunctive (-se form), it, + sucedido, participle of suceder (to happen): the pluperfect subjunctive, 'might have happened to him'. haber (to have) in the -se imperfect subjunctive: hubiese, hubieses, hubiese, hubiésemos, hubieseis, hubiesen."}
        note: "In the previous chapter the beaten Knight of the Mirrors promised, on Don Quijote's terms, to go to El Toboso, present himself before Dulcinea and come back to report. Don Quijote hopes to learn from him whether Dulcinea is still 'enchanted' into the peasant girl Sancho showed him in chapter 10."
      - es: "Pero uno pensaba don Quijote y otro el de los Espejos, puesto que por entonces no era otro su pensamiento sino buscar donde bizmarse, como se ha dicho."
        literal: "But one [thing] thought Don Quijote and another the [one] of the Mirrors, since for then not was other his thought but to-look-for where to-plaster-himself, as itself has said."
        ormsby: "But Don Quixote was of one mind, he of the Mirrors of another, for he just then had no thought of anything but finding some village where he could plaster himself, as has been said already."
        ormsby_note: "A reference to the proverb (185), “The bay is of one mind, he who saddles him of another.”"
        vocab:
          - {w: "uno pensaba ... y otro", d: "one thought one thing and the other another; echoes the proverb 'Uno piensa el bayo y otro el que lo ensilla' (the bay horse thinks one thing, the man saddling him another)"}
          - {w: "puesto que", d: "here 'since, for' (giving a reason); in Cervantes it more often means 'although'"}
          - {w: "por entonces", d: "at that time, just then"}
          - {w: "no ... otro ... sino", d: "no other ... than, nothing but"}
          - {w: "bizmarse", d: "to put a plaster (bizma) on oneself, dress one's bruises; a 'bizma' was a poultice of medicinal paste"}
        diagram:
          - s: "uno pensaba don Quijote"
            r: "main verb 1 (after 'Pero'): Don Quijote thought one thing"
          - s: "y otro el de los Espejos"
            r: "main verb 2, 'pensaba' understood: and the Knight of the Mirrors another"
          - s: "puesto que por entonces no era otro su pensamiento"
            r: "why: since just then he had no other thought"
            under:
              - s: "sino buscar donde bizmarse"
                r: "than what: than to look for somewhere to plaster his bruises"
              - {s: "como se ha dicho", r: "aside: as has been said"}
        forms:
          - {w: "uno, otro", f: "'one [thing]' and 'another', masculine singular because they stand for an unnamed thing (pensamiento, thought); the verb 'pensaba' does duty for both halves."}
          - {w: "pensaba", f: "pens- + -aba → pensar (to think), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "era", f: "er- + -a → ser (to be), imperfect, it (his thought). Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "buscar", f: "infinitive of buscar (to look for), used as a noun after 'sino': 'than to look for'."}
          - {w: "bizmarse", f: "bizmar (to plaster) + se (himself), the pronoun hung on the infinitive; 'donde bizmarse' = somewhere to plaster himself."}
          - {w: "se ha dicho", f: "ha → haber (to have), present, it, + dicho, irregular participle of decir (to say): the perfect, with 'se' making it impersonal, 'as has been said'. haber (to have) in the present: he, has, ha, hemos, habéis, han."}
        note: "The 'as has been said' points back to the end of chapter 14, where the beaten Sansón and his squire rode off to find a village where he could be plastered and bandaged."
  - sentences:
      - es: "Dice, pues, la historia que cuando el bachiller Sansón Carrasco aconsejó a don Quijote que volviese a proseguir sus dejadas caballerías, fue por haber entrado primero en bureo con el cura y el barbero sobre qué medio se podría tomar para reducir a don Quijote a que se estuviese en su casa quieto y sosegado, sin que le alborotasen sus mal buscadas aventuras;"
        literal: "Says, then, the history that when the bachelor Sansón Carrasco advised [to] Don Quijote that he-might-return to continue his left-off knightly-deeds, it-was for having entered first in council with the priest and the barber about what means itself could take to bring [to] Don Quijote to that he-might-stay in his house quiet and calm, without that him might-stir-up his badly sought adventures;"
        ormsby: "The history goes on to say, then, that when the bachelor Samson Carrasco recommended Don Quixote to resume his knight-errantry which he had laid aside, it was in consequence of having been previously in conclave with the curate and the barber on the means to be adopted to induce Don Quixote to stay at home in peace and quiet without worrying himself with his ill-starred adventures;"
        vocab:
          - {w: "bachiller", d: "bachelor, holder of the first university degree"}
          - {w: "Sansón Carrasco", d: "the young bachelor of Salamanca from Don Quijote's village who in chapters 3, 4 and 7 told him about the printed Part I and urged him to set out again"}
          - {w: "aconsejar", d: "to advise"}
          - {w: "proseguir", d: "to continue, go on with"}
          - {w: "dejado", d: "left off, abandoned"}
          - {w: "caballerías", d: "deeds of chivalry, knight-errantry"}
          - {w: "entrar en bureo", d: "to go into conference, hold a private meeting; 'bureo' was a court tribunal of the royal household, here used jokingly for a village huddle"}
          - {w: "medio", d: "means, way"}
          - {w: "reducir a", d: "to bring round to, persuade to (not 'to reduce')"}
          - {w: "estarse", d: "to stay, remain (put)"}
          - {w: "sosegado", d: "calm, peaceful"}
          - {w: "alborotar", d: "to stir up, disturb, unsettle"}
        diagram:
          - s: "Dice, pues, la historia"
            r: "main verb: the history says, then"
            under:
              - s: "que"
                r: "what it says"
                under:
                  - s: "cuando el bachiller Sansón Carrasco aconsejó a don Quijote"
                    r: "when: when the bachelor Sansón Carrasco advised Don Quijote"
                    under:
                      - {s: "que volviese a proseguir sus dejadas caballerías", r: "what he advised: to go back to his abandoned knight-errantry"}
                  - s: "fue por haber entrado primero en bureo"
                    r: "verb of what it says: it was because he had first gone into conference"
                    under:
                      - {s: "con el cura y el barbero", r: "with whom: with the priest and the barber"}
                      - s: "sobre qué medio se podría tomar"
                        r: "about what: about what means could be taken"
                        under:
                          - s: "para reducir a don Quijote"
                            r: "purpose: to bring Don Quijote round"
                            under:
                              - {s: "a que se estuviese en su casa quieto y sosegado", r: "to what: to staying at home quiet and calm"}
                              - {s: "sin que le alborotasen sus mal buscadas aventuras", r: "how: without his ill-sought adventures stirring him up"}
        forms:
          - {w: "Dice", f: "dic- + -e → decir (to say), present, it (the history). Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "aconsejó", f: "aconsej- + -ó → aconsejar (to advise), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "volviese", f: "volv- + -iese → volver (to return, go back), imperfect subjunctive (-se form), he: subjunctive after 'aconsejó que' (advised that). The -se imperfect subjunctive of -er verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen. 'volver a' + infinitive = to do again."}
          - {w: "dejadas", f: "dej- + -adas → dejar (to leave), participle used as an adjective, feminine plural to match 'caballerías': 'abandoned'."}
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, it. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "haber entrado", f: "haber (to have), infinitive after 'por', + entrado, participle of entrar (to enter): 'for having entered'."}
          - {w: "se podría tomar", f: "podr- + -ía → poder (to be able), conditional, it, + tomar (to take), with 'se' making it passive: 'could be taken'. Irregular stem podr-: podría, podrías, podría, podríamos, podríais, podrían."}
          - {w: "se estuviese", f: "estuv- + -iese → estarse (to stay), imperfect subjunctive (-se form), he, with 'se'. Irregular stem estuv-: estuviese, estuvieses, estuviese, estuviésemos, estuvieseis, estuviesen. Subjunctive after 'a que' (purpose)."}
          - {w: "quieto y sosegado", f: "masculine singular to match Don Quijote; 'sosegado' is the participle of sosegar (to calm) used as an adjective."}
          - {w: "alborotasen", f: "alborot- + -asen → alborotar (to stir up), imperfect subjunctive (-se form), they (the adventures): subjunctive after 'sin que' (without). The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "mal buscadas", f: "busc- + -adas → buscar (to seek), participle, feminine plural to match 'aventuras', with 'mal' (badly): 'ill-sought'."}
        note: "In chapter 7 Sansón, to the dismay of the housekeeper and the niece, encouraged Don Quijote to sally out again. The narrator now reveals that this was part of a plan agreed with the priest and the barber."
      - es: "de cuyo consejo salió, por voto común de todos y parecer particular de Carrasco, que dejasen salir a don Quijote, pues el detenerle parecía imposible, y que Sansón le saliese al camino como caballero andante, y trabase batalla con él, pues no faltaría sobre qué, y le venciese, teniéndolo por cosa fácil, y que fuese pacto y concierto que el vencido quedase a merced del vencedor;"
        literal: "from which council came-out, by vote common of all and opinion particular of Carrasco, that they-should-let go-out [to] Don Quijote, since the to-hold-him-back seemed impossible, and that Sansón him should-go-out to-the road as knight errant, and should-join battle with him, since not would-be-lacking about what, and him should-conquer, holding-it as thing easy, and that it-should-be pact and agreement that the conquered should-remain at mercy of-the conqueror;"
        ormsby: "at which consultation it was decided by the unanimous vote of all, and on the special advice of Carrasco, that Don Quixote should be allowed to go, as it seemed impossible to restrain him, and that Samson should sally forth to meet him as a knight-errant, and do battle with him, for there would be no difficulty about a cause, and vanquish him, that being looked upon as an easy matter; and that it should be agreed and settled that the vanquished was to be at the mercy of the victor."
        vocab:
          - {w: "consejo", d: "here 'council, meeting' (also 'advice')"}
          - {w: "salir", d: "here 'to come out of, be decided at' (a meeting)"}
          - {w: "voto común", d: "unanimous vote, the vote of all"}
          - {w: "parecer", d: "as a noun: opinion, advice"}
          - {w: "particular", d: "special, individual (not 'fussy')"}
          - {w: "detener", d: "to hold back, keep in, restrain"}
          - {w: "salir al camino", d: "to come out to meet someone on the road, waylay"}
          - {w: "trabar batalla", d: "to join battle, engage in a fight"}
          - {w: "no faltaría sobre qué", d: "there would be no lack of [a pretext] to fight about"}
          - {w: "tener por", d: "to consider, regard as"}
          - {w: "pacto y concierto", d: "pact and agreement, a legal-sounding doublet"}
          - {w: "a merced de", d: "at the mercy of, at the disposal of"}
        diagram:
          - s: "de cuyo consejo salió"
            r: "main verb (after the ';', 'consejo' sums up the 'bureo'): from which meeting it came out"
            under:
              - {s: "por voto común de todos y parecer particular de Carrasco", r: "how: by everyone's vote and Carrasco's own advice"}
              - s: "que dejasen salir a don Quijote"
                r: "what was decided, 1: that they should let Don Quijote go out"
                under:
                  - {s: "pues el detenerle parecía imposible", r: "why: since keeping him back seemed impossible"}
              - s: "y que Sansón le saliese al camino como caballero andante"
                r: "what was decided, 2: that Sansón should meet him on the road as a knight-errant"
                under:
                  - s: "y trabase batalla con él"
                    r: "and should join battle with him"
                    under:
                      - {s: "pues no faltaría sobre qué", r: "why: since there would be no lack of something to fight over"}
                  - s: "y le venciese"
                    r: "and should defeat him"
                    under:
                      - {s: "teniéndolo por cosa fácil", r: "how: thinking that an easy thing"}
              - s: "y que fuese pacto y concierto"
                r: "what was decided, 3: that it should be agreed"
                under:
                  - {s: "que el vencido quedase a merced del vencedor", r: "what was agreed: that the loser should be at the winner's mercy"}
        forms:
          - {w: "cuyo", f: "cuy- + -o → cuyo (whose, of which), masculine to match 'consejo'."}
          - {w: "salió", f: "sal- + -ió → salir (to come out), preterite, it. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "dejasen", f: "dej- + -asen → dejar (to let), imperfect subjunctive (-se form), they (the conspirators): subjunctive in the decision 'salió que ...' (it was decided that). The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "salir", f: "infinitive of salir (to go out) after 'dejasen': 'let him go out'."}
          - {w: "el detenerle", f: "detener (to hold back) + le (him), an infinitive with 'el' used as a noun: 'the keeping him back'."}
          - {w: "parecía", f: "parec- + -ía → parecer (to seem), imperfect, it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "saliese", f: "sal- + -iese → salir (to go out), imperfect subjunctive (-se form), he (Sansón). The -se imperfect subjunctive of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen."}
          - {w: "trabase", f: "trab- + -ase → trabar (to join), imperfect subjunctive (-se form), he. The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "faltaría", f: "faltar- + -ía → faltar (to be lacking), conditional, it. The conditional adds endings to the whole infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "venciese", f: "venc- + -iese → vencer (to defeat), imperfect subjunctive (-se form), he. Same -iese subjunctive as 'saliese'."}
          - {w: "teniéndolo", f: "gerund of tener (to hold, consider) + lo (it, the victory), the pronoun hung on the gerund, accent added to keep the stress: 'considering it'."}
          - {w: "fuese", f: "fu- + -ese → ser (to be), imperfect subjunctive (-se form), it. Irregular: fuese, fueses, fuese, fuésemos, fueseis, fuesen."}
          - {w: "quedase", f: "qued- + -ase → quedar (to remain), imperfect subjunctive (-se form), he (the loser). Same -ase subjunctive as 'trabase'."}
          - {w: "vencido, vencedor", f: "vencido = participle of vencer (to defeat) used as a noun, 'the defeated one'; vencedor = venc- + -edor, the suffix for the one who does it, 'the victor'."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
        note: "The plot copies the rules of chivalry Don Quijote himself lives by: a defeated knight must obey his victor. That is why, in chapter 14, Sansón made the fight conditional on the loser being at the winner's disposal."
      - es: "y así vencido don Quijote, le había de mandar el bachiller caballero se volviese a su pueblo y casa, y no saliese della en dos años, o hasta tanto que por él le fuese mandado otra cosa;"
        literal: "and thus conquered Don Quijote, him had to order the bachelor knight [that] he-should-return to his village and house, and not should-go-out of-it in two years, or until so-much that by him to-him might-be ordered another thing;"
        ormsby: "Then, Don Quixote being vanquished, the bachelor knight was to command him to return to his village and his house, and not quit it for two years, or until he received further orders from him;"
        vocab:
          - {w: "así vencido don Quijote", d: "Don Quijote being thus defeated, once he was beaten in this way"}
          - {w: "haber de", d: "to be to, have to; 'había de mandar' = was to order"}
          - {w: "bachiller caballero", d: "'bachelor knight': a joke pairing a university title with a knightly one"}
          - {w: "della", d: "= de ella, of it, from it (old contraction)"}
          - {w: "hasta tanto que", d: "until (literally 'until so much that')"}
        diagram:
          - s: "le había de mandar el bachiller caballero"
            r: "main verb and subject: the bachelor knight was to order him"
            under:
              - {s: "y así vencido don Quijote", r: "when: Don Quijote being thus beaten"}
              - {s: "se volviese a su pueblo y casa", r: "what he would order, 1 ('que' left out): to go back to his village and house"}
              - s: "y no saliese della en dos años"
                r: "what he would order, 2: and not leave it for two years"
                under:
                  - {s: "o hasta tanto que por él le fuese mandado otra cosa", r: "or until: or until he ordered him otherwise"}
        forms:
          - {w: "vencido", f: "venc- + -ido → vencer (to defeat), participle, masculine to match 'don Quijote': an absolute participle, 'Don Quijote being defeated'."}
          - {w: "había de mandar", f: "hab- + -ía → haber (to have), imperfect, he, + de + mandar (to order): 'haber de' + infinitive = was to, was supposed to. haber (to have) in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "se volviese", f: "volv- + -iese → volverse (to go back), imperfect subjunctive (-se form), he, with 'se'. The -se imperfect subjunctive of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen. Subjunctive after 'mandar' (to order); Cervantes often drops the 'que' after verbs of ordering and asking."}
          - {w: "saliese", f: "sal- + -iese → salir (to go out), imperfect subjunctive (-se form), he. Same -iese subjunctive as 'volviese'."}
          - {w: "della", f: "= de + ella, 'of it, from it', 'ella' standing for 'casa'; modern Spanish writes 'de ella'."}
