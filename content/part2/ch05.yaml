  - sentences:
      - es: "— Calla, boba —dijo Sancho—, que todo será usarlo dos o tres años; que después le vendrá el señorío y la gravedad como de molde; y cuando no, ¿qué importa?"
        literal: "— Be-quiet, silly —said Sancho—, for all will-be to-use-it two or three years; for afterwards to-her will-come the ladyship and the dignity as of mould; and when not, what does-it-matter?"
        ormsby: "“Tut, you fool,” said Sancho; “it will be only to practise it for two or three years; and then dignity and decorum will fit her as easily as a glove; and if not, what matter?"
        vocab:
          - {w: "bobo", d: "silly, foolish; 'boba' = you silly woman"}
          - {w: "todo será", d: "it will all come down to, it will only take"}
          - {w: "usar", d: "here 'to practise, get used to'"}
          - {w: "señorío", d: "lordliness, the bearing of a lady or lord; also dominion"}
          - {w: "gravedad", d: "dignity, gravity of manner"}
          - {w: "como de molde", d: "as if cast in a mould: perfectly, like a glove"}
          - {w: "cuando no", d: "and if not, otherwise"}
        diagram:
          - {s: "Calla, boba", r: "main verb 1: be quiet, you silly"}
          - {s: "dijo Sancho", r: "speech tag: said Sancho"}
          - s: "que todo será usarlo dos o tres años"
            r: "why 1 (after 'que', for): it will only take two or three years' practice"
          - s: "que después le vendrá el señorío y la gravedad"
            r: "why 2: for afterwards the ladyship and dignity will come to her"
            under:
              - {s: "como de molde", r: "how: as if made for her"}
          - s: "¿qué importa?"
            r: "main verb 2: what does it matter?"
            under:
              - {s: "y cuando no", r: "condition: and if not"}
        forms:
          - {w: "Calla", f: "call- + -a → callar (to be quiet), imperative, you (tú). The tú imperative of regular verbs is the same as the he/she present: calla, come, vive. Sancho calls his wife 'tú'."}
          - {w: "boba", f: "bob- + -a → bobo (silly), feminine because he is speaking to his wife; used as a noun of address."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "será", f: "ser- + -á → ser (to be), future, it. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "usarlo", f: "usar (to use, practise) + lo (it, the new rank), the pronoun hung on the infinitive."}
          - {w: "vendrá", f: "vendr- + -á → venir (to come), future, it. Irregular stem vendr-: vendré, vendrás, vendrá, vendremos, vendréis, vendrán. Singular though it has two subjects ('el señorío y la gravedad'), as often when the verb comes first."}
          - {w: "importa", f: "import- + -a → importar (to matter), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
