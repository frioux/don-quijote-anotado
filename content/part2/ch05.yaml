  - sentences:
      - es: "— Mirad, Sancho —replicó Teresa—: después que os hicistes miembro de caballero andante habláis de tan rodeada manera, que no hay quien os entienda."
        literal: "— Look, Sancho —replied Teresa—: after that yourself you-made member of knight errant you-speak of such roundabout manner, that not there-is who you may-understand."
        ormsby: "“Look here, Sancho,” said Teresa; “ever since you joined on to a knight-errant you talk in such a roundabout way that there is no understanding you.”"
        vocab:
          - {w: "después que", d: "ever since (old use; modern 'desde que')"}
          - {w: "hacerse miembro de", d: "to become a member of, i.e. to join on to"}
          - {w: "caballero andante", d: "knight-errant"}
          - {w: "rodeado", d: "roundabout (from 'rodear', to go round)"}
          - {w: "no hay quien", d: "there is no one who; 'no hay quien os entienda' = nobody can understand you"}
        diagram:
          - {s: "Mirad, Sancho", r: "attention-getter: look, Sancho"}
          - {s: "replicó Teresa", r: "speech tag: Teresa replied"}
          - s: "habláis de tan rodeada manera"
            r: "main verb: you speak in such a roundabout way"
            under:
              - {s: "después que os hicistes miembro de caballero andante", r: "when: ever since you joined on to a knight-errant"}
              - {s: "que no hay quien os entienda", r: "result: that nobody can understand you"}
        forms:
          - {w: "Mirad", f: "mir- + -ad → mirar (to look), imperative, you (vos): 'look!'. The vos/vosotros imperative swaps the final -r of the infinitive for -d: mirad, comed, vivid."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (repliqué, with c → qu before e)."}
          - {w: "os hicistes", f: "hic- + -istes → hacerse (to become), preterite, you (vos), with 'os' (yourself). Old ending -istes for modern -isteis. Irregular preterite: hice, hiciste, hizo, hicimos, hicisteis (hicistes), hicieron."}
          - {w: "habláis", f: "habl- + -áis → hablar (to speak), present, you (vos, said to one person). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "rodeada", f: "rode- + -ada → rodear (to go round), participle used as an adjective, feminine to match 'manera'."}
          - {w: "hay", f: "'there is', the special present form of haber (to have) used for existence."}
