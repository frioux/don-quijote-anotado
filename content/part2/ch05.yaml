      - es: "Idos con vuestro don Quijote a vuestras aventuras, y dejadnos a nosotras con nuestras malas venturas, que Dios nos las mejorará como seamos buenas; y yo no sé, por cierto, quién le puso a él don, que no tuvieron sus padres ni sus agüelos."
        literal: "Go-yourself with your Don Quijote to your adventures, and leave-us [to] us-women with our bad fortunes, for God to-us them will-improve provided-that we-be good; and I not know, for certain, who to-him put [to] him don, which not had his parents nor his grandparents."
        ormsby: "be off to your adventures along with your Don Quixote, and leave us to our misadventures, for God will mend them for us according as we deserve it. I don’t know, I’m sure, who fixed the ‘Don’ to him, what neither his father nor grandfather ever had.”"
        vocab:
          - {w: "malas venturas", d: "misfortunes, bad luck; a play on 'aventuras' (adventures)"}
          - {w: "mejorar", d: "to better, improve, mend"}
          - {w: "como", d: "here 'provided that, as long as' (with the subjunctive)"}
          - {w: "por cierto", d: "indeed, to be sure, certainly"}
          - {w: "don", d: "the title of respect before the first name of a gentleman, by rights only for the nobility"}
          - {w: "agüelos", d: "= abuelos, grandparents (old and rustic form)"}
        diagram:
          - s: "Idos"
            r: "main verb 1: go off"
            under:
              - {s: "con vuestro don Quijote", r: "with whom: with your Don Quijote"}
              - {s: "a vuestras aventuras", r: "where: to your adventures"}
          - s: "y dejadnos a nosotras"
            r: "main verb 2: and leave us women"
            under:
              - {s: "con nuestras malas venturas", r: "with what: with our misfortunes"}
              - s: "que Dios nos las mejorará"
                r: "why: for God will mend them for us"
                under:
                  - {s: "como seamos buenas", r: "condition: as long as we are good"}
          - s: "y yo no sé, por cierto"
            r: "main verb 3: and indeed I do not know"
            under:
              - s: "quién le puso a él don"
                r: "what I don't know: who put a 'don' on him"
                under:
                  - {s: "que no tuvieron sus padres ni sus agüelos", r: "describes 'don': which neither his parents nor grandparents had"}
        forms:
          - {w: "Idos", f: "id + os → irse (to go away), imperative, you (vos/vosotros), with 'os' (yourself) on the end: 'go off!'. The vosotros imperative swaps the -r of the infinitive for -d (ir → id); 'idos' keeps its -d before 'os', where other verbs drop it (entonaos)."}
          - {w: "dejadnos", f: "dej- + -ad + nos → dejar (to leave), imperative, you (vos/vosotros), with 'nos' (us) stuck on the end: 'leave us'. Pronouns always hang on the end of a positive command."}
          - {w: "nosotras", f: "'we, us', feminine plural: Teresa and her daughter."}
          - {w: "nos las mejorará", f: "mejorar- + -á → mejorar (to improve), future, he (God). The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án. 'nos' = for us, 'las' = them (the 'malas venturas', feminine plural)."}
          - {w: "seamos", f: "se- + -amos → ser (to be), present subjunctive, we, after 'como' meaning 'provided that'. sea, seas, sea, seamos, seáis, sean."}
          - {w: "buenas", f: "feminine plural to match 'nosotras'."}
          - {w: "sé", f: "sé → saber (to know), present, I. Irregular: sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "puso", f: "pus- + -o → poner (to put), preterite, he. Irregular: puse, pusiste, puso, pusimos, pusisteis, pusieron."}
          - {w: "le ... a él", f: "'le' (on him) doubled by 'a él' for emphasis: 'on him, of all people'."}
          - {w: "tuvieron", f: "tuv- + -ieron → tener (to have), preterite, they. Irregular: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron."}
          - {w: "agüelos", f: "= abuelos (grandparents), the old and rustic form, with b turned to g before ue."}
        note: "'Don' had once been reserved for people of rank, and in Cervantes' day its spread to lesser folk was a stock joke. Don Quijote, a poor hidalgo, gave it to himself when he chose his knightly name in Part I chapter 1, so Teresa's jab is a fair one."
