          - {w: "ha de caer", f: "ha → haber (to have), present, she: he, has, ha, hemos, habéis, han; + de + caer (to fall): 'she is bound to fall'."}
          - {w: "mil", f: "a thousand, used loosely for 'countless'; it does not change for the noun."}
