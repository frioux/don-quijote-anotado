          - {w: "entiendan", f: "entiend- + -an → entender (to understand), present subjunctive, they (people there). The stem e becomes ie when stressed: entienda, entiendas, entienda, entendamos, entendáis, entiendan. Subjunctive in a relative clause about places she has not yet been."}
