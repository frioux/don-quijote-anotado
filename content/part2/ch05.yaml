          - {w: "se morirá", f: "morir- + -á → morirse (to die), future, she. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "casamos", f: "cas- + -amos → casar (to marry off), present, we, after 'si'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
