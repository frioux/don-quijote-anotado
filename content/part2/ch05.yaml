        note: "Teresa's point is the reverse of Sancho's: the higher you rise, the more eyes are on you, and the village never forgets where you came from."
  - sentences:
      - es: "— Mira, Teresa —respondió Sancho—, y escucha lo que agora quiero decirte;"
        literal: "— Look, Teresa —answered Sancho—, and listen-to that which now I-want to-tell-you;"
        ormsby: "“Look here, Teresa,” said Sancho, “and listen to what I am now going to say to you;"
        vocab:
          - {w: "agora", d: "= ahora, now (old form, common in Cervantes and in village speech)"}
        diagram:
          - s: "Mira, Teresa"
            r: "main verb 1: look, Teresa (a command)"
          - s: "respondió Sancho"
            r: "speech tag: Sancho answered"
          - s: "y escucha"
            r: "main verb 2 (after 'y'): and listen"
            under:
              - s: "lo"
                r: "object: that"
                under:
                  - {s: "que agora quiero decirte", r: "describes 'lo': what I now want to tell you"}
        forms:
          - {w: "Mira", f: "mir- + -a → mirar (to look), imperative, you (tú): 'look!'. The tú imperative of regular verbs is the same as the he/she present: mira, escucha, come. Sancho calls Teresa 'tú', while she calls him 'vos'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "escucha", f: "escuch- + -a → escuchar (to listen), imperative, you (tú): 'listen!'. Same tú imperative as 'mira': the he/she present form used as a command."}
          - {w: "agora", f: "old form of ahora (now)."}
          - {w: "quiero", f: "quier- + -o → querer (to want), present, I. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "decirte", f: "decir (to say, tell) + te (to you), the pronoun hung on the end of the infinitive that depends on 'quiero'."}
      - es: "quizá no lo habrás oído en todos los días de tu vida, y yo agora no hablo de mío;"
        literal: "perhaps not it you-will-have heard in all the days of your life, and I now not speak of mine;"
        ormsby: "maybe you never heard it in all your life; and I do not give my own notions,"
        vocab:
          - {w: "quizá", d: "perhaps, maybe"}
          - {w: "agora", d: "= ahora, now (old form)"}
          - {w: "hablar de mío", d: "to speak on one's own account, give one's own ideas; 'no hablo de mío' = these are not my own words"}
        diagram:
          - s: "no lo habrás oído"
            r: "main verb 1: you will (probably) not have heard it"
            under:
              - {s: "quizá", r: "how sure: perhaps"}
              - {s: "en todos los días de tu vida", r: "when: in all the days of your life"}
          - s: "y yo agora no hablo de mío"
            r: "main verb 2 (after 'y'): and I am not speaking on my own account now"
        forms:
          - {w: "habrás oído", f: "habr- + -ás → haber (to have), future, you (tú), + oído, the participle of oír (to hear): the future perfect, 'you will have heard', here a guess about the past ('you have probably never heard'). haber (to have) in the future: habré, habrás, habrá, habremos, habréis, habrán."}
          - {w: "agora", f: "old form of ahora (now)."}
          - {w: "hablo", f: "habl- + -o → hablar (to speak), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "mío", f: "'mine', the possessive used on its own; 'de mío' = of my own (stock)."}
      - es: "que todo lo que pienso decir son sentencias del padre predicador que la Cuaresma pasada predicó en este pueblo, el cual, si mal no me acuerdo, dijo que todas las cosas presentes que los ojos están mirando se presentan, están y asisten en nuestra memoria mucho mejor y con más vehemencia que las cosas pasadas."
        literal: "for all that which I-intend to-say are maxims of-the father preacher who the Lent past preached in this town, the which, if badly not myself I-remember, said that all the things present that the eyes are looking-at themselves present, are and attend in our memory much better and with more vehemence than the things past."
        ormsby: "for what I am about to say are the opinions of his reverence the preacher, who preached in this town last Lent, and who said, if I remember rightly, that all things present that our eyes behold, bring themselves before us, and remain and fix themselves on our memory much better and more forcibly than things past.”"
        vocab:
          - {w: "pensar + infinitive", d: "to intend to, mean to; 'pienso decir' = I mean to say"}
          - {w: "sentencia", d: "maxim, wise saying (false friend: not a court sentence here)"}
          - {w: "padre predicador", d: "the father preacher, a friar sent to preach the Lenten sermons"}
          - {w: "Cuaresma", d: "Lent, the forty days of fasting before Easter, when sermons were frequent"}
          - {w: "si mal no me acuerdo", d: "if I remember rightly (literally 'if badly I do not remember')"}
          - {w: "asistir", d: "to be present, stay, abide (false friend: not 'to help' here)"}
          - {w: "vehemencia", d: "force, intensity"}
        diagram:
          - s: "son sentencias del padre predicador"
            r: "main verb: are the maxims of the father preacher"
            under:
              - {s: "que todo lo que pienso decir", r: "subject (after 'que', for): all that I mean to say"}
              - {s: "que la Cuaresma pasada predicó en este pueblo", r: "describes 'predicador': who preached in this town last Lent"}
              - s: "el cual"
                r: "describes 'predicador': who"
                under:
                  - {s: "si mal no me acuerdo", r: "aside: if I remember rightly"}
                  - s: "dijo"
                    r: "verb: said"
                    under:
                      - s: "que todas las cosas presentes"
                        r: "what he said: that all present things"
                        under:
                          - {s: "que los ojos están mirando", r: "describes 'cosas': that our eyes are looking at"}
                          - {s: "se presentan, están y asisten en nuestra memoria", r: "verbs: present themselves, stay and abide in our memory"}
                          - {s: "mucho mejor y con más vehemencia que las cosas pasadas", r: "how: much better and more strongly than past things"}
        forms:
          - {w: "pienso", f: "piens- + -o → pensar (to think; with an infinitive, to intend), present, I. The stem e becomes ie when stressed: pienso, piensas, piensa, pensamos, pensáis, piensan."}
          - {w: "son", f: "son → ser (to be), present, they: agrees with 'sentencias' rather than 'todo'. ser (to be) in the present: soy, eres, es, somos, sois, son."}
          - {w: "del", f: "de + el (of the), the contraction modern Spanish still makes."}
          - {w: "pasada", f: "pas- + -ada → pasar (to pass), participle used as an adjective, feminine to match 'Cuaresma': 'last Lent'. 'pasadas' later is feminine plural to match 'cosas'."}
          - {w: "predicó", f: "predic- + -ó → predicar (to preach), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (prediqué, with c → qu before e)."}
          - {w: "el cual", f: "'who, which', masculine to match 'predicador'; a heavier relative than 'que', used after a comma."}
          - {w: "me acuerdo", f: "acuerd- + -o → acordarse (to remember), present, I, with 'me' (myself). The stem o becomes ue when stressed: me acuerdo, te acuerdas, se acuerda, nos acordamos, os acordáis, se acuerdan."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "están mirando", f: "están (estar, to be, present, they: estoy, estás, está, estamos, estáis, están) + mirando, the gerund of mirar (to look at): the progressive, 'are looking at'."}
          - {w: "se presentan, están y asisten", f: "present, they (the things): present- + -an → presentarse (to present oneself), with 'se'; est- + -án → estar (to be); asist- + -en → asistir (to be present). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en. estar (to be) is irregular: estoy, estás, está, estamos, estáis, están."}
          - {w: "nuestra", f: "nuestr- + -a → nuestro (our), feminine to match 'memoria'."}
        note: "Sancho's 'philosophy' is a garbled sermon: present things impress the memory more than past ones, so a man seen in rich clothes is respected even by those who remember him poor. In Spanish towns the Lenten sermons were preached by visiting friars and were a major event."
  - sentences:
      - es: "(Todas estas razones que aquí va diciendo Sancho son las segundas por quien dice el tradutor que tiene por apócrifo este capítulo, que exceden a la capacidad de Sancho. El cual prosiguió diciendo:)"
        literal: "(All these arguments that here goes saying Sancho are the second [ones] for which says the translator that he-holds as apocryphal this chapter, which exceed [to] the capacity of Sancho. The which continued saying:)"
        ormsby: "These observations which Sancho makes here are the other ones on account of which the translator says he regards this chapter as apocryphal, inasmuch as they are beyond Sancho’s capacity."
        vocab:
          - {w: "razones", d: "words, remarks, arguments (not 'reasons' here)"}
          - {w: "ir diciendo", d: "to go on saying, be saying (ir + gerund = continuing action)"}
          - {w: "tradutor", d: "= traductor, translator (old spelling)"}
          - {w: "tener por", d: "to consider, regard as"}
          - {w: "apócrifo", d: "apocryphal, spurious, not by the real author"}
          - {w: "exceder a", d: "to go beyond, exceed"}
          - {w: "proseguir", d: "to continue, go on (with a speech)"}
        diagram:
          - s: "son las segundas"
            r: "main verb: are the second (set)"
            under:
              - s: "Todas estas razones"
                r: "subject: all these remarks"
                under:
                  - {s: "que aquí va diciendo Sancho", r: "describes 'razones': that Sancho is making here"}
              - s: "por quien dice el tradutor"
                r: "describes 'segundas': on account of which the translator says"
                under:
                  - {s: "que tiene por apócrifo este capítulo", r: "what he says: that he regards this chapter as spurious"}
              - {s: "que exceden a la capacidad de Sancho", r: "describes 'razones': which go beyond Sancho's capacity"}
          - s: "El cual prosiguió diciendo:"
            r: "main verb 2: who (Sancho) went on, saying"
        forms:
          - {w: "estas", f: "est- + -as → este (this), feminine plural to match 'razones'."}
          - {w: "va diciendo", f: "va (ir, to go, present, he: voy, vas, va, vamos, vais, van) + diciendo, the gerund of decir (to say): 'is (going on) saying'."}
          - {w: "son", f: "son → ser (to be), present, they. ser (to be) in the present: soy, eres, es, somos, sois, son."}
          - {w: "segundas", f: "segund- + -as → segundo (second), feminine plural to match 'razones' understood: 'the second (remarks)'."}
          - {w: "por quien", f: "'for which': Cervantes uses 'quien' for things as well as people, and for plurals; modern Spanish says 'por las cuales'."}
          - {w: "dice", f: "dic- + -e → decir (to say), present, he. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "tradutor", f: "old spelling of traductor (translator), with the c of 'ct' dropped, as in 'efeto' for 'efecto'."}
          - {w: "tiene", f: "tien- + -e → tener (to have; 'tener por', to regard as), present, he. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "exceden", f: "exced- + -en → exceder (to exceed), present, they. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "El cual", f: "'who', masculine to match 'Sancho'; used to open a new sentence, as Latin does."}
          - {w: "prosiguió", f: "prosigu- + -ió → proseguir (to continue), preterite, he. The stem e becomes i in the he and they forms: proseguí, proseguiste, prosiguió, proseguimos, proseguisteis, prosiguieron."}
          - {w: "diciendo", f: "gerund of decir (to say): 'saying'; the e of the stem turns to i."}
        note: "A second interruption by the 'translator' of Cide Hamete's Arabic text: he again suspects the chapter is spurious, because Sancho talks above his station. Cervantes is joking at his own expense, and perhaps defending the sharper Sancho of Part II in advance."
  - sentences:
      - es: "— De donde nace que, cuando vemos alguna persona bien aderezada, y con ricos vestidos compuesta, y con pompa de criados, parece que por fuerza nos mueve y convida a que la tengamos respeto, puesto que la memoria en aquel instante nos represente alguna bajeza en que vimos a la tal persona;"
        literal: "— From where is-born that, when we-see some person well adorned, and with rich clothes decked-out, and with pomp of servants, it-seems that by force us it-moves and invites to that her we-may-have respect, granted that the memory in that instant to-us may-represent some lowliness in which we-saw [to] the such person;"
        ormsby: "“Whence it arises,” he continued, “that when we see any person well dressed and making a figure with rich garments and retinue of servants, it seems to lead and impel us perforce to respect him, though memory may at the same moment recall to us some lowly condition in which we have seen him,"
        vocab:
          - {w: "de donde nace que", d: "from which it follows that, hence"}
          - {w: "aderezado", d: "dressed up, adorned, well turned out"}
          - {w: "compuesto", d: "here 'decked out, dressed', from 'componer' (to adorn); not 'composed'"}
          - {w: "pompa de criados", d: "a retinue of servants, a show of attendants"}
          - {w: "por fuerza", d: "perforce, necessarily, whether we will or no"}
          - {w: "convidar a", d: "to invite to, prompt to"}
          - {w: "tener respeto a", d: "to respect, show deference to"}
          - {w: "puesto que", d: "here 'even though, although' (with the subjunctive), not 'since' as in modern Spanish"}
          - {w: "representar", d: "to bring before the mind, show"}
          - {w: "bajeza", d: "lowliness, low condition; also a base act"}
        diagram:
          - s: "De donde nace"
            r: "main verb: from which it follows"
            under:
              - s: "que"
                r: "what follows: that"
                under:
                  - s: "cuando vemos alguna persona"
                    r: "when: when we see some person"
                    under:
                      - {s: "bien aderezada, y con ricos vestidos compuesta, y con pompa de criados", r: "describes 'persona': well turned out, decked in rich clothes, with a train of servants"}
                  - s: "parece"
                    r: "verb: it seems"
                    under:
                      - s: "que por fuerza nos mueve y convida"
                        r: "what seems: that (the sight) perforce moves and invites us"
                        under:
                          - {s: "a que la tengamos respeto", r: "to what: to show her respect"}
                      - s: "puesto que la memoria en aquel instante nos represente alguna bajeza"
                        r: "although: even though memory at that moment shows us some low condition"
                        under:
                          - {s: "en que vimos a la tal persona", r: "describes 'bajeza': in which we saw that person"}
        forms:
          - {w: "nace", f: "nac- + -e → nacer (to be born; to arise), present, it. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (but nazco for I)."}
          - {w: "vemos", f: "ve- + -mos → ver (to see), present, we. veo, ves, ve, vemos, veis, ven."}
          - {w: "alguna", f: "algun- + -a → alguno (some, any), feminine to match 'persona'."}
          - {w: "aderezada, compuesta", f: "participles used as adjectives, feminine to match 'persona': aderez- + -ada → aderezar (to adorn); compuesta, the irregular participle of componer (to put together; to deck out)."}
          - {w: "parece", f: "parec- + -e → parecer (to seem), present, it. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (but parezco for I)."}
          - {w: "mueve y convida", f: "muev- + -e → mover (to move) and convid- + -a → convidar (to invite), present, it (the sight). mover (to move) changes stressed o to ue: muevo, mueves, mueve, movemos, movéis, mueven. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "la tengamos", f: "teng- + -amos → tener (to have), present subjunctive, we, after 'a que' (to the point that). tenga, tengas, tenga, tengamos, tengáis, tengan. 'la' (to her) where modern Spanish would say 'le tengamos respeto': using 'la' for a feminine indirect object is called laísmo."}
          - {w: "represente", f: "represent- + -e → representar (to represent, show), present subjunctive, it (memory), after 'puesto que' meaning 'although'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "aquel", f: "'that' (far off), masculine to match 'instante'."}
          - {w: "vimos", f: "vi- + -mos → ver (to see), preterite, we. Irregular: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "la tal persona", f: "'the such person', i.e. that very person; 'tal' with the article points back to someone just mentioned."}
