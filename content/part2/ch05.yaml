        ormsby: "and I say if you are bent upon having a government, take your son Sancho with you, and teach him from this time on how to hold a government; for sons ought to inherit and learn the trades of their fathers.”"
        vocab:
          - {w: "porfiar en", d: "to insist on, persist in, be bent on"}
          - {w: "gobierno", d: "a governorship; also 'good management, sense', which gives 'tener gobierno' a double meaning"}
          - {w: "agora", d: "= ahora, now (old form)"}
          - {w: "oficio", d: "trade, craft, occupation (not 'office')"}
        diagram:
          - s: "y digo"
            r: "main verb: and I say"
            under:
              - {s: "que si estáis porfiando en tener gobierno", r: "condition: that if you insist on having a governorship"}
              - s: "que llevéis con vos a vuestro hijo Sancho"
                r: "what I say: that you take your son Sancho with you"
                under:
                  - {s: "para que desde agora le enseñéis a tener gobierno", r: "why: so that you teach him from now on to govern"}
                  - s: "que bien es"
                    r: "why: for it is right"
                    under:
                      - {s: "que los hijos hereden y aprendan los oficios de sus padres", r: "what is right: that sons inherit and learn their fathers' trades"}
        forms:
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "estáis porfiando", f: "estáis (estar, to be, present, you (vos): estoy, estás, está, estamos, estáis, están) + porfiando, the gerund of porfiar (to insist): 'you are insisting'."}
          - {w: "que llevéis", f: "llev- + -éis → llevar (to take), present subjunctive, you (vos), after an implied 'I want': 'that you take'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. The 'que' is repeated after the 'si' clause, as in speech."}
          - {w: "le enseñéis", f: "enseñ- + -éis → enseñar (to teach), present subjunctive, you (vos), after 'para que'. Same -e subjunctive: enseñe, enseñes, enseñe, enseñemos, enseñéis, enseñen. 'le' (him) for a male person as direct object is leísmo, normal in Cervantes; modern Spanish prefers 'lo'."}
          - {w: "agora", f: "old form of ahora (now)."}
          - {w: "hereden y aprendan", f: "hered- + -en → heredar (to inherit), present subjunctive, they; aprend- + -an → aprender (to learn), present subjunctive, they; subjunctive after 'bien es que' (it is right that). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en; of -er verbs: -a, -as, -a, -amos, -áis, -an."}
          - {w: "sus", f: "sus = plural to match 'padres', not the owner; 'their fathers'."}
        note: "'Tener gobierno' can mean both holding a governorship and having good management or sense, so Teresa's wish that the boy learn 'to have government' may carry a second, ironic meaning. Sons following their fathers' trades was the normal order of village life."
  - sentences:
      - es: "— En teniendo gobierno —dijo Sancho—, enviaré por él por la posta, y te enviaré dineros, que no me faltarán, pues nunca falta quien se los preste a los gobernadores cuando no los tienen; y vístele de modo que disimule lo que es y parezca lo que ha de ser."
        literal: "— On having government —said Sancho—, I-will-send for him by the post, and to-you I-will-send moneys, which not to-me will-be-lacking, since never is-lacking [one] who them may-lend to the governors when not them they-have; and dress-him in way that he-may-disguise that which he-is and may-seem that which he-has to be."
        ormsby: "“As soon as I have the government,” said Sancho, “I will send for him by post, and I will send thee money, of which I shall have no lack, for there is never any want of people to lend it to governors when they have not got it; and do thou dress him so as to hide what he is and make him look what he is to be.”"
        vocab:
          - {w: "en + gerund", d: "as soon as, once; 'en teniendo gobierno' = as soon as I have a governorship"}
          - {w: "enviar por", d: "to send for"}
          - {w: "por la posta", d: "by post-horse, express; the fastest way to travel or send word"}
          - {w: "dineros", d: "money (the plural is common in Cervantes)"}
          - {w: "disimular", d: "to disguise, hide"}
        diagram:
          - s: "enviaré por él por la posta"
            r: "main verb 1: I will send for him by express"
            under:
              - {s: "En teniendo gobierno", r: "when: as soon as I have a governorship"}
          - s: "dijo Sancho"
            r: "speech tag: Sancho said"
          - s: "y te enviaré dineros"
            r: "main verb 2 (after 'y'): and I will send you money"
            under:
              - s: "que no me faltarán"
                r: "describes 'dineros': which I will not lack"
                under:
                  - s: "pues nunca falta quien se los preste a los gobernadores"
                    r: "why: since there is never a lack of someone to lend it to governors"
                    under:
                      - {s: "cuando no los tienen", r: "when: when they have none"}
          - s: "y vístele"
            r: "main verb 3 (after 'y'): and dress him"
            under:
              - {s: "de modo que disimule lo que es y parezca lo que ha de ser", r: "how: so that he hides what he is and looks what he is to be"}
        forms:
          - {w: "En teniendo", f: "en + teniendo, the gerund of tener (to have): 'as soon as (I) have'; this use of 'en' with a gerund is now old-fashioned."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "enviaré", f: "enviar- + -é → enviar (to send), future, I. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "faltarán", f: "faltar- + -án → faltar (to be lacking), future, they (the moneys). Same future endings: -é, -ás, -á, -emos, -éis, -án. 'me' is the person who lacks: 'they will not be lacking to me'."}
          - {w: "falta", f: "falt- + -a → faltar (to be lacking), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "se los preste", f: "prest- + -e → prestar (to lend), present subjunctive, he (someone), after 'quien' with no definite person. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. 'se los' = 'le los' (to them, it): le becomes se before lo, la, los, las; 'se' here repeats 'a los gobernadores'."}
          - {w: "tienen", f: "tien- + -en → tener (to have), present, they. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "vístele", f: "vist- + -e + le → vestir (to dress), imperative, you (tú), with 'le' (him) stuck on the end: 'dress him'. The e of the stem becomes i when stressed: visto, vistes, viste, vestimos, vestís, visten; the tú imperative is 'viste', and a pronoun is always hung on a positive command. 'le' for a male person as object is leísmo."}
          - {w: "disimule, parezca", f: "disimul- + -e → disimular (to disguise) and parezc- + -a → parecer (to seem), present subjunctive, he, after 'de modo que' expressing purpose. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en; parecer (to seem): parezca, parezcas, parezca, parezcamos, parezcáis, parezcan."}
          - {w: "ha de ser", f: "ha (haber, to have, present, he: he, has, ha, hemos, habéis, han) + de + ser (to be): 'haber de' with an infinitive, 'is to be, is going to be'."}
