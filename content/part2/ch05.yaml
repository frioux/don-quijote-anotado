          - {w: "pensar + infinitive", d: "to expect to, intend to"}
          - {w: "antes de mucho tiempo", d: "before long"}
          - {w: "ínsula", d: "isle: the old, bookish word of the romances, which Sancho has learned from Don Quijote (modern 'isla')"}
          - {w: "caerse muerto", d: "to drop dead"}
