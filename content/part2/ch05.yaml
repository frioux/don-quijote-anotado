  - sentences:
      - es: "— Bien creo yo, marido —replicó Teresa—, que los escuderos andantes no comen el pan de balde; y así, quedaré rogando a Nuestro Señor os saque presto de tanta mala ventura."
        literal: "— Well believe I, husband —replied Teresa—, that the squires errant not eat the bread for free; and so, I-shall-remain praying to Our Lord [that] you he-may-take-out soon from so-much bad fortune."
        ormsby: "“I know well enough, husband,” said Teresa, “that squires-errant don’t eat their bread for nothing, and so I will be always praying to our Lord to deliver you speedily from all that hard fortune.”"
        vocab:
          - {w: "de balde", d: "for nothing, free"}
          - {w: "escudero andante", d: "squire-errant (comic match for 'caballero andante')"}
          - {w: "quedar + gerund", d: "to stay doing, keep on doing"}
          - {w: "rogar", d: "to pray, beg"}
          - {w: "presto", d: "soon, quickly (literary)"}
          - {w: "mala ventura", d: "misfortune, hardship"}
        diagram:
          - s: "Bien creo yo"
            r: "main verb 1: I well believe"
            under:
              - {s: "marido", r: "who is addressed: husband"}
              - {s: "que los escuderos andantes no comen el pan de balde", r: "what I believe: that squires-errant don't eat their bread for nothing"}
          - {s: "replicó Teresa", r: "speech tag: Teresa replied"}
          - s: "y así, quedaré rogando a Nuestro Señor"
            r: "main verb 2: and so I'll keep praying to Our Lord"
            under:
              - {s: "os saque presto de tanta mala ventura", r: "what I'll pray: that he soon get you out of such hardship"}
        forms:
          - {w: "creo", f: "cre- + -o → creer (to believe), present, I. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "comen", f: "com- + -en → comer (to eat), present, they. Same -er present: como, comes, come, comemos, coméis, comen."}
          - {w: "quedaré", f: "quedar- + -é → quedar (to remain), future, I. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "rogando", f: "gerund of rogar (to pray): 'quedaré rogando' = I'll keep praying."}
          - {w: "os saque", f: "saqu- + -e → sacar (to take out), present subjunctive, he (Our Lord), with 'os' (you, vos) before it; c becomes qu before e. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. Cervantes leaves out 'que' before the subjunctive after a verb of asking."}
          - {w: "tanta", f: "tant- + -a → tanto (so much), feminine to match 'ventura'."}
