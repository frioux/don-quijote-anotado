      - es: "que si de los zuecos la sacáis a chapines, y de saya parda de catorceno a verdugado y saboyanas de seda, y de una Marica y un tú a una doña tal y señoría, no se ha de hallar la mochacha, y a cada paso ha de caer en mil faltas, descubriendo la hilaza de su tela basta y grosera."
        literal: "for if from the clogs her you-take-out to platform-shoes, and from skirt brown of fourteen-hundred-thread to hoop-skirt and Savoy-gowns of silk, and from a Marica and a thou to a Doña So-and-so and ladyship, not herself has to find the girl, and at each step she-has to fall into thousand faults, uncovering the thread of her cloth coarse and rough."
