      - es: "Mirad también que Mari Sancha, vuestra hija, no se morirá si la casamos; que me va dando barruntos que desea tanto tener marido como vos deseáis veros con gobierno; y, en fin en fin, mejor parece la hija mal casada que bien abarraganada."
