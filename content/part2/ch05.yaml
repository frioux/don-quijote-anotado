              - {s: "que es lo más acertado", r: "why: for that is the wisest course"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, she. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "casadla", f: "casad + la → casar (to marry off), imperative, you (vos), with 'la' (her) stuck on the end. The vos/vosotros imperative swaps the final -r of the infinitive for -d: casad, comed, vivid. Teresa calls her husband 'vos', the respectful old form of 'you', while he calls her 'tú'."}
