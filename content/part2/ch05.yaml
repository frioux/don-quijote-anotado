          - {s: "respondió Sancho", r: "speech tag: Sancho answered"}
        forms:
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "os", f: "'to you': the object pronoun of vos; Sancho is back to calling his wife vos."}
          - {w: "pensase", f: "pens- + -ase → pensar (to think, expect), imperfect subjunctive (-se form), I, after 'si' in an unreal condition. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "verme", f: "ver (to see) + me (myself), the pronoun hung on the end of the infinitive."}
          - {w: "caería", f: "caer- + -ía → caer (to fall), conditional, I, with 'me' (myself): 'I would drop'. The conditional adds -ía, -ías, -ía, -íamos, -íais, -ían to the infinitive."}
