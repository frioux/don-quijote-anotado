                under:
                  - {s: "aunque tú más me digas", r: "concession: whatever you say"}
        forms:
          - {w: "hablemos", f: "habl- + -emos → hablar (to speak), present subjunctive, we: 'let's (not) speak'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "ha de ser", f: "ha → haber (to have), present, she: he, has, ha, hemos, habéis, han; + de + ser (to be): 'haber de' + infinitive = is going to, must."}
          - {w: "Sanchica", f: "Sanch- + -ica: the feminine of Sancho with the diminutive -ica, a pet name for the daughter."}
          - {w: "digas", f: "dig- + -as → decir (to say), present subjunctive, you (tú), after 'aunque' for 'even if'. Irregular: diga, digas, diga, digamos, digáis, digan."}
  - sentences:
      - es: "— ¿Veis cuanto decís, marido? —respondió Teresa—. Pues, con todo eso, temo que este condado de mi hija ha de ser su perdición."
