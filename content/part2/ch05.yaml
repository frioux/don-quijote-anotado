  - sentences:
      - es: "— Medíos, Sancho, con vuestro estado —respondió Teresa—; no os queráis alzar a mayores, y advertid al refrán que dice: \"Al hijo de tu vecino, límpiale las narices y métele en tu casa\"."
        literal: "— Measure-yourself, Sancho, with your station —answered Teresa—; not yourself you-should-want to-raise to greater [things], and heed [to] the proverb that says: \"To-the son of your neighbour, wipe-him the noses and put-him in your house\"."
        ormsby: "“Keep to your own station, Sancho,” replied Teresa; “don’t try to raise yourself higher, and bear in mind the proverb that says, ‘wipe the nose of your neighbour’s son, and take him into your house.’"
        ormsby_note: "Proverb 113."
        vocab:
          - {w: "medirse con", d: "to measure oneself by, keep within (one's means or rank)"}
          - {w: "estado", d: "station, rank in life; also marital state"}
          - {w: "alzarse a mayores", d: "to get above oneself, aim too high"}
          - {w: "advertir a", d: "to heed, take note of (old construction with 'a')"}
          - {w: "refrán", d: "proverb, saying"}
          - {w: "narices", d: "nose (Spanish often uses the plural, 'nostrils')"}
          - {w: "Al hijo de tu vecino ...", d: "proverb: marry your daughter to the neighbour's boy, someone you know, even if you have to wipe his nose; i.e. look for a match close to home"}
        diagram:
          - {s: "Medíos, Sancho, con vuestro estado", r: "main verb 1: keep to your station, Sancho"}
          - {s: "respondió Teresa", r: "speech tag: Teresa answered"}
          - s: "no os queráis alzar a mayores"
            r: "main verb 2: don't try to rise higher"
          - s: "y advertid al refrán"
            r: "main verb 3: and heed the proverb"
            under:
              - s: "que dice:"
                r: "describes 'refrán': which says"
                under:
                  - {s: "Al hijo de tu vecino, límpiale las narices y métele en tu casa", r: "the proverb: wipe your neighbour's son's nose and take him into your house"}
        forms:
          - {w: "Medíos", f: "medid + os → medirse (to measure oneself), imperative, you (vos), with 'os' (yourself) on the end; the -d of 'medid' drops before 'os', as always in this form (sentaos, idos). The vos/vosotros imperative swaps the final -r of the infinitive for -d: medid, comed, vivid. Teresa calls her husband 'vos'."}
          - {w: "vuestro", f: "'your', the possessive that goes with 'vos'; masculine to match 'estado'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, she. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "no os queráis alzar", f: "quer- + -áis → querer (to want), present subjunctive, you (vos): quiera, quieras, quiera, queramos, queráis, quieran; + alzar (to raise) with 'os' (yourself) placed before the group. A negative command uses the present subjunctive: 'don't try to raise yourself'."}
          - {w: "advertid", f: "advert- + -id → advertir (to heed), imperative, you (vos). The vos/vosotros imperative swaps the final -r of the infinitive for -d: advertid, comed, vivid."}
          - {w: "al", f: "a + el, the contraction: 'heed the proverb', old construction 'advertir a'."}
          - {w: "dice", f: "dic- + -e → decir (to say), present, it. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "límpiale", f: "limpia + le → limpiar (to wipe), imperative, you (tú), with 'le' (for him) on the end; accent added to keep the stress. The tú imperative of regular verbs is the same as the he/she present: limpia, come, vive. Proverbs speak to 'tú'."}
          - {w: "métele", f: "mete + le → meter (to put), imperative, you (tú), with 'le' (him) on the end; accent added. 'le' for a male person as object is leísmo, normal in Cervantes (modern 'mételo')."}
        note: "Teresa's proverb has the sense 'marry within your own circle', the neighbour's boy whose nose you once wiped. Ormsby lists it among his numbered proverbs."
      - es: "¡Por cierto, que sería gentil cosa casar a nuestra María con un condazo, o con caballerote que, cuando se le antojase, la pusiese como nueva, llamándola de villana, hija del destripaterrones y de la pelarruecas! ¡No en mis días, marido!"
