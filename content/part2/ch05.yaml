  - sentences:
      - es: "— A buena fe —respondió Sancho— que si Dios me llega a tener algo qué de gobierno, que tengo de casar, mujer mía, a Mari Sancha tan altamente que no la alcancen sino con llamarla señora."
        literal: "— In good faith —answered Sancho— that if God me brings to have something [of] what of government, that I-have to marry, wife mine, [to] Mari Sancha so highly that not her they-may-reach except with calling-her lady."
        ormsby: "“By my faith,” replied Sancho, “if God brings me to get any sort of a government, I intend, wife, to make such a high match for Mari-Sancha that there will be no approaching her without calling her ‘my lady.”"
        vocab:
          - {w: "a buena fe", d: "in good faith, honestly, I swear"}
          - {w: "llegar a", d: "to come to, manage to (do something)"}
          - {w: "algo qué de gobierno", d: "some sort of government, a bit of a governorship; Sancho's muddled 'algo de' with an extra 'qué'"}
          - {w: "tener de", d: "= haber de, to have to, to be going to (rustic and old use)"}
          - {w: "altamente", d: "highly, to someone of high rank"}
          - {w: "alcanzar", d: "to reach, catch up with; here 'approach, get near'"}
          - {w: "no ... sino", d: "only, not ... except"}
        diagram:
          - s: "respondió Sancho"
            r: "speech tag: Sancho answered"
          - s: "que tengo de casar"
            r: "main verb (after 'a buena fe que', I swear that): I am going to marry off"
            under:
              - {s: "A buena fe", r: "oath: in good faith, I swear"}
              - {s: "si Dios me llega a tener algo qué de gobierno", r: "condition: if God brings me to have some sort of government"}
              - {s: "mujer mía", r: "addressed: my wife"}
              - {s: "a Mari Sancha", r: "object: Mari Sancha, his daughter"}
              - s: "tan altamente"
                r: "how: so highly"
                under:
                  - {s: "que no la alcancen sino con llamarla señora", r: "result: that no one will get near her without calling her 'my lady'"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "llega", f: "lleg- + -a → llegar (to arrive; with 'a', to bring to), present, he (God). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. Present after 'si' for a real condition."}
          - {w: "tener", f: "infinitive of tener (to have), after 'llega a': 'brings me to have'."}
          - {w: "tengo de casar", f: "teng- + -o → tener (to have), present, I: tengo, tienes, tiene, tenemos, tenéis, tienen; + de + casar (to marry off). 'tener de' with an infinitive is the old and rustic twin of 'haber de' (to have to, to be going to): 'I'm going to marry her off'. The extra 'que' before it repeats the 'que' of 'a buena fe que', as people do in speech."}
          - {w: "mía", f: "mí- + -a → mío (my), feminine to match 'mujer'; after the noun it is affectionate: 'wife of mine'."}
          - {w: "alcancen", f: "alcanc- + -en → alcanzar (to reach), present subjunctive, they (people in general); z becomes c before e. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. Subjunctive in a result clause about something that has not yet happened."}
          - {w: "llamarla", f: "llamar (to call) + la (her), the pronoun hung on the infinitive after 'con' (by)."}
