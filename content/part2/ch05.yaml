                    under:
                      - {s: "que tuvieron moros en su linaje los Almohadas de Marruecos", r: "comparison: than the Almohads of Morocco had Moors in their line"}
        forms:
          - {w: "te la chanto", f: "chant- + -o → chantar (to clap on), present, I: 'I clap on her'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. 'la' = her (the daughter); 'te' = for you, an 'ethical dative' that draws the listener in, like English 'I'll clap you a title on her'. The present stands for a future after 'si'."}
          - {w: "te la saco", f: "sac- + -o → sacar (to take out), present, I. Same -ar present: saco, sacas, saca, sacamos, sacáis, sacan. The same 'te' (for you) and 'la' (her) as with 'chanto'."}
          - {w: "te la pongo", f: "pong- + -o → poner (to put), present, I. Irregular: pongo, pones, pone, ponemos, ponéis, ponen."}
          - {w: "tuvieron", f: "tuv- + -ieron → tener (to have), preterite, they. Irregular: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron."}
          - {w: "has de consentir", f: "has → haber (to have), present, you (tú): he, has, ha, hemos, habéis, han; + de + consentir (to consent): 'haber de' = must, should; 'why should you not consent'."}
          - {w: "querer", f: "infinitive of querer (to want), also hung on 'has de'."}
          - {w: "quiero", f: "quier- + -o → querer (to want), present, I. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
        note: "Sancho's comparison is a muddle: he thinks the Almohads, a Moorish dynasty, must have been named after 'almohadas' (cushions), and so must have had piles of them. The cushioned estrado was where ladies of rank sat."
