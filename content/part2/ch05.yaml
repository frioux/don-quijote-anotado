part: 2
chapter: 5
title_es: "Capítulo V. De la discreta y graciosa plática que pasó entre Sancho Panza y su mujer Teresa Panza, y otros sucesos dignos de felice recordación"
title_en: "Of the shrewd and droll conversation that passed between Sancho Panza and his wife Teresa Panza, and other matters worthy of being duly recorded"
paragraphs:
  - sentences:
      - es: "(Llegando a escribir el traductor desta historia este quinto capítulo, dice que le tiene por apócrifo, porque en él habla Sancho Panza con otro estilo del que se podía prometer de su corto ingenio, y dice cosas tan sutiles, que no tiene por posible que él las supiese;"
        literal: "(Arriving to write the translator of-this history this fifth chapter, he-says that it he-holds as apocryphal, because in it speaks Sancho Panza with another style than-the [one] that one could promise-oneself from his short wit, and says things so subtle, that not he-holds as possible that he them might-know;"
        ormsby: "The translator of this history, when he comes to write this fifth chapter, says that he considers it apocryphal, because in it Sancho Panza speaks in a style unlike that which might have been expected from his limited intelligence, and says things so subtle that he does not think it possible he could have conceived them;"
        vocab:
          - {w: "llegar a", d: "to come to, reach the point of (doing something)"}
          - {w: "desta", d: "= de esta, of this (old contraction)"}
          - {w: "tener por", d: "to consider, hold to be ('le tiene por apócrifo' = he considers it apocryphal)"}
          - {w: "apócrifo", d: "apocryphal: spurious, not genuine, of doubtful authorship"}
          - {w: "prometerse", d: "to expect, hope for (from someone)"}
          - {w: "corto ingenio", d: "limited wit, small intelligence"}
          - {w: "sutil", d: "subtle, clever, finely reasoned"}
        diagram:
          - s: "dice"
            r: "main verb: he says"
            under:
              - s: "Llegando a escribir"
                r: "when: coming to write"
                under:
                  - {s: "el traductor desta historia", r: "subject: the translator of this history"}
                  - {s: "este quinto capítulo", r: "object of 'escribir': this fifth chapter"}
              - {s: "que le tiene por apócrifo", r: "what he says: that he considers it apocryphal"}
              - s: "porque en él habla Sancho Panza con otro estilo"
                r: "why, 1: because in it Sancho speaks in a different style"
                under:
                  - {s: "del que se podía prometer de su corto ingenio", r: "describes 'otro estilo': from the one you could expect of his small wit"}
              - s: "y dice cosas tan sutiles"
                r: "why, 2: and he says such subtle things"
                under:
                  - {s: "que no tiene por posible que él las supiese", r: "result: that he does not think it possible Sancho knew them"}
        forms:
          - {w: "Llegando", f: "gerund of llegar (to arrive, come to): 'coming (to write)'. The gerund of -ar verbs ends in -ando."}
          - {w: "desta", f: "de + esta (this), feminine to match 'historia'; modern 'de esta'."}
          - {w: "este quinto", f: "este (this), masculine singular to match 'capítulo'; quinto = fifth."}
          - {w: "dice", f: "dic- + -e → decir (to say), present, he. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "le tiene", f: "tien- + -e → tener (to hold), present, he: tengo, tienes, tiene, tenemos, tenéis, tienen. 'le' stands for the chapter (a thing): Cervantes often uses le where modern Spanish wants lo."}
          - {w: "habla", f: "habl- + -a → hablar (to speak), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "del que", f: "de + el que, 'than the one which': after 'otro' (other), Spanish uses 'de' / 'que' where English says 'than'."}
          - {w: "se podía prometer", f: "pod- + -ía → poder (to be able), imperfect, one, + prometer (to promise) with 'se' (oneself): 'one could expect'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "supiese", f: "sup- + -iese → saber (to know), imperfect subjunctive (-se form), he; built on the preterite supieron: supiese, supieses, supiese, supiésemos, supieseis, supiesen. Subjunctive after 'no tiene por posible que' (he does not think it possible that)."}
        note: "Cervantes pretends that his story is translated from the Arabic of Cide Hamete Benengeli. Here the fictional translator steps in to doubt his own text, a joke on Sancho, who in this chapter speaks more cleverly than usual."
      - es: "pero que no quiso dejar de traducirlo, por cumplir con lo que a su oficio debía; y así, prosiguió diciendo:)"
        literal: "but that not he-wanted to-leave-off of translating-it, for to-comply with that which to his office he-owed; and so, he-continued saying:)"
        ormsby: "however, desirous of doing what his task imposed upon him, he was unwilling to leave it untranslated, and therefore he went on to say:"
        vocab:
          - {w: "dejar de", d: "to stop, fail to (do); 'no quiso dejar de' = he would not leave out, he would not fail to"}
          - {w: "cumplir con", d: "to fulfil, do one's duty by"}
          - {w: "oficio", d: "office, job, duty (false friend: not an 'office' room)"}
          - {w: "proseguir", d: "to go on, continue"}
        diagram:
          - s: "pero que no quiso dejar de traducirlo"
            r: "main verb 1 (still after 'dice'): but that he would not leave it untranslated"
            under:
              - {s: "por cumplir con lo", r: "why: to fulfil what"}
              - {s: "que a su oficio debía", r: "describes 'lo': what he owed to his office"}
          - s: "y así, prosiguió diciendo:"
            r: "main verb 2: and so he went on, saying"
        forms:
          - {w: "quiso", f: "quis- + -o → querer (to want), preterite, he: 'he would (not)'. Irregular: quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "traducirlo", f: "traducir (to translate) + lo (it, the chapter), the pronoun hung on the end of the infinitive after 'dejar de'."}
          - {w: "debía", f: "deb- + -ía → deber (to owe), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "prosiguió", f: "prosigu- + -ió → proseguir (to continue), preterite, he; the stem e becomes i in the he/they forms: proseguí, proseguiste, prosiguió, proseguimos, proseguisteis, prosiguieron."}
          - {w: "diciendo", f: "gerund of decir (to say), with the stem e → i: 'saying'."}
  - sentences:
      - es: "Llegó Sancho a su casa tan regocijado y alegre, que su mujer conoció su alegría a tiro de ballesta; tanto, que la obligó a preguntarle:"
        literal: "Arrived Sancho to his house so overjoyed and cheerful, that his wife recognised his joy at shot of crossbow; so-much, that her it-obliged to ask-him:"
        ormsby: "Sancho came home in such glee and spirits that his wife noticed his happiness a bowshot off, so much so that it made her ask him,"
        vocab:
          - {w: "regocijado", d: "overjoyed, delighted"}
          - {w: "conocer", d: "here 'to notice, recognise' (not 'to know')"}
          - {w: "a tiro de ballesta", d: "a crossbow-shot away, i.e. from far off; 'ballesta' = crossbow"}
          - {w: "tanto, que", d: "so much so that"}
        diagram:
          - s: "Llegó"
            r: "main verb 1: arrived"
            under:
              - {s: "Sancho", r: "subject: who arrived"}
              - {s: "a su casa", r: "where: at his house"}
              - s: "tan regocijado y alegre"
                r: "how: so overjoyed and cheerful"
                under:
                  - {s: "que su mujer conoció su alegría a tiro de ballesta", r: "result: that his wife saw his joy from a crossbow-shot away"}
          - s: "tanto, que la obligó a preguntarle:"
            r: "result, 2: so much that it made her ask him"
        forms:
          - {w: "Llegó", f: "lleg- + -ó → llegar (to arrive), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (llegué, with g → gu before e). The verb comes before its subject."}
          - {w: "regocijado", f: "regocij- + -ado → regocijar (to delight), participle used as an adjective, masculine to match 'Sancho'."}
          - {w: "conoció", f: "conoc- + -ió → conocer (to know, recognise), preterite, she. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "obligó", f: "oblig- + -ó → obligar (to oblige, make), preterite, it (his joy). Same -ó preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "preguntarle", f: "preguntar (to ask) + le (him), the pronoun hung on the end of the infinitive after 'a'."}
  - sentences:
      - es: "— ¿Qué traés, Sancho amigo, que tan alegre venís?"
        literal: "— What do-you-bring, Sancho friend, that so cheerful you-come?"
        ormsby: "“What have you got, Sancho friend, that you are so glad?”"
        vocab:
          - {w: "traés", d: "= traéis, you bring (rustic vos form); 'what are you bringing?' = what's up with you?"}
          - {w: "Sancho amigo", d: "affectionate address, 'my friend Sancho'"}
        diagram:
          - s: "¿Qué traés"
            r: "main verb: what are you bringing"
            under:
              - {s: "Sancho amigo", r: "who is addressed"}
              - {s: "que tan alegre venís?", r: "why she asks: since you come so cheerful"}
        forms:
          - {w: "traés", f: "tra- + -és → traer (to bring), present, you (vos, said to one person). Old rustic form of 'traéis'; the vos/vosotros present of traer (to bring): traigo, traes, trae, traemos, traéis, traen. Husband and wife address each other as vos here, a polite-affectionate 'you' with plural verb forms."}
          - {w: "venís", f: "ven- + -ís → venir (to come), present, you (vos). Irregular: vengo, vienes, viene, venimos, venís, vienen. The vos form uses the plural 'venís' even for one person."}
  - sentences:
      - es: "A lo que él respondió:"
        literal: "To that which he answered:"
        ormsby: "To which he replied,"
        vocab:
          - {w: "a lo que", d: "to which"}
        diagram:
          - s: "él respondió:"
            r: "main verb: he answered"
            under:
              - {s: "A lo que", r: "to what: to which (her question)"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "lo que", f: "lo, the neuter article, + que: 'that which', here 'which' referring to her whole question."}
  - sentences:
      - es: "— Mujer mía, si Dios quisiera, bien me holgara yo de no estar tan contento como muestro."
        literal: "— Wife mine, if God should-wish, well myself I-would-be-glad I of not to-be so content as I-show."
        ormsby: "“Wife, if it were God’s will, I should be very glad not to be so well pleased as I show myself.”"
        vocab:
          - {w: "holgarse de", d: "to be glad of, take pleasure in (literary)"}
          - {w: "si Dios quisiera", d: "if God so willed, if it were God's will"}
          - {w: "mostrar", d: "to show; 'como muestro' = as I show, as I seem"}
        diagram:
          - s: "bien me holgara yo"
            r: "main verb: I would be very glad"
            under:
              - {s: "Mujer mía", r: "who is addressed: my wife"}
              - {s: "si Dios quisiera", r: "condition: if God willed it"}
              - s: "de no estar tan contento"
                r: "of what: of not being so pleased"
                under:
                  - {s: "como muestro", r: "comparison: as I show myself"}
        forms:
          - {w: "quisiera", f: "quis- + -iera → querer (to want), imperfect subjunctive (-ra form), he (God): 'if God wished'. quisiera, quisieras, quisiera, quisiéramos, quisierais, quisieran. Subjunctive after 'si' in an unreal condition."}
          - {w: "me holgara", f: "holg- + -ara → holgarse (to be glad), -ra form used as a conditional, I: 'I would be glad'. The -ra form of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran. Cervantes often uses it where modern Spanish says 'me holgaría'."}
          - {w: "muestro", f: "muestr- + -o → mostrar (to show), present, I. The stem o becomes ue when stressed: muestro, muestras, muestra, mostramos, mostráis, muestran."}
        note: "Sancho's riddle: he is happy to be going off with Don Quijote again, but if God had willed him to prosper at home, he would gladly not have this happiness. Teresa, reasonably, does not follow."
  - sentences:
      - es: "— No os entiendo, marido —replicó ella—, y no sé qué queréis decir en eso de que os holgáredes, si Dios quisiera, de no estar contento; que, maguer tonta, no sé yo quién recibe gusto de no tenerle."
        literal: "— Not you I-understand, husband —replied she—, and not I-know what you-mean to-say in that of that you would-be-glad, if God should-wish, of not to-be content; for, although foolish, not know I who receives pleasure from not having-it."
        ormsby: "“I don’t understand you, husband,” said she, “and I don’t know what you mean by saying you would be glad, if it were God’s will, not to be well pleased; for, fool as I am, I don’t know how one can find pleasure in not having it.”"
        vocab:
          - {w: "querer decir", d: "to mean"}
          - {w: "en eso de que", d: "in that business of, by that talk about"}
          - {w: "maguer", d: "although (already archaic in Cervantes' day; rustic speech): 'maguer tonta' = fool though I am"}
          - {w: "recibir gusto de", d: "to take pleasure in"}
        diagram:
          - s: "No os entiendo"
            r: "main verb 1: I don't understand you"
            under:
              - {s: "marido", r: "who is addressed: husband"}
          - {s: "replicó ella", r: "speech tag: she replied"}
          - s: "y no sé"
            r: "main verb 2: and I don't know"
            under:
              - s: "qué queréis decir en eso de que os holgáredes"
                r: "what she does not know: what you mean by saying you would be glad"
                under:
                  - {s: "si Dios quisiera", r: "condition: if God willed it"}
                  - {s: "de no estar contento", r: "of what: of not being pleased"}
          - s: "no sé yo"
            r: "main verb 3 (after 'que', for): I don't know"
            under:
              - {s: "maguer tonta", r: "aside: fool though I am"}
              - {s: "quién recibe gusto de no tenerle", r: "what she does not know: who takes pleasure in not having it"}
        forms:
          - {w: "os", f: "'you', object pronoun of vos/vosotros; she calls her husband vos, with plural verb forms, as he does her."}
          - {w: "entiendo", f: "entiend- + -o → entender (to understand), present, I. The stem e becomes ie when stressed: entiendo, entiendes, entiende, entendemos, entendéis, entienden."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (repliqué, with c → qu before e)."}
          - {w: "sé", f: "saber (to know), present, I. Irregular: sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "queréis", f: "quer- + -éis → querer (to want), present, you (vos, said to one person). quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "os holgáredes", f: "holg- + -áredes → holgarse (to be glad), future subjunctive, you (vos). Old ending -áredes for modern -areis. The future subjunctive of -ar verbs: -are, -ares, -are, -áremos, -areis (-áredes), -aren. She mixes it up: Sancho had said 'me holgara', a conditional."}
          - {w: "quisiera", f: "quis- + -iera → querer (to want), imperfect subjunctive (-ra form), he (God). quisiera, quisieras, quisiera, quisiéramos, quisierais, quisieran."}
          - {w: "recibe", f: "recib- + -e → recibir (to receive), present, he. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "tenerle", f: "tener (to have) + le (it, the pleasure 'gusto'), the pronoun hung on the infinitive after 'de'. Cervantes uses 'le' for a masculine thing where modern Spanish says 'tenerlo'."}
  - sentences:
      - es: "— Mirad, Teresa —respondió Sancho—: yo estoy alegre porque tengo determinado de volver a servir a mi amo don Quijote, el cual quiere la vez tercera salir a buscar las aventuras;"
        literal: "— Look, Teresa —answered Sancho—: I am cheerful because I-have determined of to-return to serve [to] my master Don Quijote, the which wants the time third to-go-out to seek the adventures;"
        ormsby: "“Hark ye, Teresa,” replied Sancho, “I am glad because I have made up my mind to go back to the service of my master Don Quixote, who means to go out a third time to seek for adventures;"
        vocab:
          - {w: "mirad", d: "look, listen (to get attention)"}
          - {w: "tener determinado de", d: "to have decided to (old construction; modern 'he decidido')"}
          - {w: "volver a", d: "to do again; 'volver a servir' = to serve again"}
          - {w: "amo", d: "master, employer"}
          - {w: "la vez tercera", d: "the third time"}
        diagram:
          - {s: "Mirad, Teresa", r: "attention-getter: look, Teresa"}
          - {s: "respondió Sancho", r: "speech tag: Sancho answered"}
          - s: "yo estoy alegre"
            r: "main verb: I am cheerful"
            under:
              - s: "porque tengo determinado de volver a servir a mi amo don Quijote"
                r: "why: because I have decided to serve my master again"
                under:
                  - s: "el cual quiere la vez tercera salir"
                    r: "describes 'don Quijote': who wants to go out a third time"
                    under:
                      - {s: "a buscar las aventuras", r: "why: to seek adventures"}
        forms:
          - {w: "Mirad", f: "mir- + -ad → mirar (to look), imperative, you (vos): 'look!'. The vos/vosotros imperative swaps the final -r of the infinitive for -d: mirad, comed, vivid."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "estoy", f: "estar (to be), present, I: estoy, estás, está, estamos, estáis, están."}
          - {w: "tengo determinado", f: "teng- + -o → tener (to have), present, I: tengo, tienes, tiene, tenemos, tenéis, tienen; + determinado, participle of determinar (to decide). 'tener' + participle works like a perfect tense: 'I have decided'."}
          - {w: "el cual", f: "'who', masculine to match 'don Quijote'; a heavier relative than 'que', used after a comma."}
          - {w: "quiere", f: "quier- + -e → querer (to want), present, he. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
      - es: "y yo vuelvo a salir con él, porque lo quiere así mi necesidad, junto con la esperanza, que me alegra, de pensar si podré hallar otros cien escudos como los ya gastados, puesto que me entristece el haberme de apartar de ti y de mis hijos;"
        literal: "and I return to go-out with him, because it wants so my need, together with the hope, which me cheers, of thinking if I-shall-be-able to-find another hundred crowns like the [ones] already spent, although me saddens the having-myself to part from you and from my children;"
        ormsby: "and I am going with him again, for my necessities will have it so, and also the hope that cheers me with the thought that I may find another hundred crowns like those we have spent; though it makes me sad to have to leave thee and the children;"
        vocab:
          - {w: "volver a salir", d: "to go out again"}
          - {w: "necesidad", d: "need, want, poverty"}
          - {w: "escudo", d: "crown, a gold coin (literally 'shield', from the arms stamped on it)"}
          - {w: "gastado", d: "spent"}
          - {w: "puesto que", d: "although (in Cervantes; false friend: not 'since')"}
          - {w: "entristecer", d: "to sadden"}
          - {w: "haber de", d: "to have to, must"}
          - {w: "apartarse de", d: "to part from, leave"}
        diagram:
          - s: "y yo vuelvo a salir con él"
            r: "main verb: and I am going out with him again"
            under:
              - s: "porque lo quiere así mi necesidad"
                r: "why: because my need wants it so"
                under:
                  - s: "junto con la esperanza"
                    r: "with what: together with the hope"
                    under:
                      - {s: "que me alegra", r: "describes 'esperanza': which cheers me"}
                      - {s: "de pensar si podré hallar otros cien escudos como los ya gastados", r: "describes 'esperanza': of thinking I may find another hundred crowns like those already spent"}
              - {s: "puesto que me entristece el haberme de apartar de ti y de mis hijos", r: "concession: although having to leave you and my children saddens me"}
        forms:
          - {w: "vuelvo", f: "vuelv- + -o → volver (to return), present, I. The stem o becomes ue when stressed: vuelvo, vuelves, vuelve, volvemos, volvéis, vuelven."}
          - {w: "quiere", f: "quier- + -e → querer (to want), present, it (my need). The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren. The subject 'mi necesidad' follows the verb."}
          - {w: "alegra", f: "alegr- + -a → alegrar (to cheer), present, it (the hope). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "podré", f: "podr- + -é → poder (to be able), future, I. Irregular stem podr-: podré, podrás, podrá, podremos, podréis, podrán."}
          - {w: "gastados", f: "gast- + -ados → gastar (to spend), participle, masculine plural to match 'escudos' (understood after 'los')."}
          - {w: "entristece", f: "entristec- + -e → entristecer (to sadden), present, it. The present of -er verbs: -o (entristezco, irregular I-form), -es, -e, -emos, -éis, -en."}
          - {w: "el haberme de apartar", f: "el + infinitive makes a noun, 'the having to': haber (to have) + me (myself) hung on the end + de apartar (to part). 'haber de' + infinitive = to have to."}
          - {w: "ti", f: "the form of tú after a preposition ('de ti'). Here Sancho switches from vos to tú with his wife, as he does throughout the chapter."}
        note: "The hundred crowns are the gold Sancho found in the valise in the Sierra Morena in Part I and kept; he spent them at home, as he told the bachelor Carrasco in the previous chapter."
      - es: "y si Dios quisiera darme de comer a pie enjuto y en mi casa, sin traerme por vericuetos y encrucijadas, pues lo podía hacer a poca costa y no más de quererlo, claro está que mi alegría fuera más firme y valedera, pues que la que tengo va mezclada con la tristeza del dejarte;"
        literal: "and if God should-want to-give-me to eat at foot dry and in my house, without bringing-me through rough-paths and crossroads, since it he-could do at little cost and no more than wanting-it, clear it-is that my joy would-be more firm and lasting, since the [one] that I-have goes mixed with the sadness of-the leaving-you;"
        ormsby: "and if God would be pleased to let me have my daily bread, dry-shod and at home, without taking me out into the byways and cross-roads—and he could do it at small cost by merely willing it—it is clear my happiness would be more solid and lasting, for the happiness I have is mingled with sorrow at leaving thee;"
        vocab:
          - {w: "dar de comer", d: "to feed, give a living"}
          - {w: "a pie enjuto", d: "dry-shod, i.e. without effort or hardship ('enjuto' = dry)"}
          - {w: "vericueto", d: "rough, rocky path"}
          - {w: "encrucijada", d: "crossroads"}
          - {w: "a poca costa", d: "at little cost, easily"}
          - {w: "no más de", d: "just by, merely"}
          - {w: "claro está", d: "it's clear, of course"}
          - {w: "valedero", d: "lasting, valid"}
          - {w: "pues que", d: "since, because"}
        diagram:
          - s: "claro está"
