      - es: "si yo dijera que mi hija se arrojara de una torre abajo, o que se fuera por esos mundos, como se quiso ir la infanta doña Urraca, tenías razón de no venir con mi gusto;"
        literal: "if I had-said that my daughter should-throw-herself from a tower down, or that she-should-go-off through those worlds, as herself wanted to-go the infanta Doña Urraca, you-had reason of not coming with my wish;"
        ormsby: "if I had said that my daughter was to throw herself down from a tower, or go roaming the world, as the Infanta Doña Urraca wanted to do, you would be right in not giving way to my will;"
        ormsby_note: "The Infanta Urraca was the daughter of Ferdinand I of Castile and León, who, finding herself omitted in her father's will, threatened to disgrace him by taking to a disreputable life. He in consequence altered his will and left her the city of Zamora, adding his curse upon him who should attempt to take it from her; a curse which shortly afterwards took effect when her brother Sancho, besieging the city, was treacherously slain by Vellido Dolfos. The story is the subject of two ballads (Morir vos Queredes, Padre, and Acababa el Rey Fernando)."
        vocab:
          - {w: "arrojarse", d: "to throw oneself, hurl oneself"}
          - {w: "de una torre abajo", d: "down from a tower"}
          - {w: "irse por esos mundos", d: "to go roaming the world, go off wandering (with a hint of a loose life)"}
          - {w: "infanta", d: "a king's daughter, princess (not 'infant')"}
          - {w: "Urraca", d: "Doña Urraca, 11th-century princess of León and Castile, lady of Zamora, a heroine of the ballads"}
          - {w: "tener razón", d: "to be right"}
          - {w: "venir con", d: "to go along with, agree with; 'no venir con mi gusto' = not to fall in with my wish"}
        diagram:
          - s: "tenías razón"
            r: "main verb: you would be right"
            under:
              - s: "si yo dijera"
                r: "condition: if I said"
                under:
