            under:
              - s: "si éste"
                r: "condition: if this man"
                under:
                  - {s: "a quien la fortuna sacó del borrador de su bajeza", r: "describes 'éste': whom fortune took from his humble beginnings"}
                  - {s: "(que por estas mesmas razones lo dijo el padre)", r: "aside: those were the preacher's very words"}
