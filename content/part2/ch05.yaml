          - {w: "se entienda", f: "entiend- + -a → entenderse (to understand oneself), present subjunctive, she. Same subjunctive as 'entiendan': entienda, entiendas, entienda, entendamos, entendáis, entiendan."}
  - sentences:
      - es: "— Ven acá, bestia y mujer de Barrabás —replicó Sancho—: ¿por qué quieres tú ahora, sin qué ni para qué, estorbarme que no case a mi hija con quien me dé nietos que se llamen señoría?"
        literal: "— Come here, beast and wife of Barabbas —replied Sancho—: why do-want you now, without what nor for what, to-hinder-me that not I-may-marry [to] my daughter with whom to-me may-give grandchildren who themselves may-call lordship?"
        ormsby: "“Why, you idiot and wife for Barabbas,” said Sancho, “what do you mean by trying, without why or wherefore, to keep me from marrying my daughter to one who will give me grandchildren that will be called ‘your lordship’?"
        vocab:
          - {w: "ven acá", d: "come here; also an exasperated 'now look here'"}
          - {w: "bestia", d: "beast, brute; as an insult, blockhead"}
          - {w: "mujer de Barrabás", d: "'wife of Barabbas', i.e. wicked, impossible woman: Barabbas is the robber freed instead of Christ"}
          - {w: "sin qué ni para qué", d: "without why or wherefore, for no reason at all"}
          - {w: "estorbar", d: "to hinder, prevent, stand in the way of"}
          - {w: "señoría", d: "lordship, ladyship: the title 'your lordship'"}
        diagram:
          - {s: "Ven acá, bestia y mujer de Barrabás", r: "main verb 1: come here, you beast and wife of Barabbas"}
          - {s: "replicó Sancho", r: "speech tag: Sancho replied"}
          - s: "¿por qué quieres tú ahora"
            r: "main verb 2: why do you want now"
            under:
              - {s: "sin qué ni para qué", r: "how: for no reason at all"}
              - s: "estorbarme que no case a mi hija"
                r: "what you want: to stop me marrying off my daughter"
                under:
                  - s: "con quien me dé nietos"
                    r: "to whom: to someone who gives me grandchildren"
                    under:
                      - {s: "que se llamen señoría", r: "describes 'nietos': who will be called 'your lordship'"}
        forms:
          - {w: "Ven", f: "ven → venir (to come), imperative, you (tú). Irregular short imperative: ven (like pon, ten, sal, haz, di)."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "quieres", f: "quier- + -es → querer (to want), present, you (tú). The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren. Sancho calls his wife 'tú'; she calls him 'vos'."}
          - {w: "estorbarme", f: "estorbar (to hinder) + me (me), the pronoun hung on the infinitive after 'quieres'."}
          - {w: "que no case", f: "cas- + -e → casar (to marry off), present subjunctive, I. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. After verbs of hindering Spanish adds a 'no' that English drops: 'stop me (not) marrying'."}
          - {w: "dé", f: "dé → dar (to give), present subjunctive, he (the husband). dé, des, dé, demos, deis, den; the accent separates it from 'de' (of). Subjunctive because the man is not yet known."}
          - {w: "se llamen", f: "llam- + -en → llamarse (to be called), present subjunctive, they. Same -e subjunctive: llame, llames, llame, llamemos, llaméis, llamen."}
      - es: "Mira, Teresa: siempre he oído decir a mis mayores que el que no sabe gozar de la ventura cuando le viene, que no se debe quejar si se le pasa."
        literal: "Look, Teresa: always I-have heard to-say to my elders that he who not knows to-enjoy [of] the fortune when to-him it-comes, that not himself he-should complain if on-him it-passes-by."
        ormsby: "Look ye, Teresa, I have always heard my elders say that he who does not know how to take advantage of luck when it comes to him, has no right to complain if it gives him the go-by;"
        vocab:
          - {w: "mis mayores", d: "my elders, my forebears"}
          - {w: "gozar de", d: "to enjoy, make the most of"}
          - {w: "ventura", d: "fortune, luck (good or bad)"}
          - {w: "quejarse", d: "to complain"}
          - {w: "pasársele a uno", d: "to pass someone by, slip away from him"}
        diagram:
          - {s: "Mira, Teresa", r: "main verb 1: look, Teresa"}
          - s: "siempre he oído decir a mis mayores"
            r: "main verb 2: I have always heard my elders say"
            under:
              - s: "que el que no sabe gozar de la ventura"
                r: "what they say: that he who does not know how to enjoy good luck"
                under:
                  - {s: "cuando le viene", r: "when: when it comes to him"}
                  - {s: "que no se debe quejar si se le pasa", r: "the point: should not complain if it passes him by"}
        forms:
          - {w: "Mira", f: "mir- + -a → mirar (to look), imperative, you (tú). The tú imperative of regular verbs is the same as the he/she present: mira, come, vive."}
          - {w: "he oído", f: "he → haber (to have), present, I: he, has, ha, hemos, habéis, han; + oído, the participle of oír (to hear): 'I have heard'."}
          - {w: "decir a mis mayores", f: "decir (to say), infinitive after 'oído'; 'a mis mayores' is who says it: 'heard my elders say'."}
          - {w: "sabe", f: "sab- + -e → saber (to know; with an infinitive, to know how to), present, he. Irregular: sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "viene", f: "vien- + -e → venir (to come), present, it (the luck). Irregular: vengo, vienes, viene, venimos, venís, vienen."}
          - {w: "que no se debe quejar", f: "deb- + -e → deber (ought), present, he: debo, debes, debe, debemos, debéis, deben; + quejarse (to complain) with 'se' placed before the group. The 'que' repeats the 'que' after 'decir', a habit of speech after a long subject."}
          - {w: "se le pasa", f: "pas- + -a → pasarse (to pass by), present, it, with 'se' and 'le' (him): 'slips past him'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
      - es: "Y no sería bien que ahora, que está llamando a nuestra puerta, se la cerremos; dejémonos llevar deste viento favorable que nos sopla."
        literal: "And not it-would-be well that now, when it-is knocking at our door, to-it it we-should-shut; let-us-let-ourselves be-carried by-this wind favourable that on-us blows."
        ormsby: "and now that it is knocking at our door, it will not do to shut it out; let us go with the favouring breeze that blows upon us.”"
        vocab:
          - {w: "llamar a la puerta", d: "to knock at the door"}
          - {w: "dejarse llevar", d: "to let oneself be carried along"}
          - {w: "deste", d: "= de este, of this (old contraction)"}
          - {w: "soplar", d: "to blow"}
        diagram:
          - s: "Y no sería bien"
            r: "main verb 1: and it would not be right"
            under:
              - s: "que ahora ... se la cerremos"
                r: "subject: that now we shut it (the door) on it (luck)"
                under:
                  - {s: "que está llamando a nuestra puerta", r: "when: now that it is knocking at our door"}
          - s: "dejémonos llevar"
            r: "main verb 2: let us let ourselves be carried"
            under:
              - s: "deste viento favorable"
                r: "by what: by this favourable wind"
                under:
                  - {s: "que nos sopla", r: "describes 'viento': that blows on us"}
        forms:
          - {w: "sería", f: "ser- + -ía → ser (to be), conditional, it. The conditional adds -ía endings to the whole infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "está llamando", f: "est- + -á → estar (to be), present, it: estoy, estás, está, estamos, estáis, están; + llamando, gerund of llamar (to knock): 'it is knocking', the progressive."}
          - {w: "se la cerremos", f: "cerr- + -emos → cerrar (to shut), present subjunctive, we, after 'no sería bien que'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. 'la' is the door; 'se' stands for 'le' (on it, the luck): le → se before la/lo."}
          - {w: "dejémonos", f: "dejemos + nos → dejar (to let), present subjunctive, we, used as 'let us', with 'nos' (ourselves) on the end; the final -s of 'dejemos' drops before 'nos' and an accent is added. Same -e subjunctive: deje, dejes, deje, dejemos, dejéis, dejen."}
          - {w: "deste", f: "de + este (this), run together; modern 'de este'."}
          - {w: "sopla", f: "sopl- + -a → soplar (to blow), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
  - sentences:
      - es: "(Por este modo de hablar, y por lo que más abajo dice Sancho, dijo el tradutor desta historia que tenía por apócrifo este capítulo.)"
        literal: "(Because-of this way of talking, and because-of that which more below says Sancho, said the translator of-this history that he-held as apocryphal this chapter.)"
        ormsby: "It is this sort of talk, and what Sancho says lower down, that made the translator of the history say he considered this chapter apocryphal."
        vocab:
          - {w: "modo de hablar", d: "way of talking, manner of speech"}
          - {w: "más abajo", d: "further down, later on (in the text)"}
          - {w: "tradutor", d: "= traductor, translator (old spelling)"}
          - {w: "desta", d: "= de esta, of this (old contraction)"}
          - {w: "tener por", d: "to consider, hold to be"}
          - {w: "apócrifo", d: "apocryphal, spurious, not genuine"}
        diagram:
          - s: "dijo el tradutor desta historia"
            r: "main verb: the translator of this history said"
            under:
              - {s: "Por este modo de hablar", r: "why 1: because of this way of talking"}
              - s: "y por lo"
                r: "why 2: and because of what"
                under:
                  - {s: "que más abajo dice Sancho", r: "describes 'lo': what Sancho says further on"}
              - {s: "que tenía por apócrifo este capítulo", r: "what he said: that he held this chapter to be spurious"}
        forms:
          - {w: "este", f: "'this', masculine singular to match 'modo' and 'capítulo'."}
          - {w: "dice", f: "dic- + -e → decir (to say), present, he. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "tradutor", f: "old spelling of traductor (translator), with the c of -ct- dropped, as in 'efeto' for 'efecto'."}
          - {w: "desta", f: "de + esta (this), feminine to match 'historia'; modern 'de esta'."}
          - {w: "tenía", f: "ten- + -ía → tener (to hold), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
        note: "A joke on the book's own fiction: the 'translator' of Cide Hamete's Arabic manuscript doubts a chapter because Sancho talks too well. Cervantes thus answers in advance the reader who finds Sancho too clever here."
  - sentences:
      - es: "— ¿No te parece, animalia —prosiguió Sancho—, que será bien dar con mi cuerpo en algún gobierno provechoso que nos saque el pie del lodo?"
        literal: "— Not to-you does-it-seem, animal —continued Sancho—, that it-will-be well to-land with my body in some government profitable that us may-pull-out the foot from-the mud?"
        ormsby: "“Don’t you see, you animal,” continued Sancho, “that it will be well for me to drop into some profitable government that will lift us out of the mire,"
        vocab:
          - {w: "animalia", d: "you animal, you dunce (a rustic, mock-Latin form of 'animal')"}
          - {w: "proseguir", d: "to continue, go on (speaking)"}
          - {w: "dar con mi cuerpo en", d: "to land, plant oneself in (a place or post)"}
          - {w: "provechoso", d: "profitable, advantageous"}
          - {w: "sacar el pie del lodo", d: "to pull one's foot out of the mud: to get out of poverty"}
        diagram:
          - s: "¿No te parece"
            r: "main verb: doesn't it seem to you"
            under:
              - {s: "animalia", r: "addressed: you animal"}
              - s: "que será bien dar con mi cuerpo en algún gobierno provechoso"
                r: "what seems: that it will be good to land in some profitable government"
                under:
                  - {s: "que nos saque el pie del lodo", r: "describes 'gobierno': that will pull us out of the mud"}
          - {s: "prosiguió Sancho", r: "speech tag: Sancho went on"}
        forms:
          - {w: "parece", f: "parec- + -e → parecer (to seem), present, it. The present of -er verbs: -o (parezco, with zc), -es, -e, -emos, -éis, -en. 'te parece' = does it seem to you."}
          - {w: "prosiguió", f: "prosigu- + -ió → proseguir (to continue), preterite, he. The e of the stem becomes i in the he and they forms: proseguí, proseguiste, prosiguió, proseguimos, proseguisteis, prosiguieron."}
          - {w: "será", f: "ser- + -á → ser (to be), future, it. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun ('gobierno'), like un, buen, ningún."}
          - {w: "saque", f: "saqu- + -e → sacar (to pull out), present subjunctive, it (the government); c becomes qu before e to keep the hard sound. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. Subjunctive because the government is still hoped for."}
          - {w: "del", f: "de + el, the contraction: 'out of the mud'."}
      - es: "Y cásese a Mari Sancha con quien yo quisiere, y verás cómo te llaman a ti doña Teresa Panza, y te sientas en la iglesia sobre alcatifa, almohadas y arambeles, a pesar y despecho de las hidalgas del pueblo."
        literal: "And let-marry-itself [to] Mari Sancha with whom I may-wish, and you-will-see how you they-call [to] you Doña Teresa Panza, and yourself you-sit in the church on carpet, cushions and hangings, in spite and despite of the gentlewomen of-the village."
        ormsby: "and marry Mari-Sancha to whom I like; and you yourself will find yourself called ‘Doña Teresa Panza,’ and sitting in church on a fine carpet and cushions and draperies, in spite and in defiance of all the born ladies of the town?"
        ormsby_note: "Teresa inverts the proverb after Sancho's fashion."
        vocab:
          - {w: "alcatifa", d: "fine carpet, rug (a word from Arabic)"}
          - {w: "almohada", d: "cushion, pillow"}
          - {w: "arambel", d: "drapery, hanging, a cloth spread to sit on"}
          - {w: "a pesar y despecho de", d: "in spite and defiance of"}
          - {w: "hidalga", d: "gentlewoman, a woman of the minor nobility"}
          - {w: "pueblo", d: "village, town"}
        diagram:
          - s: "Y cásese a Mari Sancha"
            r: "main verb 1: and let Mari Sancha be married off"
            under:
              - {s: "con quien yo quisiere", r: "to whom: to whoever I like"}
          - s: "y verás"
            r: "main verb 2: and you will see"
            under:
              - {s: "cómo te llaman a ti doña Teresa Panza", r: "what you'll see, 1: how they call you Doña Teresa Panza"}
              - s: "y te sientas en la iglesia"
                r: "what you'll see, 2: and you sit in church"
                under:
                  - {s: "sobre alcatifa, almohadas y arambeles", r: "on what: on carpet, cushions and hangings"}
                  - {s: "a pesar y despecho de las hidalgas del pueblo", r: "how: to the annoyance of the village gentlewomen"}
        forms:
          - {w: "cásese", f: "cas- + -e + se → casar (to marry), present subjunctive, it, with 'se' on the end: an impersonal 'let Mari Sancha be married'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. A subjunctive opening the clause gives a wish, and Cervantes hangs the pronoun on the end (modern 'que se case')."}
          - {w: "quisiere", f: "quis- + -iere → querer (to want), future subjunctive, I: 'whoever I may like'. Built on the preterite quisieron: quisiere, quisieres, quisiere, quisiéremos, quisiereis, quisieren. Cervantes uses it for an open future after 'quien', 'lo que', 'si'; modern Spanish says 'quiera'."}
          - {w: "verás", f: "ver- + -ás → ver (to see), future, you (tú). The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "te llaman a ti", f: "llam- + -an → llamar (to call), present, they (people). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. 'te' and 'a ti' both mean 'you': the doubling stresses it."}
          - {w: "te sientas", f: "sient- + -as → sentarse (to sit down), present, you (tú). The stem e becomes ie when stressed: me siento, te sientas, se sienta, nos sentamos, os sentáis, se sientan."}
          - {w: "hidalgas", f: "hidalg- + -as → hidalgo (gentleman), feminine plural: the gentlewomen."}
        note: "A seat on a carpet and cushions in church was the privilege of ladies of rank, and 'doña' was a gentry title. Ormsby's remark here about Teresa inverting a proverb does not fit this sentence (Sancho is speaking); it seems to belong to Teresa's later inverted proverb 'Allá van reyes do quieren leyes' (properly 'allá van leyes do quieren reyes', laws go where kings want), in her next long speech."
      - es: "¡No, sino estaos siempre en un ser, sin crecer ni menguar, como figura de paramento!"
        literal: "No, but stay-yourself always in one being, without growing nor waning, like figure of hanging!"
        ormsby: "No, stay as you are, growing neither greater nor less, like a tapestry figure—"
        vocab:
          - {w: "¡No, sino ...!", d: "ironic: 'oh no, rather ...!', 'of course, why not just ...'"}
          - {w: "estarse", d: "to stay, remain"}
          - {w: "en un ser", d: "in the same state, unchanged"}
          - {w: "menguar", d: "to wane, diminish"}
          - {w: "paramento", d: "wall hanging, tapestry; 'figura de paramento' = a figure woven in a tapestry, which never changes"}
        diagram:
          - s: "estaos"
            r: "main verb (ironic): stay"
            under:
              - {s: "¡No, sino", r: "linking: oh no, rather"}
              - {s: "siempre en un ser", r: "how: always the same"}
              - {s: "sin crecer ni menguar", r: "how: neither growing nor waning"}
              - {s: "como figura de paramento", r: "like what: like a figure in a tapestry"}
        forms:
          - {w: "estaos", f: "estad + os → estarse (to stay), imperative, you (vosotros: Teresa and the household, or a slip into the plural), with 'os' (yourselves) on the end; the -d of 'estad' drops before 'os', as in sentaos, idos. The vos/vosotros imperative swaps the final -r of the infinitive for -d: estad, comed, vivid."}
          - {w: "crecer, menguar", f: "infinitives of crecer (to grow) and menguar (to wane), after 'sin' (without)."}
        note: "Sancho is sarcastic: 'Oh no, by all means stay forever the same, like a figure in a tapestry.' He usually calls Teresa 'tú', so the plural 'estaos' is odd; it may take in the whole family."
      - es: "Y en esto no hablemos más, que Sanchica ha de ser condesa, aunque tú más me digas."
