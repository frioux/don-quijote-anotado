                    r: "exception: unless it be the envious"
                    under:
                      - {s: "de quien ninguna próspera fortuna está segura", r: "describes 'invidiosos': from whom no good fortune is safe"}
        forms:
          - {w: "éste", f: "'this one', masculine, a pronoun standing for a man; the accent marks the pronoun use."}
          - {w: "sacó", f: "sac- + -ó → sacar (to take out), preterite, it (fortune). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (saqué, with c → qu before e)."}
          - {w: "del", f: "de + el (of the), the contraction modern Spanish still makes."}
          - {w: "estas mesmas", f: "est- + -as → este (this) and mesm- + -as → mesmo (same), feminine plural to match 'razones'; mesmo is the old form of mismo."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "fuere", f: "fu- + -ere → ser (to be), future subjunctive, he: 'if he shall be'. fuere, fueres, fuere, fuéremos, fuereis, fueren. Cervantes uses the future subjunctive after 'si', 'cuando', 'lo que' for an open future; modern Spanish uses the present indicative ('si es')."}
          - {w: "se pusiere", f: "pus- + -iere → ponerse (to put oneself), future subjunctive, he, with 'se': 'shall (not) put himself (into quarrels)'. Built on the preterite pusieron: pusiere, pusieres, pusiere, pusiéremos, pusiereis, pusieren. Modern Spanish would say 'si no se pone'."}
          - {w: "son", f: "son → ser (to be), present, they. ser (to be) in the present: soy, eres, es, somos, sois, son."}
          - {w: "ten", f: "ten → tener (to hold), imperative, you (tú): 'hold!, take it as'. An irregular short imperative, like pon, ven, sal, haz."}
          - {w: "habrá", f: "habr- + -á → haber (to have; here 'there to be'), future, it: 'there will be'. haber (to have) in the future: habré, habrás, habrá, habremos, habréis, habrán."}
          - {w: "se acuerde", f: "acuerd- + -e → acordarse (to remember), present subjunctive, he, with 'se'; subjunctive because 'no habrá quien' (there will be no one who) denies the person exists. The stem o becomes ue when stressed: me acuerde, te acuerdes, se acuerde, nos acordemos, os acordéis, se acuerden."}
          - {w: "fue", f: "fue → ser (to be), preterite, he: 'what he was'. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "reverencien", f: "reverenci- + -en → reverenciar (to revere), present subjunctive, they (people). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "fueren", f: "fu- + -eren → ser (to be), future subjunctive, they: 'unless they be'. fuere, fueres, fuere, fuéremos, fuereis, fueren. The future subjunctive after 'si' marks an open future; modern Spanish says 'si no son'."}
          - {w: "invidiosos", f: "= envidiosos (the envious), old form with i for e; the adjective used as a noun, masculine plural."}
          - {w: "de quien", f: "'from whom': 'quien' stands for a plural ('los invidiosos'); modern Spanish says 'de quienes'."}
          - {w: "ninguna próspera", f: "ningun- + -a → ninguno (no) and próspera, feminine to match 'fortuna'."}
          - {w: "segura", f: "segur- + -a → seguro (safe), feminine to match 'fortuna'."}
  - sentences:
      - es: "— Yo no os entiendo, marido —replicó Teresa—: haced lo que quisiéredes, y no me quebréis más la cabeza con vuestras arengas y retóricas."
        literal: "— I not you understand, husband —replied Teresa—: do that which you-may-wish, and not to-me break more the head with your harangues and rhetorics."
        ormsby: "“I do not understand you, husband,” replied Teresa; “do as you like, and don’t break my head with any more speechifying and rethoric;"
        vocab:
          - {w: "quebrar la cabeza", d: "to pester, wear out (literally 'to break one's head'); modern 'romper la cabeza'"}
          - {w: "arenga", d: "harangue, speech"}
          - {w: "retóricas", d: "rhetoric, fine talk; in the plural, flowery speeches"}
        diagram:
          - s: "Yo no os entiendo, marido"
            r: "main verb 1: I don't understand you, husband"
          - s: "replicó Teresa"
            r: "speech tag: Teresa replied"
          - s: "haced lo que quisiéredes"
            r: "main verb 2: do what you like"
          - s: "y no me quebréis más la cabeza"
            r: "main verb 3 (after 'y'): and don't break my head any more"
            under:
              - {s: "con vuestras arengas y retóricas", r: "with what: with your speeches and fine talk"}
        forms:
          - {w: "os entiendo", f: "entiend- + -o → entender (to understand), present, I, with 'os' (you, vos). The stem e becomes ie when stressed: entiendo, entiendes, entiende, entendemos, entendéis, entienden. Teresa calls Sancho 'vos', the respectful-but-intimate 'you' of a wife to her husband."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "haced", f: "hac- + -ed → hacer (to do), imperative, you (vos): 'do!'. The vos/vosotros imperative swaps the final -r of the infinitive for -d: haced, mirad, venid."}
          - {w: "quisiéredes", f: "quis- + -iéredes → querer (to want), future subjunctive, you (vos): 'whatever you may want'. Built on the preterite quisieron: quisiere, quisieres, quisiere, quisiéremos, quisiéredes (modern quisiereis), quisieren. The old vos ending -des for -is. Cervantes uses the future subjunctive after 'lo que' for an open future; modern Spanish says 'lo que queráis'."}
          - {w: "no me quebréis", f: "quebr- + -éis → quebrar (to break), present subjunctive, you (vos), used for a negative command: 'don't break'. Negative commands always use the subjunctive. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. 'me' is the person affected: 'break my head'."}
          - {w: "vuestras", f: "vuestr- + -as → vuestro (your, of vos), feminine plural to match 'arengas'."}
      - es: "Y si estáis revuelto en hacer lo que decís..."
        literal: "And if you-are revolved in doing that which you-say..."
        ormsby: "and if you have revolved to do what you say—”"
        vocab:
          - {w: "revuelto", d: "Teresa's slip for 'resuelto' (resolved, determined); 'revuelto' means stirred up, jumbled, scrambled"}
          - {w: "estar resuelto en", d: "to be resolved to, determined to"}
        diagram:
          - s: "Y si estáis revuelto"
            r: "condition: and if you are 'revolved' (resolved)"
            under:
              - {s: "en hacer lo que decís...", r: "what to: to do what you say (she is cut off)"}
        forms:
          - {w: "estáis", f: "est- + -áis → estar (to be), present, you (vos). Irregular: estoy, estás, está, estamos, estáis, están."}
          - {w: "revuelto", f: "irregular participle of revolver (to stir up, turn over), masculine to match Sancho; Teresa means resuelto, participle of resolver (to resolve)."}
          - {w: "hacer", f: "hacer (to do), infinitive after 'en'."}
          - {w: "decís", f: "dec- + -ís → decir (to say), present, you (vos). Irregular: digo, dices, dice, decimos, decís, dicen."}
        note: "Teresa says 'revuelto' (scrambled) for 'resuelto' (resolved), and Sancho pounces on it at once. Ormsby keeps the joke as 'revolved' for 'resolved'. Sancho himself is famous for such slips, so the scene turns the tables."
  - sentences:
      - es: "— Resuelto has de decir, mujer —dijo Sancho—, y no revuelto."
        literal: "— Resolved you-have to say, wife —said Sancho—, and not revolved."
        ormsby: "“Resolved, you should say, woman,” said Sancho, “not revolved.”"
        vocab:
          - {w: "haber de + infinitive", d: "must, ought to; 'has de decir' = you should say"}
          - {w: "resuelto / revuelto", d: "resolved, determined / stirred up, jumbled: Sancho corrects Teresa's malapropism"}
        diagram:
          - s: "Resuelto has de decir, mujer"
            r: "main verb: you should say 'resolved', wife"
            under:
              - {s: "y no revuelto", r: "contrast: and not 'revolved'"}
          - s: "dijo Sancho"
            r: "speech tag: Sancho said"
        forms:
          - {w: "has de decir", f: "has (haber, to have, present, you: he, has, ha, hemos, habéis, han) + de + decir (to say): 'haber de' with an infinitive means 'must, ought to'. Sancho calls her 'tú'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "Resuelto, revuelto", f: "irregular participles: resuelto from resolver (to resolve), revuelto from revolver (to stir up). Both change -olver to -uelto."}
        note: "The correction is itself a comedy: it is usually Don Quijote who corrects Sancho's blunders of speech. Here the squire plays the schoolmaster to his wife."
