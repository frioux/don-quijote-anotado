        forms:
          - {w: "sacáis", f: "sac- + -áis → sacar (to take out), present, you (vos). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. Teresa uses the 'vos/vosotros' form for her husband. Present after 'si' for a condition."}
          - {w: "parda", f: "pard- + -a → pardo (brownish-grey), feminine to match 'saya'."}
          - {w: "saboyanas", f: "saboyan- + -as → saboyano (from Savoy), feminine plural used as a noun: 'Savoy gowns'."}
