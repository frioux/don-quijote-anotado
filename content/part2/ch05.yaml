summary: |
  The translator of Cide Hamete's history warns that he thinks this chapter apocryphal, because Sancho speaks in a style above his wits and says things too subtle for him; but he translates it anyway, as his job requires. Sancho comes home so cheerful that his wife Teresa sees it a bowshot off. He tells her, in a riddle, that he would be glad, if God willed, not to be so happy: he is going out again with Don Quijote on a third sally, hoping for another hundred crowns, but sorry to leave her and the children. He tells her to see to the ass, double its feed and look over the packsaddle, since they are off not to a wedding but to fight giants and monsters, and, worse, Yanguesans and enchanted Moors.

  If he did not expect to be governor of an island soon, Sancho says, he would drop down dead. Teresa answers with proverbs: let the hen live, even with the pip; he was born without a government and will go to his grave without one, and hunger is the best sauce. If he does get a government, he should remember their son Sanchico, now fifteen and ready for school, and their daughter Mari Sancha, who is as eager for a husband as he is for a government. Sancho promises to marry the girl so high that she will be called 'my lady'. Teresa wants her married to her equal: a girl taken from clogs to high cork shoes and from homespun to silk will not know herself and will show the coarse thread of her cloth. A count would abuse her and call her a clodhopper's daughter; better Lope Tocho, Juan Tocho's sturdy son, who likes her, and the family all together at home.

  Sancho calls her a beast and a wife for Barabbas: when good fortune knocks one must not shut the door. The translator breaks in to say that this kind of talk is why he doubts the chapter. Sancho pictures Teresa as 'Doña Teresa Panza', sitting in church on carpets and cushions in spite of the village's gentlewomen, and insists Sanchica shall be a countess. Teresa fears it will be the girl's ruin. She was christened plain Teresa, without dons or doñas; her father was Cascajo, and she does not want the neighbours to say the spinning slut has grown airs. A respectable woman stays at home as if her leg were broken; let him go off with his Don Quijote, who has no right to the 'don' either.

  Sancho says she has a devil in her body, stringing things together without head or tail. Teresa answers that the rich man who was once poor is the one people gossip about. Sancho replies with the Lent preacher's doctrine, again too learned for him, says the translator: what we see present impresses us more than what is past, so a man raised by fortune who behaves well will be respected for what he is. Teresa gives in, mixing up 'revuelto' and 'resuelto', and asks him to take their son along to learn to govern. Sancho promises to send for the boy and send money; Teresa agrees, but says the day she sees her daughter a countess will be like the day she buries her, and weeps. Sancho consoles her by promising to make the girl a countess as late as possible, and goes back to Don Quijote to arrange their departure.
context: |
  The apocryphal chapter. The chapter opens and is twice interrupted by 'the translator', the Morisco whom the narrator hired in Toledo in Part I chapter 9 to put Cide Hamete Benengeli's Arabic into Spanish. He calls the chapter apocryphal because Sancho talks above his wits, then translates it anyway. It is one more layer of Cervantes' game with his sources: the 'true history' now comes with a translator who doubts his own text, and the doubts fall exactly on the passages where Sancho repeats a sermon or uses fine words. In fact much of the comedy is that Sancho, intoxicated by the hope of a government, has started to talk like his master, while Teresa keeps the plain village speech he used in Part I.

  Village and court. Teresa's arguments are a catalogue of the signs of rank in Cervantes' Spain. Village women wore 'zuecos', wooden clogs, and a 'saya parda de catorceno', a skirt of coarse brown cloth (the number refers to the count of threads in the warp, a low grade); ladies wore 'chapines', cork-soled platform overshoes, the 'verdugado' or hooped farthingale, and 'saboyanas', an overskirt in the Savoy fashion. In church a lady sat on a carpet ('alcatifa') and cushions on a raised platform, while ordinary women sat on the floor or on benches, so Sancho's promise that Teresa will sit 'sobre alcatifa, almohadas y arambeles' in spite of the village's 'hidalgas' is a promise of public precedence. 'Don' and 'doña' were in principle titles of the nobility, but by 1600 they were being taken by anyone who could afford them, a common subject of satire; Teresa's jab that nobody knows who gave Don Quijote his 'don', which neither his parents nor his grandparents had, picks up a joke as old as Part I, where the hidalgo dubbed himself.

  Names. In Part I Sancho's wife was called Juana Gutiérrez and Mari Gutiérrez (chapter 7) and Juana Panza (chapter 52), where the narrator explained that in La Mancha wives took their husband's surname. Here she is Teresa, and she complains that by rights she should be called Teresa Cascajo after her father; 'cascajo' means gravel or rubble, a fitting name for her plain good sense. The daughter is Mari Sancha, María and Sanchica, and the son Sanchico, all names made from Sancho; Lope Tocho's surname suggests 'tocho', a rustic, dull fellow. Barabbas, the thief released instead of Christ, makes 'mujer de Barrabás' a rough insult. A 'familiar' in the body is a familiar spirit, a devil that serves or possesses someone. Ormsby explains Sancho's two learned blunders: the Infanta Doña Urraca, daughter of Ferdinand I of Castile, threatened to go off and lead a disreputable life when her father left her out of his will, which is the subject of two old ballads; and the Almohads, the North African dynasty that ruled Muslim Spain in the twelfth century, are taken by Sancho to be named after cushions ('almohadas').

  Proverbs and sermons. Teresa speaks almost entirely in proverbs, and Ormsby numbers several in his list: 'viva la gallina, aunque sea con su pepita' (let the hen live, though with the pip, a disease of fowls), 'la mejor salsa del mundo es la hambre', 'al hijo de tu vecino, límpiale las narices y métele en tu casa', 'la mujer honrada, la pierna quebrada, y en casa', 'la doncella honesta, el hacer algo es su fiesta', 'quien te cubre, te descubre' (whoever dresses you up shows you up), and 'allá van reyes do quieren leyes', which turns upside down the real proverb 'allá van leyes do quieren reyes' (laws go where kings want them to). Ormsby remarks that Teresa inverts a proverb 'after Sancho's fashion', and this looks like the one he means. Sancho's reply comes, he says, from the Lent preacher, and the doctrine that the present impresses us more than the past, so that a man of low birth risen by fortune is honoured for what he is, sounds like the commonplaces of the pulpit and the moral books. Ormsby notes, after Pellicer, that Molière seems to have taken the quarrel between Monsieur Jourdain and his wife in 'Le Bourgeois gentilhomme' from this dialogue.

  Reading Cervantes' Spanish. The couple use 'vos' to each other, with its old verb forms: traés and venís (traéis, venís), salistes and hicistes (old vos preterites, modern salisteis, hicisteis), and the future subjunctive with -des: holgáredes, viéredes, quisiéredes. When Sancho grows heated he drops to 'tú'. The -ra form stands for the conditional (holgara, fuera), the future subjunctive marks open futures (fuere servido, quisiere, viniere, viere, diere, pusiere, fueren), and 'haber de' and 'tener de' express obligation or future ('ha de ser condesa', 'tengo de casar'). Pronouns hang on clause-opening verbs and subjunctives of command: quédese, llévese, cásese, Séase, Válate, séos (sé + os). Old spellings: maguer (although), agora (ahora), mochacha (muchacha), agüelos (abuelos), tradutor (traductor), inominia (ignominia), invidiosos (envidiosos), mesmas (mismas), do (donde), desta and deste. Teresa's 'revuelto' for 'resuelto' (stirred up for resolved) is the chapter's malapropism, and this time it is Sancho who corrects her, as Don Quijote so often corrects him. Watch the false friends: plática (conversation), discreta (shrewd), sucesos (events), ingenio (wits), gentil (fine, splendid, here ironic), and arengas (harangues).
