                  - s: "o que se fuera por esos mundos"
                    r: "what I said, 2: or that she should go roaming the world"
                    under:
                      - {s: "como se quiso ir la infanta doña Urraca", r: "comparison: as the Infanta Doña Urraca wanted to go"}
              - {s: "de no venir con mi gusto", r: "right in what: in not falling in with my wishes"}
        forms:
          - {w: "dijera", f: "dij- + -era → decir (to say), imperfect subjunctive (-ra form), I, in an 'if' clause contrary to fact: 'if I said'. dijera, dijeras, dijera, dijéramos, dijerais, dijeran."}
          - {w: "se arrojara", f: "arroj- + -ara → arrojarse (to throw oneself), imperfect subjunctive (-ra form), she, after a reported order ('dijera que'): 'that she should throw herself'. The -ra imperfect subjunctive of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran."}
          - {w: "se fuera", f: "fu- + -era → irse (to go off), imperfect subjunctive (-ra form), she. Irregular: fuera, fueras, fuera, fuéramos, fuerais, fueran (the same forms serve ser (to be))."}
          - {w: "esos", f: "'those', masculine plural to match 'mundos'."}
          - {w: "se quiso ir", f: "quis- + -o → querer (to want), preterite, she: quise, quisiste, quiso, quisimos, quisisteis, quisieron; + ir (to go) with 'se' (irse, to go off) placed before the whole group; modern Spanish also says 'quiso irse'."}
          - {w: "tenías", f: "ten- + -ías → tener (to have), imperfect, you (tú): 'you had', used here for 'you would have', as the imperfect often stands for the conditional in speech. The imperfect of -er verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "venir", f: "infinitive of venir (to come) after 'de no' (in not)."}
        note: "In the ballad 'Morir vos queredes, padre', the slighted Urraca threatens her dying father that she will go off through the world and give her body to whoever wants it, unless he leaves her a share of the kingdom."
      - es: "pero si en dos paletas, y en menos de un abrir y cerrar de ojos, te la chanto un don y una señoría a cuestas, y te la saco de los rastrojos, y te la pongo en toldo y en peana, y en un estrado de más almohadas de velludo que tuvieron moros en su linaje los Almohadas de Marruecos, ¿por qué no has de consentir y querer lo que yo quiero?"
        literal: "but if in two trowel-strokes, and in less than an opening and closing of eyes, for-you her I-clap a don and a ladyship on-her-back, and for-you her I-take-out of the stubble-fields, and for-you her I-put under canopy and on pedestal, and on a dais of more cushions of velvet than had Moors in their lineage the Almohadas of Morocco, why not have-you to consent and to want that which I want?"
        ormsby: "but if in an instant, in less than the twinkling of an eye, I put the ‘Don’ and ‘my lady’ on her back, and take her out of the stubble, and place her under a canopy, on a dais, and on a couch, with more velvet cushions than all the Almohades of Morocco ever had in their family, why won’t you consent and fall in with my wishes?”"
        ormsby_note: "Almohada is a cushion, which Sancho supposes to have had something to do with the origin of the sect of the Almohades."
