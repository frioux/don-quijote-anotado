        note: "'No es, y sólo es lo que vemos': Sancho gives scholastic philosophy a village twist, the past has no being, only the present is. The translator's complaint is precisely that this is beyond him."
      - es: "Y si éste a quien la fortuna sacó del borrador de su bajeza (que por estas mesmas razones lo dijo el padre) a la alteza de su prosperidad, fuere bien criado, liberal y cortés con todos, y no se pusiere en cuentos con aquellos que por antigüedad son nobles, ten por cierto, Teresa, que no habrá quien se acuerde de lo que fue, sino que reverencien lo que es, si no fueren los invidiosos, de quien ninguna próspera fortuna está segura."
        literal: "And if this-one whom the fortune took-out of-the rough-draft of his lowliness (for in these same words it said the father) to the height of his prosperity, shall-be well bred, generous and courteous with all, and not himself shall-put in disputes with those who by antiquity are noble, hold as certain, Teresa, that not there-will-be [anyone] who may-remember of that which he-was, but that they-revere that which he-is, if not shall-be the envious, from whom no prosperous fortune is safe."
        ormsby: "and if this person whom fortune has raised from his original lowly state (these were the very words the padre used) to his present height of prosperity, be well bred, generous, courteous to all, without seeking to vie with those whose nobility is of ancient date, depend upon it, Teresa, no one will remember what he was, and everyone will respect what he is, except indeed the envious, from whom no fair fortune is safe.”"
        vocab:
          - {w: "borrador", d: "rough draft, first sketch; 'el borrador de su bajeza' = the rough draft of his low estate, his humble beginnings"}
          - {w: "mesmo", d: "= mismo, same (old form)"}
          - {w: "alteza", d: "height, loftiness (also the title 'Highness')"}
          - {w: "bien criado", d: "well brought up, well mannered"}
          - {w: "liberal", d: "generous, open-handed (not political)"}
          - {w: "ponerse en cuentos con", d: "to pick quarrels with, try to vie with"}
          - {w: "por antigüedad", d: "by long descent, of old family"}
          - {w: "tener por cierto", d: "to take as certain, be sure"}
          - {w: "reverenciar", d: "to revere, honour"}
          - {w: "invidioso", d: "= envidioso, envious (old form)"}
        diagram:
          - s: "ten por cierto, Teresa"
