          - {w: "el murmurar y el maldecir, y el peor perseverar", f: "infinitives of murmurar (to gossip), maldecir (to slander) and perseverar (to persist) used as nouns with 'el': 'the gossiping, the slandering, the persisting'. Any infinitive can take 'el' this way, and even an adjective ('peor')."}
