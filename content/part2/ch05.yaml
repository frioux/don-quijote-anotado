          - {w: "almohada", d: "cushion, pillow"}
          - {w: "velludo", d: "velvet, plush (old word)"}
          - {w: "Almohadas de Marruecos", d: "Sancho's version of the Almohads, the Berber dynasty that ruled Morocco and Muslim Spain in the 12th and 13th centuries"}
          - {w: "consentir", d: "to consent, agree"}
        diagram:
          - s: "¿por qué no has de consentir y querer lo que yo quiero?"
            r: "main verb: why should you not consent to and want what I want?"
            under:
              - {s: "pero si en dos paletas, y en menos de un abrir y cerrar de ojos", r: "condition and when: but if in a trice, in less than the blink of an eye"}
              - {s: "te la chanto un don y una señoría a cuestas", r: "condition 1: I slap a 'don' and a 'ladyship' on her back"}
              - {s: "y te la saco de los rastrojos", r: "condition 2: and take her out of the stubble fields"}
              - s: "y te la pongo en toldo y en peana, y en un estrado"
                r: "condition 3: and set her under a canopy, on a pedestal, on a dais"
                under:
                  - s: "de más almohadas de velludo"
