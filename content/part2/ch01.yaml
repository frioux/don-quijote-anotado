            r: "main verb 1: look at, be careful of"
            under:
              - {s: "lo que decís", r: "object: what you are saying"}
              - {s: "licenciado", r: "addressed: licentiate"}
          - {s: "no os engañe el diablo", r: "main verb 2: don't let the devil deceive you"}
          - {s: "sosegad el pie", r: "main verb 3: keep your feet still"}
          - s: "y estaos quedito"
            r: "main verb 4: and stay nice and quiet"
            under:
              - {s: "en vuestra casa", r: "where: in your house (the madhouse)"}
          - {s: "y ahorraréis la vuelta", r: "main verb 5, result: and you will save yourself the trip back"}
        forms:
          - {w: "Mirad", f: "mir- + -ad → mirar (to look), imperative, you (vos, one person addressed with vos): the vosotros imperative swaps the final -r of the infinitive for -d: mirad, sosegad, comed, vivid. The madman uses 'vos', the familiar or slightly rude form, to the licentiate."}
          - {w: "decís", f: "dec- + -ís → decir (to say), present, you (vos). decir (to say) in the present: digo, dices, dice, decimos, decís, dicen. 'vos' takes the plural 'vosotros' forms of the verb."}
          - {w: "os engañe", f: "engañ- + -e → engañar (to deceive), present subjunctive, he (the devil), with 'os' (you, the vos object pronoun). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. 'no' + subjunctive gives a negative command or warning: 'don't let him deceive you'."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "sosegad", f: "soseg- + -ad → sosegar (to calm), imperative, you (vos). Same -d imperative."}
          - {w: "estaos", f: "esta(d) + os → estarse (to stay), imperative, you (vos), with 'os' (yourself) on the end; the -d of 'estad' drops before 'os': estad + os → estaos. The pronoun always hangs on the end of a positive command."}
          - {w: "quedito", f: "qued- + -ito → quedo (still, quiet) with the diminutive -ito: 'nice and quiet'."}
          - {w: "ahorraréis", f: "ahorrar- + -éis → ahorrar (to save), future, you (vos). The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
        note: "The second madman's advice is wiser than it sounds: he warns the licentiate that he will only be brought back. The barber is telling the story to hint that Don Quijote's apparent cure may not last."
      - es: "«Yo sé que estoy bueno —replicó el licenciado—, y no habrá para qué tornar a andar estaciones»."
