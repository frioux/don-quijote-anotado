  - sentences:
      - es: "»El arzobispo, persuadido de muchos billetes concertados y discretos, mandó a un capellán suyo se informase del retor de la casa si era verdad lo que aquel licenciado le escribía, y que asimesmo hablase con el loco, y que si le pareciese que tenía juicio, le sacase y pusiese en libertad."
        literal: "»The archbishop, persuaded by many notes well-ordered and sensible, ordered [to] a chaplain of-his [that] himself he-should-inform from-the rector of the house if it-was truth that which that licentiate to-him wrote, and that likewise he-should-speak with the madman, and that if to-him it-should-seem that he-had judgment, him he-should-take-out and put in liberty."
        ormsby: "The Archbishop, moved by repeated sensible, well-written letters, directed one of his chaplains to make inquiry of the madhouse as to the truth of the licentiate’s statements, and to have an interview with the madman himself, and, if it should appear that he was in his senses, to take him out and restore him to liberty."
        vocab:
          - {w: "persuadido de", d: "persuaded by: old Spanish uses 'de' for the agent where modern uses 'por'"}
          - {w: "billete", d: "note, short letter (not a ticket)"}
          - {w: "discreto", d: "sensible, wise (a false friend: not 'discreet')"}
          - {w: "capellán", d: "chaplain, a priest in someone's household"}
          - {w: "informarse de", d: "to inquire of, find out from"}
          - {w: "retor", d: "= rector, the director of the hospital (old spelling)"}
          - {w: "licenciado", d: "licentiate, holder of a university degree; the title sticks to the madman for the rest of the story"}
          - {w: "asimesmo", d: "= asimismo, likewise, also (old form)"}
        diagram:
          - s: "mandó a un capellán suyo"
            r: "main verb: ordered a chaplain of his"
            under:
              - {s: "El arzobispo", r: "subject: the archbishop"}
              - {s: "persuadido de muchos billetes concertados y discretos", r: "why: won over by many sensible, well-written notes"}
              - s: "se informase del retor de la casa"
                r: "what he ordered, 1: to inquire of the rector of the house"
                under:
                  - {s: "si era verdad lo que aquel licenciado le escribía", r: "what to find out: whether what the licentiate wrote him was true"}
              - {s: "y que asimesmo hablase con el loco", r: "what he ordered, 2: and also to speak with the madman"}
              - s: "y que ... le sacase y pusiese en libertad"
                r: "what he ordered, 3: and to take him out and set him free"
                under:
                  - {s: "si le pareciese que tenía juicio", r: "condition: if he thought he was sane"}
        forms:
          - {w: "persuadido", f: "persuad- + -ido → persuadir (to persuade), participle, masculine to match 'arzobispo'."}
          - {w: "concertados", f: "concert- + -ados → concertar (to arrange), participle used as an adjective, masculine plural to match 'billetes'."}
          - {w: "mandó", f: "mand- + -ó → mandar (to order), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "suyo", f: "'of his', the long possessive placed after the noun: 'un capellán suyo' = a chaplain of his."}
          - {w: "se informase", f: "inform- + -ase → informarse (to inquire), imperfect subjunctive (-se form), he, with 'se'; the 'que' after 'mandó' is left out. The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "del", f: "de + el, 'from the'."}
          - {w: "era", f: "ser (to be), imperfect, it. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "escribía", f: "escrib- + -ía → escribir (to write), imperfect, he: 'had been writing'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "asimesmo", f: "old form of asimismo (likewise), built on 'mesmo' = mismo."}
          - {w: "hablase, sacase", f: "habl- + -ase → hablar (to speak) and sac- + -ase → sacar (to take out), imperfect subjunctive (-se form), he, after 'mandó que'. Same -se subjunctive: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "pareciese", f: "parec- + -iese → parecer (to seem), imperfect subjunctive (-se form), it, after 'si'. The -se imperfect subjunctive of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen."}
          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, he: tenía, tenías, tenía, teníamos, teníais, tenían."}
          - {w: "pusiese", f: "pus- + -iese → poner (to put), imperfect subjunctive (-se form), he. Built on the preterite pusieron: pusiese, pusieses, pusiese, pusiésemos, pusieseis, pusiesen."}
          - {w: "le sacase", f: "'le' = him, the madman, as a male person object (leísmo, where modern Spanish often says 'lo')."}
