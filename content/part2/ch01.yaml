  - sentences:
      - es: "— Pues con ese beneplácito —respondió el cura—, digo que mi escrúpulo es que no me puedo persuadir en ninguna manera a que toda la caterva de caballeros andantes que vuestra merced, señor don Quijote, ha referido, hayan sido real y verdaderamente personas de carne y hueso en el mundo;"
