          - {w: "contentóse", f: "content- + -ó + se → contentarse (to be satisfied), preterite, she, with 'se' stuck on the end; modern 'se contentó'. Same -ar preterite. Cervantes hangs the pronoun on a verb that opens its clause; the accent stays on the ó."}
