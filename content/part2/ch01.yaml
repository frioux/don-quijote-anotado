      - es: "Mas agora, ya triunfa la pereza de la diligencia, la ociosidad del trabajo, el vicio de la virtud, la arrogancia de la valentía y la teórica de la práctica de las armas, que sólo vivieron y resplandecieron en las edades del oro y en los andantes caballeros."
        literal: "But now, now triumphs the laziness over the diligence, the idleness over-the work, the vice over the virtue, the arrogance over the valor and the theory over the practice of the arms, which only lived and shone in the ages of-the gold and in the errant knights."
