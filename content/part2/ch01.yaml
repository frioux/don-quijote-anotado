          - {w: "estoy", f: "estar (to be), present, I: estoy, estás, está, estamos, estáis, están."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "habrá", f: "habr- + -á → haber (to have; here 'there to be'), future, it: 'there will be'. Irregular stem habr-: habré, habrás, habrá, habremos, habréis, habrán. Impersonal, like 'hay'."}
