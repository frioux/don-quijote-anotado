          - {w: "barbilucio", d: "smooth-faced, with a sleek, beardless face ('barba' + 'lucio', shiny)"}
          - {w: "hacienda", d: "property, fortune"}
          - {w: "de agradecido", d: "as a grateful man, for being grateful"}
          - {w: "guardar amistad a", d: "to keep faith with, stay loyal to"}
