  - sentences:
      - es: "— Si no fue Roldán más gentilhombre que vuestra merced ha dicho —replicó el cura—, no fue maravilla que la señora Angélica la Bella le desdeñase y dejase por la gala, brío y donaire que debía de tener el morillo barbiponiente a quien ella se entregó;"
