  - sentences:
      - es: "— No lo digo por tanto —replicó el barbero—, sino porque tiene mostrado la esperiencia que todos o los más arbitrios que se dan a Su Majestad, o son imposibles, o disparatados, o en daño del rey o del reino."
        literal: "— Not it I-say for so-much — replied the barber —, but because has shown the experience that all or the most schemes that themselves are-given to His Majesty, either are impossible, or absurd, or in harm of-the king or of-the kingdom."
        ormsby: "“I don’t mean that,” said the barber, “but that experience has shown that all or most of the expedients which are proposed to his Majesty are either impossible, or absurd, or injurious to the King and to the kingdom.”"
        vocab:
          - {w: "no lo digo por tanto", d: "I don't mean it that way, that's not why I say it"}
          - {w: "replicar", d: "to reply, answer back"}
          - {w: "tener mostrado", d: "= haber mostrado, to have shown"}
          - {w: "los más", d: "most, the greater part"}
          - {w: "arbitrio", d: "scheme, proposal for the king (the word behind 'arbitrista', a projector)"}
          - {w: "disparatado", d: "absurd, nonsensical"}
          - {w: "en daño de", d: "to the harm of"}
        diagram:
          - s: "No lo digo por tanto"
            r: "main verb: I don't say it for that reason"
            under:
              - {s: "replicó el barbero", r: "aside: replied the barber"}
              - s: "sino porque tiene mostrado la esperiencia"
                r: "why: but because experience has shown"
                under:
                  - s: "que todos o los más arbitrios"
                    r: "what it has shown: that all or most schemes"
                    under:
                      - {s: "que se dan a Su Majestad", r: "describes 'arbitrios': that are given to His Majesty"}
                      - {s: "o son imposibles, o disparatados, o en daño del rey o del reino", r: "verb of 'arbitrios': are either impossible, or absurd, or harmful to king or kingdom"}
        forms:
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "tiene mostrado", f: "tiene → tener (to have), present, it (experience): tengo, tienes, tiene, tenemos, tenéis, tienen; + mostrado, participle of mostrar (to show). tener (to have) + participle works like haber (to have) + participle: 'has shown'."}
          - {w: "esperiencia", f: "old spelling of experiencia, with s for x."}
          - {w: "se dan", f: "d- + -an → dar (to give), present, they, with 'se' making it passive: 'that are given'. doy, das, da, damos, dais, dan."}
          - {w: "son", f: "ser (to be), present, they. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "disparatados", f: "disparat- + -ados: participle-adjective, masculine plural to match 'arbitrios'."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
        note: "'Arbitristas', projectors who flooded the court with schemes ('arbitrios') to fill the treasury or save the realm, were a byword in Cervantes' Spain; he also mocks one in his story 'El coloquio de los perros'."
  - sentences:
