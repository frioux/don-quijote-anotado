          - {w: "le dijese", f: "dij- + -ese → decir (to say), imperfect subjunctive (-se form), I: dijese, dijeses, dijese, dijésemos, dijeseis, dijesen. Subjunctive after 'querría que'. 'le' = it, the scheme: Cervantes uses 'le' for a masculine thing where modern Spanish says 'lo'."}
          - {w: "agora", f: "old form of ahora (now)."}
