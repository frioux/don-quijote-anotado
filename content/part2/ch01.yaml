          - {w: "engañar", d: "to deceive, trick"}
          - {w: "replicar", d: "to reply, retort"}
          - {w: "sosegar el pie", d: "to keep one's feet still, stay put; 'sosegar' = to calm"}
          - {w: "quedito", d: "nice and quiet, very still (diminutive of 'quedo', still)"}
          - {w: "vuestra casa", d: "your house: the madman calls the madhouse the licentiate's home"}
          - {w: "ahorrar", d: "to save, spare (oneself something)"}
          - {w: "la vuelta", d: "the return, the trip back"}
        diagram:
