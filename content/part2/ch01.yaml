  - sentences:
      - es: "»Todas estas razones del licenciado escuchó otro loco que estaba en otra jaula, frontero de la del furioso, y, levantándose de una estera vieja donde estaba echado y desnudo en cueros, preguntó a grandes voces quién era el que se iba sano y cuerdo."
        literal: "All these words of-the licentiate heard another madman who was in another cage, opposite to the [one] of-the furious [one], and, raising-himself from a mat old where he-was lying and naked in skins, asked at great voices who was the [one] who himself was-going healthy and sane."
        ormsby: "“To all these words of the licentiate another madman in a cage opposite that of the furious one was listening; and raising himself up from an old mat on which he lay stark naked, he asked in a loud voice who it was that was going away cured and in his senses."
        vocab:
          - {w: "razones", d: "words, remarks (not 'reasons')"}
          - {w: "licenciado", d: "licentiate, a university graduate (here the madman with a degree in canon law)"}
          - {w: "jaula", d: "cage: violent inmates of the madhouse were kept in cages"}
          - {w: "frontero de", d: "opposite, facing"}
          - {w: "estera", d: "rush mat, straw mat"}
          - {w: "echado", d: "lying down (from 'echarse', to lie down)"}
          - {w: "desnudo en cueros", d: "stark naked; 'en cueros' = in one's bare skin"}
          - {w: "a grandes voces", d: "very loudly, shouting"}
          - {w: "cuerdo", d: "sane, in one's right mind (the opposite of 'loco')"}
        diagram:
          - s: "escuchó"
            r: "main verb 1: heard"
            under:
              - {s: "Todas estas razones del licenciado", r: "object (placed first): all these words of the licentiate"}
              - s: "otro loco"
                r: "subject: another madman"
                under:
                  - {s: "que estaba en otra jaula", r: "describes 'loco': who was in another cage"}
                  - {s: "frontero de la del furioso", r: "where: opposite the furious madman's cage"}
          - s: "preguntó"
            r: "main verb 2 (after 'y'): asked"
            under:
              - s: "levantándose de una estera vieja"
                r: "how: getting up from an old mat"
                under:
                  - {s: "donde estaba echado y desnudo en cueros", r: "describes 'estera': where he lay stark naked"}
              - {s: "a grandes voces", r: "how: loudly"}
              - {s: "quién era el que se iba sano y cuerdo", r: "what he asked: who it was that was leaving cured and sane"}
        forms:
          - {w: "estas", f: "est- + -as → este (this), feminine plural to match 'razones'."}
          - {w: "escuchó", f: "escuch- + -ó → escuchar (to listen to, hear), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. The object comes first and the subject 'otro loco' after the verb."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "la del furioso", f: "'la' stands for 'la jaula': 'the [cage] of the furious one'; Spanish drops the repeated noun and keeps the article."}
          - {w: "levantándose", f: "gerund of levantarse (to get up) with 'se' (himself) on the end; accent added to keep the stress: levantando → levantándose."}
          - {w: "vieja", f: "viej- + -a → viejo (old), feminine to match 'estera'."}
          - {w: "echado, desnudo", f: "echado = participle of echarse (to lie down), and desnudo (naked): both masculine singular to match the madman."}
          - {w: "preguntó", f: "pregunt- + -ó → preguntar (to ask), preterite, he. Same -ó preterite."}
          - {w: "era", f: "ser (to be), imperfect, it: 'who it was'. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "se iba", f: "ib- + -a → irse (to go away), imperfect, he, with 'se' (away). ir (to go) in the imperfect: iba, ibas, iba, íbamos, ibais, iban."}
        note: "The Seville madhouse of the barber's story is the Casa de los Inocentes, a real hospital for the insane. Violent patients were kept in cages; this second madman lies naked on a mat, the usual state of the dangerous inmates."
      - es: "El licenciado respondió: «Yo soy, hermano, el que me voy; que ya no tengo necesidad de estar más aquí, por lo que doy infinitas gracias a los cielos, que tan grande merced me han hecho»."
        literal: "The licentiate answered: «I am [it], brother, the [one] who myself am-going; for now not I-have need to be more here, for which I-give infinite thanks to the heavens, which so great favor to-me have done»."
        ormsby: "The licentiate answered, ‘It is I, brother, who am going; I have now no need to remain here any longer, for which I return infinite thanks to Heaven that has had so great mercy upon me.’"
        vocab:
          - {w: "Yo soy el que", d: "it is I who; Spanish says 'I am the one who'"}
          - {w: "tener necesidad de", d: "to need to"}
          - {w: "dar gracias a", d: "to give thanks to, thank"}
          - {w: "los cielos", d: "heaven (plural in Spanish), i.e. God"}
          - {w: "merced", d: "favor, mercy, grace (also in 'vuestra merced', your worship)"}
        diagram:
          - s: "El licenciado respondió:"
            r: "main verb: the licentiate answered"
            under:
              - s: "«Yo soy, hermano, el que me voy;"
                r: "what he said, 1: it's me, brother, I'm the one leaving"
              - s: "que ya no tengo necesidad de estar más aquí"
                r: "why: for I no longer need to stay here"
                under:
                  - s: "por lo que doy infinitas gracias a los cielos"
                    r: "for which I give endless thanks to heaven"
                    under:
                      - {s: "que tan grande merced me han hecho", r: "describes 'cielos': which have done me so great a favor"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "soy", f: "ser (to be), present, I: soy, eres, es, somos, sois, son."}
          - {w: "me voy", f: "irse (to go away), present, I, with 'me' (myself). ir (to go) in the present: voy, vas, va, vamos, vais, van. Note 'el que me voy', with 'I' agreeing, where English says 'the one who is going'."}
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "doy", f: "dar (to give), present, I. Irregular: doy, das, da, damos, dais, dan."}
          - {w: "infinitas", f: "infinit- + -as → infinito (infinite), feminine plural to match 'gracias'."}
          - {w: "han hecho", f: "han (haber (to have), present, they: he, has, ha, hemos, habéis, han) + hecho, the irregular participle of hacer (to do): the present perfect, 'have done'. The subject is 'los cielos'."}
      - es: "«Mirad lo que decís, licenciado, no os engañe el diablo —replicó el loco—; sosegad el pie, y estaos quedito en vuestra casa, y ahorraréis la vuelta»."
        literal: "«Look-at what you-say, licentiate, not you may-deceive the devil —replied the madman—; calm the foot, and stay-yourself quiet-little in your house, and you-will-save the return»."
        ormsby: "“ ‘Mind what you are saying, licentiate; don’t let the devil deceive you,’ replied the madman. ‘Keep quiet, stay where you are, and you will save yourself the trouble of coming back.’"
        vocab:
