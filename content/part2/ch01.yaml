          - {w: "cómalos", f: "com- + -a + los → comer (to eat), present subjunctive, you (polite), used as a command, with 'los' (them, the treats) stuck on the end and an accent added. Same -a subjunctive: coma, comas, coma, comamos, comáis, coman."}
