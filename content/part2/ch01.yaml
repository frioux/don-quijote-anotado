                under:
                  - s: "que las comparaciones"
                    r: "what you don't know: that comparisons"
                    under:
                      - {s: "que se hacen de ingenio a ingenio, de valor a valor, de hermosura a hermosura y de linaje a linaje", r: "describes 'comparaciones': that are made between wits, valors, beauties and lineages"}
                      - {s: "son siempre odiosas y mal recebidas", r: "are always odious and badly received"}
        forms:
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "sabe", f: "sab- + -e → saber (to know), present, you (vuestra merced, with 'he/she' verb forms). saber (to know) in the present: sé, sabes, sabe, sabemos, sabéis, saben. Modern Spanish would use the subjunctive 'sepa' after 'es posible que'; the indicative stresses that the barber really doesn't know."}
          - {w: "se hacen", f: "hac- + -en → hacer (to make), present, they, with passive 'se': 'are made'. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (hago is irregular)."}
          - {w: "son", f: "ser (to be), present, they. Same soy, eres, es, somos, sois, son."}
