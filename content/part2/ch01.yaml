          - {w: "te", f: "'you', the familiar 'tú' form: the priest speaks to the absent Don Quijote with pity, as to a child."}
          - {w: "parece", f: "parec- + -e → parecer (to seem), present, it: 'me parece' = it seems to me. parezco, pareces, parece, parecemos, parecéis, parecen."}
