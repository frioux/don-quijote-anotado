  - sentences:
      - es: "— Aun bien que yo casi no he hablado palabra hasta ahora, y no quisiera quedar con un escrúpulo que me roe y escarba la conciencia, nacido de lo que aquí el señor don Quijote ha dicho."
        literal: "— Still well that I almost not have spoken word until now, and not I-would-wish to-remain with a scruple that me gnaws and scratches the conscience, born from that which here the sir Don Quijote has said."
        ormsby: "“I have hardly said a word as yet; and I would gladly be relieved of a doubt, arising from what Don Quixote has said, that worries and works my conscience.”"
        vocab:
          - {w: "aun bien que", d: "it's a good thing that, luckily (old idiom); here 'mind you, I have hardly said a word yet'"}
          - {w: "no hablar palabra", d: "not to say a word"}
          - {w: "escrúpulo", d: "a doubt that troubles the conscience, a qualm; a word from confession and moral theology"}
          - {w: "roer", d: "to gnaw"}
          - {w: "escarbar", d: "to scratch, dig at, rake (as a hen scratches the ground)"}
          - {w: "nacido de", d: "born of, arising from"}
        diagram:
          - s: "Aun bien que yo casi no he hablado palabra hasta ahora"
            r: "main clause 1: luckily I have hardly said a word so far"
          - s: "y no quisiera quedar con un escrúpulo"
            r: "main verb 2: and I would not like to be left with a scruple"
            under:
              - {s: "que me roe y escarba la conciencia", r: "describes 'escrúpulo': that gnaws and scratches at my conscience"}
              - s: "nacido de lo"
                r: "describes 'escrúpulo': born of what"
                under:
                  - {s: "que aquí el señor don Quijote ha dicho", r: "describes 'lo': which Don Quijote has said here"}
        forms:
          - {w: "he hablado", f: "he (haber (to have), present, I: he, has, ha, hemos, habéis, han) + hablado, participle of hablar (to speak): the present perfect, 'I have spoken'."}
          - {w: "quisiera", f: "quis- + -iera → querer (to want), imperfect subjunctive (-ra form), I, used as a polite conditional: 'I would like'. Built on the preterite quisieron: quisiera, quisieras, quisiera, quisiéramos, quisierais, quisieran."}
          - {w: "roe, escarba", f: "ro- + -e → roer (to gnaw) and escarb- + -a → escarbar (to scratch), present, it (the scruple). The present of -er verbs: -o, -es, -e, -emos, -éis, -en; of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
