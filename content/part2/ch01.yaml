      - es: "despreció mil señores, mil valientes y mil discretos, y contentóse con un pajecillo barbilucio, sin otra hacienda ni nombre que el que le pudo dar de agradecido la amistad que guardó a su amigo."
        literal: "she-scorned a-thousand lords, a-thousand brave-men and a-thousand wise-men, and contented-herself with a little-page smooth-cheeked, without other property nor name than that which to-him could give of grateful the friendship that he-kept to his friend."
        ormsby: "She treated with scorn a thousand gentlemen, men of valour and wisdom, and took up with a smooth-faced sprig of a page, without fortune or fame, except such reputation for gratitude as the affection he bore his friend got for him."
