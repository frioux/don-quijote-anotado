      - es: "Yo tendré cuidado de enviarle algunos regalos que coma, y cómalos en todo caso, que le hago saber que imagino, como quien ha pasado por ello, que todas nuestras locuras proceden de tener los estómagos vacíos y los celebros llenos de aire."
