part: 2
chapter: 1
title_es: "Capítulo Primero. De lo que el cura y el barbero pasaron con don Quijote cerca de su enfermedad"
title_en: "Of the interview the curate and the barber had with Don Quixote about his malady"
paragraphs:
  - sentences:
      - es: "Cuenta Cide Hamete Benengeli, en la segunda parte desta historia y tercera salida de don Quijote, que el cura y el barbero se estuvieron casi un mes sin verle, por no renovarle y traerle a la memoria las cosas pasadas;"
        literal: "Tells Cide Hamete Benengeli, in the second part of-this history and third sally of Don Quijote, that the priest and the barber themselves-stayed almost a month without seeing-him, so-as not to-stir-up-in-him and to-bring-to-him to the memory the things past;"
        ormsby: "Cide Hamete Benengeli, in the Second Part of this history, and third sally of Don Quixote, says that the curate and the barber remained nearly a month without seeing him, lest they should recall or bring back to his recollection what had taken place."
        vocab:
          - {w: "Cide Hamete Benengeli", d: "the invented Arab historian whose manuscript, the narrator claimed in Part I chapter 9, he bought in Toledo and had translated; 'Cide' = 'sir', from Arabic sayyid"}
          - {w: "desta", d: "= de esta, of this (old contraction)"}
          - {w: "salida", d: "sally, expedition: Don Quijote's setting out from home"}
          - {w: "estarse", d: "to stay, remain (for a time)"}
          - {w: "renovar", d: "to renew, stir up again (a memory or a pain)"}
          - {w: "traer a la memoria", d: "to bring back to mind, remind of"}
          - {w: "las cosas pasadas", d: "what had happened, past events"}
        diagram:
          - s: "Cuenta"
            r: "main verb: tells"
            under:
              - {s: "Cide Hamete Benengeli", r: "subject: who tells"}
              - {s: "en la segunda parte desta historia y tercera salida de don Quijote", r: "where: in the second part of the story, the third sally"}
              - s: "que el cura y el barbero se estuvieron casi un mes sin verle"
                r: "what he tells: that the priest and the barber stayed away almost a month"
                under:
                  - {s: "por no renovarle y traerle a la memoria las cosas pasadas", r: "why: so as not to stir up his memory of what had happened"}
        forms:
          - {w: "Cuenta", f: "cuent- + -a → contar (to tell), present, he. The stem o becomes ue when stressed: cuento, cuentas, cuenta, contamos, contáis, cuentan. The verb comes before its subject, as often in narrative openings."}
          - {w: "desta", f: "de + esta, the preposition run together with 'esta' (this), feminine to match 'historia'; modern 'de esta'."}
          - {w: "se estuvieron", f: "estuv- + -ieron → estar (to be) with 'se': estarse (to stay, remain), preterite, they. Irregular preterite: estuve, estuviste, estuvo, estuvimos, estuvisteis, estuvieron."}
          - {w: "verle", f: "ver (to see) + le (him), the pronoun hung on the end of the infinitive after 'sin' (without). 'le' for a male person as object is leísmo, normal in Cervantes."}
          - {w: "renovarle y traerle", f: "renovar (to renew) + le (in him) and traer (to bring) + le (to him): two infinitives after 'por no' (so as not to), each with its pronoun hung on the end."}
          - {w: "pasadas", f: "pas- + -adas → pasar (to pass), participle used as an adjective, feminine plural to match 'cosas'."}
        note: "Part II appeared in 1615, ten years after Part I. The 'third sally' counts the two expeditions of Part I: the first alone (chapters 2-5), the second with Sancho (chapters 7-52), which ended with Don Quijote carted home."
      - es: "pero no por esto dejaron de visitar a su sobrina y a su ama, encargándolas tuviesen cuenta con regalarle, dándole a comer cosas confortativas y apropiadas para el corazón y el celebro, de donde procedía, según buen discurso, toda su mala ventura."
        literal: "but not for this they-left-off of visiting [to] his niece and [to] his housekeeper, charging-them [that] they-should-have care with pampering-him, giving-him to eat things comforting and appropriate for the heart and the brain, from where proceeded, according-to good reasoning, all his bad fortune."
        ormsby: "They did not, however, omit to visit his niece and housekeeper, and charge them to be careful to treat him with attention, and give him comforting things to eat, and such as were good for the heart and the brain, whence, it was plain to see, all his misfortune proceeded."
        vocab:
          - {w: "no dejar de", d: "not to fail to, not to stop (doing)"}
          - {w: "ama", d: "housekeeper (here); also mistress of a house"}
          - {w: "encargar", d: "to charge, instruct, ask someone to see to something"}
          - {w: "tener cuenta con", d: "to take care to, see to"}
          - {w: "regalar", d: "to pamper, treat kindly, feed well (not only 'to give a present')"}
          - {w: "confortativo", d: "comforting, strengthening: a medical word for restorative foods"}
          - {w: "apropiado para", d: "suited to, good for"}
          - {w: "celebro", d: "= cerebro, brain (old form)"}
          - {w: "discurso", d: "reasoning (false friend: not a speech here); 'según buen discurso' = as good sense shows"}
          - {w: "mala ventura", d: "misfortune, bad luck"}
        diagram:
          - s: "dejaron de visitar"
            r: "main verb: they did (not) fail to visit"
            under:
              - {s: "pero no por esto", r: "linking: but not for that reason; 'no' negates the verb"}
              - {s: "a su sobrina y a su ama", r: "object: his niece and his housekeeper"}
              - s: "encargándolas"
                r: "how: charging them"
                under:
                  - {s: "tuviesen cuenta con regalarle", r: "what they charged: that they take care to pamper him"}
              - s: "dándole a comer cosas confortativas y apropiadas para el corazón y el celebro"
                r: "what they charged, 2: giving him strengthening food, good for heart and brain"
                under:
                  - {s: "de donde procedía, según buen discurso, toda su mala ventura", r: "describes 'corazón y celebro': where, as good sense shows, all his trouble came from"}
        forms:
          - {w: "dejaron", f: "dej- + -aron → dejar (to leave off), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. 'dejar de' + infinitive = to stop doing; with 'no', 'not to fail to'."}
          - {w: "encargándolas", f: "gerund of encargar (to charge, instruct) + las (them, the two women), accent added to keep the stress. 'las' as the indirect object is laísmo; standard Spanish says 'encargándoles'."}
          - {w: "tuviesen", f: "tuv- + -iesen → tener (to have), imperfect subjunctive (-se form), they: 'that they should take'. Irregular: tuviese, tuvieses, tuviese, tuviésemos, tuvieseis, tuviesen. Cervantes often leaves out the 'que' after verbs of asking ('encargándolas [que] tuviesen')."}
          - {w: "regalarle", f: "regalar (to pamper) + le (him), the pronoun hung on the infinitive after 'con'."}
          - {w: "dándole", f: "gerund of dar (to give) + le (to him), accent added to keep the stress on dán-."}
          - {w: "confortativas y apropiadas", f: "confortativ- + -as and apropiad- + -as: feminine plural to match 'cosas'."}
          - {w: "celebro", f: "old form of cerebro (brain), with the r and l swapped."}
          - {w: "procedía", f: "proced- + -ía → proceder (to come from), imperfect, it (his misfortune). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían. The subject 'toda su mala ventura' comes after."}
        note: "In the medicine of the time, following Galen, madness came from a hot, dried-out brain; Part I chapter 1 says Don Quijote's brain dried up from too much reading and too little sleep. Moist, nourishing food for the heart and brain was the standard remedy."
      - es: "Las cuales dijeron que así lo hacían, y lo harían, con la voluntad y cuidado posible, porque echaban de ver que su señor por momentos iba dando muestras de estar en su entero juicio;"
        literal: "The which said that so it they-were-doing, and it they-would-do, with the will and care possible, because they-were-noticing that their master by moments was-going giving signs of being in his whole judgment;"
        ormsby: "The niece and housekeeper replied that they did so, and meant to do so with all possible care and assiduity, for they could perceive that their master was now and then beginning to show signs of being in his right mind."
        vocab:
          - {w: "las cuales", d: "which, here 'and they': the niece and the housekeeper"}
          - {w: "voluntad", d: "goodwill, willingness"}
          - {w: "echar de ver", d: "to notice, perceive"}
          - {w: "por momentos", d: "by the moment, more and more, steadily"}
          - {w: "dar muestras de", d: "to show signs of"}
          - {w: "estar en su entero juicio", d: "to be in one's right mind, have all one's wits"}
        diagram:
          - s: "dijeron"
            r: "main verb: said"
            under:
              - {s: "Las cuales", r: "subject: the niece and the housekeeper"}
              - {s: "que así lo hacían, y lo harían", r: "what they said: that they were doing so and would do so"}
              - {s: "con la voluntad y cuidado posible", r: "how: with all possible goodwill and care"}
              - s: "porque echaban de ver"
                r: "why: because they noticed"
                under:
                  - {s: "que su señor por momentos iba dando muestras de estar en su entero juicio", r: "what they noticed: that their master was showing more and more signs of being sane"}
        forms:
          - {w: "Las cuales", f: "'which', feminine plural to match the niece and the housekeeper; used after a full stop to mean 'and they'."}
          - {w: "dijeron", f: "dij- + -eron → decir (to say), preterite, they. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "hacían", f: "hac- + -ían → hacer (to do), imperfect, they: 'they were doing'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "harían", f: "har- + -ían → hacer (to do), conditional, they: 'they would do', the future seen from the past. Irregular stem har-: haría, harías, haría, haríamos, haríais, harían."}
          - {w: "posible", f: "singular although it follows two nouns: 'voluntad y cuidado' are taken as one idea."}
          - {w: "echaban", f: "ech- + -aban → echar (to throw), imperfect, they; 'echar de ver' = to notice. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "iba dando", f: "iba → ir (to go), imperfect, he: iba, ibas, iba, íbamos, ibais, iban; + dando, gerund of dar (to give). ir (to go) + gerund = to be gradually doing: 'was little by little showing'."}
          - {w: "estar", f: "estar (to be), infinitive after 'de'."}
      - es: "de lo cual recibieron los dos gran contento, por parecerles que habían acertado en haberle traído encantado en el carro de los bueyes, como se contó en la primera parte desta tan grande como puntual historia, en su último capítulo."
        literal: "of which received the two great contentment, for seeming-to-them that they-had hit-the-mark in having-him brought enchanted in the cart of the oxen, as itself was-told in the first part of-this as great as precise history, in its last chapter."
        ormsby: "This gave great satisfaction to the curate and the barber, for they concluded they had taken the right course in carrying him off enchanted on the oxcart, as has been described in the First Part of this great as well as accurate history, in the last chapter thereof."
        vocab:
          - {w: "de lo cual", d: "at which, from which"}
          - {w: "contento", d: "satisfaction, contentment (a noun here)"}
          - {w: "acertar en", d: "to be right to, hit the mark in (doing)"}
          - {w: "encantado", d: "enchanted: the priest and barber had made Don Quijote believe he was under a spell"}
          - {w: "carro de bueyes", d: "ox-cart"}
          - {w: "tan ... como", d: "as ... as; 'tan grande como puntual' = as great as it is exact"}
          - {w: "puntual", d: "exact, accurate in every detail (not 'on time')"}
        diagram:
          - s: "recibieron"
            r: "main verb: received"
            under:
              - {s: "de lo cual", r: "why: at this (the women's report)"}
              - {s: "los dos", r: "subject: the two, the priest and the barber"}
              - {s: "gran contento", r: "object: great satisfaction"}
              - s: "por parecerles"
                r: "why: because it seemed to them"
                under:
                  - s: "que habían acertado en haberle traído encantado en el carro de los bueyes"
                    r: "what seemed: that they had been right to bring him home enchanted in the ox-cart"
                    under:
                      - {s: "como se contó en la primera parte desta tan grande como puntual historia, en su último capítulo", r: "as told in Part I, last chapter"}
        forms:
          - {w: "recibieron", f: "recib- + -ieron → recibir (to receive), preterite, they. The preterite of -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "gran", f: "grande (great) clipped before a singular noun ('contento')."}
          - {w: "parecerles", f: "parecer (to seem) + les (to them), the pronoun hung on the infinitive after 'por' (because of)."}
          - {w: "habían acertado", f: "habían → haber (to have), imperfect, they: había, habías, había, habíamos, habíais, habían; + acertado, participle of acertar (to hit the mark): the pluperfect, 'they had been right'."}
          - {w: "haberle traído", f: "haber (to have) + le (him) + traído, participle of traer (to bring): the perfect infinitive, 'having brought him', after 'en'."}
          - {w: "encantado", f: "encant- + -ado → encantar (to enchant), participle, masculine to match 'le' (Don Quijote)."}
          - {w: "se contó", f: "cont- + -ó → contar (to tell), preterite, it, with 'se' making it passive: 'it was told'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "desta", f: "de + esta (this), run together; modern 'de esta'."}
          - {w: "último", f: "últim- + -o → último (last), masculine to match 'capítulo'."}
        note: "In Part I chapters 46-47 the priest and barber, with others in disguise, caged Don Quijote and persuaded him he was enchanted; in chapter 52 the ox-cart brought him home. The narrator's 'as great as it is exact' is a mock-solemn puff for his own book."
      - es: "Y así, determinaron de visitarle y hacer esperiencia de su mejoría, aunque tenían casi por imposible que la tuviese, y acordaron de no tocarle en ningún punto de la andante caballería, por no ponerse a peligro de descoser los de la herida, que tan tiernos estaban."
        literal: "And so, they-determined of to-visit-him and to-make trial of his improvement, although they-held almost as impossible that it he-might-have, and they-agreed of not to-touch-him in any point of the errant knighthood, so-as not to-put-themselves at risk of unstitching those of the wound, which so tender were."
        ormsby: "So they resolved to pay him a visit and test the improvement in his condition, although they thought it almost impossible that there could be any; and they agreed not to touch upon any point connected with knight-errantry so as not to run the risk of reopening wounds which were still so tender."
        vocab:
          - {w: "determinar de", d: "to decide to (modern 'determinar' without 'de')"}
          - {w: "esperiencia", d: "= experiencia; here 'test, trial' (hacer experiencia de = to put to the test)"}
          - {w: "mejoría", d: "improvement, recovery"}
          - {w: "tener por", d: "to consider, regard as"}
          - {w: "acordar de", d: "to agree to, decide together to"}
          - {w: "tocar en", d: "to touch on, mention"}
          - {w: "andante caballería", d: "knight-errantry"}
          - {w: "ponerse a peligro de", d: "to run the risk of"}
          - {w: "descoser", d: "to unstitch, unpick (a seam or stitches)"}
          - {w: "punto", d: "point (of a topic) and also a surgical stitch: the pun of the sentence"}
          - {w: "tierno", d: "tender, fresh, not yet healed"}
        diagram:
          - s: "determinaron de visitarle y hacer esperiencia de su mejoría"
            r: "main verb 1: they decided to visit him and test his improvement"
            under:
              - {s: "Y así", r: "linking: and so"}
              - s: "aunque tenían casi por imposible"
                r: "concession: although they thought it almost impossible"
                under:
                  - {s: "que la tuviese", r: "what they thought impossible: that he had any (improvement)"}
          - s: "y acordaron de no tocarle"
            r: "main verb 2: and they agreed not to touch him"
            under:
              - {s: "en ningún punto de la andante caballería", r: "on what: on any point of knight-errantry"}
              - s: "por no ponerse a peligro de descoser los de la herida"
                r: "why: so as not to risk unpicking the stitches of the wound"
                under:
                  - {s: "que tan tiernos estaban", r: "describes 'los' (the stitches): which were so fresh"}
        forms:
          - {w: "determinaron", f: "determin- + -aron → determinar (to decide), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "visitarle", f: "visitar (to visit) + le (him), the pronoun hung on the infinitive."}
          - {w: "esperiencia", f: "old spelling of experiencia, with s for x."}
          - {w: "tenían", f: "ten- + -ían → tener (to hold), imperfect, they; 'tener por' = to consider. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "la tuviese", f: "tuv- + -iese → tener (to have), imperfect subjunctive (-se form), he: tuviese, tuvieses, tuviese, tuviésemos, tuvieseis, tuviesen. Subjunctive because it depends on 'tenían por imposible'. 'la' = la mejoría."}
          - {w: "acordaron", f: "acord- + -aron → acordar (to agree), preterite, they. Same -aron preterite."}
          - {w: "tocarle", f: "tocar (to touch) + le (him), the pronoun hung on the infinitive after 'de no'."}
          - {w: "ningún", f: "ninguno (no, any) clipped before a masculine singular noun ('punto')."}
          - {w: "ponerse", f: "poner (to put) + se (themselves), the pronoun hung on the infinitive after 'por no'."}
          - {w: "los", f: "masculine plural, standing for 'puntos' (stitches), picked up from 'punto' just before."}
          - {w: "tiernos", f: "tiern- + -os → tierno (tender), masculine plural to match 'los' (the stitches)."}
          - {w: "estaban", f: "est- + -aban → estar (to be), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
        note: "A pun: 'punto' is both a point of discussion and a surgeon's stitch, so touching on any 'point' of chivalry could pull open the 'stitches' of a wound not yet healed."
  - sentences:
      - es: "Visitáronle, en fin, y halláronle sentado en la cama, vestida una almilla de bayeta verde, con un bonete colorado toledano; y estaba tan seco y amojamado, que no parecía sino hecho de carne momia."
        literal: "They-visited-him, in end, and they-found-him seated in the bed, put-on a vest of baize green, with a cap red Toledan; and he-was so dry and shrivelled-like-dried-tuna, that not he-seemed but made of flesh mummy."
        ormsby: "They came to see him consequently, and found him sitting up in bed in a green baize waistcoat and a red Toledo cap, and so withered and dried up that he looked as if he had been turned into a mummy."
        vocab:
          - {w: "en fin", d: "in the end, so, at length"}
          - {w: "almilla", d: "short close-fitting jacket or vest worn under the outer clothes"}
          - {w: "bayeta", d: "baize, a coarse woollen cloth"}
          - {w: "bonete", d: "cap, bonnet (a soft indoor cap)"}
          - {w: "colorado", d: "red (false friend: not 'coloured')"}
          - {w: "toledano", d: "from Toledo, a city famous for its caps"}
          - {w: "amojamado", d: "shrivelled, dried up like 'mojama', salted dried tuna"}
          - {w: "no ... sino", d: "nothing but; 'no parecía sino hecho de' = he looked exactly as if made of"}
          - {w: "carne momia", d: "mummy flesh: the dried, dark 'mummy' sold by apothecaries as a medicine"}
        diagram:
          - s: "Visitáronle"
            r: "main verb 1: they visited him"
            under:
              - {s: "en fin", r: "linking: so, at length"}
          - s: "y halláronle sentado en la cama"
            r: "main verb 2: and found him sitting up in bed"
            under:
              - {s: "vestida una almilla de bayeta verde", r: "how dressed: with a green baize vest on"}
              - {s: "con un bonete colorado toledano", r: "with what: with a red Toledo cap"}
          - s: "y estaba tan seco y amojamado"
            r: "main verb 3: and he was so dry and shrivelled"
            under:
              - {s: "que no parecía sino hecho de carne momia", r: "result: that he looked like nothing but mummy flesh"}
        forms:
          - {w: "Visitáronle", f: "visit- + -aron + le → visitar (to visit), preterite, they, with 'le' (him) stuck on the end; modern 'le visitaron'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. Cervantes hangs the pronoun on a conjugated verb that opens a clause."}
          - {w: "halláronle", f: "hall- + -aron + le → hallar (to find), preterite, they, with 'le' (him) stuck on the end, again because the verb opens its clause; modern 'le hallaron'. Same -aron preterite."}
          - {w: "sentado", f: "sent- + -ado → sentar (to seat), participle, masculine to match 'le' (Don Quijote): 'sitting'."}
          - {w: "vestida", f: "vest- + -ida → vestir (to dress, put on), participle, feminine to match 'almilla': 'a vest put on', i.e. wearing a vest. The participle stands on its own like an English 'with ... on'."}
          - {w: "colorado toledano", f: "colorad- + -o, toledan- + -o: masculine to match 'bonete'."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "seco y amojamado", f: "masculine singular to match Don Quijote; 'tan' (so) sets up the result clause 'que ...'."}
          - {w: "parecía", f: "parec- + -ía → parecer (to seem), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "hecho", f: "irregular participle of hacer (to make), masculine: 'made'."}
        note: "'Mummy', ground-up embalmed flesh from Egyptian tombs, was a real drug in the pharmacies of the time, so 'carne momia' was a familiar image of dark, dried-out flesh. Don Quijote is as lean and dry as in Part I chapter 1."
      - es: "Fueron dél muy bien recebidos, preguntáronle por su salud, y él dio cuenta de sí y de ella con mucho juicio y con muy elegantes palabras;"
        literal: "They-were by-him very well received, they-asked-him about his health, and he gave account of himself and of it with much judgment and with very elegant words;"
        ormsby: "They were very cordially received by him; they asked him after his health, and he talked to them about himself very naturally and in very well-chosen language."
        vocab:
          - {w: "dél", d: "= de él; 'de' here means 'by' (the doer of a passive), modern 'por él'"}
          - {w: "recebir", d: "= recibir, to receive (old spelling)"}
          - {w: "preguntar por", d: "to ask after, inquire about"}
          - {w: "dar cuenta de", d: "to give an account of, report on"}
          - {w: "juicio", d: "good sense, sound judgment"}
        diagram:
          - s: "Fueron dél muy bien recebidos"
            r: "main verb 1: they were very well received by him"
          - s: "preguntáronle por su salud"
            r: "main verb 2: they asked him about his health"
          - s: "y él dio cuenta de sí y de ella"
            r: "main verb 3: and he gave an account of himself and of it (his health)"
            under:
              - {s: "con mucho juicio y con muy elegantes palabras", r: "how: very sensibly and in very elegant words"}
        forms:
          - {w: "Fueron ... recebidos", f: "fueron → ser (to be), preterite, they: fui, fuiste, fue, fuimos, fuisteis, fueron; + recebidos, participle of recebir (to receive), masculine plural to match the priest and the barber: the passive, 'they were received'."}
          - {w: "dél", f: "de + él (him) run together; modern 'de él', and in this sense 'por él'."}
          - {w: "recebidos", f: "old spelling of recibidos, participle of recibir (to receive)."}
