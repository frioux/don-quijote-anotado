  - sentences:
      - es: "— Caballero andante he de morir, y baje o suba el Turco cuando él quisiere y cuan poderosamente pudiere; que otra vez digo que Dios me entiende."
        literal: "— Knight errant I-have to die, and let-come-down or let-come-up the Turk when he may-wish and as powerfully [as] he-may-be-able; for another time I-say that God me understands."
        ormsby: "“A knight-errant I shall die, and let the Turk come down or go up when he likes, and in as strong force as he can, once more I say, God knows what I mean.”"
        vocab:
          - {w: "haber de", d: "to be going to, be bound to: 'he de morir' = I shall die"}
          - {w: "baje o suba", d: "'let him come down or go up', i.e. let him do what he likes"}
          - {w: "cuan", d: "as (= tan ... como): 'cuan poderosamente pudiere' = as powerfully as he can"}
          - {w: "otra vez", d: "again, once more"}
        diagram:
          - {s: "Caballero andante he de morir", r: "main verb 1: a knight errant I shall die"}
          - s: "y baje o suba el Turco"
            r: "main verb 2: and let the Turk come down or go up"
            under:
              - {s: "cuando él quisiere", r: "when: whenever he likes"}
              - {s: "y cuan poderosamente pudiere", r: "how: and with as much force as he can"}
          - s: "otra vez digo"
            r: "main verb 3 (after 'que', for): I say again"
            under:
              - {s: "que Dios me entiende", r: "what I say: that God understands me"}
        forms:
          - {w: "he de morir", f: "h- + -e → haber (to have), present, I: he, has, ha, hemos, habéis, han; + de + morir (to die): 'I am to die, I shall die'."}
          - {w: "baje", f: "baj- + -e → bajar (to come down), present subjunctive, he: 'let him come down'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "suba", f: "sub- + -a → subir (to go up), present subjunctive, he: 'or go up'. The present subjunctive of -ir verbs: -a, -as, -a, -amos, -áis, -an. Together 'baje o suba' means 'whatever he does'."}
          - {w: "quisiere", f: "quis- + -iere → querer (to want), future subjunctive, he: 'whenever he may want'. Built on the preterite quisieron: quisiere, quisieres, quisiere, quisiéremos, quisiereis, quisieren. Cervantes uses it after 'cuando', 'si', 'lo que' for an open future; modern Spanish says 'quiera'."}
          - {w: "poderosamente", f: "poderos- + -a + -mente → poderoso (powerful) turned into an adverb by adding -mente to the feminine: 'powerfully'."}
          - {w: "pudiere", f: "pud- + -iere → poder (to be able), future subjunctive, he: 'as he may be able'. Built on the preterite pudieron: pudiere, pudieres, pudiere, pudiéremos, pudiereis, pudieren. Modern Spanish says 'pueda'."}
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "entiende", f: "entiend- + -e → entender (to understand), present, he. The stem e becomes ie when stressed: entiendo, entiendes, entiende, entendemos, entendéis, entienden."}
