          - {w: "atreverse a", d: "to dare to, venture to"}
          - {w: "bermejo", d: "ruddy, reddish"}
          - {w: "bailador", d: "dancing; 'ojos bailadores' = restless, roving eyes"}
          - {w: "saltado", d: "bulging, protruding (of eyes)"}
          - {w: "puntoso", d: "touchy, quick to take a point of honour"}
          - {w: "colérico", d: "choleric, hot-tempered (in humoral medicine, ruled by yellow bile)"}
          - {w: "en demasía", d: "excessively, too much"}
          - {w: "gente perdida", d: "ruffians, lost souls, scapegraces"}
