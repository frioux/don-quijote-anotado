      - es: "«No tenga vuestra merced pena, señor mío, ni haga caso de lo que este loco ha dicho, que si él es Júpiter y no quisiere llover, yo, que soy Neptuno, el padre y el dios de las aguas, lloveré todas las veces que se me antojare y fuere menester»."
        literal: "«Not may-have your grace sorrow, sir mine, nor may-make case of that which this madman has said, for if he is Jupiter and not may-want to-rain, I, who am Neptune, the father and the god of the waters, will-rain all the times that to-me it-may-take-the-fancy and may-be needful»."
