  - sentences:
      - es: "— Pues, ¿éste es el cuento, señor barbero —dijo don Quijote—, que, por venir aquí como de molde, no podía dejar de contarle?"
        literal: "— Well, this is the tale, sir barber —said Don Quijote—, that, for coming here as from mold, not you-could leave-off from telling-it?"
        ormsby: "“So that’s the story, master barber,” said Don Quixote, “which came in so pat to the purpose that you could not help telling it?"
        vocab:
          - {w: "venir como de molde", d: "to fit perfectly, come in pat; literally 'as if from a mold'"}
          - {w: "no poder dejar de", d: "to be unable to help (doing something)"}
          - {w: "contarle", d: "to tell it; 'le' stands for 'el cuento' (a thing, not a person)"}
        diagram:
          - s: "dijo don Quijote"
            r: "frame: said Don Quijote"
          - s: "¿éste es el cuento"
            r: "main verb: is this the story"
            under:
              - {s: "Pues", r: "linking: so, well then"}
              - {s: "señor barbero", r: "addressed: master barber"}
              - s: "que"
                r: "describes 'cuento': which"
                under:
                  - {s: "por venir aquí como de molde", r: "why: because it fits here so perfectly"}
                  - {s: "no podía dejar de contarle", r: "you couldn't help telling"}
        forms:
          - {w: "éste", f: "este (this) as a pronoun, written with an accent in the old spelling: 'this one'; masculine to match 'cuento'."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "venir", f: "venir (to come), infinitive after 'por' (because of): 'because it comes'."}
          - {w: "podía", f: "pod- + -ía → poder (to be able), imperfect, you (vuestra merced, with 'he/she' verb forms). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "contarle", f: "contar (to tell) + le (it), the pronoun hung on the infinitive. 'le' here stands for a thing, 'el cuento', where modern Spanish prefers 'lo'."}
        note: "Don Quijote has seen through the barber's story at once: the madman who seems cured but is not is meant to be himself. He throws the barber's own phrase 'como de molde' back at him."
      - es: "¡Ah, señor rapista, señor rapista, y cuán ciego es aquel que no vee por tela de cedazo!"
        literal: "Ah, sir shaver, sir shaver, and how blind is that-one who not sees through cloth of sieve!"
        ormsby: "Master shaver, master shaver! how blind is he who cannot see through a sieve."
        ormsby_note: "Proverb 49."
        vocab:
          - {w: "rapista", d: "shaver, barber (mocking; from 'rapar', to shave)"}
          - {w: "cuán", d: "how (before an adjective; short for 'cuanto')"}
          - {w: "vee", d: "= ve, sees (old form of 'ver')"}
          - {w: "tela de cedazo", d: "the mesh of a sieve"}
          - {w: "ciego es aquel que no vee por tela de cedazo", d: "proverb: only a blind man can't see through a sieve, i.e. your meaning is perfectly obvious"}
        diagram:
          - s: "cuán ciego es aquel"
            r: "main verb: how blind is the man"
            under:
              - {s: "Ah, señor rapista, señor rapista", r: "addressed: ah, master shaver"}
              - {s: "que no vee por tela de cedazo", r: "describes 'aquel': who cannot see through a sieve"}
        forms:
          - {w: "cuán", f: "short form of cuanto (how much) before an adjective: 'cuán ciego' = how blind."}
          - {w: "es", f: "ser (to be), present, he: soy, eres, es, somos, sois, son."}
          - {w: "aquel", f: "'that one', the far demonstrative used as 'he who' before a 'que' clause."}
          - {w: "vee", f: "ve- + -e → ver (to see), present, he; old form of modern 've'. Old present of ver (to see): veo, vees, vee, vemos, veis, veen (modern veo, ves, ve, vemos, veis, ven)."}
        note: "Ormsby's 'Proverb 49' refers to his own numbered list of the proverbs in the book. The saying means that something is so plain only a blind man could miss it: Don Quijote tells the barber his hint was obvious."
      - es: "Y ¿es posible que vuestra merced no sabe que las comparaciones que se hacen de ingenio a ingenio, de valor a valor, de hermosura a hermosura y de linaje a linaje son siempre odiosas y mal recebidas?"
        literal: "And is-it possible that your grace not knows that the comparisons that themselves make from wit to wit, from valor to valor, from beauty to beauty and from lineage to lineage are always odious and badly received?"
        ormsby: "Is it possible that you do not know that comparisons of wit with wit, valour with valour, beauty with beauty, birth with birth, are always odious and unwelcome?"
        vocab:
          - {w: "ingenio", d: "wit, intelligence, talent"}
          - {w: "linaje", d: "lineage, birth, family"}
          - {w: "las comparaciones son odiosas", d: "comparisons are odious, a proverb in Spanish as in English"}
          - {w: "recebidas", d: "= recibidas, received (old spelling)"}
