  - sentences:
      - es: "Y, sin duda, que esto fue como profecía; que los poetas también se llaman vates, que quiere decir adivinos."
        literal: "And, without doubt, [I-say] that this was like prophecy; for the poets also themselves call vates, which means soothsayers."
        ormsby: "and this was no doubt a kind of prophecy, for poets are also called vates, that is to say diviners;"
        vocab:
          - {w: "sin duda", d: "no doubt, certainly"}
          - {w: "profecía", d: "prophecy"}
          - {w: "vate", d: "poet-prophet, from Latin 'vates', which meant both poet and seer"}
          - {w: "querer decir", d: "to mean"}
          - {w: "adivino", d: "soothsayer, diviner, prophet"}
        diagram:
          - s: "que esto fue como profecía"
            r: "main verb 1 (after 'sin duda'): this was like a prophecy"
          - s: "que los poetas también se llaman vates"
            r: "main verb 2 (after 'que', for): poets are also called 'vates'"
            under:
              - {s: "que quiere decir adivinos", r: "describes 'vates': which means soothsayers"}
        forms:
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, it: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "se llaman", f: "llam- + -an → llamar (to call), present, they; 'se' makes it passive: 'are called'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "quiere decir", f: "quier- + -e → querer (to want), present, it, + decir (to say): 'quiere decir' = means. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
      - es: "Véese esta verdad clara, porque, después acá, un famoso poeta andaluz lloró y cantó sus lágrimas, y otro famoso y único poeta castellano cantó su hermosura."
        literal: "Sees-itself this truth clear, because, after hither, a famous poet Andalusian wept and sang her tears, and another famous and unique poet Castilian sang her beauty."
        ormsby: "and its truth was made plain; for since then a famous Andalusian poet has lamented and sung her tears, and another famous and rare poet, a Castilian, has sung her beauty.”"
        ormsby_note: "The Andalusian was Barahona de Soto, who wrote the Primera Parte de la Angelica (not Lagrimas de Angelica, as Cervantes calls it in Part I Chapter VI). It appeared at Granada in 1586. The Castilian was Lope de Vega, whose Hermosura de Angelica formed the first part of his Rimas, printed at Madrid in 1602."
        vocab:
          - {w: "después acá", d: "since then, from then till now"}
          - {w: "andaluz", d: "Andalusian, from southern Spain"}
          - {w: "único", d: "here 'unique, matchless, outstanding' (not 'only')"}
          - {w: "castellano", d: "Castilian"}
        diagram:
          - s: "Véese esta verdad clara"
            r: "main verb: this truth is seen clearly"
            under:
              - s: "porque, después acá"
                r: "why: because, since then"
                under:
                  - {s: "un famoso poeta andaluz lloró y cantó sus lágrimas", r: "reason 1: a famous Andalusian poet wept and sang her tears"}
                  - {s: "y otro famoso y único poeta castellano cantó su hermosura", r: "reason 2: and another famous, matchless Castilian poet sang her beauty"}
        forms:
          - {w: "Véese", f: "ve- + -e + se → ver (to see), present, it, with 'se' stuck on the end; modern 'se ve'. ver (to see) in the present: veo, ves, ve, vemos, veis, ven. 'se' makes it passive: 'is seen'. Cervantes hangs the pronoun on a verb that opens its clause."}
          - {w: "clara", f: "clar- + -a → claro (clear), feminine to match 'verdad'."}
          - {w: "lloró, cantó", f: "llor- + -ó → llorar (to weep) and cant- + -ó → cantar (to sing), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "sus lágrimas", f: "sus = plural to match 'lágrimas', not the owner; 'her tears' (Angélica's)."}
        note: "Cervantes praised Barahona de Soto's poem in the scrutiny of the library in Part I chapter 6, where the priest saved it from the fire. Both poems are Spanish continuations of Angelica's story."
  - sentences:
      - es: "— Dígame, señor don Quijote —dijo a esta sazón el barbero—, ¿no ha habido algún poeta que haya hecho alguna sátira a esa señora Angélica, entre tantos como la han alabado?"
        literal: "— Tell-me, sir Don Quijote —said at this moment the barber—, not has there-been some poet who may-have made some satire to that lady Angélica, among so-many as her have praised?"
        ormsby: "“Tell me, Señor Don Quixote,” said the barber here, “among all those who praised her, has there been no poet to write a satire on this Lady Angelica?”"
        vocab:
          - {w: "a esta sazón", d: "at this point, just then ('sazón' = season, right moment)"}
          - {w: "sátira", d: "satire, a mocking poem"}
          - {w: "entre tantos como", d: "among all those who, among so many that"}
          - {w: "alabar", d: "to praise"}
        diagram:
          - s: "Dígame"
            r: "main verb 1: tell me"
            under:
              - {s: "señor don Quijote", r: "addressed to: Don Quijote"}
              - {s: "dijo a esta sazón el barbero", r: "speech tag: the barber said at this point"}
          - s: "no ha habido algún poeta"
            r: "main verb 2, the question: has there not been some poet"
            under:
              - {s: "que haya hecho alguna sátira a esa señora Angélica", r: "describes 'poeta': who has written a satire on Angelica"}
              - {s: "entre tantos como la han alabado", r: "among whom: among all those who have praised her"}
        forms:
          - {w: "Dígame", f: "dig- + -a + me → decir (to say), present subjunctive used as a polite command, you (vuestra merced), with 'me' stuck on the end: 'tell me'. decir (to say) in the present subjunctive: diga, digas, diga, digamos, digáis, digan. Pronouns always hang on the end of a positive command."}
          - {w: "ha habido", f: "ha (haber (to have), present, it: he, has, ha, hemos, habéis, han) + habido, participle of haber (there to be): 'there has been'."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun ('poeta'), like un, buen, ningún."}
          - {w: "haya hecho", f: "hay- + -a → haber (to have), present subjunctive, he (haya, hayas, haya, hayamos, hayáis, hayan), + hecho, irregular participle of hacer (to make): 'may have made'. Subjunctive because the poet may not exist."}
          - {w: "han alabado", f: "han (haber (to have), present, they: he, has, ha, hemos, habéis, han) + alabado, participle of alabar (to praise): 'have praised'. 'la' = her."}
  - sentences:
      - es: "— Bien creo yo —respondió don Quijote— que si Sacripante o Roldán fueran poetas, que ya me hubieran jabonado a la doncella;"
        literal: "— Well believe I —answered Don Quijote— that if Sacripante or Roldán were poets, that already for-me they-would-have soaped [to] the maiden;"
        ormsby: "“I can well believe,” replied Don Quixote, “that if Sacripante or Roland had been poets they would have given the damsel a trimming;"
        vocab:
          - {w: "Sacripante", d: "Sacripante, king of Circassia, one of Angelica's rejected suitors in Boiardo and Ariosto"}
          - {w: "jabonar", d: "literally 'to soap'; colloquially 'to give someone a dressing-down, a good scolding' (Ormsby's 'trimming')"}
          - {w: "bien creo", d: "I can well believe"}
        diagram:
          - s: "Bien creo yo"
            r: "main verb: I well believe"
            under:
              - {s: "respondió don Quijote", r: "speech tag: Don Quijote answered"}
              - s: "que ya me hubieran jabonado a la doncella"
                r: "what I believe: that they would have given the maiden a good scolding"
                under:
                  - {s: "si Sacripante o Roldán fueran poetas", r: "condition: if Sacripante or Roland had been poets"}
        forms:
          - {w: "creo", f: "cre- + -o → creer (to believe), present, I. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "fueran", f: "fue- + -ran → ser (to be), imperfect subjunctive (-ra form), they: 'if they were'. ser (to be) in the -ra form: fuera, fueras, fuera, fuéramos, fuerais, fueran."}
          - {w: "hubieran jabonado", f: "hub- + -ieran → haber (to have), imperfect subjunctive (-ra form), they (hubiera, hubieras, hubiera, hubiéramos, hubierais, hubieran), + jabonado, participle of jabonar (to soap): 'would have soaped', the -ra form used as a conditional perfect (modern 'habrían jabonado')."}
          - {w: "que si ... que ya", f: "the 'que' is repeated after the 'si' clause, a common habit in speech: Spanish then and now often restarts the 'that' clause after an interruption."}
