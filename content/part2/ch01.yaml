  - sentences:
      - es: "— Por mí —dijo el barbero—, doy la palabra, para aquí y para delante de Dios, de no decir lo que vuestra merced dijere a rey ni a roque, ni a hombre terrenal, juramento que aprendí del romance del cura que en el prefacio avisó al rey del ladrón que le había robado las cien doblas y la su mula la andariega."
        literal: "— For me — said the barber —, I-give the word, for here and for before God, of not saying that which your grace may-say to king nor to rook, nor to man earthly, oath that I-learned from-the ballad of-the priest who in the preface informed [to]-the king of-the thief who him had robbed the hundred doubloons and the his mule the ambling."
        ormsby: "“For my part,” said the barber, “I give my word here and before God that I will not repeat what your worship says, to King, Rook, or earthly man—an oath I learned from the ballad of the curate, who, in the prelude, told the king of the thief who had robbed him of the hundred gold crowns and his pacing mule.”"
        ormsby_note: "Ni Rey ni Roque, 'neither king nor rook', a popular phrase somewhat like 'gentle or simple,' or 'high or low.' According to Clemencín probably derived from the game of chess, rook or rock (Pers. rokh) being the same thing as the castle. (On the ballad:) The ballad referred to has not been identified so far as I am aware."
        vocab:
          - {w: "por mí", d: "as for me, for my part"}
          - {w: "dar la palabra", d: "to give one's word, promise"}
          - {w: "delante de", d: "before, in front of"}
          - {w: "ni a rey ni a roque", d: "to no one at all, 'neither king nor rook (castle in chess)'"}
          - {w: "terrenal", d: "earthly, mortal"}
          - {w: "juramento", d: "oath"}
          - {w: "romance", d: "ballad: a traditional Spanish narrative poem in eight-syllable lines"}
          - {w: "prefacio", d: "preface; in the Mass, the prayer before the consecration (probably the sense here, the priest interrupting his Mass)"}
          - {w: "avisar", d: "to inform, warn"}
          - {w: "dobla", d: "doubloon, a gold coin"}
          - {w: "la su mula", d: "his mule: article plus possessive, an old form kept in ballads"}
          - {w: "andariego", d: "ambling, a good walker (of a mule)"}
        diagram:
          - s: "doy la palabra"
            r: "main verb: I give my word"
            under:
              - {s: "Por mí", r: "whose part: as for me"}
              - {s: "dijo el barbero", r: "aside: said the barber"}
              - {s: "para aquí y para delante de Dios", r: "where: here and before God"}
              - s: "de no decir lo que vuestra merced dijere"
                r: "what I promise: not to repeat what your grace says"
                under:
                  - {s: "a rey ni a roque, ni a hombre terrenal", r: "to whom: to king or rook or any man on earth"}
              - s: "juramento"
                r: "in apposition: an oath (the promise just made)"
                under:
                  - s: "que aprendí del romance del cura"
                    r: "describes 'juramento': which I learned from the ballad of the priest"
                    under:
                      - s: "que en el prefacio avisó al rey del ladrón"
                        r: "describes 'cura': who at the preface told the king about the thief"
                        under:
                          - {s: "que le había robado las cien doblas y la su mula la andariega", r: "describes 'ladrón': who had stolen his hundred doubloons and his ambling mule"}
        forms:
          - {w: "doy", f: "d- + -oy → dar (to give), present, I. Irregular: doy, das, da, damos, dais, dan."}
          - {w: "decir", f: "decir (to say), infinitive after 'de no'."}
          - {w: "dijere", f: "dij- + -ere → decir (to say), future subjunctive, you (vuestra merced takes the he/she form): 'whatever you may say'. dijere, dijeres, dijere, dijéremos, dijereis, dijeren. Cervantes uses the future subjunctive after 'lo que', 'si', 'cuando' for an open future; modern Spanish uses the present subjunctive 'diga'."}
          - {w: "aprendí", f: "aprend- + -í → aprender (to learn), preterite, I. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "del, al", f: "de + el and a + el, the contractions modern Spanish still makes."}
          - {w: "avisó", f: "avis- + -ó → avisar (to inform), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "le había robado", f: "había → haber (to have), imperfect, he: había, habías, había, habíamos, habíais, habían; + robado, participle of robar (to rob): the pluperfect, 'had robbed'. 'le' = from him (the priest)."}
          - {w: "cien", f: "ciento (hundred) clipped before a noun ('doblas')."}
          - {w: "la su mula la andariega", f: "old ballad style: article + possessive ('la su'), and the adjective made into a noun with a second article ('la andariega', the ambling one); modern 'su mula andariega'. andariega is feminine to match 'mula'."}
  - sentences:
      - es: "— No sé historias —dijo don Quijote—, pero sé que es bueno ese juramento, en fee de que sé que es hombre de bien el señor barbero."
        literal: "— Not I-know stories — said Don Quijote —, but I-know that is good that oath, in faith of that I-know that is man of good the sir barber."
        ormsby: "“I am not versed in stories,” said Don Quixote; “but I know the oath is a good one, because I know the barber to be an honest fellow.”"
        vocab:
          - {w: "historias", d: "stories, tales (and histories)"}
          - {w: "en fee de que", d: "on the strength of the fact that, because (fee = fe, faith)"}
          - {w: "hombre de bien", d: "honest man, decent fellow"}
        diagram:
          - s: "No sé historias"
            r: "main verb 1: I don't know stories"
            under:
              - {s: "dijo don Quijote", r: "aside: said Don Quijote"}
          - s: "pero sé"
            r: "main verb 2: but I know"
            under:
              - {s: "que es bueno ese juramento", r: "what I know: that this oath is good"}
              - s: "en fee de que sé"
                r: "why: on the strength that I know"
                under:
                  - {s: "que es hombre de bien el señor barbero", r: "what I know: that the barber is an honest man"}
        forms:
          - {w: "sé", f: "s- + -é → saber (to know), present, I. Irregular: sé, sabes, sabe, sabemos, sabéis, saben. The accent tells it from 'se'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "es", f: "ser (to be), present, it / he. Irregular: soy, eres, es, somos, sois, son. In both clauses the subject comes after: 'es bueno ese juramento', 'es hombre de bien el señor barbero'."}
          - {w: "ese", f: "'that', masculine to match 'juramento'."}
          - {w: "fee", f: "old spelling of fe (faith)."}
  - sentences:
      - es: "— Cuando no lo fuera —dijo el cura—, yo le abono y salgo por él, que en este caso no hablará más que un mudo, so pena de pagar lo juzgado y sentenciado."
        literal: "— When not it he-were — said the priest —, I him vouch-for and go-out for him, that in this case not he-will-speak more than a mute, under penalty of paying the-[thing] judged and sentenced."
        ormsby: "“Even if he were not,” said the curate, “I will go bail and answer for him that in this matter he will be as silent as a dummy, under pain of paying any penalty that may be pronounced.”"
        vocab:
          - {w: "cuando", d: "here 'even if' (with the subjunctive)"}
          - {w: "abonar", d: "to vouch for, go surety for"}
          - {w: "salir por", d: "to stand surety for, answer for"}
          - {w: "no ... más que", d: "no more than"}
          - {w: "mudo", d: "mute, a person who cannot speak"}
          - {w: "so pena de", d: "under pain of ('so' = under, old)"}
          - {w: "lo juzgado y sentenciado", d: "whatever is judged and sentenced: a legal formula for the penalty a guarantor must pay"}
        diagram:
          - s: "yo le abono y salgo por él"
            r: "main verb: I vouch for him and stand surety for him"
            under:
              - {s: "Cuando no lo fuera", r: "condition: even if he were not (an honest man)"}
              - {s: "dijo el cura", r: "aside: said the priest"}
              - s: "que en este caso no hablará más que un mudo"
                r: "what I guarantee: that in this matter he will say no more than a mute"
                under:
                  - {s: "so pena de pagar lo juzgado y sentenciado", r: "on what terms: under pain of paying whatever penalty is judged"}
        forms:
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), he: 'even if he were not'. Irregular: fuera, fueras, fuera, fuéramos, fuerais, fueran. 'lo' stands for 'hombre de bien'."}
          - {w: "abono", f: "abon- + -o → abonar (to vouch for), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "salgo", f: "salg- + -o → salir (to go out), present, I; 'salir por' = to answer for. Irregular: salgo, sales, sale, salimos, salís, salen."}
          - {w: "hablará", f: "hablar- + -á → hablar (to speak), future, he. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "pagar", f: "pagar (to pay), infinitive after 'de'."}
          - {w: "lo juzgado y sentenciado", f: "juzgado and sentenciado, participles of juzgar (to judge) and sentenciar (to sentence), made into a noun by 'lo': 'what has been judged and sentenced'."}
        note: "The priest talks like a notary drawing up a bond: the guarantor promises to pay 'lo juzgado y sentenciado' if the man he vouches for defaults."
  - sentences:
      - es: "— Y a vuestra merced, ¿quién le fía, señor cura? —dijo don Quijote."
        literal: "— And [to] your grace, who you vouches-for, sir priest? — said Don Quijote."
        ormsby: "“And who will be security for you, señor curate?” said Don Quixote."
        vocab:
          - {w: "fiar", d: "to stand surety for, guarantee (also 'to trust')"}
          - {w: "vuestra merced", d: "your grace, the polite 'you'"}
        diagram:
          - s: "¿quién le fía"
            r: "main verb: who stands surety for you?"
            under:
              - {s: "Y a vuestra merced", r: "object, put first: and as for your grace"}
              - {s: "señor cura", r: "who is addressed"}
              - {s: "dijo don Quijote", r: "aside: said Don Quijote"}
        forms:
          - {w: "fía", f: "fí- + -a → fiar (to vouch for), present, he (who?). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an; here fío, fías, fía, fiamos, fiais, fían."}
          - {w: "a vuestra merced ... le", f: "the object is said twice, as a noun put first and as the pronoun 'le' (you) before the verb: normal Spanish when the object leads the sentence."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Mi profesión —respondió el cura—, que es de guardar secreto."
        literal: "— My profession — answered the priest —, which is of keeping secret."
        ormsby: "“My profession,” replied the curate, “which is to keep secrets.”"
        vocab:
          - {w: "profesión", d: "profession; for a priest, his calling and its duties"}
          - {w: "guardar secreto", d: "to keep a secret"}
        diagram:
          - s: "Mi profesión"
            r: "the answer, verb understood from the question ('fía'): my profession vouches for me"
            under:
              - {s: "respondió el cura", r: "aside: answered the priest"}
              - {s: "que es de guardar secreto", r: "describes 'profesión': whose duty is to keep secrets"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "es de", f: "es → ser (to be), present, it: soy, eres, es, somos, sois, son; ser de (to be of) + infinitive = to consist in, be a matter of."}
          - {w: "guardar", f: "guardar (to keep), infinitive after 'de'."}
        note: "The priest means the seal of confession, which forbids a priest ever to reveal what he hears there."
  - sentences:
      - es: "— ¡Cuerpo de tal! —dijo a esta sazón don Quijote—."
        literal: "— Body of such! —said at this season Don Quijote—."
        ormsby: "“Ods body!” said Don Quixote at this,"
        ormsby_note: "Cuerpo de tal, like the English, a less irreverent form of \"God's body!\""
        vocab:
          - {w: "¡Cuerpo de tal!", d: "an oath, literally 'body of so-and-so!': a polite stand-in for 'cuerpo de Dios' (God's body)"}
          - {w: "a esta sazón", d: "at this moment, just then; 'sazón' = season, the right time"}
        diagram:
          - s: "dijo"
            r: "main verb: said"
            under:
              - {s: "¡Cuerpo de tal!", r: "what he said: an oath"}
              - {s: "a esta sazón", r: "when: at this moment"}
              - {s: "don Quijote", r: "subject: who said it"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "esta", f: "est- + -a → este (this), feminine to match 'sazón'."}
        note: "Don Quijote has held out through the priest's assurance that he will keep the secret; now he can contain himself no longer and bursts out with his plan."
      - es: "¿Hay más, sino mandar Su Majestad por público pregón que se junten en la corte para un día señalado todos los caballeros andantes que vagan por España; que, aunque no viniesen sino media docena, tal podría venir entre ellos, que solo bastase a destruir toda la potestad del Turco?"
        literal: "Is-there more, but to-order His Majesty by public proclamation that themselves may-gather in the court for a day appointed all the knights errant who wander through Spain; for, although not there-might-come but half dozen, such-a-one could come among them, that alone would-suffice to destroy all the power of-the Turk?"
        ormsby: "“what more has his Majesty to do but to command, by public proclamation, all the knights-errant that are scattered over Spain to assemble on a fixed day in the capital, for even if no more than half a dozen come, there may be one among them who alone will suffice to destroy the entire might of the Turk."
        vocab:
          - {w: "¿Hay más, sino ...?", d: "'is there anything more to it than ...?', i.e. all he has to do is this"}
          - {w: "pregón", d: "public proclamation, cried aloud in the streets by the town crier ('pregonero')"}
          - {w: "la corte", d: "the royal court, and so the capital, wherever the king and his councils sat"}
          - {w: "señalado", d: "appointed, fixed (of a day)"}
          - {w: "vagar", d: "to wander, roam"}
          - {w: "no ... sino", d: "only, no more than: 'no viniesen sino media docena' = only half a dozen came"}
          - {w: "tal", d: "here a pronoun: such a one, someone"}
          - {w: "bastar a", d: "to be enough to, suffice to"}
          - {w: "potestad", d: "power, might (a formal, legal word)"}
          - {w: "el Turco", d: "the Turk: the Ottoman Sultan and his empire, the great enemy of Christian Spain"}
        diagram:
          - s: "¿Hay más"
            r: "main verb 1: is there anything more (to do)"
            under:
              - s: "sino mandar Su Majestad por público pregón"
                r: "except: than for His Majesty to order by public proclamation"
                under:
                  - s: "que se junten en la corte para un día señalado todos los caballeros andantes"
                    r: "what he orders: that all the knights errant gather at court on a fixed day"
                    under:
                      - {s: "que vagan por España", r: "describes 'caballeros': who roam about Spain"}
          - s: "tal podría venir entre ellos"
            r: "main verb 2 (after 'que', for): such a one might come among them"
            under:
              - {s: "aunque no viniesen sino media docena", r: "concession: even if only half a dozen came"}
              - {s: "que solo bastase a destruir toda la potestad del Turco", r: "result: that he alone would be enough to destroy all the Turk's power"}
        forms:
          - {w: "Hay", f: "the impersonal 'there is', from haber (to have). The ordinary present of haber (to have) is he, has, ha, hemos, habéis, han; 'there is / are' uses the special form 'hay'."}
          - {w: "mandar", f: "infinitive of mandar (to order) after 'sino', with its subject 'Su Majestad' placed after it: 'but for His Majesty to order'."}
          - {w: "se junten", f: "junt- + -en → juntarse (to gather), present subjunctive, they, with 'se' (themselves). Subjunctive because it is what is ordered ('mandar que'). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "señalado", f: "señal- + -ado → señalar (to mark, appoint), participle used as an adjective, masculine to match 'día'."}
          - {w: "vagan", f: "vag- + -an → vagar (to wander), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "viniesen", f: "vinie- + -sen → venir (to come), imperfect subjunctive (-se form), they, after 'aunque' for a mere supposition. Built on the preterite vinieron: viniese, vinieses, viniese, viniésemos, vinieseis, viniesen."}
          - {w: "podría", f: "podr- + -ía → poder (to be able), conditional, he (the 'tal'): 'might'. Irregular stem podr-: podría, podrías, podría, podríamos, podríais, podrían."}
          - {w: "solo", f: "adjective, 'alone, by himself', masculine to match 'tal'; not the adverb 'only'."}
          - {w: "bastase", f: "bast- + -ase → bastar (to suffice), imperfect subjunctive (-se form), he, because the knight is only imagined. The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "del", f: "de + el, 'of the', the contraction modern Spanish still makes."}
        note: "This is the 'arbitrio' the priest and barber have been dreading: Don Quijote's plan to defend Christendom is to call up the knights errant of Spain. Rumours of a great Turkish fleet were a recurring alarm on the Spanish and Italian coasts."
      - es: "Esténme vuestras mercedes atentos, y vayan conmigo."
        literal: "Be-to-me your worships attentive, and go with-me."
        ormsby: "Give me your attention and follow me."
        vocab:
          - {w: "vuestras mercedes", d: "'your worships', polite 'you' to several people; it takes the 'they' form of the verb"}
          - {w: "ir con", d: "here to follow (an argument), go along with"}
        diagram:
          - s: "Esténme ... atentos"
            r: "main verb 1: be attentive to me"
            under:
              - {s: "vuestras mercedes", r: "subject: your worships"}
          - {s: "y vayan conmigo", r: "main verb 2: and follow me"}
        forms:
          - {w: "Esténme", f: "est- + -én + me → estar (to be), present subjunctive, they (vuestras mercedes), used as a polite command, with 'me' (for me) stuck on the end. estar in the present subjunctive: esté, estés, esté, estemos, estéis, estén. A command that opens the sentence takes its pronoun on the end."}
          - {w: "atentos", f: "atent- + -os → atento (attentive), masculine plural to match 'vuestras mercedes', the men listening."}
          - {w: "vayan", f: "vay- + -an → ir (to go), present subjunctive, they (vuestras mercedes), as a polite command: 'go along'. Irregular: vaya, vayas, vaya, vayamos, vayáis, vayan."}
          - {w: "conmigo", f: "con (with) + mí (me) fused into one word: 'with me'."}
      - es: "¿Por ventura es cosa nueva deshacer un solo caballero andante un ejército de docientos mil hombres, como si todos juntos tuvieran una sola garganta, o fueran hechos de alfenique?"
        literal: "By chance is [it] thing new to-undo a single knight errant an army of two-hundred thousand men, as if all together they-had one only throat, or were made of sugar-paste?"
        ormsby: "Is it, pray, any new thing for a single knight-errant to demolish an army of two hundred thousand men, as if they all had but one throat or were made of sugar paste?"
        vocab:
          - {w: "por ventura", d: "by chance, perhaps; in a question 'is it, pray, ...?'"}
          - {w: "deshacer", d: "to destroy, rout (literally 'to undo')"}
          - {w: "docientos", d: "= doscientos, two hundred (old spelling)"}
          - {w: "garganta", d: "throat"}
          - {w: "alfenique", d: "sugar paste, a soft white sweet; proverbially something feeble or easily broken"}
        diagram:
          - s: "es cosa nueva"
            r: "main verb: is it a new thing"
            under:
              - {s: "¿Por ventura", r: "tone: pray, really"}
              - s: "deshacer un solo caballero andante un ejército de docientos mil hombres"
                r: "subject: for a single knight errant to destroy an army of 200,000 men"
                under:
                  - {s: "como si todos juntos tuvieran una sola garganta", r: "how: as if all together had a single throat"}
                  - {s: "o fueran hechos de alfenique", r: "how, 2: or were made of sugar paste"}
        forms:
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "deshacer", f: "infinitive of deshacer (to destroy) used as a noun, the subject of 'es', with its own subject 'un solo caballero andante' after it."}
          - {w: "solo, sola", f: "adjective 'single, only one': 'solo' masculine to match 'caballero', 'sola' feminine to match 'garganta'."}
          - {w: "tuvieran", f: "tuv- + -ieran → tener (to have), imperfect subjunctive (-ra form), they, after 'como si' (as if). Built on the preterite tuvieron: tuviera, tuvieras, tuviera, tuviéramos, tuvierais, tuvieran."}
          - {w: "fueran hechos", f: "fue- + -ran → ser (to be), imperfect subjunctive (-ra form), they: fuera, fueras, fuera, fuéramos, fuerais, fueran; + hechos, the irregular participle of hacer (to make), masculine plural to match 'todos': 'were made'."}
        note: "The 'single throat' may echo the emperor Caligula's wish, reported by Suetonius, that the Roman people had only one neck. The romances of chivalry are full of knights who cut down whole armies alone."
      - es: "Si no, díganme: ¿cuántas historias están llenas destas maravillas?"
        literal: "If not, tell-me: how-many histories are full of-these marvels?"
        ormsby: "Nay, tell me, how many histories are there filled with these marvels?"
        vocab:
          - {w: "si no", d: "otherwise, if you doubt it"}
          - {w: "historia", d: "here a book, a chronicle: the romances of chivalry call themselves 'histories'"}
          - {w: "desta, destas", d: "= de esta(s), of this, of these (old contraction)"}
        diagram:
          - s: "díganme"
            r: "main verb: tell me"
            under:
              - {s: "Si no", r: "condition: if not, if you doubt it"}
              - s: "cuántas historias están llenas"
                r: "what to tell: how many histories are full"
                under:
                  - {s: "destas maravillas", r: "of what: of these marvels"}
        forms:
          - {w: "díganme", f: "dig- + -an + me → decir (to say), present subjunctive, they (vuestras mercedes), as a polite command, with 'me' (to me) stuck on the end. Irregular: diga, digas, diga, digamos, digáis, digan. A command puts its pronoun on the end; the accent keeps the stress on 'dí-'."}
          - {w: "cuántas", f: "cuánt- + -as → cuánto (how many), feminine plural to match 'historias'."}
          - {w: "están llenas", f: "est- + -án → estar (to be), present, they: estoy, estás, está, estamos, estáis, están; + llenas, feminine plural to match 'historias': 'are full'."}
          - {w: "destas", f: "de + estas (these), feminine plural to match 'maravillas'; old contraction, modern 'de estas'."}
      - es: "¡Había, en hora mala para mí, que no quiero decir para otro, de vivir hoy el famoso don Belianís, o alguno de los del inumerable linaje de Amadís de Gaula; que si alguno déstos hoy viviera y con el Turco se afrontara, a fee que no le arrendara la ganancia!"
        literal: "Had, in hour bad for me, for not I-want to-say for another, to live today the famous Don Belianís, or some-one of those of-the innumerable lineage of Amadís de Gaula; for if some-one of-these today lived and with the Turk himself-confronted, by faith that not to-him I-would-rent the gain!"
        ormsby: "If only (in an evil hour for me: I don’t speak for anyone else) the famous Don Belianis were alive now, or any one of the innumerable progeny of Amadís of Gaul! If any these were alive today, and were to come face to face with the Turk, by my faith, I would not give much for the Turk’s chance."
        vocab:
          - {w: "¡había de ...!", d: "'if only ... !': 'haber de' in the imperfect in an exclamation voices a wish"}
          - {w: "en hora mala", d: "in an evil hour, worse luck; Don Quijote half-curses his own bad luck"}
          - {w: "don Belianís", d: "Belianís de Grecia, hero of a romance of chivalry by Jerónimo Fernández, famous for the wounds he gave and took; his book was in Don Quijote's library in Part I"}
          - {w: "inumerable", d: "= innumerable, countless (old spelling)"}
          - {w: "linaje", d: "lineage, line of descendants"}
          - {w: "Amadís de Gaula", d: "hero of the most famous Spanish romance of chivalry; his sons, grandsons and great-grandsons fill a long series of sequels"}
          - {w: "déstos", d: "= de estos, of these (old contraction)"}
          - {w: "afrontarse con", d: "to face, come face to face with"}
          - {w: "a fee", d: "= a fe, upon my faith, truly ('fee' is the old spelling of 'fe')"}
          - {w: "no le arrendara la ganancia", d: "literally 'I would not lease him the profit': I would not give much for his chances, I would not be in his shoes"}
        diagram:
          - s: "¡Había ... de vivir hoy"
            r: "main verb 1: if only ... were alive today (a wish)"
            under:
