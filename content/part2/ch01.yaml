            r: "main verb: I dare say"
            under:
              - {s: "De Reinaldos", r: "about whom: of Rinaldo"}
              - {s: "respondió don Quijote", r: "speech tag: Don Quijote answered"}
              - s: "que era ancho de rostro"
                r: "what I dare say: that he was broad-faced"
                under:
                  - {s: "de color bermejo", r: "describes him: of ruddy colouring"}
                  - {s: "los ojos bailadores y algo saltados", r: "describes him: with roving and somewhat bulging eyes"}
                  - {s: "puntoso y colérico en demasía", r: "describes him: excessively touchy and hot-tempered"}
                  - {s: "amigo de ladrones y de gente perdida", r: "describes him: a friend of thieves and ruffians"}
