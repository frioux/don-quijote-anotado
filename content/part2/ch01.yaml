  - sentences:
      - es: "— De Reinaldos —respondió don Quijote— me atrevo a decir que era ancho de rostro, de color bermejo, los ojos bailadores y algo saltados, puntoso y colérico en demasía, amigo de ladrones y de gente perdida."
        literal: "— Of Reinaldos —answered Don Quijote— myself I-dare to say that he-was broad of face, of colour ruddy, the eyes dancing and somewhat bulging, touchy and choleric in excess, friend of thieves and of people lost."
        ormsby: "“As for Reinaldos,” replied Don Quixote, “I venture to say that he was broad-faced, of ruddy complexion, with roguish and somewhat prominent eyes, excessively punctilious and touchy, and given to the society of thieves and scapegraces."
