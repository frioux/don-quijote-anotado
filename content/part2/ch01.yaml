  - sentences:
      - es: "— En verdad, señor don Quijote —dijo el barbero—, que no lo dije por tanto, y así me ayude Dios como fue buena mi intención, y que no debe vuestra merced sentirse."
        literal: "— In truth, sir Don Quijote —said the barber—, [I swear] that not it I-said for so-much, and so me may-help God as was good my intention, and that not ought your grace to-feel-offended."
        ormsby: "“Indeed, Señor Don Quixote,” said the barber, “I did not mean it in that way, and, so help me God, my intention was good, and your worship ought not to be vexed.”"
        vocab:
          - {w: "en verdad", d: "truly, honestly; the 'que' after it just introduces the protest ('I assure you that ...')"}
          - {w: "no lo dije por tanto", d: "I didn't say it for that reason, I didn't mean it that way"}
          - {w: "así me ayude Dios como ...", d: "so help me God as (it is true that) ...: an oath, 'as God is my help, my intention was good'"}
          - {w: "sentirse", d: "to take offence, feel hurt (not just 'to feel')"}
        diagram:
          - s: "que no lo dije por tanto"
            r: "main verb 1 (after 'En verdad'): truly, I didn't mean it that way"
            under:
              - {s: "señor don Quijote", r: "addressed to: Don Quijote"}
              - {s: "dijo el barbero", r: "speech tag: the barber said"}
          - s: "y así me ayude Dios"
            r: "oath: and so help me God"
            under:
              - {s: "como fue buena mi intención", r: "the thing sworn: as my intention was good"}
          - {s: "y que no debe vuestra merced sentirse", r: "main verb 2: and your grace should not take offence"}
        forms:
          - {w: "dije", f: "dij- + -e → decir (to say), preterite, I. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "ayude", f: "ayud- + -e → ayudar (to help), present subjunctive, he (God): 'may He help'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. A wish, as in 'así Dios me ayude'."}
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, it (my intention): fui, fuiste, fue, fuimos, fuisteis, fueron. The subject 'mi intención' comes after the verb."}
          - {w: "buena", f: "buen- + -a → bueno (good), feminine to match 'intención'."}
          - {w: "debe", f: "deb- + -e → deber (ought, should), present, you (vuestra merced takes the 'he/she' form). The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "sentirse", f: "sentir (to feel) + se: 'to take offence', infinitive after 'debe', with the pronoun hung on the end."}
        note: "The barber is backing away: Don Quijote has just shown that he understood the story of the Seville madman was aimed at him."
