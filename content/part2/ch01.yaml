          - {w: "referir", d: "to relate, recount, mention (a false friend: not 'to refer')"}
          - {w: "real y verdaderamente", d: "really and truly; when two -mente adverbs are joined, only the last keeps the ending"}
          - {w: "de carne y hueso", d: "of flesh and bone, i.e. real people (English says 'flesh and blood')"}
        diagram:
