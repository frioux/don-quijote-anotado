  - sentences:
      - es: "»Con esta buena fee, el buen capellán pidió al retor mandase dar los vestidos con que allí había entrado el licenciado; volvió a decir el retor que mirase lo que hacía, porque, sin duda alguna, el licenciado aún se estaba loco."
        literal: "»With this good faith, the good chaplain asked [of] the rector [that] he-should-order to-give the clothes with which there had entered the licentiate; turned to say the rector that he-should-look-at what he-was-doing, because, without doubt any, the licentiate still himself was mad."
        ormsby: "Yielding to this conviction, the worthy chaplain begged the governor to have the clothes in which the licentiate had entered the house given to him. The governor again bade him beware of what he was doing, as the licentiate was beyond a doubt still mad;"
        vocab:
          - {w: "buena fee", d: "= buena fe, good faith, honest belief ('fee' is the old spelling of 'fe')"}
          - {w: "retor", d: "= rector, the director of the hospital (old spelling)"}
          - {w: "vestidos", d: "clothes (not only dresses)"}
          - {w: "volver a decir", d: "to say again"}
          - {w: "mirar lo que hace", d: "to be careful what one is doing"}
          - {w: "sin duda alguna", d: "without any doubt at all ('alguna' after the noun = 'any at all')"}
        diagram:
          - s: "el buen capellán pidió al retor"
            r: "main verb 1: the good chaplain asked the rector"
            under:
              - {s: "Con esta buena fee", r: "how: in this honest belief"}
              - s: "mandase dar los vestidos"
                r: "what he asked: to have the clothes given"
                under:
                  - {s: "con que allí había entrado el licenciado", r: "describes 'vestidos': in which the licentiate had come in"}
          - s: "volvió a decir el retor"
            r: "main verb 2: the rector said again"
            under:
              - {s: "que mirase lo que hacía", r: "what he said: that he should mind what he was doing"}
              - {s: "porque, sin duda alguna, el licenciado aún se estaba loco", r: "why: because the licentiate was without doubt still mad"}
        forms:
          - {w: "buen", f: "bueno (good) clipped before a masculine singular noun ('capellán'), like un, algún, gran."}
          - {w: "pidió", f: "pid- + -ió → pedir (to ask), preterite, he. The stem e becomes i in the he and they forms: pedí, pediste, pidió, pedimos, pedisteis, pidieron."}
          - {w: "mandase", f: "mand- + -ase → mandar (to order), imperfect subjunctive (-se form), he, after 'pidió' with the 'que' left out. The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "había entrado", f: "hab- + -ía → haber (to have), imperfect, he: había, habías, había, habíamos, habíais, habían; + entrado, the participle of entrar (to enter): 'had come in'."}
          - {w: "volvió a decir", f: "volv- + -ió → volver (to return), preterite, he, + a + decir (to say): 'said again'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "mirase", f: "mir- + -ase → mirar (to look), imperfect subjunctive (-se form), he, after 'decir que' as a warning. Same -se subjunctive."}
          - {w: "hacía", f: "hac- + -ía → hacer (to do), imperfect, he. The imperfect of -er verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "se estaba", f: "est- + -aba → estar (to be), imperfect, he, with 'se' for 'still, unchanged'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
      - es: "No sirvieron de nada para con el capellán las prevenciones y advertimientos del retor para que dejase de llevarle;"
