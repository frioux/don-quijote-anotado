  - sentences:
      - es: "— «En la casa de los locos de Sevilla estaba un hombre a quien sus parientes habían puesto allí por falto de juicio."
        literal: "— «In the house of the madmen of Seville was a man whom his relatives had put there for lacking of judgment."
        ormsby: "“In the madhouse at Seville there was a man whom his relations had placed there as being out of his mind."
        vocab:
          - {w: "casa de los locos", d: "madhouse, asylum (literally 'house of the madmen')"}
          - {w: "pariente", d: "relative, relation (a false friend: not 'parent')"}
          - {w: "falto de juicio", d: "lacking his wits, out of his mind; 'juicio' = judgment, reason, sanity"}
        diagram:
          - s: "estaba un hombre"
            r: "main verb: there was a man"
            under:
              - {s: "En la casa de los locos de Sevilla", r: "where: in the Seville madhouse"}
              - s: "a quien sus parientes habían puesto allí"
                r: "describes 'hombre': whom his relatives had put there"
                under:
                  - {s: "por falto de juicio", r: "why: as being out of his mind"}
        forms:
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, he: 'there was'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "a quien", f: "'whom': 'a' is the personal a, needed because 'quien' (the man) is the object of 'habían puesto'."}
          - {w: "habían puesto", f: "hab- + -ían → haber (to have), imperfect, they: había, habías, había, habíamos, habíais, habían; + puesto, the irregular participle of poner (to put): the pluperfect 'had put'."}
          - {w: "falto", f: "adjective 'lacking', masculine to match 'hombre'."}
        note: "The barber's tale is a little 'novela' in the style of Cervantes' own Exemplary Novels, and it mirrors the situation in the room: a madman who talks so sensibly that a cleric believes him cured. Seville had a hospital for the insane, the Casa de los Inocentes, which may be the house meant."
      - es: "Era graduado en cánones por Osuna, pero, aunque lo fuera por Salamanca, según opinión de muchos, no dejara de ser loco."
        literal: "He-was graduate in canons by Osuna, but, although it he-were by Salamanca, according-to opinion of many, not he-would-leave-off of being mad."
        ormsby: "He was a graduate of Osuna in canon law; but even if he had been of Salamanca, it was the opinion of most people that he would have been mad all the same."
        vocab:
          - {w: "graduado", d: "graduate, holder of a university degree"}
          - {w: "cánones", d: "canon law, the law of the Church, a degree subject of its own"}
          - {w: "Osuna", d: "a small university town in Andalusia, near Seville; its degrees were a common target of jokes as easy to come by"}
          - {w: "Salamanca", d: "Spain's oldest and most prestigious university"}
          - {w: "según", d: "according to"}
          - {w: "no dejar de", d: "not to stop (being), still to be: 'no dejara de ser loco' = he would still have been mad"}
        diagram:
          - {s: "Era graduado en cánones por Osuna", r: "main verb 1: he was a graduate in canon law from Osuna"}
          - s: "pero ... no dejara de ser loco"
            r: "main verb 2: but he would still have been mad"
            under:
              - {s: "aunque lo fuera por Salamanca", r: "concession: even if he had been one from Salamanca"}
              - {s: "según opinión de muchos", r: "source: in many people's opinion"}
        forms:
          - {w: "Era", f: "ser (to be), imperfect, he. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "graduado", f: "gradu- + -ado → graduar (to graduate), participle used as a noun: 'a graduate'."}
          - {w: "lo fuera", f: "fue- + -ra → ser (to be), imperfect subjunctive (-ra form), he, after 'aunque' for an unreal case: fuera, fueras, fuera, fuéramos, fuerais, fueran. 'lo' stands for 'graduado': 'even if he were one'."}
          - {w: "dejara", f: "dej- + -ara → dejar (to leave off), -ra form used as a conditional, he: 'he would not have stopped'. The -ra imperfect subjunctive of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran; Cervantes often uses it where modern Spanish says 'dejaría' or 'habría dejado'."}
        note: "The joke cuts twice: a degree from little Osuna sounds like a mark of folly in itself, but the narrator adds that even a Salamanca degree would not have kept him sane."
      - es: "Este tal graduado, al cabo de algunos años de recogimiento, se dio a entender que estaba cuerdo y en su entero juicio, y con esta imaginación escribió al arzobispo, suplicándole encarecidamente y con muy concertadas razones le mandase sacar de aquella miseria en que vivía, pues por la misericordia de Dios había ya cobrado el juicio perdido;"
        literal: "This such graduate, at-the end of some years of confinement, to-himself gave to understand that he-was sane and in his entire judgment, and with this notion he-wrote to-the archbishop, begging-him earnestly and with very well-ordered reasons [that] him he-should-order to-take-out from that misery in which he-lived, since by the mercy of God he-had already recovered the judgment lost;"
        ormsby: "This graduate, after some years of confinement, took it into his head that he was sane and in his full senses, and under this impression wrote to the Archbishop, entreating him earnestly, and in very correct language, to have him released from the misery in which he was living; for by God’s mercy he had now recovered his lost reason,"
        vocab:
          - {w: "este tal", d: "this same, this fellow"}
          - {w: "al cabo de", d: "at the end of, after"}
          - {w: "recogimiento", d: "confinement, being shut away"}
