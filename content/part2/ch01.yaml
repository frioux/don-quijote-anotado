summary: |
  The Second Part opens about a month after Don Quijote was brought home enchanted in the ox-cart. The priest and the barber have kept away so as not to remind him of his adventures, but they have told the niece and the housekeeper to feed him things good for the heart and the brain. Hearing that he seems to be recovering, they visit him and find him sitting up in bed, dried up like a mummy, but courteous and sensible. The three of them spend the visit reforming the state like new Lycurguses and Solons, and on every subject Don Quijote talks so well that his two examiners think him cured.

  The priest decides to test him further and passes on news from court: the Turk is said to be coming with a great fleet, and the king has strengthened the coasts of Naples, Sicily and Malta. Don Quijote has a plan of his own, which he will not tell for fear someone else will take the credit. Once the barber swears secrecy 'to king or rook', it comes out: the king should summon all the knights errant wandering in Spain, since one of them alone could destroy the Turk's whole power. The niece cries that he wants to be a knight errant again, and he answers that a knight errant he will die.

  The barber then tells a story. A graduate in a Seville madhouse wrote to the archbishop so sensibly that a chaplain came to free him, though the governor warned he was still mad. As the graduate said goodbye to the other inmates, one who believed himself Jupiter threatened to punish Seville with three years without rain for setting him free. The graduate told the chaplain not to worry, because he himself was Neptune, god of the waters, and would rain whenever he liked. The chaplain left him where he was.

  Don Quijote sees the point and is offended: comparisons are odious, he is not Neptune, and he only wants to bring back the age of chivalry, whose knights he lists. When the priest doubts that such knights ever existed, Don Quijote describes Amadís as if he had seen him, reasons from Goliath and the bones found in Sicily that giants were real, guesses the size of Morgante, and gives portraits of Reinaldos and Roldán. Talk turns to the fickle Angélica and the poets who sang her, until the housekeeper and the niece are heard shouting in the courtyard and everyone runs to see.
context: |
  Ten years later. Part I came out in 1605 and Part II in 1615, but inside the story barely a month has passed since Don Quijote was carried home in the ox-cart at the end of Part I. The opening keeps the old machinery running: Cide Hamete Benengeli is still the Arab historian, this is his 'second part' and the knight's 'third sally', and the narrator calls Part I 'this history, as great as it is exact', as though both parts were one book.

  The cure. The priest and the barber treat Don Quijote as a patient. In the physiology of the time, which followed Galen, madness of his kind came from a hot, dry brain, so the women are told to give him 'comforting' food for the heart and brain. He is described as 'amojamado', dried like 'mojama', salted tuna, and as looking like 'carne momia', mummy flesh, which apothecaries sold as a medicine. The madman in the barber's story says the same thing in his own words: madness comes from empty stomachs and brains full of air.

  Arbitristas and the Turk. Don Quijote's plan is a parody of the 'arbitrio', the scheme for saving the crown's finances or defeating its enemies that 'arbitristas' (projectors) were forever sending to the king's councils; they were a stock comic type in the literature of the time, and the barber is right that most of their proposals were impossible or absurd. The Turkish threat was real: Ottoman fleets and Barbary corsairs raided the coasts of Spain and Italy, Malta had withstood a great siege in 1565, and the Spanish crown regularly reinforced Naples and Sicily. Cervantes, who fought at Lepanto and was a captive in Algiers, knew the danger at first hand.

  The madman of Seville. The barber's story is a mirror for Don Quijote: a man who argues so sensibly that he convinces everyone of his sanity until a single remark gives him away. Osuna was a small university whose degrees were the butt of jokes, while Salamanca was the most famous in Spain, hence 'even if he had graduated at Salamanca'. The two madmen take the names of Jupiter, king of the gods, who throws thunderbolts, and Neptune, god of the sea, so that the quarrel over rain is a quarrel between gods. Don Quijote sees the point at once, and his 'Master Basin' recalls the barber's basin that he took for Mambrino's helmet in Part I.

  The books. Don Quijote's catalogue mixes the heroes of the Spanish romances of chivalry (Amadís, Palmerín, Tirante, Belianís, Esplandián, Felixmarte, Cirongilio) with those of the Italian epics of Boiardo and Ariosto (Rodamonte, Sobrino, Reinaldos, Roldán, Ruggiero). As Ormsby notes, there is no 'Cosmography' by Turpin; it was Ariosto who traced the dukes of Ferrara back to Ruggiero. Morgante is the giant of Pulci's comic epic, and the giant bones of Sicily come, Ormsby says, from Antonio de Torquemada's Jardín de flores curiosas. Angélica is the princess of Cathay whom every knight in the Orlando poems pursues; she chose instead Medoro, a young Moorish page, which drove Orlando mad. Ariosto broke off her story with a couplet leaving it to a better poet, and, as Ormsby notes, Barahona de Soto and Lope de Vega both took it up. Don Quijote's method is the joke: he deduces the faces and heights of fictional men 'by sound philosophy', and reasons that Morgante cannot have been very tall because he slept under a roof.

  Law, religion and oaths. The barber's oath 'to king or rook' comes, Ormsby suggests, from chess, and means to anyone at all; the priest offers to stand surety for him 'on pain of paying what is judged and sentenced', the formula of a legal bond; and the priest's own guarantee is the secrecy of the confessional. The madman's 'andar estaciones' is the round of churches visited to gain indulgences, and Jupiter swears 'for ever and ever, amen' like a churchman.

  Reading Cervantes' Spanish. The archaisms of the chapter: desta, déstos, dél, della (contractions of de with este, él, ella), celebro (cerebro), esperiencia and esaminadores (experiencia, examinadores), recebir and desapercebido, agora (ahora), mesmo and asimesmo, fee (fe), retor (rector), efeto, vee (ve), trujo (trajo), docientos, decienden, faciones (facciones), destraída (distraída). Pronouns hang on the end of verbs that open a clause (Visitáronle, halláronle, Hízolo, Rióse, acabóse, contentóse, Véese). The -ra form stands for the conditional (aconsejárale, viviera, arrendara, pudiera, quisiera), the future subjunctive marks open futures (dijere, quisiere, pudiere, lloviere, antojare), and the madmen speak to each other with vos and the vosotros forms (Mirad, sosegad, estaos, andad). New compound words appear in the portraits: barbitaheño (red-bearded), barbiponiente (with a beard just sprouting), barbilucio (smooth-faced). Watch the false friends: discurso (course, reasoning), discreción and discreto (good sense, sensible), razón (words, remark), impertinente (irrelevant), puesto que (although), and gentilhombre (a man of good looks and bearing).
