        literal: "— God you may-hold by his hand, poor Don Quijote: for to-me it-seems that yourself you-hurl-down from the high summit of your madness to the deep abyss of your simpleness!"
        ormsby: "“God keep thee in his hand, poor Don Quixote, for it seems to me thou art precipitating thyself from the height of thy madness into the profound abyss of thy simplicity.”"
        vocab:
          - {w: "tener de su mano", d: "to hold by the hand, keep safe, protect"}
