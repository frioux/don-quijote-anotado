              - {s: "que no quiero decir para otro", r: "aside: for I will not say for anyone else"}
              - {s: "el famoso don Belianís", r: "subject: the famous Belianís"}
              - {s: "o alguno de los del inumerable linaje de Amadís de Gaula", r: "subject 2: or one of the countless line of Amadís"}
          - s: "no le arrendara la ganancia"
            r: "main verb 2 (after 'que', for): I would not envy him (the Turk) his chances"
            under:
              - {s: "si alguno déstos hoy viviera", r: "condition: if one of these were alive today"}
              - {s: "y con el Turco se afrontara", r: "condition 2: and came face to face with the Turk"}
              - {s: "a fee que", r: "how: upon my faith"}
        forms:
          - {w: "Había ... de vivir", f: "hab- + -ía → haber (to have), imperfect, he, + de + vivir (to live). 'haber de' + infinitive means 'to be to'; in an exclamation it voices a wish: 'if only ... were living!'. The imperfect of -er verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "quiero", f: "quier- + -o → querer (to want), present, I. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "alguno", f: "'some one, any one', in its full form because it stands alone; before a masculine noun it is clipped to 'algún'."}
          - {w: "déstos", f: "de + éstos (these), old contraction; modern 'de estos'."}
          - {w: "viviera", f: "viv- + -iera → vivir (to live), imperfect subjunctive (-ra form), he, after 'si' for an unreal condition. The -ra imperfect subjunctive of -er and -ir verbs: -iera, -ieras, -iera, -iéramos, -ierais, -ieran."}
          - {w: "se afrontara", f: "afront- + -ara → afrontarse (to face), imperfect subjunctive (-ra form), he, with 'se' before the verb. The -ra imperfect subjunctive of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran."}
          - {w: "arrendara", f: "arrend- + -ara → arrendar (to rent, lease), -ra form used as a conditional, I: 'I would not lease'. The -ra imperfect subjunctive of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran; Cervantes often uses it where modern Spanish says 'arrendaría'."}
          - {w: "le", f: "'to him', meaning the Turk."}
      - es: "Pero Dios mirará por su pueblo, y deparará alguno que, si no tan bravo como los pasados andantes caballeros, a lo menos no les será inferior en el ánimo; y Dios me entiende, y no digo más."
        literal: "But God will-look for his people, and will-provide someone who, if not so brave as the past errant knights, at the least not to-them will-be inferior in the spirit; and God me understands, and not I-say more."
        ormsby: "But God will have regard for his people, and will provide someone, who, if not so valiant as the knights-errant of yore, at least will not be inferior to them in spirit; but God knows what I mean, and I say no more.”"
        vocab:
          - {w: "mirar por", d: "to look after, take care of"}
          - {w: "deparar", d: "to provide, send (said of God or fortune)"}
          - {w: "bravo", d: "brave, fierce (not the cheer 'bravo!')"}
          - {w: "a lo menos", d: "at least"}
          - {w: "ánimo", d: "spirit, courage"}
          - {w: "Dios me entiende", d: "'God understands me': a knowing hint, here that he means himself"}
        diagram:
          - {s: "Dios mirará por su pueblo", r: "main verb 1: God will look after his people"}
          - s: "y deparará alguno"
            r: "main verb 2: and will provide someone"
            under:
              - s: "que, si no tan bravo como los pasados andantes caballeros, a lo menos no les será inferior en el ánimo"
                r: "describes 'alguno': who at least will not fall short of them in spirit"
                under:
                  - {s: "si no tan bravo como los pasados andantes caballeros", r: "concession: if not as brave as the knights errant of old"}
          - {s: "y Dios me entiende", r: "main verb 3: and God understands me"}
          - {s: "y no digo más", r: "main verb 4: and I say no more"}
        forms:
          - {w: "mirará", f: "mirar- + -á → mirar (to look), future, he (God). The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "deparará", f: "deparar- + -á → deparar (to provide), future, he. Same future endings: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "pasados", f: "pas- + -ados → pasar (to pass), participle used as an adjective, masculine plural to match 'caballeros': 'of the past'."}
          - {w: "les", f: "'to them', the knights of old: 'inferior to them'."}
          - {w: "será", f: "ser- + -á → ser (to be), future, he. ser in the future: seré, serás, será, seremos, seréis, serán."}
          - {w: "entiende", f: "entiend- + -e → entender (to understand), present, he. The stem e becomes ie when stressed: entiendo, entiendes, entiende, entendemos, entendéis, entienden."}
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
        note: "The 'someone' God will provide is plainly Don Quijote himself; 'God understands me' is his coy way of announcing, in front of the priest, that he means to ride out again."
  - sentences:
