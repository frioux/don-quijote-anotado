          - s: "que me parece"
            r: "main verb 2: for it seems to me"
            under:
              - {s: "que te despeñas de la alta cumbre de tu locura hasta el profundo abismo de tu simplicidad", r: "what seems: that you are throwing yourself from the peak of your madness into the abyss of your foolishness"}
