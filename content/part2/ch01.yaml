          - {w: "maten", f: "mat- + -en → matar (to kill), present subjunctive, they (anyone), after 'que' in a wish or curse. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "quiere", f: "quier- + -e → querer (to want), present, he. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
