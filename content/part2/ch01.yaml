      - es: "Finalmente, él habló de manera que hizo sospechoso al retor, codiciosos y desalmados a sus parientes, y a él tan discreto que el capellán se determinó a llevársele consigo a que el arzobispo le viese y tocase con la mano la verdad de aquel negocio."
