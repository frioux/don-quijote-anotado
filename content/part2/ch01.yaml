        ormsby: "“Well then, with that permission,” said the curate, “I say my doubt is that, all I can do, I cannot persuade myself that the whole pack of knights-errant you, Señor Don Quixote, have mentioned, were really and truly persons of flesh and blood, that ever lived in the world;"
