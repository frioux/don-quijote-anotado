  - sentences:
      - es: "— Suplico a vuestras mercedes que se me dé licencia para contar un cuento breve que sucedió en Sevilla, que, por venir aquí como de molde, me da gana de contarle."
        literal: "— I-beg [of] your worships that itself to-me be-given leave to tell a story short which happened in Seville, which, through coming here as from mould, to-me gives desire of telling-it."
        ormsby: "“I ask your worships to give me leave to tell a short story of something that happened in Seville, which comes so pat to the purpose just now that I should like greatly to tell it.”"
        vocab:
          - {w: "suplicar", d: "to beg, entreat"}
          - {w: "licencia", d: "leave, permission (not 'licence' in the modern sense)"}
          - {w: "cuento", d: "story, tale"}
          - {w: "venir como de molde", d: "to fit perfectly, come pat ('molde' = mould, as if cast for the purpose)"}
          - {w: "dar gana de", d: "to make one want to: 'me da gana de contarle' = I feel like telling it"}
        diagram:
          - s: "Suplico a vuestras mercedes"
            r: "main verb: I beg your worships"
            under:
              - s: "que se me dé licencia"
                r: "what I beg: that I be given leave"
                under:
                  - s: "para contar un cuento breve"
                    r: "for what: to tell a short story"
                    under:
                      - {s: "que sucedió en Sevilla", r: "describes 'cuento': which happened in Seville"}
                      - s: "me da gana de contarle"
                        r: "describes 'cuento', 2 (after 'que'): which I feel like telling"
                        under:
                          - {s: "por venir aquí como de molde", r: "why: because it fits here so neatly"}
        forms:
          - {w: "Suplico", f: "suplic- + -o → suplicar (to beg), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "se me dé", f: "d- + -é → dar (to give), present subjunctive, it (licencia), with 'se' making it passive ('be given') and 'me' (to me). dar in the present subjunctive: dé, des, dé, demos, deis, den. Subjunctive because it is what is begged for ('suplico que')."}
          - {w: "sucedió", f: "suced- + -ió → suceder (to happen), preterite, it. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "venir", f: "infinitive of venir (to come) after 'por' (because of): 'because it comes'."}
          - {w: "da", f: "d- + -a → dar (to give), present, it. dar in the present: doy, das, da, damos, dais, dan."}
          - {w: "contarle", f: "contar (to tell) + le (it, the story), the pronoun hung on the infinitive after 'de'. 'le' for a thing is leísmo: Cervantes often uses 'le' where modern Spanish uses 'lo' for a masculine object, here 'cuento'."}
