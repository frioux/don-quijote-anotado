  - sentences:
      - es: "— Sí reniego —respondió Sancho—, y dese modo y por esa misma razón podía echar vuestra merced a mí y hijos y a mi mujer toda una putería encima, porque todo cuanto hacen y dicen son estremos dignos de semejantes alabanzas, y para volverlos a ver ruego yo a Dios me saque de pecado mortal, que lo mesmo será si me saca deste peligroso oficio de escudero, en el cual he incurrido segunda vez, cebado y engañado de una bolsa con cien ducados que me hallé un día en el corazón de Sierra Morena, y el diablo me pone ante los ojos aquí, allí, acá no, sino acullá, un talego lleno de doblones, que me parece que a cada paso le toco con la mano, y me abrazo con él, y lo llevo a mi casa, y echo censos, y fundo rentas, y vivo como un príncipe;"
        literal: "— Yes I-disown [them] —answered Sancho—, and in-that way and for that same reason could throw your grace on me and children and on my wife a-whole whoredom on-top, because all as-much-as they-do and say are extremes worthy of such praises, and to them-return to see I-pray I to God [that] me he-may-take-out of sin mortal, for the same it-will-be if me he-takes-out of-this dangerous office of squire, in the which I-have fallen a-second time, baited and deceived by a purse with a-hundred ducats that to-me I-found one day in the heart of Sierra Morena, and the devil to-me puts before the eyes here, there, here no, but over-there, a bag full of doubloons, that to-me it-seems that at each step it I-touch with the hand, and myself I-embrace with it, and it I-carry to my house, and I-put-out mortgages, and I-found rents, and I-live like a prince;"
        ormsby: "“I do disown them,” replied Sancho, “and in this way, and by the same reasoning, you might call me and my children and my wife all the strumpets in the world, for all they do and say is of a kind that in the highest degree deserves the same praise; and to see them again I pray God to deliver me from mortal sin, or, what comes to the same thing, to deliver me from this perilous calling of squire into which I have fallen a second time, decayed and beguiled by a purse with a hundred ducats that I found one day in the heart of the Sierra Morena; and the devil is always putting a bag full of doubloons before my eyes, here, there, everywhere, until I fancy at every stop I am putting my hand on it, and hugging it, and carrying it home with me, and making investments, and getting interest, and living like a prince;"
        vocab:
          - {w: "renegar de", d: "to disown, renounce"}
          - {w: "dese", d: "= de ese, of that, in that (old contraction)"}
          - {w: "echar encima", d: "to throw on someone, heap on"}
          - {w: "putería", d: "whoredom; here a heap of such 'praises' (a word Sancho coins from the squire's oath)"}
          - {w: "estremos", d: "= extremos, extremes, marvels, things beyond the ordinary (old spelling)"}
          - {w: "volver a ver", d: "to see again"}
          - {w: "pecado mortal", d: "mortal sin, which damns the soul unless confessed"}
          - {w: "mesmo", d: "= mismo; 'lo mesmo será' = it will come to the same thing"}
          - {w: "deste", d: "= de este, of this (old contraction)"}
          - {w: "oficio", d: "trade, calling, job (not 'office')"}
          - {w: "incurrir en", d: "to fall into (a fault or a state)"}
          - {w: "cebado", d: "baited, lured, tempted, like an animal with bait"}
          - {w: "ducado", d: "ducat, a gold coin worth eleven reales"}
          - {w: "Sierra Morena", d: "the mountain range between La Mancha and Andalusia, where Sancho found the purse of gold in Part I chapter 23"}
          - {w: "acá no, sino acullá", d: "not here but over there: everywhere he looks ('acullá' = yonder)"}
          - {w: "talego", d: "sack, bag (of money)"}
          - {w: "doblón", d: "doubloon, a gold coin worth two escudos"}
          - {w: "a cada paso", d: "at every step, all the time"}
          - {w: "echar censos", d: "to lend money on mortgage at interest; a 'censo' was an annual payment secured on land"}
          - {w: "fundar rentas", d: "to set up a fixed income, invest in annuities"}
        diagram:
