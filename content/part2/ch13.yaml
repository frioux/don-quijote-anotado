part: 2
chapter: 13
title_es: "Capítulo XIII. Donde se prosigue la aventura del Caballero del Bosque, con el discreto, nuevo y suave coloquio que pasó entre los dos escuderos"
title_en: "In which is continued the adventure of the Knight of the Grove, together with the sensible, original, and tranquil colloquy that passed between the two squires"
paragraphs:
  - sentences:
      - es: "Divididos estaban caballeros y escuderos: éstos contándose sus vidas, y aquéllos sus amores; pero la historia cuenta primero el razonamiento de los mozos y luego prosigue el de los amos; y así, dice que, apartándose un poco dellos, el del Bosque dijo a Sancho:"
        literal: "Divided were knights and squires: these telling-each-other their lives, and those their loves; but the history tells first the talk of the lads and then continues that of the masters; and so, it-says that, drawing-himself-away a little from-them, the [one] of-the Grove said to Sancho:"
        ormsby: "The knights and the squires made two parties, these telling the story of their lives, the others the story of their loves; but the history relates first of all the conversation of the servants, and afterwards takes up that of the masters; and it says that, withdrawing a little from the others, he of the Grove said to Sancho,"
        vocab:
          - {w: "éstos ... aquéllos", d: "these ... those: 'éste' points to the nearer, last-named noun (the squires), 'aquél' to the farther one (the knights)"}
          - {w: "contarse", d: "to tell each other"}
          - {w: "razonamiento", d: "talk, conversation (not 'reasoning' here)"}
          - {w: "mozo", d: "lad; also servant, here the squires"}
          - {w: "proseguir", d: "to go on with, continue"}
          - {w: "amo", d: "master (of a servant)"}
          - {w: "apartarse", d: "to move away, step aside"}
          - {w: "dellos", d: "= de ellos, from them (old contraction)"}
          - {w: "el del Bosque", d: "'the one of the Grove': in this chapter the squire of the Knight of the Grove"}
        diagram:
          - s: "Divididos estaban caballeros y escuderos:"
            r: "main clause 1: knights and squires were split into two pairs"
            under:
              - {s: "éstos contándose sus vidas", r: "how: these (the squires) telling each other their lives"}
              - {s: "y aquéllos sus amores", r: "how, 2: and those (the knights) their loves"}
          - s: "pero la historia cuenta primero el razonamiento de los mozos"
            r: "main clause 2: but the history first tells the servants' talk"
            under:
              - {s: "y luego prosigue el de los amos", r: "then: and afterwards goes on with that of the masters"}
          - s: "y así, dice"
            r: "main clause 3: and so it (the history) says"
            under:
              - s: "el del Bosque dijo a Sancho:"
                r: "what it says (after 'que'): the one of the Grove said to Sancho"
                under:
                  - {s: "apartándose un poco dellos", r: "when: drawing a little away from them (the knights)"}
        forms:
          - {w: "Divididos estaban", f: "divididos, participle of dividir (to divide), masculine plural to match 'caballeros y escuderos', put first for emphasis; est- + -aban → estar (to be), imperfect, they: 'were divided'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "contándose", f: "gerund of contar (to tell) + se (to each other), accent added to keep the stress on cont-."}
          - {w: "éstos, aquéllos", f: "est- + -os → éste (this one) and aquell- + -os → aquél (that one), masculine plural; written with an accent because they stand alone as pronouns."}
          - {w: "cuenta", f: "cuent- + -a → contar (to tell), present, it (the history). The stem o becomes ue when stressed: cuento, cuentas, cuenta, contamos, contáis, cuentan."}
          - {w: "prosigue", f: "prosig- + -ue → proseguir (to continue), present, it. The stem e becomes i, and gu is written g before o: prosigo, prosigues, prosigue, proseguimos, proseguís, prosiguen."}
          - {w: "el de los amos", f: "'el' stands for 'el razonamiento': 'that of the masters'. Spanish drops the repeated noun and keeps the article."}
          - {w: "dice", f: "dic- + -e → decir (to say), present, it. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "apartándose", f: "gerund of apartar (to move away) + se (himself), accent added to keep the stress on -tán-."}
          - {w: "dellos", f: "de + ellos (them), run together; modern 'de ellos'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
        note: "The chapter picks up exactly where chapter 12 left off: the Knight of the Grove's squire has led Sancho aside so the two servants can talk while their masters discuss their ladies. 'Éstos' and 'aquéllos' follow the rule of nearer and farther: the squires tell their lives, the knights their loves."
  - sentences:
      - es: "— Trabajosa vida es la que pasamos y vivimos, señor mío, estos que somos escuderos de caballeros andantes: en verdad que comemos el pan en el sudor de nuestros rostros, que es una de las maldiciones que echó Dios a nuestros primeros padres."
        literal: "— Toilsome life is the [one] that we-pass and we-live, sir mine, these who we-are squires of knights errant: in truth that we-eat the bread in the sweat of our faces, which is one of the curses that cast God on our first parents."
        ormsby: "“A hard life it is we lead and live, señor, we that are squires to knights-errant; verily, we eat our bread in the sweat of our faces, which is one of the curses God laid on our first parents.”"
        vocab:
          - {w: "trabajoso", d: "hard, toilsome, full of hardship"}
          - {w: "pasar la vida", d: "to spend, go through life; 'pasamos y vivimos' = we lead and live"}
          - {w: "señor mío", d: "my good sir (polite address between equals)"}
          - {w: "caballero andante", d: "knight errant, a knight who wanders in search of adventures"}
          - {w: "en verdad que", d: "truly, verily; the 'que' only adds emphasis"}
          - {w: "rostro", d: "face"}
          - {w: "echar una maldición", d: "to lay, cast a curse"}
          - {w: "nuestros primeros padres", d: "our first parents, Adam and Eve"}
        diagram:
          - s: "Trabajosa vida es"
            r: "main verb 1: it is a hard life"
            under:
              - s: "la que pasamos y vivimos"
                r: "subject: the one we lead and live"
                under:
                  - {s: "estos que somos escuderos de caballeros andantes", r: "who: we who are squires of knights errant"}
              - {s: "señor mío", r: "addressed to Sancho: my good sir"}
          - s: "en verdad que comemos el pan"
            r: "main verb 2: truly, we eat our bread"
            under:
              - s: "en el sudor de nuestros rostros"
                r: "how: in the sweat of our faces"
                under:
                  - {s: "que es una de las maldiciones", r: "describes the whole phrase: which is one of the curses"}
                  - {s: "que echó Dios a nuestros primeros padres", r: "describes 'maldiciones': that God laid on Adam and Eve"}
        forms:
          - {w: "Trabajosa", f: "trabajos- + -a → trabajoso (toilsome), feminine to match 'vida'; the adjective is put first for emphasis."}
          - {w: "la que", f: "'the one that', feminine to stand for 'vida'."}
          - {w: "pasamos, vivimos", f: "pas- + -amos → pasar (to spend), present, we: the present of -ar verbs: -o, -as, -a, -amos, -áis, -an. viv- + -imos → vivir (to live), present, we: the present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "estos que somos", f: "'these who are', i.e. 'we who are': the verb som- + -os → ser (to be), present, we, agrees with the speaker's group. ser in the present: soy, eres, es, somos, sois, son."}
          - {w: "comemos", f: "com- + -emos → comer (to eat), present, we. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "nuestros", f: "nuestr- + -os → nuestro (our), masculine plural to match 'rostros' and 'padres', not the owners."}
          - {w: "echó", f: "ech- + -ó → echar (to cast), preterite, he (God, the subject placed after the verb). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
        note: "The squire quotes Genesis 3:19, God's sentence on Adam after the Fall: 'In the sweat of thy face shalt thou eat bread'. A squire's grumbling dressed up in Scripture is part of the comedy of the 'discreet' talk the title promises."
  - sentences:
      - es: "— También se puede decir —añadió Sancho— que lo comemos en el yelo de nuestros cuerpos; porque, ¿quién más calor y más frío que los miserables escuderos de la andante caballería?"
        literal: "— Also itself can say —added Sancho— that it we-eat in the ice of our bodies; because, who [gets] more heat and more cold than the wretched squires of the errant chivalry?"
        ormsby: "“It may be said, too,” added Sancho, “that we eat it in the chill of our bodies; for who gets more heat and cold than the miserable squires of knight-errantry?"
        vocab:
          - {w: "yelo", d: "= hielo, ice, frost; here the chill (old spelling)"}
          - {w: "miserable", d: "wretched, poor, unlucky"}
          - {w: "andante caballería", d: "knight-errantry, chivalry of the wandering knights"}
        diagram:
          - s: "También se puede decir"
            r: "main verb 1: one can also say"
            under:
              - {s: "añadió Sancho", r: "speaker: added Sancho"}
              - {s: "que lo comemos en el yelo de nuestros cuerpos", r: "what one can say: that we eat it (the bread) in the chill of our bodies"}
          - s: "porque, ¿quién más calor y más frío"
            r: "main clause 2, a question with no verb: because who [suffers] more heat and more cold"
            under:
              - {s: "que los miserables escuderos de la andante caballería?", r: "compared with: than the wretched squires of knight-errantry"}
        forms:
          - {w: "se puede decir", f: "pued- + -e → poder (to be able), present, it, + decir (to say); 'se' makes it impersonal: 'one can say'. poder in the present: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "añadió", f: "añad- + -ió → añadir (to add), preterite, he. The preterite of -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "lo comemos", f: "com- + -emos → comer (to eat), present, we: the present of -er verbs: -o, -es, -e, -emos, -éis, -en. 'lo' (it) stands for 'el pan' of the other squire's sentence."}
          - {w: "yelo", f: "old spelling of hielo (ice)."}
          - {w: "andante", f: "present participle of andar (to walk, wander), used as an adjective: 'wandering, errant'; it does not change for 'caballería'."}
        note: "Sancho caps the Bible quotation with his own version: squires eat out in the open in every weather, so their bread comes with frost as well as sweat. The question leaves its verb out, as speech often does: 'who [suffers] more heat and cold?'"
      - es: "Y aun menos mal si comiéramos, pues los duelos, con pan son menos; pero tal vez hay que se nos pasa un día y dos sin desayunarnos, si no es del viento que sopla."
        literal: "And even less bad if we-ate, since the sorrows, with bread are less; but at-times there-is [occasion] that itself to-us passes a day and two without breaking-fast-ourselves, if not it-is on-the wind that blows."
        ormsby: "Even so it would not be so bad if we had something to eat, for woes are lighter if there’s bread; but sometimes we go a day or two without breaking our fast, except with the wind that blows.”"
        ormsby_note: "Proverb 173."
        vocab:
          - {w: "aun", d: "even, still"}
          - {w: "menos mal", d: "less bad, not so bad"}
          - {w: "duelo", d: "grief, sorrow (not a duel here)"}
          - {w: "los duelos, con pan son menos", d: "proverb: sorrows are lighter with bread, troubles are easier on a full stomach"}
          - {w: "tal vez", d: "here 'sometimes, now and then' (older sense), not 'perhaps'"}
          - {w: "hay que", d: "here 'it happens that', not 'one must'"}
          - {w: "desayunarse", d: "to break one's fast, eat the first bite of the day; 'desayunarse de' = to break one's fast with"}
          - {w: "si no es", d: "except, unless it be"}
        diagram:
          - s: "Y aun menos mal"
            r: "main clause 1, no verb: and still [it would be] less bad"
            under:
              - {s: "si comiéramos", r: "condition: if we ate"}
              - {s: "pues los duelos, con pan son menos", r: "why: since sorrows are lighter with bread"}
          - s: "pero tal vez hay"
            r: "main clause 2: but sometimes it happens"
            under:
              - s: "que se nos pasa un día y dos"
                r: "what happens: that a day, or two, goes by on us"
                under:
                  - {s: "sin desayunarnos", r: "how: without our breaking our fast"}
                  - {s: "si no es del viento que sopla", r: "except: unless with the wind that blows"}
        forms:
          - {w: "comiéramos", f: "com- + -iéramos → comer (to eat), imperfect subjunctive (-ra form), we: 'if we ate'. The -ra imperfect subjunctive of -er and -ir verbs: -iera, -ieras, -iera, -iéramos, -ierais, -ieran. 'si' + imperfect subjunctive = an unreal condition."}
          - {w: "son", f: "ser (to be), present, they (the sorrows): soy, eres, es, somos, sois, son."}
          - {w: "hay", f: "the impersonal form of haber (to have): 'there is'; here 'it happens'."}
          - {w: "se nos pasa", f: "pas- + -a → pasar (to pass), present, it (a day), with 'se' (itself) and 'nos' (on us): 'goes by on us'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "desayunarnos", f: "desayunar (to break one's fast) + nos (ourselves), the pronoun hung on the infinitive after 'sin' (without)."}
          - {w: "del", f: "de + el, contracted: 'on the' (wind)."}
          - {w: "sopla", f: "sopl- + -a → soplar (to blow), present, it (the wind). Same -ar present: -o, -as, -a, -amos, -áis, -an."}
        note: "Ormsby's 'Proverb 173' refers to his own numbered list of the proverbs in the book. 'Los duelos con pan son menos' means that any trouble is easier to bear when there is food; Sancho's complaint is that squires often lack even that comfort."
  - sentences:
      - es: "— Todo eso se puede llevar y conllevar —dijo el del Bosque—, con la esperanza que tenemos del premio;"
        literal: "— All that itself can bear and put-up-with —said the [one] of-the Grove—, with the hope that we-have of-the reward;"
        ormsby: "“All that,” said he of the Grove, “may be endured and put up with when we have hopes of reward;"
        vocab:
          - {w: "llevar y conllevar", d: "to bear and put up with; 'conllevar' = to endure patiently"}
          - {w: "premio", d: "reward, prize"}
        diagram:
          - s: "Todo eso se puede llevar y conllevar"
            r: "main verb: all that can be borne and put up with"
            under:
              - {s: "dijo el del Bosque", r: "speaker: said the one of the Grove (the other squire)"}
              - {s: "con la esperanza que tenemos del premio;", r: "how: with the hope we have of the reward"}
        forms:
          - {w: "se puede llevar y conllevar", f: "pued- + -e → poder (to be able), present, it, + two infinitives, llevar (to bear) and conllevar (to put up with); 'se' makes it passive: 'can be borne'. poder in the present: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "tenemos", f: "ten- + -emos → tener (to have), present, we. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "del", f: "de + el, contracted: 'of the'."}
      - es: "porque si demasiadamente no es desgraciado el caballero andante a quien un escudero sirve, por lo menos, a pocos lances se verá premiado con un hermoso gobierno de cualque ínsula, o con un condado de buen parecer."
        literal: "because if excessively not is unlucky the knight errant whom a squire serves, at the least, at few turns himself he-will-see rewarded with a handsome governorship of some isle, or with a county of good appearance."
        ormsby: "for, unless the knight-errant he serves is excessively unlucky, after a few turns the squire will at least find himself rewarded with a fine government of some island or some fair county.”"
        vocab:
          - {w: "demasiadamente", d: "excessively, too (old form of 'demasiado' as an adverb)"}
          - {w: "desgraciado", d: "unlucky, unfortunate (not 'disgraced')"}
          - {w: "por lo menos", d: "at least"}
          - {w: "a pocos lances", d: "after a few turns, before long; 'lance' = turn of events, encounter"}
          - {w: "verse premiado", d: "to find oneself rewarded"}
          - {w: "gobierno", d: "governorship, the post of governor"}
          - {w: "cualque", d: "= alguna, some, any (old form of 'cualquier')"}
          - {w: "ínsula", d: "isle: the bookish word of the romances of chivalry, where knights give their squires islands to govern"}
          - {w: "condado", d: "county, earldom"}
          - {w: "de buen parecer", d: "good-looking, handsome, fair"}
        diagram:
          - s: "se verá premiado"
            r: "main verb (after 'porque'): he (the squire) will find himself rewarded"
            under:
              - s: "si demasiadamente no es desgraciado el caballero andante"
                r: "condition: unless the knight errant is too unlucky"
                under:
                  - {s: "a quien un escudero sirve", r: "describes 'caballero': whom a squire serves"}
              - {s: "por lo menos", r: "how much: at least"}
              - {s: "a pocos lances", r: "when: after a few turns of fortune"}
              - {s: "con un hermoso gobierno de cualque ínsula", r: "with what, 1: with a fine governorship of some isle"}
              - {s: "o con un condado de buen parecer", r: "with what, 2: or with a handsome county"}
        forms:
          - {w: "demasiadamente", f: "demasiad- + -a + -mente → demasiado (too much) made into an adverb with -mente on the feminine form."}
          - {w: "es", f: "ser (to be), present, he (the knight): soy, eres, es, somos, sois, son. The subject 'el caballero andante' comes after the verb."}
          - {w: "a quien", f: "'whom': 'a' marks a person as object, 'quien' refers to the knight."}
          - {w: "sirve", f: "sirv- + -e → servir (to serve), present, he (a squire). The stem e becomes i when stressed: sirvo, sirves, sirve, servimos, servís, sirven."}
          - {w: "se verá", f: "ver- + -á → ver (to see), future, he, with 'se' (himself): 'he will see himself', i.e. find himself. The future adds endings to the whole infinitive: veré, verás, verá, veremos, veréis, verán."}
          - {w: "premiado", f: "premi- + -ado → premiar (to reward), participle, masculine to match the squire."}
          - {w: "cualque", f: "old form of cualquier / alguna (some), here before the feminine 'ínsula'."}
          - {w: "buen", f: "bueno (good) clipped before a masculine singular noun ('parecer'), like un, algún, gran."}
  - sentences:
      - es: "Yo —replicó Sancho— ya he dicho a mi amo que me contento con el gobierno de alguna ínsula; y él es tan noble y tan liberal, que me le ha prometido muchas y diversas veces."
        literal: "I —replied Sancho— already have said to my master that myself I-content with the governorship of some isle; and he is so noble and so generous, that to-me it he-has promised many and diverse times."
        ormsby: "“I,” said Sancho, “have already told my master that I shall be content with the government of some island, and he is so noble and generous that he has promised it to me ever so many times.”"
        vocab:
          - {w: "replicar", d: "to reply, answer back"}
          - {w: "contentarse con", d: "to be satisfied with, settle for"}
          - {w: "ínsula", d: "isle: the bookish word of the romances of chivalry for the island a knight gives his squire to govern"}
          - {w: "liberal", d: "generous, open-handed (false friend: not political)"}
          - {w: "muchas y diversas veces", d: "many different times, over and over"}
        diagram:
          - s: "ya he dicho a mi amo"
            r: "main verb 1: I have already told my master"
            under:
              - {s: "Yo", r: "subject: I (put first, answering the other squire)"}
              - {s: "replicó Sancho", r: "speaker: replied Sancho"}
              - {s: "que me contento con el gobierno de alguna ínsula", r: "what I told him: that I'll settle for the governorship of some isle"}
          - s: "y él es tan noble y tan liberal"
            r: "main verb 2: and he is so noble and so generous"
            under:
              - {s: "que me le ha prometido muchas y diversas veces", r: "result: that he has promised it to me over and over"}
        forms:
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (repliqué, with c → qu before e)."}
          - {w: "he dicho", f: "he, from haber (to have), present, I: he, has, ha, hemos, habéis, han; + dicho, the irregular participle of decir (to say): the perfect, 'I have said'."}
          - {w: "me contento", f: "content- + -o → contentarse (to be satisfied), present, I, with 'me' (myself). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "alguna", f: "algun- + -a → alguno (some), feminine to match 'ínsula'."}
          - {w: "es", f: "ser (to be), present, he: soy, eres, es, somos, sois, son."}
          - {w: "me le ha prometido", f: "ha, from haber (to have), present, he: he, has, ha, hemos, habéis, han; + prometido, participle of prometer (to promise): 'he has promised'. 'le' (it) stands for 'el gobierno'; Cervantes often uses 'le' where modern Spanish says 'lo', and 'me' (to me) comes first."}
  - sentences:
      - es: "Yo —dijo el del Bosque—, con un canonicato quedaré satisfecho de mis servicios, y ya me le tiene mandado mi amo, y ¡qué tal!"
        literal: "I —said the [one] of-the Grove—, with a canonry I-shall-remain satisfied for my services, and already to-me it has promised my master, and what a [one]!"
        ormsby: "“I,” said he of the Grove, “shall be satisfied with a canonry for my services, and my master has already assigned me one.”"
        vocab:
          - {w: "canonicato", d: "canonry: the post and income of a canon, a member of a cathedral chapter"}
          - {w: "quedar satisfecho de", d: "to be satisfied, rewarded for"}
          - {w: "tener mandado", d: "to have promised, assigned ('mandar' = to promise, bequeath, as well as to order)"}
          - {w: "¡qué tal!", d: "and what a one!, and a fine one too (Ormsby leaves it out)"}
        diagram:
          - s: "con un canonicato quedaré satisfecho de mis servicios"
            r: "main verb 1: I shall be satisfied with a canonry for my services"
            under:
              - {s: "Yo", r: "subject: I (put first, matching Sancho's 'Yo')"}
              - {s: "dijo el del Bosque", r: "speaker: said the one of the Grove"}
          - s: "y ya me le tiene mandado mi amo"
            r: "main verb 2: and my master has already promised it to me"
            under:
              - {s: "y ¡qué tal!", r: "exclamation: and what a canonry!"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "quedaré", f: "quedar- + -é → quedar (to remain), future, I. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "satisfecho", f: "irregular participle of satisfacer (to satisfy), like hecho from hacer (to do); masculine to match the speaker."}
          - {w: "mis", f: "mis = plural to match 'servicios', not the owner."}
          - {w: "me le tiene mandado", f: "tien- + -e → tener (to have), present, he (my master): tengo, tienes, tiene, tenemos, tenéis, tienen; + mandado, participle of mandar (to promise): 'tener' + participle stresses that the thing is done and settled, 'he has it promised to me'. 'le' (it) stands for the canonry; Cervantes often uses 'le' where modern Spanish says 'lo'."}
