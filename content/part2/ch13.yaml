      - es: "antes tiene una alma como un cántaro: no sabe hacer mal a nadie, sino bien a todos, ni tiene malicia alguna:"
        literal: "rather he-has a soul like a pitcher: not he-knows to-do harm to nobody, but good to all, nor he-has malice any:"
        ormsby: "on the contrary, he has the soul of a pitcher; he has no thought of doing harm to anyone, only good to all, nor has he any malice whatever in him;"
        ormsby_note: "Tener alma de cántaro, to be simplicity itself."
        vocab:
          - {w: "antes", d: "rather, on the contrary (after a negative)"}
          - {w: "una alma", d: "= un alma, a soul; modern Spanish uses 'un' before a feminine noun beginning with stressed a-"}
          - {w: "tener alma de cántaro", d: "to have the soul of a pitcher: to be simple, guileless, without a thought of harm"}
          - {w: "cántaro", d: "earthenware pitcher, jug"}
          - {w: "no saber hacer", d: "not to know how to do, be incapable of doing"}
          - {w: "malicia", d: "malice; also cunning, guile"}
          - {w: "alguna", d: "after the noun in a negative sentence it means 'none at all': 'ni tiene malicia alguna' = nor has he any malice whatever"}
        diagram:
          - {s: "antes tiene una alma como un cántaro", r: "main clause 1: rather he has a soul like a pitcher"}
          - s: "no sabe hacer mal a nadie"
            r: "main clause 2: he does not know how to do harm to anyone"
            under:
              - {s: "sino bien a todos", r: "contrast: but only good to everyone"}
          - {s: "ni tiene malicia alguna", r: "main clause 3: nor has he any malice"}
        forms:
          - {w: "tiene", f: "tien- + -e → tener (to have), present, he. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "una alma", f: "una, feminine to match 'alma'; modern 'un alma', because a feminine noun that begins with a stressed a- now takes 'un' and 'el'."}
          - {w: "sabe hacer", f: "sab- + -e → saber (to know), present, he; saber + infinitive = to know how to. Irregular: sé, sabes, sabe, sabemos, sabéis, saben. hacer (to do) is the infinitive."}
          - {w: "no ... a nadie", f: "Spanish keeps both negatives: 'no sabe hacer mal a nadie' = he does not know how to harm nobody, i.e. anybody. 'a' marks the person harmed."}
          - {w: "alguna", f: "algun- + -a → alguno (some, any), feminine to match 'malicia'; placed after the noun in a negative it means 'not any at all'."}
        note: "An empty earthenware pitcher hides nothing: what you see is what is in it. Sancho means his master is transparent and harmless."
