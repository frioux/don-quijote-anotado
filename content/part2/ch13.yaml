        forms:
          - {w: "traigo", f: "traig- + -o → traer (to bring, carry), present, I. Irregular: traigo, traes, trae, traemos, traéis, traen."}
          - {w: "mis alforjas", f: "mis = plural to match 'alforjas', not the owner: 'my saddlebags'."}
          - {w: "pueden", f: "pued- + -en → poder (to be able), present, they (people in general): 'one could'. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden. descalabrar (to break the head of) is the infinitive after it."}
          - {w: "ello", f: "'it', the neuter pronoun, for the lump of cheese as a thing."}
          - {w: "a quien", f: "'to whom', used here for a thing (the cheese), which modern Spanish would not do: 'al que' or 'al cual'."}
          - {w: "hacen", f: "hac- + -en → hacer (to make), present, they (the carob beans and nuts). Irregular: hago, haces, hace, hacemos, hacéis, hacen. The subject comes after the verb."}
          - {w: "otras tantas", f: "otr- + -as and tant- + -as: feminine plural to match 'docenas': 'as many dozen more'."}
          - {w: "tiene", f: "tien- + -e → tener (to have, hold), present, he. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "guarda", f: "guard- + -a → guardar (to keep), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "se han de mantener y sustentar", f: "han → haber (to have), present, they: he, has, ha, hemos, habéis, han; 'haber de' + infinitive = must. mantener (to keep alive) and sustentar (to sustain) are the infinitives, with 'se' (themselves) placed before the whole group."}
          - {w: "frutas secas", f: "sec- + -as → seco (dry), feminine plural to match 'frutas'."}
          - {w: "yerbas", f: "old spelling of hierbas (herbs, grasses)."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
        note: "Don Quijote laid down this rule in Part I, chapter 10: knights errant, he said, eat rarely and live on whatever rustic food comes to hand. Sancho's 'mercedes a' (thanks to) is an ironic thank-you."
