                r: "subject: and that"
                under:
                  - {s: "que parece vituperio", r: "describes 'aquello': which seems abuse"}
              - {s: "en aquel término", r: "where: in that sense, in that setting"}
        forms:
          - {w: "ha hecho", f: "h- + -a → haber (to have), present, he: he, has, ha, hemos, habéis, han; + hecho, the irregular participle of hacer (to do): the present perfect, 'he has done'. 'qué bien que' adds an emphatic 'que'."}
          - {w: "aquello", f: "neuter of aquel (that), for an idea rather than a thing: 'that (expression)'."}
          - {w: "parece", f: "parec- + -e → parecer (to seem), present, it: parezco, pareces, parece, parecemos, parecéis, parecen."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
        note: "The squire's point is real: in Golden Age Spanish, as in many languages, an obscene oath could be the warmest praise, shouted at a bullfight or a fine deed."
