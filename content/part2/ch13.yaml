          - {w: "tragar", d: "to swallow, gulp down"}
          - {w: "a escuras", d: "= a oscuras, in the dark (old spelling)"}
          - {w: "bocado", d: "mouthful, bite"}
          - {w: "suelta", d: "hobble, tether: the rope tied to a grazing animal's legs"}
          - {w: "nudos de suelta", d: "knots on a tether: big lumps coming one after another"}
