          - {w: "fanega", d: "fanega, a Castilian dry measure of grain, roughly a bushel and a half"}
          - {w: "cebada", d: "barley, the usual feed of horses and donkeys"}
          - {w: "encima", d: "on top, to boot, into the bargain"}
        diagram:
          - s: "Mala pascua me dé Dios"
            r: "main verb 1 (a wish): may God give me a bad Easter"
          - s: "y sea la primera"
            r: "main verb 2 (a wish): and may it be the next one"
