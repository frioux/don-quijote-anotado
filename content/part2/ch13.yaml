          - {w: "arzón", d: "saddlebow, the raised front of a saddle"}
          - {w: "por sí o por no", d: "just in case, whatever happens"}
          - {w: "devoto", d: "devoted; 'tan devota mía' = such a devotion of mine, a playful religious word, as if the bota were a saint"}
          - {w: "rato", d: "a while, a moment"}
          - {w: "sin que", d: "without (+ subjunctive)"}
        diagram:
          - s: "Fiambreras traigo"
            r: "main verb 1: I carry food baskets"
            under:
              - s: "y esta bota"
                r: "object, 2: and this bota"
                under:
                  - {s: "colgando del arzón de la silla", r: "describes 'bota': hanging from the saddlebow"}
              - {s: "por sí o por no", r: "why: just in case"}
