              - {s: "que pocos ratos se pasan sin que la dé mil besos y mil abrazos", r: "result: that hardly a moment goes by without my giving it a thousand kisses and hugs"}
        forms:
          - {w: "traigo", f: "traig- + -o → traer (to bring, carry), present, I. Irregular: traigo, traes, trae, traemos, traéis, traen. The object 'Fiambreras' comes first."}
          - {w: "esta", f: "est- + -a → este (this), feminine to match 'bota'."}
          - {w: "colgando", f: "gerund of colgar (to hang): 'hanging'."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
          - {w: "es", f: "ser (to be), present, it (the bota): soy, eres, es, somos, sois, son."}
          - {w: "devota mía", f: "devot- + -a → devoto (devoted), feminine to match 'bota'; 'mía' (mine) after the noun, feminine to match it too."}
          - {w: "quiérola", f: "quier- + -o + la → querer (to love), present, I, with 'la' (it, the bota) stuck on the end; modern 'la quiero'. Cervantes hangs the pronoun on a verb that opens its clause after 'y'. querer in the present: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "se pasan", f: "pas- + -an → pasarse (to go by), present, they (the moments). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "la dé", f: "d- + -é → dar (to give), present subjunctive, I: subjunctive after 'sin que'. dé, des, dé, demos, deis, den; the accent tells 'dé' (give) from 'de' (of). 'la' as the indirect object ('to it', the bota) is laísmo; standard Spanish says 'le dé'."}
        note: "The squire talks of his wine bottle like a lover or a devotee of a saint ('devota', kisses and embraces), a comic echo of the masters' love talk going on nearby."
  - sentences:
      - es: "Y, diciendo esto, se la puso en las manos a Sancho, el cual, empinándola, puesta a la boca, estuvo mirando las estrellas un cuarto de hora, y, en acabando de beber, dejó caer la cabeza a un lado, y, dando un gran suspiro, dijo:"
        literal: "And, saying this, it to-him he-put in the hands to Sancho, the which, tilting-it-up, put to the mouth, was looking-at the stars a quarter of hour, and, on finishing of drinking, let fall the head to one side, and, giving a great sigh, said:"
        ormsby: "and so saying he thrust it into Sancho’s hands, who raising it aloft pointed to his mouth, gazed at the stars for a quarter of an hour; and when he had done drinking let his head fall on one side, and giving a deep sigh, exclaimed,"
        ormsby_note: "Anyone who has ever watched a Spanish peasant with a bota knows how graphic this is."
        vocab:
          - {w: "empinar", d: "to tilt up, raise high (a drinking vessel, to drink from it)"}
          - {w: "puesta a la boca", d: "set to his mouth"}
          - {w: "un cuarto de hora", d: "a quarter of an hour"}
          - {w: "en acabando de", d: "as soon as he had finished (doing)"}
          - {w: "dejar caer", d: "to let fall, drop"}
          - {w: "suspiro", d: "sigh"}
        diagram:
          - s: "se la puso en las manos a Sancho"
            r: "main verb: he put it (the wineskin) into Sancho's hands"
            under:
              - {s: "diciendo esto", r: "when: as he said this"}
              - s: "el cual"
                r: "describes 'Sancho': who"
                under:
                  - {s: "empinándola, puesta a la boca", r: "how: tilting it up, set to his mouth"}
                  - {s: "estuvo mirando las estrellas un cuarto de hora", r: "verb 1 of 'el cual': was looking at the stars for a quarter of an hour"}
                  - s: "dejó caer la cabeza a un lado"
                    r: "verb 2 of 'el cual' (after 'y'): let his head drop to one side"
                    under:
                      - {s: "en acabando de beber", r: "when: as soon as he finished drinking"}
                  - s: "dijo:"
                    r: "verb 3 of 'el cual' (after 'y'): said"
                    under:
                      - {s: "dando un gran suspiro", r: "how: heaving a great sigh"}
        forms:
          - {w: "diciendo", f: "gerund of decir (to say): 'saying'. The e of the stem turns to i in the gerund: decir → diciendo."}
          - {w: "se la puso", f: "pus- + -o → poner (to put), preterite, he. Irregular: puse, pusiste, puso, pusimos, pusisteis, pusieron. 'la' = it (the bota, feminine); 'se' = to him: 'le' (to him) becomes 'se' before 'la' or 'lo'. 'a Sancho' repeats who 'se' is, as Spanish often does."}
          - {w: "el cual", f: "'who', masculine singular to match 'Sancho'; a heavier relative than 'que', used after a comma."}
          - {w: "empinándola", f: "gerund of empinar (to tilt up) + la (it, the bota), the pronoun hung on the end of the gerund; accent added to keep the stress on -pi-."}
          - {w: "puesta", f: "irregular participle of poner (to put), feminine to match the bota: 'set (to his mouth)'."}
          - {w: "estuvo mirando", f: "estuv- + -o → estar (to be), preterite, he. Irregular: estuve, estuviste, estuvo, estuvimos, estuvisteis, estuvieron; + mirando, gerund of mirar (to look at): 'he was looking', an action that went on for a set time (a quarter of an hour)."}
          - {w: "en acabando", f: "en + acabando, gerund of acabar (to finish): 'as soon as he finished'. 'en' + gerund means 'on doing, as soon as'. 'acabar de' + infinitive beber (to drink) = to finish drinking."}
          - {w: "dejó caer", f: "dej- + -ó → dejar (to let), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron; + caer (to fall), infinitive: 'let fall, dropped'."}
          - {w: "dando", f: "gerund of dar (to give): 'giving (a sigh)', i.e. heaving."}
          - {w: "gran", f: "grande (great) clipped before a singular noun ('suspiro')."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
        note: "To drink from a bota you hold the leather bag up at arm's length and squeeze a jet of wine into your open mouth. Sancho tips it so high, and for so long, that he spends a quarter of an hour gazing at the stars."
  - sentences:
      - es: "— ¡Oh hideputa bellaco, y cómo es católico!"
        literal: "— Oh son-of-a-whore rogue, and how it-is catholic!"
        ormsby: "“Ah, whoreson rogue, how catholic it is!”"
        vocab:
          - {w: "hideputa", d: "= hijo de puta, son of a whore; here a cry of admiration, exactly the use the two squires have just been arguing about"}
          - {w: "bellaco", d: "rogue, rascal; here affectionate, said to the wine"}
          - {w: "católico", d: "literally 'Catholic'; said of wine, 'sound, pure, genuine' (false friend)"}
        diagram:
          - s: "y cómo es católico"
            r: "main exclamation: and how sound it is!"
            under:
              - {s: "¡Oh hideputa bellaco", r: "exclamation, said to the wine: oh, you rascal"}
        forms:
          - {w: "hideputa", f: "hi + de + puta: 'hijo de puta' (son of a whore) worn down in rapid speech into one word; masculine here, said of the wine."}
          - {w: "cómo", f: "with the accent, 'how!' in an exclamation (without it, 'como' = like, as)."}
          - {w: "es", f: "ser (to be), present, it (the wine). Irregular: soy, eres, es, somos, sois, son."}
          - {w: "católico", f: "católic- + -o, masculine singular to match the wine Sancho is praising, which is not named."}
        note: "To call a thing 'católico' was to say it was sound and in good health, as a good Christian is orthodox; Sancho is praising the wine as genuine, unwatered stuff. Ormsby keeps the pun by translating 'catholic'."
  - sentences:
      - es: "— ¿Veis ahí —dijo el del Bosque, en oyendo el hideputa de Sancho—, cómo habéis alabado este vino llamándole hideputa?"
        literal: "— See-you there — said he of-the Grove, on hearing the son-of-a-whore of Sancho —, how you-have praised this wine calling-it son-of-a-whore?"
        ormsby: "“There, you see,” said he of the Grove, hearing Sancho’s exclamation, “how you have called this wine whoreson by way of praise.”"
        vocab:
          - {w: "¿Veis ahí?", d: "there, you see! (pointing out a proof)"}
          - {w: "el del Bosque", d: "'the one of the Grove': here the Squire of the Grove, not his master"}
          - {w: "en oyendo", d: "as soon as he heard"}
          - {w: "alabar", d: "to praise"}
        diagram:
          - s: "¿Veis ahí"
            r: "main verb: there, you see"
            under:
              - s: "dijo el del Bosque"
                r: "inserted: said the one of the Grove (the squire)"
                under:
                  - {s: "en oyendo el hideputa de Sancho", r: "when: as soon as he heard Sancho's 'hideputa'"}
              - s: "cómo habéis alabado este vino"
                r: "what you see: how you have praised this wine"
                under:
                  - {s: "llamándole hideputa", r: "how: by calling it son of a whore"}
        forms:
          - {w: "Veis", f: "ve- + -is → ver (to see), present, you (vosotros, here said to one person as a polite 'you'). veo, ves, ve, vemos, veis, ven."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "oyendo", f: "gerund of oír (to hear): the i becomes y between vowels. 'en' + gerund means 'as soon as': 'en oyendo' = as soon as he heard."}
          - {w: "habéis alabado", f: "hab- + -éis → haber (to have), present, you (vosotros): he, has, ha, hemos, habéis, han; + alabado, participle of alabar (to praise): the present perfect, 'you have praised'."}
          - {w: "este", f: "'this', masculine singular to match 'vino'."}
          - {w: "llamándole", f: "gerund of llamar (to call) + le (it, the wine), the pronoun hung on the end; accent added to keep the stress on -mán-. 'le' as a direct object (where modern Spanish says 'lo') is leísmo, normal in Cervantes."}
  - sentences:
      - es: "— Digo —respondió Sancho—, que confieso que conozco que no es deshonra llamar hijo de puta a nadie, cuando cae debajo del entendimiento de alabarle."
        literal: "— I-say — answered Sancho —, that I-confess that I-recognize that not it-is dishonor to-call son of whore to nobody, when it-falls under the understanding of praising-him."
        ormsby: "“Well,” said Sancho, “I own it, and I grant it is no dishonour to call anyone whoreson when it is to be understood as praise."
        vocab:
          - {w: "deshonra", d: "dishonor, insult"}
          - {w: "a nadie", d: "anyone: 'nadie' means 'anybody' after a negative ('no es deshonra')"}
          - {w: "caer debajo del entendimiento de", d: "to fall under the meaning of, be meant as"}
        diagram:
          - s: "Digo"
            r: "main verb: I say"
            under:
              - {s: "respondió Sancho", r: "inserted: answered Sancho"}
              - s: "que confieso"
                r: "what I say: that I confess"
                under:
                  - s: "que conozco"
                    r: "what I confess: that I recognize"
                    under:
                      - s: "que no es deshonra"
                        r: "what I recognize: that it is no insult"
                        under:
                          - {s: "llamar hijo de puta a nadie", r: "subject of 'es': calling anybody a son of a whore"}
                          - {s: "cuando cae debajo del entendimiento de alabarle", r: "when: when it is meant as praise"}
        forms:
          - {w: "Digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "confieso", f: "confies- + -o → confesar (to confess), present, I. The stem e becomes ie when stressed: confieso, confiesas, confiesa, confesamos, confesáis, confiesan."}
          - {w: "conozco", f: "conozc- + -o → conocer (to know, recognize), present, I. conozco, conoces, conoce, conocemos, conocéis, conocen."}
          - {w: "es", f: "ser (to be), present, it. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "llamar", f: "infinitive of llamar (to call), used as a noun: 'calling ... is no insult'."}
          - {w: "cae", f: "ca- + -e → caer (to fall), present, it. caigo, caes, cae, caemos, caéis, caen."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
          - {w: "alabarle", f: "alabar (to praise) + le (him, the person so called), the pronoun hung on the infinitive after 'de'."}
        note: "Sancho stacks up three verbs ('digo que confieso que conozco') like a man making a formal admission before a judge: he concedes the point the other squire made a few minutes earlier about 'hideputa' as praise."
      - es: "Pero dígame, señor, por el siglo de lo que más quiere: ¿este vino es de Ciudad Real?"
        literal: "But tell-me, sir, by the eternal-life of that which most you-love: this wine is from Ciudad Real?"
        ormsby: "But tell me, señor, by what you love best, is this Ciudad Real wine?”"
        ormsby_note: "The chief town of La Mancha, and also of the great wine-growing district of which the Valdepeñas is the best known product."
        vocab:
          - {w: "por el siglo de", d: "an oath: 'by the soul of', 'siglo' here meaning the life to come of the dead, not 'century'"}
          - {w: "lo que más quiere", d: "what you love most"}
          - {w: "Ciudad Real", d: "town in La Mancha, centre of a wine-growing district"}
        diagram:
          - s: "Pero dígame"
            r: "main verb: but tell me"
            under:
              - {s: "señor", r: "said to: sir"}
              - {s: "por el siglo de lo que más quiere", r: "oath: by the soul of whatever you love most"}
          - {s: "¿este vino es de Ciudad Real?", r: "the question: is this wine from Ciudad Real?"}
        forms:
          - {w: "dígame", f: "dig- + -a + me → decir (to say), present subjunctive, you (vuestra merced, the polite 'you', which takes the he/she forms), with 'me' (to me) stuck on the end; accent added to keep the stress on dí-. decir in the present subjunctive: diga, digas, diga, digamos, digáis, digan. The present subjunctive gives the polite command, and a command must carry its pronoun on the end."}
          - {w: "quiere", f: "quier- + -e → querer (to love, want), present, you (polite, he/she form). The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "este", f: "'this', masculine singular to match 'vino'."}
          - {w: "es", f: "ser (to be), present, it. Irregular: soy, eres, es, somos, sois, son. 'ser de' = to come from."}
  - sentences:
      - es: "— ¡Bravo mojón! —respondió el del Bosque—. En verdad que no es de otra parte, y que tiene algunos años de ancianidad."
        literal: "— Fine wine-taster! — answered he of-the Grove —. In truth that not it-is from other place, and that it-has some years of age."
        ormsby: "“O rare wine-taster!” said he of the Grove; “nowhere else indeed does it come from, and it has some years’ age too.”"
        vocab:
          - {w: "bravo", d: "fine, splendid (not 'brave' here)"}
          - {w: "mojón", d: "wine-taster (old slang); the ordinary meaning is 'boundary stone'"}
          - {w: "el del Bosque", d: "'the one of the Grove': here the Squire of the Grove"}
          - {w: "en verdad que", d: "truly, really"}
          - {w: "ancianidad", d: "old age; of a wine, age, years in the cask"}
        diagram:
          - {s: "¡Bravo mojón!", r: "exclamation: what a wine-taster!"}
          - {s: "respondió el del Bosque", r: "inserted: answered the one of the Grove (the squire)"}
          - s: "no es de otra parte"
            r: "main verb 1: it comes from nowhere else"
            under:
              - {s: "En verdad que", r: "how: truly"}
          - {s: "y que tiene algunos años de ancianidad", r: "main verb 2: and it is a few years old"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "es", f: "ser (to be), present, it. Irregular: soy, eres, es, somos, sois, son. 'ser de' = to come from."}
          - {w: "que ... y que", f: "'que' after 'en verdad' only adds emphasis and is repeated before the second verb; it is not translated."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, it. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "algunos", f: "algun- + -os → alguno (some), masculine plural to match 'años'."}
  - sentences:
      - es: "— ¡A mí con eso! —dijo Sancho—. No toméis menos, sino que se me fuera a mí por alto dar alcance a su conocimiento."
        literal: "— To me with that! — said Sancho —. Not take-you less, but that itself from-me might-go to me over high to-give reach to its knowledge."
        ormsby: "“Leave me alone for that,” said Sancho; “never fear but I’ll hit upon the place it came from somehow."
        vocab:
          - {w: "¡A mí con eso!", d: "'to me with that!': you're telling me? leave that to me"}
          - {w: "no toméis menos", d: "don't take [me] for any less, don't expect less [of me]"}
          - {w: "írsele a uno por alto", d: "to go over someone's head, escape him"}
          - {w: "dar alcance a", d: "to catch up with, get to the bottom of"}
          - {w: "conocimiento", d: "knowing, identifying (where the wine is from)"}
        diagram:
          - {s: "¡A mí con eso!", r: "exclamation: you're telling me that?"}
          - {s: "dijo Sancho", r: "inserted: said Sancho"}
          - s: "No toméis menos"
            r: "main verb: don't take [me] for less"
            under:
              - s: "sino que se me fuera a mí por alto"
                r: "than this: that it should go over my head"
                under:
                  - {s: "dar alcance a su conocimiento", r: "subject of 'fuera': working out where it comes from"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "toméis", f: "tom- + -éis → tomar (to take), present subjunctive, you (vosotros, said to one person). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. A negative command always uses the subjunctive: 'no toméis' = don't take."}
          - {w: "se me fuera", f: "fu- + -era → ir (to go), imperfect subjunctive (-ra form), it, with 'se' (irse, to slip away) and 'me' (from me): 'that it should slip past me'. Irregular: fuera, fueras, fuera, fuéramos, fuerais, fueran."}
          - {w: "a mí", f: "repeats 'me' for emphasis: 'from ME'."}
          - {w: "dar", f: "infinitive of dar (to give), used as a noun and the subject of 'fuera': 'getting to the bottom of it'."}
          - {w: "su", f: "'its', the wine's: 'knowing [where] it [comes from]'."}
        note: "Sancho has been calling the other squire 'vuestra merced' and now switches to the 'vosotros' form (toméis); Cervantes' characters move between the two freely."
      - es: "¿No será bueno, señor escudero, que tenga yo un instinto tan grande y tan natural, en esto de conocer vinos, que, en dándome a oler cualquiera, acierto la patria, el linaje, el sabor, y la dura, y las vueltas que ha de dar, con todas las circunstancias al vino atañederas?"
        literal: "Not will-it-be good, sir squire, that I-may-have I an instinct so great and so natural, in this of knowing wines, that, on giving-me to smell any, I-hit-on the homeland, the lineage, the flavor, and the lasting, and the turns that it-has to give, with all the circumstances to-the wine pertaining?"
        ormsby: "What would you say, sir squire, to my having such a great natural instinct in judging wines that you have only to let me smell one and I can tell positively its country, its kind, its flavour and soundness, the changes it will undergo, and everything that appertains to a wine?"
        vocab:
          - {w: "¿No será bueno que ...?", d: "isn't it something that ...? what do you say to the fact that ...?"}
          - {w: "en esto de", d: "in this matter of"}
          - {w: "en dándome", d: "as soon as [someone] gives me"}
          - {w: "acertar", d: "to hit on, guess right"}
          - {w: "patria", d: "homeland; of a wine, where it comes from"}
          - {w: "linaje", d: "lineage, stock; of a wine, its kind or variety"}
          - {w: "la dura", d: "how long it will keep (from durar, to last)"}
          - {w: "vueltas", d: "turns, changes; a wine that 'turns' goes off"}
          - {w: "atañedero", d: "pertaining, relating (from atañer, to concern); a rare, rather learned word"}
        diagram:
          - s: "¿No será bueno"
            r: "main verb: won't it be fine"
            under:
              - {s: "señor escudero", r: "said to: sir squire"}
              - s: "que tenga yo un instinto tan grande y tan natural"
                r: "subject: that I have so great and natural an instinct"
                under:
                  - {s: "en esto de conocer vinos", r: "in what: in this business of knowing wines"}
                  - s: "acierto la patria, el linaje, el sabor, y la dura, y las vueltas"
                    r: "result (after 'que'): that I guess its homeland, kind, taste, how it will keep and how it will turn"
                    under:
                      - {s: "en dándome a oler cualquiera", r: "when: as soon as I'm given any one to smell"}
                      - {s: "que ha de dar", r: "describes 'vueltas': that it is going to take"}
                      - {s: "con todas las circunstancias al vino atañederas", r: "with what: with everything that bears on a wine"}
        forms:
          - {w: "será", f: "ser- + -á → ser (to be), future, it. The future adds endings to the whole infinitive: seré, serás, será, seremos, seréis, serán."}
          - {w: "tenga", f: "teng- + -a → tener (to have), present subjunctive, I: tenga, tengas, tenga, tengamos, tengáis, tengan. Subjunctive after 'será bueno que'; the subject 'yo' comes after the verb for emphasis."}
          - {w: "conocer", f: "infinitive of conocer (to know), used as a noun after 'esto de'."}
          - {w: "dándome", f: "gerund of dar (to give) + me (to me), the pronoun hung on the end; accent added to keep the stress on dán-. 'en' + gerund means 'as soon as': 'en dándome' = as soon as [they] give me."}
