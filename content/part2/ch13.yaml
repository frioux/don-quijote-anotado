          - {w: "se dice", f: "dic- + -e → decir (to say), present, it, with 'se' making it passive: 'is said, people say'. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "el tener", f: "the infinitive of tener (to have) used as a noun with 'el': 'the having', i.e. having."}
          - {w: "suele", f: "suel- + -e → soler (to be in the habit of), present, it. The stem o becomes ue when stressed: suelo, sueles, suele, solemos, soléis, suelen. Followed by the infinitive servir (to serve): 'usually serves'."}
          - {w: "podré", f: "podr- + -é → poder (to be able), future, I. Irregular stem podr-: podré, podrás, podrá, podremos, podréis, podrán."}
