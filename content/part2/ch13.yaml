        vocab:
          - {w: "con todo eso", d: "for all that, even so, nevertheless"}
          - {w: "el del Bosque", d: "'the one of the Grove': the squire of the Knight of the Grove"}
          - {w: "guiar", d: "to guide, lead"}
          - {w: "ambos", d: "both"}
          - {w: "ir a peligro de", d: "to run the risk of, be in danger of (modern 'correr peligro de')"}
          - {w: "hoyo", d: "pit, hole, ditch"}
