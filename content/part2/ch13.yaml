          - {w: "saca", f: "sac- + -a → sacar (to take out), present, he (God). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. After 'si' Spanish uses the present for a future condition."}
          - {w: "deste", f: "de + este (this), run together as in old Spanish; modern 'de este'."}
          - {w: "he incurrido", f: "h- + -e → haber (to have), present, I: he, has, ha, hemos, habéis, han; + incurrido, the participle of incurrir (to fall into): 'I have fallen'."}
          - {w: "cebado y engañado", f: "participles of cebar (to bait) and engañar (to deceive), masculine singular to match Sancho: 'lured and tricked'."}
          - {w: "hallé", f: "hall- + -é → hallar (to find), preterite, I. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. 'me hallé' adds 'me' for 'found for myself'."}
