  - sentences:
      - es: "— No hay camino tan llano —replicó Sancho— que no tenga algún tropezón o barranco; en otras casas cuecen habas, y en la mía, a calderadas; más acompañados y paniaguados debe de tener la locura que la discreción."
        literal: "— Not there-is road so smooth —replied Sancho— that not may-have some stumble or gully; in other houses they-cook beans, and in the mine, by cauldronfuls; more companions and hangers-on must have the madness than the good-sense."
        ormsby: "“There’s no road so smooth but it has some hole or hindrance in it,” said Sancho; “in other houses they cook beans, but in mine it’s by the potful; madness will have more followers and hangers-on than sound sense;"
        ormsby_note: "Proverb 44. \"I get more than my share of ill-luck.\""
        vocab:
          - {w: "llano", d: "flat, level, smooth"}
          - {w: "tropezón", d: "a stumble; something to trip over"}
          - {w: "barranco", d: "gully, ravine; here a pothole or break in the road"}
          - {w: "en otras casas cuecen habas, y en la mía, a calderadas", d: "proverb: in other houses they cook beans, in mine by the cauldronful; everyone has troubles, but I have them in bulk"}
          - {w: "calderada", d: "a cauldronful; 'a calderadas' = by the cauldronful, in great quantity"}
          - {w: "paniaguado", d: "hanger-on, dependant; literally one fed 'bread and water' (pan y agua) by a household"}
          - {w: "discreción", d: "good sense, wisdom (false friend: not 'discretion' in the sense of keeping secrets)"}
