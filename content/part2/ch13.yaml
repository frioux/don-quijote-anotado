  - sentences:
      - es: "— Por eso digo —dijo el del Bosque— que nos dejemos de andar buscando aventuras; y, pues tenemos hogazas, no busquemos tortas, y volvámonos a nuestras chozas, que allí nos hallará Dios, si Él quiere."
        literal: "— For that I-say — said he of-the Grove — that ourselves we-should-leave-off of going-about seeking adventures; and, since we-have loaves, not let-us-seek cakes, and let-us-return-ourselves to our huts, for there us will-find God, if He wants."
        ormsby: "“Therefore, I say,” said he of the Grove, “let us give up going in quest of adventures, and as we have loaves let us not go looking for cakes, but return to our cribs, for God will find us there if it be his will.”"
        ormsby_note: "Proverb 116."
        vocab:
          - {w: "el del Bosque", d: "'the one of the Grove': here the Squire of the Grove"}
          - {w: "dejarse de", d: "to give up, leave off (doing)"}
          - {w: "andar + gerund", d: "to go about doing"}
          - {w: "pues", d: "here 'since', giving a reason"}
          - {w: "hogaza", d: "large round loaf of coarse household bread"}
          - {w: "torta", d: "cake, flat sweet bread"}
          - {w: "choza", d: "hut, cabin; here 'home', humbly"}
        diagram:
          - s: "Por eso digo"
            r: "main verb: that is why I say"
            under:
              - {s: "dijo el del Bosque", r: "inserted: said the one of the Grove (the squire)"}
              - {s: "que nos dejemos de andar buscando aventuras", r: "what I say, 1: let us give up going about looking for adventures"}
              - s: "no busquemos tortas"
                r: "what I say, 2: let us not go looking for cakes"
                under:
                  - {s: "pues tenemos hogazas", r: "why: since we have loaves"}
              - s: "y volvámonos a nuestras chozas"
                r: "what I say, 3: and let us go back to our huts"
                under:
                  - {s: "que allí nos hallará Dios, si Él quiere", r: "why: for God will find us there, if He wishes"}
        forms:
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "nos dejemos", f: "dej- + -emos → dejarse (to leave off), present subjunctive, we: 'let us give up'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "andar buscando", f: "andar (to go about) + buscando, gerund of buscar (to look for): 'going about looking for'."}
          - {w: "tenemos", f: "ten- + -emos → tener (to have), present, we. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "busquemos", f: "busqu- + -emos → buscar (to look for), present subjunctive, we: 'let us (not) look for'; c becomes qu before e to keep the hard sound. busque, busques, busque, busquemos, busquéis, busquen."}
          - {w: "volvámonos", f: "volv- + -amos + nos → volverse (to go back), present subjunctive, we, with 'nos' stuck on the end: 'let us go back'. The -s of volvamos drops before 'nos', and the accent is added. volver in the present subjunctive: vuelva, vuelvas, vuelva, volvamos, volváis, vuelvan. A 'let us' command must carry its pronoun on the end."}
          - {w: "nuestras", f: "nuestr- + -as → nuestro (our), feminine plural to match 'chozas'."}
          - {w: "hallará", f: "hallar- + -á → hallar (to find), future, he (God). The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "quiere", f: "quier- + -e → querer (to want), present, he. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
        note: "Ormsby's 'Proverb 116' refers to his own numbered list of the proverbs in the book. 'Since we have loaves, let us not look for cakes' means: be content with plain good things and don't go chasing luxuries, here the rewards of adventure."
  - sentences:
      - es: "— Hasta que mi amo llegue a Zaragoza, le serviré; que después todos nos entenderemos."
        literal: "— Until that my master may-arrive at Zaragoza, him I-will-serve; for afterwards all ourselves we-will-understand."
        ormsby: "“Until my master reaches Saragossa,” said Sancho, “I’ll remain in his service; after that we’ll see.”"
        vocab:
          - {w: "Zaragoza", d: "Saragossa, the capital of Aragon"}
          - {w: "entenderse", d: "to come to an understanding; 'todos nos entenderemos' = we'll all see, we'll sort it out"}
        diagram:
          - s: "le serviré"
            r: "main verb: I will serve him"
            under:
              - {s: "Hasta que mi amo llegue a Zaragoza", r: "until when: until my master reaches Zaragoza"}
          - {s: "que después todos nos entenderemos", r: "why: for afterwards we will all see"}
        forms:
          - {w: "llegue", f: "llegu- + -e → llegar (to arrive), present subjunctive, he; g becomes gu before e to keep the hard sound. llegue, llegues, llegue, lleguemos, lleguéis, lleguen. Subjunctive after 'hasta que' for something still in the future."}
          - {w: "le", f: "'him', my master; 'le' as a direct object for a male person is leísmo, normal in Cervantes (standard modern 'lo')."}
          - {w: "serviré", f: "servir- + -é → servir (to serve), future, I. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "nos entenderemos", f: "entender- + -emos → entenderse (to come to an understanding), future, we, with 'nos' (with each other). The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
        note: "The Spanish gives this speech no 'said Sancho'; Ormsby adds it. Don Quijote has set out in Part II meaning to reach Zaragoza for the jousts held there, as Sansón Carrasco advised."
  - sentences:
