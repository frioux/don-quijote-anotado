  - sentences:
      - es: "— Tonto, pero valiente —respondió el del Bosque—, y más bellaco que tonto y que valiente."
        literal: "— Foolish, but brave —answered he of-the Grove—, and more rogue than foolish and than brave."
        ormsby: "“Crazy but valiant,” replied he of the Grove, “and more roguish than crazy or valiant.”"
        vocab:
          - {w: "el del Bosque", d: "'the one of the Grove': the squire of the Knight of the Grove"}
          - {w: "valiente", d: "brave, valiant"}
          - {w: "bellaco", d: "rogue, knave; sly, crafty (sometimes said half in admiration)"}
        diagram:
          - s: "respondió"
            r: "main verb: answered"
            under:
              - {s: "Tonto, pero valiente", r: "what he answered, 1: [he is] foolish but brave"}
              - {s: "el del Bosque", r: "subject: the squire of the Grove"}
              - {s: "y más bellaco que tonto y que valiente", r: "what he answered, 2: and more of a rogue than foolish or brave"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "el del Bosque", f: "'el' stands for a noun left out ('el escudero'): 'the one of the Grove'. del = de + el, the contraction modern Spanish still makes."}
          - {w: "más bellaco que tonto", f: "'más ... que' makes the comparison: 'more rogue than fool'. There is no verb: 'es', from ser (to be), present, he (soy, eres, es, somos, sois, son), is understood."}
        note: "An odd thing for a squire to say of his master: he calls him crafty rather than mad. The reader should keep the remark in mind."
  - sentences:
