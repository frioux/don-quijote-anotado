      - es: "\"¡Oh hideputa, puto, y qué bien que lo ha hecho!?\" Y aquello que parece vituperio, en aquel término, es alabanza notable;"
        literal: "\"Oh son-of-a-whore, rogue, and how well [that] it he-has done!\" And that which seems abuse, in that sense, is praise notable;"
        ormsby: "‘Ha, whoreson rip! how well he has done it!’ and that what seems to be abuse in the expression is high praise?"
        vocab:
          - {w: "hideputa", d: "= hijo de puta, 'son of a whore'; in exclamations of admiration it is praise, like English 'you old devil!'"}
          - {w: "puto", d: "a coarse insult (male prostitute, sodomite), here used in the same admiring exclamation"}
          - {w: "vituperio", d: "abuse, insult, reproach"}
          - {w: "en aquel término", d: "in that sense, in that context"}
          - {w: "notable", d: "considerable, high, great"}
