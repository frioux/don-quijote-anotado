          - {w: "mantenerse y sustentarse", d: "to keep oneself alive, feed oneself"}
          - {w: "yerbas", d: "= hierbas, herbs, wild plants (old spelling)"}
        diagram:
          - s: "y no como yo, mezquino y malaventurado"
            r: "contrast, continuing 'Vuestra merced sí que es escudero': and not like me, wretched and unlucky"
            under:
              - s: "que sólo traigo en mis alforjas un poco de queso"
