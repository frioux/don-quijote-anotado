summary: |
  While the Knight of the Grove and Don Quijote talk of their loves, the two squires move a little apart and talk of their lives. The Squire of the Grove complains that squires eat their bread in the sweat of their brows, and Sancho adds that they eat it in the cold of their bodies too, when they eat at all. The other squire's master has promised him a canonry, and Sancho's has promised him an island; Sancho remembers how he feared his master might become an archbishop, a post that would leave a married, unlettered squire with nothing. The Squire of the Grove warns that island governments bring more cares than profit and says they would do better to go home to hunting and fishing; Sancho answers that he has a donkey worth twice his master's horse and can borrow greyhounds from his neighbours.

  They talk of their children. Sancho is raising his daughter to be a countess, in spite of her mother, and when the other squire praises her strength with the cry 'hideputa, puta', Sancho takes offence until he is told that such oaths are the highest praise, as when the crowd cheers a good lance thrust at a bull. Sancho admits that the hundred ducats he found in the Sierra Morena lured him back into service and that the devil keeps showing him a bag of doubloons. The other squire answers that greed bursts the sack, and says his own master is mad in a stranger way: he plays the madman so that another knight may recover his wits, and he is in love with one Casildea de Vandalia, 'the rawest and the most roasted' lady in the world. Sancho calls his own master a fool, but a fool without malice whom a child could persuade that it is night at noon, and he loves him for it.

  Seeing Sancho's mouth dry, the Squire of the Grove fetches a great wineskin and a pie half a yard across, made of a rabbit so big that Sancho takes it for goat. Sancho eats greedily in the dark and contrasts this banquet with his own hard cheese, carob beans and nuts, the diet of fruit and wild herbs his master thinks proper for knights errant; the other squire says his stomach is not made for thistles and wild pears. Sancho drinks while gazing at the stars for a quarter of an hour, then cries 'Oh hideputa bellaco, y cómo es católico!', praising the wine with the very oath they have just argued about.

  Sancho guesses that the wine is from Ciudad Real and boasts of his inborn skill as a taster, telling how two of his kinsmen once tasted a cask: one found a taste of iron, the other of leather, and when the cask was emptied a small key on a leather thong was found at the bottom. The Squire of the Grove again urges that they give up adventures and go home, but Sancho will serve his master until they reach Zaragoza. They talk and drink until sleep ties their tongues, and they fall asleep clutching the almost empty wineskin with half-chewed mouthfuls still in their mouths, while the history turns back to the two knights.
context: |
  Two pairs. The chapter is built as a mirror. In chapter 12 the narrator promised that the squires' talk would be as amusing as their masters' was grave, and here the servants do exactly what the knights do, comparing their lives while the knights compare their ladies. The Squire of the Grove is a second Sancho: a villager with a wife and children, promised a reward by his master, full of proverbs and fond of his food and wine. He is never named in this chapter, and his hints are left unexplained: his master is mad in a stranger way than Don Quijote, plays the madman so that 'another knight' may recover his lost wits, and has 'greater schemes' rumbling in his insides that will come out 'before many hours'. The title's promise of a 'discreet, new and gentle colloquy' is ironic, since the talk soon turns to whores, money and drink.

  Rewards. The 'ínsula' is the bookish word of the romances of chivalry, which Sancho has held on to ever since Don Quijote promised him one in Part I. The rival squire's canonry is a church benefice, a seat in a cathedral chapter with a fixed income, normally held by a cleric; that is why Sancho concludes that the other master is a knight 'a lo eclesiástico', and why he remembers his fear, in Part I, that Don Quijote might choose to be an archbishop, which would leave nothing for a married, unlettered squire. Sancho's dreams of money are those of a peasant: a 'talego' of doubloons, and then 'echar censos y fundar rentas', lending money secured on land and living on the income, the safe investments of the comfortable classes. The hundred ducats he names are the purse he found in Cardenio's valise in the Sierra Morena (Part I, chapter 23), which Don Quijote let him keep.

  Praise and abuse. The argument over 'hideputa' turns on a real habit of speech: an obscene oath shouted at a fine deed was the warmest praise. The other squire's example is the bullfight of the time, when gentlemen on horseback fought bulls with lances in the town square and the crowd cheered a good thrust. Sancho first takes the word literally, as an insult to his daughter and wife, then turns it with relish on the wine. 'Católico' said of wine means sound and genuine, as a good Christian is orthodox. Casildea, 'la más cruda y la más asada', is a joke on the cruel lady of love poetry: 'crudo' is both 'raw' and 'cruel', and the squire adds the opposite cooking term; Ormsby admits that even with this explanation the humour is not very intelligible.

  Food and drink. The meal is a list of country fare. The 'bota' is the leather wineskin from which a Spaniard drinks by holding it up and squirting the wine into his mouth, and Ormsby remarks that anyone who has watched a peasant with one knows how graphic Sancho's quarter of an hour of star-gazing is. The 'empanada' is a large pie, here of a 'conejo albar', a white or tame rabbit; the vara is the Castilian yard, a little under a metre. Sancho's own saddlebags hold the food of the poor: hard cheese, carob beans (Ormsby's 'St. John's bread', usually animal fodder), hazelnuts and walnuts. The Squire of the Grove refuses to live on 'tagarninas' (golden thistles, gathered as a wild vegetable), 'piruétanos' (wild pears) and roots. Don Quijote's rule that knights errant should eat little and live on what the fields give goes back to Part I. Ciudad Real, as Ormsby notes, was the chief town of La Mancha and the centre of its great wine-growing district. The story of the two wine-tasters ('mojones', an old slang word) who taste iron and leather in a cask that turns out to hold a key on a thong of Cordovan leather was a popular tale; Ormsby notes that Cervantes used it again in his interlude 'La elección de los alcaldes de Daganzo'. Zaragoza, where Sancho will follow his master, is the goal Sansón Carrasco suggested in chapter 4, for the jousts held there.

  Proverbs and Scripture. Ormsby numbers the proverbs: 'los duelos con pan son menos' (troubles are lighter with bread), 'la codicia rompe el saco' (greed bursts the sack), 'cuidados ajenos matan al asno' (other people's worries kill the donkey), 'en otras casas cuecen habas, y en la mía a calderadas' (other houses cook beans, mine by the cauldronful: I get more than my share of trouble) and 'pues tenemos hogazas, no busquemos tortas' (having loaves, let us not look for cakes). The squires also borrow from the Bible: the curse of Genesis 3, 'in the sweat of thy face shalt thou eat bread', and Christ's saying in Matthew 15 that if the blind lead the blind both shall fall into the ditch. 'Tener alma de cántaro', to have a soul like a pitcher, is, in Ormsby's words, to be simplicity itself.

  Reading Cervantes' Spanish. The chapter is full of old forms: the contractions dellos, deso, dese, deste, desta and destos; yelo (hielo), yerbas (hierbas), a escuras (a oscuras), mesmo (mismo), estremos (extremos), cualidad (calidad), encantamento (encantamiento), entrambos (ambos), luengo (largo), cualque (alguna), malencónico (melancólico), 'una alma' for 'un alma', Sancho's rustic 'quiriendo' for 'queriendo', and vuesa merced, the worn-down form of vuestra merced. Pronouns hang on a verb that opens a clause (paréceme, parécelo, quiérola, Diéronles, vendióse, háblese). The future subjunctive marks an open future (viniere, viviere, fuere servido, mandaren); the -ra form of the subjunctive does the work of a conditional (si le trocara, quitársela fuera imposible); the -se form follows verbs of wishing and advising (procurase, retirásemos, entretuviésemos, diesen), and 'que' is often left out after them ('ruego yo a Dios me saque'). Leísmo uses 'le' for a person and even for a thing ('me le ha prometido', of the governorship). 'En' + gerund means 'as soon as' (en oyendo, en acabando, en dándome), 'haber de' means 'to be bound to' and 'deber de' marks a guess. The squires switch between the polite vuesa merced and the familiar vos forms (renegad vos, veis, habéis, no toméis). Watch the false friends: razonamiento (talk), discreto (shrewd), liberal (generous), procurar (to try), beneficio (a church living), ejercicio (pursuit), desgraciado (unlucky) and católico (sound, of wine).
