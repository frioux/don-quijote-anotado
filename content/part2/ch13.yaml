  - sentences:
      - es: "— Real y verdaderamente —respondió el del Bosque—, señor escudero, que tengo propuesto y determinado de dejar estas borracherías destos caballeros, y retirarme a mi aldea, y criar mis hijitos, que tengo tres como tres orientales perlas."
        literal: "— Really and truly —answered he of-the Grove—, sir squire, [I say] that I-have proposed and determined to leave these drunken-follies of-these knights, and to-retire-myself to my village, and to-bring-up my little-children, for I-have three like three oriental pearls."
        ormsby: "“In truth and earnest, sir squire,” said he of the Grove, “I have made up my mind and determined to have done with these drunken vagaries of these knights, and go back to my village, and bring up my children; for I have three, like three Oriental pearls.”"
        vocab:
          - {w: "el del Bosque", d: "'he of the Grove': the squire of the Knight of the Grove, named after his master, as one says 'el de la Triste Figura'"}
          - {w: "real y verdaderamente", d: "really and truly, in all earnest (a set pair for emphasis)"}
          - {w: "tener propuesto y determinado de", d: "to have resolved and made up one's mind to"}
          - {w: "borrachería", d: "drunken folly, madness; literally drunkenness, here the knights' crazy notions"}
          - {w: "destos", d: "= de estos, of these (old contraction)"}
          - {w: "criar", d: "to bring up, raise (children)"}
          - {w: "hijitos", d: "little children, dear children (diminutive of 'hijos')"}
          - {w: "perlas orientales", d: "oriental pearls, the finest kind, from the Indian Ocean and the Persian Gulf; a stock compliment"}
        diagram:
          - s: "tengo propuesto y determinado"
            r: "main verb: I have resolved and determined"
            under:
              - {s: "Real y verdaderamente", r: "how: really and truly"}
              - {s: "respondió el del Bosque", r: "speech tag: answered the squire of the Grove"}
              - {s: "señor escudero", r: "addressee: sir squire"}
              - s: "de dejar estas borracherías destos caballeros"
                r: "what he has resolved, 1: to leave these knights' drunken follies"
              - {s: "y retirarme a mi aldea", r: "what he has resolved, 2: and to go home to my village"}
              - s: "y criar mis hijitos"
                r: "what he has resolved, 3: and to bring up my children"
                under:
                  - {s: "que tengo tres como tres orientales perlas", r: "why: for I have three, like three oriental pearls"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "tengo propuesto y determinado", f: "teng- + -o → tener (to have), present, I: tengo, tienes, tiene, tenemos, tenéis, tienen; + propuesto, the irregular participle of proponer (to propose, resolve), and determinado, the participle of determinar (to determine). 'tener' + participle stresses the result, 'I have it resolved', close to 'he propuesto'."}
          - {w: "estas", f: "est- + -as → este (this), feminine plural to match 'borracherías'."}
          - {w: "destos", f: "de + estos (these), run together as in old Spanish; masculine plural to match 'caballeros'. Modern 'de estos'."}
          - {w: "retirarme", f: "retirar (to withdraw) + me (myself): retirarse, to retire, go home. The pronoun is hung on the end of the infinitive, which still depends on 'tengo propuesto de'."}
          - {w: "hijitos", f: "hij- + -itos → hijo (child) with the diminutive -ito, masculine plural: affection rather than size."}
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "orientales perlas", f: "the adjective put before the noun, a literary order; plural 'orientales' to match 'perlas'."}
        note: "The squire's talk of giving up the 'drunken follies' of knight-errantry echoes what Sancho's wife and neighbours say to him. Here it is the other squire who sounds weary, and he will keep urging Sancho to go home."
  - sentences:
      - es: "— Dos tengo yo —dijo Sancho—, que se pueden presentar al Papa en persona, especialmente una muchacha a quien crío para condesa, si Dios fuere servido, aunque a pesar de su madre."
        literal: "— Two have I —said Sancho—, who themselves can present to-the Pope in person, especially a girl whom I-raise for countess, if God may-be served, although in spite of her mother."
        ormsby: "“I have two,” said Sancho, “that might be presented before the Pope himself, especially a girl whom I am breeding up for a countess, please God, though in spite of her mother.”"
        vocab:
          - {w: "presentar al Papa en persona", d: "to present to the Pope himself: so fine they could be shown to anyone"}
          - {w: "criar para condesa", d: "to bring up to be a countess"}
          - {w: "si Dios fuere servido", d: "if it please God, God willing (literally 'if God should be served')"}
          - {w: "a pesar de", d: "in spite of, against the wishes of"}
        diagram:
          - s: "Dos tengo yo"
            r: "main verb: I have two"
            under:
              - {s: "dijo Sancho", r: "speech tag: said Sancho"}
              - {s: "que se pueden presentar al Papa en persona", r: "describes 'dos': who could be presented to the Pope himself"}
              - s: "especialmente una muchacha"
                r: "especially: a girl"
                under:
                  - {s: "a quien crío para condesa", r: "describes 'muchacha': whom I am raising to be a countess"}
                  - {s: "si Dios fuere servido", r: "condition: God willing"}
                  - {s: "aunque a pesar de su madre", r: "though: against her mother's wishes"}
        forms:
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen. The object 'Dos' comes first for emphasis."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "se pueden presentar", f: "pued- + -en → poder (to be able), present, they: puedo, puedes, puede, podemos, podéis, pueden; + presentar (to present), with 'se' making it passive: 'they can be presented'."}
          - {w: "al", f: "a + el, the contraction modern Spanish still makes."}
          - {w: "a quien", f: "'whom', with the personal 'a' because the object is a person."}
          - {w: "crío", f: "crí- + -o → criar (to raise), present, I; the accent marks the stress on the i. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an (crío, crías, cría, criamos, criáis, crían)."}
          - {w: "fuere servido", f: "fu- + -ere → ser (to be), future subjunctive, he (God): fuere, fueres, fuere, fuéremos, fuereis, fueren; + servido, the participle of servir (to serve): 'if God should be served'. Cervantes uses the future subjunctive after 'si' for an open future; modern Spanish says 'si Dios quiere'."}
        note: "Sancho's daughter is Mari Sancha (called Sanchica). In chapter 5 Sancho and his wife Teresa quarrelled over his plan to marry her to a count: Teresa wanted her to marry an equal, which is why it is 'in spite of her mother'."
