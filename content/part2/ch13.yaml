          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "dese", f: "de + ese (that), run together as in old Spanish; modern 'de ese'."}
          - {w: "podía", f: "pod- + -ía → poder (to be able), imperfect, you (vuestra merced, polite 'you' with he/she forms): 'you could (by that logic)'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "vuestra merced", f: "'your grace', the polite 'you', with he/she verb forms; here the subject placed after 'podía echar'."}
          - {w: "hacen y dicen", f: "hac- + -en → hacer (to do), present, they: hago, haces, hace, hacemos, hacéis, hacen; and dic- + -en → decir (to say), present, they: digo, dices, dice, decimos, decís, dicen."}
          - {w: "son", f: "ser (to be), present, they: soy, eres, es, somos, sois, son. Plural to agree with 'estremos', although the subject 'todo cuanto' is singular."}
          - {w: "volverlos a ver", f: "volver (to return) + los (them) + a + ver (to see): 'volver a' + infinitive = to do again, 'to see them again'. The pronoun hangs on the first infinitive, after 'para'."}
          - {w: "ruego", f: "rueg- + -o → rogar (to pray, beg), present, I. The stem o becomes ue when stressed: ruego, ruegas, ruega, rogamos, rogáis, ruegan."}
          - {w: "saque", f: "saqu- + -e → sacar (to take out), present subjunctive, he (God); c becomes qu before e. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. Subjunctive after a verb of praying; the 'que' is left out ('ruego a Dios [que] me saque')."}
          - {w: "mesmo", f: "= mismo (same); neuter 'lo mesmo' = the same thing. Old form."}
