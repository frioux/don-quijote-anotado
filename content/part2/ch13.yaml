        forms:
          - {w: "dé", f: "d- + -é → dar (to give), present subjunctive, he (God): 'may God give'. dar in the present subjunctive: dé, des, dé, demos, deis, den. The subjunctive opening the sentence is a wish."}
          - {w: "sea", f: "ser (to be), present subjunctive, it: 'may it be'. sea, seas, sea, seamos, seáis, sean."}
          - {w: "viniere", f: "vin- + -iere → venir (to come), future subjunctive, it: 'that may come'. Built on the preterite vinieron: viniere, vinieres, viniere, viniéremos, viniereis, vinieren. Cervantes uses it after 'que', 'si', 'donde' for an open future; modern Spanish says 'venga'."}
          - {w: "le trocara", f: "troc- + -ara → trocar (to swap), imperfect subjunctive (-ra form), I, here doing the work of a conditional: 'if I would swap'. The -ra imperfect subjunctive of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran. 'le' (him) is the donkey: Cervantes often uses 'le' for a male animal or thing as object."}
          - {w: "él", f: "'him, it': the horse."}
