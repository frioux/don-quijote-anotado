  - sentences:
      - es: "— Vuestra merced sí que es escudero fiel y legal, moliente y corriente, magnífico y grande, como lo muestra este banquete, que si no ha venido aquí por arte de encantamento, parécelo, a lo menos;"
        literal: "— Your grace yes that is squire faithful and loyal, grinding and running, magnificent and great, as it shows this banquet, which if not it-has come here by art of enchantment, it-seems-it, at the least;"
        ormsby: "“You are a proper trusty squire, one of the right sort, sumptuous and grand, as this banquet shows, which, if it has not come here by magic art, at any rate has the look of it;"
        vocab:
          - {w: "vuestra merced", d: "'your grace', the polite 'you', used with the he/she form of the verb; the ancestor of 'usted'"}
          - {w: "sí que", d: "emphatic: 'you really are, you certainly are'"}
          - {w: "legal", d: "loyal, trustworthy (false friend: not 'lawful' here)"}
          - {w: "moliente y corriente", d: "sound, genuine, the real thing: literally 'grinding and running', said of a mill in working order"}
          - {w: "magnífico", d: "lavish, open-handed"}
          - {w: "arte de encantamento", d: "magic, enchantment"}
          - {w: "encantamento", d: "= encantamiento, enchantment (old form)"}
          - {w: "a lo menos", d: "at least"}
        diagram:
          - s: "Vuestra merced sí que es escudero"
            r: "main verb: your grace really is a squire"
            under:
              - {s: "fiel y legal, moliente y corriente, magnífico y grande", r: "describes 'escudero': faithful and loyal, the genuine article, lavish and grand"}
              - s: "como lo muestra este banquete"
                r: "how we know: as this feast shows"
                under:
                  - s: "parécelo, a lo menos"
                    r: "describes 'banquete': it at least looks it"
                    under:
                      - {s: "si no ha venido aquí por arte de encantamento", r: "condition: if it has not come here by magic"}
        forms:
          - {w: "es", f: "ser (to be), present, you (vuestra merced takes the he/she form): soy, eres, es, somos, sois, son."}
          - {w: "moliente y corriente", f: "present participles (adjectives in -ente) of moler (to grind) and correr (to run): 'grinding and running'."}
          - {w: "muestra", f: "muestr- + -a → mostrar (to show), present, it (the feast). The stem o becomes ue when stressed: muestro, muestras, muestra, mostramos, mostráis, muestran. 'lo' repeats what is shown, and the subject 'este banquete' comes last."}
          - {w: "este", f: "'this', masculine singular to match 'banquete'."}
          - {w: "ha venido", f: "ha → haber (to have), present, it (he, has, ha, hemos, habéis, han) + venido, the participle of venir (to come): the perfect, 'it has come'."}
          - {w: "parécelo", f: "parec- + -e + lo → parecer (to seem), present, it, with 'lo' (it, i.e. to have come by magic) stuck on the end; modern 'lo parece'. Cervantes hangs pronouns on a verb that opens its clause. parecer in the present: parezco, pareces, parece, parecemos, parecéis, parecen."}
          - {w: "encantamento", f: "old form of encantamiento (enchantment), without the i."}
        note: "Sancho piles up pairs of praise words the way he strings proverbs; 'moliente y corriente' is a homely miller's phrase set among grand ones like 'magnífico'."
      - es: "y no como yo, mezquino y malaventurado, que sólo traigo en mis alforjas un poco de queso, tan duro que pueden descalabrar con ello a un gigante, a quien hacen compañía cuatro docenas de algarrobas y otras tantas de avellanas y nueces, mercedes a la estrecheza de mi dueño, y a la opinión que tiene y orden que guarda de que los caballeros andantes no se han de mantener y sustentar sino con frutas secas y con las yerbas del campo."
        literal: "and not like I, wretched and ill-fated, who only I-bring in my saddlebags a little of cheese, so hard that they-can break-the-head with it [to] a giant, to whom make company four dozens of carob-beans and other so-many of hazelnuts and walnuts, thanks to the strictness of my master, and to the opinion that he-has and rule that he-keeps that the knights errant not themselves have to maintain and sustain except with fruits dried and with the herbs of-the field."
        ormsby: "not like me, unlucky beggar, that have nothing more in my alforjas than a scrap of cheese, so hard that one might brain a giant with it, and, to keep it company, a few dozen carobs and as many more filberts and walnuts; thanks to the austerity of my master, and the idea he has and the rule he follows, that knights-errant must not live or sustain themselves on anything except dried fruits and the herbs of the field.”"
        ormsby_note: "The bean of the carob tree; \"St. John's bread.\""
