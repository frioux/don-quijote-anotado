          - {w: "hace", f: "hac- + -e → hacer (to do), present, he/she. Irregular: hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "alguna", f: "algun- + -a → alguno (some), feminine to match 'persona' and 'cosa'."}
          - {w: "hecha", f: "irregular participle of hacer (to do), feminine to match 'cosa': 'a thing well done'."}
