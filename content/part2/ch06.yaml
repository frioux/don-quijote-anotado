          - {w: "desbaratar", d: "to rout, smash, put to flight"}
          - {w: "concha", d: "shell"}
          - {w: "pescado", d: "fish (here used where modern Spanish would say 'pez', a living fish); the shell armour is a fantasy of the romances"}
          - {w: "trujesen", d: "= trajesen, might bring (old form of traer)"}
          - {w: "tajante", d: "cutting, sharp"}
          - {w: "damasquino", d: "of Damascus; Damascus steel was famous for its hardness and wavy pattern"}
          - {w: "porra ferrada", d: "iron-shod club, a mace bound with iron"}
          - {w: "asimismo", d: "likewise, also"}
        diagram:
