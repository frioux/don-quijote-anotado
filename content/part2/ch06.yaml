summary: |
  While Sancho and Teresa are having their talk, the niece and the housekeeper see from a thousand signs that Don Quijote means to slip away a third time, and they try every means to dissuade him, but it is preaching in the desert. The housekeeper threatens to complain loudly to God and the king unless he stays quietly at home instead of wandering the hills like a soul in torment looking for 'adventures', which she calls misfortunes. Don Quijote answers that he does not know what God or His Majesty will reply, but if he were king he would not answer all the pointless petitions he is sent every day, and he would not want his affairs to trouble the king.

  The housekeeper asks whether there are not knights at court, and whether he could not be one of those who serve the king without stirring a step. Don Quijote explains that there must be all kinds: courtiers travel the world on a map without spending a penny or suffering heat, cold, hunger or thirst, while true knights errant measure the earth with their own feet, meet real enemies, and attack them without regard to the niceties of formal duels, such as measuring weapons, searching for relics or sharing out the sun. A good knight must charge ten giants as tall as towers, with eyes like millwheels and armour of fish shells, and princes ought to value this kind of knight above the other, since some have saved whole kingdoms.

  The niece retorts that the books of chivalry are lies and deserve to be branded with a sambenito, if not burned. Don Quijote swears that if she were not his own sister's daughter he would punish her blasphemy; a girl who can barely handle lace-bobbins should not judge the histories of knights, though Amadís, being courteous, would forgive her. Not all who call themselves caballeros are gentlemen in truth: some are gold, some alchemy. The niece marvels that he knows enough to preach in the streets and yet thinks himself brave though old, strong though sick, a righter of wrongs though bent with age, and a caballero though poor.

  Don Quijote answers with a lecture on the four kinds of lineage: those that rose from humble beginnings, like the Ottoman house; those that began great and stayed so; those that began great and dwindled to nothing, like the Pharaohs and the Caesars; and the plebeian majority. True nobility shows in virtue and generosity, and a poor gentleman can prove himself by courtesy and charity. Of the two roads to wealth and honour, letters and arms, he was born under Mars for arms, and he quotes Garcilaso on the rugged path to immortality. The niece exclaims that he is a poet too and could build a house like a cage; he replies that but for chivalry he could make anything, especially cages and toothpicks. Then Sancho knocks at the door; the housekeeper runs to hide, the niece lets him in, and master and squire shut themselves up for another talk.
context: |
  Household and court. Don Quijote's household is the one of Part I chapter 1: a housekeeper past forty, a niece not yet twenty, and the hidalgo himself, near fifty. The housekeeper's threat to cry out to God and the king echoes the subject's right to petition the Crown; the 'memoriales' Don Quijote mentions were the written petitions that flooded the royal secretaries, a stock subject of complaint in Cervantes' day. Cervantes himself sent one in 1590, asking for a post in the Indies, and was turned down. The 'corte' was the king's household and government, settled in Madrid since 1561 apart from the years at Valladolid (1601-1606). The courtier who travels by map is the opposite of the knight errant, and Don Quijote's answer follows the old debate over the active and the idle noble.

  Duels and the romances. The rules Don Quijote waves aside are those of the formal judicial duel: the judges measured the weapons, made each man swear he carried no relics or charms, and placed the fighters so that neither had the sun in his eyes. Ormsby notes that this 'portioning of the sun' already appears in the Poem of the Cid, at the combat between the Cid's champions and the Infantes of Carrión. Against these ceremonies Don Quijote sets the knight of the romances, who charges giants with millwheel eyes and armour of fish shells; he claims to have seen such things 'more than twice', a reminder that in Part I he fought windmills and wineskins as giants.

  The sambenito and the books. The niece's insult is pointed: a sambenito was the yellow tunic that the Inquisition made penitents wear, and afterwards hung in the parish church with their names as a lasting mark of infamy, as Ormsby notes. She proposes it for the books of chivalry 'if they were not burned', recalling the scrutiny of Part I chapter 6, when the priest and the barber burned most of Don Quijote's library and walled up the room. Don Quijote calls her words 'blasfemia' and appeals to Amadís of Gaul, the model knight, famous for courtesy and the protection of damsels.

  Caballero, hidalgo, linaje. As Ormsby warns, 'caballero' means both 'knight' and 'gentleman', and the chapter slides between the senses. The niece says he cannot be a caballero because he is poor: an hidalgo (Ormsby glosses her 'hidalgos' simply as 'hidalgos') had nobility of blood but often little money, and wealth was what made a gentleman visible. Don Quijote's reply, the four kinds of lineage, is a commonplace of the moral literature of the time: fortunes rise and fall, the Ottoman sultans came, by the tradition he follows, from a shepherd, and the Pharaohs, Ptolemies and Caesars have left no traceable heirs. Nobility proved by virtue and 'liberalidad' rather than by blood was a favourite theme of humanist writers, and Don Quijote's praise of the poor gentleman who gives two maravedís cheerfully is also a self-portrait. His division of the roads to honour into letters and arms repeats, in brief, the discourse on arms and letters at the inn in Part I chapters 37-38, and his claim to be born under Mars uses the astrology of the day, which gave each planet a temperament: Mars, war and anger.

  Garcilaso and the narrow road. The narrow path of virtue that leads to life and the broad road of vice that leads to death echo the Gospel image of the strait gate (Matthew 7:13-14), familiar from sermons. The three lines he quotes are, as Ormsby notes, from Garcilaso de la Vega's elegy on the death of Don Bernardino de Toledo, brother of the Duke of Alba. Garcilaso (about 1501-1536), soldier and poet, was for Cervantes' generation the great Castilian poet, so 'el gran poeta castellano nuestro' needed no name. The niece's 'my lord is a poet too' and Don Quijote's boast of making cages and toothpicks bring the lofty speech down to the household, and the chapter title's claim to be 'one of the important chapters of the whole history' is part of the joke.

  Reading Cervantes' Spanish. Obligation and future are expressed with 'haber de' and 'tener de' (ha de responder, has de saber, los ha de acometer, me tengo de quejar, tengo de ir), where modern Spanish uses 'tener que' or the future. The -ra form stands for a conditional (me escusara, dijera, perdonara, admiraran, supiera), the future subjunctive marks open conditions (si fuere posible, el grande que fuere vicioso), and the -se subjunctive is everywhere (diesen, sirviesen, hubiese, viniesen, trujesen). Pronouns hang on the verb at the start of a clause or in commands: Díganos, Válame, Abrióle, encerráronse. Old spellings and forms include vuesa merced (vuestra merced), escusar (excusar), trujesen (trajesen), ferradas (herradas), deste and dello (de este, de ello), llevantan (levantan), agora (ahora), estendiendo (extendiendo), diminuido (disminuido), decendientes (descendientes), recebir (recibir) and do (donde). Watch the false friends: plática (conversation), impertinente (irrelevant), memorial (petition), salud (salvation), especie (kind), continente (bearing), oficioso (obliging) and curiosidad (fine handiwork).
