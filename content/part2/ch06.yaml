      - es: "advierta vuestra merced que todo eso que dice de los caballeros andantes es fábula y mentira, y sus historias, ya que no las quemasen, merecían que a cada una se le echase un sambenito, o alguna señal en que fuese conocida por infame y por gastadora de las buenas costumbres."
        literal: "let-note your grace that all that which you-say of the knights errant is fable and lie, and their histories, even-if not them they-burned, deserved that to each one one-should-put on-it a penitent's-tunic, or some mark in which it-might-be known as infamous and as spoiler of the good customs."
        ormsby: "“remember that all this you are saying about knights-errant is fable and fiction; and their histories, if indeed they were not burned, would deserve, each of them, to have a sanbenito put on it, or some mark by which it might be known as infamous and a corrupter of good manners.”"
        ormsby_note: "The garment worn by penitents, who have been tried by the Inquisition and have confessed."
        vocab:
          - {w: "advertir", d: "to note, bear in mind (false friend: not 'to advertise')"}
          - {w: "fábula", d: "fable, invented tale"}
          - {w: "ya que", d: "here 'even if, granted that' (old concessive sense), not modern 'since'"}
          - {w: "merecer", d: "to deserve"}
          - {w: "echar", d: "to throw; here to put on, impose (a garment, a mark)"}
          - {w: "sambenito", d: "the penitent's tunic the Inquisition made the reconciled wear; a badge of disgrace"}
          - {w: "señal", d: "mark, sign"}
          - {w: "infame", d: "infamous, disgraceful"}
          - {w: "gastador", d: "spoiler, corrupter (from 'gastar', to wear out, spoil); also 'spendthrift'"}
          - {w: "buenas costumbres", d: "good morals, decent behaviour; 'costumbres' = customs, habits, hence morals"}
        diagram:
          - s: "advierta vuestra merced"
            r: "main verb: let your grace note (polite command)"
            under:
              - {s: "que todo eso que dice de los caballeros andantes es fábula y mentira", r: "what to note, 1: that all you say of knights errant is fable and lies"}
              - s: "merecían"
                r: "what to note, 2 (verb): deserved"
                under:
                  - {s: "y sus historias", r: "subject: and their histories"}
                  - {s: "ya que no las quemasen", r: "concession: even if they were not burned"}
                  - {s: "que a cada una se le echase un sambenito", r: "what they deserved: that each one be given a penitent's tunic"}
                  - s: "o alguna señal"
                    r: "or what: or some mark"
                    under:
                      - {s: "en que fuese conocida por infame y por gastadora de las buenas costumbres", r: "describes 'señal': by which it might be known as infamous and a corrupter of morals"}
        forms:
          - {w: "advierta", f: "adviert- + -a → advertir (to note, bear in mind), present subjunctive, you (vuestra merced takes the he/she form): the polite command. The stem e becomes ie when stressed: advierta, adviertas, advierta, advirtamos, advirtáis, adviertan."}
          - {w: "eso", f: "neuter 'that', standing for a whole idea rather than a noun."}
          - {w: "dice", f: "dic- + -e → decir (to say), present, you (vuestra merced). Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "quemasen", f: "quem- + -asen → quemar (to burn), imperfect subjunctive (-se form), they (people in general). The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. 'las' = them, feminine plural to match 'historias'."}
          - {w: "merecían", f: "merec- + -ían → merecer (to deserve), imperfect, they (the histories), used for 'would deserve'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "se le echase", f: "ech- + -ase → echar (to put on), imperfect subjunctive (-se form), one, with impersonal 'se' (one) and 'le' (on it, each history): 'that one should put on it'. echase, echases, echase, echásemos, echaseis, echasen. Subjunctive after 'merecer que' (to deserve that)."}
          - {w: "fuese conocida", f: "fu- + -ese → ser (to be), imperfect subjunctive (-se form), it: fuese, fueses, fuese, fuésemos, fueseis, fuesen; + conocida, participle of conocer (to know), feminine to match 'cada una' (each history): the passive 'might be known'."}
          - {w: "gastadora", f: "gasta- + -dora → gastador (spoiler), from gastar (to wear out, spoil); -dor makes a noun for the doer, -dora its feminine, to match 'historia'."}
          - {w: "buenas", f: "buen- + -as → bueno (good), feminine plural to match 'costumbres'."}
        note: "The niece speaks of the books as if they were heretics: the Inquisition burned the condemned and made the reconciled wear the sambenito, which was later hung in the parish church as a lasting mark of shame. In Part I, chapters 6 and 7, she and the housekeeper had in fact burned most of her uncle's library."
  - sentences:
      - es: "— Por el Dios que me sustenta —dijo don Quijote—, que si no fueras mi sobrina derechamente, como hija de mi misma hermana, que había de hacer un tal castigo en ti, por la blasfemia que has dicho, que sonara por todo el mundo."
        literal: "— By the God who me sustains —said Don Quijote—, that if not you-were my niece directly, as daughter of my same sister, that I-was-to make a such punishment on you, for the blasphemy that you-have said, that it-would-resound through all the world."
        ormsby: "“By the God that gives me life,” said Don Quixote, “if thou wert not my full niece, being daughter of my own sister, I would inflict a chastisement upon thee for the blasphemy thou hast uttered that all the world should ring with."
        vocab:
          - {w: "por el Dios que me sustenta", d: "an oath: by the God who keeps me alive"}
          - {w: "sustentar", d: "to sustain, keep alive, feed"}
          - {w: "derechamente", d: "directly; here 'by blood, fully' (a full niece)"}
          - {w: "mi misma hermana", d: "my own sister"}
          - {w: "haber de", d: "to have to, be going to; 'había de hacer' = I would have to do, I would do"}
          - {w: "castigo", d: "punishment, chastisement"}
          - {w: "blasfemia", d: "blasphemy: to Don Quijote an insult to chivalry is sacrilege"}
          - {w: "sonar", d: "to sound, ring out, be talked about"}
          - {w: "que (repeated)", d: "the extra 'que' after an oath or a long clause just restarts the sentence; English drops it"}
        diagram:
          - s: "que había de hacer un tal castigo en ti"
            r: "main verb (after the oath): I would inflict such a punishment on you"
            under:
              - {s: "Por el Dios que me sustenta", r: "oath: by the God who keeps me alive"}
              - {s: "dijo don Quijote", r: "speech tag: said Don Quijote"}
              - s: "si no fueras mi sobrina derechamente"
                r: "condition: if you were not my niece by blood"
                under:
                  - {s: "como hija de mi misma hermana", r: "how: as the daughter of my own sister"}
              - {s: "por la blasfemia que has dicho", r: "why: for the blasphemy you have spoken"}
              - {s: "que sonara por todo el mundo", r: "describes 'castigo': that would ring through the whole world"}
        forms:
          - {w: "sustenta", f: "sustent- + -a → sustentar (to sustain), present, he (God). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "fueras", f: "fu- + -eras → ser (to be), imperfect subjunctive (-ra form), you: fuera, fueras, fuera, fuéramos, fuerais, fueran. Subjunctive in an 'if' clause contrary to fact. Don Quijote now speaks to his niece as 'tú'."}
          - {w: "derechamente", f: "derecha + -mente → adverb from derecho (straight, direct): 'directly'."}
          - {w: "misma", f: "mism- + -a → mismo (same, own), feminine to match 'hermana'."}
          - {w: "había de hacer", f: "hab- + -ía → haber (to have), imperfect, I: había, habías, había, habíamos, habíais, habían. 'haber de' + infinitive = to have to, be going to; the imperfect stands here for the conditional, 'I would'. hacer (to make, inflict) is the infinitive."}
          - {w: "un tal castigo", f: "'such a punishment', with the article before 'tal'; modern Spanish says 'tal castigo' or 'un castigo tal'."}
          - {w: "has dicho", f: "has → haber (to have), present, you: he, has, ha, hemos, habéis, han; + dicho, irregular participle of decir (to say): 'you have said'."}
          - {w: "sonara", f: "son- + -ara → sonar (to sound), imperfect subjunctive (-ra form), it (the punishment): sonara, sonaras, sonara, sonáramos, sonarais, sonaran. Subjunctive because the punishment is only imagined."}
