        ormsby: "On the contrary, he must attack and fall upon them with a gallant bearing and a fearless heart, and, if possible, vanquish and destroy them, even though they have for armour the shells of a certain fish, that they say are harder than diamonds, and in place of swords wield trenchant blades of Damascus steel, or clubs studded with spikes also of steel, such as I have more than once seen."
        vocab:
          - {w: "antes", d: "on the contrary, rather (after a negative)"}
          - {w: "gentil continente", d: "gallant bearing, fine countenance ('gentil' = fine, noble; 'continente' = bearing, mien, not 'continent')"}
