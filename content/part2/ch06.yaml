              - s: "aunque viniesen armados de unas conchas de un cierto pescado"
                r: "concession, 1: even if they came armoured in the shells of a certain fish"
                under:
                  - {s: "que dicen que son más duras que si fuesen de diamantes", r: "describes 'conchas': which they say are harder than if made of diamonds"}
              - s: "y en lugar de espadas trujesen cuchillos tajantes de damasquino acero"
                r: "concession, 2: and instead of swords carried cutting blades of Damascus steel"
                under:
                  - {s: "o porras ferradas con puntas asimismo de acero", r: "or: or iron-bound clubs with spikes, also of steel"}
                  - {s: "como yo las he visto más de dos veces", r: "aside: as I have seen them more than twice"}
        forms:
          - {w: "gentil, intrépido", f: "adjectives placed before the noun for literary effect: gentil continente, intrépido corazón."}
          - {w: "los ha de acometer", f: "h- + -a → haber (to have), present, he: he, has, ha, hemos, habéis, han. 'ha de' + acometer (to attack) and embestir (to charge) = 'he must attack and charge'; 'los' = them (the giants)."}
          - {w: "fuere", f: "fu- + -ere → ser (to be), future subjunctive, it: 'if it should be'. Built on the preterite fueron: fuere, fueres, fuere, fuéremos, fuereis, fueren. Cervantes uses it after 'si' for an open future; modern Spanish says 'si es posible'."}
          - {w: "vencerlos, desbaratarlos", f: "vencer (to defeat) and desbaratar (to rout), each with 'los' (them) hung on the end; both still depend on 'ha de'."}
          - {w: "viniesen", f: "vin- + -iesen → venir (to come), imperfect subjunctive (-se form), they. Built on the preterite vinieron: viniese, vinieses, viniese, viniésemos, vinieseis, viniesen. Subjunctive after 'aunque' for a supposition."}
          - {w: "armados", f: "arm- + -ados → armar (to arm), participle, masculine plural to match the giants."}
          - {w: "dicen", f: "dic- + -en → decir (to say), present, they (people). Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "son", f: "ser (to be), present, they (the shells). Irregular: soy, eres, es, somos, sois, son."}
          - {w: "duras", f: "duro (hard), feminine plural to match 'conchas'."}
          - {w: "fuesen", f: "fu- + -esen → ser (to be), imperfect subjunctive (-se form), they: fuese, fueses, fuese, fuésemos, fueseis, fuesen. After 'como si' / 'que si' (as if)."}
          - {w: "trujesen", f: "truj- + -esen → traer (to bring), imperfect subjunctive (-se form), they; old stem truj- for modern traj-: trujese, trujeses, trujese, trujésemos, trujeseis, trujesen (modern trajese)."}
          - {w: "ferradas", f: "ferr- + -adas → ferrar (to shoe with iron), participle, feminine plural to match 'porras'; old f- where modern Spanish has 'herrar'."}
