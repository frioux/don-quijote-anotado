part: 2
chapter: 6
title_es: "Capítulo VI. De lo que le pasó a Don Quijote con su sobrina y con su ama, y es uno de los importantes capítulos de toda la historia"
title_en: "Of what took place between Don Quixote and his niece and housekeeper; one of the most important chapters in the whole history"
paragraphs:
  - sentences:
      - es: "En tanto que Sancho Panza y su mujer Teresa Cascajo pasaron la impertinente referida plática, no estaban ociosas la sobrina y el ama de don Quijote, que por mil señales iban coligiendo que su tío y señor quería desgarrarse la vez tercera, y volver al ejercicio de su, para ellas, mal andante caballería:"
        literal: "In while that Sancho Panza and his wife Teresa Cascajo passed the irrelevant aforesaid conversation, not were idle the niece and the housekeeper of Don Quijote, who by a-thousand signs were-going gathering that their uncle and master wanted to-break-loose the time third, and to-return to-the exercise of his, for them, ill errant chivalry:"
        ormsby: "While Sancho Panza and his wife, Teresa Cascajo, held the above irrelevant conversation, Don Quixote’s niece and housekeeper were not idle, for by a thousand signs they began to perceive that their uncle and master meant to give them the slip the third time, and once more betake himself to his, for them, ill-errant chivalry."
        vocab:
          - {w: "en tanto que", d: "while, during the time that"}
          - {w: "impertinente", d: "irrelevant, beside the point (the old sense; not 'cheeky')"}
          - {w: "referido", d: "aforesaid, just related"}
          - {w: "plática", d: "conversation, talk (false friend: not 'practice')"}
          - {w: "ocioso", d: "idle, doing nothing"}
          - {w: "ama", d: "housekeeper (of a priest's or bachelor's house); also 'mistress, nurse'"}
          - {w: "coligir", d: "to gather, deduce, infer (literary)"}
          - {w: "desgarrarse", d: "to break loose, run off (literally 'to tear oneself away')"}
          - {w: "la vez tercera", d: "the third time; this will be his third sally"}
          - {w: "ejercicio", d: "practice, profession (false friend: not 'exercise' in the gym sense)"}
          - {w: "mal andante", d: "pun on 'bien andante' (fortunate) and 'andante' (errant): ill-errant, ill-starred chivalry"}
        diagram:
          - s: "no estaban ociosas"
            r: "main verb: were not idle"
            under:
              - s: "En tanto que Sancho Panza y su mujer Teresa Cascajo pasaron la impertinente referida plática"
                r: "when: while Sancho and Teresa had that irrelevant talk"
              - s: "la sobrina y el ama de don Quijote"
                r: "subject: the niece and the housekeeper"
                under:
                  - s: "que por mil señales iban coligiendo"
                    r: "describes them: who by a thousand signs were gathering"
                    under:
                      - {s: "que su tío y señor quería desgarrarse la vez tercera", r: "what they gathered, 1: that their uncle and master meant to run off a third time"}
                      - {s: "y volver al ejercicio de su, para ellas, mal andante caballería", r: "what they gathered, 2: and go back to his (for them, ill-starred) chivalry"}
        forms:
          - {w: "pasaron", f: "pas- + -aron → pasar (to pass, spend), preterite, they (Sancho and Teresa): 'held, carried on'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "estaban ociosas", f: "est- + -aban → estar (to be), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. ociosas: feminine plural to match 'la sobrina y el ama' (two women; 'el ama' takes 'el' only because the noun begins with stressed a-)."}
          - {w: "iban coligiendo", f: "ib- + -an → ir (to go), imperfect, they. Irregular: iba, ibas, iba, íbamos, ibais, iban. + coligiendo, gerund of coligir (to infer), with e → i in the stem: ir (to go) + gerund = 'were gradually gathering'."}
          - {w: "quería", f: "quer- + -ía → querer (to want), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "desgarrarse", f: "desgarrar (to tear away) + se (himself), the pronoun hung on the infinitive after 'quería'."}
          - {w: "al", f: "a + el, 'to the'."}
          - {w: "su, para ellas, mal andante", f: "su = his (singular to match 'caballería'); 'para ellas' (for them, the women) is slipped between the possessive and its noun; mal = malo (bad) clipped, here an adverb, 'ill'."}
        note: "This is the third sally: the first was in Part I chapters 2-5, the second from chapter 7 to the end of Part I. 'Teresa Cascajo' is Sancho's wife, who in the previous chapter said she should rightly bear her father's surname, Cascajo."
      - es: "procuraban por todas las vías posibles apartarle de tan mal pensamiento, pero todo era predicar en desierto y majar en hierro frío."
        literal: "they-tried by all the ways possible to-turn-aside-him from so bad thought, but all was to-preach in desert and to-hammer on iron cold."
        ormsby: "They strove by all the means in their power to divert him from such an unlucky scheme; but it was all preaching in the desert and hammering cold iron."
        vocab:
          - {w: "procurar", d: "to try, endeavour (not 'to procure')"}
          - {w: "vía", d: "way, means"}
          - {w: "apartar de", d: "to turn (someone) away from, dissuade"}
          - {w: "predicar en desierto", d: "proverb: to preach in the desert, waste words on someone who will not listen"}
          - {w: "majar en hierro frío", d: "proverb: to hammer cold iron, labour in vain ('majar' = to pound, beat)"}
        diagram:
          - s: "procuraban"
            r: "main verb 1: they (the women) tried"
            under:
              - {s: "por todas las vías posibles", r: "how: by every possible means"}
              - s: "apartarle"
                r: "what they tried: to turn him away"
                under:
                  - {s: "de tan mal pensamiento", r: "from what: from so bad an idea"}
          - s: "pero todo era"
            r: "main verb 2: but it was all"
            under:
              - {s: "predicar en desierto y majar en hierro frío", r: "what it was: preaching in the desert and hammering cold iron"}
        forms:
          - {w: "procuraban", f: "procur- + -aban → procurar (to try), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "apartarle", f: "apartar (to turn aside) + le (him), the pronoun hung on the infinitive; 'le' for a male person, as Castilian regularly allows."}
          - {w: "tan mal", f: "mal = malo (bad) clipped before a masculine singular noun ('pensamiento'), like buen, gran, algún; tan = so."}
          - {w: "era", f: "ser (to be), imperfect, it. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "predicar, majar", f: "infinitives used as nouns: predicar (to preach) and majar (to pound), 'preaching' and 'hammering'."}
      - es: "Con todo esto, entre otras muchas razones que con él pasaron, le dijo el ama:"
        literal: "With all this, among other many arguments that with him passed, to-him said the housekeeper:"
        ormsby: "Nevertheless, among many other representations made to him, the housekeeper said to him,"
        vocab:
          - {w: "con todo esto", d: "nevertheless, even so"}
          - {w: "razones", d: "words, arguments, things said (not only 'reasons')"}
          - {w: "pasar razones con", d: "to exchange words with"}
        diagram:
          - s: "le dijo el ama:"
            r: "main verb: the housekeeper said to him"
            under:
              - {s: "Con todo esto", r: "linking: even so"}
              - s: "entre otras muchas razones"
                r: "when: among many other words"
                under:
                  - {s: "que con él pasaron", r: "describes 'razones': that passed between them and him"}
        forms:
          - {w: "otras muchas", f: "otro (other) and mucho (many), both feminine plural to match 'razones'; Spanish puts 'otras' first where English says 'many other'."}
          - {w: "pasaron", f: "pas- + -aron → pasar (to pass), preterite, they (the words). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "le dijo", f: "dij- + -o → decir (to say), preterite, she. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron. le = to him; the subject 'el ama' comes after the verb."}
  - sentences:
      - es: "— En verdad, señor mío, que si vuesa merced no afirma el pie llano y se está quedo en su casa, y se deja de andar por los montes y por los valles como ánima en pena, buscando esas que dicen que se llaman aventuras, a quien yo llamo desdichas, que me tengo de quejar en voz y en grita a Dios y al rey, que pongan remedio en ello."
        literal: "— In truth, sir mine, that if your-grace not plants the foot flat and himself stays still in his house, and himself leaves-off from going through the mountains and through the valleys like soul in pain, seeking those that they-say that themselves call adventures, which I call misfortunes, that myself I-have to complain in voice and in outcry to God and to-the king, that they-may-put remedy in it."
        ormsby: "“In truth, master, if you do not keep still and stay quiet at home, and give over roaming mountains and valleys like a troubled spirit, looking for what they say are called adventures, but what I call misfortunes, I shall have to make complaint to God and the king with loud supplication to send some remedy.”"
        vocab:
          - {w: "vuesa merced", d: "= vuestra merced, 'your grace', the polite 'you' (ancestor of 'usted'); takes he/she verb forms"}
          - {w: "afirmar el pie llano", d: "to plant one's foot flat, i.e. stay put, settle down"}
          - {w: "estarse quedo", d: "to keep still, stay quiet"}
          - {w: "dejarse de", d: "to give up, leave off (doing)"}
          - {w: "ánima en pena", d: "a soul in torment, a soul in Purgatory said to wander and haunt the living"}
          - {w: "desdicha", d: "misfortune, mishap"}
          - {w: "tener de", d: "= tener que, to have to (old form)"}
          - {w: "en voz y en grita", d: "aloud and with shouting, with loud outcry ('grita' = shouting, uproar)"}
          - {w: "poner remedio en", d: "to put a stop to, remedy"}
        diagram:
          - s: "me tengo de quejar"
            r: "main verb: I shall have to complain"
            under:
              - {s: "En verdad, señor mío, que", r: "opening: truly, sir ('que' only adds emphasis)"}
              - s: "si vuesa merced no afirma el pie llano"
                r: "condition, 1: if you do not settle down"
                under:
                  - {s: "y se está quedo en su casa", r: "condition, 2: and stay quietly at home"}
                  - s: "y se deja de andar por los montes y por los valles"
                    r: "condition, 3: and give up roaming mountains and valleys"
                    under:
                      - {s: "como ánima en pena", r: "how: like a soul in torment"}
                      - s: "buscando esas"
                        r: "how: looking for those things"
                        under:
                          - {s: "que dicen que se llaman aventuras", r: "describes 'esas': which they say are called adventures"}
                          - {s: "a quien yo llamo desdichas", r: "describes 'esas', 2: which I call misfortunes"}
              - {s: "en voz y en grita", r: "how: with loud outcry"}
              - {s: "a Dios y al rey", r: "to whom: to God and the king"}
              - {s: "que pongan remedio en ello", r: "purpose: that they put a stop to it"}
        forms:
          - {w: "afirma", f: "afirm- + -a → afirmar (to plant firmly), present, you (vuesa merced takes the he/she form). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "se está quedo", f: "est- + -á → estarse (to stay), present, you (vuesa merced), with 'se': 'you keep yourself'. Irregular: estoy, estás, está, estamos, estáis, están. quedo (still) masculine to match the master."}
          - {w: "se deja", f: "dej- + -a → dejarse (to leave off), present, you (vuesa merced), with 'se'. Same -ar present: -o, -as, -a, -amos, -áis, -an."}
          - {w: "buscando", f: "gerund of buscar (to seek): 'looking for'."}
          - {w: "esas", f: "ese (that), feminine plural to match the 'aventuras' it points ahead to."}
          - {w: "dicen", f: "dic- + -en → decir (to say), present, they (people). Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "se llaman", f: "llam- + -an → llamarse (to be called), present, they. Same -ar present: -o, -as, -a, -amos, -áis, -an."}
          - {w: "a quien", f: "'whom', here used for things (the adventures); Cervantes uses 'quien' for things and for plurals where modern Spanish says 'a las que'."}
          - {w: "llamo", f: "llam- + -o → llamar (to call), present, I."}
          - {w: "me tengo de quejar", f: "teng- + -o → tener (to have), present, I: tengo, tienes, tiene, tenemos, tenéis, tienen. 'tener de' + infinitive = modern 'tener que', to have to; quejarse (to complain) with its 'me' pulled in front of the whole group."}
          - {w: "pongan", f: "pong- + -an → poner (to put), present subjunctive, they (God and the king): 'that they may put'. Irregular: ponga, pongas, ponga, pongamos, pongáis, pongan. Subjunctive of purpose after 'que'."}
          - {w: "ello", f: "'it', the neuter pronoun for a whole situation (his wandering)."}
        note: "The housekeeper threatens to petition God and the king, as subjects did by sending 'memoriales' (written petitions) to the court. Don Quijote picks up the idea in his answer."
  - sentences:
      - es: "A lo que respondió don Quijote:"
        literal: "To that which answered Don Quijote:"
        ormsby: "To which Don Quixote replied,"
        vocab:
          - {w: "a lo que", d: "to which, whereupon"}
        diagram:
          - s: "respondió don Quijote:"
            r: "main verb: Don Quijote answered"
            under:
              - {s: "A lo que", r: "to what: to which (to what she said)"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "lo que", f: "'that which': lo (the neuter article) + que, standing for the housekeeper's whole speech."}
  - sentences:
      - es: "— Ama, lo que Dios responderá a tus quejas yo no lo sé, ni lo que ha de responder Su Majestad tampoco, y sólo sé que si yo fuera rey, me escusara de responder a tanta infinidad de memoriales impertinentes como cada día le dan;"
        literal: "— Housekeeper, that which God will-answer to your complaints I not it know, nor that which has to answer His Majesty either, and only I-know that if I were king, myself I-would-excuse from answering to so-much infinity of petitions irrelevant as each day to-him they-give;"
        ormsby: "“What answer God will give to your complaints, housekeeper, I know not, nor what his Majesty will answer either; I only know that if I were king I should decline to answer the numberless silly petitions they present every day;"
        vocab:
          - {w: "queja", d: "complaint"}
          - {w: "Su Majestad", d: "His Majesty, the king (Philip III when Part II appeared in 1615)"}
          - {w: "haber de", d: "to be going to, to have to; 'ha de responder' = will answer, is to answer"}
          - {w: "escusarse de", d: "= excusarse de, to excuse oneself from, decline (old spelling with s)"}
          - {w: "memorial", d: "written petition presented to the king or a minister (false friend: not a monument)"}
          - {w: "impertinente", d: "irrelevant, pointless, tiresome"}
        diagram:
          - s: "yo no lo sé"
            r: "main verb 1: I do not know it"
            under:
              - {s: "lo que Dios responderá a tus quejas", r: "object, put first: what God will answer to your complaints"}
              - {s: "ni lo que ha de responder Su Majestad tampoco", r: "object, 2: nor what His Majesty will answer either"}
          - s: "y sólo sé"
            r: "main verb 2: and I only know"
            under:
              - s: "que si yo fuera rey, me escusara"
                r: "what I know: that if I were king I would excuse myself"
                under:
                  - s: "de responder a tanta infinidad de memoriales impertinentes"
                    r: "from what: from answering such an endless number of pointless petitions"
                    under:
                      - {s: "como cada día le dan", r: "describes the petitions: as they hand him every day"}
        forms:
          - {w: "responderá", f: "responder- + -á → responder (to answer), future, he (God). The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "tus", f: "tu (your, familiar), plural to match 'quejas'. He uses 'tú' to his servant."}
          - {w: "lo sé, sé", f: "sé → saber (to know), present, I. Irregular: sé, sabes, sabe, sabemos, sabéis, saben. 'lo' repeats the object already put first ('lo que Dios responderá')."}
          - {w: "ha de responder", f: "h- + -a → haber (to have), present, he (His Majesty): he, has, ha, hemos, habéis, han. 'haber de' + responder (to answer) = 'is to answer, will answer'."}
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), I: 'if I were'. Built on the preterite fueron: fuera, fueras, fuera, fuéramos, fuerais, fueran."}
          - {w: "me escusara", f: "escus- + -ara → escusarse (to excuse oneself), -ra form used as a conditional, I: 'I would excuse myself'. The -ra form of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran. Modern Spanish would say 'me excusaría'."}
          - {w: "tanta ... como", f: "tanto (so much), feminine to match 'infinidad'; 'tanta ... como' = as many ... as."}
          - {w: "le dan", f: "d- + -an → dar (to give), present, they (people in general). Irregular: doy, das, da, damos, dais, dan. le = to him, the king."}
      - es: "que uno de los mayores trabajos que los reyes tienen, entre otros muchos, es el estar obligados a escuchar a todos y a responder a todos;"
        literal: "for one of the greatest labours that the kings have, among others many, is the being obliged to listen to all and to answer to all;"
        ormsby: "for one of the greatest among the many troubles kings have is being obliged to listen to all and answer all,"
        vocab:
          - {w: "que", d: "here 'for, since', giving the reason"}
          - {w: "trabajo", d: "hardship, burden, trouble (the old sense), not only 'work'"}
          - {w: "estar obligado a", d: "to be obliged to"}
        diagram:
          - s: "es"
            r: "main verb (after 'que', for): is"
            under:
              - s: "uno de los mayores trabajos"
                r: "subject: one of the greatest burdens"
                under:
                  - {s: "que los reyes tienen", r: "describes 'trabajos': that kings have"}
                  - {s: "entre otros muchos", r: "among many others"}
              - {s: "el estar obligados a escuchar a todos y a responder a todos", r: "what it is: being obliged to listen to everyone and answer everyone"}
        forms:
          - {w: "mayores", f: "mayor (greater, greatest), the irregular comparative of grande (big), plural to match 'trabajos'; with 'los' it means 'the greatest'."}
          - {w: "tienen", f: "tien- + -en → tener (to have), present, they (the kings). Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "otros muchos", f: "otro (other) and mucho (many), masculine plural to match the 'trabajos' understood."}
          - {w: "es", f: "ser (to be), present, it. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "el estar obligados", f: "el + estar (to be), an infinitive used as a noun, 'the being'; obligados, participle of obligar (to oblige), masculine plural to match 'los reyes'."}
          - {w: "a todos", f: "'a' marks persons as objects of escuchar (to listen to) and responder (to answer); todos = everyone."}
      - es: "y así, no querría yo que cosas mías le diesen pesadumbre."
        literal: "and so, not would-want I that things mine to-him might-give grief."
        ormsby: "and therefore I should be sorry that any affairs of mine should worry him.”"
        vocab:
          - {w: "y así", d: "and so, therefore"}
          - {w: "pesadumbre", d: "grief, trouble, annoyance"}
          - {w: "dar pesadumbre", d: "to trouble, worry (someone)"}
        diagram:
          - s: "no querría yo"
            r: "main verb: I would not want"
            under:
              - {s: "y así", r: "linking: and so"}
              - {s: "que cosas mías le diesen pesadumbre", r: "what I would not want: that my affairs should trouble him (the king)"}
        forms:
          - {w: "querría", f: "querr- + -ía → querer (to want), conditional, I: 'I would want'. Irregular stem querr-: querría, querrías, querría, querríamos, querríais, querrían."}
          - {w: "mías", f: "mío (mine), feminine plural to match 'cosas'; placed after the noun, 'things of mine'."}
          - {w: "diesen", f: "d- + -iesen → dar (to give), imperfect subjunctive (-se form), they (the things). Built on the preterite dieron: diese, dieses, diese, diésemos, dieseis, diesen. Subjunctive after 'no querría que' (I would not want that)."}
  - sentences:
      - es: "A lo que dijo el ama:"
        literal: "To that which said the housekeeper:"
        ormsby: "Whereupon the housekeeper said,"
        vocab:
          - {w: "a lo que", d: "to which, whereupon"}
        diagram:
          - s: "dijo el ama:"
            r: "main verb: the housekeeper said"
            under:
              - {s: "A lo que", r: "to what: in answer to which"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, she. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "el ama", f: "'el' before a feminine noun beginning with stressed a- (ama, agua, alma); the noun is still feminine."}
  - sentences:
      - es: "— Díganos, señor: en la corte de Su Majestad, ¿no hay caballeros?"
        literal: "— Tell-us, sir: in the court of His Majesty, not are-there knights?"
        ormsby: "“Tell us, señor, at his Majesty’s court are there no knights?”"
        vocab:
          - {w: "corte", d: "the royal court (in Madrid, briefly Valladolid around 1601-1606)"}
          - {w: "caballero", d: "knight; also gentleman, nobleman"}
        diagram:
          - s: "Díganos, señor:"
            r: "main verb 1: tell us, sir"
          - s: "¿no hay caballeros?"
            r: "main verb 2: are there no knights?"
            under:
              - {s: "en la corte de Su Majestad", r: "where: at His Majesty's court"}
        forms:
          - {w: "Díganos", f: "dig- + -a + nos → decir (to say), present subjunctive used as a polite command, you (vuesa merced), with 'nos' (us) stuck on the end; the accent keeps the stress on 'Dí-'. Irregular: diga, digas, diga, digamos, digáis, digan."}
          - {w: "hay", f: "the special 'there is / there are' form of haber (to have); it does not change for plural 'caballeros'."}
  - sentences:
      - es: "— Sí —respondió don Quijote—, y muchos; y es razón que los haya, para adorno de la grandeza de los príncipes y para ostentación de la majestad real."
        literal: "— Yes —answered Don Quijote—, and many; and it-is reason that them there-be, for adornment of the greatness of the princes and for display of the majesty royal."
        ormsby: "“There are,” replied Don Quixote, “and plenty of them; and it is right there should be, to set off the dignity of the prince, and for the greater glory of the king’s majesty.”"
        vocab:
          - {w: "es razón que", d: "it is right that, it is fitting that"}
          - {w: "adorno", d: "adornment, ornament"}
          - {w: "ostentación", d: "display, show of splendour"}
          - {w: "real", d: "royal (from 'rey'), not 'real'"}
        diagram:
          - s: "Sí"
            r: "answer: yes (there are)"
            under:
              - {s: "respondió don Quijote", r: "speech tag: Don Quijote answered"}
              - {s: "y muchos", r: "and many of them"}
          - s: "y es razón"
            r: "main verb 2: and it is right"
            under:
              - s: "que los haya"
                r: "what is right: that there should be some"
                under:
                  - {s: "para adorno de la grandeza de los príncipes", r: "why, 1: to adorn the greatness of princes"}
                  - {s: "para ostentación de la majestad real", r: "why, 2: to display the royal majesty"}
        forms:
