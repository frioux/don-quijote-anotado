        forms:
          - {w: "Válame", f: "val- + -a + me → valer (to help, protect), present subjunctive, he (God), with 'me' stuck on the end: 'may God help me'. Old forms vala, valas, vala, valamos, valáis, valan; modern valga, valgas, valga, valgamos, valgáis, valgan. A subjunctive of wish opening the sentence takes its pronoun on the end."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, she. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
      - es: "¡Que sepa vuestra merced tanto, señor tío, que, si fuese menester en una necesidad, podría subir en un púlpito e irse a predicar por esas calles, y que, con todo esto, dé en una ceguera tan grande y en una sandez tan conocida, que se dé a entender que es valiente, siendo viejo, que tiene fuerzas, estando enfermo, y que endereza tuertos, estando por la edad agobiado, y, sobre todo, que es caballero, no lo siendo;"
        literal: "That may-know your grace so-much, lord uncle, that, if it-were needful in a need, you-could climb into a pulpit and go-off to preach through those streets, and that, with all this, you-may-fall into a blindness so great and into a folly so known, that you-give-yourself to understand that you-are brave, being old, that you-have strength, being sick, and that you-straighten wrongs, being by the age bowed, and, above all, that you-are knight, not it being;"
        ormsby: "“that you should know so much, uncle—enough, if need be, to get up into a pulpit and go preach in the streets—and yet that you should fall into a delusion so great and a folly so manifest as to try to make yourself out vigorous when you are old, strong when you are sickly, able to put straight what is crooked when you yourself are bent by age, and, above all, a caballero when you are not one;"
        vocab:
          - {w: "¡Que sepa!", d: "to think that you know!: 'que' + subjunctive as an exclamation of wonder"}
          - {w: "señor tío", d: "uncle, with the respectful 'señor'"}
          - {w: "en una necesidad", d: "at a pinch, if need arose"}
          - {w: "e", d: "= y (and), written e before a word beginning with i-"}
          - {w: "dar en", d: "to fall into (an error, a mania)"}
          - {w: "ceguera", d: "blindness"}
          - {w: "sandez", d: "folly, stupidity"}
          - {w: "conocido", d: "here obvious, notorious"}
          - {w: "darse a entender", d: "to persuade oneself, make oneself believe"}
          - {w: "enderezar tuertos", d: "to right wrongs, the knight-errant's formula; 'tuerto' = wrong, injury (literally 'crooked'), so the niece plays on straightening"}
          - {w: "agobiado", d: "bent, bowed down"}
        diagram:
          - s: "¡Que sepa vuestra merced tanto"
            r: "main exclamation 1: to think your grace knows so much"
            under:
              - {s: "señor tío", r: "address: uncle"}
              - {s: "que, si fuese menester en una necesidad, podría subir en un púlpito", r: "result of 'tanto': that if need be you could climb into a pulpit"}
              - {s: "e irse a predicar por esas calles", r: "result, 2: and go off to preach in the streets"}
          - s: "y que, con todo esto, dé en una ceguera tan grande"
            r: "main exclamation 2: and that, with all this, you fall into such great blindness"
            under:
              - {s: "y en una sandez tan conocida", r: "and into what else: such obvious folly"}
              - s: "que se dé a entender"
                r: "result: that you make yourself believe"
                under:
                  - {s: "que es valiente, siendo viejo", r: "belief 1: that you are brave, though old"}
                  - {s: "que tiene fuerzas, estando enfermo", r: "belief 2: that you are strong, though sick"}
                  - {s: "y que endereza tuertos, estando por la edad agobiado", r: "belief 3: that you right wrongs, though bent with age"}
                  - {s: "y, sobre todo, que es caballero, no lo siendo", r: "belief 4: above all, that you are a gentleman-knight, not being one"}
        forms:
          - {w: "sepa", f: "sep- + -a → saber (to know), present subjunctive, you (vuestra merced): sepa, sepas, sepa, sepamos, sepáis, sepan. Subjunctive after exclamatory 'que'."}
          - {w: "fuese", f: "fu- + -ese → ser (to be), imperfect subjunctive (-se form), it, in the 'if' clause: fuese, fueses, fuese, fuésemos, fueseis, fuesen."}
          - {w: "podría", f: "podr- + -ía → poder (to be able), conditional, you: podría, podrías, podría, podríamos, podríais, podrían. subir (to climb) and irse are its infinitives."}
          - {w: "irse", f: "ir (to go) + se: 'to go off', infinitive after 'podría'."}
          - {w: "esas", f: "es- + -as → ese (that), feminine plural to match 'calles'."}
          - {w: "dé", f: "d- + -é → dar (to give), present subjunctive, you: dé, des, dé, demos, deis, den. The accent tells it from the preposition 'de'. 'dar en' = to fall into."}
          - {w: "se dé a entender", f: "dé again, dar (to give) in the present subjunctive (dé, des, dé, demos, deis, den), with 'se' (yourself): 'give yourself to understand', i.e. persuade yourself. entender (to understand) is the infinitive after 'a'."}
          - {w: "tan grande, tan conocida", f: "tan + adjective = 'so'; conocid- + -a, participle of conocer (to know), feminine to match 'sandez'."}
          - {w: "es", f: "ser (to be), present, you (vuestra merced): soy, eres, es, somos, sois, son."}
          - {w: "siendo, estando", f: "gerunds of ser (to be) and estar (to be): 'being'; here they mean 'though you are'."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, you: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "endereza", f: "enderez- + -a → enderezar (to straighten), present, you. The present of -ar verbs: enderezo, enderezas, endereza, enderezamos, enderezáis, enderezan."}
          - {w: "agobiado", f: "agobi- + -ado → agobiar (to bow down), participle, masculine to match the uncle."}
          - {w: "no lo siendo", f: "siendo, gerund of ser (to be), with 'lo' (so, standing for 'caballero') placed before it; modern Spanish hangs it on the end: 'no siéndolo'."}
