      - es: "— ¡Válame Dios! —dijo la sobrina—."
        literal: "— May-help-me God! —said the niece—."
        ormsby: "“God bless me!” said the niece,"
        vocab:
          - {w: "¡Válame Dios!", d: "= ¡Válgame Dios!, God help me! good heavens! (old form)"}
        diagram:
