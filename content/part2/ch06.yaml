  - sentences:
      - es: "— Tienes mucha razón, sobrina, en lo que dices —respondió don Quijote—, y cosas te pudiera yo decir cerca de los linajes, que te admiraran; pero, por no mezclar lo divino con lo humano, no las digo."
        literal: "— You-have much reason, niece, in that which you-say —answered Don Quijote—, and things to-you could I tell about the lineages, that would-astonish you; but, so-as not to-mix the divine with the human, not them I-tell."
        ormsby: "“There is a great deal of truth in what you say, niece,” returned Don Quixote, “and I could tell you somewhat about birth that would astonish you; but, not to mix up things human and divine, I refrain."
        vocab:
          - {w: "tener razón", d: "to be right; 'mucha razón' = quite right"}
          - {w: "cerca de", d: "here 'about, concerning' (old use), not 'near'"}
          - {w: "linaje", d: "lineage, family descent, birth"}
