          - {w: "aquella armada", f: "aquell- + -a → aquel (that), and arm- + -ada → armado, participle of armar (to arm), both feminine to match 'fantasía'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Señor mío, vuestra merced sea servido, por caridad, dejarme desuncir las mulas y ponerme en salvo con ellas antes que se desenvainen los leones, porque si me las matan, quedaré rematado para toda mi vida; que no tengo otra hacienda sino este carro y estas mulas."
        literal: "— Sir my, your grace be pleased, for charity, to-let-me unyoke the mules and to-put-myself in safety with them before that themselves may-unsheathe the lions, because if to-me them they-kill, I-shall-remain finished for all my life; for not I-have other property but this cart and these mules."
        ormsby: "“Please your worship, for charity’s sake, señor, let me unyoke the mules and place myself in safety along with them before the lions are turned out; for if they kill them on me I am ruined for life, for all I possess is this cart and mules.”"
        vocab:
          - {w: "ser servido de", d: "to be pleased to, kindly (+ infinitive): 'vuestra merced sea servido dejarme' = may your worship kindly let me"}
          - {w: "desuncir", d: "to unyoke, unhitch (draught animals)"}
          - {w: "ponerse en salvo", d: "to get to safety"}
          - {w: "desenvainarse", d: "to be unsheathed (of a sword); used jokingly of the lions coming out of their cages"}
          - {w: "quedar rematado", d: "to be ruined, finished ('rematar' = to finish off)"}
          - {w: "hacienda", d: "property, wealth, everything one owns (not only 'estate')"}
        diagram:
          - s: "vuestra merced sea servido"
            r: "main verb: may your worship be pleased"
            under:
              - {s: "Señor mío", r: "address: my lord"}
              - {s: "por caridad", r: "plea: for charity's sake"}
              - s: "dejarme desuncir las mulas y ponerme en salvo con ellas"
                r: "to do what: to let me unyoke the mules and get to safety with them"
                under:
                  - {s: "antes que se desenvainen los leones", r: "when: before the lions are unsheathed"}
              - s: "porque si me las matan, quedaré rematado para toda mi vida"
                r: "why: because if they kill them on me, I'll be ruined for life"
              - {s: "que no tengo otra hacienda sino este carro y estas mulas", r: "why, 2: for I have nothing but this cart and these mules"}
        forms:
          - {w: "sea servido", f: "se- + -a → ser (to be), present subjunctive, you (vuestra merced takes the 'he' form), as a polite request: sea, seas, sea, seamos, seáis, sean; + servido, participle of servir (to serve): 'be pleased (to)'."}
          - {w: "dejarme", f: "dejar (to let) + me, the pronoun hung on the infinitive."}
          - {w: "desuncir", f: "desuncir (to unyoke), infinitive after 'dejarme' (let me unyoke)."}
          - {w: "ponerme", f: "poner (to put) + me: 'to put myself', the pronoun hung on the infinitive."}
          - {w: "se desenvainen", f: "desenvain- + -en → desenvainarse (to be unsheathed), present subjunctive, they (the lions). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. Subjunctive after 'antes que' (before)."}
          - {w: "me las matan", f: "mat- + -an → matar (to kill), present, they (the lions). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. 'las' = the mules; 'me' = on me, to my loss (the 'dative of interest')."}
          - {w: "quedaré", f: "quedar- + -é → quedar (to remain, end up), future, I. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "rematado", f: "participle of rematar (to finish off), masculine to match the speaker: 'finished, ruined'."}
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "este, estas", f: "este (this), masculine to match 'carro'; est- + -as, feminine plural to match 'mulas'."}
        note: "The carter switches to the most respectful address, 'vuestra merced', and the elaborate 'sea servido' formula: he is humouring an armed madman. His cart and mules are his whole living."
  - sentences:
      - es: "— ¡Oh hombre de poca fe! —respondió don Quijote—, apéate y desunce, y haz lo que quisieres, que presto verás que trabajaste en vano y que pudieras ahorrar desta diligencia."
        literal: "— Oh man of little faith! —answered Don Quijote—, get-down and unyoke, and do that which you-may-wish, for soon you-will-see that you-worked in vain and that you-could-have saved from-this effort."
