                      - s: "y que no podía dejar de soltar al león macho"
                        r: "why, 2: and (seeing) that he could not avoid letting out the male lion"
                        under:
                          - {s: "so pena de caer en la desgracia del indignado y atrevido caballero", r: "on pain of falling foul of the angry, daring knight"}
