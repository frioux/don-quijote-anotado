        forms:
          - {w: "Tú", f: "the familiar 'you', repeated four times for rhetorical effect; the author now speaks straight to his hero."}
          - {w: "sola una", f: "sol- + -a → solo (only, alone), feminine to match 'espada': 'only one sword'."}
          - {w: "perrillo", f: "perr- + -illo → perro (dog) with the diminutive -illo: 'little dog'."}
          - {w: "cortadoras", f: "corta- (cortar (to cut)) + -dora, 'cutting', feminine plural to match 'las' (the swords understood)."}
          - {w: "estás aguardando y atendiendo", f: "est- + -ás → estar (to be), present, you: estoy, estás, está, estamos, estáis, están; + two gerunds, aguardando from aguardar (to await) and atendiendo from atender (to wait for): the progressive, 'you are awaiting'."}
          - {w: "más fieros", f: "fier- + -os → fiero (fierce), masculine plural to match 'leones'; after 'los dos', 'más' makes the superlative: 'the fiercest'."}
          - {w: "criaron", f: "cri- + -aron → criar (to breed), preterite, they (the forests). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. The subject 'las africanas selvas' comes after the verb."}
          - {w: "africanas", f: "african- + -as → africano (African), feminine plural to match 'selvas', placed before the noun in the lofty style."}
        note: "The author stresses how poorly armed the hero is (an ordinary sword, a dull shield) to make the feat greater. The Spanish is in the present ('estás aguardando'), as if the author were watching; Ormsby turns it into the past."
