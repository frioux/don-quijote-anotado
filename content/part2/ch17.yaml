  - sentences:
      - es: "— El carro es mío; lo que va en él son dos bravos leones enjaulados, que el general de Orán envía a la corte, presentados a Su Majestad; las banderas son del rey nuestro señor, en señal que aquí va cosa suya."
        literal: "— The cart is mine; what goes in it are two fierce lions caged, which the general of Oran sends to the court, presented to His Majesty; the flags are of-the king our lord, in sign that here goes thing his."
        ormsby: "“The cart is mine; what is in it is a pair of wild caged lions, which the governor of Oran is sending to court as a present to his Majesty; and the flags are our lord the King’s, to show that what is here is his property.”"
        ormsby_note: "Don Quixote, going to Saragossa, could not have met the cart with lions coming from Cartagena, where they would have been landed from Oran."
        vocab:
          - {w: "bravo", d: "fierce, wild (of animals); not 'brave' here"}
          - {w: "enjaulado", d: "caged (from 'jaula', cage)"}
          - {w: "general de Orán", d: "the governor (captain-general) of Oran, the Spanish garrison town on the North African coast, in present-day Algeria"}
          - {w: "la corte", d: "the royal court, wherever the King was residing"}
          - {w: "presentado", d: "given as a present"}
          - {w: "en señal que", d: "as a sign that (modern 'en señal de que')"}
        diagram:
          - {s: "El carro es mío", r: "main verb 1: the cart is mine"}
          - s: "lo que va en él son dos bravos leones enjaulados"
            r: "main verb 2: what is in it is two fierce caged lions"
            under:
              - {s: "que el general de Orán envía a la corte", r: "describes 'leones': which the governor of Oran is sending to court"}
              - {s: "presentados a Su Majestad", r: "how: as a present to His Majesty"}
          - s: "las banderas son del rey nuestro señor"
            r: "main verb 3: the flags are the King our lord's"
            under:
              - {s: "en señal que aquí va cosa suya", r: "why: as a sign that what goes here is his"}
        forms:
          - {w: "es, son", f: "ser (to be), present, it and they. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "va", f: "ir (to go), present, it. Irregular: voy, vas, va, vamos, vais, van."}
          - {w: "enjaulados", f: "en- + jaul(a) (cage) + -ados, participle of enjaular (to cage), masculine plural to match 'leones'."}
          - {w: "envía", f: "enví- + -a → enviar (to send), present, he; the i takes an accent: envío, envías, envía, enviamos, enviáis, envían."}
          - {w: "presentados", f: "participle of presentar (to present), masculine plural to match 'leones'."}
          - {w: "del", f: "de + el, 'of the': 'the King's'."}
          - {w: "suya", f: "suy- + -a → suyo (his), feminine to match 'cosa'."}
        note: "Exotic animals were a royal luxury, and the lions travel under the King's flags so that no one dares to interfere with them. Oran had been a Spanish outpost since 1509."
