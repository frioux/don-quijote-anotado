  - sentences:
      - es: "En el espacio que tardó el leonero en abrir la jaula primera, estuvo considerando don Quijote si sería bien hacer la batalla antes a pie que a caballo; y, en fin, se determinó de hacerla a pie, temiendo que Rocinante se espantaría con la vista de los leones."
        literal: "In the space that took the lion-keeper in opening the cage first, was considering Don Quijote if it-would-be well to-do the battle rather on foot than on horse; and, in end, himself he-determined of doing-it on foot, fearing that Rocinante himself would-take-fright with the sight of the lions."
        ormsby: "During the delay that occurred while the keeper was opening the first cage, Don Quixote was considering whether it would not be well to do battle on foot, instead of on horseback, and finally resolved to fight on foot, fearing that Rocinante might take fright at the sight of the lions;"
        vocab:
          - {w: "tardar en", d: "to take (time) to, be slow in"}
          - {w: "antes ... que", d: "rather ... than"}
          - {w: "a pie, a caballo", d: "on foot, on horseback"}
          - {w: "en fin", d: "in the end, finally"}
          - {w: "determinarse de", d: "to decide to, resolve to (modern 'determinarse a')"}
          - {w: "espantarse", d: "to take fright, shy (of a horse)"}
        diagram:
          - s: "estuvo considerando don Quijote"
            r: "main verb 1: Don Quijote was considering"
            under:
              - s: "En el espacio"
                r: "when: in the time"
                under:
                  - {s: "que tardó el leonero en abrir la jaula primera", r: "describes 'espacio': that the keeper took to open the first cage"}
              - {s: "si sería bien hacer la batalla antes a pie que a caballo", r: "what he considered: whether it would be better to fight on foot than on horseback"}
          - s: "se determinó de hacerla a pie"
            r: "main verb 2 (after 'y, en fin'): he decided to fight it on foot"
            under:
              - {s: "temiendo que Rocinante se espantaría con la vista de los leones", r: "why: fearing Rocinante would shy at the sight of the lions"}
        forms:
          - {w: "tardó", f: "tard- + -ó → tardar (to take time), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "abrir", f: "abrir (to open), infinitive after 'en' (tardar en = take time in)."}
          - {w: "estuvo considerando", f: "estuv- + -o → estar (to be), preterite, he: estuve, estuviste, estuvo, estuvimos, estuvisteis, estuvieron; + considerando, gerund of considerar (to consider): 'was considering' for the whole stretch of time."}
          - {w: "sería, espantaría", f: "ser- + -ía → ser (to be) and espantar- + -ía → espantarse (to take fright), conditional, it / he. The conditional adds endings to the whole infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "se determinó", f: "determin- + -ó → determinarse (to resolve), preterite, he, with 'se'. Same -ó preterite."}
          - {w: "hacerla", f: "hacer (to do) + la (it), with 'la' standing for 'la batalla'."}
          - {w: "temiendo", f: "gerund of temer (to fear): 'fearing'."}
        note: "Fighting on foot is a practical decision: horses panic at the smell of lions, and Rocinante has failed Don Quijote before."
      - es: "Por esto saltó del caballo, arrojó la lanza y embrazó el escudo, y, desenvainando la espada, paso ante paso, con maravilloso denuedo y corazón valiente, se fue a poner delante del carro, encomendándose a Dios de todo corazón, y luego a su señora Dulcinea."
        literal: "For this he-jumped from-the horse, threw the lance and put-on-his-arm the shield, and, unsheathing the sword, step before step, with marvelous boldness and heart brave, himself he-went to place in-front of-the cart, commending-himself to God with all heart, and then to his lady Dulcinea."
        ormsby: "he therefore sprang off his horse, flung his lance aside, braced his buckler on his arm, and drawing his sword, advanced slowly with marvellous intrepidity and resolute courage, to plant himself in front of the cart, commending himself with all his heart to God and to his lady Dulcinea."
        vocab:
          - {w: "arrojar", d: "to throw, fling away"}
          - {w: "embrazar", d: "to put (a shield) on one's arm, brace"}
          - {w: "desenvainar", d: "to unsheathe, draw (a sword)"}
          - {w: "paso ante paso", d: "step by step, slowly"}
          - {w: "denuedo", d: "boldness, intrepidity"}
          - {w: "encomendarse a", d: "to commend oneself to, put oneself in the hands of"}
          - {w: "de todo corazón", d: "with all one's heart"}
        diagram:
          - {s: "Por esto saltó del caballo", r: "main verb 1: for this reason he jumped off his horse"}
          - {s: "arrojó la lanza", r: "main verb 2: threw away the lance"}
          - {s: "y embrazó el escudo", r: "main verb 3: and put the shield on his arm"}
          - s: "se fue a poner delante del carro"
            r: "main verb 4 (after 'y'): he went to place himself in front of the cart"
            under:
              - {s: "desenvainando la espada", r: "how: drawing his sword"}
              - {s: "paso ante paso", r: "how: step by step"}
              - {s: "con maravilloso denuedo y corazón valiente", r: "how: with marvellous boldness and a brave heart"}
              - s: "encomendándose a Dios de todo corazón"
                r: "how: commending himself to God with all his heart"
                under:
                  - {s: "y luego a su señora Dulcinea", r: "and then to his lady Dulcinea"}
        forms:
          - {w: "saltó, arrojó, embrazó", f: "salt- + -ó → saltar (to jump), arroj- + -ó → arrojar (to throw), embraz- + -ó → embrazar (to brace on the arm), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "del", f: "de + el, 'from the', 'of the'."}
          - {w: "desenvainando", f: "gerund of desenvainar (to unsheathe): 'drawing'."}
          - {w: "maravilloso", f: "maravill- + -oso → maravilloso (marvellous), from maravilla (marvel), masculine to match 'denuedo'."}
          - {w: "se fue a poner", f: "fue, ir (to go), preterite, he: fui, fuiste, fue, fuimos, fuisteis, fueron; + a + poner (to put), with 'se' (himself) belonging to ponerse (to place oneself) but set before the whole group: 'he went to place himself'."}
          - {w: "encomendándose", f: "gerund of encomendar (to commend) + se (himself), the pronoun hung on the end; accent added to keep the stress: encomendando → encomendándose."}
        note: "Commending himself to God and then to his lady before battle is the knight-errant's rule, which Don Quijote laid down in Part I. Ormsby's 'to God and to his lady' drops the 'luego' (then, next) that keeps God first."
  - sentences:
      - es: "Y es de saber que, llegando a este paso, el autor de esta verdadera historia exclama y dice:"
        literal: "And it-is to know that, arriving at this passage, the author of this true history exclaims and says:"
        ormsby: "It is to be observed, that on coming to this passage, the author of this veracious history breaks out into exclamations."
        vocab:
          - {w: "es de saber que", d: "it should be known that, be it noted that: a narrator's formula"}
          - {w: "paso", d: "passage, point (in a story); also 'step'"}
          - {w: "exclamar", d: "to exclaim, cry out"}
        diagram:
          - s: "es de saber"
            r: "main verb: it is to be known"
            under:
              - s: "el autor de esta verdadera historia exclama y dice:"
                r: "what is to be known (after 'que'): the author of this true history exclaims and says"
                under:
                  - {s: "llegando a este paso", r: "when: on reaching this passage"}
        forms:
          - {w: "es de saber", f: "es → ser (to be), present, it: soy, eres, es, somos, sois, son; + de + saber (to know), the infinitive after 'de': 'it is to be known', i.e. note that."}
          - {w: "llegando", f: "lleg- + -ando → llegar (to arrive), gerund: 'arriving, on reaching'; its subject is 'el autor'."}
          - {w: "exclama", f: "exclam- + -a → exclamar (to exclaim), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. The narrator uses the present for the author's act of writing."}
          - {w: "dice", f: "dic- + -e → decir (to say), present, he. Irregular: digo, dices, dice, decimos, decís, dicen."}
        note: "The 'author' is Cide Hamete Benengeli, the Arab historian whose manuscript Cervantes pretends to have had translated. His outburst that follows is a mock-epic apostrophe, the high style of heroic poetry spent on a man waiting for a lion."
      - es: "«¡Oh fuerte y, sobre todo encarecimiento, animoso don Quijote de la Mancha, espejo donde se pueden mirar todos los valientes del mundo, segundo y nuevo don Manuel de León, que fue gloria y honra de los españoles caballeros!"
        literal: "«Oh strong and, above all praising, spirited Don Quijote de la Mancha, mirror where themselves can look all the valiant-ones of-the world, second and new Don Manuel de León, who was glory and honour of the Spanish knights!"
        ormsby: "“O doughty Don Quixote! high-mettled past extolling! Mirror, wherein all the heroes of the world may see themselves! Second modern Don Manuel de León, once the glory and honour of Spanish knighthood!"
        ormsby_note: "Referring to Don Manuel Ponce de León, one of the most brilliant of the galaxy of gallant knights round Ferdinand and Isabella at the siege of Granada, and hero, according to Spanish tradition, of the story told by Schiller in Der Handschuh, by Leigh Hunt in the Glove and the Lions, but best of all by Robert Browning in The Glove. Although, with these, the hero's name is De Lorge and the scene the Court of Francis I of France, the story is originally a Spanish one. It was transferred to France by Brantôme in Discours X of his Dames Illustres. He took it from No. 89 of Part III of Bandello's novels, and Bandello had it from a Valencian or Catalan source. It appears in different forms in old Spanish literature. It is mentioned in the Nobiliario of Alonso López de Haro, who, however, says nothing about throwing the glove in the lady's face. It is also mentioned by Urrea in his translation of Ariosto, 1549, and by Garci Sanchez de Badajoz; and it is the subject of a ballad, probably of the fifteenth century, in Timoneda's Rosa de Romances, 1573. Viardot, in a note on this passage in his translation, says that the surname of \"de León\" was conferred by Isabella in commemoration of the feat. As a member of the Spanish Academy he ought to have known that in that case the title would have been \"del León;\" and, in the next place, that the noble family of the Ponces had borne the addition to their name since the end of the twelfth century, when Pedro Ponce de Minerva married Aldonza, natural daughter of Alfonso IX of León. Unfortunately, the reverse of Viardot's theory is far the more probable one; that the story was invented to account for the name by some ballad-maker ignorant of the family history of the Ponces."
        vocab:
          - {w: "fuerte", d: "strong, doughty, valiant"}
          - {w: "sobre todo encarecimiento", d: "beyond all praise; 'encarecimiento' = high praise, exaggeration"}
          - {w: "animoso", d: "spirited, courageous"}
          - {w: "espejo", d: "mirror; a model to copy, a stock word of chivalric praise ('espejo de caballería')"}
          - {w: "valientes", d: "brave men, heroes (adjective used as a noun)"}
          - {w: "don Manuel de León", d: "Manuel Ponce de León, a knight of Ferdinand and Isabella at the siege of Granada, said to have walked into a lions' enclosure to fetch a lady's glove"}
          - {w: "honra", d: "honour, glory"}
        diagram:
          - s: "¡Oh fuerte y, sobre todo encarecimiento, animoso don Quijote de la Mancha"
            r: "address (no main verb): O strong and, beyond all praise, spirited Don Quijote"
            under:
              - s: "espejo"
                r: "what he is called, 1: mirror"
                under:
                  - {s: "donde se pueden mirar todos los valientes del mundo", r: "describes 'espejo': in which all the brave men of the world can see themselves"}
              - s: "segundo y nuevo don Manuel de León"
                r: "what he is called, 2: a second, new Don Manuel de León"
                under:
                  - {s: "que fue gloria y honra de los españoles caballeros", r: "describes 'don Manuel': who was the glory and honour of Spanish knights"}
        forms:
          - {w: "se pueden mirar", f: "pued- + -en → poder (to be able), present, they: puedo, puedes, puede, podemos, podéis, pueden; + mirar (to look) with 'se' (themselves) placed before the whole group: 'can see themselves'."}
          - {w: "valientes", f: "plural of the adjective valiente (brave), used as a noun with 'los': 'the brave'."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, he. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "españoles caballeros", f: "españoles = plural of español, masculine to match 'caballeros'; placed before the noun for a lofty tone."}
        note: "The pompous apostrophe opening with '¡Oh' parodies the praise heaped on heroes in epics and romances of chivalry. Don Manuel Ponce de León was a real knight of the Granada war, famous in ballads for going in among lions to bring back a lady's glove, so the comparison is exact."
      - es: "¿Con qué palabras contaré esta tan espantosa hazaña, o con qué razones la haré creíble a los siglos venideros, o qué alabanzas habrá que no te convengan y cuadren, aunque sean hipérboles sobre todos los hipérboles?"
        literal: "With what words shall-I-tell this so frightful feat, or with what speeches it shall-I-make credible to the centuries coming, or what praises will-there-be that not to-you may-befit and may-suit, although they-be hyperboles over all the hyperboles?"
        ormsby: "In what words shall I describe this dread exploit, by what language shall I make it credible to ages to come, what eulogies are there unmeet for thee, though they be hyperboles piled on hyperboles!"
        vocab:
          - {w: "espantoso", d: "dreadful, terrifying; also awe-inspiring"}
