              - {s: "que así fuese", r: "subject: that it were so"}
              - s: "porque mis obras no pueden dar testimonio"
                r: "why: because my deeds cannot bear witness"
                under:
                  - {s: "de otra cosa", r: "of what: to anything else"}
        forms:
          - {w: "sería", f: "ser- + -ía → ser (to be), conditional, it. The conditional adds -ía endings to the whole infinitive: sería, serías, sería, seríamos, seríais, serían."}
          - {w: "fuese", f: "fu- + -ese → ser (to be), imperfect subjunctive (-se form), it, after 'no sería mucho que'. Irregular: fuese, fueses, fuese, fuésemos, fueseis, fuesen."}
          - {w: "pueden", f: "pued- + -en → poder (to be able), present, they (my deeds). The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
      - es: "Pues, con todo esto, quiero que vuestra merced advierta que no soy tan loco ni tan menguado como debo de haberle parecido."
        literal: "Well, with all this, I-want that your grace may-notice that not I-am so mad nor so lacking as I-must of to-have-to-him seemed."
