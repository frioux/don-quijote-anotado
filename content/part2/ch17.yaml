  - sentences:
      - es: "— Séanme testigos cuantos aquí están cómo contra mi voluntad y forzado abro las jaulas y suelto los leones, y de que protesto a este señor que todo el mal y daño que estas bestias hicieren corra y vaya por su cuenta, con más mis salarios y derechos."
        literal: "— Be-to-me witnesses as-many-as here are how against my will and forced I-open the cages and I-release the lions, and of that I-protest to this gentleman that all the harm and damage that these beasts may-do may-run and may-go on his account, with plus my wages and dues."
        ormsby: "“I call all here to witness that against my will and under compulsion I open the cages and let the lions loose, and that I warn this gentleman that he will be accountable for all the harm and mischief which these beasts may do, and for my salary and dues as well."
        vocab:
          - {w: "ser testigo", d: "to be a witness; 'séanme testigos' = bear witness for me"}
          - {w: "cuantos", d: "all those who, as many as"}
          - {w: "forzado", d: "forced, under compulsion"}
          - {w: "soltar", d: "to let loose, release"}
          - {w: "protestar", d: "to declare formally (a legal term: to make a formal protest), not just 'complain'"}
          - {w: "correr por cuenta de", d: "to be charged to, be the responsibility of"}
          - {w: "con más", d: "plus, and in addition (old legal phrase)"}
          - {w: "derechos", d: "dues, fees owed to him"}
        diagram:
          - s: "Séanme testigos"
            r: "main verb: let them be my witnesses"
            under:
              - {s: "cuantos aquí están", r: "subject: all who are here"}
              - s: "cómo contra mi voluntad y forzado abro las jaulas y suelto los leones"
                r: "witness to what, 1: that I open the cages and release the lions against my will, under force"
              - s: "y de que protesto a este señor"
                r: "witness to what, 2: and that I formally declare to this gentleman"
                under:
                  - s: "que todo el mal y daño ... corra y vaya por su cuenta"
                    r: "what he declares: that all the harm and damage goes on his account"
                    under:
                      - {s: "que estas bestias hicieren", r: "describes 'mal y daño': that these beasts may do"}
                      - {s: "con más mis salarios y derechos", r: "added: plus my wages and dues"}
        forms:
          - {w: "Séanme", f: "se- + -an + me → ser (to be), present subjunctive, they, with 'me' (for me) stuck on the end: 'let them be for me'. ser (to be) in the present subjunctive: sea, seas, sea, seamos, seáis, sean. A subjunctive opening the sentence gives a command or wish, and the pronoun hangs on the end."}
          - {w: "están", f: "est- + -án → estar (to be), present, they: estoy, estás, está, estamos, estáis, están."}
          - {w: "forzado", f: "participle of forzar (to force), masculine to match the speaker: 'forced'."}
          - {w: "abro, suelto", f: "abr- + -o → abrir (to open) and suelt- + -o → soltar (to release), present, I. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en; soltar changes o to ue when stressed: suelto, sueltas, suelta, soltamos, soltáis, sueltan."}
          - {w: "protesto", f: "protest- + -o → protestar (to declare formally), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "hicieren", f: "hic- + -ieren → hacer (to do), future subjunctive, they: 'whatever they may do'. Built on the preterite hicieron: hiciere, hicieres, hiciere, hiciéremos, hiciereis, hicieren. The future subjunctive was standard in legal language for open future cases; modern Spanish uses 'hagan'."}
          - {w: "corra y vaya", f: "corr- + -a → correr (to run) and vay- + -a → ir (to go), present subjunctive, it (the harm): 'that it run and go'. The present subjunctive of -er verbs: -a, -as, -a, -amos, -áis, -an; ir (to go): vaya, vayas, vaya, vayamos, vayáis, vayan. Subjunctive after 'protesto que', as in a legal formula."}
          - {w: "estas", f: "est- + -as → este (this), feminine plural to match 'bestias'."}
        note: "The keeper speaks like a notary, with the doubled terms ('mal y daño', 'corra y vaya') and the formal protest of legal documents, so that the blame and the cost will fall on Don Quijote."
      - es: "Vuestras mercedes, señores, se pongan en cobro antes que abra, que yo seguro estoy que no me han de hacer daño."
        literal: "Your graces, sirs, themselves may-put in safety before that I-may-open, for I sure am that not to-me they-have to do harm."
        ormsby: "You, gentlemen, place yourselves in safety before I open, for I know they will do me no harm.”"
        vocab:
          - {w: "vuestras mercedes", d: "your worships, the polite plural 'you' (modern 'ustedes'), taking a 'they' verb"}
          - {w: "ponerse en cobro", d: "to get to safety, take shelter"}
          - {w: "hacer daño", d: "to harm, hurt"}
        diagram:
          - s: "Vuestras mercedes, señores, se pongan en cobro"
            r: "main verb: your worships, sirs, get to safety"
            under:
              - {s: "antes que abra", r: "when: before I open"}
              - s: "que yo seguro estoy"
                r: "why (after 'que', for): for I am sure"
                under:
                  - {s: "que no me han de hacer daño", r: "what he is sure of: that they will not harm me"}
        forms:
          - {w: "se pongan", f: "pong- + -an → ponerse (to put oneself), present subjunctive, you (vuestras mercedes takes the 'they' form), as a polite command. poner (to put) in the present subjunctive: ponga, pongas, ponga, pongamos, pongáis, pongan. The pronoun 'se' stands before the verb here, as Cervantes sometimes allows; modern Spanish would say 'pónganse'."}
          - {w: "abra", f: "abr- + -a → abrir (to open), present subjunctive, I. The present subjunctive of -ir verbs: -a, -as, -a, -amos, -áis, -an. Subjunctive after 'antes que' (before)."}
          - {w: "estoy", f: "est- + -oy → estar (to be), present, I: estoy, estás, está, estamos, estáis, están. 'seguro' comes first for emphasis."}
          - {w: "han de hacer", f: "han, haber (to have), present, they: he, has, ha, hemos, habéis, han; 'haber de' + infinitive = to be going to: 'they are going to do'. hacer (to do) is the infinitive."}
  - sentences:
      - es: "Otra vez le persuadió el hidalgo que no hiciese locura semejante, que era tentar a Dios acometer tal disparate."
        literal: "Another time him persuaded the gentleman that not he-should-do madness similar, for it-was to-tempt to God to-undertake such folly."
        ormsby: "Once more the gentleman strove to persuade Don Quixote not to do such a mad thing, as it was tempting God to engage in such a piece of folly."
        vocab:
          - {w: "persuadir", d: "to urge, try to persuade (here the attempt, not the success)"}
          - {w: "semejante", d: "such, like this (after the noun)"}
          - {w: "tentar a Dios", d: "to tempt God: to put oneself in needless danger and expect God to rescue one, a sin"}
          - {w: "disparate", d: "piece of nonsense, folly"}
        diagram:
          - s: "Otra vez le persuadió el hidalgo"
            r: "main verb: once more the gentleman urged him"
            under:
              - {s: "que no hiciese locura semejante", r: "what he urged: not to do such a mad thing"}
              - s: "que era tentar a Dios"
                r: "why (after 'que', for): it was tempting God"
                under:
                  - {s: "acometer tal disparate", r: "subject of 'era': to undertake such folly"}
        forms:
          - {w: "persuadió", f: "persuad- + -ió → persuadir (to urge), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "hiciese", f: "hic- + -iese → hacer (to do), imperfect subjunctive (-se form), he: 'that he should not do'. hiciese, hicieses, hiciese, hiciésemos, hicieseis, hiciesen. Subjunctive after a verb of urging."}
          - {w: "era", f: "ser (to be), imperfect, it. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "tentar, acometer", f: "tentar (to tempt) and acometer (to undertake), infinitives used as nouns: 'to undertake such folly was to tempt God'."}
        note: "To 'tempt God' was a recognised sin in Catholic teaching: deliberately running into danger and counting on a miracle. The devil asks Christ to throw himself from the Temple, and Christ answers 'thou shalt not tempt the Lord thy God' (Matthew 4:7)."
      - es: "A lo que respondió don Quijote que él sabía lo que hacía."
        literal: "To that which answered Don Quijote that he knew that which he-was-doing."
        ormsby: "To this, Don Quixote replied that he knew what he was about."
        vocab:
          - {w: "a lo que", d: "to which, in answer to which"}
        diagram:
          - s: "respondió don Quijote"
            r: "main verb: Don Quijote answered"
            under:
