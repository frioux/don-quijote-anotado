  - sentences:
      - es: "— Pues, si acaso Su Majestad preguntare quién la hizo, diréisle que el Caballero de los Leones, que de aquí adelante quiero que en éste se trueque, cambie, vuelva y mude el que hasta aquí he tenido del Caballero de la Triste Figura;"
        literal: "— Well, if by-chance His Majesty should-ask who it did, you-will-tell-him that the Knight of the Lions, for from here forward I-want that into this may-be-exchanged, changed, turned and altered the [name] that until here I-have had of-the Knight of the Sad Countenance;"
        ormsby: "“Then,” said Don Quixote, “if his Majesty should happen to ask who performed it, you must say The Knight of the Lions; for it is my desire that into this the name I have hitherto borne of Knight of the Rueful Countenance be from this time forward changed, altered, transformed, and turned;"
        vocab:
          - {w: "acaso", d: "by chance, perhaps: 'si acaso' = if by any chance"}
          - {w: "Su Majestad", d: "His Majesty, the King (Philip III at the time of Part II)"}
          - {w: "de aquí adelante", d: "from now on, henceforth"}
          - {w: "trocar", d: "to exchange, change one thing for another"}
          - {w: "mudar", d: "to change, alter (literary; modern 'cambiar')"}
          - {w: "hasta aquí", d: "until now, hitherto"}
          - {w: "Caballero de la Triste Figura", d: "Knight of the Sad (Rueful) Countenance, the name Sancho gave Don Quijote in Part I, Chapter XIX"}
          - {w: "Caballero de los Leones", d: "Knight of the Lions, Don Quijote's new name from this adventure on"}
        diagram:
          - s: "diréisle"
            r: "main verb: you will tell him"
            under:
              - s: "si acaso Su Majestad preguntare"
                r: "condition: if His Majesty should happen to ask"
                under:
                  - {s: "quién la hizo", r: "what he asks: who did it (the deed)"}
              - {s: "que el Caballero de los Leones", r: "what to tell him: (that it was) the Knight of the Lions"}
              - s: "que de aquí adelante quiero"
                r: "why: for from now on I want"
                under:
                  - s: "que en éste se trueque, cambie, vuelva y mude"
                    r: "what I want: that into this (name) be exchanged, changed, turned and altered"
                    under:
                      - s: "el que hasta aquí he tenido del Caballero de la Triste Figura"
                        r: "subject of 'se trueque': the (name) I have had until now, of the Knight of the Sad Countenance"
        forms:
          - {w: "preguntare", f: "pregunt- + -are → preguntar (to ask), future subjunctive, he: 'should he ask'. The future subjunctive of -ar verbs: -are, -ares, -are, -áremos, -areis, -aren. Cervantes uses it after 'si' for an open future; modern Spanish uses the present indicative 'si pregunta'."}
          - {w: "hizo", f: "hiz- + -o → hacer (to do), preterite, he. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "la", f: "'it', feminine because it stands for 'la hazaña' (the deed) the keeper promised to report."}
          - {w: "diréisle", f: "dir- + -éis + le → decir (to tell), future, you (vosotros, the carter and keeper), with 'le' (to him) stuck on the end; modern 'le diréis'. Irregular stem dir-: diré, dirás, dirá, diremos, diréis, dirán. Cervantes often hangs the pronoun on a verb that opens a clause."}
          - {w: "quiero", f: "quier- + -o → querer (to want), present, I. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "se trueque, cambie, vuelva y mude", f: "four present subjunctives, it (the old name), with 'se' making them passive ('be exchanged, changed, turned, altered'); subjunctive because they follow 'quiero que'. trueque: truec- (trocar (to exchange), o → ue when stressed, c → qu before e): trueque, trueques, trueque, troquemos, troquéis, truequen. cambie: cambi- + -e → cambiar (to change): cambie, cambies, cambie, cambiemos, cambiéis, cambien. vuelva: vuelv- + -a → volver (to turn): vuelva, vuelvas, vuelva, volvamos, volváis, vuelvan. mude: mud- + -e → mudar (to alter): mude, mudes, mude, mudemos, mudéis, muden."}
          - {w: "éste", f: "'this one', standing for the new name 'Caballero de los Leones'; written with an accent as a pronoun."}
          - {w: "he tenido", f: "he (haber (to have), present, I: he, has, ha, hemos, habéis, han) + tenido, the participle of tener (to have): the perfect, 'I have had'."}
        note: "Knights in the romances often took a new name from a striking deed or device. 'Caballero de la Triste Figura' was the name Sancho gave his master in Part I after a night fight left his face battered."
      - es: "y en esto sigo la antigua usanza de los andantes caballeros, que se mudaban los nombres cuando querían, o cuando les venía a cuento."
        literal: "and in this I-follow the ancient custom of the errant knights, who themselves changed the names when they-wished, or when to-them it-came to account."
        ormsby: "and in this I follow the ancient usage of knights-errant, who changed their names when they pleased, or when it suited their purpose.”"
        ormsby_note: "E.g. Amadís, Esplandián, Belianis, the Caballero del Febo, and others. \"The Knight of the Lions\" was one of the titles adopted by Amadís."
        vocab:
          - {w: "usanza", d: "usage, custom (literary; modern 'uso, costumbre')"}
          - {w: "andantes caballeros", d: "= caballeros andantes, knights-errant; the adjective put first for emphasis"}
          - {w: "mudarse el nombre", d: "to change one's name"}
          - {w: "venir a cuento", d: "to suit, be to the purpose: 'cuando les venía a cuento' = when it suited them"}
        diagram:
          - s: "sigo"
            r: "main verb: I follow"
            under:
              - {s: "en esto", r: "where: in this (changing my name)"}
              - s: "la antigua usanza de los andantes caballeros"
                r: "object: the ancient custom of knights-errant"
                under:
                  - s: "que se mudaban los nombres"
                    r: "describes 'caballeros': who changed their names"
                    under:
                      - {s: "cuando querían", r: "when: when they wished"}
                      - {s: "o cuando les venía a cuento", r: "when, 2: or when it suited them"}
        forms:
          - {w: "sigo", f: "sig- + -o → seguir (to follow), present, I. The stem e becomes i when stressed, and gu becomes g before o: sigo, sigues, sigue, seguimos, seguís, siguen."}
          - {w: "se mudaban", f: "mud- + -aban → mudar (to change), imperfect, they, with 'se' (for themselves): 'they used to change (their names)'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "querían", f: "quer- + -ían → querer (to want), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "venía", f: "ven- + -ía → venir (to come), imperfect, it. Same -ía imperfect: venía, venías, venía, veníamos, veníais, venían."}
          - {w: "les", f: "'to them', the knights: in 'venirle a uno a cuento' the person it suits is the indirect object."}
        note: "Amadís of Gaul, the model knight of the Spanish romances, called himself Beltenebros (the Fair Dark One) during his penance and also the Knight of the Green Sword; as Ormsby notes, he too bore the title Knight of the Lions."
