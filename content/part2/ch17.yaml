        note: "This answers the chapter's title ('el último punto y estremo adonde llegó y pudo llegar el inaudito ánimo de don Quijote'): the lions mark the height of his madness, or of his courage."
      - es: "Pero el generoso león, más comedido que arrogante, no haciendo caso de niñerías, ni de bravatas, después de haber mirado a una y otra parte, como se ha dicho, volvió las espaldas y enseñó sus traseras partes a don Quijote, y con gran flema y remanso se volvió a echar en la jaula."
        literal: "But the noble lion, more courteous than arrogant, not making case of childishnesses, nor of bravados, after of having looked to one and other side, as itself has said, turned the backs and showed his rear parts to Don Quijote, and with great phlegm and calm himself turned to lie-down in the cage."
        ormsby: "but the noble lion, more courteous than arrogant, not troubling himself about silly bravado, after having looked all round, as has been said, turned about and presented his hindquarters to Don Quixote, and very coolly and tranquilly lay down again in the cage."
        vocab:
          - {w: "generoso", d: "noble, high-minded (from 'of good birth'), not only 'generous'"}
          - {w: "comedido", d: "courteous, restrained"}
          - {w: "hacer caso de", d: "to pay attention to, take notice of"}
          - {w: "niñería", d: "childishness, piece of silliness"}
          - {w: "bravata", d: "bravado, swaggering threat"}
          - {w: "a una y otra parte", d: "this way and that, all around"}
          - {w: "volver las espaldas", d: "to turn one's back"}
          - {w: "traseras partes", d: "hindquarters"}
          - {w: "flema", d: "phlegm in the old sense: coolness, unhurried calm"}
          - {w: "remanso", d: "calm, stillness (literally a still pool in a river)"}
          - {w: "volver a + infinitive", d: "to do again: 'se volvió a echar' = lay down again"}
        diagram:
          - s: "volvió las espaldas"
            r: "main verb 1: turned his back"
            under:
              - s: "el generoso león"
                r: "subject: the noble lion"
                under:
                  - {s: "más comedido que arrogante", r: "describes 'león': more courteous than arrogant"}
              - {s: "no haciendo caso de niñerías, ni de bravatas", r: "how: paying no attention to childishness or bravado"}
              - {s: "después de haber mirado a una y otra parte, como se ha dicho", r: "when: after looking all around, as has been said"}
          - s: "y enseñó sus traseras partes a don Quijote"
            r: "main verb 2: and showed his hindquarters to Don Quijote"
          - s: "se volvió a echar en la jaula"
            r: "main verb 3 (after 'y'): lay down again in the cage"
            under:
              - {s: "con gran flema y remanso", r: "how: with great coolness and calm"}
        forms:
          - {w: "haciendo", f: "gerund of hacer (to make, do): 'no haciendo caso' = paying no attention."}
          - {w: "haber mirado", f: "haber (to have) + mirado, participle of mirar (to look): the perfect infinitive after 'después de', 'after having looked'."}
          - {w: "se ha dicho", f: "ha → haber (to have), present, it: he, has, ha, hemos, habéis, han; + dicho, the irregular participle of decir (to say), with impersonal 'se': 'as has been said'."}
          - {w: "volvió", f: "volv- + -ió → volver (to turn), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "enseñó", f: "enseñ- + -ó → enseñar (to show), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "sus traseras", f: "plural to match 'partes'; traser- + -as → trasero (rear), feminine plural, before the noun."}
          - {w: "se volvió a echar", f: "volvió (volver (to turn), preterite, he) + a + echar (to lay down): 'volver a' + infinitive = to do again; 'se' belongs to echarse (to lie down) and stands in front of the whole group."}
        note: "A 'generoso' lion is a noble one: old natural histories and bestiaries said the lion, king of beasts, disdains to attack those who do not deserve its anger. Here the lion's nobility is simply indifference, and it turns its backside on the hero."
