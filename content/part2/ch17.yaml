          - {w: "de buena gana", d: "willingly, gladly"}
          - {w: "¿qué se han hecho?", d: "what has become of? ('hacerse' = to become of)"}
          - {w: "son muertos", d: "are dead: old use of ser with 'muerto'; modern 'están muertos'"}
