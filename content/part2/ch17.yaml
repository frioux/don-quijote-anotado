  - sentences:
      - es: "Aquí cesó la referida exclamación del autor, y pasó adelante, anudando el hilo de la historia, diciendo que, visto el leonero ya puesto en postura a don Quijote, y que no podía dejar de soltar al león macho, so pena de caer en la desgracia del indignado y atrevido caballero, abrió de par en par la primera jaula, donde estaba, como se ha dicho, el león, el cual pareció de grandeza extraordinaria y de espantable y fea catadura."
        literal: "Here ceased the aforesaid exclamation of-the author, and he-passed forward, knotting the thread of the history, saying that, seen the lion-keeper already placed in posture Don Quijote, and that not he-could leave-off from releasing the lion male, under penalty of falling into the disfavour of-the indignant and daring knight, he-opened from pair in pair the first cage, where was, as itself has said, the lion, the which appeared of greatness extraordinary and of frightful and ugly aspect."
        ormsby: "Here the author’s outburst came to an end, and he proceeded to take up the thread of his story, saying that the keeper, seeing that Don Quixote had taken up his position, and that it was impossible for him to avoid letting out the male without incurring the enmity of the fiery and daring knight, flung open the doors of the first cage, containing, as has been said, the lion, which was now seen to be of enormous size, and grim and hideous mien."
        vocab:
          - {w: "cesar", d: "to stop, cease"}
          - {w: "referido", d: "aforesaid, just mentioned"}
          - {w: "pasar adelante", d: "to go on, proceed"}
          - {w: "anudar el hilo", d: "to tie up the thread again, resume the story"}
          - {w: "leonero", d: "lion-keeper"}
          - {w: "puesto en postura", d: "placed in position, on guard"}
          - {w: "no poder dejar de", d: "to be unable to avoid, have no choice but to"}
          - {w: "so pena de", d: "on pain of; 'so' = under (archaic preposition)"}
          - {w: "caer en la desgracia de", d: "to fall out of favour with, incur the anger of"}
          - {w: "indignado", d: "angry, indignant"}
          - {w: "de par en par", d: "wide open (of doors)"}
          - {w: "espantable", d: "frightful (= espantoso)"}
          - {w: "catadura", d: "look, aspect, mien (usually of an ugly face)"}
        diagram:
          - {s: "Aquí cesó la referida exclamación del autor", r: "main verb 1: here the author's exclamation ended"}
          - s: "y pasó adelante"
            r: "main verb 2: and he went on"
            under:
