  - sentences:
      - es: "— Si son requesones, démelos vuesa merced, que yo me los comeré..."
        literal: "— If they-are curds, give-them-to-me your grace, for I for-myself them will-eat [he breaks off]"
        ormsby: "“If they are curds let me have them, your worship, and I’ll eat them;"
        vocab:
          - {w: "vuesa merced", d: "your grace, your worship: polite 'you', taking the 'he/she' form of the verb; the origin of modern 'usted'"}
          - {w: "comerse", d: "to eat up; the 'me' adds relish: 'I'll eat them myself'"}
        diagram:
          - s: "démelos vuesa merced"
            r: "main verb with subject: let your worship give them to me"
            under:
              - {s: "Si son requesones", r: "condition: if they are curds"}
              - {s: "que yo me los comeré", r: "why: for I will eat them"}
        forms:
          - {w: "son", f: "ser (to be), present, they. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "démelos", f: "dé + me + los → dar (to give), present subjunctive, he (vuesa merced), used as a polite command: 'give them to me'. dar (to give) in the present subjunctive: dé, des, dé, demos, deis, den. The pronouns 'me' (to me) and 'los' (them) hang on the end of a command."}
          - {w: "me los comeré", f: "comer- + -é → comer (to eat), future, I, with 'me' (for myself) and 'los' (them). The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
        note: "The dots are in the text: Sancho breaks off, perhaps realizing that offering to eat the curds is as good as admitting they are his, and changes tack at once."
      - es: "Pero cómalos el diablo, que debió de ser el que ahí los puso."
        literal: "But may-eat-them the devil, for he-must have-been the [one] who there them put."
        ormsby: "but let the devil eat them, for it must have been he who put them there."
        vocab:
          - {w: "cómalos el diablo", d: "let the devil eat them, an exclamation of disgust or disowning"}
          - {w: "deber de", d: "must (a guess): 'debió de ser' = it must have been"}
        diagram:
          - s: "Pero cómalos el diablo"
            r: "main verb with subject: but let the devil eat them"
            under:
              - s: "que debió de ser el"
                r: "why: for it must have been the one"
                under:
                  - {s: "que ahí los puso", r: "describes 'el': who put them there"}
        forms:
          - {w: "cómalos", f: "com- + -a + los → comer (to eat), present subjunctive, he (the devil), used as a wish: 'may the devil eat them'; 'los' hangs on the end because the verb opens the clause. The present subjunctive of -er and -ir verbs: -a, -as, -a, -amos, -áis, -an."}
          - {w: "debió de ser", f: "deb- + -ió → deber (must), preterite, he: debí, debiste, debió, debimos, debisteis, debieron; 'deber de' + ser (to be) = 'must have been', a guess."}
          - {w: "puso", f: "pus- + -o → poner (to put), preterite, he. Irregular: puse, pusiste, puso, pusimos, pusisteis, pusieron."}
      - es: "¿Yo había de tener atrevimiento de ensuciar el yelmo de vuesa merced? ¡Hallado le habéis el atrevido!"
        literal: "I was-I-to have daring to dirty the helmet of your grace? Found him you-have the daring-one!"
        ormsby: "I dare to dirty your helmet! You have guessed the offender finely!"
        vocab:
          - {w: "atrevimiento", d: "daring, nerve, effrontery"}
          - {w: "ensuciar", d: "to dirty, soil"}
          - {w: "¡Hallado le habéis el atrevido!", d: "ironic: 'a fine culprit you've found!', i.e. you have the wrong man"}
          - {w: "atrevido", d: "bold, daring; as a noun, the bold one, the culprit"}
        diagram:
          - s: "¿Yo había de tener atrevimiento"
            r: "main verb 1 with subject: was I to have the nerve"
            under:
              - {s: "de ensuciar el yelmo de vuesa merced", r: "for what: to dirty your worship's helmet"}
          - s: "¡Hallado le habéis"
            r: "main verb 2: you have found him"
            under:
              - {s: "el atrevido!", r: "object, spelled out: the bold culprit"}
        forms:
          - {w: "había de tener", f: "hab- + -ía → haber (to have), imperfect, I: había, habías, había, habíamos, habíais, habían; 'haber de' + tener (to have) = 'was I going to have, would I have'."}
          - {w: "ensuciar", f: "infinitive after 'de': en- + suci(o) (dirty) + -ar, 'to make dirty'."}
          - {w: "Hallado le habéis", f: "habéis → haber (to have), present, you (vosotros): he, has, ha, hemos, habéis, han; + hallado, participle of hallar (to find), placed first for emphasis: modern 'le habéis hallado'. Sancho switches to the 'vos' form of 'you' (habéis), here ironic and mock-formal toward his master."}
          - {w: "le", f: "'him', the culprit, a masculine person as object (leísmo: Castilian often uses 'le' rather than 'lo' for a male person)."}
      - es: "A la fe, señor, a lo que Dios me da a entender, también debo yo de tener encantadores que me persiguen como a hechura y miembro de vuesa merced, y habrán puesto ahí esa inmundicia para mover a cólera su paciencia y hacer que me muela, como suele, las costillas."
        literal: "By the faith, sir, by what God to-me gives to understand, also must I have enchanters who me persecute as a creature and member of your grace, and they-will-have put there that filth to move to anger your patience and make that me you-may-grind, as you-are-wont, the ribs."
        ormsby: "Faith, sir, by the light God gives me, it seems I must have enchanters too, that persecute me as a creature and limb of your worship, and they must have put that nastiness there in order to provoke your patience to anger, and make you baste my ribs as you are wont to do."
        vocab:
          - {w: "a la fe", d: "in faith, truly (a mild oath)"}
          - {w: "a lo que Dios me da a entender", d: "as far as God lets me understand, by the light God gives me"}
          - {w: "encantador", d: "enchanter, sorcerer: Don Quijote blames them for every misfortune"}
          - {w: "hechura", d: "creature, dependant, a man made by his patron"}
          - {w: "inmundicia", d: "filth, muck"}
          - {w: "mover a cólera", d: "to move to anger, provoke"}
          - {w: "moler las costillas", d: "to grind someone's ribs, beat him black and blue"}
