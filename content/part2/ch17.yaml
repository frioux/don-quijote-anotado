  - sentences:
      - es: "— ¡Voto a tal, don bellaco, que si no abrís luego luego las jaulas, que con esta lanza os he de coser con el carro!"
        literal: "— I-vow to such, sir scoundrel, that if not you-open at-once at-once the cages, that with this lance you I-have to sew with the cart!"
        ormsby: "“By all that’s good, sir scoundrel, if you don’t open the cages this very instant, I’ll pin you to the cart with this lance.”"
        vocab:
          - {w: "¡voto a tal!", d: "an oath with the holy name left out ('I swear to such-and-such'), like 'by all that's holy!'"}
          - {w: "don bellaco", d: "'sir scoundrel': 'don' mockingly given to a low fellow; 'bellaco' = rogue, villain"}
          - {w: "luego luego", d: "at once, this very instant ('luego' in Cervantes means 'immediately', not 'later')"}
          - {w: "coser", d: "to sew; here to pin, run through and fasten"}
        diagram:
          - s: "que con esta lanza os he de coser con el carro!"
            r: "main verb: I will pin you to the cart with this lance"
            under:
              - {s: "¡Voto a tal, don bellaco", r: "oath and address: by heaven, you scoundrel"}
              - {s: "si no abrís luego luego las jaulas", r: "condition: if you don't open the cages this instant"}
        forms:
          - {w: "abrís", f: "abr- + -ís → abrir (to open), present, you (vos, to an inferior). The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "esta", f: "est- + -a → este (this), feminine to match 'lanza'."}
          - {w: "os he de coser", f: "he, haber (to have), present, I: he, has, ha, hemos, habéis, han; 'haber de' + infinitive = will surely, am going to: 'I will sew'. coser (to sew) is the infinitive. 'os' = you (vos), placed before the group."}
          - {w: "que ... que", f: "the second 'que' repeats the first after the 'si' clause interrupts; spoken Spanish often restarts this way."}
