          - {w: "señores leones", d: "'these gentlemen the lions', a mock-courteous title"}
        diagram:
          - s: "Éste es el mío"
            r: "main verb 1: this is mine (my job)"
          - s: "yo sé"
            r: "main verb 2 (after 'y'): I know"
            under:
              - s: "si vienen a mí, o no"
                r: "what I know: whether they come against me or not"
                under:
                  - {s: "estos señores leones", r: "subject of 'vienen': these gentlemen lions"}
        forms:
          - {w: "Éste", f: "est- + -e → este (this), written with an accent when it stands alone as a pronoun; masculine to match 'oficio'."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "el mío", f: "'mine', masculine singular to match 'oficio' understood."}
          - {w: "sé", f: "saber (to know), present, I. Irregular: sé, sabes, sabe, sabemos, sabéis, saben. The accent tells it from 'se' (oneself)."}
          - {w: "vienen", f: "vien- + -en → venir (to come), present, they. Irregular: vengo, vienes, viene, venimos, venís, vienen. The subject 'estos señores leones' comes at the end."}
