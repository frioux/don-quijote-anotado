          - {w: "razones", d: "words, speech (not 'reasons' here)"}
          - {w: "creíble", d: "credible, believable"}
          - {w: "siglos venideros", d: "ages to come; 'venidero' = future, coming"}
          - {w: "alabanza", d: "praise"}
          - {w: "convenir", d: "to befit, be suited to"}
          - {w: "cuadrar", d: "to fit, suit (lit. to square with)"}
          - {w: "hipérbole", d: "hyperbole, exaggeration; masculine here ('los hipérboles'), feminine in modern Spanish"}
        diagram:
