              - {s: "y el carretero a sus mulas", r: "3: and the carter his mules"}
              - s: "procurando todos apartarse del carro lo más"
                r: "how: all of them trying to get away from the cart as far"
                under:
                  - {s: "que pudiesen", r: "as they could"}
