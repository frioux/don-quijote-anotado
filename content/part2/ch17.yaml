                        under:
                          - {s: "el cual pareció de grandeza extraordinaria y de espantable y fea catadura", r: "describes 'león': which looked enormous and of a frightful, ugly aspect"}
        forms:
          - {w: "cesó, pasó", f: "ces- + -ó → cesar (to cease), preterite, it, and pas- + -ó → pasar (to pass), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "referida", f: "refer- + -ida → referir (to report), participle, feminine to match 'exclamación': 'aforesaid'."}
          - {w: "anudando", f: "anud- + -ando → anudar (to knot), gerund: 'tying up'."}
          - {w: "diciendo", f: "gerund of decir (to say); the e of the stem turns to i: decir → diciendo."}
          - {w: "visto", f: "irregular participle of ver (to see), opening an absolute construction: 'visto el leonero ya puesto en postura a don Quijote' = the keeper having seen Don Quijote already in position; modern 'al ver el leonero'."}
          - {w: "puesto", f: "irregular participle of poner (to put), masculine to match 'don Quijote', who is the object (hence 'a don Quijote', the personal 'a')."}
          - {w: "podía", f: "pod- + -ía → poder (to be able), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "dejar de soltar", f: "dejar (to leave off) + de + soltar (to let loose): after 'no podía', 'could not avoid letting loose'."}
          - {w: "abrió", f: "abr- + -ió → abrir (to open), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, it (the lion). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "se ha dicho", f: "ha → haber (to have), present, it: he, has, ha, hemos, habéis, han; + dicho, the irregular participle of decir (to say), with 'se' making it impersonal: 'as has been said'."}
