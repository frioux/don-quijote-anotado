              - s: "que él sabía lo"
                r: "what he answered: that he knew what"
                under:
                  - {s: "que hacía", r: "describes 'lo': he was doing"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "sabía, hacía", f: "sab- + -ía → saber (to know) and hac- + -ía → hacer (to do), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
      - es: "Respondióle el hidalgo que lo mirase bien, que él entendía que se engañaba."
