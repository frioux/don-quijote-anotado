          - s: "el cual respondió"
            r: "main verb 2: who (Don Quijote) answered"
            under:
              - {s: "que lo oía", r: "what he answered, 1: that he heard it"}
              - s: "y que no se curase de más intimaciones y requirimientos"
                r: "what he answered, 2: and that he should not bother with more notices and summonses"
