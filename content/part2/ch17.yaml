          - {w: "habrán puesto", f: "habr- + -án → haber (to have), future, they: habré, habrás, habrá, habremos, habréis, habrán; + puesto, irregular participle of poner (to put). The future perfect used for a guess about the past: 'they must have put'."}
          - {w: "esa", f: "es- + -a → ese (that), feminine to match 'inmundicia'."}
          - {w: "muela", f: "muel- + -a → moler (to grind), present subjunctive, you (vuesa merced, so the 'he' form), after 'hacer que'. The stem o becomes ue when stressed: muela, muelas, muela, molamos, moláis, muelan."}
          - {w: "suele", f: "suel- + -e → soler (to be in the habit of), present, you (vuesa merced, the 'he' form). soler (to be in the habit of) in the present: suelo, sueles, suele, solemos, soléis, suelen."}
        note: "Sancho turns his master's favourite excuse back on him: if enchanters change things around Don Quijote, they may as well persecute his squire too. The 'creature and limb' is the language of patronage, a servant being part of his lord's household body."
      - es: "Pues en verdad que esta vez han dado salto en vago, que yo confío en el buen discurso de mi señor, que habrá considerado que ni yo tengo requesones, ni leche, ni otra cosa que lo valga, y que si la tuviera, antes la pusiera en mi estómago que en la celada."
        literal: "Well in truth that this time they-have given leap in empty, for I trust in the good reasoning of my lord, who will-have considered that neither I have curds, nor milk, nor other thing that it may-be-worth, and that if it I-had, sooner it I-would-put in my stomach than in the helmet."
        ormsby: "Well, this time, indeed, they have missed their aim, for I trust to my master’s good sense to see that I have got no curds or milk, or anything of the sort; and that if I had it is in my stomach I would put it and not in the helmet.”"
        vocab:
          - {w: "dar salto en vago", d: "to leap at nothing, miss one's aim, come to nothing"}
          - {w: "confiar en", d: "to trust in, rely on"}
          - {w: "discurso", d: "reasoning, good sense (false friend: not a 'speech' here)"}
          - {w: "cosa que lo valga", d: "anything of the sort, anything like it (literally 'thing that is worth it')"}
          - {w: "antes ... que", d: "rather ... than, sooner ... than"}
        diagram:
          - s: "Pues en verdad que esta vez han dado salto en vago"
            r: "main verb: well, truly, this time they have missed"
            under:
              - s: "que yo confío en el buen discurso de mi señor"
                r: "why: for I trust my master's good sense"
                under:
                  - s: "que habrá considerado"
                    r: "describes 'mi señor': who will have considered"
                    under:
                      - {s: "que ni yo tengo requesones, ni leche, ni otra cosa que lo valga", r: "what he considered, 1: that I have no curds, no milk, nothing of the kind"}
                      - s: "y que ... antes la pusiera en mi estómago que en la celada"
                        r: "what he considered, 2: and that I would put it in my stomach rather than in the helmet"
                        under:
                          - {s: "si la tuviera", r: "condition: if I had any"}
        forms:
          - {w: "esta", f: "est- + -a → este (this), feminine to match 'vez'."}
          - {w: "han dado", f: "han → haber (to have), present, they: he, has, ha, hemos, habéis, han; + dado, participle of dar (to give): 'they have given (a leap at nothing)'."}
          - {w: "confío", f: "confí- + -o → confiar (to trust), present, I; the i takes an accent: confío, confías, confía, confiamos, confiáis, confían."}
          - {w: "habrá considerado", f: "habr- + -á → haber (to have), future, he: habré, habrás, habrá, habremos, habréis, habrán; + considerado, participle of considerar (to consider): 'he will have considered', i.e. surely he has realized."}
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "valga", f: "valg- + -a → valer (to be worth), present subjunctive, it. valga, valgas, valga, valgamos, valgáis, valgan."}
          - {w: "tuviera", f: "tuv- + -iera → tener (to have), imperfect subjunctive (-ra form), I, in the 'if' clause: 'if I had it'. tuviera, tuvieras, tuviera, tuviéramos, tuvierais, tuvieran."}
          - {w: "pusiera", f: "pus- + -iera → poner (to put), imperfect subjunctive (-ra form), I, used as a conditional: 'I would put'. pusiera, pusieras, pusiera, pusiéramos, pusierais, pusieran."}
          - {w: "la", f: "'it', feminine because it stands for 'otra cosa' (or 'leche')."}
  - sentences:
      - es: "— Todo puede ser —dijo don Quijote."
        literal: "— All can be —said Don Quijote."
        ormsby: "“May be so,” said Don Quixote."
        vocab:
          - {w: "todo puede ser", d: "anything is possible, that may be so"}
        diagram:
          - s: "dijo don Quijote"
            r: "main verb with subject: said Don Quijote"
            under:
              - {s: "Todo puede ser", r: "what he said: anything is possible"}
        forms:
          - {w: "puede", f: "pued- + -e → poder (to be able), present, it, + ser (to be): 'can be'. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
        note: "A dry reply: Don Quijote, who blames enchanters for everything, can hardly reject Sancho's enchanters out of hand."
  - sentences:
      - es: "Y todo lo miraba el hidalgo, y de todo se admiraba, especialmente cuando, después de haberse limpiado don Quijote cabeza, rostro y barbas y celada, se la encajó; y, afirmándose bien en los estribos, requiriendo la espada y asiendo la lanza, dijo:"
        literal: "And all it was-watching the gentleman, and at all himself he-was-amazed, especially when, after of having-himself wiped Don Quijote head, face and beard and helmet, himself it he-jammed-on; and, steadying-himself well in the stirrups, checking the sword and grasping the lance, he-said:"
        ormsby: "All this the gentleman was observing, and with astonishment, more especially when, after having wiped himself clean, his head, face, beard, and helmet, Don Quixote put it on, and settling himself firmly in his stirrups, easing his sword in the scabbard, and grasping his lance, he cried,"
        vocab:
          - {w: "admirarse", d: "to be amazed, astonished (false friend: not 'to admire')"}
          - {w: "afirmarse en los estribos", d: "to plant oneself firmly in the stirrups"}
          - {w: "requerir la espada", d: "to check the sword, loosen it in the scabbard ready to draw"}
          - {w: "asir", d: "to seize, grasp"}
        diagram:
          - {s: "Y todo lo miraba el hidalgo", r: "main verb 1 with subject: and the gentleman watched it all"}
          - s: "y de todo se admiraba"
            r: "main verb 2: and was amazed at everything"
            under:
              - s: "especialmente cuando"
                r: "when: especially when"
                under:
                  - {s: "después de haberse limpiado don Quijote cabeza, rostro y barbas y celada", r: "when, before that: after Don Quijote had wiped his head, face, beard and helmet"}
                  - {s: "se la encajó", r: "what happened: he jammed it on"}
          - s: "dijo:"
            r: "main verb 3 (after 'y'): he (Don Quijote) said"
            under:
              - {s: "afirmándose bien en los estribos", r: "how, 1: planting himself firmly in the stirrups"}
              - {s: "requiriendo la espada", r: "how, 2: checking his sword"}
              - {s: "asiendo la lanza", r: "how, 3: gripping the lance"}
        forms:
          - {w: "todo lo miraba", f: "mir- + -aba → mirar (to watch), imperfect, he; 'lo' repeats the object 'todo', as Spanish does when the object comes first. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "se admiraba", f: "admir- + -aba → admirarse (to be amazed), imperfect, he, with 'se'. Same -aba imperfect."}
          - {w: "haberse limpiado", f: "haber (to have) + se (himself), infinitive after 'después de', + limpiado, participle of limpiar (to wipe): 'having wiped (his head etc.)'; the subject 'don Quijote' follows."}
          - {w: "se la encajó", f: "encaj- + -ó → encajar (to jam on), preterite, he; 'se' (on himself) + 'la' (it, the helmet). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "afirmándose", f: "gerund of afirmar (to steady) + se (himself); accent added to keep the stress."}
          - {w: "requiriendo", f: "gerund of requerir (to check); the stem e becomes i in the gerund: requerir → requiriendo."}
          - {w: "asiendo", f: "gerund of asir (to grasp): as- + -iendo."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Ahora, venga lo que veniere, que aquí estoy con ánimo de tomarme con el mesmo Satanás en persona."
        literal: "— Now, let-come what may-come, for here I-am with spirit to take-myself-on with the same Satan in person."
        ormsby: "“Now, come who will, here am I, ready to try conclusions with Satan himself in person!”"
        vocab:
          - {w: "venga lo que veniere", d: "come what may"}
          - {w: "ánimo", d: "courage, spirit, resolve"}
          - {w: "tomarse con", d: "to take on, pick a fight with"}
          - {w: "mesmo", d: "= mismo, same; here 'himself' ('el mesmo Satanás' = Satan himself) (old form)"}
        diagram:
          - {s: "Ahora, venga lo que veniere", r: "main verb 1: now, let come what may"}
          - s: "que aquí estoy"
            r: "main verb 2: for here I am"
            under:
              - {s: "con ánimo de tomarme con el mesmo Satanás en persona", r: "how: ready to take on Satan himself in person"}
        forms:
          - {w: "venga", f: "veng- + -a → venir (to come), present subjunctive, it, as a wish: 'let (it) come'. venga, vengas, venga, vengamos, vengáis, vengan."}
          - {w: "veniere", f: "ven- + -iere → venir (to come), future subjunctive, it: 'whatever may come'. Built on the preterite vinieron, modern form 'viniere': viniere, vinieres, viniere, viniéremos, viniereis, vinieren; Cervantes' 'veniere' is an old variant. Modern Spanish uses the present subjunctive: 'venga lo que venga'."}
          - {w: "estoy", f: "est- + -oy → estar (to be), present, I. Irregular: estoy, estás, está, estamos, estáis, están."}
          - {w: "tomarme", f: "tomar (to take; 'tomarse con' = to take on) + me (myself), the pronoun hung on the infinitive after 'de'."}
          - {w: "mesmo", f: "= mismo (same, himself), old form, masculine to match 'Satanás'."}
  - sentences:
      - es: "Llegó en esto el carro de las banderas, en el cual no venía otra gente que el carretero, en las mulas, y un hombre sentado en la delantera. Púsose don Quijote delante y dijo:"
        literal: "Arrived at this the cart of the flags, in the which not was-coming other people than the carter, on the mules, and a man seated in the front. Put-himself Don Quijote in-front and said:"
        ormsby: "By this time the cart with the flags had come up, unattended by anyone except the carter on a mule, and a man sitting in front. Don Quixote planted himself before it and said,"
        vocab:
          - {w: "en esto", d: "at this point, meanwhile"}
          - {w: "carretero", d: "carter, wagoner"}
          - {w: "delantera", d: "the front part (of the cart), the front seat"}
          - {w: "ponerse delante", d: "to plant oneself in front, block the way"}
        diagram:
          - s: "Llegó en esto el carro de las banderas"
            r: "main verb 1 with subject: at this the cart with the flags arrived"
            under:
              - s: "en el cual no venía otra gente"
                r: "describes 'carro': in which there came no other people"
                under:
                  - {s: "que el carretero, en las mulas, y un hombre sentado en la delantera", r: "than: than the carter, on the mules, and a man sitting in front"}
          - {s: "Púsose don Quijote delante", r: "main verb 2 with subject: Don Quijote planted himself in front"}
          - {s: "y dijo:", r: "main verb 3: and said"}
        forms:
          - {w: "Llegó", f: "lleg- + -ó → llegar (to arrive), preterite, it (the cart). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "el cual", f: "'which', masculine to match 'carro'; a heavier relative than 'que', used after a preposition."}
          - {w: "venía", f: "ven- + -ía → venir (to come), imperfect, it ('otra gente' is singular). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "sentado", f: "participle of sentar (to seat), masculine to match 'hombre': 'seated'."}
          - {w: "Púsose", f: "pus- + -o + se → ponerse (to place oneself), preterite, he, with 'se' stuck on the end; modern 'se puso'. Cervantes hangs the pronoun on a verb that opens a clause. poner (to put) in the preterite: puse, pusiste, puso, pusimos, pusisteis, pusieron."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— ¿Adónde vais, hermanos? ¿Qué carro es éste, qué lleváis en él y qué banderas son aquéstas?"
        literal: "— Where are-you-going, brothers? What cart is this, what are-you-carrying in it and what flags are these?"
        ormsby: "“Whither are you going, brothers? What cart is this? What have you got in it? What flags are those?”"
        vocab:
          - {w: "hermanos", d: "brothers: a friendly way to address strangers of lower rank"}
          - {w: "aquéstas", d: "= éstas, these (old emphatic form)"}
        diagram:
          - s: "¿Adónde vais, hermanos?"
            r: "question 1: where are you going, brothers?"
          - {s: "¿Qué carro es éste", r: "question 2: what cart is this"}
          - {s: "qué lleváis en él", r: "question 3: what are you carrying in it"}
          - {s: "y qué banderas son aquéstas?", r: "question 4: and what flags are these"}
        forms:
          - {w: "vais", f: "v- + -ais → ir (to go), present, you (vosotros, plural). Irregular: voy, vas, va, vamos, vais, van."}
          - {w: "es, son", f: "ser (to be), present, it and they. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "éste", f: "este (this) used as a pronoun ('this one'), written with an accent in Cervantes' editions."}
          - {w: "lleváis", f: "llev- + -áis → llevar (to carry), present, you (vosotros). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "aquéstas", f: "= éstas (these), old form 'aqueste' of 'este', feminine plural to match 'banderas'."}
  - sentences:
