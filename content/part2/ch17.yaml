  - sentences:
      - es: "Detuviéronse todos, y conocieron que el que hacía las señas era don Quijote; y, perdiendo alguna parte del miedo, poco a poco se vinieron acercando hasta donde claramente oyeron las voces de don Quijote, que los llamaba."
        literal: "Stopped-themselves all, and they-recognized that the one who was-making the signs was Don Quijote; and, losing some part of-the fear, little by little themselves they-came approaching until where clearly they-heard the voices of Don Quijote, who them was-calling."
        ormsby: "They all stopped, and perceived that it was Don Quixote who was making signals, and shaking off their fears to some extent, they approached slowly until they were near enough to hear distinctly Don Quixote’s voice calling to them."
        vocab:
          - {w: "detenerse", d: "to stop, halt"}
          - {w: "conocer", d: "here 'to recognize, realize'"}
          - {w: "poco a poco", d: "little by little"}
          - {w: "venirse acercando", d: "to come gradually nearer"}
          - {w: "voces", d: "shouts, calls (plural for one person's shouting)"}
