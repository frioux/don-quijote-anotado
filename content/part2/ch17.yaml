  - sentences:
      - es: "— Volved, hermano, a uncir vuestras mulas y a proseguir vuestro viaje; y tú, Sancho, dale dos escudos de oro, para él y para el leonero, en recompensa de lo que por mí se han detenido."
        literal: "— Return, brother, to yoke your mules and to continue your journey; and you, Sancho, give-him two crowns of gold, for him and for the lion-keeper, in recompense of that which through me themselves they-have delayed."
        ormsby: "“Put your mules to once more, brother, and continue your journey; and do thou, Sancho, give him two gold crowns for himself and the keeper, to compensate for the delay they have incurred through me.”"
        vocab:
          - {w: "volver a + infinitive", d: "to do again"}
          - {w: "uncir", d: "to yoke, harness"}
          - {w: "hermano", d: "brother: friendly address to a stranger of lower rank"}
          - {w: "proseguir", d: "to continue, go on with"}
          - {w: "escudo de oro", d: "gold crown, a gold coin: a generous tip"}
          - {w: "en recompensa de", d: "in return for, to make up for"}
          - {w: "detenerse", d: "to be delayed, stop"}
        diagram:
          - s: "Volved, hermano, a uncir vuestras mulas"
            r: "main verb 1: brother, yoke your mules again"
            under:
              - {s: "y a proseguir vuestro viaje", r: "also after 'volved': and go on with your journey"}
          - s: "dale dos escudos de oro"
            r: "main verb 2: give him two gold crowns"
            under:
              - {s: "y tú, Sancho", r: "subject and address: and you, Sancho"}
              - {s: "para él y para el leonero", r: "for whom: for him and the keeper"}
              - {s: "en recompensa de lo que por mí se han detenido", r: "why: to make up for the time they have been held up by me"}
        forms:
