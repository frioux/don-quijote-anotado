        literal: "Was-weeping Sancho the death of his master, which that time without doubt he-believed that it-was-arriving in the claws of the lions;"
        ormsby: "Sancho was weeping over his master’s death, for this time he firmly believed it was in store for him from the claws of the lions;"
        vocab:
          - {w: "llorar", d: "to weep; with an object, to weep over, mourn ('lloraba la muerte' = was mourning the death)"}
          - {w: "aquella vez", d: "that time, on that occasion"}
          - {w: "garras", d: "claws, talons"}
