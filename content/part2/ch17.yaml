          - {w: "tenía", f: "ten- + -ía → tener (to hold), imperfect, he. Same -ía imperfect: tenía, tenías, tenía, teníamos, teníais, tenían."}
          - {w: "hablaba", f: "habl- + -aba → hablar (to speak), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
