        vocab:
          - {w: "tan ... que", d: "so ... that"}
          - {w: "pasar", d: "to cross over; also, transitive, to bring across"}
          - {w: "leonero", d: "lion-keeper"}
        diagram:
          - s: "respondió el hombre"
            r: "main verb (the speech tag): the man answered"
            under:
              - {s: "que iba a la puerta del carro", r: "describes 'hombre': who rode at the door of the cart"}
          - s: "Tan grandes"
            r: "his answer: so big"
            under:
              - {s: "que no han pasado mayores, ni tan grandes, de Africa a España jamás", r: "result: that none bigger, or as big, have ever crossed from Africa to Spain"}
          - {s: "y yo soy el leonero", r: "main verb 2: and I am the keeper"}
          - s: "y he pasado otros"
            r: "main verb 3: and I have brought over others"
            under:
              - {s: "pero como éstos, ninguno", r: "but: but none like these"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "iba", f: "ir (to go), imperfect, he: 'was riding'. Irregular: iba, ibas, iba, íbamos, ibais, iban."}
          - {w: "han pasado", f: "han → haber (to have), present, they: he, has, ha, hemos, habéis, han; + pasado, participle of pasar (to cross): 'have crossed'."}
          - {w: "mayores", f: "plural of mayor (bigger), to match the lions."}
