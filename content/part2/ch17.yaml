          - {w: "curarse de", d: "to bother about, take heed of (old sense of 'curar' = to care)"}
          - {w: "requirimiento", d: "= requerimiento, formal summons (old spelling)"}
          - {w: "de poco fruto", d: "of little use, fruitless"}
          - {w: "darse priesa", d: "to hurry up ('priesa' = prisa)"}
