        literal: "— By life of my lady Dulcinea del Toboso, that they-are curds those that here to-me you-have put, traitor, rogue and ill considered squire."
        ormsby: "“By the life of my lady Dulcinea del Toboso, but it is curds thou hast put here, thou treacherous, impudent, ill-mannered squire!”"
        vocab:
          - {w: "por vida de", d: "by the life of: an oath"}
          - {w: "bergante", d: "rogue, scoundrel, rascal"}
          - {w: "mal mirado", d: "ill-mannered, inconsiderate, disrespectful"}
        diagram:
          - {s: "Por vida de mi señora Dulcinea del Toboso", r: "oath: by the life of my lady Dulcinea"}
          - s: "que son requesones"
            r: "main verb: (I swear) that they are curds"
            under:
              - {s: "los que aquí me has puesto", r: "subject: the things you have put here on me"}
          - {s: "traidor, bergante y mal mirado escudero", r: "address: you traitor, rogue and ill-mannered squire"}
        forms:
          - {w: "son", f: "ser (to be), present, they. Irregular: soy, eres, es, somos, sois, son."}
