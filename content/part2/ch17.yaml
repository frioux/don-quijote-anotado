          - s: "¿qué se han hecho los leones?"
            r: "main verb 2 (after 'pero'): what has become of the lions?"
          - s: "¿Son muertos, o vivos?"
            r: "main verb 3: are they dead or alive?"
        forms:
          - {w: "Ésos", f: "es- + -os → ese (that), masculine plural to match 'escudos'; with the accent it stands alone as a pronoun, 'those'."}
          - {w: "daré", f: "dar- + -é → dar (to give), future, I. The future adds endings to the whole infinitive: daré, darás, dará, daremos, daréis, darán."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "se han hecho", f: "han → haber (to have), present, they: he, has, ha, hemos, habéis, han; + hecho, the irregular participle of hacer (to make), with 'se': 'what have the lions become', i.e. what has become of them."}
          - {w: "Son", f: "son → ser (to be), present, they: soy, eres, es, somos, sois, son. Cervantes uses ser (to be) with 'muertos', where modern Spanish says 'están muertos'."}
  - sentences:
      - es: "Entonces el leonero, menudamente y por sus pausas, contó el fin de la contienda, exagerando, como él mejor pudo y supo, el valor de don Quijote, de cuya vista el león, acobardado, no quiso ni osó salir de la jaula, puesto que había tenido un buen espacio abierta la puerta de la jaula;"
