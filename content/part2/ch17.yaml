          - {w: "mirase", f: "mir- + -ase → mirar (to look at, consider), imperfect subjunctive (-se form), he. The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. Subjunctive because it reports advice."}
          - {w: "entendía", f: "entend- + -ía → entender (to understand, think), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "se engañaba", f: "engañ- + -aba → engañarse (to be mistaken), imperfect, he, with 'se'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
  - sentences:
      - es: "— Ahora, señor —replicó don Quijote—, si vuesa merced no quiere ser oyente desta que a su parecer ha de ser tragedia, pique la tordilla y póngase en salvo."
        literal: "— Now, sir —replied Don Quijote—, if your grace not wants to-be hearer of-this which in your opinion has to be tragedy, spur the dapple-grey-mare and put-yourself in safety."
        ormsby: "“Well, señor,” answered Don Quixote, “if you do not like to be a spectator of this tragedy, as in your opinion it will be, spur your flea-bitten mare, and place yourself in safety.”"
        vocab:
          - {w: "ahora", d: "here 'well then', introducing a conclusion"}
          - {w: "oyente", d: "hearer, listener; here audience, spectator (plays were 'heard' as much as seen)"}
          - {w: "a su parecer", d: "in your opinion"}
          - {w: "picar", d: "to spur (a horse)"}
          - {w: "tordillo, tordilla", d: "dapple-grey, flecked grey (of a horse; 'tordo' = thrush); Ormsby's 'flea-bitten' is the English horse-dealers' term"}
          - {w: "ponerse en salvo", d: "to get to safety"}
        diagram:
          - s: "pique la tordilla"
            r: "main verb 1: spur your grey mare"
            under:
              - {s: "Ahora, señor", r: "linking and address: well then, sir"}
              - s: "si vuesa merced no quiere ser oyente desta"
                r: "condition: if your worship doesn't want to be audience to this"
                under:
                  - {s: "que a su parecer ha de ser tragedia", r: "describes 'esta': which in your view will be a tragedy"}
          - {s: "—replicó don Quijote—", r: "frame: Don Quijote replied"}
          - {s: "y póngase en salvo", r: "main verb 2: and get to safety"}
        forms:
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "quiere", f: "quier- + -e → querer (to want), present, you (vuesa merced takes the 'he' form). The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "ser", f: "ser (to be), infinitive after 'quiere'."}
          - {w: "desta", f: "= de + esta, 'of this (one)', the old contraction; 'esta' stands for the adventure, feminine."}
          - {w: "ha de ser", f: "ha, haber (to have), present, it: he, has, ha, hemos, habéis, han; 'haber de' + infinitive = to be going to: 'it is going to be'. ser (to be) is the infinitive."}
          - {w: "pique", f: "piqu- + -e → picar (to spur), present subjunctive, you (vuesa merced), as a polite command; c becomes qu before e. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "póngase", f: "pong- + -a + se → ponerse (to put oneself), present subjunctive, you (vuesa merced), as a polite command, with 'se' on the end; accent added to keep the stress. poner (to put) in the present subjunctive: ponga, pongas, ponga, pongamos, pongáis, pongan."}
  - sentences:
      - es: "Oído lo cual por Sancho, con lágrimas en los ojos le suplicó desistiese de tal empresa, en cuya comparación habían sido tortas y pan pintado la de los molinos de viento y la temerosa de los batanes, y, finalmente, todas las hazañas que había acometido en todo el discurso de su vida."
        literal: "Heard the which by Sancho, with tears in the eyes him he-begged he-should-desist from such enterprise, in whose comparison had been cakes and bread painted the [one] of the mills of wind and the fearful [one] of the fulling-mills, and, finally, all the feats that he-had undertaken in all the course of his life."
        ormsby: "Hearing this, Sancho with tears in his eyes entreated him to give up an enterprise compared with which the one of the windmills, and the awful one of the fulling mills, and, in fact, all the feats he had attempted in the whole course of his life, were cakes and fancy bread."
        vocab:
          - {w: "oído lo cual", d: "this being heard, on hearing which (an absolute participle phrase)"}
          - {w: "suplicar", d: "to beg, implore"}
          - {w: "desistir de", d: "to give up, abandon"}
          - {w: "empresa", d: "undertaking, enterprise (not 'company' here)"}
          - {w: "en cuya comparación", d: "compared with which"}
          - {w: "tortas y pan pintado", d: "'cakes and decorated bread': child's play, nothing at all by comparison ('pan pintado' was festive bread stamped with a pattern)"}
          - {w: "molinos de viento", d: "windmills, the giants Don Quijote charged in Part I, Chapter VIII"}
          - {w: "batanes", d: "fulling mills, water-driven hammers for pounding cloth, whose terrifying noise kept master and squire awake all night in Part I, Chapter XX"}
          - {w: "hazaña", d: "feat, exploit"}
          - {w: "discurso", d: "course (of time, of life); a false friend, not 'speech' here"}
        diagram:
          - s: "le suplicó"
            r: "main verb: he (Sancho) begged him"
            under:
              - {s: "Oído lo cual por Sancho", r: "when: when Sancho heard this"}
              - {s: "con lágrimas en los ojos", r: "how: with tears in his eyes"}
              - s: "desistiese de tal empresa"
                r: "what he begged: that he give up such an enterprise"
                under:
                  - s: "en cuya comparación habían sido tortas y pan pintado"
                    r: "describes 'empresa': compared to which had been child's play"
                    under:
                      - {s: "la de los molinos de viento", r: "subject 1: the one of the windmills"}
                      - {s: "y la temerosa de los batanes", r: "subject 2: and the fearful one of the fulling mills"}
                      - s: "y, finalmente, todas las hazañas"
                        r: "subject 3: and in short all the feats"
                        under:
                          - {s: "que había acometido en todo el discurso de su vida", r: "describes 'hazañas': he had undertaken in the whole course of his life"}
        forms:
          - {w: "Oído", f: "participle of oír (to hear), in an absolute phrase: 'this having been heard by Sancho'. Spanish can open a sentence with a participle and its own subject ('lo cual')."}
          - {w: "suplicó", f: "suplic- + -ó → suplicar (to beg), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "desistiese", f: "desist- + -iese → desistir (to give up), imperfect subjunctive (-se form), he: 'that he should give up'. The -se imperfect subjunctive of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen. The 'que' before it is left out, as Cervantes often does after verbs of asking."}
          - {w: "cuya", f: "'whose', feminine to match 'comparación' (the thing owned), not the owner: cuyo, cuya, cuyos, cuyas."}
          - {w: "habían sido", f: "habían, haber (to have), imperfect, they: había, habías, había, habíamos, habíais, habían; + sido, participle of ser (to be): the pluperfect 'had been'."}
          - {w: "temerosa", f: "temer (to fear) + -osa, feminine adjective to match 'la' (the adventure): 'fearful'."}
          - {w: "había acometido", f: "había, haber (to have), imperfect, he: había, habías, había, habíamos, habíais, habían; + acometido, participle of acometer (to undertake): 'he had undertaken'."}
        note: "Sancho ranks the lions above the two great frights of Part I: the windmills Don Quijote took for giants and the night of the fulling mills, when an unseen pounding terrified them both until dawn."
  - sentences:
