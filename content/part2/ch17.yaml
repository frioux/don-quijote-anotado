part: 2
chapter: 17
title_es: "Capítulo XVII. De donde se declaró el último punto y estremo adonde llegó y pudo llegar el inaudito ánimo de don Quijote, con la felicemente acabada aventura de los leones"
title_en: "Wherein is shown the furthest and highest point which the unexampled courage of Don Quixote reached or could reach; together with the happily achieved adventure of the lions"
paragraphs:
  - sentences:
      - es: "Cuenta la historia que cuando don Quijote daba voces a Sancho que le trujese el yelmo, estaba él comprando unos requesones que los pastores le vendían;"
        literal: "Tells the history that when Don Quijote was-giving shouts to Sancho that to-him he-should-bring the helmet, was he buying some curd-cheeses that the shepherds to-him were-selling;"
        ormsby: "and so, going on with his story, he says that when Don Quixote called out to Sancho to bring him his helmet, Sancho was buying some curds the shepherds agreed to sell him,"
        vocab:
          - {w: "cuenta la historia", d: "the history relates: the narrator's usual formula for taking up the thread"}
          - {w: "dar voces", d: "to shout, call out"}
          - {w: "trujese", d: "= trajese, old form of the -se subjunctive of traer (to bring)"}
          - {w: "yelmo", d: "helmet; in this chapter Cervantes calls the same headpiece both 'yelmo' and 'celada'"}
          - {w: "requesón", d: "curd cheese, fresh soft cheese like cottage cheese, dripping with whey"}
        diagram:
          - s: "Cuenta la historia"
            r: "main verb and subject: the history tells"
            under:
              - s: "que ... estaba él comprando unos requesones"
                r: "what it tells: that he (Sancho) was buying some curds"
                under:
                  - s: "cuando don Quijote daba voces a Sancho"
                    r: "when: when Don Quijote was shouting to Sancho"
                    under:
                      - {s: "que le trujese el yelmo", r: "what he shouted: that he should bring him the helmet"}
                  - {s: "que los pastores le vendían", r: "describes 'requesones': that the shepherds were selling him"}
        forms:
          - {w: "Cuenta", f: "cuent- + -a → contar (to tell), present, it (the history). The stem o becomes ue when stressed: cuento, cuentas, cuenta, contamos, contáis, cuentan."}
          - {w: "daba", f: "d- + -aba → dar (to give), imperfect, he; 'daba voces' = was shouting. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "trujese", f: "truj- + -ese → traer (to bring), imperfect subjunctive (-se form), he; old form of 'trajese'. trujese, trujeses, trujese, trujésemos, trujeseis, trujesen. Subjunctive because it reports an order ('shouted that he should bring')."}
          - {w: "estaba ... comprando", f: "est- + -aba → estar (to be), imperfect, he: estaba, estabas, estaba, estábamos, estabais, estaban; + comprando, gerund of comprar (to buy): 'was buying', an action in progress."}
          - {w: "vendían", f: "vend- + -ían → vender (to sell), imperfect, they (the shepherds). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
        note: "Ormsby, following the editor Hartzenbusch, moved the opening paragraph of Spanish chapter X (the author's fear of not being believed, and the truth floating on lies like oil on water) to the start of his chapter XVII, so his chapter begins with that passage. In this edition it stays in chapter X, where Cervantes' first editions put it, and Ormsby's text here starts after it."
      - es: "y, acosado de la mucha priesa de su amo, no supo qué hacer dellos, ni en qué traerlos, y, por no perderlos, que ya los tenía pagados, acordó de echarlos en la celada de su señor, y con este buen recado volvió a ver lo que le quería; el cual, en llegando, le dijo:"
        literal: "and, harried by the much haste of his master, not he-knew what to-do of-them, nor in what to-carry-them, and, so-as not to-lose-them, for already them he-had paid, he-decided to throw-them in the helmet of his lord, and with this good provision he-went-back to see what him he-wanted; the which, on arriving, to-him said:"
        ormsby: "and flurried by the great haste his master was in did not know what to do with them or what to carry them in; so, not to lose them, for he had already paid for them, he thought it best to throw them into his master’s helmet, and acting on this bright idea he went to see what his master wanted with him. He, as he approached, exclaimed to him:"
        vocab:
          - {w: "acosado", d: "harried, hard-pressed (from 'acosar', to hound, harass)"}
          - {w: "priesa", d: "= prisa, haste, hurry (old form)"}
          - {w: "dellos", d: "= de ellos, of them (old contraction)"}
          - {w: "acordar de", d: "to decide to (old construction; modern 'acordar' + infinitive)"}
          - {w: "celada", d: "sallet, a light open helmet; used here interchangeably with 'yelmo'"}
          - {w: "recado", d: "provision, supply (of food); ironically 'this fine arrangement'"}
          - {w: "en llegando", d: "on arriving, as soon as he arrived ('en' + gerund = as soon as)"}
        diagram:
          - s: "no supo qué hacer dellos, ni en qué traerlos"
            r: "main verb 1 (Sancho): he did not know what to do with them, nor what to carry them in"
            under:
              - {s: "acosado de la mucha priesa de su amo", r: "how: harried by his master's great hurry"}
          - s: "acordó de echarlos en la celada de su señor"
            r: "main verb 2 (after 'y'): he decided to throw them into his master's helmet"
            under:
              - s: "por no perderlos"
                r: "why: so as not to lose them"
                under:
                  - {s: "que ya los tenía pagados", r: "why, 2: since he had already paid for them"}
          - s: "volvió a ver"
            r: "main verb 3 (after 'y'): he went back to see"
            under:
              - {s: "con este buen recado", r: "how: with this fine provision"}
              - {s: "lo que le quería", r: "what he went to see: what he (Don Quijote) wanted with him"}
          - s: "el cual ... le dijo:"
            r: "new clause: who (Don Quijote) said to him"
            under:
              - {s: "en llegando", r: "when: as soon as he (Sancho) arrived"}
        forms:
          - {w: "acosado", f: "acos- + -ado → acosar (to harass), participle, masculine to match Sancho: 'harried'."}
          - {w: "supo", f: "sup- + -o → saber (to know), preterite, he. Irregular: supe, supiste, supo, supimos, supisteis, supieron."}
          - {w: "dellos", f: "= de + ellos, the old contraction; modern 'de ellos'."}
          - {w: "traerlos, perderlos, echarlos", f: "traer (to carry), perder (to lose), echar (to throw), each with 'los' (them, the curds) hung on the end of the infinitive."}
          - {w: "tenía pagados", f: "ten- + -ía → tener (to have), imperfect, he: tenía, tenías, tenía, teníamos, teníais, tenían; + pagados, participle of pagar (to pay), masculine plural to agree with 'los' (the curds): 'he had them paid for'."}
          - {w: "acordó", f: "acord- + -ó → acordar (to decide), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "volvió", f: "volv- + -ió → volver (to return), preterite, he; 'volver a' + infinitive = to go back to (do something). The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "quería", f: "quer- + -ía → querer (to want), imperfect, he (Don Quijote). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "en llegando", f: "gerund of llegar (to arrive) after 'en', meaning 'as soon as he arrived'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Dame, amigo, esa celada; que yo sé poco de aventuras, o lo que allí descubro es alguna que me ha de necesitar, y me necesita, a tomar mis armas."
        literal: "— Give-me, friend, that helmet; for I know little of adventures, or that-which there I-discover is some [adventure] that me is-going to oblige, and me obliges, to take-up my arms."
        ormsby: "“Give me that helmet, my friend, for either I know little of adventures, or what I observe yonder is one that will, and does, call upon me to arm myself.”"
        vocab:
          - {w: "o yo sé poco de ... o", d: "either I know little about ... or: a confident boast, 'I'm much mistaken if ...'"}
          - {w: "descubrir", d: "to make out, catch sight of (in the distance)"}
          - {w: "necesitar a", d: "here 'to oblige, compel (someone) to', an old sense; modern 'necesitar' = to need"}
          - {w: "tomar las armas", d: "to take up arms, arm oneself"}
        diagram:
          - s: "Dame, amigo, esa celada"
            r: "main verb 1: give me, friend, that helmet"
          - s: "que yo sé poco de aventuras"
            r: "why: for (either) I know little of adventures"
          - s: "o lo que allí descubro es alguna"
            r: "or (the other half): what I see there is one (an adventure)"
            under:
              - {s: "que me ha de necesitar, y me necesita, a tomar mis armas", r: "describes 'alguna': that will force me, and does force me, to take up my arms"}
        forms:
          - {w: "Dame", f: "da + me → dar (to give), imperative, you (tú): 'give me'. The pronoun hangs on the end of a positive command."}
          - {w: "esa", f: "es- + -a → ese (that), feminine to match 'celada'."}
          - {w: "sé", f: "saber (to know), present, I. Irregular: sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "descubro", f: "descubr- + -o → descubrir (to make out), present, I. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "ha de necesitar", f: "ha → haber (to have), present, it: he, has, ha, hemos, habéis, han; 'haber de' + infinitive = 'is going to, must': 'will oblige'."}
          - {w: "necesita", f: "necesit- + -a → necesitar (to oblige), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "mis armas", f: "mis = plural to match 'armas', 'my arms'."}
  - sentences:
      - es: "El del Verde Gabán, que esto oyó, tendió la vista por todas partes, y no descubrió otra cosa que un carro que hacia ellos venía, con dos o tres banderas pequeñas, que le dieron a entender que el tal carro debía de traer moneda de Su Majestad, y así se lo dijo a don Quijote;"
        literal: "The [one] of-the Green Coat, who this heard, stretched the sight through all parts, and not discovered other thing than a cart that towards them was-coming, with two or three flags small, which to-him gave to understand that the such cart must have-been carrying money of His Majesty, and so it to-him he-said to Don Quijote;"
        ormsby: "He of the green gabán, on hearing this, looked in all directions, but could perceive nothing, except a cart coming towards them with two or three small flags, which led him to conclude it must be carrying treasure of the King’s, and he said so to Don Quixote."
        vocab:
          - {w: "el del Verde Gabán", d: "the man in the green coat: Don Diego de Miranda, met in the previous chapter; 'gabán' = a long riding coat"}
          - {w: "tender la vista", d: "to cast one's eyes, look far around"}
          - {w: "no ... otra cosa que", d: "nothing but, nothing other than"}
          - {w: "carro", d: "cart, wagon"}
          - {w: "dar a entender", d: "to suggest, give to understand"}
          - {w: "el tal", d: "the said, this (pointing back): 'el tal carro' = this cart"}
          - {w: "deber de", d: "must (probability): 'debía de traer' = must be carrying"}
          - {w: "moneda de Su Majestad", d: "the King's money: royal funds, tax revenue in transit, which travelled under royal flags"}
        diagram:
          - s: "El del Verde Gabán ... tendió la vista por todas partes"
            r: "main verb 1 with subject: the man in the green coat looked all around"
            under:
              - {s: "que esto oyó", r: "describes 'El del Verde Gabán': who heard this"}
          - s: "y no descubrió otra cosa que un carro"
            r: "main verb 2: and saw nothing but a cart"
            under:
              - {s: "que hacia ellos venía", r: "describes 'carro': that was coming toward them"}
              - s: "con dos o tres banderas pequeñas"
                r: "describes 'carro': with two or three small flags"
                under:
                  - s: "que le dieron a entender"
                    r: "describes 'banderas': which made him think"
                    under:
                      - {s: "que el tal carro debía de traer moneda de Su Majestad", r: "what he thought: that the cart must be carrying the King's money"}
          - {s: "y así se lo dijo a don Quijote", r: "main verb 3: and he told Don Quijote so"}
        forms:
          - {w: "oyó", f: "o- + -yó → oír (to hear), preterite, he; the i of -ió becomes y between vowels: oí, oíste, oyó, oímos, oísteis, oyeron."}
          - {w: "tendió", f: "tend- + -ió → tender (to stretch, cast), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "descubrió", f: "descubr- + -ió → descubrir (to make out), preterite, he. Same -ió preterite."}
          - {w: "venía", f: "ven- + -ía → venir (to come), imperfect, it (the cart). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "pequeñas", f: "pequeñ- + -as → pequeño (small), feminine plural to match 'banderas'."}
          - {w: "dieron", f: "d- + -ieron → dar (to give), preterite, they (the flags). Irregular: di, diste, dio, dimos, disteis, dieron."}
          - {w: "debía de traer", f: "deb- + -ía → deber (must), imperfect, it: debía, debías, debía, debíamos, debíais, debían; 'deber de' + traer (to carry) gives a guess: 'must have been carrying'."}
          - {w: "se lo dijo", f: "se lo = le lo: 'le' (to him) becomes 'se' before 'lo' (it); dijo → decir (to say), preterite, he: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
      - es: "pero él no le dio crédito, siempre creyendo y pensando que todo lo que le sucediese habían de ser aventuras y más aventuras, y así, respondió al hidalgo:"
        literal: "but he not to-him gave credit, always believing and thinking that all that-which to-him might-happen had to be adventures and more adventures, and so, he-answered to-the gentleman:"
        ormsby: "He, however, would not believe him, being always persuaded and convinced that all that happened to him must be adventures and still more adventures; so he replied to the gentleman,"
        vocab:
          - {w: "dar crédito", d: "to believe, give credence"}
          - {w: "suceder", d: "to happen, befall (false friend: not 'to succeed')"}
          - {w: "hidalgo", d: "gentleman of the lesser nobility; here Don Diego"}
        diagram:
          - s: "pero él no le dio crédito"
            r: "main verb 1: but he (Don Quijote) did not believe him"
            under:
              - s: "siempre creyendo y pensando"
                r: "why: always believing and thinking"
                under:
                  - {s: "que todo lo que le sucediese habían de ser aventuras y más aventuras", r: "what he thought: that everything that happened to him must be adventures upon adventures"}
          - {s: "y así, respondió al hidalgo:", r: "main verb 2: and so he answered the gentleman"}
        forms:
          - {w: "dio", f: "d- + -io → dar (to give), preterite, he. Irregular: di, diste, dio, dimos, disteis, dieron."}
          - {w: "creyendo", f: "gerund of creer (to believe); the i of -iendo becomes y between vowels: creyendo."}
          - {w: "pensando", f: "gerund of pensar (to think): 'thinking'."}
          - {w: "sucediese", f: "suced- + -iese → suceder (to happen), imperfect subjunctive (-se form), it: 'whatever might happen'. The -se imperfect subjunctive of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen."}
          - {w: "habían de ser", f: "hab- + -ían → haber (to have), imperfect, they: había, habías, había, habíamos, habíais, habían; 'haber de' + ser (to be) = 'had to be, were bound to be'. Plural to agree with 'aventuras', not with 'todo'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "al", f: "a + el, the contraction modern Spanish still makes."}
  - sentences:
      - es: "— Hombre apercebido, medio combatido: no se pierde nada en que yo me aperciba, que sé por experiencia que tengo enemigos visibles e invisibles, y no sé cuándo, ni adónde, ni en qué tiempo, ni en qué figuras me han de acometer."
        literal: "— Man forewarned, half fought: not itself loses nothing in that I myself may-prepare, for I-know by experience that I-have enemies visible and invisible, and not I-know when, nor where, nor in what time, nor in what shapes me they-are-going to attack."
        ormsby: "“He who is prepared has his battle half fought; nothing is lost by my preparing myself, for I know by experience that I have enemies, visible and invisible, and I know not when, or where, or at what moment, or in what shapes they will attack me;”"
        ormsby_note: "Proverb 14."
        vocab:
          - {w: "hombre apercebido, medio combatido", d: "proverb: a man forewarned (prepared) is half-way through the fight; like 'forewarned is forearmed'"}
          - {w: "apercebido", d: "= apercibido, prepared, ready (old spelling)"}
          - {w: "apercibirse", d: "to get ready, prepare oneself"}
          - {w: "e", d: "'and' before a word starting with i- ('visibles e invisibles')"}
          - {w: "acometer", d: "to attack, set upon"}
        diagram:
          - {s: "Hombre apercebido, medio combatido", r: "proverb: a man prepared is half fought"}
          - s: "no se pierde nada"
            r: "main verb: nothing is lost"
            under:
              - {s: "en que yo me aperciba", r: "in what: in my getting ready"}
              - s: "que sé por experiencia"
                r: "why: for I know by experience"
                under:
                  - {s: "que tengo enemigos visibles e invisibles", r: "what I know: that I have enemies, seen and unseen"}
                  - s: "y no sé"
                    r: "and I do not know"
                    under:
                      - {s: "cuándo, ni adónde, ni en qué tiempo, ni en qué figuras me han de acometer", r: "what I do not know: when, where, at what time or in what shapes they will attack me"}
        forms:
          - {w: "apercebido", f: "old spelling of apercibido, participle of apercibir (to prepare), masculine to match 'Hombre'."}
          - {w: "combatido", f: "combat- + -ido → combatir (to fight), participle: 'fought'."}
          - {w: "se pierde", f: "pierd- + -e → perder (to lose), present, it, with 'se' making it passive: 'is lost'. The stem e becomes ie when stressed: pierdo, pierdes, pierde, perdemos, perdéis, pierden."}
          - {w: "me aperciba", f: "apercib- + -a → apercibirse (to prepare oneself), present subjunctive, I, with 'me' (myself). The present subjunctive of -er and -ir verbs: -a, -as, -a, -amos, -áis, -an."}
          - {w: "sé", f: "saber (to know), present, I. Irregular: sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "me han de acometer", f: "han → haber (to have), present, they: he, has, ha, hemos, habéis, han; 'haber de' + acometer (to attack) = 'are going to attack', with 'me' (me) placed before the group."}
  - sentences:
      - es: "Y, volviéndose a Sancho, le pidió la celada; el cual, como no tuvo lugar de sacar los requesones, le fue forzoso dársela como estaba."
        literal: "And, turning-himself to Sancho, from-him he-asked the helmet; the which, as not he-had room to take-out the curds, to-him it-was forced to-give-it-to-him as it-was."
        ormsby: "and turning to Sancho he called for his helmet; and Sancho, as he had no time to take out the curds, had to give it just as it was."
        vocab:
          - {w: "volverse a", d: "to turn to (someone)"}
          - {w: "tener lugar de", d: "to have time or chance to"}
          - {w: "serle forzoso a uno", d: "to be obliged, have no choice but: 'le fue forzoso' = he had to"}
        diagram:
          - s: "le pidió la celada"
            r: "main verb 1: he asked him for the helmet"
            under:
              - {s: "volviéndose a Sancho", r: "how: turning to Sancho"}
          - s: "el cual ... le fue forzoso dársela como estaba"
            r: "main verb 2: he (Sancho) had to give it to him as it was"
            under:
              - {s: "como no tuvo lugar de sacar los requesones", r: "why: since he had no time to take out the curds"}
        forms:
          - {w: "volviéndose", f: "gerund of volver (to turn) + se (himself), the pronoun hung on the end; an accent is added to keep the stress: volviendo → volviéndose."}
          - {w: "pidió", f: "pid- + -ió → pedir (to ask for), preterite, he; the stem e becomes i in this form: pedí, pediste, pidió, pedimos, pedisteis, pidieron."}
          - {w: "tuvo", f: "tuv- + -o → tener (to have), preterite, he. Irregular: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron."}
          - {w: "fue", f: "ser (to be), preterite, it: 'it was (forced on him)'. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "dársela", f: "dar (to give) + se + la: 'to give it to him'. 'le' (to him) becomes 'se' before 'la' (it, the helmet); both hang on the infinitive, and an accent keeps the stress on 'da'."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, it (the helmet). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
      - es: "Tomóla don Quijote, y, sin que echase de ver lo que dentro venía, con toda priesa se la encajó en la cabeza;"
        literal: "Took-it Don Quijote, and, without that he-might-notice that-which inside was-coming, with all haste himself it he-jammed on the head;"
        ormsby: "Don Quixote took it, and without perceiving what was in it thrust it down in hot haste upon his head;"
        vocab:
          - {w: "echar de ver", d: "to notice, become aware of"}
          - {w: "priesa", d: "= prisa, haste (old form)"}
          - {w: "encajar", d: "to jam, fit tightly, cram on"}
        diagram:
          - s: "Tomóla don Quijote"
            r: "main verb 1 with subject: Don Quijote took it"
          - s: "se la encajó en la cabeza"
            r: "main verb 2 (after 'y'): he jammed it on his head"
            under:
              - s: "sin que echase de ver"
                r: "how: without noticing"
                under:
                  - {s: "lo que dentro venía", r: "what he did not notice: what was inside"}
              - {s: "con toda priesa", r: "how: in great haste"}
        forms:
          - {w: "Tomóla", f: "tom- + -ó + la → tomar (to take), preterite, he, with 'la' (it, the helmet) stuck on the end; modern 'la tomó'. Cervantes hangs the pronoun on a verb that opens a clause. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "echase", f: "ech- + -ase → echar (to throw; 'echar de ver' = to notice), imperfect subjunctive (-se form), he, required after 'sin que'. The -se subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "venía", f: "ven- + -ía → venir (to come), imperfect, it: 'what came inside', i.e. what was in it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "se la encajó", f: "encaj- + -ó → encajar (to jam on), preterite, he; 'se' (on himself) + 'la' (it): 'he jammed it on himself'. Same -ó preterite."}
