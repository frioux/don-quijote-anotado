          - {w: "atento", f: "atent- + -o, masculine singular to match don Diego; 'todo atento' = all attention."}
          - {w: "pareciéndole", f: "gerund of parecer (to seem) + le (to him), the pronoun hung on the end; an accent is added to keep the stress: pareciendo → pareciéndole."}
          - {w: "era", f: "ser (to be), imperfect, he. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "tiraba", f: "tir- + -aba → tirar (to pull; with 'a', to tend toward), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
