          - {w: "apearse", d: "to get down, dismount"}
          - {w: "presto", d: "soon, quickly"}
          - {w: "en vano", d: "in vain, for nothing"}
          - {w: "ahorrar de", d: "to save oneself, spare oneself (a trouble)"}
          - {w: "diligencia", d: "effort, pains, trouble taken (not 'diligence' in the sense of a stagecoach)"}
        diagram:
          - {s: "¡Oh hombre de poca fe!", r: "exclamation: O man of little faith"}
          - {s: "—respondió don Quijote—", r: "frame: Don Quijote answered"}
          - {s: "apéate y desunce", r: "main verbs 1 and 2: get down and unyoke"}
          - s: "y haz lo"
            r: "main verb 3: and do whatever"
            under:
              - {s: "que quisieres", r: "describes 'lo': you like"}
          - s: "que presto verás"
            r: "why (after 'que', for): you will soon see"
            under:
              - {s: "que trabajaste en vano", r: "what you'll see, 1: that you worked for nothing"}
              - {s: "y que pudieras ahorrar desta diligencia", r: "what you'll see, 2: and that you could have spared yourself this trouble"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "apéate", f: "apea + te → apearse (to get down), imperative, you (tú), with 'te' stuck on the end; accent added to keep the stress. The tú imperative of regular verbs equals the 'he' form of the present: apea, desunce."}
          - {w: "desunce", f: "desunc- + -e → desuncir (to unyoke), imperative, you (tú): same as the 'he' present form."}
          - {w: "haz", f: "irregular tú imperative of hacer (to do): 'do!'. Other short ones: pon, sal, ten, ven, di, ve."}
          - {w: "quisieres", f: "quis- + -ieres → querer (to want), future subjunctive, you (tú): 'whatever you may want'. Built on the preterite quisieron: quisiere, quisieres, quisiere, quisiéremos, quisiereis, quisieren. Cervantes uses it for an open future after 'lo que'; modern Spanish says 'quieras'."}
          - {w: "verás", f: "ver- + -ás → ver (to see), future, you (tú). The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "trabajaste", f: "trabaj- + -aste → trabajar (to work), preterite, you (tú). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "pudieras", f: "pud- + -ieras → poder (to be able), imperfect subjunctive (-ra form), you (tú), used as a conditional: 'you could have'. pudiera, pudieras, pudiera, pudiéramos, pudierais, pudieran."}
          - {w: "desta", f: "= de + esta, 'of this', the old contraction; modern 'de esta'."}
        note: "Don Quijote speaks to the carter in the familiar 'tú', as to a social inferior, and answers his fears with Christ's rebuke to Peter, as if trusting in a knight-errant were a matter of religious faith."
  - sentences:
