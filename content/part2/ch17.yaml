              - {s: "aunque sean hipérboles sobre todos los hipérboles", r: "concession: even if they are hyperboles beyond all hyperboles"}
        forms:
          - {w: "contaré", f: "contar- + -é → contar (to tell), future, I. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "tan espantosa", f: "espantos- + -a → espantoso (dreadful), feminine to match 'hazaña'; 'tan' = so."}
          - {w: "la haré", f: "har- + -é → hacer (to make), future, I. Irregular stem har-: haré, harás, hará, haremos, haréis, harán. 'la' = it, feminine because it stands for 'hazaña'."}
          - {w: "venideros", f: "veni- (venir (to come)) + -dero, 'to come, future', masculine plural to match 'siglos'."}
          - {w: "habrá", f: "habr- + -á → haber (to have), future, used impersonally: 'there will be'. haber (to have) in the future: habré, habrás, habrá, habremos, habréis, habrán."}
          - {w: "convengan", f: "conveng- + -an → convenir (to befit), present subjunctive, they (the praises). Irregular like venir (to come): convenga, convengas, convenga, convengamos, convengáis, convengan. Subjunctive because the question implies no such praises exist."}
          - {w: "cuadren", f: "cuadr- + -en → cuadrar (to suit), present subjunctive, they. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "sean", f: "se- + -an → ser (to be), present subjunctive, they, after 'aunque' (even if): sea, seas, sea, seamos, seáis, sean."}
      - es: "Tú a pie, tú solo, tú intrépido, tú magnánimo, con sola una espada, y no de las del perrillo cortadoras, con un escudo no de muy luciente y limpio acero, estás aguardando y atendiendo los dos más fieros leones que jamás criaron las africanas selvas."
        literal: "You on foot, you alone, you intrepid, you great-souled, with only one sword, and not of those of-the little-dog sharp-cutting, with a shield not of very shining and clean steel, you-are awaiting and expecting the two most fierce lions that ever bred the African forests."
        ormsby: "On foot, alone, undaunted, high-souled, with but a simple sword, and that no trenchant blade of the Perrillo brand, a shield, but no bright polished steel one, there stoodst thou, biding and awaiting the two fiercest lions that Africa’s forests ever bred!"
        ormsby_note: "The Perrillo, i.e. the little dog, was the trademark of Julian del Rei, a famous armourer and swordsmith of Toledo and Saragossa."
        vocab:
          - {w: "a pie", d: "on foot"}
          - {w: "intrépido", d: "fearless, undaunted"}
          - {w: "magnánimo", d: "great-souled, noble-hearted"}
