        ormsby: "The keeper, then, in full detail, and bit by bit, described the end of the contest, exalting to the best of his power and ability the valour of Don Quixote, at the sight of whom the lion quailed, and would not and dared not come out of the cage, although he had held the door open ever so long;"
        vocab:
          - {w: "menudamente", d: "in detail, minutely"}
          - {w: "por sus pausas", d: "step by step, in due order"}
          - {w: "contienda", d: "contest, fight"}
          - {w: "exagerar", d: "to exaggerate; also to extol, make much of"}
          - {w: "acobardado", d: "cowed, frightened"}
          - {w: "osar", d: "to dare"}
          - {w: "puesto que", d: "although (old sense), a false friend: not 'since'"}
