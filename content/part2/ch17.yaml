summary: |
  When Don Quijote shouts for his helmet, Sancho is buying curds from the shepherds and, in his hurry, drops them into the helmet. Don Quijote claps it on his head; the whey runs down his face, and he fears his brains are melting or that he is sweating with the terror of some great adventure. Taking the helmet off, he smells the curds and calls Sancho a traitor. Sancho blames enchanters who must now persecute him too, and Don Quijote lets it pass.

  The cart with the flags turns out to carry two caged lions, a gift from the general of Oran to the king. Don Quijote orders the keeper to let them out so that he can fight them. Don Diego de Miranda, the gentleman in the green coat, tries to dissuade him and is told to go and mind his partridge and his ferret; Sancho weeps and begs; the carter asks leave to unyoke his mules first. Everyone flees to a safe distance while Don Quijote, on foot so that Rocinante will not take fright, stands before the cage with sword and shield, and the narrator breaks out in a mock-heroic hymn to his courage.

  The keeper opens the cage. The huge lion turns round, stretches, yawns, licks his face, looks about him, then shows Don Quijote his hindquarters and lies down again. The keeper refuses to provoke him: the knight has challenged his enemy and waited for him, and the shame belongs to the one who does not come out. Don Quijote has the door shut, waves the others back with the curd-stained cloth on his lance, pays the carter and keeper two gold crowns, and announces that he is no longer the Knight of the Sad Countenance but the Knight of the Lions.

  Don Diego, who has not read the first part of the history, cannot decide whether Don Quijote is a sane man gone mad or a madman with flashes of sense. Don Quijote explains that a knight-errant must attempt everything that falls within his calling, and that it is better for courage to err towards rashness than towards cowardice. Don Diego declares that the laws of chivalry could be recovered from his breast if they were lost, and at about two in the afternoon they reach his house.
context: |
  Where this chapter begins. In the Spanish text, and in this edition, the chapter opens with Sancho buying curds. Ormsby, following the nineteenth-century editor Hartzenbusch, moved the first sentences of Chapter X (the historian's fear that Don Quijote's madness will not be believed, and the proverb that truth runs thin but does not break) to the head of this chapter, arguing in his note that Don Quijote's credulity about the village girls hardly counts as his greatest madness, while the lion adventure is treated throughout as his wildest exploit. Those sentences stay in Chapter X here, and his translation is quoted from the point where the curds come in.

  Lions, Oran and the king's flags. Oran, on the coast of present-day Algeria, was a Spanish garrison town, and its governor ('el general de Orán') sending lions to court as a present to the king is a plausible courtesy; the royal flags on the cart mark it as the king's property, which is why Don Diego first guesses it carries the king's money. Ormsby notes a slip of geography: Don Quijote is on the road to Saragossa, while a cart from Oran would have come up from Cartagena, where it would have been landed. Don Diego's hunting with a decoy partridge and a ferret, described in the previous chapter, is what Don Quijote throws back at him when he tells him to mind his own business.

  The chivalric frame. Fighting a lion is a set piece of the romances. Here the lion is 'more courteous than arrogant' and simply turns his back, and the keeper's argument that the challenger who waits on the field has won echoes the customs of the duel. The narrator compares Don Quijote to Don Manuel de León: Ormsby explains that this was Don Manuel Ponce de León, a knight of the court of Ferdinand and Isabella, the hero of the Spanish story of a lady who threw her glove among lions to test her lover, later retold by Schiller, Leigh Hunt and Browning. The sword that is 'not one of the Perrillo' alludes, as Ormsby notes, to the little-dog mark of Julián del Rey, a famous swordsmith of Toledo. Changing one's name after a great deed is also chivalric custom: Ormsby lists Amadís, Esplandián, Belianís and the Caballero del Febo, and notes that 'Knight of the Lions' was one of the names Amadís took. The monsters of the speech, vestiglos and endriagos, come from the same books; the Endriago is the monster Amadís kills in Amadís de Gaula.

  The narrator's games. The chapter title promises 'the furthest point' Don Quijote's courage ever reached, and the narrator's hymn to him piles up hyperboles in the high style of the romances, then gives up 'for lack of words'. Against it stand the curds dripping into his beard, Sancho's injured innocence ('let the devil eat them'), and a lion who washes his face and goes back to sleep. The narrator remarks that Don Diego has not read the first part of the history, so he cannot understand the kind of madness he is watching: Part II keeps reminding us that its characters live in a world where Part I has been printed.

  Courage and the mean. Don Quijote's defence of his rashness rests on Aristotle's ethics, which every educated reader of the time knew: courage is a virtue standing between two vices, cowardice and rashness, just as liberality stands between prodigality and avarice. His twist is that the rash man, like the prodigal, is closer to the virtue than the coward or the miser. The proverb 'better to lose by a card too many than too few' (Ormsby's Proverb 39) comes from card games in which a player can lose by drawing one card too many or by stopping one card short. The contrast between the court knight, who spears bulls in the plaza before the king and runs at the tilt before the ladies, and the knight-errant who wanders the wilds, describes real court entertainments of Cervantes' Spain: noblemen fought bulls on horseback with the lance ('dar una lanzada') at royal festivities.

  Sancho's comparisons. Sancho measures this adventure against the windmills (Part I, Chapter VIII) and the terrible night of the fulling mills (Part I, Chapter XX), and calls them all 'tortas y pan pintado', cakes and decorated bread, mere trifles beside this one. Don Quijote reminds him of their 'old agreement' that if he dies Sancho is to go to Dulcinea with the news.

  Reading Cervantes' Spanish. The archaisms of this chapter: trujese (trajese), priesa (prisa), agora (ahora), mesmo (mismo), apercebido and aperciba (apercibido, aperciba), juridición (jurisdicción), estremo (extremo), esorbitante (exorbitante), recebida (recibida), felice (feliz), yelos (hielos), intricados (intrincados), requirimientos (requerimientos), 'volvióse acostar' for 'volvióse a acostar', aquéstas, and the contractions dellos, desta, deste. Pronouns hang on the end of conjugated verbs that open a clause (Tomóla, diole, Limpióse, quitóse, Púsose, Llegóse, díjole, Apeóse, Respondióle, Hízolo, Detuviéronse, prometióle, diréisle, volvíle). The future subjunctive marks open futures and conditions (veniere, quisieres, muriere, hicieren, pudieres, preguntare, pareciere), the -ra form serves as a conditional or pluperfect (quisiera, pusiera, cesara, supiera, pudieras), and 'haber de' means 'must, be going to' (me ha de necesitar, os he de coser). Vuesa merced, vos and tú alternate as forms of address, and present subjunctives give polite orders (démelos, váyase, pique, sirva, busque). Watch the false friends: discurso (good sense, course), suceso (outcome), generoso (noble), concierto (agreement), fortaleza (fortitude), and puesto que (although).
