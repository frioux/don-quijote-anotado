  - sentences:
      - es: "— ¿Leoncitos a mí? ¿A mí leoncitos, y a tales horas?"
        literal: "— Little-lions to me? To me little-lions, and at such hours?"
        ormsby: "“Lion-whelps to me! to me whelps of lions, and at such a time!"
        vocab:
          - {w: "leoncitos", d: "little lions, lion cubs: a scornful diminutive"}
          - {w: "a tales horas", d: "at such a time, now of all times (when he is ready for adventure)"}
        diagram:
          - {s: "¿Leoncitos a mí?", r: "exclamation 1 (no verb): little lions, to me?"}
          - s: "¿A mí leoncitos"
            r: "exclamation 2, reversed: to me, little lions?"
            under:
              - {s: "y a tales horas?", r: "when: and at such a time?"}
        forms:
          - {w: "Leoncitos", f: "leon- + -cito + -s → león (lion) with the diminutive -cito, plural: 'little lions'; here mocking, not affectionate."}
          - {w: "tales", f: "plural of tal (such), to match 'horas'."}
        note: "The diminutive is pure bravado: the keeper has just said that no bigger lions ever crossed from Africa. Ormsby turns it into 'lion-whelps'."
      - es: "Pues, ¡por Dios que han de ver esos señores que acá los envían si soy yo hombre que se espanta de leones!"
        literal: "Well, by God that they-are-to see those gentlemen who here them send if am I [a] man who himself frightens of lions!"
        ormsby: "Then, by God! those gentlemen who send them here shall see if I am a man to be frightened by lions."
        vocab:
          - {w: "¡por Dios que ...!", d: "by God, (I swear that) ...: the 'que' introduces what is sworn"}
          - {w: "acá", d: "here, this way (toward the speaker)"}
          - {w: "espantarse de", d: "to be frightened of, take fright at"}
        diagram:
          - s: "han de ver esos señores"
            r: "main verb with subject: those gentlemen shall see"
            under:
              - {s: "por Dios", r: "oath: by God"}
              - {s: "que acá los envían", r: "describes 'señores': who send them here"}
              - s: "si soy yo hombre"
                r: "what they shall see: whether I am a man"
                under:
                  - {s: "que se espanta de leones!", r: "describes 'hombre': who takes fright at lions"}
        forms:
          - {w: "han de ver", f: "han → haber (to have), present, they: he, has, ha, hemos, habéis, han; 'haber de' + ver (to see) = 'shall see, are going to see'."}
          - {w: "esos", f: "es- + -os → ese (that), masculine plural to match 'señores'."}
          - {w: "envían", f: "enví- + -an → enviar (to send), present, they; the i takes an accent: envío, envías, envía, enviamos, enviáis, envían."}
          - {w: "soy", f: "ser (to be), present, I. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "se espanta", f: "espant- + -a → espantarse (to take fright), present, he ('hombre que', so the 'he' form, not 'I'). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
        note: "Don Quijote assumes the enchanters, or whoever sent the lions, meant them as a challenge to him personally."
      - es: "Apeaos, buen hombre, y, pues sois el leonero, abrid esas jaulas y echadme esas bestias fuera, que en mitad desta campaña les daré a conocer quién es don Quijote de la Mancha, a despecho y pesar de los encantadores que a mí los envían."
        literal: "Get-down, good man, and, since you-are the lion-keeper, open those cages and throw-me those beasts out, for in [the] middle of-this field to-them I-will-give to know who is Don Quijote de la Mancha, in spite and despite of the enchanters who to me them send."
        ormsby: "Get down, my good fellow, and as you are the keeper open the cages, and turn me out those beasts, and in the midst of this plain I will let them know who Don Quixote of La Mancha is, in spite and in the teeth of the enchanters who send them to me.”"
        vocab:
          - {w: "apearse", d: "to get down, dismount"}
          - {w: "buen hombre", d: "my good man: condescending address to a commoner"}
          - {w: "echar fuera", d: "to turn out, let out"}
          - {w: "desta", d: "= de esta, of this (old contraction)"}
          - {w: "campaña", d: "open country, plain (not a 'campaign')"}
          - {w: "dar a conocer", d: "to make known, show"}
          - {w: "a despecho y pesar de", d: "in spite of, despite (two words for the same thing, for emphasis)"}
        diagram:
          - {s: "Apeaos, buen hombre", r: "main verb 1: get down, good man"}
          - s: "abrid esas jaulas"
            r: "main verb 2 (after 'y'): open those cages"
            under:
              - {s: "pues sois el leonero", r: "why: since you are the keeper"}
          - {s: "y echadme esas bestias fuera", r: "main verb 3: and turn those beasts out for me"}
          - s: "que ... les daré a conocer"
            r: "why: for I will show them"
            under:
              - {s: "en mitad desta campaña", r: "where: in the middle of this plain"}
              - {s: "quién es don Quijote de la Mancha", r: "what I'll show: who Don Quijote de la Mancha is"}
              - s: "a despecho y pesar de los encantadores"
                r: "in spite of: the enchanters"
                under:
                  - {s: "que a mí los envían", r: "describes 'encantadores': who send them to me"}
        forms:
          - {w: "Apeaos", f: "apea(d) + os → apearse (to get down), imperative, you (vos, the polite singular, which takes the plural form): the -d of 'apead' drops before 'os'. The vos/vosotros command swaps the -r of the infinitive for -d: apead, abrid, echad."}
          - {w: "buen", f: "bueno (good) clipped before a masculine singular noun ('hombre')."}
          - {w: "sois", f: "ser (to be), present, you (vos). Irregular: soy, eres, es, somos, sois, son."}
          - {w: "abrid", f: "abri- + -d → abrir (to open), imperative, you (vos): the -r of the infinitive becomes -d."}
          - {w: "echadme", f: "echad + me → echar (to throw, turn out), imperative, you (vos), with 'me' (for me) hung on the end: 'turn them out for me'."}
          - {w: "esas", f: "es- + -as → ese (that), feminine plural to match 'jaulas' and 'bestias'."}
          - {w: "desta", f: "= de + esta, the old contraction; modern 'de esta'."}
          - {w: "daré", f: "dar- + -é → dar (to give), future, I; 'dar a conocer' = to make known. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "es", f: "ser (to be), present, he. soy, eres, es, somos, sois, son."}
          - {w: "envían", f: "enví- + -an → enviar (to send), present, they; the i takes an accent: envío, envías, envía, enviamos, enviáis, envían."}
  - sentences:
      - es: "— ¡Ta, ta! —dijo a esta sazón entre sí el hidalgo—, dado ha señal de quién es nuestro buen caballero: los requesones, sin duda, le han ablandado los cascos y madurado los sesos."
        literal: "— So, so! —said at this moment within himself the gentleman—, given has sign of who is our good knight: the curds, without doubt, to-him have softened the skull and ripened the brains."
        ormsby: "“So, so,” said the gentleman to himself at this; “our worthy knight has shown of what sort he is; the curds, no doubt, have softened his skull and brought his brains to a head.”"
        vocab:
          - {w: "¡ta, ta!", d: "'so, so!', 'aha!': an exclamation of someone who has just understood something"}
          - {w: "a esta sazón", d: "at this moment, just then ('sazón' = season, right time)"}
          - {w: "entre sí", d: "to himself, under his breath"}
          - {w: "hidalgo", d: "gentleman, a member of the lesser nobility; here Don Diego, the Knight of the Green Coat"}
          - {w: "dar señal de", d: "to give a sign of, show"}
          - {w: "cascos", d: "skull, head (literally 'shards', pieces of the skull); 'ablandarse los cascos' = to go soft in the head"}
          - {w: "madurar", d: "to ripen; of a boil or abscess, to come to a head, which is how Ormsby takes it"}
          - {w: "sesos", d: "brains (the matter inside the skull)"}
        diagram:
          - s: "—dijo"
            r: "frame verb: said"
            under:
              - {s: "a esta sazón", r: "when: just then"}
              - {s: "entre sí", r: "how: to himself"}
              - {s: "el hidalgo", r: "subject: the gentleman (Don Diego)"}
          - s: "dado ha señal"
            r: "main verb 1 (what he said): he has given a sign"
            under:
              - {s: "¡Ta, ta!", r: "exclamation: aha!"}
              - s: "de quién es"
                r: "of what: of who he is"
                under:
                  - {s: "nuestro buen caballero", r: "subject of 'es': our good knight"}
          - s: "le han ablandado los cascos y madurado los sesos"
            r: "main verb 2: have softened his skull and ripened his brains"
            under:
              - {s: "los requesones", r: "subject: the curds"}
              - {s: "sin duda", r: "how sure: no doubt"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "dado ha", f: "dado, the participle of dar (to give), + ha, haber (to have), present, he: he, has, ha, hemos, habéis, han. Together the perfect 'has given'; Cervantes puts the participle first for emphasis, modern Spanish only 'ha dado'."}
          - {w: "es", f: "ser (to be), present, he: soy, eres, es, somos, sois, son."}
          - {w: "nuestro buen", f: "nuestro (our), masculine to match 'caballero'; buen = bueno (good) clipped before a masculine singular noun, like un, gran, algún."}
          - {w: "le han ablandado, madurado", f: "han, haber (to have), present, they (the curds): he, has, ha, hemos, habéis, han; + ablandado, participle of ablandar (to soften), and madurado, participle of madurar (to ripen): the perfect 'have softened, have ripened'. 'le' = for him, the person whose skull it is (Spanish uses an indirect pronoun plus 'los' where English says 'his')."}
        note: "Don Diego takes the curds running down Don Quijote's face as a sign of what is happening inside his head: it is the moment he decides his companion is mad. 'Ablandar los cascos' was a common way of saying someone had gone soft in the head."
  - sentences:
