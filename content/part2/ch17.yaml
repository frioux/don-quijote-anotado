      - es: "Viendo, pues, el leonero que ya los que iban huyendo estaban bien desviados, tornó a requerir y a intimar a don Quijote lo que ya le había requerido e intimado, el cual respondió que lo oía, y que no se curase de más intimaciones y requirimientos, que todo sería de poco fruto, y que se diese priesa."
