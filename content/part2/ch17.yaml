          - {w: "quiso", f: "quis- + -o → querer (to want), preterite, it (the lion). Irregular: quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "osó", f: "os- + -ó → osar (to dare), preterite, it. Same -ar preterite as contó."}
          - {w: "había tenido", f: "había → haber (to have), imperfect, he: había, habías, había, habíamos, habíais, habían; + tenido, participle of tener (to have, hold): pluperfect, 'he had held'."}
