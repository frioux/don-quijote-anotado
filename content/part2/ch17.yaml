  - sentences:
      - es: "— Señor caballero, los caballeros andantes han de acometer las aventuras que prometen esperanza de salir bien dellas, y no aquellas que de en todo la quitan; porque la valentía que se entra en la juridición de la temeridad, más tiene de locura que de fortaleza."
        literal: "— Sir knight, the knights errant have to attack the adventures that promise hope of coming-out well from-them, and not those that from in all it take-away; because the valor that itself enters into the jurisdiction of the rashness, more has of madness than of fortitude."
        ormsby: "“Sir knight, knights-errant should attempt adventures which encourage the hope of a successful issue, not those which entirely withhold it; for valour that trenches upon temerity savours rather of madness than of courage;"
        vocab:
          - {w: "caballero andante", d: "knight-errant, a knight who roams in search of adventures"}
          - {w: "acometer", d: "to attack; to undertake, attempt (an adventure)"}
          - {w: "salir bien de", d: "to come out well from, succeed in"}
          - {w: "dellas", d: "= de ellas, of/from them (old contraction)"}
          - {w: "de en todo", d: "entirely, altogether (old phrase, modern 'del todo')"}
          - {w: "valentía", d: "bravery, valor"}
          - {w: "juridición", d: "= jurisdicción, jurisdiction, territory (old spelling)"}
          - {w: "temeridad", d: "rashness, recklessness (not 'timidity')"}
          - {w: "tener más de ... que de", d: "to have more of ... than of, be closer to ... than to"}
          - {w: "fortaleza", d: "fortitude, courage (also 'fortress')"}
        diagram:
          - s: "los caballeros andantes han de acometer las aventuras"
            r: "main verb: knights-errant should undertake the adventures"
            under:
              - {s: "Señor caballero", r: "address: sir knight"}
              - {s: "que prometen esperanza de salir bien dellas", r: "describes 'aventuras': that hold out hope of success"}
              - s: "y no aquellas"
                r: "contrast: and not those"
                under:
                  - {s: "que de en todo la quitan", r: "describes 'aquellas': that take that hope away entirely"}
          - s: "más tiene de locura que de fortaleza"
            r: "main verb 2 (after 'porque', because): has more of madness than of courage"
            under:
              - s: "la valentía"
                r: "subject: valor"
                under:
                  - {s: "que se entra en la juridición de la temeridad", r: "describes 'valentía': that strays into rashness's territory"}
        forms:
          - {w: "han de acometer", f: "han, haber (to have), present, they: he, has, ha, hemos, habéis, han; 'haber de' + infinitive = must, ought to: 'they ought to undertake'. acometer (to undertake) is the infinitive."}
          - {w: "prometen", f: "promet- + -en → prometer (to promise), present, they (the adventures). The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "salir", f: "salir (to come out), infinitive after 'de': 'hope of coming out'."}
          - {w: "dellas", f: "= de + ellas, 'from them', feminine plural for 'aventuras'; modern 'de ellas'."}
          - {w: "aquellas", f: "aquell- + -as → aquel (that, those), feminine plural to match 'aventuras' understood."}
          - {w: "la quitan", f: "quit- + -an → quitar (to take away), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. 'la' stands for 'esperanza' (hope), feminine."}
          - {w: "se entra", f: "entr- + -a → entrarse (to go into, intrude), present, it (the valor), with 'se' adding 'of its own accord'. Same -ar present."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, it. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
        note: "Don Diego's argument is Aristotle's, which Don Quijote himself will soon repeat: true courage lies between cowardice and rashness, and rashness is not courage but folly."
      - es: "Cuanto más, que estos leones no vienen contra vuesa merced, ni lo sueñan: van presentados a Su Majestad, y no será bien detenerlos ni impedirles su viaje."
        literal: "How-much more, that these lions not come against your grace, nor it they-dream: they-go presented to His Majesty, and not it-will-be well to-detain-them nor to-hinder-to-them their journey."
        ormsby: "moreover, these lions do not come to oppose you, nor do they dream of such a thing; they are going as presents to his Majesty, and it will not be right to stop them or delay their journey.”"
        vocab:
          - {w: "cuanto más que", d: "all the more since, besides, moreover"}
          - {w: "ni lo sueñan", d: "they don't even dream of it, it's the last thing on their minds"}
          - {w: "ir presentado a", d: "to go as a present to"}
          - {w: "Su Majestad", d: "His Majesty, the King (Philip III at the time of Part II)"}
          - {w: "ser bien", d: "to be right, proper"}
          - {w: "impedir", d: "to hinder, obstruct (here 'impedirles su viaje' = to hold up their journey)"}
        diagram:
          - s: "estos leones no vienen contra vuesa merced"
            r: "main verb 1: these lions are not coming against you"
            under:
              - {s: "Cuanto más, que", r: "linking: all the more since"}
              - {s: "ni lo sueñan", r: "added: nor do they dream of it"}
          - s: "van presentados a Su Majestad"
            r: "main verb 2: they are going as a present to His Majesty"
          - s: "no será bien"
            r: "main verb 3 (after 'y'): it will not be right"
            under:
              - {s: "detenerlos ni impedirles su viaje", r: "what will not be right: to stop them or hold up their journey"}
        forms:
          - {w: "estos", f: "est- + -os → este (this), masculine plural to match 'leones'."}
          - {w: "vienen", f: "vien- + -en → venir (to come), present, they. Irregular: vengo, vienes, viene, venimos, venís, vienen."}
          - {w: "sueñan", f: "sueñ- + -an → soñar (to dream), present, they. The stem o becomes ue when stressed: sueño, sueñas, sueña, soñamos, soñáis, sueñan."}
          - {w: "van presentados", f: "van, ir (to go), present, they: voy, vas, va, vamos, vais, van; + presentados, participle of presentar (to present), masculine plural to match 'leones': 'go presented', i.e. are being sent as a gift."}
          - {w: "será", f: "ser- + -á → ser (to be), future, it. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "detenerlos", f: "detener (to stop) + los (them), the pronoun hung on the infinitive."}
          - {w: "impedirles", f: "impedir (to hinder) + les (to them): 'to hold up their journey for them'; Spanish uses 'les' where English says 'their'."}
  - sentences:
      - es: "— Váyase vuesa merced, señor hidalgo —respondió don Quijote—, a entender con su perdigón manso y con su hurón atrevido, y deje a cada uno hacer su oficio."
        literal: "— Go-away-yourself your grace, sir gentleman —answered Don Quijote—, to attend with your partridge tame and with your ferret daring, and let to each one do his job."
        ormsby: "“Gentle sir,” replied Don Quixote, “you go and mind your tame partridge and your bold ferret, and leave everyone to manage his own business;"
        vocab:
          - {w: "irse a entender con", d: "to go and busy oneself with, mind ('entender en/con' = to attend to, deal with)"}
          - {w: "perdigón", d: "young partridge; here the tame decoy partridge Don Diego hunts with"}
          - {w: "manso", d: "tame"}
          - {w: "hurón", d: "ferret, used to drive rabbits out of their burrows"}
          - {w: "oficio", d: "job, trade, business; 'hacer su oficio' = to do one's own job"}
        diagram:
          - s: "Váyase vuesa merced"
            r: "main verb 1: go away, your worship"
            under:
              - {s: "señor hidalgo", r: "address: sir gentleman"}
              - {s: "a entender con su perdigón manso y con su hurón atrevido", r: "why: to busy yourself with your tame partridge and your bold ferret"}
          - {s: "—respondió don Quijote—", r: "frame: Don Quijote answered"}
          - s: "y deje"
            r: "main verb 2: and let"
            under:
              - {s: "a cada uno hacer su oficio", r: "object: each one do his own job"}
        forms:
          - {w: "Váyase", f: "vay- + -a + se → irse (to go away), present subjunctive, you (vuesa merced takes the 'he' form), used as a polite command, with 'se' on the end. ir (to go) in the present subjunctive: vaya, vayas, vaya, vayamos, vayáis, vayan. The polite command is always the subjunctive, and the pronoun must hang on the end."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "entender", f: "entender (to attend to), infinitive after 'a' expressing purpose after a verb of motion."}
          - {w: "su", f: "'your' here: with vuesa merced the possessive is 'su', the same as 'his/her'."}
          - {w: "deje", f: "dej- + -e → dejar (to let), present subjunctive, you (vuesa merced), polite command: 'let'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "hacer", f: "hacer (to do), infinitive after 'dejar' (let someone do)."}
        note: "Don Quijote turns Don Diego's own self-portrait in the previous chapter against him: a quiet gentleman who hunts only with a decoy partridge and a ferret should leave dangerous adventures to a knight-errant."
      - es: "Éste es el mío, y yo sé si vienen a mí, o no, estos señores leones."
        literal: "This is the mine, and I know if they-come to me, or not, these lords lions."
        ormsby: "this is mine, and I know whether these gentlemen the lions come to me or not;”"
        vocab:
