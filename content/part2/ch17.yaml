            r: "main verb 2 (after 'y'): Don Quijote said to the carter"
            under:
              - {s: "en llegando", r: "when: as soon as they arrived"}
        forms:
          - {w: "volvieron", f: "volv- + -ieron → volver (to return), preterite, they. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "al", f: "a + el, 'to the'."}
