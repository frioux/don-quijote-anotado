          - {w: "vuestras, vuestro", f: "the possessive of vos/vosotros, feminine plural to match 'mulas' and masculine singular to match 'viaje'."}
          - {w: "uncir, proseguir", f: "infinitives of uncir (to yoke) and proseguir (to continue) after 'a'."}
          - {w: "dale", f: "da + le → dar (to give), command, you (tú), with 'le' (to him) stuck on the end. Pronouns always hang on the end of a positive command."}
          - {w: "se han detenido", f: "han → haber (to have), present, they: he, has, ha, hemos, habéis, han; + detenido, participle of detenerse (to be delayed): 'they have been held up'."}
  - sentences:
      - es: "— Ésos daré yo de muy buena gana —respondió Sancho—; pero, ¿qué se han hecho los leones? ¿Son muertos, o vivos?"
        literal: "— Those will-give I of very good will —answered Sancho—; but, what themselves have made the lions? Are-they dead, or alive?"
        ormsby: "“That will I give with all my heart,” said Sancho; “but what has become of the lions? Are they dead or alive?”"
