            r: "main verb: told the end of the contest"
            under:
              - {s: "Entonces", r: "when: then"}
              - {s: "el leonero", r: "subject: the keeper"}
              - {s: "menudamente y por sus pausas", r: "how: in detail and step by step"}
              - s: "exagerando"
                r: "how, 2: exaggerating"
                under:
                  - {s: "como él mejor pudo y supo", r: "how: as best he could and knew how"}
                  - s: "el valor de don Quijote"
                    r: "object: Don Quijote's valour"
                    under:
                      - s: "de cuya vista el león, acobardado, no quiso ni osó salir de la jaula"
