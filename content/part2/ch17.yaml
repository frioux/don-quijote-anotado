          - {w: "díjole", f: "dij- + -o + le → decir (to say), preterite, he, with 'le' (to him) stuck on the end; modern 'le dijo'. decir (to say) in the preterite: dije, dijiste, dijo, dijimos, dijisteis, dijeron. An accent is added to keep the stress on 'di-'."}
  - sentences:
      - es: "— Señor, por quien Dios es, que vuesa merced haga de manera que mi señor don Quijote no se tome con estos leones, que si se toma, aquí nos han de hacer pedazos a todos."
        literal: "— Sir, by who God is, that your grace may-make in way that my master Don Quijote not himself may-take with these lions, for if he-takes-himself, here us they-have to make pieces to all."
        ormsby: "“Señor, for God’s sake do something to keep my master, Don Quixote, from tackling these lions; for if he does they’ll tear us all to pieces here.”"
        vocab:
          - {w: "por quien Dios es", d: "'for God's sake', literally 'by Him who God is', a pleading oath"}
          - {w: "vuesa merced", d: "your grace, your worship: the polite 'you', taking a 'he/she' verb; old form of 'vuestra merced', source of modern 'usted'"}
          - {w: "hacer de manera que", d: "to act so that, see to it that"}
          - {w: "tomarse con", d: "to take on, pick a fight with"}
          - {w: "hacer pedazos", d: "to tear to pieces"}
        diagram:
          - s: "que vuesa merced haga de manera"
            r: "main verb (a plea): that your worship act in such a way"
            under:
              - {s: "Señor, por quien Dios es", r: "address and oath: sir, for God's sake"}
              - {s: "que mi señor don Quijote no se tome con estos leones", r: "result: that my master does not take on these lions"}
          - s: "aquí nos han de hacer pedazos a todos"
            r: "main verb 2 (after 'que', for): here they will tear us all to pieces"
            under:
              - {s: "si se toma", r: "condition: if he does take them on"}
        forms:
          - {w: "es", f: "ser (to be), present, he: soy, eres, es, somos, sois, son."}
          - {w: "haga", f: "hag- + -a → hacer (to do, make), present subjunctive, you (vuesa merced takes the 'he' form): 'that you may act'. hacer (to do) in the present subjunctive: haga, hagas, haga, hagamos, hagáis, hagan. The 'que' with a subjunctive opening a sentence is an urgent request: 'please see to it that'."}
          - {w: "se tome", f: "tom- + -e → tomarse (to take on, fight), present subjunctive, he, with 'se'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. Subjunctive because it depends on 'haga de manera que' (act so that)."}
          - {w: "estos", f: "est- + -os → este (this), masculine plural to match 'leones'."}
          - {w: "se toma", f: "tom- + -a → tomarse (to take on), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. After 'si' (if) Spanish uses the plain present, not the subjunctive."}
          - {w: "han de hacer", f: "han, haber (to have), present, they (the lions): he, has, ha, hemos, habéis, han; 'haber de' + infinitive = to be going to, will surely: 'they will make'. hacer (to make) is the infinitive."}
          - {w: "nos ... a todos", f: "'nos' (us) is repeated by 'a todos' (all of us) at the end: Spanish often doubles an object pronoun with 'a' + noun."}
  - sentences:
      - es: "— Pues, ¿tan loco es vuestro amo —respondió el hidalgo—, que teméis, y creéis que se ha de tomar con tan fieros animales?"
