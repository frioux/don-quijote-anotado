  - sentences:
      - es: "— Así es verdad —respondió don Quijote—: cierra, amigo, la puerta, y dame por testimonio, en la mejor forma que pudieres, lo que aquí me has visto hacer; conviene a saber:"
        literal: "— So it-is truth —answered Don Quijote—: close, friend, the door, and give-me as testimony, in the best form that you-may-be-able, that which here me you-have seen do; it-is-fitting to know:"
        ormsby: "“That is true,” said Don Quixote; “close the door, my friend, and let me have, in the best form thou canst, what thou hast seen me do, by way of certificate; to wit,"
        vocab:
          - {w: "así es verdad", d: "that is true, so it is"}
          - {w: "dar por testimonio", d: "to give a sworn statement, certify in writing"}
          - {w: "en la mejor forma", d: "in the best form, in due legal form"}
          - {w: "conviene a saber", d: "to wit, namely (a legal formula)"}
        diagram:
          - s: "Así es verdad"
            r: "main verb 1: that is true"
            under:
              - {s: "respondió don Quijote", r: "speech tag: Don Quijote answered"}
          - s: "cierra, amigo, la puerta"
            r: "main verb 2: close the door, friend"
          - s: "y dame por testimonio"
            r: "main verb 3: and give me as a certificate"
            under:
              - {s: "en la mejor forma que pudieres", r: "how: in the best form you can"}
              - {s: "lo que aquí me has visto hacer", r: "object: what you have seen me do here"}
          - {s: "conviene a saber:", r: "linking: namely"}
        forms:
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "cierra", f: "cierr- + -a → cerrar (to close), command, you (tú). The tú command looks like the he-form of the present; stressed e becomes ie: cierro, cierras, cierra, cerramos, cerráis, cierran."}
          - {w: "dame", f: "da + me → dar (to give), command, you (tú), with 'me' (to me) stuck on the end: 'give me'. Pronouns always hang on the end of a positive command."}
          - {w: "pudieres", f: "pud- + -ieres → poder (to be able), future subjunctive, you: 'as best you may'. pudiere, pudieres, pudiere, pudiéremos, pudiereis, pudieren. Modern Spanish uses the present subjunctive 'puedas'."}
          - {w: "has visto", f: "has → haber (to have), present, you: he, has, ha, hemos, habéis, han; + visto, the irregular participle of ver (to see): 'you have seen'."}
          - {w: "hacer", f: "infinitive of hacer (to do) after 'visto': 'seen me do'."}
          - {w: "conviene", f: "convien- + -e → convenir (to be fitting), present, it. Irregular like venir (to come): convengo, convienes, conviene, convenimos, convenís, convienen. 'conviene a saber' = namely."}
        note: "Don Quijote asks for a notary's certificate, in the formulas of a legal deposition ('dar por testimonio', 'en la mejor forma', 'conviene a saber'), as proof of a feat that consisted of nothing happening."
