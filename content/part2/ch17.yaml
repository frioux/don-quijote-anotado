          - {w: "atento a", d: "intent on, attentive to"}
          - {w: "notar", d: "to note, observe"}
          - {w: "cuerdo", d: "sane, sensible, in one's right mind (the opposite of 'loco')"}
          - {w: "un cuerdo loco", d: "a sane madman, a sensible man gone mad"}
          - {w: "tirar a", d: "to tend toward, verge on: 'un loco que tiraba a cuerdo' = a madman bordering on sane"}
