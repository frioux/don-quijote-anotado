          - {w: "vuestro", f: "'your', the possessive of vos/vosotros: Don Diego addresses Sancho, a servant, with the plain 'vos', not 'vuesa merced'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "teméis, creéis", f: "tem- + -éis → temer (to fear) and cre- + -éis → creer (to believe), present, you (vos, speaking to Sancho). The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
