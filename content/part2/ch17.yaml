  - sentences:
      - es: "— ¿Qué será esto, Sancho, que parece que se me ablandan los cascos, o se me derriten los sesos, o que sudo de los pies a la cabeza?"
        literal: "— What can-it-be this, Sancho, for it-seems that themselves to-me soften the skull, or themselves to-me melt the brains, or that I-sweat from the feet to the head?"
        ormsby: "“Sancho, what’s this? I think my head is softening, or my brains are melting, or I am sweating from head to foot!"
        vocab:
          - {w: "¿qué será esto?", d: "what can this be? (the future used for wondering)"}
          - {w: "ablandarse", d: "to soften, go soft"}
          - {w: "cascos", d: "skull, head (also 'helmet'); 'ablandarse los cascos' suggests going soft in the head"}
          - {w: "derretirse", d: "to melt"}
          - {w: "sesos", d: "brains"}
          - {w: "de los pies a la cabeza", d: "from head to foot (Spanish says 'from the feet to the head')"}
        diagram:
          - s: "¿Qué será esto, Sancho"
            r: "main verb: what can this be, Sancho"
            under:
              - s: "que parece"
                r: "why I ask: for it seems"
                under:
                  - {s: "que se me ablandan los cascos", r: "what seems, 1: that my skull is softening"}
                  - {s: "o se me derriten los sesos", r: "what seems, 2: or my brains are melting"}
                  - {s: "o que sudo de los pies a la cabeza", r: "what seems, 3: or that I am sweating from head to foot"}
        forms:
          - {w: "será", f: "ser- + -á → ser (to be), future, it, used for a guess or wondering: 'what can this be?'. The future adds endings to the whole infinitive: seré, serás, será, seremos, seréis, serán."}
          - {w: "parece", f: "parec- + -e → parecer (to seem), present, it. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (parezco in the 'I' form)."}
          - {w: "se me ablandan", f: "abland- + -an → ablandarse (to soften), present, they (the skull, 'los cascos', plural), with 'se' and 'me' (on me): 'are softening on me'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "se me derriten", f: "derrit- + -en → derretirse (to melt), present, they (the brains), with 'se' and 'me'. The stem e becomes i when stressed: derrito, derrites, derrite, derretimos, derretís, derriten."}
          - {w: "sudo", f: "sud- + -o → sudar (to sweat), present, I. Same -ar present: sudo, sudas, suda, sudamos, sudáis, sudan."}
      - es: "Y si es que sudo, en verdad que no es de miedo; sin duda creo que es terrible la aventura que agora quiere sucederme."
        literal: "And if it-is that I-sweat, in truth that not it-is from fear; without doubt I-believe that is terrible the adventure that now wants to-happen-to-me."
        ormsby: "If I am sweating it is not indeed from fear. I am convinced beyond a doubt that the adventure which is about to befall me is a terrible one."
        vocab:
          - {w: "si es que", d: "if it is the case that, if indeed"}
          - {w: "en verdad que", d: "truly, I assure you ('que' adds emphasis)"}
          - {w: "agora", d: "= ahora, now (old form)"}
          - {w: "querer + infinitive", d: "here 'to be about to': 'quiere sucederme' = is about to happen to me"}
          - {w: "suceder", d: "to happen, befall (not 'to succeed')"}
        diagram:
          - s: "en verdad que no es de miedo"
            r: "main verb 1: truly, it is not from fear"
            under:
              - {s: "Y si es que sudo", r: "condition: and if I am indeed sweating"}
          - s: "sin duda creo"
            r: "main verb 2: without doubt I believe"
            under:
              - s: "que es terrible la aventura"
                r: "what I believe: that the adventure is terrible"
                under:
                  - {s: "que agora quiere sucederme", r: "describes 'aventura': that is about to happen to me now"}
        forms:
          - {w: "es", f: "ser (to be), present, it. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "sudo", f: "sud- + -o → sudar (to sweat), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "creo", f: "cre- + -o → creer (to believe), present, I. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "agora", f: "old form of ahora (now)."}
          - {w: "quiere", f: "quier- + -e → querer (to want; here 'to be about to'), present, it. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "sucederme", f: "suceder (to happen) + me (to me), the pronoun hung on the infinitive after 'quiere'."}
      - es: "Dame, si tienes, con que me limpie, que el copioso sudor me ciega los ojos."
        literal: "Give-me, if you-have, [something] with which myself I-may-wipe, for the copious sweat to-me blinds the eyes."
        ormsby: "Give me something to wipe myself with, if thou hast it, for this profuse sweat is blinding me.”"
        vocab:
          - {w: "con que", d: "something with which; 'dame con que me limpie' = give me something to wipe myself with"}
          - {w: "copioso", d: "copious, profuse"}
          - {w: "cegar", d: "to blind"}
        diagram:
          - s: "Dame"
            r: "main verb: give me"
            under:
              - {s: "si tienes", r: "condition: if you have it"}
              - {s: "con que me limpie", r: "object: something to wipe myself with"}
              - {s: "que el copioso sudor me ciega los ojos", r: "why: for the heavy sweat is blinding my eyes"}
        forms:
          - {w: "Dame", f: "da + me → dar (to give), imperative, you (tú): 'give me'; the pronoun hangs on the end of a positive command."}
          - {w: "tienes", f: "tien- + -es → tener (to have), present, you (tú). Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "me limpie", f: "limpi- + -e → limpiarse (to wipe oneself), present subjunctive, I, with 'me' (myself); subjunctive because it is something wanted, not yet had. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "ciega", f: "cieg- + -a → cegar (to blind), present, it (the sweat). The stem e becomes ie when stressed: ciego, ciegas, ciega, cegamos, cegáis, ciegan. 'me ... los ojos' = my eyes (Spanish uses the pronoun, not 'my')."}
  - sentences:
      - es: "Calló Sancho y diole un paño, y dio con él gracias a Dios de que su señor no hubiese caído en el caso."
        literal: "Kept-quiet Sancho and gave-him a cloth, and gave with it thanks to God that his master not had fallen into the matter."
        ormsby: "Sancho held his tongue, and gave him a cloth, and gave thanks to God at the same time that his master had not found out what was the matter."
        vocab:
          - {w: "callar", d: "to keep quiet, say nothing"}
          - {w: "paño", d: "cloth"}
          - {w: "dar gracias a Dios", d: "to thank God"}
          - {w: "con él", d: "along with it; a pun: he gave the cloth and 'with it' gave thanks"}
          - {w: "caer en el caso", d: "to see what has happened, catch on, realize"}
        diagram:
          - {s: "Calló Sancho", r: "main verb 1 with subject: Sancho kept quiet"}
          - {s: "y diole un paño", r: "main verb 2: and gave him a cloth"}
          - s: "y dio con él gracias a Dios"
            r: "main verb 3: and with it gave thanks to God"
            under:
              - {s: "de que su señor no hubiese caído en el caso", r: "for what: that his master had not caught on"}
        forms:
          - {w: "Calló", f: "call- + -ó → callar (to be silent), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "diole", f: "dio + le → dar (to give), preterite, he, with 'le' (to him) stuck on the end; modern 'le dio'. dar (to give) in the preterite: di, diste, dio, dimos, disteis, dieron."}
          - {w: "dio", f: "dar (to give), preterite, he: the same irregular di, diste, dio, dimos, disteis, dieron."}
          - {w: "hubiese caído", f: "hub- + -iese → haber (to have), imperfect subjunctive (-se form), he: hubiese, hubieses, hubiese, hubiésemos, hubieseis, hubiesen; + caído, participle of caer (to fall): pluperfect subjunctive, 'had (not) caught on'. Subjunctive after 'gracias de que'."}
      - es: "Limpióse don Quijote y quitóse la celada por ver qué cosa era la que, a su parecer, le enfriaba la cabeza, y, viendo aquellas gachas blancas dentro de la celada, las llegó a las narices, y en oliéndolas dijo:"
        literal: "Wiped-himself Don Quijote and took-off-himself the helmet to see what thing was the [one] that, to his seeming, to-him was-cooling the head, and, seeing those mush white inside of the helmet, them he-brought to the nostrils, and on smelling-them he-said:"
        ormsby: "Don Quixote then wiped himself, and took off his helmet to see what it was that made his head feel so cool, and seeing all that white mash inside his helmet he put it to his nose, and as soon as he had smelt it he exclaimed:"
        vocab:
          - {w: "a su parecer", d: "as it seemed to him, in his opinion"}
          - {w: "enfriar", d: "to cool, chill"}
          - {w: "gachas", d: "porridge, mush, pap; here the white mess of crushed curds"}
          - {w: "llegar a", d: "here transitive, 'to bring (something) up to'"}
          - {w: "narices", d: "nose (literally 'nostrils'; the plural is usual)"}
          - {w: "en oliéndolas", d: "as soon as he smelled them ('en' + gerund)"}
        diagram:
          - {s: "Limpióse don Quijote", r: "main verb 1 with subject: Don Quijote wiped himself"}
          - s: "y quitóse la celada"
            r: "main verb 2: and took off his helmet"
            under:
              - s: "por ver qué cosa era la"
                r: "why: to see what thing it was"
                under:
                  - {s: "que, a su parecer, le enfriaba la cabeza", r: "describes 'la': that, as he thought, was cooling his head"}
          - s: "las llegó a las narices"
            r: "main verb 3: he brought them up to his nose"
            under:
              - {s: "viendo aquellas gachas blancas dentro de la celada", r: "when: seeing that white mush inside the helmet"}
          - s: "y en oliéndolas dijo:"
            r: "main verb 4: and as soon as he smelt them, said"
        forms:
          - {w: "Limpióse", f: "limpi- + -ó + se → limpiarse (to wipe oneself), preterite, he, with 'se' stuck on the end; modern 'se limpió'. Cervantes hangs the pronoun on a verb that opens a clause. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "quitóse", f: "quit- + -ó + se → quitarse (to take off oneself), preterite, he, with 'se' on the end; modern 'se quitó'. Same -ó preterite."}
          - {w: "era", f: "ser (to be), imperfect, it. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "enfriaba", f: "enfri- + -aba → enfriar (to cool), imperfect, it. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "viendo", f: "gerund of ver (to see): 'seeing'."}
          - {w: "aquellas ... blancas", f: "aquell- + -as → aquel (that), and blanc- + -as → blanco (white), feminine plural to match 'gachas'."}
          - {w: "las llegó", f: "lleg- + -ó → llegar (to bring up to), preterite, he; 'las' = them (the gachas). Same -ó preterite."}
          - {w: "oliéndolas", f: "gerund of oler (to smell) + las (them), after 'en' = 'as soon as he smelled them'; accent added to keep the stress: oliendo → oliéndolas."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
