  - sentences:
      - es: "— ¿Quién duda, señor don Diego de Miranda, que vuestra merced no me tenga en su opinión por un hombre disparatado y loco?"
        literal: "— Who doubts, sir Don Diego de Miranda, that your grace not me may-hold in your opinion as a man absurd and mad?"
        ormsby: "“No doubt, Señor Don Diego de Miranda, you set me down in your mind as a fool and a madman,"
        vocab:
          - {w: "vuestra merced", d: "'your grace', the polite 'you' (it takes the 'he/she' verb form); the ancestor of 'usted'"}
          - {w: "tener por", d: "to take for, consider as"}
          - {w: "disparatado", d: "absurd, given to nonsense"}
        diagram:
          - s: "¿Quién duda"
            r: "main verb: who doubts (= no doubt)"
            under:
              - {s: "señor don Diego de Miranda", r: "addressed: Don Diego"}
              - s: "que vuestra merced no me tenga"
                r: "what nobody doubts: that you take me"
                under:
                  - {s: "en su opinión", r: "where: in your opinion"}
                  - {s: "por un hombre disparatado y loco?", r: "as what: for an absurd, mad man"}
        forms:
          - {w: "duda", f: "dud- + -a → dudar (to doubt), present, he (who). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "no me tenga", f: "teng- + -a → tener (to hold, take for), present subjunctive, you (vuestra merced, so the 'he' form). Irregular: tenga, tengas, tenga, tengamos, tengáis, tengan. The 'no' is not a real negative: after verbs of doubting and fearing, old Spanish often adds an empty 'no' (modern: 'que me tenga')."}
          - {w: "su", f: "'your', because 'vuestra merced' takes the third-person possessive."}
      - es: "Y no sería mucho que así fuese, porque mis obras no pueden dar testimonio de otra cosa."
