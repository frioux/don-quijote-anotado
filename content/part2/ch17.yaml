      - es: "que yo he visto por entre las verjas y resquicios de la jaula una uña de león verdadero, y saco por ella que el tal león, cuya debe de ser la tal uña, es mayor que una montaña."
        literal: "for I have seen through between the bars and chinks of the cage a claw of lion real, and I-draw by it that the such lion, whose must be the such claw, is bigger than a mountain."
        ormsby: "for between the bars and chinks of the cage I have seen the paw of a real lion, and judging by that I reckon the lion such a paw could belong to must be bigger than a mountain.”"
        vocab:
          - {w: "por entre", d: "through, between"}
          - {w: "verja", d: "bar, railing, grating"}
          - {w: "resquicio", d: "chink, crack, narrow gap"}
          - {w: "uña", d: "claw (of an animal); fingernail"}
          - {w: "sacar por", d: "to deduce from, judge by"}
          - {w: "el tal", d: "'the said, that', pointing back: 'el tal león' = that lion"}
          - {w: "deber de", d: "must (probability): 'debe de ser' = must be"}
        diagram:
          - s: "yo he visto"
            r: "main verb 1 (after 'que', for, from the previous sentence): I have seen"
            under:
              - {s: "por entre las verjas y resquicios de la jaula", r: "where: through the bars and chinks of the cage"}
              - {s: "una uña de león verdadero", r: "object: the claw of a real lion"}
          - s: "y saco por ella"
            r: "main verb 2: and I judge by it"
            under:
              - s: "que el tal león ... es mayor que una montaña"
                r: "what he judges: that that lion is bigger than a mountain"
                under:
                  - {s: "cuya debe de ser la tal uña", r: "describes 'león': whose that claw must be"}
        forms:
          - {w: "he visto", f: "he, haber (to have), present, I: he, has, ha, hemos, habéis, han; + visto, the irregular participle of ver (to see): 'I have seen'."}
          - {w: "saco", f: "sac- + -o → sacar (to draw out, deduce), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "ella", f: "'it', feminine because it stands for 'la uña' (the claw)."}
          - {w: "cuya", f: "'whose', feminine to match 'uña' (the thing owned), not 'león' (the owner)."}
          - {w: "debe de ser", f: "deb- + -e → deber (must), present, it: debo, debes, debe, debemos, debéis, deben; 'deber de' + infinitive gives a guess: 'must be'. ser (to be) is the infinitive."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "mayor", f: "the irregular comparative of grande (big): 'bigger'."}
        note: "Sancho turns the old Latin saying 'ex ungue leonem' (you know the lion by its claw: judge the whole from a part) into comic terror: from one claw he concludes the lion is bigger than a mountain."
  - sentences:
      - es: "— El miedo, a lo menos —respondió don Quijote—, te le hará parecer mayor que la mitad del mundo."
        literal: "— The fear, at the least —answered Don Quijote—, to-you him will-make seem bigger than the half of-the world."
        ormsby: "“Fear at any rate,” replied Don Quixote, “will make him look bigger to thee than half the world."
        vocab:
          - {w: "a lo menos", d: "at least, at any rate"}
          - {w: "hacer parecer", d: "to make (something) seem"}
        diagram:
          - s: "te le hará parecer mayor que la mitad del mundo"
            r: "main verb: will make him look bigger to you than half the world"
            under:
              - {s: "El miedo", r: "subject: fear"}
              - {s: "a lo menos", r: "how much: at any rate"}
          - {s: "—respondió don Quijote—", r: "frame: Don Quijote answered"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "te le", f: "te = to you (Sancho); le = him (the lion), used as a direct object for a male being: this is leísmo, common in Cervantes, where modern Spanish prefers 'lo' ('te lo hará parecer')."}
          - {w: "hará", f: "har- + -á → hacer (to make), future, it (fear). Irregular stem har-: haré, harás, hará, haremos, haréis, harán."}
          - {w: "parecer", f: "parecer (to seem), infinitive after 'hará' (will make him seem)."}
          - {w: "mayor", f: "the irregular comparative of grande (big): 'bigger'."}
          - {w: "del", f: "de + el, 'of the'."}
      - es: "Retírate, Sancho, y déjame; y si aquí muriere, ya sabes nuestro antiguo concierto: acudirás a Dulcinea, y no te digo más."
        literal: "Withdraw-yourself, Sancho, and leave-me; and if here I-should-die, already you-know our old agreement: you-will-go to Dulcinea, and not to-you I-say more."
        ormsby: "Retire, Sancho, and leave me; and if I die here thou knowest our old compact; thou wilt repair to Dulcinea—I say no more.”"
        vocab:
          - {w: "retirarse", d: "to withdraw, go back"}
          - {w: "concierto", d: "agreement, pact (not a musical concert here)"}
          - {w: "acudir a", d: "to go to, repair to (someone)"}
        diagram:
          - {s: "Retírate, Sancho, y déjame", r: "main verbs 1 and 2: withdraw, Sancho, and leave me"}
          - s: "ya sabes nuestro antiguo concierto"
            r: "main verb 3: you already know our old agreement"
            under:
              - {s: "si aquí muriere", r: "condition: if I should die here"}
              - {s: "acudirás a Dulcinea", r: "what the agreement is: you will go to Dulcinea"}
          - {s: "y no te digo más", r: "main verb 4: and I say no more to you"}
        forms:
          - {w: "Retírate", f: "retira + te → retirarse (to withdraw), imperative, you (tú), with 'te' stuck on the end; accent added to keep the stress. The tú imperative of regular verbs equals the 'he' present form."}
          - {w: "déjame", f: "deja + me → dejar (to leave), imperative, you (tú), with 'me' on the end; accent added."}
          - {w: "muriere", f: "mur- + -iere → morir (to die), future subjunctive, I: 'if I should die'. Built on the preterite murieron: muriere, murieres, muriere, muriéremos, muriereis, murieren. Cervantes uses it after 'si' for an open future; modern Spanish says 'si muero'."}
          - {w: "sabes", f: "sab- + -es → saber (to know), present, you (tú). saber (to know): sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "acudirás", f: "acudir- + -ás → acudir (to go to), future, you (tú). The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
        note: "The 'old agreement' goes back to the night of the fulling mills in Part I, Chapter XX, when Don Quijote told Sancho that if he did not come back within three days, Sancho was to go to El Toboso and tell Dulcinea that her knight had died in her service. Here he breaks off without saying more."
  - sentences:
      - es: "A éstas añadió otras razones, con que quitó las esperanzas de que no había de dejar de proseguir su desvariado intento."
        literal: "To these he-added other words, with which he-removed the hopes of that not he-was-going to leave-off from pursuing his deranged intent."
        ormsby: "To these he added some further words that banished all hope of his giving up his insane project."
        vocab:
          - {w: "razones", d: "words, remarks (not 'reasons' here)"}
          - {w: "quitar las esperanzas", d: "to take away all hope"}
          - {w: "dejar de", d: "to stop, give up (doing something)"}
          - {w: "proseguir", d: "to carry on, pursue"}
          - {w: "desvariado", d: "mad, crazy (from 'desvarío', delirium)"}
          - {w: "intento", d: "intention, purpose, design"}
        diagram:
          - s: "añadió otras razones"
            r: "main verb: he added other words"
            under:
              - {s: "A éstas", r: "to what: to these (words)"}
              - s: "con que quitó las esperanzas"
                r: "describes 'razones': with which he took away the hopes"
                under:
                  - {s: "de que no había de dejar de proseguir su desvariado intento", r: "what hopes: that he would not carry on with his mad plan (i.e. that he would give it up)"}
        forms:
          - {w: "éstas", f: "est- + -as → este (this), feminine plural standing for 'razones' (words), with the accent of the pronoun."}
          - {w: "añadió", f: "añad- + -ió → añadir (to add), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "quitó", f: "quit- + -ó → quitar (to take away), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "no había de dejar de proseguir", f: "había, haber (to have), imperfect, he: había, habías, había, habíamos, habíais, habían; 'haber de' + infinitive = to be going to; 'dejar de' + infinitive = to stop doing. So: the hopes 'that he would not keep on pursuing'. The extra 'no' after 'esperanzas de que' is a redundant negative, common in old Spanish; the sense is 'hopes that he would give up'."}
          - {w: "desvariado", f: "participle of desvariar (to rave), used as an adjective, masculine to match 'intento'."}
      - es: "Quisiera el del Verde Gabán oponérsele, pero viose desigual en las armas, y no le pareció cordura tomarse con un loco, que ya se lo había parecido de todo punto don Quijote;"
        literal: "Would-have-wished the [one] of-the Green Coat to-oppose-himself-to-him, but saw-himself unequal in the arms, and not to-him it-seemed good-sense to-take-himself with a madman, for already to-him it had seemed of all point Don Quijote;"
        ormsby: "He of the green gabán would have offered resistance, but he found himself ill-matched as to arms, and did not think it prudent to come to blows with a madman, for such Don Quixote now showed himself to be in every respect;"
        vocab:
          - {w: "el del Verde Gabán", d: "'the one of the green coat', the narrator's nickname for Don Diego; a 'gabán' is a riding coat"}
          - {w: "oponerse a", d: "to oppose, stand in the way of"}
          - {w: "desigual", d: "unequal, ill-matched"}
          - {w: "cordura", d: "good sense, sanity (opposite of 'locura')"}
          - {w: "tomarse con", d: "to take on, fight"}
          - {w: "de todo punto", d: "completely, in every respect"}
        diagram:
          - s: "Quisiera el del Verde Gabán oponérsele"
            r: "main verb 1: the man in the green coat would have liked to oppose him"
          - s: "pero viose desigual en las armas"
            r: "main verb 2: but he saw himself ill-matched in arms"
          - s: "y no le pareció cordura"
            r: "main verb 3: and it did not seem sensible to him"
            under:
              - {s: "tomarse con un loco", r: "subject of 'pareció': to take on a madman"}
              - s: "que ya se lo había parecido de todo punto don Quijote"
                r: "why (after 'que', for): for Don Quijote had already seemed so to him entirely"
        forms:
          - {w: "Quisiera", f: "quis- + -iera → querer (to want), imperfect subjunctive (-ra form), he, used as a conditional: 'he would have liked'. quisiera, quisieras, quisiera, quisiéramos, quisierais, quisieran."}
          - {w: "oponérsele", f: "oponer (to oppose) + se + le: 'to set himself against him', both pronouns hung on the infinitive; accent added to keep the stress."}
          - {w: "viose", f: "vi- + -o + se → verse (to see oneself), preterite, he, with 'se' stuck on the end; modern 'se vio'. ver (to see) in the preterite: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "pareció", f: "parec- + -ió → parecer (to seem), preterite, it. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "tomarse", f: "tomar (to take) + se: 'tomarse con' = to fight with; infinitive used as the subject of 'pareció'."}
          - {w: "se lo había parecido", f: "había, haber (to have), imperfect, he: había, habías, había, habíamos, habíais, habían; + parecido, participle of parecer (to seem): 'had seemed'. 'se' = 'le' (to him) changed to 'se' before 'lo'; 'lo' = so, standing for 'loco'."}
      - es: "el cual, volviendo a dar priesa al leonero y a reiterar las amenazas, dio ocasión al hidalgo a que picase la yegua, y Sancho al rucio, y el carretero a sus mulas, procurando todos apartarse del carro lo más que pudiesen, antes que los leones se desembanastasen."
