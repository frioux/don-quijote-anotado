          - {s: "Detuviéronse todos", r: "main verb 1: they all stopped"}
          - s: "y conocieron"
            r: "main verb 2: and they recognized"
            under:
              - {s: "que el que hacía las señas era don Quijote", r: "what they recognized: that the one signalling was Don Quijote"}
          - s: "se vinieron acercando"
            r: "main verb 3 (after 'y'): they came gradually closer"
            under:
              - {s: "perdiendo alguna parte del miedo", r: "how: losing some of their fear"}
              - {s: "poco a poco", r: "how: little by little"}
              - s: "hasta donde claramente oyeron las voces de don Quijote"
                r: "how far: to where they clearly heard Don Quijote's shouts"
                under:
                  - {s: "que los llamaba", r: "describes 'don Quijote': who was calling them"}
        forms:
          - {w: "Detuviéronse", f: "detuv- + -ieron + se → detenerse (to stop), preterite, they, with 'se' stuck on the end; modern 'se detuvieron'. Irregular like tener (to have): detuve, detuviste, detuvo, detuvimos, detuvisteis, detuvieron."}
          - {w: "conocieron", f: "conoc- + -ieron → conocer (to recognize), preterite, they. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "hacía", f: "hac- + -ía → hacer (to make), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "era", f: "ser (to be), imperfect, he. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "perdiendo", f: "perd- + -iendo → perder (to lose), gerund: 'losing'."}
          - {w: "se vinieron acercando", f: "vinieron → venir (to come), preterite, they: vine, viniste, vino, vinimos, vinisteis, vinieron; + acercando, gerund of acercarse (to approach), whose 'se' stands in front of the group: venir (to come) + gerund = to come gradually doing it."}
          - {w: "oyeron", f: "oy- + -eron → oír (to hear), preterite, they; the i between vowels becomes y: oí, oíste, oyó, oímos, oísteis, oyeron."}
          - {w: "llamaba", f: "llam- + -aba → llamar (to call), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "los", f: "'them', masculine plural for the whole group."}
      - es: "Finalmente, volvieron al carro, y, en llegando, dijo don Quijote al carretero:"
        literal: "Finally, they-returned to-the cart, and, on arriving, said Don Quijote to-the carter:"
