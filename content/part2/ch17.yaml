        forms:
          - {w: "da", f: "dar (to give), present, he (God). Irregular: doy, das, da, damos, dais, dan."}
          - {w: "debo ... de tener", f: "deb- + -o → deber (must), present, I: debo, debes, debe, debemos, debéis, deben; 'deber de' + tener (to have) gives a guess: 'I must have'."}
          - {w: "persiguen", f: "persigu- + -en → perseguir (to persecute), present, they. The stem e becomes i when stressed: persigo, persigues, persigue, perseguimos, perseguís, persiguen."}
