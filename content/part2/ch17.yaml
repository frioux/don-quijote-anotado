          - {w: "iban huyendo", f: "iban, ir (to go), imperfect, they: iba, ibas, iba, íbamos, ibais, iban; + huyendo, gerund of huir (to flee): 'were fleeing', 'ir' + gerund for an action in progress."}
          - {w: "estaban", f: "est- + -aban → estar (to be), imperfect, they: estaba, estabas, estaba, estábamos, estabais, estaban."}
          - {w: "desviados", f: "participle of desviar (to turn aside), masculine plural to match 'los que iban huyendo'."}
          - {w: "tornó", f: "torn- + -ó → tornar (to return; with 'a', to do again), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "había requerido e intimado", f: "había, haber (to have), imperfect, he: había, habías, había, habíamos, habíais, habían; + requerido, participle of requerir (to summon), and intimado, participle of intimar (to notify): 'had summoned and notified'. 'y' becomes 'e' before a word starting with i-."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "oía", f: "o- + -ía → oír (to hear), imperfect, he. Same -ía imperfect: oía, oías, oía, oíamos, oíais, oían."}
