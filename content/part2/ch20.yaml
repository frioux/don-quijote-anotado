          - {w: "llegue", f: "llegu- + -e → llegar (to arrive), present subjunctive, it; g becomes gu before e. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. The subjunctive follows 'está puesto en razón que' (it is right that)."}
          - {w: "el de la tuya", f: "el (the one) stands for 'día'; tuya (yours) is feminine to match 'muerte': 'that (day) of yours (death)'."}
