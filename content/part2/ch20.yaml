              - s: "que si como tienes buen natural y discreción"
                r: "condition: that if, as you have good natural wit and sense"
              - s: "pudieras tomar un púlpito en la mano"
                r: "what I tell, result 1: you could take a pulpit in your hand"
              - s: "y irte por ese mundo"
                r: "result 2: and go off about the world"
                under:
                  - {s: "predicando lindezas", r: "how: preaching fine things"}
