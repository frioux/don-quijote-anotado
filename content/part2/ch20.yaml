        vocab:
          - {w: "a buena fe", d: "in good faith, truly"}
          - {w: "no hay que", d: "+ infinitive: one must not, there's no point in; 'no hay que fiar' = there's no trusting"}
          - {w: "fiar en", d: "to trust, rely on"}
          - {w: "la descarnada", d: "'the fleshless one': Death, pictured as a skeleton"}
          - {w: "también ... como", d: "as well ... as, just as much ... as"}
          - {w: "carnero", d: "sheep, ram (full-grown); 'cordero' is the lamb"}
