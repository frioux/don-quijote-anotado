  - sentences:
      - es: "— Habréla acabado —respondió Sancho—, porque veo que vuestra merced recibe pesadumbre con ella; que si esto no se pusiera de por medio, obra había cortada para tres días."
        literal: "— I-will-have-it finished —answered Sancho—, because I-see that your grace receives annoyance with it; for if this not itself-had-put in-the middle, work there-was cut for three days."
        ormsby: "“Of course I have finished it,” replied Sancho, “because I see your worship takes offence at it; but if it was not for that, there was work enough cut out for three days.”"
        vocab:
          - {w: "vuestra merced", d: "your worship, your grace: the polite 'you', which takes the verb of 'he/she'"}
          - {w: "pesadumbre", d: "annoyance, displeasure, vexation"}
          - {w: "ponerse de por medio", d: "to come in between, get in the way"}
          - {w: "obra cortada", d: "work cut out, as a tailor cuts cloth ready to sew: material ready to go on with"}
        diagram:
          - s: "Habréla acabado"
            r: "main verb: I suppose I have finished it"
            under:
              - {s: "respondió Sancho", r: "speech tag: answered Sancho"}
              - s: "porque veo"
                r: "why: because I see"
                under:
                  - {s: "que vuestra merced recibe pesadumbre con ella", r: "what I see: that your worship is annoyed by it"}
          - s: "obra había cortada para tres días"
            r: "main verb 2 (after 'que', for): there was work cut out for three days"
            under:
              - {s: "si esto no se pusiera de por medio", r: "condition: if this had not got in the way"}
        forms:
          - {w: "Habréla acabado", f: "habr- + -é + la → haber (to have), future, I, with 'la' (it, the speech) stuck on the end; + acabado, participle of acabar (to finish): the future perfect, 'I will have finished it', here 'I suppose I've finished it'. haber in the future: habré, habrás, habrá, habremos, habréis, habrán. Modern Spanish would say 'la habré acabado'; Cervantes hangs the pronoun on a clause-opening verb, even in a compound tense."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "veo", f: "ve- + -o → ver (to see), present, I. ver in the present: veo, ves, ve, vemos, veis, ven."}
          - {w: "recibe", f: "recib- + -e → recibir (to receive), present, he/she (vuestra merced takes the 'he' form). The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "ella", f: "'it', feminine because it stands for 'arenga' (the speech)."}
          - {w: "se pusiera", f: "pus- + -iera → ponerse (to put oneself), imperfect subjunctive (-ra form), it, with 'se', in an 'if' clause: 'if this had not come in between'. Irregular: pusiera, pusieras, pusiera, pusiéramos, pusierais, pusieran."}
          - {w: "había", f: "hab- + -ía → haber (to have), imperfect, used impersonally: 'there was'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían. It stands where modern Spanish would put the conditional 'habría'."}
          - {w: "cortada", f: "cort- + -ada → cortar (to cut), participle, feminine to match 'obra'."}
  - sentences:
      - es: "— Plega a Dios, Sancho —replicó don Quijote—, que yo te vea mudo antes que me muera."
        literal: "— May-it-please to God, Sancho —replied Don Quijote—, that I you may-see dumb before that I may-die."
        ormsby: "“God grant I may see thee dumb before I die, Sancho,” said Don Quixote."
        vocab:
          - {w: "plega a Dios", d: "= plazca a Dios, may it please God, God grant (old form of the subjunctive of 'placer')"}
          - {w: "replicar", d: "to reply, answer back"}
          - {w: "mudo", d: "dumb, unable to speak; silent"}
          - {w: "antes que", d: "before (+ subjunctive); modern Spanish often 'antes de que'"}
        diagram:
          - s: "Plega a Dios"
            r: "main verb: may it please God"
            under:
              - {s: "Sancho", r: "addressed: Sancho"}
              - {s: "replicó don Quijote", r: "speech tag: replied Don Quijote"}
              - s: "que yo te vea mudo"
                r: "what should please God: that I see you dumb"
                under:
                  - {s: "antes que me muera", r: "when: before I die"}
        forms:
          - {w: "Plega", f: "pleg- + -a → placer (to please), present subjunctive, it: 'may it please'. An old form; modern Spanish uses 'plazca'. A subjunctive at the start of a sentence expresses a wish. In Cervantes it is used almost only in this one wish, 'plega a Dios' (may it please God), beside its past 'pluguiera a Dios'."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (repliqué, with c → qu before e)."}
          - {w: "vea", f: "ve- + -a → ver (to see), present subjunctive, I, after a wish ('plega a Dios que'). ver in the present subjunctive: vea, veas, vea, veamos, veáis, vean."}
          - {w: "te", f: "'you', object of 'vea', placed before the verb."}
          - {w: "me muera", f: "muer- + -a → morirse (to die), present subjunctive, I, with 'me'. The stem o becomes ue when stressed: muera, mueras, muera, muramos, muráis, mueran. The subjunctive is required after 'antes que'."}
  - sentences:
      - es: "— Al paso que llevamos —respondió Sancho—, antes que vuestra merced se muera estaré yo mascando barro, y entonces podrá ser que esté tan mudo que no hable palabra hasta la fin del mundo, o, por lo menos, hasta el día del Juicio."
        literal: "— At-the pace that we-carry —answered Sancho—, before that your grace may-die will-be I chewing clay, and then it-will-be-able to-be that I-may-be so dumb that not I-may-speak word until the end of-the world, or, at the least, until the day of-the Judgment."
        ormsby: "“At the rate we are going,” said Sancho, “I’ll be chewing clay before your worship dies; and then, maybe, I’ll be so dumb that I’ll not say a word until the end of the world, or, at least, till the day of judgment.”"
        vocab:
          - {w: "al paso que llevamos", d: "at the rate we are going"}
          - {w: "mascar barro", d: "to chew clay: to be dead and buried"}
          - {w: "podrá ser que", d: "it may be that"}
          - {w: "la fin", d: "= el fin, the end (old feminine use)"}
          - {w: "por lo menos", d: "at least"}
          - {w: "el día del Juicio", d: "Judgment Day, the Last Judgment, when the dead will rise"}
        diagram:
          - s: "estaré yo mascando barro"
            r: "main verb 1: I will be chewing clay"
            under:
              - {s: "Al paso que llevamos", r: "how: at the rate we are going"}
              - {s: "respondió Sancho", r: "speech tag: answered Sancho"}
              - {s: "antes que vuestra merced se muera", r: "when: before your worship dies"}
          - s: "y entonces podrá ser"
            r: "main verb 2: and then it may be"
            under:
              - s: "que esté tan mudo"
                r: "what may be: that I'll be so dumb"
                under:
                  - s: "que no hable palabra"
                    r: "result: that I won't speak a word"
                    under:
                      - {s: "hasta la fin del mundo", r: "until when: till the end of the world"}
                      - {s: "o, por lo menos, hasta el día del Juicio", r: "until when, 2: or at least till Judgment Day"}
        forms:
          - {w: "Al", f: "a + el, contracted: 'al paso' = at the pace."}
          - {w: "llevamos", f: "llev- + -amos → llevar (to carry, keep up), present, we. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "se muera", f: "muer- + -a → morirse (to die), present subjunctive, he/she (vuestra merced takes the 'he' form), with 'se'. muera, mueras, muera, muramos, muráis, mueran. Subjunctive after 'antes que'."}
          - {w: "estaré ... mascando", f: "estar- + -é → estar (to be), future, I: estaré, estarás, estará, estaremos, estaréis, estarán; + mascando, gerund of mascar (to chew): 'I will be chewing'."}
          - {w: "podrá", f: "podr- + -á → poder (to be able), future, it. Irregular stem podr-: podré, podrás, podrá, podremos, podréis, podrán."}
          - {w: "esté", f: "est- + -é → estar (to be), present subjunctive, I, after 'podrá ser que'. estar in the present subjunctive: esté, estés, esté, estemos, estéis, estén."}
          - {w: "hable", f: "habl- + -e → hablar (to speak), present subjunctive, I, in the result clause of a supposed future. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "la fin del", f: "fin (end), feminine in old Spanish ('la fin'), masculine today ('el fin'); del = de + el."}
        note: "Sancho turns the wish round: he is younger, but at the rate their adventures are going he will be dead first. Only death, he says, will silence him."
  - sentences:
      - es: "— Aunque eso así suceda, ¡oh Sancho! —respondió don Quijote—, nunca llegará tu silencio a do ha llegado lo que has hablado, hablas y tienes de hablar en tu vida;"
        literal: "— Even-if that so may-happen, oh Sancho! —answered Don Quijote—, never will-reach your silence to where has reached that which you-have spoken, you-speak and you-have to speak in your life;"
        ormsby: "“Even should that happen, O Sancho,” said Don Quixote, “thy silence will never come up to all thou hast talked, art talking, and wilt talk all thy life;"
        vocab:
          - {w: "aunque", d: "even if (with the subjunctive), although (with the indicative)"}
          - {w: "do", d: "= donde, where (old poetic form)"}
          - {w: "llegar a", d: "to reach, come up to, equal"}
          - {w: "tener de", d: "+ infinitive: to have to, be going to (old form of 'tener que', like 'haber de')"}
        diagram:
          - s: "nunca llegará tu silencio"
            r: "main verb: your silence will never reach"
            under:
              - {s: "Aunque eso así suceda", r: "concession: even if that happens"}
              - {s: "¡oh Sancho!", r: "addressed: O Sancho"}
              - {s: "respondió don Quijote", r: "speech tag: answered Don Quijote"}
              - s: "a do ha llegado lo"
                r: "how far: to where that has reached"
                under:
                  - {s: "que has hablado, hablas y tienes de hablar en tu vida", r: "describes 'lo': what you have said, say and will say in your life"}
        forms:
          - {w: "suceda", f: "suced- + -a → suceder (to happen), present subjunctive, it, after 'aunque' meaning 'even if'. The present subjunctive of -er and -ir verbs: -a, -as, -a, -amos, -áis, -an."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "llegará", f: "llegar- + -á → llegar (to reach), future, it (your silence). The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "ha llegado", f: "ha → haber (to have), present, it: he, has, ha, hemos, habéis, han; + llegado, participle of llegar (to reach): 'has reached'."}
          - {w: "has hablado, hablas y tienes de hablar", f: "three tenses of hablar (to speak), past, present, future: has hablado (present perfect: has → haber (to have), present, you: he, has, ha, hemos, habéis, han; + hablado, participle) 'you have spoken'; habl- + -as, present, you (-o, -as, -a, -amos, -áis, -an) 'you speak'; tienes → tener (to have), present, you (tengo, tienes, tiene, tenemos, tenéis, tienen) + de + hablar, 'you are going to speak'."}
          - {w: "do", f: "old form of donde (where)."}
        note: "Don Quijote's joke is in the tenses: past, present and future, Sancho's talking outweighs any silence, even the endless silence of the grave."
      - es: "y más, que está muy puesto en razón natural que primero llegue el día de mi muerte que el de la tuya;"
        literal: "and more, for it-is very placed in reason natural that first may-arrive the day of my death than that of the yours;"
