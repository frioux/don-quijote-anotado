            r: "main verb 1: came forward and withdrew"
            under:
              - {s: "Deste modo", r: "how: in this way"}
              - {s: "todas las dos figuras de las dos escuadras", r: "subject: all the characters of the two bands"}
          - s: "cada uno hizo sus mudanzas"
            r: "main verb 2 (after 'y'): each one did his figures"
          - s: "y dijo sus versos"
            r: "main verb 3: and spoke his verses"
            under:
