      - es: "y así, jamás pienso verte mudo, ni aun cuando estés bebiendo o durmiendo, que es lo que puedo encarecer."
        literal: "and so, never I-think to-see-you dumb, not even when you-may-be drinking or sleeping, which is what I-can emphasize."
