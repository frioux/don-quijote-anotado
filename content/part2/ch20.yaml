          - {w: "así", d: "here 'likewise, in the same way', linking items in a list"}
          - {w: "rimero", d: "pile, stack (of things laid one on another)"}
          - {w: "pan blanco", d: "white bread, made of fine wheat flour: a luxury; the poor ate darker bread"}
          - {w: "montón", d: "heap, pile"}
          - {w: "era", d: "threshing-floor, the flat round space where grain was threshed after harvest"}
