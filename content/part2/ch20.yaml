          - s: "y sólo tomó de memoria"
            r: "main verb 4: and only learned by heart"
            under:
              - {s: "don Quijote", r: "subject: Don Quijote"}
              - {s: "que la tenía grande", r: "aside, describes Don Quijote: who had a great one (memory)"}
              - {s: "los ya referidos", r: "object: those already quoted"}
        forms:
          - {w: "Deste", f: "de + este (this), run together; modern 'de este', masculine to match 'modo'."}
          - {w: "salieron", f: "sal- + -ieron → salir (to come out), preterite, they. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "se retiraron", f: "retir- + -aron → retirarse (to withdraw), preterite, they, with 'se' (themselves). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "hizo", f: "hiz- + -o → hacer (to do), preterite, he (each one). Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "tomó", f: "tom- + -ó → tomar (to take), preterite, he (Don Quijote). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. The subject 'don Quijote' comes after the verb."}
          - {w: "la tenía grande", f: "ten- + -ía → tener (to have), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían. 'la' stands for 'la memoria'; 'grande' agrees with it: 'he had it great', i.e. he had a fine memory."}
