      - es: "Dígote, Sancho que si como tienes buen natural y discreción, pudieras tomar un púlpito en la mano y irte por ese mundo predicando lindezas..."
        literal: "I-tell-you, Sancho that if as you-have good nature and discretion, you-could take a pulpit in the hand and go-off through that world preaching pretty-things..."
