          - {w: "debe de ser", f: "deb- + -e → deber (must), present, it: debo, debes, debe, debemos, debéis, deben; 'deber de' + infinitive = probably is: 'as it must be'. ser (to be) is the infinitive."}
          - {w: "boba", f: "bob- + -a → bobo (silly), feminine to match 'Quiteria'; 'bien' here means 'very'."}
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), she, used as a conditional: 'she would be'. fuera, fueras, fuera, fuéramos, fuerais, fueran."}
          - {w: "debe de haber dado", f: "debe → deber (must), present, he (Camacho): debo, debes, debe, debemos, debéis, deben; + haber (to have) + dado, participle of dar (to give): 'he must have given'."}
