          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
          - {w: "él", f: "'it', masculine because it stands for 'el castillo'; with an accent it is the pronoun, without ('el') the article."}
          - {w: "doradas", f: "dor- + -adas → dorar (to gild), participle, feminine plural to match 'alcancías'."}
        note: "Love attacks the castle of the maiden's modesty with arrows, Interest with gilded balls, that is, with money; the allegory of Basilio against Camacho is plain."
  - sentences:
      - es: "Finalmente, después de haber bailado un buen espacio, el Interés sacó un bolsón, que le formaba el pellejo de un gran gato romano, que parecía estar lleno de dineros, y, arrojándole al castillo, con el golpe se desencajaron las tablas y se cayeron, dejando a la doncella descubierta y sin defensa alguna."
        literal: "Finally, after of having danced a good space, the Interest took-out a big-purse, which it formed the skin of a big cat tabby, which seemed to-be full of moneys, and, throwing-it at-the castle, with the blow came-apart the boards and fell-down, leaving [to] the maiden uncovered and without defence any."
        ormsby: "At length, after they had danced a good while, Interest drew out a great purse, made of the skin of a large brindled cat and to all appearance full of money, and flung it at the castle, and with the force of the blow the boards fell asunder and tumbled down, leaving the damsel exposed and unprotected."
        vocab:
          - {w: "un buen espacio", d: "a good while (time, not space)"}
          - {w: "bolsón", d: "a big purse, money-bag (bolsa + the augmentative -ón)"}
          - {w: "pellejo", d: "skin, hide (of an animal)"}
          - {w: "gato romano", d: "tabby or brindled cat; purses of cat-skin were common, and 'gato' itself could mean a money-bag"}
          - {w: "dineros", d: "money, coins (the plural was usual in Cervantes' day)"}
          - {w: "arrojar", d: "to hurl, fling"}
          - {w: "desencajarse", d: "to come apart, come out of their joints"}
          - {w: "tabla", d: "board, plank"}
          - {w: "descubierto", d: "uncovered, exposed"}
          - {w: "sin defensa alguna", d: "with no defence at all ('alguno' after the noun = none at all)"}
        diagram:
          - s: "el Interés sacó un bolsón"
            r: "main verb 1: Interest took out a big purse"
            under:
              - {s: "Finalmente, después de haber bailado un buen espacio", r: "when: finally, after dancing a good while"}
              - {s: "que le formaba el pellejo de un gran gato romano", r: "describes 'bolsón': made of the skin of a big tabby cat"}
              - {s: "que parecía estar lleno de dineros", r: "describes 'bolsón', 2: which seemed full of money"}
          - s: "se desencajaron las tablas y se cayeron"
            r: "main verb 2 (after 'y'): the boards came apart and fell"
            under:
              - {s: "arrojándole al castillo", r: "how: when he threw it at the castle"}
              - {s: "con el golpe", r: "why: with the blow"}
              - s: "dejando a la doncella descubierta y sin defensa alguna"
                r: "result: leaving the maiden exposed and defenceless"
        forms:
          - {w: "haber bailado", f: "haber (to have) + bailado, participle of bailar (to dance): the perfect infinitive, 'having danced', after 'después de'."}
          - {w: "sacó", f: "sac- + -ó → sacar (to take out), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (saqué, with c → qu before e)."}
          - {w: "que le formaba", f: "form- + -aba → formar (to form, make up), imperfect, it (the skin). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. 'le' repeats 'que' (the purse) as object, a redundant pronoun common in Cervantes; 'le' for a thing rather than a person is leísmo. The subject 'el pellejo' comes after."}
          - {w: "gran", f: "grande (big) clipped before a singular noun ('gato')."}
          - {w: "parecía", f: "parec- + -ía → parecer (to seem), imperfect, it (the purse). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "lleno", f: "llen- + -o → lleno (full), masculine to match 'bolsón'."}
          - {w: "arrojándole", f: "gerund of arrojar (to hurl) + le (it, the purse), accent added to keep the stress on -ján-. 'le' for a thing is leísmo; modern 'arrojándolo'."}
          - {w: "al", f: "a + el, the contraction modern Spanish still makes."}
          - {w: "se desencajaron", f: "desencaj- + -aron → desencajarse (to come apart), preterite, they (the boards). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "se cayeron", f: "cay- + -eron → caerse (to fall down), preterite, they. Irregular, i becomes y between vowels: caí, caíste, cayó, caímos, caísteis, cayeron."}
          - {w: "dejando", f: "gerund of dejar (to leave): 'leaving'."}
          - {w: "descubierta", f: "irregular participle of descubrir (to uncover), feminine to match 'doncella'."}
          - {w: "alguna", f: "algun- + -a → alguno (some), feminine to match 'defensa'; placed after the noun in a negative phrase it means 'none at all'."}
        note: "The castle that resisted Love's arrows falls to a single bag of money: the dance predicts that Quiteria will go to the rich Camacho."
      - es: "Llegó el Interés con las figuras de su valía, y, echándola una gran cadena de oro al cuello, mostraron prenderla, rendirla y cautivarla;"
