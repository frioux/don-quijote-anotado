        forms:
          - {w: "había", f: "hab- + -ía → haber (to have), imperfect, used impersonally: 'there were'. The impersonal form takes no plural even with a plural noun ('rimeros'). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "blanquísimo", f: "blanc- + -ísimo → blanco (white) with the superlative suffix -ísimo, 'extremely white'; c becomes qu before i to keep the hard sound."}
