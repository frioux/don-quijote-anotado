  - sentences:
      - es: "Contó Sancho más de sesenta zaques de más de a dos arrobas cada uno, y todos llenos, según después pareció, de generosos vinos;"
        literal: "Counted Sancho more than sixty wineskins of more than at two arrobas each one, and all full, according-as afterwards it-appeared, of generous wines;"
        ormsby: "Sancho counted more than sixty wine skins of over six gallons each, and all filled, as it proved afterwards, with generous wines."
        vocab:
          - {w: "zaque", d: "wineskin, a goatskin bag for wine"}
          - {w: "arroba", d: "a measure: for wine about 16 litres (some four gallons); for weight about 11.5 kg (25 pounds)"}
          - {w: "de más de a dos arrobas", d: "holding over two arrobas each; the 'a' marks the measure of each item"}
          - {w: "según después pareció", d: "as it turned out later; 'parecer' here = to come to light, prove"}
          - {w: "generoso", d: "of wine: rich, strong, full-bodied (not 'giving freely')"}
        diagram:
          - s: "Contó"
            r: "main verb: counted"
            under:
              - {s: "Sancho", r: "subject: who counted"}
              - s: "más de sesenta zaques"
                r: "object: more than sixty wineskins"
                under:
                  - {s: "de más de a dos arrobas cada uno", r: "describes 'zaques': each holding over two arrobas"}
                  - s: "y todos llenos"
                    r: "describes 'zaques', 2: and all of them full"
                    under:
                      - {s: "según después pareció", r: "aside: as it later turned out"}
                      - {s: "de generosos vinos", r: "full of what: of rich wines"}
        forms:
          - {w: "Contó", f: "cont- + -ó → contar (to count), preterite, he: 'counted'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. The verb comes before its subject 'Sancho'."}
          - {w: "llenos", f: "llen- + -os → lleno (full), masculine plural to match 'zaques'."}
          - {w: "pareció", f: "parec- + -ió → parecer (to seem, to turn out), preterite, it: 'it appeared'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "generosos vinos", f: "generos- + -os → generoso (rich, strong), masculine plural to match 'vinos'; placed before the noun as a stock epithet."}
        note: "Over sixty skins of more than two arrobas each is well over a thousand litres of wine: the point of the whole description is the sheer excess of the rich man's feast."
      - es: "así había rimeros de pan blanquísimo, como los suele haber de montones de trigo en las eras;"
