  - sentences:
      - es: "-En dulcísimos conceptos, la dulcísima Poesía, altos, graves y discretos, señora, el alma te envía envuelta entre mil sonetos."
        literal: "-In most-sweet conceits, the most-sweet Poetry, lofty, grave and witty, lady, the soul to-you sends wrapped among thousand sonnets."
        ormsby: "With many a fanciful conceit, / Fair Lady, winsome Poesy / Her soul, an offering at thy feet, / Presents in sonnets unto thee."
        vocab:
          - {w: "concepto", d: "conceit: a witty, ingenious poetic idea or figure (not 'concept')"}
          - {w: "grave", d: "serious, weighty, dignified"}
          - {w: "discreto", d: "clever, witty, sensible (more than 'discreet')"}
          - {w: "envuelto", d: "wrapped"}
          - {w: "soneto", d: "sonnet, the fourteen-line poem, the prestige form of Spanish lyric poetry"}
        diagram:
          - s: "el alma te envía"
            r: "main verb: sends you her soul"
            under:
              - {s: "la dulcísima Poesía", r: "subject: most sweet Poetry"}
              - s: "En dulcísimos conceptos"
                r: "how: in sweetest conceits"
                under:
                  - {s: "altos, graves y discretos", r: "describes 'conceptos': lofty, weighty and witty"}
              - {s: "señora", r: "who is addressed: lady"}
              - {s: "envuelta entre mil sonetos", r: "describes 'alma': wrapped in a thousand sonnets"}
        forms:
          - {w: "dulcísimos, dulcísima", f: "dulc- + -ísimo → dulce (sweet) with the superlative ending -ísimo: 'most sweet, sweetest'; masculine plural to match 'conceptos', then feminine to match 'Poesía'."}
          - {w: "altos, graves y discretos", f: "masculine plural to match 'conceptos', placed after the name for the rhyme; 'graves' has one form for both genders."}
          - {w: "el alma", f: "'alma' (soul) is feminine but takes 'el' because it begins with a stressed a-; hence 'envuelta' (feminine) agrees with it."}
          - {w: "envía", f: "enví- + -a → enviar (to send), present, she (Poetry). The i takes an accent when stressed: envío, envías, envía, enviamos, enviáis, envían."}
          - {w: "envuelta", f: "irregular participle of envolver (to wrap), feminine to match 'alma'."}
          - {w: "te", f: "'to you', the maiden; Poetry uses 'tú', as poetry addressed to a lady often did."}
        note: "Poetry's stanza, like Love's and Interest's, is ten eight-syllable lines in two rhymed groups of five. She offers what a poor but gifted suitor can give: verses."
      - es: "Si acaso no te importuna mi porfía, tu fortuna, de otras muchas invidiada, será por mí levantada sobre el cerco de la luna."
        literal: "If perhaps not you troubles my persistence, your fortune, by others many envied, will-be by me raised above the circle of the moon."
        ormsby: "If thou my homage wilt not scorn, / Thy fortune, watched by envious eyes, / On wings of poesy upborne / Shall be exalted to the skies."
        vocab:
          - {w: "acaso", d: "perhaps, by chance; 'si acaso' = if by any chance"}
          - {w: "importunar", d: "to annoy, pester, trouble"}
          - {w: "porfía", d: "persistence, insistence"}
          - {w: "invidiar", d: "= envidiar, to envy (old spelling)"}
          - {w: "cerco de la luna", d: "the circle, sphere of the moon; in the old astronomy, the boundary between the changing earthly world and the perfect heavens"}
        diagram:
          - s: "tu fortuna"
            r: "subject of 'será': your fortune"
            under:
              - {s: "de otras muchas invidiada", r: "describes 'fortuna': envied by many other women"}
          - s: "será por mí levantada"
            r: "main verb: will be raised by me"
            under:
              - {s: "Si acaso no te importuna mi porfía", r: "condition: if my persistence does not trouble you"}
              - {s: "sobre el cerco de la luna", r: "where to: above the sphere of the moon"}
        forms:
          - {w: "importuna", f: "importun- + -a → importunar (to trouble), present, it (my persistence). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. The subject 'mi porfía' comes after the verb."}
          - {w: "invidiada", f: "invidi- + -ada → invidiar (old form of envidiar, to envy), participle, feminine to match 'fortuna'; 'de otras muchas' = by many others, with 'de' marking the agent as was usual then."}
          - {w: "será por mí levantada", f: "ser- + -á → ser (to be), future, it: seré, serás, será, seremos, seréis, serán; + levantada, participle of levantar (to raise), feminine to match 'fortuna': the passive, 'will be raised', with the agent 'por mí' (by me)."}
          - {w: "mí", f: "'me' after a preposition ('por mí'), with an accent to tell it from 'mi' (my)."}
        note: "The poet's old promise: verse will make the beloved famous and lift her above the envy of other women, beyond the moon into the unchanging heavens."
  - sentences:
      - es: "Desvióse la Poesía, y de la parte del Interés salió la Liberalidad, y, después de hechas sus mudanzas, dijo:"
