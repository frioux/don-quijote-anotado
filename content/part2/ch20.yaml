  - sentences:
      - es: "— A buena fe, señor —respondió Sancho—, que no hay que fiar en la descarnada, digo, en la muerte, la cual también come cordero como carnero;"
        literal: "— In good faith, sir —answered Sancho—, that not there-is [reason] to trust in the fleshless-one, I-say, in the death, the which as-well eats lamb as sheep;"
