              - {s: "aguachirle", r: "what they will be: slops"}
        forms:
          - {w: "vuelvo", f: "vuelv- + -o → volver (to return), present, I. The stem o becomes ue when stressed: vuelvo, vuelves, vuelve, volvemos, volvéis, vuelven. 'volver a' + infinitive = to do again."}
          - {w: "me atengo", f: "ateng- + -o → atenerse (to stick to), present, I, with 'me'. Built on tener (to have): atengo, atienes, atiene, atenemos, atenéis, atienen."}
          - {w: "cuyas", f: "cuy- + -as → cuyo (whose), feminine plural to match 'ollas', the thing owned, not the owner Camacho."}
          - {w: "son", f: "ser (to be), present, they: soy, eres, es, somos, sois, son. The subject 'gansos y gallinas, liebres y conejos' comes after."}
          - {w: "las de Basilio", f: "las (those), feminine plural standing for 'ollas': 'Basilio's (pots)'."}
