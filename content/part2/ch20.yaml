      - es: "Las especias de diversas suertes no parecía haberlas comprado por libras, sino por arrobas, y todas estaban de manifiesto en una grande arca."
        literal: "The spices of diverse sorts not it-seemed to-have-them bought by pounds, but by arrobas, and all were in view in a big chest."
        ormsby: "The spices of different kinds did not seem to have been bought by the pound but by the quarter, and all lay open to view in a great chest."
        vocab:
          - {w: "especia", d: "spice (pepper, cloves, saffron, cinnamon): costly imports, a sign of wealth"}
          - {w: "suerte", d: "here 'sort, kind', not 'luck'"}
          - {w: "libra", d: "pound (weight), about 460 g"}
          - {w: "arroba", d: "a weight of 25 pounds (about 11.5 kg); Ormsby's 'quarter' means a quarter-hundredweight, roughly the same"}
          - {w: "de manifiesto", d: "on show, in plain view"}
          - {w: "arca", d: "chest, large box with a lid"}
        diagram:
          - s: "no parecía"
            r: "main verb 1: it did not seem"
            under:
              - {s: "Las especias de diversas suertes", r: "topic: the spices of all kinds"}
              - s: "haberlas comprado por libras"
                r: "what did not seem: that (anyone) had bought them by the pound"
                under:
                  - {s: "sino por arrobas", r: "contrast: but by the twenty-five-pound arroba"}
          - s: "y todas estaban de manifiesto"
            r: "main verb 2: and all were on show"
            under:
              - {s: "en una grande arca", r: "where: in a great chest"}
        forms:
          - {w: "parecía", f: "parec- + -ía → parecer (to seem), imperfect, it, used impersonally: 'it did not seem'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "haberlas comprado", f: "haber (to have) + las (them, the spices) + comprado, participle of comprar (to buy): the perfect infinitive, 'to have bought them', with no stated subject (whoever bought them). The pronoun hangs on the infinitive."}
          - {w: "estaban", f: "est- + -aban → estar (to be), imperfect, they (the spices). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "grande", f: "grande (big) kept whole before a singular noun ('arca'); modern Spanish clips it to 'gran' there. Cervantes uses both."}
      - es: "Finalmente, el aparato de la boda era rústico, pero tan abundante que podía sustentar a un ejército."
        literal: "Finally, the apparatus of the wedding was rustic, but so abundant that it-could sustain [to] an army."
        ormsby: "In short, all the preparations made for the wedding were in rustic style, but abundant enough to feed an army."
        vocab:
          - {w: "aparato", d: "preparations, display, pomp (false friend: not a machine)"}
          - {w: "rústico", d: "rustic, countrified, in peasant style"}
          - {w: "sustentar", d: "to feed, keep, sustain"}
        diagram:
          - s: "el aparato de la boda era rústico"
            r: "main clause: the wedding preparations were rustic"
            under:
              - {s: "Finalmente", r: "linking: in short"}
              - s: "pero tan abundante"
                r: "contrast: but so plentiful"
                under:
                  - {s: "que podía sustentar a un ejército", r: "result: that it could feed an army"}
        forms:
          - {w: "era", f: "ser (to be), imperfect, it. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "podía", f: "pod- + -ía → poder (to be able), imperfect, it: 'could'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "a un ejército", f: "'a' before a direct object that is a group of people (personal 'a'), here an army."}
          - {w: "tan ... que", f: "tan (so) + adjective + que: 'so plentiful that', the frame for a result clause."}
  - sentences:
      - es: "Todo lo miraba Sancho Panza, y todo lo contemplaba, y de todo se aficionaba:"
        literal: "All it looked-at Sancho Panza, and all it he-contemplated, and of all himself he-grew-fond:"
        ormsby: "Sancho observed all, contemplated all, and everything won his heart."
        vocab:
          - {w: "contemplar", d: "to gaze at, contemplate at length"}
          - {w: "aficionarse de", d: "to take a liking to, become fond of (modern 'aficionarse a')"}
        diagram:
          - s: "Todo lo miraba Sancho Panza"
            r: "main verb 1: Sancho looked at everything"
          - s: "y todo lo contemplaba"
            r: "main verb 2: and he gazed at everything"
          - s: "y de todo se aficionaba"
            r: "main verb 3: and he took a fancy to everything"
        forms:
          - {w: "Todo lo miraba", f: "mir- + -aba → mirar (to look at), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. 'Todo' is put first for emphasis and then repeated as 'lo' (it) before the verb, as Spanish does with a fronted object."}
          - {w: "contemplaba", f: "contempl- + -aba → contemplar (to gaze at), imperfect, he. Same -aba imperfect."}
          - {w: "se aficionaba", f: "aficion- + -aba → aficionarse (to grow fond), imperfect, he, with 'se' (himself). Same -aba imperfect."}
        note: "The triple 'todo ... todo ... de todo' builds up Sancho's greed in the rhythm of a litany; the next sentences list what won him, item by item."
      - es: "primero le cautivaron y rindieron el deseo las ollas, de quién él tomara de bonísima gana un mediano puchero; luego le aficionaron la voluntad los zaques;"
        literal: "first to-him captivated and conquered the desire the pots, of which he would-have-taken of very-good will a middling pipkin; then to-him won the will the wineskins;"
        ormsby: "The first to captivate and take his fancy were the pots, out of which he would have very gladly helped himself to a moderate pipkinful; then the wine skins secured his affections;"
        vocab:
          - {w: "cautivar", d: "to captivate, take captive"}
          - {w: "rendir", d: "to conquer, make surrender"}
          - {w: "olla", d: "stewpot, and the stew cooked in it"}
          - {w: "de quién", d: "from which; 'quién' (here with an accent in the Gutenberg text) refers to the pots: old Spanish uses 'quien' for things"}
          - {w: "de buena gana", d: "willingly, gladly; 'de bonísima gana' = most gladly"}
          - {w: "mediano", d: "middling, moderate-sized"}
          - {w: "puchero", d: "pipkin, small earthenware cooking-pot, and its contents"}
          - {w: "aficionar la voluntad", d: "to win someone's affection, make someone fond"}
        diagram:
          - s: "primero le cautivaron y rindieron el deseo"
            r: "main verb 1: first they captured and conquered his desire"
            under:
              - s: "las ollas"
                r: "subject: the stewpots"
                under:
                  - {s: "de quién él tomara de bonísima gana un mediano puchero", r: "describes 'ollas': from which he would most gladly have taken a fair-sized pipkinful"}
          - s: "luego le aficionaron la voluntad"
            r: "main verb 2: then they won his heart"
            under:
              - {s: "los zaques", r: "subject: the wineskins"}
        forms:
          - {w: "cautivaron, rindieron", f: "cautiv- + -aron → cautivar (to captivate), preterite, they (the pots). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. rind- + -ieron → rendir (to conquer), preterite, they; the e of the stem turns to i in the preterite 'they' form: rendí, rendiste, rindió, rendimos, rendisteis, rindieron."}
          - {w: "le", f: "'to him', marking whose desire: 'le cautivaron el deseo' = they captured his desire. Spanish uses the indirect pronoun plus 'el' where English uses 'his'."}
          - {w: "tomara", f: "tom- + -ara → tomar (to take), imperfect subjunctive (-ra form), he, used here as a conditional: 'he would have taken'. The -ra form of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran. Cervantes often uses the -ra form where modern Spanish says 'habría tomado'."}
          - {w: "bonísima", f: "bon- + -ísima → bueno (good) with the superlative suffix -ísima, feminine to match 'gana'; the old Latin-style stem 'bon-' replaces 'buen-' (modern also 'buenísima')."}
          - {w: "aficionaron", f: "aficion- + -aron → aficionar (to make fond), preterite, they (the wineskins). Same -aron preterite as 'cautivaron'."}
      - es: "y, últimamente, las frutas de sartén, si es que se podían llamar sartenes las tan orondas calderas;"
        literal: "and, lastly, the fruits of frying-pan, if it-is that themselves could call frying-pans the so swollen cauldrons;"
        ormsby: "and lastly, the produce of the frying-pans, if, indeed, such imposing cauldrons may be called frying-pans;"
        vocab:
          - {w: "últimamente", d: "lastly, finally (false friend: not 'lately')"}
          - {w: "frutas de sartén", d: "fritters, pastries fried in oil (literally 'fruits of the frying-pan')"}
          - {w: "sartén", d: "frying-pan"}
          - {w: "si es que", d: "if indeed, if it is the case that"}
          - {w: "orondo", d: "pot-bellied, big and rounded; puffed up"}
        diagram:
          - s: "las frutas de sartén"
            r: "subject 3, verb carried over from 'le aficionaron la voluntad': lastly the fritters won him"
            under:
              - {s: "últimamente", r: "when: lastly"}
              - {s: "si es que se podían llamar sartenes las tan orondas calderas", r: "aside: if such pot-bellied cauldrons could be called frying-pans"}
        forms:
          - {w: "últimamente", f: "últim- + -a + -mente → último (last) turned into an adverb: the feminine form plus -mente, 'lastly'."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "se podían llamar", f: "pod- + -ían → poder (to be able), imperfect, they, + llamar (to call), infinitive; 'se' makes it passive: 'could be called'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "sartenes", f: "plural of sartén (frying-pan): -es added after a consonant, and the accent drops because the stress now falls naturally."}
          - {w: "tan orondas", f: "orond- + -as → orondo (pot-bellied), feminine plural to match 'calderas'; 'tan' = so."}
        note: "The joke: these 'frying-pans' are the huge oil cauldrons described a moment ago, so calling their products 'fruit of the frying-pan' is an understatement."
      - es: "y así, sin poderlo sufrir ni ser en su mano hacer otra cosa, se llegó a uno de los solícitos cocineros, y, con corteses y hambrientas razones, le rogó le dejase mojar un mendrugo de pan en una de aquellas ollas. A lo que el cocinero respondió:"
        literal: "and so, without being-able-to-it endure nor being in his hand to-do other thing, himself he-came-up to one of the busy cooks, and, with courteous and hungry words, him he-begged [that] him he-should-let dip a crust of bread in one of those pots. To which the cook answered:"
        ormsby: "and unable to control himself or bear it any longer, he approached one of the busy cooks and civilly but hungrily begged permission to soak a scrap of bread in one of the pots; to which the cook made answer,"
        vocab:
          - {w: "sufrir", d: "to bear, endure (not only 'to suffer')"}
          - {w: "ser en su mano", d: "to be in one's power"}
          - {w: "llegarse a", d: "to go up to, approach"}
          - {w: "solícito", d: "busy, diligent, attentive"}
          - {w: "razones", d: "words, remarks (not 'reasons')"}
          - {w: "rogar", d: "to beg, ask humbly"}
          - {w: "mojar", d: "to dip, soak, wet"}
          - {w: "mendrugo", d: "crust, scrap of stale bread, the kind given to beggars"}
        diagram:
          - s: "se llegó a uno de los solícitos cocineros"
            r: "main verb 1: he went up to one of the busy cooks"
            under:
              - {s: "y así", r: "linking: and so"}
              - {s: "sin poderlo sufrir", r: "why: unable to bear it"}
              - {s: "ni ser en su mano hacer otra cosa", r: "why, 2: nor being able to do anything else"}
          - s: "le rogó"
            r: "main verb 2 (after 'y'): he begged him"
            under:
              - {s: "con corteses y hambrientas razones", r: "how: with polite, hungry words"}
              - s: "le dejase mojar un mendrugo de pan"
                r: "what he begged: that he let him dip a crust of bread"
                under:
                  - {s: "en una de aquellas ollas", r: "where: in one of those pots"}
          - s: "A lo que el cocinero respondió:"
            r: "main verb 3: to which the cook answered"
        forms:
          - {w: "poderlo", f: "poder (to be able) + lo (it, his craving), the pronoun hung on the end of the infinitive after 'sin'; 'lo' belongs to 'sufrir' but hangs on 'poder'."}
          - {w: "ser", f: "ser (to be), infinitive after 'ni' continuing 'sin': 'nor its being'."}
          - {w: "se llegó", f: "lleg- + -ó → llegarse (to go up to), preterite, he, with 'se'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "corteses y hambrientas", f: "plural of cortés (courteous), one form for both genders, and hambrient- + -as → hambriento (hungry), feminine plural: both match 'razones'."}
          - {w: "rogó", f: "rog- + -ó → rogar (to beg), preterite, he. Same -ó preterite as 'llegó'."}
          - {w: "le dejase", f: "dej- + -ase → dejar (to let), imperfect subjunctive (-se form), he (the cook): 'that he should let him'. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. Cervantes leaves out 'que' after verbs of asking ('le rogó [que] le dejase'). The first 'le' is the cook (to him he begged), the second is Sancho (let him)."}
          - {w: "aquellas", f: "aquell- + -as → aquel (that, those over there), feminine plural to match 'ollas'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
  - sentences:
      - es: "— Hermano, este día no es de aquellos sobre quien tiene juridición la hambre, merced al rico Camacho."
        literal: "— Brother, this day not is of those over whom has jurisdiction the hunger, thanks to-the rich Camacho."
        ormsby: "“Brother, this is not a day on which hunger is to have any sway, thanks to the rich Camacho;"
        vocab:
          - {w: "hermano", d: "brother; a friendly address between equals, 'friend, mate'"}
          - {w: "sobre quien", d: "over which; old Spanish uses 'quien' for things too, and in the singular even after a plural ('aquellos')"}
          - {w: "juridición", d: "= jurisdicción, jurisdiction, power to rule (old spelling)"}
          - {w: "la hambre", d: "= el hambre, hunger: 'hambre' then commonly took 'la'; modern Spanish uses 'el' before a stressed a-"}
          - {w: "merced a", d: "thanks to (from 'merced', favour, grace)"}
        diagram:
          - s: "este día no es de aquellos"
            r: "main verb: this day is not one of those"
            under:
              - {s: "Hermano", r: "address: brother, friend"}
              - {s: "sobre quien tiene juridición la hambre", r: "describes 'aquellos': over which hunger has any power"}
              - {s: "merced al rico Camacho", r: "why: thanks to rich Camacho"}
        forms:
          - {w: "este", f: "est- + -e → este (this), masculine to match 'día' (día is masculine despite its -a)."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son. 'ser de' + group = to be one of."}
          - {w: "aquellos", f: "aquell- + -os → aquel (that), masculine plural standing for 'días': 'those (days)'."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, it (hunger). Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen. The subject 'la hambre' comes after."}
          - {w: "al", f: "a + el, the contraction modern Spanish still makes: 'to the'."}
          - {w: "rico Camacho", f: "'rico' (rich) before the name works as his epithet: 'Camacho the rich', as in the chapter title."}
      - es: "Apeaos y mirad si hay por ahí un cucharón, y espumad una gallina o dos, y buen provecho os hagan."
        literal: "Get-down-yourself and look if there-is around there a ladle, and skim a hen or two, and good profit to-you may-they-do."
        ormsby: "get down and look about for a ladle and skim off a hen or two, and much good may they do you.”"
        vocab:
          - {w: "apearse", d: "to get down, dismount (from a horse or ass)"}
          - {w: "por ahí", d: "around there, somewhere about"}
          - {w: "cucharón", d: "ladle, big spoon (from 'cuchara', spoon, + augmentative -ón)"}
          - {w: "espumar", d: "to skim (the froth or fat off a pot); here jokingly 'to fish out'"}
          - {w: "buen provecho os hagan", d: "much good may they do you; 'buen provecho' is still said to someone eating"}
        diagram:
          - s: "Apeaos"
            r: "command 1: get down"
          - s: "y mirad"
            r: "command 2: and look"
            under:
              - {s: "si hay por ahí un cucharón", r: "what to look for: whether there is a ladle around"}
          - s: "y espumad una gallina o dos"
            r: "command 3: and skim off a hen or two"
          - s: "y buen provecho os hagan"
            r: "wish: and may they do you good"
        forms:
          - {w: "Apeaos", f: "apead + os → apearse (to get down), imperative, you (vos, one person addressed politely-familiarly): 'get down'. The vos/vosotros imperative swaps the final -r of the infinitive for -d (apead, mirad, comed); when 'os' (yourself) is hung on, the -d drops: apead + os → apeaos."}
          - {w: "mirad, espumad", f: "mirad → mirar (to look) and espumad → espumar (to skim): imperative, you (vos). The vos/vosotros imperative swaps the -r of the infinitive for -d: mirar → mirad, espumar → espumad."}
          - {w: "hay", f: "hay, 'there is', the impersonal present of haber (to have); it never takes a plural."}
          - {w: "os hagan", f: "hag- + -an → hacer (to do, make), present subjunctive, they (the hens), giving a wish: 'may they do you'. Irregular: haga, hagas, haga, hagamos, hagáis, hagan. 'os' = to you, the object pronoun of vos/vosotros."}
        note: "The cook speaks to Sancho as 'vos', the familiar form used between equals or to inferiors, and his whole offer is a burlesque of hospitality: one 'skims' a hen as one skims fat off a stew."
  - sentences:
      - es: "— No veo ninguno —respondió Sancho."
        literal: "— Not I-see none —answered Sancho."
        ormsby: "“I don’t see one,” said Sancho."
        vocab:
          - {w: "ninguno", d: "none, not one; here 'no ladle'"}
        diagram:
          - s: "No veo ninguno"
            r: "what he said: I don't see one"
          - s: "respondió Sancho"
            r: "main verb: answered Sancho"
        forms:
          - {w: "veo", f: "ve- + -o → ver (to see), present, I. ver in the present: veo, ves, ve, vemos, veis, ven."}
          - {w: "No veo ninguno", f: "Spanish keeps both negatives: 'no veo ninguno' = I don't see none, i.e. I don't see any. 'ninguno' stays whole because no noun follows (before a noun it clips to 'ningún')."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
  - sentences:
      - es: "— Esperad —dijo el cocinero—. ¡Pecador de mí, y qué melindroso y para poco debéis de ser!"
        literal: "— Wait —said the cook—. Sinner of me, and how finicky and for little you-must be!"
        ormsby: "“Wait a bit,” said the cook; “sinner that I am! how particular and bashful you are!”"
        vocab:
          - {w: "¡Pecador de mí!", d: "'sinner that I am!', a mild exclamation of surprise or exasperation"}
          - {w: "melindroso", d: "finicky, fussy, over-delicate"}
          - {w: "para poco", d: "good for little, feeble, spineless (of a person)"}
          - {w: "deber de", d: "must (probability): 'debéis de ser' = you must be"}
        diagram:
          - s: "Esperad"
            r: "what he said, 1: wait"
          - s: "dijo el cocinero"
            r: "main verb: said the cook"
          - s: "¡Pecador de mí"
            r: "exclamation: sinner that I am"
          - s: "y qué melindroso y para poco debéis de ser!"
            r: "exclamation, 2: how fussy and feeble you must be"
        forms:
          - {w: "Esperad", f: "esper- + -ad → esperar (to wait), imperative, you (vos): 'wait!'. The vos/vosotros imperative swaps the final -r of the infinitive for -d: esperad, comed, vivid."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "debéis", f: "deb- + -éis → deber (must), present, you (vos, here one person): 'you must be'. The present of -er verbs: -o, -es, -e, -emos, -éis, -en. 'deber de' + infinitive expresses a guess."}
          - {w: "qué melindroso", f: "qué (how) + adjective in an exclamation: 'how fussy!'; melindros- + -o, masculine singular to match Sancho."}
  - sentences:
      - es: "Y, diciendo esto, asió de un caldero, y, encajándole en una de las medias tinajas, sacó en él tres gallinas y dos gansos, y dijo a Sancho:"
        literal: "And, saying this, he-seized of a bucket, and, fitting-it into one of the half wine-jars, he-took-out in it three hens and two geese, and said to Sancho:"
        ormsby: "and so saying, he seized a bucket and plunging it into one of the half jars took up three hens and a couple of geese, and said to Sancho,"
        vocab:
          - {w: "asir de", d: "to seize, grab hold of"}
          - {w: "caldero", d: "bucket-shaped pot, pail (smaller than a 'caldera')"}
          - {w: "encajar", d: "to fit in, jam in, plunge in"}
          - {w: "media tinaja", d: "half wine-jar: a great earthenware jar cut down to serve as a stewpot"}
          - {w: "ganso", d: "goose"}
        diagram:
          - s: "asió de un caldero"
            r: "main verb 1: he seized a bucket"
            under:
              - {s: "diciendo esto", r: "when: as he said this"}
          - s: "sacó en él tres gallinas y dos gansos"
            r: "main verb 2: he took out in it three hens and two geese"
            under:
              - {s: "encajándole en una de las medias tinajas", r: "how: plunging it into one of the half-jars"}
          - s: "y dijo a Sancho:"
            r: "main verb 3: and said to Sancho"
        forms:
          - {w: "diciendo", f: "gerund of decir (to say): 'saying'; the e of the stem turns to i in the gerund."}
          - {w: "asió", f: "as- + -ió → asir (to seize), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "encajándole", f: "gerund of encajar (to fit, plunge) + le (it, the bucket), accent added to keep the stress on -cá-. 'le' for a thing (the masculine 'caldero') where modern Spanish uses 'lo' is leísmo, common in Cervantes."}
          - {w: "medias", f: "medi- + -as → medio (half), feminine plural to match 'tinajas'."}
          - {w: "sacó", f: "sac- + -ó → sacar (to take out), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "él", f: "'it', masculine because it stands for 'el caldero'; 'en él' = in it."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Comed, amigo, y desayunaos con esta espuma, en tanto que se llega la hora del yantar."
        literal: "— Eat, friend, and breakfast-yourself with this skimming, while that itself arrives the hour of-the dinner."
        ormsby: "“Fall to, friend, and take the edge off your appetite with these skimmings until dinnertime comes.”"
        vocab:
          - {w: "desayunarse", d: "to break one's fast, have a first bite"}
          - {w: "espuma", d: "froth, skimmings; here what has been fished out of the pot"}
          - {w: "en tanto que", d: "while, until"}
          - {w: "llegarse", d: "to draw near, come"}
          - {w: "yantar", d: "midday meal, dinner (old and rustic word; also a verb 'to eat')"}
        diagram:
          - s: "Comed"
            r: "command 1: eat"
            under:
              - {s: "amigo", r: "address: friend"}
          - s: "y desayunaos con esta espuma"
            r: "command 2: and break your fast on these skimmings"
            under:
              - {s: "en tanto que se llega la hora del yantar", r: "when: until dinner time comes"}
        forms:
          - {w: "Comed", f: "com- + -ed → comer (to eat), imperative, you (vos): 'eat!'. The vos/vosotros imperative swaps the final -r of the infinitive for -d: comer → comed."}
          - {w: "desayunaos", f: "desayunad + os → desayunarse (to break one's fast), imperative, you (vos). The vos/vosotros imperative swaps the -r for -d (desayunad); when 'os' (yourself) is hung on, the -d drops: desayunaos."}
          - {w: "esta", f: "est- + -a → este (this), feminine to match 'espuma'."}
          - {w: "se llega", f: "lleg- + -a → llegarse (to draw near), present, it (the hour), with 'se'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. Indicative here after 'en tanto que'; modern Spanish would use the subjunctive 'llegue'."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
  - sentences:
      - es: "— No tengo en qué echarla —respondió Sancho."
        literal: "— Not I-have in what to-put-it —answered Sancho."
        ormsby: "“I have nothing to put them in,” said Sancho."
        vocab:
          - {w: "no tener en qué", d: "to have nothing in which (to do something)"}
          - {w: "echar", d: "to put, pour, throw"}
        diagram:
          - s: "No tengo en qué echarla"
            r: "what he said: I have nothing to put it in"
          - s: "respondió Sancho"
            r: "main verb: answered Sancho"
        forms:
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "echarla", f: "echar (to put) + la (it, the 'espuma', feminine), the pronoun hung on the infinitive after 'en qué'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
  - sentences:
      - es: "— Pues llevaos —dijo el cocinero— la cuchara y todo, que la riqueza y el contento de Camacho todo lo suple."
        literal: "— Then take-yourself —said the cook— the spoon and all, for the wealth and the contentment of Camacho all it supplies."
        ormsby: "“Well then,” said the cook, “take spoon and all; for Camacho’s wealth and happiness furnish everything.”"
        vocab:
          - {w: "llevarse", d: "to take away, carry off"}
          - {w: "cuchara", d: "spoon; here the bucket used as a ladle"}
          - {w: "y todo", d: "and all, as well"}
          - {w: "contento", d: "happiness, contentment (a noun here)"}
          - {w: "suplir", d: "to make up for, supply, provide"}
        diagram:
          - s: "Pues llevaos"
            r: "command: well then, take"
            under:
              - {s: "la cuchara y todo", r: "object: the spoon and all"}
              - {s: "que la riqueza y el contento de Camacho todo lo suple", r: "why: for Camacho's wealth and happiness supply everything"}
          - s: "dijo el cocinero"
            r: "main verb: said the cook"
        forms:
          - {w: "llevaos", f: "llevad + os → llevarse (to take away), imperative, you (vos). The vos/vosotros imperative swaps the final -r of the infinitive for -d (llevad); when 'os' (yourself) is hung on, the -d drops: llevaos."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "todo lo suple", f: "supl- + -e → suplir (to supply), present, it. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en. Singular although there are two subjects ('riqueza y contento'), taken as one idea. 'todo' is put first and repeated as 'lo' (it) before the verb."}
        note: "The 'cuchara' is the bucket the cook has just used as a ladle, so Sancho walks off with a whole pail of chicken and goose."
  - sentences:
      - es: "En tanto, pues, que esto pasaba Sancho, estaba don Quijote mirando cómo, por una parte de la enramada, entraban hasta doce labradores sobre doce hermosísimas yeguas, con ricos y vistosos jaeces de campo y con muchos cascabeles en los petrales, y todos vestidos de regocijo y fiestas;"
        literal: "While, then, that this was-going-through Sancho, was Don Quijote watching how, by one part of the bower, were-entering up-to twelve farmers on twelve very-beautiful mares, with rich and showy trappings of field and with many little-bells on the breast-straps, and all dressed of rejoicing and feasts;"
        ormsby: "While Sancho fared thus, Don Quixote was watching the entrance, at one end of the arcade, of some twelve peasants, all in holiday and gala dress, mounted on twelve beautiful mares with rich handsome field trappings and a number of little bells attached to their petrals,"
        vocab:
          - {w: "en tanto que", d: "while"}
          - {w: "pasar", d: "here 'to go through, experience'"}
          - {w: "enramada", d: "bower, arbour: a shelter roofed with branches, put up over the meadow for the wedding"}
          - {w: "hasta", d: "before a number: 'as many as, about'"}
          - {w: "labrador", d: "farmer, peasant who works his own land (not 'labourer' in the English sense)"}
          - {w: "yegua", d: "mare"}
          - {w: "vistoso", d: "showy, eye-catching"}
          - {w: "jaeces de campo", d: "field trappings: ornamental harness for riding out (jaez = horse-trapping)"}
          - {w: "cascabel", d: "little round bell, jingle-bell"}
          - {w: "petral", d: "breast-strap (peytral) of a horse's harness"}
          - {w: "vestidos de regocijo y fiestas", d: "dressed in their holiday best, in festive clothes"}
        diagram:
          - s: "estaba don Quijote mirando"
            r: "main verb: Don Quijote was watching"
            under:
              - {s: "En tanto, pues, que esto pasaba Sancho", r: "when: while Sancho was going through this"}
              - s: "cómo, por una parte de la enramada, entraban hasta doce labradores"
                r: "what he watched: how about twelve farmers came in at one side of the bower"
                under:
                  - {s: "sobre doce hermosísimas yeguas", r: "how: riding twelve very handsome mares"}
                  - {s: "con ricos y vistosos jaeces de campo", r: "describes 'yeguas': with rich, showy trappings"}
                  - {s: "y con muchos cascabeles en los petrales", r: "describes 'yeguas', 2: and many bells on the breast-straps"}
                  - {s: "y todos vestidos de regocijo y fiestas", r: "describes 'labradores': all in festive dress"}
        forms:
          - {w: "pasaba", f: "pas- + -aba → pasar (to go through), imperfect, he (Sancho). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. The subject 'Sancho' comes after the verb."}
          - {w: "estaba ... mirando", f: "est- + -aba → estar (to be), imperfect, he: estaba, estabas, estaba, estábamos, estabais, estaban; + mirando, gerund of mirar (to watch): 'was watching', the continuous past."}
          - {w: "entraban", f: "entr- + -aban → entrar (to come in), imperfect, they (the farmers). Same -aba imperfect as 'pasaba'."}
          - {w: "hermosísimas", f: "hermos- + -ísimas → hermoso (beautiful) with the superlative suffix -ísimo, feminine plural to match 'yeguas': 'very beautiful'."}
          - {w: "ricos y vistosos", f: "ric- + -os → rico (rich) and vistos- + -os → vistoso (showy), masculine plural to match 'jaeces'."}
          - {w: "jaeces", f: "plural of jaez (trapping): z becomes c before -es."}
          - {w: "vestidos", f: "vest- + -idos → vestir (to dress), participle, masculine plural to match 'todos' (the farmers)."}
      - es: "los cuales, en concertado tropel, corrieron no una, sino muchas carreras por el prado, con regocijada algazara y grita, diciendo:"
        literal: "the which, in ordered throng, ran not one, but many courses over the meadow, with joyful hubbub and shouting, saying:"
        ormsby: "who, marshalled in regular order, ran not one but several courses over the meadow, with jubilant shouts and cries of"
        vocab:
          - {w: "los cuales", d: "who, which; here 'and they' (the farmers)"}
          - {w: "concertado", d: "orderly, well-arranged"}
          - {w: "tropel", d: "throng, troop moving fast together"}
          - {w: "correr carreras", d: "to run courses, gallop in a horseback display (a festival custom)"}
          - {w: "prado", d: "meadow"}
          - {w: "algazara", d: "din, hubbub, joyful shouting (from Arabic: originally a battle-cry)"}
          - {w: "grita", d: "shouting, outcry (old word, now 'griterío')"}
        diagram:
          - s: "corrieron"
            r: "main verb: ran"
            under:
              - {s: "los cuales", r: "subject: the farmers"}
              - {s: "en concertado tropel", r: "how: in an orderly troop"}
              - {s: "no una, sino muchas carreras", r: "object: not one but many courses"}
              - {s: "por el prado", r: "where: over the meadow"}
              - {s: "con regocijada algazara y grita", r: "how: with joyful din and shouting"}
              - {s: "diciendo:", r: "how: saying"}
        forms:
          - {w: "los cuales", f: "'which, who', masculine plural to match 'labradores'; after a semicolon it means 'and they'."}
          - {w: "concertado", f: "concert- + -ado → concertar (to arrange), participle used as an adjective, masculine to match 'tropel'."}
          - {w: "corrieron", f: "corr- + -ieron → correr (to run), preterite, they. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "regocijada", f: "regocij- + -ada → regocijar (to gladden), participle used as an adjective, feminine to match 'algazara'."}
          - {w: "diciendo", f: "gerund of decir (to say): 'saying'; the e of the stem turns to i in the gerund."}
  - sentences:
      - es: "— ¡Vivan Camacho y Quiteria: él tan rico como ella hermosa, y ella la más hermosa del mundo!"
        literal: "— Long-live Camacho and Quiteria: he as rich as she beautiful, and she the most beautiful of-the world!"
        ormsby: "“Long live Camacho and Quiteria! he as rich as she is fair; and she the fairest on earth!”"
        vocab:
          - {w: "¡Viva ...!", d: "long live ...!, hurrah for ...!"}
          - {w: "tan ... como", d: "as ... as"}
        diagram:
          - s: "¡Vivan Camacho y Quiteria"
            r: "main verb: long live Camacho and Quiteria"
          - s: "él tan rico como ella hermosa"
            r: "added praise 1: he as rich as she is beautiful"
          - s: "y ella la más hermosa del mundo!"
            r: "added praise 2: and she the most beautiful in the world"
        forms:
          - {w: "Vivan", f: "viv- + -an → vivir (to live), present subjunctive, they, giving a wish: 'may they live!'. The present subjunctive of -er and -ir verbs: -a, -as, -a, -amos, -áis, -an. Plural because there are two names."}
          - {w: "rico, hermosa", f: "ric- + -o → rico (rich), masculine for Camacho; hermos- + -a → hermoso (beautiful), feminine for Quiteria. The verb 'es' (is) is left out in both halves."}
          - {w: "la más hermosa del mundo", f: "la + más + adjective = the superlative 'the most beautiful'; 'del mundo' (of the world) where English says 'in the world'. del = de + el."}
  - sentences:
      - es: "Oyendo lo cual don Quijote, dijo entre sí:"
        literal: "Hearing that which Don Quijote, he-said between himself:"
        ormsby: "Hearing this, Don Quixote said to himself,"
        vocab:
          - {w: "lo cual", d: "which; here 'this'"}
          - {w: "entre sí", d: "to himself, under his breath (literally 'between himself')"}
        diagram:
          - s: "dijo entre sí:"
            r: "main verb: he said to himself"
            under:
              - {s: "Oyendo lo cual", r: "when: hearing which"}
              - {s: "don Quijote", r: "subject: also the one hearing"}
        forms:
          - {w: "Oyendo", f: "gerund of oír (to hear): 'hearing'; the i of the stem becomes y between vowels (o-y-endo)."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "sí", f: "'himself', the reflexive pronoun after a preposition, with an accent to distinguish it from 'si' (if)."}
  - sentences:
      - es: "— Bien parece que éstos no han visto a mi Dulcinea del Toboso, que si la hubieran visto, ellos se fueran a la mano en las alabanzas desta su Quiteria."
        literal: "— Well it-seems that these not have seen [to] my Dulcinea del Toboso, for if her they-had seen, they themselves would-have-gone to the hand in the praises of-this their Quiteria."
        ormsby: "“It is easy to see these folk have never seen my Dulcinea del Toboso; for if they had they would be more moderate in their praises of this Quiteria of theirs.”"
        vocab:
          - {w: "bien parece que", d: "it is plain that, clearly"}
          - {w: "irse a la mano", d: "to restrain oneself, hold back, be more moderate"}
          - {w: "alabanza", d: "praise"}
          - {w: "desta", d: "= de esta, of this (old contraction)"}
          - {w: "esta su Quiteria", d: "this Quiteria of theirs; the demonstrative plus possessive is slightly scornful"}
        diagram:
          - s: "Bien parece"
            r: "main verb: it is plain"
            under:
              - s: "que éstos no han visto a mi Dulcinea del Toboso"
                r: "what is plain: that these people have not seen my Dulcinea"
                under:
                  - s: "que ... ellos se fueran a la mano"
                    r: "why: for they would have held back"
                    under:
                      - {s: "si la hubieran visto", r: "condition: if they had seen her"}
                      - {s: "en las alabanzas desta su Quiteria", r: "in what: in praising this Quiteria of theirs"}
        forms:
          - {w: "parece", f: "parec- + -e → parecer (to seem), present, it. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (parezco in the 'I' form)."}
          - {w: "éstos", f: "est- + -os → este (this), masculine plural used as a pronoun, 'these men', written with an accent in the old spelling."}
          - {w: "han visto", f: "han → haber (to have), present, they: he, has, ha, hemos, habéis, han; + visto, the irregular participle of ver (to see): the perfect, 'have seen'. 'a' before 'mi Dulcinea' is the personal 'a' before a person as object."}
          - {w: "la hubieran visto", f: "hub- + -ieran → haber (to have), imperfect subjunctive (-ra form), they: hubiera, hubieras, hubiera, hubiéramos, hubierais, hubieran; + visto (seen): the pluperfect subjunctive, 'if they had seen'. 'la' = her (Dulcinea)."}
          - {w: "se fueran", f: "fu- + -eran → irse (to go), imperfect subjunctive (-ra form), they, used as a conditional: 'they would have gone'. ir (to go) in the -ra form: fuera, fueras, fuera, fuéramos, fuerais, fueran. Cervantes often uses the -ra form where modern Spanish says 'se habrían ido'."}
          - {w: "desta", f: "de + esta (this), run together; feminine to match 'Quiteria'; modern 'de esta'."}
          - {w: "su", f: "'their', the owners being 'ellos'; it agrees with 'Quiteria' (singular), not with the owners."}
        note: "Every beauty Don Quijote hears praised is measured against Dulcinea, whom he has never actually seen as he imagines her; in Chapter X Sancho passed off a peasant girl as her, enchanted."
  - sentences:
      - es: "De allí a poco comenzaron a entrar por diversas partes de la enramada muchas y diferentes danzas, entre las cuales venía una de espadas, de hasta veinte y cuatro zagales de gallardo parecer y brío, todos vestidos de delgado y blanquísimo lienzo, con sus paños de tocar, labrados de varias colores de fina seda;"
        literal: "From there to little began to enter by diverse parts of the bower many and different dances, among the which came one of swords, of up-to twenty and four lads of gallant appearance and spirit, all dressed of fine and very-white linen, with their cloths of head-dress, worked of various colours of fine silk;"
        ormsby: "Shortly after this, several bands of dancers of various sorts began to enter the arcade at different points, and among them one of sword-dancers composed of some four-and-twenty lads of gallant and high-spirited mien, clad in the finest and whitest of linen, and with handkerchiefs embroidered in various colours with fine silk;"
        vocab:
          - {w: "de allí a poco", d: "shortly afterwards"}
          - {w: "danza", d: "a dance, and also a troupe of dancers performing one"}
          - {w: "danza de espadas", d: "sword-dance, in which the dancers clashed and passed swords in figures"}
          - {w: "hasta", d: "before a number: 'as many as, some'"}
          - {w: "zagal", d: "lad, country youth; also a young shepherd"}
          - {w: "gallardo", d: "gallant, fine-looking, dashing"}
          - {w: "parecer", d: "a noun here: appearance, looks"}
          - {w: "brío", d: "spirit, vigour"}
          - {w: "delgado", d: "of cloth: fine, thin"}
          - {w: "lienzo", d: "linen cloth"}
          - {w: "paño de tocar", d: "kerchief worn on the head (from 'toca', head-dress)"}
          - {w: "labrado", d: "embroidered, worked (of cloth)"}
          - {w: "varias colores", d: "various colours: 'color' was often feminine in Cervantes' time"}
        diagram:
          - s: "comenzaron a entrar"
            r: "main verb: began to come in"
            under:
              - {s: "De allí a poco", r: "when: shortly afterwards"}
              - {s: "por diversas partes de la enramada", r: "where: at various points of the bower"}
              - s: "muchas y diferentes danzas"
                r: "subject: many different dance troupes"
                under:
                  - s: "entre las cuales venía una de espadas"
                    r: "describes 'danzas': among which came a sword-dance"
                    under:
                      - s: "de hasta veinte y cuatro zagales de gallardo parecer y brío"
                        r: "describes 'una': made up of some twenty-four handsome, spirited lads"
                        under:
                          - {s: "todos vestidos de delgado y blanquísimo lienzo", r: "describes 'zagales': all in fine, very white linen"}
                          - {s: "con sus paños de tocar, labrados de varias colores de fina seda", r: "describes 'zagales', 2: with headscarves embroidered in coloured silk"}
        forms:
          - {w: "comenzaron", f: "comenz- + -aron → comenzar (to begin), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. 'comenzar a' + infinitive = to begin to. The subject 'danzas' comes after."}
          - {w: "entre las cuales", f: "'among which', las cuales feminine plural to match 'danzas'."}
          - {w: "venía", f: "ven- + -ía → venir (to come), imperfect, it (the sword-dance). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "veinte y cuatro", f: "old way of writing veinticuatro (twenty-four), as three words."}
          - {w: "vestidos", f: "vest- + -idos → vestir (to dress), participle, masculine plural to match 'todos' (the lads)."}
          - {w: "blanquísimo", f: "blanc- + -ísimo → blanco (white) with the superlative suffix, masculine to match 'lienzo'; c becomes qu before i."}
          - {w: "labrados", f: "labr- + -ados → labrar (to work, embroider), participle, masculine plural to match 'paños'."}
          - {w: "varias colores", f: "vari- + -as → vario (various), feminine plural because 'color' is treated as feminine, as often in the period; modern 'varios colores'."}
      - es: "y al que los guiaba, que era un ligero mancebo, preguntó uno de los de las yeguas si se había herido alguno de los danzantes."
        literal: "and to-the-one who them was-leading, who was a nimble youth, asked one of those of the mares if himself had wounded any of the dancers."
        ormsby: "and one of those on the mares asked an active youth who led them if any of the dancers had been wounded."
        vocab:
          - {w: "guiar", d: "to lead, guide"}
          - {w: "ligero", d: "nimble, light-footed, agile"}
          - {w: "mancebo", d: "youth, young man"}
          - {w: "los de las yeguas", d: "those on the mares, the mounted farmers"}
          - {w: "danzante", d: "dancer (in a troupe)"}
        diagram:
          - s: "preguntó"
            r: "main verb: asked"
            under:
              - s: "al que los guiaba"
                r: "whom: the one leading them"
                under:
                  - {s: "que era un ligero mancebo", r: "describes 'el que': who was a nimble youth"}
              - {s: "uno de los de las yeguas", r: "subject: one of the riders on the mares"}
              - {s: "si se había herido alguno de los danzantes", r: "what he asked: whether any of the dancers had been hurt"}
        forms:
          - {w: "al que", f: "a + el que, 'to the one who': a + el contracts to 'al'."}
          - {w: "guiaba", f: "gui- + -aba → guiar (to lead), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "era", f: "ser (to be), imperfect, he. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "preguntó", f: "pregunt- + -ó → preguntar (to ask), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. The subject 'uno de los de las yeguas' comes after."}
          - {w: "se había herido", f: "había → haber (to have), imperfect, he: había, habías, había, habíamos, habíais, habían; + herido, participle of herir (to wound): the pluperfect, with 'se': 'had been hurt, had hurt himself'."}
          - {w: "alguno", f: "alguno (any, some) kept whole because no noun follows it directly ('alguno de los danzantes'); before a masculine noun it clips to 'algún'."}
  - sentences:
      - es: "— Por ahora, bendito sea Dios, no se ha herido nadie: todos vamos sanos."
        literal: "— For now, blessed be God, not himself has wounded nobody: all we-go healthy."
        ormsby: "“As yet, thank God, no one has been wounded,” said he, “we are all safe and sound;”"
        ormsby_note: "The sword-dance was exceedingly dangerous, so much so that it was prohibited in course of time."
        vocab:
          - {w: "por ahora", d: "so far, for now"}
          - {w: "bendito sea Dios", d: "God be praised, thank God"}
          - {w: "ir sano", d: "to be unhurt, safe and sound ('ir' used for 'to be' in a state)"}
        diagram:
          - s: "no se ha herido nadie"
            r: "main verb 1: no one has been hurt"
            under:
              - {s: "Por ahora", r: "when: so far"}
              - {s: "bendito sea Dios", r: "aside: God be praised"}
          - s: "todos vamos sanos"
            r: "main verb 2: we are all unhurt"
        forms:
          - {w: "bendito sea", f: "bendito, old participle of bendecir (to bless), masculine to match 'Dios'; + sea → ser (to be), present subjunctive, it, giving a wish: 'blessed be'. ser in the present subjunctive: sea, seas, sea, seamos, seáis, sean."}
