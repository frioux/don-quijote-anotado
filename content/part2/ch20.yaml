        vocab:
          - {w: "componer", d: "to compose, write (verses, a show)"}
          - {w: "ordenar", d: "to arrange, devise, stage (not 'to order')"}
        diagram:
          - s: "Preguntó"
            r: "main verb: asked"
            under:
              - {s: "don Quijote", r: "subject: Don Quijote"}
              - {s: "a una de las ninfas", r: "whom: one of the nymphs"}
              - {s: "que quién la había compuesto y ordenado", r: "what he asked: who had written and arranged it (the dance)"}
        forms:
          - {w: "Preguntó", f: "pregunt- + -ó → preguntar (to ask), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. The verb comes before its subject."}
          - {w: "que quién", f: "'que' introduces the reported question and 'quién' (who, with an accent because it asks) follows it; old Spanish often keeps this 'que' before an indirect question where modern Spanish drops it."}
