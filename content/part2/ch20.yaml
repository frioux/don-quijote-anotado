      - es: "Así que vuelvo a decir que a Camacho me atengo, de cuyas ollas son abundantes espumas gansos y gallinas, liebres y conejos; y de las de Basilio serán, si viene a mano, y aunque no venga sino al pie, aguachirle."
        literal: "So that I-return to say that to Camacho myself I-hold, of whose pots are abundant skimmings geese and hens, hares and rabbits; and of those of Basilio will-be, if it-comes to hand, and even-if not it-comes but to-the foot, slop-wine."
        ormsby: "So once more I say I stick to Camacho, the bountiful skimmings of whose pots are geese and hens, hares and rabbits; but of Basilio’s, if any ever come to hand, or even to foot, they’ll be only rinsings.”"
        ormsby_note: "Properly, a vile kind of wine made from the refuse and washings of the winepress."
