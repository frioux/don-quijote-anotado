  - sentences:
      - es: "— No más, Sancho —dijo a este punto don Quijote—. Tente en buenas, y no te dejes caer; que en verdad que lo que has dicho de la muerte por tus rústicos términos es lo que pudiera decir un buen predicador."
        literal: "— No more, Sancho —said at this point Don Quijote—. Hold-yourself in good [ones], and not yourself let fall; for in truth that what you-have said of the death in your rustic terms is what could say a good preacher."
