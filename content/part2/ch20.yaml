  - sentences:
      - es: "— Ni las has menester —dijo don Quijote—; pero yo no acabo de entender ni alcanzar cómo, siendo el principio de la sabiduría el temor de Dios, tú, que temes más a un lagarto que a Él, sabes tanto."
        literal: "— Nor them you-have need —said Don Quijote—; but I not finish of understanding nor reaching how, being the beginning of the wisdom the fear of God, you, who fear more [to] a lizard than [to] Him, know so-much."
        ormsby: "“Nor needst thou,” said Don Quixote, “but I cannot conceive or make out how it is that, the fear of God being the beginning of wisdom, thou, who art more afraid of a lizard than of him, knowest so much.”"
        vocab:
          - {w: "haber menester", d: "to need, have need of (old phrase; 'menester' = need)"}
          - {w: "no acabar de", d: "+ infinitive: not quite manage to, still not (understand)"}
          - {w: "alcanzar", d: "to grasp, make out (here); literally 'to reach'"}
          - {w: "el principio de la sabiduría el temor de Dios", d: "'the fear of the Lord is the beginning of wisdom' (Psalm 111:10 and Proverbs 9:10)"}
          - {w: "lagarto", d: "lizard"}
        diagram:
          - s: "Ni las has menester"
            r: "main verb 1: nor do you need them"
            under:
              - {s: "dijo don Quijote", r: "speech tag: said Don Quijote"}
          - s: "pero yo no acabo de entender ni alcanzar"
            r: "main verb 2: but I can't quite understand or grasp"
            under:
              - s: "cómo"
                r: "what I can't grasp: how"
                under:
                  - {s: "siendo el principio de la sabiduría el temor de Dios", r: "given that: the fear of God being the beginning of wisdom"}
                  - s: "tú"
                    r: "subject of 'sabes': you"
                    under:
                      - {s: "que temes más a un lagarto que a Él", r: "describes 'tú': who fear a lizard more than Him"}
                  - {s: "sabes tanto", r: "verb of 'cómo': know so much"}
        forms:
          - {w: "las", f: "'them', feminine plural standing for 'tologías'."}
          - {w: "has", f: "has → haber (to have), present, you: he, has, ha, hemos, habéis, han; 'haber menester' = to need."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "acabo", f: "acab- + -o → acabar (to finish), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. 'no acabar de' + infinitive = still not to manage to."}
          - {w: "siendo", f: "gerund of ser (to be): 'being', here 'since ... is'. The subject 'el temor de Dios' comes after."}
          - {w: "temes", f: "tem- + -es → temer (to fear), present, you. The present of -er verbs: -o, -es, -e, -emos, -éis, -en. 'a' marks the feared beings, 'a un lagarto', 'a Él'."}
          - {w: "sabes", f: "sab- + -es → saber (to know), present, you. Irregular: sé, sabes, sabe, sabemos, sabéis, saben."}
        note: "A joke on Sancho's cowardice: if fear of God is the beginning of wisdom, a man who fears lizards more than God should know nothing."
