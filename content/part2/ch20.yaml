  - sentences:
      - es: "Comenzaba la danza Cupido, y, habiendo hecho dos mudanzas, alzaba los ojos y flechaba el arco contra una doncella que se ponía entre las almenas del castillo, a la cual desta suerte dijo:"
        literal: "Was-beginning the dance Cupid, and, having made two figures, he-was-raising the eyes and was-arrowing the bow against a maiden that herself was-placing between the battlements of-the castle, to the which of-this manner he-said:"
        ormsby: "and the dance having been opened, Cupid, after executing two figures, raised his eyes and bent his bow against a damsel who stood between the turrets of the castle, and thus addressed her:"
        vocab:
          - {w: "mudanza", d: "figure, set of steps in a dance (a false friend: not 'moving house')"}
          - {w: "flechar el arco", d: "to fit an arrow to the bow and draw it, take aim"}
          - {w: "doncella", d: "maiden, young unmarried woman"}
          - {w: "ponerse", d: "here 'to stand, take up a place'"}
          - {w: "almena", d: "merlon, one of the raised blocks of a battlement; 'entre las almenas' = in the battlements"}
          - {w: "desta suerte", d: "in this way, thus; 'desta' = de esta (old contraction)"}
        diagram:
          - s: "Comenzaba la danza Cupido"
            r: "main verb 1: Cupid began the dance"
          - s: "alzaba los ojos"
            r: "main verb 2 (after 'y'): he raised his eyes"
            under:
              - {s: "habiendo hecho dos mudanzas", r: "when: after doing two figures"}
          - s: "y flechaba el arco"
            r: "main verb 3: and drew his bow"
            under:
              - s: "contra una doncella"
                r: "at whom: at a maiden"
                under:
                  - {s: "que se ponía entre las almenas del castillo", r: "describes 'doncella': who stood in the battlements of the castle"}
                  - s: "a la cual"
                    r: "to whom: to the maiden"
                    under:
                      - {s: "desta suerte dijo:", r: "he spoke thus"}
        forms:
          - {w: "Comenzaba", f: "comenz- + -aba → comenzar (to begin), imperfect, he (Cupid). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. The subject 'Cupido' comes after the object. The imperfect here pictures the scene as it unfolds."}
          - {w: "habiendo hecho", f: "habiendo, gerund of haber (to have), + hecho, irregular participle of hacer (to do): the perfect gerund, 'having done'."}
          - {w: "alzaba, flechaba", f: "alz- + -aba → alzar (to raise) and flech- + -aba → flechar (to aim with an arrow), imperfect, he. Same -aba imperfect for both: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "se ponía", f: "pon- + -ía → poner (to put) with 'se': ponerse (to place oneself, stand), imperfect, she. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "a la cual", f: "'to whom', feminine to match 'doncella'; a heavier relative than 'que', used after a comma."}
          - {w: "desta", f: "de + esta (this), run together; modern 'de esta', feminine to match 'suerte'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "-Yo soy el dios poderoso en el aire y en la tierra y en el ancho mar undoso, y en cuanto el abismo encierra en su báratro espantoso."
        literal: "-I am the god powerful in the air and on the earth and in the wide sea wavy, and in all-that the abyss encloses in its pit frightful."
        ormsby: "I am the mighty God whose sway / Is potent over land and sea. / The heavens above us own me; nay, / The shades below acknowledge me."
        vocab:
          - {w: "poderoso", d: "mighty, powerful"}
          - {w: "undoso", d: "wavy, billowing (poetic, from 'onda', wave)"}
          - {w: "cuanto", d: "all that, whatever ('en cuanto ... encierra' = in all that it holds)"}
          - {w: "abismo", d: "the abyss, the underworld"}
          - {w: "báratro", d: "the pit of hell, the underworld (a learned word from Latin 'barathrum')"}
          - {w: "espantoso", d: "frightful, dreadful"}
        diagram:
          - s: "Yo soy el dios poderoso"
            r: "main verb: I am the mighty god"
            under:
              - {s: "en el aire y en la tierra", r: "where 1 and 2: in the air and on land"}
              - {s: "y en el ancho mar undoso", r: "where 3: and in the wide, billowing sea"}
              - s: "y en cuanto el abismo encierra"
                r: "where 4: and in all that the abyss holds"
                under:
                  - {s: "en su báratro espantoso", r: "where the abyss holds it: in its dreadful pit"}
        forms:
          - {w: "soy", f: "ser (to be), present, I. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "poderoso", f: "poder (power) + -oso, the suffix that makes adjectives 'full of': 'mighty'; masculine to match 'dios'. Likewise 'undoso' (onda, wave, + -oso) and 'espantoso' (espanto, fright, + -oso)."}
          - {w: "encierra", f: "encierr- + -a → encerrar (to enclose, hold), present, it (the abyss). The stem e becomes ie when stressed: encierro, encierras, encierra, encerramos, encerráis, encierran."}
        note: "Cupid's speech is ten eight-syllable lines rhyming in two groups of five, a 'copla', as the next paragraph calls it; Gutenberg prints the verses as prose. Love claims power over air, earth, sea and the underworld, the old boast of 'Amor omnia vincit', love conquers all."
      - es: "Nunca conocí qué es miedo; todo cuanto quiero puedo, aunque quiera lo imposible, y en todo lo que es posible mando, quito, pongo y vedo."
        literal: "Never I-knew what is fear; all as-much-as I-want I-can, although I-may-want the impossible, and in all that which is possible I-command, I-take-away, I-put and I-forbid."
        ormsby: "I know not fear, I have my will, / Whate’er my whim or fancy be; / For me there’s no impossible, / I order, bind, forbid, set free."
        vocab:
          - {w: "todo cuanto", d: "everything that, all that"}
          - {w: "quitar", d: "to take away, remove"}
          - {w: "vedar", d: "to forbid, prohibit (literary)"}
        diagram:
          - s: "Nunca conocí"
            r: "main verb 1: I never knew"
            under:
              - {s: "qué es miedo", r: "object: what fear is"}
          - s: "todo cuanto quiero puedo"
            r: "main verb 2: whatever I want, I can (do)"
            under:
              - {s: "aunque quiera lo imposible", r: "concession: even if I want the impossible"}
          - s: "mando, quito, pongo y vedo"
            r: "main verbs 3 (after 'y'): I command, take away, grant and forbid"
            under:
              - {s: "en todo lo que es posible", r: "where: in everything that is possible"}
        forms:
          - {w: "conocí", f: "conoc- + -í → conocer (to know, be acquainted with), preterite, I. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "es", f: "ser (to be), present, it. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "quiero", f: "quier- + -o → querer (to want), present, I. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "puedo", f: "pued- + -o → poder (to be able), present, I. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden. The object 'todo cuanto quiero' is put first for emphasis."}
          - {w: "quiera", f: "quier- + -a → querer (to want), present subjunctive, I: 'even if I want'. The subjunctive after 'aunque' presents the case as a supposition. querer in the present subjunctive: quiera, quieras, quiera, queramos, queráis, quieran."}
          - {w: "mando, quito", f: "mand- + -o → mandar (to command) and quit- + -o → quitar (to take away), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "pongo", f: "pong- + -o → poner (to put, set up), present, I. Irregular only in the I form: pongo, pones, pone, ponemos, ponéis, ponen."}
          - {w: "vedo", f: "ved- + -o → vedar (to forbid), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
