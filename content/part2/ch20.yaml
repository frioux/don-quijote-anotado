          - {w: "desviarse", d: "to move aside, turn away"}
          - {w: "de la parte de", d: "from the side of, from the party of"}
          - {w: "la Liberalidad", d: "Generosity personified (open-handed giving), not political liberalism"}
          - {w: "mudanza", d: "figure, set of steps in a dance (false friend: not 'moving house')"}
        diagram:
          - {s: "Desvióse la Poesía", r: "main verb 1: Poetry moved aside"}
          - s: "salió la Liberalidad"
            r: "main verb 2 (after 'y'): Liberality came forward"
            under:
              - {s: "de la parte del Interés", r: "from where: from Interest's side"}
          - s: "dijo:"
            r: "main verb 3 (after 'y'): she said"
            under:
              - {s: "después de hechas sus mudanzas", r: "when: after her figures were done"}
        forms:
          - {w: "Desvióse", f: "desvi- + -ó + se → desviarse (to move aside), preterite, she, with 'se' (herself) stuck on the end; modern 'se desvió'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. Cervantes hangs the pronoun on a verb that opens the sentence."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
          - {w: "salió", f: "sal- + -ió → salir (to come out), preterite, she. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
