      - es: "los quesos, puestos como ladrillos enrejados, formaban una muralla, y dos calderas de aceite, mayores que las de un tinte, servían de freír cosas de masa, que con dos valientes palas las sacaban fritas y las zabullían en otra caldera de preparada miel que allí junto estaba."
        literal: "the cheeses, placed like bricks latticed, formed a wall, and two cauldrons of oil, bigger than those of a dye-works, served for frying things of dough, which with two mighty shovels them they-took-out fried and them they-plunged into another cauldron of prepared honey that there close-by was."
        ormsby: "There was a wall made of cheeses arranged like open brickwork, and two cauldrons full of oil, bigger than those of a dyer’s shop, served for cooking fritters, which when fried were taken out with two mighty shovels, and plunged into another cauldron of prepared honey that stood close by."
