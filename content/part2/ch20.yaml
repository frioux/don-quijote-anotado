  - sentences:
      - es: "-Soy quien puede más que Amor, y es Amor el que me guía; soy de la estirpe mejor que el cielo en la tierra cría, más conocida y mayor."
        literal: "-I-am who can more than Love, and is Love the-one who me guides; I-am of the lineage best that the heaven on the earth breeds, more known and greater."
        ormsby: "But mightier than Love am I, / Though Love it be that leads me on, / Than mine no lineage is more high, / Or older, underneath the sun."
        vocab:
          - {w: "poder más que", d: "to be stronger than, prevail over"}
          - {w: "estirpe", d: "lineage, stock, family line"}
          - {w: "criar", d: "to breed, bring forth, raise"}
          - {w: "mayor", d: "greater, larger; also older"}
        diagram:
          - s: "Soy"
            r: "main verb 1: I am"
            under:
              - {s: "quien puede más que Amor", r: "what I am: the one who is stronger than Love"}
          - s: "y es Amor"
            r: "main verb 2: and it is Love"
            under:
              - {s: "el que me guía", r: "what Love is: the one who guides me"}
          - s: "soy de la estirpe mejor"
            r: "main verb 3: I am of the best lineage"
            under:
              - {s: "que el cielo en la tierra cría", r: "describes 'estirpe': that heaven breeds on earth"}
              - {s: "más conocida y mayor", r: "describes 'estirpe': better known and greater"}
        forms:
          - {w: "Soy, es", f: "ser (to be), present, I ('soy') and it ('es'). Irregular: soy, eres, es, somos, sois, son."}
          - {w: "puede", f: "pued- + -e → poder (to be able), present, he ('quien', the one who). The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "guía", f: "guí- + -a → guiar (to guide), present, he (Love). The i takes an accent when stressed: guío, guías, guía, guiamos, guiáis, guían."}
          - {w: "cría", f: "crí- + -a → criar (to breed), present, it (heaven). Same accented i: crío, crías, cría, criamos, criáis, crían. The subject 'el cielo' comes before the place 'en la tierra' and the verb last, for the rhyme."}
          - {w: "conocida", f: "conoc- + -ida → conocer (to know), participle used as an adjective, feminine to match 'estirpe': 'well known'."}
          - {w: "mejor, mayor", f: "irregular comparatives: mejor = 'better, best' (from bueno), mayor = 'greater, bigger' (from grande). They do not change for gender."}
        note: "Interest admits that he follows Love, a sly point: a suitor who wants money still talks of love. His 'lineage' is the oldest on earth because greed is as old as mankind."
      - es: "Soy el Interés, en quien pocos suelen obrar bien, y obrar sin mí es gran milagro; y cual soy te me consagro, por siempre jamás, amén."
        literal: "I-am the Interest, in whom few are-wont to-act well, and to-act without me is great miracle; and such-as I-am to-you myself I-consecrate, for ever ever, amen."
        ormsby: "To use me rightly few know how, / To act without me fewer still, / For I am Interest, and I vow / For evermore to do thy will."
        vocab:
          - {w: "obrar", d: "to act, work, behave"}
          - {w: "en quien pocos suelen obrar bien", d: "with whom few usually behave well: few people use self-interest rightly"}
          - {w: "cual soy", d: "such as I am, just as I am"}
          - {w: "consagrarse", d: "to dedicate, devote oneself"}
          - {w: "por siempre jamás", d: "for ever and ever"}
