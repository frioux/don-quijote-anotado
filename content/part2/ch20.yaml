                r: "what I think, 1: that the poor man should make do with what"
                under:
                  - {s: "que hallare", r: "describes 'lo': whatever he may find"}
              - {s: "y no pedir cotufas en el golfo", r: "what I think, 2: and not ask for titbits on the open sea"}
        forms:
          - {w: "soy", f: "ser (to be), present, I. soy, eres, es, somos, sois, son."}
          - {w: "debe de contentarse", f: "deb- + -e → deber (ought to), present, he: debo, debes, debe, debemos, debéis, deben; + contentar (to satisfy) with 'se' (himself) hung on the infinitive: 'should content himself'."}
          - {w: "hallare", f: "hall- + -are → hallar (to find), future subjunctive, he: 'whatever he may find'. The future subjunctive of -ar verbs: -are, -ares, -are, -áremos, -areis, -aren. Cervantes uses it after 'lo que', 'si', 'donde' for an open future; modern Spanish uses the present subjunctive 'halle'."}
          - {w: "pedir", f: "pedir (to ask for), infinitive, still governed by 'debe de': 'and (should) not ask for'."}
