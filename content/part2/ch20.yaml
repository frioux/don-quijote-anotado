          - s: "no hay que fiar"
            r: "main verb: there's no trusting"
            under:
              - {s: "A buena fe, señor", r: "oath and address: in good faith, sir"}
              - {s: "respondió Sancho", r: "speech tag: answered Sancho"}
              - s: "en la descarnada, digo, en la muerte"
                r: "in whom: the fleshless one, I mean, Death"
                under:
                  - {s: "la cual también come cordero como carnero", r: "describes 'muerte': who eats lamb as readily as sheep"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "hay", f: "hay, 'there is', from haber (to have) used impersonally; 'no hay que' + infinitive = there is no point in, one must not."}
          - {w: "descarnada", f: "des- + carn(e) + -ada → descarnar (to strip of flesh), participle, feminine to match 'muerte', used as a noun: 'the fleshless one'."}
