  - sentences:
      - es: "Retiróse el Interés, y hízose adelante la Poesía; la cual, después de haber hecho sus mudanzas como los demás, puestos los ojos en la doncella del castillo, dijo:"
        literal: "Withdrew-himself the Interest, and made-herself forward the Poetry; the which, after of having made her figures like the others, placed the eyes on the maiden of-the castle, said:"
        ormsby: "Interest retired, and Poetry came forward, and when she had gone through her figures like the others, fixing her eyes on the damsel of the castle, she said:"
        vocab:
          - {w: "retirarse", d: "to withdraw, step back"}
          - {w: "hacerse adelante", d: "to step forward"}
          - {w: "mudanza", d: "figure, set of steps in a dance (false friend: not 'moving house')"}
          - {w: "los demás", d: "the others, the rest"}
        diagram:
          - s: "Retiróse el Interés"
            r: "main verb 1: Interest withdrew"
          - s: "y hízose adelante la Poesía"
            r: "main verb 2: and Poetry stepped forward"
          - s: "la cual"
            r: "subject of 'dijo': she (Poetry)"
            under:
              - {s: "después de haber hecho sus mudanzas como los demás", r: "when: after doing her figures like the others"}
              - {s: "puestos los ojos en la doncella del castillo", r: "how: with her eyes fixed on the maiden of the castle"}
              - {s: "dijo:", r: "main verb 3: said"}
        forms:
          - {w: "Retiróse", f: "retir- + -ó + se → retirarse (to withdraw), preterite, he, with 'se' (himself) stuck on the end; modern 'se retiró'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. Cervantes hangs the pronoun on a verb that opens the sentence."}
          - {w: "hízose", f: "hiz- + -o + se → hacerse (to make oneself, move), preterite, she, with 'se' on the end, accent added to keep the stress on hí-; modern 'se hizo'. hacer (to do, make) in the preterite: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "la cual", f: "'who, which', feminine to match 'la Poesía'; a heavier relative than 'que', used after a semicolon to start a new sentence about her."}
          - {w: "haber hecho", f: "haber (to have) + hecho, irregular participle of hacer (to do): the perfect infinitive, 'having done', after 'después de'."}
          - {w: "puestos los ojos", f: "puestos, irregular participle of poner (to put), masculine plural to match 'ojos': an absolute participle, 'her eyes being placed', i.e. with her eyes fixed. Spanish says 'los ojos', not 'her eyes', when the owner is plain."}
