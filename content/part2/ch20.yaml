          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, she. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "-Llaman Liberalidad al dar que el estremo huye de la prodigalidad, y del contrario, que arguye tibia y floja voluntad."
        literal: "-They-call Liberality [to] the giving that the extreme flees of the prodigality, and of-the contrary, which shows lukewarm and slack will."
        ormsby: "To give, while shunning each extreme, / The sparing hand, the over-free, / Therein consists, so wise men deem, / The virtue Liberality."
        vocab:
          - {w: "el dar", d: "giving (an infinitive used as a noun)"}
          - {w: "estremo", d: "= extremo, extreme (old spelling)"}
          - {w: "huir", d: "to flee, avoid, shun"}
          - {w: "prodigalidad", d: "prodigality, wasteful spending"}
          - {w: "el contrario", d: "the opposite extreme, i.e. stinginess"}
          - {w: "argüir", d: "to show, indicate, be a sign of (not 'to argue')"}
          - {w: "tibio", d: "lukewarm, half-hearted"}
          - {w: "flojo", d: "slack, weak, feeble"}
        diagram:
          - s: "Llaman Liberalidad"
            r: "main verb: they call (it) Liberality"
            under:
              - s: "al dar"
                r: "object: giving"
                under:
                  - s: "que el estremo huye de la prodigalidad, y del contrario"
                    r: "describes 'dar': that shuns the extreme of wastefulness, and its opposite"
                    under:
                      - {s: "que arguye tibia y floja voluntad", r: "describes 'contrario': which shows a lukewarm, feeble will"}
        forms:
          - {w: "Llaman", f: "llam- + -an → llamar (to call), present, they (people in general): 'people call'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "al dar", f: "a + el + dar: the infinitive dar (to give) used as a noun, 'giving', with 'a' marking it as the thing that is named."}
          - {w: "huye", f: "hu- + -ye → huir (to flee, shun), present, it (the giving). A y is added between stem and ending: huyo, huyes, huye, huimos, huís, huyen."}
          - {w: "arguye", f: "argu- + -ye → argüir (to show, indicate), present, it (the opposite extreme). Like huir (to flee) it adds y: arguyo, arguyes, arguye, argüimos, argüís, arguyen."}
          - {w: "tibia y floja", f: "tibi- + -a → tibio (lukewarm) and floj- + -a → flojo (slack), feminine to match 'voluntad'."}
        note: "This is Aristotle's definition of liberality as the virtue between two vices, prodigality and meanness, a commonplace of Renaissance ethics."
      - es: "Mas yo, por te engrandecer, de hoy más, pródiga he de ser; que, aunque es vicio, es vicio honrado y de pecho enamorado, que en el dar se echa de ver."
        literal: "But I, to you aggrandize, from today more, prodigal I-have to be; for, although it-is vice, it-is vice honourable and of breast enamoured, which in the giving itself shows."
        ormsby: "But thee, fair lady, to enrich, / Myself a prodigal I’ll prove, / A vice not wholly shameful, which / May find its fair excuse in love."
        vocab:
          - {w: "mas", d: "but (literary; without accent, unlike 'más', more)"}
          - {w: "engrandecer", d: "to make great, exalt, enrich"}
          - {w: "de hoy más", d: "from today on, henceforth"}
          - {w: "pródigo", d: "prodigal, lavish, wasteful"}
          - {w: "honrado", d: "honourable, respectable"}
          - {w: "pecho", d: "breast, heart; 'de pecho enamorado' = of a loving heart"}
          - {w: "echarse de ver", d: "to be seen, show itself, be noticed"}
        diagram:
          - s: "pródiga he de ser"
            r: "main verb 1: I must be prodigal"
            under:
              - {s: "Mas yo", r: "subject: but I (Liberality)"}
              - {s: "por te engrandecer", r: "why: to make you great"}
              - {s: "de hoy más", r: "when: from today on"}
          - s: "que, aunque es vicio, es vicio honrado y de pecho enamorado"
            r: "main verb 2 (after 'que', for): although it is a vice, it is an honourable vice and of a loving heart"
            under:
              - {s: "que en el dar se echa de ver", r: "describes 'pecho enamorado': which shows itself in giving"}
        forms:
          - {w: "te engrandecer", f: "engrandecer (to make great) with 'te' (you) placed before the infinitive, an old and poetic order; modern 'por engrandecerte'."}
          - {w: "pródiga", f: "pródig- + -a → pródigo (lavish), feminine because Liberality speaks of herself."}
          - {w: "he de ser", f: "he → haber (to have), present, I: he, has, ha, hemos, habéis, han; + de + ser (to be): 'haber de' + infinitive means 'must, am to': 'I must be, I am going to be'."}
          - {w: "es", f: "ser (to be), present, it (prodigality). Irregular: soy, eres, es, somos, sois, son."}
          - {w: "honrado, enamorado", f: "participles used as adjectives: honr- + -ado → honrar (to honour) and enamor- + -ado → enamorar (to make fall in love), masculine to match 'vicio' and 'pecho'."}
          - {w: "se echa de ver", f: "ech- + -a → echar (to throw), present, it, with 'se' making it passive; 'echarse de ver' = to be seen, show itself. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
        note: "Having just defined the virtue as the mean, Liberality cheerfully abandons it for the maiden's sake: money's party excuses extravagance as the sign of a loving heart, a hit at the rich Camacho's lavish wedding."
  - sentences:
      - es: "Deste modo salieron y se retiraron todas las dos figuras de las dos escuadras, y cada uno hizo sus mudanzas y dijo sus versos, algunos elegantes y algunos ridículos, y sólo tomó de memoria don Quijote —que la tenía grande— los ya referidos;"
        literal: "Of-this way came-out and withdrew-themselves all the two figures of the two squads, and each one did his figures and said his verses, some elegant and some ridiculous, and only took by memory Don Quijote (who it had great) the already related;"
        ormsby: "In the same manner all the characters of the two bands advanced and retired, and each executed its figures, and delivered its verses, some of them graceful, some burlesque, but Don Quixote’s memory (though he had an excellent one) only carried away those that have been just quoted."
        vocab:
          - {w: "deste modo", d: "in this way; 'deste' = de este (old contraction)"}
          - {w: "figura", d: "character, costumed figure in a show"}
          - {w: "escuadra", d: "squad, band, company (originally military)"}
          - {w: "todas las dos", d: "every figure of the two bands (an odd, compressed phrase)"}
          - {w: "mudanza", d: "figure, set of steps in a dance (false friend: not 'moving house')"}
          - {w: "ridículo", d: "comic, absurd, laughable"}
          - {w: "tomar de memoria", d: "to learn by heart, commit to memory"}
          - {w: "referido", d: "mentioned, quoted, related (from 'referir', to tell)"}
