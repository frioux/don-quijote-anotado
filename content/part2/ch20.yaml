      - es: "Habilidades y gracias que no son vendibles, mas que las tenga el conde Dirlos; pero, cuando las tales gracias caen sobre quien tiene buen dinero, tal sea mi vida como ellas parecen."
        literal: "Abilities and graces that not are saleable, let that them may-have the count Dirlos; but, when the such graces fall upon whom has good money, such be my life as they look."
        ormsby: "Talents and accomplishments that can’t be turned into money, let Count Dirlos have them; but when such gifts fall to one that has hard cash, I wish my condition of life was as becoming as they are."
        ormsby_note: "Count Dirlos was the brother of Durandarte and hero of one of the ballads of the Carlovingian cycle. His name seems to have come to be used somewhat in the same fashion as that of \"The Marquis of Carabas.\" V. Qaevedo's Gran Tacaño, chapter XII."
        vocab:
          - {w: "habilidades", d: "skills, talents"}
          - {w: "gracias", d: "accomplishments, graces, gifts (not 'thanks')"}
          - {w: "vendible", d: "saleable, that can be sold"}
          - {w: "mas que", d: "let him, for all I care (+ subjunctive)"}
          - {w: "el conde Dirlos", d: "Count Dirlos, hero of a long Spanish ballad of the Charlemagne cycle; his name came to stand for some fine, far-off personage"}
          - {w: "las tales", d: "such, these said: 'tal' with the article points back to what was just mentioned"}
          - {w: "tal sea mi vida como", d: "an oath: may my life be as good as they look, i.e. they look splendid"}
        diagram:
          - s: "mas que las tenga el conde Dirlos"
            r: "main verb 1: let Count Dirlos have them"
            under:
              - s: "Habilidades y gracias"
                r: "object, put first: skills and accomplishments"
                under:
                  - {s: "que no son vendibles", r: "describes 'habilidades y gracias': that cannot be sold"}
          - s: "tal sea mi vida como ellas parecen"
            r: "main verb 2 (after 'pero'): may my life be as fine as they look"
            under:
              - s: "cuando las tales gracias caen sobre quien"
                r: "when: when such gifts fall on someone who"
                under:
                  - {s: "tiene buen dinero", r: "describes 'quien': has good money"}
        forms:
          - {w: "son", f: "ser (to be), present, they. soy, eres, es, somos, sois, son."}
          - {w: "tenga", f: "teng- + -a → tener (to have), present subjunctive, he: 'let him have'. tenga, tengas, tenga, tengamos, tengáis, tengan."}
          - {w: "las", f: "'them', feminine plural for 'habilidades y gracias', repeating the object that was put first."}
          - {w: "caen", f: "ca- + -en → caer (to fall), present, they. caigo, caes, cae, caemos, caéis, caen."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, he. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "sea", f: "ser (to be), present subjunctive, it, for a wish: 'may (my life) be'. sea, seas, sea, seamos, seáis, sean."}
          - {w: "parecen", f: "parec- + -en → parecer (to look, seem), present, they. parezco, pareces, parece, parecemos, parecéis, parecen."}
      - es: "Sobre un buen cimiento se puede levantar un buen edificio, y el mejor cimiento y zanja del mundo es el dinero."
        literal: "Upon a good foundation itself can raise a good building, and the best foundation and trench of-the world is the money."
        ormsby: "On a good foundation you can raise a good building, and the best foundation in the world is money.”"
        vocab:
          - {w: "cimiento", d: "foundation (of a building)"}
          - {w: "levantar", d: "to raise, build"}
          - {w: "zanja", d: "trench, footing dug for a foundation"}
        diagram:
          - s: "se puede levantar un buen edificio"
            r: "main verb 1: a good building can be raised"
            under:
              - {s: "Sobre un buen cimiento", r: "where: on a good foundation"}
          - s: "y el mejor cimiento y zanja del mundo es el dinero"
            r: "main verb 2: and the best foundation and footing in the world is money"
        forms:
          - {w: "se puede levantar", f: "pued- + -e → poder (to be able), present, it: puedo, puedes, puede, podemos, podéis, pueden; + levantar (to raise); 'se' makes it passive or impersonal: 'one can raise, can be raised'."}
          - {w: "mejor", f: "the comparative of bueno (good): 'better', and with the article 'el mejor', 'the best'."}
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
        note: "Sancho's materialism is the point of the wedding episode: Camacho's money against Basilio's talents, a debate the wedding dance later in the chapter acts out."
  - sentences:
      - es: "— Por quien Dios es, Sancho —dijo a esta sazón don Quijote—, que concluyas con tu arenga; que tengo para mí que si te dejasen seguir en las que a cada paso comienzas, no te quedaría tiempo para comer ni para dormir, que todo le gastarías en hablar."
        literal: "— By whom God is, Sancho —said at this moment Don Quijote—, that you-finish with your harangue; for I-hold for myself that if you they-let to-go-on in those that at each step you-begin, not to-you would-remain time for eating nor for sleeping, for all it you-would-spend in talking."
        ormsby: "“For God’s sake, Sancho,” said Don Quixote here, “stop that harangue; it is my belief, if thou wert allowed to continue all thou beginnest every instant, thou wouldst have no time left for eating or sleeping; for thou wouldst spend it all in talking.”"
        vocab:
          - {w: "por quien Dios es", d: "for God's sake (literally 'by Him who God is'), an earnest plea"}
          - {w: "a esta sazón", d: "at this point, at this moment"}
          - {w: "concluir con", d: "to finish, bring to an end"}
          - {w: "arenga", d: "harangue, long speech"}
          - {w: "tener para mí", d: "to believe, be of the opinion"}
          - {w: "a cada paso", d: "at every step, constantly"}
          - {w: "gastar", d: "to spend, use up (time, money)"}
        diagram:
          - s: "que concluyas con tu arenga"
            r: "main verb 1: (I beg) that you finish your harangue"
            under:
              - {s: "Por quien Dios es, Sancho", r: "plea and address: for God's sake, Sancho"}
              - {s: "dijo a esta sazón don Quijote", r: "speech tag: said Don Quijote at this point"}
          - s: "que tengo para mí"
            r: "main verb 2 (after 'que', for): for I believe"
            under:
              - s: "que"
                r: "what I believe: that"
                under:
                  - s: "si te dejasen seguir en las"
                    r: "condition: if they let you go on with those (harangues)"
                    under:
                      - {s: "que a cada paso comienzas", r: "describes 'las': that you start at every step"}
                  - {s: "no te quedaría tiempo para comer ni para dormir", r: "result: you would have no time left to eat or sleep"}
                  - {s: "que todo le gastarías en hablar", r: "why: for you would spend it all talking"}
        forms:
          - {w: "es", f: "ser (to be), present, he (God). soy, eres, es, somos, sois, son."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "concluyas", f: "concluy- + -as → concluir (to finish), present subjunctive, you: '(I beg) that you finish', with a verb of asking understood. A y is added to the stem: concluya, concluyas, concluya, concluyamos, concluyáis, concluyan."}
          - {w: "tengo", f: "teng- + -o → tener (to hold), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "dejasen", f: "dej- + -asen → dejar (to let), imperfect subjunctive (-se form), they (people in general): 'if they let you'. The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. 'si' + imperfect subjunctive for an unreal condition."}
          - {w: "comienzas", f: "comienz- + -as → comenzar (to begin), present, you. The stem e becomes ie when stressed: comienzo, comienzas, comienza, comenzamos, comenzáis, comienzan."}
          - {w: "quedaría, gastarías", f: "quedar- + -ía → quedar (to remain), conditional, it: 'would remain'; gastar- + -ías → gastar (to spend), conditional, you: 'you would spend'. The conditional adds -ía endings to the whole infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "le", f: "'it', standing for 'tiempo'; 'le' for a thing instead of 'lo' is a kind of leísmo, common in Cervantes."}
          - {w: "hablar", f: "hablar (to talk), infinitive after 'en': 'in talking'."}
  - sentences:
      - es: "— Si vuestra merced tuviera buena memoria —replicó Sancho—, debiérase acordar de los capítulos de nuestro concierto antes que esta última vez saliésemos de casa:"
        literal: "— If your grace had good memory —replied Sancho—, should-yourself remember of the articles of our agreement before that this last time we-went-out from home:"
        ormsby: "“If your worship had a good memory,” replied Sancho, “you would remember the articles of our agreement before we started from home this last time;"
        vocab:
          - {w: "vuestra merced", d: "your worship, the polite 'you'; it takes the verb of 'he/she'"}
          - {w: "replicar", d: "to reply, retort"}
          - {w: "acordarse de", d: "to remember"}
          - {w: "capítulos", d: "articles, clauses (of an agreement); not 'chapters' here"}
          - {w: "concierto", d: "agreement, contract (false friend: not 'concert')"}
          - {w: "antes que", d: "before (+ subjunctive); modern Spanish prefers 'antes de que'"}
        diagram:
          - s: "debiérase acordar de los capítulos de nuestro concierto"
            r: "main verb: you ought to remember the articles of our agreement"
            under:
              - {s: "Si vuestra merced tuviera buena memoria", r: "condition: if your worship had a good memory"}
              - {s: "replicó Sancho", r: "speech tag: replied Sancho"}
              - {s: "antes que esta última vez saliésemos de casa", r: "when (the agreement was made): before we left home this last time"}
        forms:
          - {w: "tuviera", f: "tuv- + -iera → tener (to have), imperfect subjunctive (-ra form), you (vuestra merced, which takes the he/she form): 'if you had'. tuviera, tuvieras, tuviera, tuviéramos, tuvierais, tuvieran. 'si' + imperfect subjunctive for an unreal condition."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "debiérase acordar", f: "deb- + -iera + se → deber (ought), imperfect subjunctive (-ra form), you (vuestra merced), with 'se' (yourself, belonging to acordarse) stuck on the end; modern 'se debería acordar'. The -ra form of -er verbs: -iera, -ieras, -iera, -iéramos, -ierais, -ieran; here used as a conditional, 'you ought to'. acordar (to remember) is the infinitive after it."}
          - {w: "nuestro", f: "nuestr- + -o → nuestro (our), masculine to match 'concierto'."}
          - {w: "saliésemos", f: "sal- + -iésemos → salir (to go out), imperfect subjunctive (-se form), we. The -se form of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen. 'antes que' always takes the subjunctive."}
        note: "Sancho means the bargaining over his wages before the third sally (Chapter VII). The clause he now claims is not recorded there; Don Quijote had, however, ordered him in Part I (chapter 20) to talk less with his master."
