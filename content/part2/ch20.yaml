          - {w: "tenerse en buenas", d: "to stop while one is doing well, quit while ahead (probably from card-playing: stand on a good hand)"}
          - {w: "dejarse caer", d: "to let oneself fall; here to spoil it by going on"}
          - {w: "en verdad que", d: "truly, in truth (the 'que' just adds emphasis)"}
          - {w: "rústico", d: "rustic, countrified, plain"}
          - {w: "términos", d: "terms, words, ways of speaking"}
          - {w: "predicador", d: "preacher"}
