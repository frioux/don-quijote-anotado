part: 2
chapter: 20
title_es: "Capítulo XX. Donde se cuentan las bodas de Camacho el rico, con el suceso de Basilio el pobre"
title_en: "Wherein an account is given of the wedding of Camacho the Rich, together with the incident of Basilio the Poor"
paragraphs:
  - sentences:
      - es: "Apenas la blanca aurora había dado lugar a que el luciente Febo, con el ardor de sus calientes rayos, las líquidas perlas de sus cabellos de oro enjugase, cuando don Quijote, sacudiendo la pereza de sus miembros, se puso en pie y llamó a su escudero Sancho, que aún todavía roncaba;"
        literal: "Scarcely the white dawn had given room to that the shining Phoebus, with the heat of his hot rays, the liquid pearls of her hairs of gold might-dry, when Don Quijote, shaking-off the laziness from his limbs, himself put on foot and called [to] his squire Sancho, who still yet was-snoring;"
        ormsby: "Scarce had the fair Aurora given bright Phoebus time to dry the liquid pearls upon her golden locks with the heat of his fervent rays, when Don Quixote, shaking off sloth from his limbs, sprang to his feet and called to his squire Sancho, who was still snoring;"
        vocab:
          - {w: "apenas, cuando", d: "scarcely ... when, no sooner ... than"}
          - {w: "aurora", d: "dawn; also Aurora, the Roman goddess of the dawn"}
          - {w: "dar lugar a que", d: "to give time for, allow (something to happen)"}
          - {w: "luciente", d: "shining, bright (literary)"}
          - {w: "Febo", d: "Phoebus (Apollo), the sun god; in poetry simply 'the sun'"}
          - {w: "enjugar", d: "to dry, wipe dry (tears, dew)"}
          - {w: "sacudir", d: "to shake off"}
          - {w: "pereza", d: "laziness, sloth, sluggishness"}
          - {w: "ponerse en pie", d: "to get to one's feet, stand up"}
          - {w: "aún todavía", d: "still, even now (the two words say the same thing twice, for emphasis)"}
          - {w: "roncar", d: "to snore"}
        diagram:
          - s: "Apenas la blanca aurora había dado lugar"
            r: "time clause: scarcely had the white dawn given time"
            under:
              - s: "a que el luciente Febo"
                r: "for what: for shining Phoebus (the sun)"
                under:
                  - {s: "con el ardor de sus calientes rayos", r: "how: with the heat of his hot rays"}
                  - {s: "las líquidas perlas de sus cabellos de oro", r: "object: the liquid pearls (dewdrops) of her golden hair"}
                  - {s: "enjugase", r: "verb of the 'a que' clause: should dry"}
          - s: "cuando don Quijote"
            r: "main clause, after 'apenas': when Don Quijote"
            under:
              - {s: "sacudiendo la pereza de sus miembros", r: "how: shaking the sloth from his limbs"}
              - {s: "se puso en pie", r: "main verb 1: got to his feet"}
              - s: "y llamó a su escudero Sancho"
                r: "main verb 2: and called his squire Sancho"
                under:
                  - {s: "que aún todavía roncaba", r: "describes 'Sancho': who was still snoring"}
        forms:
          - {w: "había dado", f: "habí- + -a → haber (to have), imperfect, she (the dawn): había, habías, había, habíamos, habíais, habían; + dado, participle of dar (to give): the pluperfect, 'had given'."}
          - {w: "luciente", f: "old present participle of lucir (to shine), used as an adjective: 'shining'. The ending -iente makes adjectives from -er and -ir verbs (luciente, ardiente, corriente)."}
          - {w: "calientes, líquidas", f: "calient- + -es → caliente (hot), plural to match 'rayos'; líquid- + -as → líquido (liquid), feminine plural to match 'perlas'. Adjectives placed before the noun, a poetic order."}
          - {w: "enjugase", f: "enjug- + -ase → enjugar (to dry), imperfect subjunctive (-se form), he (Phoebus): 'should dry'. The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. Subjunctive after 'dar lugar a que' (to allow that); the verb is held back to the very end of the clause, Latin fashion."}
          - {w: "sacudiendo", f: "sacud- + -iendo → sacudir (to shake off), gerund: 'shaking off'."}
          - {w: "se puso", f: "pus- + -o → poner (to put), preterite, he, with 'se' (himself): 'ponerse en pie', to get to one's feet. Irregular preterite: puse, pusiste, puso, pusimos, pusisteis, pusieron."}
          - {w: "llamó", f: "llam- + -ó → llamar (to call), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "roncaba", f: "ronc- + -aba → roncar (to snore), imperfect, he: 'was snoring'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
        note: "A mock-epic dawn in the high style of the romances of chivalry: the dew on Aurora's hair is 'liquid pearls' that the sun dries. Don Quijote has written such openings for his own imagined chronicle since Part I chapter 2; here the narrator uses one for a day spent largely watching Sancho eat."
      - es: "lo cual visto por don Quijote, antes que le despertase, le dijo:"
        literal: "the which seen by Don Quijote, before that him he-should-wake, to-him he-said:"
        ormsby: "seeing which Don Quixote ere he roused him thus addressed him:"
        vocab:
          - {w: "lo cual visto", d: "which being seen, seeing this: an absolute participle construction, like Latin 'quo viso'"}
          - {w: "antes que", d: "before (+ subjunctive); modern Spanish prefers 'antes de que'"}
          - {w: "despertar", d: "to wake (someone) up"}
        diagram:
          - s: "le dijo:"
            r: "main verb: he said to him"
            under:
              - {s: "lo cual visto por don Quijote", r: "when: this being seen by Don Quijote"}
              - {s: "antes que le despertase", r: "when: before he woke him"}
        forms:
          - {w: "lo cual visto", f: "visto, irregular participle of ver (to see), with 'lo cual' (which) as its subject: an absolute participle, 'which having been seen'. The participle agrees with its noun, here neuter 'lo cual' (masculine singular form)."}
          - {w: "despertase", f: "despert- + -ase → despertar (to wake up), imperfect subjunctive (-se form), he: 'before he woke'. The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. 'antes que' always takes the subjunctive."}
          - {w: "le despertase", f: "le = 'him' (Sancho) as direct object: leísmo, using 'le' instead of 'lo' for a male person, normal in Cervantes."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— ¡Oh tú, bienaventurado sobre cuantos viven sobre la haz de la tierra, pues sin tener invidia ni ser invidiado, duermes con sosegado espíritu, ni te persiguen encantadores, ni sobresaltan encantamentos!"
        literal: "— Oh you, blessed above as-many-as live upon the face of the earth, since without having envy nor being envied, you-sleep with calm spirit, nor you pursue enchanters, nor startle enchantments!"
        ormsby: "“Happy thou, above all the dwellers on the face of the earth, that, without envying or being envied, sleepest with tranquil mind, and that neither enchanters persecute nor enchantments affright."
        vocab:
          - {w: "bienaventurado", d: "blessed, happy, fortunate (a word from the Beatitudes, 'Bienaventurados los pobres', blessed are the poor)"}
          - {w: "cuantos", d: "as many as, all who"}
          - {w: "la haz de la tierra", d: "the face of the earth; 'haz' (feminine) = face, surface, an old word now used only in this phrase"}
          - {w: "invidia", d: "= envidia, envy (old form); 'invidiado' = envidiado, envied"}
          - {w: "sosegado", d: "calm, tranquil, untroubled"}
          - {w: "perseguir", d: "to persecute, pursue, hound"}
          - {w: "sobresaltar", d: "to startle, alarm, give a fright"}
          - {w: "encantamento", d: "= encantamiento, enchantment, spell (old form)"}
        diagram:
          - s: "¡Oh tú, bienaventurado"
            r: "exclamation: O you, blessed one"
            under:
              - {s: "sobre cuantos viven sobre la haz de la tierra", r: "compared with whom: above all who live on the face of the earth"}
              - s: "pues"
                r: "why: since"
                under:
                  - {s: "sin tener invidia ni ser invidiado", r: "how: without envying or being envied"}
                  - {s: "duermes con sosegado espíritu", r: "reason 1: you sleep with a calm spirit"}
                  - {s: "ni te persiguen encantadores", r: "reason 2: and no enchanters hound you"}
                  - {s: "ni sobresaltan encantamentos", r: "reason 3: nor do enchantments startle (you)"}
        forms:
          - {w: "viven", f: "viv- + -en → vivir (to live), present, they. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "tener, ser", f: "tener (to have) and ser (to be), infinitives after 'sin' (without): 'without having, without being'."}
          - {w: "invidiado", f: "invidi- + -ado → invidiar (old form of envidiar, to envy), participle after 'ser': passive, 'being envied'."}
          - {w: "duermes", f: "duerm- + -es → dormir (to sleep), present, you. The stem o becomes ue when stressed: duermo, duermes, duerme, dormimos, dormís, duermen."}
          - {w: "sosegado", f: "soseg- + -ado → sosegar (to calm), participle used as an adjective, masculine to match 'espíritu'."}
          - {w: "persiguen", f: "persig- + -uen → perseguir (to persecute), present, they (the enchanters). The e of the stem becomes i when stressed, and gu loses its u before o: persigo, persigues, persigue, perseguimos, perseguís, persiguen."}
          - {w: "sobresaltan", f: "sobresalt- + -an → sobresaltar (to startle), present, they (the enchantments). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. The 'te' (you) of the previous verb is understood again."}
          - {w: "encantamentos", f: "old form of encantamientos (enchantments), without the diphthong ie."}
        note: "Don Quijote's praise of the sleeping servant is a version of the classical and Renaissance commonplace 'beatus ille' ('happy the man who' lives simply), which praised the simple life free of ambition and care. Sancho's untroubled sleep is a running contrast with his master's sleeplessness."
      - es: "Duerme, digo otra vez, y lo diré otras ciento, sin que te tengan en contina vigilia celos de tu dama, ni te desvelen pensamientos de pagar deudas que debas, ni de lo que has de hacer para comer otro día tú y tu pequeña y angustiada familia."
        literal: "Sleep, I-say another time, and it I-will-say another hundred, without that you may-keep in continual vigil jealousies of your lady, nor you may-keep-awake thoughts of paying debts that you-may-owe, nor of that which you-have to do in-order-to eat another day you and your small and distressed family."
        ormsby: "Sleep, I say, and will say a hundred times, without any jealous thoughts of thy mistress to make thee keep ceaseless vigils, or any cares as to how thou art to pay the debts thou owest, or find tomorrow’s food for thyself and thy needy little family, to interfere with thy repose."
        vocab:
          - {w: "otras ciento", d: "a hundred times more ('vez' understood: otras cien veces)"}
          - {w: "contina", d: "= continua, continual, ceaseless (old form)"}
          - {w: "vigilia", d: "wakefulness, a sleepless night"}
          - {w: "celos", d: "jealousy (always plural in this sense)"}
          - {w: "dama", d: "lady; here the lady one serves and loves"}
          - {w: "desvelar", d: "to keep awake, rob of sleep"}
          - {w: "otro día", d: "here 'the next day, tomorrow' (old usage), not 'another day'"}
          - {w: "angustiado", d: "anxious, distressed; here 'needy, hard-pressed'"}
        diagram:
          - s: "Duerme"
            r: "main verb: sleep!"
            under:
              - {s: "digo otra vez, y lo diré otras ciento", r: "aside: I say again, and will say it a hundred times more"}
              - s: "sin que te tengan en contina vigilia celos de tu dama"
                r: "how 1: without jealousy of your lady keeping you awake"
              - s: "ni te desvelen pensamientos de pagar deudas"
                r: "how 2: nor thoughts of paying debts keeping you awake"
                under:
                  - {s: "que debas", r: "describes 'deudas': that you may owe"}
              - s: "ni de lo"
                r: "how 3: nor (thoughts) of what"
                under:
                  - {s: "que has de hacer para comer otro día tú y tu pequeña y angustiada familia", r: "describes 'lo': what you must do so that you and your little needy family can eat tomorrow"}
        forms:
          - {w: "Duerme", f: "duerm- + -e → dormir (to sleep), imperative, you (tú): 'sleep!'. The tú imperative is the same as the he/she present: duerme, from duermo, duermes, duerme, dormimos, dormís, duermen."}
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "diré", f: "dir- + -é → decir (to say), future, I. Irregular stem dir-: diré, dirás, dirá, diremos, diréis, dirán."}
          - {w: "tengan", f: "teng- + -an → tener (to have, to keep), present subjunctive, they (the jealousies): 'keep'. tenga, tengas, tenga, tengamos, tengáis, tengan. 'sin que' (without) always takes the subjunctive."}
          - {w: "contina", f: "old form of continua (continual), feminine to match 'vigilia'."}
          - {w: "desvelen", f: "desvel- + -en → desvelar (to keep awake), present subjunctive, they (the thoughts), still after 'sin que'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "debas", f: "deb- + -as → deber (to owe), present subjunctive, you: 'that you may owe'. The present subjunctive of -er and -ir verbs: -a, -as, -a, -amos, -áis, -an."}
          - {w: "has de hacer", f: "h- + -as → haber (to have), present, you: he, has, ha, hemos, habéis, han; 'haber de' + infinitive = to have to, must: 'what you must do'. hacer (to do) is the infinitive after it."}
          - {w: "pequeña y angustiada", f: "pequeñ- + -a → pequeño (small) and angustiad- + -a → angustiado (distressed), feminine to match 'familia'."}
      - es: "Ni la ambición te inquieta, ni la pompa vana del mundo te fatiga, pues los límites de tus deseos no se estienden a más que a pensar tu jumento;"
        literal: "Neither the ambition you disquiets, nor the pomp vain of-the world you wearies, since the limits of your desires not themselves extend to more than to feeding your donkey;"
        ormsby: "Ambition breaks not thy rest, nor doth this world’s empty pomp disturb thee, for the utmost reach of thy anxiety is to provide for thy ass,"
        vocab:
          - {w: "inquietar", d: "to disturb, trouble, make restless"}
          - {w: "pompa vana", d: "empty pomp, vain show"}
          - {w: "fatigar", d: "to trouble, harass (more than 'to tire' in Cervantes)"}
          - {w: "estenderse", d: "= extenderse, to extend, reach (old spelling)"}
          - {w: "no se estienden a más que", d: "no further than, only"}
          - {w: "pensar", d: "here 'to feed (an animal)', from 'pienso', fodder: a different verb from 'pensar' (to think) in origin"}
          - {w: "jumento", d: "donkey, ass"}
        diagram:
          - {s: "Ni la ambición te inquieta", r: "main verb 1: ambition does not trouble you"}
          - {s: "ni la pompa vana del mundo te fatiga", r: "main verb 2: nor does the world's empty pomp harass you"}
          - s: "pues los límites de tus deseos no se estienden"
            r: "why: since the limits of your desires reach"
            under:
              - {s: "a más que a pensar tu jumento", r: "how far: no further than feeding your donkey"}
        forms:
          - {w: "inquieta, fatiga", f: "inquiet- + -a → inquietar (to trouble) and fatig- + -a → fatigar (to harass), present, it (ambition, pomp). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "vana", f: "van- + -a → vano (empty, vain), feminine to match 'pompa'; placed after the noun."}
          - {w: "del", f: "de + el, 'of the'."}
          - {w: "tus", f: "plural of tu (your) to match 'deseos', not the owner."}
          - {w: "se estienden", f: "estiend- + -en → estenderse (old spelling of extenderse, to extend), present, they (the limits), with 'se'. The stem e becomes ie when stressed: estiendo, estiendes, estiende, estendemos, estendéis, estienden."}
          - {w: "pensar", f: "pensar (to feed an animal), infinitive after 'a'; it conjugates like pensar (to think): pienso, piensas, piensa, pensamos, pensáis, piensan."}
      - es: "que el de tu persona sobre mis hombros le tienes puesto:"
        literal: "for that [care] of your person upon my shoulders it you-have placed:"
        ormsby: "since upon my shoulders thou hast laid the support of thyself,"
        vocab:
          - {w: "el de tu persona", d: "that (the care, the feeding) of your own person: 'el' stands for 'el pensar', looking after"}
          - {w: "hombros", d: "shoulders"}
          - {w: "tener puesto", d: "to have placed; 'tener' + participle stresses the result"}
        diagram:
          - s: "le tienes puesto"
            r: "main verb (after 'que', for): you have placed it"
            under:
              - {s: "el de tu persona", r: "object, put first: the (feeding) of your own person"}
              - {s: "sobre mis hombros", r: "where: on my shoulders"}
        forms:
          - {w: "el de tu persona", f: "'el' is a pronoun standing for the masculine noun of the previous sentence ('el pensar', the feeding): 'that of your person'."}
          - {w: "le", f: "'it', repeating 'el de tu persona' after it has been put first; using 'le' rather than 'lo' for a thing is a kind of leísmo, common in Cervantes."}
          - {w: "tienes puesto", f: "tien- + -es → tener (to have), present, you: tengo, tienes, tiene, tenemos, tenéis, tienen; + puesto, irregular participle of poner (to put), masculine to match 'le': 'you have (it) placed', close to the perfect 'has puesto'."}
      - es: "contrapeso y carga que puso la naturaleza y la costumbre a los señores."
        literal: "counterweight and burden that put the nature and the custom on the masters."
        ormsby: "the counterpoise and burden that nature and custom have imposed upon masters."
        vocab:
          - {w: "contrapeso", d: "counterweight, counterpoise: what balances the master's privileges"}
          - {w: "carga", d: "load, burden"}
          - {w: "señor", d: "master, lord (of servants)"}
        diagram:
          - s: "contrapeso y carga"
            r: "in apposition to the previous sentence: (that is) a counterweight and burden"
            under:
              - {s: "que puso la naturaleza y la costumbre a los señores", r: "describes 'contrapeso y carga': which nature and custom laid on masters"}
        forms:
          - {w: "puso", f: "pus- + -o → poner (to put, to lay), preterite, it. Irregular preterite: puse, pusiste, puso, pusimos, pusisteis, pusieron. Singular although it has two subjects, 'la naturaleza y la costumbre', taken as one force; the subjects follow the verb."}
      - es: "Duerme el criado, y está velando el señor, pensando cómo le ha de sustentar, mejorar y hacer mercedes."
        literal: "Sleeps the servant, and is keeping-watch the master, thinking how him he-has to support, to-better and to-do favours."
        ormsby: "The servant sleeps and the master lies awake thinking how he is to feed him, advance him, and reward him."
        vocab:
          - {w: "criado", d: "servant"}
          - {w: "velar", d: "to stay awake, keep watch"}
          - {w: "sustentar", d: "to feed, maintain, support"}
          - {w: "mejorar", d: "to better, advance (someone's position)"}
          - {w: "hacer mercedes", d: "to grant favours, reward (with gifts, posts, land)"}
        diagram:
          - {s: "Duerme el criado", r: "main verb 1: the servant sleeps"}
          - s: "y está velando el señor"
            r: "main verb 2: and the master lies awake"
            under:
              - s: "pensando"
                r: "how: thinking"
                under:
                  - {s: "cómo le ha de sustentar, mejorar y hacer mercedes", r: "what he thinks: how he is to feed him, advance him and reward him"}
        forms:
          - {w: "Duerme", f: "duerm- + -e → dormir (to sleep), present, he (the servant). The stem o becomes ue when stressed: duermo, duermes, duerme, dormimos, dormís, duermen. The verb comes before its subject."}
          - {w: "está velando", f: "est- + -á → estar (to be), present, he: estoy, estás, está, estamos, estáis, están; + velando, gerund of velar (to stay awake): the progressive, 'is lying awake'."}
          - {w: "pensando", f: "pens- + -ando → pensar (to think), gerund: 'thinking'."}
          - {w: "le ha de sustentar", f: "h- + -a → haber (to have), present, he: he, has, ha, hemos, habéis, han; 'haber de' + infinitive = must, is to: 'how he is to feed him'. sustentar (to feed), mejorar (to better) and hacer (to do) are the three infinitives after it. 'le' (him, the servant) is leísmo, 'le' for a male person as object, and serves as 'to him' with 'hacer mercedes'."}
      - es: "La congoja de ver que el cielo se hace de bronce sin acudir a la tierra con el conveniente rocío no aflige al criado, sino al señor, que ha de sustentar en la esterilidad y hambre al que le sirvió en la fertilidad y abundancia."
        literal: "The anguish of seeing that the sky itself makes of bronze without coming to the earth with the fitting dew not afflicts [to] the servant, but [to] the master, who has to support in the barrenness and hunger [to] him who him served in the fertility and abundance."
        ormsby: "The distress of seeing the sky turn brazen, and withhold its needful moisture from the earth, is not felt by the servant but by the master, who in time of scarcity and famine must support him who has served him in times of plenty and abundance.”"
        vocab:
          - {w: "congoja", d: "anguish, distress"}
          - {w: "hacerse de bronce", d: "to turn to bronze: of the sky, to give no rain (a biblical image, Deuteronomy 28:23)"}
          - {w: "acudir a", d: "to come to the aid of, attend to"}
          - {w: "conveniente", d: "fitting, needed (false friend: not 'convenient')"}
          - {w: "rocío", d: "dew; here rain, moisture in general"}
          - {w: "afligir", d: "to afflict, distress"}
          - {w: "esterilidad", d: "barrenness; a year of failed harvests"}
        diagram:
          - s: "no aflige al criado, sino al señor"
            r: "main verb: afflicts not the servant but the master"
            under:
              - s: "La congoja de ver"
                r: "subject: the anguish of seeing"
                under:
                  - {s: "que el cielo se hace de bronce", r: "what one sees: that the sky turns to bronze"}
                  - {s: "sin acudir a la tierra con el conveniente rocío", r: "how: without bringing the earth the rain it needs"}
              - s: "que ha de sustentar"
                r: "describes 'señor': who must feed"
                under:
                  - {s: "en la esterilidad y hambre", r: "when: in barren years and famine"}
                  - {s: "al que le sirvió en la fertilidad y abundancia", r: "whom: the one who served him in fat years and plenty"}
        forms:
          - {w: "se hace", f: "hac- + -e → hacer (to make) with 'se': hacerse (to become), present, it (the sky). hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "acudir", f: "acudir (to come to the aid), infinitive after 'sin' (without)."}
          - {w: "aflige", f: "aflig- + -e → afligir (to afflict), present, it (the anguish). The present of -ir verbs: -o, -es, -e, -imos, -ís, -en (g becomes j before o: aflijo)."}
          - {w: "al", f: "a + el. The 'a' marks a person as direct object (personal a): 'al criado', 'al señor', 'al que'."}
          - {w: "ha de sustentar", f: "h- + -a → haber (to have), present, he: he, has, ha, hemos, habéis, han; 'haber de' + infinitive = must: 'who must feed'. sustentar (to feed) is the infinitive."}
          - {w: "sirvió", f: "sirv- + -ió → servir (to serve), preterite, he. The e of the stem becomes i in the he and they forms: serví, serviste, sirvió, servimos, servisteis, sirvieron."}
        note: "The sermon on master and servant turns the usual complaint on its head: the master, not the servant, bears the cares. In a bad year the good master must feed the servants he kept in good years, as patriarchal ideals of the household required."
  - sentences:
      - es: "A todo esto no respondió Sancho, porque dormía, ni despertara tan presto si don Quijote con el cuento de la lanza no le hiciere volver en sí."
        literal: "To all this not answered Sancho, because he-was-sleeping, nor would-he-have-woken so soon if Don Quijote with the butt of the lance not him had-made to-return into himself."
        ormsby: "To all this Sancho made no reply because he was asleep, nor would he have wakened up so soon as he did had not Don Quixote brought him to his senses with the butt of his lance."
        vocab:
          - {w: "presto", d: "soon, quickly (literary)"}
          - {w: "cuento", d: "here the butt, the metal-capped lower end of a lance (not 'story')"}
          - {w: "volver en sí", d: "to come to one's senses, come round"}
        diagram:
          - s: "no respondió Sancho"
            r: "main verb 1: Sancho did not answer"
            under:
              - {s: "A todo esto", r: "to what: to all this"}
              - {s: "porque dormía", r: "why: because he was asleep"}
          - s: "ni despertara tan presto"
            r: "main verb 2: nor would he have woken so soon"
            under:
              - {s: "si don Quijote con el cuento de la lanza no le hiciere volver en sí", r: "condition: if Don Quijote had not brought him round with the butt of his lance"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "dormía", f: "dorm- + -ía → dormir (to sleep), imperfect, he: 'he was sleeping'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "despertara", f: "despert- + -ara → despertar (to wake), imperfect subjunctive (-ra form), he, used as a past conditional: 'would have woken'. The -ra form of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran. In Cervantes the -ra form often does the work of 'habría despertado'."}
          - {w: "hiciere", f: "hic- + -iere → hacer (to make), future subjunctive, he. Irregular, built on the preterite hicieron: hiciere, hicieres, hiciere, hiciéremos, hiciereis, hicieren. The future subjunctive is normally for open future conditions; here, oddly, for a past one, where modern Spanish would say 'si no le hubiera hecho'."}
          - {w: "le", f: "'him' (Sancho) as object of 'hiciere': leísmo, 'le' for a male person, normal in Cervantes."}
          - {w: "volver", f: "volver (to return), infinitive after 'hacer' (to make someone do): 'made him come round'."}
      - es: "Despertó, en fin, soñoliento y perezoso, y, volviendo el rostro a todas partes, dijo:"
        literal: "He-woke, in the-end, sleepy and lazy, and, turning the face to all parts, he-said:"
        ormsby: "He awoke at last, drowsy and lazy, and casting his eyes about in every direction, observed,"
        vocab:
          - {w: "en fin", d: "at last, finally"}
          - {w: "soñoliento", d: "sleepy, drowsy"}
          - {w: "perezoso", d: "lazy, sluggish"}
          - {w: "rostro", d: "face"}
          - {w: "a todas partes", d: "in every direction"}
        diagram:
          - s: "Despertó"
            r: "main verb 1: he woke"
            under:
              - {s: "en fin", r: "when: at last"}
              - {s: "soñoliento y perezoso", r: "how: sleepy and sluggish"}
          - s: "dijo:"
            r: "main verb 2 (after 'y'): he said"
            under:
              - {s: "volviendo el rostro a todas partes", r: "how: turning his face in every direction"}
        forms:
          - {w: "Despertó", f: "despert- + -ó → despertar (to wake), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "soñoliento y perezoso", f: "masculine singular to match Sancho; soñoli- + -ento and perez- + -oso are adjective suffixes ('full of sleep', 'full of laziness')."}
          - {w: "volviendo", f: "volv- + -iendo → volver (to turn), gerund: 'turning'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— De la parte desta enramada, si no me engaño, sale un tufo y olor harto más de torreznos asados que de juncos y tomillos: bodas que por tales olores comienzan, para mi santiguada que deben de ser abundantes y generosas."
        literal: "— From the direction of-this bower, if not myself I-deceive, comes-out a whiff and smell a-good-deal more of rashers roasted than of rushes and thymes: weddings that with such smells begin, by my sign-of-the-cross that they-must be abundant and generous."
        ormsby: "“There comes, if I don’t mistake, from the quarter of that arcade a steam and a smell a great deal more like fried rashers than galingale or thyme; a wedding that begins with smells like that, by my faith, ought to be plentiful and unstinting.”"
        vocab:
          - {w: "desta", d: "= de esta, of this (old contraction)"}
          - {w: "enramada", d: "bower, arbour of branches: the roofed-over meadow Camacho built for the wedding"}
          - {w: "engañarse", d: "to be mistaken; 'si no me engaño' = if I'm not mistaken"}
          - {w: "tufo", d: "whiff, waft of smell or steam (often unpleasant; here welcome)"}
          - {w: "harto", d: "a good deal, very (old intensifier)"}
          - {w: "torrezno", d: "rasher of bacon, fried or roasted"}
          - {w: "juncos y tomillos", d: "rushes and thyme: the sweet herbs strewn on the ground at feasts"}
          - {w: "para mi santiguada", d: "by my faith, upon my word (literally 'by my crossing of myself')"}
          - {w: "deber de", d: "must (probability): 'deben de ser' = they must be"}
          - {w: "generoso", d: "lavish, plentiful (of a feast)"}
        diagram:
          - s: "sale un tufo y olor"
            r: "main verb 1: there comes a whiff and smell"
            under:
              - {s: "De la parte desta enramada", r: "from where: from the direction of this bower"}
              - {s: "si no me engaño", r: "aside: if I'm not mistaken"}
              - {s: "harto más de torreznos asados que de juncos y tomillos", r: "describes 'tufo y olor': much more of roast bacon than of rushes and thyme"}
          - s: "para mi santiguada que deben de ser abundantes y generosas"
            r: "main verb 2: by my faith, they must be plentiful and lavish"
            under:
              - s: "bodas"
                r: "subject, put first: weddings"
                under:
                  - {s: "que por tales olores comienzan", r: "describes 'bodas': that begin with such smells"}
        forms:
          - {w: "desta", f: "de + esta (this), run together, feminine to match 'enramada'; modern 'de esta'."}
          - {w: "me engaño", f: "engañ- + -o → engañarse (to be mistaken), present, I, with 'me'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "sale", f: "sal- + -e → salir (to come out), present, it. salgo, sales, sale, salimos, salís, salen."}
          - {w: "asados", f: "as- + -ados → asar (to roast), participle used as an adjective, masculine plural to match 'torreznos'."}
          - {w: "comienzan", f: "comienz- + -an → comenzar (to begin), present, they (the weddings). The stem e becomes ie when stressed: comienzo, comienzas, comienza, comenzamos, comenzáis, comienzan."}
          - {w: "deben de ser", f: "deb- + -en → deber (must), present, they: debo, debes, debe, debemos, debéis, deben; 'deber de' + infinitive gives a guess: 'they must be'. ser (to be) is the infinitive."}
          - {w: "que deben", f: "'que' after an oath ('para mi santiguada que deben') just introduces the statement; leave it untranslated."}
        note: "Rushes and sweet herbs were strewn on floors and grounds for festivities to give a fresh smell. Sancho's nose prefers bacon. Ormsby's 'galingale' (a sedge) renders 'juncos', rushes."
  - sentences:
      - es: "— Acaba, glotón —dijo don Quijote—; ven, iremos a ver estos desposorios, por ver lo que hace el desdeñado Basilio."
        literal: "— Finish, glutton —said Don Quijote—; come, we-will-go to see these nuptials, for to-see that which does the scorned Basilio."
        ormsby: "“Have done, thou glutton,” said Don Quixote; “come, let us go and witness this bridal, and see what the rejected Basilio does.”"
        vocab:
          - {w: "acabar", d: "to finish; 'acaba' = enough, have done"}
          - {w: "glotón", d: "glutton"}
          - {w: "desposorios", d: "betrothal, wedding (the ceremony of the vows)"}
          - {w: "desdeñado", d: "scorned, rejected (in love)"}
          - {w: "Basilio", d: "the poor village lad who has loved Quiteria since childhood (Chapter XIX)"}
        diagram:
          - {s: "Acaba, glotón", r: "main verb 1: have done, glutton"}
          - {s: "dijo don Quijote", r: "speech tag: said Don Quijote"}
          - {s: "ven", r: "main verb 2: come"}
          - s: "iremos a ver estos desposorios"
            r: "main verb 3: we shall go and see this wedding"
            under:
              - s: "por ver lo"
                r: "why: to see what"
                under:
                  - {s: "que hace el desdeñado Basilio", r: "describes 'lo': what the rejected Basilio does"}
        forms:
          - {w: "Acaba", f: "acab- + -a → acabar (to finish), imperative, you (tú): 'have done!'. The tú imperative is the same as the he/she present: acaba."}
          - {w: "ven", f: "venir (to come), irregular imperative, you (tú): 'come!'. Other short tú imperatives: ten, pon, sal, haz, di."}
          - {w: "iremos", f: "ir- + -emos → ir (to go), future, we. The future adds endings to the whole infinitive: iré, irás, irá, iremos, iréis, irán. 'ir a' + infinitive = go and do."}
          - {w: "estos", f: "est- + -os → este (this), masculine plural to match 'desposorios'."}
          - {w: "hace", f: "hac- + -e → hacer (to do), present, he. hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "desdeñado", f: "desdeñ- + -ado → desdeñar (to scorn), participle used as an adjective, masculine to match 'Basilio'."}
  - sentences:
      - es: "— Mas que haga lo que quisiere —respondió Sancho—: no fuera él pobre y casárase con Quiteria."
        literal: "— Let-him that he-do that which he-may-wish —answered Sancho—: not were he poor and would-have-married-himself with Quiteria."
        ormsby: "“Let him do what he likes,” returned Sancho; “be he not poor, he would marry Quiteria."
        vocab:
          - {w: "mas que", d: "let him, for all I care: 'mas que' + subjunctive shrugs off what follows"}
          - {w: "no fuera él pobre", d: "had he not been poor, he shouldn't have been poor: a condition with no 'si'"}
          - {w: "casarse con", d: "to marry (someone)"}
          - {w: "Quiteria", d: "'Quiteria the fair', the rich farmer's daughter who is to marry Camacho (Chapter XIX)"}
        diagram:
          - s: "Mas que haga lo"
            r: "main verb 1: let him do what"
            under:
              - {s: "que quisiere", r: "describes 'lo': whatever he likes"}
          - {s: "respondió Sancho", r: "speech tag: answered Sancho"}
          - s: "y casárase con Quiteria"
            r: "main verb 2: and he would have married Quiteria"
            under:
              - {s: "no fuera él pobre", r: "condition (no 'si'): had he not been poor"}
        forms:
          - {w: "haga", f: "hag- + -a → hacer (to do), present subjunctive, he: 'let him do'. haga, hagas, haga, hagamos, hagáis, hagan."}
          - {w: "quisiere", f: "quis- + -iere → querer (to want), future subjunctive, he: 'whatever he may want'. Built on the preterite quisieron: quisiere, quisieres, quisiere, quisiéremos, quisiereis, quisieren. Cervantes uses the future subjunctive after 'lo que', 'si', 'donde' for an open future; modern Spanish uses the present subjunctive 'quiera'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), he: 'had he not been'. fuera, fueras, fuera, fuéramos, fuerais, fueran. With the verb put first and no 'si', it states a condition."}
          - {w: "casárase", f: "cas- + -ara + se → casarse (to marry), imperfect subjunctive (-ra form), he, with 'se' stuck on the end; modern 'se casara' or 'se habría casado'. The -ra form of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran; here used as a conditional, 'he would have married'. Cervantes hangs the pronoun on a verb that opens its clause."}
        note: "Sancho's meaning is ironic: being poor, Basilio has only himself to blame. Basilio's rejection for poverty was the subject of Chapter XIX."
      - es: "¿No hay más sino tener un cuarto y querer alzarse por las nubes?"
        literal: "Not is-there more but to-have a farthing and to-want to-raise-oneself through the clouds?"
        ormsby: "To make a grand match for himself, and he without a farthing; is there nothing else?"
        vocab:
          - {w: "no hay más sino", d: "is that all there is to it? is it just a matter of (doing this)?"}
          - {w: "cuarto", d: "a copper coin worth four maravedís, a farthing: 'tener un cuarto' = to have next to nothing"}
          - {w: "alzarse por las nubes", d: "to rise up to the clouds, aim far above one's station"}
        diagram:
          - s: "¿No hay más sino"
            r: "main verb: is there no more to it than"
            under:
              - {s: "tener un cuarto", r: "1: having a farthing"}
              - {s: "y querer alzarse por las nubes?", r: "2: and wanting to rise up to the clouds"}
        forms:
          - {w: "hay", f: "hay, 'there is', the impersonal present of haber (to have). 'No hay más sino' = there is nothing more than."}
          - {w: "tener, querer", f: "tener (to have) and querer (to want), infinitives used as nouns after 'sino': 'having a farthing and wanting'."}
          - {w: "alzarse", f: "alzar (to raise) + se (oneself), the pronoun hung on the infinitive after 'querer': 'to raise oneself'."}
      - es: "A la fe, señor, yo soy de parecer que el pobre debe de contentarse con lo que hallare, y no pedir cotufas en el golfo."
        literal: "By the faith, sir, I am of opinion that the poor-man must content-himself with that which he-may-find, and not to-ask-for earth-almonds in the gulf."
        ormsby: "Faith, señor, it’s my opinion the poor man should be content with what he can get, and not go looking for dainties in the bottom of the sea."
        ormsby_note: "Proverb 60."
        vocab:
          - {w: "a la fe", d: "faith!, upon my word (a mild oath)"}
          - {w: "ser de parecer", d: "to be of the opinion"}
          - {w: "deber de", d: "here 'ought to, should' (Cervantes does not always keep 'deber de' for probability)"}
          - {w: "contentarse con", d: "to be content with, make do with"}
          - {w: "pedir cotufas en el golfo", d: "proverb: to ask for the impossible; 'cotufas' are tiny edible tubers (earth-almonds) or titbits, 'golfo' the open sea"}
