          - {w: "rendir", d: "to subdue, make surrender"}
          - {w: "cautivar", d: "to take captive (and, punningly, to captivate)"}
        diagram:
          - s: "Llegó el Interés"
            r: "main verb 1: Interest came up"
            under:
              - {s: "con las figuras de su valía", r: "with whom: with the characters of his party"}
