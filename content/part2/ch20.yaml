                under:
                  - {s: "que tenía gentil caletre para semejantes invenciones", r: "describes 'beneficiado': who had a fine head for such shows"}
        forms:
          - {w: "Respondióle", f: "respond- + -ió + le → responder (to answer), preterite, she, with 'le' (to him, Don Quijote) stuck on the end; modern 'le respondió'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron. Cervantes hangs the pronoun on a verb that opens the sentence."}
          - {w: "aquel", f: "'that', masculine to match 'pueblo'; 'aquel' points to something farther off than 'ese'."}
          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "semejantes", f: "semejante (such) with plural -s to match 'invenciones'."}
        note: "The verb is left out after 'que': '(it was) a beneficed cleric'. Village priests and clerics often wrote the verses for local festivals and church plays."
  - sentences:
      - es: "— Yo apostaré —dijo don Quijote— que debe de ser más amigo de Camacho que de Basilio el tal bachiller o beneficiado, y que debe de tener más de satírico que de vísperas: ¡bien ha encajado en la danza las habilidades de Basilio y las riquezas de Camacho!"
        literal: "— I will-bet —said Don Quijote— that must be more friend of Camacho than of Basilio the such bachelor or beneficed-cleric, and that he-must have more of satirist than of vespers: well he-has fitted in the dance the talents of Basilio and the riches of Camacho!"
        ormsby: "“I will lay a wager,” said Don Quixote, “that the same bachelor or beneficiary is a greater friend of Camacho’s than of Basilio’s, and that he is better at satire than at vespers; he has introduced the accomplishments of Basilio and the riches of Camacho very neatly into the dance.”"
        vocab:
          - {w: "apostar", d: "to bet, wager; 'yo apostaré que' = I'll bet that"}
          - {w: "deber de", d: "must (probability): 'debe de ser' = he must be, he is probably"}
          - {w: "el tal", d: "the said, this same (person just mentioned), slightly scornful"}
          - {w: "bachiller", d: "bachelor, holder of the lowest university degree; also a know-all"}
          - {w: "beneficiado", d: "beneficed cleric: a priest who holds a church living (a 'beneficio') and its income"}
          - {w: "tener más de ... que de", d: "to have more of ... than of, to be more of a ... than a"}
          - {w: "satírico", d: "satirist, writer of mocking verses"}
          - {w: "vísperas", d: "vespers, the evening office a cleric must sing; 'more satirist than vespers' = better at mockery than at his priestly duties"}
          - {w: "encajar", d: "to fit in, slip in neatly"}
          - {w: "habilidades", d: "talents, accomplishments (Basilio's running, wrestling, fencing)"}
        diagram:
          - s: "Yo apostaré"
            r: "main verb: I will bet"
            under:
              - {s: "dijo don Quijote", r: "speech tag: said Don Quijote"}
              - s: "que debe de ser más amigo de Camacho que de Basilio"
                r: "what I bet, 1: that he must be more Camacho's friend than Basilio's"
                under:
                  - {s: "el tal bachiller o beneficiado", r: "subject of 'debe de ser': this bachelor or beneficed priest"}
              - {s: "y que debe de tener más de satírico que de vísperas", r: "what I bet, 2: that he is more a satirist than a singer of vespers"}
          - s: "¡bien ha encajado"
            r: "main verb 2 (exclamation): how neatly he has fitted in"
            under:
              - {s: "en la danza", r: "where: into the dance"}
              - {s: "las habilidades de Basilio y las riquezas de Camacho", r: "object: Basilio's talents and Camacho's riches"}
        forms:
          - {w: "apostaré", f: "apostar- + -é → apostar (to bet), future, I: 'I will bet'. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "debe de ser", f: "deb- + -e → deber (must), present, he; + de + ser (to be): 'he must be', a guess. The present of -er verbs: -o, -es, -e, -emos, -éis, -en. 'deber de' + infinitive gives probability."}
          - {w: "debe de tener", f: "deb- + -e → deber (must), present, he, + de + tener (to have): 'he must have'. Same -er present: debo, debes, debe, debemos, debéis, deben."}
          - {w: "el tal", f: "tal (such) with the article: 'the said, this same', pointing back at the beneficed priest the nymph mentioned."}
          - {w: "ha encajado", f: "ha → haber (to have), present, he: he, has, ha, hemos, habéis, han; + encajado, participle of encajar (to fit in): the present perfect, 'he has fitted in'."}
        note: "Don Quijote sees the dance as propaganda: Camacho's wealth (Interest) carries off the lady, while Basilio's gifts (Poetry, Wit, Valour) lose. A cleric writing masques for a rich man's wedding is his target."
