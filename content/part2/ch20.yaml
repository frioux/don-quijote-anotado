      - es: "y en el fuego donde se había de asar ardía un mediano monte de leña, y seis ollas que alrededor de la hoguera estaban no se habían hecho en la común turquesa de las demás ollas, porque eran seis medias tinajas, que cada una cabía un rastro de carne:"
