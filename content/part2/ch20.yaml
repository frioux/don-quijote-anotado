  - sentences:
      - es: "— El rey es mi gallo: a Camacho me atengo."
        literal: "— The king is my cock: to Camacho myself I-hold."
        ormsby: "“The king is my cock; I stick to Camacho.”"
        ormsby_note: "El Rey es mi gallo, an exclamation borrowed from cockfighting. The winning cock was called el Rey."
        vocab:
          - {w: "el rey es mi gallo", d: "'the king is my cock', from cockfighting: I back the winner"}
          - {w: "gallo", d: "cock, rooster (here a fighting cock)"}
          - {w: "atenerse a", d: "to stick to, side with, rely on"}
        diagram:
          - s: "El rey es mi gallo:"
            r: "main verb 1: the king is my cock (I back the winner)"
          - s: "a Camacho me atengo"
            r: "main verb 2: I stick to Camacho"
        forms:
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "me atengo", f: "ateng- + -o → atenerse (to stick to), present, I, with 'me' (myself). Built on tener (to have): atengo, atienes, atiene, atenemos, atenéis, atienen. 'a Camacho' is put first for emphasis."}
        note: "Sancho sides with the rich bridegroom simply because he is the likely winner (and the source of the food he is eating)."
  - sentences:
      - es: "— En fin —dijo don Quijote—, bien se parece, Sancho, que eres villano y de aquéllos que dicen: \"¡Viva quien vence!\""
        literal: "— In short —said Don Quijote—, well itself shows, Sancho, that you-are a-peasant and of those who say: \"Long-live who wins!\""
        ormsby: "“It is easy to see thou art a clown, Sancho,” said Don Quixote, “and one of that sort that cry ‘Long life to the conqueror.’ ”"
        vocab:
          - {w: "en fin", d: "in short, well then"}
          - {w: "bien se parece", d: "it is plain to see, it shows (old 'parecerse' = to appear, be evident)"}
          - {w: "villano", d: "peasant, base-born man; hence boor, someone of low mind (not 'villain' in the English sense)"}
          - {w: "¡Viva quien vence!", d: "'long live whoever wins!', the cry of a turncoat who always backs the winner"}
        diagram:
          - s: "bien se parece"
            r: "main verb: it is plain to see"
            under:
              - {s: "En fin", r: "linking: in short"}
              - {s: "dijo don Quijote", r: "speech tag: said Don Quijote"}
              - {s: "Sancho", r: "addressed: Sancho"}
              - s: "que eres villano y de aquéllos"
                r: "what is plain: that you are a peasant and one of those"
                under:
                  - {s: "que dicen: \"¡Viva quien vence!\"", r: "describes 'aquéllos': who say 'long live the winner!'"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "se parece", f: "parec- + -e → parecerse (to appear, be evident), present, it, with 'se'. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (but parezco in the 'I' form)."}
          - {w: "eres", f: "ser (to be), present, you: soy, eres, es, somos, sois, son."}
          - {w: "aquéllos", f: "aquél (that one), masculine plural, a pronoun standing for people: 'those (people)'; the old accent marks it as a pronoun."}
          - {w: "dicen", f: "dic- + -en → decir (to say), present, they. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "Viva", f: "viv- + -a → vivir (to live), present subjunctive, he: 'may he live, long live'. The present subjunctive of -ir verbs: viva, vivas, viva, vivamos, viváis, vivan."}
          - {w: "vence", f: "venc- + -e → vencer (to win), present, he. The present of -er verbs: venzo (c → z before o), vences, vence, vencemos, vencéis, vencen."}
  - sentences:
      - es: "— No sé de los que soy —respondió Sancho—, pero bien sé que nunca de ollas de Basilio sacaré yo tan elegante espuma como es esta que he sacado de las de Camacho."
        literal: "— Not I-know of those that I-am —answered Sancho—, but well I-know that never from pots of Basilio will-take-out I so elegant skimming as is this that I-have taken-out from those of Camacho."
        ormsby: "“I don’t know of what sort I am,” returned Sancho, “but I know very well I’ll never get such elegant skimmings off Basilio’s pots as these I have got off Camacho’s;”"
        vocab:
          - {w: "no sé de los que soy", d: "I don't know which sort I belong to"}
          - {w: "olla", d: "stewpot; also the stew cooked in it"}
          - {w: "espuma", d: "skimmings, scum: the fat and bits skimmed off the top of a stew; here the chickens fished out of the pot"}
          - {w: "elegante", d: "fine, choice (said comically of food)"}
        diagram:
          - s: "No sé"
            r: "main verb 1: I don't know"
            under:
              - {s: "de los que soy", r: "what: which sort I am"}
              - {s: "respondió Sancho", r: "speech tag: answered Sancho"}
          - s: "pero bien sé"
            r: "main verb 2: but I know well"
            under:
              - s: "que nunca de ollas de Basilio sacaré yo tan elegante espuma"
                r: "what I know: that I'll never get such fine skimmings from Basilio's pots"
                under:
                  - s: "como es esta"
                    r: "comparison: as this is"
                    under:
                      - {s: "que he sacado de las de Camacho", r: "describes 'esta': which I've taken from Camacho's"}
        forms:
          - {w: "sé", f: "saber (to know), present, I. Irregular: sé, sabes, sabe, sabemos, sabéis, saben. The accent tells it from 'se' (oneself)."}
          - {w: "soy, es", f: "ser (to be), present: soy is I, es is it. soy, eres, es, somos, sois, son."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "sacaré", f: "sacar- + -é → sacar (to take out), future, I. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án. The subject 'yo' follows the verb for emphasis."}
          - {w: "esta", f: "est- + -a → este (this), feminine to match 'espuma', used as a pronoun: 'this (skimming)'."}
          - {w: "he sacado", f: "he → haber (to have), present, I: he, has, ha, hemos, habéis, han; + sacado, participle of sacar (to take out): the present perfect, 'I have taken out'."}
          - {w: "las de Camacho", f: "las (those), feminine plural to stand for 'ollas': 'those of Camacho', Camacho's pots."}
  - sentences:
      - es: "Y enseñóle el caldero lleno de gansos y de gallinas, y, asiendo de una, comenzó a comer con mucho donaire y gana, y dijo:"
        literal: "And showed-him the bucket full of geese and of hens, and, seizing of one, he-began to eat with much grace and appetite, and said:"
        ormsby: "and he showed him the bucketful of geese and hens, and seizing one began to eat with great gaiety and appetite, saying,"
        vocab:
          - {w: "enseñar", d: "to show (here), not only 'to teach'"}
          - {w: "caldero", d: "bucket, small cauldron (the one the cook filled from the pot)"}
          - {w: "asir de", d: "to seize, grab hold of"}
          - {w: "donaire", d: "grace, wit, gusto"}
          - {w: "gana", d: "appetite, desire"}
        diagram:
          - s: "Y enseñóle"
            r: "main verb 1: and he showed him"
            under:
              - s: "el caldero"
                r: "object: the bucket"
                under:
                  - {s: "lleno de gansos y de gallinas", r: "describes 'caldero': full of geese and hens"}
          - s: "comenzó a comer"
            r: "main verb 2: he began to eat"
            under:
              - {s: "asiendo de una", r: "how: grabbing one (hen)"}
              - {s: "con mucho donaire y gana", r: "how: with great gusto and appetite"}
          - {s: "y dijo:", r: "main verb 3: and said"}
        forms:
          - {w: "enseñóle", f: "enseñ- + -ó + le → enseñar (to show), preterite, he, with 'le' (to him) stuck on the end; modern 'le enseñó'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. Cervantes hangs the pronoun on a verb that opens its clause."}
          - {w: "lleno", f: "llen- + -o → lleno (full), masculine to match 'caldero'."}
          - {w: "asiendo", f: "gerund of asir (to seize): 'grabbing'."}
          - {w: "una", f: "'one', feminine because it stands for 'gallina'."}
          - {w: "comenzó", f: "comenz- + -ó → comenzar (to begin), preterite, he. Same -ar preterite: comencé (z → c before e), comenzaste, comenzó, comenzamos, comenzasteis, comenzaron. 'comenzar a' + infinitive = to begin to."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— ¡A la barba de las habilidades de Basilio!, que tanto vales cuanto tienes, y tanto tienes cuanto vales."
        literal: "— To the beard of the talents of Basilio!, for so-much you-are-worth as-much-as you-have, and so-much you-have as-much-as you-are-worth."
        ormsby: "“A fig for the accomplishments of Basilio! As much as thou hast so much art thou worth, and as much as thou art worth so much hast thou."
        ormsby_note: "Proverb 221."
        vocab:
          - {w: "¡a la barba de ...!", d: "'to the beard of ...!', a defiant toast: here's one in the face of, a fig for"}
          - {w: "habilidades", d: "talents, accomplishments"}
          - {w: "tanto ... cuanto", d: "as much ... as; 'tanto vales cuanto tienes' = you are worth what you have"}
          - {w: "valer", d: "to be worth"}
        diagram:
          - {s: "¡A la barba de las habilidades de Basilio!", r: "exclamation: a fig for Basilio's talents!"}
          - s: "que tanto vales cuanto tienes"
            r: "main verb 1 (after 'que', for): you are worth as much as you have"
          - s: "y tanto tienes cuanto vales"
            r: "main verb 2: and you have as much as you are worth"
        forms:
          - {w: "vales", f: "val- + -es → valer (to be worth), present, you (anyone). Irregular 'I' form: valgo, vales, vale, valemos, valéis, valen."}
          - {w: "tienes", f: "tien- + -es → tener (to have), present, you (anyone). Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "tanto ... cuanto", f: "tanto (so much) and cuanto (as much) stay masculine singular here because they mean an amount, not a noun: 'so much ... as much'."}
        note: "Sancho is gnawing a chicken as he speaks, so the 'toast' is made with Camacho's food. The proverb's 'you' is anyone: a person is worth exactly what he owns."
      - es: "Dos linajes solos hay en el mundo, como decía una agüela mía, que son el tener y el no tener, aunque ella al del tener se atenía;"
        literal: "Two lineages only there-are in the world, as used-to-say a grandmother of-mine, which are the having and the not having, although she to-the [one] of-the having herself held;"
        ormsby: "As a grandmother of mine used to say, there are only two families in the world, the Haves and the Haven’ts; and she stuck to the Haves;"
        ormsby_note: "Proverb 223."
        vocab:
          - {w: "linaje", d: "lineage, family, line of descent"}
          - {w: "agüela", d: "= abuela, grandmother (old and rustic form)"}
          - {w: "el tener y el no tener", d: "'the having and the not having': the haves and the have-nots"}
          - {w: "atenerse a", d: "to stick to, side with"}
        diagram:
          - s: "Dos linajes solos hay en el mundo"
            r: "main verb: there are only two lineages in the world"
            under:
              - {s: "como decía una agüela mía", r: "aside: as a grandmother of mine used to say"}
              - {s: "que son el tener y el no tener", r: "describes 'linajes': which are having and not having"}
              - {s: "aunque ella al del tener se atenía", r: "concession: though she sided with the having"}
        forms:
          - {w: "hay", f: "hay, 'there are', from haber (to have) used impersonally; the same form for singular and plural."}
          - {w: "solos", f: "sol- + -os → solo (only, alone), masculine plural to match 'linajes'."}
          - {w: "decía", f: "dec- + -ía → decir (to say), imperfect, she: 'used to say'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "agüela", f: "old form of abuela (grandmother), with b turned into g before -üe-; 'mía' (of mine) follows the noun."}
          - {w: "son", f: "ser (to be), present, they: soy, eres, es, somos, sois, son."}
          - {w: "el tener, el no tener", f: "infinitives used as nouns with 'el': 'the having, the not having'."}
          - {w: "al del", f: "a + el and de + el, both contracted: 'al del tener' = to the one (lineage) of having."}
          - {w: "se atenía", f: "aten- + -ía → atenerse (to stick to), imperfect, she, with 'se' (herself). Same -ía imperfect: atenía, atenías, atenía, ateníamos, ateníais, atenían."}
      - es: "y el día de hoy, mi señor don Quijote, antes se toma el pulso al haber que al saber:"
        literal: "and the day of today, my lord Don Quijote, rather one takes the pulse to-the having than to-the knowing:"
        ormsby: "and to this day, Señor Don Quixote, people would sooner feel the pulse of ‘Have,’ than of ‘Know;’"
        vocab:
          - {w: "el día de hoy", d: "nowadays, these days"}
          - {w: "antes ... que", d: "rather ... than, sooner ... than"}
          - {w: "tomar el pulso a", d: "to take the pulse of; here to examine, to weigh up (what a man owns rather than what he knows)"}
          - {w: "el haber", d: "property, wealth (as a noun 'haber' = assets); also 'having'"}
          - {w: "el saber", d: "knowledge, learning"}
        diagram:
          - s: "antes se toma el pulso"
            r: "main verb: rather, people take the pulse"
            under:
              - {s: "el día de hoy", r: "when: nowadays"}
              - {s: "mi señor don Quijote", r: "addressed: my lord Don Quijote"}
              - {s: "al haber", r: "of what: of having (wealth)"}
              - {s: "que al saber", r: "comparison: than of knowing"}
        forms:
          - {w: "se toma", f: "tom- + -a → tomar (to take), present, it, with 'se' making it impersonal: 'one takes, people take'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "al haber, al saber", f: "a + el, contracted, before two infinitives used as nouns: haber (to have) → 'having, wealth'; saber (to know) → 'knowing, learning'."}
        note: "The rhyme 'haber'/'saber' was proverbial: in the world's eyes property counts for more than learning, which is the whole question between Camacho and Basilio."
