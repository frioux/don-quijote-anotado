          - {w: "ayudara", f: "ayud- + -ara → ayudar (to help), imperfect subjunctive (-ra form), he, used as a conditional: 'he would have helped'. The -ra imperfect subjunctive of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran. The -ra form often stands for the conditional in Cervantes."}
          - {w: "impidiera", f: "impid- + -iera → impedir (to prevent), imperfect subjunctive (-ra form), it, in the 'if' clause: 'if it had not prevented'. The e of the stem becomes i: impidiera, impidieras, impidiera, impidiéramos, impidierais, impidieran."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son. 'es fuerza' = it is necessary."}
          - {w: "se diga", f: "dig- + -a → decir (to say), present subjunctive, it, with 'se' making it passive: 'that it be told'. Irregular: diga, digas, diga, digamos, digáis, digan. The 'que' after 'es fuerza' is left out, as Cervantes often does."}
        note: "The chapter ends on a cliffhanger, as Cervantes' chapters often do: what interrupts Don Quijote's breakfast is the business of Basilio the poor, promised in the chapter title."
summary: |
  At dawn on the wedding day, after the night in the open fields outside Quiteria's village, Don Quijote rises and finds Sancho still snoring. Before waking him he makes a speech on the happiness of the sleeping servant: no jealousy, no debts, no ambition, no enchanters, because his master carries all his cares, and in a year of drought it is the master who must feed the servant. Sancho, asleep, hears none of it until a poke with the butt of the lance wakes him, and his first words are about the smell of roast bacon drifting from the leafy arbour where the wedding is to be held.

  Don Quijote wants to see what the rejected Basilio will do. Sancho takes Camacho's side: a poor man should be content with what he finds and not ask for impossible delicacies, Quiteria would be a fool to give up Camacho's dresses and jewels for Basilio's skill at throwing the bar and fencing, and the best foundation in the world is money. Don Quijote tells him to stop; Sancho claims that their agreement before this sally let him talk as much as he liked, and Don Quijote denies remembering any such clause.

  In the arbour Sancho sees a whole young bull roasting on an elm-trunk spit, six huge pots made from half wine-jars swallowing whole sheep, trees hung with hares, hens and game, more than sixty skins of wine, walls of bread and cheese, cauldrons of fritters dipped in honey, and over fifty cooks. A cook lets him skim three hens and two geese out of a pot with a bucket and keep the bucket. Meanwhile Don Quijote watches the festivities: twelve peasants riding mares and cheering Camacho and Quiteria, a sword dance by twenty-four lads, a dance of young girls led by an old man and an old woman to the 'gaita zamorana', and an allegorical 'speaking dance' in which Cupid and Interest, each with four nymphs, lay siege to a maiden in the 'Castle of Good Caution'. Love shoots arrows at it, but Interest smashes the castle open with a purse full of money and leads the maiden off in a gold chain, until the wild men make peace and rebuild the castle.

  Don Quijote guesses that the beneficed cleric who invented the dance favours Camacho over Basilio. Sancho declares 'the king is my cock' and sides with Camacho while eating his hens, quoting his grandmother that there are only two families in the world, the haves and the have-nots. When Don Quijote wishes to see him dumb before he dies, Sancho answers with a long, vivid speech on Death, who eats lamb as well as mutton and treads on kings' towers and poor men's huts alike. Don Quijote says a good preacher could not have said it better; Sancho replies that he preaches well who lives well, and goes back to his bucket with such appetite that he wakes Don Quijote's, who would have joined him but for what the next chapter must tell.
context: |
  A rich peasants' wedding. Camacho is a 'labrador', a wealthy farmer, and the wedding is his display of money: everything is 'rústico, pero tan abundante que podía sustentar a un ejército'. The food is the food of rural Castile in festival: a whole steer roasted with sucking-pigs sewn into its belly for tenderness, mutton and hens stewed in pots, 'frutas de sartén' (fritters) plunged in honey, white bread, cheese, wine in goatskins of more than two 'arrobas' each (an arroba of wine was roughly sixteen litres). Ormsby notes that the 'tinajas' used to store wine in La Mancha could be seven or eight feet high, so six half-tinajas were stewpots of a giant's kitchen. The expression 'las bodas de Camacho' became proverbial in Spanish for a lavish feast. Sancho sees all this as the true measure of a man's worth.

  Love against money. The chapter's argument is played out three times. Sancho argues it in proverbs: Basilio's running, bar-throwing and fencing are 'habilidades y gracias que no son vendibles', and he quotes his grandmother's two lineages, 'el tener y el no tener'. Ormsby notes that the 'Conde Dirlos', hero of a Carolingian ballad and brother of Durandarte, had become a byword like the Marquis of Carabas. Then the masque says it in allegory: a 'danza hablada', a dance with spoken verses, in which Cupid leads Poetry, Wit, Good Lineage and Valour, and Interest leads Liberality, Gift, Treasure and Peaceful Possession, both besieging a maiden in the 'Castillo del buen recato', the castle of good caution or modesty. Interest breaks it open with a purse made from the skin of a 'gato romano', a tabby cat (cat-skin purses were common, and 'gato' could mean a money-bag). Don Quijote reads it at once as propaganda for Camacho by its author, a 'beneficiado', a cleric living on a church benefice, who is better at satire than at singing vespers. Sancho's 'El rey es mi gallo' is, Ormsby explains, from cockfighting, where the winning cock was called 'the king'.

  Festival dances. Ormsby notes that the sword dance was so dangerous that it was in time prohibited, which makes the mare-rider's question whether anyone has been wounded, and the leader's cheerful 'todos vamos sanos', less of a joke than it looks. The girls dance to the 'gaita zamorana', the 'pipe of Zamora', which Ormsby renders as a bagpipe, though many commentators take it to be a hurdy-gurdy. The wild men dressed in ivy and green-dyed hemp who pull the castle are a stock figure of court and town pageants. Throughout, Cervantes stages the scenes through his two characters' eyes: Sancho sees only the food, Don Quijote only the dances and the honour of Dulcinea, whom these villagers have plainly never seen.

  Sleep and Death. Don Quijote's address to the sleeping Sancho belongs to a long tradition of praising the humble man's untroubled sleep against the cares of the great, and it opens with a mock-epic dawn in which Aurora dries the pearls of dew from Phoebus' golden hair. Sancho's answer about Death draws on stock images of the pulpit: the curate's 'con igual pie pisaba las altas torres de los reyes como las humildes chozas de los pobres' is Horace's 'pale Death knocks with equal foot at poor men's huts and kings' towers' (Odes I.4), and Death as a reaper who never takes a siesta and cuts green grass and dry alike was a commonplace of sermons. Don Quijote's 'el principio de la sabiduría el temor de Dios' quotes the Bible (Psalm 111 and Proverbs 9): the fear of the Lord is the beginning of wisdom. Sancho's last line, that idle words must be accounted for in the next life, echoes Matthew 12:36. Ormsby lists four of Sancho's sayings by number in his catalogue of the book's proverbs: 'pedir cotufas en el golfo', 'tanto vales cuanto tienes', 'dos linajes solos hay en el mundo' and 'bien predica quien bien vive'. His 'aguachirle', Ormsby notes, is properly a vile wine made from the washings of the winepress.

  Master and squire. Sancho claims that before this third sally Don Quijote agreed to let him say whatever he liked, provided it was not against his neighbour or his master's authority; Don Quijote does not remember the clause. The bargaining between them in Part II, Chapter VII was about wages, and the quarrel about Sancho's talking has run since Part I. Don Quijote's praise of Sancho's speech on Death ('lo que pudiera decir un buen predicador') is one more sign that the squire's rustic wit is growing, while the narrator ends the chapter on a promise, 'lo que es fuerza se diga adelante', keeping Basilio offstage.

  Reading Cervantes' Spanish. Archaisms in this chapter: invidia and invidiado (envidia), contina (continua), estienden and estremo (extienden, extremo), encantamentos (encantamientos), desta, deste, dellos, agora (ahora), juridición (jurisdicción), pargamino (pergamino), tranzados (trenzados), mesmo (mismo), agüela (abuela), tologías (teologías), do (donde), 'la fin' for 'el fin', hinche (llena), yerba (hierba), vuesa merced beside vuestra merced, and the old wish 'plega a Dios' (may it please God). Pronouns hang on the end of clause-opening verbs and even on the future (casárase, debiérase, Guiábalas, Hacíales, retiróse, Respondióle, enseñóle, Pusiéronlos, Dígote, Habréla). The cook speaks to Sancho in vos imperatives (Apeaos, mirad, espumad, Esperad, Comed, desayunaos, llevaos), with the d of the ending dropped before 'os'. The -ra form serves as a conditional (fuera, despertara, tomara, espantaran, pudiera, ayudara, impidiera), the future subjunctive marks open conditions (quisiere, hallare, hiciere), and 'haber de' gives obligation or future (has de hacer, ha de sustentar, he de ser, nos han de pedir cuenta). Watch the shifted meanings and idioms: discreción (wit), caletre (brains), honestidad (modesty), gentil (fine, graceful), regocijo (festivity), pedir cotufas en el golfo (ask for the impossible), a la barba de (a fig for), mascar barro (to be dead and buried), tenerse en buenas (to quit while ahead), and cada hijo de vecino (anybody at all).
