          - {w: "Tente", f: "ten + te → tenerse (to hold oneself), imperative, you, with 'te' stuck on the end, as pronouns always are on a positive command. tener (to have, hold) has the short imperative 'ten' (like pon, ven, sal)."}
          - {w: "no te dejes", f: "dej- + -es → dejarse (to let oneself), present subjunctive, you, with 'te': a negative command uses the present subjunctive, with the pronoun before the verb. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
