          - {w: "tinte", d: "dye-works, dyer's shop, where cloth was boiled in huge vats"}
          - {w: "servir de", d: "to serve as, be used for; here 'servían de freír' = were used for frying"}
          - {w: "cosas de masa", d: "things made of dough: fritters, pastries (the 'frutas de sartén')"}
          - {w: "valiente", d: "here 'huge, mighty, splendid' (of things), not 'brave'"}
          - {w: "pala", d: "shovel, flat scoop"}
          - {w: "zabullir", d: "= zambullir, to plunge, dip (old form)"}
          - {w: "allí junto", d: "close by there, right next to it"}
        diagram:
          - s: "los quesos ... formaban una muralla"
            r: "main clause 1: the cheeses formed a wall"
            under:
              - {s: "puestos como ladrillos enrejados", r: "how: stacked like open brickwork"}
          - s: "dos calderas de aceite ... servían de freír cosas de masa"
            r: "main clause 2 (after 'y'): two cauldrons of oil were used for frying dough-things"
            under:
              - {s: "mayores que las de un tinte", r: "describes 'calderas': bigger than a dyer's vats"}
              - s: "que con dos valientes palas las sacaban fritas"
                r: "describes 'cosas de masa': which they took out fried with two huge shovels"
                under:
                  - s: "y las zabullían en otra caldera de preparada miel"
                    r: "and which they plunged into another cauldron of prepared honey"
                    under:
                      - {s: "que allí junto estaba", r: "describes 'caldera': which stood right next to it"}
        forms:
          - {w: "puestos", f: "irregular participle of poner (to put, place), masculine plural to match 'quesos': 'placed'."}
          - {w: "enrejados", f: "enrej- + -ados → enrejar (to lattice), participle used as an adjective, masculine plural to match 'ladrillos'."}
          - {w: "formaban", f: "form- + -aban → formar (to form), imperfect, they (the cheeses). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "mayores", f: "plural of mayor (bigger), the irregular comparative of grande (big), plural to match 'calderas'; 'mayores que' = bigger than."}
          - {w: "las de un tinte", f: "las = 'those', feminine plural standing for 'calderas': 'those of a dye-works'."}
          - {w: "servían", f: "serv- + -ían → servir (to serve), imperfect, they (the cauldrons). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "freír", f: "freír (to fry), infinitive after 'de'; its irregular participle is 'frito'."}
          - {w: "sacaban, zabullían", f: "sac- + -aban → sacar (to take out), imperfect, they (the cooks, unnamed): -aba, -abas, -aba, -ábamos, -abais, -aban. zabull- + -ían → zabullir (to plunge), imperfect, they: -ía, -ías, -ía, -íamos, -íais, -ían. 'que ... las sacaban' = which they took out: Cervantes repeats the object as 'las' after the relative 'que', a loose, spoken construction."}
          - {w: "fritas", f: "irregular participle of freír (to fry), feminine plural to match 'las' (the dough-things): 'fried'."}
          - {w: "preparada", f: "prepar- + -ada → preparar (to prepare), participle used as an adjective, feminine to match 'miel' (honey is feminine)."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, it (the cauldron). Same -aba imperfect as 'formaban'. The verb comes last in its clause."}
        note: "Fritters dipped in honey ('frutas de sartén' with 'miel') were the typical festive sweet of Spanish country weddings and holidays."
