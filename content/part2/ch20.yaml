        forms:
          - {w: "Llegó", f: "lleg- + -ó → llegar (to arrive, come up), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (llegué, with g → gu before e). The subject 'el Interés' comes after."}
          - {w: "echándola", f: "gerund of echar (to throw) + la (on her), accent added to keep the stress on -chán-. 'la' as an indirect object ('to her, around her neck') is laísmo; standard Spanish says 'echándole'."}
          - {w: "gran", f: "grande (great) clipped before a singular noun ('cadena')."}
          - {w: "mostraron", f: "mostr- + -aron → mostrar (to show), preterite, they (Interest and his party; the verb turns plural after the singular 'Llegó'). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "prenderla, rendirla y cautivarla", f: "three infinitives after 'mostraron', each with 'la' (her) hung on the end: prender (to seize), rendir (to subdue), cautivar (to take captive)."}
        note: "A gold chain was a typical rich wedding gift, and here it doubles as a captive's chain: the bride is bought."
