          - {w: "venir a mano", d: "to come to hand, turn up"}
          - {w: "venir al pie", d: "Sancho's joke on 'a mano': even if they come only to the foot, i.e. hardly at all"}
          - {w: "aguachirle", d: "slop, thin watery wine made from the washings of the winepress; anything insipid"}
