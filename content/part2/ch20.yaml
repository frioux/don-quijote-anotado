          - {w: "Dígote", f: "dig- + -o + te → decir (to say), present, I, with 'te' (to you) stuck on the end; modern 'te digo'. Irregular: digo, dices, dice, decimos, decís, dicen. Cervantes hangs the pronoun on a verb that opens its sentence."}
          - {w: "tienes", f: "tien- + -es → tener (to have), present, you. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "pudieras", f: "pud- + -ieras → poder (to be able), imperfect subjunctive (-ra form), you, used as a conditional: 'you could'. Irregular: pudiera, pudieras, pudiera, pudiéramos, pudierais, pudieran."}
          - {w: "irte", f: "ir (to go) + te (yourself): irse, 'to go off', infinitive after 'pudieras' with the pronoun hung on the end."}
