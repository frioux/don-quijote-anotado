  - sentences:
      - es: "— ¡Oh canalla! —gritó a esta sazón Sancho— ¡Oh encantadores aciagos y malintencionados, y quién os viera a todos ensartados por las agallas, como sardinas en lercha!"
        literal: "— Oh rabble! —shouted at this moment Sancho— Oh enchanters ill-omened and ill-intentioned, and who you might-see [to] all strung-through by the gills, like sardines on [a] twig!"
        ormsby: "“O scum of the earth!” cried Sancho at this, “O miserable, spiteful enchanters! O that I could see you all strung by the gills, like sardines on a twig!"
        vocab:
          - {w: "canalla", d: "rabble, riff-raff, scum (a collective insult; in modern Spanish also 'a swine', of one person)"}
          - {w: "a esta sazón", d: "at this moment, at this point"}
          - {w: "aciago", d: "ill-omened, ill-fated, baleful"}
          - {w: "malintencionado", d: "spiteful, ill-intentioned"}
          - {w: "¡quién + -ra subjunctive!", d: "'if only I could ...!': '¡quién os viera!' = oh to see you!, would that I could see you"}
          - {w: "ensartar", d: "to string, thread (beads, or fish on a stick)"}
          - {w: "agallas", d: "gills (of a fish); the same word also means oak galls, which Sancho uses two sentences later"}
          - {w: "lercha", d: "a thin rush or twig on which fishermen string fish through the gills to carry them"}
        diagram:
          - {s: "¡Oh canalla!", r: "exclamation 1: oh, you rabble!"}
          - {s: "—gritó a esta sazón Sancho—", r: "speech tag: Sancho shouted at this point"}
          - s: "¡Oh encantadores aciagos y malintencionados"
            r: "exclamation 2: oh, baleful, spiteful enchanters"
          - s: "y quién os viera a todos ensartados"
            r: "wish: and oh to see you all strung up"
            under:
              - {s: "por las agallas", r: "how: through the gills"}
              - {s: "como sardinas en lercha", r: "like what: like sardines on a twig"}
        forms:
          - {w: "gritó", f: "grit- + -ó → gritar (to shout), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "malintencionados", f: "mal (badly) + intencionado (intentioned), masculine plural to match 'encantadores'."}
          - {w: "viera", f: "vi- + -era → ver (to see), imperfect subjunctive (-ra form), he ('quién', who), in the wish '¡quién viera!' = 'who might see!', i.e. 'if only I could see'. The -ra form: viera, vieras, viera, viéramos, vierais, vieran."}
          - {w: "os", f: "'you', object pronoun for vosotros (you all), the plural familiar Sancho uses to the enchanters."}
          - {w: "ensartados", f: "participle of ensartar (to string), masculine plural to match 'os ... todos'."}
