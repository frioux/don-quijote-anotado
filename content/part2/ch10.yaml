          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun ('jumento'), like un, buen, ningún."}
          - {w: "se le haya perdido", f: "hay- + -a → haber (to have), present subjunctive, it, + perdido, participle of perder (to lose): 'may have got lost'. haber (to have) in the present subjunctive: haya, hayas, haya, hayamos, hayáis, hayan. 'se le' = 'got lost on him', the Spanish way of saying a thing was lost by someone without his meaning to."}
        note: "A sly joke: in Part I Sancho lost his ass (stolen by Ginés de Pasamonte) and went looking for it, so this would be a natural errand for him."
