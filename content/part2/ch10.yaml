        forms:
          - {w: "Apartóse", f: "apart- + -ó + se → apartarse (to move aside), preterite, he, with 'se' stuck on the end; modern 'se apartó'. Cervantes hangs the pronoun on a verb that opens its clause. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "dejóla", f: "dej- + -ó + la → dejar (to let), preterite, he, with 'la' (her) stuck on the end, again because the verb opens its clause after 'y'; modern 'la dejó'. Same -ó preterite."}
