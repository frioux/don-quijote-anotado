          - {w: "acudió", f: "acud- + -ió → acudir (to come running), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "levantarla", f: "levantar (to lift) + la (her), the pronoun hung on the infinitive after 'a'."}
          - {w: "componer, cinchar", f: "componer (to fix) and cinchar (to girth), infinitives after the understood 'acudió a' (ran to)."}
          - {w: "el albarda", f: "'el' before a feminine noun starting with a-, an older usage; modern 'la albarda' (now 'el' is kept only before a stressed a-, as in 'el agua')."}
          - {w: "vino", f: "vin- + -o → venir (to come), preterite, it. Irregular: vine, viniste, vino, vinimos, vinisteis, vinieron."}
      - es: "Acomodada, pues, la albarda, y quiriendo don Quijote levantar a su encantada señora en los brazos sobre la jumenta, la señora, levantándose del suelo, le quitó de aquel trabajo, porque, haciéndose algún tanto atrás, tomó una corridica, y, puestas ambas manos sobre las ancas de la pollina, dio con su cuerpo, más ligero que un halcón, sobre la albarda, y quedó a horcajadas, como si fuera hombre; y entonces dijo Sancho:"
        literal: "Settled, then, the packsaddle, and wanting Don Quijote to-lift his enchanted lady in the arms onto the she-ass, the lady, raising-herself from-the ground, him relieved of that labour, because, making-herself some-little back, she-took a little-run, and, placed both hands on the haunches of-the young-she-ass, she-gave with her body, more light than a falcon, onto the packsaddle, and remained astride, as if she-were man; and then said Sancho:"
        ormsby: "The packsaddle being secured, as Don Quixote was about to lift up his enchanted mistress in his arms and put her upon her beast, the lady, getting up from the ground, saved him the trouble, for, going back a little, she took a short run, and putting both hands on the croup of the ass she dropped into the saddle more lightly than a falcon, and sat astride like a man, whereat Sancho said,"
        vocab:
          - {w: "acomodar", d: "to settle, adjust, put in place"}
          - {w: "quiriendo", d: "= queriendo, wanting (old or rustic spelling)"}
          - {w: "jumenta", d: "she-ass"}
          - {w: "quitar de un trabajo", d: "to spare someone a task, save him the trouble"}
          - {w: "algún tanto", d: "a little, somewhat"}
          - {w: "hacerse atrás", d: "to step back"}
          - {w: "corridica", d: "a short run (diminutive of 'corrida' with the -ico/-ica ending common in Aragon and La Mancha)"}
          - {w: "ancas", d: "haunches, hindquarters, rump"}
          - {w: "dar con su cuerpo sobre", d: "to land, throw oneself onto"}
          - {w: "halcón", d: "falcon"}
          - {w: "a horcajadas", d: "astride, with a leg on each side, as men rode; ladies rode sideways"}
        diagram:
          - s: "le quitó de aquel trabajo"
            r: "main verb 1: she spared him that trouble"
            under:
              - {s: "Acomodada, pues, la albarda", r: "when: the packsaddle being fixed, then"}
              - s: "y quiriendo don Quijote levantar a su encantada señora"
                r: "when 2: and as Don Quijote wanted to lift his enchanted lady"
                under:
                  - {s: "en los brazos sobre la jumenta", r: "how and where: in his arms onto the donkey"}
              - s: "la señora"
                r: "subject: the lady"
                under:
                  - {s: "levantándose del suelo", r: "how: getting up from the ground"}
              - s: "tomó una corridica"
                r: "why 1 (after 'porque'): she took a little run"
                under:
                  - {s: "haciéndose algún tanto atrás", r: "how: stepping back a little"}
              - s: "dio con su cuerpo"
                r: "why 2: she landed her body"
                under:
                  - {s: "puestas ambas manos sobre las ancas de la pollina", r: "how: with both hands placed on the donkey's rump"}
                  - {s: "más ligero que un halcón", r: "describes 'cuerpo': lighter than a falcon"}
                  - {s: "sobre la albarda", r: "where: onto the packsaddle"}
              - s: "y quedó a horcajadas"
                r: "why 3: and sat astride"
                under:
                  - {s: "como si fuera hombre", r: "how: as if she were a man"}
          - {s: "y entonces dijo Sancho:", r: "main verb 2: and then Sancho said"}
        forms:
          - {w: "Acomodada", f: "acomod- + -ada → acomodar (to adjust), participle, feminine to match 'albarda', in an absolute construction: 'the packsaddle being adjusted'."}
          - {w: "quiriendo", f: "old spelling of queriendo, the gerund of querer (to want): 'as he was wanting'. Its subject 'don Quijote' comes after it."}
          - {w: "encantada", f: "encant- + -ada → encantar (to enchant), participle, feminine to match 'señora'."}
          - {w: "levantándose", f: "gerund of levantarse (to get up), with 'se' on the end and an accent added to keep the stress."}
          - {w: "quitó", f: "quit- + -ó → quitar (to take away), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "haciéndose", f: "gerund of hacer (to make) + se, accent added: 'hacerse atrás' = to step back."}
          - {w: "tomó, quedó", f: "tom- + -ó → tomar (to take) and qued- + -ó → quedar (to remain), preterite, she. Same -ó preterite."}
          - {w: "corridica", f: "corrida (a run) + -ica, a diminutive: 'a little run'."}
          - {w: "puestas", f: "irregular participle of poner (to put), feminine plural to match 'manos', in an absolute construction: 'both hands placed'."}
          - {w: "ambas", f: "ambos (both), feminine to match 'manos'."}
          - {w: "dio", f: "d- + -io → dar (to give), preterite, she. Irregular: di, diste, dio, dimos, disteis, dieron. 'dar con' = to land, throw."}
          - {w: "ligero", f: "masculine to match 'cuerpo', not the woman."}
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), she. Irregular: fuera, fueras, fuera, fuéramos, fuerais, fueran. 'como si' (as if) always takes the imperfect subjunctive."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
        note: "Women of rank rode sideways on a cushioned saddle; a village girl vaulting astride like a man is a final blow to the illusion, which Sancho at once turns into praise."
  - sentences:
      - es: "— ¡Vive Roque, que es la señora nuestra ama más ligera que un acotán, y que puede enseñar a subir a la jineta al más diestro cordobés o mejicano!"
        literal: "— Lives Roque, that is the lady our mistress more light than a falcon, and that she-can teach to mount at the jineta[-style] to-the most skilful Cordovan or Mexican!"
        ormsby: "“Roque! but our lady is lighter than a lanner, and might teach the cleverest Cordovan or Mexican how to mount;"
        ormsby_note: "An obscure oath, of which there is no satisfactory explanation as to who or what Roque was, whether the San Roque who gave the name to the town near Gibraltar, or some Manchegan celebrity."
        vocab:
          - {w: "¡Vive Roque!", d: "a mild oath, 'by Roque!', on the pattern of '¡Vive Dios!' (as God lives); who Roque was is unclear (perhaps Saint Roch)"}
          - {w: "nuestra ama", d: "our mistress, the lady we serve; 'ama' is the mistress of the house, of a servant"}
          - {w: "ligero", d: "light, nimble, quick"}
          - {w: "acotán", d: "a kind of falcon (also 'alcotán'), the hobby or lanner, small and very fast"}
          - {w: "subir", d: "here 'to mount, ride' a horse"}
          - {w: "a la jineta", d: "in the jineta style: short stirrups, knees bent high, the light-cavalry seat Spain learnt from the Moors; the opposite is 'a la brida', long-legged"}
          - {w: "diestro", d: "skilful, expert (literally 'right-handed')"}
          - {w: "cordobés o mejicano", d: "a man from Córdoba or from Mexico, both famous for horsemanship"}
        diagram:
          - s: "¡Vive Roque"
            r: "oath: by Roque!"
          - s: "que es la señora nuestra ama más ligera que un acotán"
            r: "what he swears, 1: our lady is nimbler than a falcon"
          - s: "y que puede enseñar a subir a la jineta"
            r: "what he swears, 2: and she could teach riding in the jineta style"
            under:
              - {s: "al más diestro cordobés o mejicano", r: "to whom: to the most skilful horseman of Córdoba or Mexico"}
        forms:
          - {w: "Vive", f: "viv- + -e → vivir (to live), present, he: 'lives', used in oaths like '¡Vive Dios!' = 'as God lives'. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "es", f: "ser (to be), present, she. ser (to be) is irregular: soy, eres, es, somos, sois, son. The subject 'la señora nuestra ama' follows the verb."}
          - {w: "más ligera que", f: "ligero (light) + -a, feminine to match 'señora'; 'más ... que' makes the comparison 'lighter than'."}
          - {w: "puede", f: "pued- + -e → poder (to be able), present, she. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "enseñar a subir", f: "enseñar (to teach) + a + subir (to mount): 'teach [someone] to ride'; the person taught is marked with 'a' ('al más diestro'), so two 'a's sit side by side."}
          - {w: "al", f: "a + el, the contraction modern Spanish still makes."}
          - {w: "más diestro", f: "el más diestro = 'the most skilful': with the article, 'más' makes the superlative."}
        note: "Sancho is improvising wildly to keep up the fiction: a peasant girl vaulting astride onto a donkey becomes a horsewoman fit to teach the riders of Córdoba and the New World. Andalusian and Mexican horsemen were both proverbial for their skill."
      - es: "El arzón trasero de la silla pasó de un salto, y sin espuelas hace correr la hacanea como una cebra."
        literal: "The saddle-bow rear of the saddle she-passed with one jump, and without spurs she-makes run the hackney like a zebra."
        ormsby: "she cleared the back of the saddle in one jump, and without spurs she is making the hackney go like a zebra;"
        vocab:
          - {w: "arzón", d: "saddle-bow, the raised front or back of a saddle; 'arzón trasero' = the cantle, the back rise"}
          - {w: "de un salto", d: "in one leap"}
          - {w: "espuelas", d: "spurs"}
          - {w: "hacanea", d: "hackney, a small, well-paced riding horse, a lady's mount"}
          - {w: "cebra", d: "zebra; in Cervantes' time also a kind of wild ass of Spain, proverbially swift"}
        diagram:
          - s: "pasó"
            r: "main verb 1: she cleared"
            under:
              - {s: "El arzón trasero de la silla", r: "object, put first: the back of the saddle"}
              - {s: "de un salto", r: "how: in one leap"}
          - s: "y sin espuelas hace correr la hacanea"
            r: "main verb 2: and without spurs she makes the hackney run"
            under:
              - {s: "como una cebra", r: "how: like a zebra"}
        forms:
          - {w: "trasero", f: "tras- + -ero → trasero (back, rear), masculine to match 'arzón'; from 'tras' (behind) with the suffix -ero."}
          - {w: "pasó", f: "pas- + -ó → pasar (to pass, to clear), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "hace correr", f: "hac- + -e → hacer (to make), present, she, + correr (to run): 'makes [it] run'. hacer (to make, do) in the present: hago, haces, hace, hacemos, hacéis, hacen. 'hacer' + infinitive is the Spanish causative."}
        note: "Sancho slips from the past ('pasó') to the present ('hace correr') as he watches the girl gallop off. The 'cebra' of old Spanish was a fleet wild ass of the peninsula, so the comparison is less exotic than it sounds and, for a donkey, more apt."
      - es: "Y no le van en zaga sus doncellas; que todas corren como el viento."
        literal: "And not to-her they-go in rear her damsels; for all run like the wind."
        ormsby: "and her damsels are no way behind her, for they all fly like the wind;”"
        vocab:
          - {w: "no ir en zaga", d: "not to fall behind, to be every bit as good; 'zaga' = the rear"}
          - {w: "doncellas", d: "damsels, ladies-in-waiting"}
          - {w: "que", d: "here 'for, since', giving the reason"}
        diagram:
          - s: "Y no le van en zaga"
            r: "main verb: and they are not behind her"
            under:
              - {s: "sus doncellas", r: "subject: her damsels"}
              - {s: "que todas corren como el viento", r: "why: for all of them run like the wind"}
        forms:
          - {w: "le", f: "'to her', the indirect object: 'no le van en zaga' = they do not trail behind her."}
          - {w: "van", f: "ir (to go), present, they. ir (to go) is irregular: voy, vas, va, vamos, vais, van."}
          - {w: "sus doncellas", f: "sus = plural to match 'doncellas', not the owner: 'her damsels'."}
          - {w: "corren", f: "corr- + -en → correr (to run), present, they. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
  - sentences:
      - es: "Y así era la verdad, porque, en viéndose a caballo Dulcinea, todas picaron tras ella y dispararon a correr, sin volver la cabeza atrás por espacio de más de media legua."
        literal: "And so was the truth, because, on seeing-herself on horse Dulcinea, all spurred after her and shot-off to run, without turning the head back for space of more than half a league."
        ormsby: "which was the truth, for as soon as they saw Dulcinea mounted, they pushed on after her, and sped away without looking back, for more than half a league."
        vocab:
          - {w: "así era la verdad", d: "and that was the truth: the narrator confirms Sancho's last words"}
          - {w: "en + gerund", d: "'en viéndose' = as soon as she saw herself; 'en' before a gerund means 'the moment that'"}
          - {w: "a caballo", d: "mounted, in the saddle (of any beast, here a donkey)"}
          - {w: "picar", d: "to spur, prod (a mount); 'picaron tras ella' = they urged their beasts after her"}
          - {w: "disparar a correr", d: "to dash off, bolt; 'disparar' = to shoot, let fly"}
          - {w: "por espacio de", d: "for a distance of, for the space of"}
          - {w: "legua", d: "league, about 5.5 km; half a league is under 3 km"}
        diagram:
          - s: "Y así era la verdad"
            r: "main verb 1: and that was the truth"
            under:
              - s: "porque"
                r: "why: because"
                under:
                  - {s: "en viéndose a caballo Dulcinea", r: "when: the moment Dulcinea was mounted"}
                  - s: "todas picaron tras ella"
                    r: "what happened 1: they all spurred after her"
                  - s: "y dispararon a correr"
                    r: "what happened 2: and dashed off"
                    under:
                      - {s: "sin volver la cabeza atrás", r: "how: without looking back"}
                      - {s: "por espacio de más de media legua", r: "how far: for more than half a league"}
        forms:
          - {w: "era", f: "er- + -a → ser (to be), imperfect, it. ser (to be) is irregular in the imperfect: era, eras, era, éramos, erais, eran."}
          - {w: "viéndose", f: "gerund of ver (to see) + se (herself), accent added to keep the stress: 'seeing herself'. After 'en' it means 'as soon as'."}
          - {w: "picaron", f: "pic- + -aron → picar (to spur), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "dispararon", f: "dispar- + -aron → disparar (to shoot off), preterite, they. Same -aron preterite."}
          - {w: "volver", f: "infinitive of volver (to turn) after 'sin' (without): Spanish uses the infinitive where English uses '-ing'."}
          - {w: "media", f: "medio (half) + -a, feminine to match 'legua'; no article: 'media legua' = half a league."}
      - es: "Siguiólas don Quijote con la vista, y, cuando vio que no parecían, volviéndose a Sancho, le dijo:"
        literal: "Followed-them Don Quijote with the sight, and, when he-saw that not they-appeared, turning-himself to Sancho, to-him he-said:"
        ormsby: "Don Quixote followed them with his eyes, and when they were no longer in sight, he turned to Sancho and said,"
        vocab:
          - {w: "seguir con la vista", d: "to follow with one's eyes"}
          - {w: "parecer", d: "here the old sense 'to appear, be in sight' (modern 'aparecer'); 'no parecían' = they were no longer to be seen"}
          - {w: "volverse a", d: "to turn towards"}
        diagram:
          - s: "Siguiólas don Quijote"
            r: "main verb 1: Don Quijote followed them"
            under:
              - {s: "con la vista", r: "how: with his eyes"}
          - s: "le dijo:"
            r: "main verb 2 (after 'y'): he said to him"
            under:
              - {s: "cuando vio que no parecían", r: "when: when he saw they were out of sight"}
              - {s: "volviéndose a Sancho", r: "how: turning to Sancho"}
        forms:
          - {w: "Siguiólas", f: "sigu- + -ió + las → seguir (to follow), preterite, he, with 'las' (them, the girls) stuck on the end; modern 'las siguió'. Cervantes hangs the pronoun on a verb that opens the clause. seguir in the preterite: seguí, seguiste, siguió, seguimos, seguisteis, siguieron (e becomes i in the he and they forms)."}
          - {w: "vio", f: "vi- + -o → ver (to see), preterite, he. ver (to see) in the preterite: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "parecían", f: "parec- + -ían → parecer (to appear), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "volviéndose", f: "gerund of volver (to turn) + se (himself), accent added: 'turning himself'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
