          - {w: "tristes y confusas", f: "triste (sad) is the same for both genders; confus- + -as → confuso (confused), feminine plural to match 'imaginaciones'."}
          - {w: "dejaremos", f: "dejar- + -emos → dejar (to leave), future, we. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
