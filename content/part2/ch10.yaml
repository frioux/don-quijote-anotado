      - es: "Dígolo porque si esta noche no hallamos los palacios o alcázares de mi señora, agora que es de día los pienso hallar, cuando menos los piense, y hallados, déjenme a mí con ella."
        literal: "I-say-it because if this night not we-found the palaces or castles of my lady, now that it-is of day them I-intend to-find, when least them I-may-think, and found, let-me to me with her."
        ormsby: "I say this because, if we could not find my lady’s palaces or castles tonight, now that it is daylight I count upon finding them when I least expect it, and once found, leave it to me to manage her.”"
        vocab:
          - {w: "esta noche", d: "here 'last night', the night just past"}
          - {w: "alcázar", d: "fortified royal palace, castle (from Arabic al-qasr)"}
          - {w: "ser de día", d: "to be daytime, be light"}
          - {w: "pensar + infinitive", d: "to intend to, expect to"}
          - {w: "cuando menos lo piense", d: "when I least expect it"}
          - {w: "déjenme a mí con ella", d: "leave her to me, I will deal with her"}
        diagram:
          - s: "Dígolo"
            r: "main verb 1: I say it"
            under:
              - s: "porque ... los pienso hallar"
                r: "why: because I expect to find them"
                under:
                  - {s: "si esta noche no hallamos los palacios o alcázares de mi señora", r: "condition: if we did not find my lady's palaces or castles last night"}
                  - {s: "agora que es de día", r: "when: now that it is daylight"}
                  - {s: "cuando menos los piense", r: "when, 2: when I least expect them"}
          - s: "déjenme a mí con ella"
            r: "main verb 2 (after 'y'): leave me to deal with her"
            under:
              - {s: "hallados", r: "when: once they are found"}
        forms:
          - {w: "Dígolo", f: "dig- + -o + lo → decir (to say), present, I, with 'lo' (it) stuck on the end and an accent added: modern 'lo digo'. Irregular: digo, dices, dice, decimos, decís, dicen. Cervantes hangs the pronoun on a verb that opens the sentence."}
          - {w: "hallamos", f: "hall- + -amos → hallar (to find), preterite, we: 'we found'. In -ar verbs the 'we' form is the same in present and preterite; 'esta noche' (last night) shows it is past. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "es", f: "ser (to be), present, it: 'es de día', it is day. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "pienso", f: "piens- + -o → pensar (to intend), present, I. The stem e becomes ie when stressed: pienso, piensas, piensa, pensamos, pensáis, piensan."}
          - {w: "piense", f: "piens- + -e → pensar (to think), present subjunctive, I: subjunctive after 'cuando' for a future moment. piense, pienses, piense, pensemos, penséis, piensen."}
          - {w: "hallados", f: "participle of hallar (to find), masculine plural to match 'palacios o alcázares', used on its own as a clause: 'once found'."}
          - {w: "déjenme", f: "dej- + -en + me → dejar (to let, leave), present subjunctive, they / you all, with 'me' stuck on the end: 'leave me'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. Sancho uses the plural loosely, as in a set phrase."}
        note: "The night before, master and squire wandered through dark El Toboso and found the church instead of Dulcinea's palace. Sancho, who has never seen Dulcinea, already has a plan."
  - sentences:
      - es: "— Por cierto, Sancho —dijo don Quijote—, que siempre traes tus refranes tan a pelo de lo que tratamos cuanto me dé Dios mejor ventura en lo que deseo."
        literal: "— Certainly, Sancho —said Don Quijote—, that always you-bring your proverbs as to-the hair of that-which we-treat as-much-as to-me may-give God better fortune in that-which I-desire."
        ormsby: "“Verily, Sancho,” said Don Quixote, “thou dost always bring in thy proverbs happily, whatever we deal with; may God give me better luck in what I am anxious about.”"
        vocab:
          - {w: "por cierto", d: "certainly, truly"}
          - {w: "refrán", d: "proverb, saying"}
          - {w: "a pelo", d: "to the point, apt (literally 'with the grain of the hair')"}
          - {w: "tratar", d: "to discuss, deal with"}
          - {w: "tan ... cuanto me dé Dios", d: "an oath-like comparison: 'as (surely) as I hope God gives me': your proverbs are as apt as I wish my luck to be good"}
        diagram:
          - s: "siempre traes tus refranes"
            r: "main verb: you always bring in your proverbs"
            under:
              - {s: "Por cierto, Sancho", r: "how: certainly, Sancho (the 'que' after the speech tag just picks this up)"}
              - s: "tan a pelo de lo que tratamos"
                r: "how: so apt to what we are discussing"
                under:
                  - s: "cuanto me dé Dios mejor ventura"
                    r: "comparison as a wish: as (I hope) God gives me better luck"
                    under:
                      - {s: "en lo que deseo", r: "in what: in what I long for"}
          - {s: "dijo don Quijote", r: "speech tag: Don Quijote said"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "traes", f: "tra- + -es → traer (to bring), present, you. Irregular in the I form: traigo, traes, trae, traemos, traéis, traen."}
          - {w: "tus", f: "plural to match 'refranes', not the owner: 'your'."}
          - {w: "tratamos", f: "trat- + -amos → tratar (to discuss), present, we. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "dé", f: "dar (to give), present subjunctive, he (God), in a wish: 'may God give'. dé, des, dé, demos, deis, den; the accent tells it from 'de' (of)."}
          - {w: "deseo", f: "dese- + -o → desear (to desire), present, I. Same -ar present: deseo, deseas, desea, deseamos, deseáis, desean."}
  - sentences:
      - es: "Esto dicho, volvió Sancho las espaldas y vareó su rucio, y don Quijote se quedó a caballo, descansando sobre los estribos y sobre el arrimo de su lanza, lleno de tristes y confusas imaginaciones, donde le dejaremos, yéndonos con Sancho Panza, que no menos confuso y pensativo se apartó de su señor que él quedaba;"
        literal: "This said, turned Sancho the shoulders and beat his grey, and Don Quijote himself remained on horse, resting on the stirrups and on the prop of his lance, full of sad and confused imaginings, where him we-shall-leave, going-off-ourselves with Sancho Panza, who not less confused and pensive himself parted from his lord than he remained;"
        ormsby: "With this, Sancho wheeled about and gave Dapple the stick, and Don Quixote remained behind, seated on his horse, resting in his stirrups and leaning on the end of his lance, filled with sad and troubled forebodings; and there we will leave him, and accompany Sancho, who went off no less serious and troubled than he left his master;"
        vocab:
          - {w: "esto dicho", d: "this said, with that"}
          - {w: "volver las espaldas", d: "to turn one's back, turn away"}
          - {w: "varear", d: "to beat with a stick (vara)"}
          - {w: "rucio", d: "grey (of an animal); 'el rucio' is Sancho's donkey, Ormsby's 'Dapple'"}
          - {w: "estribo", d: "stirrup"}
          - {w: "arrimo", d: "prop, support; here the butt of the lance he leans on"}
          - {w: "imaginaciones", d: "thoughts, fancies, imaginings"}
          - {w: "pensativo", d: "thoughtful, pensive"}
          - {w: "apartarse de", d: "to move away from, leave"}
        diagram:
