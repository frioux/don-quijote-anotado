                              - {s: "y las manadas de carneros ejércitos de enemigos", r: "what he said, 3: and the flocks of sheep enemy armies"}
                              - {s: "y otras muchas cosas a este tono", r: "what he said, 4: and many other things of the kind"}
              - s: "hacerle creer"
                r: "subject: to make him believe"
                under:
