part: 2
chapter: 10
title_es: "Capítulo X. Donde se cuenta la industria que Sancho tuvo para encantar a la señora Dulcinea, y de otros sucesos tan ridículos como verdaderos"
title_en: "Wherein is related the crafty device Sancho adopted to enchant the lady Dulcinea, and other incidents as ludicrous as they are true"
paragraphs:
  - sentences:
      - es: "Llegando el autor desta grande historia a contar lo que en este capítulo cuenta, dice que quisiera pasarle en silencio, temeroso de que no había de ser creído, porque las locuras de don Quijote llegaron aquí al término y raya de las mayores que pueden imaginarse, y aun pasaron dos tiros de ballesta más allá de las mayores."
        literal: "Arriving the author of-this great history at telling that-which in this chapter he-tells, he-says that he-would-have-wished to-pass-it in silence, fearful of that not he-was-going to be believed, because the madnesses of Don Quijote reached here to-the limit and line of the greatest that can imagine-themselves, and even they-passed two shots of crossbow more beyond of the greatest."
        ormsby: "[Ormsby omits this paragraph here: in the first editions it opens this chapter, but he moves it to the beginning of Chapter XVII, where he thought it belonged.]"
        ormsby_match: false
        ormsby_note: "In the original editions this chapter begins with the words which will be found at the beginning of Chapter XVII. As Hartzenbusch points out, they are quite out of place here."
        vocab:
          - {w: "desta", d: "= de esta, of this (old contraction)"}
          - {w: "grande", d: "great; before a noun modern Spanish clips it to 'gran', Cervantes often keeps the full form"}
          - {w: "pasar en silencio", d: "to pass over in silence, leave out"}
          - {w: "temeroso de que", d: "afraid that"}
          - {w: "haber de", d: "to be going to, have to: 'no había de ser creído' = he would not be believed"}
          - {w: "locura", d: "madness; in the plural, mad acts"}
          - {w: "término y raya", d: "limit and boundary line, the furthest point"}
          - {w: "tiro de ballesta", d: "a crossbow-shot, used as a measure of distance (a couple of hundred paces)"}
        diagram:
          - s: "dice"
            r: "main verb: he (the author) says"
            under:
              - {s: "Llegando el autor desta grande historia a contar lo que en este capítulo cuenta", r: "when: the author, reaching the point of telling what this chapter tells"}
              - {s: "que quisiera pasarle en silencio", r: "what he says: that he would have liked to leave it out"}
              - {s: "temeroso de que no había de ser creído", r: "how: afraid he would not be believed"}
              - s: "porque las locuras de don Quijote llegaron aquí al término y raya de las mayores"
                r: "why: because Don Quijote's mad acts here reached the limit of the greatest"
                under:
                  - {s: "que pueden imaginarse", r: "describes 'las mayores': that can be imagined"}
              - {s: "y aun pasaron dos tiros de ballesta más allá de las mayores", r: "why, 2: and even went two crossbow-shots beyond the greatest"}
        forms:
          - {w: "Llegando", f: "lleg- + -ando → llegar (to arrive), gerund: 'arriving, reaching'; its subject 'el autor' follows it."}
          - {w: "desta", f: "= de + esta, the old contraction of 'de' with the demonstrative; modern Spanish writes 'de esta'."}
          - {w: "cuenta", f: "cuent- + -a → contar (to tell), present, it (the chapter). The stem o becomes ue when stressed: cuento, cuentas, cuenta, contamos, contáis, cuentan."}
          - {w: "dice", f: "dic- + -e → decir (to say), present, he. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "quisiera", f: "quis- + -iera → querer (to want), imperfect subjunctive (-ra form), he, used as a conditional: 'he would have liked'. quisiera, quisieras, quisiera, quisiéramos, quisierais, quisieran."}
          - {w: "pasarle", f: "pasar (to pass) + le, 'to pass it over'; 'le' stands for the thing told, where modern Spanish would use 'lo' (pasarlo). Pronouns hang on the end of an infinitive."}
          - {w: "había de ser creído", f: "hab- + -ía → haber (to have), imperfect, he: había, habías, había, habíamos, habíais, habían; 'haber de' + infinitive = to be going to. 'ser creído' = to be believed: ser (to be) + creído, the participle of creer (to believe), making a passive."}
          - {w: "llegaron, pasaron", f: "lleg- + -aron → llegar (to arrive) and pas- + -aron → pasar (to pass), preterite, they (the mad acts). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "mayores", f: "plural of mayor (greater); with 'las' = 'the greatest' (feminine to match 'locuras')."}
          - {w: "pueden imaginarse", f: "pued- + -en → poder (to be able), present, they: puedo, puedes, puede, podemos, podéis, pueden; + imaginarse, imaginar (to imagine) with 'se' making it passive: 'that can be imagined'."}
        note: "The 'author' is Cide Hamete Benengeli, the Arab historian Cervantes pretends to translate. Here he worries that Don Quijote's madness in this chapter is too great to be believed."
      - es: "Finalmente, aunque con este miedo y recelo, las escribió de la misma manera que él las hizo, sin añadir ni quitar a la historia un átomo de la verdad, sin dársele nada por las objeciones que podían ponerle de mentiroso."
        literal: "Finally, although with this fear and misgiving, them he-wrote in the same manner that he them did, without adding nor removing from the history an atom of the truth, without giving-itself-to-him nothing for the objections that they-could put-on-him of liar."
        ormsby: "[Ormsby omits this paragraph here: in the first editions it opens this chapter, but he moves it to the beginning of Chapter XVII.]"
        ormsby_match: false
        vocab:
          - {w: "recelo", d: "misgiving, suspicion, fear"}
          - {w: "añadir ni quitar", d: "to add or take away"}
          - {w: "átomo", d: "atom, the smallest particle: 'not one jot'"}
          - {w: "no dársele nada por", d: "not to care at all about; 'sin dársele nada' = without caring a straw"}
          - {w: "poner de mentiroso", d: "to brand as a liar, call a liar"}
        diagram:
          - s: "las escribió"
            r: "main verb: he wrote them (the mad acts)"
            under:
              - {s: "Finalmente", r: "linking: in the end"}
              - {s: "aunque con este miedo y recelo", r: "concession: though with this fear and misgiving"}
              - s: "de la misma manera"
                r: "how: in the same way"
                under:
                  - {s: "que él las hizo", r: "describes 'manera': that he (Don Quijote) did them"}
              - {s: "sin añadir ni quitar a la historia un átomo de la verdad", r: "how, 2: without adding or removing a jot of the truth"}
              - s: "sin dársele nada por las objeciones"
                r: "how, 3: not caring about the objections"
                under:
                  - {s: "que podían ponerle de mentiroso", r: "describes 'objeciones': that could brand him a liar"}
        forms:
          - {w: "las", f: "'them', feminine plural to stand for 'las locuras' (the mad acts) of the previous sentence; placed before the verb."}
          - {w: "escribió", f: "escrib- + -ió → escribir (to write), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "hizo", f: "hiz- + -o → hacer (to do), preterite, he. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "añadir, quitar", f: "añadir (to add) and quitar (to take away), infinitives after 'sin' (without): Spanish uses the infinitive where English uses '-ing'."}
          - {w: "dársele", f: "dar (to give) + se + le, infinitive after 'sin', with both pronouns hung on the end: 'without it mattering to him'. In 'no dársele nada a uno' the 'se' is impersonal and 'le' is the person who does not care."}
          - {w: "podían", f: "pod- + -ían → poder (to be able), imperfect, they (the objections). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "ponerle", f: "poner (to put) + le (on him), infinitive after 'podían'; 'poner a uno de mentiroso' = to call someone a liar."}
          - {w: "mentiroso", f: "mient- → mentir (to lie) + -oso, the adjective/noun 'liar'."}
      - es: "Y tuvo razón, porque la verdad adelgaza y no quiebra, y siempre anda sobre la mentira como el aceite sobre el agua."
        literal: "And he-had reason, because the truth grows-thin and not breaks, and always goes over the lie like the oil over the water."
        ormsby: "[Ormsby omits this paragraph here: in the first editions it opens this chapter, but he moves it to the beginning of Chapter XVII.]"
        ormsby_match: false
        vocab:
          - {w: "tener razón", d: "to be right"}
          - {w: "la verdad adelgaza y no quiebra", d: "proverb: truth may wear thin but never breaks"}
          - {w: "adelgazar", d: "to grow thin, wear thin"}
          - {w: "quebrar", d: "to break, snap"}
          - {w: "andar sobre", d: "to float on top of, stay above"}
          - {w: "como el aceite sobre el agua", d: "proverbial: truth always comes to the top like oil on water"}
        diagram:
          - s: "Y tuvo razón"
            r: "main verb: and he was right"
            under:
              - s: "porque la verdad adelgaza y no quiebra"
                r: "why: because truth wears thin but does not break"
                under:
                  - s: "y siempre anda sobre la mentira"
                    r: "why, 2: and it always stays above the lie"
                    under:
                      - {s: "como el aceite sobre el agua", r: "how: as oil stays on top of water"}
        forms:
          - {w: "tuvo", f: "tuv- + -o → tener (to have), preterite, he. Irregular: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron."}
          - {w: "adelgaza", f: "adelgaz- + -a → adelgazar (to grow thin), present, it (the truth). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "quiebra", f: "quiebr- + -a → quebrar (to break), present, it. The stem e becomes ie when stressed: quiebro, quiebras, quiebra, quebramos, quebráis, quiebran."}
          - {w: "anda", f: "and- + -a → andar (to go, walk), present, it. Regular -ar present: ando, andas, anda, andamos, andáis, andan."}
        note: "Two proverbs about truth, strung together. The narrator stresses the 'truth' of the history just before the chapter's great piece of deception."
  - sentences:
      - es: "Y así, prosiguiendo su historia, dice que, así como don Quijote se emboscó en la floresta, encinar o selva junto al gran Toboso, mandó a Sancho volver a la ciudad, y que no volviese a su presencia sin haber primero hablado de su parte a su señora, pidiéndola fuese servida de dejarse ver de su cautivo caballero, y se dignase de echarle su bendición, para que pudiese esperar por ella felicísimos sucesos de todos sus acometimientos y dificultosas empresas."
        literal: "And so, continuing his history, he-says that, as-soon-as Don Quijote hid-himself-in-the-wood in the forest, oak-grove or wood next to-the great Toboso, he-ordered to Sancho to-return to the city, and that not he-should-return to his presence without having first spoken on his behalf to his lady, asking-her [that] she-might-be pleased to let-herself see by her captive knight, and might-deign to cast-on-him her blessing, so that he-might hope through it most-happy outcomes of all his assaults and difficult enterprises."
        ormsby: "The history relates that as soon as Don Quixote had ensconced himself in the forest, oak grove, or wood near El Toboso, he bade Sancho return to the city, and not come into his presence again without having first spoken on his behalf to his lady, and begged of her that it might be her good pleasure to permit herself to be seen by her enslaved knight, and deign to bestow her blessing upon him, so that he might thereby hope for a happy issue in all his encounters and difficult enterprises."
        vocab:
          - {w: "proseguir", d: "to go on, continue (a story)"}
          - {w: "así como", d: "as soon as"}
          - {w: "emboscarse", d: "to hide in a wood (bosque); also to lie in ambush"}
          - {w: "floresta", d: "forest, woodland (literary)"}
          - {w: "encinar", d: "grove of holm oaks (encinas), the evergreen oak of La Mancha"}
          - {w: "selva", d: "wood, forest (not 'jungle')"}
          - {w: "de su parte", d: "on his behalf, in his name"}
          - {w: "ser servido de", d: "to be pleased to, deign to: a courtly formula of request"}
          - {w: "dejarse ver de", d: "to let oneself be seen by; 'de' = by, as often in old Spanish"}
          - {w: "cautivo", d: "captive: the lover as prisoner of his lady, a commonplace of courtly love"}
          - {w: "dignarse de", d: "to deign to"}
          - {w: "echar la bendición", d: "to give one's blessing"}
          - {w: "suceso", d: "outcome, result (false friend: not 'success')"}
          - {w: "acometimiento", d: "attack, assault, encounter"}
          - {w: "empresa", d: "enterprise, undertaking, feat of arms"}
        diagram:
          - s: "dice"
            r: "main verb: he (the author) says"
            under:
              - {s: "Y así, prosiguiendo su historia", r: "how: and so, going on with his history"}
              - s: "mandó a Sancho volver a la ciudad"
                r: "what he says: that Don Quijote ordered Sancho to go back to the town"
                under:
                  - {s: "así como don Quijote se emboscó en la floresta, encinar o selva junto al gran Toboso", r: "when: as soon as Don Quijote hid in the wood near El Toboso"}
                  - s: "y que no volviese a su presencia"
                    r: "what he ordered, 2: and that he should not come back to him"
                    under:
                      - s: "sin haber primero hablado de su parte a su señora"
                        r: "condition: without first speaking to his lady on his behalf"
                        under:
                          - {s: "pidiéndola fuese servida de dejarse ver de su cautivo caballero", r: "how: asking her to be pleased to let her captive knight see her"}
                          - {s: "y se dignase de echarle su bendición", r: "what to ask, 2: and to deign to give him her blessing"}
                          - s: "para que pudiese esperar por ella felicísimos sucesos"
                            r: "purpose: so that he could hope for very happy outcomes through it"
                            under:
                              - {s: "de todos sus acometimientos y dificultosas empresas", r: "describes 'sucesos': of all his encounters and hard enterprises"}
        forms:
          - {w: "prosiguiendo", f: "gerund of proseguir (to continue): the e of the stem turns to i in the gerund: proseguir → prosiguiendo."}
          - {w: "dice", f: "dic- + -e → decir (to say), present, he (the author). Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "se emboscó, mandó", f: "embosc- + -ó → emboscarse (to hide in a wood), with 'se', and mand- + -ó → mandar (to order), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "gran", f: "grande (great) clipped to 'gran' before a singular noun, here the place name 'Toboso'."}
          - {w: "volver", f: "infinitive of volver (to return) after 'mandó a Sancho': 'ordered Sancho to return'."}
          - {w: "volviese", f: "volv- + -iese → volver (to return), imperfect subjunctive (-se form), he: subjunctive because it reports an order in the past ('mandó ... que no volviese'). volviese, volvieses, volviese, volviésemos, volvieseis, volviesen."}
          - {w: "haber primero hablado", f: "haber (to have) + hablado, the participle of hablar (to speak): the perfect infinitive 'to have spoken', after 'sin'; 'primero' (first) sits between the two parts."}
          - {w: "pidiéndola", f: "gerund of pedir (to ask), e → i in the gerund, + la (her), with an accent added to keep the stress. Cervantes uses 'la' where modern Spanish wants 'le' for the person asked (laísmo): modern 'pidiéndole'."}
          - {w: "fuese servida", f: "fu- + -ese → ser (to be), imperfect subjunctive (-se form), she: fuese, fueses, fuese, fuésemos, fueseis, fuesen; + servida, the participle of servir (to serve), feminine to match the lady: 'that she be pleased'. The 'que' before 'fuese' is left out."}
          - {w: "dejarse", f: "dejar (to let) + se (herself), infinitive after 'de': 'to let herself be seen'."}
          - {w: "se dignase", f: "dign- + -ase → dignarse (to deign), imperfect subjunctive (-se form), she, with 'se'. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "echarle", f: "echar (to cast, give) + le (on him), infinitive after 'de'."}
          - {w: "pudiese", f: "pud- + -iese → poder (to be able), imperfect subjunctive (-se form), he, after 'para que': pudiese, pudieses, pudiese, pudiésemos, pudieseis, pudiesen."}
          - {w: "felicísimos", f: "feliz (happy) + -ísimo, 'very happy', z → c before i; masculine plural to match 'sucesos'."}
          - {w: "dificultosas", f: "dificult- + -osa → dificultoso (difficult), feminine plural to match 'empresas'."}
        note: "At the end of the previous chapter, after failing to find Dulcinea's palace in El Toboso by night, Sancho persuaded his master to hide in a wood outside the village while he went back alone to look for her."
      - es: "Encargóse Sancho de hacerlo así como se le mandaba, y de traerle tan buena respuesta como le trujo la vez primera."
        literal: "Took-it-on-himself Sancho to do-it just as to-him it-was-ordered, and to bring-him as good answer as to-him he-brought the time first."
        ormsby: "Sancho undertook to execute the task according to the instructions, and to bring back an answer as good as the one he brought back before."
        vocab:
          - {w: "encargarse de", d: "to take charge of, undertake"}
          - {w: "así como", d: "here 'just as, exactly as'"}
          - {w: "trujo", d: "= trajo, he brought (old form of the preterite of traer)"}
          - {w: "la vez primera", d: "the first time; modern order 'la primera vez'"}
        diagram:
          - s: "Encargóse"
            r: "main verb: took it on himself"
            under:
              - {s: "Sancho", r: "subject"}
              - s: "de hacerlo"
                r: "what, 1: to do it"
                under:
                  - {s: "así como se le mandaba", r: "how: just as he was told"}
              - s: "y de traerle tan buena respuesta"
                r: "what, 2: and to bring him back as good an answer"
                under:
                  - {s: "como le trujo la vez primera", r: "comparison: as he brought him the first time"}
        forms:
          - {w: "Encargóse", f: "encarg- + -ó + se → encargarse (to undertake), preterite, he, with 'se' stuck on the end; modern 'se encargó'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. Cervantes hangs the pronoun on a verb that opens the sentence."}
          - {w: "hacerlo", f: "hacer (to do) + lo (it), infinitive after 'de'."}
          - {w: "se le mandaba", f: "mand- + -aba → mandar (to order), imperfect, it, with impersonal 'se' and 'le' (to him): 'as he was ordered'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "traerle", f: "traer (to bring) + le (to him), infinitive after 'de'."}
          - {w: "trujo", f: "truj- + -o → traer (to bring), preterite, he: the old form of 'trajo'. Old forms: truje, trujiste, trujo, trujimos, trujistes, trujeron; modern traje, trajiste, trajo, trajimos, trajisteis, trajeron."}
        note: "The 'good answer' of the first time was invented: in Part I Sancho pretended to have delivered his master's letter to Dulcinea and made up her reply without ever seeing her."
  - sentences:
      - es: "— Anda, hijo —replicó don Quijote—, y no te turbes cuando te vieres ante la luz del sol de hermosura que vas a buscar."
        literal: "— Go, son —replied Don Quijote—, and not yourself be-flustered when yourself you-shall-see before the light of-the sun of beauty that you-go to seek."
        ormsby: "“Go, my son,” said Don Quixote, “and be not dazed when thou findest thyself exposed to the light of that sun of beauty thou art going to seek."
        vocab:
          - {w: "replicar", d: "to reply, answer back"}
          - {w: "turbarse", d: "to be flustered, lose one's composure"}
          - {w: "sol de hermosura", d: "sun of beauty: the stock image of love poetry for the beloved"}
        diagram:
          - s: "Anda, hijo"
            r: "main verb 1: go, son"
          - {s: "replicó don Quijote", r: "speech tag: Don Quijote replied"}
          - s: "y no te turbes"
            r: "main verb 2: and do not be flustered"
            under:
              - s: "cuando te vieres ante la luz del sol de hermosura"
                r: "when: when you find yourself before the light of the sun of beauty"
                under:
                  - {s: "que vas a buscar", r: "describes 'sol de hermosura': that you are going to look for"}
        forms:
          - {w: "Anda", f: "and- + -a → andar (to go, walk), imperative, you (tú): 'go!'. The tú command is the same as the he/she present: anda, like mira, toma."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "no te turbes", f: "turb- + -es → turbarse (to be flustered), present subjunctive, you, with 'te': a negative command always uses the present subjunctive. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "vieres", f: "vi- + -eres → ver (to see), future subjunctive, you: 'when you (may) see yourself'. viere, vieres, viere, viéremos, viereis, vieren. Cervantes uses it after 'cuando', 'si' for an open future; modern Spanish uses the present subjunctive 'te veas'."}
          - {w: "vas a buscar", f: "vas → ir (to go), present, you: voy, vas, va, vamos, vais, van; 'ir a' + infinitive = to be going to: 'you are going to look for'."}
      - es: "¡Dichoso tú sobre todos los escuderos del mundo!"
        literal: "Happy you above all the squires of-the world!"
        ormsby: "Happy thou, above all the squires in the world!"
        vocab:
          - {w: "dichoso", d: "happy, fortunate, lucky (from 'dicha', good luck)"}
          - {w: "sobre", d: "here 'above, more than'"}
        diagram:
          - s: "Dichoso tú"
            r: "exclamation with no verb: happy you!"
            under:
              - {s: "sobre todos los escuderos del mundo", r: "compared with whom: above all the squires in the world"}
        forms:
          - {w: "Dichoso", f: "dich- + -oso → dichoso (happy), from dicha (luck) + -oso, masculine singular to match 'tú' (Sancho). The verb 'eres' is left out: ser (to be), present: soy, eres, es, somos, sois, son."}
          - {w: "del", f: "de + el, 'of the', the contraction modern Spanish still makes."}
        note: "Sancho is 'happy' because he is going to see Dulcinea, a sight Don Quijote himself has never had."
      - es: "Ten memoria, y no se te pase della cómo te recibe:"
        literal: "Have memory, and not to-you may-pass from-it how you she-receives:"
        ormsby: "Bear in mind, and let it not escape thy memory, how she receives thee;"
        vocab:
          - {w: "tener memoria", d: "to remember, bear in mind"}
          - {w: "pasársele a uno", d: "to slip one's mind, escape one"}
          - {w: "della", d: "= de ella, from it (your memory) (old contraction)"}
        diagram:
          - s: "Ten memoria"
            r: "main verb 1: bear in mind"
          - s: "y no se te pase della"
            r: "main verb 2: and do not let it slip from it (your memory)"
            under:
              - {s: "cómo te recibe", r: "what not to forget: how she receives you"}
        forms:
          - {w: "Ten", f: "tener (to have), imperative, you (tú): irregular short form 'ten', like pon (poner, to put), ven (venir, to come), sal (salir, to go out), haz (hacer, to do), di (decir, to say)."}
          - {w: "no se te pase", f: "pas- + -e → pasarse (to slip by), present subjunctive, it, with 'se' and 'te' (from you): 'let it not slip from you'. A negative command uses the present subjunctive. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
