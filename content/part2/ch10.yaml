        note: "Sancho cannot resist embroidering: the 'beauty spot' on Dulcinea's lip sprouts a foot-long moustache of golden hairs. He is describing the peasant girl, whom he has just made Don Quijote believe is the enchanted Dulcinea."
  - sentences:
      - es: "— A ese lunar —dijo don Quijote—, según la correspondencia que tienen entre sí los del rostro con los del cuerpo, ha de tener otro Dulcinea en la tabla del muslo que corresponde al lado donde tiene el del rostro, pero muy luengos para lunares son pelos de la grandeza que has significado."
        literal: "— To that mole —said Don Quijote—, according-to the correspondence that have between themselves those of-the face with those of-the body, must have another Dulcinea on the flat of-the thigh that corresponds to-the side where she-has that of-the face, but very long for moles are hairs of the size that you-have signified."
        ormsby: "“From the correspondence which exists between those of the face and those of the body,” said Don Quixote, “Dulcinea must have another mole resembling that on the thick of the thigh on that side on which she has the one on her face; but hairs of the length thou hast mentioned are very long for moles.”"
        vocab:
          - {w: "a ese lunar", d: "matching that mole, to go with that mole"}
          - {w: "según", d: "according to"}
          - {w: "correspondencia", d: "correspondence: the belief that each mole on the face is matched by one on the body"}
          - {w: "entre sí", d: "with each other, among themselves"}
          - {w: "haber de", d: "must (of a logical certainty): 'ha de tener' = she must have"}
          - {w: "la tabla del muslo", d: "the flat of the thigh, the broad outer part"}
          - {w: "luengo", d: "long (old word; modern 'largo')"}
          - {w: "grandeza", d: "size, length (here, not 'greatness')"}
          - {w: "significar", d: "here 'to indicate, describe, make known'"}
        diagram:
          - s: "ha de tener otro Dulcinea"
            r: "main verb 1: Dulcinea must have another"
            under:
              - {s: "A ese lunar", r: "to match what: to match that mole"}
              - {s: "—dijo don Quijote—", r: "speech tag: said Don Quijote"}
              - s: "según la correspondencia"
                r: "why: according to the correspondence"
                under:
                  - {s: "que tienen entre sí los del rostro con los del cuerpo", r: "describes 'correspondencia': that those (moles) of the face have with those of the body"}
              - s: "en la tabla del muslo"
                r: "where: on the flat of the thigh"
                under:
                  - s: "que corresponde al lado"
                    r: "describes 'muslo': that matches the side"
                    under:
                      - {s: "donde tiene el del rostro", r: "describes 'lado': where she has the one on her face"}
          - s: "pero muy luengos para lunares son pelos"
            r: "main verb 2: but hairs are very long for moles"
            under:
              - {s: "de la grandeza que has significado", r: "describes 'pelos': of the size you have described"}
        forms:
          - {w: "ese", f: "'that' (near you), masculine to match 'lunar': the mole Sancho just mentioned."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "tienen", f: "tien- + -en → tener (to have), present, they (the moles). Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen. Same verb in 'tiene' (she has) later."}
          - {w: "los del rostro, los del cuerpo", f: "'los' stands in for 'lunares' (moles): 'those of the face, those of the body'; del = de + el."}
          - {w: "ha de tener", f: "ha (haber (to have), present, she: he, has, ha, hemos, habéis, han) + de + tener (to have): 'she must have'."}
          - {w: "corresponde", f: "correspond- + -e → corresponder (to correspond), present, it. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "luengos", f: "luengo (long) + -os, masculine plural to match 'pelos'; put first for emphasis, with 'son' (ser (to be), present, they: soy, eres, es, somos, sois, son) after it."}
          - {w: "has significado", f: "has (haber (to have), present, you: he, has, ha, hemos, habéis, han) + significado, participle of significar (to indicate): 'you have described'."}
        note: "The 'correspondence' of moles was a piece of popular physiognomy: every mole on the face was supposed to have a twin in the same place on the body. Don Quijote applies it gravely, and only objects that hairs a span long are rather much for a mole."
  - sentences:
      - es: "— Pues yo sé decir a vuestra merced —respondió Sancho— que le parecían allí como nacidos."
        literal: "— Well I know-how to-say to your grace —answered Sancho— that they there seemed there like born."
        ormsby: "“Well, all I can say is there they were as plain as could be,” replied Sancho."
        vocab:
          - {w: "saber decir", d: "to be able to say, to be able to tell: 'yo sé decir' = I can tell you"}
          - {w: "vuestra merced", d: "your grace, your worship: the polite 'you', which takes a he/she verb (modern 'usted')"}
          - {w: "como nacidos", d: "as if they had grown there naturally, 'as if born there': i.e. they suited her perfectly"}
