      - es: "Y has también de advertir, Sancho, que no se contentaron estos traidores de haber vuelto y transformado a mi Dulcinea, sino que la transformaron y volvieron en una figura tan baja y tan fea como la de aquella aldeana, y juntamente le quitaron lo que es tan suyo de las principales señoras, que es el buen olor, por andar siempre entre ámbares y entre flores."
