      - es: "y ensanche vuestra merced, señor mío, ese corazoncillo, que le debe de tener agora no mayor que una avellana, y considere que se suele decir que buen corazón quebranta mala ventura, y que donde no hay tocinos, no hay estacas; y también se dice: donde no piensa, salta la liebre."
        literal: "and may-widen your grace, lord mine, that little-heart, which it you-must have now not bigger than a hazelnut, and may-consider that itself it-is-wont to-say that good heart breaks bad fortune, and that where not there-are flitches, not there-are stakes; and also itself it-says: where not one-thinks, jumps-out the hare."
        ormsby: "cheer up that little heart of yours, master mine, for at the present moment you seem to have got one no bigger than a hazel nut; remember what they say, that a stout heart breaks bad luck, and that where there are no fletches there are no pegs; and moreover they say, the hare jumps up where it’s not looked for."
        ormsby_note: "Proverb 58. (On the second proverb:) A muddle by Sancho of the proverb (226) so often quoted. (On the third proverb:) Proverb 129."
        vocab:
          - {w: "ensanchar el corazón", d: "literally 'to widen the heart': to take heart, cheer up"}
          - {w: "vuestra merced", d: "'your grace', the polite 'you', used with he/she verb forms (modern 'usted' comes from it)"}
          - {w: "corazoncillo", d: "little heart (diminutive in -illo)"}
          - {w: "deber de", d: "must (probability): 'le debe de tener' = you must have it"}
          - {w: "agora", d: "= ahora, now (old form)"}
          - {w: "avellana", d: "hazelnut"}
          - {w: "buen corazón quebranta mala ventura", d: "proverb: a stout heart breaks bad luck"}
