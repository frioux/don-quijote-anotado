        forms:
          - {w: "Siendo", f: "gerund of ser (to be): 'being', here 'since he is'."}
          - {w: "lo es", f: "es = ser (to be), present, he: soy, eres, es, somos, sois, son. 'lo' stands for 'loco': 'as he is [mad]'."}
          - {w: "toma, juzga", f: "tom- + -a → tomar (to take) and juzg- + -a → juzgar (to judge), present, it (the madness). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "se pareció", f: "parec- + -ió → parecerse (to be seen), preterite, it, with 'se'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "eran", f: "er- + -an → ser (to be), imperfect, they. Irregular: era, eras, era, éramos, erais, eran. The verb is not repeated for 'dromedarios' and 'ejércitos'."}
          - {w: "será", f: "ser- + -á → ser (to be), future, it. The future adds endings to the whole infinitive: seré, serás, será, seremos, seréis, serán."}
          - {w: "hacerle creer", f: "hacer (to make) + le (him) + creer (to believe): 'to make him believe'; 'le' for a male person (leísmo)."}
          - {w: "topare", f: "top- + -are → topar (to come across), future subjunctive, I: 'whom I may come across'. The future subjunctive of -ar verbs: -are, -ares, -are, -áremos, -areis, -aren. Cervantes uses it for an open future after a relative; modern Spanish uses the present subjunctive 'tope'. 'me topare' = may meet with me."}
