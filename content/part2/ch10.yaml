              - {s: "a las tres aldeanas", r: "object: the three village girls"}
        forms:
          - {w: "salieron", f: "sal- + -ieron → salir (to go out), preterite, they. The preterite of -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "descubrieron", f: "descubr- + -ieron → descubrir (to catch sight of), preterite, they. Same -ir preterite: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "a las tres aldeanas", f: "the personal 'a' before a direct object that is a person."}
      - es: "Tendió don Quijote los ojos por todo el camino del Toboso, y como no vio sino a las tres labradoras, turbóse todo, y preguntó a Sancho si las había dejado fuera de la ciudad."
        literal: "Stretched Don Quijote the eyes along all the road of-El Toboso, and as not he-saw but [to] the three peasant-girls, troubled-himself all, and he-asked [to] Sancho if them he-had left outside of the city."
        ormsby: "Don Quixote looked all along the road to El Toboso, and as he could see nobody except the three peasant girls, he was completely puzzled, and asked Sancho if it was outside the city he had left them."
        vocab:
          - {w: "tender los ojos", d: "to cast one's eyes, look out over"}
          - {w: "no ... sino", d: "nothing but, only"}
          - {w: "labradora", d: "peasant woman, farm girl"}
          - {w: "turbarse", d: "to be thrown into confusion, upset"}
          - {w: "todo", d: "here an adverb: 'completely, all over'"}
        diagram:
          - s: "Tendió don Quijote los ojos"
            r: "main verb 1: Don Quijote cast his eyes"
            under:
              - {s: "por todo el camino del Toboso", r: "where: all along the El Toboso road"}
          - s: "turbóse todo"
            r: "main verb 2 (after 'y'): he was completely confused"
            under:
              - {s: "como no vio sino a las tres labradoras", r: "why: since he saw only the three peasant girls"}
          - s: "y preguntó a Sancho"
            r: "main verb 3: and asked Sancho"
            under:
              - {s: "si las había dejado fuera de la ciudad", r: "what he asked: whether he had left them outside the town"}
        forms:
          - {w: "Tendió", f: "tend- + -ió → tender (to stretch), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron. The verb comes before its subject."}
          - {w: "vio", f: "ver (to see), preterite, he. vi, viste, vio, vimos, visteis, vieron."}
          - {w: "turbóse", f: "turb- + -ó + se → turbarse (to be confused), preterite, he, with 'se' stuck on the end; modern 'se turbó'. Cervantes hangs the pronoun on a conjugated verb that opens its clause. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "preguntó", f: "pregunt- + -ó → preguntar (to ask), preterite, he. Same -ar preterite: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "las", f: "'them', feminine plural for the ladies."}
          - {w: "había dejado", f: "hab- + -ía → haber (to have), imperfect, he, + dejado, participle of dejar (to leave): the pluperfect, 'had left'. haber (to have) in the imperfect: había, habías, había, habíamos, habíais, habían."}
  - sentences:
      - es: "— ¿Cómo fuera de la ciudad? —respondió—. ¿Por ventura tiene vuesa merced los ojos en el colodrillo, que no vee que son éstas, las que aquí vienen, resplandecientes como el mismo sol a mediodía?"
        literal: "— How outside of the city? —he-answered—. By chance has your grace the eyes in the back-of-the-head, that not sees that are these, the ones that here come, shining like the very sun at midday?"
        ormsby: "“How outside the city?” returned Sancho. “Are your worship’s eyes in the back of your head, that you can’t see that they are these who are coming here, shining like the very sun at noonday?”"
        vocab:
          - {w: "¿cómo ...?", d: "what do you mean ...? (echoing the other's words in surprise)"}
          - {w: "por ventura", d: "by any chance; in a question, 'can it be that ...?'"}
          - {w: "colodrillo", d: "back of the head, nape"}
          - {w: "vee", d: "= ve, sees (old form)"}
          - {w: "resplandeciente", d: "shining, resplendent"}
        diagram:
          - {s: "¿Cómo fuera de la ciudad?", r: "question 1: what do you mean, outside the town?"}
          - {s: "—respondió—", r: "speaker (Sancho)"}
          - s: "¿Por ventura tiene vuesa merced los ojos en el colodrillo"
            r: "question 2, main verb: can it be your grace has eyes in the back of your head"
            under:
              - s: "que no vee"
                r: "result: that you don't see"
                under:
                  - s: "que son éstas, las que aquí vienen"
                    r: "what you don't see: that it's these, the ones coming here"
                    under:
                      - {s: "resplandecientes como el mismo sol a mediodía", r: "describes 'éstas': shining like the sun itself at noon"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, you (vuesa merced takes the he/she form). Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "vee", f: "old form of 've', ver (to see), present, you (vuesa merced). ver (to see) in the present: veo, ves, ve, vemos, veis, ven; Cervantes still writes 'vee' with the old double e."}
          - {w: "son", f: "ser (to be), present, they. soy, eres, es, somos, sois, son."}
          - {w: "éstas", f: "est- + -as → este (this), feminine plural for the girls; written with an accent when it stands alone as a pronoun."}
          - {w: "vienen", f: "vien- + -en → venir (to come), present, they. Irregular: vengo, vienes, viene, venimos, venís, vienen."}
          - {w: "resplandecientes", f: "resplandec- + -ientes → from resplandecer (to shine): the -iente ending makes an adjective, '-ing', plural to match 'éstas'."}
  - sentences:
      - es: "— Yo no veo, Sancho —dijo don Quijote—, sino a tres labradoras sobre tres borricos."
        literal: "— I not see, Sancho —said Don Quijote—, but [to] three peasant-girls upon three donkeys."
        ormsby: "“I see nothing, Sancho,” said Don Quixote, “but three country girls on three jackasses.”"
        vocab:
          - {w: "no ... sino", d: "nothing but, only"}
          - {w: "borrico", d: "donkey, ass"}
        diagram:
          - s: "Yo no veo"
            r: "main verb: I see nothing"
            under:
              - {s: "—dijo don Quijote—", r: "speaker"}
              - {s: "sino a tres labradoras sobre tres borricos", r: "except: but three peasant girls on three donkeys"}
        forms:
          - {w: "veo", f: "ve- + -o → ver (to see), present, I. veo, ves, ve, vemos, veis, ven."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "borricos", f: "borric- + -os → borrico (donkey), masculine plural; the masculine covers donkeys of either sex."}
        note: "For once Don Quijote sees exactly what is there, and it is Sancho who claims to see princesses: the reverse of the windmills and flocks of sheep in Part I."
  - sentences:
      - es: "— ¡Agora me libre Dios del diablo! —respondió Sancho—."
        literal: "— Now me may-free God from-the devil! —answered Sancho—."
        ormsby: "“Now, may God deliver me from the devil!” said Sancho,"
        vocab:
          - {w: "agora", d: "= ahora, now (old form)"}
          - {w: "librar", d: "to free, deliver; '¡Dios me libre!' = God help me!, God forbid!"}
        diagram:
          - s: "me libre Dios"
            r: "main verb: may God deliver me"
            under:
              - {s: "Agora", r: "when: now"}
              - {s: "del diablo", r: "from what: from the devil"}
              - {s: "—respondió Sancho—", r: "speaker"}
        forms:
          - {w: "Agora", f: "old form of ahora (now)."}
          - {w: "libre", f: "libr- + -e → librar (to free), present subjunctive, he (God): a wish, 'may God free me'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "del", f: "de + el, 'from the'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
      - es: "Y ¿es posible que tres hacaneas, o como se llaman, blancas como el ampo de la nieve, le parezcan a vuesa merced borricos?"
        literal: "And is-it possible that three hackneys, or as themselves they-call, white like the whiteness of the snow, to-you may-seem to your grace donkeys?"
        ormsby: "“and can it be that your worship takes three hackneys—or whatever they’re called—as white as the driven snow, for jackasses?"
        vocab:
          - {w: "o como se llaman", d: "or whatever they're called: Sancho is unsure of the word he has just been corrected on"}
          - {w: "ampo", d: "dazzling whiteness; 'blanco como el ampo de la nieve' = white as the driven snow"}
          - {w: "parecer", d: "to seem, look like"}
        diagram:
          - s: "¿es posible"
            r: "main verb: is it possible"
            under:
              - s: "que tres hacaneas"
                r: "subject of 'parezcan': that three hackneys"
                under:
                  - {s: "o como se llaman", r: "aside: or whatever they're called"}
                  - {s: "blancas como el ampo de la nieve", r: "describes 'hacaneas': white as the driven snow"}
              - {s: "le parezcan a vuesa merced borricos", r: "what is so hard to believe: should look like donkeys to your grace"}
        forms:
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "se llaman", f: "llam- + -an → llamar (to call), present, they, with 'se': 'they are called'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "blancas", f: "blanc- + -as → blanco (white), feminine plural to match 'hacaneas'."}
          - {w: "le parezcan", f: "parezc- + -an → parecer (to seem), present subjunctive, they; c becomes zc before a: parezca, parezcas, parezca, parezcamos, parezcáis, parezcan. Subjunctive after 'es posible que'. 'le' (to you) is doubled by 'a vuesa merced'."}
      - es: "¡Vive el Señor, que me pele estas barbas si tal fuese verdad!"
        literal: "Lives the Lord, that myself I-may-pluck these beards if such were true!"
        ormsby: "By the Lord, I could tear my beard if that was the case!”"
        vocab:
          - {w: "¡vive el Señor!", d: "as the Lord lives!, by the Lord! (an oath)"}
          - {w: "pelarse las barbas", d: "to tear out one's beard, in rage or despair"}
          - {w: "barbas", d: "beard (plural for the whole beard)"}
          - {w: "tal", d: "such a thing"}
        diagram:
          - {s: "¡Vive el Señor", r: "oath: by the Lord"}
          - s: "que me pele estas barbas"
            r: "main verb: may I tear out this beard of mine"
            under:
              - {s: "si tal fuese verdad", r: "condition: if such a thing were true"}
        forms:
          - {w: "Vive", f: "viv- + -e → vivir (to live), present, he (the Lord). The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "me pele", f: "pel- + -e → pelar (to pluck), present subjunctive, I, with 'me' (my own): a curse on himself. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "estas", f: "est- + -as → este (this), feminine plural to match 'barbas'."}
          - {w: "fuese", f: "fu- + -ese → ser (to be), imperfect subjunctive (-se form), it. fuese, fueses, fuese, fuésemos, fueseis, fuesen. After 'si' for something contrary to fact."}
  - sentences:
      - es: "— Pues yo te digo, Sancho amigo —dijo don Quijote—, que es tan verdad que son borricos, o borricas, como yo soy don Quijote y tú Sancho Panza; a lo menos, a mí tales me parecen."
        literal: "— Well I to-you say, Sancho friend —said Don Quijote—, that it-is so true that they-are he-donkeys, or she-donkeys, as I am Don Quijote and you Sancho Panza; at the least, to me such to-me they-seem."
        ormsby: "“Well, I can only say, Sancho, my friend,” said Don Quixote, “that it is as plain they are jackasses—or jennyasses—as that I am Don Quixote, and thou Sancho Panza: at any rate, they seem to me to be so.”"
        vocab:
          - {w: "tan verdad ... como", d: "as true ... as"}
          - {w: "borrica", d: "she-ass, jenny"}
          - {w: "a lo menos", d: "at least"}
          - {w: "tales", d: "such, so: 'tales me parecen' = that is how they look to me"}
        diagram:
          - s: "yo te digo"
            r: "main verb: I tell you"
            under:
              - {s: "Pues", r: "linking: well"}
              - {s: "—dijo don Quijote—", r: "speaker"}
              - s: "que es tan verdad que son borricos, o borricas"
                r: "what I tell you: that it is as true that they are donkeys, he- or she-"
                under:
                  - {s: "como yo soy don Quijote y tú Sancho Panza", r: "comparison: as that I am Don Quijote and you Sancho Panza"}
              - {s: "a lo menos, a mí tales me parecen", r: "afterthought: at least, that's how they look to me"}
        forms:
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "es, son, soy", f: "ser (to be), present: es 'it is', son 'they are', soy 'I am'. The full present: soy, eres, es, somos, sois, son. The verb is left out before 'tú Sancho Panza'."}
          - {w: "me parecen", f: "parec- + -en → parecer (to seem), present, they, with 'me' (to me): parezco, pareces, parece, parecemos, parecéis, parecen. 'a mí ... me' doubles the pronoun for emphasis."}
        note: "Don Quijote is careful to add 'or she-asses', precise about the wrong thing, and his hedge 'at least they look so to me' leaves room for an enchantment."
  - sentences:
      - es: "— Calle, señor —dijo Sancho—, no diga la tal palabra, sino despabile esos ojos, y venga a hacer reverencia a la señora de sus pensamientos, que ya llega cerca."
        literal: "— Be-quiet, sir —said Sancho—, not say the such word, but snuff-clear those eyes, and come to do reverence to the lady of your thoughts, who already arrives near."
        ormsby: "“Hush, señor,” said Sancho, “don’t talk that way, but open your eyes, and come and pay your respects to the lady of your thoughts, who is close upon us now;”"
        vocab:
          - {w: "callar", d: "to be quiet, hush"}
          - {w: "la tal palabra", d: "such a word, that word"}
          - {w: "despabilar", d: "to snuff (a candle wick); 'despabilar los ojos' = to open one's eyes wide, wake up"}
          - {w: "hacer reverencia", d: "to bow, pay one's respects"}
          - {w: "señora de sus pensamientos", d: "lady of his thoughts, the stock phrase for a knight's beloved in the romances"}
        diagram:
          - {s: "Calle, señor", r: "main verb 1: hush, sir"}
          - {s: "—dijo Sancho—", r: "speaker"}
          - {s: "no diga la tal palabra", r: "main verb 2: don't say such a word"}
          - {s: "sino despabile esos ojos", r: "main verb 3: but open those eyes"}
          - s: "y venga"
            r: "main verb 4: and come"
            under:
              - s: "a hacer reverencia a la señora de sus pensamientos"
                r: "purpose: to pay your respects to the lady of your thoughts"
                under:
                  - {s: "que ya llega cerca", r: "describes 'señora': who is already drawing near"}
        forms:
          - {w: "Calle", f: "call- + -e → callar (to be quiet), present subjunctive used as a command, you (vuesa merced). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "diga", f: "dig- + -a → decir (to say), present subjunctive, you (vuesa merced): a negative command, 'don't say'. Irregular: diga, digas, diga, digamos, digáis, digan."}
          - {w: "despabile", f: "despabil- + -e → despabilar (to snuff, clear), present subjunctive as a command, you. Same -e subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "venga", f: "veng- + -a → venir (to come), present subjunctive as a command, you. Irregular: venga, vengas, venga, vengamos, vengáis, vengan."}
          - {w: "hacer", f: "infinitive of hacer (to do, make) after 'a' (in order to)."}
          - {w: "esos", f: "es- + -os → ese (that), masculine plural to match 'ojos'."}
          - {w: "sus", f: "su (your, for vuesa merced), plural to match 'pensamientos', not the owner."}
          - {w: "llega", f: "lleg- + -a → llegar (to arrive), present, she. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
  - sentences:
      - es: "Y, diciendo esto, se adelantó a recebir a las tres aldeanas; y, apeándose del rucio, tuvo del cabestro al jumento de una de las tres labradoras, y, hincando ambas rodillas en el suelo, dijo:"
        literal: "And, saying this, himself he-advanced to receive [to] the three village-girls; and, dismounting-himself from-the grey, he-held by-the halter [to]-the donkey of one of the three peasant-girls, and, driving-down both knees on the ground, he-said:"
        ormsby: "and with these words he advanced to receive the three village lasses, and dismounting from Dapple, caught hold of one of the asses of the three country girls by the halter, and dropping on both knees on the ground, he said,"
        vocab:
          - {w: "adelantarse", d: "to step forward, go ahead"}
          - {w: "recebir", d: "= recibir (old spelling), here to meet, greet"}
          - {w: "apearse", d: "to dismount, get down"}
          - {w: "rucio", d: "grey (animal): Sancho's donkey, 'Dapple' in Ormsby"}
          - {w: "cabestro", d: "halter, the rope by which an animal is led"}
          - {w: "jumento", d: "ass, beast of burden"}
          - {w: "hincar las rodillas", d: "to kneel down ('hincar' = to drive in, plant)"}
        diagram:
          - s: "se adelantó"
            r: "main verb 1: he stepped forward"
            under:
              - {s: "diciendo esto", r: "when: as he said this"}
              - {s: "a recebir a las tres aldeanas", r: "purpose: to meet the three village girls"}
          - s: "tuvo del cabestro"
            r: "main verb 2 (after 'y'): he held by the halter"
            under:
              - {s: "apeándose del rucio", r: "how, first: getting down from his grey"}
              - {s: "al jumento de una de las tres labradoras", r: "object: the donkey of one of the three peasant girls"}
          - s: "dijo:"
            r: "main verb 3 (after 'y'): he said"
            under:
              - {s: "hincando ambas rodillas en el suelo", r: "how: going down on both knees on the ground"}
        forms:
          - {w: "diciendo", f: "gerund of decir (to say): 'saying'; the e of the stem turns to i."}
          - {w: "se adelantó", f: "adelant- + -ó → adelantarse (to step forward), preterite, he, with 'se'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "recebir", f: "old spelling of recibir (to receive), infinitive after 'a' (in order to)."}
          - {w: "apeándose", f: "gerund of apearse (to dismount) with 'se' on the end; the accent is added to keep the stress: apeando + se."}
          - {w: "tuvo", f: "tuv- + -o → tener (to hold), preterite, he. Irregular: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron."}
          - {w: "del, al", f: "de + el and a + el; 'al jumento' has the personal 'a' Cervantes often uses before an animal."}
          - {w: "hincando", f: "gerund of hincar (to drive in, plant): 'planting (his knees)'."}
          - {w: "ambas", f: "amb- + -as → ambos (both), feminine plural to match 'rodillas'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Reina y princesa y duquesa de la hermosura, vuestra altivez y grandeza sea servida de recebir en su gracia y buen talente al cautivo caballero vuestro, que allí está hecho piedra mármol, todo turbado y sin pulsos de verse ante vuestra magnífica presencia."
        literal: "— Queen and princess and duchess of the beauty, your haughtiness and greatness may-be served to receive into its grace and good disposition [to] the captive knight yours, who there is made stone marble, all troubled and without pulses from seeing-himself before your magnificent presence."
        ormsby: "“Queen and princess and duchess of beauty, may it please your haughtiness and greatness to receive into your favour and goodwill your captive knight who stands there turned into marble stone, and quite stupefied and benumbed at finding himself in your magnificent presence."
        vocab:
          - {w: "altivez", d: "haughtiness, pride; Sancho means 'alteza' (highness), and the slip turns the compliment into an insult"}
          - {w: "ser servido de", d: "to be pleased to, deign to: the courtly formula for a polite request"}
          - {w: "recebir", d: "= recibir, to receive (old spelling)"}
          - {w: "gracia", d: "favour, good graces"}
          - {w: "talente", d: "disposition, goodwill (archaic; modern 'talante')"}
          - {w: "hecho piedra mármol", d: "turned into marble stone, petrified (with awe)"}
          - {w: "turbado", d: "flustered, overwhelmed"}
          - {w: "sin pulsos", d: "without a pulse, i.e. faint, stunned"}
        diagram:
          - s: "sea servida"
            r: "main verb: may (your highness) be pleased"
            under:
              - {s: "Reina y princesa y duquesa de la hermosura", r: "who he addresses: queen, princess and duchess of beauty"}
              - {s: "vuestra altivez y grandeza", r: "subject: your haughtiness and greatness"}
              - s: "de recebir en su gracia y buen talente"
                r: "what to be pleased to do: to receive into her favour and goodwill"
                under:
                  - s: "al cautivo caballero vuestro"
                    r: "object: your captive knight"
                    under:
                      - {s: "que allí está hecho piedra mármol", r: "describes 'caballero': who stands there turned to marble"}
                      - {s: "todo turbado y sin pulsos", r: "describes 'caballero', 2: all flustered and faint"}
                      - {s: "de verse ante vuestra magnífica presencia", r: "why: at finding himself before your magnificent presence"}
        forms:
          - {w: "sea servida", f: "sea → ser (to be), present subjunctive, it (your highness): sea, seas, sea, seamos, seáis, sean; + servida, the participle of servir (to serve), feminine to match 'altivez'. The subjunctive makes a polite wish: 'may it please'."}
          - {w: "recebir", f: "old spelling of recibir (to receive), infinitive after 'de'."}
          - {w: "vuestra, vuestro", f: "possessive of 'vos', the respectful 'you': feminine 'vuestra' to match 'altivez' and 'presencia'; 'caballero vuestro' puts it after the noun for emphasis, 'your own knight'."}
