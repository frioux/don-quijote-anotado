          - {w: "hacéis", f: "hac- + -éis → hacer (to do), present, you (vosotros). hacer (to make, do) in the present: hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "Mucho ... mucho ... mucho más", f: "'mucho' as an adverb (a lot) never changes its ending; put first for emphasis each time."}
      - es: "Bastaros debiera, bellacos, haber mudado las perlas de los ojos de mi señora en agallas alcornoqueñas, y sus cabellos de oro purísimo en cerdas de cola de buey bermejo, y, finalmente, todas sus faciones de buenas en malas, sin que le tocárades en el olor;"
        literal: "To-suffice-you it-ought, villains, to-have changed the pearls of the eyes of my lady into galls cork-oak, and her hairs of gold purest into bristles of tail of ox red, and, finally, all her features from good into bad, without that to-her you-touched in the smell;"
        ormsby: "It ought to have been enough for you, ye scoundrels, to have changed the pearls of my lady’s eyes into oak galls, and her hair of purest gold into the bristles of a red ox’s tail, and in short, all her features from fair to foul, without meddling with her smell;"
        vocab:
          - {w: "bastar", d: "to be enough, suffice: 'bastaros debiera' = it should have been enough for you"}
          - {w: "bellaco", d: "scoundrel, rogue, villain"}
          - {w: "mudar en", d: "to change into"}
          - {w: "perlas de los ojos", d: "pearls of the eyes: the stock love-poetry image of shining eyes (or of white teeth)"}
          - {w: "agallas alcornoqueñas", d: "cork-oak galls: the round brown growths on oak trees, dull and lumpy; 'alcornoque' = cork oak"}
          - {w: "cerdas", d: "bristles, coarse hairs (of a pig, a horse's or ox's tail)"}
          - {w: "bermejo", d: "red, reddish"}
          - {w: "faciones", d: "= facciones, features (of the face); old spelling"}
          - {w: "sin que", d: "without (+ subjunctive)"}
          - {w: "tocar en", d: "to touch, meddle with"}
        diagram:
          - s: "Bastaros debiera"
            r: "main verb: it should have been enough for you"
            under:
              - {s: "bellacos", r: "the ones spoken to: you villains"}
              - s: "haber mudado las perlas de los ojos de mi señora en agallas alcornoqueñas"
                r: "subject, 1: to have changed the pearls of her eyes into cork-oak galls"
              - {s: "y sus cabellos de oro purísimo en cerdas de cola de buey bermejo", r: "subject, 2 (still after 'haber mudado'): and her golden hair into red ox-tail bristles"}
              - {s: "y, finalmente, todas sus faciones de buenas en malas", r: "subject, 3: and finally all her features from fair to foul"}
              - {s: "sin que le tocárades en el olor", r: "how: without touching her smell"}
        forms:
          - {w: "Bastaros", f: "bastar (to suffice) + os (to you all), the pronoun hung on the infinitive, which is governed by 'debiera': 'to suffice you'."}
          - {w: "debiera", f: "deb- + -iera → deber (ought), imperfect subjunctive (-ra form), it, used as a softened conditional: 'it ought to'. The -ra form of -er verbs: -iera, -ieras, -iera, -iéramos, -ierais, -ieran."}
          - {w: "haber mudado", f: "haber (to have), infinitive, + mudado, participle of mudar (to change): 'to have changed'."}
          - {w: "alcornoqueñas", f: "alcornoque (cork oak) + -eña, the adjective suffix '-eño' (of, from), feminine plural to match 'agallas'."}
          - {w: "purísimo", f: "pur- + -ísimo → puro (pure) with the superlative -ísimo: 'purest, very pure'; masculine to match 'oro'."}
          - {w: "bermejo", f: "masculine singular to match 'buey'."}
          - {w: "buenas, malas", f: "feminine plural to match 'faciones': 'from fair to foul'."}
          - {w: "tocárades", f: "toc- + -árades → tocar (to touch), imperfect subjunctive (-ra form), you (vosotros); the old ending -árades for modern -arais. The -ra form of -ar verbs: -ara, -aras, -ara, -áramos, -arais (old -árades), -aran. Subjunctive after 'sin que'."}
        note: "Sancho inverts the clichés of love poetry: eyes like pearls become oak galls, golden hair becomes ox-tail bristles. 'Agallas' also means 'gills', the word he used a moment before for the strung sardines, so the pun links the two."
