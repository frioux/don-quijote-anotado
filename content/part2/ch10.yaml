  - sentences:
      - es: "A esta sazón, ya se había puesto don Quijote de hinojos junto a Sancho, y miraba con ojos desencajados y vista turbada a la que Sancho llamaba reina y señora, y, como no descubría en ella sino una moza aldeana, y no de muy buen rostro, porque era carirredonda y chata, estaba suspenso y admirado, sin osar desplegar los labios."
        literal: "At this season, already himself had put Don Quijote on knees beside Sancho, and he-was-looking with eyes out-of-joint and sight troubled at her whom Sancho was-calling queen and lady, and, as not he-was-discovering in her but a lass village, and not of very good face, because she-was round-faced and flat-nosed, he-was suspended and amazed, without daring to-unfold the lips."
        ormsby: "Don Quixote had by this time placed himself on his knees beside Sancho, and, with eyes starting out of his head and a puzzled gaze, was regarding her whom Sancho called queen and lady; and as he could see nothing in her except a village lass, and not a very well-favoured one, for she was platter-faced and snub-nosed, he was perplexed and bewildered, and did not venture to open his lips."
