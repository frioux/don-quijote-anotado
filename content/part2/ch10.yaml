          - {w: "picar", d: "to prod, spur on"}
          - {w: "cananea", d: "Sancho's garbling of 'hacanea' (a fine riding pony, a hackney); the word really means 'Canaanite woman'. The narrator keeps Sancho's word as a joke for the donkey"}
          - {w: "aguijón", d: "goad, spike on the end of a stick for driving animals"}
          - {w: "dar a correr", d: "to break into a run, set off running"}
          - {w: "por el prado adelante", d: "on across the meadow"}
