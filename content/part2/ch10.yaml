      - es: "Las labradoras estaban asimismo atónitas, viendo aquellos dos hombres tan diferentes hincados de rodillas, que no dejaban pasar adelante a su compañera; pero, rompiendo el silencio la detenida, toda desgraciada y mohína, dijo:"
