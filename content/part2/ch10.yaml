          - {w: "volvió", f: "volv- + -ió → volver (to turn), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "vareó, se quedó, se apartó", f: "vare- + -ó → varear (to beat with a stick), qued- + -ó → quedarse (to stay), apart- + -ó → apartarse (to go away), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
