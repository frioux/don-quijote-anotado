  - sentences:
      - es: "— Mas, ¡jo, que te estrego, burra de mi suegro!"
        literal: "— But, whoa, for you I-rub-down, she-ass of my father-in-law!"
        ormsby: "“Whoa then! why, I’m rubbing thee down, she-ass of my father-in-law!"
        ormsby_note: "(Jo! que te estrego, burra de mi suegro!) In all the translations I have seen, this exclamation is either omitted or misunderstood. Shelton and Jervas suppose it to be addressed by the girl to the ass she is riding. It is in reality a popular phrase (as may be perceived by the rhyme), and commonly used when a person takes amiss something that is intended as a favour or a compliment. The girl uses it here ironically, fancying that Sancho's complimentary language is, as we should say, 'chaff,' and striving to pay him off in his own coin."
        vocab:
          - {w: "mas", d: "but (without accent; 'más' with accent is 'more')"}
          - {w: "¡jo!", d: "whoa!, the call that stops a donkey (modern '¡so!')"}
          - {w: "estregar", d: "to rub, rub down, curry (a beast)"}
          - {w: "burra", d: "she-ass, jenny"}
          - {w: "suegro", d: "father-in-law"}
        diagram:
          - s: "que te estrego"
            r: "main verb: for I'm rubbing you down"
            under:
              - {s: "Mas", r: "linking: but"}
              - {s: "¡jo", r: "exclamation: whoa!"}
              - {s: "burra de mi suegro", r: "who she addresses: she-ass of my father-in-law"}
        forms:
          - {w: "estrego", f: "estreg- + -o → estregar (to rub down), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an: estrego, estregas, estrega, estregamos, estregáis, estregan (modern Spanish also says 'estriego')."}
          - {w: "te", f: "'you' (familiar), object of 'estrego', placed before the verb."}
        note: "A rhyming country saying (estrego / suegro) for someone who takes a kindness badly, like a donkey kicking while it is groomed. The girl turns it round on Sancho: his fine compliments must be mockery."
      - es: "¡Mirad con qué se vienen los señoritos ahora a hacer burla de las aldeanas, como si aquí no supiésemos echar pullas como ellos!"
        literal: "Look with what themselves come the little-lords now to make mockery of the village-girls, as if here not we-knew-how to-throw taunts like them!"
        ormsby: "See how the lordlings come to make game of the village girls now, as if we here could not chaff as well as themselves."
        vocab:
          - {w: "con qué se vienen", d: "what they come out with, what they come at us with"}
          - {w: "señorito", d: "young gentleman, little lord: scornful, 'fine gentlemen'"}
          - {w: "hacer burla de", d: "to make fun of, mock"}
          - {w: "aldeana", d: "village girl"}
          - {w: "echar pullas", d: "to throw gibes, give as good as one gets in coarse banter ('pulla' = taunt, rude joke)"}
        diagram:
          - s: "¡Mirad"
            r: "main verb: look!"
            under:
              - s: "con qué se vienen los señoritos ahora"
                r: "what to look at: what the fine gentlemen come out with now"
                under:
                  - {s: "a hacer burla de las aldeanas", r: "why: to make fun of the village girls"}
              - {s: "como si aquí no supiésemos echar pullas como ellos", r: "how: as if we here couldn't trade gibes as well as they can"}
        forms:
          - {w: "Mirad", f: "mir- + -ad → mirar (to look), imperative, you (vosotros, 'you all'): the vosotros imperative swaps the final -r of the infinitive for -d: mirad, comed, vivid."}
          - {w: "se vienen", f: "vien- + -en → venir (to come), present, they, with 'se' ('come along, come out with'). Irregular: vengo, vienes, viene, venimos, venís, vienen."}
          - {w: "señoritos", f: "señor + -ito (diminutive, here scornful), plural."}
          - {w: "hacer", f: "hacer (to make), infinitive after 'a' of purpose."}
          - {w: "supiésemos", f: "sup- + -iésemos → saber (to know how), imperfect subjunctive (-se form), we. Irregular stem sup-: supiese, supieses, supiese, supiésemos, supieseis, supiesen. 'como si' (as if) always takes the imperfect subjunctive."}
          - {w: "echar", f: "echar (to throw), infinitive after 'supiésemos'."}
      - es: "Vayan su camino, e déjenmos hacer el nueso, y serles ha sano."
        literal: "Let-them-go their way, and let-us do the ours, and to-be-to-them it-will healthy."
        ormsby: "Go your own way, and let us go ours, and it will be better for you.”"
        vocab:
          - {w: "vayan su camino", d: "go your way, be off with you"}
          - {w: "e", d: "old and rustic form of 'y', and"}
          - {w: "nueso", d: "rustic for 'nuestro', ours: 'el nueso' = our own (way)"}
          - {w: "serles ha sano", d: "old split future = 'les será sano': it will be good for you, you'll be better off"}
        diagram:
          - {s: "Vayan su camino", r: "main verb 1: go your way"}
          - s: "e déjenmos hacer el nueso"
            r: "main verb 2: and let us go ours"
          - s: "y serles ha sano"
            r: "main verb 3: and it will be good for you"
        forms:
          - {w: "Vayan", f: "vay- + -an → ir (to go), present subjunctive, they, used as a command to the men addressed as 'vuestras mercedes'. Irregular: vaya, vayas, vaya, vayamos, vayáis, vayan."}
          - {w: "déjenmos", f: "déj- + -en + mos → dejar (to let), present subjunctive, they, as a command, with rustic 'mos' for 'nos' (us) on the end; modern 'déjennos'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "hacer", f: "hacer (to do, make), infinitive after 'déjenmos'."}
          - {w: "nueso", f: "rustic form of nuestro (our, ours), masculine to match the understood 'camino'."}
          - {w: "serles ha", f: "ser (to be) + les (to them, i.e. to you gentlemen) + ha, the present of haber (to have): the old split future, 'les será'. The future was once the infinitive + haber (to have), and a pronoun could sit between the two parts. ser (to be) in the future: seré, serás, será, seremos, seréis, serán."}
  - sentences:
      - es: "— Levántate, Sancho —dijo a este punto don Quijote—, que ya veo que la Fortuna, de mi mal no harta, tiene tomados los caminos todos por donde pueda venir algún contento a esta ánima mezquina que tengo en las carnes."
        literal: "— Raise-yourself, Sancho —said at this point Don Quijote—, for already I-see that the Fortune, of my harm not sated, holds taken the roads all by where may come some contentment to this soul wretched that I-have in the flesh."
        ormsby: "“Get up, Sancho,” said Don Quixote at this; “I see that fortune, ‘with evil done to me unsated still,’ has taken possession of all the roads by which any comfort may reach ‘this wretched soul’ that I carry in my flesh."
        ormsby_note: "A line from Garcilaso de la Vega, Égloga III."
        vocab:
          - {w: "a este punto", d: "at this moment"}
          - {w: "Fortuna", d: "Fortune, the goddess of luck"}
          - {w: "de mi mal no harta", d: "not yet sated with my misfortune: a half-line of the poet Garcilaso de la Vega"}
          - {w: "harto", d: "sated, full; 'harto de' = fed up with, satisfied with"}
          - {w: "tener tomados", d: "to hold (something) taken, to have blocked: 'tener' + participle stresses the lasting result"}
          - {w: "contento", d: "contentment, joy (a noun here)"}
          - {w: "ánima", d: "soul (older, literary word for 'alma')"}
          - {w: "mezquino", d: "wretched, miserable (also 'stingy')"}
          - {w: "en las carnes", d: "in my flesh, in my body"}
        diagram:
          - s: "Levántate, Sancho"
            r: "main verb 1: get up, Sancho"
          - {s: "dijo a este punto don Quijote", r: "speech tag: Don Quijote said at this point"}
          - s: "que ya veo"
            r: "why: for I see now"
            under:
              - s: "la Fortuna"
                r: "what I see, subject: that Fortune"
                under:
                  - {s: "de mi mal no harta", r: "describes 'Fortuna': not sated with my harm"}
              - s: "tiene tomados los caminos todos"
                r: "what I see, verb: has blocked every road"
                under:
                  - s: "por donde pueda venir algún contento"
                    r: "describes 'caminos': by which any joy might come"
                    under:
                      - s: "a esta ánima mezquina"
                        r: "to whom: to this wretched soul"
                        under:
                          - {s: "que tengo en las carnes", r: "describes 'ánima': that I carry in my flesh"}
        forms:
          - {w: "Levántate", f: "levánt- + -a + te → levantarse (to get up), imperative, you (tú), with 'te' stuck on the end and an accent added. The tú imperative of regular verbs is the he-form of the present: levanta."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "veo", f: "ve- + -o → ver (to see), present, I. Irregular: veo, ves, ve, vemos, veis, ven."}
          - {w: "harta", f: "hart- + -a → harto (sated), feminine to match 'Fortuna'."}
          - {w: "tiene tomados", f: "tien- + -e → tener (to have, hold), present, it (Fortune): tengo, tienes, tiene, tenemos, tenéis, tienen; + tomados, the participle of tomar (to take), masculine plural to match 'caminos'. With tener (to have), unlike haber (to have), the participle agrees with the object."}
          - {w: "todos", f: "todo (all), masculine plural to match 'caminos', placed after the noun for emphasis."}
          - {w: "pueda", f: "pued- + -a → poder (to be able), present subjunctive, it: pueda, puedas, pueda, podamos, podáis, puedan. Subjunctive because the roads are any that might bring joy."}
          - {w: "algún", f: "alguno (some, any) clipped before a masculine singular noun ('contento')."}
          - {w: "esta ánima", f: "este (this), feminine to match 'ánima'; 'ánima' keeps 'esta' but would take 'el' as article ('el ánima'), because it starts with a stressed a."}
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I, from the same irregular present: tengo, tienes, tiene, tenemos, tenéis, tienen."}
        note: "Don Quijote quotes love poetry: the half-line on Fortune comes from Garcilaso de la Vega's Third Eclogue, the most admired Spanish poet of the century."
      - es: "Y tú, ¡oh estremo del valor que puede desearse, término de la humana gentileza, único remedio deste afligido corazón que te adora!, ya que el maligno encantador me persigue, y ha puesto nubes y cataratas en mis ojos, y para sólo ellos y no para otros ha mudado y transformado tu sin igual hermosura y rostro en el de una labradora pobre, si ya también el mío no le ha cambiado en el de algún vestiglo, para hacerle aborrecible a tus ojos, no dejes de mirarme blanda y amorosamente, echando de ver en esta sumisión y arrodillamiento que a tu contrahecha hermosura hago, la humildad con que mi alma te adora."
        literal: "And you, oh extreme of-the worth that can be-desired, limit of-the human grace, only remedy of-this afflicted heart that you adores!, since the malign enchanter me persecutes, and has put clouds and cataracts in my eyes, and for only them and not for others has changed and transformed your without equal beauty and face into the [one] of a peasant-woman poor, if indeed also the mine not it has changed into the [one] of some monster, to make-it loathsome to your eyes, not leave-off from looking-at-me soft- and lovingly, throwing of seeing in this submission and kneeling that to your counterfeited beauty I-make, the humility with which my soul you adores."
        ormsby: "And thou, highest perfection of excellence that can be desired, utmost limit of grace in human shape, sole relief of this afflicted heart that adores thee, though the malign enchanter that persecutes me has brought clouds and cataracts on my eyes, and to them, and them only, transformed thy unparagoned beauty and changed thy features into those of a poor peasant girl, if so be he has not at the same time changed mine into those of some monster to render them loathsome in thy sight, refuse not to look upon me with tenderness and love; seeing in this submission that I make on my knees to thy transformed beauty the humility with which my soul adores thee.”"
        vocab:
          - {w: "estremo", d: "= extremo: here the highest point, the height (of perfection)"}
          - {w: "valor", d: "worth, excellence (not 'courage' here)"}
          - {w: "término", d: "limit, utmost bound"}
          - {w: "gentileza", d: "grace, elegance, beauty (false friend: not 'gentleness')"}
          - {w: "deste", d: "= de este, of this"}
          - {w: "ya que", d: "since, seeing that"}
          - {w: "maligno", d: "malign, wicked"}
          - {w: "cataratas", d: "cataracts, the clouding of the eye's lens (also 'waterfalls')"}
          - {w: "mudar", d: "to change, alter"}
          - {w: "sin igual", d: "peerless, matchless"}
          - {w: "si ya ... no", d: "unless, provided that ... not: 'si ya también el mío no le ha cambiado' = unless he has also changed mine"}
          - {w: "vestiglo", d: "monster, hideous creature: a word from the romances of chivalry"}
          - {w: "aborrecible", d: "loathsome, hateful"}
          - {w: "no dejar de", d: "not to fail to, not to stop"}
          - {w: "blanda y amorosamente", d: "softly and lovingly"}
          - {w: "echar de ver", d: "to notice, perceive"}
          - {w: "arrodillamiento", d: "kneeling (a rare noun made from 'arrodillarse')"}
          - {w: "contrahecho", d: "counterfeited, disguised; also 'deformed, misshapen'"}
        diagram:
          - s: "no dejes de mirarme blanda y amorosamente"
            r: "main verb: do not fail to look on me softly and lovingly"
            under:
              - s: "Y tú"
                r: "who he addresses: and you (the girl, as Dulcinea)"
                under:
                  - s: "¡oh estremo del valor"
                    r: "address 1: O height of worth"
                    under:
                      - {s: "que puede desearse", r: "describes 'valor': that one could wish for"}
                  - {s: "término de la humana gentileza", r: "address 2: the very limit of human grace"}
                  - s: "único remedio deste afligido corazón"
                    r: "address 3: the only cure of this afflicted heart"
                    under:
                      - {s: "que te adora!", r: "describes 'corazón': that adores you"}
              - s: "ya que el maligno encantador me persigue"
                r: "why 1: since the wicked enchanter persecutes me"
                under:
                  - {s: "y ha puesto nubes y cataratas en mis ojos", r: "why 2: and has put clouds and cataracts in my eyes"}
                  - s: "y para sólo ellos y no para otros ha mudado y transformado tu sin igual hermosura y rostro"
                    r: "why 3: and, for my eyes alone, has changed your peerless beauty and face"
                    under:
                      - {s: "en el de una labradora pobre", r: "into what: into that of a poor peasant woman"}
                  - s: "si ya también el mío no le ha cambiado en el de algún vestiglo"
                    r: "condition: unless he has also changed my face into a monster's"
                    under:
                      - {s: "para hacerle aborrecible a tus ojos", r: "why: to make it loathsome in your eyes"}
              - s: "echando de ver"
                r: "how: perceiving"
                under:
                  - s: "en esta sumisión y arrodillamiento"
                    r: "where: in this submission and kneeling"
                    under:
                      - {s: "que a tu contrahecha hermosura hago", r: "describes 'sumisión': which I make to your disguised beauty"}
                  - s: "la humildad"
                    r: "object of 'echando de ver': the humility"
                    under:
                      - {s: "con que mi alma te adora", r: "describes 'humildad': with which my soul adores you"}
        forms:
          - {w: "puede desearse", f: "pued- + -e → poder (to be able), present, it: puedo, puedes, puede, podemos, podéis, pueden; + desear (to desire) with 'se' on the end, which makes it passive: 'can be desired'."}
          - {w: "deste", f: "de + este (this), run together, as often in Cervantes; modern 'de este'."}
          - {w: "afligido", f: "aflig- + -ido → afligir (to afflict), participle, masculine to match 'corazón'."}
          - {w: "adora", f: "ador- + -a → adorar (to adore), present, it (the heart; later 'mi alma'). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "persigue", f: "persig- + -ue → perseguir (to persecute), present, he. The e of the stem turns to i when stressed: persigo, persigues, persigue, perseguimos, perseguís, persiguen (gu before e, g before o)."}
          - {w: "ha puesto", f: "ha → haber (to have), present, he: he, has, ha, hemos, habéis, han; + puesto, the irregular participle of poner (to put): the perfect, 'has put'."}
          - {w: "ha mudado y transformado", f: "ha (haber (to have), present, he, the same he, has, ha, hemos, habéis, han) + the participles of mudar (to change) and transformar (to transform), sharing one 'ha'."}
          - {w: "el de", f: "'el' stands for 'rostro' (face): 'into that of'."}
          - {w: "el mío", f: "'mine', masculine to match the understood 'rostro': my face."}
          - {w: "le ha cambiado", f: "ha (haber (to have), present, he: he, has, ha, hemos, habéis, han) + cambiado, the participle of cambiar (to change); 'le' = it (my face): leísmo, 'le' used for a masculine direct object where modern Spanish prefers 'lo'."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun ('vestiglo')."}
          - {w: "hacerle", f: "hacer (to make) + le (it, my face), the pronoun hung on the infinitive after 'para'."}
          - {w: "dejes", f: "dej- + -es → dejar (to leave off), present subjunctive, you (tú). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. A negative command always uses the subjunctive: 'no dejes' = don't fail."}
          - {w: "mirarme", f: "mirar (to look at) + me, the pronoun hung on the infinitive after 'de'."}
          - {w: "blanda y amorosamente", f: "when two -mente adverbs are joined, only the last keeps -mente: blanda(mente) y amorosamente. The adjective is feminine because -mente comes from the feminine noun 'mente'."}
          - {w: "echando", f: "gerund of echar (to throw), in 'echar de ver' (to notice): 'perceiving'."}
          - {w: "contrahecha", f: "irregular participle of contrahacer (to counterfeit), like hecho from hacer (to make), feminine to match 'hermosura'."}
          - {w: "hago", f: "hag- + -o → hacer (to make), present, I. Irregular: hago, haces, hace, hacemos, hacéis, hacen."}
        note: "This is the moment Sancho hoped for: Don Quijote explains the peasant girl by enchantment, exactly as Sancho predicted in his soliloquy. The speech keeps the full rhetoric of a knight addressing his lady in the romances."
  - sentences:
      - es: "— ¡Tomá que mi agüelo! —respondió la aldeana—. ¡Amiguita soy yo de oír resquebrajos! Apártense y déjenmos ir, y agradecérselo hemos."
        literal: "— Take-that, my grandfather! —answered the village-girl—. Little-friend am I of hearing cracks-of-flattery! Move-yourselves-aside and let-us go, and to-thank-you-for-it we-shall."
        ormsby: "“Hey-day! My grandfather!” cried the girl, “much I care for your lovemaking! Get out of the way and let us pass, and we’ll thank you.”"
        vocab:
          - {w: "¡Tomá que mi agüelo!", d: "rustic cry of scornful surprise, 'Well, I never!', 'My grandfather!'; 'tomá' = 'toma' (take that), 'agüelo' = 'abuelo' (grandfather) in village speech"}
          - {w: "¡Amiguita soy yo de ...!", d: "ironic: 'a great one I am for ...!', i.e. I've no time for"}
          - {w: "resquebrajos", d: "the girl's garbling of 'requiebros' (compliments, flirtatious talk), mixed with 'resquebrajo' (crack, split)"}
          - {w: "agradecérselo hemos", d: "old split future = 'se lo agradeceremos', we'll thank you for it"}
        diagram:
          - {s: "¡Tomá que mi agüelo!", r: "exclamation (no main verb): well, I never!"}
          - {s: "respondió la aldeana", r: "speech tag: answered the village girl"}
          - s: "¡Amiguita soy yo"
            r: "main verb 1 (ironic): a fine one I am"
            under:
              - {s: "de oír resquebrajos!", r: "for what: for listening to flattery"}
          - {s: "Apártense", r: "main verb 2: get out of the way"}
          - {s: "y déjenmos ir", r: "main verb 3: and let us go"}
          - {s: "y agradecérselo hemos", r: "main verb 4: and we'll thank you for it"}
        forms:
          - {w: "Tomá", f: "tomar (to take), imperative, you: the vos form 'tomad' with the -d dropped, as in country speech: 'take that!'."}
          - {w: "agüelo", f: "rustic pronunciation of abuelo (grandfather)."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, she. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "soy", f: "ser (to be), present, I. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "Amiguita", f: "amiga + -ita (diminutive), here ironic."}
          - {w: "oír", f: "oír (to hear), infinitive after 'de'."}
          - {w: "Apártense, déjenmos", f: "apárt- + -en + se → apartarse (to move aside) and déj- + -en + mos → dejar (to let), present subjunctive, they, used as commands to the men as 'vuestras mercedes', with the pronouns on the end ('mos' is rustic for 'nos'). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "ir", f: "ir (to go), infinitive after 'déjenmos'."}
          - {w: "agradecérselo hemos", f: "agradecer (to thank) + se (to you: 'les' becomes 'se' before 'lo') + lo (it) + hemos, the present of haber (to have): the old split future, modern 'se lo agradeceremos'. The future was once the infinitive + haber (to have), so pronouns could sit between. agradecer in the future: agradeceré, agradecerás, agradecerá, agradeceremos, agradeceréis, agradecerán."}
  - sentences:
