  - sentences:
      - es: "— No era —respondió Sancho— sino silla a la jineta, con una cubierta de campo que vale la mitad de un reino, según es de rica."
        literal: "— Not it-was —answered Sancho— but saddle at the jineta[-style], with a covering of field that is-worth the half of a kingdom, according-as it-is of rich."
        ormsby: "“It was neither,” replied Sancho, “but a jineta saddle, with a field covering worth half a kingdom, so rich is it.”"
        ormsby_note: "A saddle with a high pummel and cantle and short stirrups."
        vocab:
          - {w: "no ... sino", d: "not ... but, only: 'no era sino' = it was nothing but"}
          - {w: "silla a la jineta", d: "a jineta saddle, for riding with short stirrups and bent knees in the Moorish light-cavalry style"}
          - {w: "cubierta de campo", d: "caparison, a decorative cloth spread over a saddle and horse for show"}
          - {w: "valer", d: "to be worth"}
          - {w: "según es de rica", d: "so rich is it; 'según' + 'es de' + adjective = 'such is its ...'"}
        diagram:
          - s: "No era"
            r: "main verb: it was not"
            under:
              - {s: "—respondió Sancho—", r: "speech tag: Sancho answered"}
              - s: "sino silla a la jineta"
                r: "but: only a jineta saddle"
                under:
                  - s: "con una cubierta de campo"
                    r: "with what: with a caparison"
                    under:
                      - {s: "que vale la mitad de un reino", r: "describes 'cubierta': that is worth half a kingdom"}
                      - {s: "según es de rica", r: "why: so rich it is"}
        forms:
          - {w: "era", f: "er- + -a → ser (to be), imperfect, it. ser (to be) is irregular in the imperfect: era, eras, era, éramos, erais, eran."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "vale", f: "val- + -e → valer (to be worth), present, it. valer in the present: valgo, vales, vale, valemos, valéis, valen."}
          - {w: "es de rica", f: "es (ser (to be), present, it: soy, eres, es, somos, sois, son) + de + rica: 'it is so rich'. rica is feminine to match 'cubierta'."}
        note: "A jineta saddle and a rich caparison are the gear of a fine horseman, not of a peasant girl's donkey; Sancho piles it on because Don Quijote cannot check."
