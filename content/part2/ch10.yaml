  - sentences:
      - es: "— Sepamos agora, Sancho hermano, adónde va vuesa merced."
        literal: "— Let-us-know now, Sancho brother, where goes your grace."
        ormsby: "“Now, brother Sancho, let us know where your worship is going."
        vocab:
          - {w: "agora", d: "= ahora, now (old form)"}
          - {w: "vuesa merced", d: "your grace, your worship: the polite 'you' of the time, ancestor of 'usted'; Sancho uses it to himself as a joke"}
        diagram:
          - s: "Sepamos agora"
            r: "main verb: let us know now"
            under:
              - {s: "Sancho hermano", r: "who is addressed: Sancho, talking to himself"}
              - {s: "adónde va vuesa merced", r: "what we should know: where your worship is going"}
        forms:
          - {w: "Sepamos", f: "sep- + -amos → saber (to know), present subjunctive, we: 'let us know', the usual way to say 'let's'. saber (to know) in the present subjunctive: sepa, sepas, sepa, sepamos, sepáis, sepan."}
          - {w: "va", f: "v- + -a → ir (to go), present, you (vuesa merced takes the 'he/she' form). ir (to go) in the present: voy, vas, va, vamos, vais, van."}
