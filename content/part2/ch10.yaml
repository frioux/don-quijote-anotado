          - {w: "vi", f: "v- + -i → ver (to see), preterite, I. ver (to see) in the preterite: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "la cual", f: "'which', feminine to match 'hermosura'; a heavier relative than 'que', used after a comma and after a preposition ('a')."}
