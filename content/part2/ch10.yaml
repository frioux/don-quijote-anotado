  - sentences:
      - es: "— Poca diferencia hay —respondió Sancho— de cananeas a hacaneas; pero, vengan sobre lo que vinieren, ellas vienen las más galanas señoras que se puedan desear, especialmente la princesa Dulcinea, mi señora, que pasma los sentidos."
        literal: "— Little difference there-is —answered Sancho— from Canaanites to hackneys; but, may-they-come upon that which they-may-come, they come the most elegant ladies that themselves may-be-able to-wish, especially the princess Dulcinea, my lady, who stuns the senses."
        ormsby: "“There is not much difference between cackneys and hackneys,” said Sancho; “but no matter what they come on, there they are, the finest ladies one could wish for, especially my lady the princess Dulcinea, who staggers one’s senses.”"
        ormsby_note: "Sancho perverts the word hacaneas into cananeas, which, if it means anything, means \"Canaanites.\" Possibly Cervantes may have intended a joke on the supposed Oriental origin of the ass, like that in the English slang title \"Jerusalem pony.\""
        vocab:
          - {w: "de ... a", d: "between ... and (when comparing)"}
          - {w: "vengan sobre lo que vinieren", d: "whatever they come riding on"}
          - {w: "galano", d: "elegant, finely dressed, gallant"}
          - {w: "pasmar", d: "to stun, amaze, take the breath away"}
        diagram:
          - s: "Poca diferencia hay"
            r: "main verb 1: there is little difference"
            under:
              - {s: "—respondió Sancho—", r: "speaker"}
              - {s: "de cananeas a hacaneas", r: "between what: between 'cackneys' and hackneys"}
          - s: "ellas vienen"
            r: "main verb 2 (after 'pero'): they come"
            under:
              - {s: "vengan sobre lo que vinieren", r: "concession: whatever they come on"}
              - s: "las más galanas señoras"
                r: "how they come: the finest ladies"
                under:
                  - {s: "que se puedan desear", r: "describes 'señoras': that could be wished for"}
              - s: "especialmente la princesa Dulcinea, mi señora"
                r: "above all: Princess Dulcinea, my lady"
                under:
                  - {s: "que pasma los sentidos", r: "describes 'Dulcinea': who stuns the senses"}
        forms:
          - {w: "hay", f: "the impersonal form of haber (to have), 'there is'. haber (to have) in the present: he, has, ha, hemos, habéis, han; meaning 'there is' it becomes 'hay'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "vengan", f: "veng- + -an → venir (to come), present subjunctive, they: 'let them come'. Irregular: venga, vengas, venga, vengamos, vengáis, vengan."}
          - {w: "vinieren", f: "vin- + -ieren → venir (to come), future subjunctive, they: 'whatever they may come on'. venir (to come) in the future subjunctive: viniere, vinieres, viniere, viniéremos, viniereis, vinieren. Built on the preterite 'vinieron'; modern Spanish says 'vengan en lo que vengan'."}
          - {w: "vienen", f: "vien- + -en → venir (to come), present, they. Irregular: vengo, vienes, viene, venimos, venís, vienen."}
          - {w: "galanas", f: "galan- + -as → galano (elegant), feminine plural to match 'señoras'; 'las más galanas' = the most elegant."}
          - {w: "se puedan desear", f: "pued- + -an → poder (to be able), present subjunctive, they, + desear (to wish); 'se' makes it passive: 'that could be wished for'. poder (to be able) in the present subjunctive: pueda, puedas, pueda, podamos, podáis, puedan."}
          - {w: "pasma", f: "pasm- + -a → pasmar (to stun), present, she. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
  - sentences:
      - es: "— Vamos, Sancho hijo —respondió don Quijote—; y, en albricias destas no esperadas como buenas nuevas, te mando el mejor despojo que ganare en la primera aventura que tuviere, y si esto no te contenta, te mando las crías que este año me dieren las tres yeguas mías, que tú sabes que quedan para parir en el prado concejil de nuestro pueblo."
        literal: "— Let-us-go, Sancho son —answered Don Quijote—; and, in reward-for-news of-these not expected as good tidings, to-you I-promise the best spoil that I-may-win in the first adventure that I-may-have, and if this not you satisfies, to-you I-promise the foals that this year to-me may-give the three mares mine, which you know that remain to give-birth in the meadow common of our village."
        ormsby: "“Let us go, Sancho, my son,” said Don Quixote, “and in guerdon of this news, as unexpected as it is good, I bestow upon thee the best spoil I shall win in the first adventure I may have; or if that does not satisfy thee, I promise thee the foals I shall have this year from my three mares that thou knowest are in foal on our village common.”"
        vocab:
          - {w: "albricias", d: "a reward given to whoever brings good news; 'en albricias de' = as a reward for"}
          - {w: "destas", d: "= de estas, of these (old contraction)"}
          - {w: "no esperadas como buenas", d: "as unexpected as they are good"}
          - {w: "mandar", d: "here 'to promise, bequeath' (as in a will), not 'to order'"}
          - {w: "despojo", d: "spoils, booty taken from a defeated enemy"}
          - {w: "cría", d: "young animal; here a foal"}
          - {w: "yegua", d: "mare"}
          - {w: "quedar para parir", d: "to be about to give birth, be in foal"}
          - {w: "prado concejil", d: "the village common, pasture belonging to the town council ('concejo')"}
        diagram:
          - {s: "Vamos, Sancho hijo", r: "main verb 1: let's go, Sancho my son"}
          - {s: "—respondió don Quijote—", r: "speaker"}
          - s: "te mando"
            r: "main verb 2 (after 'y'): I promise you"
            under:
              - {s: "en albricias destas no esperadas como buenas nuevas", r: "why: as a reward for this news, as unexpected as it is good"}
              - s: "el mejor despojo"
                r: "object: the best spoil"
                under:
                  - s: "que ganare en la primera aventura"
                    r: "describes 'despojo': that I win in the first adventure"
                    under:
                      - {s: "que tuviere", r: "describes 'aventura': that I may have"}
          - s: "te mando las crías"
            r: "main verb 3 (after 'y'): I promise you the foals"
            under:
              - {s: "si esto no te contenta", r: "condition: if this doesn't satisfy you"}
              - s: "que este año me dieren las tres yeguas mías"
                r: "describes 'crías': that my three mares give me this year"
                under:
                  - {s: "que tú sabes que quedan para parir en el prado concejil de nuestro pueblo", r: "describes 'yeguas': which you know are in foal on our village common"}
        forms:
          - {w: "Vamos", f: "v- + -amos → ir (to go), present, we, used as 'let's go'. ir (to go) in the present: voy, vas, va, vamos, vais, van."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "destas", f: "= de + estas; estas is este (this), feminine plural to match 'nuevas'."}
          - {w: "esperadas", f: "participle of esperar (to expect), feminine plural to match 'nuevas'."}
          - {w: "mando", f: "mand- + -o → mandar (to promise, bequeath), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "ganare", f: "gan- + -are → ganar (to win), future subjunctive, I: 'whatever I may win'. The future subjunctive of -ar verbs: -are, -ares, -are, -áremos, -areis, -aren. Modern Spanish uses the present subjunctive 'gane'."}
          - {w: "tuviere", f: "tuv- + -iere → tener (to have), future subjunctive, I. Built on the preterite 'tuvieron': tuviere, tuvieres, tuviere, tuviéremos, tuviereis, tuvieren. Modern 'tenga'."}
          - {w: "contenta", f: "content- + -a → contentar (to satisfy), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "dieren", f: "di- + -eren → dar (to give), future subjunctive, they (the mares). dar (to give) in the future subjunctive: diere, dieres, diere, diéremos, diereis, dieren. Modern 'den'."}
          - {w: "mías", f: "mí- + -as → mío (mine), feminine plural to match 'yeguas'; placed after the noun: 'the three mares of mine'."}
          - {w: "sabes", f: "sab- + -es → saber (to know), present, you (tú). Irregular I-form: sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "quedan", f: "qued- + -an → quedar (to remain), present, they. Same -ar present: -o, -as, -a, -amos, -áis, -an. 'quedar para' + infinitive = to be about to."}
          - {w: "parir", f: "infinitive of parir (to give birth) after 'para'."}
        note: "'Albricias' was a real custom: whoever brought good news expected a present. Don Quijote, as usual, can only pay Sancho in futures: spoils not yet won, foals not yet born."
