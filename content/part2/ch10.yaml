summary: |
  The narrator says the author almost left this chapter out for fear of not being believed, since Don Quijote's madness here goes beyond anything so far; but he wrote it down exactly as it happened, because truth always floats on top of lies like oil on water. Hidden in a wood outside El Toboso, Don Quijote sends Sancho into the town to find Dulcinea and beg her to let herself be seen by her knight, telling him to watch every gesture she makes. Sancho promises to come back quickly.

  Out of sight, Sancho sits under a tree and argues with himself: he is looking for a princess he has never seen, in a town where the locals will beat him for asking about their women. He decides that since his master takes windmills for giants and sheep for armies, he can make him believe that the first peasant girl who comes along is Dulcinea, and swear to it; if Don Quijote does not believe it, he will think enchanters have changed her shape. He waits until the afternoon to make the trip look real.

  Three peasant girls on donkeys come out of El Toboso. Sancho rides back and tells Don Quijote that Dulcinea and two of her ladies are coming, dressed in gold, pearls and brocade, on three fine hackneys. Don Quijote sees only three country girls on donkeys, but Sancho kneels before one of them and addresses her as queen and princess, and Don Quijote kneels beside him, bewildered. The girls answer rudely and want to pass; Don Quijote concludes that an enchanter has transformed Dulcinea in his eyes alone, and begs her to look on him kindly. The 'Dulcinea' prods her donkey, falls off, vaults back on astride like a man, and the three gallop away.

  Don Quijote laments that the enchanters have not only changed Dulcinea into an ugly peasant but taken away her sweet scent: she smelled of raw garlic. Sancho curses the enchanters and invents a mole with long golden hairs on her lip, and Don Quijote reasons that she must have a matching one on her thigh. Sancho can barely hide his laughter. They set off again on the road to Zaragoza, for the yearly festivities there, but many strange things will happen to them before they arrive.
context: |
  Peasants, donkeys and perfume. The girls are 'labradoras', daughters of farming families from El Toboso, and they ride donkeys because that was the ordinary mount of village women, as the narrator says himself. A lady of rank rode a hackney ('hacanea'), a small ambling horse, on a side-saddle or a chair-saddle ('sillón'), and smelled of ambergris and flowers; this girl rides astride, prods her donkey with a goad, and smells of raw garlic, the food of labourers. Every detail Sancho invents (cloth of gold, pearls, brocade 'of more than ten borders', a jineta saddle with a rich caparison) is the uniform of nobility, and every detail Don Quijote sees is the uniform of the peasantry.

  The enchantment of Dulcinea. This is the turning point of the Dulcinea story. In Part I Sancho never delivered Don Quijote's letter, and invented an interview in which he found her sifting wheat. Now he is caught in his own lie, and gets out of it by turning his master's favourite explanation against him: when things look wrong, enchanters have changed them. Until now Don Quijote saw inns as castles and windmills as giants; here, for the first time, he sees the plain truth (three peasant girls on donkeys) and Sancho is the one who insists on the fantasy. Don Quijote's speech to the kneeling girl mixes the language of chivalric love with a line borrowed, as Ormsby notes, from Garcilaso de la Vega's third Eclogue ('la Fortuna, de mi mal no harta'), and the girls answer him in rough village speech.

  Proverbs and ballads. Sancho's soliloquy and his speeches are packed with proverbs (Ormsby numbers them from his own list): 'buen corazón quebranta mala ventura', 'donde no piensa salta la liebre', 'dime con quién andas, decirte he quién eres', 'buscar tres pies al gato', looking for 'Marica in Ravenna, or the bachelor in Salamanca'. He garbles one ('donde no hay tocinos, no hay estacas', a muddle of a proverb about bacon and hooks, as Ormsby notes) and quotes a line from a Bernardo del Carpio ballad, 'mensajero sois, amigo, no merecéis culpa, non', to excuse himself as a mere messenger.

  The narrator's games. The chapter opens with the author's fear of not being believed, and a declaration that truth floats on top of lies like oil on water; Ormsby, following the editor Hartzenbusch, thought this paragraph belonged to a later chapter and left it out. The narrator pretends to scruple over whether the girls rode he-donkeys or she-donkeys, then decides it does not matter. The final paragraph promises more adventures on the road to Zaragoza, where Sansón Carrasco advised Don Quijote to go for the jousts of St George.

  Names and jokes. Sancho calls the hackneys 'cananeas' (Canaanites) instead of 'hacaneas', and Don Quijote corrects him. 'Lunar' (mole) suggests 'luna' (moon), so Dulcinea's moles would be 'moons and shining stars'. 'Agallas' means both the gills of the sardines Sancho wants to see the enchanters strung up by, and the oak galls the enchanters made of her eyes. 'Roque', in Sancho's oath, is obscure, as Ormsby admits.

  Reading Cervantes' Spanish. The chapter is full of old forms: desta, della, dél (de + este, ella, él), agora (ahora), mesmo (mismo), trujo (trajo), recebir (recibir), estiende (extiende), solenes (solemnes), faciones (facciones), coluna (columna), priesa (prisa), luengos (largos), habemos (hemos), llegé (llegué), 'desface los tuertos' with the old f-, and the old -ades ending in 'tocárades'. The village girls add rustic forms: 'nora en tal', 'déjenmos', 'e' for 'y', 'nueso' for 'nuestro', 'agüelo' for 'abuelo', 'Tomá'. The future is still split around a pronoun ('decirte he', 'serles ha', 'agradecérselo hemos'). Pronouns hang on verbs that open a clause (Encargóse, turbóse, hallóle, Siguiólas, sucedióle). The future subjunctive marks open futures (vieres, estuvieres, diere, relatares, topare, jurare, porfiare, ganare, vinieren), the -ra form serves as a conditional (quisiera, pudiera, fueran, sacáramos), and 'haber de' means 'must' or 'be going to'. Watch the false friends: industria (cunning trick), advertir (to notice), razones (words), blanco (target), lunar (mole), en efecto (in fact), parecer (to appear, be in sight).
