          - s: "y don Quijote se quedó a caballo"
            r: "main verb 3: and Don Quijote stayed on horseback"
            under:
              - {s: "descansando sobre los estribos y sobre el arrimo de su lanza", r: "how: resting on his stirrups and leaning on his lance"}
              - {s: "lleno de tristes y confusas imaginaciones", r: "how, 2: full of sad and confused thoughts"}
              - s: "donde le dejaremos"
