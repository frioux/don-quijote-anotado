  - sentences:
      - es: "— Apártense nora en tal del camino, y déjenmos pasar, que vamos de priesa."
        literal: "— Move-yourselves-aside in-an-evil-hour from-the road, and let-us pass, for we-go in haste."
        ormsby: "“Get out of the way, bad luck to you, and let us pass, for we are in a hurry.”"
        vocab:
          - {w: "apartarse", d: "to move aside, get out of the way"}
          - {w: "nora en tal", d: "rustic curse, 'bad luck to you': 'nora' = 'en hora' (in an hour), and 'tal' (such) is a polite stand-in for 'mala' in 'en hora mala' (in an evil hour)"}
          - {w: "déjenmos", d: "rustic for 'déjennos', let us"}
          - {w: "de priesa", d: "= de prisa, in a hurry ('priesa' is the old form)"}
        diagram:
          - s: "Apártense"
            r: "main verb 1: get out of the way"
            under:
              - {s: "nora en tal", r: "curse: bad luck to you"}
              - {s: "del camino", r: "from where: off the road"}
          - s: "y déjenmos pasar"
            r: "main verb 2: and let us pass"
            under:
              - {s: "que vamos de priesa", r: "why: for we are in a hurry"}
        forms:
          - {w: "Apártense", f: "apárt- + -en + se → apartarse (to move aside), present subjunctive, they, used as a command to the two men as 'vuestras mercedes' (you, polite plural), with 'se' stuck on the end and an accent added. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "déjenmos", f: "déj- + -en + mos → dejar (to let), the same -en present subjunctive used as a command, with the rustic 'mos' for 'nos' (us) stuck on the end; modern 'déjennos'."}
          - {w: "vamos", f: "ir (to go), present, we. Irregular: voy, vas, va, vamos, vais, van."}
          - {w: "priesa", f: "old form of prisa (haste)."}
        note: "The girl's speech is pure village Spanish, a comic contrast with Sancho's courtly phrases."
