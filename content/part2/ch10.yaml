  - sentences:
      - es: "— Ahora bien, todas las cosas tienen remedio, si no es la muerte, debajo de cuyo yugo hemos de pasar todos, mal que nos pese, al acabar de la vida."
        literal: "— Now well, all the things have remedy, if not it-is the death, under of whose yoke we-have to pass all, ill that us it-may-weigh, at-the ending of the life."
        ormsby: "“Well, there’s remedy for everything except death, under whose yoke we have all to pass, whether we like it or not, when life’s finished."
        ormsby_note: "Proverb 144."
        vocab:
          - {w: "ahora bien", d: "well then, all right"}
          - {w: "si no es", d: "except, unless it is"}
          - {w: "yugo", d: "yoke"}
          - {w: "haber de", d: "must, have to"}
          - {w: "mal que nos pese", d: "whether we like it or not, however much it grieves us (pesar = to weigh on, grieve)"}
          - {w: "al acabar de la vida", d: "at the end of life"}
        diagram:
          - s: "todas las cosas tienen remedio"
            r: "main verb: everything has a remedy"
            under:
              - {s: "Ahora bien", r: "linking: well then"}
              - s: "si no es la muerte"
                r: "exception: except death"
                under:
                  - s: "debajo de cuyo yugo hemos de pasar todos"
                    r: "describes 'muerte': under whose yoke we must all pass"
                    under:
                      - {s: "mal que nos pese", r: "how: whether we like it or not"}
                      - {s: "al acabar de la vida", r: "when: at the end of life"}
        forms:
          - {w: "tienen", f: "tien- + -en → tener (to have), present, they (things). Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "cuyo", f: "'whose', a relative that agrees with the thing owned ('yugo', masculine singular), not the owner."}
          - {w: "hemos de pasar", f: "h- + -emos → haber (to have), present, we, + de + pasar (to pass): 'we must pass'. haber (to have) in the present: he, has, ha, hemos, habéis, han."}
          - {w: "pese", f: "pes- + -e → pesar (to weigh, grieve), present subjunctive, it. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "al acabar", f: "al (a + el) + infinitive acabar (to end), used as a noun: 'at the ending'."}
        note: "Sancho comforts himself with a proverb: 'there is a remedy for everything but death'. The remedy he is about to invent is a lie."
      - es: "Este mi amo, por mil señales, he visto que es un loco de atar, y aun también yo no le quedo en zaga, pues soy más mentecato que él, pues le sigo y le sirvo, si es verdadero el refrán que dice:"
        literal: "This my master, by thousand signs, I-have seen that he-is a madman of tying, and even also I not to-him remain in rear, since I-am more foolish than he, since him I-follow and him I-serve, if is true the proverb that says:"
        ormsby: "I have seen by a thousand signs that this master of mine is a madman fit to be tied, and for that matter, I too, am not behind him; for I’m a greater fool than he is when I follow him and serve him, if there’s any truth in the proverb that says,"
        vocab:
          - {w: "este mi amo", d: "this master of mine: old Spanish could put a demonstrative and a possessive together"}
          - {w: "señal", d: "sign, indication"}
          - {w: "loco de atar", d: "a madman fit to be tied, raving mad"}
          - {w: "no quedar en zaga a alguien", d: "not to lag behind someone, to be every bit as ... ('zaga' = the rear)"}
          - {w: "mentecato", d: "fool, simpleton"}
          - {w: "refrán", d: "proverb, saying"}
        diagram:
          - s: "he visto"
            r: "main verb 1: I have seen"
            under:
              - {s: "por mil señales", r: "how: by a thousand signs"}
              - {s: "Este mi amo", r: "topic, put first: this master of mine"}
              - {s: "que es un loco de atar", r: "what I have seen: that he is raving mad"}
          - s: "y aun también yo no le quedo en zaga"
            r: "main verb 2: and I am not far behind him either"
            under:
              - s: "pues soy más mentecato que él"
                r: "why: for I am a bigger fool than he is"
                under:
                  - {s: "pues le sigo y le sirvo", r: "why: since I follow and serve him"}
                  - s: "si es verdadero el refrán"
                    r: "condition: if the proverb is true"
                    under:
                      - {s: "que dice:", r: "describes 'refrán': that says"}
        forms:
          - {w: "he visto", f: "h- + -e → haber (to have), present, I, + visto, irregular participle of ver (to see): 'I have seen'. haber (to have) in the present: he, has, ha, hemos, habéis, han."}
          - {w: "es, soy", f: "ser (to be), present, he and I: soy, eres, es, somos, sois, son."}
          - {w: "de atar", f: "de + infinitive atar (to tie): 'to be tied', describing 'loco'."}
          - {w: "quedo", f: "qued- + -o → quedar (to remain), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "le", f: "'him' (Don Quijote) as a direct object: leísmo, the use of 'le' instead of 'lo' for a male person, normal in Cervantes; in 'no le quedo en zaga' it is 'to him'."}
          - {w: "sigo, sirvo", f: "sig- + -o → seguir (to follow) and sirv- + -o → servir (to serve), present, I. The stem e becomes i: sigo, sigues, sigue, seguimos, seguís, siguen; sirvo, sirves, sirve, servimos, servís, sirven."}
          - {w: "dice", f: "dic- + -e → decir (to say), present, it (the proverb). Irregular: digo, dices, dice, decimos, decís, dicen."}
      - es: "\"Dime con quién andas, decirte he quién eres\", y el otro de \"No con quien naces, sino con quien paces\"."
        literal: "\"Tell-me with whom you-go-about, to-tell-you I-will who you-are\", and the other of \"Not with whom you-are-born, but with whom you-graze\"."
        ormsby: "‘Tell me what company thou keepest, and I’ll tell thee what thou art,’ or in that other, ‘Not with whom thou art bred, but with whom thou art fed.’"
        ormsby_note: "Proverbs 13, 153."
        vocab:
          - {w: "andar con", d: "to go about with, keep company with"}
          - {w: "decirte he", d: "= te diré, I will tell you: the old future split in two, with the pronoun between infinitive and ending"}
          - {w: "pacer", d: "to graze, pasture; here 'whom you feed with', i.e. the company you keep"}
        diagram:
          - s: "\"Dime con quién andas, decirte he quién eres\""
            r: "proverb 1: tell me who you go with and I'll tell you who you are"
          - s: "y el otro de"
            r: "and the other proverb (still after 'si es verdadero')"
            under:
              - {s: "\"No con quien naces, sino con quien paces\"", r: "proverb 2: not who you are born with, but who you graze with"}
        forms:
          - {w: "Dime", f: "di + me → decir (to say), imperative, you (tú), with 'me' (to me) stuck on the end: 'tell me'. The tú imperative of decir (to say) is irregular: di."}
          - {w: "andas", f: "and- + -as → andar (to go about), present, you. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "decirte he", f: "decir (to say) + te (you) + he (haber (to have), present, I): the old split future, modern 'te diré', 'I will tell you'. The future was once infinitive + haber (to have), so the pronoun could sit between: decirte he, decirte has, decirte ha. The modern future of decir (to say): diré, dirás, dirá, diremos, diréis, dirán."}
          - {w: "eres", f: "er- + -es → ser (to be), present, you: soy, eres, es, somos, sois, son."}
          - {w: "naces, paces", f: "nac- + -es → nacer (to be born) and pac- + -es → pacer (to graze), present, you. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (nazco, pazco in the I form)."}
        note: "Both proverbs say that you become like the company you keep; the second rhymes 'naces' with 'paces' (where you are born / where you graze). So, Sancho argues, if his master is mad, he must be madder for following him."
      - es: "Siendo, pues, loco, como lo es, y de locura que las más veces toma unas cosas por otras, y juzga lo blanco por negro y lo negro por blanco, como se pareció cuando dijo que los molinos de viento eran gigantes, y las mulas de los religiosos dromedarios, y las manadas de carneros ejércitos de enemigos, y otras muchas cosas a este tono, no será muy difícil hacerle creer que una labradora, la primera que me topare por aquí, es la señora Dulcinea;"
        literal: "Being, then, mad, as it he-is, and of madness that the most times takes some things for others, and judges the white for black and the black for white, as itself it-appeared when he-said that the mills of wind were giants, and the mules of the monks dromedaries, and the flocks of rams armies of enemies, and other many things at this tune, not it-will-be very difficult to-make-him believe that a peasant-girl, the first that me I-may-come-upon around here, is the lady Dulcinea;"
        ormsby: "Well then, if he be mad, as he is, and with a madness that mostly takes one thing for another, and white for black, and black for white, as was seen when he said the windmills were giants, and the monks’ mules dromedaries, flocks of sheep armies of enemies, and much more to the same tune, it will not be very hard to make him believe that some country girl, the first I come across here, is the lady Dulcinea;"
