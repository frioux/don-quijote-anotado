              - s: "que le parecían allí"
                r: "what I can tell: that they looked there on her"
                under:
                  - {s: "como nacidos", r: "how: as if they had grown there"}
        forms:
          - {w: "sé", f: "saber (to know), present, I; the accent tells it from the pronoun 'se'. saber (to know) in the present: sé, sabes, sabe, sabemos, sabéis, saben. With an infinitive it means 'to know how to, be able to'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "le parecían", f: "parec- + -ían → parecer (to look, seem), imperfect, they (the hairs), with 'le' (on her): 'they looked on her'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "nacidos", f: "participle of nacer (to be born), masculine plural to match the hairs ('pelos')."}
  - sentences:
      - es: "— Yo lo creo, amigo —replicó don Quijote—, porque ninguna cosa puso la naturaleza en Dulcinea que no fuese perfecta y bien acabada; y así, si tuviera cien lunares como el que dices, en ella no fueran lunares, sino lunas y estrellas resplandecientes."
        literal: "— I it believe, friend —replied Don Quijote—, because no thing put the nature in Dulcinea that not might-be perfect and well finished; and so, if she-had a-hundred moles like the [one] that you-say, in her not they-would-be moles, but moons and stars shining."
        ormsby: "“I believe it, my friend,” returned Don Quixote; “for nature bestowed nothing on Dulcinea that was not perfect and well-finished; and so, if she had a hundred moles like the one thou hast described, in her they would not be moles, but moons and shining stars."
        vocab:
          - {w: "replicar", d: "to reply, answer back"}
          - {w: "bien acabado", d: "well finished, perfectly made"}
          - {w: "lunares ... lunas", d: "a pun: 'lunar' (mole) looks like it comes from 'luna' (moon), so her moles would be moons"}
          - {w: "resplandeciente", d: "shining, gleaming"}
        diagram:
          - s: "Yo lo creo"
            r: "main verb 1: I believe it"
            under:
              - {s: "amigo", r: "the one spoken to"}
              - {s: "—replicó don Quijote—", r: "speech tag: Don Quijote replied"}
              - s: "porque ninguna cosa puso la naturaleza en Dulcinea"
                r: "why: because nature put nothing in Dulcinea"
                under:
                  - {s: "que no fuese perfecta y bien acabada", r: "describes 'cosa': that was not perfect and finished"}
          - s: "en ella no fueran lunares"
            r: "main verb 2 (after 'y así', and so): in her they would not be moles"
            under:
              - {s: "si tuviera cien lunares", r: "condition: if she had a hundred moles"}
              - {s: "como el que dices", r: "like what: like the one you mention"}
              - {s: "sino lunas y estrellas resplandecientes", r: "but instead: but moons and shining stars"}
        forms:
          - {w: "creo", f: "cre- + -o → creer (to believe), present, I. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "ninguna cosa ... que no", f: "ninguno (no) + -a, feminine to match 'cosa'; with 'que no' after it: 'nothing that was not', i.e. everything was."}
          - {w: "puso", f: "pus- + -o → poner (to put), preterite, it (nature). Irregular: puse, pusiste, puso, pusimos, pusisteis, pusieron. The subject 'la naturaleza' follows the verb."}
          - {w: "fuese", f: "fu- + -ese → ser (to be), imperfect subjunctive (-se form), it: fuese, fueses, fuese, fuésemos, fueseis, fuesen. Subjunctive because the 'thing' is denied to exist."}
          - {w: "tuviera", f: "tuv- + -iera → tener (to have), imperfect subjunctive (-ra form), she, in an 'if' clause: 'if she had'. tuviera, tuvieras, tuviera, tuviéramos, tuvierais, tuvieran."}
          - {w: "dices", f: "dic- + -es → decir (to say), present, you. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "fueran", f: "fu- + -eran → ser (to be), imperfect subjunctive (-ra form), they, used as a conditional: 'they would be'. fuera, fueras, fuera, fuéramos, fuerais, fueran."}
          - {w: "resplandecientes", f: "resplandec- + -iente → resplandecer (to shine), the -iente adjective ('shining'), plural to match 'lunas y estrellas'."}
      - es: "Pero dime, Sancho: aquella que a mí me pareció albarda, que tú aderezaste, ¿era silla rasa o sillón?"
