  - sentences:
      - es: "— Tan buenas —respondió Sancho—, que no tiene más que hacer vuesa merced sino picar a Rocinante y salir a lo raso a ver a la señora Dulcinea del Toboso, que con otras dos doncellas suyas viene a ver a vuesa merced."
        literal: "— So good —answered Sancho—, that not has more to do your grace but to-spur [to] Rocinante and to-go-out to the open to see [to] the lady Dulcinea del Toboso, who with other two damsels hers comes to see [to] your grace."
        ormsby: "“So good,” replied Sancho, “that your worship has only to spur Rocinante and get out into the open field to see the lady Dulcinea del Toboso, who, with two others, damsels of hers, is coming to see your worship.”"
        vocab:
          - {w: "no tener más que hacer sino", d: "to have nothing more to do than, only have to"}
          - {w: "picar", d: "to spur, prick (a horse)"}
          - {w: "a lo raso", d: "into the open, out of the trees"}
          - {w: "doncella", d: "damsel, maiden; also a lady's waiting-woman"}
        diagram:
          - s: "Tan buenas"
            r: "answer: so good (the news)"
            under:
              - {s: "—respondió Sancho—", r: "speaker"}
              - s: "que no tiene más que hacer vuesa merced"
                r: "result: that your grace has nothing more to do"
                under:
                  - {s: "sino picar a Rocinante", r: "except: than spur Rocinante"}
                  - {s: "y salir a lo raso", r: "except, 2: and go out into the open"}
                  - s: "a ver a la señora Dulcinea del Toboso"
                    r: "purpose: to see the lady Dulcinea"
                    under:
                      - {s: "que con otras dos doncellas suyas viene a ver a vuesa merced", r: "describes 'Dulcinea': who is coming with two of her damsels to see you"}
        forms:
          - {w: "buenas", f: "buen- + -as → bueno (good), feminine plural to match 'nuevas' (news), understood from the previous line."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, you (vuesa merced takes the he/she form). Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "picar, salir", f: "infinitives of picar (to spur) and salir (to go out) after 'sino' (but, except)."}
          - {w: "a Rocinante", f: "the personal 'a', used before a named animal as before a person."}
          - {w: "suyas", f: "suy- + -as → suyo (hers), feminine plural to match 'doncellas': 'damsels of hers'."}
          - {w: "viene", f: "vien- + -e → venir (to come), present, she. Irregular: vengo, vienes, viene, venimos, venís, vienen. 'venir a ver' = to come to see."}
        note: "Sancho is inventing all of it: what is coming is three peasant girls on donkeys. He has decided to pass one of them off as Dulcinea."
