  - sentences:
      - es: "— ¿Qué hay, Sancho amigo? ¿Podré señalar este día con piedra blanca, o con negra?"
        literal: "— What is-there, Sancho friend? Will-I-be-able to-mark this day with stone white, or with black?"
        ormsby: "“What news, Sancho, my friend? Am I to mark this day with a white stone or a black?”"
        vocab:
          - {w: "¿qué hay?", d: "what news? what's happening?"}
          - {w: "señalar con piedra blanca", d: "to mark (a day) with a white stone, i.e. count it a lucky day; a black stone marks an unlucky one"}
        diagram:
          - {s: "¿Qué hay, Sancho amigo?", r: "question 1: what news, Sancho my friend?"}
          - s: "¿Podré señalar"
            r: "question 2, main verb: shall I be able to mark"
            under:
              - {s: "este día", r: "object: this day"}
              - {s: "con piedra blanca, o con negra", r: "how: with a white stone or a black one"}
        forms:
          - {w: "hay", f: "the impersonal form of haber (to have), 'there is'. haber (to have) in the present: he, has, ha, hemos, habéis, han; when it means 'there is/are' the form is 'hay'."}
          - {w: "Podré", f: "podr- + -é → poder (to be able), future, I. Irregular stem podr-: podré, podrás, podrá, podremos, podréis, podrán. The infinitive 'señalar' (to mark) hangs on it."}
          - {w: "negra", f: "negr- + -a → negro (black), feminine to match 'piedra', which is understood: 'with a black [stone]'."}
        note: "The image is classical: Latin writers such as Catullus and Pliny speak of marking happy days with a white stone and unhappy ones with a black. Don Quijote asks whether today is a lucky day or an unlucky one."
  - sentences:
      - es: "— Mejor será —respondió Sancho— que vuesa merced le señale con almagre, como rétulos de cátedras, porque le echen bien de ver los que le vieren."
        literal: "— Better it-will-be —answered Sancho— that your grace it may-mark with red-ochre, like notices of professorships, so-that it they-may-notice well those who it may-see."
        ormsby: "“Your worship,” replied Sancho, “had better mark it with ruddle, like the lists on the professors’ chairs, that those who see it may see it plain.”"
        ormsby_note: "I.e., the lists of bachelors qualified for degrees."
        vocab:
          - {w: "vuesa merced", d: "= vuestra merced, 'your grace', the polite 'you'; it takes the he/she form of the verb (modern 'usted' comes from it)"}
          - {w: "almagre", d: "red ochre, a red earth used for marking and painting"}
          - {w: "rétulo", d: "= rótulo (old form), notice, placard, inscription"}
          - {w: "cátedra", d: "university chair, professorship; here the university and its posted lists of successful candidates"}
          - {w: "porque", d: "here 'so that' (with the subjunctive), not 'because'"}
          - {w: "echar de ver", d: "to notice, see clearly"}
        diagram:
          - s: "Mejor será"
            r: "main verb: it will be better"
            under:
              - {s: "—respondió Sancho—", r: "speaker"}
              - s: "que vuesa merced le señale con almagre"
                r: "what will be better: that your grace mark it in red ochre"
                under:
                  - {s: "como rétulos de cátedras", r: "how: like the notices at the universities"}
                  - s: "porque le echen bien de ver"
                    r: "purpose: so that they notice it clearly"
                    under:
                      - {s: "los que le vieren", r: "subject of 'echen': whoever sees it"}
        forms:
          - {w: "será", f: "ser- + -á → ser (to be), future, it. ser (to be) in the future: seré, serás, será, seremos, seréis, serán."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "señale", f: "señal- + -e → señalar (to mark), present subjunctive, you (vuesa merced takes the he/she form). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. Subjunctive after 'mejor será que' (it would be better that)."}
          - {w: "le", f: "'it', standing for 'este día'. Cervantes often uses 'le' for a masculine object where modern standard Spanish prefers 'lo' (leísmo)."}
          - {w: "echen", f: "ech- + -en → echar (to throw), present subjunctive, they, in the phrase 'echar de ver' (to notice). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. Subjunctive because 'porque' here means 'so that'."}
          - {w: "vieren", f: "vi- + -eren → ver (to see), future subjunctive, they: 'whoever may see'. ver (to see) in the future subjunctive: viere, vieres, viere, viéremos, viereis, vieren. Built on the preterite 'vieron'; modern Spanish uses the present subjunctive 'vean'."}
        note: "When a student won a degree or a chair at Salamanca or Alcalá, his name was painted up in red on the walls of the university, and such red lettering can still be seen there. Sancho means the day deserves the most visible mark of all."
