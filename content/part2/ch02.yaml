          - {w: "vestido, remendado, roto", f: "participles of vestir (to dress), remendar (to patch) and romper (to tear, irregular: roto), masculine to match 'I', Don Quijote."}
          - {w: "podría", f: "podr- + -ía → poder (to be able), conditional, it. Irregular stem podr-: podría, podrías, podría, podríamos, podríais, podrían."}
