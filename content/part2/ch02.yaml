          - {w: "sepas", f: "sep- + -as → saber (to know), present subjunctive, you (tú). Irregular: sepa, sepas, sepa, sepamos, sepáis, sepan. Subjunctive after 'quiero que'."}
          - {w: "llegase", f: "lleg- + -ase → llegar (to arrive), imperfect subjunctive (-se form), it (the truth). The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. 'si' + imperfect subjunctive = an unreal condition."}
          - {w: "correrían", f: "correr- + -ían → correr (to run), conditional, they. The conditional adds endings to the whole infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
