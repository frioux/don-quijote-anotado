              - s: "pues ... que el autor de la historia se llama Cide Hamete Berenjena!"
                r: "why: since the author of the history is called Cide Hamete Aubergine"
                under:
                  - s: "según dice el bachiller Sansón Carrasco"
                    r: "source: as the bachelor Sansón Carrasco says"
                    under:
                      - {s: "que así se llama el que dicho tengo", r: "aside: for that's the name of the man I spoke of"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "era", f: "era → ser (to be), imperfect, he. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "dice", f: "dic- + -e → decir (to say), present, he. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "se llama", f: "llam- + -a → llamar (to call) with 'se': llamarse (to be called), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "dicho tengo", f: "teng- + -o → tener (to have), present, I: tengo, tienes, tiene, tenemos, tenéis, tienen; + dicho, irregular participle of decir (to say), put first: 'tener dicho' = to have said (already)."}
