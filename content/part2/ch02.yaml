          - {w: "entiendo", f: "entiend- + -o → entender (to understand, judge), present, I. The stem e becomes ie when stressed: entiendo, entiendes, entiende, entendemos, entendéis, entienden."}
          - {w: "se usan", f: "us- + -an → usar (to use) with 'se', passive: 'are in use'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "es", f: "es → ser (to be), present, it (our age). Irregular: soy, eres, es, somos, sois, son."}
          - {w: "dorada", f: "dor- + -ada → dorar (to gild), participle, feminine to match 'la (edad)': 'golden'."}
        note: "The myth of the four ages, golden to iron, comes from Hesiod and Ovid; Don Quijote gave a whole speech on the golden age to the goatherds in Part I chapter 11. His point is that our age, bad as it is, would look golden beside the others if princes heard the truth."
      - es: "Sírvate este advertimiento, Sancho, para que discreta y bienintencionadamente pongas en mis oídos la verdad de las cosas que supieres de lo que te he preguntado."
        literal: "May-it-serve-you this warning, Sancho, so that sensibly and well-meaningly you-put in my ears the truth of the things that you-may-know of what you I-have asked."
        ormsby: "Profit by this advice, Sancho, and report to me clearly and faithfully the truth of what thou knowest touching what I have demanded of thee.”"
        vocab:
          - {w: "advertimiento", d: "warning, piece of advice (modern 'advertencia')"}
          - {w: "discreto", d: "sensible, prudent (false friend: not mainly 'discreet')"}
          - {w: "bienintencionado", d: "well-meaning"}
          - {w: "poner en los oídos", d: "to bring to someone's ears, tell"}
        diagram:
          - s: "Sírvate"
            r: "main verb: let it serve you"
            under:
              - {s: "este advertimiento", r: "subject: this warning"}
              - {s: "Sancho", r: "addressed to: Sancho"}
              - s: "para que discreta y bienintencionadamente pongas en mis oídos la verdad de las cosas"
                r: "purpose: so that you tell me, sensibly and in good faith, the truth of the things"
                under:
                  - {s: "que supieres de lo que te he preguntado", r: "describes 'cosas': that you may know about what I have asked you"}
        forms:
          - {w: "Sírvate", f: "sirv- + -a + te → servir (to serve), present subjunctive, it, with 'te' (you) stuck on the end: 'may it serve you'; modern 'que te sirva'. The present subjunctive of servir: sirva, sirvas, sirva, sirvamos, sirváis, sirvan. Cervantes hangs the pronoun on a verb that opens the clause."}
          - {w: "discreta y bienintencionadamente", f: "two adverbs in -mente: when two come together, only the last takes -mente and the first keeps its feminine form (discreta)."}
          - {w: "pongas", f: "pong- + -as → poner (to put), present subjunctive, you (tú). Irregular: ponga, pongas, ponga, pongamos, pongáis, pongan. Subjunctive after 'para que'."}
          - {w: "supieres", f: "supi- + -eres → saber (to know), future subjunctive, you (tú): 'whatever you may know'. Irregular: supiere, supieres, supiere, supiéremos, supiereis, supieren. Cervantes uses it for an open future after 'que', 'si', 'donde'; modern Spanish uses the present subjunctive 'sepas'."}
          - {w: "he preguntado", f: "he → haber (to have), present, I: he, has, ha, hemos, habéis, han; + preguntado, participle of preguntar (to ask): the perfect, 'I have asked'."}
  - sentences:
      - es: "— Eso haré yo de muy buena gana, señor mío —respondió Sancho—, con condición que vuestra merced no se ha de enojar de lo que dijere, pues quiere que lo diga en cueros, sin vestirlo de otras ropas de aquellas con que llegaron a mi noticia."
        literal: "— That will-do I of very good will, sir mine —answered Sancho—, on condition that your grace not himself has to anger at what I-may-say, since he-wants that it I-say in skins, without dressing-it in other clothes than those with which they-arrived to my knowledge."
        ormsby: "“That I will do with all my heart, master,” replied Sancho, “provided your worship will not be vexed at what I say, as you wish me to say it out in all its nakedness, without putting any more clothes on it than it came to my knowledge in.”"
        vocab:
          - {w: "de buena gana", d: "gladly, willingly"}
          - {w: "con condición que", d: "on condition that, provided that (modern 'con la condición de que')"}
          - {w: "vuestra merced", d: "your grace, your worship: the polite 'you', taking 'he/she' verb forms"}
          - {w: "enojarse de", d: "to be angry at, be vexed by"}
          - {w: "en cueros", d: "stark naked (literally 'in skins')"}
          - {w: "llegar a la noticia de", d: "to come to someone's knowledge"}
        diagram:
          - s: "Eso haré yo de muy buena gana"
            r: "main verb: that I'll do very gladly"
            under:
              - {s: "señor mío", r: "addressed to: my master"}
              - {s: "respondió Sancho", r: "speech tag: Sancho answered"}
              - s: "con condición que vuestra merced no se ha de enojar de lo que dijere"
                r: "condition: provided your grace won't be angry at what I may say"
                under:
                  - s: "pues quiere que lo diga en cueros"
                    r: "why: since you want me to say it stark naked"
                    under:
                      - {s: "sin vestirlo de otras ropas de aquellas con que llegaron a mi noticia", r: "how: without dressing it in any clothes other than those it came to me in"}
        forms:
          - {w: "haré", f: "har- + -é → hacer (to do), future, I. Irregular stem har-: haré, harás, hará, haremos, haréis, harán."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "se ha de enojar", f: "ha → haber (to have), present, he (vuestra merced): he, has, ha, hemos, habéis, han; + de + enojar (to anger) with 'se': enojarse (to get angry); 'haber de' + infinitive = to be going to, must."}
          - {w: "dijere", f: "dij- + -ere → decir (to say), future subjunctive, I: 'whatever I may say'. Irregular: dijere, dijeres, dijere, dijéremos, dijereis, dijeren. Cervantes uses it for an open future after 'lo que', 'si', 'donde'; modern Spanish uses the present subjunctive 'diga'."}
          - {w: "quiere", f: "quier- + -e → querer (to want), present, he (vuestra merced). The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "diga", f: "dig- + -a → decir (to say), present subjunctive, I. Irregular: diga, digas, diga, digamos, digáis, digan. Subjunctive after 'quiere que'."}
          - {w: "vestirlo", f: "vestir (to dress) + lo (it), the pronoun hung on the infinitive after 'sin'."}
          - {w: "llegaron", f: "lleg- + -aron → llegar (to arrive), preterite, they (the things said). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
        note: "Sancho takes up his master's image of the naked truth without the clothes of flattery and makes it literal: he will deliver it 'en cueros', stark naked."
  - sentences:
