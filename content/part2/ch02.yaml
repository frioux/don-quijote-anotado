  - sentences:
      - es: "— Eso estaba puesto en razón —respondió Sancho—, porque, según vuestra merced dice, más anejas son a los caballeros andantes las desgracias que a sus escuderos."
        literal: "— That was put in reason —answered Sancho—, because, according-to [what] your grace says, more attached are to the knights errant the misfortunes than to their squires."
        ormsby: "“That was only reasonable,” replied Sancho, “for, by what your worship says, misfortunes belong more properly to knights-errant than to their squires.”"
        vocab:
          - {w: "estar puesto en razón", d: "to be only reasonable, be fair and right"}
          - {w: "vuestra merced", d: "your grace, your worship: the polite 'you', taking 'he/she' verb forms (modern 'usted' comes from it)"}
          - {w: "anejo", d: "attached to, belonging to, going with (modern 'anexo')"}
          - {w: "caballero andante", d: "knight errant"}
          - {w: "desgracia", d: "misfortune (false friend: not 'disgrace')"}
        diagram:
          - s: "Eso estaba puesto en razón"
            r: "main verb: that was only right"
            under:
              - {s: "respondió Sancho", r: "speech tag: Sancho answered"}
              - s: "porque ... más anejas son a los caballeros andantes las desgracias que a sus escuderos"
                r: "why: because misfortunes belong more to knights errant than to their squires"
                under:
                  - {s: "según vuestra merced dice", r: "source: as your grace says"}
        forms:
          - {w: "estaba puesto", f: "est- + -aba → estar (to be), imperfect, it: estaba, estabas, estaba, estábamos, estabais, estaban; + puesto, irregular participle of poner (to put): 'was placed (in reason)'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "dice", f: "dic- + -e → decir (to say), present, he (vuestra merced). Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "anejas son", f: "anej- + -as → anejo (attached), feminine plural to match 'desgracias'; son → ser (to be), present, they: soy, eres, es, somos, sois, son. Adjective and verb come before the subject 'las desgracias'."}
          - {w: "andantes", f: "andante (errant, wandering), from andar (to walk) + -ante, plural to match 'caballeros'."}
        note: "Sancho turns Don Quijote's complaint into a compliment: if the knight got the beatings, that is only proper, since misfortunes belong to knights errant more than to squires."
  - sentences:
