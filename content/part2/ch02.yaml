part: 2
chapter: 2
title_es: "Capítulo II. Que trata de la notable pendencia que Sancho Panza tuvo con la sobrina y ama de don Quijote, con otros sujetos graciosos"
title_en: "Which treats of the notable altercation which Sancho Panza had with Don Quixote’s niece, and housekeeper, together with other droll matters"
paragraphs:
  - sentences:
      - es: "Cuenta la historia que las voces que oyeron don Quijote, el cura y el barbero eran de la sobrina y ama, que las daban diciendo a Sancho Panza, que pugnaba por entrar a ver a don Quijote, y ellas le defendían la puerta:"
        literal: "Tells the history that the shouts that heard Don Quijote, the priest and the barber were of the niece and housekeeper, who them were-giving saying to Sancho Panza, who was-struggling to enter to see [to] Don Quijote, and they to-him were-defending the door:"
        ormsby: "The history relates that the outcry Don Quixote, the curate, and the barber heard came from the niece and the housekeeper exclaiming to Sancho, who was striving to force his way in to see Don Quixote while they held the door against him,"
        vocab:
          - {w: "voces", d: "shouts, cries (not only 'voices'); 'dar voces' = to shout"}
          - {w: "ama", d: "housekeeper (here); also mistress of a house"}
          - {w: "pugnar por", d: "to struggle to, strive hard to (a literary word)"}
          - {w: "defender la puerta a alguien", d: "to bar the door against someone, keep them from coming in (old sense of 'defender', to forbid, prevent)"}
        diagram:
          - s: "Cuenta"
            r: "main verb: tells"
            under:
              - {s: "la historia", r: "subject: the history"}
              - s: "que las voces ... eran de la sobrina y ama"
                r: "what it tells: that the shouts came from the niece and the housekeeper"
                under:
                  - {s: "que oyeron don Quijote, el cura y el barbero", r: "describes 'voces': which Don Quijote, the priest and the barber heard"}
                  - s: "que las daban diciendo a Sancho Panza"
                    r: "describes 'sobrina y ama': who were shouting them at Sancho Panza"
                    under:
                      - {s: "que pugnaba por entrar a ver a don Quijote", r: "describes 'Sancho Panza': who was struggling to get in to see Don Quijote"}
                  - {s: "y ellas le defendían la puerta", r: "and they were barring the door against him"}
        forms:
          - {w: "Cuenta", f: "cuent- + -a → contar (to tell), present, it (the history). The stem o becomes ue when stressed: cuento, cuentas, cuenta, contamos, contáis, cuentan. The verb comes before its subject, as often at the start of a chapter."}
          - {w: "oyeron", f: "oy- + -eron → oír (to hear), preterite, they. Irregular, with y between vowels: oí, oíste, oyó, oímos, oísteis, oyeron. The subject (don Quijote, el cura y el barbero) comes after the verb."}
          - {w: "eran", f: "eran → ser (to be), imperfect, they (the shouts). Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "las daban", f: "d- + -aban → dar (to give), imperfect, they; 'dar voces' = to shout, and 'las' stands for 'las voces'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "diciendo", f: "gerund of decir (to say): 'saying'. The e of the stem turns to i in the gerund: decir → diciendo."}
          - {w: "pugnaba", f: "pugn- + -aba → pugnar (to struggle), imperfect, he (Sancho). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "entrar a ver", f: "entrar (to enter), infinitive after 'por', then ver (to see), infinitive after 'a' of purpose: 'to get in to see'."}
          - {w: "defendían", f: "defend- + -ían → defender (to defend, here to bar), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían. 'le' = against him (Sancho)."}
        note: "This picks up the end of Part II chapter 1, where the priest, the barber and Don Quijote heard the housekeeper and the niece shouting in the courtyard and ran to see."
  - sentences:
      - es: "— ¿Qué quiere este mostrenco en esta casa?"
        literal: "— What wants this stray-lout in this house?"
        ormsby: "“What does the vagabond want in this house?"
        vocab:
          - {w: "mostrenco", d: "a stray, an ownerless animal or good (bienes mostrencos = unclaimed property); as an insult, a clod, a vagabond with no master"}
        diagram:
          - s: "¿Qué quiere"
            r: "main verb: what does he want"
            under:
              - {s: "este mostrenco", r: "subject: this lout"}
              - {s: "en esta casa", r: "where: in this house"}
        forms:
          - {w: "quiere", f: "quier- + -e → querer (to want), present, he. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "este mostrenco, esta casa", f: "este = 'this', masculine to match 'mostrenco'; esta = 'this', feminine to match 'casa'."}
        note: "The speaker is the housekeeper, as the next paragraph shows when Sancho calls her 'Ama de Satanás'. A 'mostrenco' was a stray beast nobody owned; the word suits a man who wanders the roads."
      - es: "Idos a la vuestra, hermano, que vos sois, y no otro, el que destrae y sonsaca a mi señor, y le lleva por esos andurriales."
        literal: "Go-yourself to the yours, brother, for you are, and not another, the-one who distracts and lures-away [to] my master, and him carries through those out-of-the-way-places."
        ormsby: "Be off to your own, brother, for it is you, and no one else, that delude my master, and lead him astray, and take him tramping about the country.”"
        vocab:
          - {w: "idos", d: "be off, go away (vos/vosotros command of 'irse')"}
          - {w: "hermano", d: "brother: a common, rather cool way to address a stranger or an inferior"}
          - {w: "destraer", d: "= distraer (old form): to lead astray, turn from the right path"}
          - {w: "sonsacar", d: "to lure away, entice someone from their home or duty by cunning"}
          - {w: "andurriales", d: "out-of-the-way places, remote tracks, the back of beyond"}
        diagram:
          - s: "Idos"
            r: "main verb 1: go away"
            under:
              - {s: "a la vuestra", r: "where: to your own (house)"}
              - {s: "hermano", r: "addressed to: Sancho, 'brother'"}
          - s: "que vos sois, y no otro, el que"
            r: "why: for it is you and no one else who"
            under:
              - {s: "destrae y sonsaca a mi señor", r: "what he does 1: leads astray and lures away my master"}
              - {s: "y le lleva por esos andurriales", r: "what he does 2: and takes him off along those back roads"}
        forms:
          - {w: "Idos", f: "id (go!, the vos/vosotros command of ir (to go)) + os (yourself): irse (to go away). The d of the command is kept before 'os' in this one verb: idos. The pronoun hangs on the end of a command."}
          - {w: "la vuestra", f: "vuestra (your), feminine to match the unspoken 'casa': 'your own house'. The housekeeper speaks to Sancho with vos, the form for an inferior."}
          - {w: "sois", f: "sois → ser (to be), present, you (vos). Irregular: soy, eres, es, somos, sois, son. 'vos' takes the plural-looking 'sois' even for one person."}
          - {w: "el que", f: "'the one who', masculine to match Sancho; after 'vos sois' Cervantes switches to 'he' forms: destrae, sonsaca, lleva."}
          - {w: "destrae", f: "destra- + -e → destraer (to lead astray), old form of distraer, present, he. Conjugated like traer (to bring): traigo, traes, trae, traemos, traéis, traen."}
          - {w: "sonsaca", f: "sonsac- + -a → sonsacar (to lure away), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "lleva", f: "llev- + -a → llevar (to carry, take), present, he. Same -ar present. 'le' = him, my master (leísmo: 'le' for a male person as direct object, normal in Cervantes)."}
          - {w: "esos andurriales", f: "esos = 'those', masculine plural to match 'andurriales'; the plural of andurrial."}
  - sentences:
      - es: "A lo que Sancho respondió:"
        literal: "To that which Sancho answered:"
        ormsby: "To which Sancho replied,"
        vocab:
          - {w: "a lo que", d: "to which, whereupon"}
        diagram:
          - s: "Sancho respondió:"
            r: "main verb: Sancho answered"
            under:
              - {s: "A lo que", r: "to what: to which (the housekeeper's words)"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "A lo que", f: "lo que = 'that which', the neuter 'lo' standing for everything just said; 'a' because one answers 'to' something."}
  - sentences:
      - es: "— Ama de Satanás, el sonsacado, y el destraído, y el llevado por esos andurriales soy yo, que no tu amo;"
        literal: "— Housekeeper of Satan, the lured-away, and the led-astray, and the carried through those out-of-the-way-places am I, and not your master;"
        ormsby: "“Devil’s own housekeeper! it is I who am deluded, and led astray, and taken tramping about the country, and not thy master!"
        vocab:
          - {w: "Satanás", d: "Satan; 'ama de Satanás' = devil's own housekeeper, a curse turned on her title"}
          - {w: "sonsacado", d: "lured away, enticed (participle of 'sonsacar')"}
          - {w: "destraído", d: "= distraído (old form): led astray"}
          - {w: "andurriales", d: "out-of-the-way places, remote tracks"}
          - {w: "que no", d: "and not, rather than (old use of 'que' before 'no' in a contrast)"}
        diagram:
          - s: "soy yo"
            r: "main verb: am I"
            under:
              - {s: "Ama de Satanás", r: "addressed to: the housekeeper, 'devil's housekeeper'"}
              - {s: "el sonsacado, y el destraído, y el llevado por esos andurriales", r: "what I am: the one lured, led astray and dragged along the back roads"}
              - {s: "que no tu amo", r: "contrast: and not your master"}
        forms:
          - {w: "el sonsacado, y el destraído, y el llevado", f: "three participles made into nouns with 'el': sonsac- + -ado → sonsacar (to lure away); destra- + -ído → destraer (to lead astray), old form of distraer; llev- + -ado → llevar (to carry). Sancho turns her active verbs (sonsaca, destrae, lleva) into passive ones about himself."}
          - {w: "soy", f: "soy → ser (to be), present, I. Irregular: soy, eres, es, somos, sois, son. With 'el ... soy yo' the verb agrees with 'yo'."}
          - {w: "tu amo", f: "tu = 'your', informal: Sancho answers her with tú, not the vos she used to him."}
      - es: "él me llevó por esos mundos, y vosotras os engañáis en la mitad del justo precio:"
        literal: "he me carried through those worlds, and you yourselves-deceive in the half of-the just price:"
        ormsby: "He has carried me all over the world, and you are mightily mistaken."
        vocab:
          - {w: "por esos mundos", d: "all over the place, far and wide (idiom: 'through those worlds')"}
          - {w: "engañarse", d: "to be mistaken, deceive oneself"}
          - {w: "engañarse en la mitad del justo precio", d: "to be mistaken by half the fair price, i.e. grossly mistaken; from the legal term for a sale at less than half the fair price, which could be annulled"}
        diagram:
          - s: "él me llevó"
            r: "main verb 1: he took me"
            under:
              - {s: "por esos mundos", r: "where: all over the world"}
          - s: "y vosotras os engañáis"
            r: "main verb 2: and you women are mistaken"
            under:
              - {s: "en la mitad del justo precio", r: "how much: by half the fair price, grossly"}
        forms:
          - {w: "llevó", f: "llev- + -ó → llevar (to carry, take), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "os engañáis", f: "engañ- + -áis → engañar (to deceive) with 'os': engañarse (to be mistaken), present, you (plural). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. 'vosotras' is feminine: the niece and the housekeeper together."}
          - {w: "del", f: "de + el run together: 'of the'."}
        note: "In the law of the time, a sale made at less than half the fair price ('lesión enorme') could be undone; Sancho borrows the phrase to say they are wrong by a huge margin."
      - es: "él me sacó de mi casa con engañifas, prometiéndome una ínsula, que hasta agora la espero."
        literal: "he me took-out of my house with tricks, promising-me an isle, which until now it I-wait-for."
        ormsby: "He enticed me away from home by a trick, promising me an island, which I am still waiting for.”"
        vocab:
          - {w: "engañifa", d: "trick, swindle, a cheap deception (colloquial)"}
          - {w: "ínsula", d: "isle: the old, bookish word of the romances of chivalry for 'isla'; Don Quijote promised Sancho the governorship of one in Part I"}
          - {w: "agora", d: "= ahora, now (old form)"}
        diagram:
          - s: "él me sacó"
            r: "main verb: he took me out"
            under:
              - {s: "de mi casa", r: "from where: from my house"}
              - {s: "con engañifas", r: "how: with tricks"}
              - s: "prometiéndome una ínsula"
                r: "how: promising me an isle"
                under:
                  - {s: "que hasta agora la espero", r: "describes 'ínsula': which I am still waiting for"}
        forms:
          - {w: "sacó", f: "sac- + -ó → sacar (to take out), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (with c → qu before e: saqué)."}
          - {w: "prometiéndome", f: "gerund of prometer (to promise) + me (to me), the pronoun hung on the end, accent added to keep the stress on -tién-."}
          - {w: "que ... la espero", f: "esper- + -o → esperar (to wait for), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. 'que ... la' = which: colloquial Spanish repeats the object as 'la' after 'que'."}
          - {w: "agora", f: "old form of ahora (now)."}
  - sentences:
      - es: "— Malas ínsulas te ahoguen —respondió la sobrina—, Sancho maldito."
        literal: "— Bad isles you may-they-choke —answered the niece—, Sancho cursed."
        ormsby: "“May evil islands choke thee, thou detestable Sancho,” said the niece;"
        vocab:
          - {w: "ínsula", d: "isle: the bookish word of the romances of chivalry for 'isla'"}
          - {w: "ahogar", d: "to choke, drown, strangle"}
          - {w: "maldito", d: "cursed, damned, wretched"}
        diagram:
          - s: "Malas ínsulas te ahoguen"
            r: "main verb (a curse): may bad isles choke you"
            under:
              - {s: "respondió la sobrina", r: "speech tag: the niece answered"}
              - {s: "Sancho maldito", r: "addressed to: cursed Sancho"}
        forms:
          - {w: "ahoguen", f: "ahog- + -uen → ahogar (to choke), present subjunctive, they: 'may they choke'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en, with g → gu before e: ahogue, ahogues, ahogue, ahoguemos, ahoguéis, ahoguen. A wish or curse uses the subjunctive."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, she. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "maldito", f: "participle of maldecir (to curse), masculine to match Sancho, used as an adjective after the noun."}
          - {w: "Malas", f: "mal- + -as → malo (bad), feminine plural to match 'ínsulas'."}
      - es: "Y ¿qué son ínsulas? ¿Es alguna cosa de comer, golosazo, comilón, que tú eres?"
        literal: "And what are isles? Is [it] some thing of eating, big-sweet-tooth, glutton, which you are?"
        ormsby: "“What are islands? Is it something to eat, glutton and gormandiser that thou art?”"
        vocab:
          - {w: "cosa de comer", d: "something to eat, food"}
          - {w: "goloso", d: "greedy for sweets and titbits; 'golosazo' = big greedy-guts"}
          - {w: "comilón", d: "glutton, big eater"}
        diagram:
          - s: "¿qué son ínsulas?"
            r: "main verb 1: what are isles?"
            under:
              - {s: "Y", r: "linking: and"}
          - s: "¿Es alguna cosa de comer"
            r: "main verb 2: is it something to eat?"
            under:
              - s: "golosazo, comilón"
                r: "addressed to: Sancho, greedy-guts, glutton"
                under:
                  - {s: "que tú eres", r: "describes 'golosazo, comilón': which you are"}
        forms:
          - {w: "son", f: "son → ser (to be), present, they. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "Es", f: "es → ser (to be), present, it; the subject 'it' is left out. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "alguna", f: "algun- + -a → alguno (some), feminine to match 'cosa'."}
          - {w: "de comer", f: "comer (to eat), infinitive after 'de': 'for eating'."}
          - {w: "golosazo", f: "goloso (greedy) + -azo, the suffix that makes things bigger or coarser: 'big greedy-guts'."}
          - {w: "comilón", f: "com- (from comer, to eat) + -ilón, a suffix for someone who does a thing too much: 'big eater'."}
          - {w: "eres", f: "eres → ser (to be), present, you (tú). Irregular: soy, eres, es, somos, sois, son. The niece uses tú, as to a servant."}
        note: "The niece has never heard 'ínsula'; it belongs to the romances of chivalry, not to everyday speech, where an island is an 'isla'. She guesses it is a dish."
  - sentences:
      - es: "— No es de comer —replicó Sancho—, sino de gobernar y regir mejor que cuatro ciudades y que cuatro alcaldes de corte."
        literal: "— Not it-is of eating —replied Sancho—, but of governing and ruling better than four cities and than four mayors of court."
        ormsby: "“It is not something to eat,” replied Sancho, “but something to govern and rule, and better than four cities or four judgeships at court.”"
        vocab:
          - {w: "regir", d: "to rule, govern"}
          - {w: "alcalde de corte", d: "judge of the royal court: one of the magistrates of the 'Sala de alcaldes de Casa y Corte', who kept order in and around the king's residence; a powerful post"}
          - {w: "no ... sino", d: "not ... but (rather)"}
        diagram:
          - s: "No es de comer"
            r: "main verb: it is not for eating"
            under:
              - {s: "replicó Sancho", r: "speech tag: Sancho replied"}
              - s: "sino de gobernar y regir"
                r: "contrast: but for governing and ruling"
                under:
                  - {s: "mejor que cuatro ciudades y que cuatro alcaldes de corte", r: "how: better than four cities and four court judgeships"}
        forms:
          - {w: "es", f: "es → ser (to be), present, it. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (with c → qu before e: repliqué)."}
          - {w: "de gobernar y regir", f: "gobernar (to govern) and regir (to rule), infinitives after 'de', answering 'de comer': 'for governing and ruling'."}
          - {w: "ciudades", f: "plural of ciudad (city): nouns ending in a consonant add -es."}
        note: "Sancho's comparison is muddled: he means an isle is a better thing to have than four cities or the post of a court judge, but says it is 'better to govern than' them."
  - sentences:
      - es: "— Con todo eso —dijo el ama—, no entraréis acá, saco de maldades y costal de malicias."
        literal: "— With all that —said the housekeeper—, not you-shall-enter here, sack of wickednesses and bag of malices."
        ormsby: "“For all that,” said the housekeeper, “you don’t enter here, you bag of mischief and sack of knavery;"
        vocab:
          - {w: "con todo eso", d: "for all that, even so, nevertheless"}
          - {w: "acá", d: "here, in here (with movement towards the speaker)"}
          - {w: "costal", d: "large sack (for grain)"}
          - {w: "saco de maldades y costal de malicias", d: "bag of mischief and sack of knavery: a rhyming insult, someone stuffed full of wickedness"}
        diagram:
          - s: "no entraréis acá"
            r: "main verb: you shall not come in here"
            under:
              - {s: "Con todo eso", r: "linking: for all that"}
              - {s: "dijo el ama", r: "speech tag: the housekeeper said"}
              - {s: "saco de maldades y costal de malicias", r: "addressed to: Sancho, bag of mischief and sack of knavery"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, she. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "entraréis", f: "entrar- + -éis → entrar (to enter), future, you (vos). The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án. The housekeeper still uses vos with its plural-looking ending, for a single inferior."}
          - {w: "maldades, malicias", f: "plurals of maldad (wickedness), adding -es after a consonant, and malicia (malice), adding -s."}
          - {w: "el ama", f: "'el' before a feminine noun that begins with a stressed a: el ama, but 'las amas'."}
      - es: "Id a gobernar vuestra casa y a labrar vuestros pegujares, y dejaos de pretender ínsulas ni ínsulos."
        literal: "Go to govern your house and to till your small-plots, and leave-yourself of seeking isles nor isle-os."
        ormsby: "go govern your house and dig your seed-patch, and give over looking for islands or shylands.”"
        ormsby_note: "In the original insulas ni insulos. Insula, the word always used in the Amadís, and by Don Quixote, instead of isla, is a puzzle to the niece and housekeeper."
        vocab:
          - {w: "labrar", d: "to till, work (land)"}
          - {w: "pegujar", d: "small plot of land a farmhand or peasant was allowed to farm for himself (also 'pegujal')"}
          - {w: "dejarse de", d: "to give up, stop (doing); 'dejaos de' = leave off"}
          - {w: "pretender", d: "to seek, aspire to, try to get (false friend: not 'pretend')"}
          - {w: "ínsulas ni ínsulos", d: "isles or isle-ohs: a mocking jingle, inventing a masculine 'ínsulo' to make fun of the strange word"}
        diagram:
          - s: "Id"
            r: "main verb 1: go"
            under:
              - {s: "a gobernar vuestra casa", r: "purpose 1: to govern your house"}
              - {s: "y a labrar vuestros pegujares", r: "purpose 2: and to till your little plots"}
          - s: "y dejaos de pretender"
            r: "main verb 2: and give up seeking"
            under:
              - {s: "ínsulas ni ínsulos", r: "object: isles or isle-ohs"}
        forms:
          - {w: "Id", f: "id → ir (to go), command, you (vos/vosotros): 'go!'. The vosotros command is the infinitive with r turned to d: id, mirad, tened."}
          - {w: "a gobernar, a labrar", f: "gobernar (to govern) and labrar (to till), infinitives after 'a' of purpose with a verb of motion."}
          - {w: "vuestra casa, vuestros pegujares", f: "vuestra = 'your', feminine singular to match 'casa'; vuestros, masculine plural to match 'pegujares' (plural of pegujar, adding -es after a consonant)."}
          - {w: "dejaos", f: "dejad (leave!, the vos/vosotros command of dejar (to leave)) + os (yourself): the d drops before 'os'. 'dejarse de' = to give up."}
