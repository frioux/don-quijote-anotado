  - sentences:
      - es: "— Así será —respondió Sancho—, porque por la mayor parte he oído decir que los moros son amigos de berenjenas."
        literal: "— So it-will-be —answered Sancho—, because for the greater part I-have heard say that the Moors are friends of aubergines."
        ormsby: "“May be so,” replied Sancho; “for I have heard say that the Moors are mostly great lovers of berengenas.”"
        ormsby_note: "Berengena, the aubergine or eggplant."
        vocab:
          - {w: "así será", d: "that'll be so, I dare say"}
          - {w: "por la mayor parte", d: "for the most part, mostly"}
          - {w: "oír decir", d: "to hear (it) said"}
          - {w: "ser amigo de", d: "to be fond of"}
          - {w: "berenjena", d: "aubergine, eggplant: a vegetable brought to Spain by the Arabs and associated with Moorish cooking"}
        diagram:
          - s: "Así será"
            r: "main verb: so it will be"
            under:
              - {s: "respondió Sancho", r: "speech tag: Sancho answered"}
              - s: "porque por la mayor parte he oído decir"
                r: "why: because I've heard it said"
                under:
                  - {s: "que los moros son amigos de berenjenas", r: "what he's heard: that the Moors are mostly fond of aubergines"}
        forms:
          - {w: "será", f: "ser- + -á → ser (to be), future, it. The future adds endings to the whole infinitive: seré, serás, será, seremos, seréis, serán. The future of guessing: 'I suppose so'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "he oído", f: "he → haber (to have), present, I: he, has, ha, hemos, habéis, han; + oído, participle of oír (to hear): the perfect, 'I have heard'."}
          - {w: "decir", f: "decir (to say), infinitive after oír (to hear): 'heard (people) say'."}
          - {w: "son", f: "son → ser (to be), present, they. Irregular: soy, eres, es, somos, sois, son."}
        note: "Sancho's logic: a man named Berenjena must be a Moor, since Moors love aubergines. The aubergine came to Spain with the Arabs and was a stock feature of jokes about Moriscos."
