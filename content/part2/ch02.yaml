          - {w: "una misma", f: "una (one) + misma (same), feminine to match 'fortuna' and 'suerte': 'one and the same'."}
      - es: "si a ti te mantearon una vez, a mí me han molido ciento, y esto es lo que te llevo de ventaja."
        literal: "if [to] you you they-blanketed one time, [to] me me they-have ground a-hundred, and this is what you I-carry of advantage."
