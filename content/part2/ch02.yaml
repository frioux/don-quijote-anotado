        ormsby: "“I promise you,” said the curate, “the niece or the housekeeper will tell us by-and-by, for they are not the ones to forget to listen.”"
        vocab:
          - {w: "seguro", d: "here a verb: 'yo seguro' = I assure you, I promise (from 'segurar', old form of 'asegurar')"}
          - {w: "condición", d: "nature, disposition, character (false friend: not 'condition')"}
          - {w: "no dejar de", d: "not to fail to"}
        diagram:
          - s: "Yo seguro"
            r: "main verb: I promise"
            under:
              - {s: "respondió el cura", r: "speech tag: the priest answered"}
              - {s: "que la sobrina o el ama nos lo cuenta después", r: "what he promises: that the niece or the housekeeper will tell us later"}
              - s: "que no son de condición"
                r: "why: for they are not of a nature"
                under:
                  - {s: "que dejarán de escucharlo", r: "result: that they will fail to listen in"}
        forms:
          - {w: "seguro", f: "segur- + -o → segurar (to assure), old form of asegurar, present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. It looks like the adjective 'seguro' (sure), but here it is a verb."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "nos lo cuenta", f: "cuent- + -a → contar (to tell), present, she (one of the two women), with a future sense: 'will tell'. The stem o becomes ue when stressed: cuento, cuentas, cuenta, contamos, contáis, cuentan. 'nos lo' = it to us."}
          - {w: "son", f: "son → ser (to be), present, they. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "dejarán", f: "dejar- + -án → dejar (to leave off), future, they. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án. 'dejar de' + infinitive = to fail to."}
          - {w: "escucharlo", f: "escuchar (to listen to) + lo (it), the pronoun hung on the infinitive after 'de'."}
        note: "The joke is that the two women are sure to listen at the door; the next lines shut knight and squire alone in a room."
