summary: |
  The shouting heard at the end of the last chapter comes from the niece and the housekeeper, who are barring the door against Sancho Panza. The housekeeper calls him a stray lout who leads her master astray; Sancho answers that he is the one who was led astray, lured from home by the promise of an isle he is still waiting for. The niece wants to know what an 'ínsula' is, something to eat perhaps, and the housekeeper sends him off to plough his own patch and forget his isles and 'isle-ohs'.

  The priest and the barber enjoy the scene, but Don Quijote, afraid Sancho will blurt out something to his discredit, has him let in. The two friends leave, despairing of a cure. The priest predicts that the knight will soon be off again; the barber marvels more at the squire's faith in his isle than at the master's madness; and both are sure the women will listen at the door.

  Alone with Sancho, Don Quijote protests that they set out together and shared the same luck, though he took the beatings and Sancho only a blanket-tossing; as head and limb, the master feels the servant's pain. Sancho replies that his head watched over the wall while he flew. Don Quijote then asks for the plain truth about what the village says of him. Sancho reports that the common people think him mad, the hidalgos say he has taken a 'don' he has no right to, and the caballeros scorn poor hidalgos who black their own shoes. Don Quijote answers that virtue is always slandered, as Caesar, Alexander, Hercules, Galaor and Amadís were.

  Sancho says there is worse to come: Bartolomé Carrasco's son, just back from Salamanca as a bachelor, says that their story is already in print as 'The Ingenious Gentleman Don Quijote of La Mancha', with Sancho and Dulcinea in it and things that happened when they were alone. Don Quijote decides the author must be a wizard; Sancho reports his name as 'Cide Hamete Berenjena', which Don Quijote corrects. Sancho goes to fetch the bachelor, and the three sit down to a most amusing conversation.
context: |
  The book inside the book. This chapter turns Part II on its head: Don Quijote and Sancho learn that Part I has been printed and that people are reading about them. Part I appeared in 1605, but inside the story only about a month has passed since the knight was brought home in the ox-cart, a time scheme nobody in the book questions. From now on the characters know that they are famous, and Don Quijote's first thought, as in Part I chapter 2, is that his history must have been written by a 'sabio encantador', the wizard-chronicler of the romances of chivalry. Sancho's 'Cide Hamete Berenjena' for Benengeli mangles the Arab historian's name into an aubergine, a vegetable brought to Spain by the Arabs and a stock ingredient of jokes about Moors and Moriscos; Don Quijote's correction that 'Cide' means 'lord' is accurate, from Arabic sayyid, the same word as in 'el Cid'.

  Rank and money. The village's verdicts set out the social ladder. The 'vulgo' is the common people; the hidalgos are the gentry by birth, often as poor as Don Quijote; the caballeros are, as Ormsby puts it, 'the gentry by position', richer and better placed. Ormsby notes that the title 'don' was far more restricted in Cervantes' time than later, so a country hidalgo with 'four vine-stocks and two ploughlands' who calls himself 'don' and makes himself a knight is overreaching. The 'escuderiles' hidalgos who black their shoes with soot and darn black stockings with green silk are the shabby-genteel, keeping up appearances on nothing. Don Quijote's reply, that he is ragged but never patched, alludes to the proverb Ormsby quotes, 'Hidalgo honrado antes roto que remendado', a man of honour would rather be torn than mended. Sancho's 'alcaldes de corte' were judges of the royal household court, posts of real power.

  The books and the heroes. Don Quijote's defence borrows the commonplace that virtue draws envy. His examples are a humanist list: Julius Caesar, said by ancient writers to be ambitious and loose in dress and life; Alexander the Great, a heavy drinker by the classical accounts; Hercules, softened by love; then two knights of 'Amadís de Gaula', the wandering, amorous Galaor and his brother Amadís, the faithful lover who weeps. Putting Galaor beside Caesar is the joke: for Don Quijote the heroes of romance are as historical as the Romans. The 'quando caput dolet' he quotes is the Latin proverb that when the head aches, all the limbs ache, the old image of master and servant as one body, which Sancho turns against him by recalling the blanket-tossing of Part I chapter 17.

  Proverbs and household speech. Ormsby flags the proverbs: 'aún falta la cola por desollar', the tail is still to be skinned, the hardest part is still to come, and 'tortas y pan pintado', cakes and fancy bread, mere trifles. The quarrel at the door is full of the housekeeper's insults ('mostrenco', a stray with no master; 'saco de maldades y costal de malicias') and of word-play: the niece takes 'ínsula', the bookish word of the romances which Ormsby says puzzles both women, for something to eat, and the housekeeper mocks it with the invented 'ínsulos'. The priest's 'volar la ribera' is a hawking term, and 'una mesma turquesa' is a bullet mould: knight and squire cast in the same mould.

  Reading Cervantes' Spanish. The archaisms of the chapter: destrae and destraído (distrae, distraído), agora (ahora), recebían (recibían), mesmo and mesma (mismo, misma), desto, dellos, dél (contractions of de with esto, ellos, él), asumpto (asunto), caloñas (calumnias), advertimiento (advertencia) and the verb 'seguro' for 'aseguro'. Pronouns hang on the end of a verb that opens a clause (Engáñaste, Sírvate, Harásme). The -ra form stands for the conditional (holgara), and the future subjunctive marks open futures (tocare, supieres, dijere). The housekeeper talks down to Sancho with vos and its commands (Idos, Id, dejaos), the niece and Sancho trade tú, and Sancho addresses his master as vuestra merced. Watch the false friends: condición (nature, character), crédito (reputation), desgracia and desgraciado (misfortune, unlucky), gracioso (amusing), impertinente (meddlesome), pretender (to seek), discreto (sensible) and trabajos, which are Hercules' labours, not his jobs.
