  - sentences:
      - es: "— Y ¡cómo —dijo Sancho— si era sabio y encantador, pues (según dice el bachiller Sansón Carrasco, que así se llama el que dicho tengo) que el autor de la historia se llama Cide Hamete Berenjena!"
