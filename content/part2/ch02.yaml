  - sentences:
      - es: '— En lo que toca —prosiguió Sancho— a la valentía, cortesía, hazañas y asumpto de vuestra merced, hay diferentes opiniones; unos dicen: "loco, pero gracioso"; otros, "valiente, pero desgraciado"; otros, "cortés, pero impertinente";'
        literal: "— In what touches —continued Sancho— to the bravery, courtesy, deeds and undertaking of your grace, there-are different opinions; some say: \"mad, but amusing\"; others, \"brave, but unlucky\"; others, \"courteous, but meddling\";"
        ormsby: "“As to your worship’s valour, courtesy, accomplishments, and task, there is a variety of opinions. Some say, ‘mad but droll;’ others, ‘valiant but unlucky;’ others, ‘courteous but meddling,’"
        vocab:
          - {w: "en lo que toca a", d: "as for, as regards"}
          - {w: "proseguir", d: "to go on, continue (speaking)"}
          - {w: "asumpto", d: "= asunto (old Latinate spelling): here 'undertaking, enterprise'"}
          - {w: "gracioso", d: "amusing, droll, funny (not 'gracious')"}
          - {w: "desgraciado", d: "unlucky, unfortunate (false friend: not 'disgraced')"}
          - {w: "impertinente", d: "meddlesome, out of place, interfering where not wanted (more than 'rude')"}
        diagram:
          - s: "hay diferentes opiniones"
            r: "main verb 1: there are different opinions"
            under:
              - {s: "En lo que toca ... a la valentía, cortesía, hazañas y asumpto de vuestra merced", r: "about what: as regards your grace's bravery, courtesy, deeds and undertaking"}
              - {s: "prosiguió Sancho", r: "speech tag: Sancho went on"}
          - s: "unos dicen:"
            r: "main verb 2: some say"
            under:
              - {s: '"loco, pero gracioso"', r: "what they say: 'mad, but amusing'"}
          - {s: 'otros, "valiente, pero desgraciado"', r: "others ('dicen' understood): 'brave but unlucky'"}
          - {s: 'otros, "cortés, pero impertinente"', r: "others: 'courteous but meddling'"}
        forms:
          - {w: "toca", f: "toc- + -a → tocar (to touch, concern), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "prosiguió", f: "prosigu- + -ió → proseguir (to continue), preterite, he. The e turns to i in the 'he' and 'they' forms: proseguí, proseguiste, prosiguió, proseguimos, proseguisteis, prosiguieron."}
          - {w: "hay", f: "hay → haber (to have), the special present form meaning 'there is, there are', the same for singular and plural."}
          - {w: "diferentes", f: "diferente (different) + -s, plural to match 'opiniones' (plural of opinión, adding -es and losing the accent)."}
          - {w: "dicen", f: "dic- + -en → decir (to say), present, they. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "unos, otros", f: "unos (some) and otros (others), masculine plural for people in general."}
        note: "Each verdict pairs a knightly virtue with a flaw: what people say of Don Quijote is half praise, half mockery."
      - es: "y por aquí van discurriendo en tantas cosas, que ni a vuestra merced ni a mí nos dejan hueso sano."
        literal: "and by here they-go running-on in so-many things, that neither to your grace nor to me us they-leave bone sound."
        ormsby: "and then they go into such a number of things that they don’t leave a whole bone either in your worship or in myself.”"
        vocab:
