          - {w: "según aquello", d: "according to that (well-known saying)"}
          - {w: "quando caput dolet", d: "Latin 'when the head aches' (classical 'quando caput dolet, cetera membra dolent': when the head aches, the other limbs ache), a medieval proverb"}
