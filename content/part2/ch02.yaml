  - sentences:
      - es: "— Mucho me pesa, Sancho, que hayas dicho y digas que yo fui el que te saqué de tus casillas, sabiendo que yo no me quedé en mis casas: juntos salimos, juntos fuimos y juntos peregrinamos;"
        literal: "— Much me it-weighs, Sancho, that you-have said and you-say that I was the-one who you took-out of your little-houses, knowing that I not myself stayed in my houses: together we-went-out, together we-went and together we-wandered;"
        ormsby: "“It grieves me greatly, Sancho, that thou shouldst have said, and sayest, that I took thee out of thy cottage, when thou knowest I did not remain in my house. We sallied forth together, we took the road together, we wandered abroad together;"
        vocab:
          - {w: "pesar", d: "to grieve, distress; 'me pesa que' = I am sorry that, it grieves me that"}
          - {w: "sacar de sus casillas", d: "a pun: literally 'to take out of one's little houses', but the idiom means to drive someone out of his wits, make him lose his temper"}
          - {w: "quedarse", d: "to stay, remain"}
          - {w: "peregrinar", d: "to wander, travel abroad as a pilgrim"}
        diagram:
          - s: "Mucho me pesa"
            r: "main verb 1: it grieves me greatly"
            under:
              - {s: "Sancho", r: "addressed to: Sancho"}
              - s: "que hayas dicho y digas"
                r: "what grieves: that you have said and say"
                under:
                  - {s: "que yo fui el que te saqué de tus casillas", r: "what you say: that I was the one who took you out of your home"}
              - {s: "sabiendo que yo no me quedé en mis casas", r: "concession: knowing that I did not stay at home either"}
          - {s: "juntos salimos", r: "main verb 2: we went out together"}
          - {s: "juntos fuimos", r: "main verb 3: we went together"}
          - {s: "y juntos peregrinamos", r: "main verb 4: and we wandered together"}
        forms:
          - {w: "pesa", f: "pes- + -a → pesar (to weigh, to grieve), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. 'me pesa' works like 'me gusta': the thing that grieves is the subject."}
          - {w: "hayas dicho", f: "hayas → haber (to have), present subjunctive, you (tú): haya, hayas, haya, hayamos, hayáis, hayan; + dicho, irregular participle of decir (to say): 'that you have said'. Subjunctive after 'me pesa que'."}
          - {w: "digas", f: "dig- + -as → decir (to say), present subjunctive, you (tú). Irregular: diga, digas, diga, digamos, digáis, digan."}
          - {w: "fui", f: "fui → ser (to be), preterite, I. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "saqué", f: "saqu- + -é → sacar (to take out), preterite, I. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron; c becomes qu before e. After 'yo fui el que' the verb agrees with 'yo'."}
          - {w: "casillas", f: "casa (house) + -illa, a diminutive: 'little houses'. The plural makes it the idiom 'sacar de sus casillas'."}
          - {w: "sabiendo", f: "gerund of saber (to know): 'knowing (as you do)'."}
          - {w: "me quedé", f: "qued- + -é → quedar (to remain) with 'me': quedarse (to stay), preterite, I. Same -ar preterite (-é, -aste, -ó, -amos, -asteis, -aron)."}
          - {w: "salimos", f: "sal- + -imos → salir (to go out), preterite, we. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron. The 'we' form is the same in the present."}
          - {w: "fuimos", f: "fuimos → ir (to go), preterite, we. Irregular, the same forms as ser (to be): fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "peregrinamos", f: "peregrin- + -amos → peregrinar (to wander), preterite, we. Same -ar preterite; the 'we' form matches the present."}
          - {w: "juntos", f: "junt- + -os → junto (together), masculine plural to match 'we', the two men."}
        note: "Don Quijote plays on 'sacar de sus casillas': Sancho means he was taken from his home, but the phrase usually means to drive someone mad, which is the charge he wants to throw off."
      - es: "una misma fortuna y una misma suerte ha corrido por los dos:"
        literal: "one same fortune and one same luck has run through the two:"
        ormsby: "we have had the same fortune and the same luck;"
        vocab:
