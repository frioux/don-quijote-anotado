          - {w: "a ti te", f: "'te' (you) is doubled by 'a ti' for emphasis, to set up the contrast with 'a mí me'."}
          - {w: "mantearon", f: "mante- + -aron → mantear (to toss in a blanket), preterite, they (nobody in particular). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "han molido", f: "han → haber (to have), present, they: he, has, ha, hemos, habéis, han; + molido, participle of moler (to grind, beat): the perfect, 'they have beaten'."}
          - {w: "ciento", f: "the full form of 'cien' (a hundred), used when no noun follows; 'veces' (times) is understood from 'una vez'."}
          - {w: "es", f: "es → ser (to be), present, it. Irregular: soy, eres, es, somos, sois, son."}
