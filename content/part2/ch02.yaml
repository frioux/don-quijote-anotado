        vocab:
          - {w: "compadre", d: "friend, crony (literally the godfather of one's child, or the father of one's godchild); Ormsby's 'gossip' is the old English equivalent"}
          - {w: "cuando menos lo pensemos", d: "when we least expect it"}
          - {w: "hidalgo", d: "gentleman of the lowest rank of the nobility, entitled to 'don' only by courtesy"}
          - {w: "volar la ribera", d: "to fly over the riverbank: a hawking phrase (the hawk flown at waterfowl along a river); here, to go off on his adventures again"}
        diagram:
          - s: "Vos veréis"
            r: "main verb: you will see"
            under:
              - {s: "compadre", r: "addressed to: the barber, 'friend'"}
              - s: "cómo ... nuestro hidalgo sale otra vez a volar la ribera"
                r: "what you will see: how our gentleman goes off again on the wing"
                under:
                  - {s: "cuando menos lo pensemos", r: "when: when we least expect it"}
        forms:
          - {w: "veréis", f: "ver- + -éis → ver (to see), future, you (vos). The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án. The priest uses vos to the barber, as between equals of that time."}
          - {w: "pensemos", f: "pens- + -emos → pensar (to think), present subjunctive, we. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en (with e → ie when stressed: piense, pienses, piense, pensemos, penséis, piensen). Subjunctive after 'cuando' for a time still to come."}
          - {w: "sale", f: "sal- + -e → salir (to go out), present, he: salgo, sales, sale, salimos, salís, salen. The present here stands for a sure future: 'he'll be off'."}
          - {w: "volar", f: "volar (to fly), infinitive after 'a' of purpose."}
        note: "Hawking was a gentleman's sport, and 'volar la ribera' was said of the falcon flown at herons and ducks along a river. The priest pictures Don Quijote as a hawk let off the glove."
