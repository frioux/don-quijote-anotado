          - {w: "bachiller", d: "bachelor (holder of a university degree)"}
          - {w: "Sansón Carrasco", d: "Samson Carrasco, the young bachelor from Salamanca; 'Sansón' is Samson of the Bible"}
          - {w: "Berenjena", d: "aubergine, eggplant: Sancho's garbling of 'Benengeli'"}
