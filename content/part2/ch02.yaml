  - sentences:
      - es: "— Pues lo primero que digo —dijo—, es que el vulgo tiene a vuestra merced por grandísimo loco, y a mí por no menos mentecato."
        literal: "— Well the first that I-say —he-said—, is that the common-people holds [to] your grace for very-great madman, and [to] me for not less half-wit."
        ormsby: "“Well then,” said he, “first of all, I have to tell you that the common people consider your worship a mighty great madman, and me no less a fool."
        vocab:
          - {w: "pues", d: "well then (opening a reply)"}
          - {w: "vulgo", d: "the common people"}
          - {w: "tener por", d: "to consider, take for"}
          - {w: "mentecato", d: "half-wit, simpleton, fool"}
        diagram:
          - s: "lo primero que digo ... es"
            r: "main verb: the first thing I say is"
            under:
              - {s: "Pues", r: "linking: well then"}
              - {s: "dijo", r: "speech tag: he said"}
              - s: "que el vulgo tiene a vuestra merced por grandísimo loco"
                r: "what it is: that the common people take your grace for a very great madman"
                under:
                  - {s: "y a mí por no menos mentecato", r: "and me for no less of a fool"}
        forms:
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "es", f: "es → ser (to be), present, it. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "tiene", f: "tien- + -e → tener (to hold), present, it (the common people, a singular noun). Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen. 'tener por' = to consider."}
          - {w: "grandísimo", f: "grand- + -ísimo → grande (great) with the suffix -ísimo, 'very, extremely': 'a very great'."}
      - es: "Los hidalgos dicen que, no conteniéndose vuestra merced en los límites de la hidalguía, se ha puesto don y se ha arremetido a caballero con cuatro cepas y dos yugadas de tierra y con un trapo atrás y otro adelante."
        literal: "The gentlemen say that, not containing-himself your grace in the limits of the gentility, himself he-has put don and himself he-has rushed to knight with four vine-stocks and two yoke-lands of land and with one rag behind and another in-front."
        ormsby: "The hidalgos say that, not keeping within the bounds of your quality of gentleman, you have assumed the ‘Don,’ and made a knight of yourself at a jump, with four vine-stocks and a couple of acres of land, and never a shirt to your back."
        ormsby_note: "(On 'Don':) In the time of Cervantes the title of Don was much more restricted than nowadays, when it is by courtesy given to everyone. (On 'a trapo atrás y otro adelante':) Literally, \"with a rag behind and another in front.\""
        vocab:
          - {w: "hidalgos", d: "gentlemen by birth, the lowest rank of the nobility"}
          - {w: "contenerse", d: "to keep oneself, stay within"}
          - {w: "hidalguía", d: "the rank of hidalgo, gentility"}
          - {w: "ponerse don", d: "to give oneself the title 'don', which an ordinary hidalgo had no right to"}
          - {w: "arremeterse a", d: "to rush into, push oneself up to; 'arremeterse a caballero' = to jump up to the rank of knight"}
          - {w: "cepa", d: "vine-stock, a single vine plant"}
          - {w: "yugada", d: "a 'yoke' of land, as much as a pair of oxen could plough in a day"}
          - {w: "con un trapo atrás y otro adelante", d: "with one rag behind and another in front: penniless, with barely a stitch on"}
        diagram:
          - s: "Los hidalgos dicen"
            r: "main verb: the hidalgos say"
            under:
              - s: "que ... se ha puesto don y se ha arremetido a caballero"
                r: "what they say: that you have taken the 'don' and pushed yourself up to knight"
                under:
                  - {s: "no conteniéndose vuestra merced en los límites de la hidalguía", r: "how: your grace not keeping within the bounds of an hidalgo's rank"}
                  - {s: "con cuatro cepas y dos yugadas de tierra", r: "with what means 1: with four vines and two ploughlands"}
                  - {s: "y con un trapo atrás y otro adelante", r: "with what means 2: and with one rag behind and another in front"}
        forms:
          - {w: "dicen", f: "dic- + -en → decir (to say), present, they. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "conteniéndose", f: "gerund of contener (to contain) + se: contenerse (to keep oneself within), accent added to keep the stress on -nién-. The e of the stem turns to ie: conteniendo. With 'no', 'not keeping within'."}
          - {w: "se ha puesto", f: "ha → haber (to have), present, he (vuestra merced): he, has, ha, hemos, habéis, han; + puesto, irregular participle of poner (to put), with 'se': 'he has put on himself' the 'don'."}
          - {w: "se ha arremetido", f: "ha → haber (to have), present, he: he, has, ha, hemos, habéis, han; + arremetido, participle of arremeter (to rush, charge), with 'se': 'has charged himself up to'."}
          - {w: "cuatro cepas, dos yugadas", f: "plurals: cepa + -s, yugada + -s; 'cuatro' and 'dos' meaning 'a handful of, a couple of'."}
        note: "In Part I chapter 1 Alonso Quijano names himself 'don Quijote'; the title was then far more restricted than it later became, and a poor hidalgo who took it for himself was a figure of fun. Hidalgos did not become knights by their own decision."
      - es: "Dicen los caballeros que no querrían que los hidalgos se opusiesen a ellos, especialmente aquellos hidalgos escuderiles que dan humo a los zapatos y toman los puntos de las medias negras con seda verde."
        literal: "Say the knights that not they-would-want that the gentlemen themselves-should-oppose to them, especially those gentlemen squire-ish who give smoke to the shoes and take the stitches of the stockings black with silk green."
        ormsby: "The caballeros say they do not want to have hidalgos setting up in opposition to them, particularly squire hidalgos who polish their own shoes and darn their black stockings with green silk.”"
        vocab:
          - {w: "caballeros", d: "here 'gentlemen of standing': nobles of greater wealth and position than the plain hidalgo"}
          - {w: "oponerse a", d: "to set oneself up against, rival, compete with"}
          - {w: "escuderil", d: "squire-like: of the rank of 'escudero', a poor gentleman who served a great house"}
          - {w: "dar humo a los zapatos", d: "to black one's shoes with soot (literally 'give smoke to the shoes'): doing it oneself, too poor for a servant or for proper blacking"}
          - {w: "tomar los puntos", d: "to pick up the stitches, darn (a ladder in a stocking)"}
          - {w: "medias", d: "stockings"}
        diagram:
          - s: "Dicen los caballeros"
            r: "main verb: the caballeros say"
            under:
              - s: "que no querrían"
                r: "what they say: that they would not like"
                under:
                  - {s: "que los hidalgos se opusiesen a ellos", r: "what they wouldn't like: that the hidalgos should set up as their rivals"}
                  - s: "especialmente aquellos hidalgos escuderiles"
                    r: "especially: those squire-type hidalgos"
                    under:
                      - {s: "que dan humo a los zapatos", r: "describes them 1: who black their shoes with soot"}
                      - {s: "y toman los puntos de las medias negras con seda verde", r: "describes them 2: and darn their black stockings with green silk"}
        forms:
          - {w: "Dicen", f: "dic- + -en → decir (to say), present, they. Irregular: digo, dices, dice, decimos, decís, dicen. The verb comes before its subject."}
          - {w: "querrían", f: "querr- + -ían → querer (to want), conditional, they: 'they would not like'. Irregular stem querr-: querría, querrías, querría, querríamos, querríais, querrían."}
          - {w: "se opusiesen", f: "opus- + -iesen → oponer (to oppose) with 'se': oponerse (to set oneself against), imperfect subjunctive (-se form), they. Irregular, like poner (to put): opusiese, opusieses, opusiese, opusiésemos, opusieseis, opusiesen. Subjunctive after 'no querrían que'."}
          - {w: "especialmente", f: "especial (special) + -mente, the ending that makes adverbs."}
          - {w: "escuderiles", f: "escuder- (from escudero, squire) + -il, an adjective ending, plural -es after a consonant, to match 'hidalgos'."}
          - {w: "dan, toman", f: "d- + -an → dar (to give) and tom- + -an → tomar (to take), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an (dar: doy, das, da, damos, dais, dan)."}
          - {w: "negras, verde", f: "negr- + -as → negro (black), feminine plural to match 'medias'; verde (green) has one form for both genders, singular to match 'seda'."}
        note: "Poverty showing through pretension: an hidalgo who blacks his own shoes with soot and mends black stockings with whatever silk he has, even green, is one who cannot afford a servant or new clothes."
  - sentences:
      - es: "— Eso —dijo don Quijote— no tiene que ver conmigo, pues ando siempre bien vestido, y jamás remendado; roto, bien podría ser; y el roto, más de las armas que del tiempo."
        literal: "— That —said Don Quijote— not has to see with-me, since I-go always well dressed, and never patched; torn, well could it-be; and the torn, more from the arms than from-the time."
