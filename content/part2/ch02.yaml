          - {w: "fue notado", f: "fue → ser (to be), preterite, he: fui, fuiste, fue, fuimos, fuisteis, fueron; + notado, participle of notar (to note, brand): the passive, 'was branded'."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular word ('tanto')."}
          - {w: "sus vestidos, sus costumbres", f: "sus = plural to match 'vestidos' and 'costumbres', not the owner."}
        note: "Ancient writers such as Suetonius report that Caesar was thought ambitious, dressed in an odd, loose way, and was the subject of scandalous gossip about his private life."
      - es: "Alejandro, a quien sus hazañas le alcanzaron el renombre de Magno, dicen dél que tuvo sus ciertos puntos de borracho."
