  - sentences:
      - es: "— Yo te aseguro, Sancho —dijo don Quijote—, que debe de ser algún sabio encantador el autor de nuestra historia; que a los tales no se les encubre nada de lo que quieren escribir."
        literal: "— I you assure, Sancho —said Don Quijote—, that must of be some wise enchanter the author of our history; for to the such not themselves to-them is-hidden nothing of what they-want to-write."
        ormsby: "“I promise thee, Sancho,” said Don Quixote, “the author of our history will be some sage enchanter; for to such nothing that they choose to write about is hidden.”"
        vocab:
          - {w: "asegurar", d: "to assure, promise"}
          - {w: "deber de", d: "must (probability): 'debe de ser' = must be"}
          - {w: "sabio encantador", d: "wizard, learned enchanter: in the romances, magicians wrote or watched over the knights' histories; Don Quijote has always believed one follows him"}
          - {w: "los tales", d: "such people, people like that"}
          - {w: "encubrirse", d: "to be hidden, kept secret"}
        diagram:
          - s: "Yo te aseguro"
            r: "main verb 1: I assure you"
            under:
              - {s: "Sancho", r: "addressed to: Sancho"}
              - {s: "dijo don Quijote", r: "speech tag: Don Quijote said"}
              - s: "que debe de ser algún sabio encantador"
                r: "what I assure you: that some wise enchanter must be"
                under:
                  - {s: "el autor de nuestra historia", r: "subject, at the end: the author of our history"}
          - s: "que a los tales no se les encubre nada"
            r: "main verb 2 (the reason): for nothing is hidden from such people"
            under:
              - {s: "de lo que quieren escribir", r: "of what: of what they want to write"}
        forms:
          - {w: "aseguro", f: "asegur- + -o → asegurar (to assure), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "debe de ser", f: "deb- + -e → deber (must), present, he: debo, debes, debe, debemos, debéis, deben; + de + ser (to be): 'deber de' + infinitive = must be (a guess)."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun ('sabio')."}
          - {w: "no se les encubre", f: "encubr- + -e → encubrir (to hide), present, it, with 'se' making it passive: 'is hidden'. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en. 'les' = from them; 'no ... nada' is a double negative, normal in Spanish."}
