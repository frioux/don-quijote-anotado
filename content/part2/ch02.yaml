          - {w: "Engáñaste", f: "engañ- + -as + te → engañar (to deceive) with 'te' stuck on the end: engañarse (to be mistaken), present, you (tú); modern 'te engañas'. Cervantes hangs the pronoun on a verb that opens the clause. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. Accent added to keep the stress on -gá-."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
