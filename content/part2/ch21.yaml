        vocab:
          - {w: "luego", d: "at once, immediately (the old sense, not 'later')"}
          - {w: "acudir a", d: "to turn to, go to (someone) in a body"}
          - {w: "ruegos", d: "entreaties, pleas"}
          - {w: "eficaz", d: "effective, persuasive; plural 'eficaces'"}
          - {w: "razones", d: "arguments, words (not just 'reasons')"}
          - {w: "persuadir que", d: "to urge (someone) to; modern Spanish 'persuadir a alguien de que'"}
