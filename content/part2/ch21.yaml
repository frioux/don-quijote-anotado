  - sentences:
      - es: "— Ninguna fuerza fuera bastante a torcer mi voluntad;"
        literal: "— No force would-be enough to bend my will;"
        ormsby: "“No force would bend my will;"
        vocab:
          - {w: "fuerza", d: "force, compulsion (in law, constraint that makes a promise invalid)"}
          - {w: "bastante a", d: "enough to, sufficient to (modern 'bastante para')"}
          - {w: "torcer", d: "to twist, bend"}
          - {w: "voluntad", d: "will; also affection, love"}
        diagram:
          - s: "Ninguna fuerza fuera bastante"
            r: "main verb: no force would be enough"
            under:
              - {s: "a torcer mi voluntad", r: "for what: to bend my will"}
        forms:
          - {w: "Ninguna", f: "ningun- + -a → ninguno (no, not any), feminine to match 'fuerza'."}
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), it, used here as a conditional: 'would be'. ser (to be) in the -ra imperfect subjunctive: fuera, fueras, fuera, fuéramos, fuerais, fueran. Cervantes often uses the -ra form where modern Spanish puts the conditional ('sería')."}
          - {w: "torcer", f: "torcer (to bend, twist), infinitive after 'bastante a': 'enough to bend'."}
        note: "Quiteria's answer turns on the canon law of marriage: a marriage was valid only if both consented freely, without 'fuerza' (constraint). She insists her will is free, which makes the wedding binding; Basilio has just asked for exactly that."
      - es: "y así, con la más libre que tengo te doy la mano de legítima esposa, y recibo la tuya, si es que me la das de tu libre albedrío, sin que la turbe ni contraste la calamidad en que tu discurso acelerado te ha puesto."
