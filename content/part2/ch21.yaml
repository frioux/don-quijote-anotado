          - {w: "solazaron", f: "solaz- + -aron → solazar (to delight), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "semejantes", f: "semejant- + -es → semejante (such), plural to match 'fechurías'."}
          - {w: "se acogió", f: "acog- + -ió → acogerse (to take refuge), preterite, he, with 'se'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "había sacado", f: "habí- + -a → haber (to have), imperfect, he: había, habías, había, habíamos, habíais, habían; + sacado, participle of sacar (to take out): pluperfect, 'had taken out'."}
          - {w: "pareciéndole", f: "parec- + -iendo + le → parecer (to seem), gerund with 'le' (to him) hung on the end, accent written to keep the stress: 'it seeming to him'."}
