          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "turbado, confuso", f: "turbado, participle of turbar (to disturb), masculine to match Basilio; confuso (confused), an old participle of confundir (to confuse) used as an adjective."}
          - {w: "quiso", f: "quis- + -o → querer (to want, be pleased to), preterite, it (heaven). Irregular: quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "darme", f: "dar (to give) + me (to me), the pronoun hung on the infinitive after 'quiso'."}
          - {w: "me entrego", f: "entreg- + -o → entregarse (to give oneself up), present, I, with 'me' (myself). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
  - sentences:
      - es: "— Y yo por tu esposa —respondió Quiteria—, ahora vivas largos años, ahora te lleven de mis brazos a la sepultura."
        literal: "— And I as your wife —answered Quiteria—, whether you-may-live long years, or you they-may-carry from my arms to the grave."
        ormsby: "“And I give myself to be thy wife,” said Quiteria, “whether thou livest many years, or they carry thee from my arms to the grave.”"
        vocab:
          - {w: "ahora ... ahora", d: "whether ... or (with the subjunctive): 'ahora vivas, ahora te lleven' = whether you live or they carry you"}
          - {w: "sepultura", d: "grave, tomb"}
        diagram:
          - s: "Y yo por tu esposa"
            r: "main clause, verb understood: and I [give myself] as your wife"
            under:
              - {s: "respondió Quiteria", r: "speech tag: answered Quiteria"}
              - {s: "ahora vivas largos años", r: "condition 1: whether you live many years"}
              - {s: "ahora te lleven de mis brazos a la sepultura", r: "condition 2: or they carry you from my arms to the grave"}
        forms:
          - {w: "Y yo por tu esposa", f: "the verb 'me doy' (I give myself) is left out because Basilio has just said it: 'and I [give myself] as your wife'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, she. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "vivas", f: "viv- + -as → vivir (to live), present subjunctive, you. The present subjunctive of -er and -ir verbs: -a, -as, -a, -amos, -áis, -an. 'ahora ... ahora' (whether ... or) takes the subjunctive."}
          - {w: "lleven", f: "llev- + -en → llevar (to carry), present subjunctive, they (people in general): 'they carry you'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "largos", f: "larg- + -os → largo (long), masculine plural to match 'años'."}
        note: "These are the words of a real marriage vow. Since the Council of Trent (1563) a valid marriage needed the couple's free consent before the parish priest and witnesses, and here the priest and the whole village are present."
  - sentences:
      - es: "— Para estar tan herido este mancebo —dijo a este punto Sancho Panza—, mucho habla; háganle que se deje de requiebros y que atienda a su alma, que, a mi parecer, más la tiene en la lengua que en los dientes."
        literal: "— For being so wounded this youth —said at this point Sancho Panza—, much he-talks; make-him that himself he-may-leave-off of love-talk and that he-may-attend to his soul, for, to my seeming, more it he-has on the tongue than in the teeth."
        ormsby: "“For one so badly wounded,” observed Sancho at this point, “this young man has a great deal to say; they should make him leave off billing and cooing, and attend to his soul; for to my thinking he has it more on his tongue than at his teeth.”"
        vocab:
          - {w: "para", d: "here 'for (someone who is)': 'para estar tan herido' = for one so badly wounded"}
          - {w: "mancebo", d: "youth, young man"}
          - {w: "a este punto", d: "at this moment, just then"}
          - {w: "dejarse de", d: "to leave off, stop (doing something)"}
          - {w: "requiebros", d: "lover's compliments, sweet talk, billing and cooing"}
          - {w: "atender a", d: "to attend to, look after"}
          - {w: "a mi parecer", d: "in my opinion, to my thinking"}
          - {w: "tener el alma en los dientes", d: "to have one's soul between one's teeth, i.e. to be at death's door; Sancho twists it"}
        diagram:
          - s: "mucho habla"
            r: "main verb 1: he talks a lot"
            under:
              - {s: "Para estar tan herido", r: "concession: for someone so badly wounded"}
              - {s: "este mancebo", r: "subject: this youth"}
              - {s: "dijo a este punto Sancho Panza", r: "speech tag: said Sancho just then"}
          - s: "háganle"
            r: "main verb 2: make him (said to the bystanders)"
            under:
              - {s: "que se deje de requiebros", r: "what to make him do, 1: stop the love-talk"}
              - {s: "y que atienda a su alma", r: "what to make him do, 2: and see to his soul"}
              - s: "que, a mi parecer, más la tiene en la lengua que en los dientes"
                r: "why: for, I think, he has it more on his tongue than in his teeth"
        forms:
          - {w: "estar", f: "estar (to be), infinitive after 'para': 'for being'."}
          - {w: "herido", f: "participle of herir (to wound), masculine to match 'mancebo'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "habla", f: "habl- + -a → hablar (to talk), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "háganle", f: "hag- + -an + le → hacer (to make), present subjunctive used as a command, they (vuestras mercedes, the people around): 'make him'. hacer (to make) in the present subjunctive: haga, hagas, haga, hagamos, hagáis, hagan. With a command, the pronoun 'le' (him) hangs on the end and the accent is written to keep the stress."}
          - {w: "se deje, atienda", f: "dej- + -e → dejarse (to leave off), present subjunctive, he, with 'se'; atiend- + -a → atender (to attend), present subjunctive, he, the stem e becoming ie when stressed. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en; of -er verbs: -a, -as, -a, -amos, -áis, -an. Subjunctive after 'hacer que' (to make someone do)."}
          - {w: "la tiene", f: "tien- + -e → tener (to have), present, he: tengo, tienes, tiene, tenemos, tenéis, tienen; 'la' = 'it', the soul ('alma' is feminine though it takes 'el' in the singular)."}
        note: "Sancho turns the idiom 'tener el alma en los dientes' (to be at the last gasp, the soul about to leave through the mouth) into a joke: Basilio's soul is not in his teeth but on his tongue, so lively is his talk. The priest used the idiom seriously a few paragraphs earlier."
  - sentences:
      - es: "Estando, pues, asidos de las manos Basilio y Quiteria, el cura, tierno y lloroso, los echó la bendición y pidió al cielo diese buen poso al alma del nuevo desposado;"
        literal: "Being, then, holding by the hands Basilio and Quiteria, the priest, tender and tearful, them cast the blessing and asked [of] the heaven [that] it-should-give good rest to-the soul of-the new bridegroom;"
        ormsby: "Basilio and Quiteria having thus joined hands, the priest, deeply moved and with tears in his eyes, pronounced the blessing upon them, and implored heaven to grant an easy passage to the soul of the newly wedded man,"
        vocab:
          - {w: "asidos de las manos", d: "holding hands, hand in hand (from 'asir', to grasp)"}
          - {w: "tierno", d: "tender, moved, soft-hearted"}
          - {w: "lloroso", d: "tearful, in tears"}
          - {w: "echar la bendición", d: "to give the blessing, pronounce the (marriage) blessing"}
          - {w: "poso", d: "rest, repose (an old word); 'buen poso' = peaceful rest"}
          - {w: "desposado", d: "newly married man, bridegroom"}
        diagram:
          - s: "el cura"
            r: "subject of both main verbs: the priest"
            under:
              - {s: "Estando, pues, asidos de las manos Basilio y Quiteria", r: "when: Basilio and Quiteria being hand in hand"}
              - {s: "tierno y lloroso", r: "describes 'cura': moved and in tears"}
              - {s: "los echó la bendición", r: "main verb 1: gave them the blessing"}
              - s: "y pidió al cielo"
                r: "main verb 2: and asked heaven"
                under:
                  - {s: "diese buen poso al alma del nuevo desposado", r: "what he asked: that it grant good rest to the bridegroom's soul"}
        forms:
          - {w: "Estando", f: "gerund of estar (to be): 'being', here with 'asidos' to say 'as they were holding'."}
          - {w: "asidos", f: "as- + -idos → asir (to grasp), participle, masculine plural to match 'Basilio y Quiteria' (a mixed pair takes the masculine)."}
          - {w: "los echó", f: "ech- + -ó → echar (to throw, cast), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. 'los' here is the indirect object 'on them' where modern Spanish says 'les': loísmo, an old usage of the region of Madrid and Toledo."}
          - {w: "pidió", f: "pid- + -ió → pedir (to ask), preterite, he; the stem e becomes i in the 'he' and 'they' forms: pedí, pediste, pidió, pedimos, pedisteis, pidieron."}
          - {w: "diese", f: "di- + -ese → dar (to give), imperfect subjunctive (-se form), it (heaven): 'that it should give'. dar (to give) in the -se imperfect subjunctive: diese, dieses, diese, diésemos, dieseis, diesen. The 'que' after 'pidió' is left out, which Cervantes often does."}
          - {w: "al, del", f: "a + el and de + el, the contractions modern Spanish still makes."}
          - {w: "desposado", f: "participle of desposar (to marry), used as a noun: 'the newly married man'."}
        note: "The 'buen poso' the priest prays for is a peaceful passage of the soul to the next life: he still believes Basilio is dying."
      - es: "el cual, así como recibió la bendición, con presta ligereza se levantó en pie, y con no vista desenvoltura se sacó el estoque, a quien servía de vaina su cuerpo."
        literal: "the which, as soon as he-received the blessing, with quick nimbleness himself raised on foot, and with not seen boldness from-himself drew the rapier, to which served as sheath his body."
        ormsby: "who, the instant he received the blessing, started nimbly to his feet and with unparalleled effrontery pulled out the rapier that had been sheathed in his body."
        vocab:
          - {w: "así como", d: "as soon as, the moment that"}
          - {w: "presto", d: "quick, swift (literary)"}
          - {w: "ligereza", d: "nimbleness, agility, lightness"}
          - {w: "levantarse en pie", d: "to stand up, spring to one's feet"}
          - {w: "no visto", d: "never seen, unheard-of, unparalleled"}
          - {w: "desenvoltura", d: "boldness, ease, effrontery"}
          - {w: "estoque", d: "a long narrow thrusting sword, rapier"}
          - {w: "vaina", d: "scabbard, sheath"}
        diagram:
          - s: "el cual"
            r: "subject, carried on from the previous unit: who (the bridegroom)"
            under:
              - {s: "así como recibió la bendición", r: "when: the moment he received the blessing"}
              - s: "con presta ligereza se levantó en pie"
                r: "main verb 1: nimbly sprang to his feet"
              - s: "y con no vista desenvoltura se sacó el estoque"
                r: "main verb 2: and with unheard-of boldness drew out the rapier"
                under:
                  - {s: "a quien servía de vaina su cuerpo", r: "describes 'estoque': for which his body served as a sheath"}
        forms:
          - {w: "el cual", f: "'who, which', masculine to match 'desposado' at the end of the previous unit; the heavier relative used after a pause."}
          - {w: "recibió", f: "recib- + -ió → recibir (to receive), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "presta", f: "prest- + -a → presto (quick), feminine to match 'ligereza'."}
          - {w: "se levantó", f: "levant- + -ó → levantarse (to rise), preterite, he, with 'se' (himself). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "no vista", f: "vist- + -a → visto, irregular participle of ver (to see), feminine to match 'desenvoltura'; with 'no' in front: 'never seen'."}
          - {w: "se sacó", f: "sac- + -ó → sacar (to draw out), preterite, he; 'se' = from himself, out of his own body. Same -ar preterite: saqué, sacaste, sacó, sacamos, sacasteis, sacaron."}
          - {w: "a quien", f: "'quien' (who) referring to a thing, the sword, as Cervantes' Spanish allows; modern Spanish would say 'al cual'."}
          - {w: "servía", f: "serv- + -ía → servir (to serve), imperfect, it (his body): 'was serving'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
  - sentences:
      - es: "Quedaron todos los circunstantes admirados, y algunos dellos, más simples que curiosos, en altas voces, comenzaron a decir:"
