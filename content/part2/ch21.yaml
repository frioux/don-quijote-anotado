              - {s: "turbada, al parecer triste y pesarosa", r: "describes 'Quiteria': troubled, seemingly sad and sorry"}
              - s: "ya los ojos vueltos, el aliento corto y apresurado"
                r: "describes Basilio: his eyes already rolled back, his breath short and fast"
                under:
                  - {s: "murmurando entre los dientes el nombre de Quiteria", r: "how: murmuring Quiteria's name between his teeth"}
