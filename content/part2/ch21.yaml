          - {w: "engañes, uses", f: "engañ- + -es → engañar (to deceive) and us- + -es → usar (to use), present subjunctive, you. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. Subjunctive after 'no es razón que' (it is not right that)."}
          - {w: "tantas", f: "tant- + -as → tanto (so many), feminine plural to match 'verdades'."}
          - {w: "ha tratado", f: "h- + -a → haber (to have), present, he: he, has, ha, hemos, habéis, han; + tratado, participle of tratar (to deal): the present perfect, 'has dealt'."}
          - {w: "contigo", f: "con + ti fused into one word, 'with you' (like conmigo, 'with me')."}
        note: "Basilio insists the consent be free because, in Catholic doctrine, a marriage is made by the free consent of the two parties; a forced or feigned 'yes' would be no marriage. The trick depends on this point."
  - sentences:
      - es: "Entre estas razones, se desmayaba, de modo que todos los presentes pensaban que cada desmayo se había de llevar el alma consigo."
        literal: "Between these words, himself he-was-fainting, in such way that all the present-ones were-thinking that each faint itself had to carry-off the soul with-itself."
        ormsby: "While uttering these words he showed such weakness that the bystanders expected each return of faintness would take his life with it."
        vocab:
          - {w: "razones", d: "words, speech (not 'reasons'); 'entre estas razones' = while saying this"}
          - {w: "desmayarse", d: "to faint, swoon"}
          - {w: "de modo que", d: "so that, in such a way that"}
          - {w: "los presentes", d: "those present, the bystanders"}
          - {w: "desmayo", d: "a faint, a fainting fit"}
          - {w: "llevarse el alma", d: "to carry off the soul, i.e. to kill"}
          - {w: "consigo", d: "with itself, with him (con + sí)"}
        diagram:
          - s: "se desmayaba"
            r: "main verb: he kept fainting"
            under:
              - {s: "Entre estas razones", r: "when: in the middle of these words"}
              - s: "de modo que todos los presentes pensaban"
                r: "result: so that everyone present thought"
                under:
                  - {s: "que cada desmayo se había de llevar el alma consigo", r: "what they thought: that each faint would carry his soul away with it"}
        forms:
          - {w: "estas", f: "est- + -as → este (this), feminine plural to match 'razones'."}
          - {w: "se desmayaba", f: "desmay- + -aba → desmayarse (to faint), imperfect, he, with 'se' (himself): 'he kept fainting', the imperfect for a repeated action. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "pensaban", f: "pens- + -aban → pensar (to think), imperfect, they. Same -aba imperfect: pensaba, pensabas, pensaba, pensábamos, pensabais, pensaban."}
          - {w: "se había de llevar", f: "habí- + -a → haber (to have), imperfect, it (each faint): había, habías, había, habíamos, habíais, habían; 'haber de' + infinitive = 'to be going to, must': 'would carry off'. llevar (to carry) + se = llevarse (to carry off, take away); the 'se' stands in front of the whole group 'había de llevar'."}
          - {w: "consigo", f: "con + sí (itself, himself) fused into one word: 'with itself'. Like conmigo (with me) and contigo (with you)."}
