        ormsby: "Don Quixote hearing the wounded man’s entreaty, exclaimed aloud that what Basilio asked was just and reasonable, and moreover a request that might be easily complied with; and that it would be as much to Señor Camacho’s honour to receive the lady Quiteria as the widow of the brave Basilio as if he received her direct from her father."
