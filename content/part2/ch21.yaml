  - sentences:
      - es: "— ¡Oh Quiteria, que has venido a ser piadosa a tiempo cuando tu piedad ha de servir de cuchillo que me acabe de quitar la vida, pues ya no tengo fuerzas para llevar la gloria que me das en escogerme por tuyo, ni para suspender el dolor que tan apriesa me va cubriendo los ojos con la espantosa sombra de la muerte!"
        literal: "— Oh Quiteria, who have come to be merciful at a-time when your pity has to serve as knife that me may-finish to take-away the life, since already not I-have strength to bear the glory that to-me you-give in choosing-me as yours, nor to suspend the pain that so fast to-me goes covering the eyes with the frightful shadow of the death!"
        ormsby: "“O Quiteria, why hast thou turned compassionate at a moment when thy compassion will serve as a dagger to rob me of life, for I have not now the strength left either to bear the happiness thou givest me in accepting me as thine, or to suppress the pain that is rapidly drawing the dread shadow of death over my eyes?"
        vocab:
          - {w: "venir a ser", d: "to turn out to be, end up being"}
          - {w: "piadoso", d: "merciful, compassionate"}
          - {w: "piedad", d: "pity, compassion (and also piety)"}
          - {w: "servir de", d: "to serve as"}
          - {w: "acabar de", d: "to finish (doing); 'que me acabe de quitar la vida' = that finishes taking my life"}
          - {w: "llevar", d: "here 'to bear, endure'"}
          - {w: "escoger por", d: "to choose as"}
          - {w: "suspender", d: "to hold off, stay, stop"}
          - {w: "apriesa", d: "= aprisa, quickly (old form)"}
          - {w: "ir + gerund", d: "progressive: 'me va cubriendo' = is gradually covering me"}
          - {w: "espantoso", d: "frightful, dreadful"}
        diagram:
          - s: "¡Oh Quiteria"
            r: "address: O Quiteria"
            under:
              - s: "que has venido a ser piadosa"
                r: "describes 'Quiteria': you who have turned merciful"
                under:
                  - s: "a tiempo cuando tu piedad ha de servir de cuchillo"
                    r: "when: at a moment when your pity must serve as a knife"
                    under:
                      - {s: "que me acabe de quitar la vida", r: "describes 'cuchillo': that finishes taking my life"}
                  - s: "pues ya no tengo fuerzas"
                    r: "why: since I no longer have the strength"
                    under:
                      - s: "para llevar la gloria"
                        r: "for what, 1: to bear the glory"
                        under:
                          - {s: "que me das en escogerme por tuyo", r: "describes 'gloria': that you give me by choosing me as yours"}
                      - s: "ni para suspender el dolor"
                        r: "for what, 2: nor to hold off the pain"
                        under:
                          - {s: "que tan apriesa me va cubriendo los ojos con la espantosa sombra de la muerte", r: "describes 'dolor': which is so fast covering my eyes with death's dreadful shadow"}
        forms:
          - {w: "has venido", f: "h- + -as → haber (to have), present, you: he, has, ha, hemos, habéis, han; + venido, participle of venir (to come): the present perfect, 'you have come'."}
          - {w: "piadosa", f: "piados- + -a → piadoso (merciful), feminine to match Quiteria."}
          - {w: "ha de servir", f: "ha (haber, to have, present, it: he, has, ha, hemos, habéis, han) + de + servir (to serve): 'haber de' + infinitive = must, is to: 'must serve'."}
          - {w: "acabe", f: "acab- + -e → acabar (to finish), present subjunctive, it (the knife). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. Subjunctive in a relative clause describing a purpose ('a knife to finish me off')."}
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "das", f: "d- + -as → dar (to give), present, you: doy, das, da, damos, dais, dan."}
          - {w: "escogerme", f: "escoger (to choose) + me (me), the pronoun hung on the infinitive after 'en': 'in choosing me'."}
          - {w: "tuyo", f: "tuy- + -o → tuyo (yours), masculine because Basilio is speaking of himself."}
          - {w: "va cubriendo", f: "v- + -a → ir (to go), present, it: voy, vas, va, vamos, vais, van; + cubriendo, gerund of cubrir (to cover): 'ir' + gerund = an action progressing step by step, 'is gradually covering'."}
          - {w: "espantosa", f: "espantos- + -a → espantoso (dreadful), feminine to match 'sombra'."}
        note: "Basilio speaks in the inflated style of a tragic lover, all paradox (pity that kills, glory too great to bear). Ormsby turns the exclamation into a question, 'why hast thou turned compassionate', which the Spanish does not have."
      - es: "Lo que te suplico es, ¡oh fatal estrella mía!, que la mano que me pides y quieres darme no sea por cumplimiento, ni para engañarme de nuevo, sino que confieses y digas que, sin hacer fuerza a tu voluntad, me la entregas y me la das como a tu legítimo esposo;"
        literal: "That which you I-beg is, oh fatal star of-mine!, that the hand that of-me you-ask and you-want to-give-me not may-be for formality, nor to deceive-me anew, but that you-confess and you-say that, without doing force to your will, to-me it you-hand-over and to-me it you-give as to your lawful husband;"
        ormsby: "What I entreat of thee, O thou fatal star to me, is that the hand thou demandest of me and wouldst give me, be not given out of complaisance or to deceive me afresh, but that thou confess and declare that without any constraint upon thy will thou givest it to me as to thy lawful husband;"
        vocab:
