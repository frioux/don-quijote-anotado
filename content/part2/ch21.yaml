summary: |
  While Don Quijote and Sancho are still arguing, the riders on the mares gallop off with shouts to meet the bride and groom, who arrive with music, the priest, both families and the finest people of the neighbouring villages. Sancho, seeing Quiteria, pours out a stream of rustic praise: she is dressed not like a farm girl but like a lady of the court, in coral, thirty-pile velvet, satin and gold rings set with pearls, with hair so long and fair it must be her own, and she moves like a palm tree loaded with dates. Don Quijote laughs, and thinks that, after Dulcinea, he has never seen a lovelier woman. Quiteria is a little pale, from the bad night brides spend getting ready.

  As the couple reach the carpeted stage in the meadow where the wedding is to take place, a voice cries out behind them. It is Basilio, in a black coat slashed with crimson flames and crowned with funeral cypress, carrying a long staff. He reproaches Quiteria for breaking her promise to him, wishes her long years with the rich Camacho, and, pulling a hidden rapier out of his staff, plants its hilt in the ground and throws himself on the point, which comes out at his back. He falls bathed in blood.

  Don Quijote dismounts and holds him in his arms. The priest will not let the sword be drawn out before Basilio confesses, but Basilio refuses to confess unless Quiteria first gives him her hand in marriage. Don Quijote declares the request just, since Camacho can marry her as Basilio's widow a moment later; Basilio's friends press Camacho until he agrees, and everyone presses Quiteria, who stands like a statue until the priest tells her to hurry. She kneels, Basilio asks her to give her hand freely and not out of pity, she does so, and the priest blesses them, while Sancho remarks that the dying man talks a great deal. The moment the blessing is given, Basilio jumps to his feet and pulls out the sword: it had passed through a hollow iron tube full of blood. 'Not a miracle, a trick!' he cries.

  Camacho and his men draw their swords, Basilio's friends draw theirs, and Sancho takes refuge by the wine-jars. Don Quijote rides between the two sides with his lance, declaring that in love as in war tricks are fair, that Quiteria belongs to Basilio, and that no one shall separate those whom God has joined. The priest calms Camacho, who decides heaven has done him a favour and holds his feast anyway. Basilio, Quiteria and their friends go off to Basilio's village, taking Don Quijote with them as a man of courage, and Sancho, mourning the feast he is leaving behind, follows on his donkey with his bucket of skimmings.
context: |
  A rich peasant bride. Sancho's praise of Quiteria is an inventory of village finery seen by a villager: he expects the 'patenas' and the 'palmilla verde de Cuenca' of a farm girl and finds coral and velvet instead. Ormsby explains that the patena was a metal ornament worn by peasant girls somewhat like a locket, and that 'terciopelo de treinta pelos' is comic exaggeration, the richest ordinary velvet being three-pile. Palmilla was a woollen cloth made in Cuenca, and the 'sortijas de azabache', jet rings, were cheap charms. To 'pass over the banks of Flanders', in Ormsby's note, is to be fit for any enterprise, the shoals of the Flemish coast being dreaded by Spanish sailors. Sancho's oaths and exclamations (a buena fe, pardiez, montas, voto a mí, no medre yo, and the coarse 'hideputa' used as admiration) are those of a labourer. Don Quijote, who has seen only an enchanted, garlic-smelling Dulcinea since the start of Part II, quietly ranks Quiteria second.

  Marriage and the Church. Basilio's whole trick depends on the rules of a Catholic wedding after the Council of Trent: a marriage is made by the free consent of both partners, spoken before the parish priest and witnesses, and cannot then be undone. A dying man must confess, and a suicide who dies in despair, 'como gentil, y no como cristiano', was believed to lose his soul. So the priest wants confession before the sword is drawn, Basilio makes the marriage his price for confessing, and Don Quijote argues that Camacho loses nothing by marrying Quiteria as Basilio's widow a few minutes later. Basilio is careful to make Quiteria say she gives her hand freely, 'sin hacer fuerza a tu voluntad', and when the crowd says a marriage got by a trick cannot be valid, she confirms it again: free consent was the point the law turned on. Basilio's claim that 'viviendo yo, tú no puedes tomar esposo' rests on their earlier promises to each other.

  Stage tricks and the narrator. The scene is built like a play: Basilio enters on cue in mourning costume with crimson flames and a crown of cypress, the tree of funerals, makes a speech, and 'dies' with a sword that is a stage prop, a staff that sheathes a rapier, and a hollow iron tube of blood specially prepared so that it would not clot. The narrator keeps the secret until the blessing, so the reader is fooled with the wedding guests. Sancho, as usual, is the one who notices that the dying man talks too much. Basilio's 'industria, industria' uses the word in its old sense of ingenuity, and the cry 'milagro, milagro' of the simple bystanders is answered with a lesson in human cunning.

  Don Quijote as judge. In Part I Don Quijote attacked whatever he saw; here he is the voice of order. His speech turns the proverb 'all is fair in love and war' into knightly law, with the limit that the trick must not dishonour the lady, and he closes with two Bible texts: Basilio has only one 'oveja', like the poor man whose single ewe lamb the rich man takes in Nathan's parable (2 Samuel 12), and 'a los dos que Dios junta no podrá separar el hombre' is Christ on marriage (Matthew 19:6). For once his lance keeps the peace, and the villagers treat him as 'hombre de valor y de pelo en pecho'. The narrator adds his own moral, that the virtuous poor have friends just as the rich have flatterers, and ends with a third Bible echo: Sancho leaves behind 'las ollas de Egipto', the fleshpots the hungry Israelites longed for in the desert (Exodus 16:3).

  The names. 'Las bodas de Camacho' became proverbial in Spanish for a lavish feast, though the wedding never happens. Basilio's name comes from the Greek for 'king', a grand name for the poorest man in the village. Santa Quiteria was a virgin martyr venerated in Spain, and Quiteria's silence through most of the chapter, 'más dura que un mármol y más sesga que una estatua', leaves the reader to guess, with the guests, whether she was in the plot; the narrator says only that everyone concluded she was.

  Reading Cervantes' Spanish. Archaisms in this chapter: recebir (recibir), entrambos (both), dél, desta, dellos (de él, de esta, de ellos), mesmo (mismo), luengos (largos), la color (el color), espirar (expirar), desculpa (disculpa), apriesa (aprisa), inresolutas (irresolutas), escurecer (oscurecer), fechurías (fechorías), escarnidos (escarnecidos), Sancho's pelras for perlas, and pluguieron, the old preterite of placer (to please). Pronouns hang on the end of verbs that open a clause: Rióse, parecióle, Íbanse, dábanlas, Quisiéronle, Llevarónse (printed with a stray accent for Lleváronse). Speakers use the vosotros imperative, dropping the d before 'os' (Esperaos, Teneos) and keeping it before other pronouns (tomadme, ponedla, advertid). 'la' serves as an indirect object for a woman (ponedla tacha, la respondiera, la dijera), the counterpart of the leísmo that uses 'le' for a male direct object. The -ra form stands in for the conditional (fuera bastante, quisiera, respondiera), the future subjunctive marks open conditions (quisiere, intentare), and 'haber de' gives obligation or certainty (había de traer, ha de ser la sepultura, ha de pasar). Watch the false friends: industria (cunning), discreto (wise), asistir (to attend), competencia (rivalry), facilidad (fickleness), and the idioms valer un ojo de la cara (to cost a fortune), tener el alma en los dientes (to be at death's door) and de pelo en pecho (tough, brave).
