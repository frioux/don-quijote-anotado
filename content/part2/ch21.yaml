          - {w: "atender a", d: "to attend to, pay attention to, look after"}
          - {w: "salud del alma", d: "the salvation of the soul; 'salud' = health and also salvation"}
          - {w: "gustos", d: "pleasures, desires"}
          - {w: "de veras", d: "in earnest, truly; 'muy de veras' = most earnestly"}
          - {w: "desesperado", d: "desperate; in religious language, despairing of God's mercy, as a suicide does"}
          - {w: "determinación", d: "resolve, decision; here the decision to kill himself"}
