  - sentences:
      - es: "Llegó, en fin, cansado y sin aliento, y, puesto delante de los desposados, hincando el bastón en el suelo, que tenía el cuento de una punta de acero, mudada la color, puestos los ojos en Quiteria, con voz tremente y ronca, estas razones dijo:"
        literal: "He-arrived, in short, tired and without breath, and, placed in-front of the betrothed-couple, driving the staff into the ground, which had the butt-end of a point of steel, changed the colour, fixed the eyes on Quiteria, with voice trembling and hoarse, these words he-said:"
        ormsby: "He came up at last weary and breathless, and planting himself in front of the bridal pair, drove his staff, which had a steel spike at the end, into the ground, and, with a pale face and eyes fixed on Quiteria, he thus addressed her in a hoarse, trembling voice:"
        vocab:
          - {w: "en fin", d: "at last, finally"}
          - {w: "aliento", d: "breath"}
          - {w: "los desposados", d: "the bridal couple, the newly-wed or about-to-be-wed pair"}
          - {w: "hincar", d: "to drive in, plant, stick (into the ground)"}
          - {w: "cuento", d: "ferrule, the metal tip at the butt of a staff or lance (a false friend: not 'story')"}
          - {w: "acero", d: "steel"}
          - {w: "mudada la color", d: "his colour changed, having gone pale; 'mudar' = to change, and 'la color' is the old feminine of 'el color'"}
          - {w: "tremente", d: "trembling (Latinate, poetic: modern 'trémulo')"}
          - {w: "ronco", d: "hoarse"}
          - {w: "razones", d: "words, speech (not 'reasons')"}
        diagram:
          - s: "Llegó"
            r: "main verb 1: he arrived"
            under:
              - {s: "en fin", r: "when: at last"}
              - {s: "cansado y sin aliento", r: "how: tired and breathless"}
          - s: "estas razones dijo:"
            r: "main verb 2 (after 'y'): he spoke these words"
            under:
              - {s: "puesto delante de los desposados", r: "where: placed in front of the couple"}
              - s: "hincando el bastón en el suelo"
                r: "how: driving the staff into the ground"
                under:
                  - {s: "que tenía el cuento de una punta de acero", r: "describes 'bastón': which had a steel point at its butt end"}
              - {s: "mudada la color", r: "how: his colour changed"}
              - {s: "puestos los ojos en Quiteria", r: "how: his eyes fixed on Quiteria"}
              - {s: "con voz tremente y ronca", r: "how: in a trembling, hoarse voice"}
        forms:
          - {w: "Llegó", f: "lleg- + -ó → llegar (to arrive), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (llegué, with g → gu before e)."}
          - {w: "cansado", f: "cans- + -ado → cansar (to tire), participle used as an adjective, masculine to match Basilio."}
          - {w: "puesto", f: "irregular participle of poner (to put): 'placed, having planted himself'."}
          - {w: "hincando", f: "hinc- + -ando → hincar (to drive in), gerund: 'driving in'."}
          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, it (the staff). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "mudada la color", f: "mud- + -ada → mudar (to change), participle, feminine to match 'la color': an absolute participle, 'his colour (being) changed'. 'color' was often feminine in Cervantes' day."}
          - {w: "puestos los ojos", f: "puest- + -os, irregular participle of poner (to put), masculine plural to match 'ojos': another absolute participle, 'his eyes (being) fixed'."}
          - {w: "tremente", f: "trem- + -ente, old present participle of tremer (to tremble), used as an adjective; -ente/-iente makes adjectives from verbs."}
          - {w: "estas", f: "est- + -as → este (this), feminine plural to match 'razones'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron. The object 'estas razones' comes first and the verb last, a solemn order."}
  - sentences:
      - es: "— Bien sabes, desconocida Quiteria, que conforme a la santa ley que profesamos, que viviendo yo, tú no puedes tomar esposo;"
        literal: "— Well you-know, ungrateful Quiteria, that according to the holy law that we-profess, that living I, you not can take husband;"
        ormsby: "“Well dost thou know, ungrateful Quiteria, that according to the holy law we acknowledge, so long as live thou canst take no husband;"
        vocab:
          - {w: "desconocido", d: "ungrateful, who does not acknowledge a debt (a false friend: not 'unknown' here)"}
          - {w: "conforme a", d: "according to, in keeping with"}
          - {w: "profesar", d: "to profess (a faith)"}
          - {w: "viviendo yo", d: "while I live, as long as I am alive"}
          - {w: "tomar esposo", d: "to take a husband, marry"}
        diagram:
          - s: "Bien sabes"
            r: "main verb: you well know"
            under:
              - {s: "desconocida Quiteria", r: "who is addressed: ungrateful Quiteria"}
              - s: "que"
                r: "what you know: that"
                under:
                  - s: "conforme a la santa ley"
                    r: "according to what: according to the holy law"
                    under:
                      - {s: "que profesamos", r: "describes 'ley': that we profess"}
                  - {s: "que viviendo yo", r: "condition: (that) while I live (the 'que' is repeated)"}
                  - {s: "tú no puedes tomar esposo", r: "you cannot take a husband"}
        forms:
          - {w: "sabes", f: "sab- + -es → saber (to know), present, you (tú). Irregular only in the 'I' form: sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "desconocida", f: "desconoc- + -ida → desconocer (to fail to acknowledge), participle used as an adjective, feminine to match Quiteria: 'ungrateful'."}
          - {w: "profesamos", f: "profes- + -amos → profesar (to profess), present, we. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "viviendo yo", f: "viv- + -iendo → vivir (to live), gerund, with its own subject 'yo' after it: an absolute gerund, 'I living', i.e. 'while I live'."}
          - {w: "puedes", f: "pued- + -es → poder (to be able), present, you (tú). The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
        note: "Basilio claims that he and Quiteria are already bound by a promise of marriage, so that the Church's law forbids her to marry anyone else while he lives; the whole speech prepares the trick that follows."
      - es: "y juntamente no ignoras que, por esperar yo que el tiempo y mi diligencia mejorasen los bienes de mi fortuna, no he querido dejar de guardar el decoro que a tu honra convenía;"
        literal: "and likewise not you-are-unaware that, through hoping I that the time and my diligence might-improve the goods of my fortune, not I-have wished to-fail to keep the propriety that to your honour was-fitting;"
        ormsby: "nor art thou ignorant either that, in my hopes that time and my own exertions would improve my fortunes, I have never failed to observe the respect due to thy honour;"
        vocab:
          - {w: "juntamente", d: "likewise, at the same time, also"}
          - {w: "no ignorar", d: "to know full well (literally 'not to be unaware'); 'ignorar' = not to know, a false friend"}
          - {w: "diligencia", d: "effort, hard work, industry"}
          - {w: "los bienes de fortuna", d: "worldly goods, wealth, possessions"}
          - {w: "dejar de", d: "to fail to, stop (doing something)"}
          - {w: "guardar el decoro", d: "to keep proper respect, observe propriety"}
          - {w: "convenir a", d: "to be fitting for, be due to"}
        diagram:
          - s: "y juntamente no ignoras"
            r: "main verb: and likewise you know well"
            under:
              - s: "que"
                r: "what you know: that"
                under:
                  - s: "por esperar yo"
                    r: "why: because I hoped"
                    under:
                      - {s: "que el tiempo y mi diligencia mejorasen los bienes de mi fortuna", r: "what I hoped: that time and my effort would improve my worldly fortunes"}
                  - s: "no he querido dejar de guardar el decoro"
                    r: "I have not been willing to fail to keep the respect"
                    under:
                      - {s: "que a tu honra convenía", r: "describes 'decoro': that was due to your honour"}
        forms:
          - {w: "ignoras", f: "ignor- + -as → ignorar (not to know), present, you (tú). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "por esperar yo", f: "esperar (to hope), infinitive after 'por' (because of), with its own subject 'yo' after it: 'because I hoped'."}
          - {w: "mejorasen", f: "mejor- + -asen → mejorar (to improve), imperfect subjunctive (-se form), they (time and my diligence). The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. Subjunctive after 'esperar que' (to hope that)."}
          - {w: "he querido", f: "h- + -e → haber (to have), present, I: he, has, ha, hemos, habéis, han; + querido, participle of querer (to want): the perfect, 'I have wanted, been willing'."}
          - {w: "convenía", f: "conven- + -ía → convenir (to be fitting), imperfect, it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
        note: "Basilio's claim is that he never pressed his suit improperly while he waited to become rich enough to marry her; in Part II chapter 19 he is described as a gifted young man of small means whom Quiteria's father would not accept."
      - es: "pero tú, echando a las espaldas todas las obligaciones que debes a mi buen deseo, quieres hacer señor de lo que es mío a otro, cuyas riquezas le sirven no sólo de buena fortuna, sino de bonísima ventura."
        literal: "but you, throwing to the backs all the obligations that you-owe to my good desire, want to-make lord of that which is mine [to] another, whose riches to-him serve not only as good fortune, but as very-good luck."
        ormsby: "but thou, casting behind thee all thou owest to my true love, wouldst surrender what is mine to another whose wealth serves to bring him not only good fortune but supreme happiness;"
        vocab:
          - {w: "echar a las espaldas", d: "to put behind one, disregard, forget about"}
          - {w: "obligaciones", d: "obligations, debts of gratitude"}
          - {w: "buen deseo", d: "true love, honest affection (literally 'good desire')"}
          - {w: "hacer señor de", d: "to make (someone) master of, hand over to"}
          - {w: "servir de", d: "to serve as"}
          - {w: "ventura", d: "luck, happiness, good fortune"}
        diagram:
          - s: "pero tú"
            r: "subject: but you"
            under:
              - {s: "echando a las espaldas todas las obligaciones", r: "how: putting behind you all the obligations"}
              - {s: "que debes a mi buen deseo", r: "describes 'obligaciones': that you owe to my true love"}
          - s: "quieres hacer señor de lo que es mío a otro"
            r: "main verb: you want to make another man master of what is mine"
            under:
              - s: "cuyas riquezas le sirven"
                r: "describes 'otro': whose riches serve him"
                under:
                  - {s: "no sólo de buena fortuna, sino de bonísima ventura", r: "as what: not only as good fortune but as the best of luck"}
        forms:
          - {w: "echando", f: "ech- + -ando → echar (to throw), gerund: 'throwing'."}
          - {w: "debes", f: "deb- + -es → deber (to owe), present, you (tú). The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "quieres", f: "quier- + -es → querer (to want), present, you (tú). The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "cuyas", f: "cuy- + -as → cuyo (whose), feminine plural to match 'riquezas', the thing owned, not the owner."}
          - {w: "sirven", f: "sirv- + -en → servir (to serve), present, they (the riches). The e of the stem becomes i when stressed: sirvo, sirves, sirve, servimos, servís, sirven."}
          - {w: "bonísima", f: "bon- + -ísima → bueno (good), superlative with -ísimo, feminine to match 'ventura': 'very good'. The Latin stem bon- is used, as in bonísimo (modern also buenísimo)."}
      - es: "Y para que la tenga colmada, y no como yo pienso que la merece, sino como se la quieren dar los cielos, yo, por mis manos, desharé el imposible o el inconveniente que puede estorbársela, quitándome a mí de por medio."
        literal: "And so that it he-may-have brimming, and not as I think that it he-deserves, but as to-him it want to-give the heavens, I, by my hands, will-undo the impossibility or the obstacle that can hinder-it-for-him, removing-myself [I] from in the middle."
        ormsby: "and now to complete it (not that I think he deserves it, but inasmuch as heaven is pleased to bestow it upon him), I will, with my own hands, do away with the obstacle that may interfere with it, and remove myself from between you."
        vocab:
          - {w: "colmado", d: "full to the brim, complete, heaped up"}
          - {w: "merecer", d: "to deserve"}
          - {w: "deshacer", d: "to undo, remove, do away with"}
          - {w: "el imposible", d: "the impossibility, the thing that makes it impossible (adjective used as a noun)"}
          - {w: "inconveniente", d: "obstacle, difficulty (not 'inconvenient')"}
          - {w: "estorbar", d: "to hinder, get in the way of"}
          - {w: "quitarse de por medio", d: "to get out of the way, remove oneself (often a euphemism for killing oneself)"}
        diagram:
          - s: "yo, por mis manos, desharé el imposible o el inconveniente"
            r: "main verb: I, with my own hands, will remove the impossibility or obstacle"
            under:
              - s: "Y para que la tenga colmada"
                r: "purpose: so that he may have it (his luck) to the full"
                under:
                  - {s: "y no como yo pienso que la merece", r: "aside 1: not as I think he deserves it"}
                  - {s: "sino como se la quieren dar los cielos", r: "aside 2: but as heaven wishes to give it to him"}
              - {s: "que puede estorbársela", r: "describes 'inconveniente': that can hinder it for him"}
              - {s: "quitándome a mí de por medio", r: "how: by removing myself from the way"}
        forms:
          - {w: "la tenga", f: "teng- + -a → tener (to have), present subjunctive, he (Camacho). Irregular: tenga, tengas, tenga, tengamos, tengáis, tengan. Subjunctive after 'para que' (so that). 'la' = it, the 'ventura' (luck) of the previous sentence."}
          - {w: "colmada", f: "colm- + -ada → colmar (to fill to the brim), participle, feminine to match 'la' (the luck)."}
          - {w: "pienso", f: "piens- + -o → pensar (to think), present, I. The stem e becomes ie when stressed: pienso, piensas, piensa, pensamos, pensáis, piensan."}
          - {w: "merece", f: "merec- + -e → merecer (to deserve), present, he. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (merezco in the 'I' form)."}
          - {w: "se la quieren dar", f: "quier- + -en → querer (to want), present, they (the heavens): quiero, quieres, quiere, queremos, queréis, quieren; + dar (to give). 'se la' = it (la) to him: 'le' becomes 'se' before 'la', and both pronouns go before the whole group."}
          - {w: "desharé", f: "deshar- + -é → deshacer (to undo), future, I. Irregular stem deshar- (like hacer (to do), har-): desharé, desharás, deshará, desharemos, desharéis, desharán."}
          - {w: "puede", f: "pued- + -e → poder (to be able), present, it (the obstacle). The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "estorbársela", f: "estorbar (to hinder) + se (for him) + la (it), both pronouns stuck on the infinitive, which gets a written accent: 'hinder it for him'. 'le' becomes 'se' before 'la'."}
          - {w: "quitándome a mí", f: "quit- + -ando + me → quitarse (to remove oneself), gerund, with 'me' on the end (written accent added): 'removing myself'; 'a mí' repeats 'me' for emphasis."}
        note: "Everyone hears 'quitarme de por medio' as a threat of suicide; the phrase also means simply 'step aside', and both senses come true in this chapter."
      - es: "¡Viva, viva el rico Camacho con la ingrata Quiteria largos y felices siglos, y muera, muera el pobre Basilio, cuya pobreza cortó las alas de su dicha y le puso en la sepultura!"
        literal: "Long-live, long-live the rich Camacho with the ungrateful Quiteria long and happy centuries, and let-die, let-die the poor Basilio, whose poverty cut the wings of his happiness and him put in the grave!"
        ormsby: "Long live the rich Camacho! many a happy year may he live with the ungrateful Quiteria! and let the poor Basilio die, Basilio whose poverty clipped the wings of his happiness, and brought him to the grave!”"
        vocab:
          - {w: "¡viva!", d: "long live ...!, may (he) live!"}
          - {w: "ingrato", d: "ungrateful"}
          - {w: "siglos", d: "ages, a very long time (literally 'centuries'), a poetic exaggeration"}
          - {w: "¡muera!", d: "let (him) die!, death to ...!"}
          - {w: "dicha", d: "happiness, good fortune"}
          - {w: "sepultura", d: "grave, tomb"}
        diagram:
          - s: "Viva, viva el rico Camacho"
            r: "wish 1: long live rich Camacho"
            under:
              - {s: "con la ingrata Quiteria", r: "with whom: with ungrateful Quiteria"}
              - {s: "largos y felices siglos", r: "how long: for long and happy ages"}
          - s: "y muera, muera el pobre Basilio"
            r: "wish 2: and let poor Basilio die"
            under:
              - s: "cuya pobreza cortó las alas de su dicha"
                r: "describes 'Basilio': whose poverty clipped the wings of his happiness"
                under:
                  - {s: "y le puso en la sepultura", r: "and put him in the grave"}
        forms:
          - {w: "Viva", f: "viv- + -a → vivir (to live), present subjunctive, he: a wish, 'may he live'. The present subjunctive of -er and -ir verbs: -a, -as, -a, -amos, -áis, -an."}
          - {w: "muera", f: "muer- + -a → morir (to die), present subjunctive, he: 'let him die'. The stem o becomes ue when stressed: muera, mueras, muera, muramos, muráis, mueran."}
          - {w: "cuya", f: "cuy- + -a → cuyo (whose), feminine to match 'pobreza', the thing owned, not the owner."}
          - {w: "cortó", f: "cort- + -ó → cortar (to cut), preterite, it (poverty). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "le puso", f: "pus- + -o → poner (to put), preterite, it. Irregular: puse, pusiste, puso, pusimos, pusisteis, pusieron. 'le' = him as direct object: leísmo, 'le' instead of 'lo' for a male person, normal in Cervantes."}
        note: "Basilio speaks of himself in the third person, as if reading his own epitaph; the preterites 'cortó' and 'puso' treat his death as already done."
  - sentences:
      - es: "Y, diciendo esto, asió del bastón que tenía hincado en el suelo, y, quedándose la mitad dél en la tierra, mostró que servía de vaina a un mediano estoque que en él se ocultaba;"
        literal: "And, saying this, he-seized of-the staff that he-had driven-in in the ground, and, remaining-itself the half of-it in the earth, he-showed that it-served as sheath to a middling rapier that in it itself was-hiding;"
        ormsby: "And so saying, he seized the staff he had driven into the ground, and leaving one half of it fixed there, showed it to be a sheath that concealed a tolerably long rapier;"
        vocab:
          - {w: "asir de", d: "to seize, grab hold of; Cervantes often uses it with 'de' (asió del bastón)"}
          - {w: "hincar", d: "to drive in, plant (a stick, a stake) in the ground"}
          - {w: "dél", d: "= de él, of it (old contraction)"}
          - {w: "servir de", d: "to serve as"}
          - {w: "vaina", d: "sheath, scabbard"}
          - {w: "mediano", d: "middling, of moderate size; Ormsby 'tolerably long'"}
          - {w: "estoque", d: "rapier, a narrow thrusting sword; a sword-stick when hidden in a staff"}
          - {w: "ocultarse", d: "to be hidden, lie hidden"}
        diagram:
          - s: "asió del bastón"
            r: "main verb 1: he seized the staff"
            under:
              - {s: "diciendo esto", r: "when: as he said this"}
              - {s: "que tenía hincado en el suelo", r: "describes 'bastón': which he had planted in the ground"}
          - s: "mostró"
            r: "main verb 2 (after 'y'): he showed"
            under:
              - {s: "quedándose la mitad dél en la tierra", r: "how: with half of it staying in the earth"}
              - s: "que servía de vaina a un mediano estoque"
                r: "what he showed: that it served as the sheath of a middling rapier"
                under:
                  - {s: "que en él se ocultaba", r: "describes 'estoque': which was hidden in it"}
        forms:
          - {w: "diciendo", f: "dic- + -iendo → decir (to say), gerund: 'saying'. The e of the stem turns to i in the gerund: decir → diciendo."}
          - {w: "asió", f: "as- + -ió → asir (to seize), preterite, he. The preterite of -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "tenía hincado", f: "ten- + -ía → tener (to have), imperfect, he: tenía, tenías, tenía, teníamos, teníais, tenían; + hincado, participle of hincar (to drive in), agreeing with 'bastón': 'he had [it] planted'."}
          - {w: "quedándose", f: "qued- + -ando + se → quedarse (to remain), gerund with 'se' stuck on the end, accent added to keep the stress: 'remaining'. Its subject is 'la mitad dél' (half of it)."}
          - {w: "dél", f: "= de + él, 'of it' (the staff); modern Spanish writes 'de él' in two words."}
          - {w: "mostró", f: "mostr- + -ó → mostrar (to show), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "servía", f: "serv- + -ía → servir (to serve), imperfect, it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "se ocultaba", f: "ocult- + -aba → ocultarse (to hide oneself, lie hidden), imperfect, it, with 'se'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
        note: "Basilio's staff is a sword-stick: the lower half stays stuck in the ground as a sheath and the upper half, drawn out, is a blade. Ormsby earlier described it as a staff 'which had a steel spike at the end', which turns out to be part of the trick."
      - es: "y, puesta la que se podía llamar empuñadura en el suelo, con ligero desenfado y determinado propósito se arrojó sobre él, y en un punto mostró la punta sangrienta a las espaldas, con la mitad del acerada cuchilla, quedando el triste bañado en su sangre y tendido en el suelo, de sus mismas armas traspasado."
        literal: "and, put the [one] that itself could call hilt on the ground, with light ease and determined purpose himself he-threw upon it, and in a point he-showed the point bloody at the back, with the half of-the steeled blade, remaining the sad-one bathed in his blood and stretched-out on the ground, by his own arms pierced-through."
        ormsby: "and, what may be called its hilt being planted in the ground, he swiftly, coolly, and deliberately threw himself upon it, and in an instant the bloody point and half the steel blade appeared at his back, the unhappy man falling to the earth bathed in his blood, and transfixed by his own weapon."
        vocab:
          - {w: "empuñadura", d: "hilt, grip of a sword"}
          - {w: "desenfado", d: "ease, coolness, unconcern"}
          - {w: "propósito", d: "purpose, resolve"}
          - {w: "arrojarse", d: "to throw oneself, fling oneself"}
          - {w: "en un punto", d: "in an instant"}
          - {w: "a las espaldas", d: "at his back; 'espaldas' (plural) = back, shoulders"}
          - {w: "acerado", d: "of steel, steely"}
          - {w: "cuchilla", d: "blade"}
          - {w: "el triste", d: "the unhappy man; 'triste' used as a noun, 'the poor wretch'"}
