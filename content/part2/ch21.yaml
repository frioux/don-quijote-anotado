          - {w: "sayo", d: "a loose, long-skirted coat or smock worn by country people"}
          - {w: "jironado", d: "trimmed with 'jirones', triangular gores or strips of cloth sewn on"}
          - {w: "carmesí", d: "crimson"}
          - {w: "a llamas", d: "in the shape of flames, flame-patterned"}
