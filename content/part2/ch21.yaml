  - sentences:
      - es: "— Teneos, señores, teneos, que no es razón toméis venganza de los agravios que el amor nos hace;"
        literal: "— Hold-yourselves, sirs, hold-yourselves, for not it-is reason [that] you-take vengeance for the wrongs that the love to-us does;"
        ormsby: "“Hold, sirs, hold!” cried Don Quixote in a loud voice; “we have no right to take vengeance for wrongs that love may do to us:"
        vocab:
          - {w: "tenerse", d: "to stop, hold back; 'teneos' = hold!, stop!, the cry to break up a fight"}
          - {w: "no es razón", d: "it is not right, it is not reasonable ('razón' = what is right and fitting)"}
          - {w: "tomar venganza de", d: "to take revenge for"}
          - {w: "agravio", d: "wrong, injury, offence (the word knights use for any injustice they must set right)"}
        diagram:
          - s: "Teneos, señores, teneos"
            r: "main verb: stop, sirs, stop! (said to both armed bands)"
          - s: "que no es razón"
            r: "why (after 'que', for): for it is not right"
            under:
              - s: "toméis venganza de los agravios"
                r: "what is not right: that you take revenge for the wrongs"
                under:
                  - {s: "que el amor nos hace", r: "describes 'agravios': that love does to us"}
        forms:
          - {w: "Teneos", f: "ten- + -ed + os → tenerse (to hold oneself back), imperative, you (vosotros, the crowd): 'hold!'. The vosotros imperative swaps the final -r of the infinitive for -d (tened), and the -d drops when 'os' (yourselves) is hung on the end: tened + os → teneos."}
          - {w: "es", f: "es → ser (to be), present, it. ser in the present: soy, eres, es, somos, sois, son."}
          - {w: "toméis", f: "tom- + -éis → tomar (to take), present subjunctive, you (vosotros): 'that you take'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. Subjunctive after 'no es razón (que)'; Cervantes leaves out the 'que', as he often does after verbs of judging and asking."}
          - {w: "los agravios", f: "agravio (wrong) + -s, masculine plural; 'de los agravios' = for the wrongs (de gives the cause of the revenge)."}
          - {w: "nos hace", f: "hac- + -e → hacer (to do), present, it (love), with 'nos' (to us) before it: 'does to us'. Irregular: hago, haces, hace, hacemos, hacéis, hacen."}
        note: "Don Quijote now speaks as the knight who keeps the peace: the same man who in Part I charged into every quarrel. The wrongs 'love does to us' are Camacho's, but he includes himself, the lover of Dulcinea, in the 'us'."
      - es: "y advertid que el amor y la guerra son una misma cosa, y así como en la guerra es cosa lícita y acostumbrada usar de ardides y estratagemas para vencer al enemigo, así en las contiendas y competencias amorosas se tienen por buenos los embustes y marañas que se hacen para conseguir el fin que se desea, como no sean en menoscabo y deshonra de la cosa amada."
        literal: "and take-note that the love and the war are one same thing, and just as in the war it-is thing lawful and customary to-use of ruses and stratagems to defeat [to] the enemy, so in the contests and rivalries amorous themselves are-held as good the tricks and tangles that themselves are-done to obtain the end that itself is-desired, as-long-as not they-be to-the detriment and dishonor of the thing loved."
        ormsby: "remember love and war are the same thing, and as in war it is allowable and common to make use of wiles and stratagems to overcome the enemy, so in the contests and rivalries of love the tricks and devices employed to attain the desired end are justifiable, provided they be not to the discredit or dishonour of the loved object."
        vocab:
          - {w: "advertir", d: "to note, bear in mind, observe (not 'to advertise'); 'advertid que' = remember that"}
          - {w: "una misma cosa", d: "one and the same thing"}
          - {w: "lícito", d: "lawful, permitted, allowable"}
          - {w: "acostumbrado", d: "customary, usual"}
          - {w: "usar de", d: "to make use of, employ (the 'de' is normal in older Spanish)"}
          - {w: "ardid", d: "ruse, trick of war, stratagem"}
          - {w: "estratagema", d: "stratagem (feminine in Spanish: 'la estratagema')"}
          - {w: "contienda", d: "contest, dispute, fight"}
          - {w: "competencia", d: "rivalry, competition (false friend: not 'competence')"}
          - {w: "tener por bueno", d: "to consider good, regard as acceptable"}
          - {w: "embuste", d: "trick, lie, deception"}
          - {w: "maraña", d: "tangle; figuratively a scheme, intrigue, plot"}
          - {w: "como no", d: "with the subjunctive, 'as long as ... not, provided that ... not'"}
          - {w: "menoscabo", d: "detriment, harm, loss (to reputation)"}
        diagram:
          - s: "y advertid"
            r: "main verb: and remember (still to the crowd)"
            under:
              - {s: "que el amor y la guerra son una misma cosa", r: "what to remember, 1: that love and war are one and the same"}
              - s: "y así como en la guerra es cosa lícita y acostumbrada"
                r: "what to remember, 2, comparison: and just as in war it is lawful and usual"
                under:
                  - s: "usar de ardides y estratagemas"
                    r: "what is lawful: to use ruses and stratagems"
                    under:
                      - {s: "para vencer al enemigo", r: "why: to defeat the enemy"}
              - s: "así en las contiendas y competencias amorosas se tienen por buenos"
                r: "second half of the comparison: so in love's contests and rivalries are held good"
                under:
                  - s: "los embustes y marañas"
                    r: "subject: the tricks and schemes"
                    under:
                      - s: "que se hacen para conseguir el fin"
                        r: "describes 'embustes y marañas': that are made to reach the goal"
                        under:
                          - {s: "que se desea", r: "describes 'fin': that is desired"}
                  - {s: "como no sean en menoscabo y deshonra de la cosa amada", r: "condition: provided they do not harm or dishonor the beloved"}
        forms:
          - {w: "advertid", f: "advert- + -id → advertir (to note), imperative, you (vosotros): 'note!, remember!'. The vosotros imperative swaps the final -r of the infinitive for -d: tomad, tened, advertid."}
          - {w: "son", f: "son → ser (to be), present, they (love and war). ser in the present: soy, eres, es, somos, sois, son."}
          - {w: "una misma", f: "un- + -a, mism- + -a → uno (one), mismo (same), both feminine to match 'cosa'."}
          - {w: "lícita y acostumbrada", f: "lícit- + -a → lícito (lawful) and acostumbr- + -ada → acostumbrado (customary), participle of acostumbrar (to be accustomed) used as an adjective; both feminine to match 'cosa'."}
          - {w: "usar, vencer", f: "infinitives: usar (to use) as the subject of 'es cosa lícita' (to use ... is lawful); vencer (to defeat) after 'para' (in order to)."}
          - {w: "al enemigo", f: "al = a + el; the 'a' marks a person-like direct object ('the enemy'), the personal a."}
          - {w: "amorosas", f: "amoros- + -as → amoroso (of love, amorous), feminine plural to match 'contiendas y competencias'."}
          - {w: "se tienen", f: "tien- + -en → tener (to hold), present, they (the tricks), with 'se' making it passive: 'are held (as good)'. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "buenos", f: "buen- + -os → bueno (good), masculine plural to match 'embustes y marañas' (a mixed pair takes the masculine)."}
          - {w: "se hacen, se desea", f: "hac- + -en → hacer (to do, make), present, they, and dese- + -a → desear (to desire), present, it; both with passive 'se': 'are made', 'is desired'. hacer in the present: hago, haces, hace, hacemos, hacéis, hacen. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "conseguir", f: "infinitive of conseguir (to obtain, reach) after 'para' (in order to)."}
          - {w: "sean", f: "se- + -an → ser (to be), present subjunctive, they (the tricks): 'provided they are not'. ser in the present subjunctive: sea, seas, sea, seamos, seáis, sean. 'como' with the subjunctive means 'provided that'."}
          - {w: "amada", f: "am- + -ada → amar (to love), participle used as an adjective, feminine to match 'cosa': 'the beloved thing'."}
        note: "This is the proverb 'all's fair in love and war', which Don Quijote turns into a little lecture with a knightly limit: the trick must not dishonor the lady. It is his ruling on Basilio's fake suicide, delivered as if from a court of chivalry."
      - es: "Quiteria era de Basilio, y Basilio de Quiteria, por justa y favorable disposición de los cielos."
        literal: "Quiteria was of Basilio, and Basilio of Quiteria, by just and favorable disposition of the heavens."
        ormsby: "Quiteria belonged to Basilio and Basilio to Quiteria by the just and beneficent disposal of heaven."
        vocab:
          - {w: "ser de", d: "to belong to: 'Quiteria era de Basilio' = Quiteria was Basilio's"}
          - {w: "disposición", d: "arrangement, ordering, decree (here of providence), not 'mood'"}
          - {w: "los cielos", d: "the heavens, i.e. God, providence (plural in this sense)"}
        diagram:
          - s: "Quiteria era de Basilio"
            r: "main verb 1: Quiteria belonged to Basilio"
          - s: "y Basilio de Quiteria"
            r: "main clause 2, verb 'era' understood: and Basilio [belonged] to Quiteria"
          - {s: "por justa y favorable disposición de los cielos", r: "why: by the just and kind arrangement of heaven"}
        forms:
          - {w: "era", f: "era → ser (to be), imperfect, she: 'was (Basilio's)'. ser is irregular in the imperfect: era, eras, era, éramos, erais, eran. The imperfect says it had always been so, before today."}
          - {w: "justa", f: "just- + -a → justo (just), feminine to match 'disposición'; 'favorable' has the same form for both genders."}
