                    r: "describes 'hombre': dressed, it seemed, in a black coat"
                    under:
                      - {s: "jironado de carmesí a llamas", r: "describes 'sayo': trimmed with crimson strips like flames"}
        forms:
          - {w: "cuyas", f: "cuy- + -as → cuyo (whose), feminine plural to match the thing owned ('voces'), not the owner; here it simply means 'these'."}
          - {w: "volvieron", f: "volv- + -ieron → volver (to turn), preterite, they. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "vieron", f: "v- + -ieron → ver (to see), preterite, they. ver (to see) in the preterite: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "las daba", f: "d- + -aba → dar (to give), imperfect, he (the man): 'was giving'. dar (to give) in the imperfect: daba, dabas, daba, dábamos, dabais, daban. 'las' = them, the shouts ('voces'); the subject 'un hombre' comes after the verb."}
