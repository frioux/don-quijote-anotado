  - sentences:
      - es: "— Sí doy —respondió Basilio—, no turbado ni confuso, sino con el claro entendimiento que el cielo quiso darme; y así, me doy y me entrego por tu esposo."
        literal: "— Yes I-give —answered Basilio—, not troubled nor confused, but with the clear understanding that the heaven wished to-give-me; and so, myself I-give and myself I-hand-over as your husband."
        ormsby: "“Yes, I give it,” said Basilio, “not agitated or distracted, but with unclouded reason that heaven is pleased to grant me, thus do I give myself to be thy husband.”"
        vocab:
          - {w: "Sí doy", d: "yes, I do give [it]: 'sí' before the verb stresses it, like English 'I do'"}
          - {w: "turbado", d: "troubled, agitated, flustered"}
          - {w: "entendimiento", d: "understanding, reason, mind"}
          - {w: "entregarse", d: "to give oneself up, hand oneself over"}
          - {w: "por", d: "here 'as': 'por tu esposo' = as your husband"}
        diagram:
          - s: "Sí doy"
            r: "main verb 1: yes, I give [my hand]"
            under:
              - {s: "respondió Basilio", r: "speech tag: answered Basilio"}
              - {s: "no turbado ni confuso", r: "how: not troubled or confused"}
              - s: "sino con el claro entendimiento"
                r: "how: but with a clear mind"
                under:
                  - {s: "que el cielo quiso darme", r: "describes 'entendimiento': that heaven was pleased to give me"}
          - s: "me doy y me entrego"
            r: "main verbs 2 and 3 (after 'y así'): I give and hand myself over"
            under:
              - {s: "por tu esposo", r: "as what: as your husband"}
        forms:
