            r: "main verb 1: all the bystanders were left amazed"
          - s: "y algunos dellos"
            r: "subject of main verb 2: and some of them"
            under:
              - {s: "más simples que curiosos", r: "describes 'algunos': more gullible than inquiring"}
              - {s: "en altas voces", r: "how: loudly"}
              - {s: "comenzaron a decir:", r: "main verb 2: began to say"}
        forms:
          - {w: "Quedaron", f: "qued- + -aron → quedar (to remain, be left), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. The verb comes first, before its subject."}
          - {w: "admirados", f: "participle of admirar (to amaze), masculine plural to match 'circunstantes'."}
          - {w: "dellos", f: "de + ellos fused: 'of them', old contraction; modern 'de ellos'."}
          - {w: "comenzaron", f: "comenz- + -aron → comenzar (to begin), preterite, they; 'comenzar a' + infinitive = to begin to. Same -ar preterite: comencé, comenzaste, comenzó, comenzamos, comenzasteis, comenzaron (z becomes c before e)."}
  - sentences:
      - es: "— ¡Milagro, milagro!"
        literal: "— Miracle, miracle!"
