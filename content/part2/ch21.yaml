part: 2
chapter: 21
title_es: "Capítulo XXI. Donde se prosiguen las bodas de Camacho, con otros gustosos sucesos"
title_en: "In which Camacho’s wedding is continued, with other delightful incidents"
paragraphs:
  - sentences:
      - es: "Cuando estaban don Quijote y Sancho en las razones referidas en el capítulo antecedente, se oyeron grandes voces y gran ruido, y dábanlas y causábanle los de las yeguas, que con larga carrera y grita iban a recebir a los novios, que, rodeados de mil géneros de instrumentos y de invenciones, venían acompañados del cura, y de la parentela de entrambos, y de toda la gente más lucida de los lugares circunvecinos, todos vestidos de fiesta."
        literal: "When were Don Quijote and Sancho in the talk referred-to in the chapter preceding, themselves were-heard great shouts and great noise, and gave-them and caused-it those of the mares, who with long gallop and shouting were-going to receive [to] the bride-and-groom, who, surrounded by a-thousand kinds of instruments and of pageants, were-coming accompanied by-the priest, and by the kinsfolk of both, and by all the people most splendid of the places neighbouring, all dressed for festival."
        ormsby: "While Don Quixote and Sancho were engaged in the discussion set forth the last chapter, they heard loud shouts and a great noise, which were uttered and made by the men on the mares as they went at full gallop, shouting, to receive the bride and bridegroom, who were approaching with musical instruments and pageantry of all sorts around them, and accompanied by the priest and the relatives of both, and all the most distinguished people of the surrounding villages."
        vocab:
          - {w: "razones", d: "talk, words, arguments (not 'reasons')"}
          - {w: "referido", d: "related, told, mentioned"}
          - {w: "antecedente", d: "preceding, previous"}
          - {w: "voces", d: "shouts, cries (not just 'voices')"}
          - {w: "dábanlas y causábanle", d: "gave them (the shouts) and caused it (the noise): two verbs with pronouns hung on the end"}
          - {w: "los de las yeguas", d: "the men on the mares: the twelve riders of the previous chapter"}
          - {w: "carrera", d: "run, gallop, race"}
          - {w: "grita", d: "shouting, uproar, a clamour of voices"}
          - {w: "recebir", d: "= recibir, to receive, go out to meet (old spelling)"}
          - {w: "los novios", d: "the bride and groom (the masculine plural covers both)"}
          - {w: "géneros", d: "kinds, sorts (not 'genders')"}
          - {w: "invenciones", d: "pageants, festive devices, masques (not 'inventions')"}
          - {w: "parentela", d: "kinsfolk, relatives"}
          - {w: "entrambos", d: "= ambos, both (old form)"}
          - {w: "lucido", d: "splendid, distinguished, well turned-out"}
          - {w: "circunvecino", d: "neighbouring, surrounding"}
          - {w: "vestido de fiesta", d: "dressed in holiday clothes, in their best"}
        diagram:
          - s: "se oyeron"
            r: "main verb 1: were heard"
            under:
              - s: "Cuando estaban don Quijote y Sancho en las razones"
                r: "when: while Don Quijote and Sancho were in their talk"
                under:
                  - {s: "referidas en el capítulo antecedente", r: "describes 'razones': told in the previous chapter"}
              - {s: "grandes voces y gran ruido", r: "subject: great shouts and great noise"}
          - s: "y dábanlas y causábanle"
            r: "main verbs 2 and 3: and gave them (the shouts) and caused it (the noise)"
            under:
              - s: "los de las yeguas"
                r: "subject: the men on the mares"
                under:
                  - s: "que con larga carrera y grita iban a recebir a los novios"
                    r: "describes 'los de las yeguas': who with a long gallop and shouting were going to meet the couple"
                    under:
                      - s: "que"
                        r: "describes 'novios': who"
                        under:
                          - {s: "rodeados de mil géneros de instrumentos y de invenciones", r: "how: surrounded by a thousand kinds of instruments and pageants"}
                          - {s: "venían acompañados del cura", r: "verb: were coming accompanied by the priest"}
                          - {s: "y de la parentela de entrambos", r: "accompanied by, 2: and by the relatives of both"}
                          - {s: "y de toda la gente más lucida de los lugares circunvecinos", r: "accompanied by, 3: and by all the finest people of the neighbouring villages"}
                          - {s: "todos vestidos de fiesta", r: "describes all of them: all in their holiday clothes"}
        forms:
          - {w: "estaban", f: "est- + -aban → estar (to be), imperfect, they (Don Quijote and Sancho): 'were (engaged in)'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "referidas", f: "refer- + -idas → referir (to relate, tell), participle used as an adjective, feminine plural to match 'razones'."}
          - {w: "se oyeron", f: "oy- + -eron → oír (to hear), preterite, they (the shouts and noise), with 'se' making it passive: 'were heard'. The i of the stem turns to y between vowels: oí, oíste, oyó, oímos, oísteis, oyeron."}
          - {w: "gran", f: "grande (great) clipped before a singular noun ('ruido'); before the plural 'voces' it stays 'grandes'."}
          - {w: "dábanlas", f: "d- + -aban + las → dar (to give), imperfect, they, with 'las' (them, the shouts) stuck on the end; modern 'las daban'. dar (to give) in the imperfect: daba, dabas, daba, dábamos, dabais, daban. Cervantes often hangs object pronouns on a verb that opens its clause, and the written accent is added to keep the stress."}
          - {w: "causábanle", f: "caus- + -aban + le → causar (to cause), imperfect, they, with 'le' (it, the noise) stuck on the end; modern 'lo causaban'. Same -aba imperfect. Using 'le' for a masculine thing is an old habit beside the leísmo of persons."}
          - {w: "iban a recebir", f: "ib- + -an → ir (to go), imperfect, they: iba, ibas, iba, íbamos, ibais, iban; + recebir, old spelling of recibir (to receive), infinitive after 'ir a': 'were going (out) to meet'."}
          - {w: "rodeados", f: "rode- + -ados → rodear (to surround), participle, masculine plural to match 'novios'."}
          - {w: "venían", f: "ven- + -ían → venir (to come), imperfect, they (the couple). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "acompañados", f: "acompañ- + -ados → acompañar (to accompany), participle, masculine plural to match 'novios'; 'acompañado de' = accompanied by."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes: 'by the priest'."}
          - {w: "vestidos", f: "vest- + -idos → vestir (to dress), participle, masculine plural to match 'todos'."}
        note: "The wedding procession arrives at the arbour where, in the previous chapter, Sancho skimmed hens out of the pots and Don Quijote watched the dances; the 'men on the mares' are the twelve peasants who rode past cheering Camacho and Quiteria."
      - es: "Y como Sancho vio a la novia, dijo:"
        literal: "And as Sancho saw [to] the bride, he-said:"
        ormsby: "When Sancho saw the bride, he exclaimed,"
        vocab:
          - {w: "como", d: "here 'as soon as, when' (with the preterite), not 'like'"}
          - {w: "la novia", d: "the bride ('novia' is both 'bride' and 'girlfriend, fiancée')"}
        diagram:
          - s: "dijo:"
            r: "main verb: he said"
            under:
              - {s: "Y como Sancho vio a la novia", r: "when: as soon as Sancho saw the bride"}
        forms:
          - {w: "vio", f: "v- + -io → ver (to see), preterite, he. ver (to see) in the preterite: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "a la novia", f: "'a' before a person as direct object (the 'personal a'); English has nothing here."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— A buena fe que no viene vestida de labradora, sino de garrida palaciega."
        literal: "— By good faith that not she-comes dressed as peasant-woman, but as fine court-lady."
        ormsby: "“By my faith, she is not dressed like a country girl, but like some fine court lady;"
        vocab:
          - {w: "a buena fe", d: "in good faith, truly, upon my word (a mild oath)"}
          - {w: "venir vestida de", d: "to come dressed as, to be dressed like"}
          - {w: "labradora", d: "peasant woman, farmer's wife or daughter (feminine of 'labrador', farmer)"}
          - {w: "garrido", d: "handsome, fine, smart (old, rustic word)"}
          - {w: "palaciega", d: "court lady, a woman of the palace (from 'palacio')"}
        diagram:
          - s: "no viene vestida de labradora"
            r: "main verb: she does not come dressed as a peasant girl"
            under:
              - {s: "A buena fe que", r: "oath: upon my word"}
              - {s: "sino de garrida palaciega", r: "contrast: but as a fine court lady"}
        forms:
          - {w: "viene", f: "vien- + -e → venir (to come), present, she (the bride). Irregular: vengo, vienes, viene, venimos, venís, vienen. 'viene vestida' = she comes dressed, she is dressed."}
          - {w: "vestida", f: "vest- + -ida → vestir (to dress), participle, feminine to match the bride."}
          - {w: "garrida", f: "garrid- + -a → garrido (handsome, fine), feminine to match 'palaciega'."}
        note: "Sancho expected a village bride in village dress; Quiteria, the bride of the richest man in the district, is dressed like a lady of the court. His running commentary that follows is a list of every country fabric and trinket he expected and the luxury he finds instead."
      - es: "¡Pardiez, que según diviso, que las patenas que había de traer son ricos corales, y la palmilla verde de Cuenca es terciopelo de treinta pelos!"
        literal: "By-God, that according-to [what] I-make-out, that the medallions that she-was-to wear are rich corals, and the woollen-cloth green of Cuenca is velvet of thirty piles!"
        ormsby: "egad, as well as I can make out, the patena she wears is rich coral, and her green Cuenca stuff is thirty-pile velvet;"
        ormsby_note: "A metal ornament worn by peasant girls somewhat after the manner of a locket. (On the velvet:) The richest ordinary velvet being three pile."
        vocab:
          - {w: "pardiez", d: "by God!, egad! (a disguised oath: 'par Dios' altered)"}
          - {w: "según diviso", d: "as far as I can make out; 'divisar' = to make out, descry at a distance"}
          - {w: "patena", d: "a large medallion or locket, usually with a sacred image, worn on the breast by peasant women"}
          - {w: "haber de traer", d: "to be expected to wear; 'traer' = to wear (clothes, jewels), not only 'to bring'"}
          - {w: "coral", d: "coral, here coral beads or a coral necklace, a costly ornament"}
          - {w: "palmilla", d: "a kind of woollen cloth, the green 'palmilla' of Cuenca being the usual stuff for peasant women's skirts"}
          - {w: "Cuenca", d: "city in Castile (east of Madrid), famous for its woollen cloth"}
          - {w: "terciopelo", d: "velvet"}
          - {w: "de treinta pelos", d: "of thirty piles: an impossible quality, since three-pile velvet was the richest; Sancho's exaggeration"}
        diagram:
          - s: "son ricos corales"
            r: "main verb 1: are rich corals"
            under:
              - {s: "Pardiez, que según diviso", r: "oath and aside: by God, as far as I can make out"}
              - s: "que las patenas"
                r: "subject: the medallions"
                under:
                  - {s: "que había de traer", r: "describes 'patenas': that she was supposed to wear (as a peasant)"}
          - s: "y la palmilla verde de Cuenca es terciopelo de treinta pelos"
            r: "main verb 2: and the green Cuenca wool is thirty-pile velvet"
        forms:
          - {w: "diviso", f: "divis- + -o → divisar (to make out, descry), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "había de traer", f: "habí- + -a → haber (to have), imperfect, she: había, habías, había, habíamos, habíais, habían; + 'de' + traer (to wear): 'haber de' + infinitive gives what is expected or due, 'which she was supposed to wear'."}
          - {w: "son", f: "ser (to be), present, they (the medallions): soy, eres, es, somos, sois, son. The verb agrees with 'patenas', and 'ricos corales' is what they are."}
          - {w: "ricos corales", f: "ric- + -os → rico (rich), masculine plural to match 'corales' (plural of coral, -es added after a consonant)."}
          - {w: "es", f: "ser (to be), present, it (the cloth): soy, eres, es, somos, sois, son."}
        note: "Sancho's joke is that every humble country item has turned into a luxury: the medallion into coral, the coarse green wool into velvet. In 'que ... que' he repeats the 'that' of excited speech, as peasants do."
      - es: "¡Y montas que la guarnición es de tiras de lienzo, blanca!, ¡voto a mí que es de raso!;"
        literal: "And a-fine-thing that the trimming is of strips of linen, white!, I-vow by me that it-is of satin!;"
        ormsby: "and then the white linen trimming—by my oath, but it’s satin!"
        vocab:
          - {w: "montas que", d: "ironic exclamation, 'a fine thing that ...!', 'and to think that ...!'; it says the opposite of what follows"}
          - {w: "guarnición", d: "trimming, edging on a dress (also a garrison or a sword guard)"}
          - {w: "tiras", d: "strips, bands"}
          - {w: "lienzo", d: "linen cloth, plain linen"}
          - {w: "voto a mí", d: "I swear! (a comic oath: 'voto a Dios', I vow to God, turned to 'I vow to me')"}
          - {w: "raso", d: "satin"}
        diagram:
          - s: "Y montas que la guarnición es de tiras de lienzo, blanca!"
            r: "exclamation 1, ironic: and to think the trimming is strips of white linen!"
          - s: "voto a mí que es de raso!"
            r: "exclamation 2: I swear it is satin!"
        forms:
          - {w: "es", f: "ser (to be), present, it (the trimming): soy, eres, es, somos, sois, son. 'ser de' + material = to be made of."}
          - {w: "blanca", f: "blanc- + -a → blanco (white), feminine to match 'guarnición', tacked on after the comma as an afterthought."}
          - {w: "voto", f: "vot- + -o → votar (to vow, swear), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
        note: "'Montas que' works like Sancho's 'pardiez': mock outrage that pretends to say something modest, 'plain linen of course', and then reveals the satin."
      - es: "pues, ¡tomadme las manos, adornadas con sortijas de azabache!:"
        literal: "then, take-for-me the hands, adorned with rings of jet!:"
        ormsby: "Look at her hands—jet rings on them!"
        vocab:
          - {w: "pues", d: "then, and then, well (moving on in the list)"}
          - {w: "tomadme", d: "'just take', 'look at, for example' (ironic): 'me' is the speaker's emotional involvement, not an object"}
          - {w: "sortija", d: "finger ring"}
          - {w: "azabache", d: "jet, the black stone used for cheap rings and charms (against the evil eye)"}
        diagram:
          - s: "tomadme las manos"
            r: "main verb: just look at her hands (ironic command to the listeners)"
            under:
              - {s: "pues", r: "linking: then, next"}
              - {s: "adornadas con sortijas de azabache", r: "describes 'manos': adorned with jet rings (so you would think)"}
        forms:
          - {w: "tomadme", f: "tom- + -ad + me → tomar (to take), imperative, you (vosotros, the listeners), with 'me' stuck on the end: 'take for me', i.e. 'just look at'. The vosotros imperative swaps the -r of the infinitive for -d: tomad, comed, vivid. A command always carries its pronouns on the end; this 'me' is the 'ethical dative', the speaker's own interest in the matter."}
          - {w: "adornadas", f: "adorn- + -adas → adornar (to adorn), participle, feminine plural to match 'manos'."}
        note: "More mock modesty: jet was the cheap black stone of peasant rings, and the next unit reveals that the rings are gold and pearl."
      - es: "no medre yo si no son anillos de oro, y muy de oro, y empedrados con pelras blancas como una cuajada, que cada una debe de valer un ojo de la cara."
        literal: "not may-I-prosper I if not they-are rings of gold, and very of gold, and paved with pearls white as a curd, for each one must be-worth an eye of the face."
        ormsby: "May I never have luck if they’re not gold rings, and real gold, and set with pearls as white as a curdled milk, and every one of them worth an eye of one’s head!"
        vocab:
          - {w: "no medre yo si", d: "may I never prosper if ..., a common oath; 'medrar' = to prosper, get on"}
          - {w: "anillo", d: "ring"}
          - {w: "muy de oro", d: "very much of gold, solid gold, real gold"}
          - {w: "empedrado", d: "set (with stones), literally 'paved'"}
          - {w: "pelras", d: "Sancho's rustic metathesis of 'perlas', pearls"}
          - {w: "cuajada", d: "curd, junket: a homely comparison for the whiteness of pearls"}
          - {w: "deber de", d: "must (probability): 'debe de valer' = it must be worth"}
          - {w: "valer un ojo de la cara", d: "to cost an eye of the face, cost a fortune (the modern idiom is 'costar un ojo de la cara')"}
        diagram:
          - s: "no medre yo"
            r: "main verb: may I not prosper"
            under:
              - s: "si no son anillos de oro"
                r: "condition: if they are not gold rings"
                under:
                  - {s: "y muy de oro", r: "and real gold"}
                  - s: "y empedrados con pelras blancas como una cuajada"
                    r: "describes 'anillos': and set with pearls as white as curd"
                    under:
                      - {s: "que cada una debe de valer un ojo de la cara", r: "comment on 'pelras': for each one must be worth a fortune"}
        forms:
          - {w: "medre", f: "medr- + -e → medrar (to prosper), present subjunctive, I: 'may I (not) prosper', a wish. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "son", f: "ser (to be), present, they (the rings): soy, eres, es, somos, sois, son."}
          - {w: "empedrados", f: "empedr- + -ados → empedrar (to pave, set with stones), participle, masculine plural to match 'anillos'."}
          - {w: "blancas", f: "blanc- + -as → blanco (white), feminine plural to match 'pelras'."}
          - {w: "cada una", f: "'each one', feminine to match 'pelras'; 'cada' never changes."}
          - {w: "debe de valer", f: "deb- + -e → deber (must), present, it (each pearl). The present of -er verbs: -o, -es, -e, -emos, -éis, -en. 'deber de' + infinitive = must (a guess): 'must be worth'; valer (to be worth) is the infinitive."}
      - es: "¡Oh hideputa, y qué cabellos; que, si no son postizos, no los he visto mas luengos ni más rubios en toda mi vida!"
        literal: "Oh son-of-a-whore, and what hairs; for, if not they-are false, not them I-have seen more long nor more fair in all my life!"
        ormsby: "Whoreson baggage, what hair she has! if it’s not a wig, I never saw longer or fairer all the days of my life."
        vocab:
          - {w: "hideputa", d: "= hijo de puta, son of a whore; in rustic speech an exclamation of admiration, like 'the hussy!'"}
          - {w: "cabellos", d: "hair, locks (plural for the head of hair)"}
          - {w: "postizo", d: "false, artificial; 'cabellos postizos' = a wig, false hair"}
          - {w: "mas", d: "= más, more (the accent is missing in the old text)"}
          - {w: "luengo", d: "= largo, long (archaic)"}
          - {w: "rubio", d: "fair, blond, golden (the ideal colour of a beauty's hair in poetry)"}
        diagram:
          - {s: "Oh hideputa, y qué cabellos", r: "exclamation: oh the hussy, what hair!"}
          - s: "no los he visto mas luengos ni más rubios"
            r: "main verb: I have not seen it longer or fairer"
            under:
              - {s: "que", r: "linking: for"}
              - {s: "si no son postizos", r: "condition: if it is not false hair"}
              - {s: "en toda mi vida", r: "when: in all my life"}
        forms:
          - {w: "son", f: "ser (to be), present, they (the hairs): soy, eres, es, somos, sois, son."}
          - {w: "postizos", f: "postiz- + -os → postizo (false), masculine plural to match 'cabellos'."}
          - {w: "los he visto", f: "h- + -e → haber (to have), present, I: he, has, ha, hemos, habéis, han; + visto, irregular participle of ver (to see): the perfect, 'I have seen'. 'los' = them (the hairs), placed before the whole verb group."}
          - {w: "luengos, rubios", f: "lueng- + -os → luengo (long) and rubi- + -os → rubio (fair), masculine plural to match 'los' (the hairs)."}
        note: "'Hideputa' is the same oath as English 'son of a bitch', but in Sancho's mouth it expresses delighted amazement; Ormsby softens it to 'whoreson baggage'. Golden hair was the first mark of beauty in the poetry Don Quijote admires."
      - es: "¡No, sino ponedla tacha en el brío y en el talle, y no la comparéis a una palma que se mueve cargada de racimos de dátiles, que lo mesmo parecen los dijes que trae pendientes de los cabellos y de la garganta!"
        literal: "No, but put-on-her fault in the spirit and in the figure, and not her compare to a palm-tree that itself moves loaded with clusters of dates, for the same seem the trinkets that she-wears hanging from the hairs and from the throat!"
        ormsby: "See how bravely she bears herself—and her shape! Wouldn’t you say she was like a walking palm tree loaded with clusters of dates? for the trinkets she has hanging from her hair and neck look just like them."
        vocab:
          - {w: "¡No, sino ...!", d: "ironic challenge, 'Oh no, go on and ...!', i.e. just try to (find fault)"}
          - {w: "poner tacha en", d: "to find fault with, to criticize; 'tacha' = flaw, blemish"}
          - {w: "brío", d: "spirit, verve, liveliness of bearing"}
          - {w: "talle", d: "figure, shape, waist"}
          - {w: "palma", d: "palm tree (also the palm of the hand)"}
          - {w: "racimo", d: "cluster, bunch (of grapes, dates)"}
          - {w: "dátil", d: "date (the fruit)"}
          - {w: "lo mesmo", d: "= lo mismo, the same thing (old form 'mesmo')"}
          - {w: "dije", d: "trinket, small jewel or charm worn hanging from a chain"}
          - {w: "pendiente", d: "hanging (adjective here; as a noun 'pendiente' is an earring)"}
          - {w: "garganta", d: "throat, neck"}
        diagram:
          - s: "ponedla tacha en el brío y en el talle"
            r: "main verb 1, ironic: go on, find fault with her spirit and figure"
            under:
              - {s: "No, sino", r: "linking: oh no, but rather"}
          - s: "y no la comparéis a una palma"
            r: "main verb 2: and do not compare her to a palm tree"
            under:
              - {s: "que se mueve cargada de racimos de dátiles", r: "describes 'palma': that moves loaded with clusters of dates"}
              - s: "que lo mesmo parecen los dijes"
                r: "why: for the trinkets look just like that"
                under:
                  - {s: "que trae pendientes de los cabellos y de la garganta", r: "describes 'dijes': that she wears hanging from her hair and throat"}
        forms:
          - {w: "ponedla", f: "pon- + -ed + la → poner (to put), imperative, you (vosotros), with 'la' (on her) stuck on the end. The vosotros imperative swaps the -r of the infinitive for -d: poned, tomad, vivid. 'la' is used here for 'to her' (laísmo: 'la' instead of 'le' for a feminine indirect object), common in Castilian speech of the time."}
          - {w: "no la comparéis", f: "compar- + -éis → comparar (to compare), present subjunctive, you (vosotros): a negative command uses the subjunctive, 'do not compare her'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. The pronoun 'la' goes before the verb in a negative command."}
          - {w: "se mueve", f: "muev- + -e → moverse (to move), present, it (the palm), with 'se'. The stem o becomes ue when stressed: muevo, mueves, mueve, movemos, movéis, mueven."}
