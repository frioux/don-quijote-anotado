  - sentences:
      - es: "— ¡No \"milagro, milagro\", sino industria, industria!"
        literal: "— Not \"miracle, miracle\", but contrivance, contrivance!"
        ormsby: "“No miracle, no miracle; only a trick, a trick!”"
        vocab:
          - {w: "no ... sino", d: "not ... but (rather)"}
          - {w: "industria", d: "a false friend: ingenuity, contrivance, a clever trick (not 'industry' in the modern sense)"}
        diagram:
          - s: "¡No \"milagro, milagro\""
            r: "exclamation, part 1: not 'miracle, miracle'"
            under:
              - {s: "sino industria, industria!", r: "part 2: but contrivance, contrivance"}
        forms:
          - {w: "No \"milagro, milagro\", sino industria", f: "'no ... sino' sets a corrected word against the wrong one: 'not X but Y'. Basilio quotes the crowd's cry and repeats his own word twice to match it."}
        note: "'Industria' in Cervantes' Spanish means ingenuity or a stratagem. Basilio sets the word against the crowd's 'milagro': what looked like heaven's work was his own cunning, prepared in advance."
  - sentences:
      - es: "El cura, desatentado y atónito, acudió con ambas manos a tentar la herida, y halló que la cuchilla había pasado, no por la carne y costillas de Basilio, sino por un cañón hueco de hierro que, lleno de sangre, en aquel lugar bien acomodado tenía;"
        literal: "The priest, bewildered and astonished, hastened with both hands to feel the wound, and found that the blade had passed, not through the flesh and ribs of Basilio, but through a tube hollow of iron which, full of blood, in that place well fitted he-had;"
        ormsby: "The priest, perplexed and amazed, made haste to examine the wound with both hands, and found that the blade had passed, not through Basilio’s flesh and ribs, but through a hollow iron tube full of blood, which he had adroitly fixed at the place,"
        vocab:
          - {w: "desatentado", d: "bewildered, out of his wits, flustered"}
          - {w: "atónito", d: "astonished, thunderstruck"}
          - {w: "acudir", d: "to hasten, rush (to do something), come running"}
          - {w: "ambos", d: "both"}
          - {w: "tentar", d: "to feel, probe, touch (not 'to tempt' here)"}
          - {w: "cuchilla", d: "blade"}
          - {w: "costillas", d: "ribs"}
          - {w: "cañón", d: "tube, pipe (not 'cannon' here)"}
          - {w: "hueco", d: "hollow"}
          - {w: "acomodado", d: "fitted, placed, arranged"}
        diagram:
          - s: "El cura"
            r: "subject of both main verbs: the priest"
            under:
              - {s: "desatentado y atónito", r: "describes 'cura': bewildered and astonished"}
              - s: "acudió con ambas manos"
                r: "main verb 1: hurried with both hands"
                under:
                  - {s: "a tentar la herida", r: "purpose: to feel the wound"}
              - s: "y halló"
                r: "main verb 2: and found"
                under:
                  - s: "que la cuchilla había pasado"
                    r: "what he found: that the blade had passed"
                    under:
                      - {s: "no por la carne y costillas de Basilio", r: "not where: not through Basilio's flesh and ribs"}
                      - s: "sino por un cañón hueco de hierro"
                        r: "where: but through a hollow iron tube"
                        under:
                          - {s: "que, lleno de sangre, en aquel lugar bien acomodado tenía", r: "describes 'cañón': which, full of blood, he had well fitted at that spot"}
        forms:
          - {w: "desatentado", f: "participle of desatentar (to bewilder), masculine to match 'cura'."}
          - {w: "acudió", f: "acud- + -ió → acudir (to hasten), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "ambas", f: "amb- + -as → ambos (both), feminine plural to match 'manos'."}
          - {w: "halló", f: "hall- + -ó → hallar (to find), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "había pasado", f: "habí- + -a → haber (to have), imperfect, it: había, habías, había, habíamos, habíais, habían; + pasado, participle of pasar (to pass): the pluperfect, 'had passed'."}
          - {w: "lleno, acomodado", f: "llen- + -o → lleno (full) and acomodado, participle of acomodar (to fit), both masculine to match 'cañón'. 'tenía ... acomodado' = he had [it] fitted, tener (to have) + participle stressing the result."}
          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, he (Basilio). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían. The verb is held back to the very end of the clause."}
      - es: "preparada la sangre, según después se supo, de modo que no se helase."
        literal: "prepared the blood, according-as afterwards itself was-known, in such way that not itself it-should-congeal."
        ormsby: "the blood, as was afterwards ascertained, having been so prepared as not to congeal."
        vocab:
          - {w: "según después se supo", d: "as was learned afterwards"}
          - {w: "de modo que", d: "so that, in such a way that (here of purpose, with the subjunctive)"}
          - {w: "helarse", d: "to freeze; here to congeal, clot"}
        diagram:
          - s: "preparada la sangre"
            r: "absolute participle, hanging on the previous unit: the blood [having been] prepared"
            under:
              - {s: "según después se supo", r: "aside: as was learned afterwards"}
              - {s: "de modo que no se helase", r: "purpose: so that it would not clot"}
        forms:
          - {w: "preparada la sangre", f: "prepar- + -ada → preparar (to prepare), participle, feminine to match 'sangre': an absolute participle, 'the blood having been prepared', with no main verb of its own."}
          - {w: "se supo", f: "sup- + -o → saber (to know, learn), preterite, it, with 'se' making it impersonal: 'it was learned'. Irregular preterite: supe, supiste, supo, supimos, supisteis, supieron."}
          - {w: "se helase", f: "hel- + -ase → helarse (to freeze, congeal), imperfect subjunctive (-se form), it, with 'se'. The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. Subjunctive because 'de modo que' here gives a purpose."}
        note: "Blood left in the open clots within minutes, so Basilio's blood had been treated to keep it liquid; Cervantes does not say how."
