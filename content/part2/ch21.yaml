          - {w: "jironado", f: "jiron- + -ado, from jirón (strip, gore): an adjective made like a participle, 'trimmed with strips', masculine to match 'sayo'."}
        note: "Black is the colour of mourning, and the crimson flames suggest burning love: Basilio dresses as a desperate lover before he says a word."
