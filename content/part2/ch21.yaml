          - {w: "circunstantes", d: "bystanders, those standing around"}
          - {w: "admirado", d: "amazed, astonished (a false friend: not 'admired')"}
          - {w: "dellos", d: "= de ellos, of them (old contraction)"}
          - {w: "simple", d: "simple-minded, gullible"}
          - {w: "curioso", d: "here inquiring, careful to find out the truth (a shifted meaning)"}
          - {w: "en altas voces", d: "out loud, at the top of their voices"}
