          - {w: "recibiendo", f: "recib- + -iendo → recibir (to receive), gerund: 'by receiving'."}
          - {w: "a la señora Quiteria", f: "personal 'a' before a person who is the direct object."}
          - {w: "recibiera", f: "recib- + -iera → recibir (to receive), imperfect subjunctive (-ra form), he. The -ra imperfect subjunctive of -er and -ir verbs: -iera, -ieras, -iera, -iéramos, -ierais, -ieran. 'como si' (as if) always takes the imperfect subjunctive."}
        note: "Don Quijote's argument is practical: Basilio will be dead in minutes, so Quiteria will be a widow, and widows could remarry; Camacho loses nothing but the order of events."
  - sentences:
      - es: "— Aquí no ha de haber más de un sí, que no tenga otro efecto que el pronunciarle, pues el tálamo de estas bodas ha de ser la sepultura."
        literal: "— Here not has to there-be more than one yes, which not may-have other effect than the pronouncing-it, since the bridal-bed of these weddings has to be the grave."
        ormsby: "“In this case,” said he, “it will be only to say ‘yes,’ and no consequences can follow the utterance of the word, for the nuptial couch of this marriage must be the grave.”"
        vocab:
          - {w: "haber de", d: "to have to, must; 'no ha de haber' = there need be no more than"}
          - {w: "más de", d: "more than (before a number); 'más de un sí' = more than one 'yes'"}
          - {w: "efecto", d: "effect, consequence"}
          - {w: "pronunciar", d: "to pronounce, utter"}
          - {w: "tálamo", d: "bridal bed, marriage bed (literary)"}
          - {w: "sepultura", d: "grave, tomb"}
        diagram:
          - s: "Aquí no ha de haber más de un sí"
            r: "main verb 1: here there need be no more than one 'yes'"
            under:
              - {s: "que no tenga otro efecto que el pronunciarle", r: "describes 'sí': which has no effect beyond saying it"}
          - {s: "pues el tálamo de estas bodas ha de ser la sepultura", r: "why: since the bridal bed of this wedding must be the grave"}
        forms:
          - {w: "ha de haber", f: "h- + -a → haber (to have), present, it: he, has, ha, hemos, habéis, han; + de + haber (there to be): 'haber de' + infinitive = must, is to. 'there has to be'."}
          - {w: "tenga", f: "teng- + -a → tener (to have), present subjunctive, it (the 'yes'). Irregular: tenga, tengas, tenga, tengamos, tengáis, tengan. Subjunctive in a relative clause describing what kind of 'yes' is needed."}
          - {w: "el pronunciarle", f: "pronunciar (to pronounce) + le (it, the 'sí'), made into a noun with 'el': 'the saying of it'. le stands for a thing here, where modern Spanish uses 'lo'."}
          - {w: "estas", f: "est- + -as → este (this), feminine plural to match 'bodas'."}
          - {w: "ha de ser", f: "ha (haber, to have, present, it) + de + ser (to be): 'must be'. haber in the present: he, has, ha, hemos, habéis, han."}
        note: "Don Quijote's tag line plays on the wedding night: the bridal bed will be a grave, so Camacho is giving up nothing. Ormsby's 'In this case, said he' is his own addition to mark the speaker; the Spanish has only the dash."
  - sentences:
      - es: "Todo lo oía Camacho, y todo le tenía suspenso y confuso, sin saber qué hacer ni qué decir;"
        literal: "All it was-hearing Camacho, and all him was-keeping perplexed and confused, without knowing what to-do nor what to-say;"
        ormsby: "Camacho was listening to all this, perplexed and bewildered and not knowing what to say or do;"
        vocab:
          - {w: "suspenso", d: "perplexed, at a loss, held in suspense (not 'suspended')"}
          - {w: "confuso", d: "confused, bewildered"}
          - {w: "sin saber qué hacer", d: "not knowing what to do"}
        diagram:
          - s: "Todo lo oía Camacho"
            r: "main verb 1: Camacho was hearing it all"
          - s: "y todo le tenía suspenso y confuso"
            r: "main verb 2: and it all kept him at a loss and bewildered"
            under:
              - {s: "sin saber qué hacer ni qué decir", r: "how: not knowing what to do or say"}
        forms:
          - {w: "Todo lo oía", f: "o- + -ía → oír (to hear), imperfect, he: oía, oías, oía, oíamos, oíais, oían. 'Todo' is the object put first for emphasis and repeated by 'lo': 'all of it he heard'."}
          - {w: "le tenía", f: "ten- + -ía → tener (to keep), imperfect, it (all this). Same -ía imperfect: tenía, tenías, tenía, teníamos, teníais, tenían. le = 'him' (Camacho) as direct object: leísmo, using 'le' instead of 'lo' for a male person, normal in Cervantes."}
          - {w: "suspenso, confuso", f: "masculine singular to match 'le' (Camacho): 'tener' (to hold, keep) + adjective = to keep someone in that state."}
          - {w: "saber", f: "saber (to know), infinitive after 'sin' (without): 'without knowing'."}
          - {w: "qué hacer, qué decir", f: "qué (what, with an accent as a question word) + infinitives of hacer (to do) and decir (to say): 'what to do, what to say'."}
      - es: "pero las voces de los amigos de Basilio fueron tantas, pidiéndole que consintiese que Quiteria le diese la mano de esposa, porque su alma no se perdiese, partiendo desesperado desta vida, que le movieron, y aun forzaron, a decir que si Quiteria quería dársela, que él se contentaba, pues todo era dilatar por un momento el cumplimiento de sus deseos."
        literal: "but the voices of the friends of Basilio were so-many, asking-him that he-should-consent that Quiteria to-him should-give the hand of wife, so-that his soul not itself might-be-lost, departing despairing from-this life, that him they-moved, and even forced, to say that if Quiteria wanted to-give-it-to-him, that he himself was-content, since all was to-put-off for a moment the fulfilment of his desires."
        ormsby: "but so urgent were the entreaties of Basilio’s friends, imploring him to allow Quiteria to give him her hand, so that his soul, quitting this life in despair, should not be lost, that they moved, nay, forced him, to say that if Quiteria were willing to give it he was satisfied, as it was only putting off the fulfillment of his wishes for a moment."
        vocab:
          - {w: "voces", d: "cries, shouts, clamour (not just 'voices')"}
          - {w: "consentir", d: "to consent, allow"}
          - {w: "porque", d: "here 'so that' (+ subjunctive), giving a purpose, not 'because'"}
          - {w: "perderse el alma", d: "for the soul to be lost, damned"}
          - {w: "partir desta vida", d: "to depart this life, die; 'desta' = de esta"}
          - {w: "y aun", d: "and even, nay"}
          - {w: "contentarse", d: "to be satisfied, agree"}
          - {w: "dilatar", d: "to put off, delay (not 'dilate')"}
          - {w: "cumplimiento", d: "fulfilment"}
        diagram:
          - s: "pero las voces de los amigos de Basilio fueron tantas"
            r: "main verb: but the cries of Basilio's friends were so many"
            under:
              - s: "pidiéndole que consintiese"
                r: "how: begging him to consent"
                under:
                  - {s: "que Quiteria le diese la mano de esposa", r: "to what: that Quiteria give Basilio her hand as wife"}
                  - {s: "porque su alma no se perdiese", r: "purpose: so that his soul would not be lost"}
                  - {s: "partiendo desesperado desta vida", r: "how he would die: leaving this life in despair"}
              - s: "que le movieron, y aun forzaron, a decir"
                r: "result of 'tantas': that they moved, even forced, him to say"
                under:
                  - {s: "que si Quiteria quería dársela", r: "condition: that if Quiteria wished to give it to him"}
                  - {s: "que él se contentaba", r: "what he said: that he was content"}
                  - {s: "pues todo era dilatar por un momento el cumplimiento de sus deseos", r: "why: since it was all only putting off his wishes for a moment"}
        forms:
          - {w: "fueron", f: "ser (to be), preterite, they: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "tantas", f: "tant- + -as → tanto (so many), feminine plural to match 'voces'; it sets up the result clause 'que le movieron'."}
          - {w: "pidiéndole", f: "pid- + -iendo + le → pedir (to ask), gerund, with 'le' (him, Camacho) on the end, accent added: 'begging him'. The e of the stem turns to i in the gerund."}
          - {w: "consintiese", f: "consint- + -iese → consentir (to consent), imperfect subjunctive (-se form), he; the e of the stem becomes i. The -se imperfect subjunctive of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen. Subjunctive after 'pedir que' (ask that)."}
          - {w: "diese", f: "d- + -iese → dar (to give), imperfect subjunctive (-se form), she: diese, dieses, diese, diésemos, dieseis, diesen. After 'consentir que' (allow that)."}
          - {w: "se perdiese", f: "perd- + -iese → perderse (to be lost), imperfect subjunctive (-se form), it (the soul), with 'se'. Same -iese endings. Subjunctive after 'porque' meaning 'so that'."}
          - {w: "partiendo", f: "part- + -iendo → partir (to depart), gerund: 'departing'."}
          - {w: "desesperado", f: "participle of desesperar (to despair), masculine to match Basilio: 'in despair'."}
          - {w: "desta", f: "= de + esta, 'from this', feminine to match 'vida'; modern Spanish writes 'de esta'."}
          - {w: "movieron, forzaron", f: "mov- + -ieron → mover (to move) and forz- + -aron → forzar (to force), preterite, they. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron; of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "quería", f: "quer- + -ía → querer (to want), imperfect, she. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "dársela", f: "dar (to give) + se + la → 'to give it (la mano) to him'; le becomes se before la. Both pronouns hung on the infinitive, accent added."}
          - {w: "que él se contentaba", f: "content- + -aba → contentarse (to be content), imperfect, he, with 'se'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. The 'que' is repeated after the 'si' clause, as often in Cervantes."}
          - {w: "era", f: "ser (to be), imperfect, it. Irregular: era, eras, era, éramos, erais, eran."}
        note: "Camacho's consent is cool calculation: if Basilio dies at once, the widow is his within the hour. The friends' argument is religious, that a man dying in despair is damned."
  - sentences:
      - es: "Luego acudieron todos a Quiteria, y unos con ruegos, y otros con lágrimas, y otros con eficaces razones, la persuadían que diese la mano al pobre Basilio;"
