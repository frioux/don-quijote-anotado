          - {w: "acudieron", f: "acud- + -ieron → acudir (to turn to), preterite, they. The preterite of -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "eficaces", f: "eficaz (effective) + -es, plural to match 'razones'; z becomes c before e."}
          - {w: "la persuadían", f: "persuad- + -ían → persuadir (to urge), imperfect, they: 'kept urging'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían. la = 'her' (Quiteria) as the object."}
          - {w: "diese", f: "d- + -iese → dar (to give), imperfect subjunctive (-se form), she: diese, dieses, diese, diésemos, dieseis, diesen. Subjunctive after 'persuadir que' (urge to)."}
          - {w: "al", f: "a + el: 'to the' poor Basilio."}
      - es: "y ella, más dura que un mármol y más sesga que una estatua, mostraba que ni sabía ni podía, ni quería responder palabra;"
        literal: "and she, more hard than a marble and more impassive than a statue, was-showing that neither she-knew-how nor could, nor wanted to-answer word;"
        ormsby: "but she, harder than marble and more unmoved than any statue, seemed unable or unwilling to utter a word,"
        vocab:
          - {w: "mármol", d: "marble; 'un mármol' = a block of marble"}
          - {w: "sesgo", d: "impassive, unmoved, calm-faced (an old sense; now usually 'slanting, biased')"}
          - {w: "estatua", d: "statue"}
          - {w: "responder palabra", d: "to say a word in reply; 'palabra' without article in negative sentences = 'a single word'"}
        diagram:
          - s: "y ella ... mostraba"
            r: "main verb: and she showed"
            under:
              - {s: "más dura que un mármol y más sesga que una estatua", r: "describes 'ella': harder than marble, stiller than a statue"}
              - {s: "que ni sabía ni podía, ni quería responder palabra", r: "what she showed: that she neither knew how, nor was able, nor wanted to answer a word"}
        forms:
          - {w: "dura, sesga", f: "dur- + -a → duro (hard), sesg- + -a → sesgo (impassive), feminine to match 'ella'; 'más ... que' makes the comparison 'harder than'."}
          - {w: "mostraba", f: "mostr- + -aba → mostrar (to show), imperfect, she. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "sabía, podía, quería", f: "sab- + -ía → saber (to know how), pod- + -ía → poder (to be able), quer- + -ía → querer (to want), imperfect, she. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían. All three share one infinitive, 'responder' (to answer)."}
          - {w: "ni ... ni ... ni", f: "'neither ... nor ... nor'; a string of 'ni' needs no 'no' before the verb when it comes first."}
      - es: "ni la respondiera si el cura no la dijera que se determinase presto en lo que había de hacer, porque tenía Basilio ya el alma en los dientes, y no daba lugar a esperar inresolutas determinaciones."
        literal: "nor it would-she-have-answered if the priest not to-her had-said that she-should-decide quickly on that which she-had to do, because had Basilio already the soul in the teeth, and not was-giving room to wait-for irresolute decisions."
        ormsby: "nor would she have given any reply had not the priest bade her decide quickly what she meant to do, as Basilio now had his soul at his teeth, and there was no time for hesitation."
        vocab:
          - {w: "determinarse", d: "to make up one's mind, decide"}
          - {w: "presto", d: "quickly, soon (literary)"}
          - {w: "haber de", d: "to have to, be going to; 'lo que había de hacer' = what she was to do"}
          - {w: "tener el alma en los dientes", d: "to have one's soul between one's teeth, i.e. to be at death's door"}
          - {w: "dar lugar a", d: "to allow, leave time for"}
          - {w: "inresoluto", d: "= irresoluto, irresolute, undecided (old form)"}
        diagram:
          - s: "ni la respondiera"
            r: "main verb (after 'ni'): nor would she have answered it"
            under:
              - s: "si el cura no la dijera"
                r: "condition: if the priest had not told her"
                under:
                  - {s: "que se determinase presto en lo que había de hacer", r: "what he told her: to decide quickly what she was going to do"}
                  - {s: "porque tenía Basilio ya el alma en los dientes", r: "why: because Basilio already had his soul between his teeth"}
                  - {s: "y no daba lugar a esperar inresolutas determinaciones", r: "why, 2: and it left no time to wait for undecided decisions"}
        forms:
          - {w: "la respondiera", f: "respond- + -iera → responder (to answer), imperfect subjunctive (-ra form), she, used as a conditional: 'she would have answered'. The -ra imperfect subjunctive of -er and -ir verbs: -iera, -ieras, -iera, -iéramos, -ierais, -ieran. Cervantes often uses the -ra form where modern Spanish uses the conditional ('habría respondido'). la = 'it' (the 'palabra'), or the whole matter."}
          - {w: "la dijera", f: "dij- + -era → decir (to say), imperfect subjunctive (-ra form), he, in an 'if' clause: 'if he had not told'. Irregular: dijera, dijeras, dijera, dijéramos, dijerais, dijeran. la = 'to her': laísmo, using 'la' instead of 'le' for a woman as indirect object, found in Cervantes beside the standard 'le'."}
          - {w: "se determinase", f: "determin- + -ase → determinarse (to decide), imperfect subjunctive (-se form), she, with 'se'. The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. Subjunctive after 'decir que' giving an order."}
          - {w: "había de hacer", f: "habí- + -a → haber (to have), imperfect, she: había, habías, había, habíamos, habíais, habían; + de + hacer (to do): 'haber de' + infinitive = was to, was going to."}
          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, he (Basilio). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían. The subject 'Basilio' follows the verb."}
          - {w: "daba", f: "d- + -aba → dar (to give), imperfect, it (the situation). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "inresolutas", f: "inresolut- + -as → inresoluto (= irresoluto, undecided), feminine plural to match 'determinaciones'. The prefix in- before r became ir- in modern Spanish."}
        note: "'Undecided decisions' (inresolutas determinaciones) is a deliberate paradox. 'Tener el alma en los dientes' was a common way of saying a man was about to breathe his last."
  - sentences:
      - es: "Entonces la hermosa Quiteria, sin responder palabra alguna, turbada, al parecer triste y pesarosa, llegó donde Basilio estaba, ya los ojos vueltos, el aliento corto y apresurado, murmurando entre los dientes el nombre de Quiteria, dando muestras de morir como gentil, y no como cristiano."
        literal: "Then the beautiful Quiteria, without answering word any, troubled, to-the seeming sad and sorrowful, arrived where Basilio was, already the eyes turned, the breath short and hurried, murmuring between the teeth the name of Quiteria, giving signs of dying like heathen, and not like Christian."
        ormsby: "On this the fair Quiteria, to all appearance distressed, grieved, and repentant, advanced without a word to where Basilio lay, his eyes already turned in his head, his breathing short and painful, murmuring the name of Quiteria between his teeth, and apparently about to die like a heathen and not like a Christian."
        vocab:
          - {w: "palabra alguna", d: "a single word, any word at all; 'alguna' after the noun in a negative sentence = 'none at all'"}
          - {w: "turbado", d: "troubled, upset, flustered"}
          - {w: "al parecer", d: "seemingly, to all appearances"}
          - {w: "pesaroso", d: "sorrowful; also regretful, repentant"}
          - {w: "ojos vueltos", d: "eyes turned up (showing the whites), a sign of dying"}
          - {w: "apresurado", d: "hurried, quick"}
          - {w: "dar muestras de", d: "to show signs of"}
          - {w: "gentil", d: "here 'heathen, pagan, gentile' (not 'gentle'); elsewhere it can mean 'graceful, fine'"}
