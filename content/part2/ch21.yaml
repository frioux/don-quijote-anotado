  - sentences:
      - es: "Acudieron luego sus amigos a favorecerle, condolidos de su miseria y lastimosa desgracia; y, dejando don Quijote a Rocinante, acudió a favorecerle y le tomó en sus brazos, y halló que aún no había espirado."
        literal: "Ran-up at-once his friends to help-him, grieved for his misery and pitiful misfortune; and, leaving Don Quijote [to] Rocinante, he-ran-up to help-him and him took in his arms, and found that still not he-had expired."
        ormsby: "His friends at once ran to his aid, filled with grief at his misery and sad fate, and Don Quixote, dismounting from Rocinante, hastened to support him, and took him in his arms, and found he had not yet ceased to breathe."
        vocab:
          - {w: "acudir", d: "to hurry to, run up (to help)"}
          - {w: "luego", d: "at once, immediately (the old sense, not 'later')"}
          - {w: "favorecer", d: "to help, aid, come to the aid of (not only 'to favour')"}
          - {w: "condolido de", d: "grieved at, feeling pity for (from 'condolerse', to sympathize)"}
          - {w: "lastimoso", d: "pitiful, piteous"}
          - {w: "desgracia", d: "misfortune, mishap (not 'disgrace')"}
          - {w: "espirar", d: "= expirar, to expire, die (old spelling)"}
        diagram:
          - s: "Acudieron luego sus amigos"
            r: "main verb 1: his friends ran up at once"
            under:
              - {s: "a favorecerle", r: "why: to help him"}
              - {s: "condolidos de su miseria y lastimosa desgracia", r: "how: grieved at his misery and pitiful misfortune"}
          - s: "acudió a favorecerle"
            r: "main verb 2 (after 'y'): he (Don Quijote) hurried to help him"
            under:
              - {s: "dejando don Quijote a Rocinante", r: "how: Don Quijote leaving Rocinante (the subject sits inside the gerund phrase)"}
          - {s: "y le tomó en sus brazos", r: "main verb 3: and took him in his arms"}
          - s: "y halló"
            r: "main verb 4: and found"
            under:
              - {s: "que aún no había espirado", r: "what he found: that he had not yet died"}
        forms:
          - {w: "Acudieron", f: "acud- + -ieron → acudir (to run to help), preterite, they. The preterite of -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron. The verb comes before its subject 'sus amigos'."}
          - {w: "favorecerle", f: "favorecer (to help) + le (him), the pronoun hung on the infinitive after 'a'. le for a male person as direct object is leísmo, normal in Cervantes where modern Spanish prefers 'lo'."}
          - {w: "condolidos", f: "condol- + -idos → participle of condolerse (to sympathize), masculine plural to match 'amigos'."}
          - {w: "lastimosa", f: "lastimos- + -a → lastimoso (pitiful), feminine to match 'desgracia'; -oso makes adjectives from nouns (lástima, pity)."}
          - {w: "dejando", f: "dej- + -ando → dejar (to leave), gerund: 'leaving'."}
          - {w: "acudió", f: "acud- + -ió → acudir (to run to help), preterite, he. Same -ir preterite: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "tomó", f: "tom- + -ó → tomar (to take), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "halló", f: "hall- + -ó → hallar (to find), preterite, he. Same -ar preterite."}
          - {w: "había espirado", f: "habí- + -a → haber (to have), imperfect, he: había, habías, había, habíamos, habíais, habían; + espirado, participle of espirar (to expire, = expirar): the pluperfect, 'had died'."}
        note: "Don Quijote, who has been watching the wedding from Rocinante's back, gets down to hold the dying man: his first act in the crisis is a charitable one, not a knightly charge."
      - es: "Quisiéronle sacar el estoque, pero el cura, que estaba presente, fue de parecer que no se le sacasen antes de confesarle, porque el sacársele y el espirar sería todo a un tiempo."
        literal: "They-wanted-to-him to-take-out the rapier, but the priest, who was present, was of opinion that not to-him it they-should-take-out before confessing-him, because the taking-it-out-of-him and the expiring would-be all at one time."
        ormsby: "They were about to draw out the rapier, but the priest who was standing by objected to its being withdrawn before he had confessed him, as the instant of its withdrawal would be that of his death."
        vocab:
          - {w: "ser de parecer", d: "to be of the opinion, to think"}
          - {w: "confesar", d: "to hear (someone's) confession, as a priest does; also to confess"}
          - {w: "a un tiempo", d: "at the same time, at once"}
        diagram:
          - s: "Quisiéronle sacar el estoque"
            r: "main verb 1: they wanted to pull the rapier out of him"
          - s: "pero el cura ... fue de parecer"
            r: "main verb 2: but the priest was of the opinion"
            under:
              - {s: "que estaba presente", r: "describes 'cura': who was there"}
              - s: "que no se le sacasen antes de confesarle"
                r: "what he thought: that they should not pull it out before he had confessed him"
                under:
                  - {s: "porque el sacársele y el espirar sería todo a un tiempo", r: "why: because pulling it out and dying would be one and the same moment"}
        forms:
          - {w: "Quisiéronle", f: "quis- + -ieron + le → querer (to want), preterite, they, with 'le' (from him) stuck on the end; modern 'le quisieron sacar'. Irregular preterite: quise, quisiste, quiso, quisimos, quisisteis, quisieron. Cervantes hangs pronouns on a verb that opens its clause."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "fue", f: "ser (to be), preterite, he: fui, fuiste, fue, fuimos, fuisteis, fueron. In 'fue de parecer', 'he was of the opinion'."}
          - {w: "se le sacasen", f: "sac- + -asen → sacar (to take out), imperfect subjunctive (-se form), they, with 'se' (it, standing for 'lo' before 'le') and 'le' (from him). The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. Subjunctive because it reports what the priest thought should be done."}
          - {w: "confesarle", f: "confesar (to hear the confession of) + le (him), the pronoun hung on the infinitive after 'antes de'. le for a male person as direct object is leísmo, normal in Cervantes."}
          - {w: "el sacársele", f: "sacar (to take out) + se + le, made into a noun with 'el': 'the taking-it-out-of-him'. se stands for 'lo' (it) before 'le'; accent added to keep the stress on 'sa'."}
          - {w: "el espirar", f: "espirar (= expirar, to expire) made into a noun with 'el': 'the dying'."}
          - {w: "sería", f: "ser- + -ía → ser (to be), conditional, it. The conditional adds -ía endings to the whole infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
        note: "The priest's worry is theological: a man who dies by his own hand without confession dies in mortal sin, so Basilio must confess before the blade comes out and he dies."
