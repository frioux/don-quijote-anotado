        ormsby: "whence they all concluded that the affair had been planned by agreement and understanding between the pair, whereat Camacho and his supporters were so mortified that they proceeded to revenge themselves by violence, and a great number of them drawing their swords attacked Basilio, in whose protection as many more swords were in an instant unsheathed,"
        vocab:
