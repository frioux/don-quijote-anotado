          - {w: "se confesaría", f: "confesar- + -ía → confesarse (to make confession), conditional, he, with 'se': 'he would confess'. The conditional adds endings to the whole infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "daba", f: "d- + -aba → dar (to give), imperfect, she: 'if she did not give'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
