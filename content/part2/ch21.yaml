      - es: "de lo cual coligieron todos que de consentimiento y sabiduría de los dos se había trazado aquel caso, de lo que quedó Camacho y sus valedores tan corridos que remitieron su venganza a las manos, y, desenvainando muchas espadas, arremetieron a Basilio, en cuyo favor en un instante se desenvainaron casi otras tantas."
