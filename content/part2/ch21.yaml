  - sentences:
      - es: "— Si quisieses, cruel Quiteria, darme en este último y forzoso trance la mano de esposa, aún pensaría que mi temeridad tendría desculpa, pues en ella alcancé el bien de ser tuyo."
        literal: "— If you-should-wish, cruel Quiteria, to-give-me in this last and unavoidable crisis the hand of wife, still I-would-think that my rashness would-have excuse, since in it I-attained the good of being yours."
        ormsby: "“If thou wouldst consent, cruel Quiteria, to give me thy hand as my bride in this last fatal moment, I might still hope that my rashness would find pardon, as by its means I attained the bliss of being thine.”"
        vocab:
          - {w: "forzoso", d: "unavoidable, inescapable; 'forzoso trance' = the moment no one escapes, death"}
          - {w: "trance", d: "critical moment, crisis; 'el último trance' = the hour of death"}
          - {w: "dar la mano de esposa", d: "to give one's hand as wife, i.e. to marry"}
          - {w: "temeridad", d: "rashness, recklessness"}
          - {w: "desculpa", d: "= disculpa, excuse (old form)"}
          - {w: "alcanzar", d: "to attain, obtain, achieve"}
          - {w: "el bien", d: "the good, the blessing, happiness"}
        diagram:
          - s: "aún pensaría"
            r: "main verb: I would still think"
            under:
              - s: "Si quisieses"
                r: "condition: if you would be willing"
                under:
                  - {s: "cruel Quiteria", r: "addressed: cruel Quiteria"}
                  - {s: "darme en este último y forzoso trance la mano de esposa", r: "what: to give me your hand as wife at this last, inescapable moment"}
              - {s: "que mi temeridad tendría desculpa", r: "what I would think: that my rash act would have an excuse"}
              - {s: "pues en ella alcancé el bien de ser tuyo", r: "why: since by it I gained the blessing of being yours"}
        forms:
          - {w: "quisieses", f: "quis- + -ieses → querer (to want), imperfect subjunctive (-se form), you: 'if you were willing'. Built on the preterite quisieron: quisiese, quisieses, quisiese, quisiésemos, quisieseis, quisiesen. 'si' + imperfect subjunctive + conditional makes an unlikely condition."}
          - {w: "darme", f: "dar (to give) + me (to me), the pronoun hung on the infinitive that depends on 'quisieses'."}
          - {w: "este", f: "este (this), masculine singular to match 'trance'."}
          - {w: "pensaría", f: "pensar- + -ía → pensar (to think), conditional, I. The conditional adds endings to the whole infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "tendría", f: "tendr- + -ía → tener (to have), conditional, it (my rashness). Irregular stem tendr-: tendría, tendrías, tendría, tendríamos, tendríais, tendrían."}
          - {w: "ella", f: "'it', feminine because it stands for 'mi temeridad'."}
          - {w: "alcancé", f: "alcanc- + -é → alcanzar (to attain), preterite, I; z becomes c before e. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "tuyo", f: "tuy- + -o → tuyo (yours), masculine because the speaker, Basilio, is a man."}
        note: "Basilio's logic is a lover's paradox: his rash act would be excused if it won him Quiteria's hand, since the wound would then have bought him the happiness of being hers, if only for a moment."
  - sentences:
      - es: "El cura, oyendo lo cual, le dijo que atendiese a la salud del alma antes que a los gustos del cuerpo, y que pidiese muy de veras a Dios perdón de sus pecados y de su desesperada determinación."
        literal: "The priest, hearing the which, to-him said that he-should-attend to the health of-the soul before than to the pleasures of-the body, and that he-should-ask very in-earnest [of] God pardon for his sins and for his desperate resolve."
