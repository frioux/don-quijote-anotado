  - sentences:
      - es: "En oyendo don Quijote la petición del herido, en altas voces dijo que Basilio pedía una cosa muy justa y puesta en razón, y además, muy hacedera, y que el señor Camacho quedaría tan honrado recibiendo a la señora Quiteria viuda del valeroso Basilio como si la recibiera del lado de su padre:"
