          - {w: "estrella", d: "star; one's star is one's fate ('fatal estrella mía' = my fatal star, my doom)"}
          - {w: "fatal", d: "fateful, doomed; ill-starred"}
          - {w: "por cumplimiento", d: "as a mere formality, out of politeness (not 'compliment' in the English sense)"}
          - {w: "de nuevo", d: "again, anew"}
          - {w: "hacer fuerza a", d: "to force, put constraint on"}
          - {w: "entregar", d: "to hand over, deliver, surrender"}
          - {w: "legítimo", d: "lawful, legitimate"}
