      - es: "haciendo discurso Camacho que si Quiteria quería bien a Basilio doncella, también le quisiera casada, y que debía de dar gracias al cielo, más por habérsela quitado que por habérsela dado."
        literal: "making reasoning Camacho that if Quiteria loved well [to] Basilio [as a] maiden, also him she-would-love married, and that he-ought to give thanks to-the heaven, more for having-from-him-her taken-away than for having-to-him-her given."
        ormsby: "Camacho maintaining that, if Quiteria as a maiden had such a love for Basilio, she would have loved him too as a married woman, and that he ought to thank heaven more for having taken her than for having given her."
        vocab:
          - {w: "hacer discurso", d: "to reason, reflect, argue to oneself"}
          - {w: "querer bien a", d: "to love, be fond of"}
          - {w: "doncella", d: "maiden, unmarried girl; here 'as a maiden'"}
          - {w: "casada", d: "married (woman); here 'as a married woman'"}
          - {w: "deber de", d: "here 'ought to, must' (obligation; in modern Spanish 'deber de' usually means probability)"}
          - {w: "dar gracias", d: "to give thanks"}
