                under:
                  - {s: "de sus pecados y de su desesperada determinación", r: "pardon for what: for his sins and his desperate resolve"}
        forms:
          - {w: "oyendo", f: "o- + -yendo → oír (to hear), gerund: 'hearing'; the i of -iendo becomes y between vowels."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "atendiese", f: "atend- + -iese → atender (to attend to), imperfect subjunctive (-se form), he. The -se imperfect subjunctive of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen. 'decir que' + subjunctive reports an order."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
          - {w: "pidiese", f: "pid- + -iese → pedir (to ask for), imperfect subjunctive (-se form), he; the e of the stem becomes i: pidiese, pidieses, pidiese, pidiésemos, pidieseis, pidiesen. A reported order, like 'atendiese'."}
          - {w: "desesperada", f: "desesper- + -ada → participle of desesperar (to despair), feminine to match 'determinación'."}
        note: "The Church taught that suicide was a mortal sin of despair, and a suicide could be refused Christian burial. The priest's first concern is to get Basilio to confess and repent before he dies."
      - es: "A lo cual replicó Basilio que en ninguna manera se confesaría si primero Quiteria no le daba la mano de ser su esposa: que aquel contento le adobaría la voluntad y le daría aliento para confesarse."
