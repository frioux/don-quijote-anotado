        forms:
          - {w: "responder", f: "responder (to answer), infinitive after 'sin' (without)."}
          - {w: "alguna", f: "algun- + -a → alguno (some, any), feminine to match 'palabra'; placed after the noun in a negative it means 'not a single'."}
          - {w: "turbada", f: "turb- + -ada → participle of turbar (to trouble), feminine to match 'Quiteria'."}
          - {w: "pesarosa", f: "pesaros- + -a → pesaroso (sorrowful), feminine to match 'Quiteria'; -oso makes adjectives from nouns (pesar, grief)."}
          - {w: "llegó", f: "lleg- + -ó → llegar (to arrive), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "vueltos", f: "irregular participle of volver (to turn), masculine plural to match 'ojos': an absolute phrase, 'his eyes turned'."}
          - {w: "apresurado", f: "apresur- + -ado → participle of apresurar (to hurry), masculine to match 'aliento'."}
          - {w: "murmurando, dando", f: "murmur- + -ando → murmurar (to murmur) and d- + -ando → dar (to give), gerunds: 'murmuring', 'giving'."}
