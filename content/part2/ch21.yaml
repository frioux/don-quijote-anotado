  - sentences:
      - es: "Y, en esto, la blandió tan fuerte y tan diestramente, que puso pavor en todos los que no le conocían, y tan intensamente se fijó en la imaginación de Camacho el desdén de Quiteria, que se la borró de la memoria en un instante;"
        literal: "And, at this, it he-brandished so strongly and so skillfully, that he-put fear in all those who not him knew, and so intensely itself fixed in the imagination of Camacho the disdain of Quiteria, that to-him her it-erased from the memory in an instant;"
        ormsby: "and so saying he brandished it so stoutly and dexterously that he overawed all who did not know him. But so deep an impression had the rejection of Quiteria made on Camacho’s mind that it banished her at once from his thoughts;"
        vocab:
          - {w: "en esto", d: "at this, at that moment, thereupon"}
          - {w: "blandir", d: "to brandish, wave (a weapon)"}
          - {w: "diestramente", d: "skillfully, deftly (from 'diestro', right-handed, skilled)"}
          - {w: "pavor", d: "dread, terror"}
          - {w: "fijarse en", d: "to fix itself in, become fixed in"}
          - {w: "imaginación", d: "mind, thoughts (not only 'imagination')"}
          - {w: "desdén", d: "disdain, scorn; here Quiteria's rejection of him"}
          - {w: "borrar", d: "to erase, wipe out"}
        diagram:
          - s: "la blandió tan fuerte y tan diestramente"
            r: "main verb 1: he brandished it (the lance) so hard and so skillfully"
            under:
              - {s: "en esto", r: "when: at this"}
              - s: "que puso pavor en todos"
                r: "result: that he struck fear into all"
                under:
                  - {s: "los que no le conocían", r: "describes 'todos': those who did not know him"}
          - s: "y tan intensamente se fijó en la imaginación de Camacho"
            r: "main verb 2: and so deeply there fixed itself in Camacho's mind"
            under:
              - {s: "el desdén de Quiteria", r: "subject: Quiteria's disdain"}
              - {s: "que se la borró de la memoria en un instante", r: "result: that it wiped her from his memory in an instant"}
        forms:
          - {w: "la blandió", f: "bland- + -ió → blandir (to brandish), preterite, he, with 'la' (it, the lance) before it. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "diestramente", f: "diestr- + -a + -mente → diestro (skillful) made into an adverb: '-mente' is added to the feminine form. 'fuerte' serves as an adverb without -mente."}
          - {w: "puso", f: "pus- + -o → poner (to put), preterite, he. Irregular: puse, pusiste, puso, pusimos, pusisteis, pusieron."}
          - {w: "le conocían", f: "conoc- + -ían → conocer (to know), imperfect, they, with 'le' (him) as direct object: leísmo, Cervantes' use of 'le' instead of 'lo' for a male person. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "intensamente", f: "intens- + -a + -mente → intenso (intense) made into an adverb on the feminine form: 'intensely'."}
          - {w: "se fijó", f: "fij- + -ó → fijarse (to fix itself), preterite, it (the disdain). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. The subject 'el desdén' comes after the verb."}
          - {w: "se la borró", f: "borr- + -ó → borrar (to erase), preterite, it (the disdain). Same -ó preterite. 'se la' = 'from him, her': le (from him, Camacho) becomes se before la (her, Quiteria)."}
        note: "The sudden cure is Cervantes' realism with a smile: Camacho's love was wounded pride, and the insult of being tricked in public kills it on the spot. Don Quijote's lance also helps."
