                under:
                  - {s: "recibiendo a la señora Quiteria viuda del valeroso Basilio", r: "how: receiving Quiteria as the widow of brave Basilio"}
                  - {s: "como si la recibiera del lado de su padre", r: "comparison: as if he received her from her father's side"}
        forms:
