          - {w: "corridos", f: "corr- + -idos → corrido, participle of correr (to run) used as an adjective 'abashed', masculine plural to match Camacho and his men together."}
          - {w: "remitieron, arremetieron", f: "remit- + -ieron → remitir (to hand over, refer) and arremet- + -ieron → arremeter (to charge), preterite, they. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
