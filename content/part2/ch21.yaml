          - {w: "el herido", d: "the wounded man"}
          - {w: "en altas voces", d: "aloud, in a loud voice"}
          - {w: "puesto en razón", d: "reasonable, fair"}
          - {w: "hacedero", d: "feasible, easy to do"}
          - {w: "quedar honrado", d: "to come off with honour, keep one's honour"}
          - {w: "viuda", d: "widow"}
