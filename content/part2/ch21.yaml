                under:
                  - {s: "más por habérsela quitado", r: "why, 1: more for having taken her from him"}
                  - {s: "que por habérsela dado", r: "why, 2, comparison: than for having given her to him"}
        forms:
          - {w: "haciendo", f: "hac- + -iendo → hacer (to make), gerund: 'making (the reflection)'. -er and -ir verbs make the gerund with -iendo."}
          - {w: "quería", f: "quer- + -ía → querer (to want, to love), imperfect, she. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "le quisiera", f: "quis- + -iera → querer (to love), imperfect subjunctive (-ra form), she, used as a conditional: 'she would love him'. The -ra form built on the preterite quisieron: quisiera, quisieras, quisiera, quisiéramos, quisierais, quisieran. In Cervantes the -ra form often stands where modern Spanish uses the conditional 'querría'. 'le' (him) as direct object for a male person: leísmo."}
          - {w: "doncella, casada", f: "nouns used like adjectives with no 'como': 'as a maiden', 'as a married woman'; casada is the participle of casar (to marry), feminine to match Quiteria."}
          - {w: "debía", f: "deb- + -ía → deber (must, ought), imperfect, he. Same -ía imperfect: debía, debías, debía, debíamos, debíais, debían."}
          - {w: "al cielo", f: "al = a + el: 'to heaven'."}
          - {w: "habérsela quitado", f: "haber (to have) + se + la, then quitado, participle of quitar (to take away): 'having taken her from him'. Pronouns hang on the end of an infinitive; 'se' stands for 'le' (from him) before 'la' (her); an accent is added to keep the stress on 'ha-'."}
          - {w: "habérsela dado", f: "haber (to have) + se + la, then dado, participle of dar (to give): 'having given her to him'. Again 'se' is 'le' (to him) changed before 'la'."}
        note: "Camacho's sour reasoning: a bride who loved another man before the wedding would love him after it too, so heaven did him a favor. It is the comic, practical opposite of Don Quijote's high doctrine of love."
  - sentences:
      - es: "Consolado, pues, y pacífico Camacho y los de su mesnada, todos los de la de Basilio se sosegaron, y el rico Camacho, por mostrar que no sentía la burla, ni la estimaba en nada, quiso que las fiestas pasasen adelante como si realmente se desposara;"
        literal: "Consoled, then, and peaceful Camacho and those of his band, all those of the [band] of Basilio themselves calmed, and the rich Camacho, to show that not he-felt the trick, nor it he-valued in anything, wanted that the festivities might-pass forward as if really himself he-were-marrying;"
        ormsby: "Camacho and those of his following, therefore, being consoled and pacified, those on Basilio’s side were appeased; and the rich Camacho, to show that he felt no resentment for the trick, and did not care about it, desired the festival to go on just as if he were married in reality."
        vocab:
          - {w: "mesnada", d: "a lord's armed following, retinue (an old word from the epic and the chronicles); here comically used of Camacho's villagers"}
          - {w: "los de la de Basilio", d: "those of Basilio's (band): the second 'la' stands for 'mesnada'"}
          - {w: "sosegarse", d: "to calm down, settle down"}
          - {w: "sentir", d: "here 'to resent, take to heart', not just 'to feel'"}
          - {w: "burla", d: "trick, hoax, practical joke"}
          - {w: "no estimar en nada", d: "to think nothing of, not care at all about"}
          - {w: "pasar adelante", d: "to go on, continue"}
          - {w: "desposarse", d: "to get married, be betrothed"}
        diagram:
          - s: "Consolado, pues, y pacífico Camacho y los de su mesnada"
            r: "when: Camacho and his following being consoled and at peace (absolute construction)"
          - s: "todos los de la de Basilio se sosegaron"
            r: "main verb 1: all those on Basilio's side calmed down"
          - s: "y el rico Camacho"
            r: "main clause 2, subject: and rich Camacho"
            under:
              - s: "por mostrar"
                r: "why: to show"
                under:
                  - {s: "que no sentía la burla, ni la estimaba en nada", r: "what he showed: that he did not resent the trick or care about it at all"}
              - s: "quiso"
                r: "verb: wanted"
                under:
                  - {s: "que las fiestas pasasen adelante", r: "what he wanted: that the festivities go on"}
                  - {s: "como si realmente se desposara", r: "how: as if he were really getting married"}
        forms:
          - {w: "Consolado", f: "consol- + -ado → consolar (to console), participle, with 'pacífico' (peaceful), masculine singular to match Camacho, the first of the subjects: an absolute participle opening the sentence, 'Camacho being consoled'."}
          - {w: "se sosegaron", f: "soseg- + -aron → sosegarse (to calm down), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "mostrar", f: "infinitive of mostrar (to show) after 'por' (in order to)."}
          - {w: "sentía, estimaba", f: "sent- + -ía → sentir (to feel, resent), imperfect, he: the imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían. estim- + -aba → estimar (to value), imperfect, he: the imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "la burla, la estimaba", f: "the second 'la' (it) stands for 'la burla', the trick."}
          - {w: "quiso", f: "quis- + -o → querer (to want), preterite, he. Irregular: quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "pasasen", f: "pas- + -asen → pasar (to pass, go), imperfect subjunctive (-se form), they: 'that they go on'. The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. Subjunctive after 'quiso que' (he wanted that)."}
          - {w: "realmente", f: "real + -mente → real (real) made into an adverb: 'really'. Adjectives with one form for both genders just add -mente."}
          - {w: "se desposara", f: "despos- + -ara → desposarse (to marry), imperfect subjunctive (-ra form), he: 'as if he were marrying'. The -ra imperfect subjunctive of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran. 'como si' always takes the imperfect subjunctive."}
        note: "Camacho saves face like a rich man: the feast is already cooked and paid for, so he holds it anyway, as if nothing had happened. The word 'mesnada', a feudal lord's war band, turns the village quarrel into a mock battle between two armies."
