                  - {s: "me la entregas y me la das como a tu legítimo esposo", r: "what you say: that you hand it to me and give it to me as to your lawful husband"}
        forms:
          - {w: "suplico", f: "suplic- + -o → suplicar (to beg), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "mía", f: "mí- + -a → mío (mine), feminine to match 'estrella'; placed after the noun in an address: 'star of mine'."}
          - {w: "pides", f: "pid- + -es → pedir (to ask for), present, you; e becomes i when stressed: pido, pides, pide, pedimos, pedís, piden."}
          - {w: "quieres darme", f: "quier- + -es → querer (to want), present, you: quiero, quieres, quiere, queremos, queréis, quieren; + darme, dar (to give) + me (to me), the pronoun hung on the infinitive."}
          - {w: "sea", f: "ser (to be), present subjunctive, it: sea, seas, sea, seamos, seáis, sean. Subjunctive after 'suplicar que' (beg that)."}
          - {w: "engañarme", f: "engañar (to deceive) + me (me), the pronoun hung on the infinitive after 'para'."}
          - {w: "confieses, digas", f: "confies- + -es → confesar (to confess), present subjunctive, you (e becomes ie when stressed): confiese, confieses, confiese, confesemos, confeséis, confiesen; dig- + -as → decir (to say), present subjunctive, you: diga, digas, diga, digamos, digáis, digan. Subjunctive after 'suplicar que'."}
          - {w: "me la entregas, me la das", f: "entreg- + -as → entregar (to hand over), present, you (the present of -ar verbs: -o, -as, -a, -amos, -áis, -an), and das, dar (to give), present, you (doy, das, da, damos, dais, dan). me = to me, la = it (la mano): the indirect pronoun comes first."}
      - es: "pues no es razón que en un trance como éste me engañes, ni uses de fingimientos con quien tantas verdades ha tratado contigo."
        literal: "for not it-is reason that in a crisis like this-one me you-deceive, nor you-use of pretences with [one] who so-many truths has dealt with-you."
        ormsby: "for it is not meet that thou shouldst trifle with me at such a moment as this, or have recourse to falsehoods with one who has dealt so truly by thee.”"
        vocab:
