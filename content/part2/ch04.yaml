  - sentences:
      - es: "— A que —respondió Sansón—, en hallando que halle la historia, que él va buscando con extraordinarias diligencias, la dará luego a la estampa, llevado más del interés que de darla se le sigue que de otra alabanza alguna."
        literal: "— To [the fact] that —answered Sansón—, on finding that he-may-find the history, which he goes searching with extraordinary diligences, it he-will-give at-once to the press, carried more by-the profit that from giving-it itself to-him follows than by other praise any."
        ormsby: "“What?” replied Samson; “why, as soon as he has found the history which he is now searching for with extraordinary diligence, he will at once give it to the press, moved more by the profit that may accrue to him from doing so than by any thought of praise.”"
        vocab:
          - {w: "en hallando que halle", d: "as soon as he finds; 'en' + gerund = as soon as, and the subjunctive 'que halle' repeats the verb for emphasis"}
          - {w: "ir buscando", d: "to be (busily) searching, go about looking for"}
          - {w: "diligencias", d: "efforts, pains, measures taken (plural)"}
          - {w: "luego", d: "at once, immediately (the old sense), not 'later'"}
          - {w: "dar a la estampa", d: "to send to the press, publish"}
          - {w: "llevado de", d: "moved by, driven by"}
          - {w: "interés", d: "profit, gain (money), not 'interest' in the sense of curiosity"}
          - {w: "seguírsele (algo) a alguien", d: "to come to someone, accrue to him as a result"}
          - {w: "alguna (after a noun)", d: "after the noun in a negative comparison it means 'any at all': 'otra alabanza alguna' = any other praise"}
        diagram:
          - s: "A que"
            r: "answer: to this (what he counts on is) that"
            under:
              - {s: "respondió Sansón", r: "speech tag: answered Sansón"}
          - s: "la dará luego a la estampa"
            r: "main verb: he will at once send it to the press"
            under:
              - s: "en hallando que halle la historia"
                r: "when: as soon as he finds the history"
                under:
                  - {s: "que él va buscando con extraordinarias diligencias", r: "describes 'historia': which he is searching for with great pains"}
              - s: "llevado más del interés"
                r: "how: moved more by the profit"
                under:
                  - {s: "que de darla se le sigue", r: "describes 'interés': which will come to him from publishing it"}
                  - {s: "que de otra alabanza alguna", r: "compared with: than by any other praise"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "hallando", f: "hall- + -ando → gerund of hallar (to find); 'en' + gerund = 'as soon as, on (doing)'."}
          - {w: "halle", f: "hall- + -e → hallar (to find), present subjunctive, he. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. The subjunctive because the finding has not happened yet."}
          - {w: "va buscando", f: "v- + -a → ir (to go), present, he, + buscando, gerund of buscar (to look for): 'he is going about searching'. ir in the present: voy, vas, va, vamos, vais, van."}
          - {w: "extraordinarias diligencias", f: "extraordinari- + -as → extraordinario (extraordinary), feminine plural to match 'diligencias'."}
          - {w: "dará", f: "dar- + -á → dar (to give), future, he. The future adds endings to the whole infinitive: daré, darás, dará, daremos, daréis, darán."}
          - {w: "llevado", f: "llev- + -ado → llevar (to carry), participle used as an adjective, masculine to match the author: 'carried, moved'."}
          - {w: "del", f: "de + el: 'llevado de', moved by; the preposition 'de' gives the cause."}
          - {w: "darla", f: "dar (to give) + la (it, the history), the pronoun hung on the infinitive after 'de'."}
          - {w: "se le sigue", f: "sig- + -ue → seguir (to follow), present, it, with 'se' (itself) and 'le' (to him): 'follows to him, comes to him'. The stem e becomes i when stressed: sigo, sigues, sigue, seguimos, seguís, siguen."}
          - {w: "alguna", f: "algun- + -a → alguno (some), feminine to match 'alabanza'; placed after the noun it means 'any at all'."}
        note: "Carrasco makes Cide Hamete into a working author who writes for money, a motive writers of the age seldom admitted. Cervantes himself, always short of money, sold his books to publishers."
