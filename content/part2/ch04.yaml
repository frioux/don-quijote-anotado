summary: |
  Back from his dinner, Sancho answers the bachelor's two objections. His ass, he says, was stolen the night he and his master hid in the Sierra Morena after freeing the galley slaves: as he slept in the saddle, the thief propped the packsaddle up on four stakes and led the ass out from under him. Don Quijote finds nothing strange in this, since the same trick was played on Sacripante at the siege of Albraca by the thief Brunelo. Sancho tells how he woke, fell flat when the stakes gave way, wept for his ass, and days later, travelling with the 'Princess Micomicona', saw it ridden by Ginés de Pasamonte dressed as a gypsy. Carrasco replies that the slip lies elsewhere: the book has Sancho riding the ass before it turns up again. Sancho blames the historian or the printer.

  As for the hundred gold crowns, Sancho spent them on himself, his wife and children, and they are what made his wife put up with his wanderings. Nobody has any business asking whether he took or spent: at even four maravedís a beating, another hundred crowns would not pay for half the blows he has taken. Let each man look into his own heart; each is as God made him, and often worse. Carrasco promises to have the author add this to any new edition. Don Quijote asks whether a second part is promised; Carrasco says the author has not yet found it, that some say second parts are never good and others that enough has been written, while the jollier readers cry for more 'quijotadas'. The author, he adds, means to print it as soon as he finds it, more for profit than for praise. Sancho warns that books done in a hurry are never done well, and promises enough adventures for a hundred second parts, if only his master would take the road again.

  At that moment Rocinante neighs. Don Quijote takes it for a happy omen and resolves to sally out in three or four days. Carrasco advises him to make for Zaragoza, where jousts are soon to be held for the feast of St George, and to take more care of a life that belongs to all who need his help. Sancho seizes on this: his master charges a hundred armed men like a greedy boy at half a dozen melons, and there is a time to attack and a time to retreat. He will go only on condition that he does no fighting and looks after his master's comfort; he wants no fame for courage, only to be the best squire that ever served a knight. If he is given an island he will take it gladly, and if not, he was born Sancho and means to die Sancho, and bread may taste better ungoverned than governing; still, he is not such a fool as to refuse good fortune when it comes.

  Carrasco tells him he speaks like a professor and that his master will give him a kingdom, not just an island. Sancho says he has felt his own pulse and is fit to rule; when Carrasco warns that office changes manners, he answers that his soul carries four fingers of old Christian fat and he could never be ungrateful. Don Quijote then asks the bachelor, if he is a poet, to write a farewell to Dulcinea as an acrostic of her name. Carrasco, who is not among Spain's 'three and a half' famous poets, notes that the name has seventeen letters, which fit neither four quatrains nor four five-line stanzas, but promises to squeeze it in. They agree to leave in eight days. Don Quijote makes Carrasco promise to keep the plan secret from the priest, the barber, the niece and the housekeeper; Carrasco takes his leave, and Sancho goes home to get ready.
context: |
  Patching Part I. The first half of this chapter is Cervantes answering, through Sancho, two real slips in his own book. In the first edition of Part I (1605), Sancho's ass simply vanishes in the Sierra Morena and later reappears without explanation; Ormsby notes that passages added to the second edition tried to repair this, and Sancho's story here, of the thief who propped up the packsaddle on stakes, is the explanation Cervantes now gives. The joke is that Sancho blames 'the historian' or 'the printer', both of whom are Cervantes. The trick itself comes from the Italian romances of Roland: in Boiardo's 'Orlando innamorato' and again in Ariosto's 'Orlando furioso', the thief Brunello steals the horse of King Sacripante from under him at the siege of Albracca, and Ormsby, quoting both poems, thinks Cervantes originally meant Part I to contain a burlesque of the scene with Ginés de Pasamonte as Brunello. Ginés, the galley slave whom Don Quijote freed in Part I chapter 22, was last seen riding off on the ass in gypsy dress, which Sancho recalls.

  Second parts and money. Carrasco's report on the 'second part' is a joke with a real edge: the proverb 'nunca segundas partes fueron buenas' was current, and the Arabic historian Cide Hamete is said to be hunting for the rest of the manuscript 'more for profit than for praise'. Sancho's reply mixes craft images: 'harbar' is to botch in a hurry, as a tailor does on the eve of a feast; 'ripio' is, Ormsby explains, the rubble and mortar used to fill the gaps between large stones; 'ténganos el pie al herrar' comes from the smithy, where a horse whose hoof is held up for shoeing shows which foot it limps on. The hundred crowns are the gold Sancho kept from the valise found in the Sierra Morena; his reckoning of a beating at four maravedís, the copper coins of small change, against a crown of gold is his own comic accounting.

  The new sally. Rocinante's neigh is taken as an augury, in the manner of the romances. Zaragoza, capital of the kingdom of Aragon, is chosen for the jousts held on the feast of St George (23 April); Ormsby says they commemorated the battle of Alcoraz, where in 1096 Pedro I of Aragon defeated the Moors with the saint's help. 'Santiago, y cierra, España' was the old Spanish battle-cry, invoking St James, patron of Spain. Sancho's 'the mean of valour lies between cowardice and rashness' is Aristotle's doctrine of the mean from the 'Ethics', which Sancho thinks he heard from his master; his 'cuatro dedos de enjundia de cristianos viejos' ('four fingers of old-Christian fat') turns the obsession with purity of blood into a joke about pork, which neither Jews nor Muslims would eat, and 'nacer en las malvas' ('to be born among the mallows') means to be of low birth. The acrostic was, as Ormsby says, one of the poetic frivolities of the day; Part I itself opens with comic verses by fictional poets. The 'three and a half' famous poets of Spain is, Ormsby thinks, a sly dig at the whole swarm of poets and their cliques rather than a list of real names. Carrasco's arithmetic is right: 'Dulcinea del Toboso' has seventeen letters, one too many for four four-line 'castellanas' and three too few for four five-line stanzas, though his labels for the stanza forms are loose, as Ormsby's note on the décima and the redondilla suggests.

  Sancho's voice. Sancho is the hero of this chapter, and his speech is a torrent of proverbs: 'cada uno es como Dios le hizo, y aun peor muchas veces', 'cada uno meta la mano en su pecho', 'los oficios mudan las costumbres' (from Carrasco), 'cuando te dieren la vaquilla, corre con la soguilla', 'cuando viene el bien, mételo en tu casa', 'Sancho nací, y Sancho pienso morir'. Ormsby numbers several of them in his list of the proverbs in the book. Other homely idioms: 'echar en saco roto' (to waste, forget), 'bailar el agua delante' (to dance attendance on someone), 'hacer las muelas' (to knock one's teeth out), 'tomarse el pulso' (to sound oneself out), 'en hoto de' (trusting in), 'no ... sino' (only). His mispronunciation 'presona' for persona and his 'truje' for traje (I brought) mark him as a villager.

  Reading Cervantes' Spanish. The old forms of this chapter: mesmo (mismo), presona (persona), truje (traje), trayo (traigo), deso (de eso), estremos (extremos), escusado (excusado), perfeción (perfección), solenísimas (solemnísimas), apriesa (aprisa), conociésedes (conocieseis). Pronouns hang on a clause-opening verb: acudiéronme, deshiciéronse, Alabóle, advirtióle. The future subjunctive marks open futures (imprimiere, fuere, tocare, quisiere, diere, dieren), and the -ra form stands for the conditional (sobrara, echara, diera). Carrasco speaks to Sancho with vos (habéis, confiad, Mirad, viéndoos), Sancho calls Don Quijote 'su merced'. 'Haber de' with an infinitive expresses obligation or future ('ha de ser', 'he de estar', 'habíamos de estar'), and 'tener de' does the same in Sancho's mouth ('tengo de poner'). Watch the false friends: razonamiento (conversation), leyenda (the reading, the story), interés (profit), discreto (sensible), jornada (journey), regalo (comfort), and suceso (event, adventure, not 'success').
