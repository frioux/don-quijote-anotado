          - {w: "iba", f: "ib- + -a → ir (to go), imperfect, he. Irregular: iba, ibas, iba, íbamos, ibais, iban."}
          - {w: "mesmo", f: "old form of mismo (same), masculine to match 'rucio'."}
        note: "In the first edition of Part I Sancho is riding his ass in chapters 25 to 30, before he gets it back from Ginés. Cervantes has his own characters point out the slip."
