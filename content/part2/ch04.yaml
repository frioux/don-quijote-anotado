  - sentences:
      - es: "— No está en eso el yerro —replicó Sansón—, sino en que, antes de haber parecido el jumento, dice el autor que iba a caballo Sancho en el mesmo rucio."
        literal: "— Not is in that the error —replied Sansón—, but in that, before of having appeared the ass, says the author that was-going on horseback Sancho on the same grey."
        ormsby: "“That is not where the mistake is,” replied Samson; “it is, that before the ass has turned up, the author speaks of Sancho as being mounted on it.”"
        vocab:
          - {w: "yerro", d: "error, mistake (old word; modern 'error')"}
          - {w: "no ... sino", d: "not ... but (rather)"}
          - {w: "parecer", d: "here the old sense 'to appear, turn up' (modern 'aparecer')"}
          - {w: "ir a caballo en", d: "to ride on, go mounted on"}
          - {w: "mesmo", d: "= mismo, same (old form)"}
          - {w: "rucio", d: "grey; Sancho's ass, 'Dapple' in Ormsby"}
