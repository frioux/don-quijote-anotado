part: 2
chapter: 4
title_es: "Capítulo IV. Donde Sancho Panza satisface al bachiller Sansón Carrasco de sus dudas y preguntas, con otros sucesos dignos de saberse y de contarse"
title_en: "In which Sancho Panza gives a satisfactory reply to the doubts and questions of the bachelor Samson Carrasco, together with other matters worth knowing and telling"
paragraphs:
  - sentences:
      - es: "Volvió Sancho a casa de don Quijote, y, volviendo al pasado razonamiento, dijo:"
        literal: "Came-back Sancho to house of Don Quijote, and, returning to-the past conversation, he-said:"
        ormsby: "Sancho came back to Don Quixote’s house, and returning to the late subject of conversation, he said,"
        vocab:
          - {w: "volver a", d: "to go back to, return to (a place, or a topic)"}
          - {w: "a casa de", d: "to the house of (no article: 'a casa de don Quijote')"}
          - {w: "pasado", d: "past, previous; 'el pasado razonamiento' = the conversation they were having before"}
          - {w: "razonamiento", d: "talk, conversation, discourse (not 'reasoning')"}
        diagram:
          - s: "Volvió Sancho a casa de don Quijote"
            r: "main verb 1: Sancho came back to Don Quijote's house"
          - s: "dijo:"
            r: "main verb 2 (after 'y'): he said"
            under:
              - {s: "volviendo al pasado razonamiento", r: "how: going back to the earlier conversation"}
        forms:
          - {w: "Volvió", f: "volv- + -ió → volver (to come back), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron. The verb comes before its subject 'Sancho', as often in narrative."}
          - {w: "volviendo", f: "volv- + -iendo → gerund of volver (to return): 'returning (to)'. The gerund of -er and -ir verbs ends in -iendo."}
          - {w: "al", f: "a + el, 'to the', the contraction modern Spanish still makes."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
        note: "At the end of the previous chapter Sancho went home to eat, promising to answer Sansón Carrasco's two questions afterwards: who stole his ass, and what he did with the hundred gold crowns he found in the Sierra Morena."
  - sentences:
      - es: "— A lo que el señor Sansón dijo que se deseaba saber quién, o cómo, o cuándo se me hurtó el jumento, respondiendo digo que la noche misma que, huyendo de la Santa Hermandad, nos entramos en Sierra Morena, después de la aventura sin ventura de los galeotes y de la del difunto que llevaban a Segovia, mi señor y yo nos metimos entre una espesura, adonde mi señor arrimado a su lanza, y yo sobre mi rucio, molidos y cansados de las pasadas refriegas, nos pusimos a dormir como si fuera sobre cuatro colchones de pluma;"
        literal: "— To that which the señor Sansón said, that itself was-wished to-know who, or how, or when from-me was-stolen the ass, answering I-say that the night same that, fleeing from the Holy Brotherhood, we went-ourselves into Sierra Morena, after the adventure without fortune of the galley-slaves and of that of-the dead-man that they-were-carrying to Segovia, my master and I ourselves put among a thicket, where my master leaning on his lance, and I on my grey, battered and tired from the past frays, ourselves we-put to sleep as if it-were on four mattresses of feather;"
        ormsby: "“As to what Señor Samson said, that he would like to know by whom, or how, or when my ass was stolen, I say in reply that the same night we went into the Sierra Morena, flying from the Holy Brotherhood after that unlucky adventure of the galley slaves, and the other of the corpse that was going to Segovia, my master and I ensconced ourselves in a thicket, and there, my master leaning on his lance, and I seated on my Dapple, battered and weary with the late frays we fell asleep as if it had been on four feather mattresses;"
        vocab:
          - {w: "a lo que", d: "as to what, in answer to what"}
          - {w: "hurtar", d: "to steal, filch (by stealth, not by force)"}
          - {w: "jumento", d: "ass, donkey (a plainer, more rustic word than 'asno')"}
          - {w: "la noche misma que", d: "the very night that, the same night that"}
          - {w: "Santa Hermandad", d: "the Holy Brotherhood, the rural police of Castile who hunted highwaymen; Don Quijote and Sancho fled them after freeing the galley slaves in Part I"}
          - {w: "entrarse en", d: "to go into, make one's way into (with 'se' for the effort of going in)"}
          - {w: "Sierra Morena", d: "the mountain range between La Mancha and Andalusia, where Don Quijote did his penance in Part I"}
          - {w: "aventura sin ventura", d: "'adventure without luck', an unlucky adventure; a play on 'aventura' and 'ventura' (fortune)"}
          - {w: "galeote", d: "galley slave, a convict condemned to row in the king's galleys"}
          - {w: "difunto", d: "dead man, corpse: the body being carried by night to Segovia in Part I"}
          - {w: "meterse entre", d: "to get in among, hide oneself in"}
          - {w: "espesura", d: "thicket, dense undergrowth"}
          - {w: "adonde", d: "where (old use for 'donde', with no movement implied)"}
          - {w: "arrimado a", d: "leaning on, propped against"}
          - {w: "rucio", d: "grey (of an animal); Sancho's name for his ass, 'Dapple' in Ormsby"}
          - {w: "molido", d: "'ground', battered, aching all over (from beatings)"}
          - {w: "refriega", d: "fray, scuffle, skirmish"}
          - {w: "ponerse a", d: "to begin to, set about"}
          - {w: "colchón de pluma", d: "feather mattress, the most comfortable bed there was"}
        diagram:
          - s: "respondiendo digo"
            r: "main verb: in answer I say"
            under:
              - s: "A lo que el señor Sansón dijo"
                r: "about what: as to what Señor Sansón said"
                under:
                  - {s: "que se deseaba saber quién, o cómo, o cuándo se me hurtó el jumento", r: "what he said: that people wished to know who, how or when my ass was stolen"}
              - s: "que la noche misma"
                r: "what I say, begins: that the very night"
                under:
                  - {s: "que, huyendo de la Santa Hermandad, nos entramos en Sierra Morena", r: "describes 'noche': on which, fleeing the Holy Brotherhood, we went into the Sierra Morena"}
                  - {s: "después de la aventura sin ventura de los galeotes", r: "when: after the unlucky adventure of the galley slaves"}
                  - s: "y de la del difunto"
                    r: "when, 2: and the one of the dead man"
                    under:
                      - {s: "que llevaban a Segovia", r: "describes 'difunto': whom they were carrying to Segovia"}
              - s: "mi señor y yo nos metimos entre una espesura"
                r: "what I say, main clause: my master and I got into a thicket"
                under:
                  - s: "adonde"
                    r: "where: in which"
                    under:
                      - {s: "mi señor arrimado a su lanza, y yo sobre mi rucio", r: "how: my master leaning on his lance, and I on my grey"}
                      - {s: "molidos y cansados de las pasadas refriegas", r: "how: battered and tired from the recent fights"}
                      - {s: "nos pusimos a dormir", r: "verb of 'adonde': we fell asleep"}
                      - {s: "como si fuera sobre cuatro colchones de pluma", r: "how: as if it were on four feather mattresses"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "se deseaba", f: "dese- + -aba → desear (to wish), imperfect, it, with impersonal 'se': 'it was wished, people wanted'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "se me hurtó", f: "hurt- + -ó → hurtar (to steal), preterite, it, with 'se' (passive: 'was stolen') and 'me' (from me). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "respondiendo", f: "respond- + -iendo → gerund of responder (to answer): 'answering, in reply'."}
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "huyendo", f: "gerund of huir (to flee): the i between vowels is written y, huyendo, 'fleeing'."}
          - {w: "nos entramos", f: "entr- + -amos → entrarse (to go into), preterite, we, with 'nos' (ourselves). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron; the 'we' form is the same as the present, and the sense decides."}
          - {w: "llevaban", f: "llev- + -aban → llevar (to carry), imperfect, they (unnamed people). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "nos metimos", f: "met- + -imos → meterse (to get into), preterite, we, with 'nos' (ourselves). The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "arrimado", f: "arrim- + -ado → participle of arrimar (to lean, prop), masculine to match 'mi señor'."}
          - {w: "molidos y cansados", f: "participles of moler (to grind) and cansar (to tire), masculine plural to match both men, 'mi señor y yo'."}
          - {w: "nos pusimos", f: "pus- + -imos → ponerse (to set about), preterite, we, with 'nos'. Irregular: puse, pusiste, puso, pusimos, pusisteis, pusieron. 'ponerse a' + infinitive = to start doing."}
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), it: 'as if it were'. fuera, fueras, fuera, fuéramos, fuerais, fueran. 'como si' always takes the imperfect subjunctive."}
          - {w: "colchones", f: "colchón (mattress) + -es; the accent drops in the plural because the stress now falls regularly."}
        note: "In the first edition of Part I the theft of the ass was never narrated: in the Sierra Morena the ass is suddenly missing, yet Sancho is soon riding it again. Cervantes now has Sancho tell the missing scene."
      - es: "especialmente yo dormí con tan pesado sueño, que quienquiera que fue tuvo lugar de llegar y suspenderme sobre cuatro estacas que puso a los cuatro lados de la albarda, de manera que me dejó a caballo sobre ella, y me sacó debajo de mí al rucio, sin que yo lo sintiese."
        literal: "especially I slept with so heavy sleep, that whoever that it-was had room to arrive and hoist-me on four stakes that he-put at the four sides of the pack-saddle, in such-manner that me he-left on horseback on it, and me he-took-out from-under me [to] the grey, without that I it might-feel."
        ormsby: "and I in particular slept so sound, that, whoever he was, he was able to come and prop me up on four stakes, which he put under the four corners of the packsaddle in such a way that he left me mounted on it, and took away Dapple from under me without my feeling it.”"
        vocab:
          - {w: "pesado sueño", d: "heavy sleep, a deep sleep"}
          - {w: "quienquiera que fue", d: "whoever it was"}
          - {w: "tener lugar de", d: "to have the chance to, have time to (not 'to take place')"}
          - {w: "suspender", d: "to hoist, hold up in the air"}
          - {w: "estaca", d: "stake, wooden pole"}
          - {w: "albarda", d: "pack-saddle, the padded saddle of a donkey"}
          - {w: "de manera que", d: "so that, in such a way that"}
          - {w: "a caballo", d: "mounted, astride (of any beast, not only a horse)"}
          - {w: "sacar", d: "to take out, pull out"}
          - {w: "sin que", d: "without (+ subjunctive): 'sin que yo lo sintiese' = without my feeling it"}
        diagram:
          - s: "especialmente yo dormí"
            r: "main verb: I especially slept"
            under:
              - s: "con tan pesado sueño"
                r: "how: so deeply"
                under:
                  - s: "que quienquiera que fue tuvo lugar"
                    r: "result: that whoever it was had the chance"
                    under:
                      - {s: "de llegar", r: "to do what, 1: to come up"}
                      - s: "y suspenderme sobre cuatro estacas"
                        r: "to do what, 2: and hoist me up on four stakes"
                        under:
                          - {s: "que puso a los cuatro lados de la albarda", r: "describes 'estacas': which he set at the four sides of the pack-saddle"}
                          - {s: "de manera que me dejó a caballo sobre ella", r: "result: so that he left me sitting astride it"}
                      - {s: "y me sacó debajo de mí al rucio", r: "what he did next: and he pulled the grey out from under me"}
                      - {s: "sin que yo lo sintiese", r: "how: without my feeling it"}
        forms:
          - {w: "dormí", f: "dorm- + -í → dormir (to sleep), preterite, I. The preterite of -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron (dormir changes o to u in the he and they forms: durmió, durmieron)."}
          - {w: "fue", f: "ser (to be), preterite, it: 'whoever it was'. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "tuvo", f: "tuv- + -o → tener (to have), preterite, he. Irregular: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron."}
          - {w: "suspenderme", f: "suspender (to hoist) + me, the pronoun hung on the infinitive after 'tuvo lugar de ... y'."}
          - {w: "puso", f: "pus- + -o → poner (to put), preterite, he. Irregular: puse, pusiste, puso, pusimos, pusisteis, pusieron."}
          - {w: "dejó", f: "dej- + -ó → dejar (to leave), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "ella", f: "'it', feminine because it stands for 'la albarda'."}
          - {w: "sacó", f: "sac- + -ó → sacar (to take out), preterite, he. Same -ó preterite as 'dejó' (saqué in the I form, c → qu before e)."}
          - {w: "al rucio", f: "a + el: the 'a' marks 'rucio' as the object; Spanish uses it for persons and, as here, for a beloved animal."}
          - {w: "sintiese", f: "sint- + -iese → sentir (to feel), imperfect subjunctive (-se form), I. sintiese, sintieses, sintiese, sintiésemos, sintieseis, sintiesen. 'sin que' always takes the subjunctive."}
        note: "The trick of propping the sleeping rider on stakes and leading the horse out from under him comes from the Italian romances of Boiardo and Ariosto, which Don Quijote cites at once."
  - sentences:
      - es: "— Eso es cosa fácil, y no acontecimiento nuevo, que lo mesmo le sucedió a Sacripante cuando, estando en el cerco de Albraca, con esa misma invención le sacó el caballo de entre las piernas aquel famoso ladrón llamado Brunelo."
        literal: "— That is thing easy, and not happening new, for the same to-him happened to Sacripante when, being at the siege of Albraca, with that same trick from-him took-out the horse from between the legs that famous thief called Brunelo."
        ormsby: "“That is an easy matter,” said Don Quixote, “and it is no new occurrence, for the same thing happened to Sacripante at the siege of Albracca; the famous thief, Brunello, by the same contrivance, took his horse from between his legs.”"
        ormsby_note: "“La sella su qnattro aste gli suffolse, / E di sotto il destrier nudo gli tolse.” Orlando Furioso, XXVII 84 But the idea was Boiardo’s: “E la cingia disciolse presto presto, / E pose il legno sotto de lo arcione.” Orlando Innamorato, II v. 40 It seems plain from this that Cervantes meant to introduce into the First Part a burlesque of the theft of Sacripante’s horse, with Ginés de Pasamonte playing the part of Brunello. It would have been an incident exactly in the spirit of the book."
        vocab:
          - {w: "acontecimiento", d: "event, occurrence, happening"}
          - {w: "que", d: "here 'for, since', giving the reason"}
          - {w: "mesmo", d: "= mismo, same (old form); 'lo mesmo' = the same thing"}
          - {w: "Sacripante", d: "Sacripante, king of Circassia, a Saracen knight in Boiardo's 'Orlando innamorato' and Ariosto's 'Orlando furioso', in love with Angelica"}
          - {w: "cerco", d: "siege (not 'circle')"}
          - {w: "Albraca", d: "Albracca, the fortress in Cathay where Angelica is besieged in Boiardo's 'Orlando innamorato'"}
          - {w: "invención", d: "trick, contrivance, ruse"}
          - {w: "Brunelo", d: "Brunello, the dwarfish master thief of Boiardo and Ariosto, who stole Sacripante's horse from under him and Angelica's magic ring"}
        diagram:
          - s: "Eso es cosa fácil, y no acontecimiento nuevo"
            r: "main verb: that is an easy thing, and nothing new"
            under:
              - s: "que lo mesmo le sucedió a Sacripante"
                r: "why: for the same thing happened to Sacripante"
                under:
                  - s: "cuando"
                    r: "when: when"
                    under:
                      - {s: "estando en el cerco de Albraca", r: "when: being at the siege of Albracca"}
                      - {s: "con esa misma invención", r: "how: with that very trick"}
                      - {s: "le sacó el caballo de entre las piernas", r: "verb of 'cuando': took his horse from between his legs"}
                      - {s: "aquel famoso ladrón llamado Brunelo", r: "subject of 'sacó': that famous thief called Brunello"}
        forms:
          - {w: "es", f: "ser (to be), present, it. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "mesmo", f: "old form of mismo (same); 'lo mesmo' = the same thing."}
          - {w: "sucedió", f: "suced- + -ió → suceder (to happen), preterite, it. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "le ... a Sacripante", f: "le (to him) doubles the indirect object 'a Sacripante', as Spanish usually does: 'it happened to him, to Sacripante'."}
          - {w: "estando", f: "est- + -ando → gerund of estar (to be): 'being (at)'."}
          - {w: "esa misma", f: "es- + -a → ese (that), and mism- + -a → mismo (same), both feminine to match 'invención'."}
          - {w: "sacó", f: "sac- + -ó → sacar (to take out), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (saqué, c → qu before e)."}
          - {w: "llamado", f: "llam- + -ado → participle of llamar (to call), masculine to match 'ladrón': 'called'."}
        note: "The speaker is Don Quijote (Ormsby adds 'said Don Quixote', which the Spanish leaves out). The subject of 'sacó', the thief Brunelo, is held back to the very end of the sentence for effect."
  - sentences:
      - es: "— Amaneció —prosiguió Sancho—, y, apenas me hube estremecido, cuando, faltando las estacas, di conmigo en el suelo una gran caída;"
        literal: "— It-dawned —continued Sancho—, and, hardly myself I-had stirred, when, failing the stakes, I-gave with-myself on the ground a great fall;"
        ormsby: "“Day came,” continued Sancho, “and the moment I stirred the stakes gave way and I fell to the ground with a mighty come down;"
        vocab:
          - {w: "amanecer", d: "to dawn, for day to break; 'amaneció' = day came"}
          - {w: "proseguir", d: "to continue, go on (speaking)"}
          - {w: "apenas ... cuando", d: "hardly ... when, no sooner ... than"}
          - {w: "estremecerse", d: "to stir, give a start, shudder"}
          - {w: "faltar", d: "here 'to give way, fail', of the stakes collapsing"}
          - {w: "dar consigo en el suelo", d: "to land on the ground, fall flat; 'di conmigo en el suelo' = I came down on the ground"}
          - {w: "caída", d: "fall, tumble"}
        diagram:
          - s: "Amaneció"
            r: "main verb 1: day dawned"
          - {s: "prosiguió Sancho", r: "speech tag: Sancho went on"}
          - s: "di conmigo en el suelo una gran caída"
            r: "main verb 2 (after 'y'): I came down on the ground with a great fall"
            under:
              - {s: "apenas me hube estremecido, cuando", r: "when: no sooner had I stirred than"}
              - {s: "faltando las estacas", r: "how: the stakes giving way"}
        forms:
          - {w: "Amaneció", f: "amanec- + -ió → amanecer (to dawn), preterite, it (with no subject, like 'it rained'). The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "prosiguió", f: "prosigu- + -ió → proseguir (to continue), preterite, he; the e of the stem becomes i in the he and they forms. proseguí, proseguiste, prosiguió, proseguimos, proseguisteis, prosiguieron."}
          - {w: "me hube estremecido", f: "hub- + -e → haber (to have), preterite, I, + estremecido, participle of estremecerse (to stir), with 'me' (myself): the past anterior, 'I had stirred', used after 'apenas' for an action just before another. haber in the preterite: hube, hubiste, hubo, hubimos, hubisteis, hubieron."}
          - {w: "faltando", f: "falt- + -ando → gerund of faltar (to give way): 'the stakes failing', a gerund with its own subject, 'las estacas'."}
          - {w: "di", f: "d- + -i → dar (to give), preterite, I. Irregular: di, diste, dio, dimos, disteis, dieron. In 'dar conmigo en el suelo' it means to land, fall."}
          - {w: "conmigo", f: "con + mí fused into one word: 'with me'; here 'myself'."}
          - {w: "gran", f: "grande (great) clipped before a singular noun ('caída')."}
      - es: "miré por el jumento, y no le vi;"
        literal: "I-looked for the ass, and not him I-saw;"
        ormsby: "I looked about for the ass, but could not see him;"
        vocab:
          - {w: "mirar por", d: "to look for, look about for (also 'to look after')"}
          - {w: "jumento", d: "ass, donkey (a plain, rustic word)"}
        diagram:
          - s: "miré"
            r: "main verb 1: I looked"
            under:
              - {s: "por el jumento", r: "for what: for the ass"}
          - s: "no le vi"
            r: "main verb 2 (after 'y'): I did not see him"
        forms:
          - {w: "miré", f: "mir- + -é → mirar (to look), preterite, I. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "le", f: "'him', the ass: leísmo, 'le' used for a masculine direct object where modern standard Spanish says 'lo'. Cervantes uses it for people and, as here, for animals."}
          - {w: "vi", f: "v- + -i → ver (to see), preterite, I. ver in the preterite: vi, viste, vio, vimos, visteis, vieron (no accents on the one-syllable forms)."}
      - es: "acudiéronme lágrimas a los ojos, y hice una lamentación, que si no la puso el autor de nuestra historia, puede hacer cuenta que no puso cosa buena."
        literal: "came-to-me tears to the eyes, and I-made a lamentation, that if not it put the author of our history, he-can make account that not he-put thing good."
        ormsby: "the tears rushed to my eyes and I raised such a lamentation that, if the author of our history has not put it in, he may depend upon it he has left out a good thing."
        vocab:
          - {w: "acudir", d: "to come, rush (to a place); 'acudiéronme lágrimas a los ojos' = tears came to my eyes"}
          - {w: "lamentación", d: "lament, wailing"}
          - {w: "hacer cuenta que", d: "to reckon that, take it that, be sure that"}
          - {w: "cosa buena", d: "a good thing; 'no puso cosa buena' = he left out something good"}
        diagram:
          - s: "acudiéronme lágrimas a los ojos"
            r: "main verb 1: tears came to my eyes"
          - s: "y hice una lamentación"
            r: "main verb 2: and I made a lament"
            under:
              - s: "que"
                r: "describes 'lamentación': (such) that"
                under:
                  - {s: "si no la puso el autor de nuestra historia", r: "condition: if the author of our history did not put it in"}
                  - s: "puede hacer cuenta"
                    r: "result: he may reckon"
                    under:
                      - {s: "que no puso cosa buena", r: "what he may reckon: that he left out a good thing"}
        forms:
          - {w: "acudiéronme", f: "acud- + -ieron + me → acudir (to come), preterite, they (the tears), with 'me' (to me) stuck on the end; modern 'me acudieron'. The preterite of -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron. Cervantes hangs the pronoun on a verb that opens a clause; the accent is added to keep the stress."}
