          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "era", f: "era → ser (to be), imperfect, he. Irregular: era, eras, era, éramos, erais, eran. 'era de los poetas' = he was one of the poets."}
          - {w: "había", f: "hab- + -ía → haber (to have; here 'there to be'), imperfect, it: 'there were'. haber (to have) in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "decían", f: "dec- + -ían → decir (to say), imperfect, they (people in general): 'they said'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "eran", f: "eran → ser (to be), imperfect, they. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "dejaría", f: "dejar- + -ía → dejar (to leave off), conditional, he: 'he would not fail'. The conditional adds -ía, -ías, -ía, -íamos, -íais, -ían to the whole infinitive."}
          - {w: "hallaba", f: "hall- + -aba → hallar (to find), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "contenían", f: "conten- + -ían → contener (to contain), imperfect, they (the letters). Same -ía imperfect as 'decían'."}
