        ormsby: "“God grant it,” said Don Quixote; “we shall see when the government comes; and I seem to see it already.”"
        vocab:
          - {w: "Dios lo haga", d: "God grant it, may God make it so"}
          - {w: "ello dirá", d: "'it will tell', i.e. time will tell, we shall see"}
          - {w: "gobierno", d: "governorship: the governing of the isle Sancho has been promised"}
          - {w: "trayo", d: "= traigo, I bring (old or rustic form of traer)"}
          - {w: "traer entre los ojos", d: "to have before one's eyes, to see clearly coming"}
        diagram:
          - s: "Dios lo haga"
            r: "main verb 1: may God do it"
            under:
              - {s: "dijo don Quijote", r: "speech tag: said Don Quijote"}
          - s: "y ello dirá"
            r: "main verb 2: and it will tell"
            under:
              - {s: "cuando el gobierno venga", r: "when: when the governorship comes"}
              - s: "que ya me parece"
                r: "why: for it already seems to me"
                under:
                  - {s: "que le trayo entre los ojos", r: "what seems: that I have it before my eyes"}
        forms:
          - {w: "haga", f: "hag- + -a → hacer (to do, make), present subjunctive, he (God): 'may God do it', a wish. Irregular: haga, hagas, haga, hagamos, hagáis, hagan."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "dirá", f: "dir- + -á → decir (to say), future, it. Irregular stem dir-: diré, dirás, dirá, diremos, diréis, dirán."}
