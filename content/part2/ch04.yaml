                r: "what I don't want, 1: that he flee"
                under:
                  - {s: "sin tener para qué", r: "how: without having reason to"}
              - s: "ni que acometa"
                r: "what I don't want, 2: nor that he attack"
                under:
                  - {s: "cuando la demasía pide otra cosa", r: "when: when the excess (of danger) calls for something else"}
        forms:
          - {w: "esto", f: "neuter 'this', referring to the whole idea just stated."}
          - {w: "es", f: "ser (to be), present, it. Irregular: soy, eres, es, somos, sois, son."}
