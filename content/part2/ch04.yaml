          - {s: "que también se dice:", r: "why (after 'que', for): for they also say (the proverbs follow)"}
        forms:
          - {w: "nací", f: "nac- + -í → nacer (to be born), preterite, I. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron (nací, naciste, nació, nacimos, nacisteis, nacieron)."}
          - {w: "pienso morir", f: "piens- + -o → pensar (to think; with an infinitive, to intend), present, I: pienso, piensas, piensa, pensamos, pensáis, piensan; + morir (to die), infinitive: 'I mean to die'."}
          - {w: "mucha, mucho", f: "much- + -a / -o → mucho (much), feminine to match 'solicitud', masculine to match 'riesgo'."}
          - {w: "deparase", f: "depar- + -ase → deparar (to provide), imperfect subjunctive (-se form), it (heaven). The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. Subjunctive after 'si' for an unlikely supposition; the subject 'el cielo' follows the verb."}
          - {w: "alguna", f: "algun- + -a → alguno (some), feminine to match 'ínsula'."}
          - {w: "soy", f: "ser (to be), present, I. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "desechase", f: "desech- + -ase → desechar (to reject), imperfect subjunctive (-se form), I: 'as to reject'. -ase, -ases, -ase, -ásemos, -aseis, -asen. 'tan necio que' + subjunctive = 'so foolish as to'; 'la' (it) stands for the island."}
          - {w: "se dice", f: "dic- + -e → decir (to say), present, it, with impersonal 'se': 'it is said'. decir in the present: digo, dices, dice, decimos, decís, dicen."}
        note: "'Sancho nací' is a refusal to take on airs: he will never call himself 'don Sancho'. In the same breath he admits he would gladly take an island if it fell into his lap, and backs himself with two proverbs."
      - es: "\"Cuando te dieren la vaquilla, corre con la soguilla\"; y \"Cuando viene el bien, mételo en tu casa\"."
        literal: "\"When to-you they-may-give the heifer, run with the little-rope\"; and \"When comes the good, put-it in your house\"."
        ormsby: "‘when they offer thee a heifer, run with a halter;’ and ‘when good luck comes to thee, take it in.’”"
        ormsby_note: "Proverbs 236 and 22."
        vocab:
          - {w: "vaquilla", d: "heifer, young cow (diminutive of 'vaca')"}
          - {w: "soguilla", d: "little rope, halter (diminutive of 'soga', rope)"}
          - {w: "el bien", d: "good fortune, a good thing"}
          - {w: "meter", d: "to put in, bring in"}
        diagram:
          - s: "corre con la soguilla"
            r: "proverb 1, main verb: run with the halter"
            under:
              - {s: "Cuando te dieren la vaquilla", r: "when: when they give you the heifer"}
          - s: "mételo en tu casa"
            r: "proverb 2, main verb: bring it into your house"
            under:
              - {s: "Cuando viene el bien", r: "when: when good fortune comes"}
        forms:
          - {w: "te", f: "'to you' (tú): proverbs speak to the listener as tú."}
          - {w: "dieren", f: "di- + -eren → dar (to give), future subjunctive, they (people in general): 'when they give you'. Built on the preterite dieron: diere, dieres, diere, diéremos, diereis, dieren. Cervantes uses it after 'cuando' for an open future; modern Spanish says 'cuando te den'."}
          - {w: "corre", f: "corr- + -e → correr (to run), imperative, you (tú): 'run!'. The tú command is the same as the he-form of the present: corro, corres, corre, corremos, corréis, corren."}
          - {w: "vaquilla, soguilla", f: "the diminutive -illa: vaca → vaquilla (c becomes qu before i), soga → soguilla (g becomes gu before i)."}
          - {w: "viene", f: "vien- + -e → venir (to come), present, it (good fortune). Irregular: vengo, vienes, viene, venimos, venís, vienen."}
          - {w: "mételo", f: "met- + -e + lo → meter (to put in), imperative, you (tú), with 'lo' (it) stuck on the end; the accent is added to keep the stress. The tú command equals the he-form of the present: meto, metes, mete, metemos, metéis, meten."}
          - {w: "tu", f: "'your' (tú), without an accent; 'tú' with the accent is the pronoun 'you'."}
        note: "Ormsby's numbers refer to his own numbered list of the proverbs in the book. Both sayings mean: take good fortune the moment it is offered, before the giver thinks better of it; bring a rope to lead the heifer home at once."
  - sentences:
      - es: "— Vos, hermano Sancho —dijo Carrasco—, habéis hablado como un catedrático; pero, con todo eso, confiad en Dios y en el señor don Quijote, que os ha de dar un reino, no que una ínsula."
        literal: "— You, brother Sancho —said Carrasco—, you-have spoken like a professor; but, with all that, trust in God and in the señor Don Quijote, who to-you has to give a kingdom, not [to say] that an isle."
        ormsby: "“Brother Sancho,” said Carrasco, “you have spoken like a professor; but, for all that, put your trust in God and in Señor Don Quixote, for he will give you a kingdom, not to say an island.”"
        vocab:
          - {w: "vos", d: "'you', the old polite-but-familiar address to one person; it takes the 'vosotros' verb forms (habéis, confiad)"}
          - {w: "catedrático", d: "professor holding a university chair ('cátedra'); here 'you spoke like a learned man'"}
          - {w: "con todo eso", d: "for all that, nevertheless"}
          - {w: "confiar en", d: "to trust in, put one's trust in"}
          - {w: "haber de + infinitive", d: "to be going to, to be bound to: 'os ha de dar' = he will give you"}
          - {w: "no que", d: "not to say, let alone, rather than (merely)"}
          - {w: "ínsula", d: "isle: the bookish word of the romances of chivalry for 'isla', the island Don Quijote promised Sancho to govern"}
        diagram:
          - s: "habéis hablado como un catedrático"
            r: "main verb 1: you have spoken like a professor"
            under:
              - {s: "Vos, hermano Sancho", r: "addressed to: you, brother Sancho"}
              - {s: "dijo Carrasco", r: "speech tag: said Carrasco"}
          - s: "confiad"
            r: "main verb 2 (after 'pero'): trust"
            under:
              - {s: "con todo eso", r: "linking: for all that"}
              - {s: "en Dios y en el señor don Quijote", r: "in whom: in God and in Don Quijote"}
              - s: "que os ha de dar un reino"
                r: "why: for he is going to give you a kingdom"
                under:
                  - {s: "no que una ínsula", r: "contrast: not merely an isle"}
        forms:
          - {w: "habéis hablado", f: "habéis, from haber (to have), present, you (vos), + hablado, participle of hablar (to speak): the present perfect, 'you have spoken'. haber (to have) in the present: he, has, ha, hemos, habéis, han. Vos takes the plural 'vosotros' forms even when it addresses one man."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "confiad", f: "confi- + -ad → confiar (to trust), imperative, you (vos): 'trust!'. The vos/vosotros imperative swaps the final -r of the infinitive for -d: confiad, comed, vivid."}
          - {w: "os", f: "'to you', the object pronoun that goes with vos and vosotros."}
          - {w: "ha de dar", f: "ha, from haber (to have), present, he: he, has, ha, hemos, habéis, han; + de + dar (to give): 'haber de' + infinitive = is to, is going to; 'he is going to give'."}
        note: "Carrasco teases Sancho for his speech on courage and governing, which he packed with proverbs and philosophy; a 'catedrático' held a chair at a university like Salamanca, where Carrasco himself has just taken his bachelor's degree."
  - sentences:
      - es: "— Tanto es lo de más como lo de menos —respondió Sancho—;"
        literal: "— As-much is the [thing] of more as the [thing] of less —answered Sancho—;"
        ormsby: "“It is all the same, be it more or be it less,” replied Sancho;"
        vocab:
          - {w: "tanto es ... como ...", d: "it is as much ... as ..., i.e. it comes to the same thing"}
          - {w: "lo de más, lo de menos", d: "the bigger thing, the smaller thing: kingdom or isle, it is all one to Sancho"}
        diagram:
          - s: "Tanto es lo de más"
            r: "main verb: the greater is as much"
            under:
              - {s: "como lo de menos", r: "compared with: as the lesser"}
              - {s: "respondió Sancho", r: "speech tag: answered Sancho"}
        forms:
          - {w: "es", f: "es → ser (to be), present, it: 'is'. ser (to be) in the present: soy, eres, es, somos, sois, son."}
          - {w: "lo de más", f: "lo, the neuter article, makes a noun of the phrase that follows: 'lo de más' = the matter of more, the bigger thing; 'lo de menos' = the smaller thing."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
      - es: "aunque sé decir al señor Carrasco que no echara mi señor el reino que me diera en saco roto, que yo he tomado el pulso a mí mismo, y me hallo con salud para regir reinos y gobernar ínsulas, y esto ya otras veces lo he dicho a mi señor."
        literal: "though I-know-how to-say to-the señor Carrasco that not would-throw my master the kingdom that to-me he-might-give into sack broken, for I have taken the pulse to me myself, and myself I-find with health to rule kingdoms and govern isles, and this already other times it I-have said to my master."
        ormsby: "though I can tell Señor Carrasco that my master would not throw the kingdom he might give me into a sack all in holes; for I have felt my own pulse and I find myself sound enough to rule kingdoms and govern islands; and I have before now told my master as much.”"
        vocab:
          - {w: "saber decir", d: "to be able to say, can tell (saber = to know how)"}
          - {w: "echar en saco roto", d: "idiom: to throw into a torn sack, i.e. to waste, let go for nothing; the kingdom would not be wasted on Sancho"}
          - {w: "tomar el pulso a", d: "to take the pulse of, test, sound out; Sancho has 'felt his own pulse' and knows his strength"}
          - {w: "hallarse con", d: "to find oneself with, to have"}
          - {w: "salud", d: "health; here fitness, capacity"}
          - {w: "regir", d: "to rule, govern"}
          - {w: "otras veces", d: "on other occasions, before now"}
        diagram:
          - s: "sé decir al señor Carrasco"
            r: "main verb (after 'aunque', though): I can tell señor Carrasco"
            under:
              - s: "que no echara mi señor el reino"
                r: "what I can tell: that my master would not throw the kingdom"
                under:
                  - {s: "que me diera", r: "describes 'reino': that he might give me"}
                  - {s: "en saco roto", r: "where: into a torn sack (would not be wasted)"}
              - s: "que yo he tomado el pulso a mí mismo"
                r: "why: for I have taken my own pulse"
              - s: "y me hallo con salud"
                r: "why, 2: and I find myself fit"
                under:
                  - {s: "para regir reinos y gobernar ínsulas", r: "for what: to rule kingdoms and govern isles"}
              - {s: "y esto ya otras veces lo he dicho a mi señor", r: "added: and I have told my master this before"}
        forms:
          - {w: "sé", f: "sé → saber (to know), present, I, with the accent that tells it from 'se'. Irregular: sé, sabes, sabe, sabemos, sabéis, saben. 'saber decir' = to know how to say, be able to tell."}
          - {w: "echara", f: "ech- + -ara → echar (to throw), imperfect subjunctive (-ra form), he, here doing the work of the conditional: 'would throw'. The -ra imperfect subjunctive of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran."}
          - {w: "diera", f: "d- + -iera → dar (to give), imperfect subjunctive (-ra form), he: 'that he might give'. dar (to give) takes -er endings here: diera, dieras, diera, diéramos, dierais, dieran."}
          - {w: "he tomado", f: "he, from haber (to have), present, I, + tomado, participle of tomar (to take): 'I have taken'. haber (to have) in the present: he, has, ha, hemos, habéis, han."}
          - {w: "a mí mismo", f: "mí, the stressed 'me' after a preposition (with the accent that tells it from 'mi', my), + mismo (self): 'myself', repeating the object for emphasis."}
          - {w: "me hallo", f: "hall- + -o → hallarse (to find oneself), present, I, with 'me'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "regir", f: "regir (to rule), infinitive after 'para', like 'gobernar' (to govern)."}
          - {w: "lo he dicho", f: "he, from haber (to have), present, I, + dicho, irregular participle of decir (to say): 'I have said'. haber in the present: he, has, ha, hemos, habéis, han. 'lo' repeats 'esto', which was put first for emphasis."}
  - sentences:
      - es: "— Mirad, Sancho —dijo Sansón—, que los oficios mudan las costumbres, y podría ser que viéndoos gobernador no conociésedes a la madre que os parió."
        literal: "— Look, Sancho —said Sansón—, for the offices change the customs, and it-could be that seeing-yourself governor not you-might-know [to] the mother who you bore."
        ormsby: "“Take care, Sancho,” said Samson; “honours change manners, and perhaps when you find yourself a governor you won’t know the mother that bore you.”"
        ormsby_note: "Proverb 158."
        vocab:
          - {w: "mirad que", d: "mind, take care that (a warning)"}
          - {w: "oficio", d: "office, post, position (not only 'trade')"}
          - {w: "mudar", d: "to change"}
          - {w: "costumbres", d: "habits, manners, character"}
          - {w: "podría ser que", d: "it might be that, perhaps"}
          - {w: "conocer", d: "here 'to recognise, acknowledge'"}
          - {w: "parir", d: "to give birth to, bear"}
        diagram:
          - s: "Mirad"
            r: "main verb 1: take care"
            under:
              - {s: "dijo Sansón", r: "speech tag: said Sansón"}
              - {s: "que los oficios mudan las costumbres", r: "why: for offices change manners"}
          - s: "podría ser"
            r: "main verb 2 (after 'y'): it might be"
            under:
              - s: "que viéndoos gobernador no conociésedes a la madre"
                r: "what might be: that, once a governor, you would not know your mother"
                under:
                  - {s: "que os parió", r: "describes 'madre': who bore you"}
        forms:
          - {w: "Mirad", f: "mir- + -ad → mirar (to look), imperative, you (vos): 'look!, mind!'. The vos/vosotros imperative swaps the final -r of the infinitive for -d: mirad, comed, vivid."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "mudan", f: "mud- + -an → mudar (to change), present, they (the offices). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "podría", f: "podr- + -ía → poder (to be able), conditional, it: 'it could be'. Irregular stem podr-: podría, podrías, podría, podríamos, podríais, podrían."}
          - {w: "viéndoos", f: "gerund of ver (to see) + os (yourself), accent added to keep the stress: 'seeing yourself (a governor)'. Pronouns hang on the end of a gerund."}
          - {w: "conociésedes", f: "conoc- + -iésedes → conocer (to know, recognise), imperfect subjunctive (-se form), you (vos), old ending -ésedes for modern -eseis: conociese, conocieses, conociese, conociésemos, conocieseis (old conociésedes), conociesen. Subjunctive after 'podría ser que'."}
          - {w: "a la madre", f: "the personal 'a' before a person as object."}
          - {w: "parió", f: "par- + -ió → parir (to give birth to), preterite, she. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
        note: "Ormsby's 'Proverb 158' refers to his own numbered list of the proverbs in the book. 'Los oficios mudan las costumbres' (honours change manners) means that power and rank change a man's character: the newly raised forget where they came from, even their own mother."
  - sentences:
      - es: "— Eso allá se ha de entender —respondió Sancho— con los que nacieron en las malvas, y no con los que tienen sobre el alma cuatro dedos de enjundia de cristianos viejos, como yo los tengo."
        literal: "— That there itself has to understand —answered Sancho— with those who were-born among the mallows, and not with those who have upon the soul four fingers of fat of Christians old, as I them have."
        ormsby: "“That may hold good of those that are born in the ditches,” said Sancho, “not of those who have the fat of an old Christian four fingers deep on their souls, as I have."
        ormsby_note: "Literally, \"among the mallows.\""
        vocab:
          - {w: "allá", d: "'over there', here dismissive: that may be so for others, elsewhere"}
          - {w: "entenderse con", d: "to apply to, be meant for"}
          - {w: "nacer en las malvas", d: "to be born among the mallows: of low birth, born in a ditch (mallows grow wild by roadsides and waste ground)"}
          - {w: "dedo", d: "finger; 'cuatro dedos' = four fingers' breadth, a measure of thickness"}
          - {w: "enjundia", d: "fat, especially the fat round a bird's ovary or a pig's kidneys; figuratively substance, solid worth"}
          - {w: "cristiano viejo", d: "'old Christian': a Spaniard with no Jewish or Moorish ancestry, a point of pride in an age obsessed with 'limpieza de sangre' (purity of blood)"}
        diagram:
          - s: "Eso allá se ha de entender"
            r: "main verb: that must be meant elsewhere"
            under:
              - {s: "respondió Sancho", r: "speech tag: answered Sancho"}
              - s: "con los"
                r: "for whom: for those"
                under:
                  - {s: "que nacieron en las malvas", r: "describes 'los': who were born among the mallows (lowborn)"}
              - s: "y no con los"
                r: "not for whom: and not for those"
                under:
                  - s: "que tienen sobre el alma cuatro dedos de enjundia de cristianos viejos"
                    r: "describes 'los': who have four fingers of old-Christian fat on their souls"
                    under:
                      - {s: "como yo los tengo", r: "how: as I have them"}
        forms:
          - {w: "se ha de entender", f: "ha, from haber (to have), present, it: he, has, ha, hemos, habéis, han; + de + entender (to understand), with 'se' making it passive: 'it is to be understood, it must apply'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "nacieron", f: "nac- + -ieron → nacer (to be born), preterite, they. Same -er/-ir preterite: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "tienen", f: "tien- + -en → tener (to have), present, they. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "viejos", f: "viej- + -os → viejo (old), masculine plural to match 'cristianos'; placed after the noun, as in the set term 'cristiano viejo'."}
          - {w: "los tengo", f: "teng- + -o → tener (to have), present, I: tengo, tienes, tiene, tenemos, tenéis, tienen. 'los' stands for 'los cuatro dedos'."}
        note: "Sancho means that 'honours change manners' only for upstarts of low birth, not for a man of solid old-Christian stock like himself. The 'fat' is probably also a joke on pork, which Jews and Muslims do not eat, so that bacon was a common badge of the old Christian."
      - es: "¡No, sino llegaos a mi condición, que sabrá usar de desagradecimiento con alguno!"
        literal: "No, but come-near-yourselves to my nature, which will-know-how to-use of ingratitude with anyone!"
        ormsby: "Nay, only look at my disposition, is that likely to show ingratitude to anyone?”"
        vocab:
          - {w: "¡No, sino ...!", d: "ironic: 'No, of course! just ...', i.e. go on, try it and see"}
          - {w: "llegarse a", d: "to come close to, take a look at"}
          - {w: "condición", d: "false friend: nature, character, temper (not 'condition')"}
          - {w: "usar de", d: "to make use of, practise, show"}
          - {w: "desagradecimiento", d: "ingratitude"}
        diagram:
          - s: "llegaos a mi condición"
            r: "main verb: come and look at my nature"
            under:
              - {s: "No, sino", r: "ironic opener: no, just"}
              - {s: "que sabrá usar de desagradecimiento con alguno", r: "describes 'condición' (ironic): which will surely be ungrateful to anyone!"}
        forms:
          - {w: "llegaos", f: "llegad + os → llegarse (to come close), imperative, you (vos), the -d dropped before 'os': llegad + os → llegaos. The vos/vosotros imperative swaps the final -r of the infinitive for -d (llegad); before the pronoun 'os' the -d falls away."}
          - {w: "sabrá", f: "sabr- + -á → saber (to know how), future, it (my nature). Irregular stem sabr-: sabré, sabrás, sabrá, sabremos, sabréis, sabrán."}
          - {w: "usar", f: "usar (to use), infinitive after 'sabrá'."}
          - {w: "alguno", f: "alguno (someone), full form, since no noun follows; before a masculine noun it would be clipped to 'algún'."}
  - sentences:
      - es: "— Dios lo haga —dijo don Quijote—, y ello dirá cuando el gobierno venga; que ya me parece que le trayo entre los ojos."
