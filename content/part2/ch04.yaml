  - sentences:
      - es: "El bachiller respondió que, puesto que él no era de los famosos poetas que había en España, que decían que no eran sino tres y medio, que no dejaría de componer los tales metros, aunque hallaba una dificultad grande en su composición, a causa que las letras que contenían el nombre eran diez y siete;"
        literal: "The bachelor answered that, granted that he not was of the famous poets that there-were in Spain, who they-said that not were but three and half, that not he-would-leave-off to-compose the such metres, though he-found a difficulty great in their composition, by cause that the letters that contained the name were ten and seven;"
        ormsby: "The bachelor replied that although he was not one of the famous poets of Spain, who were, they said, only three and a half, he would not fail to compose the required verses; though he saw a great difficulty in the task, as the letters which made up the name were seventeen;"
        ormsby_note: "There is some difference of opinion as to who were the three poets and a half allowed to be famous by Samson Carrasco; but probably Cervantes only intended a malicious little joke at the expense of the whole swarm of poets of his day, and their mutual admiration cliques."
        vocab:
          - {w: "puesto que", d: "false friend: in Cervantes 'although, granted that', not modern 'since, because'"}
          - {w: "no ... sino", d: "only, nothing but: 'no eran sino tres y medio' = they were only three and a half"}
          - {w: "no dejar de", d: "not to fail to: 'no dejaría de componer' = he would certainly compose"}
          - {w: "tales", d: "'los tales metros' = the said verses, those verses"}
          - {w: "metros", d: "verses, lines of poetry (literally 'metres')"}
          - {w: "a causa que", d: "= a causa de que, because"}
          - {w: "contener", d: "to contain, make up"}
          - {w: "diez y siete", d: "seventeen (modern 'diecisiete')"}
