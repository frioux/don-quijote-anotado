  - sentences:
      - es: "— Yo tendré cuidado —dijo Carrasco— de acusar al autor de la historia que si otra vez la imprimiere, no se le olvide esto que el buen Sancho ha dicho, que será realzarla un buen coto más de lo que ella se está."
        literal: "— I will-have care —said Carrasco— to remind [to] the author of the history that if another time it he-should-print, not to-him may-forget-itself this that the good Sancho has said, for it-will-be to-raise-it a good span more than that-which it itself is."
        ormsby: "“I will take care,” said Carrasco, “to impress upon the author of the history that, if he prints it again, he must not forget what worthy Sancho has said, for it will raise it a good span higher.”"
        vocab:
          - {w: "tener cuidado de", d: "to take care to, see to it that"}
          - {w: "acusar", d: "here 'to point out, bring to the notice of', not 'to accuse'; Carrasco will remind the author"}
          - {w: "otra vez", d: "again, another time"}
          - {w: "olvidársele (algo) a alguien", d: "for something to slip someone's mind: 'no se le olvide' = let it not slip his mind"}
          - {w: "realzar", d: "to raise up, enhance, set off"}
          - {w: "coto", d: "a hand's breadth, a small measure of length; 'un buen coto más' = a good span higher"}
          - {w: "estarse", d: "to be, stand (as it is); 'de lo que ella se está' = than it already stands"}
        diagram:
          - s: "Yo tendré cuidado"
            r: "main verb: I will take care"
            under:
              - {s: "dijo Carrasco", r: "speech tag: said Carrasco"}
              - s: "de acusar al autor de la historia"
                r: "what I will see to: to remind the author of the history"
                under:
                  - s: "que ... no se le olvide esto"
                    r: "what to remind him: that this should not slip his mind"
                    under:
                      - {s: "si otra vez la imprimiere", r: "condition: if he prints it again"}
                      - {s: "que el buen Sancho ha dicho", r: "describes 'esto': which good Sancho has said"}
                  - s: "que será realzarla un buen coto más"
                    r: "why: for it will mean raising it a good span higher"
                    under:
                      - {s: "de lo que ella se está", r: "than what: than it stands now"}
        forms:
          - {w: "tendré", f: "tendr- + -é → tener (to have), future, I. Irregular stem tendr-: tendré, tendrás, tendrá, tendremos, tendréis, tendrán."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "al", f: "a + el: 'acusar a alguien', the personal 'a' before a person as object, fused with the article."}
          - {w: "imprimiere", f: "imprim- + -iere → imprimir (to print), future subjunctive, he: 'if he should print'. The future subjunctive of -er and -ir verbs: -iere, -ieres, -iere, -iéremos, -iereis, -ieren. Cervantes uses it after 'si' for an open future; modern Spanish says 'si la imprime'."}
          - {w: "la", f: "'it', feminine because it stands for 'la historia'; placed before the verb 'imprimiere'."}
          - {w: "no se le olvide", f: "olvid- + -e → olvidarse (to be forgotten), present subjunctive, it, with 'se' (itself) and 'le' (to him): 'let it not slip his mind'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. Subjunctive because it reports an instruction."}
          - {w: "ha dicho", f: "h- + -a → haber (to have), present, he, + dicho, irregular participle of decir (to say): the present perfect, 'has said'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "será", f: "ser- + -á → ser (to be), future, it. The future adds endings to the whole infinitive: seré, serás, será, seremos, seréis, serán."}
          - {w: "realzarla", f: "realzar (to raise up) + la (it, the history), the pronoun hung on the infinitive, which here acts as a noun after 'será': 'it will be to raise it'."}
          - {w: "buen", f: "bueno (good) clipped before a masculine singular noun ('coto'), like un, gran, algún."}
          - {w: "se está", f: "est- + -á → estar (to be), present, it, with 'se', which adds 'as it stands, as it is': estoy, estás, está, estamos, estáis, están."}
        note: "Carrasco keeps up his teasing: Sancho's lame excuses about the ass and the crowns are to go into the next edition as an improvement. Real second editions of Part I (1605) did add a passage on the theft of the ass."
