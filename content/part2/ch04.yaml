          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "haber parecido", f: "haber (to have), infinitive, + parecido, participle of parecer (to appear): the perfect infinitive, 'having appeared', after 'antes de'; its subject 'el jumento' follows."}
