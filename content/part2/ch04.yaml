  - sentences:
      - es: "— Ha de ser así en todo caso —dijo don Quijote—; que si allí no va el nombre patente y de manifiesto, no hay mujer que crea que para ella se hicieron los metros."
        literal: "— It-has to be thus in every case —said Don Quijote—; for if there not goes the name plain and in view, not there-is woman who may-believe that for her themselves were-made the verses."
        ormsby: "“It must be, by some means or other,” said Don Quixote, “for unless the name stands there plain and manifest, no woman would believe the verses were made for her.”"
        vocab:
          - {w: "en todo caso", d: "in any case, by all means"}
          - {w: "patente", d: "plain, evident, visible"}
          - {w: "de manifiesto", d: "openly, on display"}
          - {w: "metros", d: "verses, lines of poetry"}
