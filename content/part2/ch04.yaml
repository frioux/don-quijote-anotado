              - {s: "que crea que para ella se hicieron los metros", r: "describes 'mujer': who would believe the verses were made for her"}
        forms:
          - {w: "Ha de ser", f: "ha, from haber (to have), present, it: he, has, ha, hemos, habéis, han; + de + ser (to be): 'it has to be, it must be'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "va", f: "va → ir (to go), present, it: 'goes, stands'. Irregular: voy, vas, va, vamos, vais, van."}
          - {w: "no hay", f: "hay, 'there is', the present of haber (to have) used for existence; 'no hay mujer que' = there is no woman who."}
          - {w: "crea", f: "cre- + -a → creer (to believe), present subjunctive, she: subjunctive after 'no hay mujer que', a person who does not exist. The present subjunctive of -er verbs: -a, -as, -a, -amos, -áis, -an."}
          - {w: "se hicieron", f: "hic- + -ieron → hacer (to make), preterite, they (the verses), with 'se' making it passive: 'were made'. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
