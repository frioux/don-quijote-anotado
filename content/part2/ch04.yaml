        ormsby: "“I spent them for my own good, and my wife’s, and my children’s, and it is they that have made my wife bear so patiently all my wanderings on highways and byways, in the service of my master, Don Quixote;"
        vocab:
          - {w: "en pro de", d: "for the benefit of, on behalf of"}
          - {w: "la de mi mujer", d: "that (the person) of my wife, i.e. my wife's benefit"}
          - {w: "ser causa de que", d: "to be the reason that, cause (+ subjunctive)"}
          - {w: "llevar en paciencia", d: "to bear patiently, put up with"}
          - {w: "caminos y carreras", d: "roads and ways, highways and byways: all his travels"}
          - {w: "andar", d: "here 'to travel, cover (a road)'"}
