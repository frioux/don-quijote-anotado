  - sentences:
      - es: "Dicho esto, rogó al bachiller que, si era poeta, le hiciese merced de componerle unos versos que tratasen de la despedida que pensaba hacer de su señora Dulcinea del Toboso, y que advirtiese que en el principio de cada verso había de poner una letra de su nombre, de manera que al fin de los versos, juntando las primeras letras, se leyese: Dulcinea del Toboso."
        literal: "Said this, he-begged [to] the bachelor that, if he-was poet, to-him he-might-do favour of composing-for-him some verses that might-treat of the farewell that he-was-thinking to-make of his lady Dulcinea del Toboso, and that he-might-take-care that at the beginning of each verse he-had to put a letter of her name, in manner that at-the end of the verses, joining the first letters, one-might-read: Dulcinea del Toboso."
        ormsby: "He then begged the bachelor, if he were a poet, to do him the favour of composing some verses for him conveying the farewell he meant to take of his lady Dulcinea del Toboso, and to see that a letter of her name was placed at the beginning of each line, so that, at the end of the verses, “Dulcinea del Toboso” might be read by putting together the first letters."
