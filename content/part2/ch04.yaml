                  - {s: "que decían que no eran sino tres y medio", r: "describes 'poetas': who, people said, were only three and a half"}
              - {s: "que no dejaría de componer los tales metros", r: "what he answered: that he would not fail to compose the verses"}
              - s: "aunque hallaba una dificultad grande en su composición"
                r: "concession: though he found a great difficulty in composing them"
                under:
                  - s: "a causa que las letras ... eran diez y siete"
                    r: "why: because the letters were seventeen"
