  - sentences:
      - es: "— Deso es lo que yo reniego, señor Sansón —dijo a este punto Sancho—, que así acomete mi señor a cien hombres armados como un muchacho goloso a media docena de badeas."
        literal: "— Of-that is what I curse, sir Sansón —said at this point Sancho—, for thus attacks my master [to] a-hundred men armed as a boy greedy [does] to half a dozen of watermelons."
        ormsby: "“There’s where it is, what I abominate, Señor Samson,” said Sancho here; “my master will attack a hundred armed men as a greedy boy would half a dozen melons."
        vocab:
          - {w: "deso", d: "= de eso, of that (old contraction)"}
          - {w: "renegar de", d: "to curse, detest, abominate; 'deso es lo que yo reniego' = that is just what I can't stand"}
          - {w: "a este punto", d: "at this moment, just then"}
          - {w: "acometer", d: "to attack, charge, fall upon"}
          - {w: "así ... como", d: "just as ... as: 'así acomete ... como un muchacho' = he attacks just like a boy"}
          - {w: "goloso", d: "greedy, sweet-toothed"}
          - {w: "badea", d: "a watery, tasteless melon or watermelon; something soft and easy to tackle"}
        diagram:
          - s: "Deso es lo que yo reniego"
            r: "main verb (Sancho's words): that is what I curse"
            under:
              - {s: "señor Sansón", r: "addressed to Carrasco"}
          - {s: "dijo a este punto Sancho", r: "speech tag: Sancho said at this point"}
          - s: "que así acomete mi señor a cien hombres armados"
            r: "why (after 'que', for): my master attacks a hundred armed men just like that"
            under:
              - {s: "como un muchacho goloso a media docena de badeas", r: "comparison: as a greedy boy [attacks] half a dozen melons"}
        forms:
          - {w: "Deso", f: "de + eso (that), run together in the old spelling; modern 'de eso'. It is fronted for emphasis: 'that is what I curse'."}
          - {w: "reniego", f: "renieg- + -o → renegar (to curse, abhor), present, I. The stem e becomes ie when stressed: reniego, reniegas, reniega, renegamos, renegáis, reniegan."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "este", f: "est- + -e → este (this), masculine singular to match 'punto'."}
          - {w: "acomete", f: "acomet- + -e → acometer (to attack), present, he. The present of -er verbs: -o, -es, -e, -emos, -éis, -en. The subject 'mi señor' follows the verb."}
          - {w: "armados", f: "arm- + -ados → participle of armar (to arm), used as an adjective, masculine plural to match 'hombres'."}
          - {w: "goloso", f: "golos- + -o → goloso (greedy), masculine singular to match 'muchacho'."}
          - {w: "media", f: "medi- + -a → medio (half), feminine to match 'docena'; no article: 'media docena' = half a dozen."}
        note: "Carrasco has just urged Don Quijote to be more careful in facing dangers, and Sancho seizes on the point at once. The 'a' before 'cien hombres' is the personal 'a' before people; Sancho repeats it before the melons, so the comparison runs exactly parallel."
      - es: "¡Cuerpo del mundo, señor bachiller! Sí, que tiempos hay de acometer y tiempos de retirar; sí, no ha de ser todo \"¡Santiago, y cierra, España!\""
        literal: "Body of-the world, sir bachelor! Yes, for times there-are of attacking and times of retreating; yes, not it-has to be all \"Santiago, and charge, Spain!\""
        ormsby: "Body of the world, señor bachelor! there is a time to attack and a time to retreat, and it is not to be always ‘Santiago, and close Spain!’"
        ormsby_note: "The old Spanish war-cry, Santiago y cierra España!"
        vocab:
          - {w: "¡Cuerpo del mundo!", d: "'body of the world!', a mild oath, a softened 'cuerpo de Dios'"}
          - {w: "bachiller", d: "bachelor, holder of the first university degree; Sansón Carrasco's title"}
          - {w: "sí, que", d: "yes indeed, for; 'sí' here is emphatic, 'that's right'"}
          - {w: "tiempos hay de ... y tiempos de", d: "there is a time to ... and a time to; it echoes the 'time to every purpose' of Ecclesiastes"}
          - {w: "retirar", d: "to retreat, withdraw (modern Spanish prefers 'retirarse')"}
          - {w: "haber de", d: "+ infinitive: must, is to; 'no ha de ser todo' = it can't all be"}
          - {w: "Santiago", d: "St James the Apostle, patron saint of Spain, invoked in battle against the Moors"}
          - {w: "cerrar", d: "in battle: to close with the enemy, charge"}
          - {w: "¡Santiago, y cierra, España!", d: "the old Spanish battle cry: 'St James, and charge, Spain!'; here a byword for charging without thinking"}
        diagram:
          - {s: "¡Cuerpo del mundo, señor bachiller!", r: "exclamation, addressed to Carrasco"}
          - s: "tiempos hay"
            r: "main verb 1 (after 'Sí, que'): there are times"
            under:
              - {s: "de acometer", r: "what kind: for attacking"}
              - {s: "y tiempos de retirar", r: "and times for retreating"}
          - s: "no ha de ser todo"
            r: "main verb 2 (after 'sí'): it must not all be"
            under:
              - {s: "¡Santiago, y cierra, España!", r: "what it must not all be: the battle cry 'St James, and charge, Spain!'"}
        forms:
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
          - {w: "hay", f: "haber (to have) used impersonally, 'there are', present. The present of haber (to have): he, has, ha, hemos, habéis, han; in the 'there is / there are' sense the it-form is 'hay'. The noun 'tiempos' comes first for emphasis."}
          - {w: "acometer", f: "infinitive of acometer (to attack) after 'de': 'times for attacking'."}
          - {w: "retirar", f: "infinitive of retirar (to withdraw) after 'de': 'times for retreating'."}
          - {w: "ha de ser", f: "ha (haber (to have), present, it: he, has, ha, hemos, habéis, han) + de + ser (to be): 'haber de' + infinitive means 'must, is to'; 'no ha de ser' = it must not be."}
          - {w: "cierra", f: "cierr- + -a → cerrar (to close; in battle, to charge), imperative, you (tú, said to Spain): 'charge!'. The stem e becomes ie when stressed: cierro, cierras, cierra, cerramos, cerráis, cierran; the tú command is the same as the he-form of the present."}
        note: "'Cierra' is a command, 'charge!', with 'España' the one addressed; Ormsby's 'close Spain' keeps the literal word. Sancho's point is that his master treats every encounter as a moment for that cry."
      - es: "Y más, que yo he oído decir, y creo que a mi señor mismo, si mal no me acuerdo, que en los estremos de cobarde y de temerario está el medio de la valentía;"
        literal: "And more, that I have heard say, and I-believe that [from] to my master himself, if badly not myself I-remember, that in the extremes of coward and of rash is the middle of the valor;"
        ormsby: "Moreover, I have heard it said (and I think by my master himself, if I remember rightly) that the mean of valour lies between the extremes of cowardice and rashness;"
        vocab:
          - {w: "y más, que", d: "and what's more, besides"}
          - {w: "oír decir", d: "to hear [it] said"}
          - {w: "si mal no me acuerdo", d: "if I remember rightly (literally 'if I don't remember badly')"}
          - {w: "estremo", d: "= extremo, extreme (old spelling)"}
          - {w: "temerario", d: "rash, reckless, foolhardy"}
          - {w: "el medio", d: "the mean, the middle point between two extremes"}
          - {w: "valentía", d: "courage, bravery"}
        diagram:
          - s: "Y más, que yo he oído decir"
            r: "main verb: and what's more, I have heard it said"
            under:
              - s: "y creo que a mi señor mismo"
                r: "aside: and I believe [I heard it] from my master himself"
                under:
                  - {s: "si mal no me acuerdo", r: "condition: if I remember rightly"}
              - {s: "que en los estremos de cobarde y de temerario está el medio de la valentía", r: "what he heard: that between the extremes of cowardly and rash lies the mean of courage"}
        forms:
          - {w: "he oído", f: "he (haber (to have), present, I: he, has, ha, hemos, habéis, han) + oído, participle of oír (to hear): the present perfect, 'I have heard'."}
          - {w: "decir", f: "infinitive of decir (to say) after 'oído': 'heard [people] say'."}
          - {w: "creo", f: "cre- + -o → creer (to believe), present, I. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "mismo", f: "mism- + -o → mismo (self, very), masculine to match 'señor': 'my master himself'."}
          - {w: "me acuerdo", f: "acuerd- + -o → acordarse (to remember), present, I, with 'me' (myself). The stem o becomes ue when stressed: me acuerdo, te acuerdas, se acuerda, nos acordamos, os acordáis, se acuerdan."}
          - {w: "estremos", f: "old spelling of extremos (extremes), plural."}
          - {w: "está", f: "est- + -á → estar (to be), present, it (the mean): estoy, estás, está, estamos, estáis, están. The subject 'el medio de la valentía' comes after the verb."}
        note: "The doctrine is Aristotle's, from the 'Ethics': courage is the mean between cowardice and rashness. It was a commonplace of the schools, and Sancho, half remembering, credits it to his master."
      - es: "y si esto es así, no quiero que huya sin tener para qué, ni que acometa cuando la demasía pide otra cosa."
        literal: "and if this is so, not I-want that he-may-flee without having for what, nor that he-may-attack when the excess asks-for other thing."
        ormsby: "and if that be so, I don’t want him to fly without having good reason, or to attack when the odds make it better not."
        ormsby_note: "Demasia, literally \"excess.\" Hartzenbusch would add \"of the risk,\" or substitute \"occasion,\" but I venture to think the word by itself may be taken in the sense I have given."
        vocab:
          - {w: "huir", d: "to flee, run away"}
          - {w: "tener para qué", d: "to have a reason to, have cause"}
          - {w: "demasía", d: "excess; here the excess of danger, odds too great"}
          - {w: "pedir otra cosa", d: "to call for something else (i.e. caution)"}
        diagram:
