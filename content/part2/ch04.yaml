          - {w: "Todo lo prometió", f: "promet- + -ió → prometer (to promise), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron. 'Todo' comes first for emphasis and 'lo' repeats it."}
          - {w: "se despidió", f: "despid- + -ió → despedirse (to take leave), preterite, he, with 'se'. The stem e turns to i in the he and they forms: me despedí, te despediste, se despidió, nos despedimos, os despedisteis, se despidieron."}
