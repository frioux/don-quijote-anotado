  - sentences:
      - es: "— Sí debe de haber —respondió él—, pero ninguna debe de ser de la importancia de las ya referidas."
        literal: "— Yes there-must be —answered he—, but none must be of the importance of those already mentioned."
        ormsby: "“No doubt there is,” replied he; “but not anything that will be of the same importance as those I have mentioned.”"
        vocab:
          - {w: "deber de", d: "must (of probability): 'debe de haber' = there must be, there probably are"}
          - {w: "referido", d: "mentioned, related (from 'referir', to tell, recount)"}
        diagram:
          - s: "Sí debe de haber"
            r: "main verb 1: yes, there must be (some)"
            under:
              - {s: "respondió él", r: "speech tag: he answered"}
          - s: "pero ninguna debe de ser"
            r: "main verb 2 (after 'pero'): but none can be"
            under:
              - s: "de la importancia"
                r: "of what: of the importance"
                under:
                  - {s: "de las ya referidas", r: "of which: of those already mentioned"}
        forms:
          - {w: "Sí", f: "sí with the accent = 'yes', here stressing the verb: 'there certainly must be'. Without the accent 'si' means 'if'."}
          - {w: "debe de haber", f: "deb- + -e → deber (must), present, it, + de + haber (to have, here 'there to be'): 'there must be'. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "ninguna", f: "ningun- + -a → ninguno (none), feminine because it stands for 'cosa'."}
          - {w: "debe de ser", f: "debe (deber (must), present, it) + de + ser (to be): 'it must be, it can be'. Same present as 'debe de haber' above."}
          - {w: "las ya referidas", f: "las = 'those', feminine plural for 'cosas'; referid- + -as → referido, participle of referir (to mention), feminine plural to match."}
