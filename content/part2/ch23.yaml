      - es: "Ven conmigo, señor clarísimo, que te quiero mostrar las maravillas que este transparente alcázar solapa, de quien yo soy alcaide y guarda mayor perpetua, porque soy el mismo Montesinos, de quien la cueva toma nombre»."
        literal: "Come with-me, sir most-illustrious, for thee I-want to-show the marvels that this transparent castle conceals, of whom I am warden and keeper chief perpetual, because I-am the same Montesinos, from whom the cave takes name»."
        ormsby: "Come with me, illustrious sir, and I will show thee the marvels hidden within this transparent castle, whereof I am the alcaide and perpetual warden; for I am Montesinos himself, from whom the cave takes its name.’"
        ormsby_note: "Montesinos is the hero of half a dozen ballads belonging to the Carlovingian cycle, but does not figure in any of the French romances. According to the ballads he was one of the Peers, and son of Count Grimaltos, or Grimaldos, by a daughter of Charlemagne. He owed his name to having been born in a forest (monte), where his father and mother were wandering, banished from court by the machinations of the traitor Tomillas. It appears to have been connected with the cave from a very early period, and according to one of the oldest of the ballads the adjacent Castle of Rocafria, or Rocafrida, mentioned in this note, was the residence of Rosaflorida, a lady who was enamoured of him de oídas, from hearsay. Clemencín says they were married and lived there; but one of the ballads represents him as marrying Guiomar, a converted Saracen. It is odd that, with the castle close at hand here, Cervantes should not have referred to it."
        vocab:
          - {w: "solapar", d: "to conceal, cover up (literally to overlap like a lapel)"}
          - {w: "de quien", d: "of which: 'quien' could refer to things in Cervantes' Spanish (here the castle)"}
          - {w: "alcaide", d: "warden, governor of a castle or fortress (not 'mayor', which is 'alcalde')"}
          - {w: "guarda mayor", d: "chief keeper, head guard"}
          - {w: "perpetuo", d: "perpetual, for life"}
          - {w: "Montesinos", d: "a hero of the Spanish ballads of Charlemagne's cycle, cousin and friend of Durandarte; his name was attached to this cave in La Mancha"}
          - {w: "tomar nombre de", d: "to take its name from"}
        diagram:
