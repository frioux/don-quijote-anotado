          - {w: "maravillarse de", d: "to be amazed at, wonder at"}
          - {w: "subirse sobre", d: "to climb on top of, jump on"}
          - {w: "vejote", d: "old fellow, old codger ('viejo' + the scornful augmentative '-ote')"}
          - {w: "moler a coces", d: "to grind with kicks, beat black and blue; 'coz' = kick (of a horse or mule)"}
          - {w: "pelar las barbas", d: "to pluck out someone's beard, the worst insult to a man's honour"}
