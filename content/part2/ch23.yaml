          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, it: with 'bien', 'it was fitting'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. 'me ... a mí' doubles the pronoun for emphasis."}
          - {w: "hacer", f: "hacer (to do), infinitive, the subject of 'estaba bien': 'to do that was not fitting'."}
          - {w: "estamos todos obligados", f: "est- + -amos → estar (to be), present, we: estoy, estás, está, estamos, estáis, están; + obligados, participle of obligar (to oblige), masculine plural: 'we are bound'."}
