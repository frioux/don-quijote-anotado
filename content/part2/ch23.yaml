  - sentences:
      - es: "— Y aun me maravillo yo —dijo Sancho— de cómo vuestra merced no se subió sobre el vejote, y le molió a coces todos los huesos, y le peló las barbas, sin dejarle pelo en ellas."
        literal: "— And still myself marvel I —said Sancho— at how your-grace not himself climbed upon the old-fellow, and to-him ground with kicks all the bones, and to-him plucked the beards, without leaving-him hair in them."
        ormsby: "“Still I wonder,” said Sancho, “that your worship did not get upon the old fellow and bruise every bone of him with kicks, and pluck his beard until you didn’t leave a hair in it.”"
