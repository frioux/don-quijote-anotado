                  - s: "porque soy el mismo Montesinos"
                    r: "why: because I am Montesinos himself"
                    under:
                      - {s: "de quien la cueva toma nombre", r: "describes 'Montesinos': from whom the cave takes its name"}
        forms:
          - {w: "Ven", f: "ven → venir (to come), imperative, you (tú): 'come!'. An irregular short imperative, like pon (poner, to put), sal (salir, to go out), ten (tener, to have)."}
          - {w: "conmigo", f: "con + mí → conmigo, 'with me', a special fused form."}
          - {w: "te quiero mostrar", f: "quier- + -o → querer (to want), present, I: quiero, quieres, quiere, queremos, queréis, quieren; + mostrar (to show); 'te' (to you) can go before the whole group or on the infinitive ('quiero mostrarte')."}
          - {w: "solapa", f: "solap- + -a → solapar (to conceal), present, it (the castle). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "soy", f: "soy → ser (to be), present, I. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "perpetua", f: "perpetu- + -a → perpetuo (perpetual), feminine to match 'guarda' (a feminine noun even for a man)."}
          - {w: "toma", f: "tom- + -a → tomar (to take), present, it (the cave). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
        note: "Montesinos plays host like the keeper of an enchanted castle in a romance of chivalry, and greets Don Quijote as the knight foretold to end the spell. 'Alcaide' is the governor of a fortress, a title from Spain's Moorish frontier."
