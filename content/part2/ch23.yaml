      - es: "Pero, ¿qué dirás cuando te diga yo ahora cómo, entre otras infinitas cosas y maravillas que me mostró Montesinos, las cuales despacio y a sus tiempos te las iré contando en el discurso de nuestro viaje, por no ser todas deste lugar, me mostró tres labradoras que por aquellos amenísimos campos iban saltando y brincando como cabras;"
