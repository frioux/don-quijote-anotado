  - sentences:
      - es: "— No, Sancho amigo —respondió don Quijote—, no me estaba a mí bien hacer eso, porque estamos todos obligados a tener respeto a los ancianos, aunque no sean caballeros, y principalmente a los que lo son y están encantados;"
        literal: "— No, Sancho friend —answered Don Quijote—, not to-me was to me well to-do that, because we-are all obliged to have respect to the old-men, although not they-be knights, and chiefly to those who it are and are enchanted;"
        ormsby: "“Nay, Sancho, my friend,” said Don Quixote, “it would not have been right in me to do that, for we are all bound to pay respect to the aged, even though they be not knights, but especially to those who are, and who are enchanted;"
        vocab:
          - {w: "estarle bien a uno", d: "to be fitting, proper for someone; 'no me estaba bien' = it was not right for me"}
          - {w: "obligado a", d: "bound to, obliged to"}
