  - sentences:
      - es: "— No comen —respondió don Quijote—, ni tienen escrementos mayores; aunque es opinión que les crecen las uñas, las barbas y los cabellos."
        literal: "— Not they-eat —answered Don Quijote—, nor they-have excrements greater; although it-is opinion that to-them grow the nails, the beards and the hairs."
        ormsby: "“They neither eat,” said Don Quixote; “nor are they subject to the greater excrements, though it is thought that their nails, beards, and hair grow.”"
        vocab:
          - {w: "escrementos", d: "= excrementos, excrement (old spelling); 'escrementos mayores' = solid waste, as opposed to the 'lesser' (urine)"}
          - {w: "es opinión que", d: "it is believed that, people hold that"}
          - {w: "uñas", d: "nails (of fingers and toes)"}
          - {w: "cabellos", d: "hair (of the head)"}
        diagram:
          - s: "— No comen"
            r: "main verb 1: they don't eat"
            under:
              - {s: "—respondió don Quijote—", r: "speech tag: answered Don Quijote"}
          - {s: "ni tienen escrementos mayores", r: "main verb 2: nor do they have the greater excrements"}
          - s: "aunque es opinión"
            r: "concession: although it is believed"
            under:
              - {s: "que les crecen las uñas, las barbas y los cabellos", r: "what is believed: that their nails, beards and hair grow"}
        forms:
          - {w: "comen", f: "com- + -en → comer (to eat), present, they. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "tienen", f: "tien- + -en → tener (to have), present, they. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "mayores", f: "plural of mayor (greater), the irregular comparative of grande, to match 'escrementos'."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "les crecen", f: "crec- + -en → crecer (to grow), present, they (the nails, beards and hair), which come after the verb; 'les' = on them, 'their'. crezco, creces, crece, crecemos, crecéis, crecen."}
        note: "The belief that hair and nails go on growing after death (or in a trance) was common; in German legend the sleeping emperor Frederick Barbarossa grows a beard through the stone table he sits at."
  - sentences:
