summary: |
  At four in the afternoon, under a cloudy sky, Don Quijote tells Sancho and the cousin what he saw in the cave of Montesinos. Some way down he found a hollow, coiled the rope, sat on it, and fell into a deep sleep; he woke in a lovely meadow, made sure he was awake, and saw a crystal palace. Out of it came a venerable old man in a long purple gown and a student's green satin hood, with a rosary of enormous beads: Montesinos himself, who embraced him and said that the enchanted dwellers of the cave had long been waiting for him.

  Montesinos confirmed the ballad story, correcting only the dagger (it was a poniard, sharper than an awl), and led him to an alabaster hall where Durandarte lay on a marble tomb, in real flesh and bone, enchanted by Merlin. Montesinos told how he had cut out his cousin's heart, salted it on the road from Roncesvalles and carried it to Belerma, and how Merlin had turned the duenna Ruidera and her daughters and nieces into the lakes of Ruidera and the squire Guadiana into the river that dives underground. When he announced that Don Quijote had come to disenchant them, Durandarte answered only 'patience and shuffle the cards' and turned on his side. A procession of mourning damsels then passed, led by Belerma, plain, beetle-browed and sallow, carrying the dried heart; when Montesinos added that, but for her grief, even Dulcinea could hardly match her, Don Quijote cut him short and Montesinos apologised.

  Sancho, the cousin and Don Quijote then argue about time: they say he was gone little more than an hour, he says he spent three days and nights below, where the enchanted neither eat, nor sleep, nor relieve themselves, though their nails and hair grow. Sancho says he does not believe a word, not because his master lies but because the enchanters have filled his head. Don Quijote caps it all: among the meadows he saw three country girls skipping like goats, and recognised the enchanted Dulcinea and her two companions from the road outside El Toboso, along with Queen Guinevere and her duenna Quintañona.

  Sancho, who invented that enchantment himself, nearly dies of laughter and decides his master is completely mad. Don Quijote goes on: Dulcinea fled from him, but one of her companions came to ask, in her name, for a loan of six reals on a new cotton petticoat. He gave the four he had, sent a message vowing, like the Marquis of Mantua, to roam the world until he disenchanted her, and the girl, instead of curtsying, cut a caper two yards into the air. Sancho begs his master to look to his honour and stop believing such nonsense; Don Quijote answers that Sancho speaks out of love and inexperience, and that in time he will tell him things that prove it all true.
context: |
  A chapter that doubts itself. The heading says outright that the 'impossibility and greatness' of what Don Quijote tells make the adventure be taken for 'apócrifa', not authentic. For the first time the history's own title casts doubt on its hero's account, and Cervantes gives the reader three ways to explain it, voiced by the three listeners: it was a dream (Don Quijote himself says he fell into a deep sleep on the coil of rope before waking in the meadow, and he was below little more than an hour), it was a lie (the cousin asks whether he could have had time to invent so many), or it was put into his head by enchanters (Sancho's view). The narrator never settles the question. The cave was real, and the reader saw in the previous chapter that Don Quijote came up apparently asleep.

  The ballad world. Montesinos, Durandarte and Belerma come from the Spanish ballads of the Carolingian cycle, which every reader of 1615 knew. Ormsby notes that Montesinos appears in half a dozen ballads but in none of the French romances, that he was one of the Peers, born in a forest ('monte', hence his name), and that his name was attached to the cave from early times; Durandarte and Belerma too are found only in the Spanish ballads, and Durandarte's name may echo Durendal, Roland's sword. In the best-known ballad Durandarte, dying at Roncesvalles, asks his cousin to cut out his heart and carry it to Belerma; the lines he speaks from the tomb ('¡Oh, mi primo Montesinos!') adapt that ballad, as Ormsby notes. Merlin, the enchanter of the Arthurian stories, has wandered into this Carolingian tale; Ormsby recalls that Malory calls him 'a devil's son'. Cervantes treats the material with deadpan literalness: the 'little dagger' was really a poniard, Sancho guesses the cutler, the heart weighed two pounds, it was salted on the road so as not to smell, Belerma is plain and sallow, and her looks are explained by grief, not by her monthly courses, which she has not had for years.

  Lakes and rivers of La Mancha. Montesinos turns the real landscape into myth, in the manner of Ovid's transformations that the cousin wants to imitate: the duenna Ruidera and her daughters and nieces become the lakes of Ruidera, and the squire Guadiana becomes the river that rises from them, dives underground in his grief and comes up again further on. Ormsby, who walked the valley, counted eleven lakes and notes that the number is variously given (Cervantes himself spoke of seven in chapter 18 of this Part); the Guadiana really does vanish near Argamasilla and reappear seven or eight leagues away at the Ojos del Guadiana, near Daimiel. The claim that seven lakes belong to the kings of Spain and two to the Order of St John refers to who held the land; Ormsby notes that Castile and Murcia met in the upper valley. The coarse fish of the Guadiana are set against the golden Tagus, the river of Toledo whose sands were said to carry gold.

  Sancho's lie comes home. In chapter 10 Sancho passed off a village girl on a donkey as Dulcinea and persuaded his master that enchanters had disguised her. Now Don Quijote reports seeing in the cave the same three country girls, skipping like goats, and Sancho, who knows he was the 'enchanter', concludes that his master is completely mad. The scene deflates the chivalric vision with money: the enchanted lady sends to borrow six reals on the security of a cotton petticoat, as poor people pawned clothing, and Montesinos remarks that need reaches even the enchanted. Don Quijote has only four reals, the ones Sancho gave him for alms, and wishes he were a Fúcar, the Spanish form, Ormsby explains, of Fugger, the great Augsburg banking family who lent to the Spanish crown. His vow imitates that of the Marquis of Mantua, who swore over his dying nephew Baldovinos not to eat bread off a tablecloth until he avenged him, the ballad Don Quijote recited in Part I; the Infante Don Pedro of Portugal was the hero of a popular book of travels through the four quarters of the world (Ormsby gives an edition of 1570). Guinevere and her duenna Quintañona come from the ballad of Lanzarote, whose line 'cuando de Bretaña vino' Don Quijote adapted to himself in Part I, chapter 2 ('cuando de su aldea vino'); he named Quintañona in Part I, chapter 13.

  Time and the enchanted. The quarrel over whether Don Quijote was gone one hour or three days echoes the old belief that time runs differently in the otherworld. His answers about the enchanted (they do not eat, sleep or produce 'escrementos mayores', yet their nails, beards and hair grow, as people believed of the dead) are his own reasoning from what he says he saw, and Sancho caps them with the proverb 'dime con quién andas, decirte he quién eres'.

  Reading Cervantes' Spanish. Archaisms in this chapter: desta, deste, desto, desa, dese, della, dellas, dél (de esta, de este, de esto, de esa, de ese, de ella, de ellas, de él), escura (oscura), mesmo and asimesmo (mismo, asimismo), agora (ahora), sospira (suspira), contino (continuo), encantamento (encantamiento), satisfación (satisfacción), recebí (recibí), estrañas (extrañas), escrementos (excrementos), espirar (expirar), stupendo (estupendo), luengos (largos) and vuesa merced beside vuestra merced. The old vosotros endings appear in descolgásedes, enviábades, debistes and mandastes (modern descolgaseis, enviabais, debisteis, mandasteis). Pronouns hang on verbs that open a clause: Éntrale, Ofrecióseme, limpiémelos, ceñíale, cubríale, Llegóse, tiénele, Respondióme, Oyéronse, Díjome, Vanle, Conocíla, Habléla, Suspendióme, Diréisle. 'ha' and 'había' mean 'ago' (Luengos tiempos ha, ¿Cuánto ha que bajé?, pocos días había), the future subjunctive marks an open future (fuere, tuviere, anduviere), the -ra form stands for the conditional (igualara, mordiera, hiciera), and the future can still be split around a pronoun (decirte he = te diré). Watch the idioms ¡Cepos quedos! (hold it right there), paciencia y barajar (patience, and shuffle the cards), saber un punto más que el diablo, no quedarse a deber nada, por quien Dios es, and the comic words chusma, magín, máquina, vejote, cabriola and zarandajas.
