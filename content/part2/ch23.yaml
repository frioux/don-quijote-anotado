          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he (vuestra merced, 'you'). Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "le respondió", f: "respond- + -ió → responder (to answer), preterite, she. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron. 'le' = to you (vuestra merced)."}
