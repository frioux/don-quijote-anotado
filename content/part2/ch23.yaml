  - sentences:
      - es: "— Eso no puede ser —replicó don Quijote—, porque allá me anocheció y amaneció, y tornó a anochecer y amanecer tres veces; de modo que, a mi cuenta, tres días he estado en aquellas partes remotas y escondidas a la vista nuestra."
        literal: "— That not can be —replied Don Quijote—, because there on-me it-became-night and it-dawned, and it-turned to become-night and dawn three times; of manner that, at my count, three days I-have been in those parts remote and hidden to the sight ours."
        ormsby: "“That cannot be,” returned Don Quixote, “because night overtook me while I was there, and day came, and it was night again and day again three times; so that, by my reckoning, I have been three days in those remote regions beyond our ken.”"
        vocab:
          - {w: "anochecerle a uno", d: "for night to fall on someone; 'me anocheció' = night fell while I was there"}
          - {w: "amanecer", d: "to dawn; 'me amaneció' = day broke on me"}
          - {w: "tornar a", d: "to do again: 'tornó a anochecer' = night fell again"}
          - {w: "de modo que", d: "so that"}
          - {w: "a mi cuenta", d: "by my reckoning"}
          - {w: "a la vista nuestra", d: "from our sight; 'escondidas a la vista' = hidden from view"}
        diagram:
          - s: "— Eso no puede ser"
            r: "main verb 1: that cannot be"
            under:
              - {s: "—replicó don Quijote—", r: "speech tag: replied Don Quijote"}
              - s: "porque allá me anocheció y amaneció"
                r: "why: because there night fell and day broke on me"
                under:
                  - {s: "y tornó a anochecer y amanecer tres veces", r: "and: night and dawn came again three times"}
          - s: "de modo que, a mi cuenta, tres días he estado"
            r: "main verb 2: so that by my count I have been three days"
            under:
              - {s: "en aquellas partes remotas y escondidas a la vista nuestra", r: "where: in those remote parts hidden from our sight"}
        forms:
          - {w: "puede", f: "pued- + -e → poder (to be able), present, it. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "me anocheció, amaneció", f: "anochec- + -ió → anochecer (to grow dark) and amanec- + -ió → amanecer (to dawn), preterite, it, with 'me' (on me): weather verbs with the person as the one they happen to. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "tornó", f: "torn- + -ó → tornar (to return, do again), preterite, it. Same -ó preterite of -ar verbs; 'tornar a' + infinitive = to do again."}
          - {w: "he estado", f: "he = haber (to have), present, I: he, has, ha, hemos, habéis, han; + estado, participle of estar (to be): 'I have been'."}
          - {w: "escondidas", f: "escond- + -idas → esconder (to hide), participle, feminine plural to match 'partes'."}
          - {w: "nuestra", f: "nuestr- + -a → nuestro (our), feminine to match 'vista'; placed after the noun, 'the sight of ours'."}
  - sentences:
      - es: "— Verdad debe de decir mi señor —dijo Sancho—, que, como todas las cosas que le han sucedido son por encantamento, quizá lo que a nosotros nos parece un hora, debe de parecer allá tres días con sus noches."
