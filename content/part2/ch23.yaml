part: 2
chapter: 23
title_es: "Capítulo XXIII. De las admirables cosas que el estremado don Quijote contó que había visto en la profunda cueva de Montesinos, cuya imposibilidad y grandeza hace que se tenga esta aventura por apócrifa"
title_en: "Of the wonderful things the incomparable Don Quixote said he saw in the profound Cave of Montesinos, the impossibility and magnitude of which cause this adventure to be deemed apocryphal"
paragraphs:
  - sentences:
      - es: "Las cuatro de la tarde serían cuando el sol, entre nubes cubierto, con luz escasa y templados rayos, dio lugar a don Quijote para que, sin calor y pesadumbre, contase a sus dos clarísimos oyentes lo que en la cueva de Montesinos había visto. Y comenzó en el modo siguiente:"
        literal: "The four of the afternoon it-would-be when the sun, among clouds covered, with light scant and tempered rays, gave room to Don Quijote so that, without heat and weariness, he-might-tell to his two most-illustrious hearers that which in the cave of Montesinos he-had seen. And he-began in the manner following:"
        ormsby: "It was about four in the afternoon when the sun, veiled in clouds, with subdued light and tempered beams, enabled Don Quixote to relate, without heat or inconvenience, what he had seen in the cave of Montesinos to his two illustrious hearers, and he began as follows:"
        vocab:
          - {w: "serían", d: "'it would be', here 'it was about': the conditional used for a guess about the past"}
          - {w: "templado", d: "tempered, mild, softened"}
          - {w: "dar lugar a", d: "to give room to, allow, make it possible for"}
          - {w: "pesadumbre", d: "weariness, discomfort; also grief"}
          - {w: "clarísimo", d: "most illustrious (a title of honour; literally 'very bright')"}
          - {w: "oyente", d: "hearer, listener"}
          - {w: "cueva de Montesinos", d: "a real cave in La Mancha, near the lakes of Ruidera, named after Montesinos, a hero of the Carolingian ballads"}
          - {w: "en el modo siguiente", d: "in the following way, as follows"}
        diagram:
          - s: "Las cuatro de la tarde serían"
            r: "main verb 1: it would have been about four in the afternoon"
            under:
              - s: "cuando el sol"
                r: "when: when the sun"
                under:
                  - {s: "entre nubes cubierto", r: "describes 'sol': covered among clouds"}
                  - {s: "con luz escasa y templados rayos", r: "how: with dim light and mild rays"}
                  - {s: "dio lugar a don Quijote", r: "verb of 'sol': gave Don Quijote the chance"}
                  - s: "para que, sin calor y pesadumbre, contase a sus dos clarísimos oyentes"
                    r: "purpose: so that he could tell his two illustrious listeners, without heat or discomfort"
                    under:
                      - {s: "lo que en la cueva de Montesinos había visto", r: "object of 'contase': what he had seen in the cave"}
          - s: "Y comenzó"
            r: "main verb 2: and he began"
            under:
              - {s: "en el modo siguiente:", r: "how: as follows"}
        forms:
          - {w: "serían", f: "ser- + -ían → ser (to be), conditional, they (the hours): 'it would be', a guess about the past, 'it must have been about'. The conditional adds -ía endings to the whole infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "cubierto", f: "irregular participle of cubrir (to cover), masculine to match 'sol'."}
          - {w: "templados", f: "templ- + -ados → templar (to temper), participle used as an adjective, masculine plural to match 'rayos'."}
          - {w: "dio", f: "di- + -o → dar (to give), preterite, it (the sun). Irregular: di, diste, dio, dimos, disteis, dieron."}
          - {w: "contase", f: "cont- + -ase → contar (to tell), imperfect subjunctive (-se form), he, after 'para que' (so that). The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "clarísimos", f: "clar- + -ísimos → claro (bright, illustrious) + the superlative suffix -ísimo, 'most illustrious', masculine plural to match 'oyentes'."}
          - {w: "había visto", f: "hab- + -ía → haber (to have), imperfect, he: había, habías, había, habíamos, habíais, habían; + visto, irregular participle of ver (to see): pluperfect 'he had seen'."}
          - {w: "comenzó", f: "comenz- + -ó → comenzar (to begin), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (comencé, with z → c before e)."}
          - {w: "siguiente", f: "sigu- + -iente → seguir (to follow) with the adjective ending -iente: 'following'."}
        note: "The previous chapter ended with Don Quijote hauled out of the cave and promising to tell what he saw; Sancho and the cousin, the 'humanist' guide, are his two listeners. The title already warns that the adventure has been thought 'apocryphal', untrue."
  - sentences:
      - es: "— A obra de doce o catorce estados de la profundidad desta mazmorra, a la derecha mano, se hace una concavidad y espacio capaz de poder caber en ella un gran carro con sus mulas."
        literal: "— At [a] work of twelve or fourteen man-heights of the depth of-this dungeon, at the right hand, itself makes a hollow and space capable of to-be-able to-fit in it a big cart with its mules."
        ormsby: "“A matter of some twelve or fourteen times a man’s height down in this pit, on the right-hand side, there is a recess or space, roomy enough to contain a large cart with its mules."
        vocab:
          - {w: "a obra de", d: "about, roughly (an old way to give an approximate measure)"}
          - {w: "estado", d: "a man's height, used as a measure of depth (about 1.7 m), not 'state'"}
          - {w: "desta", d: "= de esta, of this (old contraction)"}
          - {w: "mazmorra", d: "dungeon, underground prison (from Arabic); here the pit of the cave"}
          - {w: "a la derecha mano", d: "on the right-hand side (modern 'a mano derecha')"}
          - {w: "hacerse", d: "here 'to form, to open up' (of a place)"}
          - {w: "concavidad", d: "hollow, recess"}
          - {w: "capaz de", d: "big enough for, able to hold (not only 'capable')"}
          - {w: "caber", d: "to fit, have room"}
        diagram:
          - s: "se hace una concavidad y espacio"
            r: "main verb: there opens a hollow and space"
            under:
              - s: "A obra de doce o catorce estados"
                r: "where: about twelve or fourteen man-heights down"
                under:
                  - {s: "de la profundidad desta mazmorra", r: "of what: into the depth of this pit"}
              - {s: "a la derecha mano", r: "where: on the right-hand side"}
              - {s: "capaz de poder caber en ella un gran carro con sus mulas", r: "describes 'concavidad': big enough to hold a large cart with its mules"}
        forms:
          - {w: "desta", f: "= de + esta, 'of this', feminine to match 'mazmorra'; Cervantes often runs de into the demonstrative."}
          - {w: "se hace", f: "hac- + -e → hacerse (to form, make itself), present, it, with 'se' (itself): 'there is formed'. hacer (to make) in the present: hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "poder caber", f: "two infinitives: poder (to be able) after 'capaz de', and caber (to fit) after poder (to be able): 'able to fit'."}
          - {w: "ella", f: "'it', feminine because it stands for 'concavidad'."}
          - {w: "gran", f: "grande (big) clipped before a singular noun ('carro')."}
      - es: "Éntrale una pequeña luz por unos resquicios o agujeros, que lejos le responden, abiertos en la superficie de la tierra."
        literal: "Enters-to-it a small light through some chinks or holes, which far to-it correspond, open in the surface of the earth."
        ormsby: "A little light reaches it through some chinks or crevices, communicating with it and open to the surface of the earth."
        vocab:
          - {w: "resquicio", d: "chink, crack, narrow opening"}
          - {w: "agujero", d: "hole"}
          - {w: "responder", d: "here 'to correspond, connect with, lead to' (of openings), not 'to answer'"}
          - {w: "superficie", d: "surface"}
        diagram:
          - s: "Éntrale una pequeña luz"
            r: "main verb: a little light enters it"
            under:
              - s: "por unos resquicios o agujeros"
                r: "how: through some chinks or holes"
                under:
                  - {s: "que lejos le responden", r: "describes 'resquicios': which connect with it from far off"}
                  - {s: "abiertos en la superficie de la tierra", r: "describes 'resquicios': open at the surface of the earth"}
        forms:
          - {w: "Éntrale", f: "entr- + -a + le → entrar (to enter), present, it (the light), with 'le' (to it, the hollow) stuck on the end; modern 'le entra'. Cervantes hangs the pronoun on a verb that opens the sentence. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "responden", f: "respond- + -en → responder (to correspond), present, they (the chinks). The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "abiertos", f: "irregular participle of abrir (to open), masculine plural to match 'resquicios o agujeros'."}
      - es: "Esta concavidad y espacio vi yo a tiempo cuando ya iba cansado y mohíno de verme, pendiente y colgado de la soga, caminar por aquella escura región abajo, sin llevar cierto ni determinado camino; y así, determiné entrarme en ella y descansar un poco."
        literal: "This hollow and space saw I at [the] time when already I-was-going tired and vexed from seeing-myself, hanging and suspended from the rope, travel through that dark region down, without carrying certain nor fixed road; and so, I-determined to-enter-myself into it and to-rest a little."
        ormsby: "This recess or space I perceived when I was already growing weary and disgusted at finding myself hanging suspended by the rope, travelling downwards into that dark region without any certainty or knowledge of where I was going, so I resolved to enter it and rest myself for a while."
        vocab:
          - {w: "a tiempo cuando", d: "just at the time when"}
          - {w: "ir cansado", d: "to be getting tired ('ir' + adjective describes an ongoing state)"}
          - {w: "mohíno", d: "vexed, sulky, fed up"}
          - {w: "pendiente", d: "hanging (not 'pending')"}
          - {w: "soga", d: "rope"}
          - {w: "escuro", d: "= oscuro, dark (old spelling)"}
          - {w: "región abajo", d: "down through the region; 'abajo' after a noun means 'down along it'"}
          - {w: "determinado", d: "fixed, definite; 'determinar' = to decide"}
        diagram:
          - s: "Esta concavidad y espacio vi yo"
            r: "main verb 1: this hollow and space I saw (object put first)"
            under:
              - s: "a tiempo cuando ya iba cansado y mohíno"
                r: "when: just when I was getting tired and fed up"
                under:
                  - s: "de verme"
                    r: "why: of seeing myself"
                    under:
                      - {s: "pendiente y colgado de la soga", r: "describes 'me': hanging from the rope"}
                      - {s: "caminar por aquella escura región abajo", r: "what he saw himself do: travel down through that dark region"}
                      - {s: "sin llevar cierto ni determinado camino", r: "how: without any sure or fixed way"}
          - s: "y así, determiné"
            r: "main verb 2: and so I decided"
            under:
              - {s: "entrarme en ella y descansar un poco", r: "what he decided: to go into it and rest a little"}
        forms:
          - {w: "vi", f: "v- + -i → ver (to see), preterite, I. Irregular: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "iba cansado", f: "iba → ir (to go), imperfect, I: iba, ibas, iba, íbamos, ibais, iban; with the participle cansado (tired) it means 'I was getting tired'."}
          - {w: "verme", f: "ver (to see) + me (myself), the pronoun hung on the infinitive after 'de': 'of seeing myself'."}
          - {w: "colgado", f: "colg- + -ado → colgar (to hang), participle, masculine to match 'yo'."}
          - {w: "escura", f: "= oscura (dark), feminine to match 'región'; old spelling."}
          - {w: "determiné", f: "determin- + -é → determinar (to decide), preterite, I. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "entrarme", f: "entrar (to enter) + me (myself), pronoun hung on the infinitive: 'to go in'. The reflexive adds a sense of 'take myself into'."}
      - es: "Di voces, pidiéndoos que no descolgásedes más soga hasta que yo os lo dijese, pero no debistes de oírme."
        literal: "I-gave shouts, asking-you that not you-should-let-down more rope until that I to-you it should-say, but not you-must of to-hear-me."
        ormsby: "I called out, telling you not to let out more rope until I bade you, but you cannot have heard me."
        vocab:
          - {w: "dar voces", d: "to shout, call out"}
          - {w: "descolgar", d: "to let down, lower (on a rope)"}
          - {w: "descolgásedes", d: "= descolgaseis, old ending -ades for 'you all'"}
          - {w: "debistes", d: "= debisteis, old ending for 'you all' in the preterite"}
          - {w: "deber de", d: "must (probability): 'no debistes de oírme' = you must not have heard me"}
        diagram:
          - s: "Di voces"
            r: "main verb 1: I shouted"
            under:
              - s: "pidiéndoos"
                r: "how: asking you"
                under:
                  - {s: "que no descolgásedes más soga", r: "what he asked: not to let down more rope"}
                  - {s: "hasta que yo os lo dijese", r: "until when: until I told you"}
          - {s: "pero no debistes de oírme", r: "main verb 2: but you must not have heard me"}
        forms:
          - {w: "Di", f: "d- + -i → dar (to give), preterite, I. Irregular: di, diste, dio, dimos, disteis, dieron."}
          - {w: "pidiéndoos", f: "pidiendo, gerund of pedir (to ask; the e of the stem becomes i), + os (you all) stuck on the end, with an accent added to keep the stress."}
          - {w: "descolgásedes", f: "descolg- + -ásedes → descolgar (to let down), imperfect subjunctive (-se form), you all, after 'pedir que'. Old ending -ásedes for modern -aseis: -ase, -ases, -ase, -ásemos, -aseis (old -ásedes), -asen."}
          - {w: "os lo dijese", f: "dij- + -ese → decir (to say), imperfect subjunctive (-se form), I, after 'hasta que' about a future-in-the-past. dijese, dijeses, dijese, dijésemos, dijeseis, dijesen. 'os' = to you all, 'lo' = it."}
          - {w: "debistes de oírme", f: "deb- + -istes → deber (must), preterite, you all, old form of 'debisteis': debí, debiste, debió, debimos, debisteis (old debistes), debieron; 'deber de' + infinitive = probability. oír (to hear) + me (me) hung on the infinitive."}
      - es: "Fui recogiendo la soga que enviábades, y, haciendo della una rosca o rimero, me senté sobre él, pensativo además, considerando lo que hacer debía para calar al fondo, no teniendo quién me sustentase;"
        literal: "I-went gathering-in the rope that you-were-sending, and, making of-it a coil or pile, myself I-sat upon it, thoughtful exceedingly, considering that which to-do I-ought to-get-down to-the bottom, not having who me might-hold-up;"
        ormsby: "I then gathered in the rope you were sending me, and making a coil or pile of it I seated myself upon it, ruminating and considering what I was to do to lower myself to the bottom, having no one to hold me up;"
        vocab:
          - {w: "ir + gerund", d: "'fui recogiendo' = I went on gathering, I gradually gathered in"}
          - {w: "enviábades", d: "= enviabais, you all were sending (old ending -ábades)"}
          - {w: "della", d: "= de ella, of it (the rope)"}
          - {w: "rosca", d: "coil, ring (also a ring-shaped loaf)"}
          - {w: "rimero", d: "pile, heap"}
          - {w: "además", d: "here 'exceedingly, very' (old sense), not 'besides'"}
          - {w: "calar", d: "to get down to, penetrate, reach the bottom"}
          - {w: "sustentar", d: "to hold up, support"}
        diagram:
          - s: "Fui recogiendo la soga"
            r: "main verb 1: I gathered in the rope"
            under:
              - {s: "que enviábades", r: "describes 'soga': that you were sending down"}
          - s: "me senté sobre él"
            r: "main verb 2 (after 'y'): I sat down on it"
            under:
              - {s: "haciendo della una rosca o rimero", r: "how: making a coil or heap of it"}
              - {s: "pensativo además", r: "describes 'me': deep in thought"}
              - s: "considerando lo que hacer debía"
                r: "how: considering what I ought to do"
                under:
                  - {s: "para calar al fondo", r: "why: to get down to the bottom"}
              - {s: "no teniendo quién me sustentase", r: "why: having no one to hold me up"}
        forms:
          - {w: "Fui recogiendo", f: "fui → ir (to go), preterite, I: fui, fuiste, fue, fuimos, fuisteis, fueron; + recogiendo, gerund of recoger (to gather in): 'I went on gathering'."}
          - {w: "enviábades", f: "envi- + -ábades → enviar (to send), imperfect, you all; old ending for modern 'enviabais'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais (old -ábades), -aban."}
          - {w: "haciendo", f: "hac- + -iendo → hacer (to make), gerund: 'making'."}
          - {w: "della", f: "= de + ella, 'of it', feminine for 'la soga'."}
          - {w: "me senté", f: "sent- + -é → sentarse (to sit down), preterite, I, with 'me' (myself). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "él", f: "'it', masculine because it stands for 'rimero', the nearer noun."}
          - {w: "hacer debía", f: "deb- + -ía → deber (ought), imperfect, I: 'I ought to do'; the infinitive hacer (to do) is put before it, an old word order. The imperfect of -er verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "teniendo", f: "ten- + -iendo → tener (to have), gerund: 'having (no one)'."}
          - {w: "sustentase", f: "sustent- + -ase → sustentar (to hold up), imperfect subjunctive (-se form), he (anyone), after 'no tener quién': no such person existed. The -se forms of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
      - es: "y, estando en este pensamiento y confusión, de repente y sin procurarlo, me salteó un sueño profundísimo;"
        literal: "and, being in this thought and confusion, of sudden and without seeking-it, me assailed a sleep most-deep;"
        ormsby: "and as I was thus deep in thought and perplexity, suddenly and without provocation a profound sleep fell upon me,"
        vocab:
          - {w: "de repente", d: "suddenly"}
          - {w: "procurar", d: "to try for, seek (not 'to procure')"}
          - {w: "saltear", d: "to waylay, ambush (as a highwayman, 'salteador', does); here sleep 'ambushes' him"}
        diagram:
          - s: "me salteó un sueño profundísimo"
            r: "main verb: a very deep sleep ambushed me"
            under:
              - {s: "estando en este pensamiento y confusión", r: "when: while I was in this thought and confusion"}
              - {s: "de repente y sin procurarlo", r: "how: suddenly and without my seeking it"}
        forms:
          - {w: "estando", f: "est- + -ando → estar (to be), gerund: 'being, while I was'."}
          - {w: "procurarlo", f: "procurar (to seek) + lo (it) hung on the infinitive after 'sin'."}
          - {w: "salteó", f: "salte- + -ó → saltear (to waylay), preterite, it (the sleep). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "profundísimo", f: "profund- + -ísimo → profundo (deep) + the superlative suffix -ísimo: 'very deep', masculine to match 'sueño'."}
      - es: "y, cuando menos lo pensaba, sin saber cómo ni cómo no, desperté dél y me hallé en la mitad del más bello, ameno y deleitoso prado que puede criar la naturaleza ni imaginar la más discreta imaginación humana."
        literal: "and, when least it I-was-thinking, without knowing how nor how not, I-awoke from-it and myself I-found in the middle of-the most beautiful, pleasant and delightful meadow that can rear the nature nor imagine the most discerning imagination human."
        ormsby: "and when I least expected it, I know not how, I awoke and found myself in the midst of the most beautiful, delightful meadow that nature could produce or the most lively human imagination conceive."
        vocab:
          - {w: "cuando menos lo pensaba", d: "when I least expected it"}
          - {w: "sin saber cómo ni cómo no", d: "without knowing how or how not, i.e. I have no idea how"}
          - {w: "dél", d: "= de él, from it (the sleep)"}
          - {w: "hallarse", d: "to find oneself"}
          - {w: "ameno", d: "pleasant, delightful (of a landscape); the 'locus amoenus' of pastoral"}
          - {w: "deleitoso", d: "delightful"}
          - {w: "criar", d: "to produce, rear, bring forth"}
          - {w: "discreto", d: "clever, discerning (a false friend: not 'discreet' only)"}
        diagram:
          - s: "desperté dél"
            r: "main verb 1: I woke from it"
            under:
              - {s: "cuando menos lo pensaba", r: "when: when I least expected it"}
              - {s: "sin saber cómo ni cómo no", r: "how: without knowing how"}
          - s: "y me hallé"
            r: "main verb 2: and I found myself"
            under:
              - s: "en la mitad del más bello, ameno y deleitoso prado"
                r: "where: in the middle of the loveliest meadow"
                under:
                  - {s: "que puede criar la naturaleza", r: "describes 'prado': that nature can produce"}
                  - {s: "ni imaginar la más discreta imaginación humana", r: "describes 'prado', 2: or the cleverest human imagination imagine"}
        forms:
          - {w: "pensaba", f: "pens- + -aba → pensar (to think), imperfect, I. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "desperté", f: "despert- + -é → despertar (to wake), preterite, I. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "dél", f: "= de + él, 'from it' (the sleep), an old contraction."}
          - {w: "me hallé", f: "hall- + -é → hallarse (to find oneself), preterite, I, with 'me'. Same -é preterite."}
          - {w: "del más bello", f: "del = de + el; 'el más bello ... prado' = the most beautiful meadow: Spanish makes the superlative with article + más."}
          - {w: "puede", f: "pued- + -e → poder (to be able), present, it (nature). The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden. It governs both 'criar' and 'imaginar'."}
          - {w: "ni", f: "'nor', used here after a superlative where English says 'or': 'than nature can produce or imagination conceive'."}
      - es: "Despabilé los ojos, limpiémelos, y vi que no dormía, sino que realmente estaba despierto;"
        literal: "I-snuffed-open the eyes, I-wiped-them-for-myself, and I-saw that not I-was-sleeping, but that really I-was awake;"
        ormsby: "I opened my eyes, I rubbed them, and found I was not asleep but thoroughly awake."
        vocab:
          - {w: "despabilar", d: "to open wide (the eyes), wake up; literally to snuff a candle so it burns brighter"}
          - {w: "limpiar", d: "to wipe, clean"}
          - {w: "despierto", d: "awake"}
        diagram:
          - {s: "Despabilé los ojos", r: "main verb 1: I opened my eyes wide"}
          - {s: "limpiémelos", r: "main verb 2: I wiped them"}
          - s: "y vi"
            r: "main verb 3: and I saw"
            under:
              - {s: "que no dormía", r: "what he saw: that I wasn't asleep"}
              - {s: "sino que realmente estaba despierto", r: "what he saw, 2: but that I was really awake"}
        forms:
          - {w: "Despabilé", f: "despabil- + -é → despabilar (to open wide, wake), preterite, I. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
