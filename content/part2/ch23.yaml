  - sentences:
      - es: "— Debía de ser —dijo a este punto Sancho— el tal puñal de Ramón de Hoces, el sevillano."
        literal: "— It-must of to-be —said at this point Sancho— the such poniard of Ramón de Hoces, the Sevillian."
        ormsby: "“That poniard must have been made by Ramón de Hoces the Sevillian,” said Sancho."
        vocab:
          - {w: "deber de", d: "must (probability): 'debía de ser' = it must have been"}
          - {w: "a este punto", d: "at this point, at this moment"}
          - {w: "el tal", d: "that, the said (pointing back to something just mentioned, often a little dismissive)"}
          - {w: "Ramón de Hoces", d: "a sword- and knife-maker of Seville, apparently famous in Cervantes' day (little is known of him)"}
        diagram:
          - s: "Debía de ser"
            r: "main verb (in the speech): it must have been"
            under:
              - {s: "el tal puñal", r: "subject: that poniard"}
              - {s: "de Ramón de Hoces, el sevillano", r: "whose: by Ramón de Hoces of Seville"}
          - {s: "dijo a este punto Sancho", r: "speech tag: said Sancho at this point"}
        forms:
          - {w: "Debía de ser", f: "deb- + -ía → deber (must), imperfect, it: debía, debías, debía, debíamos, debíais, debían; 'deber de' + ser (to be) = probability, 'it must have been'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
        note: "Sancho treats the heroic ballad as if it were local news and names a Seville knife-maker. Don Quijote's reply turns on the joke: Ramón de Hoces lived 'yesterday', Roncesvalles was centuries ago."
  - sentences:
      - es: "— No sé —prosiguió don Quijote—, pero no sería dese puñalero, porque Ramón de Hoces fue ayer, y lo de Roncesvalles, donde aconteció esta desgracia, ha muchos años; y esta averiguación no es de importancia, ni turba ni altera la verdad y contesto de la historia."
        literal: "— Not I-know —went-on Don Quijote—, but not it-would-be of-that dagger-maker, because Ramón de Hoces was yesterday, and that of Roncesvalles, where happened this misfortune, it-has many years; and this inquiry not is of importance, nor disturbs nor alters the truth and context of the story."
        ormsby: "“I do not know,” said Don Quixote; “it could not have been by that poniard maker, however, because Ramón de Hoces was a man of yesterday, and the affair of Roncesvalles, where this mishap occurred, was long ago; but the question is of no great importance, nor does it affect or make any alteration in the truth or substance of the story.”"
        vocab:
          - {w: "proseguir", d: "to go on, continue"}
          - {w: "dese", d: "= de ese, of that (old contraction)"}
          - {w: "puñalero", d: "dagger-maker, cutler"}
          - {w: "fue ayer", d: "'was yesterday': lived only recently"}
          - {w: "Roncesvalles", d: "the Pyrenean pass where, in legend, Roland and the rear-guard of Charlemagne's army were wiped out (historically in 778)"}
          - {w: "acontecer", d: "to happen"}
          - {w: "averiguación", d: "inquiry, point of investigation"}
          - {w: "turbar", d: "to disturb, upset"}
          - {w: "contesto", d: "= contexto, the thread, substance (of a story)"}
        diagram:
          - {s: "No sé", r: "main verb 1: I don't know"}
          - {s: "prosiguió don Quijote", r: "speech tag: went on Don Quijote"}
          - s: "pero no sería dese puñalero"
            r: "main verb 2: but it couldn't have been by that dagger-maker"
            under:
              - s: "porque Ramón de Hoces fue ayer"
                r: "why: because Ramón de Hoces lived yesterday"
                under:
                  - s: "y lo de Roncesvalles"
                    r: "and: and the affair of Roncesvalles"
                    under:
                      - {s: "donde aconteció esta desgracia", r: "describes 'Roncesvalles': where this misfortune happened"}
                      - {s: "ha muchos años", r: "was: many years ago"}
          - s: "y esta averiguación no es de importancia"
            r: "main verb 3: and this question is of no importance"
            under:
              - {s: "ni turba ni altera la verdad y contesto de la historia", r: "and: nor does it disturb or alter the truth and thread of the story"}
        forms:
          - {w: "sé", f: "sé → saber (to know), present, I. Irregular: sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "prosiguió", f: "prosigu- + -ió → proseguir (to go on), preterite, he; the e of the stem becomes i in this form. proseguí, proseguiste, prosiguió, proseguimos, proseguisteis, prosiguieron."}
          - {w: "sería", f: "ser- + -ía → ser (to be), conditional, it: a guess about the past, 'it would not have been'. The conditional adds -ía endings to the infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "dese", f: "= de + ese, 'of that', masculine to match 'puñalero'."}
          - {w: "fue", f: "fue → ser (to be), preterite, he. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "aconteció", f: "acontec- + -ió → acontecer (to happen), preterite, it. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "ha muchos años", f: "ha → haber (to have), present, it, used like modern 'hace' for time ago: 'many years ago'. haber (to have) in the present: he, has, ha, hemos, habéis, han."}
          - {w: "turba, altera", f: "turb- + -a → turbar (to disturb) and alter- + -a → alterar (to alter), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
