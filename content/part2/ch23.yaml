          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "se subió", f: "sub- + -ió → subirse (to climb up), preterite, you (vuestra merced, which takes the 'he' form), with 'se'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "molió", f: "mol- + -ió → moler (to grind), preterite, you (vuestra merced, 'he' form). Same -ió preterite of -er and -ir verbs."}
