          - {w: "encantamento", d: "= encantamiento, enchantment (old form)"}
          - {w: "un hora", d: "= una hora, an hour: old usage put 'un' before a feminine noun beginning with a vowel"}
          - {w: "tres días con sus noches", d: "three days and nights, three full days"}
