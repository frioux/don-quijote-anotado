              - {s: "que su señor estaba fuera de juicio y loco de todo punto", r: "what he knew: that his master was out of his mind and completely mad"}
          - {s: "y así, le dijo:", r: "main verb 2: and so he said to him"}
        forms:
          - {w: "sabía", f: "sab- + -ía → saber (to know), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
          - {w: "fingido", f: "fing- + -ido → fingir (to feign), participle used as an adjective, masculine to match 'encanto'."}
          - {w: "de quien", f: "'of which': Cervantes uses 'quien' for a thing ('encanto') as well as for people; modern Spanish would say 'del cual'."}
          - {w: "había sido", f: "había, haber (to have), imperfect, he: había, habías, había, habíamos, habíais, habían; + sido, the participle of ser (to be): pluperfect 'he had been'."}
          - {w: "acabó", f: "acab- + -ó → acabar (to finish), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. 'acabar de' + infinitive here = to end up, come at last to."}
          - {w: "conocer", f: "infinitive of conocer (to know, recognise) after 'acabó de'."}
          - {w: "indubitablemente", f: "indubitable (beyond doubt) + -mente, the ending that makes adverbs, like English -ly."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron. 'le' = to him."}
        note: "In Part II chapter 10 Sancho, sent to find Dulcinea in El Toboso, passed off three village girls on donkeys as Dulcinea and her ladies and swore that enchanters had changed her looks. Now Don Quijote claims to have seen those same three girls in the cave, so Sancho, who invented the enchantment, decides his master is completely mad."
  - sentences:
      - es: "— En mala coyuntura y en peor sazón y en aciago día bajó vuestra merced, caro patrón mío, al otro mundo, y en mal punto se encontró con el señor Montesinos, que tal nos le ha vuelto."
        literal: "— In bad juncture and in worse season and in ill-starred day went-down your grace, dear master mine, to-the other world, and in bad moment himself met with the sir Montesinos, who such to-us him has turned."
        ormsby: "“It was an evil hour, a worse season, and a sorrowful day, when your worship, dear master mine, went down to the other world, and an unlucky moment when you met with Señor Montesinos, who has sent you back to us like this."
        vocab:
          - {w: "coyuntura", d: "juncture, moment, occasion"}
          - {w: "sazón", d: "season, time"}
          - {w: "aciago", d: "ill-fated, unlucky, black (of a day)"}
          - {w: "vuestra merced", d: "'your grace', the polite 'you' (modern 'usted'), with the verb in the 'he' form"}
          - {w: "caro", d: "dear (here affectionate, not 'expensive')"}
          - {w: "patrón", d: "master, patron"}
          - {w: "el otro mundo", d: "the other world: the underworld, the world of the dead"}
          - {w: "en mal punto", d: "at an evil moment, unluckily"}
          - {w: "encontrarse con", d: "to meet, run into"}
          - {w: "tal nos le ha vuelto", d: "has sent him back to us like this, has turned him into this"}
        diagram:
          - s: "bajó vuestra merced"
            r: "main verb 1: your worship went down"
            under:
              - {s: "En mala coyuntura y en peor sazón y en aciago día", r: "when: at a bad juncture, a worse season, on an evil day"}
              - {s: "caro patrón mío", r: "addressed to: my dear master"}
              - {s: "al otro mundo", r: "where to: to the other world"}
          - s: "y en mal punto se encontró con el señor Montesinos"
            r: "main verb 2: and at an evil moment you met Señor Montesinos"
            under:
              - {s: "que tal nos le ha vuelto", r: "describes 'Montesinos': who has sent him back to us in this state"}
        forms:
          - {w: "mala, peor", f: "mal- + -a → malo (bad), feminine to match 'coyuntura'; peor = 'worse', the irregular comparative of malo."}
          - {w: "bajó", f: "baj- + -ó → bajar (to go down), preterite, he: with 'vuestra merced' (your grace) the verb takes the 'he' form though it means 'you'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "caro patrón mío", f: "mío, the long form of the possessive, placed after the noun in direct address: 'my dear master'."}
          - {w: "al", f: "a + el, the contraction modern Spanish still makes."}
          - {w: "mal", f: "malo (bad) clipped before a masculine singular noun ('punto'), like buen, gran, algún."}
          - {w: "se encontró", f: "encontr- + -ó → encontrarse (to meet), preterite, he (vuestra merced, 'you'), with 'se'. Same -ó preterite."}
          - {w: "nos le ha vuelto", f: "ha, haber (to have), present, he: he, has, ha, hemos, habéis, han; + vuelto, the irregular participle of volver (to return, turn): 'has turned, sent back'. 'nos' = to us; 'le' = him, used for a male person as direct object (leísmo), where modern Spanish prefers 'lo'."}
      - es: "Bien se estaba vuestra merced acá arriba con su entero juicio, tal cual Dios se le había dado, hablando sentencias y dando consejos a cada paso, y no agora, contando los mayores disparates que pueden imaginarse."
        literal: "Well himself was your grace here above with his whole judgment, such as God to-you it had given, speaking maxims and giving counsels at each step, and not now, telling the greatest nonsenses that can be-imagined."
        ormsby: "You were well enough here above in your full senses, such as God had given you, delivering maxims and giving advice at every turn, and not as you are now, talking the greatest nonsense that can be imagined.”"
        vocab:
          - {w: "estarse bien", d: "to be well off, comfortable where one is: 'bien se estaba' = you were fine as you were"}
          - {w: "acá arriba", d: "up here"}
          - {w: "entero juicio", d: "sound mind, full senses"}
          - {w: "tal cual", d: "just as, such as"}
          - {w: "sentencias", d: "maxims, wise sayings (a false friend: not 'sentences' in court)"}
          - {w: "a cada paso", d: "at every turn, constantly"}
          - {w: "agora", d: "= ahora, now (old form)"}
          - {w: "disparates", d: "nonsense, absurdities"}
        diagram:
          - s: "Bien se estaba vuestra merced"
            r: "main verb: your worship was well off"
            under:
              - {s: "acá arriba", r: "where: up here"}
              - s: "con su entero juicio"
                r: "how: with your mind whole"
                under:
                  - {s: "tal cual Dios se le había dado", r: "describes 'juicio': just as God had given it to you"}
              - {s: "hablando sentencias y dando consejos a cada paso", r: "how: uttering maxims and giving advice at every turn"}
              - s: "y no agora"
                r: "contrast: and not now"
                under:
                  - s: "contando los mayores disparates"
                    r: "what you do now: telling the greatest nonsense"
                    under:
                      - {s: "que pueden imaginarse", r: "describes 'disparates': that can be imagined"}
        forms:
          - {w: "se estaba", f: "est- + -aba → estarse (to be, to stay), imperfect, he (vuestra merced, 'you'): the 'se' gives 'stay contentedly'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "su", f: "'your': with 'vuestra merced' the possessive is 'su', the 'his/her' form."}
          - {w: "se le había dado", f: "había, haber (to have), imperfect, he (God): había, habías, había, habíamos, habíais, habían; + dado, the participle of dar (to give): pluperfect 'had given'. 'se' = to you (le turns into se before another le or lo); 'le' = it, the judgment (le used for a masculine thing, leísmo; modern 'se lo había dado')."}
          - {w: "hablando, dando", f: "habl- + -ando → hablar (to speak) and d- + -ando → dar (to give), gerunds: 'speaking, giving'."}
          - {w: "contando", f: "cont- + -ando → contar (to tell), gerund: 'telling'."}
          - {w: "mayores", f: "plural of mayor, the comparative of grande (big): with 'los' it means 'the greatest'."}
          - {w: "pueden imaginarse", f: "pued- + -en → poder (to be able), present, they: puedo, puedes, puede, podemos, podéis, pueden; + imaginarse, imaginar (to imagine) with 'se' hung on: 'se' makes it passive, 'can be imagined'."}
  - sentences:
      - es: "— Como te conozco, Sancho —respondió don Quijote—, no hago caso de tus palabras."
