  - sentences:
      - es: "«¡Oh, mi primo Montesinos! Lo postrero que os rogaba, que cuando yo fuere muerto, y mi ánima arrancada, que llevéis mi corazón adonde Belerma estaba, sacándomele del pecho, ya con puñal, ya con daga.»"
        literal: "«Oh, my cousin Montesinos! The last [thing] that you I-begged, that when I may-be dead, and my soul torn-out, that you-carry my heart to-where Belerma was, taking-it-out-of-me from-the breast, now with poniard, now with dagger.»"
        ormsby: "‘O cousin Montesinos! / ’Twas my last request of thee, / When my soul hath left the body, / And that lying dead I be, / With thy poniard or thy dagger / Cut the heart from out my breast, / And bear it to Belerma. / This was my last request.’"
        ormsby_note: "These are an adaptation of lines from the ballad, \"Oh Belerma! Oh Belerma! / Por mi mal fuiste engendrada.\" (Cancionero S.A. Antwerp. Duran. Romancero, No. 387) Durandarte and Belerma, like Montesinos, are only to be found in the Spanish ballads of the Carlovingian cycle; Mila y Fontanals, however, thinks that in the name of the former there may be a reminiscence of that of Roland's sword Durandal, or Durendal."
        vocab:
          - {w: "primo", d: "cousin"}
          - {w: "postrero", d: "last, final (literary)"}
          - {w: "rogar", d: "to beg, entreat"}
          - {w: "ánima", d: "soul (older, churchly form of 'alma')"}
          - {w: "arrancado", d: "torn out, wrenched out"}
