  - sentences:
      - es: "— Creo —respondió Sancho— que aquel Merlín, o aquellos encantadores que encantaron a toda la chusma que vuestra merced dice que ha visto y comunicado allá bajo, le encajaron en el magín o la memoria toda esa máquina que nos ha contado, y todo aquello que por contar le queda."
        literal: "— I-believe —answered Sancho— that that Merlin, or those enchanters who enchanted to all the rabble that your-grace says that he-has seen and conversed-with there below, to-you stuck in the noddle or the memory all that heap that to-us you-have told, and all that which for to-tell to-you remains."
        ormsby: "“I believe,” replied Sancho, “that this Merlin, or those enchanters who enchanted the whole crew your worship says you saw and discoursed with down there, stuffed your imagination or your mind with all this rigmarole you have been treating us to, and all that is still to come.”"
        vocab:
          - {w: "Merlín", d: "Merlin, the wizard of the Arthurian legends, here made the enchanter of the cave"}
          - {w: "chusma", d: "rabble, crowd (scornful; properly the convicts and slaves who rowed the galleys)"}
          - {w: "comunicar", d: "here 'to have dealings with, talk with' (a person)"}
          - {w: "allá bajo", d: "down there (modern 'allá abajo')"}
          - {w: "encajar", d: "to stuff in, cram, thrust"}
          - {w: "magín", d: "imagination, noddle, head (colloquial)"}
          - {w: "máquina", d: "here 'a huge heap, a great mass', a whole contraption (of stories), not 'machine'"}
          - {w: "por contar", d: "still to be told"}
        diagram:
          - s: "— Creo"
            r: "main verb: I believe"
            under:
              - {s: "—respondió Sancho—", r: "speech tag: answered Sancho"}
              - s: "que aquel Merlín, o aquellos encantadores"
                r: "what I believe: that Merlin or those enchanters"
                under:
                  - s: "que encantaron a toda la chusma"
                    r: "describes 'encantadores': who enchanted the whole crew"
                    under:
                      - {s: "que vuestra merced dice que ha visto y comunicado allá bajo", r: "describes 'chusma': that you say you saw and talked with down there"}
                  - s: "le encajaron en el magín o la memoria toda esa máquina"
