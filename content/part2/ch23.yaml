          - s: "las convirtió en otras tantas lagunas"
            r: "main verb 2: he turned them into as many lakes"
            under:
              - {s: "las cuales llorando", r: "object, put first: they, weeping"}
              - {s: "por compasión que debió de tener Merlín dellas", r: "why: out of the pity Merlin (the subject) must have felt for them"}
              - s: "que ahora ... las llaman las lagunas de Ruidera"
                r: "describes 'lagunas': which people now call the lagoons of Ruidera"
                under:
                  - {s: "en el mundo de los vivos y en la provincia de la Mancha", r: "where: in the world of the living, in La Mancha"}
        forms:
          - {w: "faltan", f: "falt- + -an → faltar (to be missing), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "llorando", f: "llor- + -ando → llorar (to weep), gerund: 'weeping'."}
