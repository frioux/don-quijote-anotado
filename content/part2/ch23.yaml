          - {w: "hacer caso de", d: "to pay attention to, heed, take notice of"}
        diagram:
          - s: "no hago caso de tus palabras."
            r: "main verb: I pay no heed to your words"
            under:
              - {s: "Como te conozco", r: "why: since I know you"}
              - {s: "Sancho", r: "addressed to: Sancho"}
              - {s: "respondió don Quijote", r: "speech tag: Don Quijote answered"}
        forms:
          - {w: "conozco", f: "conozc- + -o → conocer (to know), present, I. The I form adds a z: conozco, conoces, conoce, conocemos, conocéis, conocen. 'te' = you, the object."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "hago", f: "hag- + -o → hacer (to make, do), present, I. Irregular: hago, haces, hace, hacemos, hacéis, hacen."}
