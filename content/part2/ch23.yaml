  - sentences:
      - es: "— No, por cierto —respondió don Quijote—; a lo menos, en estos tres días que yo he estado con ellos, ninguno ha pegado el ojo, ni yo tampoco."
        literal: "— No, for certain —answered Don Quijote—; at the least, in these three days that I have been with them, none has stuck-together the eye, nor I either."
        ormsby: "“Certainly not,” replied Don Quixote; “at least, during those three days I was with them not one of them closed an eye, nor did I either.”"
        vocab:
          - {w: "por cierto", d: "certainly, to be sure"}
          - {w: "a lo menos", d: "at least (modern 'al menos' or 'por lo menos')"}
          - {w: "pegar el ojo", d: "to sleep a wink; literally 'to stick the eye (shut)'"}
          - {w: "ni yo tampoco", d: "nor I either"}
        diagram:
          - s: "— No, por cierto"
            r: "answer: certainly not"
            under:
              - {s: "—respondió don Quijote—", r: "speech tag: answered Don Quijote"}
          - s: "ninguno ha pegado el ojo"
            r: "main verb: none has slept a wink"
            under:
              - {s: "a lo menos", r: "limit: at least"}
              - s: "en estos tres días"
                r: "when: in these three days"
                under:
                  - {s: "que yo he estado con ellos", r: "describes 'días': that I have been with them"}
              - {s: "ni yo tampoco", r: "and: nor I either"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "estos", f: "est- + -os → este (this), masculine plural to match 'días'."}
          - {w: "he estado", f: "he = haber (to have), present, I: he, has, ha, hemos, habéis, han; + estado, participle of estar (to be): 'I have been'."}
          - {w: "ha pegado", f: "ha = haber (to have), present, he (same forms: he, has, ha, hemos, habéis, han) + pegado, participle of pegar (to stick): 'has stuck (shut)'."}
          - {w: "ninguno ... ni yo tampoco", f: "ninguno = no one, standing before the verb so no 'no' is needed; 'ni ... tampoco' doubles the negative: 'nor I either'."}
  - sentences:
      - es: "— Aquí encaja bien el refrán —dijo Sancho— de dime con quién andas, decirte he quién eres: ándase vuestra merced con encantados ayunos y vigilantes, mirad si es mucho que ni coma ni duerma mientras con ellos anduviere."
        literal: "— Here fits well the proverb —said Sancho— of tell-me with whom you-go, to-tell-you I-will who you-are: goes-about-himself your-grace with enchanted [people] fasting and wakeful, look if it-is much that neither he-eat nor he-sleep while with them he-may-go-about."
        ormsby: "“The proverb, ‘Tell me what company thou keepest and I’ll tell thee what thou art,’ is to the point here,” said Sancho; “your worship keeps company with enchanted people that are always fasting and watching; what wonder is it, then, that you neither eat nor sleep while you are with them?"
        ormsby_note: "Proverb 13."
        vocab:
          - {w: "encajar", d: "to fit, be apt (of a saying)"}
          - {w: "refrán", d: "proverb, saying"}
          - {w: "dime con quién andas, decirte he quién eres", d: "proverb: tell me who you go about with and I'll tell you who you are (modern '... y te diré quién eres')"}
          - {w: "andarse con", d: "to go about with, keep company with"}
          - {w: "ayuno", d: "fasting, having eaten nothing (adjective)"}
          - {w: "vigilante", d: "wakeful, watching, not sleeping"}
          - {w: "mirad si es mucho que", d: "see whether it's any wonder that: a way of saying 'no wonder'"}
        diagram:
          - s: "— Aquí encaja bien el refrán"
            r: "main verb 1: the proverb fits well here"
            under:
              - {s: "—dijo Sancho—", r: "speech tag: said Sancho"}
              - {s: "de dime con quién andas, decirte he quién eres", r: "describes 'refrán': the one 'tell me who you go with, I'll tell you who you are'"}
          - s: "ándase vuestra merced"
            r: "main verb 2: your grace goes about"
            under:
              - {s: "con encantados ayunos y vigilantes", r: "with whom: with enchanted people, fasting and wakeful"}
          - s: "mirad si es mucho"
            r: "main verb 3: see if it is much (a wonder)"
            under:
              - s: "que ni coma ni duerma"
                r: "what is no wonder: that you neither eat nor sleep"
                under:
                  - {s: "mientras con ellos anduviere", r: "when: while you go about with them"}
        forms:
          - {w: "encaja", f: "encaj- + -a → encajar (to fit), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "dime", f: "di (imperative of decir (to say), for tú: 'tell!') + me (to me)."}
          - {w: "andas", f: "and- + -as → andar (to go about), present, you (tú). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "decirte he", f: "decir (to say) + te (to you) + he (haber (to have), present, I): the old split future, = 'te diré', 'I will tell you'. The future was once infinitive + haber (to have), and the pronoun could still be slipped in between. diré, dirás, dirá, diremos, diréis, dirán."}
          - {w: "eres", f: "ser (to be), present, you (tú): soy, eres, es, somos, sois, son."}
          - {w: "ándase", f: "and- + -a + se → andarse (to go about), present, you (vuestra merced, with the 'he' form), with 'se' stuck on the end and an accent added; modern 'se anda'. Cervantes hangs the pronoun on a verb that opens its clause. Same -o, -as, -a present."}
          - {w: "mirad", f: "mir- + -ad → mirar (to look), imperative, you (vosotros): the vosotros imperative swaps the final -r of the infinitive for -d. Sancho turns to his hearers in general."}
          - {w: "coma, duerma", f: "com- + -a → comer (to eat) and duerm- + -a → dormir (to sleep), present subjunctive, you (vuestra merced, 'he' form), after 'si es mucho que'. The present subjunctive of -er and -ir verbs: -a, -as, -a, -amos, -áis, -an (duerma, duermas, duerma, durmamos, durmáis, duerman)."}
          - {w: "anduviere", f: "anduv- + -iere → andar (to go about), future subjunctive, you (vuestra merced, 'he' form): 'while you may go about'. Built on the preterite anduvieron: anduviere, anduvieres, anduviere, anduviéremos, anduviereis, anduvieren. Cervantes uses it for an open future after 'mientras', 'si', 'donde'; modern Spanish has the present subjunctive 'ande'."}
        note: "Ormsby's 'Proverb 13' refers to his numbered list of the proverbs in the book. 'Dime con quién andas, y te diré quién eres' (you are known by the company you keep) is still current; Sancho applies it literally: living with people who never eat or sleep, his master has stopped eating and sleeping too."
      - es: "Pero perdóneme vuestra merced, señor mío, si le digo que de todo cuanto aquí ha dicho, lléveme Dios, que iba a decir el diablo, si le creo cosa alguna."
        literal: "But pardon-me your-grace, sir mine, if to-you I-say that of all as-much-as here you-have said, may-take-me God, for I-was-going to say the devil, if you I-believe thing any."
        ormsby: "But forgive me, señor, if I say that of all this you have told us now, may God take me—I was just going to say the devil—if I believe a single particle.”"
        vocab:
          - {w: "todo cuanto", d: "all that, everything that"}
          - {w: "lléveme Dios", d: "may God take me, strike me dead (an oath); Sancho nearly says 'el diablo', the commoner form"}
          - {w: "cosa alguna", d: "anything at all; after a negative or in an oath 'alguna' placed after the noun means 'not any'"}
        diagram:
          - s: "Pero perdóneme vuestra merced"
            r: "main verb: but forgive me, your grace"
            under:
              - {s: "señor mío", r: "addressed to: sir"}
              - s: "si le digo"
                r: "condition: if I tell you"
                under:
                  - s: "que de todo cuanto aquí ha dicho"
                    r: "what I tell: that of everything you have said here"
                    under:
                      - s: "lléveme Dios"
                        r: "oath: may God take me"
                        under:
                          - {s: "que iba a decir el diablo", r: "aside: for I was going to say the devil"}
                      - {s: "si le creo cosa alguna", r: "the oath's condition: if I believe a thing of it"}
        forms:
          - {w: "perdóneme vuestra merced", f: "perdon- + -e + me → perdonar (to forgive), present subjunctive, you (vuestra merced, which takes the 'he' form), with 'me' stuck on the end and an accent added: polite command 'forgive me'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "ha dicho", f: "ha = haber (to have), present, you (vuestra merced, 'he' form): he, has, ha, hemos, habéis, han; + dicho, irregular participle of decir (to say): 'you have said'."}
          - {w: "lléveme", f: "llev- + -e + me → llevar (to take, carry off), present subjunctive, he (God), with 'me' on the end: a wish or curse, 'may (God) take me'. Same -e subjunctive of -ar verbs. A subjunctive that opens its clause as a wish takes the pronoun on the end."}
          - {w: "iba a decir", f: "iba = ir (to go), imperfect, I: iba, ibas, iba, íbamos, ibais, iban; + a + decir (to say): 'I was going to say'."}
          - {w: "le creo", f: "cre- + -o → creer (to believe), present, I. The present of -er verbs: -o, -es, -e, -emos, -éis, -en. 'le' = you (vuestra merced), the person believed."}
  - sentences:
      - es: "— ¿Cómo no? —dijo el primo—, pues ¿había de mentir el señor don Quijote, que, aunque quisiera, no ha tenido lugar para componer e imaginar tanto millón de mentiras?"
        literal: "— How not? —said the cousin—, well was-he-to lie the señor Don Quijote, who, even-if he-wanted, not has had place to compose and imagine so-much million of lies?"
        ormsby: "“What!” said the cousin, “has Señor Don Quixote, then, been lying? Why, even if he wished it he has not had time to imagine and put together such a host of lies.”"
        vocab:
          - {w: "¿cómo no?", d: "what! how can that be? (protesting), not 'of course'"}
          - {w: "haber de", d: "to be (supposed) to: '¿había de mentir?' = would he lie? was he going to lie?"}
          - {w: "tener lugar para", d: "to have time, opportunity to (not 'to take place')"}
          - {w: "componer", d: "to make up, put together (a story)"}
          - {w: "e", d: "'and', the form of 'y' before a word beginning with i-"}
          - {w: "tanto millón de", d: "so many millions of, such a host of"}
        diagram:
          - {s: "— ¿Cómo no?", r: "exclamation: what!"}
          - {s: "—dijo el primo—", r: "speech tag: said the cousin"}
          - s: "pues ¿había de mentir el señor don Quijote"
            r: "main verb: why, would Señor Don Quijote lie"
            under:
              - s: "que, aunque quisiera, no ha tenido lugar"
                r: "describes 'don Quijote': who, even if he wished, has not had time"
                under:
                  - {s: "para componer e imaginar tanto millón de mentiras?", r: "for what: to make up and invent so many millions of lies"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "había de mentir", f: "hab- + -ía → haber (to have), imperfect, he: había, habías, había, habíamos, habíais, habían; + de + mentir (to lie): 'haber de' expresses what is expected or bound to happen, 'was he to lie?'"}
          - {w: "quisiera", f: "quis- + -iera → querer (to want), imperfect subjunctive (-ra form), he, after 'aunque' for an unreal supposition: 'even if he wanted to'. quisiera, quisieras, quisiera, quisiéramos, quisierais, quisieran."}
          - {w: "ha tenido", f: "ha = haber (to have), present, he: he, has, ha, hemos, habéis, han; + tenido, participle of tener (to have): 'he has had'."}
          - {w: "componer, imaginar", f: "infinitives after 'para': componer (to put together) and imaginar (to imagine)."}
