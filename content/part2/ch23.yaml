          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "le han sucedido", f: "han = haber (to have), present, they: he, has, ha, hemos, habéis, han; + sucedido, participle of suceder (to happen): 'have happened'; 'le' = to him."}
