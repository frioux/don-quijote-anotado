  - sentences:
      - es: "— Ni yo tampoco de las de vuestra merced —replicó Sancho—, siquiera me hiera, siquiera me mate por las que le he dicho, o por las que le pienso decir si en las suyas no se corrige y enmienda."
        literal: "— Nor I either of those of your grace —replied Sancho—, whether me he-may-wound, whether me he-may-kill for those that to-him I-have said, or for those that to-him I-intend to-say if in the his-own not himself he-corrects and amends."
        ormsby: "“Nor I your worship’s,” said Sancho, “whether you beat me or kill me for those I have spoken, and will speak if you don’t correct and mend your own."
        vocab:
          - {w: "ni yo tampoco", d: "nor I either"}
          - {w: "vuestra merced", d: "'your grace', the polite 'you' (modern 'usted'), with the verb and pronouns of 'he'"}
          - {w: "siquiera, siquiera", d: "whether X or Y, even if X or even if Y"}
          - {w: "herir", d: "to wound, strike"}
          - {w: "pensar + infinitive", d: "to intend to, mean to"}
          - {w: "corregirse y enmendarse", d: "to correct oneself and mend one's ways"}
        diagram:
          - s: "Ni yo tampoco"
            r: "main clause, verb understood from Don Quijote's 'hago caso': nor do I either (heed)"
            under:
              - {s: "de las de vuestra merced", r: "of what: of your worship's (words)"}
              - {s: "replicó Sancho", r: "speech tag: Sancho replied"}
              - s: "siquiera me hiera, siquiera me mate"
                r: "concession: even if you wound me, even if you kill me"
                under:
                  - {s: "por las que le he dicho", r: "for what: for the words I have said to you"}
                  - s: "o por las que le pienso decir"
                    r: "or for: for those I mean to say to you"
                    under:
                      - {s: "si en las suyas no se corrige y enmienda", r: "condition: if you do not correct and mend yourself in yours"}
        forms:
          - {w: "las", f: "feminine plural, standing for 'palabras' (words): 'those'. Also in 'por las que' twice and 'las suyas'."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "hiera", f: "hier- + -a → herir (to wound), present subjunctive, he (vuestra merced, 'you'): 'even if you wound'. The stem e becomes ie when stressed: hiera, hieras, hiera, hiramos, hiráis, hieran. Subjunctive after 'siquiera' (even if)."}
          - {w: "mate", f: "mat- + -e → matar (to kill), present subjunctive, he (vuestra merced). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "he dicho", f: "he, haber (to have), present, I: he, has, ha, hemos, habéis, han; + dicho, the irregular participle of decir (to say): 'I have said'. 'le' = to you (vuestra merced takes 'le', the 'him' pronoun)."}
          - {w: "pienso", f: "piens- + -o → pensar (to think, intend), present, I. The stem e becomes ie when stressed: pienso, piensas, piensa, pensamos, pensáis, piensan. Followed by the infinitive 'decir' (to say)."}
          - {w: "suyas", f: "suy- + -as → suyo (his, yours), feminine plural to match 'palabras' understood: 'yours', said to vuestra merced."}
          - {w: "se corrige", f: "corrig- + -e → corregirse (to correct oneself), present, he (vuestra merced). The stem e becomes i, and g becomes j before o: corrijo, corriges, corrige, corregimos, corregís, corrigen."}
          - {w: "enmienda", f: "enmiend- + -a → enmendarse (to mend one's ways), present, he. The stem e becomes ie when stressed: enmiendo, enmiendas, enmienda, enmendamos, enmendáis, enmiendan. The 'se' before 'corrige' serves both verbs."}
