  - sentences:
      - es: "— Yo no sé, señor don Quijote, cómo vuestra merced en tan poco espacio de tiempo como ha que está allá bajo, haya visto tantas cosas y hablado y respondido tanto."
        literal: "— I not know, sir Don Quijote, how your-grace in so little space of time as it-has-been that he-is there below, may-have seen so-many things and spoken and answered so-much."
        ormsby: "“I cannot understand, Señor Don Quixote,” remarked the cousin here, “how it is that your worship, in such a short space of time as you have been below there, could have seen so many things, and said and answered so much.”"
        vocab:
          - {w: "tan poco espacio de tiempo", d: "so short a space of time"}
          - {w: "como ha que", d: "as it is since: 'tan poco ... como ha que está' = as short as the time you have been"}
          - {w: "allá bajo", d: "down there (modern 'allá abajo')"}
        diagram:
          - s: "Yo no sé"
            r: "main verb: I don't know"
            under:
              - {s: "señor don Quijote", r: "addressed to"}
              - s: "cómo vuestra merced"
                r: "what I don't know: how your grace"
                under:
                  - s: "en tan poco espacio de tiempo"
                    r: "when: in so short a time"
                    under:
                      - {s: "como ha que está allá bajo", r: "compared with: as you have been down there"}
                  - {s: "haya visto tantas cosas y hablado y respondido tanto", r: "verb: can have seen so many things and spoken and answered so much"}
        forms:
          - {w: "sé", f: "saber (to know), present, I: sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "ha que está", f: "ha = haber (to have), present, it, in the old sense of 'hace' (it is ... since): he, has, ha, hemos, habéis, han. está = estar (to be), present, you (vuestra merced, with the 'he' form): estoy, estás, está, estamos, estáis, están. Literally 'as it is (since) you are down there'."}
          - {w: "haya visto", f: "hay- + -a → haber (to have), present subjunctive, you (vuestra merced, 'he' form): haya, hayas, haya, hayamos, hayáis, hayan; + visto, irregular participle of ver (to see): 'can have seen'. Subjunctive because the speaker doubts it."}
          - {w: "hablado, respondido", f: "participles of hablar (to speak) and responder (to answer), still governed by 'haya': 'have spoken and answered'."}
          - {w: "tantas", f: "tant- + -as → tanto (so many), feminine plural to match 'cosas'; the plain 'tanto' after 'respondido' means 'so much'."}
