      - es: "solamente faltan Ruidera y sus hijas y sobrinas, las cuales llorando, por compasión que debió de tener Merlín dellas, las convirtió en otras tantas lagunas, que ahora, en el mundo de los vivos y en la provincia de la Mancha, las llaman las lagunas de Ruidera;"
        literal: "only are-missing Ruidera and her daughters and nieces, the which weeping, through compassion that must have had Merlin of-them, them he-turned into as-many lagoons, which now, in the world of the living and in the province of La Mancha, them they-call the lagoons of Ruidera;"
        ormsby: "Ruidera and her daughters and nieces alone are missing, and these, because of the tears they shed, Merlin, out of the compassion he seems to have felt for them, changed into so many lakes, which to this day in the world of the living, and in the province of La Mancha, are called the Lakes of Ruidera."
        ormsby_note: "The number of the lakes of Ruidera is variously stated. In Chapter XVIII Cervantes himself speaks of seven; here he makes them ten, if Ruidera herself is to be included. Clemencín says there are fifteen. Pascual Madoz, in his Geographical Dictionary of Spain, says fifteen in one place, and fourteen in another. Ford, in the Handbook, says there are eleven, which was the number I counted in a ramble down the valley some years ago. Most of them are mere tarns, but two or three are of considerable extent, the largest, La Colgada, being about two miles long. In most instances there is no visible communication between them. It is strange that Cervantes, who so often bestows wood and water, hills and vales, on Don Quixote's parched, flat, treeless country, should not have a word to say for this pretty winding valley, with its succession of Claude-like vistas that would charm the eye anywhere, but here, after the bare brown steppes of La Mancha, seem veritable landscapes of Arcadia."
        vocab:
          - {w: "faltar", d: "to be missing, be absent"}
          - {w: "las cuales llorando", d: "'they weeping', i.e. because they wept (a loose construction)"}
          - {w: "dellas", d: "= de ellas, for them, of them (old contraction)"}
          - {w: "otras tantas", d: "as many (again), the same number of"}
          - {w: "laguna", d: "lagoon, small lake"}
          - {w: "lagunas de Ruidera", d: "a chain of small lakes in La Mancha, near the cave of Montesinos, from which the Guadiana flows"}
        diagram:
