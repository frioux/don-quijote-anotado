        literal: "Were-listening-to the cousin and Sancho the words of Don Quijote, who them was-saying as if with pain immense them he-drew-out from the bowels."
        ormsby: "The cousin and Sancho Panza listened with deep attention to the words of Don Quixote, who uttered them as though with immense pain he drew them up from his very bowels."
        vocab:
          - {w: "escuchar", d: "to listen to (takes a direct object: no 'to')"}
          - {w: "entrañas", d: "bowels, entrails; the innermost depths of a person"}
        diagram:
          - s: "Escuchaban"
            r: "main verb: were listening to"
            under:
              - {s: "el primo y Sancho", r: "subject: the cousin and Sancho"}
              - s: "las palabras de don Quijote"
                r: "object: Don Quijote's words"
                under:
                  - s: "que las decía"
                    r: "describes 'don Quijote': who spoke them"
                    under:
                      - {s: "como si con dolor inmenso las sacara de las entrañas", r: "how: as if with immense pain he dragged them from his bowels"}
        forms:
          - {w: "Escuchaban", f: "escuch- + -aban → escuchar (to listen to), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "decía", f: "dec- + -ía → decir (to say), imperfect, he: decía, decías, decía, decíamos, decíais, decían. 'que las decía' = who said them; 'las' repeats 'palabras'."}
          - {w: "sacara", f: "sac- + -ara → sacar (to draw out), imperfect subjunctive (-ra form), he, required after 'como si' (as if). The -ra form of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran."}
      - es: "Suplicáronle les diese a entender lo que decía, y les dijese lo que en aquel infierno había visto."
        literal: "They-begged-him [that] to-them he-should-give to understand that which he-was-saying, and to-them he-should-tell that which in that hell he-had seen."
        ormsby: "They begged of him to explain himself, and tell them what he had seen in that hell down there."
        vocab:
          - {w: "suplicar", d: "to beg, implore; Cervantes often drops the 'que' after it"}
          - {w: "dar a entender", d: "to explain, make understood"}
          - {w: "infierno", d: "hell"}
        diagram:
          - s: "Suplicáronle"
            r: "main verb: they begged him"
            under:
              - s: "les diese a entender lo"
                r: "what they begged, 1: to explain to them what"
                under:
                  - {s: "que decía", r: "describes 'lo': what he was saying"}
              - s: "y les dijese lo"
                r: "what they begged, 2: and to tell them what"
                under:
                  - {s: "que en aquel infierno había visto", r: "describes 'lo': what he had seen in that hell"}
        forms:
          - {w: "Suplicáronle", f: "suplic- + -aron + le → suplicar (to beg), preterite, they, with 'le' (him) stuck on the end; modern 'le suplicaron'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. Cervantes often hangs object pronouns on a verb that opens its clause, adding a written accent to keep the stress."}
          - {w: "diese", f: "di- + -ese → dar (to give), imperfect subjunctive (-se form), he: subjunctive after a request. diese, dieses, diese, diésemos, dieseis, diesen."}
          - {w: "decía", f: "dec- + -ía → decir (to say), imperfect, he. decía, decías, decía, decíamos, decíais, decían."}
          - {w: "dijese", f: "dij- + -ese → decir (to tell), imperfect subjunctive (-se form), he. dijese, dijeses, dijese, dijésemos, dijeseis, dijesen."}
          - {w: "había visto", f: "había, haber (to have), imperfect, he: había, habías, había, habíamos, habíais, habían; + visto, the irregular participle of ver (to see): pluperfect 'he had seen'."}
  - sentences:
      - es: "— ¿Infierno le llamáis? —dijo don Quijote—; pues no le llaméis ansí, porque no lo merece, como luego veréis."
        literal: "— Hell it you-call? —said Don Quijote—; well not it you-should-call thus, because not it it-deserves, as presently you-will-see."
        ormsby: "“Hell do you call it?” said Don Quixote; “call it by no such name, for it does not deserve it, as ye shall soon see.”"
        vocab:
          - {w: "ansí", d: "= así, so, thus (old form)"}
          - {w: "luego", d: "soon, presently (in Cervantes often 'at once')"}
          - {w: "merecer", d: "to deserve"}
        diagram:
          - s: "¿Infierno le llamáis?"
            r: "question: do you call it hell?"
          - {s: "dijo don Quijote", r: "speech tag: said Don Quijote"}
          - s: "pues no le llaméis ansí"
            r: "main verb 2: then do not call it so"
            under:
              - {s: "porque no lo merece", r: "why: because it does not deserve it"}
              - {s: "como luego veréis", r: "as: as you will soon see"}
        forms:
          - {w: "llamáis", f: "llam- + -áis → llamar (to call), present, you (vosotros, plural familiar): llamo, llamas, llama, llamamos, llamáis, llaman. 'le' = it (the place): 'le' used for a masculine thing, beside the leísmo of persons."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "no le llaméis", f: "llam- + -éis → llamar (to call), present subjunctive, you (vosotros): a negative command, 'do not call'. llame, llames, llame, llamemos, llaméis, llamen. Spanish uses the subjunctive, not the imperative, for 'don't'."}
          - {w: "merece", f: "merec- + -e → merecer (to deserve), present, it. merezco, mereces, merece, merecemos, merecéis, merecen."}
          - {w: "veréis", f: "ver- + -éis → ver (to see), future, you (vosotros). The future adds endings to the whole infinitive: veré, verás, verá, veremos, veréis, verán."}
  - sentences:
      - es: "Pidió que le diesen algo de comer, que traía grandísima hambre."
        literal: "He-asked that to-him they-should-give something of to-eat, for he-brought very-great hunger."
        ormsby: "He then begged them to give him something to eat, as he was very hungry."
        vocab:
          - {w: "algo de comer", d: "something to eat"}
          - {w: "traer hambre", d: "to be hungry (literally 'to bring hunger')"}
        diagram:
          - s: "Pidió"
            r: "main verb: he asked"
            under:
              - {s: "que le diesen algo de comer", r: "what he asked: that they give him something to eat"}
              - {s: "que traía grandísima hambre", r: "why: for he was very hungry"}
        forms:
          - {w: "Pidió", f: "pid- + -ió → pedir (to ask for), preterite, he. The e of the stem turns to i in the he/she and they forms: pedí, pediste, pidió, pedimos, pedisteis, pidieron."}
          - {w: "diesen", f: "di- + -esen → dar (to give), imperfect subjunctive (-se form), they: subjunctive after 'pidió que'. diese, dieses, diese, diésemos, dieseis, diesen."}
          - {w: "traía", f: "tra- + -ía → traer (to bring, to have), imperfect, he. traía, traías, traía, traíamos, traíais, traían."}
          - {w: "grandísima", f: "grand- + -ísima → grande (great) with the superlative suffix -ísimo, feminine to match 'hambre' (feminine in Cervantes: 'la hambre')."}
      - es: "Tendieron la arpillera del primo sobre la verde yerba, acudieron a la despensa de sus alforjas, y, sentados todos tres en buen amor y compaña, merendaron y cenaron, todo junto."
        literal: "They-spread the sackcloth of-the cousin on the green grass, they-had-recourse to the pantry of their saddlebags, and, seated all three in good love and company, they-had-the-afternoon-meal and supped, all together."
        ormsby: "They spread the cousin’s sackcloth on the grass, and put the stores of the alforjas into requisition, and all three sitting down lovingly and sociably, they made a luncheon and a supper of it all in one;"
        vocab:
          - {w: "arpillera", d: "sackcloth, burlap (the cousin's saddle-cloth, now a picnic cloth)"}
          - {w: "yerba", d: "= hierba, grass (old spelling)"}
          - {w: "acudir a", d: "to turn to, resort to"}
          - {w: "despensa", d: "pantry, store of provisions"}
          - {w: "alforjas", d: "saddlebags"}
          - {w: "todos tres", d: "all three (modern 'los tres')"}
          - {w: "en buen amor y compaña", d: "in good fellowship, in friendly company (a set phrase); 'compaña' = compañía (old form)"}
          - {w: "merendar", d: "to have the afternoon meal (merienda)"}
          - {w: "todo junto", d: "all at once, in one: the afternoon meal and supper together"}
        diagram:
          - s: "Tendieron la arpillera del primo"
            r: "main verb 1: they spread the cousin's sackcloth"
            under:
              - {s: "sobre la verde yerba", r: "where: on the green grass"}
          - {s: "acudieron a la despensa de sus alforjas", r: "main verb 2: they turned to the pantry of their saddlebags"}
          - s: "merendaron y cenaron"
            r: "main verbs 3 and 4 (after 'y'): they had their afternoon meal and supper"
            under:
              - {s: "sentados todos tres en buen amor y compaña", r: "how: all three sitting in good fellowship"}
              - {s: "todo junto", r: "how: both at once"}
        forms:
          - {w: "Tendieron, acudieron", f: "tend- + -ieron → tender (to spread), acud- + -ieron → acudir (to turn to), preterite, they. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "del", f: "de + el: 'of the (cousin)'."}
          - {w: "sentados", f: "sent- + -ados → sentar (to seat), participle, masculine plural to match 'todos tres': 'seated'."}
          - {w: "merendaron y cenaron", f: "merend- + -aron → merendar (to have the afternoon meal), cen- + -aron → cenar (to have supper), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
        note: "They had reached the cave at two in the afternoon and Don Quijote was down there for some time, so the meal is both 'merienda' and supper. It is laid out on the cousin's saddle-cloth, the 'arpillera' that covered his donkey's pack-saddle."
      - es: "Levantada la arpillera, dijo don Quijote de la Mancha:"
        literal: "Lifted the sackcloth, said Don Quijote de la Mancha:"
        ormsby: "and when the sackcloth was removed, Don Quixote of La Mancha said,"
        vocab:
          - {w: "levantar", d: "here 'to clear away' (the cloth after a meal, as in 'levantar los manteles', to clear the table)"}
        diagram:
          - s: "dijo don Quijote de la Mancha:"
            r: "main verb: Don Quijote de la Mancha said"
            under:
              - {s: "Levantada la arpillera", r: "when: once the sackcloth was cleared away"}
        forms:
