  - sentences:
      - es: "— Porque doy al celoso, al desdeñado, al olvidado y al ausente las que les convienen, que les vendrán más justas que pecadoras."
        literal: "— Because I-give to-the jealous-one, to-the scorned-one, to-the forgotten-one and to-the absent-one those that to-them suit, which to-them will-come more just than sinful."
        ormsby: "“for,” said he, “I give the jealous, the rejected, the forgotten, the absent, what will suit them, and fit them without fail."
        vocab:
          - {w: "desdeñado", d: "scorned, rejected (by a lady)"}
          - {w: "convenir", d: "to suit, be fitting for"}
          - {w: "venir justo", d: "to fit exactly (of clothes)"}
          - {w: "más justas que pecadoras", d: "a pun on a set phrase: 'justo' means both 'tight-fitting' and 'righteous', so 'more just than sinful' = a perfect fit"}
        diagram:
          - s: "doy"
            r: "main verb: I give"
            under:
              - {s: "Porque", r: "linking: because (explains his book of liveries)"}
              - {s: "al celoso, al desdeñado, al olvidado y al ausente", r: "to whom: to the jealous, the scorned, the forgotten and the absent lover"}
              - s: "las que les convienen"
                r: "object: the ones (liveries) that suit them"
                under:
                  - {s: "que les vendrán más justas que pecadoras", r: "describes 'las': which will fit them perfectly"}
        forms:
          - {w: "doy", f: "doy → dar (to give), present, I. Irregular: doy, das, da, damos, dais, dan."}
          - {w: "al", f: "a + el, before each kind of lover: 'to the jealous one', 'to the scorned one'."}
          - {w: "celoso, desdeñado, olvidado", f: "adjective and participles used as nouns: celoso (jealous); desdeñ- + -ado → desdeñar (to scorn), olvid- + -ado → olvidar (to forget), masculine singular: 'the scorned man', 'the forgotten man'."}
          - {w: "convienen", f: "convien- + -en → convenir (to suit), present, they (the liveries). Like venir (to come): convengo, convienes, conviene, convenimos, convenís, convienen."}
          - {w: "vendrán", f: "vendr- + -án → venir (to come; here 'to fit'), future, they. Irregular stem vendr-: vendré, vendrás, vendrá, vendremos, vendréis, vendrán."}
          - {w: "justas, pecadoras", f: "just- + -as → justo (fitting, just), pecador- + -as → pecador (sinful), feminine plural to match the liveries."}
        note: "The cousin is still speaking; the narrator has slid from reported speech into his own words. Each kind of unhappy lover had his traditional colours, and the cousin claims to have them all ready-made."
      - es: "Otro libro tengo también, a quien he de llamar Metamorfóseos, o Ovidio español, de invención nueva y rara;"
        literal: "Another book I-have also, to which I-have to call Metamorphoses, or Ovid Spanish, of invention new and rare;"
