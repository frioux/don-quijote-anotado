  - sentences:
      - es: "— Suplico a vuesa merced, señor don Quijote, que mire bien y especule con cien ojos lo que hay allá dentro: quizá habrá cosas que las ponga yo en el libro de mis Transformaciones."
        literal: "— I-beg [to] your grace, sir Don Quijote, that you-look well and examine with a-hundred eyes that which there-is there inside: perhaps there-will-be things that them may-put I in the book of my Transformations."
        ormsby: "“I beg of you, Señor Don Quixote, to observe carefully and examine with a hundred eyes everything that is within there; perhaps there may be some things for me to put into my book of transformations.”"
        vocab:
          - {w: "suplicar", d: "to beg, entreat"}
          - {w: "vuesa merced", d: "= vuestra merced, your worship (worn-down spoken form)"}
          - {w: "especular", d: "to observe closely, examine (its Latin sense, not 'speculate')"}
          - {w: "con cien ojos", d: "with a hundred eyes: very carefully"}
          - {w: "allá dentro", d: "in there, down inside"}
          - {w: "Transformaciones", d: "the cousin's 'Metamorfóseos, o Ovidio español', which he now calls 'Transformations'"}
        diagram:
          - s: "Suplico a vuesa merced"
            r: "main verb 1: I beg your worship"
            under:
              - {s: "señor don Quijote", r: "addressed: Señor Don Quijote"}
              - s: "que mire bien y especule con cien ojos lo"
                r: "what he begs: to look well and examine with a hundred eyes what"
                under:
                  - {s: "que hay allá dentro", r: "describes 'lo': what there is down there"}
          - s: "quizá habrá cosas"
            r: "main verb 2: perhaps there will be things"
            under:
              - {s: "que las ponga yo en el libro de mis Transformaciones", r: "describes 'cosas': that I can put in my book of Transformations"}
        forms:
          - {w: "Suplico", f: "suplic- + -o → suplicar (to beg), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "mire, especule", f: "mir- + -e → mirar (to look), especul- + -e → especular (to examine), present subjunctive, you (vuesa merced), after 'suplico que'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "hay", f: "the special form of haber (to have) meaning 'there is, there are'."}
          - {w: "habrá", f: "habr- + -á → haber (to have), future, used for 'there will be'. Irregular stem habr-: habré, habrás, habrá, habremos, habréis, habrán."}
          - {w: "que las ponga", f: "pong- + -a → poner (to put), present subjunctive, I: things fit to be put. Irregular: ponga, pongas, ponga, pongamos, pongáis, pongan. 'las' repeats 'cosas' after 'que', a loose spoken construction."}
          - {w: "cien", f: "ciento (a hundred) clipped to 'cien' before a noun."}
        note: "The cousin sees the cave as material for his burlesque Ovid, the book of transformations he described on the road. Ormsby's text prints the title in lower case."
  - sentences:
      - es: "— En manos está el pandero que le sabrá bien tañer —respondió Sancho Panza."
        literal: "— In hands is the tambourine that it will-know-how well to-play —answered Sancho Panza."
        ormsby: "“The drum is in hands that will know how to beat it well enough,” said Sancho Panza."
        ormsby_note: "Proverb 175."
        vocab:
          - {w: "pandero", d: "tambourine, a hand drum with jingles"}
          - {w: "tañer", d: "to play (an instrument), to beat (a drum)"}
          - {w: "en manos está el pandero que le sabrá bien tañer", d: "proverb: the tambourine is in hands that know how to play it, the job is in capable hands"}
        diagram:
          - s: "En manos está el pandero"
            r: "main verb: the tambourine is in hands"
            under:
              - {s: "que le sabrá bien tañer", r: "describes 'manos': that will know how to play it well"}
          - {s: "respondió Sancho Panza", r: "speech tag: answered Sancho Panza"}
        forms:
          - {w: "está", f: "est- + -á → estar (to be), present, it. Irregular: estoy, estás, está, estamos, estáis, están."}
          - {w: "le sabrá bien tañer", f: "sabr- + -á → saber (to know how), future, he: singular, as if 'manos' meant 'the one whose hands they are': 'will know how'. Irregular stem sabr-: sabré, sabrás, sabrá, sabremos, sabréis, sabrán. + tañer (to play), infinitive; 'le' = it, the tambourine, 'le' used for a thing."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
        note: "Ormsby's 'Proverb 175' refers to his own numbered list of the proverbs in the book. The proverb means the matter is in capable hands: Sancho assures the cousin that his master will look at everything there is to see."
  - sentences:
      - es: "Dicho esto y acabada la ligadura de don Quijote —que no fue sobre el arnés, sino sobre el jubón de armar—, dijo don Quijote:"
        literal: "Said this and finished the binding of Don Quijote —which not was over the armour, but over the doublet of arming—, said Don Quijote:"
        ormsby: "When he had said this and finished the tying (which was not over the armour but only over the doublet) Don Quixote observed,"
        vocab:
          - {w: "dicho esto", d: "this said, when this had been said"}
          - {w: "ligadura", d: "tying, binding"}
          - {w: "arnés", d: "armour, harness (the suit of armour)"}
          - {w: "jubón de armar", d: "arming doublet: the padded jacket worn under armour"}
        diagram:
          - s: "dijo don Quijote:"
            r: "main verb: Don Quijote said"
            under:
              - {s: "Dicho esto", r: "when: this said"}
              - s: "y acabada la ligadura de don Quijote"
                r: "when, 2: and the tying of Don Quijote finished"
                under:
                  - {s: "que no fue sobre el arnés, sino sobre el jubón de armar", r: "describes 'ligadura': not over his armour but over his arming doublet"}
        forms:
          - {w: "Dicho", f: "dicho, irregular participle of decir (to say), in an absolute construction: 'this [being] said'. The participle with its own noun stands as a time clause."}
          - {w: "acabada", f: "acab- + -ada → acabar (to finish), participle, feminine to match 'ligadura', in the same absolute construction: 'the tying [being] finished'."}
          - {w: "fue", f: "ser (to be), preterite, it. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "armar", f: "infinitive of armar (to arm) after 'de': 'for arming', 'worn under armour'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
        note: "The detail that he went down in his doublet and not his armour is realistic: no one could be lowered on a rope in a full suit of armour through a narrow cave."
  - sentences:
      - es: "— Inadvertidos hemos andado en no habernos proveído de algún esquilón pequeño, que fuera atado junto a mí en esta mesma soga, con cuyo sonido se entendiera que todavía bajaba y estaba vivo; pero, pues ya no es posible, a la mano de Dios, que me guíe."
        literal: "— Careless we-have gone in not to-have-ourselves provided with some cattle-bell small, that might-be tied next to me on this same rope, with whose sound itself might-be-understood that still I-was-going-down and was alive; but, since now not it-is possible, to the hand of God, that me he-may-guide."
        ormsby: "“It was careless of us not to have provided ourselves with a small cattle-bell to be tied on the rope close to me, the sound of which would show that I was still descending and alive; but as that is out of the question now, in God’s hand be it to guide me;”"
        vocab:
          - {w: "inadvertido", d: "careless, thoughtless, unwary"}
          - {w: "andar + adjective", d: "to be, to have been (in some state): 'inadvertidos hemos andado' = we have been careless"}
          - {w: "proveerse de", d: "to provide oneself with"}
          - {w: "esquilón", d: "cattle-bell, a large bell hung on the lead animal of a herd"}
          - {w: "mesmo", d: "= mismo, same (old form)"}
          - {w: "pues", d: "here 'since, as' (giving a reason)"}
          - {w: "a la mano de Dios", d: "into God's hands, God's will be done"}
        diagram:
          - s: "Inadvertidos hemos andado"
            r: "main verb 1: we have been careless"
            under:
              - s: "en no habernos proveído de algún esquilón pequeño"
                r: "in what: in not providing ourselves with a little cattle-bell"
                under:
                  - {s: "que fuera atado junto a mí en esta mesma soga", r: "describes 'esquilón': that might be tied next to me on this same rope"}
                  - s: "con cuyo sonido se entendiera"
                    r: "describes 'esquilón': by whose sound it would be understood"
                    under:
                      - {s: "que todavía bajaba y estaba vivo", r: "what would be understood: that I was still going down and alive"}
          - s: "pero ... a la mano de Dios"
            r: "main clause 2 (no verb): but into the hand of God"
            under:
              - {s: "pues ya no es posible", r: "why: since it is no longer possible"}
              - {s: "que me guíe", r: "wish: may he guide me"}
        forms:
          - {w: "Inadvertidos", f: "inadvertid- + -os → inadvertido (careless), masculine plural to match 'we' (all three of them)."}
          - {w: "hemos andado", f: "hemos (haber (to have), present, we: he, has, ha, hemos, habéis, han) + andado, participle of andar (to go, to be): 'we have been'."}
          - {w: "habernos proveído", f: "haber (to have) + nos (ourselves), infinitive after 'en no', + proveído, participle of proveer (to provide): 'to have provided ourselves'."}
          - {w: "algún", f: "alguno (some) clipped to 'algún' before a masculine singular noun."}
          - {w: "fuera atado", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), it: fuera, fueras, fuera, fuéramos, fuerais, fueran; + atado, participle of atar (to tie): 'that might be tied', in a clause describing a bell they don't have."}
          - {w: "mesma", f: "mesm- + -a → mesmo, old form of mismo (same), feminine to match 'soga'."}
          - {w: "cuyo", f: "cuy- + -o → cuyo (whose), masculine to match the thing owned, 'sonido'."}
          - {w: "se entendiera", f: "entend- + -iera → entender (to understand), imperfect subjunctive (-ra form), it, with passive 'se': 'it would be understood'. The -ra form of -er verbs: -iera, -ieras, -iera, -iéramos, -ierais, -ieran. Here the -ra form does the work of a conditional ('would')."}
          - {w: "bajaba", f: "baj- + -aba → bajar (to go down), imperfect, I. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, I. Same -aba imperfect."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "guíe", f: "guí- + -e → guiar (to guide), present subjunctive, he (God), after 'que' for a wish: 'may he guide me'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
        note: "A practical afterthought from a man about to be lowered into the dark: a bell on the rope would tell those above that he was still alive."
  - sentences:
      - es: "Y luego se hincó de rodillas y hizo una oración en voz baja al cielo, pidiendo a Dios le ayudase y le diese buen suceso en aquella, al parecer, peligrosa y nueva aventura, y en voz alta dijo luego:"
        literal: "And at-once himself he-knelt on knees and made a prayer in voice low to-the heaven, asking [to] God [that] him he-might-help and to-him might-give good outcome in that, to-the seeming, dangerous and new adventure, and in voice high he-said then:"
        ormsby: "and forthwith he fell on his knees and in a low voice offered up a prayer to heaven, imploring God to aid him and grant him success in this to all appearance perilous and untried adventure, and then exclaimed aloud,"
        vocab:
          - {w: "luego", d: "at once, immediately (old sense); the second 'luego' means 'then, next'"}
          - {w: "hincarse de rodillas", d: "to kneel down, fall on one's knees"}
          - {w: "oración", d: "prayer (also 'sentence' in grammar)"}
          - {w: "suceso", d: "outcome, result, event (a false friend); 'buen suceso' = success, a happy outcome"}
          - {w: "al parecer", d: "apparently, to all appearances"}
          - {w: "nuevo", d: "here 'untried, unheard-of', not just 'new'"}
        diagram:
          - {s: "Y luego se hincó de rodillas", r: "main verb 1: and at once he knelt down"}
          - s: "y hizo una oración en voz baja al cielo"
            r: "main verb 2: and made a prayer in a low voice to heaven"
            under:
              - s: "pidiendo a Dios"
                r: "how: asking God"
                under:
                  - s: "le ayudase y le diese buen suceso"
                    r: "what he asked: to help him and give him a good outcome"
                    under:
                      - {s: "en aquella, al parecer, peligrosa y nueva aventura", r: "in what: in that seemingly dangerous and untried adventure"}
          - s: "y en voz alta dijo luego:"
            r: "main verb 3: and then he said aloud"
        forms:
          - {w: "se hincó", f: "hinc- + -ó → hincarse (to kneel), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (hinqué, with c → qu before e)."}
          - {w: "hizo", f: "hiz- + -o → hacer (to make), preterite, he. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "al", f: "a + el: 'to the (heaven)'; 'al parecer' = to the seeming."}
          - {w: "pidiendo", f: "gerund of pedir (to ask): 'asking'. The e of the stem turns to i in the gerund: pedir → pidiendo."}
          - {w: "le ayudase, le diese", f: "ayud- + -ase → ayudar (to help), imperfect subjunctive (-se form), he (God): ayudase, ayudases, ayudase, ayudásemos, ayudaseis, ayudasen; di- + -ese → dar (to give), imperfect subjunctive (-se form), he: diese, dieses, diese, diésemos, dieseis, diesen. The 'que' after 'pidiendo' is left out, as often in Cervantes. In 'le ayudase' the 'le' (him) is leísmo, 'le' for a male direct object; in 'le diese' it is 'to him'."}
          - {w: "aquella", f: "aquell- + -a → aquel (that), feminine to match 'aventura'."}
          - {w: "peligrosa", f: "peligros- + -a → peligroso (dangerous), feminine to match 'aventura'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
        note: "The order is the knightly one: first a prayer to God, then an appeal to his lady, as the knights of the romances did before a great adventure."
  - sentences:
