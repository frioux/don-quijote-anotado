        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "daría", f: "dar- + -ía → dar (to give), conditional, he. The conditional adds -ía, -ías, -ía, -íamos, -íais, -ían to the whole infinitive."}
          - {w: "a un primo", f: "'a' before a person as direct object (the 'personal a'): 'he would give (him) a cousin'."}
          - {w: "suyo", f: "suy- + -o → suyo (of his), the long possessive after the noun, masculine to match 'primo': 'a cousin of his'."}
          - {w: "pondría", f: "pondr- + -ía → poner (to put, bring), conditional, he. Irregular stem pondr-: pondría, pondrías, pondría, pondríamos, pondríais, pondrían."}
          - {w: "mesma", f: "mesm- + -a → mesmo, old form of mismo (same, very), feminine to match 'cueva'."}
          - {w: "enseñaría", f: "enseñar- + -ía → enseñar (to show), conditional, he. Regular: the conditional adds -ía, -ías, -ía, -íamos, -íais, -ían to the whole infinitive: enseñaría, enseñarías, enseñaría, enseñaríamos, enseñaríais, enseñarían."}
          - {w: "famosas", f: "famos- + -as → famoso (famous), feminine plural to match 'lagunas'."}
      - es: "y díjole que llevaría con él gustoso entretenimiento, a causa que era mozo que sabía hacer libros para imprimir y para dirigirlos a príncipes."
