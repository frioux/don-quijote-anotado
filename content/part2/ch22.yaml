        literal: "I was-thinking in my soul that only he-could know that which touched on his chivalries, but not there-is thing where not he-may-peck and may-fail to put his spoonful."
        ormsby: "I used to think in my heart that the only thing he knew was what belonged to his chivalry; but there is nothing he won’t have a finger in.”"
        vocab:
