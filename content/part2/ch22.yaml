      - es: "porque en él, imitando a Ovidio a lo burlesco, pinto quién fue la Giralda de Sevilla y el Ángel de la Madalena, quién el Caño de Vecinguerra, de Córdoba, quiénes los Toros de Guisando, la Sierra Morena, las fuentes de Leganitos y Lavapiés, en Madrid, no olvidándome de la del Piojo, de la del Caño Dorado y de la Priora;"
        literal: "because in it, imitating [to] Ovid in the burlesque [way], I-paint who was the Giralda of Seville and the Angel of the Magdalena, who the Spout of Vecinguerra, of Córdoba, who the Bulls of Guisando, the Sierra Morena, the fountains of Leganitos and Lavapiés, in Madrid, not forgetting-myself of the [one] of-the Louse, of the [one] of-the Spout Golden and of the Prioress;"
        ormsby: "for imitating Ovid in burlesque style, I show in it who the Giralda of Seville and the Angel of the Magdalena were, what the sewer of Vecinguerra at Cordova was, what the bulls of Guisando, the Sierra Morena, the Leganitos and Lavapiés fountains at Madrid, not forgetting those of the Piojo, of the Cano Dorado, and of the Priora;"
        ormsby_note: "For the Giralda of Seville, and the bulls of Guisando, [Ormsby refers back to his notes on Part II, Chapter XIV]. The Angel of the Magdalena was a weathercock on a church of that name at Salamanca; the Vecinguerra was the sewer draining the Potro quarter at Cordova. The other names are those of fountains in or on the outskirts of Madrid, of which I think the Lavapiés is the only one now in existence."
        vocab:
          - {w: "a lo burlesco", d: "in burlesque style, mockingly"}
          - {w: "pintar", d: "to depict, describe (literally 'to paint')"}
          - {w: "la Giralda", d: "the bell tower of Seville cathedral, crowned by a turning bronze statue"}
          - {w: "el Ángel de la Madalena", d: "the Angel of the Magdalena, a weathervane on the church of the Magdalena in Salamanca"}
          - {w: "Madalena", d: "= Magdalena (popular spelling)"}
          - {w: "caño", d: "spout, drain, sewer pipe"}
          - {w: "el Caño de Vecinguerra", d: "a sewer in Córdoba, draining the Potro quarter"}
          - {w: "los Toros de Guisando", d: "ancient stone bulls near El Tiemblo (Ávila)"}
          - {w: "Sierra Morena", d: "the mountain range between La Mancha and Andalusia, scene of Don Quijote's penance in Part I"}
          - {w: "Leganitos, Lavapiés, el Piojo, el Caño Dorado, la Priora", d: "fountains in or near Madrid of Cervantes' day"}
          - {w: "olvidarse de", d: "to forget"}
        diagram:
          - s: "pinto"
            r: "main verb: I depict"
            under:
              - {s: "porque", r: "linking: because (why the invention is new)"}
              - {s: "en él", r: "where: in it (the book)"}
              - {s: "imitando a Ovidio a lo burlesco", r: "how: imitating Ovid in burlesque style"}
              - {s: "quién fue la Giralda de Sevilla y el Ángel de la Madalena", r: "what I depict, 1: who the Giralda of Seville and the Angel of the Magdalena were"}
              - {s: "quién el Caño de Vecinguerra, de Córdoba", r: "what I depict, 2: who the Vecinguerra sewer of Córdoba was"}
              - {s: "quiénes los Toros de Guisando, la Sierra Morena, las fuentes de Leganitos y Lavapiés, en Madrid", r: "what I depict, 3: who the Bulls of Guisando, the Sierra Morena, the Madrid fountains were"}
              - {s: "no olvidándome de la del Piojo, de la del Caño Dorado y de la Priora", r: "how: not forgetting the Piojo, Caño Dorado and Priora fountains"}
        forms:
          - {w: "imitando", f: "imit- + -ando → gerund of imitar (to imitate): 'imitating'."}
          - {w: "a Ovidio", f: "'a' before a person as direct object (the 'personal a')."}
          - {w: "pinto", f: "pint- + -o → pintar (to depict), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "fue", f: "fue → ser (to be), preterite, she/it (the Giralda): fui, fuiste, fue, fuimos, fuisteis, fueron. Understood again after 'quién el Caño' and 'quiénes los Toros'."}
          - {w: "quién, quiénes", f: "quién (who), with plural quiénes to match 'los Toros' and the rest: the joke is asking 'who' of towers, sewers and fountains, as if they had once been people."}
          - {w: "olvidándome", f: "olvid- + -ando + me → gerund of olvidar (to forget) + me (myself), with an accent added to keep the stress: 'not forgetting'."}
          - {w: "la del Piojo", f: "'la' stands for 'fuente' (fountain): 'the one of the Piojo'; del = de + el."}
        note: "Ovid's Metamorphoses tells how people were turned into trees, stars and springs; the cousin's mock version will 'explain' Spanish landmarks the same way. The Giralda is the great bell tower of Seville cathedral, topped by a bronze figure of Faith that turns with the wind as a weathervane (hence 'giraldillo'), and the Bulls of Guisando are ancient stone animal figures, probably carved by the pre-Roman Vettones, near El Tiemblo in the province of Ávila."
