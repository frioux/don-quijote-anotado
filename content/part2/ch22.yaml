          - {w: "pensaba", f: "pens- + -aba → pensar (to think), imperfect, I. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "tocaba", f: "toc- + -aba → tocar (to concern), imperfect, it. Same -aba imperfect."}
          - {w: "podía", f: "pod- + -ía → poder (can), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "hay", f: "haber (there to be), present: 'there is'; the impersonal form, always singular. The ordinary present of haber (to have) is he, has, ha, hemos, habéis, han; 'there is/are' uses the special form hay."}
          - {w: "pique, deje", f: "piqu- + -e → picar (to peck), dej- + -e → dejar (to leave off), present subjunctive, he, after 'no hay cosa donde' (a thing that does not exist). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en (pique, piques, pique, piquemos, piquéis, piquen: c becomes qu before e)."}
