  - sentences:
      - es: "— Este mi amo, cuando yo hablo cosas de meollo y de sustancia suele decir que podría yo tomar un púlpito en las manos y irme por ese mundo adelante predicando lindezas;"
        literal: "— This my master, when I speak things of marrow and of substance is-wont to-say that could I take a pulpit in the hands and go-off-myself through that world onward preaching pretty-things;"
        ormsby: "“This master of mine, when I say anything that has weight and substance, says I might take a pulpit in hand, and go about the world preaching fine sermons;"
        vocab:
          - {w: "este mi amo", d: "this master of mine (demonstrative plus possessive, an old and colloquial pattern)"}
          - {w: "meollo", d: "marrow, pith; here 'sense, substance'"}
          - {w: "soler", d: "to be in the habit of, usually (do)"}
          - {w: "púlpito", d: "pulpit"}
          - {w: "irse por ese mundo adelante", d: "to go off out into the wide world"}
          - {w: "predicar", d: "to preach"}
          - {w: "lindezas", d: "pretty things, fine sayings"}
        diagram:
          - s: "Este mi amo ... suele decir"
            r: "main verb: this master of mine usually says"
            under:
              - {s: "cuando yo hablo cosas de meollo y de sustancia", r: "when: whenever I say things of pith and substance"}
              - s: "que podría yo tomar un púlpito en las manos"
                r: "what he says, 1: that I could take a pulpit in my hands"
              - s: "y irme por ese mundo adelante"
                r: "what he says, 2: and go off into the wide world"
                under:
                  - {s: "predicando lindezas", r: "how: preaching pretty things"}
        forms:
          - {w: "Este", f: "este (this), masculine to match 'amo'; with 'mi' it gives 'this master of mine'."}
          - {w: "hablo", f: "habl- + -o → hablar (to speak), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "suele", f: "suel- + -e → soler (to be in the habit of), present, he. The stem o becomes ue when stressed: suelo, sueles, suele, solemos, soléis, suelen."}
          - {w: "podría", f: "podr- + -ía → poder (can, to be able), conditional, I: 'I could'. Irregular stem podr-: podría, podrías, podría, podríamos, podríais, podrían."}
          - {w: "irme", f: "ir (to go) + me (myself): irse = to go off, go away; the pronoun is stuck on the infinitive."}
          - {w: "predicando", f: "predic- + -ando → predicar (to preach), gerund: 'preaching'."}
        note: "Sancho remembers Don Quijote's praise of his own sayings earlier in Part II, when the knight told him he could take a pulpit and preach. He now turns the compliment back on his master."
      - es: "y yo digo dél que cuando comienza a enhilar sentencias y a dar consejos, no sólo puede tomar púlpito en las manos, sino dos en cada dedo, y andarse por esas plazas a ¿qué quieres boca?"
        literal: "and I say of-him that when he-begins to thread maxims and to give advice, not only can-he take pulpit in the hands, but two on each finger, and go-about-himself through those squares at what do-you-want mouth?"
        ormsby: "but I say of him that, when he begins stringing maxims together and giving advice not only might he take a pulpit in hand, but two on each finger, and go into the market-places to his heart’s content."
        vocab:
          - {w: "dél", d: "= de él, of him"}
          - {w: "enhilar", d: "to string together, thread (like beads on a thread)"}
          - {w: "sentencias", d: "maxims, wise sayings (not 'sentences' in court)"}
          - {w: "plaza", d: "town square, market-place"}
          - {w: "a ¿qué quieres boca?", d: "to one's heart's content (literally 'at what-do-you-want, mouth?'): as freely as you please"}
        diagram:
          - s: "y yo digo dél"
            r: "main verb: and I say of him"
            under:
              - s: "que ... no sólo puede tomar púlpito en las manos"
                r: "what I say: that not only can he take a pulpit in his hands"
                under:
                  - {s: "cuando comienza a enhilar sentencias y a dar consejos", r: "when: when he starts stringing maxims and giving advice"}
                  - {s: "sino dos en cada dedo", r: "but even: but two on each finger"}
                  - {s: "y andarse por esas plazas a ¿qué quieres boca?", r: "and can: go round the squares to his heart's content"}
        forms:
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "dél", f: "de + él (of him): Cervantes fuses 'de' with these pronouns."}
          - {w: "comienza", f: "comienz- + -a → comenzar (to begin), present, he. The stem e becomes ie when stressed: comienzo, comienzas, comienza, comenzamos, comenzáis, comienzan."}
          - {w: "puede", f: "pued- + -e → poder (can), present, he. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "andarse", f: "andar (to walk, go about) + se, infinitive after 'puede'; the 'se' adds 'at his ease'."}
          - {w: "quieres", f: "quier- + -es → querer (to want), present, you, inside the set phrase. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
        note: "'Two pulpits on each finger' is Sancho's comic exaggeration, as if pulpits were rings."
