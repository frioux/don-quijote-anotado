          - {w: "descolgarse", f: "descolgar (to let down) + se (himself), the pronoun hung on the infinitive: 'to let himself down'."}
          - {w: "era", f: "ser (to be), imperfect, it. Irregular: era, eras, era, éramos, erais, eran."}
