          - {w: "Dulcinea del Toboso", d: "Don Quijote's imagined lady, really the peasant girl Aldonza Lorenzo of El Toboso"}
        diagram:
          - s: "¡Oh señora de mis acciones y movimientos"
            r: "address: O lady of my actions and movements"
            under:
              - {s: "clarísima y sin par Dulcinea del Toboso", r: "who: most illustrious and peerless Dulcinea del Toboso"}
        forms:
