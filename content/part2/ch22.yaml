          - {w: "tocar a", d: "to concern, belong to"}
          - {w: "caballerías", d: "chivalry, the matters of knighthood"}
          - {w: "picar", d: "to peck, nibble; here 'to dabble'"}
          - {w: "meter su cucharada", d: "to stick one's spoon in, put one's oar in, have one's say on everything"}
        diagram:
          - s: "Yo pensaba en mi ánima"
            r: "main verb 1: I thought in my soul"
            under:
              - s: "que sólo podía saber aquello"
                r: "what I thought: that he could only know that"
                under:
                  - {s: "que tocaba a sus caballerías", r: "describes 'aquello': which concerned his chivalry"}
          - s: "pero no hay cosa"
            r: "main verb 2: but there is nothing"
            under:
              - {s: "donde no pique y deje de meter su cucharada", r: "describes 'cosa': where he does not peck and stick his spoon in"}
