                  - {s: "famoso estudiante y muy aficionado a leer libros de caballerías", r: "describes 'primo': a famous scholar and very fond of reading books of chivalry"}
                  - s: "el cual con mucha voluntad le pondría a la boca de la mesma cueva"
                    r: "describes 'primo': who would gladly bring him to the very mouth of the cave"
                    under:
