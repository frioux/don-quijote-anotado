            r: "main verb 1: mind, your worship"
            under:
              - {s: "señor mío", r: "addressed: my master"}
              - {s: "lo que hace", r: "object: what you are doing"}
          - {s: "no se quiera sepultar en vida", r: "main verb 2: don't go burying yourself alive"}
          - s: "ni se ponga"
            r: "main verb 3: nor put yourself"
            under:
              - s: "adonde parezca frasco"
                r: "where: where you'll look like a flask"
                under:
                  - {s: "que le ponen a enfriar en algún pozo", r: "describes 'frasco': that is put to cool in a well"}
        forms:
          - {w: "Mire", f: "mir- + -e → mirar (to look), present subjunctive, you (vuestra merced), used as a polite command. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "hace", f: "hac- + -e → hacer (to do), present, you (vuestra merced, which takes the verb of 'he'). Irregular in the I form: hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "no se quiera sepultar", f: "quier- + -a → querer (to want), present subjunctive, you (vuestra merced), as a negative command: 'don't want to bury yourself'. Irregular: quiera, quieras, quiera, queramos, queráis, quieran. 'se' belongs to sepultar (to bury) but sits before the helper verb."}
          - {w: "se ponga", f: "pong- + -a → poner (to put), present subjunctive, you (vuestra merced), negative command with 'ni'. Irregular: ponga, pongas, ponga, pongamos, pongáis, pongan."}
          - {w: "parezca", f: "parezc- + -a → parecer (to seem, look like), present subjunctive, you, in a clause about a place not yet reached. Irregular: parezca, parezcas, parezca, parezcamos, parezcáis, parezcan."}
          - {w: "le ponen", f: "pon- + -en → poner (to put), present, they (people in general), with 'le' (it, the flask; 'le' used for a thing, an old habit). Irregular in the I form: pongo, pones, pone, ponemos, ponéis, ponen."}
          - {w: "enfriar", f: "infinitive of enfriar (to cool) after 'ponen a'."}
          - {w: "algún", f: "alguno (some) clipped to 'algún' before a masculine singular noun."}
        note: "Sancho's comparison is homely and exact: lacking ice, people cooled wine or water by letting a jug down a well on a rope, which is just what is about to happen to his master."
      - es: "Sí, que a vuestra merced no le toca ni atañe ser el escudriñador desta que debe de ser peor que mazmorra."
        literal: "Yes, for to your grace not to-you it-touches nor concerns to-be the searcher of-this [one] that must of be worse than dungeon."
        ormsby: "it’s no affair or business of your worship’s to become the explorer of this, which must be worse than a Moorish dungeon.”"
