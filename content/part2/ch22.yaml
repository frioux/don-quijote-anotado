  - sentences:
      - es: "— ¡Dios te guíe y la Peña de Francia, junto con la Trinidad de Gaeta, flor, nata y espuma de los caballeros andantes!"
        literal: "— God you may-guide and the Peña de Francia, together with the Trinity of Gaeta, flower, cream and foam of the knights errant!"
        ormsby: "“God, and the Peña de Francia, and the Trinity of Gaeta guide thee, flower and cream of knights-errant."
        ormsby_note: "The Peña de Francia is a mountain near Ciudad Rodrigo, and one of the holy places of Spain in consequence of the discovery of an image of the Virgin there in the fifteenth century. The Trinity of Gaeta is the chapel dedicated to the Trinity above the harbour of Gaeta."
        vocab:
          - {w: "Peña de Francia", d: "a mountain shrine of the Virgin near Ciudad Rodrigo (Salamanca), a famous place of pilgrimage"}
          - {w: "Trinidad de Gaeta", d: "a chapel of the Holy Trinity above the harbour of Gaeta, in the kingdom of Naples, then ruled by Spain"}
          - {w: "junto con", d: "together with"}
          - {w: "flor, nata y espuma", d: "flower, cream and foam: the very pick, the best of all (three words for 'the finest part')"}
        diagram:
          - s: "¡Dios te guíe"
            r: "main verb: may God guide you"
            under:
              - {s: "y la Peña de Francia", r: "subject 2: and the Peña de Francia"}
              - {s: "junto con la Trinidad de Gaeta", r: "subject 3: together with the Trinity of Gaeta"}
              - {s: "flor, nata y espuma de los caballeros andantes!", r: "addressed: you, the very cream of knights errant"}
        forms:
          - {w: "guíe", f: "gu- + -íe → guiar (to guide), present subjunctive, he (God), expressing a wish: 'may God guide'. guíe, guíes, guíe, guiemos, guiéis, guíen. The verb is singular because 'Dios' comes first; the shrines are tacked on after."}
