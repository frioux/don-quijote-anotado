      - es: "Yo voy a despeñarme, a empozarme y a hundirme en el abismo que aquí se me representa, sólo porque conozca el mundo que si tú me favoreces, no habrá imposible a quien yo no acometa y acabe."
        literal: "I go to hurl-myself-down, to plunge-myself-into-a-well and to sink-myself in the abyss that here itself to-me presents, only so-that may-know the world that if you me favour, not there-will-be impossible [thing] to which I not may-attack and finish."
