          - s: "lo tuviera a mala señal"
            r: "main verb 1: he would have taken it as a bad omen"
            under:
              - {s: "y si él fuera tan agorero como católico cristiano", r: "condition: if he had been as superstitious as he was a good Catholic"}
          - s: "y escusara de encerrarse en lugar semejante"
            r: "main verb 2: and would have refrained from shutting himself up in such a place"
        forms:
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), he, in an 'if' clause: 'if he were / had been'. Irregular: fuera, fueras, fuera, fuéramos, fuerais, fueran."}
          - {w: "agorero", f: "agor- (from agüero, omen) + -ero, the suffix for a person who deals in something: 'omen-man'."}
          - {w: "tuviera", f: "tuv- + -iera → tener (to have, to hold), imperfect subjunctive (-ra form), he, used in the main clause as a conditional: 'he would have held'. tuviera, tuvieras, tuviera, tuviéramos, tuvierais, tuvieran. Cervantes often uses the -ra form where modern Spanish puts the conditional ('habría tenido')."}
          - {w: "escusara", f: "escus- + -ara → escusar (to avoid), imperfect subjunctive (-ra form) used as a conditional, he: 'he would have avoided'. The -ra form of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran."}
