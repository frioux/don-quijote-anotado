          - {w: "estudiante", d: "student, scholar (a man who had studied at a university)"}
          - {w: "aficionado a", d: "fond of, keen on"}
          - {w: "el cual", d: "who (refers back to 'primo')"}
          - {w: "con mucha voluntad", d: "very willingly, gladly"}
          - {w: "mesmo", d: "= mismo, same, very (old form); 'la mesma cueva' = the very cave"}
          - {w: "lagunas de Ruidera", d: "the lakes of Ruidera, a chain of lakes in La Mancha, linked in legend to the Guadiana river"}
          - {w: "ansimismo", d: "= asimismo, likewise, also (old form)"}
        diagram:
          - s: "El licenciado le dijo"
            r: "main verb: the licentiate told him"
