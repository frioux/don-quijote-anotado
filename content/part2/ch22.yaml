      - es: "Ensilló Sancho a Rocinante y aderezó al rucio, proveyó sus alforjas, a las cuales acompañaron las del primo, asimismo bien proveídas, y, encomendándose a Dios y despediéndose de todos, se pusieron en camino, tomando la derrota de la famosa cueva de Montesinos."
