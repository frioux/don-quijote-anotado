                r: "where: with the newly-weds"
                under:
                  - s: "donde fueron regalados y servidos"
                    r: "describes the stay: where they were feasted and served"
                    under:
                      - {s: "como cuerpos de rey", r: "how: like kings"}
        forms:
          - {w: "estuvieron", f: "estuv- + -ieron → estar (to be, to stay), preterite, they. Irregular: estuve, estuviste, estuvo, estuvimos, estuvisteis, estuvieron."}
          - {w: "fueron regalados y servidos", f: "fueron, from ser (to be), preterite, they: fui, fuiste, fue, fuimos, fuisteis, fueron; + the participles regal- + -ados → regalar (to treat lavishly) and serv- + -idos → servir (to serve), masculine plural to match Don Quijote and Sancho: the passive, 'they were feasted and served'."}
        note: "The three days at Basilio's village round off the wedding episode of the previous two chapters; from here the story turns to the next adventure."
      - es: "Pidió don Quijote al diestro licenciado le diese una guía que le encaminase a la cueva de Montesinos, porque tenía gran deseo de entrar en ella y ver a ojos vistas si eran verdaderas las maravillas que de ella se decían por todos aquellos contornos."
        literal: "Asked Don Quijote [to] the skilled licentiate [that] to-him he-should-give a guide who him might-direct to the cave of Montesinos, because he-had great desire to enter in it and see with eyes seen if were true the marvels that of it were-said through all those surroundings."
        ormsby: "Don Quixote begged the fencing licentiate to find him a guide to show him the way to the cave of Montesinos, as he had a great desire to enter it and see with his own eyes if the wonderful tales that were told of it all over the country were true."
        vocab:
          - {w: "diestro", d: "skilled, expert; here 'skilled in fencing' ('la destreza' was the art of fencing)"}
          - {w: "licenciado", d: "licentiate, holder of a university degree: the fencing student of chapter 19 who fought the bachelor Corchuelo"}
          - {w: "pedir ... le diese", d: "to ask (that) he give: the 'que' is left out before the subjunctive, common in Cervantes"}
          - {w: "guía", d: "guide (a person); feminine here, 'una guía', though used of a man"}
          - {w: "encaminar", d: "to direct, set on the road to"}
          - {w: "Montesinos", d: "hero of the Carolingian ballads, cousin of Durandarte, after whom the cave in La Mancha is named"}
          - {w: "a ojos vistas", d: "with his own eyes, openly, plainly"}
          - {w: "contornos", d: "surroundings, the country round about"}
        diagram:
          - s: "Pidió don Quijote"
            r: "main verb 1: Don Quijote asked"
            under:
              - {s: "al diestro licenciado", r: "whom he asked: the skilled licentiate"}
              - s: "le diese una guía"
                r: "what he asked: that he give him a guide"
                under:
                  - {s: "que le encaminase a la cueva de Montesinos", r: "describes 'guía': who would lead him to the cave of Montesinos"}
              - s: "porque tenía gran deseo"
                r: "why: because he had a great desire"
                under:
                  - {s: "de entrar en ella", r: "desire 1: to go into it"}
                  - s: "y ver a ojos vistas"
                    r: "desire 2: and to see with his own eyes"
                    under:
                      - s: "si eran verdaderas las maravillas"
                        r: "what he wanted to see: whether the marvels were true"
                        under:
                          - {s: "que de ella se decían por todos aquellos contornos", r: "describes 'maravillas': that were told about it all over the country around"}
        forms:
          - {w: "Pidió", f: "pid- + -ió → pedir (to ask), preterite, he. The e of the stem turns to i in the he/she and they forms: pedí, pediste, pidió, pedimos, pedisteis, pidieron."}
          - {w: "al", f: "a + el, the contraction: 'asked (of) the licentiate'."}
          - {w: "diese", f: "di- + -ese → dar (to give), imperfect subjunctive (-se form), he, after 'pidió' (asked) with 'que' left out: diese, dieses, diese, diésemos, dieseis, diesen."}
          - {w: "encaminase", f: "encamin- + -ase → encaminar (to direct), imperfect subjunctive (-se form), he/she (the guide): 'who might lead him'. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "gran", f: "grande (great) clipped before a singular noun ('deseo')."}
          - {w: "vistas", f: "vist- + -as → visto, the participle of ver (to see), feminine plural to match 'ojos' in the fixed phrase 'a ojos vistas' (an old agreement oddity, since 'ojos' is masculine)."}
          - {w: "eran", f: "ser (to be), imperfect, they (the marvels): era, eras, era, éramos, erais, eran."}
          - {w: "verdaderas", f: "verdader- + -as → verdadero (true), feminine plural to match 'maravillas'."}
          - {w: "se decían", f: "dec- + -ían → decir (to say, tell), imperfect, they, with 'se' making it passive: 'were told'. Same -ía imperfect as 'tenía': decía, decías, decía, decíamos, decíais, decían."}
        note: "The Cave of Montesinos is a real cave near the lakes of Ruidera in La Mancha, named after the ballad hero Montesinos; local legend tied it to the ballads of Durandarte and Belerma."
      - es: "El licenciado le dijo que le daría a un primo suyo, famoso estudiante y muy aficionado a leer libros de caballerías, el cual con mucha voluntad le pondría a la boca de la mesma cueva, y le enseñaría las lagunas de Ruidera, famosas ansimismo en toda la Mancha, y aun en toda España;"
        literal: "The licentiate to-him said that to-him he-would-give [to] a cousin of-his, famous student and very fond of reading books of chivalries, the which with much goodwill him would-put at the mouth of the same cave, and to-him would-show the lakes of Ruidera, famous likewise in all the Mancha, and even in all Spain;"
        ormsby: "The licentiate said he would get him a cousin of his own, a famous scholar, and one very much given to reading books of chivalry, who would have great pleasure in conducting him to the mouth of the very cave, and would show him the lakes of Ruidera, which were likewise famous all over La Mancha, and even all over Spain;"
