      - es: "vio no ser posible descolgarse, ni hacer lugar a la entrada, si no era a fuerza de brazos, o a cuchilladas, y así, poniendo mano a la espada, comenzó a derribar y a cortar de aquellas malezas que a la boca de la cueva estaban, por cuyo ruido y estruendo salieron por ella una infinidad de grandísimos cuervos y grajos, tan espesos y con tanta priesa, que dieron con don Quijote en el suelo;"
        literal: "he-saw not to-be possible to-let-himself-down, nor to-make room at the entrance, if not it-were by force of arms, or by sword-slashes, and so, putting hand to the sword, he-began to knock-down and to cut of those brambles that at the mouth of the cave were, by whose noise and din came-out through it an infinity of very-big crows and jackdaws, so thick and with so-much haste, that they-gave with Don Quijote on the ground;"
        ormsby: "and perceived that it was impossible to let himself down or effect an entrance except by sheer force or cleaving a passage; so drawing his sword he began to demolish and cut away the brambles at the mouth of the cave, at the noise of which a vast multitude of crows and choughs flew out of it so thick and so fast that they knocked Don Quixote down;"
