          - s: "Sí sería"
            r: "main verb 1: so it must have been"
            under:
              - {s: "respondió el primo", r: "speech tag: the cousin answered"}
              - {s: "porque Adán no hay duda sino que tuvo cabeza y cabellos", r: "why: because there is no doubt Adam had a head and hair"}
          - s: "alguna vez se rascaría"
            r: "main verb 2 (after 'y'): he would have scratched himself at some time"
            under:
              - {s: "siendo esto así", r: "condition 1: this being so"}
              - {s: "y siendo el primer hombre del mundo", r: "condition 2: and being the first man in the world"}
        forms:
          - {w: "sería", f: "ser- + -ía → ser (to be), conditional, it: 'it would be', here a guess about the past, 'it must have been'. The conditional adds -ía, -ías, -ía, -íamos, -íais, -ían to the whole infinitive."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "hay", f: "hay → haber (to have), present, used impersonally: 'there is'. The ordinary present of haber (to have) is he, has, ha, hemos, habéis, han; 'there is/are' uses the special form hay."}
          - {w: "tuvo", f: "tuv- + -o → tener (to have), preterite, he. Irregular: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron."}
          - {w: "siendo", f: "gerund of ser (to be): 'being', here giving the reason."}
          - {w: "primer", f: "primero (first) clipped before a masculine singular noun ('hombre')."}
          - {w: "se rascaría", f: "rascar- + -ía → rascar (to scratch) + se (himself), conditional, he: again a guess about the past, 'he must have scratched himself'. Same conditional endings as 'sería'."}
        note: "The cousin takes Sancho's joke seriously and answers it with a solemn syllogism, the comedy of the scene."
