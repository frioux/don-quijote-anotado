  - sentences:
      - es: "— No digo nada, ni murmuro de nada —respondió Sancho—; sólo estaba diciendo entre mí que quisiera haber oído lo que vuesa merced aquí ha dicho antes que me casara, que quizá dijera yo agora: \"El buey suelto bien se lame\"."
        literal: "— Not I-say nothing, nor I-mutter about nothing —answered Sancho—; only I-was saying between me that I-would-wish to-have heard that which your grace here has said before that myself I-married, for perhaps would-say I now: \"The ox loose well itself licks\"."
        ormsby: "“I’m not saying anything or muttering anything,” said Sancho; “I was only saying to myself that I wish I had heard what your worship has said just now before I married; perhaps I’d say now, ‘The ox that’s loose licks himself well.’”"
        ormsby_note: "Proverb 27."
        vocab:
          - {w: "murmurar de", d: "to grumble about, speak ill of"}
          - {w: "entre mí", d: "to myself"}
          - {w: "vuesa merced", d: "your grace, your worship (a worn-down form of 'vuestra merced'); it takes the verb of 'he'"}
          - {w: "antes que", d: "before (takes the subjunctive)"}
          - {w: "quizá", d: "perhaps"}
          - {w: "agora", d: "= ahora, now (old form)"}
          - {w: "buey", d: "ox"}
          - {w: "suelto", d: "loose, free, unyoked"}
          - {w: "lamerse", d: "to lick oneself"}
        diagram:
          - {s: "No digo nada, ni murmuro de nada", r: "main verbs 1 and 2: I'm saying nothing, nor grumbling about anything"}
          - {s: "respondió Sancho", r: "speaker: answered Sancho"}
          - s: "sólo estaba diciendo entre mí"
            r: "main verb 3: I was only saying to myself"
            under:
              - s: "que quisiera haber oído lo"
                r: "what I said: that I wish I had heard what"
                under:
                  - {s: "que vuesa merced aquí ha dicho", r: "describes 'lo': what your worship has said here"}
                  - {s: "antes que me casara", r: "when: before I married"}
              - s: "que quizá dijera yo agora:"
                r: "result: for perhaps I would say now"
                under:
                  - {s: "\"El buey suelto bien se lame\"", r: "what I would say: the loose ox licks itself well"}
        forms:
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen. 'No digo nada': Spanish keeps both negatives."}
          - {w: "murmuro", f: "murmur- + -o → murmurar (to mutter), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "estaba diciendo", f: "estaba, estar (to be), imperfect, I: estaba, estabas, estaba, estábamos, estabais, estaban; + diciendo, gerund of decir (to say): 'I was saying'."}
          - {w: "quisiera", f: "quis- + -iera → querer (to want), imperfect subjunctive (-ra form), I, used as a softened conditional: 'I would like, I wish'. quisiera, quisieras, quisiera, quisiéramos, quisierais, quisieran. The -ra form often stands where modern Spanish puts the conditional."}
          - {w: "haber oído", f: "haber (to have), infinitive, + oído, participle of oír (to hear): 'to have heard'."}
          - {w: "ha dicho", f: "ha, haber (to have), present, he (vuesa merced): he, has, ha, hemos, habéis, han; + dicho, participle of decir (to say): 'has said'."}
          - {w: "me casara", f: "cas- + -ara → casarse (to marry), imperfect subjunctive (-ra form), I, after 'antes que' (before). The -ra form of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran."}
          - {w: "dijera", f: "dij- + -era → decir (to say), imperfect subjunctive (-ra form), I, used as a conditional: 'I would say'. dijera, dijeras, dijera, dijéramos, dijerais, dijeran."}
          - {w: "suelto", f: "irregular participle of soltar (to loosen, set free), used as an adjective: 'loose'."}
          - {w: "se lame", f: "lam- + -e → lamerse (to lick oneself), present, it. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
        note: "The proverb means that the unyoked ox can tend to itself: a single man is free to look after his own comfort. Sancho, hearing the lecture on choosing a wife, wishes he had stayed a bachelor."
