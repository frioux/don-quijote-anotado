      - es: "Otro libro tengo, que le llamo Suplemento a Virgilio Polidoro, que trata de la invención de las cosas, que es de grande erudición y estudio, a causa que las cosas que se dejó de decir Polidoro de gran sustancia, las averiguo yo, y las declaro por gentil estilo."
