          - {w: "se me representa", f: "represent- + -a → representarse (to appear), present, it, with 'se' and 'me' (to me). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "conozca", f: "conozc- + -a → conocer (to know), present subjunctive, it (the world), after 'porque' meaning 'so that'. Irregular: conozca, conozcas, conozca, conozcamos, conozcáis, conozcan."}
          - {w: "favoreces", f: "favorec- + -es → favorecer (to favour), present, you (tú). Irregular in the I form: favorezco, favoreces, favorece, favorecemos, favorecéis, favorecen."}
          - {w: "habrá", f: "habr- + -á → haber (to have), future, used for 'there will be'. Irregular stem habr-: habré, habrás, habrá, habremos, habréis, habrán."}
          - {w: "acometa, acabe", f: "acomet- + -a → acometer (to attack), acab- + -e → acabar (to finish), present subjunctive, I, in a clause describing something that does not exist. The present subjunctive of -er verbs: -a, -as, -a, -amos, -áis, -an; of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
