          - {w: "sacudir", d: "to shake"}
          - {w: "menear", d: "to move about, jog, waggle"}
          - {w: "espacio", d: "a space of time, a while (not only physical space)"}
          - {w: "volver en sí", d: "to come to, regain consciousness"}
          - {w: "desperezarse", d: "to stretch one's limbs (on waking)"}
          - {w: "bien como si", d: "just as if"}
          - {w: "grave", d: "heavy, deep (of sleep)"}
        diagram:
          - s: "pero tanto le volvieron y revolvieron, sacudieron y menearon"
            r: "main verbs (after 'pero'): they turned him over and over, shook and jogged him so much"
            under:
              - s: "que al cabo de un buen espacio volvió en sí"
                r: "result: that after a good while he came to"
                under:
                  - {s: "desperezándose", r: "how: stretching himself"}
                  - {s: "bien como si de algún grave y profundo sueño despertara", r: "how: just as if he were waking from a heavy, deep sleep"}
        forms:
          - {w: "volvieron y revolvieron, sacudieron", f: "volv- + -ieron → volver (to turn), revolv- + -ieron → revolver (to turn over), sacud- + -ieron → sacudir (to shake), preterite, they. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "menearon", f: "mene- + -aron → menear (to jog, move about), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "le", f: "le = him, as direct object: leísmo, where modern Spanish prefers 'lo'."}
          - {w: "volvió", f: "volv- + -ió → volver (to return), preterite, he; 'volver en sí' = to come to. Same -er/-ir preterite."}
          - {w: "desperezándose", f: "desperezando, the gerund of desperezarse (to stretch), + se (himself), with an accent added to keep the stress."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun ('sueño')."}
          - {w: "despertara", f: "despert- + -ara → despertar (to wake), imperfect subjunctive (-ra form), he, required after 'como si' (as if). The -ra form of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran."}
