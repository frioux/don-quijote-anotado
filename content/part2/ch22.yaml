  - sentences:
      - es: "— Dios os lo perdone, amigos; que me habéis quitado de la más sabrosa y agradable vida y vista que ningún humano ha visto ni pasado."
        literal: "— God to-you it may-forgive, friends; for me you-have taken-away from the most delicious and pleasant life and sight that any human has seen nor lived-through."
        ormsby: "“God forgive you, friends; ye have taken me away from the sweetest and most delightful existence and spectacle that ever human being enjoyed or beheld."
        vocab:
          - {w: "sabroso", d: "delightful, sweet (literally 'tasty')"}
          - {w: "vista", d: "sight, spectacle, view"}
          - {w: "ningún humano", d: "any human being: after a superlative Spanish uses the negative 'ninguno' where English says 'any' or 'ever'"}
          - {w: "pasar", d: "here 'to live through, experience'"}
        diagram:
          - s: "Dios os lo perdone"
            r: "main verb 1: may God forgive you for it"
            under:
              - {s: "amigos", r: "addressed: friends"}
          - s: "que me habéis quitado"
            r: "main verb 2, a reason: for you have taken me away"
            under:
              - s: "de la más sabrosa y agradable vida y vista"
                r: "from what: from the sweetest and most pleasant life and sight"
                under:
                  - {s: "que ningún humano ha visto ni pasado", r: "describes 'vida y vista': that any human has ever seen or lived"}
        forms:
          - {w: "perdone", f: "perdon- + -e → perdonar (to forgive), present subjunctive, he (God), expressing a wish: 'may God forgive'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "os lo", f: "os = to you (vosotros, the familiar plural 'you'); lo = it (what they did)."}
          - {w: "habéis quitado", f: "hab- + -éis → haber (to have), present, you (vosotros, plural familiar): he, has, ha, hemos, habéis, han; + quitado, participle of quitar (to take away): present perfect 'you have taken away'."}
          - {w: "ningún", f: "ninguno (no, any) clipped before a masculine singular noun ('humano')."}
          - {w: "ha visto ni pasado", f: "ha, haber (to have), present, he (he, has, ha, hemos, habéis, han), + visto, the irregular participle of ver (to see), and pasado, participle of pasar (to live through): 'has seen or lived through'."}
      - es: "En efecto, ahora acabo de conocer que todos los contentos desta vida pasan como sombra y sueño, o se marchitan como la flor del campo."
        literal: "In effect, now I-finish of knowing that all the contentments of-this life pass like shadow and dream, or themselves wither like the flower of-the field."
        ormsby: "Now indeed do I know that all the pleasures of this life pass away like a shadow and a dream, or fade like the flower of the field."
        vocab:
          - {w: "en efecto", d: "indeed, in fact (not 'in effect')"}
          - {w: "acabar de + infinitive", d: "to have just done; here 'now I fully come to know'"}
          - {w: "contentos", d: "joys, pleasures (noun, not the adjective 'happy')"}
          - {w: "desta", d: "= de esta, of this"}
          - {w: "marchitarse", d: "to wither, fade"}
        diagram:
          - s: "acabo de conocer"
            r: "main verb: I have just come to know"
            under:
              - {s: "En efecto, ahora", r: "when: indeed, now"}
              - {s: "que todos los contentos desta vida pasan como sombra y sueño", r: "what I know, 1: that all the joys of this life pass like a shadow and a dream"}
              - {s: "o se marchitan como la flor del campo", r: "what I know, 2: or wither like the flower of the field"}
        forms:
          - {w: "acabo", f: "acab- + -o → acabar (to finish), present, I: acabo, acabas, acaba, acabamos, acabáis, acaban; 'acabar de' + conocer (to know) = to have just come to know."}
          - {w: "desta", f: "de + esta (of this): Cervantes fuses 'de' with these demonstratives."}
          - {w: "pasan", f: "pas- + -an → pasar (to pass), present, they (the joys). Same -ar present: -o, -as, -a, -amos, -áis, -an."}
          - {w: "se marchitan", f: "marchit- + -an → marchitarse (to wither), present, they, with 'se'. Same -ar present."}
          - {w: "del", f: "de + el: 'of the (field)'."}
        note: "Both images are biblical commonplaces: life passing like a shadow (Job, the Psalms) and man's days like the flower of the field (Psalm 103, Isaiah 40). Don Quijote speaks like a man woken from paradise."
      - es: "¡Oh desdichado Montesinos! ¡Oh mal ferido Durandarte! ¡Oh sin ventura Belerma!"
        literal: "Oh unfortunate Montesinos! Oh badly wounded Durandarte! Oh without fortune Belerma!"
        ormsby: "O ill-fated Montesinos! O sore-wounded Durandarte! O unhappy Belerma!"
        vocab:
          - {w: "desdichado", d: "unfortunate, ill-starred"}
          - {w: "mal ferido", d: "= malherido, badly wounded; 'ferido' is the old form of 'herido', in the language of the old ballads"}
          - {w: "sin ventura", d: "luckless, hapless"}
          - {w: "Montesinos", d: "a knight of Charlemagne's court in the Spanish ballads, cousin and friend of Durandarte; the cave is named after him"}
          - {w: "Durandarte", d: "a knight of the Carolingian ballads who dies at Roncesvalles and asks Montesinos to carry his heart to his lady Belerma"}
          - {w: "Belerma", d: "Durandarte's lady in the same ballads"}
        diagram:
          - {s: "¡Oh desdichado Montesinos!", r: "exclamation 1: oh unhappy Montesinos"}
          - {s: "¡Oh mal ferido Durandarte!", r: "exclamation 2: oh badly wounded Durandarte"}
          - {s: "¡Oh sin ventura Belerma!", r: "exclamation 3: oh hapless Belerma"}
        forms:
          - {w: "desdichado", f: "des- (un-) + dicha (good luck) + -ado: 'unlucky', masculine to match Montesinos."}
          - {w: "ferido", f: "fer- + -ido → ferir, old form of herir (to wound), participle, masculine to match Durandarte. Old Spanish f- became h- in modern spelling (fazer → hacer, to do; fermosura → hermosura)."}
          - {w: "sin ventura", f: "a phrase used as an adjective, 'without luck', placed before the name like 'desdichado' and 'mal ferido'."}
        note: "Don Quijote calls on figures from the old Carolingian ballads that every Spaniard knew: Durandarte, mortally wounded at Roncesvalles, his cousin Montesinos, and his lady Belerma. What he has to do with them he has not yet said."
      - es: "¡Oh lloroso Guadiana, y vosotras sin dicha ijas de Ruidera, que mostráis en vuestras aguas las que lloraron vuestros hermosos ojos!"
        literal: "Oh tearful Guadiana, and you without happiness daughters of Ruidera, who show in your waters those that wept your beautiful eyes!"
        ormsby: "O tearful Guadiana, and ye O hapless daughters of Ruidera who show in your waves the tears that flowed from your beauteous eyes!”"
        vocab:
          - {w: "lloroso", d: "tearful, weeping"}
          - {w: "Guadiana", d: "the river of La Mancha, which rises from the lakes of Ruidera"}
          - {w: "sin dicha", d: "unhappy, luckless ('dicha' = happiness, good fortune)"}
          - {w: "ijas", d: "= hijas, daughters (spelled without the h in the original edition)"}
          - {w: "Ruidera", d: "the lakes (lagunas) of Ruidera near the cave, a chain of lagoons that feed the Guadiana"}
          - {w: "las que", d: "those (waters) that: here the tears"}
        diagram:
          - {s: "¡Oh lloroso Guadiana", r: "exclamation 1: oh tearful Guadiana"}
          - s: "y vosotras sin dicha ijas de Ruidera"
            r: "exclamation 2: and you, unhappy daughters of Ruidera"
            under:
              - s: "que mostráis en vuestras aguas las"
                r: "describes 'ijas': who show in your waters those"
                under:
                  - {s: "que lloraron vuestros hermosos ojos!", r: "describes 'las': that your lovely eyes wept"}
        forms:
          - {w: "vosotras", f: "vosotras = you (feminine plural, familiar), because he speaks to the daughters."}
          - {w: "mostráis", f: "mostr- + -áis → mostrar (to show), present, you (vosotras). The stem o becomes ue when stressed: muestro, muestras, muestra, mostramos, mostráis, muestran."}
          - {w: "vuestras, vuestros", f: "vuestr- + -as / -os → vuestro (your, of vosotras), agreeing with the thing owned: feminine plural for 'aguas', masculine plural for 'ojos'."}
          - {w: "las que", f: "las = feminine plural, standing for 'aguas' (the waters, i.e. tears) + que (that)."}
          - {w: "lloraron", f: "llor- + -aron → llorar (to weep), preterite, they (the eyes). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
        note: "The Guadiana really does rise in the lakes of Ruidera, near the cave, and runs partly underground before reappearing. Don Quijote speaks to river and lakes as weeping persons; he has not yet explained why."
  - sentences:
