  - sentences:
      - es: "— Dígame, señor, así Dios le dé buena manderecha en la impresión de sus libros: ¿sabríame decir, que sí sabrá, pues todo lo sabe, quién fue el primero que se rascó en la cabeza, que yo para mí tengo que debió de ser nuestro padre Adán?"
        literal: "— Tell-me, sir, so God to-you may-give good right-hand in the printing of your books: would-you-know-for-me to-say, for yes you-will-know, since all it you-know, who was the first that himself-scratched on the head, for I for me hold that he-must of be our father Adam?"
        ormsby: "“Tell me, señor—and God give you luck in printing your books—can you tell me (for of course you know, as you know everything) who was the first man that scratched his head? For to my thinking it must have been our father Adam.”"
        vocab:
          - {w: "así Dios le dé", d: "so may God give you: a blessing used to back a request, 'as you hope God will give you'"}
          - {w: "manderecha", d: "good luck, success (from 'mano derecha', right hand); 'buena manderecha' = good fortune"}
          - {w: "impresión", d: "printing, publication"}
          - {w: "que sí sabrá", d: "for surely you will know"}
          - {w: "rascarse", d: "to scratch oneself"}
          - {w: "tener para sí", d: "to believe, be of the opinion: 'yo para mí tengo' = I hold, I reckon"}
          - {w: "deber de + infinitive", d: "must have (supposition): 'debió de ser' = it must have been"}
        diagram:
          - s: "Dígame, señor"
            r: "main verb 1: tell me, sir"
            under:
              - {s: "así Dios le dé buena manderecha en la impresión de sus libros:", r: "blessing: so may God give you good luck in printing your books"}
          - s: "¿sabríame decir"
            r: "main verb 2: could you tell me"
            under:
              - {s: "que sí sabrá, pues todo lo sabe", r: "aside: for of course you will know, since you know everything"}
              - {s: "quién fue el primero que se rascó en la cabeza", r: "what to tell: who was the first man who scratched his head"}
              - s: "que yo para mí tengo"
                r: "why he asks: for I believe"
                under:
                  - {s: "que debió de ser nuestro padre Adán?", r: "what he believes: that it must have been our father Adam"}
        forms:
          - {w: "Dígame", f: "dig- + -a + me → decir (to say), present subjunctive used as a polite command, you (vuestra merced), with 'me' (to me) stuck on the end and an accent added: 'tell me'. diga, digas, diga, digamos, digáis, digan."}
          - {w: "dé", f: "dé → dar (to give), present subjunctive, he (God), expressing a wish: 'may God give'. dé, des, dé, demos, deis, den; the accent tells it from the preposition 'de'."}
          - {w: "sabríame", f: "sabr- + -ía + me → saber (to know), conditional, you (vuestra merced), with 'me' (for me) stuck on the end; modern 'me sabría'. Irregular stem sabr-: sabría, sabrías, sabría, sabríamos, sabríais, sabrían. Cervantes often hangs pronouns on a verb that opens its clause, adding a written accent."}
          - {w: "sabrá", f: "sabr- + -á → saber (to know), future, you (vuestra merced). Irregular stem sabr-: sabré, sabrás, sabrá, sabremos, sabréis, sabrán."}
          - {w: "sabe", f: "sab- + -e → saber (to know), present, you (vuestra merced). Irregular: sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "fue", f: "fue → ser (to be), preterite, he: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "se rascó", f: "rasc- + -ó → rascar (to scratch) + se (himself), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "tengo", f: "teng- + -o → tener (to have, hold), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "debió de ser", f: "deb- + -ió → deber (must), preterite, he: debí, debiste, debió, debimos, debisteis, debieron; + de + ser (to be): 'he must have been', a guess about the past."}
        note: "Sancho mocks the cousin's 'who was the first' book with a riddle of his own. The question was a familiar folk joke, which is why Don Quijote soon says Sancho has heard it from someone else."
  - sentences:
      - es: "— Sí sería —respondió el primo—, porque Adán no hay duda sino que tuvo cabeza y cabellos; y, siendo esto así, y siendo el primer hombre del mundo, alguna vez se rascaría."
        literal: "— Yes it-would-be —answered the cousin—, because Adam not there-is doubt but that he-had head and hairs; and, being this so, and being the first man of-the world, some time himself he-would-scratch."
        ormsby: "“So it must,” replied the cousin; “for there is no doubt but Adam had a head and hair; and being the first man in the world he would have scratched himself sometimes.”"
        vocab:
          - {w: "sí sería", d: "so it would be, so it must have been (conditional of probability)"}
          - {w: "no hay duda sino que", d: "there is no doubt but that"}
          - {w: "cabellos", d: "hair (of the head)"}
          - {w: "alguna vez", d: "at some time, now and then"}
