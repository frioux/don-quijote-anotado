          - {s: "pero téngolo por dificultoso", r: "main verb 2: but I consider it difficult"}
        forms:
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "sea", f: "se- + -a → ser (to be), present subjunctive, it, after a denied 'no digo que'. sea, seas, sea, seamos, seáis, sean."}
