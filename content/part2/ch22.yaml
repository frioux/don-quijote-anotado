          - {w: "tener a mala señal", d: "to take as a bad omen"}
          - {w: "escusar", d: "= excusar (old spelling); 'escusar de' + infinitive = to avoid, refrain from doing"}
          - {w: "encerrarse", d: "to shut oneself up, enclose oneself"}
          - {w: "semejante", d: "after a noun: such, of that kind ('lugar semejante' = such a place)"}
