          - {w: "sí, que", d: "why yes, for: emphatic opening"}
          - {w: "tocarle a uno", d: "to be someone's business, fall to someone"}
          - {w: "atañer", d: "to concern, be the business of"}
          - {w: "escudriñador", d: "searcher, explorer, prier into things"}
          - {w: "desta", d: "= de esta, of this (one): the cave"}
          - {w: "deber de", d: "must (probability): 'debe de ser' = it must be"}
          - {w: "mazmorra", d: "dungeon, an underground prison, especially the pits where the Moors kept Christian captives"}
        diagram:
          - s: "no le toca ni atañe"
            r: "main verb: it is not your business nor your concern"
            under:
              - {s: "Sí, que", r: "opening: why indeed"}
              - {s: "a vuestra merced", r: "to whom: to your worship"}
              - s: "ser el escudriñador desta"
                r: "subject: to be the explorer of this (cave)"
                under:
                  - {s: "que debe de ser peor que mazmorra", r: "describes 'esta': which must be worse than a dungeon"}
        forms:
          - {w: "le toca", f: "toc- + -a → tocar (to fall to, concern), present, it, with 'le' (to you) doubling 'a vuestra merced'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "atañe", f: "atañ- + -e → atañer (to concern), present, it. The present of -er verbs: -o, -es, -e, -emos, -éis, -en; this verb is used almost only in the 'it' and 'they' forms (atañe, atañen)."}
          - {w: "escudriñador", f: "escudriñ(ar) (to search, pry) + -dor (the one who does it): 'searcher'."}
          - {w: "desta", f: "de + esta (of this): Cervantes fuses 'de' with these pronouns; 'esta' stands for 'la cueva'."}
          - {w: "debe de ser", f: "deb- + -e → deber (to owe, must), present, it: debo, debes, debe, debemos, debéis, deben; + de + ser (to be): 'it must be' (a guess)."}
  - sentences:
      - es: "— Ata y calla —respondió don Quijote—, que tal empresa como aquésta, Sancho amigo, para mí estaba guardada."
        literal: "— Tie and be-quiet —answered Don Quijote—, for such enterprise as this-one, Sancho friend, for me was kept."
        ormsby: "“Tie me and hold thy peace,” said Don Quixote, “for an emprise like this, friend Sancho, was reserved for me;”"
        ormsby_note: "A line from the ballad in the Guerras Civiles de Granada, “Estando el Rey Don Fernando.”"
        vocab:
          - {w: "callar", d: "to be quiet, hold one's peace"}
          - {w: "empresa", d: "enterprise, emprise, a knightly undertaking (not 'company')"}
          - {w: "aquésta", d: "= ésta, this one (old emphatic form)"}
          - {w: "guardado para", d: "kept for, reserved for"}
        diagram:
          - {s: "Ata y calla", r: "main verbs: tie and be quiet"}
          - {s: "respondió don Quijote", r: "speech tag: answered Don Quijote"}
          - s: "que tal empresa ... para mí estaba guardada"
            r: "reason: for such an enterprise was reserved for me"
            under:
              - {s: "como aquésta", r: "compared with: as this one"}
              - {s: "Sancho amigo", r: "addressed: friend Sancho"}
        forms:
          - {w: "Ata, calla", f: "at- + -a → atar (to tie), call- + -a → callar (to be quiet), commands to tú. The tú command of -ar verbs is the same as the he/she present: ata, calla."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "aquésta", f: "aqu- + ésta: old reinforced form of 'ésta' (this one), feminine to match 'empresa'."}
          - {w: "estaba guardada", f: "est- + -aba → estar (to be), imperfect, it: estaba, estabas, estaba, estábamos, estabais, estaban; + guardada, participle of guardar (to keep), feminine to match 'empresa': 'was kept'."}
        note: "Don Quijote answers with a line from a ballad of the Moorish wars of Granada, where it is spoken by the knight who claims the dangerous mission for himself: as so often, he casts himself as the hero of a romance."
  - sentences:
