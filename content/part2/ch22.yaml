part: 2
chapter: 22
title_es: "Capítulo XXII. Donde se da cuenta de la grande aventura de la cueva de Montesinos, que está en el corazón de la Mancha, a quien dio felice cima el valeroso don Quijote de la Mancha"
title_en: "Wherein is related the grand adventure of the cave of Montesinos in the heart of La Mancha, which the valiant Don Quixote brought to a happy termination"
paragraphs:
  - sentences:
      - es: "Grandes fueron y muchos los regalos que los desposados hicieron a don Quijote, obligados de las muestras que había dado defendiendo su causa, y al par de la valentía le graduaron la discreción, teniéndole por un Cid en las armas y por un Cicerón en la elocuencia."
        literal: "Great were and many the gifts that the newly-weds made to Don Quijote, obliged by the proofs that he-had given defending their cause, and on-a-par with the valour to-him they-ranked the wisdom, holding-him for a Cid in the arms and for a Cicero in the eloquence."
        ormsby: "Many and great were the attentions shown to Don Quixote by the newly married couple, who felt themselves under an obligation to him for coming forward in defence of their cause; and they exalted his wisdom to the same level with his courage, rating him as a Cid in arms, and a Cicero in eloquence."
        vocab:
          - {w: "regalos", d: "gifts, but also attentions, kind treatment, entertainment"}
          - {w: "los desposados", d: "the newly-weds, bride and groom (Basilio and Quiteria)"}
          - {w: "obligado de", d: "obliged by, bound in gratitude for"}
          - {w: "muestras", d: "signs, proofs, displays (of goodwill)"}
          - {w: "al par de", d: "on a level with, equal to"}
          - {w: "graduar", d: "to rank, rate, grade (as a university grants a degree)"}
          - {w: "discreción", d: "wisdom, good sense, wit (a false friend: not 'discretion' only)"}
          - {w: "tener por", d: "to consider, take for"}
          - {w: "el Cid", d: "Rodrigo Díaz de Vivar (d. 1099), the Castilian warrior hero of epic and ballad, the model of valour"}
          - {w: "Cicerón", d: "Cicero, the Roman orator (106-43 BC), the model of eloquence"}
        diagram:
          - s: "Grandes fueron y muchos los regalos"
            r: "main verb 1: great and many were the gifts"
            under:
              - s: "que los desposados hicieron a don Quijote"
                r: "describes 'regalos': that the newly-weds gave Don Quijote"
                under:
                  - s: "obligados de las muestras"
                    r: "why: obliged by the proofs"
                    under:
                      - {s: "que había dado defendiendo su causa", r: "describes 'muestras': that he had given by defending their cause"}
          - s: "y al par de la valentía le graduaron la discreción"
            r: "main verb 2: and they ranked his wisdom equal to his courage"
            under:
              - {s: "teniéndole por un Cid en las armas", r: "how: taking him for a Cid in arms"}
              - {s: "y por un Cicerón en la elocuencia", r: "and: for a Cicero in eloquence"}
        forms:
          - {w: "Grandes fueron y muchos", f: "fueron = ser (to be), preterite, they: fui, fuiste, fue, fuimos, fuisteis, fueron. 'Grandes' and 'muchos' are masculine plural to match 'regalos'; the adjectives are put first for emphasis."}
          - {w: "hicieron", f: "hic- + -ieron → hacer (to make, do), preterite, they: 'made, gave'. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "obligados", f: "oblig- + -ados → obligar (to oblige), participle, masculine plural to match 'desposados'."}
          - {w: "había dado", f: "había, haber (to have), imperfect, he: había, habías, había, habíamos, habíais, habían; + dado, participle of dar (to give): pluperfect 'he had given'."}
          - {w: "defendiendo", f: "defend- + -iendo → defender (to defend), gerund: 'by defending'."}
          - {w: "le graduaron", f: "gradu- + -aron → graduar (to rank), preterite, they; 'le' = to him, his (wisdom). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "teniéndole", f: "teniendo, gerund of tener (to hold), + le (him) stuck on the end, with an accent added to keep the stress: 'holding him (to be)'. 'le' for a male person as direct object is leísmo, normal in Cervantes."}
        note: "The couple are Basilio and Quiteria, married at the end of the previous chapter by Basilio's trick, with Don Quijote's lance keeping the peace. 'A Cid in arms and a Cicero in eloquence' joins the two ideals of arms and letters."
      - es: "El buen Sancho se refociló tres días a costa de los novios, de los cuales se supo que no fue traza comunicada con la hermosa Quiteria el herirse fingidamente, sino industria de Basilio, esperando della el mesmo suceso que se había visto;"
        literal: "The good Sancho himself-regaled three days at cost of the newly-weds, from the which [it] itself was-learned that not was [a] scheme shared with the beautiful Quiteria the wounding-himself feignedly, but contrivance of Basilio, expecting from-it the same outcome that itself had seen;"
        ormsby: "Worthy Sancho enjoyed himself for three days at the expense of the pair, from whom they learned that the sham wound was not a scheme arranged with the fair Quiteria, but a device of Basilio’s, who counted on exactly the result they had seen;"
        ormsby_note: "It is difficult to see why Cervantes should have gone out of his way to make such a cold-blooded monster of the fair Quiteria as this gratuitous admission of his makes her."
        vocab:
          - {w: "refocilarse", d: "to enjoy oneself, make merry, regale oneself (with food and drink)"}
          - {w: "a costa de", d: "at the expense of"}
          - {w: "novios", d: "the bride and groom, the newly married pair"}
          - {w: "traza", d: "plan, scheme, plot"}
          - {w: "comunicado con", d: "shared with, agreed with (someone)"}
          - {w: "fingidamente", d: "feignedly, in pretence"}
          - {w: "industria", d: "ingenuity, cunning, contrivance (a false friend: not 'industry')"}
          - {w: "della", d: "= de ella, from it (the trick)"}
          - {w: "mesmo", d: "= mismo, same (old form)"}
          - {w: "suceso", d: "outcome, result (a false friend: not 'success')"}
        diagram:
          - s: "El buen Sancho se refociló tres días"
            r: "main verb 1: good Sancho feasted for three days"
            under:
              - s: "a costa de los novios"
                r: "how: at the couple's expense"
                under:
                  - s: "de los cuales se supo"
                    r: "describes 'novios': from whom it was learned"
                    under:
                      - s: "que no fue traza comunicada con la hermosa Quiteria el herirse fingidamente"
                        r: "what was learned: that the sham wounding was not a plot shared with Quiteria"
                      - s: "sino industria de Basilio"
                        r: "contrast: but Basilio's own contrivance"
                        under:
                          - s: "esperando della el mesmo suceso"
                            r: "how: expecting from it the same result"
                            under:
                              - {s: "que se había visto", r: "describes 'suceso': that had been seen"}
        forms:
          - {w: "buen", f: "bueno (good) clipped before a masculine singular noun ('Sancho')."}
          - {w: "se refociló", f: "refocil- + -ó → refocilarse (to make merry), preterite, he, with 'se' (himself). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "los cuales", f: "cual (which) with article, masculine plural to match 'novios': 'from whom'."}
          - {w: "se supo", f: "sup- + -o → saber (to know, learn), preterite, it, with passive 'se': 'it was learned'. Irregular: supe, supiste, supo, supimos, supisteis, supieron."}
          - {w: "fue", f: "ser (to be), preterite, it. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "comunicada", f: "comunic- + -ada → comunicar (to share), participle, feminine to match 'traza'."}
          - {w: "el herirse", f: "herir (to wound) + se (himself), infinitive used as a noun with 'el': 'the wounding himself', the subject of 'fue'."}
          - {w: "fingidamente", f: "fingida (feigned, from fingir, to feign) + -mente, the adverb ending: 'feignedly'."}
          - {w: "esperando", f: "esper- + -ando → esperar (to expect), gerund: 'expecting'."}
          - {w: "della", f: "de + ella (of, from it): Cervantes fuses 'de' with these pronouns."}
          - {w: "se había visto", f: "había, haber (to have), imperfect, it: había, habías, había, habíamos, habíais, habían; + visto, participle of ver (to see); with passive 'se': 'had been seen'."}
        note: "Quiteria, then, was not in on the trick: Basilio staged his suicide alone and gambled on how she would respond. Ormsby finds this admission hard to like, since it leaves her calmly passing from Camacho to Basilio without any plan of her own."
      - es: "bien es verdad que confesó que había dado parte de su pensamiento a algunos de sus amigos, para que al tiempo necesario favoreciesen su intención y abonasen su engaño."
        literal: "well is [it] true that he-confessed that he-had given part of his thought to some of his friends, so that at-the time needful they-might-favour his intention and might-vouch-for his deceit."
        ormsby: "he confessed, it is true, that he had confided his idea to some of his friends, so that at the proper time they might aid him in his purpose and insure the success of the deception."
        vocab:
          - {w: "bien es verdad que", d: "it is true that, admittedly (conceding a point)"}
          - {w: "dar parte de", d: "to inform of, let (someone) in on"}
          - {w: "pensamiento", d: "thought, here 'plan, idea'"}
          - {w: "al tiempo necesario", d: "at the right moment, when needed"}
          - {w: "favorecer", d: "to support, back up"}
          - {w: "abonar", d: "to back up, vouch for, make good (as one guarantees a debt)"}
          - {w: "engaño", d: "deceit, trick"}
        diagram:
          - s: "bien es verdad"
            r: "main verb: it is true"
            under:
              - s: "que confesó"
                r: "what is true: that he confessed"
                under:
                  - s: "que había dado parte de su pensamiento a algunos de sus amigos"
                    r: "what he confessed: that he had told his plan to some friends"
                    under:
                      - {s: "para que al tiempo necesario favoreciesen su intención", r: "purpose: so that at the right time they would support his aim"}
                      - {s: "y abonasen su engaño", r: "purpose 2: and back up his trick"}
        forms:
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "confesó", f: "confes- + -ó → confesar (to confess), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "había dado", f: "había, haber (to have), imperfect, he: había, habías, había, habíamos, habíais, habían; + dado, participle of dar (to give): 'he had given'."}
          - {w: "algunos", f: "alguno (some), masculine plural to match 'amigos'."}
          - {w: "al", f: "a + el, the contraction: 'at the (right time)'."}
          - {w: "favoreciesen", f: "favorec- + -iesen → favorecer (to support), imperfect subjunctive (-se form), they, after 'para que' (so that). The -se form of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen."}
          - {w: "abonasen", f: "abon- + -asen → abonar (to vouch for), imperfect subjunctive (-se form), they, also after 'para que'. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "su", f: "his (Basilio's); 'su' agrees with the thing owned ('intención', 'engaño'), not the owner."}
  - sentences:
      - es: "— No se pueden ni deben llamar engaños —dijo don Quijote— los que ponen la mira en virtuosos fines."
        literal: "— Not themselves can nor ought to-be-called deceits —said Don Quijote— those that put the aim on virtuous ends."
        ormsby: "“That,” said Don Quixote, “is not and ought not to be called deception which aims at virtuous ends;”"
        vocab:
          - {w: "poner la mira en", d: "to aim at, set one's sights on ('mira' = the sight of a gun, aim)"}
          - {w: "fines", d: "ends, goals, purposes"}
        diagram:
          - s: "No se pueden ni deben llamar engaños"
            r: "main verb: cannot and should not be called deceits"
            under:
              - {s: "dijo don Quijote", r: "speaker: said Don Quijote"}
              - s: "los"
                r: "subject: those (tricks)"
                under:
                  - {s: "que ponen la mira en virtuosos fines", r: "describes 'los': that aim at virtuous ends"}
        forms:
          - {w: "se pueden", f: "pued- + -en → poder (can, to be able), present, they, with passive 'se': 'they cannot be (called)'. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "deben", f: "deb- + -en → deber (ought, must), present, they. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "llamar", f: "llamar (to call), infinitive after 'pueden' and 'deben'; the 'se' before 'pueden' makes the whole phrase passive: 'be called'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "ponen", f: "pon- + -en → poner (to put), present, they. Irregular 'I' form: pongo, pones, pone, ponemos, ponéis, ponen."}
          - {w: "virtuosos", f: "virtuoso (virtuous), masculine plural to match 'fines'; the adjective goes first, a literary order."}
        note: "Don Quijote's defence of Basilio: a deceit aimed at a virtuous end (marrying the woman who loves him) is not deceit. He repeats in a maxim what he argued at the wedding: in love, as in war, stratagems are allowed."
  - sentences:
      - es: "Y que el de casarse los enamorados era el fin de más excelencia, advirtiendo que el mayor contrario que el amor tiene es la hambre y la continua necesidad, porque el amor es todo alegría, regocijo y contento, y más cuando el amante está en posesión de la cosa amada, contra quien son enemigos opuestos y declarados la necesidad y la pobreza;"
        literal: "And that the [end] of marrying-themselves the lovers was the end of most excellence, warning that the greatest adversary that the love has is the hunger and the continual need, because the love is all joy, merriment and contentment, and more when the lover is in possession of the thing loved, against which are enemies opposed and declared the need and the poverty;"
        ormsby: "and the marriage of lovers he maintained to be a most excellent end, reminding them, however, that love has no greater enemy than hunger and constant want; for love is all gaiety, enjoyment, and happiness, especially when the lover is in the possession of the object of his love, and poverty and want are the declared enemies of all these;"
        vocab:
          - {w: "el de casarse", d: "the [end] of marrying, the end that is marriage ('el' stands for 'el fin')"}
          - {w: "los enamorados", d: "the lovers, those in love"}
          - {w: "advertir", d: "to point out, warn, note (not 'to advertise')"}
          - {w: "contrario", d: "adversary, opponent, enemy"}
          - {w: "la hambre", d: "= el hambre, hunger; feminine 'la' before stressed a- was still normal then"}
          - {w: "necesidad", d: "need, want, poverty"}
          - {w: "regocijo", d: "merriment, rejoicing"}
          - {w: "contento", d: "contentment, happiness (as a noun)"}
          - {w: "y más cuando", d: "and especially when"}
          - {w: "la cosa amada", d: "the beloved (literally 'the thing loved'), a stock phrase of love poetry"}
        diagram:
          - s: "Y que el de casarse los enamorados era el fin de más excelencia"
            r: "main verb 1 (reported, continuing 'dijo'): and that lovers marrying was the most excellent end"
          - s: "advirtiendo"
            r: "how: pointing out"
            under:
              - s: "que el mayor contrario que el amor tiene es la hambre y la continua necesidad"
                r: "what he pointed out: that love's greatest enemy is hunger and constant want"
                under:
                  - s: "porque el amor es todo alegría, regocijo y contento"
                    r: "why: because love is all joy, merriment and contentment"
                    under:
                      - s: "y más cuando el amante está en posesión de la cosa amada"
                        r: "especially when: when the lover possesses the beloved"
                        under:
                          - {s: "contra quien son enemigos opuestos y declarados la necesidad y la pobreza", r: "describes 'alegría ... contento': against which want and poverty are open, declared enemies"}
        forms:
          - {w: "casarse", f: "casar (to marry) + se (themselves), infinitive after 'el de' used as a noun; its subject 'los enamorados' follows."}
          - {w: "era", f: "ser (to be), imperfect, it: era, eras, era, éramos, erais, eran. Imperfect because the speech is reported ('he said that ... was')."}
          - {w: "advirtiendo", f: "advirt- + -iendo → advertir (to point out), gerund: the e of the stem turns to i in the gerund (advertir → advirtiendo)."}
          - {w: "mayor", f: "comparative of grande (great): 'greater', with 'el' 'the greatest'."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, it. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son. Present here because the maxim holds always."}
          - {w: "está", f: "estar (to be), present, he: estoy, estás, está, estamos, estáis, están."}
          - {w: "amada", f: "am- + -ada → amar (to love), participle, feminine to match 'cosa'."}
          - {w: "son", f: "ser (to be), present, they (necesidad y pobreza, put after the verb): soy, eres, es, somos, sois, son."}
          - {w: "opuestos y declarados", f: "opuesto, participle of oponer (to oppose), and declarado, participle of declarar (to declare), masculine plural to match 'enemigos'."}
      - es: "y que todo esto decía con intención de que se dejase el señor Basilio de ejercitar las habilidades que sabe, que, aunque le daban fama, no le daban dineros, y que atendiese a granjear hacienda por medios lícitos e industriosos, que nunca faltan a los prudentes y aplicados."
        literal: "and that all this he-was-saying with intention of that should-leave-off the señor Basilio from practising the skills that he-knows, which, although to-him they-gave fame, not to-him they-gave money, and that he-should-attend to gaining property by means lawful and industrious, which never fail to the prudent and diligent."
        ormsby: "which he said to urge Señor Basilio to abandon the practice of those accomplishments he was skilled in, for though they brought him fame, they brought him no money, and apply himself to the acquisition of wealth by legitimate industry, which will never fail those who are prudent and persevering."
        vocab:
          - {w: "con intención de que", d: "with the aim that, in order that"}
          - {w: "dejarse de", d: "to give up, leave off (doing something)"}
          - {w: "ejercitar", d: "to practise, exercise"}
          - {w: "habilidades", d: "skills, accomplishments (Basilio's sports, music and fencing)"}
          - {w: "dineros", d: "money (the plural was common then)"}
          - {w: "atender a", d: "to apply oneself to, see to (not 'to attend')"}
          - {w: "granjear", d: "to earn, acquire, gain"}
          - {w: "hacienda", d: "wealth, property, estate"}
          - {w: "lícito", d: "lawful, legitimate"}
          - {w: "industrioso", d: "hard-working, diligent; here 'by honest effort'"}
          - {w: "aplicado", d: "diligent, hard-working"}
        diagram:
          - s: "y que todo esto decía"
            r: "main verb (reported): and that he said all this"
            under:
              - s: "con intención de que se dejase el señor Basilio de ejercitar las habilidades"
                r: "purpose: so that Basilio would give up practising the skills"
                under:
                  - {s: "que sabe", r: "describes 'habilidades': that he has"}
                  - {s: "que, aunque le daban fama, no le daban dineros", r: "describes 'habilidades': which, though they gave him fame, gave him no money"}
              - s: "y que atendiese a granjear hacienda por medios lícitos e industriosos"
                r: "purpose 2: and that he would set about earning property by honest, hard-working means"
                under:
                  - {s: "que nunca faltan a los prudentes y aplicados", r: "describes 'medios': which never fail the prudent and diligent"}
        forms:
          - {w: "decía", f: "dec- + -ía → decir (to say), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "se dejase", f: "dej- + -ase → dejarse (to give up), imperfect subjunctive (-se form), he, after 'con intención de que'. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "sabe", f: "sab- + -e → saber (to know), present, he: sé, sabes, sabe, sabemos, sabéis, saben. Present tense slips in from Don Quijote's own words."}
          - {w: "daban", f: "d- + -aban → dar (to give), imperfect, they (the skills): daba, dabas, daba, dábamos, dabais, daban."}
          - {w: "atendiese", f: "atend- + -iese → atender (to apply oneself), imperfect subjunctive (-se form), he, still depending on 'con intención de que'. The -se form of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen."}
          - {w: "e", f: "'y' (and) becomes 'e' before a word starting with i-: 'lícitos e industriosos'."}
          - {w: "faltan", f: "falt- + -an → faltar (to fail, be lacking), present, they (the means): falto, faltas, falta, faltamos, faltáis, faltan."}
        note: "Basilio, the poor suitor, was famous in the previous chapters for running, wrestling, playing ball, singing and fencing. Don Quijote advises him that such gifts bring fame but not bread, and that a married man must now earn a living."
  - sentences:
      - es: "— El pobre honrado, si es que puede ser honrado el pobre, tiene prenda en tener mujer hermosa, que, cuando se la quitan, le quitan la honra y se la matan."
        literal: "— The poor-man honourable, if [it] is that can be honourable the poor-man, has [a] jewel in having wife beautiful, which, when from-him her they-take-away, from-him they-take-away the honour and for-him it they-kill."
        ormsby: "The poor man who is a man of honour (if indeed a poor man can be a man of honour) has a jewel when he has a fair wife, and if she is taken from him, his honour is taken from him and slain."
        vocab:
          - {w: "honrado", d: "honourable, a man of honour (honour here is social standing as much as virtue)"}
          - {w: "si es que", d: "if indeed, if it is the case that"}
          - {w: "prenda", d: "a jewel, treasure; also a pledge, something held as security"}
          - {w: "quitar", d: "to take away (from someone)"}
          - {w: "honra", d: "honour, good name, reputation in the eyes of others"}
        diagram:
          - s: "tiene prenda"
            r: "main verb: has a jewel"
            under:
              - {s: "El pobre honrado", r: "subject: the honourable poor man"}
              - {s: "si es que puede ser honrado el pobre", r: "aside: if indeed a poor man can be honourable"}
              - s: "en tener mujer hermosa"
                r: "in what: in having a beautiful wife"
                under:
                  - s: "que, cuando se la quitan, le quitan la honra y se la matan"
                    r: "describes 'mujer': who, when they take her from him, take his honour and kill it"
        forms:
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "puede", f: "pued- + -e → poder (can, to be able), present, he (the poor man). The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, he. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "tener", f: "tener (to have), infinitive after 'en': 'in having'."}
          - {w: "se la quitan", f: "quit- + -an → quitar (to take away), present, they (unnamed people, 'one'), with 'la' (her, the wife) and 'se' (from him): 'le' turns into 'se' before 'la'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "le quitan", f: "quitar (to take away), present, they, with 'le' (from him): 'they take from him'. Same present: quito, quitas, quita, quitamos, quitáis, quitan."}
