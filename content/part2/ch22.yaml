summary: |
  The newlyweds Basilio and Quiteria load Don Quijote with gifts and praise him as a Cid in arms and a Cicero in eloquence, and Sancho feasts for three days at their expense. It comes out that the sham suicide was Basilio's own scheme, shared with a few friends but not with Quiteria. Don Quijote declares that a trick aimed at a virtuous end is no deceit, and then lectures Basilio: poverty is love's worst enemy, so he should give up his showy accomplishments and earn a living honestly; a beautiful wife married to a poor man is besieged by birds of prey, and a man looking for a wife should care more for her good name than for her fortune.

  Sancho mutters that his master, who says Sancho could preach from a pulpit, could preach from two on each finger. Overheard, he says he wishes he had heard all this before he married, and grumbles about his wife Teresa; Don Quijote rebukes him for speaking ill of the mother of his children.

  Don Quijote asks the licentiate for a guide to the cave of Montesinos, and is given the licentiate's cousin, a 'humanist' who writes books for the press: a Book of Liveries with seven hundred and three devices for courtiers, a burlesque Spanish Ovid explaining the origins of Spanish landmarks and fountains, and a Supplement to Polydore Vergil recording who first caught a cold and who first took the cure for syphilis. Sancho tests him with riddles (who first scratched his head, who was the first tumbler) and answers the second himself: Lucifer, thrown out of heaven.

  They spend the night in a small village, buy a hundred fathoms of rope, and reach the cave, its mouth choked with brambles and wild figs. Tied in the rope over his doublet, Don Quijote prays to God and to Dulcinea, hacks at the bushes, is knocked down by a cloud of crows and bats, and has himself lowered into the dark while Sancho blesses him. When the rope runs out they wait half an hour, haul it up and, after a fright when it comes up weightless, pull out Don Quijote, apparently asleep. Once woken he reproaches them for taking him from the most delightful life ever seen, laments Montesinos, Durandarte, Belerma, the Guadiana and the daughters of Ruidera, refuses to call the place hell, eats, and tells his companions to sit still and listen.
context: |
  Marriage, poverty and honour. Don Quijote's sermon to Basilio is a set piece of Golden Age moral advice. Honour, for a man, lay largely in his wife's chastity and in her reputation, so a poor man with a beautiful wife was thought to be in constant danger: the eagles and hawks of his image are the rich and powerful who stoop on beauty, the crows and kites the lesser predators drawn by need. His rule that a woman's good name depends on seeming good as well as being good, and that public freedom does more harm than private faults, is the commonplace of the conduct books. The sage who said there was only one good woman in the world is left unnamed ('no sé qué sabio'), and the advice that every husband should believe she is his own wife is offered as practical wisdom. 'La mujer buena es corona de su marido' echoes Proverbs 12:4. Ormsby notes that the admission that Quiteria knew nothing of the plot makes her a 'cold-blooded monster', since she married the man she thought was dying.

  The humanist cousin. Cervantes now introduces a new comic type: the hack scholar. 'Humanista' had meant a student of classical languages and letters; the cousin uses it for compiling useless information. His Book of Liveries supplies ready-made colours, mottoes and 'cifras' (monograms and emblems) for courtiers riding in tournaments and festivals, where each knight's livery declared his mood: jealous, scorned, forgotten, absent. His 'Spanish Ovid' imitates Ovid's Metamorphoses, the Latin poem of mythical transformations, by inventing origins for Spanish landmarks: the Giralda tower of Seville with its turning bronze figure, the ancient stone bulls of Guisando, a weathercock at Salamanca, a sewer at Córdoba and a string of Madrid fountains (Ormsby identifies them). His 'Supplement' completes Polydore Vergil, the Italian humanist whose De inventoribus rerum (1499) recorded the first inventors of things, with the first man to catch a cold and the first to take the mercury 'unciones' for the 'morbo gálico', the French disease, syphilis. Sancho's riddles parody the same kind of learning, and Don Quijote's verdict, that some men tire themselves finding out things that do not matter a farthing, is the chapter's judgment on it.

  The cave and the lakes. The cave of Montesinos and the lagoons of Ruidera are real places in La Mancha, south-east of Argamasilla de Alba. Ormsby, who went there, says the village is clearly Ruidera, that the cave lies about two leagues across the hills from it, and that Cervantes exaggerated its size: the mouth is eight or ten feet wide and the depth fifty or sixty, with no need for a rope. The lakes form a chain from which the Guadiana flows; the river was famous for disappearing underground and rising again further on, a natural wonder that invited legends. Local tradition attached to the cave the name of Montesinos, a hero of the Carolingian ballads, and the ballads of Montesinos and Durandarte were among the best known in Spain: Durandarte, dying after Roncesvalles, asks his cousin Montesinos to carry his heart to his lady Belerma. Don Quijote's cries on waking ('¡Oh desdichado Montesinos! ¡Oh mal ferido Durandarte!') come straight out of that ballad world. What he says he saw is the matter of the next chapter.

  The descent as romance. Knights of chivalry often enter caves, wells and enchanted underworlds, and the descent into the underworld is as old as the Odyssey and the Aeneid. Cervantes stages it with every ritual: a prayer to God, a prayer to the lady, a sword drawn against the brambles, an evil omen of crows and bats that the narrator says a less Christian man would have heeded, and a squire's blessing calling on the shrines of the Peña de Francia and the Trinity of Gaeta (Ormsby explains both). Don Quijote's line 'tal empresa como aquésta para mí estaba guardada' is, Ormsby notes, a line from a ballad in the Guerras civiles de Granada. Against all this sits the plain report of what the cousin and Sancho actually do: they pay out a hundred fathoms of rope, wait half an hour, and haul up a man who seems to be asleep. The title's 'felice cima', a happy conclusion, is ironic: the adventure consists entirely of being let down on a rope and pulled up again.

  Sancho and Teresa. Sancho's proverb 'el buey suelto bien se lame', the ox that's loose licks itself well, praises freedom from marriage; his grumbles about Teresa are comic rather than bitter, and Don Quijote defends her as the mother of his children. His two ironic images of his master preaching, from a pulpit in each hand and two on each finger, turn Don Quijote's own compliment back on him.

  Reading Cervantes' Spanish. Archaisms in this chapter: mesmo and mesma (mismo, misma), della, dél, desta, deste (de ella, de él, de esta, de este), agora (ahora), ansí and ansimismo (así, asimismo), estremo (extremo), cerbelo (cerebro), escuridad (oscuridad), noturnas (nocturnas), priesa (prisa), escusar (excusar), ferido (herido), ijas (hijas), compaña (compañía), proverse (proveerse), intricadas (intrincadas), 'la hambre' for 'el hambre', and 'a causa que' without 'de'. Pronouns are hung on verbs that open a clause (téngolo, entreoyóle, preguntóle, Olvidósele, díjole, Tendiéronle, desliáronle, Suplicáronle). Speakers use the vosotros imperative (Mirad, estadme) and vuestra merced with the verb of 'he' (Dígame, mire, Calle). The -ra form stands for the conditional (quisiera, dijera, fuera, tuviera, escusara), the imperfect subjunctive follows verbs of asking and wishing (diese, encaminase, favoreciesen, abonasen), 'haber de' gives intention or obligation (he de llamar, había de ver, ha de ser), and 'deber de' gives probability (debió de ser, debe de ser peor que mazmorra). Watch the false friends: regalos (attentions, hospitality), discreción (good sense), industria (ingenuity), suceso (outcome), ejercicios (pursuits), república (the public), and the idioms a ojos vistas (with one's own eyes), a qué quieres boca (to one's heart's content), meter su cucharada (to put one's oar in), caer en la cuenta (to realise), no importar un ardite (not to matter a farthing) and quedarse para casta (to stay and breed).
