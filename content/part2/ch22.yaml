      - es: "y así, compraron casi cien brazas de soga, y otro día, a las dos de la tarde, llegaron a la cueva, cuya boca es espaciosa y ancha, pero llena de cambroneras y cabrahígos, de zarzas y malezas, tan espesas y intricadas, que de todo en todo la ciegan y encubren."
        literal: "and so, they-bought almost a-hundred fathoms of rope, and [the] next day, at the two of the afternoon, they-arrived at the cave, whose mouth is spacious and wide, but full of boxthorns and wild-figs, of brambles and undergrowths, so thick and tangled, that wholly and entirely it they-block and hide."
        ormsby: "so they bought about a hundred fathoms of rope, and next day at two in the afternoon they arrived at the cave, the mouth of which is spacious and wide, but full of thorn and wild-fig bushes and brambles and briars, so thick and matted that they completely close it up and cover it over."
        ormsby_note: "The hamlet referred to is clearly that of Ruidera, about five leagues southeast of Argamasilla, near the Laguna del Rey, the lowest of the chain of lakes from which the waters of the Guadiana flow into the plain of La Mancha. From thence across the hills it is about two leagues to the cave of Montesinos, which lies a little to the north of the ruins of the castle of Rocafria (v. map). There can be no doubt that Cervantes visited the spot, but he has somewhat exaggerated the dimensions of the cave. The mouth is not more than eight or ten feet wide, or the depth more than fifty or sixty; nor is the descent so steep as to make a rope requisite. It is, in all probability, an ancient mine of Roman or possibly Carthaginian origin. The map of the district given in Pellicer's edition of Don Quixote misplaces the cave and several other points, and is entirely misleading."
        vocab:
          - {w: "braza", d: "fathom, about 1.7 metres (the span of a man's outstretched arms); a hundred fathoms is about 170 metres of rope"}
          - {w: "otro día", d: "the next day (not 'another day')"}
          - {w: "espacioso", d: "spacious, roomy"}
          - {w: "cambronera", d: "boxthorn, a thorny shrub"}
          - {w: "cabrahígo", d: "wild fig tree"}
          - {w: "zarza", d: "bramble, blackberry bush"}
          - {w: "maleza", d: "undergrowth, scrub, weeds"}
          - {w: "intricado", d: "= intrincado, tangled, matted (old spelling)"}
          - {w: "de todo en todo", d: "completely, wholly"}
          - {w: "cegar", d: "to block up, stop up (literally 'to blind')"}
          - {w: "encubrir", d: "to hide, cover over"}
        diagram:
          - s: "compraron casi cien brazas de soga"
            r: "main verb 1: they bought almost a hundred fathoms of rope"
            under:
              - {s: "y así", r: "linking: and so"}
          - s: "y otro día, a las dos de la tarde, llegaron a la cueva"
            r: "main verb 2: and the next day at two in the afternoon they reached the cave"
            under:
              - s: "cuya boca es espaciosa y ancha"
                r: "describes 'cueva': whose mouth is roomy and wide"
                under:
                  - s: "pero llena de cambroneras y cabrahígos, de zarzas y malezas"
                    r: "contrast: but full of thorn bushes, wild figs, brambles and scrub"
                    under:
                      - s: "tan espesas y intricadas"
                        r: "describes the bushes: so thick and tangled"
                        under:
                          - {s: "que de todo en todo la ciegan y encubren", r: "result: that they block and hide it completely"}
        forms:
          - {w: "compraron", f: "compr- + -aron → comprar (to buy), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "cien", f: "ciento (a hundred) clipped to 'cien' before a noun."}
          - {w: "llegaron", f: "lleg- + -aron → llegar (to arrive), preterite, they. Same -ar preterite (llegué, with g → gu before e)."}
          - {w: "cuya", f: "cuy- + -a → cuyo (whose), feminine to match the thing owned, 'boca', not the owner."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son. The narrator switches to the present: the cave is still there."}
          - {w: "llena", f: "llen- + -a → lleno (full), feminine to match 'boca'."}
          - {w: "espesas, intricadas", f: "espes- + -as → espeso (thick), intricad- + -as → intricado (tangled), feminine plural to match 'cambroneras ... malezas'."}
          - {w: "la ciegan y encubren", f: "cieg- + -an → cegar (to block), encubr- + -en → encubrir (to hide), present, they; 'la' = it, the mouth. The e of 'cegar' becomes ie when stressed: ciego, ciegas, ciega, cegamos, cegáis, ciegan. encubrir (to hide) is regular: encubro, encubres, encubre, encubrimos, encubrís, encubren."}
        note: "The real cave lies about two leagues from the village of Ruidera. Cervantes makes it deeper and wilder than it is, which suits the adventure to come."
