          - {s: "aquél, de Emperador", r: "4, with 'va' understood: that one, the Emperor"}
          - {s: "y yo, de Demonio", r: "5: and I, the Devil"}
          - s: "y soy una de las principales figuras del auto"
            r: "main verb 6: and I am one of the main characters of the play"
            under:
              - {s: "porque hago en esta compañía los primeros papeles", r: "why: because I play the leading parts in this company"}
        forms:
          - {w: "Aquel, aquella, aquél", f: "'that (over there)': masculine 'aquel' before 'mancebo', feminine 'aquella' before 'mujer'; 'aquél' with an accent stands alone as a pronoun, 'that one'."}
          - {w: "va", f: "ir (to go), present, he / she. Irregular: voy, vas, va, vamos, vais, van. 'ir de' = to go dressed as."}
          - {w: "es", f: "ser (to be), present, she. Irregular: soy, eres, es, somos, sois, son. 'soy' later is the same present, I."}
          - {w: "la del", f: "'la' stands for 'mujer' (the woman of the manager, i.e. his wife); 'del' = de + el."}
          - {w: "una", f: "feminine to match 'figuras': 'figura' is feminine even when a man plays it."}
