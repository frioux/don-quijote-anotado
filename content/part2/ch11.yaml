      - es: "Aquel mancebo va de Muerte; el otro, de Ángel; aquella mujer, que es la del autor, va de Reina; el otro, de Soldado; aquél, de Emperador, y yo, de Demonio, y soy una de las principales figuras del auto, porque hago en esta compañía los primeros papeles."
        literal: "That youth goes as Death; the other, as Angel; that woman, who is the [wife] of-the manager, goes as Queen; the other, as Soldier; that-one, as Emperor, and I, as Demon, and I-am one of the principal figures of-the sacred-play, because I-do in this company the first roles."
        ormsby: "That lad there appears as Death, that other as an angel, that woman, the manager’s wife, plays the queen, this one the soldier, that the emperor, and I the devil; and I am one of the principal characters of the play, for in this company I take the leading parts."
        vocab:
          - {w: "mancebo", d: "youth, young man"}
          - {w: "ir de", d: "to go as, be dressed as, play the part of"}
          - {w: "autor", d: "false friend: the manager, head of a theatre company, not the author of the play"}
          - {w: "la del autor", d: "the manager's [wife]"}
          - {w: "figura", d: "character, role in a play"}
          - {w: "primeros papeles", d: "leading roles"}
        diagram:
          - {s: "Aquel mancebo va de Muerte", r: "main verb 1: that young man plays Death"}
          - {s: "el otro, de Ángel", r: "2, with 'va' understood: the other, the Angel"}
          - s: "va de Reina"
            r: "3: plays the Queen"
