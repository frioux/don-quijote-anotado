          - {w: "por imitar", d: "as though to imitate (a joke: the devil's fall copies Don Quijote's)"}
          - {w: "irse", d: "to go off, go away"}
          - {w: "a pie", d: "on foot"}
          - {w: "pueblo", d: "town, village"}
          - {w: "jumento", d: "donkey, ass"}
          - {w: "volverse", d: "to go back, return"}
