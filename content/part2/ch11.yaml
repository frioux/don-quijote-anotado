part: 2
chapter: 11
title_es: "Capítulo XI. De la estraña aventura que le sucedió al valeroso don Quijote con el carro, o carreta, de Las Cortes de la Muerte"
title_en: "Of the strange adventure which the valiant Don Quixote had with the car or cart of the Cortes of Death"
paragraphs:
  - sentences:
      - es: "Pensativo además iba don Quijote por su camino adelante, considerando la mala burla que le habían hecho los encantadores, volviendo a su señora Dulcinea en la mala figura de la aldeana, y no imaginaba qué remedio tendría para volverla a su ser primero;"
        literal: "Pensive beyond-measure was-going Don Quijote along his road onward, considering the bad trick that on-him had done the enchanters, turning his lady Dulcinea into the bad shape of the village-girl, and not he-could-imagine what remedy he-would-have to turn-her to her being first;"
        ormsby: "Dejected beyond measure did Don Quixote pursue his journey, turning over in his mind the cruel trick the enchanters had played him in changing his lady Dulcinea into the vile shape of the village lass, nor could he think of any way of restoring her to her original form;"
        vocab:
          - {w: "pensativo", d: "pensive, lost in thought; here gloomy, brooding"}
          - {w: "además", d: "old sense 'excessively, beyond measure' (not 'besides')"}
          - {w: "camino adelante", d: "onward along the road; 'adelante' after a noun of path = on, forward"}
          - {w: "burla", d: "trick, practical joke, mockery"}
          - {w: "volver en", d: "to turn into, transform into"}
          - {w: "figura", d: "shape, outward form, appearance"}
          - {w: "aldeana", d: "village girl, peasant woman; from 'aldea' (village)"}
          - {w: "su ser primero", d: "her original being, her first state"}
        diagram:
          - s: "Pensativo además iba don Quijote"
            r: "main verb 1: Don Quijote went along, deeply brooding"
            under:
              - {s: "por su camino adelante", r: "where: on along his road"}
              - s: "considerando la mala burla"
                r: "how: turning over the nasty trick"
                under:
                  - {s: "que le habían hecho los encantadores", r: "describes 'burla': that the enchanters had played on him"}
                  - {s: "volviendo a su señora Dulcinea en la mala figura de la aldeana", r: "what the trick was: turning his lady Dulcinea into the ugly shape of the village girl"}
          - s: "y no imaginaba"
            r: "main verb 2: and he could not imagine"
            under:
              - s: "qué remedio tendría"
                r: "what he could not imagine: what remedy he would have"
                under:
                  - {s: "para volverla a su ser primero", r: "purpose: to turn her back to her first state"}
        forms:
          - {w: "Pensativo", f: "pensativ- + -o → pensativo (pensive), masculine singular to match 'don Quijote'; an adjective placed first for emphasis, describing the subject."}
          - {w: "iba", f: "ib- + -a → ir (to go), imperfect, he: 'was going'. ir (to go) is irregular in the imperfect: iba, ibas, iba, íbamos, ibais, iban."}
          - {w: "considerando", f: "consider- + -ando → considerar (to consider), gerund: 'considering'. -ar verbs make the gerund in -ando."}
          - {w: "habían hecho", f: "habí- + -an → haber (to have), imperfect, they, + hecho, the irregular participle of hacer (to do, make): pluperfect, 'had done'. haber (to have) in the imperfect: había, habías, había, habíamos, habíais, habían. The subject 'los encantadores' comes after the verb."}
          - {w: "volviendo", f: "volv- + -iendo → volver (to turn), gerund: 'turning'. -er and -ir verbs make the gerund in -iendo."}
          - {w: "imaginaba", f: "imagin- + -aba → imaginar (to imagine), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "tendría", f: "tendr- + -ía → tener (to have), conditional, he: 'he would have'. Irregular stem tendr-: tendría, tendrías, tendría, tendríamos, tendríais, tendrían."}
          - {w: "volverla", f: "volver (to turn) + la (her, Dulcinea), the pronoun hung on the end of the infinitive after 'para'."}
        note: "The chapter picks up straight from the end of chapter 10, where Sancho passed off a garlic-smelling peasant girl on a donkey as Dulcinea and Don Quijote concluded that enchanters had transformed her in his eyes alone."
      - es: "y estos pensamientos le llevaban tan fuera de sí, que, sin sentirlo, soltó las riendas a Rocinante, el cual, sintiendo la libertad que se le daba, a cada paso se detenía a pacer la verde yerba de que aquellos campos abundaban."
        literal: "and these thoughts him were-carrying so outside of himself, that, without feeling-it, he-let-go the reins to Rocinante, the which, feeling the freedom that to-him was-given, at each step himself stopped to graze the green grass of which those fields abounded."
        ormsby: "and these reflections so absorbed him, that without being aware of it he let go Rocinante’s bridle, and he, perceiving the liberty that was granted him, stopped at every step to crop the fresh grass with which the plain abounded."
        vocab:
          - {w: "llevar fuera de sí", d: "to carry someone out of himself: to absorb him completely, make him forget where he is"}
          - {w: "sin sentirlo", d: "without noticing, without realizing it"}
          - {w: "soltar las riendas", d: "to let go of the reins, give a horse its head"}
          - {w: "pacer", d: "to graze, crop grass (of animals)"}
          - {w: "yerba", d: "= hierba, grass (old spelling, still used)"}
          - {w: "abundar de", d: "to abound in, be full of; modern Spanish usually says 'abundar en'"}
        diagram:
          - s: "estos pensamientos le llevaban tan fuera de sí"
            r: "main verb 1 (after 'y'): these thoughts carried him so far out of himself"
            under:
              - s: "que, sin sentirlo, soltó las riendas a Rocinante"
                r: "result: that without noticing he let Rocinante's reins go"
                under:
                  - s: "el cual"
                    r: "describes 'Rocinante': who"
                    under:
                      - {s: "sintiendo la libertad que se le daba", r: "why: feeling the freedom he was being given"}
                      - {s: "a cada paso se detenía", r: "verb: stopped at every step"}
                      - s: "a pacer la verde yerba"
                        r: "purpose: to graze the green grass"
                        under:
                          - {s: "de que aquellos campos abundaban", r: "describes 'yerba': which those fields were full of"}
        forms:
          - {w: "estos", f: "est- + -os → este (this), masculine plural to match 'pensamientos'."}
          - {w: "llevaban", f: "llev- + -aban → llevar (to carry), imperfect, they (the thoughts). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "sí", f: "the reflexive pronoun after a preposition, 'himself', written with an accent to tell it from 'si' (if)."}
          - {w: "sentirlo", f: "sentir (to feel, notice) + lo (it), the pronoun hung on the infinitive after 'sin'."}
          - {w: "soltó", f: "solt- + -ó → soltar (to let go), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "el cual", f: "'who, which', masculine singular to match 'Rocinante'; a heavier relative than 'que', used after a comma."}
          - {w: "sintiendo", f: "gerund of sentir (to feel); the e of the stem turns to i in the gerund: sentir → sintiendo."}
          - {w: "se le daba", f: "d- + -aba → dar (to give), imperfect, it, with 'se' making it passive ('was given') and 'le' = to him. Same -aba imperfect as 'llevaban'."}
          - {w: "se detenía", f: "deten- + -ía → detenerse (to stop), imperfect, he, with 'se' (himself): 'he kept stopping'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían. The imperfect shows a repeated action."}
          - {w: "aquellos", f: "aquell- + -os → aquel (that, over there), masculine plural to match 'campos'."}
          - {w: "abundaban", f: "abund- + -aban → abundar (to abound), imperfect, they (the fields). Same -aba imperfect as 'llevaban'."}
      - es: "De su embelesamiento le volvió Sancho Panza, diciéndole:"
        literal: "From his trance him brought-back Sancho Panza, saying-to-him:"
        ormsby: "Sancho recalled him from his reverie."
        vocab:
          - {w: "embelesamiento", d: "trance, rapt absorption, daydream (from 'embelesar', to entrance)"}
          - {w: "volver a alguien de", d: "to bring someone back from (a faint, a reverie)"}
        diagram:
          - s: "le volvió"
            r: "main verb: brought him back"
            under:
              - {s: "De su embelesamiento", r: "from where: from his trance"}
              - {s: "Sancho Panza", r: "subject: who brought him back"}
              - {s: "diciéndole:", r: "how: saying to him"}
        forms:
          - {w: "volvió", f: "volv- + -ió → volver (to bring back), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron. The subject 'Sancho Panza' comes after the verb."}
          - {w: "diciéndole", f: "gerund of decir (to say), diciendo (the e of the stem turns to i), + le (to him), with an accent added to keep the stress on -cién-."}
  - sentences:
      - es: "— Señor, las tristezas no se hicieron para las bestias, sino para los hombres;"
        literal: "— Sir, the sadnesses not themselves were-made for the beasts, but for the men;"
        ormsby: "“Melancholy, señor,” said he, “was made, not for beasts, but for men;"
        vocab:
          - {w: "tristezas", d: "sorrows, melancholy; the plural is the usual way to speak of a fit of sadness"}
          - {w: "no ... sino", d: "not ... but (rather)"}
        diagram:
          - s: "las tristezas no se hicieron"
            r: "main verb: sorrows were not made"
            under:
              - {s: "Señor", r: "addressed to: sir"}
              - {s: "para las bestias", r: "for whom (denied): for beasts"}
              - {s: "sino para los hombres", r: "for whom: but for men"}
        forms:
          - {w: "se hicieron", f: "hic- + -ieron → hacer (to make), preterite, they, with 'se' making it passive: 'were made'. Irregular preterite: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "tristezas", f: "triste (sad) + -eza, the suffix that makes an abstract noun: 'sadness'; plural."}
        note: "Sancho's maxim has the ring of a proverb: sorrow belongs to human beings, not animals, but too much of it turns a man into a brute. He is telling his master to snap out of it."
      - es: "pero si los hombres las sienten demasiado, se vuelven bestias:"
        literal: "but if the men them feel too-much, themselves they-turn beasts:"
        ormsby: "but if men give way to it overmuch they turn to beasts;"
        vocab:
          - {w: "volverse", d: "to become, turn into (a change of nature)"}
          - {w: "demasiado", d: "too much, excessively"}
        diagram:
          - s: "se vuelven bestias:"
            r: "main verb (after 'pero'): they turn into beasts"
            under:
              - {s: "si los hombres las sienten demasiado", r: "condition: if men feel them too much"}
        forms:
          - {w: "las", f: "'them', feminine plural because it stands for 'las tristezas'."}
          - {w: "sienten", f: "sient- + -en → sentir (to feel), present, they. The stem e becomes ie when stressed: siento, sientes, siente, sentimos, sentís, sienten."}
          - {w: "se vuelven", f: "vuelv- + -en → volverse (to become), present, they, with 'se' (themselves). The stem o becomes ue when stressed: vuelvo, vuelves, vuelve, volvemos, volvéis, vuelven."}
      - es: "vuestra merced se reporte, y vuelva en sí, y coja las riendas a Rocinante, y avive y despierte, y muestre aquella gallardía que conviene que tengan los caballeros andantes."
        literal: "your grace yourself-restrain, and come-back to yourself, and take the reins to Rocinante, and liven-up and wake-up, and show that gallantry that is-fitting that may-have the knights errant."
        ormsby: "control yourself, your worship; be yourself again; gather up Rocinante’s reins; cheer up, rouse yourself and show that gallant spirit that knights-errant ought to have."
        vocab:
          - {w: "vuestra merced", d: "your grace, your worship: the polite 'you', taking a 'he/she' verb (the ancestor of 'usted')"}
          - {w: "reportarse", d: "to restrain oneself, compose oneself (false friend: not 'to report')"}
          - {w: "volver en sí", d: "to come to, come back to one's senses"}
          - {w: "coger", d: "to take hold of, pick up"}
          - {w: "avivar", d: "to liven up, quicken; here intransitive, 'cheer up'"}
          - {w: "gallardía", d: "gallantry, dash, spirited bearing"}
          - {w: "convenir", d: "to be fitting, be proper; 'conviene que' + subjunctive = it is right that"}
        diagram:
          - s: "vuestra merced se reporte"
            r: "main verb 1: your worship, restrain yourself (polite command)"
          - {s: "y vuelva en sí", r: "main verb 2: and come to yourself"}
          - {s: "y coja las riendas a Rocinante", r: "main verb 3: and take up Rocinante's reins"}
          - {s: "y avive y despierte", r: "main verbs 4-5: and liven up and wake up"}
          - s: "y muestre aquella gallardía"
            r: "main verb 6: and show that dash"
            under:
              - {s: "que conviene que tengan los caballeros andantes", r: "describes 'gallardía': that knights errant ought to have"}
        forms:
          - {w: "se reporte", f: "report- + -e → reportarse (to restrain oneself), present subjunctive, you (vuestra merced, which takes the 'he/she' form), with 'se'. The present subjunctive gives a polite command. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "vuelva", f: "vuelv- + -a → volver (to return), present subjunctive, you (vuestra merced): 'come back'. The stem o becomes ue when stressed: vuelva, vuelvas, vuelva, volvamos, volváis, vuelvan."}
          - {w: "sí", f: "the reflexive pronoun after a preposition, 'yourself' here because vuestra merced is grammatically 'he/she'; accent to tell it from 'si' (if)."}
          - {w: "coja", f: "coj- + -a → coger (to take), present subjunctive, you (vuestra merced); g becomes j before a: coja, cojas, coja, cojamos, cojáis, cojan."}
          - {w: "avive, despierte, muestre", f: "aviv- + -e → avivar (to liven up), despiert- + -e → despertar (to wake up), muestr- + -e → mostrar (to show): present subjunctive, you (vuestra merced). avivar: avive, avives, avive, avivemos, avivéis, aviven. despertar (e → ie when stressed): despierte, despiertes, despierte, despertemos, despertéis, despierten. mostrar (o → ue when stressed): muestre, muestres, muestre, mostremos, mostréis, muestren."}
          - {w: "aquella", f: "aquell- + -a → aquel (that), feminine to match 'gallardía'."}
          - {w: "conviene", f: "convien- + -e → convenir (to be fitting), present, it. Irregular like venir (to come): convengo, convienes, conviene, convenimos, convenís, convienen."}
          - {w: "tengan", f: "teng- + -an → tener (to have), present subjunctive, they, after 'conviene que'. tenga, tengas, tenga, tengamos, tengáis, tengan."}
      - es: "¿Qué diablos es esto? ¿Qué descaecimiento es éste? ¿Estamos aquí, o en Francia?"
        literal: "What devils is this? What weakening is this? Are-we here, or in France?"
        ormsby: "What the devil is this? What weakness is this? Are we here or in France?"
        vocab:
          - {w: "¿qué diablos?", d: "what the devil? (an oath of impatience)"}
          - {w: "descaecimiento", d: "weakness, loss of spirit, collapse"}
          - {w: "¿estamos aquí o en Francia?", d: "a set phrase: 'are we here or in France?', i.e. wake up, where is your mind?, said to someone in a daze"}
        diagram:
          - {s: "¿Qué diablos es esto?", r: "question 1: what the devil is this?"}
          - {s: "¿Qué descaecimiento es éste?", r: "question 2: what weakness is this?"}
          - s: "¿Estamos aquí"
            r: "question 3, main verb: are we here"
            under:
              - {s: "o en Francia?", r: "alternative: or in France?"}
        forms:
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "éste", f: "este (this), used as a pronoun ('this one') and written with an accent in the old spelling; masculine to match 'descaecimiento'."}
          - {w: "Estamos", f: "est- + -amos → estar (to be), present, we. estoy, estás, está, estamos, estáis, están."}
          - {w: "descaecimiento", f: "descaec(er) (to weaken, decline) + -imiento, the suffix that makes a noun of the action: 'weakening'."}
      - es: "Mas que se lleve Satanás a cuantas Dulcineas hay en el mundo, pues vale más la salud de un solo caballero andante que todos los encantos y transformaciones de la tierra."
        literal: "But may carry-off Satan [to] as-many Dulcineas as there-are in the world, since is-worth more the health of a single knight errant than all the enchantments and transformations of the earth."
        ormsby: "The devil fly away with all the Dulcineas in the world; for the well-being of a single knight-errant is of more consequence than all the enchantments and transformations on earth.”"
        vocab:
          - {w: "mas", d: "but (literary, no accent); 'más' with an accent is 'more'"}
          - {w: "que se lleve Satanás", d: "may Satan take ...: the devil take ...! (a curse)"}
          - {w: "cuantos", d: "as many as, all the ... that"}
          - {w: "salud", d: "health, well-being; also safety"}
          - {w: "encanto", d: "enchantment, spell (not 'charm' in the modern sense here)"}
        diagram:
          - s: "Mas que se lleve Satanás"
            r: "main verb 1 (a curse): but may Satan carry off"
            under:
              - {s: "a cuantas Dulcineas hay en el mundo", r: "object: all the Dulcineas there are in the world"}
          - s: "pues vale más la salud de un solo caballero andante"
            r: "why: since the well-being of a single knight errant is worth more"
            under:
              - {s: "que todos los encantos y transformaciones de la tierra", r: "compared with: than all the spells and transformations on earth"}
        forms:
          - {w: "se lleve", f: "llev- + -e → llevarse (to carry off), present subjunctive, he (Satan), with 'se'. 'que' + present subjunctive makes a wish or curse: 'may Satan take'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "cuantas", f: "cuant- + -as → cuanto (as many as), feminine plural to match 'Dulcineas'."}
          - {w: "hay", f: "the impersonal form of haber (to have): 'there are'. haber (to have) in the present: he, has, ha, hemos, habéis, han; meaning 'there is/are' it becomes 'hay'."}
          - {w: "vale", f: "val- + -e → valer (to be worth), present, it. valgo, vales, vale, valemos, valéis, valen. The subject 'la salud ...' follows the verb."}
          - {w: "un solo", f: "solo (single, only one) as an adjective, after 'un': 'a single'."}
        note: "Sancho's curse on 'all the Dulcineas' is nearly a blasphemy in Don Quijote's ears, which is why he answers 'no digas blasfemias'."
  - sentences:
      - es: "— Calla, Sancho —respondió don Quijote con voz no muy desmayada—; calla, digo, y no digas blasfemias contra aquella encantada señora, que de su desgracia y desventura yo solo tengo la culpa: de la invidia que me tienen los malos ha nacido su mala andanza."
        literal: "— Be-quiet, Sancho —answered Don Quijote with voice not very faint—; be-quiet, I-say, and not say blasphemies against that enchanted lady, for of her disgrace and misfortune I alone have the blame: from the envy that to-me have the wicked has been-born her bad fortune."
        ormsby: "“Hush, Sancho,” said Don Quixote in a weak and faint voice, “hush and utter no blasphemies against that enchanted lady; for I alone am to blame for her misfortune and hard fate; her calamity has come of the hatred the wicked bear me.”"
        vocab:
          - {w: "callar", d: "to be quiet, keep silent; 'calla' = hush!"}
          - {w: "desmayado", d: "faint, weak (from 'desmayarse', to faint)"}
          - {w: "blasfemia", d: "blasphemy; here any insult to a sacred person, and for Don Quijote Dulcinea is one"}
          - {w: "desventura", d: "misfortune, ill luck"}
          - {w: "tener la culpa", d: "to be to blame"}
          - {w: "invidia", d: "= envidia, envy (old form)"}
          - {w: "mala andanza", d: "ill fortune, mishap (the opposite of 'buena andanza')"}
        diagram:
          - s: "Calla, Sancho"
            r: "main verb 1 (command): hush, Sancho"
            under:
              - {s: "respondió don Quijote con voz no muy desmayada", r: "speech tag: Don Quijote answered, in a voice not very faint"}
          - {s: "calla, digo", r: "main verb 2: hush, I say"}
          - s: "y no digas blasfemias"
            r: "main verb 3: and say no blasphemies"
            under:
              - {s: "contra aquella encantada señora", r: "against whom: against that enchanted lady"}
              - {s: "que de su desgracia y desventura yo solo tengo la culpa", r: "why: for I alone am to blame for her misfortune"}
          - s: "ha nacido su mala andanza"
            r: "main verb 4 (after the colon): her ill fortune has been born"
            under:
              - {s: "de la invidia que me tienen los malos", r: "from what: from the envy the wicked bear me"}
        forms:
          - {w: "Calla", f: "call- + -a → callar (to be quiet), imperative, you (tú): 'hush!'. The tú command of a regular verb is the same as the 'he' form of the present: calla, come, vive."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "desmayada", f: "desmay- + -ada → desmayar (to faint), participle used as an adjective, feminine to match 'voz'."}
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "no digas", f: "dig- + -as → decir (to say), present subjunctive, you (tú). A negative command uses the present subjunctive: 'don't say'. decir (to say) in the present subjunctive: diga, digas, diga, digamos, digáis, digan."}
          - {w: "encantada", f: "encant- + -ada → encantar (to enchant), participle used as an adjective, feminine to match 'señora'."}
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen. Same verb in 'me tienen' (they have toward me, they bear me)."}
          - {w: "solo", f: "solo (alone), masculine to match 'yo' (Don Quijote): 'I alone'."}
          - {w: "ha nacido", f: "h- + -a → haber (to have), present, it, + nacido, participle of nacer (to be born): present perfect, 'has been born, has sprung'. haber (to have) in the present: he, has, ha, hemos, habéis, han."}
        note: "The Spanish says 'con voz no muy desmayada', 'in a voice not very faint': Don Quijote is downcast but still firm. Ormsby's 'in a weak and faint voice' says the opposite."
  - sentences:
      - es: "— Así lo digo yo —respondió Sancho—: quien la vido y la vee ahora, ¿cuál es el corazón que no llora?"
        literal: "— So it say I —answered Sancho—: who her saw and her sees now, which is the heart that not weeps?"
        ormsby: "“So say I,” returned Sancho; “his heart rend in twain, I trow, who saw her once, to see her now.”"
        ormsby_note: "A scrap, apparently, of some song."
        vocab:
          - {w: "vido", d: "= vio, saw (old and rustic form)"}
          - {w: "vee", d: "= ve, sees (old form)"}
          - {w: "quien la vido y la vee ahora", d: "'whoever saw her [then] and sees her now': a line of verse, apparently from a song or ballad"}
        diagram:
          - s: "Así lo digo yo"
            r: "main verb 1: so I say"
            under:
              - {s: "respondió Sancho", r: "speech tag: Sancho answered"}
          - s: "¿cuál es el corazón que no llora?"
