          - {w: "hago", f: "hag- + -o → hacer (to do), present, I. Irregular: hago, haces, hace, hacemos, hacéis, hacen."}
        note: "Unlike the English stage, the Spanish stage had actresses, usually married to members of the company. The devil's list does not quite match what Don Quijote saw: the knight seems to be the 'Soldier', and Cupid goes unnamed."
      - es: "Si otra cosa vuestra merced desea saber de nosotros, pregúntemelo, que yo le sabré responder con toda puntualidad; que, como soy demonio, todo se me alcanza."
        literal: "If other thing your grace desires to-know of us, ask-it-of-me, for I to-you will-know-how to-answer with all exactness; for, as I-am demon, everything itself to-me reaches."
        ormsby: "If you want to know anything more about us, ask me and I will answer with the utmost exactitude, for as I am a devil I am up to everything.”"
        vocab:
          - {w: "vuestra merced", d: "your grace, your worship: the polite 'you', which takes a he/she verb"}
          - {w: "saber + infinitive", d: "to know how to, be able to"}
          - {w: "puntualidad", d: "false friend: exactness, precision, not 'punctuality'"}
          - {w: "alcanzársele a uno", d: "to be within one's grasp; 'todo se me alcanza' = I understand everything, nothing is beyond me"}
        diagram:
          - s: "pregúntemelo"
