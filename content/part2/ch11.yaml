  - sentences:
      - es: "— Pues yo le cobraré —replicó don Quijote—, si bien se encerrase con él en los más hondos y escuros calabozos del infierno."
        literal: "— Then I him will-recover —replied Don Quijote—, even-if he-should-shut-himself-in with him in the most deep and dark dungeons of-the hell."
        ormsby: "“Then I will recover him,” said Don Quixote, “even if he be shut up with him in the deepest and darkest dungeons of hell."
        vocab:
          - {w: "cobrar", d: "to recover, get back (not only 'to charge')"}
          - {w: "si bien", d: "even if, even though"}
          - {w: "encerrarse", d: "to shut oneself in, lock oneself up"}
          - {w: "hondo", d: "deep"}
          - {w: "escuro", d: "= oscuro, dark (old form)"}
          - {w: "calabozo", d: "dungeon, cell"}
        diagram:
          - s: "Pues yo le cobraré"
            r: "main verb: then I will get him back"
          - {s: "replicó don Quijote", r: "speech verb and subject: replied Don Quijote"}
          - s: "si bien se encerrase con él"
            r: "concession: even if he (the devil) shut himself in with him"
            under:
              - {s: "en los más hondos y escuros calabozos del infierno", r: "where: in the deepest, darkest dungeons of hell"}
        forms:
          - {w: "le", f: "'him', the donkey; 'le' for a male animal as object is leísmo, normal in Cervantes."}
          - {w: "cobraré", f: "cobrar- + -é → cobrar (to recover), future, I. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "se encerrase", f: "encerr- + -ase → encerrarse (to shut oneself in), imperfect subjunctive (-se form), he, with 'se' (himself). The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. Subjunctive for an unlikely supposition after 'si bien'."}
          - {w: "los más hondos y escuros", f: "más + adjective after the article = the superlative: 'the deepest and darkest'; both adjectives masculine plural to match 'calabozos'."}
          - {w: "escuros", f: "old form of oscuros (dark)."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
      - es: "Sígueme, Sancho, que la carreta va despacio, y con las mulas della satisfaré la pérdida del rucio."
        literal: "Follow-me, Sancho, for the cart goes slowly, and with the mules of-it I-will-make-good the loss of-the grey."
        ormsby: "Follow me, Sancho, for the cart goes slowly, and with the mules of it I will make good the loss of Dapple.”"
        vocab:
          - {w: "que", d: "here 'for, since', giving the reason"}
          - {w: "despacio", d: "slowly"}
          - {w: "della", d: "= de ella, of it (old contraction)"}
          - {w: "satisfacer", d: "to make good, compensate for (a loss or injury)"}
        diagram:
          - {s: "Sígueme, Sancho", r: "main verb 1: follow me, Sancho"}
          - {s: "que la carreta va despacio", r: "why: for the cart is going slowly"}
          - s: "satisfaré la pérdida del rucio"
            r: "main verb 2 (after 'y'): I will make good the loss of the grey"
            under:
              - {s: "con las mulas della", r: "with what: with the cart's mules"}
        forms:
          - {w: "Sígueme", f: "sigue + me → seguir (to follow), imperative, you (tú), with 'me' stuck on the end and an accent added: 'follow me'. The tú imperative is the he-form of the present: sigo, sigues, sigue, seguimos, seguís, siguen (the stem e turns to i when stressed)."}
          - {w: "va", f: "ir (to go), present, it (the cart). Irregular: voy, vas, va, vamos, vais, van."}
          - {w: "della", f: "de + ella, run together; 'ella' is 'la carreta'. Modern 'de ella'."}
          - {w: "satisfaré", f: "satisfar- + -é → satisfacer (to make good), future, I. It is built like hacer (to do): satisfaré, satisfarás, satisfará, satisfaremos, satisfaréis, satisfarán."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
        note: "Don Quijote reasons like a knight taking spoils from a defeated enemy, as when he claimed the barber's basin as 'Mambrino's helmet' in Part I, chapter 21."
  - sentences:
      - es: "— No hay para qué hacer esa diligencia, señor —respondió Sancho—: vuestra merced temple su cólera, que, según me parece, ya el Diablo ha dejado el rucio, y vuelve a la querencia."
        literal: "— Not there-is for what to-make that effort, sir —answered Sancho—: your grace may-temper your anger, for, according-to [what] to-me it-seems, already the Devil has left the grey, and he-returns to the home-haunt."
        ormsby: "“You need not take the trouble, señor,” said Sancho; “keep cool, for as I now see, the devil has let Dapple go and he is coming back to his old quarters;”"
        vocab:
          - {w: "no hay para qué", d: "there is no need to, there's no point in"}
          - {w: "diligencia", d: "effort, step, errand (false friend: not 'diligence')"}
          - {w: "vuestra merced", d: "'your grace', the polite 'you', taking the he/she form of the verb (modern 'usted')"}
          - {w: "templar", d: "to temper, moderate, calm"}
          - {w: "cólera", d: "anger (from the hot humour 'choler')"}
          - {w: "según me parece", d: "as it seems to me, as far as I can see"}
          - {w: "querencia", d: "an animal's favourite haunt, the stall or pasture it heads back to by instinct"}
        diagram:
          - s: "No hay para qué"
            r: "main verb 1: there is no need"
            under:
              - {s: "hacer esa diligencia", r: "what there is no need for: to take that trouble"}
          - {s: "respondió Sancho", r: "speech verb and subject"}
          - s: "vuestra merced temple su cólera"
            r: "main verb 2: may your grace calm your anger"
            under:
              - s: "que"
                r: "why: for"
                under:
                  - {s: "según me parece", r: "aside: as it seems to me"}
                  - {s: "ya el Diablo ha dejado el rucio", r: "reason 1: the Devil has already let go of the grey"}
                  - {s: "y vuelve a la querencia", r: "reason 2: and he (the donkey) is coming back home"}
        forms:
          - {w: "hay", f: "the impersonal form of haber (to have), 'there is'. haber (to have) in the present: he, has, ha, hemos, habéis, han; when it means 'there is/are' the form is 'hay'."}
          - {w: "esa", f: "es- + -a → ese (that), feminine to match 'diligencia'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "temple", f: "templ- + -e → templar (to calm), present subjunctive, you (vuestra merced, which takes the he/she form): a polite command, 'calm your anger'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "parece", f: "parec- + -e → parecer (to seem), present, it. parezco, pareces, parece, parecemos, parecéis, parecen."}
          - {w: "ha dejado", f: "ha (haber (to have), present, he: he, has, ha, hemos, habéis, han) + dejado, the participle of dejar (to leave, let go): 'has let go of'."}
          - {w: "vuelve", f: "vuelv- + -e → volver (to return), present, he (the donkey). The stem o becomes ue when stressed: vuelvo, vuelves, vuelve, volvemos, volvéis, vuelven."}
  - sentences:
      - es: "Y así era la verdad; porque, habiendo caído el Diablo con el rucio, por imitar a don Quijote y a Rocinante, el Diablo se fue a pie al pueblo, y el jumento se volvió a su amo."
