  - sentences:
      - es: "— Carretero, cochero, o diablo, o lo que eres, no tardes en decirme quién eres, a dó vas y quién es la gente que llevas en tu carricoche, que más parece la barca de Carón que carreta de las que se usan."
        literal: "— Carter, coachman, or devil, or that which you-are, not delay in telling-me who you-are, to where you-go and who is the people that you-carry in your old-cart, for more it-looks-like the boat of Charon than cart of those that themselves-use."
        ormsby: "“Carter, or coachman, or devil, or whatever thou art, tell me at once who thou art, whither thou art going, and who these folk are thou carriest in thy wagon, which looks more like Charon’s boat than an ordinary cart.”"
        vocab:
          - {w: "cochero", d: "coachman"}
          - {w: "o lo que eres", d: "or whatever you are"}
          - {w: "no tardar en", d: "not to be slow to; 'no tardes en decirme' = tell me at once"}
          - {w: "dó", d: "= dónde, where (old and poetic); 'a dó' = whither"}
          - {w: "gente", d: "people, folk; a singular noun in Spanish, so 'quién es la gente'"}
          - {w: "carricoche", d: "an old covered cart, a rattletrap (mildly mocking)"}
          - {w: "Carón", d: "Charon, the ferryman of Greek myth who rows the souls of the dead across the river Styx"}
          - {w: "de las que se usan", d: "of the ordinary kind, of those in common use"}
        diagram:
          - s: "no tardes"
            r: "main verb: don't be slow"
            under:
              - {s: "Carretero, cochero, o diablo, o lo que eres", r: "whom he addresses: carter, coachman, devil, or whatever you are"}
              - s: "en decirme"
                r: "in what: in telling me"
                under:
                  - {s: "quién eres", r: "what to tell, 1: who you are"}
                  - {s: "a dó vas", r: "what to tell, 2: where you are going"}
                  - s: "y quién es la gente"
                    r: "what to tell, 3: and who the people are"
                    under:
                      - s: "que llevas en tu carricoche"
                        r: "describes 'gente': whom you carry in your cart"
                        under:
                          - {s: "que más parece la barca de Carón que carreta de las que se usan", r: "describes 'carricoche': which looks more like Charon's boat than an ordinary cart"}
        forms:
          - {w: "eres", f: "ser (to be), present, you (tú). Irregular: soy, eres, es, somos, sois, son. Don Quijote uses 'tú', the form for an inferior."}
          - {w: "tardes", f: "tard- + -es → tardar (to delay), present subjunctive, you: a negative command always takes the subjunctive ('no tardes' = don't delay). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "decirme", f: "decir (to say, tell) + me (to me), the pronoun hung on the infinitive after 'en'."}
          - {w: "vas", f: "ir (to go), present, you. Irregular: voy, vas, va, vamos, vais, van."}
          - {w: "llevas", f: "llev- + -as → llevar (to carry), present, you. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "parece", f: "parec- + -e → parecer (to seem, look like), present, it. parezco, pareces, parece, parecemos, parecéis, parecen. 'más parece A que B' = it looks more like A than B."}
          - {w: "se usan", f: "us- + -an → usar (to use), present, they, with 'se' making it passive: 'that are used'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
        note: "A cart full of Death and devils suggests to Don Quijote Charon's ferry of the dead. He speaks to the carter with 'tú', as a knight to a commoner."
