  - sentences:
      - es: "— Asaz de locura sería intentar tal empresa: considere vuesa merced, señor mío, que para sopa de arroyo y tente bonete, no hay arma defensiva en el mundo, si no es embutirse y encerrarse en una campana de bronce;"
        literal: "— Enough of madness it-would-be to-attempt such enterprise: may-consider your grace, sir mine, that for soup of brook and hold-yourself cap, not there-is arm defensive in the world, if not it-is to-stuff-oneself and to-shut-oneself in a bell of bronze;"
        ormsby: "“It would be the height of madness to attempt such an enterprise; remember, señor, that against sops from the brook, and plenty of them, there is no defensive armour in the world, except to stow oneself away under a brass bell;"
        ormsby_note: "Sopa de arroyo, a slang phrase for pebbles."
        vocab:
          - {w: "asaz", d: "(archaic) enough, quite, very; 'asaz de locura' = madness enough, sheer madness"}
          - {w: "empresa", d: "enterprise, undertaking, a knightly deed (not 'company' here)"}
          - {w: "vuesa merced", d: "= vuestra merced, 'your grace', the polite 'you', in its worn-down spoken form"}
          - {w: "sopa de arroyo", d: "'brook soup', slang for stones, the pebbles of a stream-bed used as missiles"}
          - {w: "tente bonete", d: "'hold-on-to-your-cap'; 'a tente bonete' = in abundance, to excess: here 'and plenty of them'"}
          - {w: "arma defensiva", d: "defensive armour, armour for protection (as against 'armas ofensivas', weapons)"}
          - {w: "si no es", d: "except, unless (it be)"}
          - {w: "embutirse", d: "to stuff oneself into, squeeze inside"}
          - {w: "campana", d: "bell (a church bell, big enough to hide under)"}
        diagram:
          - s: "Asaz de locura sería"
            r: "main verb 1: it would be sheer madness"
            under:
              - {s: "intentar tal empresa", r: "subject: to attempt such an undertaking"}
          - s: "considere vuesa merced, señor mío"
            r: "main verb 2: let your grace consider, my lord"
            under:
              - s: "no hay arma defensiva en el mundo"
                r: "what to consider (after 'que'): there is no defensive armour in the world"
                under:
                  - {s: "para sopa de arroyo y tente bonete", r: "against what: against stones, and plenty of them"}
                  - {s: "si no es embutirse y encerrarse en una campana de bronce", r: "except: unless it is squeezing oneself and shutting oneself inside a bronze bell"}
        forms:
          - {w: "sería", f: "ser- + -ía → ser (to be), conditional, it: 'it would be'. The conditional adds endings to the whole infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "intentar", f: "infinitive of intentar (to attempt), used as the subject of 'sería': 'to attempt [it] would be'."}
          - {w: "considere", f: "consider- + -e → considerar (to consider), present subjunctive, you (vuesa merced), used as a polite command: 'consider'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "vuesa", f: "worn-down spoken form of 'vuestra' (your), feminine to match 'merced'."}
          - {w: "mío", f: "possessive placed after the noun: 'señor mío' = my lord, a respectful address."}
          - {w: "tente", f: "ten + te → tener (to hold), imperative, you (tú), with 'te' (yourself) stuck on the end: 'hold yourself, hold on'. The tú imperative of tener (to hold) is the irregular 'ten'. In 'tente bonete' it is frozen into a set phrase."}
          - {w: "hay", f: "the impersonal form of haber (to have), 'there is'. haber (to have) in the present: he, has, ha, hemos, habéis, han; when it means 'there is/are' the form is 'hay'."}
          - {w: "es", f: "es → ser (to be), present, it. Irregular: soy, eres, es, somos, sois, son. 'si no es' = unless it be, except."}
          - {w: "embutirse y encerrarse", f: "embutir (to stuff) + se and encerrar (to shut in) + se: two infinitives with 'se' (oneself) stuck on the end, the subject of 'es'."}
        note: "Sancho's bronze bell is a comic picture of the only armour proof against a hail of stones; in Part I the shepherds' slingstones knocked out several of Don Quijote's teeth, so both of them know what stones can do."
