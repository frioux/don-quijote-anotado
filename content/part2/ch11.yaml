        ormsby_note: "A theatrical manager and dramatist of Toledo who flourished about 1580."
        vocab:
          - {w: "recitante", d: "actor, player (an old word: one who recites)"}
          - {w: "compañía", d: "company, troupe of actors"}
          - {w: "Angulo el Malo", d: "a real theatre manager; 'el Malo' (the Bad) is a nickname"}
        diagram:
