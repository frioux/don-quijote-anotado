  - sentences:
      - es: "Y, diciendo esto, volvió a la carreta, que ya estaba bien cerca del pueblo. Iba dando voces, diciendo:"
        literal: "And, saying this, he-turned to the cart, which already was well near of-the village. He-was-going giving shouts, saying:"
        ormsby: "So saying, he made for the cart, which was now very near the town, shouting out as he went,"
        vocab:
          - {w: "volver a", d: "here 'to turn back toward, head for' (a place), not 'to do again'"}
          - {w: "bien cerca", d: "quite near; 'bien' strengthens the adverb, 'very'"}
          - {w: "pueblo", d: "village, small town"}
          - {w: "dar voces", d: "to shout, cry out ('voces' = shouts, not only 'voices')"}
        diagram:
          - s: "volvió a la carreta"
            r: "main verb 1: he headed back toward the cart"
            under:
              - {s: "Y, diciendo esto", r: "when: as he said this"}
              - {s: "que ya estaba bien cerca del pueblo", r: "describes 'carreta': which was by now quite near the village"}
          - s: "Iba dando voces"
            r: "main verb 2 (new sentence): he went along shouting"
            under:
              - {s: "diciendo:", r: "how: saying (the words that follow)"}
        forms:
          - {w: "diciendo", f: "gerund of decir (to say): 'saying'. The e of the stem becomes i in the gerund: decir → diciendo."}
          - {w: "volvió", f: "volv- + -ió → volver (to return, turn back), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, it (the cart). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes: 'of the'."}
          - {w: "Iba dando", f: "ib- + -a → ir (to go), imperfect, he. Irregular: iba, ibas, iba, íbamos, ibais, iban. + dando, gerund of dar (to give). ir (to go) + gerund = to go along doing something: 'he went along giving shouts'."}
  - sentences:
      - es: "— Deteneos, esperad, turba alegre y regocijada, que os quiero dar a entender cómo se han de tratar los jumentos y alimañas que sirven de caballería a los escuderos de los caballeros andantes."
        literal: "— Stop-yourselves, wait, crowd merry and rejoicing, for you I-want to-give to understand how are-to be-treated the donkeys and beasts that serve as mount to the squires of the knights errant."
        ormsby: "“Stay! halt! ye merry, jovial crew! I want to teach you how to treat asses and animals that serve the squires of knights-errant for steeds.”"
        vocab:
          - {w: "detenerse", d: "to stop, halt"}
          - {w: "turba", d: "crowd, rabble, mob (scornful)"}
          - {w: "regocijado", d: "merry, festive, full of glee"}
          - {w: "dar a entender", d: "to make (someone) understand; here a threat, 'to teach (someone) a lesson'"}
          - {w: "haber de", d: "must, to be to: 'se han de tratar' = are to be treated"}
          - {w: "jumento", d: "donkey, ass"}
          - {w: "alimaña", d: "animal, beast; in modern Spanish 'vermin', a pest that preys on game"}
          - {w: "servir de", d: "to serve as"}
          - {w: "caballería", d: "mount, riding animal (not 'cavalry' or 'chivalry' here)"}
        diagram:
          - {s: "Deteneos, esperad", r: "main verbs 1 and 2: stop, wait"}
          - {s: "turba alegre y regocijada", r: "who is addressed: merry, festive crowd"}
          - s: "que os quiero dar a entender"
            r: "main verb 3 (after 'que', for): for I want to make you understand"
            under:
              - s: "cómo se han de tratar los jumentos y alimañas"
                r: "what: how donkeys and beasts ought to be treated"
                under:
                  - {s: "que sirven de caballería a los escuderos de los caballeros andantes", r: "describes 'jumentos y alimañas': that serve the squires of knights errant as mounts"}
        forms:
          - {w: "Deteneos", f: "deten- + -ed + os → detenerse (to stop), imperative, you (vosotros, the actors), with 'os' (yourselves) stuck on the end; the final -d of 'detened' drops before 'os'. The vosotros imperative swaps the final -r of the infinitive for -d: esperad, detened, servid."}
          - {w: "esperad", f: "esper- + -ad → esperar (to wait), imperative, you (vosotros): 'wait!'. The vosotros imperative swaps the final -r of the infinitive for -d."}
          - {w: "regocijada", f: "regocij- + -ada → regocijar (to gladden), participle used as an adjective, feminine to match 'turba'."}
          - {w: "os quiero dar", f: "quier- + -o → querer (to want), present, I. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren. 'os' (you, plural) belongs to dar (to give) but sits in front of 'quiero'."}
          - {w: "se han de tratar", f: "ha- + -n → haber (to have), present, they. Irregular: he, has, ha, hemos, habéis, han. 'haber de' + infinitive = must, are to; 'se' makes tratar (to treat) passive: 'are to be treated'."}
          - {w: "sirven", f: "sirv- + -en → servir (to serve), present, they. The e of the stem becomes i when stressed: sirvo, sirves, sirve, servimos, servís, sirven."}
        note: "In chivalric logic an injury to a squire's mount is an insult to the knight, who must avenge it; Don Quijote speaks as if challenging an enemy host, though the 'army' is a troupe of strolling players."
