        ormsby: "“Señor, the devil has carried off my Dapple.”"
        vocab:
          - {w: "llevarse", d: "to carry off, take away (with 'se': away from here)"}
          - {w: "el Diablo", d: "the Devil: here the actor dressed as the Devil, so the line is literally true and sounds like a curse"}
        diagram:
          - s: "se ha llevado"
            r: "main verb: has carried off"
            under:
              - {s: "Señor", r: "addressed to: sir"}
              - {s: "el Diablo", r: "subject: the Devil (the actor)"}
              - {s: "al rucio", r: "object: the grey (with 'a' because Sancho treats his donkey like a person)"}
        forms:
          - {w: "se ha llevado", f: "ha (haber (to have), present, he: he, has, ha, hemos, habéis, han) + llevado, the participle of llevar (to carry), with 'se': llevarse (to carry off). The present perfect, 'has carried off', for something that has just happened."}
          - {w: "al", f: "a + el. The 'a' is the personal a, used before a person as object and here before a much-loved animal."}
