  - sentences:
      - es: "Mas, apenas hubo dejado su caballería Sancho por acudir a don Quijote, cuando el demonio bailador de las vejigas saltó sobre el rucio, y, sacudiéndole con ellas, el miedo y ruido, más que el dolor de los golpes, le hizo volar por la campaña hacia el lugar donde iban a hacer la fiesta."
        literal: "But, hardly had left his mount Sancho in-order-to go-to-help [to] Don Quijote, when the demon dancer of the bladders jumped upon the grey, and, beating-him with them, the fear and noise, more than the pain of the blows, him made fly through the countryside toward the village where they-were-going to do the festival."
        ormsby: "But the moment Sancho quitted his beast to go and help Don Quixote, the dancing devil with the bladders jumped up on Dapple, and beating him with them, more by the fright and the noise than by the pain of the blows, made him fly across the fields towards the village where they were going to hold their festival."
        vocab:
          - {w: "mas", d: "but (literary, no accent; not 'más', more)"}
          - {w: "apenas ... cuando", d: "no sooner ... than, hardly ... when"}
          - {w: "caballería", d: "mount, riding animal (false friend: here not 'cavalry' or 'chivalry')"}
          - {w: "acudir a", d: "to go to the help of, hurry to"}
          - {w: "bailador", d: "dancing, dancer"}
          - {w: "sacudir", d: "to beat, thump"}
          - {w: "campaña", d: "open country, the fields (= campo), not 'campaign'"}
          - {w: "lugar", d: "village (common in Cervantes), not just 'place'"}
          - {w: "fiesta", d: "festival; here the Corpus Christi performance"}
        diagram:
          - s: "apenas hubo dejado su caballería Sancho"
            r: "time clause: no sooner had Sancho left his mount"
            under:
              - {s: "por acudir a don Quijote", r: "why: to go to Don Quijote's help"}
          - s: "cuando el demonio bailador de las vejigas saltó sobre el rucio"
            r: "main verb 1: than the dancing devil with the bladders jumped on the grey"
          - s: "le hizo volar"
            r: "main verb 2 (after 'y'): made him fly"
            under:
              - {s: "sacudiéndole con ellas", r: "how: beating him with them (the devil, though the subject has changed)"}
              - {s: "el miedo y ruido", r: "subject: the fright and the noise"}
              - {s: "más que el dolor de los golpes", r: "comparison: more than the pain of the blows"}
              - {s: "por la campaña", r: "where: across the countryside"}
              - s: "hacia el lugar"
                r: "where to: toward the village"
                under:
                  - {s: "donde iban a hacer la fiesta", r: "describes 'lugar': where they were going to give the performance"}
        forms:
          - {w: "hubo dejado", f: "hub- + -o → haber (to have), preterite, he, + dejado, the participle of dejar (to leave): the past anterior, 'had left', used after 'apenas' for one quick action just before another. haber (to have) in the preterite: hube, hubiste, hubo, hubimos, hubisteis, hubieron."}
          - {w: "acudir", f: "acudir (to go to help), infinitive after 'por' (in order to)."}
          - {w: "saltó", f: "salt- + -ó → saltar (to jump), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "sacudiéndole", f: "gerund of sacudir (to beat) + le (him, the donkey), accent added to keep the stress on -dién-. 'le' for a male animal as object is leísmo."}
          - {w: "ellas", f: "'them', feminine plural because it stands for 'las vejigas'."}
          - {w: "hizo", f: "hiz- + -o → hacer (to make), preterite, it (the fear and noise, taken as one thing). Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron. 'le hizo volar' = made him fly."}
          - {w: "iban", f: "ib- + -an → ir (to go), imperfect, they (the actors). Irregular: iba, ibas, iba, íbamos, ibais, iban. 'ir a' + infinitive = to be going to."}
        note: "The sentence changes horse in midstream: it begins with the devil beating the donkey, then makes 'the fear and noise' the subject that sent it flying. Cervantes often lets a long sentence slide from one subject to another like this."
      - es: "Miraba Sancho la carrera de su rucio y la caída de su amo, y no sabía a cuál de las dos necesidades acudiría primero;"
