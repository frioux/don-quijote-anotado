          - {w: "luego", d: "at once, immediately (the old sense, not 'later')"}
          - {w: "escuadrón volante", d: "flying squadron, a fast-moving detachment of troops; a joke on the actors who 'flew' to fight"}
          - {w: "proseguir", d: "to continue, go on with"}
          - {w: "felice", d: "= feliz, happy (old poetic form)"}
          - {w: "temeroso", d: "fearful, dreadful: here 'causing fear', not 'afraid'"}
          - {w: "gracias sean dadas a", d: "thanks be (given) to, a pious formula"}
          - {w: "saludable", d: "salutary, wholesome"}
        diagram:
          - {s: "Volvió las riendas luego", r: "main verb 1: he (Don Quijote) turned his horse at once"}
          - {s: "Sancho fue a tomar su rucio", r: "main verb 2: Sancho went to take his donkey"}
          - {s: "la Muerte con todo su escuadrón volante volvieron a su carreta", r: "main verb 3: Death with all her flying squadron went back to their cart"}
          - {s: "y prosiguieron su viaje", r: "main verb 4: and went on with their journey"}
          - s: "y este felice fin tuvo la temerosa aventura de la carreta de la Muerte"
            r: "main verb 5: and the dreadful adventure of the cart of Death had this happy end"
            under:
