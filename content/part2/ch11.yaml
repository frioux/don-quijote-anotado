                  - {s: "que es la octava del Corpus", r: "describes 'mañana': which is the octave of Corpus Christi"}
              - {s: "el auto de Las Cortes de la Muerte", r: "object: the religious play 'The Parliament of Death'"}
          - s: "y hémosle de hacer"
            r: "main verb 2: and we have to perform it"
            under:
              - {s: "esta tarde", r: "when: this afternoon"}
              - s: "en aquel lugar"
                r: "where: in that village"
                under:
                  - {s: "que desde aquí se parece", r: "describes 'lugar': which can be seen from here"}
        forms:
          - {w: "hemos hecho", f: "hemos, haber (to have), present, we + hecho, the irregular participle of hacer (to do, to perform): 'we have performed'. haber (to have) in the present: he, has, ha, hemos, habéis, han."}
          - {w: "está", f: "est- + -á → estar (to be), present, it (the village). estoy, estás, está, estamos, estáis, están."}
          - {w: "aquella, aquel", f: "'that (over there)', feminine 'aquella' to match 'loma', masculine 'aquel' to match 'lugar'."}
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
          - {w: "hémosle de hacer", f: "hemos + le + de hacer → haber de (to have to), present, we, + hacer (to do), with 'le' (it, the play) stuck on 'hemos' and an accent added: 'we have to perform it'. haber (to have) in the present: he, has, ha, hemos, habéis, han. Cervantes hangs the pronoun on a verb that opens its clause; modern 'lo hemos de hacer'. Using 'le' for a thing is leísmo."}
          - {w: "se parece", f: "parec- + -e → parecer (to appear, show), present, it, with 'se': 'shows itself, can be seen'. parezco, pareces, parece, parecemos, parecéis, parecen."}
        note: "On Corpus Christi and the days after it, towns paid companies to stage autos sacramentales, often on carts, and a troupe could play one village in the morning and the next in the afternoon. A play called 'Las Cortes de la Muerte', begun by Micael de Carvajal and finished by Luis Hurtado de Toledo, was printed in 1557."
      - es: "y, por estar tan cerca y escusar el trabajo de desnudarnos y volvernos a vestir, nos vamos vestidos con los mesmos vestidos que representamos."
