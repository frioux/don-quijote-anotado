      - es: "Don Quijote, que los vio puestos en tan gallardo escuadrón, los brazos levantados con ademán de despedir poderosamente las piedras, detuvo las riendas a Rocinante y púsose a pensar de qué modo los acometería con menos peligro de su persona."
