                r: "what he would rather: that those blows were given to him in the pupils of his eyes"
                under:
                  - {s: "que en el más mínimo pelo de la cola de su asno", r: "comparison: than on the least hair of his donkey's tail"}
        forms:
          - {w: "buen", f: "bueno (good) clipped before a masculine singular noun ('escudero', 'criado'), like un, gran, algún."}
          - {w: "pudo", f: "pud- + -o → poder (to be able), preterite, it (the love). Irregular: pude, pudiste, pudo, pudimos, pudisteis, pudieron. 'poder más' = to prevail."}
          - {w: "veía", f: "ve- + -ía → ver (to see), imperfect, he: 'he saw (each time)'. ver (to see) in the imperfect: veía, veías, veía, veíamos, veíais, veían. It takes the infinitives levantar (to rise) and caer (to fall): 'saw the bladders rise and fall'."}
          - {w: "eran", f: "er- + -an → ser (to be), imperfect, they (the sights). Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "quisiera", f: "quis- + -iera → querer (to want), imperfect subjunctive (-ra form), he, used as a conditional: 'he would rather have'. quisiera, quisieras, quisiera, quisiéramos, quisierais, quisieran."}
          - {w: "aquellos", f: "aquel (that), masculine plural to match 'golpes'."}
          - {w: "se los dieran", f: "di- + -eran → dar (to give), imperfect subjunctive (-ra form), they (people in general): 'that they should give them to him'. diera, dieras, diera, diéramos, dierais, dieran. Subjunctive after 'quisiera que'. 'los' = the blows; 'se' is 'le' (to him) changed to 'se' before 'los', and 'a él' repeats it for emphasis."}
          - {w: "más mínimo", f: "mínimo is already a superlative ('least'); adding 'más' doubles it for emphasis, 'the very least'."}
