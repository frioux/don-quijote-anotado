          - {w: "acudiría", f: "acudir- + -ía → acudir (to go to help), conditional, he: 'he should go to help'. The conditional adds -ía, -ías, -ía, -íamos, -íais, -ían to the whole infinitive."}
      - es: "pero, en efecto, como buen escudero y como buen criado, pudo más con él el amor de su señor que el cariño de su jumento, puesto que cada vez que veía levantar las vejigas en el aire y caer sobre las ancas de su rucio eran para él tártagos y sustos de muerte, y antes quisiera que aquellos golpes se los dieran a él en las niñas de los ojos que en el más mínimo pelo de la cola de su asno."
        literal: "but, in effect, as good squire and as good servant, could more with him the love of his lord than the affection of his donkey, granted that each time that he-saw rise the bladders in the air and fall upon the haunches of his grey they-were for him torments and frights of death, and rather he-would-have-wished that those blows them they-should-give to him in the pupils of the eyes than in the most least hair of the tail of his ass."
        ormsby: "but in the end, like a good squire and good servant, he let his love for his master prevail over his affection for his ass; though every time he saw the bladders rise in the air and come down on the hind quarters of his Dapple he felt the pains and terrors of death, and he would have rather had the blows fall on the apples of his own eyes than on the least hair of his ass’s tail."
        vocab:
          - {w: "en efecto", d: "in the end, in fact (not 'in effect')"}
          - {w: "criado", d: "servant"}
          - {w: "poder más", d: "to prevail, be stronger; 'pudo más con él el amor' = love won out in him"}
          - {w: "cariño", d: "affection, fondness"}
          - {w: "jumento", d: "donkey, ass"}
          - {w: "puesto que", d: "although, even though (Cervantes' usual sense; modern 'since' is a false friend)"}
          - {w: "anca", d: "haunch, hindquarter of a horse or donkey"}
          - {w: "tártago", d: "spurge, a violently purging plant; figuratively a bitter pang, a torment"}
          - {w: "susto", d: "fright, scare; 'sustos de muerte' = mortal terrors"}
          - {w: "antes", d: "here 'rather, sooner' (preference), not 'before'"}
          - {w: "niñas de los ojos", d: "pupils of the eyes, 'the apple of one's eye'"}
          - {w: "el más mínimo", d: "the very least (a doubled superlative)"}
        diagram:
          - s: "pudo más con él el amor de su señor"
            r: "main verb 1: love of his master won out in him"
            under:
