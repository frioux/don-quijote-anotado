  - sentences:
      - es: "— Pues ésa es tu determinación —replicó don Quijote—, Sancho bueno, Sancho discreto, Sancho cristiano y Sancho sincero, dejemos estas fantasmas y volvamos a buscar mejores y más calificadas aventuras; que yo veo esta tierra de talle, que no han de faltar en ella muchas y muy milagrosas."
        literal: "— Since that is your determination —replied Don Quijote—, Sancho good, Sancho sensible, Sancho Christian and Sancho sincere, let-us-leave these phantoms and let-us-return to seek better and more distinguished adventures; for I see this land of [such a] shape, that not they-have to be-lacking in it many and very miraculous [ones]."
        ormsby: "“Well,” said Don Quixote, “if that be thy determination, good Sancho, sensible Sancho, Christian Sancho, honest Sancho, let us leave these phantoms alone and turn to the pursuit of better and worthier adventures; for, from what I see of this country, we cannot fail to find plenty of marvellous ones in it.”"
        vocab:
          - {w: "pues", d: "here 'since' (giving a reason), not 'well'"}
          - {w: "determinación", d: "decision, resolve"}
          - {w: "discreto", d: "sensible, wise, shrewd (false friend: more than 'discreet')"}
          - {w: "fantasma", d: "phantom, ghost, apparition; feminine here ('estas fantasmas'), as it often was in Cervantes' day"}
          - {w: "calificado", d: "distinguished, of quality, worthy"}
          - {w: "de talle que", d: "of such a kind that, such that ('talle' = shape, build)"}
          - {w: "faltar", d: "to be lacking, be missing"}
          - {w: "milagroso", d: "marvellous, wondrous (literally 'miraculous')"}
        diagram:
          - s: "dejemos estas fantasmas"
            r: "main verb 1: let us leave these phantoms"
            under:
              - {s: "Pues ésa es tu determinación", r: "why: since that is your decision"}
              - {s: "—replicó don Quijote—", r: "speaker tag: replied Don Quijote"}
              - {s: "Sancho bueno, Sancho discreto, Sancho cristiano y Sancho sincero", r: "who is addressed: good, wise, Christian, honest Sancho"}
          - s: "y volvamos a buscar mejores y más calificadas aventuras"
            r: "main verb 2: and let us go back to seeking better and worthier adventures"
          - s: "que yo veo esta tierra de talle"
            r: "main verb 3 (after 'que', for): for I see this land is of such a kind"
            under:
              - {s: "que no han de faltar en ella muchas y muy milagrosas", r: "result: that many, and very marvellous ones, cannot fail to be found in it"}
        forms:
          - {w: "ésa", f: "'that one', feminine to match 'determinación'; the old spelling puts an accent on demonstrative pronouns."}
          - {w: "es", f: "es → ser (to be), present, it. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (repliqué, with c → qu before e)."}
          - {w: "dejemos", f: "dej- + -emos → dejar (to leave), present subjunctive, we: 'let us leave'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "estas fantasmas", f: "estas, feminine plural of este (this), because 'fantasma' was treated as feminine; modern Spanish says 'estos fantasmas'."}
          - {w: "volvamos", f: "volv- + -amos → volver (to return), present subjunctive, we: 'let us go back'. The stem o becomes ue when stressed: vuelva, vuelvas, vuelva, volvamos, volváis, vuelvan. 'volver a' + infinitive = to go back to doing."}
          - {w: "calificadas", f: "calific- + -adas → calificar (to qualify, rate), participle used as an adjective, feminine plural to match 'aventuras'."}
          - {w: "veo", f: "ve- + -o → ver (to see), present, I. Irregular: veo, ves, ve, vemos, veis, ven."}
          - {w: "han de faltar", f: "han → haber (to have), present, they. Irregular: he, has, ha, hemos, habéis, han. 'haber de' + faltar (to be lacking): 'no han de faltar' = they are bound not to be lacking."}
          - {w: "muchas y muy milagrosas", f: "feminine plural, agreeing with 'aventuras', which is understood."}
  - sentences:
      - es: "Volvió las riendas luego, Sancho fue a tomar su rucio, la Muerte con todo su escuadrón volante volvieron a su carreta y prosiguieron su viaje, y este felice fin tuvo la temerosa aventura de la carreta de la Muerte, gracias sean dadas al saludable consejo que Sancho Panza dio a su amo;"
        literal: "He-turned the reins at-once, Sancho went to take his gray-donkey, the Death with all her squadron flying returned to their cart and continued their journey, and this happy end had the fearful adventure of the cart of the Death, thanks be given to-the healthy counsel that Sancho Panza gave to his master;"
        ormsby: "He at once wheeled about, Sancho ran to take possession of his Dapple, Death and his flying squadron returned to their cart and pursued their journey, and thus the dread adventure of the cart of Death ended happily, thanks to the advice Sancho gave his master;"
        vocab:
