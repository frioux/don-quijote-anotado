                      - {s: "donde está la Muerte", r: "describes 'ejército', 1: where Death is"}
                      - {s: "y pelean en persona emperadores", r: "describes 'ejército', 2: and where emperors fight in person"}
                      - {s: "y a quien ayudan los buenos y los malos ángeles", r: "describes 'ejército', 3: and which the good and the bad angels help"}
        forms:
          - {w: "se ha de considerar", f: "ha → haber (to have), present, it. Irregular: he, has, ha, hemos, habéis, han. 'haber de' + infinitive = must; 'se' makes considerar (to consider) impersonal: 'one must consider'."}
          - {w: "es", f: "es → ser (to be), present, it. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "acometer un hombre solo", f: "acometer (to attack), an infinitive with its own subject after it: 'for one man alone to attack'."}
          - {w: "está", f: "est- + -á → estar (to be), present, she (Death). Irregular: estoy, estás, está, estamos, estáis, están."}
          - {w: "pelean", f: "pele- + -an → pelear (to fight), present, they (emperors). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. The subject 'emperadores' follows."}
          - {w: "ayudan", f: "ayud- + -an → ayudar (to help), present, they (the angels). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
