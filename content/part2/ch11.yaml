            r: "main verb: we are"
            under:
              - {s: "Señor", r: "whom he addresses: sir"}
              - {s: "nosotros", r: "subject: we"}
              - {s: "recitantes de la compañía de Angulo el Malo", r: "what we are: players in Angulo el Malo's company"}
        forms:
          - {w: "somos", f: "ser (to be), present, we. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "nosotros", f: "'we', stated for emphasis: Spanish normally leaves the subject pronoun out."}
        note: "The devil answers with the polite 'Señor' and 'vuestra merced', though Don Quijote addressed him with the rough 'tú'."
