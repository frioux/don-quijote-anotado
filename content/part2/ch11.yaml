            under:
              - {s: "Si otra cosa vuestra merced desea saber de nosotros", r: "condition: if you want to know anything else about us"}
              - {s: "que yo le sabré responder con toda puntualidad", r: "why: for I'll be able to answer you exactly"}
          - s: "todo se me alcanza"
            r: "main verb 2 (after 'que', for): everything is within my grasp"
            under:
              - {s: "como soy demonio", r: "why: since I am a devil"}
        forms:
          - {w: "desea", f: "dese- + -a → desear (to want), present, you (vuestra merced, which takes the he/she form). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "pregúntemelo", f: "pregunt- + -e + me + lo → preguntar (to ask), present subjunctive, you (vuestra merced), as a polite command, with 'me' (of me) and 'lo' (it) stuck on the end; the accent keeps the stress. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "le", f: "'to you': with 'vuestra merced' the pronoun is the he/she one."}
          - {w: "sabré", f: "sabr- + -é → saber (to know), future, I. Irregular stem sabr-: sabré, sabrás, sabrá, sabremos, sabréis, sabrán."}
          - {w: "soy", f: "ser (to be), present, I. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "se me alcanza", f: "alcanz- + -a → alcanzar (to reach), present, it (everything), with 'se' and 'me' (to me): 'everything reaches me', I grasp it all. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
        note: "The actor jokes that he knows everything because he is a devil, as if the part had made him one; the devil's cunning knowledge was proverbial."
  - sentences:
      - es: "— Por la fe de caballero andante —respondió don Quijote—, que, así como vi este carro, imaginé que alguna grande aventura se me ofrecía; y ahora digo que es menester tocar las apariencias con la mano para dar lugar al desengaño."
        literal: "— By the faith of knight errant — answered Don Quijote —, that, as soon as I-saw this car, I-imagined that some great adventure itself to-me was-offering; and now I-say that it-is needful to-touch the appearances with the hand to give room to-the undeceiving."
        ormsby: "“By the faith of a knight-errant,” replied Don Quixote, “when I saw this cart I fancied some great adventure was presenting itself to me; but I declare one must touch with the hand what appears to the eye, if illusions are to be avoided."
        vocab:
          - {w: "por la fe de", d: "by the faith of: an oath, followed by 'que' and what is sworn"}
          - {w: "así como", d: "as soon as"}
          - {w: "carro", d: "wagon, car; here a pageant cart like those of the Corpus plays"}
          - {w: "ser menester", d: "to be necessary"}
          - {w: "apariencias", d: "appearances; in the theatre of the time also the painted scenes and stage effects"}
          - {w: "dar lugar a", d: "to make way for, allow"}
          - {w: "desengaño", d: "undeceiving, disillusion: seeing things as they really are"}
        diagram:
          - s: "imaginé"
            r: "main verb 1: I imagined"
            under:
              - {s: "Por la fe de caballero andante", r: "oath: by the faith of a knight errant (the 'que' after it introduces what he swears)"}
              - {s: "respondió don Quijote", r: "speaker: Don Quijote answered"}
              - {s: "así como vi este carro", r: "when: as soon as I saw this cart"}
              - {s: "que alguna grande aventura se me ofrecía", r: "what I imagined: that some great adventure was coming my way"}
          - s: "y ahora digo"
            r: "main verb 2: and now I say"
            under:
              - s: "que es menester tocar las apariencias con la mano"
                r: "what I say: that one must touch appearances with one's hand"
                under:
                  - {s: "para dar lugar al desengaño", r: "why: to make room for the truth"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "vi", f: "ver (to see), preterite, I. Irregular: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "imaginé", f: "imagin- + -é → imaginar (to imagine), preterite, I. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "grande", f: "full form before a singular noun, where modern Spanish clips it to 'gran'."}
          - {w: "se me ofrecía", f: "ofrec- + -ía → ofrecer (to offer), imperfect, it, with 'se' (itself) and 'me' (to me). The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "es menester", f: "es, ser (to be), present, it (soy, eres, es, somos, sois, son) + menester (need): 'it is necessary', followed by the infinitive 'tocar' (to touch)."}
          - {w: "al", f: "a + el, the contraction modern Spanish still makes."}
        note: "For once Don Quijote accepts the plain explanation; the lesson he draws, that appearances must be tested by touch, is the reverse of his usual method. 'Desengaño' is a key word of Spanish writing of the period."
      - es: "Andad con Dios, buena gente, y haced vuestra fiesta, y mirad si mandáis algo en que pueda seros de provecho, que lo haré con buen ánimo y buen talante, porque desde mochacho fui aficionado a la carátula, y en mi mocedad se me iban los ojos tras la farándula."
        literal: "Go with God, good people, and make your feast, and look if you-command something in which I-may-be-able to-be-to-you of profit, for it I-will-do with good spirit and good disposition, because since boy I-was fond of the mask, and in my youth themselves to-me were-going the eyes after the players."
        ormsby: "God speed you, good people; keep your festival, and remember, if you demand of me ought wherein I can render you a service, I will do it gladly and willingly, for from a child I was fond of the play, and in my youth a keen lover of the actor’s art.”"
        vocab:
          - {w: "andad con Dios", d: "go with God, farewell, God speed you"}
          - {w: "mandar", d: "to command; 'si mandáis algo' = if you want anything (a polite formula)"}
          - {w: "ser de provecho", d: "to be of use, be of service"}
          - {w: "talante", d: "disposition, will; 'con buen talante' = willingly"}
          - {w: "mochacho", d: "= muchacho, boy (old form); 'desde mochacho' = since boyhood"}
          - {w: "aficionado a", d: "fond of, keen on"}
          - {w: "carátula", d: "mask; by extension the stage, the acting profession"}
          - {w: "mocedad", d: "youth, young days"}
          - {w: "írsele a uno los ojos tras", d: "to have one's eyes run after, long for"}
          - {w: "farándula", d: "the life and trade of strolling players; also a kind of small touring troupe"}
        diagram:
          - s: "Andad con Dios"
            r: "main verb 1: go with God"
            under:
              - {s: "buena gente", r: "whom he addresses: good people"}
          - {s: "y haced vuestra fiesta", r: "main verb 2: and hold your festival"}
          - s: "y mirad"
            r: "main verb 3: and see"
            under:
              - s: "si mandáis algo"
                r: "what to see: whether you want anything"
                under:
                  - {s: "en que pueda seros de provecho", r: "describes 'algo': in which I can be of use to you"}
              - s: "que lo haré con buen ánimo y buen talante"
                r: "why: for I will do it gladly and willingly"
                under:
                  - {s: "porque desde mochacho fui aficionado a la carátula", r: "why, 1: because since boyhood I was fond of the stage"}
                  - {s: "y en mi mocedad se me iban los ojos tras la farándula", r: "why, 2: and in my youth my eyes ran after the players"}
        forms:
          - {w: "Andad, haced, mirad", f: "imperatives, you (vosotros, the actors): the final -r of the infinitive becomes -d. andar (to go, walk) → andad, hacer (to do, make) → haced, mirar (to look) → mirad."}
          - {w: "vuestra", f: "'your' (of vosotros), feminine to match 'fiesta'."}
          - {w: "mandáis", f: "mand- + -áis → mandar (to command), present, you (vosotros). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "pueda", f: "pued- + -a → poder (to be able), present subjunctive, I. pueda, puedas, pueda, podamos, podáis, puedan. Subjunctive because the 'something' is not yet known."}
          - {w: "seros", f: "ser (to be) + os (to you), the pronoun hung on the infinitive."}
          - {w: "haré", f: "har- + -é → hacer (to do), future, I. Irregular stem har-: haré, harás, hará, haremos, haréis, harán."}
          - {w: "buen", f: "bueno (good) clipped before a masculine singular noun ('ánimo', 'talante')."}
          - {w: "fui", f: "ser (to be), preterite, I. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "se me iban", f: "ib- + -an → ir (to go), imperfect, they (the eyes), with 'se' and 'me' (on me): 'my eyes would go'. Irregular: iba, ibas, iba, íbamos, ibais, iban."}
        note: "Cervantes himself wrote plays, and in the prologue to his 'Ocho comedias' (1615) he recalls watching the actor-manager Lope de Rueda as a boy, so Don Quijote's fondness for the stage is his author's."
  - sentences:
      - es: "Estando en estas pláticas, quiso la suerte que llegase uno de la compañía, que venía vestido de bojiganga, con muchos cascabeles, y en la punta de un palo traía tres vejigas de vaca hinchadas;"
        literal: "Being in these talks, willed the luck that should-arrive one of the company, who was-coming dressed as mummer, with many bells, and on the tip of a stick he-was-carrying three bladders of cow inflated;"
        ormsby: "While they were talking, fate so willed it that one of the company in a mummers’ dress with a great number of bells, and armed with three blown ox-bladders at the end of a stick, joined them,"
        vocab:
          - {w: "plática", d: "talk, conversation; 'estando en estas pláticas' = while they were talking"}
          - {w: "quiso la suerte", d: "fate willed it, as luck would have it"}
          - {w: "compañía", d: "a company of strolling players, a troupe"}
          - {w: "vestido de", d: "dressed as, in the costume of"}
          - {w: "bojiganga", d: "a burlesque masquerade, and the clown's costume worn in it, hung with bells; also a name for a small troupe of strolling players (modern 'mojiganga')"}
          - {w: "cascabel", d: "small round jingle bell, the kind on a fool's costume or a harness"}
          - {w: "vejiga", d: "bladder; inflated ox-bladders on a stick were the clown's slapstick, noisy but harmless"}
          - {w: "hinchado", d: "blown up, inflated"}
        diagram:
          - s: "quiso la suerte"
            r: "main verb: fate willed"
            under:
              - {s: "Estando en estas pláticas", r: "when: while they were in these talks"}
              - s: "que llegase uno de la compañía"
                r: "what fate willed: that one of the company should come up"
                under:
                  - {s: "que venía vestido de bojiganga, con muchos cascabeles", r: "describes 'uno': who came dressed as a masquerade clown, with many bells"}
                  - {s: "y en la punta de un palo traía tres vejigas de vaca hinchadas", r: "describes 'uno', 2: and carried three blown-up ox-bladders on the end of a stick"}
        forms:
          - {w: "Estando", f: "gerund of estar (to be): 'being (in)', i.e. while they were. The subject is Don Quijote and the actors, understood."}
          - {w: "estas", f: "est- + -as → este (this), feminine plural to match 'pláticas'."}
          - {w: "quiso", f: "quis- + -o → querer (to want, to will), preterite, it (luck). Irregular: quise, quisiste, quiso, quisimos, quisisteis, quisieron. The subject 'la suerte' comes after the verb."}
          - {w: "llegase", f: "lleg- + -ase → llegar (to arrive), imperfect subjunctive (-se form), he: 'that he should arrive'. The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. Subjunctive because it depends on 'quiso ... que' (willed that), and past because 'quiso' is past."}
          - {w: "venía", f: "ven- + -ía → venir (to come), imperfect, he: 'was coming'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "vestido", f: "vest- + -ido → vestir (to dress), participle used as an adjective, masculine singular to match 'uno'."}
          - {w: "traía", f: "tra- + -ía → traer (to bring, carry), imperfect, he: 'was carrying'. traía, traías, traía, traíamos, traíais, traían."}
          - {w: "hinchadas", f: "hinch- + -adas → hinchar (to inflate), participle used as an adjective, feminine plural to match 'vejigas'; it comes after 'de vaca'."}
        note: "The Corpus Christi plays were followed through the streets by masked figures, dancers and clowns; a fool with bells and bladders on a stick was a stock comic figure of such festivities."
      - es: "el cual moharracho, llegándose a don Quijote, comenzó a esgrimir el palo y a sacudir el suelo con las vejigas, y a dar grandes saltos, sonando los cascabeles, cuya mala visión así alborotó a Rocinante, que, sin ser poderoso a detenerle don Quijote, tomando el freno entre los dientes, dio a correr por el campo con más ligereza que jamás prometieron los huesos de su notomía."
        literal: "the which masked-clown, drawing-himself-near to Don Quijote, began to brandish the stick and to beat the ground with the bladders, and to give great leaps, sounding the bells, whose bad sight so startled [to] Rocinante, that, without being able to hold-him-back Don Quijote, taking the bit between the teeth, he-gave to run through the field with more lightness than ever promised the bones of his anatomy."
        ormsby: "and this merry-andrew approaching Don Quixote, began flourishing his stick and banging the ground with the bladders and cutting capers with great jingling of the bells, which untoward apparition so startled Rocinante that, in spite of Don Quixote’s efforts to hold him in, taking the bit between his teeth he set off across the plain with greater speed than the bones of his anatomy ever gave any promise of."
        vocab:
          - {w: "moharracho", d: "masked buffoon in a festival, a clown in grotesque costume (modern 'mamarracho', a ridiculous figure)"}
          - {w: "llegarse a", d: "to come up to, approach"}
          - {w: "esgrimir", d: "to brandish, wield (a weapon); literally 'to fence'"}
          - {w: "sacudir", d: "to beat, thump; also to shake"}
          - {w: "dar saltos", d: "to leap, cut capers"}
          - {w: "visión", d: "apparition, sight; 'mala visión' = ugly apparition"}
          - {w: "alborotar", d: "to startle, throw into a panic"}
          - {w: "ser poderoso a", d: "to be able to, have the power to"}
          - {w: "tomar el freno entre los dientes", d: "to take the bit between its teeth, i.e. bolt out of the rider's control"}
          - {w: "dar a correr", d: "to break into a run, bolt"}
          - {w: "ligereza", d: "speed, lightness"}
          - {w: "notomía", d: "= anatomía, here 'skeleton': Rocinante is all bones (old popular form)"}
