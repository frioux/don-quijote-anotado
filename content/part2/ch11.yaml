      - es: "y si esta consideración no le mueve a estarse quedo, muévale saber de cierto que, entre todos los que allí están, aunque parecen reyes, príncipes y emperadores, no hay ningún caballero andante."
        literal: "and if this consideration not you moves to keep-yourself still, may-move-you to-know for certain that, among all those that there are, although they-seem kings, princes and emperors, not there-is no knight errant."
        ormsby: "and if this reflection will not make you keep quiet, perhaps it will to know for certain that among all these, though they look like kings, princes, and emperors, there is not a single knight-errant.”"
        vocab:
          - {w: "consideración", d: "thought, reflection, argument"}
          - {w: "mover a", d: "to move (someone) to, induce to"}
          - {w: "estarse quedo", d: "to keep still, stay put ('quedo' = quiet, motionless)"}
          - {w: "de cierto", d: "for certain, for sure"}
        diagram:
          - s: "muévale saber de cierto"
            r: "main verb: let it move you to know for certain"
            under:
              - {s: "si esta consideración no le mueve a estarse quedo", r: "condition: if this thought does not make you keep still"}
              - s: "no hay ningún caballero andante"
                r: "what to know (after 'que'): there is no knight errant"
                under:
                  - {s: "entre todos los que allí están", r: "where: among all those who are there"}
                  - {s: "aunque parecen reyes, príncipes y emperadores", r: "concession: though they look like kings, princes and emperors"}
        forms:
          - {w: "esta", f: "est- + -a → este (this), feminine to match 'consideración'."}
          - {w: "le mueve", f: "muev- + -e → mover (to move), present, it (the thought). The stem o becomes ue when stressed: muevo, mueves, mueve, movemos, movéis, mueven. 'le' = you (vuesa merced); leísmo, 'le' for a male person as object."}
          - {w: "estarse quedo", f: "estar (to be) + se: 'estarse' = to stay, keep (oneself); 'quedo' is masculine singular to match the master."}
          - {w: "muévale", f: "muev- + -a + le → mover (to move), present subjunctive, it, with 'le' (you) stuck on the end: 'let it move you'. The stem o becomes ue when stressed: mueva, muevas, mueva, movamos, mováis, muevan. A subjunctive that opens its clause as a wish or command takes the pronoun on the end. Its subject is 'saber' (knowing)."}
          - {w: "están", f: "est- + -án → estar (to be), present, they. Irregular: estoy, estás, está, estamos, estáis, están."}
          - {w: "parecen", f: "parec- + -en → parecer (to seem, look like), present, they. parezco, pareces, parece, parecemos, parecéis, parecen."}
          - {w: "no hay ningún", f: "hay, 'there is', the impersonal form of haber (to have); Spanish keeps both negatives: 'no hay ningún' = there is not any. ningún = ninguno clipped before a masculine singular noun ('caballero')."}
  - sentences:
      - es: "— Ahora sí —dijo don Quijote— has dado, Sancho, en el punto que puede y debe mudarme de mi ya determinado intento."
        literal: "— Now yes —said Don Quijote— you-have hit, Sancho, on the point that can and must change-me from my already determined intent."
        ormsby: "“Now indeed thou hast hit the point, Sancho,” said Don Quixote, “which may and should turn me from the resolution I had already formed."
        vocab:
          - {w: "ahora sí", d: "now indeed, now you're talking"}
          - {w: "dar en el punto", d: "to hit the point, get it exactly right"}
          - {w: "mudar de", d: "to change, turn (someone) from (a purpose)"}
          - {w: "intento", d: "intention, purpose (false friend: not 'attempt')"}
          - {w: "determinado", d: "decided, resolved"}
        diagram:
          - s: "has dado"
            r: "main verb: you have hit"
            under:
              - {s: "Ahora sí", r: "when: now indeed"}
              - {s: "—dijo don Quijote—", r: "speaker tag: said Don Quijote"}
              - s: "en el punto"
                r: "on what: on the point"
                under:
                  - {s: "que puede y debe mudarme de mi ya determinado intento", r: "describes 'punto': which can and should turn me from my already settled purpose"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "has dado", f: "has → haber (to have), present, you (tú). Irregular: he, has, ha, hemos, habéis, han. + dado, participle of dar (to give): present perfect, 'you have hit'. 'dar en' = to hit upon."}
          - {w: "puede", f: "pued- + -e → poder (to be able), present, it (the point). The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "debe", f: "deb- + -e → deber (must, ought), present, it. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "mudarme", f: "mudar (to change) + me, the pronoun hung on the infinitive that depends on 'puede y debe'."}
          - {w: "determinado", f: "determin- + -ado → determinar (to decide), participle used as an adjective, masculine to match 'intento'."}
      - es: "Yo no puedo ni debo sacar la espada, como otras veces muchas te he dicho, contra quien no fuere armado caballero."
        literal: "I not can nor must draw the sword, as other times many to-you I-have said, against whom not may-be armed knight."
        ormsby: "I cannot and must not draw sword, as I have many a time before told thee, against anyone who is not a dubbed knight;"
        vocab:
          - {w: "sacar la espada", d: "to draw one's sword"}
          - {w: "otras veces muchas", d: "many other times (the adjective placed last for emphasis)"}
          - {w: "armado caballero", d: "dubbed knight, a man formally made a knight ('armar caballero' = to knight)"}
        diagram:
          - s: "Yo no puedo ni debo sacar la espada"
            r: "main verb: I cannot and must not draw my sword"
            under:
              - {s: "como otras veces muchas te he dicho", r: "aside: as I have told you many times"}
              - {s: "contra quien no fuere armado caballero", r: "against whom: against anyone who is not a dubbed knight"}
        forms:
          - {w: "puedo", f: "pued- + -o → poder (to be able), present, I. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "debo", f: "deb- + -o → deber (must, ought), present, I. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "te he dicho", f: "he → haber (to have), present, I. Irregular: he, has, ha, hemos, habéis, han. + dicho, the irregular participle of decir (to say): 'I have told you'. 'te' = to you."}
          - {w: "fuere", f: "fu- + -ere → ser (to be), future subjunctive, he: 'whoever may be'. Irregular: fuere, fueres, fuere, fuéremos, fuereis, fueren. Cervantes uses it after 'quien', 'si', 'donde' for an open future; modern Spanish uses the present subjunctive 'sea'."}
          - {w: "armado", f: "arm- + -ado → armar (to arm; 'armar caballero' = to dub a knight), participle, masculine singular."}
        note: "Don Quijote set out this rule in Part I after the beating by the Yanguesan carriers: a knight may not fight men who are not knights, so Sancho must defend himself against them. The rule now saves him from the actors' stones."
      - es: "A ti, Sancho, toca, si quieres tomar la venganza del agravio que a tu rucio se le ha hecho, que yo desde aquí te ayudaré con voces y advertimientos saludables."
        literal: "To you, Sancho, it-falls, if you-want to-take the vengeance of-the wrong that to your gray-donkey itself to-him has done, for I from here you I-will-help with shouts and warnings healthy."
        ormsby: "it is for thee, Sancho, if thou wilt, to take vengeance for the wrong done to thy Dapple; and I will help thee from here by shouts and salutary counsels.”"
        vocab:
          - {w: "tocar a", d: "to fall to, be someone's turn or duty: 'a ti toca' = it is up to you"}
          - {w: "agravio", d: "wrong, insult, injury"}
          - {w: "rucio", d: "grey donkey: Sancho's ass, 'Dapple' in Ormsby ('rucio' = silver-grey)"}
          - {w: "advertimiento", d: "(old) advice, warning; modern 'advertencia'"}
          - {w: "saludable", d: "salutary, beneficial, wholesome"}
        diagram:
          - s: "A ti, Sancho, toca"
            r: "main verb 1: it is up to you, Sancho"
            under:
              - s: "si quieres tomar la venganza del agravio"
                r: "condition: if you want to take revenge for the wrong"
                under:
                  - {s: "que a tu rucio se le ha hecho", r: "describes 'agravio': that has been done to your donkey"}
          - s: "que yo desde aquí te ayudaré"
            r: "main verb 2 (after 'que', for): for I will help you from here"
            under:
              - {s: "con voces y advertimientos saludables", r: "how: with shouts and sound advice"}
        forms:
          - {w: "toca", f: "toc- + -a → tocar (to fall to), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "quieres", f: "quier- + -es → querer (to want), present, you (tú). The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "del", f: "de + el: 'for the'."}
          - {w: "se le ha hecho", f: "ha → haber (to have), present, it. Irregular: he, has, ha, hemos, habéis, han. + hecho, the irregular participle of hacer (to do): 'has been done'. 'se' makes it passive; 'le' (to him) repeats 'a tu rucio'."}
          - {w: "ayudaré", f: "ayudar- + -é → ayudar (to help), future, I. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "saludables", f: "saludable (salutary) + -s, plural to match 'advertimientos'."}
  - sentences:
      - es: "— No hay para qué, señor —respondió Sancho—, tomar venganza de nadie, pues no es de buenos cristianos tomarla de los agravios;"
        literal: "— Not there-is for what, sir —answered Sancho—, to-take vengeance on nobody, since not it-is of good Christians to-take-it for the wrongs;"
        ormsby: "“There is no occasion to take vengeance on anyone, señor,” replied Sancho; “for it is not the part of good Christians to revenge wrongs;"
        vocab:
          - {w: "no hay para qué", d: "there is no need, no reason (to do something)"}
          - {w: "tomar venganza de", d: "to take revenge on (a person) or for (a wrong)"}
          - {w: "ser de", d: "to be the part of, befit: 'no es de buenos cristianos' = it is not what good Christians do"}
        diagram:
          - s: "No hay para qué"
            r: "main verb: there is no reason"
            under:
              - {s: "—respondió Sancho—", r: "speaker tag: answered Sancho"}
              - {s: "tomar venganza de nadie", r: "for what: to take revenge on anyone"}
              - {s: "pues no es de buenos cristianos tomarla de los agravios", r: "why: since it is not for good Christians to take it for wrongs"}
        forms:
          - {w: "hay", f: "the impersonal form of haber (to have), 'there is'. haber (to have) in the present: he, has, ha, hemos, habéis, han; when it means 'there is/are' the form is 'hay'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "de nadie", f: "'nadie' (nobody) after a 'no': Spanish keeps both negatives, so 'no ... de nadie' = on anyone."}
          - {w: "es", f: "es → ser (to be), present, it. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "buenos", f: "buen- + -os → bueno (good), masculine plural to match 'cristianos'."}
          - {w: "tomarla", f: "tomar (to take) + la (it), the pronoun hung on the infinitive; 'la' is feminine because it stands for 'venganza'."}
        note: "Sancho appeals to the Christian duty of forgiving injuries, which conveniently also spares him a fight with a troupe armed with stones."
      - es: "cuanto más, que yo acabaré con mi asno que ponga su ofensa en las manos de mi voluntad, la cual es de vivir pacíficamente los días que los cielos me dieren de vida."
        literal: "how-much more, that I will-get with my ass that he-may-put his offence in the hands of my will, the which is of living peacefully the days that the heavens to-me may-give of life."
        ormsby: "and besides, I will arrange it with my ass to leave his grievance to my goodwill and pleasure, and that is to live in peace as long as heaven grants me life.”"
        vocab:
          - {w: "cuanto más que", d: "all the more since, besides"}
          - {w: "acabar con alguien que", d: "to prevail on someone to, get someone to (do something)"}
          - {w: "asno", d: "ass, donkey"}
          - {w: "ofensa", d: "injury, grievance (the wrong done to him)"}
          - {w: "en las manos de mi voluntad", d: "at my discretion, as I choose"}
          - {w: "pacíficamente", d: "peacefully, in peace"}
          - {w: "los cielos", d: "heaven, Providence"}
        diagram:
          - s: "yo acabaré con mi asno"
            r: "main verb: I will get my ass"
            under:
              - {s: "cuanto más, que", r: "linking: besides, all the more since"}
              - s: "que ponga su ofensa en las manos de mi voluntad"
                r: "what: to put his grievance in the hands of my will"
                under:
                  - s: "la cual es de vivir pacíficamente los días"
                    r: "describes 'voluntad': which is to live peacefully all the days"
                    under:
                      - {s: "que los cielos me dieren de vida", r: "describes 'días': that heaven may give me to live"}
        forms:
          - {w: "acabaré", f: "acabar- + -é → acabar (to finish; 'acabar con' = to prevail on), future, I. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "ponga", f: "pong- + -a → poner (to put), present subjunctive, he (the ass). Irregular: ponga, pongas, ponga, pongamos, pongáis, pongan. Subjunctive because it is what Sancho will get the ass to do."}
          - {w: "la cual", f: "'which', feminine to match 'voluntad'; a heavier relative than 'que', used after a comma."}
          - {w: "es", f: "es → ser (to be), present, it. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "pacíficamente", f: "pacífic- + -a + -mente → pacífico (peaceful) turned into an adverb. -mente is added to the feminine form."}
          - {w: "dieren", f: "d- + -ieren → dar (to give), future subjunctive, they (the heavens): 'may give'. Built on the preterite dieron: diere, dieres, diere, diéremos, diereis, dieren. Modern Spanish uses the present subjunctive 'den'."}
