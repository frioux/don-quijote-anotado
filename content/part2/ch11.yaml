summary: |
  Don Quijote rides on, brooding over the enchanters' trick of turning Dulcinea into a village girl, so lost in thought that he lets Rocinante graze at every step. Sancho rouses him: sorrow is for men, not beasts, but too much of it turns men into beasts, and the devil take all the Dulcineas in the world. Don Quijote forbids him to blaspheme against the enchanted lady, and then corrects Sancho's description of her: eyes like pearls belong to a sea bream, so the pearls must be her teeth and her eyes green emeralds. Sancho worries how the giants and knights his master defeats will ever find Dulcinea in El Toboso; Don Quijote decides to test whether they can see her, and Sancho says that time is the best doctor.

  A cart crosses the road carrying Death with a human face, an angel, an emperor, Cupid, a knight in a plumed hat and others, driven by a devil. Don Quijote, sure that a new adventure has come, bars the way and demands to know who they are. The Devil answers calmly that they are players of Angulo el Malo's company, who have performed the religious play 'Las Cortes de la Muerte' that morning for the octave of Corpus Christi and are going on in costume to perform it in the next village. Don Quijote declares that appearances must be touched with the hand to undeceive oneself, wishes them well, and says he has loved the theatre since boyhood.

  A clown of the company, dressed in bells and waving three inflated ox-bladders on a stick, capers up and frightens Rocinante, who bolts and throws his master. While Sancho runs to help Don Quijote, the clown leaps onto Sancho's donkey and beats it across the fields with the bladders. Sancho chooses his master over his ass, though every blow on Dapple hurts him like death. The clown falls off in turn and goes on foot to the village, and the donkey comes back to Sancho.

  Don Quijote wants to punish the devil's rudeness on someone in the cart, even the emperor; Sancho warns him that actors are a favoured people whom nobody punishes. Don Quijote rides after the cart shouting, and the whole cast jumps down and forms a line armed with stones. Sancho points out that against a hail of stones there is no armour, and that there is not one knight errant among them; Don Quijote, who may not draw his sword against anyone not dubbed a knight, offers Sancho the revenge. Sancho, as a good Christian, forgives the wrong, so they leave the 'phantoms' alone, the players go on their way, and the narrator promises that the next day brings an adventure with an enamoured knight errant.
context: |
  Players on the road. In Cervantes' Spain the feast of Corpus Christi was the great occasion for the 'auto sacramental', a one-act religious allegory performed on carts in the streets, and travelling companies went on playing autos in towns and villages during the octave, the eight days after the feast. That is why Death, an angel, an emperor, a queen, Cupid, a soldier and a devil ride together in costume: they are the allegorical figures of an auto, and they do not change between performances. 'Las Cortes de la Muerte' (The Parliament of Death) was a real auto of the sixteenth century, in which Death holds court and hears the complaints of every estate of society. Ormsby identifies Angulo el Malo as a theatrical manager and dramatist of Toledo who flourished about 1580. The 'autor' of a company was its manager, not its author; unlike the English stage, the Spanish stage had actresses, usually married to men of the company, and here the queen is the manager's wife.

  The theatre and its people. Cervantes wrote plays himself and loved the stage, and Don Quijote's confession that from boyhood he was fond of 'la carátula' (the mask) and that his eyes followed 'la farándula' (a troupe of players) speaks for his author too. Sancho's speech on actors reflects their real position: socially despised, yet protected by patrons because they gave pleasure, and in his day the stage was regulated by licences, so that the companies 'reales y de título', licensed by the crown, enjoyed a special standing and dressed like princes. The clown who scares Rocinante is a stock figure of the Corpus processions, a 'moharracho' or mummer hung with bells who capered about and thumped the ground and the bystanders with inflated bladders; 'bojiganga', the word for his costume, was also the name of a small strolling troupe.

  Illusion and disillusion. The chapter turns on Dulcinea's enchantment in the previous one. Don Quijote, who saw the plain truth when Sancho showed him three peasant girls, now meets figures who really are Death, an emperor and a devil, but only as actors; and this time he takes them for what they are once they explain, saying that one must touch appearances with the hand to make way for 'desengaño', the undeceiving that Spanish moralists of the time preached as the end of all worldly show. The cart that looks to him like Charon's boat (Charon ferried the dead across the Styx in Greek myth) is a moving image of the world as a stage, and the Devil's boast that 'as I am a devil, I am up to everything' plays on the role and the man. Don Quijote's rule that he may not fight anyone who is not a dubbed knight, which he laid down in Part I after the beating by the Yanguesans, saves him once more, and Sancho turns it into an occasion for Christian forgiveness on behalf of his donkey.

  Sancho and Dapple. Sancho's love for his ass is one of the running threads of the book, and the narrator gives it mock-heroic weight here: Sancho chooses his master over his donkey 'like a good squire and good servant', though every blow of the bladders hurts him more than a blow on 'the apples of his own eyes'. Rocinante's bolting ends, as always, on the ground, 'the usual end of his liveliness'. Sancho's comic war counsel is full of slang: 'sopa de arroyo' (brook soup), which Ormsby glosses as a slang phrase for pebbles, and 'tente bonete' (hold on to your cap), meaning 'in plenty, to the utmost'.

  Reading Cervantes' Spanish. Old forms crowd the chapter: estraña (extraña), se estendió, estenderá (extender), encantamento (encantamiento), invidia (envidia), vido and vee (vio, ve) in Sancho's snatch of song, mesmo (mismo), escusar (excusar), mochacho (muchacho), escuros (oscuros), priesa (prisa), notomía (anatomía, skeleton), recebir (recibir), felice (feliz), dó (dónde), asaz (very, enough), sabidor (one who knows), and the contractions desto, destas, della. Pronouns hang on clause-opening verbs (Paréceme, estorbóselo, púsose, hémosle, Quítesele, muévale), and the old split 'hémosle de hacer' puts the pronoun between haber and its 'de'. The future subjunctive marks open futures (hubiere sucedido, pudiéremos, fuere armado caballero, los días que los cielos me dieren), 'haber de' means 'must, be going to', and 'si bien se encerrase' gives 'even if he were shut up'. Watch the false friends: además (excessively), reportarse (to restrain oneself), artificio (device), experiencia (test), autor (company manager), parecerse (to be visible), recitante (actor), and desengaño (disillusion, undeceiving).
