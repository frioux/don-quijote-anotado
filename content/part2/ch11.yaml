  - sentences:
      - es: "— Con todo eso —dijo don Quijote—, será bien castigar el descomedimiento de aquel demonio en alguno de los de la carreta, aunque sea el mesmo emperador."
        literal: "— With all that —said Don Quijote—, it-will-be well to-punish the discourtesy of that demon on some-one of those of the cart, even-though it-be the same emperor."
        ormsby: "“For all that,” said Don Quixote, “it will be well to visit the discourtesy of that devil upon some of those in the cart, even if it were the emperor himself.”"
        vocab:
          - {w: "con todo eso", d: "even so, for all that"}
          - {w: "será bien", d: "it will be right, it will be fitting"}
          - {w: "descomedimiento", d: "discourtesy, insolence"}
          - {w: "mesmo", d: "= mismo (old form); 'el mesmo emperador' = the emperor himself"}
        diagram:
          - s: "será bien"
            r: "main verb: it will be right"
            under:
              - {s: "Con todo eso", r: "linking: even so"}
              - s: "castigar el descomedimiento de aquel demonio"
                r: "subject: to punish that devil's insolence"
                under:
                  - {s: "en alguno de los de la carreta", r: "on whom: on one of those in the cart"}
                  - {s: "aunque sea el mesmo emperador", r: "concession: even if it is the emperor himself"}
          - {s: "dijo don Quijote", r: "speech verb and subject"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "será", f: "ser- + -á → ser (to be), future, it. The future adds endings to the whole infinitive: seré, serás, será, seremos, seréis, serán. Its subject is the infinitive 'castigar' (to punish)."}
          - {w: "aquel", f: "'that' (over there), masculine singular to match 'demonio'."}
          - {w: "alguno de los de", f: "alguno (some one), not clipped to 'algún' because no noun follows; 'los de la carreta' = those of the cart."}
          - {w: "sea", f: "ser (to be), present subjunctive, it: 'even if it be'. sea, seas, sea, seamos, seáis, sean. 'aunque' takes the subjunctive for a supposition."}
          - {w: "mesmo", f: "old form of mismo (same, very); after the article and before a noun, 'himself'."}
        note: "Don Quijote now knows these are actors, yet he speaks of the 'emperor' as though stage rank were real; punishing one of the company for another's offence is his idea of knightly justice."
  - sentences:
      - es: "— Quítesele a vuestra merced eso de la imaginación —replicó Sancho—, y tome mi consejo, que es que nunca se tome con farsantes, que es gente favorecida."
        literal: "— Let-remove-itself-from-him to your grace that from the imagination —replied Sancho—, and take my advice, which is that never yourself you-take-on with actors, for it-is people favoured."
        ormsby: "“Don’t think of it, your worship,” returned Sancho; “take my advice and never meddle with actors, for they are a favoured class;"
        vocab:
          - {w: "quitársele a uno algo de la imaginación", d: "to put something out of one's mind; 'quítesele' = let it be taken out of your head"}
          - {w: "vuestra merced", d: "'your grace', the polite 'you', taking the he/she form of the verb (modern 'usted')"}
          - {w: "tomarse con", d: "to pick a quarrel with, meddle with"}
          - {w: "farsante", d: "actor, player (from 'farsa', farce); later also 'humbug, fraud'"}
          - {w: "gente favorecida", d: "a favoured, protected class of people"}
        diagram:
          - s: "Quítesele a vuestra merced eso de la imaginación"
            r: "main verb 1: put that out of your mind"
          - {s: "replicó Sancho", r: "speech verb and subject"}
          - s: "y tome mi consejo"
            r: "main verb 2: and take my advice"
            under:
              - s: "que es"
                r: "describes 'consejo': which is"
                under:
                  - s: "que nunca se tome con farsantes"
                    r: "what the advice is: that you never pick a fight with actors"
                    under:
                      - {s: "que es gente favorecida", r: "why: for they are a favoured class"}
        forms:
          - {w: "Quítesele", f: "quit- + -e + se + le → quitar (to remove), present subjunctive, it, with 'se' (impersonal: let it be removed) and 'le' (from you) stuck on the end; modern 'que se le quite'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. A subjunctive that opens the sentence gives a wish or polite command, and the pronouns then hang on the end."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "tome", f: "tom- + -e → tomar (to take), present subjunctive, you (vuestra merced): a polite command, 'take'. Same -e subjunctive."}
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son. In 'que es gente' the verb is singular because 'gente' (people) is a singular noun."}
          - {w: "se tome", f: "tom- + -e → tomarse con (to pick a quarrel with), present subjunctive, you (vuestra merced), with 'se'. Same -e subjunctive, after 'que' in advice: 'that you never meddle'."}
          - {w: "favorecida", f: "favorec- + -ida → favorecer (to favour), participle used as an adjective, feminine to match 'gente'."}
