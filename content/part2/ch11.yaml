          - {w: "octava", d: "octave: the eighth day after a church feast, or the eight days of celebration that follow it"}
          - {w: "Corpus", d: "Corpus Christi, the feast of the Eucharist (late May or June), kept with processions and plays"}
          - {w: "auto", d: "auto sacramental: a one-act allegorical religious play, performed at Corpus Christi"}
          - {w: "Las Cortes de la Muerte", d: "'The Parliament of Death': 'Cortes' is the assembly of the realm; a play in which Death holds court and hears all estates of men"}
          - {w: "haber de", d: "to have to, be due to"}
          - {w: "parecerse", d: "here 'to be visible, show' (old sense), not 'to resemble'"}
