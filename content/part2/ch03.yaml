  - sentences:
      - es: "— Ahora digo —dijo don Quijote— que no ha sido sabio el autor de mi historia, sino algún ignorante hablador, que, a tiento y sin algún discurso, se puso a escribirla, salga lo que saliere, como hacía Orbaneja, el pintor de Úbeda, al cual preguntándole qué pintaba, respondió: «Lo que saliere»."
        literal: "— Now I-say —said Don Quijote— that not has been sage the author of my history, but some ignorant chatterer, who, by groping and without any reasoning, himself put to write-it, may-come-out what may-come-out, as used-to-do Orbaneja, the painter of Úbeda, to-the which asking-him what he-was-painting, he-answered: «What may-come-out»."
        ormsby: "“Then, I say,” said Don Quixote, “the author of my history was no sage, but some ignorant chatterer, who, in a haphazard and heedless way, set about writing it, let it turn out as it might, just as Orbaneja, the painter of Úbeda, used to do, who, when they asked him what he was painting, answered, ‘What it may turn out.’"
        vocab:
          - {w: "sabio", d: "sage, learned man; in the romances, the wise enchanter who writes a knight's history"}
          - {w: "hablador", d: "chatterer, babbler, windbag"}
          - {w: "a tiento", d: "by feel, groping, haphazardly"}
          - {w: "discurso", d: "false friend: reasoning, judgment (not 'speech')"}
          - {w: "ponerse a", d: "to set about, start to"}
          - {w: "salga lo que saliere", d: "set phrase: come what may, let it turn out however it turns out"}
          - {w: "Orbaneja", d: "a painter of Úbeda, proverbial for bad painting; whether he really lived is not known"}
          - {w: "Úbeda", d: "a town in the province of Jaén, Andalusia"}
        diagram:
          - s: "Ahora digo"
            r: "main verb: now I say"
            under:
              - {s: "dijo don Quijote", r: "aside: said Don Quijote"}
              - {s: "que no ha sido sabio el autor de mi historia", r: "what I say, 1: that the author of my history was no sage"}
              - s: "sino algún ignorante hablador"
                r: "what I say, 2: but some ignorant babbler"
                under:
                  - s: "que, a tiento y sin algún discurso, se puso a escribirla"
                    r: "describes 'hablador': who set about writing it blindly and without judgment"
                    under:
                      - {s: "salga lo que saliere", r: "how: come what may"}
                      - s: "como hacía Orbaneja, el pintor de Úbeda"
                        r: "how: as Orbaneja, the painter of Úbeda, used to do"
                        under:
                          - {s: "al cual preguntándole qué pintaba", r: "when: when they asked him what he was painting"}
                          - {s: "respondió: «Lo que saliere»", r: "describes Orbaneja: he answered, 'Whatever comes out'"}
        forms:
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "ha sido", f: "ha → haber (to have), present, he: he, has, ha, hemos, habéis, han; + sido, the participle of ser (to be): 'has been'. The subject 'el autor de mi historia' comes after the verb."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun ('ignorante', 'discurso'), like un, buen, ningún. In 'sin algún discurso' it means 'without any'."}
          - {w: "se puso a escribirla", f: "pus- + -o → ponerse (to set about), preterite, he: puse, pusiste, puso, pusimos, pusisteis, pusieron; + a + escribir (to write) with 'la' (it, the history) hung on the infinitive."}
          - {w: "salga", f: "salg- + -a → salir (to come out), present subjunctive, it. Irregular: salga, salgas, salga, salgamos, salgáis, salgan."}
          - {w: "saliere", f: "sal- + -iere → salir (to come out), future subjunctive, it: 'whatever may come out'. The future subjunctive of -er and -ir verbs: -iere, -ieres, -iere, -iéremos, -iereis, -ieren. Cervantes uses it for an open future after 'lo que'; modern Spanish says 'salga lo que salga'."}
          - {w: "hacía", f: "hac- + -ía → hacer (to do), imperfect, he: 'used to do'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "al cual", f: "a + el cual: 'to whom', masculine to match Orbaneja; it marks him as the one asked."}
          - {w: "preguntándole", f: "gerund of preguntar (to ask) + le (him), with an accent added to keep the stress: 'when [people] asked him'."}
          - {w: "pintaba", f: "pint- + -aba → pintar (to paint), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
