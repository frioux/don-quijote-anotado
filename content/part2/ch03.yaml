  - sentences:
      - es: "Era el bachiller, aunque se llamaba Sansón, no muy grande de cuerpo, aunque muy gran socarrón, de color macilenta, pero de muy buen entendimiento;"
        literal: "Was the bachelor, although himself he-called Samson, not very big of body, although very great sly-joker, of colour sallow, but of very good understanding;"
        ormsby: "The bachelor, though he was called Samson, was of no great bodily size, but he was a very great wag; he was of a sallow complexion, but very sharp-witted,"
        vocab:
          - {w: "Sansón", d: "Samson, the biblical strong man; the joke is that this Samson is small"}
          - {w: "socarrón", d: "sly joker, wag, someone who mocks with a straight face"}
          - {w: "color", d: "complexion; 'de color macilenta' = sallow-faced ('color' was often feminine in Cervantes' day)"}
          - {w: "macilento", d: "pale, sallow, wan"}
          - {w: "entendimiento", d: "understanding, intelligence, wit"}
        diagram:
          - s: "Era el bachiller"
            r: "main verb: the bachelor was"
            under:
              - {s: "aunque se llamaba Sansón", r: "concession: though he was called Samson"}
              - {s: "no muy grande de cuerpo", r: "what he was, 1: not very big in body"}
              - {s: "aunque muy gran socarrón", r: "what he was, 2: though a very great wag"}
              - {s: "de color macilenta", r: "what he was, 3: sallow-faced"}
              - {s: "pero de muy buen entendimiento", r: "what he was, 4: but very intelligent"}
        forms:
          - {w: "Era", f: "era → ser (to be), imperfect, he. Irregular: era, eras, era, éramos, erais, eran. The verb comes before its subject 'el bachiller'."}
          - {w: "se llamaba", f: "llam- + -aba → llamarse (to be called), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "gran", f: "grande clipped before a singular noun ('socarrón'): 'a great wag', where 'grande de cuerpo' keeps the full form after 'muy'."}
          - {w: "socarrón", f: "socarr- + -ón: the suffix -ón marks someone given to a habit (from 'socarrar', to scorch, singe)."}
          - {w: "macilenta", f: "macilent- + -a → macilento (sallow), feminine to match 'color', feminine here."}
          - {w: "buen", f: "bueno clipped before a masculine singular noun ('entendimiento')."}
      - es: "tendría hasta veinte y cuatro años, carirredondo, de nariz chata y de boca grande, señales todas de ser de condición maliciosa y amigo de donaires y de burlas, como lo mostró en viendo a don Quijote, poniéndose delante dél de rodillas, diciéndole:"
        literal: "he-would-have up-to twenty and four years, round-faced, of nose flat and of mouth big, signs all of being of nature mischievous and friend of witticisms and of jests, as it he-showed on seeing [to] Don Quijote, putting-himself before of-him on knees, saying-to-him:"
        ormsby: "somewhere about four-and-twenty years of age, with a round face, a flat nose, and a large mouth, all indications of a mischievous disposition and a love of fun and jokes; and of this he gave a sample as soon as he saw Don Quixote, by falling on his knees before him and saying,"
        vocab:
          - {w: "tendría", d: "here 'he must have been', a guess about age: the conditional for probability in the past"}
          - {w: "hasta", d: "here 'about, as many as'"}
          - {w: "carirredondo", d: "round-faced (cara + redondo)"}
          - {w: "chato", d: "flat, snub (of a nose)"}
          - {w: "condición", d: "nature, temperament (false friend: not 'condition')"}
          - {w: "malicioso", d: "mischievous, sly (milder than 'malicious')"}
          - {w: "donaire", d: "witticism, quip; also grace, charm"}
          - {w: "burla", d: "joke, jest, prank"}
          - {w: "en + gerund", d: "'en viendo' = as soon as he saw, on seeing"}
          - {w: "de rodillas", d: "on one's knees, kneeling"}
        diagram:
          - s: "tendría"
            r: "main verb: he would have been (in age)"
            under:
              - {s: "hasta veinte y cuatro años", r: "how old: about twenty-four"}
              - {s: "carirredondo, de nariz chata y de boca grande", r: "what he was like: round-faced, flat-nosed, big-mouthed"}
              - s: "señales todas"
                r: "describes those features: all signs"
                under:
                  - {s: "de ser de condición maliciosa y amigo de donaires y de burlas", r: "of what: of a mischievous nature and a love of quips and jokes"}
                  - s: "como lo mostró"
                    r: "how: as he showed it"
                    under:
                      - {s: "en viendo a don Quijote", r: "when: as soon as he saw Don Quijote"}
                      - {s: "poniéndose delante dél de rodillas", r: "how: kneeling in front of him"}
                      - {s: "diciéndole:", r: "how, 2: saying to him"}
        forms:
          - {w: "tendría", f: "tendr- + -ía → tener (to have), conditional, he: 'he would have', here a guess, 'he must have been'. Irregular stem tendr-: tendría, tendrías, tendría, tendríamos, tendríais, tendrían."}
          - {w: "carirredondo", f: "cari- (from cara, face) + redondo (round), one word; the r doubles to keep the trilled sound between vowels."}
          - {w: "chata", f: "chat- + -a → chato (flat), feminine to match 'nariz'."}
          - {w: "señales todas", f: "señal + -es, plural; todas, feminine plural to match 'señales', put after the noun: 'all signs'."}
          - {w: "maliciosa", f: "malicios- + -a → malicioso (mischievous), feminine to match 'condición'."}
          - {w: "mostró", f: "mostr- + -ó → mostrar (to show), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. 'lo' = it, his mischievous nature."}
          - {w: "en viendo", f: "en + gerund of ver (to see): 'on seeing, as soon as he saw', an old construction."}
          - {w: "poniéndose", f: "gerund of poner (to put) + se (himself), accent added: 'putting himself, kneeling'."}
          - {w: "dél", f: "= de él (of him), the old contraction: 'delante dél' = in front of him."}
          - {w: "diciéndole", f: "gerund of decir (to say) + le (to him), accent added: 'saying to him'."}
        note: "Cervantes likes to describe a character by the face before the deeds; the round face, snub nose and big mouth were read in the physiognomy of the time as signs of a joker."
  - sentences:
      - es: "— Déme vuestra grandeza las manos, señor don Quijote de la Mancha;"
        literal: "— May-give-me your greatness the hands, sir Don Quijote of La Mancha;"
        ormsby: "“Let me kiss your mightiness’s hand, Señor Don Quixote of La Mancha,"
        vocab:
          - {w: "dar las manos", d: "to give one's hands (to be kissed): the gesture of homage to a great lord"}
          - {w: "vuestra grandeza", d: "your greatness, your mightiness: a mock-royal title, far above the usual 'vuestra merced'"}
        diagram:
          - s: "Déme"
            r: "main verb: may (you) give me"
            under:
              - {s: "vuestra grandeza", r: "subject: your greatness"}
              - {s: "las manos", r: "object: your hands"}
              - {s: "señor don Quijote de la Mancha", r: "addressed to: Don Quijote"}
        forms:
          - {w: "Déme", f: "dé + me → dar (to give), present subjunctive used as a polite command, you (vuestra grandeza takes the 'he/she' form), with 'me' (to me) stuck on the end. dar in the present subjunctive: dé, des, dé, demos, deis, den. The pronoun hangs on the end of a command."}
          - {w: "vuestra", f: "vuestr- + -a → vuestro (your), feminine to match 'grandeza'; a title like 'vuestra merced' takes the verb in the 'he/she' form."}
        note: "Carrasco kneels and asks to kiss Don Quijote's hands as a vassal would a king's: the first of his mock-solemn jokes."
      - es: "que, por el hábito de San Pedro que visto, aunque no tengo otras órdenes que las cuatro primeras, que es vuestra merced uno de los más famosos caballeros andantes que ha habido, ni aun habrá, en toda la redondez de la tierra."
        literal: "for, by the habit of Saint Peter that I-wear, although not I-have other orders than the four first, that is your grace one of the most famous knights errant that there-has been, nor even there-will-be, in all the roundness of the earth."
        ormsby: "for, by the habit of St. Peter that I wear, though I have no more than the first four orders, your worship is one of the most famous knights-errant that have ever been, or will be, all the world over."
        vocab:
          - {w: "hábito de San Pedro", d: "the habit of St Peter: the clerical gown of a student in minor orders"}
          - {w: "vestir", d: "to wear (a garment)"}
          - {w: "órdenes", d: "holy orders; 'las cuatro primeras' = the four minor orders (porter, lector, exorcist, acolyte), taken by students who did not become priests"}
          - {w: "no ... otras ... que", d: "no other ... than, only"}
          - {w: "vuestra merced", d: "your grace, your worship: the polite 'you', origin of modern 'usted'"}
          - {w: "redondez de la tierra", d: "the round of the earth, the whole world"}
        diagram:
          - s: "que es vuestra merced uno de los más famosos caballeros andantes"
            r: "main verb (after 'que', for): your worship is one of the most famous knights-errant"
            under:
              - {s: "por el hábito de San Pedro que visto", r: "oath: by the habit of St Peter that I wear"}
              - {s: "aunque no tengo otras órdenes que las cuatro primeras", r: "concession: though I have only the four minor orders"}
              - {s: "que ha habido, ni aun habrá", r: "describes 'caballeros': that have ever been, or even will be"}
              - {s: "en toda la redondez de la tierra", r: "where: in the whole round world"}
        forms:
          - {w: "visto", f: "vist- + -o → vestir (to wear), present, I: 'I wear' (not the participle of ver). The e of the stem becomes i when stressed: visto, vistes, viste, vestimos, vestís, visten."}
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "las cuatro primeras", f: "primer- + -as → primero (first), feminine plural to match 'órdenes'."}
          - {w: "que, ... que es", f: "the first 'que' means 'for'; the second repeats it after the long oath, as Spanish speech often does."}
          - {w: "es", f: "es → ser (to be), present, you (vuestra merced takes the 'he/she' form). soy, eres, es, somos, sois, son."}
          - {w: "ha habido", f: "ha → haber (to have), present, + habido, participle of haber (here: to exist): 'there have been'. haber in the present: he, has, ha, hemos, habéis, han; impersonal 'there is' uses 'hay', but the perfect is 'ha habido'."}
          - {w: "habrá", f: "habr- + -á → haber (here: to exist), future, it: 'there will be'. haber in the future: habré, habrás, habrá, habremos, habréis, habrán."}
        note: "Carrasco is a bachelor of Salamanca, and university students wore a clerical gown and often took the minor orders, which did not bind them to the priesthood. Swearing by his gown is mock-solemn."
      - es: "Bien haya Cide Hamete Benengeli, que la historia de vuestras grandezas dejó escritas, y rebién haya el curioso que tuvo cuidado de hacerlas traducir de arábigo en nuestro vulgar castellano, para universal entretenimiento de las gentes."
        literal: "Well may-have Cide Hamete Benengeli, who the history of your greatnesses left written, and re-well may-have the curious-one who took care to make-them translate from Arabic into our vulgar Castilian, for universal entertainment of the peoples."
        ormsby: "A blessing on Cide Hamete Benengeli, who has written the history of your great deeds, and a double blessing on that connoisseur who took the trouble of having it translated out of the Arabic into our Castilian vulgar tongue for the universal entertainment of the people!”"
        vocab:
