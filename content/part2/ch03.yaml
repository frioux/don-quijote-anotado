          - {w: "la había guardado", f: "hab- + -ía → haber (to have), imperfect, he, + guardado, participle of guardar (to keep): pluperfect, 'had kept'. haber in the imperfect: había, habías, había, habíamos, habíais, habían. 'la' = to her, Dulcinea: the feminine 'la' used for an indirect object (laísmo), where standard Spanish has 'le'."}
