        vocab:
          - {w: "reprochador", d: "fault-finder, one who reproaches (from 'reprochar' + -dor)"}
          - {w: "voquibles", d: "Sancho's form of 'vocablos' (words); his master also corrects his words, hence 'another'"}
        diagram:
          - s: "¿Otro reprochador de voquibles tenemos?"
            r: "main verb: do we have another word-corrector?"
          - {s: "dijo Sancho", r: "speech verb (aside): said Sancho"}
        forms:
