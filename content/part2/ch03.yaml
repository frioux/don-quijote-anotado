          - {w: "el día de hoy", d: "today, at the present day"}
          - {w: "libros", d: "here 'copies' of the book"}
          - {w: "la tal historia", d: "the said history, this history"}
        diagram:
          - s: "Es tan verdad"
            r: "main verb: it is so true"
