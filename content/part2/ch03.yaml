          - {w: "se le quedó", f: "qued- + -ó → quedarse (to remain), preterite, it, with 'se' and 'le' (to him, the sage). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. 'le' is doubled by 'al sabio'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "todo lo dice, todo lo apunta", f: "dic- + -e → decir (to say), present, he: digo, dices, dice, decimos, decís, dicen; apunt- + -a → apuntar (to note down), present, he: -o, -as, -a, -amos, -áis, -an. 'lo' repeats 'todo', as Spanish does when the object comes before the verb."}
