            r: "main verb: there is no human history in the world"
            under:
              - {s: "A lo que yo imagino", r: "hedge: as far as I can tell"}
              - {s: "que no tenga sus altibajos", r: "describes 'historia': that does not have its ups and downs"}
              - s: "especialmente las"
                r: "especially: especially those (histories)"
