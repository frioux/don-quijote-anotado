              - {s: "Sancho", r: "addressed to"}
          - {s: "respondió don Quijote", r: "speech verb (aside): Don Quijote answered"}
          - s: "no os falta memoria"
            r: "main verb 2: you do not lack memory"
            under:
              - {s: "A fee que", r: "oath: in faith"}
              - {s: "cuando vos queréis tenerla", r: "when: when you want to have it"}
