        vocab:
          - {w: "quedarse en el tintero", d: "idiom: to be left in the inkwell, i.e. left unsaid; 'no se le quedó nada en el tintero' = he left nothing out"}
          - {w: "sabio", d: "sage, learned man; in the romances, the wizard-chronicler who records a knight's deeds"}
          - {w: "apuntar", d: "to note down, jot down"}
          - {w: "cabriola", d: "caper, leap in the air"}
          - {w: "manta", d: "blanket: Sancho was tossed in a blanket at the inn (Part I chapter 17)"}
