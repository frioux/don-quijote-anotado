          - s: "Dígame"
            r: "main verb 1: tell me"
            under:
              - {s: "señor bachiller", r: "addressed to: the bachelor"}
          - s: "dijo"
            r: "speech verb (aside): said"
            under:
              - {s: "a esta sazón", r: "when: at this moment"}
              - {s: "Sancho", r: "subject"}
          - s: "¿entra ahí"
            r: "main verb 2: does it come in there"
            under:
              - {s: "la aventura de los yangüeses", r: "subject: the Yanguesans adventure"}
              - s: "cuando ... se le antojó"
                r: "when: when it took his fancy"
                under:
                  - {s: "a nuestro buen Rocinante", r: "to whom: to our good Rocinante"}
                  - {s: "pedir cotufas en el golfo", r: "what took his fancy: to ask for dainties in the open sea"}
        forms:
          - {w: "Dígame", f: "dig- + -a + me → decir (to say), present subjunctive used as a polite command, you (vuestra merced), with 'me' (to me) stuck on the end; accent added. decir in the present subjunctive: diga, digas, diga, digamos, digáis, digan."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "entra", f: "entr- + -a → entrar (to enter, come in), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
