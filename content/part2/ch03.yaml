          - {w: "no hay para qué", d: "there is no reason to, there is no need to"}
          - {w: "redundar en", d: "to result in, tend to"}
          - {w: "menosprecio", d: "contempt, scorn, discredit"}
          - {w: "el señor de la historia", d: "the hero of the story, its subject"}
