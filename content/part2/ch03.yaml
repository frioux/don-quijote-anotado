          - {w: "cuentas ni cuentos", d: "accounts nor stories: a jingle ('cuenta' = reckoning, 'cuento' = tale); he will neither settle accounts nor tell stories"}
          - {w: "desmayo de estómago", d: "a faintness of the stomach, a sinking feeling from hunger"}
          - {w: "reparar", d: "to repair, set right, restore"}
          - {w: "trago", d: "a swig, a gulp (of drink)"}
          - {w: "lo añejo", d: "the old stuff, i.e. old wine ('añejo' = aged)"}
          - {w: "poner en la espina de Santa Lucía", d: "a slang phrase: to reduce to skin and bone, leave faint with hunger ('espina' = spine, thorn)"}
