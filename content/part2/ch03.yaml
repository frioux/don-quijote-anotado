              - {s: "a todos los caballeros andantes", r: "from whom: from all the knights-errant"}
        forms:
          - {w: "buena fama, buen nombre", f: "buen- + -a → bueno (good), feminine to match 'fama'; buen = bueno clipped before a masculine singular noun ('nombre')."}
          - {w: "va", f: "va → ir (to go), present, it. Irregular: voy, vas, va, vamos, vais, van."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "lleva", f: "llev- + -a → llevar (to carry), present, you (vuestra merced takes the 'he/she' form). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
      - es: "porque el moro en su lengua y el cristiano en la suya tuvieron cuidado de pintarnos muy al vivo la gallardía de vuestra merced, el ánimo grande en acometer los peligros, la paciencia en las adversidades y el sufrimiento, así en las desgracias como en las heridas, la honestidad y continencia en los amores tan platónicos de vuestra merced y de mi señora doña Dulcinea del Toboso."
        literal: "because the Moor in his language and the Christian in the his took care to paint-for-us very to-the life the gallantry of your grace, the spirit great in attacking the dangers, the patience in the adversities and the endurance, as-well in the misfortunes as in the wounds, the chastity and continence in the loves so platonic of your grace and of my lady doña Dulcinea del Toboso."
        ormsby: "for the Moor in his own language, and the Christian in his, have taken care to set before us your gallantry, your high courage in encountering dangers, your fortitude in adversity, your patience under misfortunes as well as wounds, the purity and continence of the platonic loves of your worship and my lady Doña Dulcinea del Toboso—”"
        vocab:
          - {w: "el cristiano", d: "the Christian: the translator who put the Moor's Arabic into Spanish"}
          - {w: "pintar al vivo", d: "to paint to the life, depict vividly"}
          - {w: "gallardía", d: "gallantry, dash, fine bearing"}
          - {w: "ánimo", d: "courage, spirit"}
          - {w: "acometer", d: "to attack, take on, undertake"}
          - {w: "sufrimiento", d: "endurance, fortitude (the power to bear), not only 'suffering'"}
          - {w: "así ... como", d: "both ... and, as much ... as"}
          - {w: "desgracias", d: "misfortunes (false friend: not 'disgraces')"}
          - {w: "honestidad", d: "chastity, purity (false friend: not 'honesty')"}
          - {w: "continencia", d: "continence, sexual restraint"}
          - {w: "platónico", d: "platonic, unconsummated, pure"}
        diagram:
          - s: "tuvieron cuidado"
            r: "main verb (after 'porque', because): they took care"
            under:
              - {s: "el moro en su lengua y el cristiano en la suya", r: "subject: the Moor in his tongue and the Christian in his"}
              - s: "de pintarnos muy al vivo"
                r: "to do what: to paint for us to the life"
                under:
                  - {s: "la gallardía de vuestra merced", r: "object, 1: your gallantry"}
                  - {s: "el ánimo grande en acometer los peligros", r: "object, 2: your great courage in facing dangers"}
                  - {s: "la paciencia en las adversidades y el sufrimiento", r: "object, 3: your patience in adversity and endurance"}
                  - {s: "así en las desgracias como en las heridas", r: "describes 'sufrimiento': in misfortunes as in wounds"}
                  - s: "la honestidad y continencia en los amores tan platónicos"
                    r: "object, 4: the purity and restraint of the so platonic loves"
                    under:
                      - {s: "de vuestra merced y de mi señora doña Dulcinea del Toboso", r: "whose loves: yours and my lady Doña Dulcinea's"}
        forms:
          - {w: "la suya", f: "suy- + -a → suyo (his), feminine to match the unspoken 'lengua': 'in his own'."}
          - {w: "tuvieron", f: "tuv- + -ieron → tener (to have), preterite, they: 'tener cuidado de' = to take care to. Irregular: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron."}
          - {w: "pintarnos", f: "pintar (to paint) + nos (for us), the pronoun hung on the infinitive after 'de'."}
          - {w: "al vivo", f: "a + el = al, + vivo (living): 'to the life'."}
          - {w: "acometer", f: "acometer (to attack, take on), infinitive after 'en': 'in facing'."}
          - {w: "platónicos", f: "platónic- + -os → platónico (platonic), masculine plural to match 'amores'."}
          - {w: "doña", f: "the feminine of 'don', a title of rank placed before the first name."}
        note: "Carrasco pointedly gives Dulcinea the title 'doña', which a peasant girl from El Toboso had no right to; the 'platonic' love is a sly jab, since the knight has never met her. Sancho catches the 'doña' at once."
  - sentences:
