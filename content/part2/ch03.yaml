          - {w: "prósperos", f: "próspero (prosperous, happy), masculine plural to match 'sucesos', placed before the noun."}
  - sentences:
      - es: "— Con todo eso —respondió el bachiller—, dicen algunos que han leído la historia que se holgaran se les hubiera olvidado a los autores della algunos de los infinitos palos que en diferentes encuentros dieron al señor don Quijote."
        literal: "— With all that —answered the bachelor—, say some who have read the history that themselves they-would-have-rejoiced [that] itself to-them had forgotten to the authors of-it some of the infinite blows that in different encounters they-gave to-the lord Don Quijote."
        ormsby: "“For all that,” replied the bachelor, “there are those who have read the history who say they would have been glad if the author had left out some of the countless cudgellings that were inflicted on Señor Don Quixote in various encounters.”"
        vocab:
          - {w: "con todo eso", d: "for all that, nevertheless"}
          - {w: "holgarse", d: "to be glad, take pleasure (literary); 'se holgaran' = they would have been glad"}
          - {w: "olvidársele algo a alguien", d: "to slip someone's mind: 'se les hubiera olvidado a los autores' = the authors had forgotten"}
          - {w: "della", d: "= de ella, of it (old contraction)"}
          - {w: "palos", d: "blows with a stick, beatings, cudgellings"}
          - {w: "encuentro", d: "encounter, clash, fight (not only a meeting)"}
        diagram:
          - s: "dicen algunos"
            r: "main verb: some say"
            under:
              - {s: "Con todo eso", r: "linking: for all that"}
              - {s: "que han leído la historia", r: "describes 'algunos': who have read the history"}
              - s: "que se holgaran"
                r: "what they say: that they would have been glad"
                under:
                  - s: "se les hubiera olvidado a los autores della algunos de los infinitos palos"
                    r: "what would please them: if the authors had forgotten some of the countless beatings"
                    under:
                      - {s: "que en diferentes encuentros dieron al señor don Quijote", r: "describes 'palos': which they gave Don Quijote in various fights"}
          - {s: "respondió el bachiller", r: "speech verb (aside): the bachelor answered"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "dicen", f: "dic- + -en → decir (to say), present, they. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "han leído", f: "h- + -an → haber (to have), present, they: he, has, ha, hemos, habéis, han; + leído, participle of leer (to read): the present perfect, 'they have read'."}
          - {w: "se holgaran", f: "holg- + -aran → holgarse (to be glad), imperfect subjunctive (-ra form), they, used as a conditional: 'they would have been glad'. The -ra imperfect subjunctive of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran."}
          - {w: "se les hubiera olvidado", f: "hub- + -iera → haber (to have), imperfect subjunctive (-ra form), it: hubiera, hubieras, hubiera, hubiéramos, hubierais, hubieran; + olvidado, participle of olvidar (to forget): pluperfect subjunctive, 'had slipped their minds'. 'se les' + 'a los autores': the thing forgotten is the subject. Cervantes leaves out the 'que' after 'se holgaran'."}
