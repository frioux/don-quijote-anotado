  - sentences:
      - es: "— Yo, señor Sansón, no estoy ahora para ponerme en cuentas ni cuentos; que me ha tomado un desmayo de estómago, que si no le reparo con dos tragos de lo añejo, me pondrá en la espina de Santa Lucía."
        literal: "— I, sir Sansón, not am now for to-put-myself into accounts nor tales; for me has taken a faintness of stomach, which if not it I-repair with two swigs of the old, me will-put on the spine of Saint Lucy."
        ormsby: "“Señor Samson, I am not in a humour now for going into accounts or explanations,” said Sancho; “for there’s a sinking of the stomach come over me, and unless I doctor it with a couple of sups of the old stuff it will put me on the thorn of Santa Lucia."
        vocab:
