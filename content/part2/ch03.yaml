  - sentences:
      - es: "— Dígame, señor bachiller —dijo a esta sazón Sancho—: ¿entra ahí la aventura de los yangüeses, cuando a nuestro buen Rocinante se le antojó pedir cotufas en el golfo?"
        literal: "— Tell-me, sir bachelor —said at this moment Sancho—: enters there the adventure of the Yanguesans, when to our good Rocinante to-himself to-him it-took-the-fancy to-ask-for tidbits in the gulf?"
