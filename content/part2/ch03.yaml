          - {w: "le reparo", f: "repar- + -o → reparar (to repair), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. 'le' = it (the faintness), leísmo: Cervantes often uses 'le' for a masculine thing where modern Spanish wants 'lo'."}
