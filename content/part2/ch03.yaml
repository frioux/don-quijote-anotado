  - sentences:
      - es: "— En la manta no hice yo cabriolas —respondió Sancho—; en el aire sí, y aun más de las que yo quisiera."
        literal: "— In the blanket not made I capers —answered Sancho—; in the air yes, and even more than those that I would-have-wished."
        ormsby: "“I cut no capers in the blanket,” returned Sancho; “in the air I did, and more of them than I liked.”"
        vocab:
          - {w: "aun", d: "even (without accent); 'aún' with accent means 'still, yet'"}
          - {w: "más de las que", d: "more than those which (de, not que, before a clause of quantity)"}
        diagram:
          - s: "En la manta no hice yo cabriolas"
            r: "main verb 1: I cut no capers in the blanket"
          - {s: "respondió Sancho", r: "speech verb (aside): Sancho answered"}
          - s: "en el aire sí"
            r: "main clause 2, verb 'hice' understood: in the air, yes (I did)"
            under:
              - s: "y aun más de las"
                r: "how many: and even more than those"
                under:
                  - {s: "que yo quisiera", r: "describes 'las': that I would have liked"}
        forms:
          - {w: "hice", f: "hic- + -e → hacer (to make, do), preterite, I. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron. 'hacer cabriolas' = to cut capers."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "quisiera", f: "quis- + -iera → querer (to want), imperfect subjunctive (-ra form), I, used as a conditional: 'I would have wanted'. Built on the preterite quisieron: quisiera, quisieras, quisiera, quisiéramos, quisierais, quisieran."}
          - {w: "las", f: "las = 'those', feminine plural to stand for 'cabriolas'."}
        note: "Sancho's quibble is exact: he was tossed up into the air from the blanket, so the capers happened in the air, not in it. Unlike his master, he does not mind being comic as long as the facts are right."
  - sentences:
      - es: "— A lo que yo imagino —dijo don Quijote—, no hay historia humana en el mundo que no tenga sus altibajos, especialmente las que tratan de caballerías, las cuales nunca pueden estar llenas de prósperos sucesos."
        literal: "— To what I imagine —said Don Quijote—, not there-is history human in the world that not may-have its ups-and-downs, especially those that treat of chivalries, the which never can be full of prosperous events."
        ormsby: "“There is no human history in the world, I suppose,” said Don Quixote, “that has not its ups and downs, but more than others such as deal with chivalry, for they can never be entirely made up of prosperous adventures.”"
        vocab:
          - {w: "a lo que yo imagino", d: "as far as I can tell, to my mind"}
          - {w: "altibajos", d: "ups and downs (alto + bajo)"}
          - {w: "tratar de", d: "to deal with, be about"}
          - {w: "caballerías", d: "deeds of chivalry; 'libros de caballerías' = romances of chivalry"}
          - {w: "suceso", d: "event, happening, outcome (false friend: not 'success'); 'prósperos sucesos' = happy outcomes"}
        diagram:
