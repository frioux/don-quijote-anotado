        ormsby_note: "This passage has somewhat puzzled those who were unaware of the difference in text between the first and the subsequent editions. Cervantes is here speaking of the first edition, in which (as has been already pointed out, Part I Chapter XXIII) no account of the theft of the ass is given. From this we gather that Cervantes himself had nothing to do with the attempt made in the second edition to rectify the blunder, for had it been his own work he certainly would not have ignored it as he does here."
        note: "In the first edition of Part I, Sancho's grey vanishes in the Sierra Morena with no account of the theft, and later Sancho is riding it again. Cervantes turns his own slip into a complaint by his readers, which Sancho will be asked to answer."
