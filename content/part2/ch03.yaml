        literal: "and some have put fault and fraud in the memory of-the author, since himself to-him forgets of to-tell who was the thief who stole the grey to Sancho, which there not itself declares, and only itself infers from that written that from-him they-stole-it, and from there to little him we-see on horse upon the same donkey, without having turned-up."
