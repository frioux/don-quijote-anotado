  - sentences:
      - es: "— Ésos no son gobernadores de ínsulas —replicó Sansón—, sino de otros gobiernos más manuales; que los que gobiernan ínsulas, por lo menos han de saber gramática."
        literal: "— Those not are governors of isles —replied Sansón—, but of other governments more manageable; for those who govern isles, at the least have to know grammar."
        ormsby: "“Those are not governors of islands,” observed Samson, “but of other governments of an easier kind: those that govern islands must at least know grammar.”"
        vocab:
          - {w: "ínsula", d: "isle: the bookish word of the romances of chivalry, beside everyday 'isla'"}
          - {w: "replicar", d: "to reply, retort (not 'replicate')"}
          - {w: "manual", d: "easy, manageable, handy: posts anyone can run"}
          - {w: "haber de", d: "to have to, must"}
          - {w: "gramática", d: "grammar, which in the schools meant Latin grammar, the first step of all learning"}
        diagram:
          - s: "Ésos no son gobernadores de ínsulas"
            r: "main verb 1: those are not governors of isles"
            under:
              - {s: "replicó Sansón", r: "aside: replied Sansón"}
              - {s: "sino de otros gobiernos más manuales", r: "but: of other, easier governments"}
          - s: "han de saber gramática"
            r: "main verb 2 (after 'que', for): must know grammar"
            under:
              - {s: "los que gobiernan ínsulas", r: "subject: those who govern isles"}
              - {s: "por lo menos", r: "how much: at least"}
        forms:
          - {w: "Ésos", f: "ese (that) as a pronoun, masculine plural to match the governors; the accent marked the pronoun in older spelling."}
          - {w: "son", f: "son → ser (to be), present, they. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (repliqué, with c → qu before e)."}
          - {w: "gobiernan", f: "gobiern- + -an → gobernar (to govern), present, they. The stem e becomes ie when stressed: gobierno, gobiernas, gobierna, gobernamos, gobernáis, gobiernan."}
          - {w: "los que", f: "'those who', masculine plural: the article stands for the people."}
          - {w: "han de saber", f: "han → haber (to have), present, they: he, has, ha, hemos, habéis, han; + de + saber (to know): 'have to know, must know'."}
        note: "Grammar here means Latin: a governor was expected to be a lettered man. Sansón is teasing Sancho, an unlettered peasant, by setting a standard he cannot meet."
  - sentences:
      - es: "— Con la grama bien me avendría yo —dijo Sancho—, pero con la tica, ni me tiro ni me pago, porque no la entiendo."
        literal: "— With the gram well myself I-would-get-along I —said Sancho—, but with the tica, neither myself I-throw nor myself I-please, because not it I-understand."
        ormsby: "“I could manage the gram well enough,” said Sancho; “but for the mar I have neither leaning nor liking, for I don’t know what it is;"
        ormsby_note: "In the original, Grama-tica, grama being an instrument for dressing flax, and therefore quite within Sancho's comprehension."
        vocab:
          - {w: "grama ... tica", d: "Sancho splits 'gramática' in two: 'grama' is a known word (a flax-breaking tool, also a kind of grass), 'tica' means nothing to him"}
          - {w: "avenirse con", d: "to get on with, come to terms with"}
          - {w: "ni me tiro ni me pago", d: "idiom: I have nothing to do with it, I neither care for it nor against it (Ormsby: 'neither leaning nor liking'); 'pagarse de' = to be pleased with"}
        diagram:
          - s: "Con la grama bien me avendría yo"
            r: "main verb 1: with the 'gram' I would get on well"
            under:
              - {s: "dijo Sancho", r: "aside: said Sancho"}
          - s: "ni me tiro ni me pago"
            r: "main verb 2 (after 'pero'): I neither lean to it nor like it"
            under:
              - {s: "con la tica", r: "with what: with the 'tica'"}
              - {s: "porque no la entiendo", r: "why: because I don't understand it"}
        forms:
          - {w: "avendría", f: "avendr- + -ía → avenirse (to get along), conditional, I: 'I would get on'. Built like venir (to come), with the stem avendr-: avendría, avendrías, avendría, avendríamos, avendríais, avendrían."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "me tiro, me pago", f: "tir- + -o → tirarse (to throw oneself, lean) and pag- + -o → pagarse (to be pleased), present, I, each with 'me' (myself). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "no la entiendo", f: "entiend- + -o → entender (to understand), present, I. The stem e becomes ie when stressed: entiendo, entiendes, entiende, entendemos, entendéis, entienden. 'la' = it, the 'tica'."}
        note: "A pun Ormsby can only half render: Sancho hears 'gramática' as 'grama' (a tool for breaking flax, which a peasant knows) plus 'tica', which is nonsense to him."
      - es: "Pero, dejando esto del gobierno en las manos de Dios, que me eche a las partes donde más de mí se sirva, digo, señor bachiller Sansón Carrasco, que infinitamente me ha dado gusto que el autor de la historia haya hablado de mí de manera que no enfadan las cosas que de mí se cuentan;"
