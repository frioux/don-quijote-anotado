              - {s: "en el tintero", r: "where: in the inkwell"}
          - {s: "respondió Sansón", r: "speech verb (aside): Samson answered"}
          - {s: "todo lo dice", r: "main verb 2: he tells everything"}
          - s: "y todo lo apunta"
            r: "main verb 3: and notes everything down"
            under:
