  - sentences:
      - es: "— Si por buena fama y si por buen nombre va —dijo el bachiller—, solo vuestra merced lleva la palma a todos los caballeros andantes;"
        literal: "— If by good fame and if by good name it-goes —said the bachelor—, alone your grace carries the palm from all the knights errant;"
        ormsby: "“If it goes by good name and fame,” said the bachelor, “your worship alone bears away the palm from all the knights-errant;"
        vocab:
          - {w: "si por ... va", d: "if it is a matter of, if it comes down to"}
          - {w: "fama", d: "fame, reputation"}
