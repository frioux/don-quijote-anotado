                  - {s: "andar con buen nombre por las lenguas de las gentes", r: "what he sees himself do: go about with a good name on people's tongues"}
                  - {s: "impreso y en estampa", r: "how: printed and in print"}
        forms:
          - {w: "Una", f: "un- + -a → uno (one), feminine to match 'cosas'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "esta", f: "est- + -a → este (this), feminine to match 'sazón'."}
          - {w: "debe de dar", f: "deb- + -e → deber (must), present, it: debo, debes, debe, debemos, debéis, deben; + de + dar (to give): 'must give'."}
          - {w: "es", f: "es → ser (to be), present, it. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "verse", f: "ver (to see) + se (himself), the infinitive used as the predicate: 'to see himself'."}
          - {w: "viviendo", f: "viv- + -iendo → gerund of vivir (to live): 'while living, in his lifetime'."}
          - {w: "andar", f: "andar (to go about), infinitive after 'verse': 'to see himself go about'."}
