          - {s: "dijo Sancho", r: "speech verb (aside): said Sancho"}
        forms:
          - {w: "quisiese", f: "quis- + -iese → querer (to want), imperfect subjunctive (-se form), I: 'if I wanted'. Built on the preterite quisieron: quisiese, quisieses, quisiese, quisiésemos, quisieseis, quisiesen."}
