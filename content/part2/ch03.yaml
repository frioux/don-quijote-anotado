          - {w: "si no, dígalo", d: "if not, let [X] say so: a formula meaning 'just ask X', calling a witness"}
        diagram:
          - s: "dígalo"
            r: "main verb: let them say it"
            under:
              - {s: "si no", r: "condition: if you doubt it"}
              - s: "Portugal, Barcelona y Valencia"
                r: "subject: the witnesses"
                under:
                  - {s: "donde se han impreso", r: "describes the places: where they have been printed"}
        forms:
          - {w: "dígalo", f: "dig- + -a + lo → decir (to say), present subjunctive, it (each place), as a command, with 'lo' (it) stuck on the end: 'let [it] say so'. decir in the present subjunctive: diga, digas, diga, digamos, digáis, digan. The singular verb agrees with the nearest subject."}
          - {w: "se han impreso", f: "han → haber (to have), present, they: he, has, ha, hemos, habéis, han; + impreso, irregular participle of imprimir (to print), with 'se' making it passive: 'have been printed'."}
        note: "Ormsby's note on the next sentence corrects Carrasco: there was no Barcelona edition in Cervantes' lifetime. The Lisbon editions account for 'Portugal'."
      - es: "y aun hay fama que se está imprimiendo en Amberes, y a mí se me trasluce que no ha de haber nación ni lengua donde no se traduzga."
        literal: "and even there-is report that itself is printing in Antwerp, and to me itself to-me shows-through that not there-has to be nation nor language where not itself it-may-translate."
        ormsby: "and moreover there is a report that it is being printed at Antwerp, and I am persuaded there will not be a country or language in which there will not be a translation of it.”"
        ormsby_note: "No edition appeared at Barcelona in the lifetime of Cervantes, and no edition of the First Part by itself was ever printed at Antwerp. On the other hand, there were two editions at Brussels and one at Milan, of which Cervantes does not seem to have been aware when he wrote this."
        vocab:
          - {w: "hay fama que", d: "there is a report that, rumour has it that"}
          - {w: "Amberes", d: "Antwerp, in the Spanish Netherlands, a great printing centre"}
          - {w: "traslucirse", d: "to show through, be guessed at: 'se me trasluce' = I have an inkling, I foresee"}
          - {w: "haber de", d: "to be going to, must: 'no ha de haber' = there will be no"}
          - {w: "traduzga", d: "= traduzca (old form), may be translated"}
        diagram:
          - s: "y aun hay fama"
            r: "main verb 1: and there is even a report"
            under:
              - {s: "que se está imprimiendo en Amberes", r: "what is reported: that it is being printed in Antwerp"}
          - s: "y a mí se me trasluce"
            r: "main verb 2: and I foresee"
            under:
              - s: "que no ha de haber nación ni lengua"
                r: "what I foresee: that there will be no nation or language"
                under:
                  - {s: "donde no se traduzga", r: "describes 'nación ni lengua': where it is not translated"}
        forms:
          - {w: "hay", f: "hay → haber (to have), the impersonal present 'there is'."}
          - {w: "se está imprimiendo", f: "est- + -á → estar (to be), present, it: estoy, estás, está, estamos, estáis, están; + imprimiendo, gerund of imprimir (to print); 'se' makes it passive: 'it is being printed'."}
          - {w: "a mí se me trasluce", f: "trasluc- + -e → traslucirse (to show through), present, it, with 'se' and 'me' (to me): 'it shows through to me'. 'a mí' doubles 'me' for emphasis. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "ha de haber", f: "ha → haber (to have), present, it: he, has, ha, hemos, habéis, han; + de + haber (here: to exist): 'there is to be', i.e. there will be."}
          - {w: "traduzga", f: "traduzg- + -a → traducir (to translate), present subjunctive, it, with 'se' making it passive. Old form; modern 'traduzca': traduzca, traduzcas, traduzca, traduzcamos, traduzcáis, traduzcan. Subjunctive after 'donde no' describing something denied to exist."}
        note: "Carrasco's prophecy came true: Don Quijote was translated into English (1612) and French (1614) within a few years, and later into most languages of the world."
  - sentences:
      - es: "— Una de las cosas —dijo a esta sazón don Quijote— que más debe de dar contento a un hombre virtuoso y eminente es verse, viviendo, andar con buen nombre por las lenguas de las gentes, impreso y en estampa."
        literal: "— One of the things —said at this season Don Quijote— that most must give contentment to a man virtuous and eminent is to-see-himself, living, to-go with good name through the tongues of the people, printed and in print."
        ormsby: "“One of the things,” here observed Don Quixote, “that ought to give most pleasure to a virtuous and eminent man is to find himself in his lifetime in print and in type, familiar in people’s mouths with a good name;"
        vocab:
          - {w: "a esta sazón", d: "at this point, just then ('sazón' = season, the right moment)"}
          - {w: "deber de", d: "must (probability): 'debe de dar' = must give"}
          - {w: "contento", d: "contentment, pleasure (noun)"}
          - {w: "andar por las lenguas", d: "to be on everyone's lips, be talked about"}
          - {w: "en estampa", d: "in print"}
        diagram:
          - s: "Una de las cosas ... es"
            r: "main verb: one of the things is"
            under:
              - {s: "dijo a esta sazón don Quijote", r: "aside: said Don Quijote at this point"}
              - {s: "que más debe de dar contento a un hombre virtuoso y eminente", r: "describes 'cosas': that must most please a virtuous, eminent man"}
              - s: "verse"
