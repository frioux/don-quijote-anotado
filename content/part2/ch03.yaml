          - {w: "rebién", d: "very well, doubly well: 're-' as an intensifier, a jokey coinage"}
          - {w: "Cide Hamete Benengeli", d: "the fictional Arab historian whom Part I names as the author of Don Quijote's history"}
          - {w: "grandezas", d: "great deeds"}
          - {w: "curioso", d: "here 'the careful, interested person', the man who had the book translated (in Part I ch. 9 the narrator himself); not 'nosy'"}
          - {w: "arábigo", d: "Arabic (old word for the language)"}
          - {w: "vulgar", d: "vernacular, the common tongue (not 'coarse')"}
          - {w: "gentes", d: "people, peoples"}
        diagram:
