              - {s: "sino solamente la señora Dulcinea del Toboso", r: "contrast: only 'the lady Dulcinea del Toboso'"}
          - s: "y ya en esto anda errada la historia"
            r: "main verb 2: and already the history is wrong in this"
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "he oído", f: "he → haber (to have), present, I: he, has, ha, hemos, habéis, han; + oído, participle of oír (to hear): 'I have heard'."}
          - {w: "llamar", f: "llamar (to call), infinitive after 'he oído': 'heard [people] call'."}
          - {w: "solamente", f: "sola + -mente → 'only'; -mente is added to the feminine of the adjective to make an adverb."}
