          - {w: "acabaremos", f: "acabar- + -emos → acabar (to finish), future, we. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
  - sentences:
      - es: "— Mala me la dé Dios, Sancho —respondió el bachiller—, si no sois vos la segunda persona de la historia;"
        literal: "— Bad to-me it may-give God, Sancho —answered the bachelor—, if not are you the second person of the history;"
        ormsby: "“May God shorten mine, Sancho,” returned the bachelor, “if you are not the second person in the history,"
        vocab:
          - {w: "mala me la dé Dios", d: "oath: may God give me a bad one (a bad life or death) if ...; i.e. I swear that ..."}
          - {w: "la segunda persona", d: "the second character, the second most important person"}
        diagram:
          - s: "Mala me la dé Dios"
            r: "main verb (oath): may God give me a bad one"
            under:
              - {s: "Sancho", r: "addressed to"}
              - {s: "si no sois vos la segunda persona de la historia", r: "condition: if you are not the second person of the history"}
          - {s: "respondió el bachiller", r: "speech verb (aside): the bachelor answered"}
        forms:
          - {w: "Mala", f: "mal- + -a → malo (bad), feminine to match an unspoken noun such as 'vida' or 'muerte'."}
          - {w: "me la dé", f: "d- + -é → dar (to give), present subjunctive, he (God), used as a wish: 'may he give'. dar in the present subjunctive: dé, des, dé, demos, deis, den (the accent on dé tells it from 'de', of). 'me' = to me, 'la' = it (the bad one)."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "sois", f: "sois → ser (to be), present, you (vos). Irregular: soy, eres, es, somos, sois, son. Sansón too uses 'vos' to the peasant Sancho."}
          - {w: "segunda", f: "segund- + -a → segundo (second), feminine to match 'persona'."}
      - es: "y que hay tal, que precia más oíros hablar a vos que al más pintado de toda ella, puesto que también hay quien diga que anduvistes demasiadamente de crédulo en creer que podía ser verdad el gobierno de aquella ínsula, ofrecida por el señor don Quijote, que está presente."
        literal: "and that there-is such [a one], that values more to-hear-you speak [to] you than [to] the most painted of all it, although also there-is who may-say that you-went excessively of credulous in believing that could be truth the government of that isle, offered by the lord Don Quijote, who is present."
        ormsby: "and there are even some who would rather hear you talk than the cleverest in the whole book; though there are some, too, who say you showed yourself over-credulous in believing there was any possibility in the government of that island offered you by Señor Don Quixote.”"
        vocab:
          - {w: "hay tal que", d: "there are those who, some people"}
          - {w: "preciar", d: "to value, prize: 'precia más' = prefers"}
          - {w: "el más pintado", d: "idiom: the finest, the cleverest, the best of them"}
          - {w: "puesto que", d: "here 'although' (old sense), not modern 'since'"}
          - {w: "andar de crédulo", d: "to be credulous, behave gullibly; 'demasiadamente' = excessively"}
          - {w: "ínsula", d: "isle: the bookish word of the romances of chivalry for the island Don Quijote promised Sancho to govern"}
        diagram:
          - s: "y que hay tal"
            r: "continues the oath, after 'si no' (if not ... and if not): and that there is someone"
            under:
              - s: "que precia más oíros hablar a vos"
                r: "describes 'tal': who prefers hearing you talk"
                under:
                  - {s: "que al más pintado de toda ella", r: "than: than the finest in the whole of it"}
          - s: "puesto que también hay quien diga"
            r: "concession: although there are also some who say"
            under:
              - s: "que anduvistes demasiadamente de crédulo"
                r: "what they say: that you were too credulous"
                under:
                  - s: "en creer"
                    r: "in what: in believing"
                    under:
                      - s: "que podía ser verdad el gobierno de aquella ínsula"
                        r: "what you believed: that the governing of that isle could be true"
                        under:
                          - {s: "ofrecida por el señor don Quijote", r: "describes 'ínsula': offered by Don Quijote"}
                          - {s: "que está presente", r: "describes 'don Quijote': who is here"}
        forms:
          - {w: "hay", f: "hay → haber (to have), impersonal 'there is'; the present 'ha' + old 'y' (there)."}
          - {w: "precia", f: "preci- + -a → preciar (to value), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "oíros hablar", f: "oír (to hear) + os (you), the pronoun hung on the infinitive, doubled by 'a vos'; + hablar (to speak), infinitive after a verb of hearing: 'hear you talk'."}
          - {w: "al más pintado", f: "al = a + el; pintado, participle of pintar (to paint), here 'the finest', with 'más' making the superlative."}
          - {w: "diga", f: "dig- + -a → decir (to say), present subjunctive, he: subjunctive after 'hay quien' (there is someone who). diga, digas, diga, digamos, digáis, digan."}
          - {w: "anduvistes", f: "anduv- + -istes → andar (to go, to behave), preterite, you (vos). Irregular: anduve, anduviste, anduvo, anduvimos, anduvisteis, anduvieron. 'anduvistes' is the old vos form, between modern 'anduviste' and 'anduvisteis'."}
          - {w: "demasiadamente", f: "demasiad- + -a + -mente → demasiado (excessive) + -mente, the adverb ending added to the feminine: 'excessively'."}
          - {w: "creer", f: "creer (to believe), infinitive after 'en'."}
          - {w: "podía", f: "pod- + -ía → poder (to be able), imperfect, it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "ofrecida", f: "ofrecid- + -a → ofrecido, participle of ofrecer (to offer), feminine to match 'ínsula'."}
          - {w: "está", f: "est- + -á → estar (to be), present, he. estoy, estás, está, estamos, estáis, están."}
        note: "'Puesto que' in Cervantes usually means 'although', as here. Sansón flatters Sancho as the book's favourite and then needles him about the island, the running joke of Part I."
  - sentences:
      - es: "— Aún hay sol en las bardas —dijo don Quijote—, y, mientras más fuere entrando en edad Sancho, con la esperiencia que dan los años, estará más idóneo y más hábil para ser gobernador que no está agora."
        literal: "— Still there-is sun on the wall-tops —said Don Quijote—, and, the more he-may-go entering in age Sancho, with the experience that give the years, he-will-be more fit and more able to be governor than not he-is now."
        ormsby: "“There is still sunshine on the wall,” said Don Quixote; “and when Sancho is somewhat more advanced in life, with the experience that years bring, he will be fitter and better qualified for being a governor than he is at present.”"
        ormsby_note: "Proverb 220, Aun hay sol en las bardas, i.e. \"the day is not yet over.\" Las bardas are properly not the wall itself, but a kind of coping of straw or faggots laid along the top of it."
        vocab:
          - {w: "aún hay sol en las bardas", d: "proverb: there is still sun on the wall-tops, i.e. the day is not over yet, there is still time"}
          - {w: "bardas", d: "the straw or brushwood coping laid along the top of a wall"}
          - {w: "mientras más", d: "the more (= cuanto más)"}
          - {w: "entrar en edad", d: "to get on in years, grow older"}
          - {w: "esperiencia", d: "= experiencia, experience (old spelling)"}
          - {w: "idóneo", d: "fit, suitable, qualified"}
          - {w: "hábil", d: "capable, competent"}
          - {w: "agora", d: "= ahora, now (old form)"}
        diagram:
          - {s: "Aún hay sol en las bardas", r: "main verb 1 (proverb): there is still sun on the walls"}
          - {s: "dijo don Quijote", r: "speech verb (aside): said Don Quijote"}
          - s: "estará más idóneo y más hábil"
            r: "main verb 2: he will be fitter and more able"
            under:
              - {s: "mientras más fuere entrando en edad Sancho", r: "condition: the older Sancho grows"}
              - {s: "con la esperiencia que dan los años", r: "with what: with the experience the years give"}
              - {s: "para ser gobernador", r: "for what: to be a governor"}
              - {s: "que no está agora", r: "than: than he is now"}
        forms:
          - {w: "hay", f: "hay → haber (to have), impersonal 'there is'; the present 'ha' + old 'y' (there)."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "fuere entrando", f: "fu- + -ere → ir (to go), future subjunctive, he: fuere, fueres, fuere, fuéremos, fuereis, fueren; + entrando, gerund of entrar (to enter): 'ir' + gerund = to be gradually doing, 'as he goes on getting older'. Cervantes uses the future subjunctive for an open future; modern Spanish has the present subjunctive 'vaya'."}
          - {w: "esperiencia", f: "old spelling of experiencia (experience)."}
          - {w: "dan", f: "d- + -an → dar (to give), present, they (the years). Irregular: doy, das, da, damos, dais, dan."}
          - {w: "estará", f: "estar- + -á → estar (to be), future, he. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "que no está", f: "est- + -á → estar (to be), present, he: estoy, estás, está, estamos, estáis, están. The 'no' after 'más ... que' is an old expletive negative and adds no meaning: 'than he is'."}
          - {w: "agora", f: "old form of ahora (now)."}
  - sentences:
      - es: "— Por Dios, señor —dijo Sancho—, la isla que yo no gobernase con los años que tengo, no la gobernaré con los años de Matusalén."
        literal: "— By God, sir —said Sancho—, the island that I not might-govern with the years that I-have, not it I-shall-govern with the years of Methuselah."
        ormsby: "“By God, master,” said Sancho, “the island that I cannot govern with the years I have, I’ll not be able to govern with the years of Methuselah;"
        vocab:
          - {w: "Matusalén", d: "Methuselah, the patriarch of Genesis who lived 969 years, proverbial for old age"}
        diagram:
          - s: "no la gobernaré"
            r: "main verb: I shall not govern it"
            under:
              - {s: "Por Dios, señor", r: "oath and address: by God, sir"}
              - s: "la isla"
                r: "topic, picked up by 'la': the island"
                under:
                  - {s: "que yo no gobernase con los años que tengo", r: "describes 'isla': which I could not govern with the years I have"}
              - {s: "con los años de Matusalén", r: "how: with Methuselah's years"}
          - {s: "dijo Sancho", r: "speech verb (aside): said Sancho"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "gobernase", f: "gobern- + -ase → gobernar (to govern), imperfect subjunctive (-se form), I: 'that I might not govern'. The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "no la gobernaré", f: "gobernar- + -é → gobernar (to govern), future, I. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án. 'la' picks up 'la isla', which was put first."}
        note: "Sancho says 'isla', the everyday word, where his master and Sansón say 'ínsula', the word of the romances."
      - es: "El daño está en que la dicha ínsula se entretiene, no sé dónde, y no en faltarme a mí el caletre para gobernarla."
        literal: "The harm is in that the said isle itself delays, not I-know where, and not in lacking-to-me to me the brains to govern-it."
        ormsby: "the difficulty is that the said island keeps its distance somewhere, I know not where; and not that there is any want of head in me to govern it.”"
        vocab:
          - {w: "el daño está en que", d: "the trouble is that"}
          - {w: "dicho", d: "the said, aforementioned (legal style)"}
          - {w: "entretenerse", d: "to linger, dawdle, be held up"}
          - {w: "caletre", d: "brains, wits, common sense (colloquial)"}
        diagram:
          - s: "El daño está"
            r: "main verb: the trouble lies"
            under:
              - s: "en que la dicha ínsula se entretiene"
                r: "where, 1: in the fact that the said isle is dawdling"
                under:
                  - {s: "no sé dónde", r: "aside: I don't know where"}
              - s: "y no en faltarme a mí el caletre"
                r: "where, 2 (denied): and not in my lacking the brains"
                under:
                  - {s: "para gobernarla", r: "for what: to govern it"}
        forms:
          - {w: "está", f: "est- + -á → estar (to be), present, it. estoy, estás, está, estamos, estáis, están."}
          - {w: "dicha", f: "dich- + -a → dicho, participle of decir (to say), feminine to match 'ínsula': 'the said'."}
          - {w: "se entretiene", f: "entretien- + -e → entretenerse (to linger), present, it. Conjugated like tener (to have): me entretengo, te entretienes, se entretiene, nos entretenemos, os entretenéis, se entretienen."}
          - {w: "sé", f: "sé → saber (to know), present, I. Irregular: sé, sabes, sabe, sabemos, sabéis, saben (accent tells it from 'se')."}
          - {w: "faltarme", f: "faltar (to be lacking) + me (to me), doubled by 'a mí'; the infinitive is used as a noun after 'en', with 'el caletre' as its subject."}
          - {w: "gobernarla", f: "gobernar (to govern) + la (it, the isle), the pronoun hung on the infinitive after 'para'."}
  - sentences:
      - es: "— Encomendadlo a Dios, Sancho —dijo don Quijote—, que todo se hará bien, y quizá mejor de lo que vos pensáis; que no se mueve la hoja en el árbol sin la voluntad de Dios."
        literal: "— Commend-it to God, Sancho —said Don Quijote—, for all itself will-do well, and perhaps better than what you think; for not itself moves the leaf on the tree without the will of God."
        ormsby: "“Leave it to God, Sancho,” said Don Quixote, “for all will be and perhaps better than you think; no leaf on the tree stirs but by God’s will.”"
        vocab:
          - {w: "encomendar", d: "to commend, entrust, put in someone's hands; 'encomendar a Dios' = to leave it to God"}
          - {w: "hacerse bien", d: "to turn out well, be done well"}
          - {w: "mejor de lo que", d: "better than (before a clause): 'mejor de lo que vos pensáis' = better than you think"}
          - {w: "no se mueve la hoja en el árbol sin la voluntad de Dios", d: "proverb: not a leaf stirs on the tree without God's will, i.e. everything happens by Providence"}
        diagram:
          - s: "Encomendadlo a Dios"
            r: "main verb 1: leave it to God"
            under:
              - {s: "Sancho", r: "addressed to: Sancho"}
              - {s: "dijo don Quijote", r: "aside: said Don Quijote"}
          - s: "que todo se hará bien"
            r: "why: for everything will turn out well"
            under:
              - {s: "y quizá mejor de lo que vos pensáis", r: "and perhaps better than you think"}
          - s: "que no se mueve la hoja en el árbol"
            r: "why, 2: for no leaf stirs on the tree"
            under:
              - {s: "sin la voluntad de Dios", r: "condition: without God's will"}
        forms:
          - {w: "Encomendadlo", f: "encomend- + -ad + lo → encomendar (to commend), imperative, you (vos/vosotros), with 'lo' (it) stuck on the end: 'commend it'. The vosotros imperative swaps the final -r of the infinitive for -d (encomendad, comed, vivid), and a pronoun always hangs on the end of a positive command. Don Quijote speaks to Sancho with vos."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "se hará", f: "har- + -á → hacer (to do, make), future, it, with 'se' making it passive: 'will be done, will turn out'. Irregular stem har-: haré, harás, hará, haremos, haréis, harán."}
          - {w: "pensáis", f: "pens- + -áis → pensar (to think), present, you (vos, which takes the plural-looking form even for one person). The stem e becomes ie when stressed: pienso, piensas, piensa, pensamos, pensáis, piensan."}
          - {w: "se mueve", f: "muev- + -e → moverse (to move, stir), present, it (the leaf), with 'se' (itself). The stem o becomes ue when stressed: muevo, mueves, mueve, movemos, movéis, mueven. The subject 'la hoja' comes after the verb."}
        note: "Don Quijote's closing saying is proverbial and echoes the Gospel teaching that not a sparrow falls without God's will. He uses it to put off once more the question of when Sancho will get his isle."
  - sentences:
