          - {w: "tenemos", f: "ten- + -emos → tener (to have), present, we. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen. The object comes first for emphasis."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
        note: "Sancho grumbles at a second pedant, since his master already picks on his words. 'Voquibles', his word for 'vocablos', is itself a mangled word, so the joke turns on him again."
