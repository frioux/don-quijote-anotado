          - {w: "me han dado", f: "h- + -an → haber (to have), present, they: he, has, ha, hemos, habéis, han; + dado, participle of dar (to give): 'they have given me'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
