            r: "main verb 1: a blessing on Cide Hamete Benengeli"
            under:
              - {s: "que la historia de vuestras grandezas dejó escritas", r: "describes 'Cide Hamete': who left the history of your great deeds written"}
          - s: "y rebién haya el curioso"
            r: "main verb 2: and a double blessing on the interested man"
            under:
              - s: "que tuvo cuidado de hacerlas traducir"
                r: "describes 'curioso': who took care to have them translated"
                under:
                  - {s: "de arábigo en nuestro vulgar castellano", r: "from what into what: from Arabic into our Castilian vernacular"}
                  - {s: "para universal entretenimiento de las gentes", r: "why: for everyone's entertainment"}
        forms:
          - {w: "haya", f: "hay- + -a → haber (to have), present subjunctive, he, as a wish: 'may he have [good]'. haya, hayas, haya, hayamos, hayáis, hayan."}
          - {w: "vuestras grandezas", f: "vuestr- + -as → vuestro (your), feminine plural to match 'grandezas'."}
          - {w: "dejó escritas", f: "dej- + -ó → dejar (to leave), preterite, he, + escritas, irregular participle of escribir (to write), feminine plural: 'left written'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. 'escritas' agrees with 'grandezas', the nearest noun, rather than with 'historia'."}
          - {w: "tuvo", f: "tuv- + -o → tener (to have), preterite, he: 'tener cuidado de' = to take care to. Irregular: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron."}
