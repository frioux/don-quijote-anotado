          - {w: "algunos de los infinitos palos", f: "algunos = some, masculine plural to match 'palos'; infinitos (countless), masculine plural, before the noun."}
          - {w: "dieron", f: "d- + -ieron → dar (to give), preterite, they (people in general). Irregular, with -er/-ir endings: di, diste, dio, dimos, disteis, dieron."}
          - {w: "al", f: "a + el; 'a' marks the person given the blows."}
