summary: |
  While Sancho fetches the bachelor, Don Quijote broods over the news that his deeds are already in a book. The blood of his enemies is hardly dry on his sword; only a sage working by enchantment could have printed them so fast. A friendly sage would have exalted them, an enemy debased them; but he is troubled that the author is a Moor, since Moors, he believes, never tell the truth, and he worries that the book may have stained Dulcinea's honour. Sansón Carrasco arrives: a small, sallow, round-faced young man of about twenty-four, a born joker, who drops to his knees, hails Don Quijote as the most famous knight-errant in the world, and blesses Cide Hamete Benengeli and the man who had him translated.

  Carrasco reports that more than twelve thousand copies are in print, from Portugal, Barcelona and Valencia, with Antwerp to follow. He lists the readers' favourite adventures: the windmills, the fulling mills, the two armies that turned out to be sheep, the dead body bound for Segovia, the galley slaves, the Benedictine 'giants' and the Basque. Sancho asks about the Yanguesans and is told the history leaves nothing out, not even his capers in the blanket. Some readers wish the author had left out a few of the beatings; Don Quijote agrees that Virgil and Homer did not paint Aeneas and Ulysses as they really were, but Carrasco answers that the poet writes things as they should have been and the historian as they were. Sancho insists on being in the book, is corrected for saying 'presonajes', and learns that he is the second person of the history, though some think him too credulous about his isle.

  The talk turns to the book's faults. Readers object to the inserted novella 'El curioso impertinente'; Don Quijote decides the author must be an ignorant chatterer, like the painter Orbaneja of Úbeda, who painted whatever came out and had to label his cock 'This is a cock'. Carrasco says the book is so clear that children thumb it, young men read it, grown men understand it and old men praise it, and every lean nag is hailed as Rocinante. Don Quijote lectures on history as a sacred thing that must be true, on the wit needed to play the fool in a comedy, and on authors who toss off books like fritters; Carrasco defends authors against envious critics, since even good Homer nods.

  Finally Carrasco mentions two slips: the book never says who stole Sancho's ass, though Sancho is soon riding it again, nor what Sancho did with the hundred gold crowns he found in the Sierra Morena. Sancho, feeling faint from hunger, promises to explain everything after dinner and hurries home. Don Quijote keeps the bachelor to share his meal, with a pair of pigeons added to the usual fare; they talk chivalry, Carrasco humours his host, they take their siesta, and Sancho comes back to resume the conversation.
context: |
  The book inside the book. In this chapter Part I meets its own readers. Ormsby points out that only about a month of story time has passed since the knight came home in the ox-cart, yet the book has been written, translated, printed and sold in thousands; Cervantes, he says, saw the blunder and turned it to account, since for Don Quijote only enchantment can explain it. The real Part I appeared in Madrid early in 1605 and was reprinted the same year in Lisbon and Valencia; Ormsby notes that there was no Barcelona edition in Cervantes' lifetime and no Antwerp edition of Part I alone, though Brussels and Milan printed it. Carrasco's 'twelve thousand copies' is a boast, not a figure to trust. Much of the chapter is Cervantes answering real criticisms of Part I through his characters: the inserted novella 'El curioso impertinente' (Part I chapters 33 to 35), the theft of Sancho's ass, which the first edition never narrates though Sancho is later riding it again, and the hundred gold crowns from the valise in the Sierra Morena. Ormsby notes that a passage added to the second edition tried to repair the ass blunder, and concludes from this chapter that Cervantes had nothing to do with it.

  Arms, letters and the art of history. Don Quijote expects his chronicler to be a 'sabio encantador', the wizard-historian of the romances, and is dismayed that he is a Moor, voicing the common prejudice of the age that Moors and Moriscos were liars. The literary debate that follows rests on commonplaces of Renaissance criticism: the distinction going back to Aristotle's 'Poetics' that the poet tells things as they should be and the historian as they were; Virgil's pious Aeneas and Homer's wise Ulysses as idealised portraits; Horace's line from the 'Art of Poetry' that even good Homer sometimes nods (Carrasco says 'aliquando' where Horace wrote 'quandoque'); and the Latin of Ecclesiastes 1:15 in the Vulgate, 'the number of fools is infinite', turned into a compliment to the book's many readers. El Tostado, Ormsby explains, was Alonso de Madrigal, Bishop of Ávila, whose huge output made 'escribir más que el Tostado' proverbial. The 'bobo' of the comedia was the stock fool of the Spanish stage, and Don Quijote's point, that only a clever actor can play the simpleton, is Cervantes defending his own Sancho.

  People and society. Sansón Carrasco is a bachelor of Salamanca, the first university degree, wearing the student's clerical 'hábito de San Pedro' and holding only the four minor orders, which did not commit him to the priesthood. His Biblical name is a joke on his small size. Sancho's pride in being an 'old Christian', with no Jewish or Moorish ancestry, reflects the obsession with 'limpieza de sangre' (purity of blood) in Spain at the time. The pages who fight over the book in the antechambers of great houses were the young servants of noblemen, idle readers waiting on their masters. 'Hacer penitencia', Ormsby says, means 'take potluck': the pigeons added to the 'ordinario', the everyday fare, are the guest's only luxury.

  Sancho's words. Sancho mangles and mocks the learned: 'presonajes' for personajes, 'voquibles' for vocablos, 'presonas' for personas, and 'grama-tica', which Ormsby explains through 'grama', a tool for dressing flax, a word Sancho does know. His proverbs and set phrases run through the chapter: 'pedir cotufas en el golfo' (to ask for the impossible), 'mezclar berzas con capachos' (to jumble unlike things together, as Ormsby notes from Covarrubias), 'ponerse en la espina de Santa Lucía' (to be faint with hunger), and 'Aún hay sol en las bardas', said by Don Quijote, which Ormsby renders 'the day is not yet over'. His 'oíslo' is his wife, from '¿oíslo?' ('do you hear?'), the way a husband calls to her.

  Reading Cervantes' Spanish. The archaic forms of the chapter: desa, deso, dél, della, dellos (de + esa, eso, él, ella, ellos), encantamento (encantamiento), traduzga (traduzca), agora (ahora), esperiencia (experiencia), letura (lectura), sospiros (suspiros), efeto (efecto), mesmo (mismo), veen (ven), fee (fe). Pronouns hang on a verb that opens a clause: Temíase, desconsolóle, Hízole, and the run of quedóse, añadióse, tratóse, siguióle, acabóse, renovóse at the end. The future subjunctive marks open futures (saliere, fuere, leyeren, quisieren), and the -ra form often does the work of the conditional (holgaran, pudieran, fuera). Don Quijote speaks to Sancho with vos and its commands (Callad, Encomendadlo), Sancho and Carrasco use vuestra merced, and Carrasco mockingly raises it to 'vuestra grandeza'. Watch the false friends: honestidad (chastity), desgracias (misfortunes), ponderar (to praise), condición (nature), curioso (careful, interested), impertinente (meddlesome), novela (short story, novella) and discreto (clever, sensible).
