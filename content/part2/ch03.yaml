part: 2
chapter: 3
title_es: "Capítulo III. Del ridículo razonamiento que pasó entre don Quijote, Sancho Panza y el bachiller Sansón Carrasco"
title_en: "Of the laughable conversation that passed between Don Quixote, Sancho Panza, and the bachelor Samson Carrasco"
paragraphs:
  - sentences:
      - es: "Pensativo además quedó don Quijote, esperando al bachiller Carrasco, de quien esperaba oír las nuevas de sí mismo puestas en libro, como había dicho Sancho;"
        literal: "Thoughtful exceedingly remained Don Quijote, waiting-for [to] the bachelor Carrasco, from whom he-was-hoping to-hear the news of himself put in book, as had said Sancho;"
        ormsby: "Don Quixote remained very deep in thought, waiting for the bachelor Carrasco, from whom he was to hear how he himself had been put into a book as Sancho said;"
        vocab:
          - {w: "pensativo", d: "thoughtful, lost in thought"}
          - {w: "además", d: "here the old sense 'exceedingly, very much', not the modern 'besides'"}
          - {w: "bachiller", d: "bachelor: holder of the first university degree (here from Salamanca); also, by extension, a know-all"}
          - {w: "nuevas", d: "news, tidings (plural noun, literary)"}
          - {w: "puesto en libro", d: "put into a book, written up"}
        diagram:
          - s: "Pensativo además quedó don Quijote"
            r: "main verb: Don Quijote remained very thoughtful"
            under:
              - s: "esperando al bachiller Carrasco"
                r: "how: waiting for the bachelor Carrasco"
                under:
                  - s: "de quien esperaba oír las nuevas de sí mismo"
                    r: "describes 'Carrasco': from whom he hoped to hear the news about himself"
                    under:
                      - {s: "puestas en libro", r: "describes 'nuevas': put into a book"}
                      - {s: "como había dicho Sancho", r: "how: as Sancho had said"}
        forms:
          - {w: "Pensativo", f: "pensativ- + -o → pensativo (thoughtful), masculine to match 'don Quijote'. The adjective comes first for emphasis, before the verb and its subject."}
          - {w: "quedó", f: "qued- + -ó → quedar (to remain), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "esperando", f: "esper- + -ando → gerund of esperar (to wait for): 'waiting for'."}
          - {w: "al", f: "a + el: the personal 'a' before a person as object ('esperar a alguien'), fused with the article."}
          - {w: "esperaba", f: "esper- + -aba → esperar (here: to hope), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. The same verb means 'wait' and 'hope' in one breath."}
          - {w: "oír", f: "oír (to hear), infinitive after 'esperaba'."}
          - {w: "sí mismo", f: "sí = 'himself' after a preposition (de sí), with the accent that tells it from 'si' (if); mismo adds emphasis: 'himself'."}
          - {w: "puestas", f: "puest- + -as → puesto, irregular participle of poner (to put), feminine plural to match 'nuevas'."}
          - {w: "había dicho", f: "hab- + -ía → haber (to have), imperfect, he, + dicho, irregular participle of decir (to say): the pluperfect, 'had said'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
        note: "Sancho told his master at the end of the previous chapter that the bachelor Sansón Carrasco, just back from Salamanca, had seen their adventures in print, and went to fetch him."
      - es: "y no se podía persuadir a que tal historia hubiese, pues aún no estaba enjuta en la cuchilla de su espada la sangre de los enemigos que había muerto, y ya querían que anduviesen en estampa sus altas caballerías."
        literal: "and not himself he-could persuade to that such history there-might-be, since still not was dry on the blade of his sword the blood of the enemies that he-had killed, and already they-wanted that might-go-about in print his high chivalries."
        ormsby: "and he could not persuade himself that any such history could be in existence, for the blood of the enemies he had slain was not yet dry on the blade of his sword, and now they wanted to make out that his mighty achievements were going about in print."
        ormsby_note: "The critics and commentators have been much troubled by the inconsistency involved in making only a month elapse between the termination of the First Part and the resumption of the story, in which short space of time the first volume is supposed to have been written, translated, printed, and circulated, as we are afterwards told, to the extent of 12,000 copies. Cervantes, however, himself saw the blunder, as we perceive here, and makes a happy use of it as evidence of enchantment in the knight's eyes. Cervantes never troubled his head about such inconsistencies. The action of the whole story of Don Quixote is supposed to extend over three or four months only, but according to dates it extends over twenty-five years, from 1589 to 1614."
        vocab:
          - {w: "persuadirse a", d: "to bring oneself to believe, be convinced that"}
          - {w: "haber (historia)", d: "'que tal historia hubiese' = that such a history existed; haber (to have) used as 'to exist', the verb behind 'hay'"}
          - {w: "enjuto", d: "dry, dried out (literary)"}
          - {w: "cuchilla", d: "blade (of a sword or knife)"}
          - {w: "muerto", d: "with haber (to have), 'killed': 'había muerto' = he had killed (old use of morir's participle for matar)"}
          - {w: "andar en estampa", d: "to go about in print, be printed and circulating; 'estampa' = print, the press"}
          - {w: "caballerías", d: "deeds of chivalry, knightly exploits"}
        diagram:
          - s: "y no se podía persuadir"
            r: "main verb 1 (after 'y'): and he could not convince himself"
            under:
              - {s: "a que tal historia hubiese", r: "of what: that such a history existed"}
              - s: "pues aún no estaba enjuta"
                r: "why: since it was not yet dry"
                under:
                  - {s: "en la cuchilla de su espada", r: "where: on the blade of his sword"}
                  - s: "la sangre de los enemigos"
                    r: "subject: the blood of the enemies"
                    under:
                      - {s: "que había muerto", r: "describes 'enemigos': whom he had killed"}
          - s: "y ya querían"
            r: "main verb 2 (after 'y'): and already they wanted"
            under:
              - {s: "que anduviesen en estampa sus altas caballerías", r: "what they wanted: that his lofty deeds should be going about in print"}
        forms:
          - {w: "se podía persuadir", f: "pod- + -ía → poder (to be able), imperfect, he, + persuadir (to persuade) with 'se' (himself) placed before the whole group. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "hubiese", f: "hub- + -iese → haber (here: to exist, 'there to be'), imperfect subjunctive (-se form), it. hubiese, hubieses, hubiese, hubiésemos, hubieseis, hubiesen. Subjunctive because he doubts it."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, it (the blood). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "enjuta", f: "enjut- + -a → enjuto (dry), feminine to match 'la sangre', the subject, which comes after it."}
          - {w: "había muerto", f: "hab- + -ía → haber (to have), imperfect, he, + muerto, participle of morir (to die), used here for 'killed': 'he had killed'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "querían", f: "quer- + -ían → querer (to want), imperfect, they (people, unnamed). Same -ía imperfect as 'podía'."}
          - {w: "anduviesen", f: "anduv- + -iesen → andar (to go about), imperfect subjunctive (-se form), they (his deeds). Irregular stem anduv-: anduviese, anduvieses, anduviese, anduviésemos, anduvieseis, anduviesen. Subjunctive after 'querían que'."}
          - {w: "sus altas caballerías", f: "sus = plural to match 'caballerías', not the owner; alt- + -as → alto (high, lofty), feminine plural."}
      - es: "Con todo eso, imaginó que algún sabio, o ya amigo o enemigo, por arte de encantamento las habrá dado a la estampa:"
        literal: "With all that, he-imagined that some sage, either now friend or enemy, by art of enchantment them will-have given to the press:"
        ormsby: "For all that, he fancied some sage, either a friend or an enemy, might, by the aid of magic, have given them to the press;"
        vocab:
          - {w: "con todo eso", d: "for all that, nevertheless"}
          - {w: "sabio", d: "sage: in the romances of chivalry, a wizard-chronicler who records a knight's deeds"}
          - {w: "o ya ... o", d: "either ... or"}
          - {w: "encantamento", d: "= encantamiento, enchantment, magic (old form)"}
          - {w: "dar a la estampa", d: "to print, publish (literally 'give to the press')"}
        diagram:
          - s: "imaginó"
            r: "main verb: he imagined"
            under:
              - {s: "Con todo eso", r: "linking: nevertheless"}
              - s: "que algún sabio ... las habrá dado a la estampa"
                r: "what he imagined: that some sage must have printed them"
                under:
                  - {s: "o ya amigo o enemigo", r: "describes 'sabio': either friend or enemy"}
                  - {s: "por arte de encantamento", r: "how: by magic"}
        forms:
          - {w: "imaginó", f: "imagin- + -ó → imaginar (to imagine), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun ('sabio'), like un, buen, ningún."}
          - {w: "encantamento", f: "old form of encantamiento (enchantment): -amento where modern Spanish has -amiento."}
          - {w: "las", f: "'them', feminine plural for 'sus altas caballerías' in the previous sentence."}
          - {w: "habrá dado", f: "habr- + -á → haber (to have), future, he, + dado, participle of dar (to give): the future perfect, 'will have given', here a guess about the past, 'must have given'. haber in the future: habré, habrás, habrá, habremos, habréis, habrán."}
        note: "In the romances every knight had a wizard who wrote his history; Don Quijote assumed in Part I chapter 2 that some 'sabio encantador' would record his first sally. A book that appears within a month of his deeds can only be magic."
      - es: "si amigo, para engrandecerlas y levantarlas sobre las más señaladas de caballero andante;"
        literal: "if friend, to magnify-them and raise-them above the most distinguished of knight errant;"
        ormsby: "if a friend, in order to magnify and exalt them above the most famous ever achieved by any knight-errant;"
        vocab:
          - {w: "engrandecer", d: "to magnify, extol, make great"}
          - {w: "señalado", d: "distinguished, notable, famous (not 'signalled')"}
          - {w: "caballero andante", d: "knight-errant"}
        diagram:
          - s: "si amigo"
            r: "condition: if (the sage was) a friend; the verb 'habrá dado' is carried over"
            under:
              - s: "para engrandecerlas y levantarlas"
                r: "why: to magnify and raise them"
                under:
                  - {s: "sobre las más señaladas de caballero andante", r: "how high: above the most famous of any knight-errant"}
        forms:
          - {w: "si amigo", f: "a clause with no verb: 'if [he was a] friend', the verb understood from the previous sentence."}
          - {w: "engrandecerlas", f: "engrandecer (to magnify) + las (them, the deeds), the pronoun hung on the infinitive after 'para'."}
          - {w: "levantarlas", f: "levantar (to raise) + las (them), the pronoun hung on the infinitive, second verb after 'para'."}
          - {w: "las más señaladas", f: "señal- + -adas → señalado (distinguished), feminine plural to match the unspoken 'caballerías'; 'las más' = the most: Spanish forms the superlative with article + más."}
      - es: "si enemigo, para aniquilarlas y ponerlas debajo de las más viles que de algún vil escudero se hubiesen escrito, puesto —decía entre sí— que nunca hazañas de escuderos se escribieron;"
        literal: "if enemy, to annihilate-them and put-them below [of] the most base that of some base squire had-been written, granted —he-was-saying among himself— that never deeds of squires were-written;"
        ormsby: "if an enemy, to bring them to naught and degrade them below the meanest ever recorded of any low squire, though as he said to himself, the achievements of squires never were recorded."
        vocab:
          - {w: "aniquilar", d: "to annihilate, bring to nothing"}
          - {w: "vil", d: "base, low, contemptible"}
          - {w: "escudero", d: "squire, a knight's attendant"}
          - {w: "puesto que", d: "here 'although, granted that' (old sense), not the modern 'since'"}
          - {w: "entre sí", d: "to himself, under his breath"}
          - {w: "hazaña", d: "deed, exploit"}
        diagram:
          - s: "si enemigo"
            r: "condition: if (the sage was) an enemy; the verb 'habrá dado' is carried over"
            under:
              - s: "para aniquilarlas y ponerlas"
                r: "why: to annihilate them and put them"
                under:
                  - s: "debajo de las más viles"
                    r: "where: below the basest"
                    under:
                      - {s: "que de algún vil escudero se hubiesen escrito", r: "describes 'las más viles': that had ever been written of some base squire"}
              - s: "puesto ... que nunca hazañas de escuderos se escribieron"
                r: "concession: though squires' deeds were never written down"
                under:
                  - {s: "decía entre sí", r: "aside: he said to himself"}
        forms:
          - {w: "aniquilarlas, ponerlas", f: "aniquilar (to annihilate) and poner (to put), each with las (them, the deeds) hung on the infinitive after 'para'."}
          - {w: "las más viles", f: "vil (base) + -es, plural to match the unspoken 'hazañas'; 'las más' = the most: article + más makes the superlative."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun ('escudero')."}
          - {w: "se hubiesen escrito", f: "hub- + -iesen → haber (to have), imperfect subjunctive (-se form), they, + escrito, irregular participle of escribir (to write), with 'se' making it passive: 'had been written'. hubiese, hubieses, hubiese, hubiésemos, hubieseis, hubiesen."}
          - {w: "decía", f: "dec- + -ía → decir (to say), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "se escribieron", f: "escrib- + -ieron → escribir (to write), preterite, they, with 'se' making it passive: 'were written'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
        note: "Don Quijote does not yet know that Sancho figures in the book; his aside that no one writes about squires is about to be refuted."
      - es: "y cuando fuese verdad que la tal historia hubiese, siendo de caballero andante, por fuerza había de ser grandílocua, alta, insigne, magnífica y verdadera."
        literal: "and when it-might-be true that the such history there-might-be, being of knight errant, by force it-had to be grandiloquent, lofty, distinguished, magnificent and true."
        ormsby: "If, however, it were the fact that such a history were in existence, it must necessarily, being the story of a knight-errant, be grandiloquent, lofty, imposing, grand and true."
        vocab:
          - {w: "cuando", d: "here 'even if, supposing' (with the subjunctive)"}
          - {w: "la tal historia", d: "the said history, this history; 'el tal' points back to something just mentioned"}
          - {w: "por fuerza", d: "necessarily, perforce"}
          - {w: "haber de", d: "to have to, be bound to: 'había de ser' = it must be"}
          - {w: "grandílocuo", d: "grandiloquent, high-flown"}
          - {w: "insigne", d: "illustrious, distinguished"}
        diagram:
          - s: "por fuerza había de ser"
            r: "main verb: it necessarily had to be"
            under:
              - s: "y cuando fuese verdad"
                r: "condition: and supposing it were true"
                under:
                  - {s: "que la tal historia hubiese", r: "what: that this history existed"}
              - {s: "siendo de caballero andante", r: "why: since it was about a knight-errant"}
              - {s: "grandílocua, alta, insigne, magnífica y verdadera", r: "what it had to be: grand, lofty, illustrious, magnificent and true"}
        forms:
          - {w: "fuese", f: "fu- + -ese → ser (to be), imperfect subjunctive (-se form), it, after 'cuando' meaning 'even if'. fuese, fueses, fuese, fuésemos, fueseis, fuesen."}
          - {w: "hubiese", f: "hub- + -iese → haber (here: to exist), imperfect subjunctive (-se form), it: 'that there was such a history'. hubiese, hubieses, hubiese, hubiésemos, hubieseis, hubiesen."}
          - {w: "siendo", f: "gerund of ser (to be): 'being', giving the reason."}
          - {w: "había de ser", f: "hab- + -ía → haber (to have), imperfect, it, + de + ser (to be): 'haber de' = to have to. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "grandílocua, alta, insigne, magnífica y verdadera", f: "all feminine singular to match 'historia'; insigne has one form for both genders."}
  - sentences:
      - es: "Con esto se consoló algún tanto, pero desconsolóle pensar que su autor era moro, según aquel nombre de Cide; y de los moros no se podía esperar verdad alguna, porque todos son embelecadores, falsarios y quimeristas."
        literal: "With this himself he-consoled some bit, but disconsoled-him to-think that its author was Moor, according-to that name of Cide; and from the Moors not itself could expect truth any, because all are swindlers, forgers and fantasists."
        ormsby: "With this he comforted himself somewhat, though it made him uncomfortable to think that the author was a Moor, judging by the title of “Cide;” and that no truth was to be looked for from Moors, as they are all impostors, cheats, and schemers."
        vocab:
          - {w: "algún tanto", d: "somewhat, a little"}
          - {w: "desconsolar", d: "to distress, dishearten (the opposite of consolar, to console)"}
          - {w: "moro", d: "Moor: a Muslim of Spain or North Africa"}
          - {w: "Cide", d: "from Arabic 'sayyid', lord, master (the same word as in 'el Cid'); part of the name of the book's fictional Arab author, Cide Hamete Benengeli"}
          - {w: "embelecador", d: "swindler, impostor, one who deceives with tricks ('embeleco' = a trick, a fraud)"}
          - {w: "falsario", d: "forger, falsifier, liar"}
          - {w: "quimerista", d: "teller of tall tales, maker of fantasies ('quimera' = chimera, a wild fancy); also a troublemaker"}
        diagram:
          - s: "Con esto se consoló algún tanto"
            r: "main verb 1: with this he consoled himself somewhat"
          - s: "pero desconsolóle"
            r: "main verb 2: but it distressed him"
            under:
              - s: "pensar"
                r: "subject: to think, the thought"
                under:
                  - {s: "que su autor era moro", r: "what he thought: that its author was a Moor"}
                  - {s: "según aquel nombre de Cide", r: "on what evidence: judging by that name 'Cide'"}
          - s: "y de los moros no se podía esperar verdad alguna"
            r: "main verb 3: and no truth at all could be expected from the Moors"
            under:
              - {s: "porque todos son embelecadores, falsarios y quimeristas", r: "why: because they are all frauds, forgers and fantasists"}
        forms:
          - {w: "se consoló", f: "consol- + -ó → consolarse (to console oneself), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular word ('tanto')."}
          - {w: "desconsolóle", f: "desconsol- + -ó + le → desconsolar (to distress), preterite, it, with 'le' (him) stuck on the end; modern 'le desconsoló'. Same -ó preterite as 'consoló'. Cervantes often hangs the pronoun on a verb that opens its clause."}
          - {w: "pensar", f: "pensar (to think), infinitive used as the subject: 'to think [this] distressed him'."}
          - {w: "era", f: "era → ser (to be), imperfect, he (the author). Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "aquel", f: "'that', masculine to match 'nombre'."}
          - {w: "no se podía esperar", f: "pod- + -ía → poder (to be able), imperfect, it, + esperar (to expect), with 'se' making it impersonal: 'one could not expect'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "verdad alguna", f: "alguna placed after the noun in a negative sentence means 'none at all': 'no truth whatever'."}
          - {w: "son", f: "son → ser (to be), present, they. Irregular: soy, eres, es, somos, sois, son."}
        note: "Don Quijote shares the common prejudice of his time against Moors and Moriscos as liars. The joke is on him: Part I named an Arab historian, Cide Hamete Benengeli, as the source of his 'true history'."
      - es: "Temíase no hubiese tratado sus amores con alguna indecencia, que redundase en menoscabo y perjuicio de la honestidad de su señora Dulcinea del Toboso;"
        literal: "He-feared-himself not he-might-have treated his loves with some indecency, which might-redound in diminishment and harm of the chastity of his lady Dulcinea del Toboso;"
        ormsby: "He was afraid he might have dealt with his love affairs in some indecorous fashion, that might tend to the discredit and prejudice of the purity of his lady Dulcinea del Toboso;"
        vocab:
          - {w: "temerse", d: "to fear, be afraid (that)"}
          - {w: "temer no", d: "'temíase no hubiese tratado' = he feared that he had treated: the 'no' after a verb of fearing is expletive, it does not negate (like Latin 'ne')"}
          - {w: "amores", d: "love affairs, his love (plural in Spanish)"}
          - {w: "redundar en", d: "to result in, tend to"}
          - {w: "menoscabo", d: "impairment, damage, loss of standing"}
          - {w: "perjuicio", d: "harm, prejudice (in the legal sense: injury)"}
          - {w: "honestidad", d: "chastity, modesty, virtue (false friend: not 'honesty')"}
        diagram:
          - s: "Temíase"
            r: "main verb: he feared"
            under:
              - s: "no hubiese tratado sus amores con alguna indecencia"
                r: "what he feared: that [the author] had handled his love with some indecency"
                under:
                  - {s: "que redundase en menoscabo y perjuicio de la honestidad de su señora Dulcinea del Toboso", r: "describes 'indecencia': which would damage the virtue of his lady Dulcinea"}
        forms:
          - {w: "Temíase", f: "tem- + -ía + se → temerse (to fear), imperfect, he, with 'se' stuck on the end; modern 'se temía'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían. Cervantes hangs the pronoun on a verb that opens the sentence."}
          - {w: "hubiese tratado", f: "hub- + -iese → haber (to have), imperfect subjunctive (-se form), he (the author), + tratado, participle of tratar (to treat): 'had treated'. hubiese, hubieses, hubiese, hubiésemos, hubieseis, hubiesen. The 'que' is left out, as often after verbs of fearing."}
          - {w: "alguna", f: "algun- + -a → alguno (some), feminine to match 'indecencia'."}
          - {w: "redundase", f: "redund- + -ase → redundar (to result), imperfect subjunctive (-se form), it. The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. Subjunctive because the result is only feared."}
      - es: "deseaba que hubiese declarado su fidelidad y el decoro que siempre la había guardado, menospreciando reinas, emperatrices y doncellas de todas calidades, teniendo a raya los ímpetus de los naturales movimientos;"
        literal: "he-wished that he-might-have declared his fidelity and the decorum that always [to] her he-had kept, scorning queens, empresses and maidens of all qualities, holding at bay the impulses of the natural movements;"
        ormsby: "he would have had him set forth the fidelity and respect he had always observed towards her, spurning queens, empresses, and damsels of all sorts, and keeping in check the impetuosity of his natural impulses."
        vocab:
          - {w: "declarar", d: "to set forth, make known"}
          - {w: "decoro", d: "respect, honour, propriety"}
          - {w: "menospreciar", d: "to scorn, spurn, look down on"}
          - {w: "doncella", d: "maiden, damsel (an unmarried young woman)"}
          - {w: "calidades", d: "ranks, conditions, sorts ('de todas calidades' = of every rank)"}
          - {w: "tener a raya", d: "to keep in check, hold within bounds ('raya' = line)"}
          - {w: "ímpetu", d: "impulse, rush, violence"}
          - {w: "movimientos naturales", d: "natural impulses, the stirrings of desire"}
        diagram:
          - s: "deseaba"
