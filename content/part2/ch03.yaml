  - sentences:
      - es: "— No hay duda en eso —replicó don Quijote—; pero muchas veces acontece que los que tenían méritamente granjeada y alcanzada gran fama por sus escritos, en dándolos a la estampa, la perdieron del todo, o la menoscabaron en algo."
        literal: "— Not there-is doubt in that —replied Don Quijote—; but many times it-happens that those who had deservedly earned and attained great fame by their writings, on giving-them to the press, it they-lost of-the whole, or it they-diminished in something."
        ormsby: "“No doubt of that,” replied Don Quixote; “but it often happens that those who have acquired and attained a well-deserved reputation by their writings, lose it entirely, or damage it in some degree, when they give them to the press.”"
        vocab:
          - {w: "acontecer", d: "to happen, occur"}
          - {w: "méritamente", d: "deservedly, by merit (a rare word; modern 'merecidamente')"}
          - {w: "granjear", d: "to earn, win, gain (goodwill, fame)"}
          - {w: "dar a la estampa", d: "to put into print, publish ('estampa' = print, the press)"}
          - {w: "del todo", d: "entirely, completely"}
          - {w: "menoscabar", d: "to diminish, impair, damage"}
        diagram:
          - {s: "No hay duda en eso", r: "main verb 1: there is no doubt of that"}
          - s: "pero muchas veces acontece"
            r: "main verb 2: but it often happens"
            under:
              - s: "que los ... la perdieron del todo"
                r: "what happens: that those lost it entirely"
                under:
                  - {s: "que tenían méritamente granjeada y alcanzada gran fama por sus escritos", r: "describes 'los': who had deservedly won great fame by their writings"}
                  - {s: "en dándolos a la estampa", r: "when: as soon as they put them into print"}
              - {s: "o la menoscabaron en algo", r: "what happens, 2: or damaged it somewhat"}
        forms:
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "acontece", f: "acontec- + -e → acontecer (to happen), present, it. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (used only in 'it' and 'they' forms)."}
          - {w: "tenían ... granjeada y alcanzada", f: "ten- + -ían → tener (to have), imperfect, they: tenía, tenías, tenía, teníamos, teníais, tenían. The participles granjeada (from granjear, to earn) and alcanzada (from alcanzar, to attain) agree, feminine, with 'fama': 'they had their fame won', an older way of saying 'habían granjeado'."}
          - {w: "méritamente", f: "mérit- + -a + -mente: adverb from the old adjective mérito (deserved); -mente is added to the feminine form."}
          - {w: "en dándolos", f: "gerund of dar (to give) + los (them, the writings), after 'en': 'on giving them, as soon as they gave them'. 'en' + gerund marks the moment just before the main action. The accent keeps the stress after 'los' is added."}
          - {w: "la perdieron, la menoscabaron", f: "perd- + -ieron → perder (to lose) and menoscab- + -aron → menoscabar (to impair), preterite, they; 'la' = it (la fama). The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
  - sentences:
      - es: "— La causa deso es —dijo Sansón— que, como las obras impresas se miran despacio, fácilmente se veen sus faltas, y tanto más se escudriñan cuanto es mayor la fama del que las compuso."
        literal: "— The cause of-that is —said Sansón— that, as the works printed themselves look slowly, easily themselves see their faults, and so-much more themselves scrutinize as-much-as is greater the fame of-the-one who them composed."
        ormsby: "“The reason of that,” said Samson, “is, that as printed works are examined leisurely, their faults are easily seen; and the greater the fame of the writer, the more closely are they scrutinised."
        vocab:
          - {w: "deso", d: "= de eso, of that (old contraction)"}
          - {w: "despacio", d: "slowly, at leisure"}
          - {w: "veen", d: "= ven, they see (old form)"}
          - {w: "falta", d: "fault, flaw (not only 'lack')"}
          - {w: "escudriñar", d: "to scrutinize, pore over, examine closely"}
          - {w: "tanto más ... cuanto", d: "all the more ... the more: 'the greater X, the more Y'"}
        diagram:
          - s: "La causa deso es"
            r: "main verb: the cause of that is"
            under:
              - {s: "dijo Sansón", r: "aside: said Sansón"}
              - s: "que ... fácilmente se veen sus faltas"
                r: "what it is, 1: that their faults are easily seen"
                under:
                  - {s: "como las obras impresas se miran despacio", r: "why: since printed works are looked at slowly"}
              - s: "y tanto más se escudriñan"
                r: "what it is, 2: and they are scrutinized all the more"
                under:
                  - {s: "cuanto es mayor la fama del que las compuso", r: "in proportion: the greater the fame of the one who wrote them"}
        forms:
          - {w: "deso", f: "de + eso contracted, the old spelling for 'de eso'."}
          - {w: "impresas", f: "irregular participle of imprimir (to print), feminine plural to match 'obras'."}
          - {w: "se miran", f: "mir- + -an → mirar (to look at), present, they, with 'se' making it passive: 'are looked at'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "se veen", f: "ve- + -en → ver (to see), present, they, with passive 'se': 'are seen'; veen is the old form of ven. Present: veo, ves, ve, vemos, veis, ven (old vees, vee, veen)."}
          - {w: "fácilmente", f: "fácil (easy) + -mente: adverb, 'easily'."}
          - {w: "se escudriñan", f: "escudriñ- + -an → escudriñar (to scrutinize), present, they, passive 'se'. Same -ar present as 'miran'."}
          - {w: "mayor", f: "comparative of grande (great): 'greater'."}
          - {w: "del que las compuso", f: "compus- + -o → componer (to compose), preterite, he; 'las' = them (las obras); del = de + el, 'of the one who'. Irregular preterite: compuse, compusiste, compuso, compusimos, compusisteis, compusieron."}
      - es: "Los hombres famosos por sus ingenios, los grandes poetas, los ilustres historiadores, siempre, o las más veces, son envidiados de aquellos que tienen por gusto y por particular entretenimiento juzgar los escritos ajenos, sin haber dado algunos propios a la luz del mundo."
        literal: "The men famous for their wits, the great poets, the illustrious historians, always, or the most times, are envied by those who have for pleasure and for particular entertainment to-judge the writings of-others, without having given any own to the light of-the world."
        ormsby: "Men famous for their genius, great poets, illustrious historians, are always, or most commonly, envied by those who take a particular delight and pleasure in criticising the writings of others, without having produced any of their own.”"
        vocab:
          - {w: "ingenio", d: "talent, wit, genius"}
          - {w: "las más veces", d: "most of the time, usually"}
          - {w: "envidiado de", d: "envied by ('de' marks the agent of a passive, where modern Spanish uses 'por')"}
          - {w: "tener por gusto", d: "to take pleasure in, make a hobby of"}
          - {w: "ajeno", d: "belonging to others"}
          - {w: "dar a la luz", d: "to bring out, publish (modern 'dar a luz' means to give birth)"}
        diagram:
          - s: "son envidiados"
            r: "main verb: are envied"
            under:
              - {s: "Los hombres famosos por sus ingenios, los grandes poetas, los ilustres historiadores", r: "subject: famous wits, great poets, illustrious historians"}
              - {s: "siempre, o las más veces", r: "how often: always, or most of the time"}
              - s: "de aquellos"
                r: "by whom: by those"
                under:
                  - {s: "que tienen por gusto y por particular entretenimiento juzgar los escritos ajenos", r: "describes 'aquellos': who make it their pleasure to judge others' writings"}
                  - {s: "sin haber dado algunos propios a la luz del mundo", r: "how: without having published any of their own"}
        forms:
          - {w: "famosos", f: "famos- + -os → famoso (famous), masculine plural to match 'hombres'."}
          - {w: "grandes poetas", f: "grand- + -es → grande (great), plural to match 'poetas', a masculine noun in -a."}
          - {w: "son envidiados", f: "son → ser (to be), present, they: soy, eres, es, somos, sois, son; + envidiados, participle of envidiar (to envy), masculine plural to match 'hombres': the passive 'are envied'."}
          - {w: "aquellos", f: "'those', masculine plural; the far demonstrative, used before a relative 'que'."}
          - {w: "tienen", f: "tien- + -en → tener (to have), present, they. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "juzgar", f: "juzgar (to judge), infinitive, the object of 'tienen por gusto': judging is what they take pleasure in."}
          - {w: "sin haber dado", f: "haber (to have), infinitive after 'sin', + dado, participle of dar (to give): the perfect infinitive 'without having given'."}
          - {w: "algunos propios", f: "algun- + -os → alguno (any) and propi- + -os → propio (own), masculine plural, standing for 'escritos': 'any of their own'."}
  - sentences:
      - es: "— Eso no es de maravillar —dijo don Quijote—, porque muchos teólogos hay que no son buenos para el púlpito, y son bonísimos para conocer las faltas o sobras de los que predican."
        literal: "— That not is of to-marvel —said Don Quijote—, because many theologians there-are who not are good for the pulpit, and are very-good for to-know the faults or excesses of those who preach."
        ormsby: "“That is no wonder,” said Don Quixote; “for there are many divines who are no good for the pulpit, but excellent in detecting the defects or excesses of those who preach.”"
        vocab:
          - {w: "no es de maravillar", d: "it is not to be wondered at, no wonder"}
          - {w: "teólogo", d: "theologian, divine (a university-trained churchman)"}
          - {w: "púlpito", d: "pulpit; preaching"}
          - {w: "bonísimo", d: "very good, excellent (old superlative of 'bueno'; modern 'buenísimo' or 'óptimo')"}
          - {w: "faltas o sobras", d: "faults or excesses, what is lacking or overdone (literally 'lacks or leftovers')"}
          - {w: "predicar", d: "to preach"}
        diagram:
          - s: "Eso no es de maravillar"
            r: "main verb: that is no wonder"
            under:
              - {s: "dijo don Quijote", r: "aside: said Don Quijote"}
              - s: "porque muchos teólogos hay"
                r: "why: because there are many theologians"
                under:
                  - {s: "que no son buenos para el púlpito", r: "describes 'teólogos', 1: who are no good at preaching"}
                  - s: "y son bonísimos para conocer las faltas o sobras"
                    r: "describes 'teólogos', 2: and are excellent at spotting faults or excesses"
                    under:
                      - {s: "de los que predican", r: "whose: of those who preach"}
        forms:
          - {w: "es", f: "es → ser (to be), present, it. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "de maravillar", f: "maravillar (to astonish), infinitive after 'de' with passive sense: 'to be wondered at'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "muchos teólogos hay", f: "hay → haber (to have), impersonal 'there are'; the object 'muchos teólogos' is put before it for emphasis."}
          - {w: "son", f: "son → ser (to be), present, they. Same: soy, eres, es, somos, sois, son."}
          - {w: "bonísimos", f: "bon- + -ísimos → bueno (good) with the superlative -ísimo, built on the Latin stem bon-, masculine plural to match 'teólogos'."}
          - {w: "conocer", f: "conocer (to know, recognize), infinitive after 'para'."}
          - {w: "predican", f: "predic- + -an → predicar (to preach), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
  - sentences:
      - es: "— Todo eso es así, señor don Quijote —dijo Carrasco—, pero quisiera yo que los tales censuradores fueran más misericordiosos y menos escrupulosos, sin atenerse a los átomos del sol clarísimo de la obra de que murmuran;"
        literal: "— All that is so, sir Don Quijote —said Carrasco—, but I-would-wish I that the such censurers were more merciful and less scrupulous, without keeping-themselves to the specks of-the sun very-bright of the work of which they-grumble;"
        ormsby: "“All that is true, Señor Don Quixote,” said Carrasco; “but I wish such faultfinders were more lenient and less exacting, and did not pay so much attention to the spots on the bright sun of the work they grumble at;"
        vocab:
          - {w: "tal", d: "'los tales' = such, those (pointing back)"}
          - {w: "censurador", d: "critic, faultfinder"}
          - {w: "misericordioso", d: "merciful, lenient"}
          - {w: "escrupuloso", d: "over-particular, finicky, exacting"}
          - {w: "atenerse a", d: "to fix on, keep to, dwell on"}
          - {w: "átomo", d: "speck, mote (the dust visible in a sunbeam), here a tiny flaw"}
          - {w: "murmurar de", d: "to grumble about, speak ill of, backbite"}
        diagram:
          - {s: "Todo eso es así", r: "main verb 1: all that is so"}
          - s: "pero quisiera yo"
            r: "main verb 2: but I would like"
            under:
              - {s: "dijo Carrasco", r: "aside: said Carrasco"}
              - s: "que los tales censuradores fueran más misericordiosos y menos escrupulosos"
                r: "what I would like: that such critics were more merciful and less finicky"
                under:
                  - s: "sin atenerse a los átomos del sol clarísimo de la obra"
                    r: "how: without dwelling on the specks in the bright sun of the work"
                    under:
                      - {s: "de que murmuran", r: "describes 'obra': which they grumble about"}
        forms:
          - {w: "es", f: "es → ser (to be), present, it. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "quisiera", f: "quis- + -iera → querer (to want), imperfect subjunctive (-ra form), I, used as a polite conditional: 'I would like'. quisiera, quisieras, quisiera, quisiéramos, quisierais, quisieran."}
          - {w: "fueran", f: "fuer- + -an → ser (to be), imperfect subjunctive (-ra form), they: subjunctive after a wish ('quisiera que'). fuera, fueras, fuera, fuéramos, fuerais, fueran."}
          - {w: "misericordiosos, escrupulosos", f: "-os endings: masculine plural to match 'censuradores'."}
          - {w: "atenerse", f: "atener (to hold) + se: atenerse (to keep to), infinitive after 'sin', with the pronoun hung on the end."}
          - {w: "clarísimo", f: "clar- + -ísimo → claro (bright) with the superlative -ísimo: 'very bright', masculine to match 'sol'."}
          - {w: "murmuran", f: "murmur- + -an → murmurar (to grumble), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
        note: "The 'atoms of the sun' are the motes that show up in a sunbeam: critics fix on these specks and ignore the light of the whole work, an image that leads into the Homer tag that follows."
      - es: "que si aliquando bonus dormitat Homerus, consideren lo mucho que estuvo despierto, por dar la luz de su obra con la menos sombra que pudiese;"
        literal: "for if sometimes good nods Homer, let-them-consider the much that he-was awake, for to-give the light of his work with the least shadow that he-could;"
        ormsby: "for if aliquando bonus dormitat Homerus, they should remember how long he remained awake to shed the light of his work with as little shade as possible;"
        vocab:
          - {w: "aliquando bonus dormitat Homerus", d: "Latin, 'sometimes good Homer nods': adapted from Horace, Ars Poetica 359 ('quandoque bonus dormitat Homerus'); even the greatest poet slips"}
          - {w: "considerar", d: "to bear in mind, reflect on"}
          - {w: "lo mucho que", d: "how much, how long"}
          - {w: "despierto", d: "awake"}
        diagram:
          - s: "consideren"
            r: "main verb: let them consider (after 'que', for)"
            under:
              - {s: "si aliquando bonus dormitat Homerus", r: "condition: if good Homer sometimes nods"}
              - s: "lo mucho que estuvo despierto"
                r: "object: how long he stayed awake"
                under:
                  - s: "por dar la luz de su obra"
                    r: "why: to give the light of his work"
                    under:
                      - {s: "con la menos sombra que pudiese", r: "how: with as little shadow as he could"}
        forms:
          - {w: "dormitat", f: "Latin dormitat → dormitare (to doze, nod), present, he: 'nods'."}
          - {w: "consideren", f: "consider- + -en → considerar (to consider), present subjunctive, they, used as a command: 'let them consider'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "estuvo", f: "estuv- + -o → estar (to be), preterite, he. Irregular: estuve, estuviste, estuvo, estuvimos, estuvisteis, estuvieron."}
          - {w: "dar", f: "dar (to give), infinitive after 'por', which here means 'in order to'."}
          - {w: "la menos sombra", f: "'the least shadow': 'menos' (less) with the article makes a superlative; it does not change for gender."}
          - {w: "pudiese", f: "pud- + -iese → poder (to be able), imperfect subjunctive (-se form), he: subjunctive after 'la menos ... que' (the least that). pudiese, pudieses, pudiese, pudiésemos, pudieseis, pudiesen."}
        note: "Horace wrote that he is vexed whenever good Homer nods; Carrasco turns the line round to defend Cervantes: think how long Homer stayed awake. 'Aliquando' for Horace's 'quandoque' is how the tag circulated in Cervantes' day."
      - es: "y quizá podría ser que lo que a ellos les parece mal fuesen lunares, que a las veces acrecientan la hermosura del rostro que los tiene;"
        literal: "and perhaps it-could be that that which to them to-them seems bad were moles, which at the times increase the beauty of-the face that them has;"
        ormsby: "and perhaps it may be that what they find fault with may be moles, that sometimes heighten the beauty of the face that bears them;"
        vocab:
          - {w: "quizá", d: "perhaps"}
          - {w: "parecer mal", d: "to seem bad, displease"}
          - {w: "lunar", d: "mole, beauty spot (from 'luna', moon)"}
          - {w: "a las veces", d: "sometimes (modern 'a veces')"}
          - {w: "acrecentar", d: "to increase, enhance"}
          - {w: "rostro", d: "face"}
        diagram:
          - s: "y quizá podría ser"
            r: "main verb: and perhaps it could be"
            under:
              - s: "que lo ... fuesen lunares"
                r: "what could be: that what ... were moles"
                under:
                  - {s: "que a ellos les parece mal", r: "describes 'lo': what seems bad to them"}
                  - s: "que a las veces acrecientan la hermosura del rostro"
                    r: "describes 'lunares': which sometimes enhance the beauty of the face"
                    under:
                      - {s: "que los tiene", r: "describes 'rostro': that has them"}
        forms:
          - {w: "podría", f: "podr- + -ía → poder (to be able), conditional, it. Irregular stem podr-: podría, podrías, podría, podríamos, podríais, podrían."}
          - {w: "a ellos les parece", f: "parec- + -e → parecer (to seem), present, it: parezco, pareces, parece, parecemos, parecéis, parecen. 'les' (to them) is doubled by 'a ellos' for emphasis."}
          - {w: "fuesen", f: "fues- + -en → ser (to be), imperfect subjunctive (-se form), they: plural to agree with 'lunares', not with 'lo que'. fuese, fueses, fuese, fuésemos, fueseis, fuesen. Subjunctive after 'podría ser que'."}
          - {w: "acrecientan", f: "acrecient- + -an → acrecentar (to increase), present, they. The stem e becomes ie when stressed: acreciento, acrecientas, acrecienta, acrecentamos, acrecentáis, acrecientan."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, it (the face). Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "los", f: "'them', masculine plural, standing for 'lunares'."}
      - es: "y así, digo que es grandísimo el riesgo a que se pone el que imprime un libro, siendo de toda imposibilidad imposible componerle tal, que satisfaga y contente a todos los que le leyeren."
        literal: "and so, I-say that is very-great the risk to which himself puts the-one who prints a book, being of all impossibility impossible to-compose-it such, that it-may-satisfy and may-content [to] all those who it may-read."
        ormsby: "and so I say very great is the risk to which he who prints a book exposes himself, for of all impossibilities the greatest is to write one that will satisfy and please all readers.”"
        vocab:
          - {w: "riesgo", d: "risk"}
          - {w: "ponerse a", d: "to expose oneself to"}
          - {w: "de toda imposibilidad imposible", d: "utterly impossible, impossible beyond all impossibility (a playful heaping-up)"}
          - {w: "satisfacer", d: "to satisfy"}
          - {w: "contentar", d: "to please, content"}
        diagram:
          - s: "digo"
            r: "main verb: I say"
            under:
              - {s: "y así", r: "linking: and so"}
              - s: "que es grandísimo el riesgo"
                r: "what I say: that the risk is very great"
                under:
                  - s: "a que se pone el"
                    r: "describes 'riesgo': to which he exposes himself"
                    under:
                      - {s: "que imprime un libro", r: "describes 'el': who prints a book"}
              - s: "siendo de toda imposibilidad imposible componerle tal"
                r: "why: since it is utterly impossible to compose one such"
                under:
                  - s: "que satisfaga y contente a todos los"
                    r: "result: that it satisfies and pleases all those"
                    under:
                      - {s: "que le leyeren", r: "describes 'los': who may read it"}
        forms:
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "grandísimo", f: "grand- + -ísimo → grande (great) with the superlative -ísimo, masculine to match 'riesgo'."}
          - {w: "se pone", f: "pon- + -e → ponerse (to put oneself), present, he: pongo, pones, pone, ponemos, ponéis, ponen."}
          - {w: "imprime", f: "imprim- + -e → imprimir (to print), present, he. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "siendo", f: "gerund of ser (to be): 'it being', giving the reason."}
          - {w: "componerle", f: "componer (to compose) + le (it, the book): the pronoun hung on the infinitive. 'le' for a thing is leísmo: Cervantes often uses 'le' where modern Spanish wants 'lo' for a masculine object."}
          - {w: "satisfaga, contente", f: "satisfag- + -a → satisfacer (to satisfy) and content- + -e → contentar (to please), present subjunctive, it, in a clause of result after 'tal que' describing a book that does not exist. satisfacer goes like hacer (to make): satisfaga, satisfagas, satisfaga, satisfagamos, satisfagáis, satisfagan. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "le leyeren", f: "ley- + -eren → leer (to read), future subjunctive, they: 'whoever may read it'; i between vowels becomes y. leyere, leyeres, leyere, leyéremos, leyereis, leyeren. Cervantes uses the future subjunctive for an open future; modern Spanish uses the present subjunctive 'lean'. 'le' = it (the book), leísmo."}
  - sentences:
      - es: "— El que de mí trata —dijo don Quijote—, a pocos habrá contentado."
        literal: "— The-one that of me treats —said Don Quijote—, to few it-will-have pleased."
        ormsby: "“That which treats of me must have pleased few,” said Don Quixote."
        vocab:
          - {w: "tratar de", d: "to deal with, be about"}
