      - es: "unos se atienen a la aventura de los molinos de viento, que a vuestra merced le parecieron Briareos y gigantes; otros, a la de los batanes;"
        literal: "some themselves hold to the adventure of the mills of wind, which to your grace to-you seemed Briareuses and giants; others, to the [one] of the fulling-mills;"
        ormsby: "some swear by the adventure of the windmills that your worship took to be Briareuses and giants; others by that of the fulling mills;"
        vocab:
          - {w: "atenerse a", d: "to stick to, hold to, prefer: 'se atienen a' = they swear by"}
          - {w: "molinos de viento", d: "windmills (Part I chapter 8)"}
          - {w: "vuestra merced", d: "'your grace', the polite address (the origin of modern 'usted'); takes 'he/she' verb forms"}
          - {w: "Briareo", d: "Briareus, the hundred-handed giant of Greek myth; Don Quijote called out 'more arms than the giant Briareus' at the windmills"}
          - {w: "batanes", d: "fulling mills: water-driven hammers that pound cloth; their thumping terrified Sancho all night in Part I chapter 20"}
        diagram:
          - s: "unos se atienen"
            r: "main verb 1: some hold to"
            under:
              - s: "a la aventura de los molinos de viento"
                r: "to what: to the windmills adventure"
                under:
                  - {s: "que a vuestra merced le parecieron Briareos y gigantes", r: "describes 'molinos': which seemed to you Briareuses and giants"}
          - s: "otros"
            r: "main clause 2, verb 'se atienen' understood: others"
            under:
              - {s: "a la de los batanes", r: "to what: to the one (adventure) of the fulling mills"}
        forms:
          - {w: "se atienen", f: "atien- + -en → atenerse (to hold to), present, they, with 'se' (themselves). Conjugated like tener (to have): me atengo, te atienes, se atiene, nos atenemos, os atenéis, se atienen."}
          - {w: "le parecieron", f: "parec- + -ieron → parecer (to seem), preterite, they (the mills), 'le' = to you (vuestra merced). The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron. 'a vuestra merced le' doubles the person: Spanish repeats an indirect object with 'le'."}
          - {w: "Briareos", f: "Briareo + -s: a proper name made plural, 'Briareuses', i.e. giants like Briareus."}
          - {w: "la de los batanes", f: "la = 'the one', feminine to stand for 'la aventura' without repeating it."}
        note: "Sansón lists the famous episodes of Part I, as readers of 1605 might have quoted them. Every item he names is in the book, so the characters now talk about Part I as a published work."
      - es: "éste, a la descripción de los dos ejércitos, que después parecieron ser dos manadas de carneros;"
        literal: "this-one, to the description of the two armies, which afterwards seemed to-be two flocks of rams;"
