                  - {s: "que tratan de caballerías", r: "describes 'las': which deal with chivalry"}
                  - {s: "las cuales nunca pueden estar llenas de prósperos sucesos", r: "describes 'las': which can never be full of happy outcomes"}
          - {s: "dijo don Quijote", r: "speech verb (aside): said Don Quijote"}
        forms:
          - {w: "imagino", f: "imagin- + -o → imaginar (to imagine), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "tenga", f: "teng- + -a → tener (to have), present subjunctive, it: subjunctive because the clause describes something said not to exist ('no hay ... que'). tenga, tengas, tenga, tengamos, tengáis, tengan."}
          - {w: "tratan", f: "trat- + -an → tratar (to deal with), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "las cuales", f: "'which', feminine plural to match 'las' (the histories); a heavier relative than 'que', used after a comma."}
