        vocab:
          - {w: "a esta sazón", d: "at this moment, just then"}
          - {w: "yangüeses", d: "the carriers from Yanguas whose mares Rocinante courted, and who beat knight and squire senseless (Part I chapter 15)"}
          - {w: "antojársele a uno", d: "to take a fancy, get a whim: 'se le antojó' = it took his fancy"}
          - {w: "pedir cotufas en el golfo", d: "proverb: to ask for dainties in the open sea, i.e. want impossible luxuries; 'cotufas' = earth-nuts, tidbits, treats"}
