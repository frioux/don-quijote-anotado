        forms:
          - {w: "volábanle", f: "vol- + -aban + le → volar (to fly), imperfect, they (the plumes), with 'le' (on him) stuck on the end and an accent added; modern 'le volaban'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. The verb is plural because its real subject is the plumes; the pronoun hangs on it because it opens the clause."}
