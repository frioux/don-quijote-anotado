        forms:
          - {w: "ha de ser", f: "h- + -a → haber (to have), present, it, + de + ser (to be): 'shall be, must be'. haber (to have) in the present: he, has, ha, hemos, habéis, han."}
          - {w: "ha de quedar", f: "ha, haber (to have), present, he (the loser): he, has, ha, hemos, habéis, han; + de + quedar (to remain): 'shall remain'."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
