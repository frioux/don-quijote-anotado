  - sentences:
      - es: "— Ya la sé —respondió don Quijote—; con tal que lo que se le impusiere y mandare al vencido han de ser cosas que no salgan de los límites de la caballería."
        literal: "— Already it I-know —answered Don Quijote—; provided that that which to-him may-be-imposed and may-be-commanded to-the vanquished have to be things that not may-go-out of the limits of the chivalry."
        ormsby: "“I am aware of it already,” said Don Quixote; “provided what is commanded and imposed upon the vanquished be things that do not transgress the limits of chivalry.”"
        vocab:
          - {w: "con tal que", d: "provided that"}
          - {w: "imponer", d: "to impose, lay upon"}
          - {w: "salir de los límites", d: "to go beyond the bounds"}
          - {w: "caballería", d: "chivalry, the order and code of knighthood"}
        diagram:
          - s: "Ya la sé"
            r: "main verb: I know it already"
            under:
              - {s: "respondió don Quijote", r: "speaker"}
              - s: "con tal que lo que se le impusiere y mandare al vencido"
                r: "condition: provided that what is laid on and ordered for the loser"
                under:
                  - s: "han de ser cosas"
                    r: "condition, verb: must be things"
                    under:
                      - {s: "que no salgan de los límites de la caballería", r: "describes 'cosas': that do not go beyond the bounds of chivalry"}
        forms:
          - {w: "la sé", f: "sé → saber (to know), present, I. Irregular: sé, sabes, sabe, sabemos, sabéis, saben. 'la' stands for 'la condición'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "se le impusiere", f: "impus- + -iere → imponer (to impose), future subjunctive, it, with 'se' making it passive and 'le' (on him) announcing 'al vencido': 'whatever may be imposed on him'. Built on the preterite impusieron: impusiere, impusieres, impusiere, impusiéremos, impusiereis, impusieren. Cervantes uses it for an open future after 'lo que', 'si', 'donde'; modern Spanish says 'imponga'."}
          - {w: "mandare", f: "mand- + -are → mandar (to command), future subjunctive, it: 'whatever may be ordered'. The future subjunctive of -ar verbs: -are, -ares, -are, -áremos, -areis, -aren; modern 'mande'."}
          - {w: "han de ser", f: "han → haber (to have), present, they: he, has, ha, hemos, habéis, han; 'haber de' (to have to) + infinitive = 'must': 'must be'. Plural because it looks ahead to 'cosas'."}
          - {w: "salgan", f: "salg- + -an → salir (to go out), present subjunctive, they (the things). salga, salgas, salga, salgamos, salgáis, salgan. Subjunctive because it describes the kind of things required."}
        note: "Don Quijote adds the usual chivalric limit: a defeated knight could be ordered to do anything honourable, but nothing against the code of knighthood."
  - sentences:
