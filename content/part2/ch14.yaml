          - {w: "le va", f: "va → ir (to go), present, it (my trick), with 'le' (to it, the other trick). ir (to go) in the present: voy, vas, va, vamos, vais, van."}
      - es: "cogeré yo un garrote, y, antes que vuestra merced llegue a despertarme la cólera, haré yo dormir a garrotazos de tal suerte la suya, que no despierte si no fuere en el otro mundo, en el cual se sabe que no soy yo hombre que me dejo manosear el rostro de nadie;"
        literal: "I-will-take I a cudgel, and, before that your grace may-come to awaken-me the anger, I-will-make I sleep with cudgel-blows in such manner the yours, that not it-may-wake if not it-be in the other world, in the which itself it-knows that not am I man who myself lets handle the face by nobody;"
        ormsby: "I will take a cudgel, and before your worship comes near enough to waken my anger I will send yours so sound to sleep with whacks, that it won’t waken unless it be in the other world, where it is known that I am not a man to let my face be handled by anyone;"
        vocab:
          - {w: "coger", d: "to take, seize"}
          - {w: "garrote", d: "cudgel, thick stick"}
          - {w: "a garrotazos", d: "with blows of a cudgel"}
          - {w: "llegar a", d: "to get to, manage to"}
          - {w: "de tal suerte ... que", d: "in such a way that"}
          - {w: "si no fuere", d: "unless it be"}
          - {w: "se sabe", d: "it is known, everybody knows"}
          - {w: "manosear", d: "to paw, handle roughly"}
        diagram:
          - s: "cogeré yo un garrote"
            r: "main verb 1: I will take a cudgel"
          - s: "haré yo dormir a garrotazos de tal suerte la suya"
            r: "main verb 2: I will so put yours (your anger) to sleep with cudgel blows"
            under:
              - {s: "antes que vuestra merced llegue a despertarme la cólera", r: "when: before you manage to rouse my anger"}
              - s: "que no despierte si no fuere en el otro mundo"
                r: "result: that it will not wake except in the next world"
                under:
                  - {s: "en el cual se sabe que no soy yo hombre que me dejo manosear el rostro de nadie", r: "describes 'el otro mundo': where it is known I'm not a man who lets anyone paw his face"}
        forms:
          - {w: "cogeré", f: "coger- + -é → coger (to take), future, I. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "llegue", f: "llegu- + -e → llegar (to get to), present subjunctive, you (vuestra merced, polite, takes the he/she form), after 'antes que'; g becomes gu before e. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "despertarme", f: "despertar (to awaken) + me (in me), the pronoun hung on the infinitive after 'a'."}
          - {w: "haré yo dormir", f: "har- + -é → hacer (to make), future, I: haré, harás, hará, haremos, haréis, harán; + dormir (to sleep), with the subject yo between them: 'I will put to sleep'."}
          - {w: "la suya", f: "'yours', feminine to match the understood 'cólera'; suyo is the possessive for vuestra merced."}
          - {w: "despierte", f: "despiert- + -e → despertar (to wake), present subjunctive, it, in the result clause. The stem e becomes ie when stressed: despierte, despiertes, despierte, despertemos, despertéis, despierten."}
          - {w: "fuere", f: "fu- + -ere → ser (to be), future subjunctive, it: 'unless it be'. ser (to be) in the future subjunctive: fuere, fueres, fuere, fuéremos, fuereis, fueren. Cervantes uses it after 'si' for an open future; modern Spanish says 'si no es'."}
          - {w: "se sabe", f: "sab- + -e → saber (to know), present, it, with 'se' making it impersonal: 'it is known'. saber (to know) in the present: sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "soy", f: "ser (to be), present, I. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "me dejo manosear", f: "dej- + -o → dejar (to let), present, I: dejo, dejas, deja, dejamos, dejáis, dejan; with 'me' (myself) + manosear (to handle): 'I let myself be pawed'. 'de nadie' = by anyone."}
        note: "Sancho's 'in the other world, where it is known' is a comic muddle: he means his reputation as a man who will not take a slap, and the threat is that the other's anger will wake up only after death."
      - es: "y cada uno mire por el virote, aunque lo más acertado sería dejar dormir su cólera a cada uno, que no sabe nadie el alma de nadie, y tal suele venir por lana que vuelve tresquilado;"
        literal: "and each one may-look for the bolt, although the most wise would-be to-let sleep his anger to each one, for not knows nobody the soul of nobody, and such-a-one is-wont to-come for wool that returns shorn;"
        ormsby: "let each look out for the arrow—though the surer way would be to let everyone’s anger sleep, for nobody knows the heart of anyone, and a man may come for wool and go back shorn;"
        ormsby_note: "Proverb 248. According to Covarrubias, a metaphor taken from rabbit-shooting with the crossbow, when each sportsman should confine his attention to looking for his own arrows, or, more properly, bolts, virotes. Proverb 124."
