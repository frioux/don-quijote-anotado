          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
  - sentences:
      - es: "Ofreciéronsele en esto a la vista de don Quijote las estrañas narices del escudero, y no se admiró menos de verlas que Sancho; tanto, que le juzgó por algún monstro, o por hombre nuevo y de aquellos que no se usan en el mundo."
        literal: "Offered-themselves-to-him at this to the sight of Don Quijote the strange noses of-the squire, and not himself he-marvelled less at seeing-them than Sancho; so-much, that him he-judged for some monster, or for man new and of those that not are-used in the world."
        ormsby: "At this moment the extraordinary nose of the squire presented itself to Don Quixote’s view, and he was no less amazed than Sancho at the sight; insomuch that he set him down as a monster of some kind, or a human being of some new species or unearthly breed."
        vocab:
          - {w: "ofrecerse a la vista", d: "to come into view, present itself to the eyes"}
          - {w: "en esto", d: "at this moment, meanwhile"}
          - {w: "estraño", d: "= extraño, strange, extraordinary (old spelling)"}
          - {w: "narices", d: "nose; Cervantes often uses the plural 'narices' for one nose"}
          - {w: "admirarse de", d: "to be amazed at, marvel at (not 'to admire')"}
          - {w: "juzgar por", d: "to judge to be, take for"}
          - {w: "monstro", d: "= monstruo, monster (old form)"}
          - {w: "de aquellos que no se usan", d: "of the kind not found, not current in the world"}
        diagram:
          - s: "Ofreciéronsele"
            r: "main verb 1: presented themselves to him"
            under:
              - {s: "en esto", r: "when: at this moment"}
              - {s: "a la vista de don Quijote", r: "to what: to Don Quijote's sight"}
              - {s: "las estrañas narices del escudero", r: "subject: the squire's extraordinary nose"}
          - s: "y no se admiró menos de verlas que Sancho"
            r: "main verb 2: and he was no less amazed at seeing it than Sancho"
            under:
              - s: "tanto, que le juzgó"
                r: "result: so much that he took him"
                under:
                  - {s: "por algún monstro", r: "for what, 1: for some monster"}
                  - {s: "o por hombre nuevo y de aquellos que no se usan en el mundo", r: "for what, 2: or for a new kind of man, of a sort not seen in the world"}
        forms:
          - {w: "Ofreciéronsele", f: "ofrec- + -ieron + se + le → ofrecerse (to present itself), preterite, they (the nostrils), with 'se' and 'le' (to him) stuck on the end and an accent added; modern 'se le ofrecieron'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron. Cervantes hangs the pronouns on a verb that opens its sentence."}
          - {w: "estrañas", f: "old spelling of extrañas (strange), feminine plural to match 'narices'."}
          - {w: "se admiró", f: "admir- + -ó → admirarse (to be amazed), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "verlas", f: "ver (to see) + las (them, the 'narices'), the pronoun hung on the infinitive after 'de'."}
          - {w: "juzgó", f: "juzg- + -ó → juzgar (to judge), preterite, he; g becomes gu before e (juzgué). Same -ó preterite: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "le", f: "'him' as a direct object of a male person (the squire), leísmo; standard in Cervantes and still accepted for men."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun ('monstro'), like un, buen, ningún."}
          - {w: "se usan", f: "us- + -an → usar (to use), present, they, with 'se' making it passive: 'are found, are current'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
        note: "Even Don Quijote, who sees giants in windmills, is startled by the nose. In Golden Age Spanish 'narices' in the plural is the normal word for one person's nose."
      - es: "Sancho, que vio partir a su amo para tomar carrera, no quiso quedar solo con el narigudo, temiendo que con solo un pasagonzalo con aquellas narices en las suyas sería acabada la pendencia suya, quedando del golpe, o del miedo, tendido en el suelo, y fuese tras su amo, asido a una acción de Rocinante;"
        literal: "Sancho, who saw depart his master to take run, not wanted to-remain alone with the big-nosed-one, fearing that with only one flick with those noses on his-own would-be finished the quarrel his, remaining from-the blow, or from-the fear, stretched on the ground, and went-himself after his master, gripping to a stirrup-strap of Rocinante;"
        ormsby: "Sancho, seeing his master retiring to run his course, did not like to be left alone with the nosy man, fearing that with one flap of that nose on his own the battle would be all over for him and he would be left stretched on the ground, either by the blow or with fright; so he ran after his master, holding on to Rocinante’s stirrup-leather,"
        vocab:
          - {w: "tomar carrera", d: "to ride off to gain room for a charge, take one's run"}
          - {w: "narigudo", d: "big-nosed; here 'the big-nosed fellow'"}
          - {w: "pasagonzalo", d: "a quick light blow, a flick, especially on the face"}
          - {w: "pendencia", d: "quarrel, fight"}
          - {w: "tendido", d: "stretched out, laid flat"}
          - {w: "irse tras", d: "to go after, follow"}
          - {w: "asido a", d: "holding on to, gripping"}
          - {w: "acción", d: "= ación, stirrup-leather, the strap the stirrup hangs from (old spelling)"}
        diagram:
          - s: "Sancho"
            r: "subject"
            under:
              - {s: "que vio partir a su amo para tomar carrera", r: "describes 'Sancho': who saw his master ride off to take his run"}
          - s: "no quiso quedar solo con el narigudo"
            r: "main verb 1: did not want to be left alone with the big-nosed man"
            under:
              - s: "temiendo"
                r: "why: fearing"
                under:
                  - {s: "que con solo un pasagonzalo con aquellas narices en las suyas sería acabada la pendencia suya", r: "what he feared: that one flick of that nose on his own would end his fight"}
                  - {s: "quedando del golpe, o del miedo, tendido en el suelo", r: "result: leaving him flat on the ground from the blow or from fright"}
          - s: "y fuese tras su amo"
            r: "main verb 2: and went after his master"
            under:
              - {s: "asido a una acción de Rocinante", r: "how: holding on to one of Rocinante's stirrup-leathers"}
        forms:
          - {w: "vio", f: "vi- + -o → ver (to see), preterite, he. Irregular: vi, viste, vio, vimos, visteis, vieron. After ver (to see) Spanish uses a bare infinitive: 'vio partir' = saw [him] leave."}
          - {w: "quiso", f: "quis- + -o → querer (to want), preterite, he; 'no quiso' = he refused. Irregular: quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "temiendo", f: "gerund of temer (to fear): 'fearing'."}
          - {w: "las suyas", f: "'his own', feminine plural to match 'narices' understood: 'on his own [nose]'."}
          - {w: "sería acabada", f: "ser- + -ía → ser (to be), conditional, it, + acabada, participle of acabar (to finish), feminine to match 'pendencia': 'would be finished'. The conditional adds -ía endings to the infinitive: sería, serías, sería, seríamos, seríais, serían."}
          - {w: "quedando", f: "gerund of quedar (to remain, be left): 'being left'."}
          - {w: "tendido", f: "participle of tender (to stretch out), masculine to match Sancho."}
          - {w: "fuese", f: "fu- + -e + se → ir (to go), preterite, he, with 'se' stuck on the end: irse (to go off); modern 'se fue'. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron. Not the -se subjunctive, though it looks like it; the pronoun hangs on because the verb opens its clause."}
          - {w: "asido", f: "participle of asir (to seize, grip), masculine to match Sancho: 'gripping'."}
        note: "'Fuese' here is 'fue' + 'se' (he went off), not the subjunctive 'fuese'; the context decides. Sancho's fear is that a mere flick of that huge nose against his own would knock him out."
