          - {w: "acertado", d: "wise, right, sensible"}
          - {w: "no sabe nadie el alma de nadie", d: "nobody knows anyone's heart: you never know what a man is capable of"}
          - {w: "tal", d: "here 'many a one, someone'"}
          - {w: "ir por lana y volver trasquilado", d: "proverb: to go for wool and come back shorn, to set out to get the better of someone and come off worse"}
          - {w: "tresquilado", d: "= trasquilado, shorn (old form)"}
