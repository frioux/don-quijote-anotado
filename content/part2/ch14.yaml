        note: "Sancho's terror is comic because the night before he was happily eating and drinking with this squire. 'Vestiglo' is a word from the romances of chivalry, used for the monsters knights fight."
  - sentences:
      - es: "Don Quijote miró a su contendor, y hallóle ya puesta y calada la celada, de modo que no le pudo ver el rostro, pero notó que era hombre membrudo, y no muy alto de cuerpo."
        literal: "Don Quijote looked at his opponent, and found-him already put-on and pulled-down the helmet, in such-a-way that not of-him he-could see the face, but he-noted that he-was [a] man brawny, and not very tall of body."
        ormsby: "Don Quixote examined his adversary, and found that he already had his helmet on and visor lowered, so that he could not see his face; he observed, however, that he was a sturdily built man, but not very tall in stature."
        vocab:
          - {w: "contendor", d: "= contendiente, opponent, adversary (old form)"}
          - {w: "celada", d: "sallet, a helmet with a visor that covers the face"}
          - {w: "calar", d: "to pull down (a helmet, a visor) over the face; also to lower a lance"}
          - {w: "de modo que", d: "so that, with the result that"}
          - {w: "membrudo", d: "brawny, strong-limbed"}
          - {w: "alto de cuerpo", d: "tall in stature"}
        diagram:
          - s: "Don Quijote miró a su contendor"
            r: "main verb 1: Don Quijote looked at his opponent"
          - s: "y hallóle"
            r: "main verb 2: and found him"
            under:
              - {s: "ya puesta y calada la celada", r: "in what state: with his helmet already on and pulled down"}
              - {s: "de modo que no le pudo ver el rostro", r: "result: so that he could not see his face"}
          - s: "pero notó"
            r: "main verb 3: but he noted"
            under:
              - {s: "que era hombre membrudo, y no muy alto de cuerpo", r: "what he noted: that he was a brawny man, not very tall"}
        forms:
          - {w: "miró", f: "mir- + -ó → mirar (to look at), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "hallóle", f: "hall- + -ó + le → hallar (to find), preterite, he, with 'le' (him) stuck on the end; modern 'le halló'. Same -ó preterite. Cervantes hangs the pronoun on a verb that opens its clause; 'le' for a male person as direct object is leísmo."}
          - {w: "puesta y calada", f: "puesta, irregular participle of poner (to put on), and calada, participle of calar (to pull down), both feminine to match 'la celada': 'his helmet already on and lowered'."}
          - {w: "pudo", f: "pud- + -o → poder (to be able), preterite, he. Irregular: pude, pudiste, pudo, pudimos, pudisteis, pudieron."}
          - {w: "notó", f: "not- + -ó → notar (to note), preterite, he. Same -ó preterite: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "era", f: "ser (to be), imperfect, he. Irregular: era, eras, era, éramos, erais, eran."}
        note: "Two plays on 'celada': it is the helmet, and also 'an ambush, a trap'. The knight keeps his face hidden for a reason the end of the chapter reveals."
      - es: "Sobre las armas traía una sobrevista o casaca de una tela, al parecer, de oro finísimo, sembradas por ella muchas lunas pequeñas de resplandecientes espejos, que le hacían en grandísima manera galán y vistoso;"
        literal: "Over the arms he-wore a surcoat or cassock of a cloth, to-the seeming, of gold very-fine, sown over it many moons small of shining mirrors, which him made in very-great manner gallant and showy;"
        ormsby: "Over his armour he wore a surcoat or cassock of what seemed to be the finest cloth of gold, all bespangled with glittering mirrors like little moons, which gave him an extremely gallant and splendid appearance;"
        vocab:
          - {w: "armas", d: "here 'armour', the knight's whole harness, not only weapons"}
          - {w: "sobrevista", d: "surcoat, a cloth tunic worn over armour, often showing the knight's device"}
          - {w: "casaca", d: "cassock, a long coat"}
          - {w: "al parecer", d: "apparently, to all appearances"}
          - {w: "sembrado", d: "sown, i.e. strewn, scattered all over"}
          - {w: "resplandeciente", d: "shining, glittering"}
          - {w: "espejo", d: "mirror"}
          - {w: "galán", d: "elegant, gallant, finely dressed"}
          - {w: "vistoso", d: "showy, eye-catching"}
        diagram:
          - s: "traía"
            r: "main verb: he wore"
            under:
              - {s: "Sobre las armas", r: "where: over his armour"}
              - s: "una sobrevista o casaca de una tela"
                r: "object: a surcoat or cassock of a cloth"
                under:
                  - {s: "al parecer, de oro finísimo", r: "describes 'tela': apparently of the finest gold"}
              - s: "sembradas por ella muchas lunas pequeñas de resplandecientes espejos"
                r: "how: with many little moons of shining mirror scattered over it"
                under:
                  - {s: "que le hacían en grandísima manera galán y vistoso", r: "describes 'lunas': which made him most splendid and showy"}
        forms:
          - {w: "traía", f: "tra- + -ía → traer (to bring, wear), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían. traer (to bring) is the usual verb for wearing clothes or armour in Cervantes."}
          - {w: "finísimo", f: "fin- + -ísimo → fino (fine) with the superlative -ísimo, 'very fine', masculine to match 'oro'."}
          - {w: "sembradas", f: "participle of sembrar (to sow), feminine plural to match 'lunas', which follow it: an absolute participle, 'many little moons being strewn over it'."}
          - {w: "ella", f: "'it', feminine because it stands for 'la tela' (or 'la sobrevista')."}
          - {w: "hacían", f: "hac- + -ían → hacer (to make), imperfect, they (the moons). Same -ía imperfect: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "grandísima", f: "grand- + -ísima → grande (great) with the superlative -ísima, feminine to match 'manera': 'in the highest degree'."}
        note: "The little round mirrors sewn over the surcoat give the knight his new name, the Knight of the Mirrors. The 'gold' is only 'al parecer', apparently, a hint that the splendour may be cheap."
      - es: "volábanle sobre la celada grande cantidad de plumas verdes, amarillas y blancas;"
        literal: "flew-to-him over the helmet great quantity of feathers green, yellow and white;"
        ormsby: "above his helmet fluttered a great quantity of plumes, green, yellow, and white,"
        vocab:
          - {w: "volar", d: "to fly; here to flutter, wave in the air"}
          - {w: "celada", d: "sallet, a helmet with a visor"}
