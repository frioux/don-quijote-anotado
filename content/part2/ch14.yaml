  - sentences:
      - es: "— A eso vos respondemos —dijo el de los Espejos— que parecéis, como se parece un huevo a otro, al mismo caballero que yo vencí; pero, según vos decís que le persiguen encantadores, no osaré afirmar si sois el contenido o no."
        literal: "— To that to-you we-answer —said the [one] of the Mirrors— that you-resemble, as resembles one egg to another, to-the same knight whom I vanquished; but, since you say that him persecute enchanters, not I-shall-dare to-affirm if you-are the contained-one or not."
        ormsby: "“To that we answer you,” said he of the Mirrors, “that you are as like the very knight I vanquished as one egg is like another, but as you say enchanters persecute you, I will not venture to say positively whether you are the said person or not.”"
        ormsby_note: "The formal commencement of the answer to a petition to the crown."
        vocab:
          - {w: "vos respondemos", d: "we answer you: 'vos' here is the old object pronoun (= os), and the royal 'we' parodies the formula of official replies"}
          - {w: "parecerse a", d: "to look like, resemble"}
          - {w: "como un huevo a otro", d: "as one egg is like another: as alike as two peas"}
          - {w: "según", d: "here 'since, given that, as'"}
          - {w: "perseguir", d: "to persecute, pursue"}
          - {w: "encantador", d: "enchanter, wizard"}
          - {w: "osar", d: "to dare"}
          - {w: "el contenido", d: "the person mentioned, the one in question (legal style; not 'the contents')"}
        diagram:
          - s: "A eso vos respondemos"
            r: "main verb: to that we answer you"
            under:
              - {s: "dijo el de los Espejos", r: "speaker"}
              - s: "que parecéis"
                r: "what we answer, 1: that you resemble"
                under:
                  - {s: "como se parece un huevo a otro", r: "how much: as one egg resembles another"}
                  - s: "al mismo caballero"
                    r: "whom: the very knight"
                    under:
                      - {s: "que yo vencí", r: "describes 'caballero': whom I defeated"}
          - s: "no osaré afirmar"
            r: "main verb 2 (after 'pero'): I shall not dare to state"
            under:
              - {s: "según vos decís que le persiguen encantadores", r: "why: since you say enchanters persecute him"}
              - {s: "si sois el contenido o no", r: "what: whether you are the man in question or not"}
        forms:
          - {w: "vos", f: "'vos' as an object pronoun, 'to you'; an old form that modern Spanish has replaced by 'os'. As a subject pronoun ('según vos decís') it is the courteous 'you'."}
          - {w: "respondemos", f: "respond- + -emos → responder (to answer), present, we: the formal 'we' of an official reply. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "parecéis", f: "parec- + -éis → parecer (to resemble), present, you (vos). parezco, pareces, parece, parecemos, parecéis, parecen."}
          - {w: "se parece", f: "parec- + -e → parecerse (to look like), present, it (an egg), with 'se'. Same present: parezco, pareces, parece, parecemos, parecéis, parecen."}
          - {w: "vencí", f: "venc- + -í → vencer (to defeat), preterite, I. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "decís", f: "dec- + -ís → decir (to say), present, you (vos). Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "persiguen", f: "persig- + -uen → perseguir (to persecute), present, they. The stem e becomes i when stressed, and gu is written g before o: persigo, persigues, persigue, perseguimos, perseguís, persiguen."}
          - {w: "le", f: "'him' as a direct object of a male person, leísmo; standard in Cervantes and still accepted for men."}
          - {w: "osaré", f: "osar- + -é → osar (to dare), future, I. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "sois", f: "ser (to be), present, you (vos). Irregular: soy, eres, es, somos, sois, son."}
        note: "The knight's reply mimics the dry formula of an official answer, with the royal 'we' and the legal 'el contenido' (the person named in the document). He politely accepts Don Quijote's own enchanter excuse rather than contradicting him."
