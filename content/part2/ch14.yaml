summary: |
  The Knight of the Grove tells Don Quijote of his lady, the peerless Casildea de Vandalia, who has sent him on impossible labours: to challenge the Giralda of Seville, to weigh the stone Bulls of Guisando, to plunge into the chasm of Cabra. Now she has ordered him to make every knight in Spain confess her beauty, and he boasts that he has already beaten the famous Don Quijote de la Mancha in single combat, so that all Don Quijote's glory has passed to him. Don Quijote keeps his temper, says that the man he beat must have been an enchanter in Don Quijote's shape, as his enemies changed Dulcinea into a peasant girl only days ago, and reveals who he is. The two agree to fight at daybreak, on condition that the loser shall be at the winner's disposal.

  They wake the squires. On the way to fetch the animals the Squire of the Grove says that in Andalusia the seconds fight while their principals do, and proposes a fight with linen bags, then with bags full of pebbles; Sancho refuses every offer, says he has no quarrel with a man he has eaten and drunk with, and threatens that if he is slapped awake to anger he will put the other's anger to sleep with a cudgel. Dawn breaks in a burst of pastoral prose, and the first thing Sancho sees is the other squire's enormous purple, warty nose, which sets him trembling.

  The Knight of the Grove, now seen in a surcoat covered with little mirrors and called the Knight of the Mirrors, refuses to raise his visor. While Don Quijote helps the frightened Sancho up into a cork tree, the Knight of the Mirrors charges, then halts because his horse can go no further; Don Quijote, spurring Rocinante into the only gallop of his life, catches him unready and throws him to the ground, where he lies as if dead.

  When Don Quijote unlaces the fallen knight's helmet he sees the face of the bachelor Sansón Carrasco, and takes it for the work of enchanters. Sancho advises him to run the sword through the man just in case, but the other squire, his false nose now in his pocket, turns out to be Tomé Cecial, Sancho's neighbour and old friend, and begs for his master's life. Sansón confesses that Dulcinea's old shoe is worth more than Casildea's beard, promises to present himself before her in El Toboso, and agrees that the knight he beat was not Don Quijote. Master and man ride on toward Zaragoza convinced that enchanters have been at work, and the history leaves them to tell who the Knight of the Mirrors and his squire really were.
context: |
  A knight's boast. The Knight of the Grove talks exactly like a hero of the romances of chivalry: a cruel lady sets him trials, he wanders Spain forcing knights to confess her beauty, and he claims that by beating the most famous knight he has taken all that knight's fame for himself. The trials are a Spanish joke on the labours of Hercules, which in the myth were imposed through the hostility of Juno, his stepmother ('madrina' here in the old sense): every one of them is impossible or absurd. The Giralda is the bell tower of Seville cathedral, crowned, as Ormsby notes, by a bronze statue of Faith that turns as a weathercock, so the 'giantess' never moves from her place yet is the most changeable woman in the world, and was 'conquered' when the north wind held her still for a week; 'Llegué, vila, y vencíla' is Caesar's 'veni, vidi, vici'. The Bulls of Guisando are ancient carved stone animals near El Tiemblo, in the province of Ávila; the sima de Cabra is a deep chasm in the Sierra de Cabra, south of Córdoba, which Ormsby thinks was probably an old mine shaft. The couplet 'tanto el vencedor es más honrado...' comes, Ormsby says, misquoted from the opening of Alonso de Ercilla's epic La Araucana.

  The double. The knight's description of the Don Quijote he defeated is exact, down to Rocinante, Sancho and Aldonza Lorenzo, because everyone has now read Part I; Don Quijote can only explain it by enchanters, the same explanation Sancho gave him for the peasant Dulcinea in chapter 10. Ormsby's text says the transformation of Dulcinea happened 'but ten hours since', where Cervantes' Spanish says 'not more than two days'. Casildea de Vandalia is a mock-heroic name made, the knight says, from Casilda of Andalusia, just as Dulcinea was made from Aldonza; 'Vandalia' plays on the old etymology of Andalusia from the Vandals.

  Duels and seconds. The Squire of the Grove claims that in Andalusia the 'padrinos', the seconds of a duel (Ormsby glosses the word so), fight each other while their principals fight, a custom of bravoes and ruffians rather than knights. Sancho answers like a villager: the worst penalty for staying out of the fight will surely be a couple of pounds of wax, the fine, Ormsby explains, that some fraternities imposed on absent members. His speech is a chain of proverbs (each look to his own arrow, many go for wool and come back shorn, God blessed peace and cursed quarrels), several of which appear in Ormsby's numbered list.

  The joust. The morning is described in the high pastoral style of the romances, with the dawn shaking pearls from her hair, and the next sentence brings the squire's monstrous nose. The joust itself is a parody of a real tilt: the knights 'take ground' to have room for a charge, the Knight of the Mirrors has his lance too heavy to put in its rest, his horse stops dead in mid-career, and Rocinante gallops for the only time in the whole history. The 'sobrevista' was a surcoat worn over armour; this one is covered with little mirrors, which give the knight his new name. Watching a dangerous fight from a cork tree is like watching the bulls from the safety of a scaffold, Don Quijote's own comparison with the bullfights held in town squares.

  The unmasking. Under the helmet is the face of Sansón Carrasco, the bachelor from Salamanca who brought news of the printed Part I in chapters 3 and 4 and encouraged Don Quijote to set out for the jousts of Zaragoza; his squire is Tomé Cecial, a neighbour of Sancho's from the village and his 'compadre', a word for a close friend, often a godparent's tie, that Ormsby renders 'gossip'. Sancho's first advice, to kill the man in case he is an enchanter, and Don Quijote's agreement ('of enemies, the fewer the better', another proverb) show how far the enchantment story now protects both of them from the evidence of their eyes. Why the bachelor is in the wood is left for the next chapter.

  Reading Cervantes' Spanish. The chapter is full of old forms: trujo and trujese (trajo, trajese), estremo (extremo), mesmo and asimesmo (mismo, asimismo), escura (oscura), inumerables (innumerables), fechos (hechos), ascuras (a oscuras), convenencia (conveniencia), docientas (doscientas), monstro (monstruo), contendor (contendiente), estrañas (extrañas), priesa (prisa), pespetiva (perspectiva), manifatura (manufactura), compatrioto (compatriota), empero (pero) and asaz (enough, very), with the contractions dél, dello, desto, desta, desa and dellos. Pronouns hang on a verb that opens a clause (Llámola, vila, vencíla, hícela, despeñéme, reportóse, póngolo, Dígolo, Despertáronlos, hallóle, reíanse, Ofreciéronsele, paróse, Ayudóle), and the future can still be split around a pronoun (ayudarte he, 'I will help you'). The future subjunctive marks an open future (vagaren, quisiere, ordenare, agradare, riñeren, resultare, tardare, impusiere, oyeren, viniere, dejare, estuviere, hubiéredes), and the -ra form can stand for a conditional ('también me asombraran'). The knights use vos with its old plural-looking verb forms (sepáis, decís, dijistes, vencistes, tardárades, quedárades), while the squires move between vos and vuesa merced, the worn-down vuestra merced. Watch the false friends: razones (words, talk), discurrir (to roam), encontrar (to charge at, in a joust), compadre (close friend and neighbour) and faldriquera (a pocket, not a skirt).
