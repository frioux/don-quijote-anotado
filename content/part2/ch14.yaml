          - {w: "se le ordenare", f: "orden- + -are → ordenar (to order), future subjunctive, it, with 'se' making it passive ('is ordered') and 'le' (to him): 'what may be ordered him'. The future subjunctive of -ar verbs: -are, -ares, -are, -áremos, -areis, -aren; modern Spanish would say 'se le ordene'."}
        note: "The condition that the loser must obey the winner, within the bounds of knighthood, is insisted on by the Knight of the Grove, and he will repeat it before the charge: what the victor may demand is clearly what interests him."
