  - sentences:
      - es: "Todo lo miró y todo lo notó don Quijote, y juzgó de lo visto y mirado que el ya dicho caballero debía de ser de grandes fuerzas; pero no por eso temió, como Sancho Panza; antes, con gentil denuedo, dijo al Caballero de los Espejos:"
        literal: "All it he-looked-at and all it he-noted Don Quijote, and he-judged from the seen and looked-at that the already said knight must of be of great strengths; but not for that he-feared, like Sancho Panza; rather, with gallant boldness, he-said to-the Knight of the Mirrors:"
        ormsby: "Don Quixote observed all, and took note of all, and from what he saw and observed he concluded that the said knight must be a man of great strength, but he did not for all that give way to fear, like Sancho Panza; on the contrary, with a composed and dauntless air, he said to the Knight of the Mirrors,"
        vocab:
          - {w: "lo visto y mirado", d: "what had been seen and looked at"}
          - {w: "el ya dicho", d: "the aforesaid, the one already mentioned"}
          - {w: "deber de", d: "must (probability): 'debía de ser' = he must be"}
          - {w: "no por eso", d: "not for all that"}
          - {w: "antes", d: "here 'rather, on the contrary', not 'before'"}
          - {w: "gentil", d: "fine, gallant, noble (not 'gentile', nor only 'gentle')"}
          - {w: "denuedo", d: "boldness, daring"}
          - {w: "Caballero de los Espejos", d: "the Knight of the Mirrors: the Knight of the Grove's new name, from the little mirrors on his surcoat"}
        diagram:
          - s: "Todo lo miró y todo lo notó don Quijote"
            r: "main verb 1: Don Quijote looked at it all and noted it all"
          - s: "y juzgó"
            r: "main verb 2: and judged"
            under:
              - {s: "de lo visto y mirado", r: "from what: from what he had seen and observed"}
              - {s: "que el ya dicho caballero debía de ser de grandes fuerzas", r: "what he judged: that the said knight must be very strong"}
          - s: "pero no por eso temió"
            r: "main verb 3: but for all that he did not fear"
            under:
              - {s: "como Sancho Panza", r: "compare: as Sancho did"}
          - s: "dijo al Caballero de los Espejos:"
            r: "main verb 4: he said to the Knight of the Mirrors"
            under:
              - {s: "antes", r: "linking: on the contrary"}
              - {s: "con gentil denuedo", r: "how: with gallant boldness"}
        forms:
          - {w: "Todo lo miró", f: "'todo' put first for emphasis and repeated by 'lo' (it): 'all of it he looked at'. mir- + -ó → mirar (to look at), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "notó, juzgó", f: "not- + -ó → notar (to note) and juzg- + -ó → juzgar (to judge), preterite, he. Each takes the -ar preterite: noté, notaste, notó, notamos, notasteis, notaron; juzgué, juzgaste, juzgó, juzgamos, juzgasteis, juzgaron (g → gu before e)."}
          - {w: "lo visto y mirado", f: "'lo' + participle makes an abstract noun: 'what was seen and looked at'. visto, irregular participle of ver (to see); mirado, participle of mirar (to look at)."}
          - {w: "dicho", f: "irregular participle of decir (to say): 'el ya dicho caballero' = the aforesaid knight."}
          - {w: "debía", f: "deb- + -ía → deber (must), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían. 'Deber de' (must) + infinitive marks a guess: 'he must be'."}
          - {w: "temió", f: "tem- + -ió → temer (to fear), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "al", f: "a + el, the contraction modern Spanish still makes."}
        note: "From here on the narrator calls the Knight of the Grove 'el Caballero de los Espejos' (the Knight of the Mirrors), after the mirrors on his surcoat; knights in the romances often changed their names with their devices. 'De lo visto y mirado' echoes the doublet 'todo lo miró y todo lo notó' just before."
  - sentences:
      - es: "— Si la mucha gana de pelear, señor caballero, no os gasta la cortesía, por ella os pido que alcéis la visera un poco, porque yo vea si la gallardía de vuestro rostro responde a la de vuestra disposición."
        literal: "— If the much desire of fighting, sir knight, not to-you wears-out the courtesy, by it of-you I-ask that you-raise the visor a little, so-that I may-see if the gallantry of your face corresponds to that of your figure."
        ormsby: "“If, sir knight, your great eagerness to fight has not banished your courtesy, by it I would entreat you to raise your visor a little, in order that I may see if the comeliness of your countenance corresponds with that of your equipment.”"
        vocab:
          - {w: "gana de", d: "desire, eagerness to"}
          - {w: "gastar", d: "to spend, use up, wear out"}
          - {w: "por ella os pido", d: "by it (your courtesy) I ask you: a formal plea, 'in the name of your courtesy'"}
          - {w: "visera", d: "visor, the movable front of a helmet that covers the face"}
          - {w: "porque", d: "here 'so that' (with the subjunctive), not 'because'"}
          - {w: "gallardía", d: "fine looks, elegance, gallantry"}
          - {w: "responder a", d: "to match, correspond to"}
          - {w: "disposición", d: "build, bearing, figure (not 'disposition, temperament')"}
        diagram:
          - s: "os pido"
            r: "main verb: I ask you"
            under:
              - s: "Si la mucha gana de pelear"
                r: "condition: if your great eagerness to fight"
                under:
                  - {s: "no os gasta la cortesía", r: "condition, verb: has not used up your courtesy"}
              - {s: "por ella", r: "by what: by that courtesy"}
              - {s: "que alcéis la visera un poco", r: "what I ask: that you raise your visor a little"}
              - s: "porque yo vea"
                r: "purpose: so that I may see"
                under:
                  - {s: "si la gallardía de vuestro rostro responde a la de vuestra disposición", r: "what I may see: whether your face is as fine as your figure"}
        forms:
          - {w: "gasta", f: "gast- + -a → gastar (to wear out), present, it (the eagerness). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "os", f: "'you, to you', the pronoun for vos/vosotros; Don Quijote addresses the knight with the courteous 'vos'."}
          - {w: "pido", f: "pid- + -o → pedir (to ask), present, I. The stem e becomes i when stressed: pido, pides, pide, pedimos, pedís, piden."}
          - {w: "alcéis", f: "alc- + -éis → alzar (to raise), present subjunctive, you (vos); z becomes c before e. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en (alce, alces, alce, alcemos, alcéis, alcen). Subjunctive after 'pido que'."}
          - {w: "vea", f: "ve- + -a → ver (to see), present subjunctive, I, after 'porque' meaning 'so that'. ver (to see) in the present subjunctive: vea, veas, vea, veamos, veáis, vean."}
          - {w: "responde", f: "respond- + -e → responder (to correspond), present, it. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "la de vuestra disposición", f: "'la' stands for 'la gallardía': 'that of your figure'. Spanish drops the repeated noun and keeps the article."}
        note: "Don Quijote's request is in the most formal chivalric style. Etiquette allowed a knight to ask an opponent to show his face before or after a fight."
  - sentences:
      - es: "— O vencido o vencedor que salgáis desta empresa, señor caballero —respondió el de los Espejos—, os quedará tiempo y espacio demasiado para verme;"
        literal: "— Either vanquished or victor that you-may-come-out of-this enterprise, sir knight —answered the [one] of the Mirrors—, to-you will-remain time and space too-much to see-me;"
