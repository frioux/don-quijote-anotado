                  - s: "el cual"
                    r: "describes 'señor': who"
                    under:
                      - {s: "apeándose de Rocinante", r: "how: dismounting from Rocinante"}
                      - {s: "fue sobre el de los Espejos", r: "his verb: went over to the Knight of the Mirrors"}
                      - s: "quitándole las lazadas del yelmo"
                        r: "how: undoing the laces of his helmet"
                        under:
                          - {s: "para ver si era muerto", r: "why 1: to see if he was dead"}
                          - {s: "y para que le diese el aire si acaso estaba vivo", r: "why 2: so that the air might reach him if he was alive"}
          - {s: "y vio...", r: "main verb 3: and he saw (the sentence breaks off)"}
        forms:
          - {w: "vio", f: "vi- + -o → ver (to see), preterite, he. Irregular: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "caído", f: "participle of caer (to fall), masculine to match 'le' (the knight): 'saw him fallen'."}
          - {w: "se deslizó", f: "desliz- + -ó → deslizarse (to slide down), preterite, he, with 'se'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "vino", f: "vin- + -o → venir (to come), preterite, he. Irregular: vine, viniste, vino, vinimos, vinisteis, vinieron."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "apeándose", f: "gerund of apear (to set down) + se (himself): 'dismounting'; accent added to keep the stress on -pe-."}
          - {w: "fue", f: "fu- + -e → ir (to go), preterite, he. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron (the same forms serve for ser (to be))."}
          - {w: "quitándole", f: "gerund of quitar (to take off) + le (from him): 'taking off him'; accent added."}
          - {w: "era muerto", f: "er- + -a → ser (to be), imperfect, he: era, eras, era, éramos, erais, eran; old usage 'ser muerto' where modern Spanish says 'estar muerto'."}
          - {w: "diese", f: "di- + -ese → dar (to give), imperfect subjunctive (-se form), it (the air), after 'para que'. dar (to give) in the -se imperfect subjunctive: diese, dieses, diese, diésemos, dieseis, diesen."}
          - {w: "le", f: "'to him', indirect object: 'that the air might give to him', i.e. reach him."}
        note: "The sentence is deliberately left hanging on 'y vio...' so that the narrator can step in with a rhetorical question before revealing what Don Quijote saw."
      - es: "¿Quién podrá decir lo que vio, sin causar admiración, maravilla y espanto a los que lo oyeren?"
        literal: "Who will-be-able to-say that which he-saw, without causing wonder, marvel and fright to those who it may-hear?"
        ormsby: "—who can say what he saw, without filling all who hear it with astonishment, wonder, and awe?"
        ormsby_match: false
        vocab:
          - {w: "admiración", d: "wonder, astonishment (false friend: not 'admiration')"}
          - {w: "maravilla", d: "marvel, wonder"}
          - {w: "espanto", d: "fright, terror; also amazement"}
        diagram:
          - s: "¿Quién podrá decir"
            r: "main verb: who will be able to say"
            under:
