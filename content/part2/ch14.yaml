        ormsby: "Don Quixote was amazed when he heard the Knight of the Grove, and was a thousand times on the point of telling him he lied, and had the lie direct already on the tip of his tongue; but he restrained himself as well as he could, in order to force him to confess the lie with his own lips; so he said to him quietly,"
