          - {w: "proponer", d: "to resolve, make up one's mind"}
          - {w: "docientas", d: "= doscientas, two hundred (old form)"}
          - {w: "bofetada", d: "slap in the face, buffet"}
          - {w: "cólera", d: "anger, rage (the hot humour of the body)"}
