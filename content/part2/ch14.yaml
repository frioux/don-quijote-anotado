                  - {s: "dejar dormir su cólera a cada uno", r: "what would be wisest: to let each man's anger sleep"}
                  - {s: "que no sabe nadie el alma de nadie", r: "why: for nobody knows anyone's heart"}
          - s: "y tal suele venir por lana"
