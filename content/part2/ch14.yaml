part: 2
chapter: 14
title_es: "Capítulo XIV. Donde se prosigue la aventura del Caballero del Bosque"
title_en: "Wherein is continued the adventure of the Knight of the Grove"
paragraphs:
  - sentences:
      - es: "Entre muchas razones que pasaron don Quijote y el Caballero de la Selva, dice la historia que el del Bosque dijo a don Quijote:"
        literal: "Among many words that passed Don Quijote and the Knight of the Forest, says the history that the [one] of-the Grove said to Don Quijote:"
        ormsby: "Among the things that passed between Don Quixote and the Knight of the Wood, the history tells us he of the Grove said to Don Quixote,"
        vocab:
          - {w: "razones", d: "words, remarks, talk (not 'reasons' here)"}
          - {w: "pasar razones", d: "to exchange words, talk together"}
          - {w: "selva", d: "wood, forest; 'Caballero de la Selva' is just another name for the Knight of the Grove ('del Bosque')"}
          - {w: "el del Bosque", d: "'the one of the Grove': the Knight of the Grove, named by his title without the noun"}
        diagram:
          - s: "dice la historia"
            r: "main verb: the history says"
            under:
              - s: "Entre muchas razones"
                r: "when: among many words"
                under:
                  - {s: "que pasaron don Quijote y el Caballero de la Selva", r: "describes 'razones': that Don Quijote and the Knight of the Forest exchanged"}
              - s: "que el del Bosque dijo a don Quijote:"
                r: "what it says: that the one of the Grove said to Don Quijote"
        forms:
          - {w: "muchas", f: "much- + -as → mucho (many), feminine plural to match 'razones'."}
          - {w: "pasaron", f: "pas- + -aron → pasar (to pass, exchange), preterite, they (the two knights). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "dice", f: "dic- + -e → decir (to say), present, it (the history). Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes: 'el del Bosque' = the [knight] of the Grove."}
        note: "The chapter resumes the knights' night-time conversation from chapter 13, which had followed the squires. The narrator calls the stranger both 'Caballero de la Selva' and 'del Bosque' (forest, grove) in the same breath."
  - sentences:
      - es: "— Finalmente, señor caballero, quiero que sepáis que mi destino, o, por mejor decir, mi elección, me trujo a enamorar de la sin par Casildea de Vandalia."
        literal: "— Finally, sir knight, I-want that you-may-know that my destiny, or, for better to-say, my choice, me brought to fall-in-love with the without peer Casildea de Vandalia."
        ormsby: "“In fine, sir knight, I would have you know that my destiny, or, more properly speaking, my choice led me to fall in love with the peerless Casildea de Vandalia."
        vocab:
          - {w: "finalmente", d: "in short, to come to the point (not only 'at last')"}
          - {w: "por mejor decir", d: "or rather, to put it better"}
          - {w: "trujo", d: "= trajo, brought (old form of the preterite of traer)"}
          - {w: "enamorar de", d: "to fall in love with; modern Spanish says 'enamorarse de'"}
          - {w: "sin par", d: "peerless, matchless; the stock epithet of a romance heroine"}
          - {w: "Casildea de Vandalia", d: "the lady of the Knight of the Grove, an invented name made to sound like Dulcinea del Toboso; 'Vandalia' plays on Andalucía"}
        diagram:
          - s: "quiero"
            r: "main verb: I want"
            under:
              - {s: "Finalmente, señor caballero", r: "opening and address: in short, sir knight"}
              - s: "que sepáis"
                r: "what I want: that you know"
                under:
                  - s: "que mi destino, o, por mejor decir, mi elección, me trujo"
                    r: "what you should know: that my destiny, or rather my choice, brought me"
                    under:
                      - {s: "a enamorar de la sin par Casildea de Vandalia", r: "to what: to fall in love with the peerless Casildea de Vandalia"}
        forms:
          - {w: "quiero", f: "quier- + -o → querer (to want), present, I. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "sepáis", f: "sep- + -áis → saber (to know), present subjunctive, you (vos, said to one person politely): sepa, sepas, sepa, sepamos, sepáis, sepan. Subjunctive after 'quiero que'. Knights address each other as 'vos' with the plural verb form, the old courteous address."}
          - {w: "decir", f: "infinitive of decir (to say) after 'por' in the set phrase 'por mejor decir', 'or rather'."}
          - {w: "trujo", f: "truj- + -o → traer (to bring), preterite, it (my destiny). Old form of trajo: truje, trujiste, trujo, trujimos, trujisteis, trujeron (modern traje, trajiste, trajo, trajimos, trajisteis, trajeron)."}
          - {w: "enamorar", f: "infinitive of enamorar (to make fall in love), after 'a'; here with the sense of 'enamorarse' (to fall in love)."}
      - es: "Llámola sin par porque no le tiene, así en la grandeza del cuerpo como en el estremo del estado y de la hermosura."
        literal: "I-call-her without peer because not it she-has, as-much in the greatness of-the body as in the extreme of-the rank and of the beauty."
        ormsby: "I call her peerless because she has no peer, whether it be in bodily stature or in the supremacy of rank and beauty."
        vocab:
          - {w: "así ... como", d: "both A and B: 'así en A como en B' = as much in A as in B"}
          - {w: "grandeza del cuerpo", d: "tallness, bodily size"}
          - {w: "estremo", d: "= extremo, the highest degree, supremacy (old spelling)"}
          - {w: "estado", d: "rank, social standing (not 'state' in the political sense)"}
        diagram:
          - s: "Llámola sin par"
            r: "main verb: I call her peerless"
            under:
              - s: "porque no le tiene"
                r: "why: because she has none (no peer)"
                under:
                  - {s: "así en la grandeza del cuerpo", r: "in what, 1: in bodily size"}
                  - {s: "como en el estremo del estado y de la hermosura", r: "in what, 2: as in the height of rank and beauty"}
        forms:
          - {w: "Llámola", f: "llam- + -o + la → llamar (to call), present, I, with 'la' (her) stuck on the end; modern 'la llamo'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. Cervantes hangs the pronoun on a verb that opens the sentence."}
          - {w: "le tiene", f: "tien- + -e → tener (to have), present, she: tengo, tienes, tiene, tenemos, tenéis, tienen; 'le' stands for 'par' (a peer), a thing referred to with 'le' where modern Spanish says 'lo' (leísmo)."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
          - {w: "estremo", f: "= extremo; Cervantes often writes s for x before a consonant (estraño, estremo)."}
        note: "A pun on 'sin par': she is peerless because she has no 'par' (peer, equal). The Knight of the Grove talks in the polished, rather mannered style of the romances, as Don Quijote does."
      - es: "Esta tal Casildea, pues, que voy contando, pagó mis buenos pensamientos y comedidos deseos con hacerme ocupar, como su madrina a Hércules, en muchos y diversos peligros, prometiéndome al fin de cada uno que en el fin del otro llegaría el de mi esperanza;"
        literal: "This such Casildea, then, whom I-go telling [of], paid my good thoughts and modest desires with making-me be-occupied, as his stepmother [did] to Hercules, in many and diverse dangers, promising-me at-the end of each one that at the end of-the next would-arrive that of my hope;"
        ormsby: "This same Casildea, then, that I speak of, requited my honourable passion and gentle aspirations by compelling me, as his stepmother did Hercules, to engage in many perils of various sorts, at the end of each promising me that, with the end of the next, the object of my hopes should be attained;"
        vocab:
          - {w: "esta tal", d: "this same, this very (lady I mention)"}
          - {w: "ir contando", d: "to be telling, to be speaking of (the gerund with 'ir' (to go) shows an action in progress)"}
          - {w: "pagar con", d: "to repay with, requite with"}
          - {w: "comedido", d: "modest, restrained, courteous"}
          - {w: "madrina", d: "here 'stepmother'; usually 'godmother'"}
          - {w: "Hércules", d: "Hercules, the Greek hero; Juno (Hera), his father Jupiter's wife, hated him and drove him into perils, and he performed twelve labours at King Eurystheus' command"}
          - {w: "el de mi esperanza", d: "'that of my hope': the end (fulfilment) of my hope; 'el' stands for 'el fin'"}
        diagram:
          - s: "pagó mis buenos pensamientos y comedidos deseos"
            r: "main verb: repaid my good thoughts and modest desires"
            under:
              - s: "Esta tal Casildea"
                r: "subject: this same Casildea"
                under:
                  - {s: "pues, que voy contando", r: "describes 'Casildea': then, whom I am speaking of"}
              - s: "con hacerme ocupar"
                r: "how: by making me busy myself"
                under:
                  - {s: "como su madrina a Hércules", r: "comparison: as his stepmother did Hercules"}
                  - {s: "en muchos y diversos peligros", r: "in what: in many and various dangers"}
              - s: "prometiéndome al fin de cada uno"
                r: "how, 2: promising me at the end of each one"
                under:
                  - {s: "que en el fin del otro llegaría el de mi esperanza", r: "what she promised: that at the end of the next would come the end of my hope"}
        forms:
          - {w: "Esta", f: "est- + -a → este (this), feminine to match 'Casildea'."}
          - {w: "voy contando", f: "voy, from ir (to go), present, I: voy, vas, va, vamos, vais, van; + contando, gerund of contar (to tell): 'I am telling of', an action in progress."}
          - {w: "pagó", f: "pag- + -ó → pagar (to pay), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "comedidos", f: "comed- + -idos → comedido (modest), participle of comedir (to restrain) used as an adjective, masculine plural to match 'deseos'."}
          - {w: "hacerme ocupar", f: "hacer (to make) + me (me), the pronoun hung on the infinitive after 'con'; + ocupar (to occupy, keep busy): 'making me be busied'. 'hacer' + infinitive = to make someone do something."}
          - {w: "prometiéndome", f: "gerund of prometer (to promise) + me (to me), accent added to keep the stress on -tién-."}
          - {w: "llegaría", f: "llegar- + -ía → llegar (to arrive), conditional, it. The conditional adds endings to the whole infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
        note: "Juno, Jove's wife, persecuted Hercules all his life; his twelve labours were set by his cousin Eurystheus. Cervantes' 'madrina' (stepmother) is Juno, the hero's father's wife."
      - es: "pero así se han ido eslabonando mis trabajos, que no tienen cuento, ni yo sé cuál ha de ser el último que dé principio al cumplimiento de mis buenos deseos."
        literal: "but so themselves have gone linking my labours, that not they-have count, nor I know which has to be the last that may-give beginning to-the fulfilment of my good desires."
        ormsby: "but my labours have gone on increasing link by link until they are past counting, nor do I know what will be the last one that is to be the beginning of the accomplishment of my chaste desires."
        vocab:
          - {w: "eslabonar", d: "to link together like a chain ('eslabón' = link)"}
          - {w: "trabajos", d: "labours, hardships, trials (the word used of Hercules' labours)"}
          - {w: "no tener cuento", d: "to be countless, past counting"}
          - {w: "haber de", d: "to be bound to, to be going to"}
          - {w: "dar principio a", d: "to begin, start off"}
          - {w: "cumplimiento", d: "fulfilment, accomplishment"}
        diagram:
          - s: "pero así se han ido eslabonando mis trabajos"
            r: "main clause 1: but my labours have gone on linking up so"
            under:
              - {s: "que no tienen cuento", r: "result: that they are past counting"}
          - s: "ni yo sé"
            r: "main clause 2: nor do I know"
            under:
              - s: "cuál ha de ser el último"
                r: "what I don't know: which is to be the last"
                under:
                  - {s: "que dé principio al cumplimiento de mis buenos deseos", r: "describes 'el último': that will begin the fulfilment of my good desires"}
        forms:
          - {w: "se han ido eslabonando", f: "han, from haber (to have), present, they: he, has, ha, hemos, habéis, han; + ido, participle of ir (to go); + eslabonando, gerund of eslabonar (to link) with 'se': 'have gone on linking themselves', a gradual action."}
          - {w: "tienen", f: "tien- + -en → tener (to have), present, they. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "sé", f: "saber (to know), present, I. Irregular: sé, sabes, sabe, sabemos, sabéis, saben. The accent tells it from 'se'."}
          - {w: "ha de ser", f: "ha, from haber (to have), present, it: he, has, ha, hemos, habéis, han; + de + ser (to be): 'is to be'."}
          - {w: "dé", f: "dar (to give), present subjunctive, it. dé, des, dé, demos, deis, den. Subjunctive because the 'last' labour is still unknown."}
          - {w: "al", f: "a + el, the contraction modern Spanish still makes."}
      - es: "Una vez me mandó que fuese a desafiar a aquella famosa giganta de Sevilla llamada la Giralda, que es tan valiente y fuerte como hecha de bronce, y, sin mudarse de un lugar, es la más movible y voltaria mujer del mundo."
        literal: "One time me she-ordered that I-should-go to challenge [to] that famous giantess of Seville called the Giralda, who is as valiant and strong as [if] made of bronze, and, without moving-herself from one place, is the most movable and fickle woman of-the world."
        ormsby: "On one occasion she bade me go and challenge the famous giantess of Seville, La Giralda by name, who is as mighty and strong as if made of brass, and though never stirring from one spot, is the most restless and changeable woman in the world."
        ormsby_note: "The colossal statue of Faith that acts as weathercock on the top of the great Moorish tower of the same name which serves as belfry to the Cathedral at Seville."
        vocab:
          - {w: "desafiar", d: "to challenge (to combat)"}
          - {w: "giganta", d: "giantess"}
          - {w: "la Giralda", d: "the bell tower of Seville cathedral, a former Moorish minaret, crowned by a bronze statue of Faith that turns with the wind; 'girar' = to turn"}
          - {w: "valiente", d: "here 'mighty, sturdy' as well as 'brave'"}
          - {w: "mudarse", d: "to move, shift (one's place)"}
          - {w: "movible", d: "changeable, movable"}
          - {w: "voltario", d: "fickle, inconstant (literary; from 'voltar', to turn)"}
        diagram:
          - s: "Una vez me mandó"
            r: "main verb: once she ordered me"
            under:
              - s: "que fuese a desafiar a aquella famosa giganta de Sevilla"
                r: "what she ordered: that I go and challenge that famous giantess of Seville"
                under:
                  - {s: "llamada la Giralda", r: "describes 'giganta': called the Giralda"}
                  - s: "que es tan valiente y fuerte como hecha de bronce"
                    r: "describes 'giganta', 1: who is as sturdy and strong as if made of bronze"
                  - s: "y, sin mudarse de un lugar, es la más movible y voltaria mujer del mundo"
                    r: "describes 'giganta', 2: and, never moving from one spot, is the most changeable and fickle woman in the world"
        forms:
          - {w: "mandó", f: "mand- + -ó → mandar (to order), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "fuese", f: "fu- + -ese → ir (to go), imperfect subjunctive (-se form), I: fuese, fueses, fuese, fuésemos, fueseis, fuesen. Subjunctive after 'mandó que' (ordered that); the same forms serve for ser (to be)."}
          - {w: "aquella", f: "aquell- + -a → aquel (that), feminine to match 'giganta'."}
          - {w: "giganta", f: "gigant- + -a → gigante (giant) given a feminine ending: 'giantess'."}
          - {w: "llamada", f: "participle of llamar (to call), feminine to match 'giganta': 'called'."}
          - {w: "es", f: "ser (to be), present, she: soy, eres, es, somos, sois, son."}
          - {w: "hecha", f: "irregular participle of hacer (to make), feminine to match 'giganta': 'made'."}
          - {w: "mudarse", f: "mudar (to change, move) + se (herself), the pronoun hung on the infinitive after 'sin'."}
          - {w: "la más movible", f: "'the most changeable': Spanish makes the superlative with the article + más."}
        note: "The joke is that the 'giantess' is a weathervane: a bronze woman who never leaves her tower yet turns with every wind, the image of female fickleness."
      - es: "Llegué, vila, y vencíla, y hícela estar queda y a raya, porque en más de una semana no soplaron sino vientos nortes."
        literal: "I-arrived, I-saw-her, and I-conquered-her, and I-made-her be still and in check, because in more than one week not blew but winds north."
        ormsby: "I came, I saw, I conquered, and I made her stay quiet and behave herself, for nothing but north winds blew for more than a week."
        vocab:
          - {w: "llegué, vila, y vencíla", d: "a parody of Julius Caesar's 'veni, vidi, vici' (I came, I saw, I conquered)"}
          - {w: "quedo", d: "still, quiet (old adjective; 'estar queda' = to keep still)"}
          - {w: "a raya", d: "in check, within bounds ('tener a raya' = to keep in line)"}
          - {w: "no ... sino", d: "nothing but, only"}
          - {w: "viento norte", d: "north wind; 'nortes' here is used like an adjective agreeing with 'vientos'"}
        diagram:
          - s: "Llegué, vila, y vencíla"
            r: "main verbs 1-3: I came, I saw her, and I conquered her"
          - s: "y hícela estar queda y a raya"
            r: "main verb 4: and I made her keep still and in check"
            under:
              - s: "porque en más de una semana no soplaron sino vientos nortes"
                r: "why: because for over a week only north winds blew"
        forms:
          - {w: "Llegué", f: "llegu- + -é → llegar (to arrive), preterite, I; g becomes gu before e to keep the hard sound. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "vila", f: "vi + la → ver (to see), preterite, I, with 'la' (her) stuck on the end; modern 'la vi'. ver (to see) in the preterite: vi, viste, vio, vimos, visteis, vieron. Cervantes hangs the pronoun on a verb that opens its clause."}
          - {w: "vencíla", f: "venc- + -í + la → vencer (to conquer), preterite, I, with 'la' (her) stuck on the end; modern 'la vencí'. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "hícela", f: "hic- + -e + la → hacer (to make), preterite, I, with 'la' (her) stuck on the end; modern 'la hice'. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron. 'hacer' + infinitive ('estar') = to make someone do something."}
          - {w: "queda", f: "qued- + -a → quedo (still), feminine to match 'la' (the Giralda)."}
          - {w: "soplaron", f: "sopl- + -aron → soplar (to blow), preterite, they (the winds). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
        note: "A weathervane that stays still means the wind did not change: he takes the credit for a week of steady north wind."
      - es: "Vez también hubo que me mandó fuese a tomar en peso las antiguas piedras de los valientes Toros de Guisando, empresa más para encomendarse a ganapanes que a caballeros."
        literal: "Time also there-was that me she-ordered [that] I-should-go to take in weight the ancient stones of the valiant Bulls of Guisando, enterprise more for entrusting-itself to porters than to knights."
        ormsby: "Another time I was ordered to lift those ancient stones, the mighty bulls of Guisando, an enterprise that might more fitly be entrusted to porters than to knights."
        ormsby_note: "Rude stone figures of animals resembling the hippopotamus rather than the bull, the origin of which is a disputed point among Spanish antiquarians. They are not, however, confined to Guisando; there are, for instance, four well-preserved specimens at Avila."
        vocab:
          - {w: "vez hubo que", d: "there was a time when, once"}
          - {w: "tomar en peso", d: "to lift bodily, to weigh by lifting"}
          - {w: "Toros de Guisando", d: "four ancient granite carvings of bulls (or boars) at Guisando, in the province of Ávila, made in pre-Roman times"}
          - {w: "empresa", d: "enterprise, undertaking (here a feat, not a business)"}
          - {w: "encomendar", d: "to entrust, commend; 'encomendarse a' = to be entrusted to"}
          - {w: "ganapán", d: "street porter, odd-job man who carries loads for hire"}
        diagram:
          - s: "Vez también hubo"
            r: "main verb: there was also a time"
            under:
              - s: "que me mandó"
                r: "describes 'vez': when she ordered me"
                under:
                  - s: "fuese a tomar en peso las antiguas piedras de los valientes Toros de Guisando"
                    r: "what she ordered ('que' left out): that I go and lift the ancient stones of the mighty Bulls of Guisando"
                    under:
                      - {s: "empresa más para encomendarse a ganapanes que a caballeros", r: "comment on the task: a job fitter for porters than for knights"}
        forms:
          - {w: "hubo", f: "hub- + -o → haber (to have; here 'there to be'), preterite, it: 'there was'. Irregular: hube, hubiste, hubo, hubimos, hubisteis, hubieron."}
          - {w: "mandó", f: "mand- + -ó → mandar (to order), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "fuese", f: "fu- + -ese → ir (to go), imperfect subjunctive (-se form), I: fuese, fueses, fuese, fuésemos, fueseis, fuesen. After 'mandó' the 'que' is left out, as Cervantes often does after verbs of ordering and asking."}
          - {w: "antiguas", f: "antigu- + -as → antiguo (ancient), feminine plural to match 'piedras'."}
          - {w: "encomendarse", f: "encomendar (to entrust) + se, hung on the infinitive after 'para'; the 'se' makes it passive: 'to be entrusted'."}
          - {w: "ganapanes", f: "ganapán (porter) + -es, plural; the written accent drops because the stress no longer falls on a final syllable. The word is built from 'gana' (earns) + 'pan' (bread)."}
      - es: "Otra vez me mandó que me precipitase y sumiese en la sima de Cabra, peligro inaudito y temeroso, y que le trujese particular relación de lo que en aquella escura profundidad se encierra."
        literal: "Another time me she-ordered that myself I-should-hurl and should-plunge into the chasm of Cabra, danger unheard-of and fearful, and that to-her I-should-bring particular account of that which in that dark depth itself encloses."
        ormsby: "Again, she bade me fling myself into the cavern of Cabra, an unparalleled and awful peril, and bring her a minute account of all that is concealed in those gloomy depths."
        ormsby_note: "A chasm in the Sierra de Cabra, south of Cordova, probably the shaft of an ancient mine."
        vocab:
          - {w: "precipitarse", d: "to hurl oneself, throw oneself headlong"}
          - {w: "sumirse", d: "to sink, plunge into"}
          - {w: "sima de Cabra", d: "a deep natural pit near Cabra, in the province of Córdoba, famous in Cervantes' day as bottomless"}
          - {w: "inaudito", d: "unheard-of"}
          - {w: "temeroso", d: "fearful, frightening (here 'causing fear', not 'afraid')"}
          - {w: "trujese", d: "= trajese, should bring (old form of traer)"}
          - {w: "particular relación", d: "a detailed account ('relación' = report, account; 'particular' = detailed)"}
          - {w: "escuro", d: "= oscuro, dark (old spelling)"}
          - {w: "encerrarse", d: "to be shut up, lie hidden"}
        diagram:
          - s: "Otra vez me mandó"
            r: "main verb: another time she ordered me"
            under:
