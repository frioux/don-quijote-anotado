          - {w: "vencido / vencedor", d: "the vanquished / the victor"}
          - {w: "quedar a la voluntad de", d: "to be at the disposal, the mercy of"}
          - {w: "hacer de alguien lo que quisiere", d: "to do with someone whatever one pleases"}
