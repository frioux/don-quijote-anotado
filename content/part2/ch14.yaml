          - {w: "son", f: "ser (to be), present, they. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "a no ser yo quien soy", f: "a + infinitive as a condition: 'a no ser' (ser, to be) = 'if it were not that'. soy → ser (to be), present, I: soy, eres, es, somos, sois, son. 'Yo soy quien soy' is Don Quijote's proud formula: 'I am who I am'."}
          - {w: "asombraran", f: "asombr- + -aran → asombrar (to frighten), imperfect subjunctive (-ra form), they, used as a conditional: 'they would frighten'. The -ra imperfect subjunctive of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran. Cervantes often uses the -ra form where modern Spanish puts the conditional 'asombrarían'."}
          - {w: "ven", f: "ven → venir (to come), imperative, you (tú): the short irregular form, like 'pon', 'ten', 'sal'."}
          - {w: "ayudarte he", f: "the future ayudaré (I will help) split in two: ayudar (to help) + te (you) + he (haber (to have), present, I). The future was once infinitive + present of haber (to have): he, has, ha, hemos, habéis, han; Cervantes can still slip the pronoun between them. Modern 'te ayudaré'."}
          - {w: "dices", f: "dic- + -es → decir (to say), present, you (tú). Irregular: digo, dices, dice, decimos, decís, dicen."}
        note: "'Ayudarte he' shows how the Spanish future was built: infinitive + 'he' (I have). By Cervantes' time the split form was already old-fashioned, used for a solemn or archaic tone."
