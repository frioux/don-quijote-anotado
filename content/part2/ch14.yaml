  - sentences:
      - es: "— Suplico a vuesa merced, señor mío, que antes que vuelva a encontrarse me ayude a subir sobre aquel alcornoque, de donde podré ver más a mi sabor, mejor que desde el suelo, el gallardo encuentro que vuesa merced ha de hacer con este caballero."
        literal: "— I-beg your grace, sir mine, that before that you-turn to charge-yourself me you-help to climb onto that cork-oak, from where I-shall-be-able to-see more at my pleasure, better than from the ground, the gallant encounter that your grace has to make with this knight."
        ormsby: "“I implore of your worship, señor, before you turn to charge, to help me up into this cork tree, from which I will be able to witness the gallant encounter your worship is going to have with this knight, more to my taste and better than from the ground.”"
        vocab:
          - {w: "suplicar", d: "to beg, implore"}
          - {w: "vuesa merced", d: "= vuestra merced, your grace, your worship (worn-down form; modern 'usted')"}
          - {w: "volver a encontrarse", d: "to turn back and charge (with the opponent)"}
          - {w: "alcornoque", d: "cork oak"}
          - {w: "a mi sabor", d: "to my liking, at my ease"}
          - {w: "gallardo", d: "gallant, fine, brave"}
          - {w: "encuentro", d: "clash, charge (of two jousters), not 'meeting'"}
        diagram:
          - s: "Suplico a vuesa merced"
            r: "main verb: I beg your worship"
            under:
              - {s: "señor mío", r: "addressed: my lord"}
              - s: "que antes que vuelva a encontrarse me ayude a subir sobre aquel alcornoque"
                r: "what I beg: that before you turn to charge you help me up into that cork oak"
                under:
                  - s: "de donde podré ver"
                    r: "describes 'alcornoque': from where I shall be able to see"
                    under:
                      - {s: "más a mi sabor, mejor que desde el suelo", r: "how: more at my ease, better than from the ground"}
                      - s: "el gallardo encuentro"
                        r: "what: the gallant clash"
                        under:
                          - {s: "que vuesa merced ha de hacer con este caballero", r: "describes 'encuentro': which your worship is to have with this knight"}
        forms:
          - {w: "Suplico", f: "suplic- + -o → suplicar (to beg), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "vuelva", f: "vuelv- + -a → volver (to turn back), present subjunctive, you (vuesa merced takes 'he/she' endings). The stem o becomes ue when stressed: vuelva, vuelvas, vuelva, volvamos, volváis, vuelvan. Subjunctive after 'antes que'."}
          - {w: "encontrarse", f: "encontrar (to charge, clash) + se (with each other), infinitive after 'volver a'."}
          - {w: "ayude", f: "ayud- + -e → ayudar (to help), present subjunctive, you (vuesa merced). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. Subjunctive after 'suplico que'."}
          - {w: "podré", f: "podr- + -é → poder (to be able), future, I. Irregular stem podr-: podré, podrás, podrá, podremos, podréis, podrán."}
          - {w: "ha de hacer", f: "ha → haber (to have), present, you (vuesa merced): he, has, ha, hemos, habéis, han; 'haber de' (to have to) + infinitive = 'is to, will': 'are going to have'."}
          - {w: "este", f: "'this', masculine to match 'caballero'; aquel (that) is used for the farther tree."}
        note: "Sancho uses the polite 'vuesa merced' with third-person verbs, as a servant does; Don Quijote answers him with the familiar 'tú'. His excuse of a better view hides his fear of the squire."
  - sentences:
      - es: "— Antes creo, Sancho —dijo don Quijote—, que te quieres encaramar y subir en andamio por ver sin peligro los toros."
        literal: "— Rather I-believe, Sancho —said Don Quijote—, that yourself you-want to-perch and climb onto scaffold to see without danger the bulls."
        ormsby: "“It seems to me rather, Sancho,” said Don Quixote, “that thou wouldst mount a scaffold in order to see the bulls without danger.”"
        vocab:
          - {w: "antes", d: "here 'rather, on the contrary', not 'before'"}
          - {w: "encaramarse", d: "to climb up, perch high"}
          - {w: "andamio", d: "scaffold; here the wooden stands put up in a town square to watch a bullfight"}
          - {w: "ver los toros desde el andamio", d: "to watch the bulls from the stands: to look on at a danger from a safe place"}
        diagram:
          - s: "Antes creo"
            r: "main verb: rather, I believe"
            under:
              - {s: "dijo don Quijote", r: "speaker"}
              - s: "que te quieres encaramar y subir en andamio"
                r: "what I believe: that you want to climb up onto a stand"
                under:
                  - {s: "por ver sin peligro los toros", r: "why: to watch the bulls without danger"}
        forms:
          - {w: "creo", f: "cre- + -o → creer (to believe), present, I. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "te quieres encaramar", f: "quier- + -es → querer (to want), present, you (tú). The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren; + encaramar (to climb) with 'te' (yourself) placed before the whole group; modern Spanish also allows 'quieres encaramarte'."}
          - {w: "por ver", f: "ver (to see), infinitive after 'por' meaning 'in order to'."}
        note: "In the bullfights of the time the stands (andamios) were built around a town square, and 'ver los toros desde el andamio' meant watching danger from safety. Don Quijote sees through Sancho's excuse."
  - sentences:
      - es: "— La verdad que diga —respondió Sancho—, las desaforadas narices de aquel escudero me tienen atónito y lleno de espanto, y no me atrevo a estar junto a él."
