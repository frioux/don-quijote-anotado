  - sentences:
      - es: "— Confieso —dijo el caído caballero— que vale más el zapato descosido y sucio de la señora Dulcinea del Toboso que las barbas mal peinadas, aunque limpias, de Casildea, y prometo de ir y volver de su presencia a la vuestra, y daros entera y particular cuenta de lo que me pedís."
        literal: "— I-confess —said the fallen knight— that is-worth more the shoe unstitched and dirty of the lady Dulcinea of Toboso than the beards badly combed, though clean, of Casildea, and I-promise of going and returning from her presence to the yours, and to-give-you whole and particular account of that which from-me you-ask."
        ormsby: "“I confess,” said the fallen knight, “that the dirty tattered shoe of the lady Dulcinea del Toboso is better than the ill-combed though clean beard of Casildea; and I promise to go and to return from her presence to yours, and to give you a full and particular account of all you demand of me.”"
        vocab:
          - {w: "valer más", d: "to be worth more, be better"}
          - {w: "descosido", d: "unstitched, coming apart at the seams"}
          - {w: "barbas", d: "beard (plural for one beard, as with 'narices')"}
          - {w: "peinado", d: "combed"}
          - {w: "dar cuenta de", d: "to give an account of, report on"}
          - {w: "entero y particular", d: "full and detailed"}
        diagram:
          - s: "Confieso"
            r: "main verb 1: I confess"
            under:
              - {s: "dijo el caído caballero", r: "speaker: said the fallen knight"}
              - s: "que vale más el zapato descosido y sucio de la señora Dulcinea del Toboso"
                r: "what I confess: that the torn, dirty shoe of the lady Dulcinea is worth more"
                under:
                  - {s: "que las barbas mal peinadas, aunque limpias, de Casildea", r: "compared with: than the ill-combed though clean beard of Casildea"}
          - s: "y prometo de ir y volver de su presencia a la vuestra"
            r: "main verb 2: and I promise to go and come back from her presence to yours"
            under:
              - s: "y daros entera y particular cuenta"
                r: "what I promise, 2: and to give you a full, detailed account"
                under:
                  - {s: "de lo que me pedís", r: "of what: of what you ask of me"}
        forms:
          - {w: "Confieso, prometo", f: "confies- + -o → confesar (to confess), present, I: confieso, confiesas, confiesa, confesamos, confesáis, confiesan (stem e → ie when stressed). promet- + -o → prometer (to promise), present, I: prometo, prometes, promete, prometemos, prometéis, prometen."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "caído", f: "participle of caer (to fall), used as an adjective before 'caballero': 'the fallen knight'."}
          - {w: "vale", f: "val- + -e → valer (to be worth), present, it. Irregular in the I form: valgo, vales, vale, valemos, valéis, valen."}
          - {w: "descosido", f: "des- (un-) + cos- + -ido → participle of coser (to sew): 'unsewn', masculine to match 'zapato'."}
          - {w: "peinadas, limpias", f: "peinadas, participle of peinar (to comb), and limpi- + -as → limpio (clean), feminine plural to match 'barbas'."}
          - {w: "la vuestra", f: "'yours', feminine to stand for 'presencia': 'from her presence to yours'."}
          - {w: "daros", f: "dar (to give) + os (to you, vos), the pronoun hung on the infinitive."}
          - {w: "pedís", f: "ped- + -ís → pedir (to ask), present, you (vos). The stem e becomes i when stressed: pido, pides, pide, pedimos, pedís, piden."}
        note: "The defeated knight goes further than asked: Dulcinea's dirty shoe is worth more than Casildea's beard. Giving his own lady a 'beard' is a comic insult, hinting that Casildea is no lady at all."
  - sentences:
      - es: "— También habéis de confesar y creer —añadió don Quijote— que aquel caballero que vencistes no fue ni pudo ser don Quijote de la Mancha, sino otro que se le parecía, como yo confieso y creo que vos, aunque parecéis el bachiller Sansón Carrasco, no lo sois, sino otro que le parece, y que en su figura aquí me le han puesto mis enemigos, para que detenga y temple el ímpetu de mi cólera, y para que use blandamente de la gloria del vencimiento."
        literal: "— Also you-have to confess and believe —added Don Quijote— that that knight whom you-conquered not was nor could be Don Quijote of La Mancha, but another who himself to-him resembled, as I confess and believe that you, though you-look-like the bachelor Sansón Carrasco, not it you-are, but another who him resembles, and that in his figure here to-me him have put my enemies, so-that I-may-hold-back and temper the impetus of my anger, and so-that I-may-use gently of the glory of-the victory."
        ormsby: "“You must also confess and believe,” added Don Quixote, “that the knight you vanquished was not and could not be Don Quixote of La Mancha, but someone else in his likeness, just as I confess and believe that you, though you seem to be the bachelor Samson Carrasco, are not so, but some other resembling him, whom my enemies have here put before me in his shape, in order that I may restrain and moderate the vehemence of my wrath, and make a gentle use of the glory of my victory.”"
        vocab:
          - {w: "parecerse a", d: "to look like, resemble; 'otro que se le parecía' = someone else who looked like him"}
          - {w: "detener", d: "to hold back, check"}
          - {w: "templar", d: "to temper, moderate"}
          - {w: "ímpetu", d: "impetus, violence, rush"}
          - {w: "cólera", d: "anger, wrath (originally the hot humour, choler)"}
          - {w: "blandamente", d: "gently, mildly"}
          - {w: "usar de", d: "to make use of, exercise"}
          - {w: "vencimiento", d: "victory, the act of defeating someone"}
        diagram:
          - s: "También habéis de confesar y creer"
            r: "main verb: you must also confess and believe"
            under:
              - {s: "añadió don Quijote", r: "speaker: added Don Quijote"}
              - s: "que aquel caballero que vencistes no fue ni pudo ser don Quijote de la Mancha"
                r: "what to confess: that the knight you beat was not and could not be Don Quijote"
                under:
                  - {s: "sino otro que se le parecía", r: "but: but someone else who looked like him"}
              - s: "como yo confieso y creo"
                r: "comparison: just as I confess and believe"
                under:
                  - s: "que vos, aunque parecéis el bachiller Sansón Carrasco, no lo sois"
                    r: "what I believe, 1: that you, though you look like Carrasco, are not him"
                    under:
                      - {s: "sino otro que le parece", r: "but: but someone else who looks like him"}
                  - s: "y que en su figura aquí me le han puesto mis enemigos"
                    r: "what I believe, 2: and that my enemies have put him here before me in Carrasco's shape"
                    under:
                      - {s: "para que detenga y temple el ímpetu de mi cólera", r: "why 1: so that I may check and calm my rage"}
                      - {s: "y para que use blandamente de la gloria del vencimiento", r: "why 2: and so that I use my victory mildly"}
        forms:
          - {w: "habéis de confesar", f: "hab- + -éis → haber (to have), present, you (vos): he, has, ha, hemos, habéis, han; + de + confesar (to confess): 'haber de' = must."}
          - {w: "añadió", f: "añad- + -ió → añadir (to add), preterite, he. The preterite of -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "vencistes", f: "venc- + -istes → vencer (to defeat), preterite, you (vos). Old vos ending -istes, modern -isteis: vencí, venciste, venció, vencimos, vencistes (vencisteis), vencieron."}
          - {w: "fue, pudo", f: "fu- + -e → ser (to be), preterite, he: fui, fuiste, fue, fuimos, fuisteis, fueron. pud- + -o → poder (to be able), preterite, he: pude, pudiste, pudo, pudimos, pudisteis, pudieron."}
          - {w: "se le parecía", f: "parec- + -ía → parecerse (to resemble), imperfect, he, with 'se' and 'le' (to him): 'who resembled him'. The imperfect of -er verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "confieso, creo", f: "confies- + -o → confesar (to confess), present, I: confieso, confiesas, confiesa, confesamos, confesáis, confiesan. cre- + -o → creer (to believe), present, I: creo, crees, cree, creemos, creéis, creen."}
          - {w: "parecéis, parece", f: "parec- + -éis / -e → parecer (to look like), present, you (vos) and he. The present: parezco, pareces, parece, parecemos, parecéis, parecen."}
          - {w: "lo sois", f: "sois → ser (to be), present, you (vos): soy, eres, es, somos, sois, son; 'lo' (it) repeats the predicate: 'you are not [him]'."}
          - {w: "me le han puesto", f: "h- + -an → haber (to have), present, they: he, has, ha, hemos, habéis, han; + puesto, irregular participle of poner (to put): 'have put'. 'me' = before me, 'le' = him (leísmo: 'le' for a male person as direct object where modern standard usage has 'lo')."}
          - {w: "detenga, temple, use", f: "deteng- + -a → detener (to hold back), present subjunctive, I: detenga, detengas, detenga, detengamos, detengáis, detengan. templ- + -e → templar (to temper) and us- + -e → usar (to use), present subjunctive, I: the present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. All after 'para que'."}
          - {w: "blandamente", f: "bland- + -a + -mente → blando (soft, mild) + -mente, the ending that makes adverbs from the feminine adjective: 'mildly'."}
        note: "Don Quijote explains away the evidence with his usual theory: the enchanters gave his enemy Carrasco's face so that he would spare him. The vanquished knight must accept this too, so both sides now swear to a story that neither the reader nor Tomé Cecial believes."
  - sentences:
