            r: "main verb: I will provide an adequate remedy"
            under:
              - {s: "Para eso", r: "for what: for that"}
          - {s: "dijo el del Bosque", r: "speech tag: said the one of the Grove"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "daré", f: "dar- + -é → dar (to give), future, I. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "un suficiente remedio", f: "the adjective 'suficiente' put before the noun, as Cervantes often does; it has one form for both genders."}
      - es: "y es que, antes que comencemos la pelea, yo me llegaré bonitamente a vuestra merced y le daré tres o cuatro bofetadas, que dé con él a mis pies, con las cuales le haré despertar la cólera, aunque esté con más sueño que un lirón."
        literal: "and it-is that, before that we-begin the fight, I myself will-come-near nicely to your grace and to-you I-will-give three or four slaps, that may-knock [it] with you at my feet, with the which to-you I-will-make awaken the anger, even-if it-be with more sleep than a dormouse."
        ormsby: "before we begin the battle, I will come up to your worship fair and softly, and give you three or four buffets, with which I shall stretch you at my feet and rouse your anger, though it were sleeping sounder than a dormouse.”"
        vocab:
          - {w: "y es que", d: "and it is this:, namely"}
          - {w: "antes que", d: "before (modern 'antes de que')"}
          - {w: "llegarse a", d: "to come up to, approach"}
          - {w: "bonitamente", d: "nicely, quietly, cool as you like"}
          - {w: "vuestra merced", d: "'your grace', the polite 'you', taking he/she verb forms"}
          - {w: "bofetada", d: "slap in the face, buffet"}
          - {w: "dar con alguien a los pies", d: "to knock someone down at one's feet"}
          - {w: "despertar la cólera", d: "to rouse the anger"}
          - {w: "más sueño que un lirón", d: "sleepier than a dormouse; the dormouse hibernates for months and is a byword for sleep"}
        diagram:
          - s: "y es que"
            r: "main verb (continuing 'daré un remedio'): and it is this"
            under:
              - {s: "antes que comencemos la pelea", r: "when: before we begin the fight"}
              - {s: "yo me llegaré bonitamente a vuestra merced", r: "the remedy, 1: I will calmly come up to you"}
              - s: "y le daré tres o cuatro bofetadas"
                r: "the remedy, 2: and give you three or four slaps"
                under:
                  - {s: "que dé con él a mis pies", r: "result: such as to knock you down at my feet"}
                  - s: "con las cuales le haré despertar la cólera"
                    r: "describes 'bofetadas': with which I'll rouse your anger"
                    under:
                      - {s: "aunque esté con más sueño que un lirón", r: "concession: even if it (your anger) is sleepier than a dormouse"}
        forms:
          - {w: "es", f: "ser (to be), present, it. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "comencemos", f: "comenc- + -emos → comenzar (to begin), present subjunctive, we, after 'antes que'; z becomes c before e. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en (comience, comiences, comience, comencemos, comencéis, comiencen)."}
          - {w: "me llegaré", f: "llegar- + -é → llegarse (to come up), future, I, with 'me'. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "bonitamente", f: "bonita (pretty, nice) + -mente → adverb, 'nicely'."}
          - {w: "le daré", f: "dar- + -é → dar (to give), future, I, with 'le' (to you, vuestra merced). Same future endings: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "dé", f: "d- + -é → dar (to give), present subjunctive, I, in 'dar con' (to knock down): 'such that I knock'. dar (to give) in the present subjunctive: dé, des, dé, demos, deis, den; the accent tells it from 'de'."}
          - {w: "él", f: "'him', meaning 'vuestra merced' (you), which is grammatically he/she."}
          - {w: "las cuales", f: "'which', feminine plural to match 'bofetadas'."}
          - {w: "haré despertar", f: "har- + -é → hacer (to make), future, I: haré, harás, hará, haremos, haréis, harán; + despertar (to awaken): 'I will make (your anger) wake'."}
          - {w: "esté", f: "est- + -é → estar (to be), present subjunctive, it (your anger), after 'aunque'. estar (to be) in the present subjunctive: esté, estés, esté, estemos, estéis, estén."}
