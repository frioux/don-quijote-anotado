  - sentences:
      - es: "— Eso no —respondió Sancho—: no seré yo tan descortés ni tan desagradecido, que con quien he comido y he bebido trabe cuestión alguna, por mínima que sea; cuanto más que, estando sin cólera y sin enojo, ¿quién diablos se ha de amañar a reñir a secas?"
        literal: "— That no —answered Sancho—: not shall-be I so discourteous nor so ungrateful, that with whom I-have eaten and I-have drunk I-may-join quarrel any, however minimal that it-be; all-the-more that, being without anger and without annoyance, who devils himself has to manage to fight dry?"
        ormsby: "“By no means,” said Sancho; “I am not going to be so discourteous or so ungrateful as to have any quarrel, be it ever so small, with one I have eaten and drunk with; besides, who the devil could bring himself to fight in cold blood, without anger or provocation?”"
        vocab:
          - {w: "eso no", d: "certainly not, not that"}
          - {w: "descortés", d: "discourteous, rude"}
          - {w: "desagradecido", d: "ungrateful"}
          - {w: "trabar cuestión", d: "to pick a quarrel, start a fight; 'cuestión' = dispute, not 'question'"}
          - {w: "por mínima que sea", d: "however small it may be"}
          - {w: "cuanto más que", d: "all the more since, besides"}
          - {w: "cólera", d: "anger, rage (the hot humour of the body)"}
          - {w: "enojo", d: "anger, annoyance"}
          - {w: "¿quién diablos?", d: "who the devil?"}
          - {w: "amañarse a", d: "to bring oneself to, manage to"}
          - {w: "a secas", d: "just like that, in cold blood, with nothing to go on"}
        diagram:
          - {s: "Eso no", r: "main clause 1: certainly not"}
          - {s: "respondió Sancho", r: "speech tag: Sancho answered"}
          - s: "no seré yo tan descortés ni tan desagradecido"
            r: "main verb 2: I will not be so rude or so ungrateful"
            under:
              - s: "que con quien he comido y he bebido trabe cuestión alguna"
                r: "result: as to pick any quarrel with someone I have eaten and drunk with"
                under:
                  - {s: "por mínima que sea", r: "concession: however small"}
          - s: "¿quién diablos se ha de amañar a reñir a secas?"
            r: "main verb 3: who the devil could bring himself to fight in cold blood?"
            under:
              - {s: "cuanto más que", r: "linking: besides"}
              - {s: "estando sin cólera y sin enojo", r: "when: being without anger or annoyance"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "seré", f: "ser- + -é → ser (to be), future, I. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "he comido, he bebido", f: "h- + -e → haber (to have), present, I: he, has, ha, hemos, habéis, han; + comido, participle of comer (to eat), and bebido, participle of beber (to drink): 'I have eaten, I have drunk'."}
          - {w: "trabe", f: "trab- + -e → trabar (to join, start), present subjunctive, I, in the result clause after 'tan ... que' with a negative. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "mínima", f: "mínim- + -a → mínimo (very small), feminine to match 'cuestión'."}
          - {w: "sea", f: "ser (to be), present subjunctive, it, after 'por ... que'. sea, seas, sea, seamos, seáis, sean."}
          - {w: "estando", f: "gerund of estar (to be): 'being'."}
          - {w: "se ha de amañar", f: "ha, haber (to have), present, he: he, has, ha, hemos, habéis, han; + de + amañarse (to bring oneself to), with 'se' placed before the whole group: 'is to bring himself to'."}
          - {w: "reñir", f: "infinitive of reñir (to fight) after 'a'."}
        note: "Sancho's argument mixes real courtesy (one does not fight a man one has shared food and wine with) and the physiology of the time, in which a man needed his 'cólera', the hot humour, stirred up before he could fight."
  - sentences:
      - es: "— Para eso —dijo el del Bosque— yo daré un suficiente remedio:"
        literal: "— For that —said the [one] of-the Grove— I will-give a sufficient remedy:"
        ormsby: "“I can remedy that entirely,” said he of the Grove, “and in this way:"
        vocab:
