  - sentences:
      - es: "— Ha de saber, hermano, que tienen por costumbre los peleantes de la Andalucía, cuando son padrinos de alguna pendencia, no estarse ociosos mano sobre mano en tanto que sus ahijados riñen."
        literal: "— [You] have to know, brother, that they-have as custom the fighters of the Andalusia, when they-are godfathers of some quarrel, not to-stay-themselves idle hand upon hand while that their godsons fight."
        ormsby: "“You must know, brother, that it is the custom with the fighting men of Andalusia, when they are godfathers in any quarrel, not to stand idle with folded arms while their godsons fight;"
        ormsby_note: "I.e., seconds."
        vocab:
          - {w: "tener por costumbre", d: "to have the custom of, be in the habit of"}
          - {w: "peleante", d: "fighter, brawler"}
          - {w: "padrino", d: "godfather; here a second in a duel or fight"}
          - {w: "ahijado", d: "godson; here the man one seconds in a fight"}
          - {w: "pendencia", d: "quarrel, brawl"}
          - {w: "ocioso", d: "idle"}
          - {w: "mano sobre mano", d: "with folded hands, doing nothing"}
          - {w: "en tanto que", d: "while"}
          - {w: "reñir", d: "to fight, quarrel"}
        diagram:
          - s: "Ha de saber"
            r: "main verb: you must know"
            under:
              - {s: "hermano", r: "addressed: brother"}
              - s: "que tienen por costumbre los peleantes de la Andalucía"
                r: "what to know: that the fighting men of Andalusia have as a custom"
                under:
                  - {s: "cuando son padrinos de alguna pendencia", r: "when: when they are seconds in a quarrel"}
                  - s: "no estarse ociosos mano sobre mano"
                    r: "the custom: not to stand idle with folded hands"
                    under:
                      - {s: "en tanto que sus ahijados riñen", r: "when: while the men they second fight"}
        forms:
          - {w: "Ha de saber", f: "ha, haber (to have), present, you (vuestra merced, polite, takes the he/she form): he, has, ha, hemos, habéis, han; + de + saber (to know): 'you must know'."}
          - {w: "tienen", f: "tien- + -en → tener (to have), present, they. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "son", f: "ser (to be), present, they. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "estarse", f: "estar (to be) + se, the 'se' adding 'stay put': 'to stay (idle)'. Infinitive after 'tienen por costumbre'."}
          - {w: "ociosos", f: "ocios- + -os → ocioso (idle), masculine plural to match 'los peleantes'."}
          - {w: "riñen", f: "riñ- + -en → reñir (to fight), present, they. The stem e becomes i when stressed: riño, riñes, riñe, reñimos, reñís, riñen."}
        note: "In the duels of the time the seconds ('padrinos') sometimes fought each other as well as their principals. The squire uses the custom of Andalusian bravoes as his excuse to make Sancho fight."
