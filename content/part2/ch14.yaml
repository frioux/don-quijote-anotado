  - sentences:
      - es: "— Desa manera, sea en buena hora —respondió Sancho—, porque antes servirá la tal pelea de despolvorearnos que de herirnos."
        literal: "— Of-that way, let-it-be in good hour —answered Sancho—, because rather will-serve the such fight to dust-us than to wound-us."
        ormsby: "“If that’s the way, so be it with all my heart,” said Sancho, “for that sort of battle will serve to knock the dust out of us instead of hurting us.”"
        vocab:
          - {w: "desa", d: "= de esa, of that (old contraction); 'desa manera' = in that way"}
          - {w: "sea en buena hora", d: "so be it, by all means, fine"}
          - {w: "antes ... que", d: "rather ... than"}
          - {w: "servir de", d: "to serve to, be good for"}
          - {w: "despolvorear", d: "to dust off, beat the dust out of (like beating a rug)"}
          - {w: "herir", d: "to wound"}
        diagram:
          - s: "sea en buena hora"
            r: "main verb: so be it"
            under:
              - {s: "Desa manera", r: "condition: if it is that way"}
          - {s: "respondió Sancho", r: "speech tag: Sancho answered"}
          - s: "porque antes servirá la tal pelea"
            r: "why: because such a fight will rather serve"
            under:
              - {s: "de despolvorearnos", r: "for what: to dust us off"}
              - {s: "que de herirnos", r: "rather than: than to wound us"}
        forms:
          - {w: "Desa", f: "de + esa (that, feminine to match 'manera'), run together; modern 'de esa'."}
          - {w: "sea", f: "ser (to be), present subjunctive, it, as a wish: 'let it be'. sea, seas, sea, seamos, seáis, sean."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "servirá", f: "servir- + -á → servir (to serve), future, it (the fight). The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "despolvorearnos, herirnos", f: "despolvorear (to dust off) and herir (to wound) + nos (us), the pronoun hung on each infinitive after 'de'."}
  - sentences:
      - es: "— No ha de ser así —replicó el otro—, porque se han de echar dentro de las talegas, porque no se las lleve el aire, media docena de guijarros lindos y pelados, que pesen tanto los unos como los otros, y desta manera nos podremos atalegar sin hacernos mal ni daño."
        literal: "— Not it-has to be thus —replied the other—, because themselves they-have to throw inside of the sacks, so-that not them may-carry-off the air, half dozen of pebbles pretty and bare, that may-weigh as-much the ones as the others, and of-this way ourselves we-shall-be-able to-sack-beat without doing-ourselves harm nor damage."
        ormsby: "“That will not do,” said the other, “for we must put into the bags, to keep the wind from blowing them away, half a dozen nice smooth pebbles, all of the same weight; and in this way we shall be able to baste one another without doing ourselves any harm or mischief.”"
        vocab:
          - {w: "replicar", d: "to reply, answer back"}
          - {w: "porque no", d: "here 'so that ... not' (with the subjunctive)"}
          - {w: "guijarro", d: "pebble, smooth stone"}
          - {w: "lindo", d: "nice, fine; said ironically of stones"}
          - {w: "pelado", d: "bare, smooth"}
          - {w: "desta", d: "= de esta, of this (old contraction)"}
          - {w: "atalegar", d: "to beat with sacks (a word made up on the spot from 'talega')"}
          - {w: "mal ni daño", d: "harm or hurt, a doublet; said with irony, since stones in a sack would do great harm"}
        diagram:
          - s: "No ha de ser así"
            r: "main verb 1: it must not be so"
          - {s: "replicó el otro", r: "speech tag: the other replied"}
          - s: "porque se han de echar"
            r: "why: because there must be put"
            under:
              - {s: "dentro de las talegas", r: "where: inside the sacks"}
              - {s: "porque no se las lleve el aire", r: "purpose: so that the wind won't carry them off"}
              - s: "media docena de guijarros lindos y pelados"
                r: "subject: half a dozen nice smooth pebbles"
                under:
                  - {s: "que pesen tanto los unos como los otros", r: "describes 'guijarros': that weigh as much as one another"}
          - s: "y desta manera nos podremos atalegar"
            r: "main verb 2: and in this way we can beat each other with sacks"
            under:
              - {s: "sin hacernos mal ni daño", r: "how: without doing ourselves harm"}
        forms:
          - {w: "ha de ser", f: "ha, haber (to have), present, it: he, has, ha, hemos, habéis, han; + de + ser (to be): 'must be'."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "se han de echar", f: "han, haber (to have), present, they: he, has, ha, hemos, habéis, han; + de + echar (to throw, put); 'se' makes it passive: '(pebbles) must be put'."}
          - {w: "se las lleve", f: "llev- + -e → llevar (to carry off), present subjunctive, it (the wind), after 'porque' meaning 'so that'; 'se' adds 'away', 'las' = them (the sacks). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "pesen", f: "pes- + -en → pesar (to weigh), present subjunctive, they. Same -e subjunctive: pese, peses, pese, pesemos, peséis, pesen."}
          - {w: "lindos y pelados", f: "masculine plural to match 'guijarros'; pelados is the participle of pelar (to peel, strip)."}
          - {w: "desta", f: "de + esta (this, feminine to match 'manera'), run together; modern 'de esta'."}
          - {w: "podremos", f: "podr- + -emos → poder (to be able), future, we. Irregular stem podr-: podré, podrás, podrá, podremos, podréis, podrán."}
          - {w: "atalegar", f: "infinitive of atalegar (to beat with sacks), after 'podremos', with 'nos' (each other) placed before the group."}
          - {w: "hacernos", f: "hacer (to do) + nos (to ourselves), the pronoun hung on the infinitive after 'sin'."}
        note: "The joke is in the 'lindos' pebbles and the claim that they will do 'no harm': a sack of stones swung at the head is a deadly weapon, as Sancho at once understands."
