              - s: "sin causar admiración, maravilla y espanto"
                r: "how: without causing wonder, marvel and fright"
                under:
                  - {s: "a los que lo oyeren?", r: "to whom: to those who may hear it"}
        forms:
          - {w: "podrá", f: "podr- + -á → poder (to be able), future, he (whoever). Irregular stem podr-: podré, podrás, podrá, podremos, podréis, podrán."}
          - {w: "vio", f: "vi- + -o → ver (to see), preterite, he. Irregular: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "causar", f: "infinitive of causar (to cause) after 'sin'."}
          - {w: "oyeren", f: "oy- + -eren → oír (to hear), future subjunctive, they: 'whoever may hear it'. Built on the preterite oyeron: oyere, oyeres, oyere, oyéremos, oyereis, oyeren. Cervantes uses the future subjunctive after 'los que', 'si', 'donde' for an open future; modern Spanish uses the present subjunctive 'oigan'."}
        note: "The narrator's mock-solemn aside builds suspense in the style of the chivalric romances, which love to stop just before a marvel."
      - es: "Vio, dice la historia, el rostro mesmo, la misma figura, el mesmo aspecto, la misma fisonomía, la mesma efigie, la pespetiva mesma del bachiller Sansón Carrasco; y, así como la vio, en altas voces dijo:"
        literal: "He-saw, says the history, the face very, the same figure, the very appearance, the same physiognomy, the very effigy, the perspective very of-the bachelor Sansón Carrasco; and, as soon as it he-saw, in high voices he-said:"
        ormsby: "He saw, the history says, the very countenance, the very face, the very look, the very physiognomy, the very effigy, the very image of the bachelor Samson Carrasco! As soon as he saw it he called out in a loud voice,"
        vocab:
          - {w: "mesmo", d: "= mismo, same, very (old form); Cervantes alternates 'mesmo' and 'mismo' here for rhythm"}
          - {w: "fisonomía", d: "physiognomy, features of the face"}
          - {w: "efigie", d: "effigy, likeness, image"}
          - {w: "pespetiva", d: "= perspectiva, perspective, here 'look, appearance' (old popular spelling)"}
          - {w: "bachiller", d: "bachelor, holder of the first university degree"}
          - {w: "Sansón Carrasco", d: "the young bachelor of Salamanca from Don Quijote's village who in chapters 3 and 4 told him about the printed Part I and encouraged him to set out again"}
          - {w: "así como", d: "as soon as"}
          - {w: "en altas voces", d: "loudly, at the top of his voice"}
        diagram:
          - s: "Vio"
            r: "main verb 1: he saw"
            under:
              - {s: "dice la historia", r: "aside: says the history"}
              - s: "el rostro mesmo, la misma figura, el mesmo aspecto, la misma fisonomía, la mesma efigie, la pespetiva mesma"
                r: "objects: the very face, figure, look, features, image, appearance"
                under:
                  - {s: "del bachiller Sansón Carrasco", r: "whose: of the bachelor Sansón Carrasco"}
          - s: "en altas voces dijo:"
            r: "main verb 2 (after 'y'): he said loudly"
            under:
              - {s: "así como la vio", r: "when: as soon as he saw it (the face)"}
        forms:
          - {w: "Vio", f: "vi- + -o → ver (to see), preterite, he. Irregular: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "dice", f: "dic- + -e → decir (to say), present, it (the history). Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "mesmo, mesma, misma", f: "old mesmo = modern mismo (same, very), masculine 'mesmo' with 'rostro', 'aspecto', feminine 'mesma'/'misma' with 'efigie', 'pespetiva', 'figura', 'fisonomía'. After the noun ('el rostro mesmo') it means 'the very face'."}
          - {w: "la vio", f: "'la' (it, feminine) stands for the face and figure just listed, taken as 'la figura'; vio = ver (to see), preterite, he: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
        note: "The pile of six synonyms, alternating 'mesmo' and 'mismo', mimics Don Quijote's stunned staring. Sansón Carrasco is the bachelor who, in chapter 7, encouraged Don Quijote's third sally; finding his face under the visor is the great surprise of the chapter."
  - sentences:
      - es: "— ¡Acude, Sancho, y mira lo que has de ver y no lo has creer!"
        literal: "— Come-quick, Sancho, and look-at that which you-have to see and not it you-have [to] believe!"
        ormsby: "“Make haste here, Sancho, and behold what thou art to see but not to believe;"
        vocab:
          - {w: "acudir", d: "to come running, hurry to (a place or a call)"}
          - {w: "haber de", d: "to be going to, be bound to; 'has de ver' = you are going to see"}
        diagram:
          - {s: "¡Acude, Sancho", r: "main verb 1: come quick, Sancho"}
          - s: "y mira"
            r: "main verb 2: and look"
            under:
              - s: "lo que has de ver"
                r: "object: what you are going to see"
                under:
                  - {s: "y no lo has creer!", r: "describes 'lo': and will not believe"}
        forms:
          - {w: "Acude, mira", f: "acud- + -e → acudir (to come running) and mir- + -a → mirar (to look), imperative, you (tú): the tú command is the same as the 'he' form of the present: acude, mira."}
          - {w: "has de ver", f: "ha- + -s → haber (to have), present, you: he, has, ha, hemos, habéis, han; + de + ver (to see): 'haber de' + infinitive = 'you are going to see'."}
          - {w: "no lo has creer", f: "has (haber (to have), present, you: he, has, ha, hemos, habéis, han) + creer (to believe), with the 'de' of 'haber de' left out because it was just said: 'and you will not believe it'. 'lo' (it) stands for what he will see."}
        note: "Don Quijote's paradox 'what you will see and not believe' fits his reading of the scene: the eyes will show Carrasco, but enchantment means it cannot really be him."
      - es: "¡Aguija, hijo, y advierte lo que puede la magia, lo que pueden los hechiceros y los encantadores!"
        literal: "Spur-on, son, and notice that which can [do] the magic, that which can [do] the sorcerers and the enchanters!"
        ormsby: "quick, my son, and learn what magic can do, and wizards and enchanters are capable of.”"
        vocab:
          - {w: "aguijar", d: "to spur on, hurry (literally to goad an animal with a pointed stick)"}
          - {w: "advertir", d: "to notice, observe; also to warn"}
          - {w: "hechicero", d: "sorcerer, wizard"}
          - {w: "encantador", d: "enchanter, magician, the villain of the romances of chivalry"}
        diagram:
          - {s: "¡Aguija, hijo", r: "main verb 1: hurry, son"}
          - s: "y advierte"
            r: "main verb 2: and see"
            under:
              - {s: "lo que puede la magia", r: "object 1: what magic can do"}
              - {s: "lo que pueden los hechiceros y los encantadores!", r: "object 2: what sorcerers and enchanters can do"}
        forms:
          - {w: "Aguija, advierte", f: "aguij- + -a → aguijar (to hurry) and adviert- + -e → advertir (to notice), imperative, you (tú): the tú command equals the 'he' form of the present. advertir changes e to ie when stressed: advierto, adviertes, advierte, advertimos, advertís, advierten."}
          - {w: "puede, pueden", f: "pued- + -e / -en → poder (to be able, can), present, it (magic) and they (the sorcerers). The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "lo que", f: "'what, that which' (neuter): 'lo que puede' = what [it] can do; Spanish needs no 'do' after poder (to be able)."}
        note: "Don Quijote reads the sight at once as enchantment, just as he explained the transformed Dulcinea in chapter 10; the enchanters, in his view, have given his enemy Carrasco's face."
