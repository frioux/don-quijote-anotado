        literal: "whose size, colour, warts and hookedness so to-him made-ugly the face, that, on seeing-him Sancho, he-began to strike with foot and with hand, like child with epilepsy, and he-resolved in his heart to let-himself be-given two-hundred slaps before than awaken the anger to fight with that monster."
        ormsby: "and the size, the colour, the warts, and the bend of it, made his face so hideous, that Sancho, as he looked at him, began to tremble hand and foot like a child in convulsions, and he vowed in his heart to let himself be given two hundred buffets, sooner than be provoked to fight that monster."
        vocab:
