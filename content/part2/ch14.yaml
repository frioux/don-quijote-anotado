        literal: "let-fight our masters, and there it-to-themselves may-they-have, and let-us-drink and let-us-live we, for the time has care of taking-from-us the lives, without that we-go seeking appetizers so that themselves they-may-end before of arriving their season and term and that themselves they-may-fall from ripe."
        ormsby: "let our masters fight, that’s their lookout, and let us drink and live; for time will take care to ease us of our lives, without our going to look for fillips so that they may be finished off before their proper time comes and they drop from ripeness.”"
        ormsby_note: "Apetites. Hartzenbusch proposes arbitrios, “expedients;” but it is hardly a case that calls for emendation, and there is a flavour of Sancho in the idea as it stands."
        vocab:
          - {w: "allá se lo hayan", d: "that's their business, let them sort it out (old 'habérselas', to deal with it)"}
          - {w: "tener cuidado de", d: "to take care of, see to"}
          - {w: "apetites", d: "relishes, sauces or titbits that whet the appetite; here 'goads, incitements' to hasten death"}
          - {w: "sazón", d: "ripeness, the right time"}
          - {w: "término", d: "end, appointed time"}
          - {w: "cayan", d: "= caigan, may fall (old form)"}
          - {w: "caerse de maduro", d: "to fall from ripeness, like ripe fruit: to die of old age"}
        diagram:
          - s: "peleen nuestros amos"
            r: "main verb 1: let our masters fight"
          - {s: "y allá se lo hayan", r: "main verb 2: and that's their business"}
          - s: "y bebamos y vivamos nosotros"
            r: "main verbs 3 and 4: and let us drink and live"
            under:
              - s: "que el tiempo tiene cuidado de quitarnos las vidas"
                r: "why: for time takes care of taking our lives"
                under:
                  - s: "sin que andemos buscando apetites"
                    r: "how: without our going looking for incitements"
                    under:
                      - s: "para que se acaben"
                        r: "purpose: so that they (our lives) end"
                        under:
                          - {s: "antes de llegar su sazón y término", r: "when: before their season and term arrive"}
                          - {s: "y que se cayan de maduras", r: "and before they fall from ripeness"}
        forms:
          - {w: "peleen", f: "pel- + -een → pelear (to fight), present subjunctive, they: 'let them fight'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "se lo hayan", f: "hay- + -an → haber (to have, here 'to deal with'), present subjunctive, they, with 'se' and 'lo' (it): 'let them deal with it'. haber (to have) in the present subjunctive: haya, hayas, haya, hayamos, hayáis, hayan."}
          - {w: "bebamos, vivamos", f: "beb- + -amos → beber (to drink) and viv- + -amos → vivir (to live), present subjunctive, we: 'let us drink and live'. The present subjunctive of -er verbs: -a, -as, -a, -amos, -áis, -an; of -ir verbs: -a, -as, -a, -amos, -áis, -an."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, it (time). Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "quitarnos", f: "quitar (to take away) + nos (from us), the pronoun hung on the infinitive after 'de'."}
          - {w: "andemos buscando", f: "and- + -emos → andar (to go about), present subjunctive, we, after 'sin que': andar (to go about) in the present subjunctive: ande, andes, ande, andemos, andéis, anden; + buscando, gerund of buscar (to look for): 'go about looking for'."}
          - {w: "se acaben", f: "acab- + -en → acabarse (to come to an end), present subjunctive, they (our lives), after 'para que'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "llegar", f: "infinitive of llegar (to arrive) after 'antes de', with its subject 'su sazón y término' after it."}
          - {w: "se cayan", f: "cay- + -an → caerse (to fall), present subjunctive, they; an old form of the standard 'caigan'. caer (to fall) in the present subjunctive (standard): caiga, caigas, caiga, caigamos, caigáis, caigan; Cervantes' older forms: caya, cayas, caya, cayamos, cayáis, cayan."}
          - {w: "maduras", f: "madur- + -as → maduro (ripe), feminine plural to match 'las vidas'."}
        note: "Sancho's philosophy: let the gentlemen fight; time kills us soon enough without our going looking for ways to die before we drop like ripe fruit."
