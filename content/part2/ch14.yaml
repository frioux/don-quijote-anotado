  - sentences:
      - es: "— ¡Santa María, y valme! ¿Éste no es Tomé Cecial, mi vecino y mi compadre?"
        literal: "— Holy Mary, and help-me! This [one] not is Tomé Cecial, my neighbour and my gossip?"
        ormsby: "“Holy Mary be good to me! Isn’t it Tom Cecial, my neighbour and gossip?”"
        vocab:
          - {w: "valme", d: "= válgame, help me! (old clipped form of 'vale me', from 'valer', to help, protect)"}
          - {w: "¡Santa María, y valme!", d: "Holy Mary, help me! an exclamation of astonishment"}
          - {w: "Tomé Cecial", d: "a villager from Don Quijote and Sancho's village, Sancho's neighbour; Ormsby calls him 'Tom Cecial'"}
          - {w: "compadre", d: "a godparent of one's child, or the father of one's godchild; in villages a close friend and neighbour. Ormsby's 'gossip' is the old English word for the same bond (false friend: not just 'buddy')"}
        diagram:
          - {s: "¡Santa María, y valme!", r: "exclamation: Holy Mary, help me!"}
          - s: "¿Éste no es Tomé Cecial"
            r: "main verb (a question): isn't this Tomé Cecial?"
            under:
              - {s: "mi vecino y mi compadre?", r: "describes 'Tomé Cecial': my neighbour and my gossip"}
        forms:
          - {w: "valme", f: "val- + me → valer (to help, protect), with 'me' (me) stuck on the end; an old clipped form, modern 'válgame' (present subjunctive: valga, valgas, valga, valgamos, valgáis, valgan). Pronouns hang on the end of a verb that opens a clause or gives a command."}
          - {w: "Éste", f: "'this one', masculine, written with an accent because it stands alone as a pronoun."}
          - {w: "es", f: "es → ser (to be), present, he. Irregular: soy, eres, es, somos, sois, son."}
        note: "The second unmasking: the frightening squire is Sancho's own neighbour. A 'compadre' bond (godparent to each other's children) was among the closest ties in a Spanish village."
