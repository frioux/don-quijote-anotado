        forms:
          - {w: "mire", f: "mir- + -e → mirar (to look), present subjunctive, he (each one): 'let each look'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "lo más acertado", f: "lo + adjective makes an abstract noun: 'the wisest thing'; acertado is the participle of acertar (to hit the mark)."}
          - {w: "sería", f: "ser- + -ía → ser (to be), conditional, it: 'would be'. The conditional adds endings to the whole infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "dejar dormir", f: "dejar (to let) + dormir (to sleep), two infinitives: 'to let sleep'."}
