        vocab:
          - {w: "o ... o", d: "either ... or"}
          - {w: "vencido", d: "the vanquished, the loser"}
          - {w: "vencedor", d: "victor, winner"}
          - {w: "desta", d: "= de esta, of this (old contraction)"}
          - {w: "empresa", d: "enterprise, undertaking, feat of arms (not 'company')"}
          - {w: "el de los Espejos", d: "'the one of the Mirrors', short for the Knight of the Mirrors"}
          - {w: "demasiado", d: "more than enough, too much"}
        diagram:
          - s: "os quedará tiempo y espacio demasiado"
            r: "main verb: you will have more than enough time and room left"
            under:
              - {s: "O vencido o vencedor que salgáis desta empresa", r: "condition: whether you come out of this fight beaten or the victor"}
              - {s: "respondió el de los Espejos", r: "speaker: answered the Knight of the Mirrors"}
              - {s: "para verme", r: "what for: to see me"}
        forms:
          - {w: "salgáis", f: "salg- + -áis → salir (to come out), present subjunctive, you (vos). salir (to come out) in the present subjunctive: salga, salgas, salga, salgamos, salgáis, salgan. 'O ... o ... que' + subjunctive = 'whether ... or ...'."}
          - {w: "desta", f: "de + esta (this), run together; modern 'de esta'. esta is feminine to match 'empresa'."}
