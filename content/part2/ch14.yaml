  - sentences:
      - es: "— Soy de parecer, señor mío, que, por sí o por no, vuesa merced hinque y meta la espada por la boca a este que parece el bachiller Sansón Carrasco; quizá matará en él a alguno de sus enemigos los encantadores."
        literal: "— I-am of opinion, sir mine, that, for yes or for no, your-grace may-drive and may-put the sword through the mouth to this [one] who looks-like the bachelor Sansón Carrasco; perhaps you-will-kill in him [to] some of your enemies the enchanters."
        ormsby: "“It is my opinion, señor, that in any case your worship should take and thrust your sword into the mouth of this one here that looks like the bachelor Samson Carrasco; perhaps in him you will kill one of your enemies, the enchanters.”"
        vocab:
          - {w: "ser de parecer", d: "to be of the opinion"}
          - {w: "por sí o por no", d: "just in case, to be on the safe side (literally 'for yes or for no')"}
          - {w: "vuesa merced", d: "your worship, your grace: the worn-down form of 'vuestra merced', ancestor of 'usted'; takes a 'he/she' verb"}
          - {w: "hincar", d: "to drive in, thrust, sink (a point into something)"}
          - {w: "quizá", d: "perhaps"}
        diagram:
          - s: "Soy de parecer"
            r: "main verb 1: I am of the opinion"
            under:
              - {s: "señor mío", r: "addressed to Don Quijote: my lord"}
              - s: "que, por sí o por no, vuesa merced hinque y meta la espada por la boca"
                r: "what I think: that just in case your worship should thrust your sword through the mouth"
                under:
                  - {s: "a este que parece el bachiller Sansón Carrasco", r: "into whom: of this one who looks like the bachelor Sansón Carrasco"}
          - s: "quizá matará en él a alguno de sus enemigos los encantadores"
            r: "main verb 2: perhaps you will kill in him one of your enemies, the enchanters"
        forms:
          - {w: "Soy", f: "soy → ser (to be), present, I. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "hinque, meta", f: "hinqu- + -e → hincar (to thrust), present subjunctive, you (vuesa merced, which takes a 'he' verb); c becomes qu before e. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. met- + -a → meter (to put in), present subjunctive, you: the present subjunctive of -er verbs: -a, -as, -a, -amos, -áis, -an. Subjunctive after 'soy de parecer que', a piece of advice."}
          - {w: "parece", f: "parec- + -e → parecer (to look like), present, he. The present of -er verbs: -o (here parezco), -es, -e, -emos, -éis, -en."}
          - {w: "matará", f: "matar- + -á → matar (to kill), future, you (vuesa merced). The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "a alguno", f: "personal 'a' before a person as object; 'alguno' (one, some) keeps its full form because no noun follows directly."}
          - {w: "sus enemigos los encantadores", f: "'your enemies the enchanters': 'sus' refers to vuesa merced (your), plural to match 'enemigos'; 'los encantadores' stands beside it in apposition."}
        note: "Sancho's brutal advice is the logical end of Don Quijote's theory: if this is only an enchanter wearing Carrasco's face, killing him harms no friend. 'Por sí o por no' is the peasant's 'just to be safe'."
  - sentences:
      - es: "— No dices mal —dijo don Quijote—, porque de los enemigos, los menos."
        literal: "— Not you-say badly —said Don Quijote—, because of the enemies, the fewest."
        ormsby: "“Thy advice is not bad,” said Don Quixote, “for of enemies the fewer the better;”"
        ormsby_note: "Proverb 94."
        vocab:
          - {w: "no dices mal", d: "you are not wrong, that's not a bad idea"}
          - {w: "de los enemigos, los menos", d: "proverb: 'of enemies, the fewer the better'; every enemy removed is a gain"}
        diagram:
          - s: "No dices mal"
            r: "main verb: you don't speak badly"
            under:
              - {s: "dijo don Quijote", r: "speaker"}
              - {s: "porque de los enemigos, los menos", r: "why: because of enemies, [the best is] the fewest"}
        forms:
          - {w: "dices", f: "dic- + -es → decir (to say), present, you (tú, to Sancho). Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "los menos", f: "'the fewest': menos (less, fewer) made into a noun with 'los'; the proverb leaves out the verb, 'the fewest [is best]'."}
        note: "Ormsby numbers the proverbs of the book; this one is a set saying of the time, and Don Quijote, who scolds Sancho for proverbs, uses one to agree to killing a man."
