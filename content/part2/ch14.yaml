          - {w: "estar por", d: "to be on the point of, be tempted to"}
          - {w: "mentís", d: "the 'you lie!', the formal accusation of lying that obliged a gentleman to fight ('dar un mentís' = to give someone the lie)"}
          - {w: "en el pico de la lengua", d: "on the tip of his tongue"}
          - {w: "reportarse", d: "to restrain oneself, keep one's temper (false friend: not 'to report')"}
          - {w: "por su propia boca", d: "out of his own mouth"}
          - {w: "sosegadamente", d: "calmly, quietly"}
