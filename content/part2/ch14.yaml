          - {w: "tanta, tal", f: "tant- + -a → tanto (so much), feminine to match 'fuerza'; 'tal' (such) has one form for both genders; both set up a result clause 'que ...'."}
          - {w: "hizo venir", f: "hiz- + -o → hacer (to make), preterite, he: hice, hiciste, hizo, hicimos, hicisteis, hicieron; + venir (to come) as infinitive: 'made him come', i.e. brought him down."}
          - {w: "dando, mover", f: "dando: gerund of dar (to give), 'giving, taking (a fall)'; mover (to move): infinitive after 'sin'."}
          - {w: "dio", f: "di- + -o → dar (to give), preterite, he. Irregular: di, diste, dio, dimos, disteis, dieron."}
