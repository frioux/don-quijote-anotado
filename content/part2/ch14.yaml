  - sentences:
      - es: "— Está bien —replicó el del Bosque—. Amanecerá Dios y medraremos."
        literal: "— It-is well —replied the [one] of-the Grove—. Will-dawn God and we-shall-prosper."
        ormsby: "“Very good,” said he of the Grove; “God will send the dawn and we shall be all right.”"
        vocab:
          - {w: "está bien", d: "very well, all right"}
          - {w: "amanecerá Dios y medraremos", d: "proverb: 'God will bring the dawn and we shall prosper', i.e. tomorrow is another day, we'll see in the morning"}
          - {w: "amanecer", d: "to dawn; with God as subject, 'God will make it dawn'"}
          - {w: "medrar", d: "to prosper, thrive, get on"}
        diagram:
          - {s: "Está bien", r: "main clause 1: very well"}
          - {s: "replicó el del Bosque", r: "speech tag: the one of the Grove replied"}
          - {s: "Amanecerá Dios", r: "main clause 2: God will bring the dawn"}
          - {s: "y medraremos", r: "main clause 3: and we shall prosper"}
        forms:
          - {w: "Está", f: "est- + -á → estar (to be), present, it. Irregular: estoy, estás, está, estamos, estáis, están."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "Amanecerá", f: "amanecer- + -á → amanecer (to dawn), future, he (God). The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "medraremos", f: "medrar- + -emos → medrar (to prosper), future, we. Same future endings: -é, -ás, -á, -emos, -éis, -án."}
        note: "The proverb closes the argument without settling it: they will see in the morning. The phrase can carry a hint of menace, 'we'll see how things stand at daybreak'."
  - sentences:
      - es: "En esto, ya comenzaban a gorjear en los árboles mil suertes de pintados pajarillos, y en sus diversos y alegres cantos parecía que daban la norabuena y saludaban a la fresca aurora, que ya por las puertas y balcones del oriente iba descubriendo la hermosura de su rostro, sacudiendo de sus cabellos un número infinito de líquidas perlas, en cuyo suave licor bañándose las yerbas, parecía asimesmo que ellas brotaban y llovían blanco y menudo aljófar;"
        literal: "In this, already were-beginning to warble in the trees a-thousand sorts of painted little-birds, and in their diverse and merry songs it-seemed that they-gave the congratulations and greeted the fresh dawn, who already through the doors and balconies of-the east was uncovering the beauty of her face, shaking from her hair a number infinite of liquid pearls, in whose gentle liquor bathing-themselves the grasses, it-seemed likewise that they sprouted and rained white and fine seed-pearl;"
        ormsby: "And now gay-plumaged birds of all sorts began to warble in the trees, and with their varied and gladsome notes seemed to welcome and salute the fresh morn that was beginning to show the beauty of her countenance at the gates and balconies of the east, shaking from her locks a profusion of liquid pearls; in which dulcet moisture bathed, the plants, too, seemed to shed and shower down a pearly spray,"
        vocab:
          - {w: "en esto", d: "at this point, meanwhile"}
          - {w: "gorjear", d: "to warble, trill (of birds)"}
          - {w: "mil suertes de", d: "a thousand kinds of; 'suerte' = sort, kind (not 'luck' here)"}
          - {w: "pintado", d: "painted, i.e. many-coloured, bright-plumaged"}
          - {w: "pajarillo", d: "little bird (diminutive of 'pájaro')"}
          - {w: "dar la norabuena", d: "to congratulate, wish joy; 'norabuena' = enhorabuena (old form)"}
          - {w: "aurora", d: "dawn, personified as a lady"}
          - {w: "balcones del oriente", d: "the balconies of the east: the poetic sky from which Dawn looks out"}
          - {w: "ir descubriendo", d: "to be gradually uncovering, revealing"}
          - {w: "sacudir", d: "to shake (off)"}
          - {w: "licor", d: "liquid, moisture (not 'liquor' in the modern sense)"}
          - {w: "yerbas", d: "= hierbas, grasses, plants (old spelling)"}
          - {w: "asimesmo", d: "= asimismo, likewise, also (old form)"}
          - {w: "brotar", d: "to sprout; also to gush, pour out"}
          - {w: "aljófar", d: "seed-pearl, tiny irregular pearls; in poetry, dewdrops"}
        diagram:
          - s: "ya comenzaban a gorjear"
            r: "main verb 1: were already beginning to warble"
            under:
              - {s: "En esto", r: "when: at this point"}
              - {s: "en los árboles", r: "where: in the trees"}
              - {s: "mil suertes de pintados pajarillos", r: "subject: a thousand kinds of bright-coloured little birds"}
          - s: "parecía"
            r: "main verb 2 (after 'y'): it seemed"
            under:
              - {s: "en sus diversos y alegres cantos", r: "how: in their varied, merry songs"}
              - s: "que daban la norabuena y saludaban a la fresca aurora"
                r: "what seemed: that they were congratulating and greeting the fresh dawn"
                under:
                  - s: "que ya por las puertas y balcones del oriente iba descubriendo la hermosura de su rostro"
                    r: "describes 'aurora': who was already showing her lovely face at the doors and balconies of the east"
                    under:
                      - s: "sacudiendo de sus cabellos un número infinito de líquidas perlas"
                        r: "how: shaking countless liquid pearls (dew) from her hair"
                        under:
                          - {s: "en cuyo suave licor bañándose las yerbas", r: "describes 'perlas': the grasses bathing in that gentle moisture"}
          - s: "parecía asimesmo"
            r: "main verb 3: it likewise seemed"
            under:
              - {s: "que ellas brotaban y llovían blanco y menudo aljófar", r: "what seemed: that they (the grasses) were sprouting and raining fine white seed-pearls"}
        forms:
          - {w: "comenzaban", f: "comenz- + -aban → comenzar (to begin), imperfect, they (the birds). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. Followed by 'a' + infinitive: 'were beginning to warble'."}
          - {w: "pintados pajarillos", f: "pintados, participle of pintar (to paint), masculine plural to match 'pajarillos', put before the noun as poets do; pajar- + -illo + -s → pájaro (bird) with the diminutive -illo, plural."}
          - {w: "parecía", f: "parec- + -ía → parecer (to seem), imperfect, it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "daban, saludaban", f: "d- + -aban → dar (to give) and salud- + -aban → saludar (to greet), imperfect, they. Each takes the -ar imperfect: daba, dabas, daba, dábamos, dabais, daban; saludaba, saludabas, saludaba, saludábamos, saludabais, saludaban."}
          - {w: "iba descubriendo", f: "ib- + -a → ir (to go), imperfect, she (the dawn). Irregular: iba, ibas, iba, íbamos, ibais, iban; + descubriendo, gerund of descubrir (to uncover): 'ir' (to go) + gerund means 'to be gradually doing'."}
          - {w: "sacudiendo", f: "sacud- + -iendo → gerund of sacudir (to shake): 'shaking'."}
          - {w: "líquidas", f: "líquid- + -as → líquido (liquid), feminine plural to match 'perlas', put before the noun."}
          - {w: "cuyo", f: "'whose', masculine singular to match the thing owned, 'licor', not the owner ('perlas')."}
          - {w: "bañándose", f: "gerund of bañar (to bathe) + se (themselves), accent added to keep the stress on -ñán-; its subject 'las yerbas' follows it, an absolute gerund clause: 'the grasses bathing'."}
          - {w: "brotaban, llovían", f: "brot- + -aban → brotar (to sprout), imperfect, they: brotaba, brotabas, brotaba, brotábamos, brotabais, brotaban; llov- + -ían → llover (to rain), imperfect, they: llovía, llovías, llovía, llovíamos, llovíais, llovían. llover (to rain) is normally impersonal; here the grasses 'rain' dew."}
        note: "A deliberately high-flown dawn in the style of the pastoral and chivalric romances: Dawn as a lady at the balconies of the east, dew as pearls. Cervantes sets this lyric sunrise just before the comic revelation of the squire's nose."
