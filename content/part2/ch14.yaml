          - {w: "dél", f: "de + él (him), run together; modern 'de él'."}
          - {w: "quisiere", f: "quis- + -iere → querer (to want), future subjunctive, he: 'whatever he may want'. Built on the preterite quisieron: quisiere, quisieres, quisiere, quisiéremos, quisiereis, quisieren. Cervantes uses it after 'lo que', 'si', 'donde' for an open future; modern Spanish uses the present subjunctive 'quiera'."}
