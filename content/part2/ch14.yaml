  - sentences:
      - es: "— Para eso sé yo un buen remedio —dijo el del Bosque—: yo traigo aquí dos talegas de lienzo, de un mesmo tamaño: tomaréis vos la una, y yo la otra, y riñiremos a talegazos, con armas iguales."
