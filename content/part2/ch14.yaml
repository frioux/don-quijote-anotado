      - es: "Admirado quedó don Quijote de oír al Caballero del Bosque, y estuvo mil veces por decirle que mentía, y ya tuvo el mentís en el pico de la lengua; pero reportóse lo mejor que pudo, por hacerle confesar por su propia boca su mentira; y así, sosegadamente le dijo:"
