        note: "'Encontrar' and 'encuentro' are the technical words of jousting for the clash of two riders. The victory is real but comic: Don Quijote strikes a man who is sitting still on a horse that cannot move."
  - sentences:
      - es: "Apenas le vio caído Sancho, cuando se deslizó del alcornoque y a toda priesa vino donde su señor estaba, el cual, apeándose de Rocinante, fue sobre el de los Espejos, y, quitándole las lazadas del yelmo para ver si era muerto y para que le diese el aire si acaso estaba vivo; y vio..."
        literal: "Scarcely him saw fallen Sancho, when himself he-slid from-the cork-oak and at all haste came where his lord was, the which, alighting-himself from Rocinante, went over the [one] of the Mirrors, and, removing-from-him the laces of-the helmet to see if he-was dead and so-that him might-give the air if perhaps he-was alive; and he-saw..."
        ormsby: "The instant Sancho saw him fall he slid down from the cork tree, and made all haste to where his master was, who, dismounting from Rocinante, went and stood over him of the Mirrors, and unlacing his helmet to see if he was dead, and to give him air if he should happen to be alive, he saw"
        vocab:
          - {w: "apenas ... cuando", d: "scarcely ... when, no sooner ... than"}
          - {w: "deslizarse", d: "to slide, slip down"}
          - {w: "alcornoque", d: "cork oak"}
          - {w: "priesa", d: "= prisa, haste (old form); 'a toda priesa' = in all haste"}
          - {w: "apearse", d: "to dismount, get down from a horse"}
          - {w: "lazada", d: "lace, bow, the tie that held the helmet to the armour"}
          - {w: "yelmo", d: "helmet (the full knight's helmet)"}
          - {w: "si acaso", d: "in case, if by chance"}
        diagram:
          - s: "Apenas le vio caído Sancho, cuando se deslizó del alcornoque"
            r: "main verb 1: no sooner did Sancho see him fall than he slid down from the cork oak"
          - s: "y a toda priesa vino"
            r: "main verb 2: and came in all haste"
