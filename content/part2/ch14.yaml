              - s: "y propuso en su corazón"
                r: "result 2: and he resolved in his heart"
                under:
                  - s: "de dejarse dar docientas bofetadas"
                    r: "what he resolved: to let himself be slapped two hundred times"
                    under:
                      - {s: "antes que despertar la cólera para reñir con aquel vestiglo", r: "rather than: sooner than rouse his anger to fight that monster"}
        forms:
          - {w: "cuya", f: "'whose', feminine singular to match the first thing owned, 'grandeza', not the owner (the nose)."}
          - {w: "afeaban", f: "afe- + -aban → afear (to disfigure), imperfect, they (size, colour, warts and hook). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "le afeaban el rostro", f: "'le' (to him) + 'el rostro': Spanish marks whose face with an indirect pronoun and the article, not 'su rostro'."}
          - {w: "viéndole", f: "gerund of ver (to see) + le (him), accent added; 'en' + gerund means 'as soon as'. 'le' for a male person as direct object is leísmo, standard in Cervantes and still accepted for men."}
          - {w: "comenzó", f: "comenz- + -ó → comenzar (to begin), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (comencé, z → c before e)."}
          - {w: "propuso", f: "propus- + -o → proponer (to resolve), preterite, he. Irregular like poner (to put): propuse, propusiste, propuso, propusimos, propusisteis, propusieron."}
          - {w: "dejarse dar", f: "dejar (to let) + se (himself) + dar (to give): 'to let himself be given'; infinitives after 'de'."}
          - {w: "docientas", f: "old form of doscientas (two hundred), feminine to match 'bofetadas'."}
