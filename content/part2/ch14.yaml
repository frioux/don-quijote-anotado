  - sentences:
      - es: "Y, diciendo esto, se levantó en pie y se empuñó en la espada, esperando qué resolución tomaría el Caballero del Bosque; el cual, con voz asimismo sosegada, respondió y dijo:"
        literal: "And, saying this, himself he-raised on foot and himself he-gripped on the sword, waiting-for what resolution would-take the Knight of-the Grove; the which, with voice likewise calm, answered and said:"
        ormsby: "And so saying he stood up and laid his hand on his sword, waiting to see what the Knight of the Grove would do, who in an equally calm voice said in reply,"
        vocab:
          - {w: "levantarse en pie", d: "to stand up, get to one's feet"}
          - {w: "empuñarse en la espada", d: "to grip one's sword by the hilt (modern 'empuñar la espada'); from 'puño', fist, hilt"}
          - {w: "resolución", d: "decision, what someone decides to do"}
          - {w: "asimismo", d: "likewise, also"}
          - {w: "sosegado", d: "calm, quiet, unruffled"}
        diagram:
          - s: "se levantó en pie"
            r: "main verb 1: he stood up"
            under:
              - {s: "diciendo esto", r: "when: as he said this"}
          - s: "y se empuñó en la espada"
            r: "main verb 2: and gripped his sword"
            under:
              - s: "esperando"
                r: "how: waiting (to see)"
                under:
                  - {s: "qué resolución tomaría el Caballero del Bosque", r: "what he waited for: what the Knight of the Grove would decide"}
          - s: "el cual"
            r: "new main subject: who (the Knight of the Grove)"
            under:
              - {s: "con voz asimismo sosegada", r: "how: in a voice just as calm"}
              - {s: "respondió y dijo:", r: "main verbs 3 and 4: answered and said"}
        forms:
          - {w: "diciendo", f: "gerund of decir (to say): 'saying'. The e of the stem turns to i in the gerund: decir → diciendo."}
          - {w: "se levantó", f: "levant- + -ó → levantarse (to get up), preterite, he, with 'se' (himself). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "se empuñó", f: "empuñ- + -ó → empuñarse (to grip), preterite, he. Same -ó preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "esperando", f: "gerund of esperar (to wait): 'waiting'."}
          - {w: "tomaría", f: "tomar- + -ía → tomar (to take), conditional, he: 'would take'. The conditional adds endings to the whole infinitive: -ía, -ías, -ía, -íamos, -íais, -ían. Here it is the future seen from the past."}
          - {w: "el cual", f: "'who, which', masculine to match 'el Caballero del Bosque'; a heavier relative than 'que', used after a semicolon."}
          - {w: "sosegada", f: "sosegad- + -a → sosegado (calm), participle of sosegar (to calm) used as an adjective, feminine to match 'voz'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Al buen pagador no le duelen prendas: el que una vez, señor don Quijote, pudo venceros transformado, bien podrá tener esperanza de rendiros en vuestro propio ser."
        literal: "— To-the good payer not to-him hurt pledges: he who one time, sir Don Quijote, could defeat-you transformed, well will-be-able to-have hope of subduing-you in your own being."
        ormsby: "“Pledges don’t distress a good payer; he who has succeeded in vanquishing you once when transformed, Sir Don Quixote, may fairly hope to subdue you in your own proper shape;"
        ormsby_note: "Proverb 164."
        vocab:
          - {w: "al buen pagador no le duelen prendas", d: "proverb: 'a good payer is not pained by pledges', i.e. whoever means to keep his word does not mind giving guarantees; here, 'I am ready to make good my claim'"}
          - {w: "prenda", d: "pledge, security left for a debt"}
          - {w: "rendir", d: "to make (someone) yield, subdue"}
          - {w: "en vuestro propio ser", d: "in your own true self, your own shape"}
        diagram:
          - s: "Al buen pagador no le duelen prendas:"
            r: "main clause 1: the proverb, 'a good payer minds no pledges'"
          - s: "bien podrá tener esperanza"
            r: "main clause 2: may well have hope"
            under:
              - s: "el que"
                r: "subject: he who"
                under:
                  - {s: "una vez", r: "when: once"}
                  - {s: "pudo venceros transformado", r: "describes 'el que': was able to beat you while you were transformed"}
              - {s: "señor don Quijote", r: "addressed: Don Quijote"}
              - {s: "de rendiros en vuestro propio ser", r: "hope of what: of defeating you in your own shape"}
        forms:
          - {w: "Al", f: "a + el, the contraction modern Spanish still makes."}
          - {w: "no le duelen", f: "duel- + -en → doler (to hurt), present, they (the pledges), with 'le' (to him). The stem o becomes ue when stressed: duelo, dueles, duele, dolemos, doléis, duelen. Spanish says 'pledges hurt to him', not 'he minds pledges'."}
          - {w: "pudo", f: "pud- + -o → poder (to be able), preterite, he. Irregular: pude, pudiste, pudo, pudimos, pudisteis, pudieron."}
          - {w: "venceros", f: "vencer (to defeat) + os (you, the polite vos plural form used to one person), the pronoun hung on the infinitive after 'pudo'."}
          - {w: "transformado", f: "participle of transformar (to transform), masculine singular to match the 'you' (Don Quijote): 'when you were transformed'."}
          - {w: "podrá", f: "podr- + -á → poder (to be able), future, he. Irregular stem podr-: podré, podrás, podrá, podremos, podréis, podrán."}
          - {w: "rendiros", f: "rendir (to subdue) + os (you), the pronoun hung on the infinitive after 'de'."}
          - {w: "vuestro", f: "'your', the possessive of vos/vosotros, masculine singular to match 'ser' (here the noun 'being, self'). The knights address each other with the formal vos."}
        note: "The Knight of the Grove takes Don Quijote's excuse at face value: if he beat Don Quijote once in an enchanted shape, he can surely beat him in his own. He has learned the knight's name only from this speech."
      - es: "Mas, porque no es bien que los caballeros hagan sus fechos de armas ascuras, como los salteadores y rufianes, esperemos el día, para que el sol vea nuestras obras."
        literal: "But, because not it-is good that the knights do their deeds of arms in-the-dark, like the highwaymen and ruffians, let-us-wait-for the day, so that the sun may-see our works."
        ormsby: "but as it is not becoming for knights to perform their feats of arms in the dark, like highwaymen and bullies, let us wait till daylight, that the sun may behold our deeds;"
        vocab:
          - {w: "mas", d: "but (literary; without accent, unlike 'más', more)"}
          - {w: "no es bien que", d: "it is not right, not fitting that"}
          - {w: "fechos", d: "= hechos, deeds; the old f- spelling, used on purpose as the language of the romances of chivalry"}
          - {w: "fechos de armas", d: "feats of arms"}
          - {w: "ascuras", d: "= a oscuras, in the dark (old spelling run together)"}
          - {w: "salteador", d: "highwayman, robber who attacks travellers"}
          - {w: "rufián", d: "ruffian, bully; also a pimp"}
          - {w: "obras", d: "deeds, works"}
        diagram:
          - s: "esperemos el día"
            r: "main verb: let us wait for daylight"
            under:
              - s: "porque no es bien"
                r: "why: because it is not right"
                under:
                  - s: "que los caballeros hagan sus fechos de armas ascuras"
                    r: "what is not right: that knights do their deeds of arms in the dark"
                    under:
                      - {s: "como los salteadores y rufianes", r: "how: like highwaymen and ruffians"}
              - {s: "para que el sol vea nuestras obras", r: "purpose: so that the sun may see our deeds"}
        forms:
          - {w: "hagan", f: "hag- + -an → hacer (to do), present subjunctive, they, after 'no es bien que'. Irregular: haga, hagas, haga, hagamos, hagáis, hagan."}
          - {w: "fechos", f: "old spelling of hechos (deeds), plural of hecho; Latin f- became h- in Spanish, and the romances kept the f."}
          - {w: "esperemos", f: "esper- + -emos → esperar (to wait for), present subjunctive, we: 'let us wait'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "vea", f: "ve- + -a → ver (to see), present subjunctive, it (the sun), after 'para que'. ver (to see) in the present subjunctive: vea, veas, vea, veamos, veáis, vean."}
          - {w: "nuestras", f: "nuestr- + -as → nuestro (our), feminine plural to match 'obras'."}
        note: "Fighting by daylight 'so that the sun may see our deeds' is a commonplace of chivalry: a knight's combat must be open, unlike the ambushes of thieves."
      - es: "Y ha de ser condición de nuestra batalla que el vencido ha de quedar a la voluntad del vencedor, para que haga dél todo lo que quisiere, con tal que sea decente a caballero lo que se le ordenare."
        literal: "And it-has to be condition of our battle that the vanquished has to remain at the will of-the victor, so that he-may-do with-him all that which he-may-wish, provided that it-be fitting to knight that which to-him may-be-ordered."
