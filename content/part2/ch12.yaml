  - sentences:
      - es: "Digo que dicen que dejó el autor escrito que los había comparado en la amistad a la que tuvieron Niso y Euríalo, y Pílades y Orestes;"
        literal: "I-say that they-say that left the author written that them he-had compared in the friendship to the [one] that had Niso and Euríalo, and Pílades and Orestes;"
        ormsby: "I may add that they say the author left it on record that he likened their friendship to that of Nisus and Euryalus, and Pylades and Orestes;"
        vocab:
          - {w: "dejar escrito", d: "to leave in writing, put on record"}
          - {w: "Niso y Euríalo", d: "Nisus and Euryalus, the Trojan friends of Virgil's Aeneid (book 9), who died together on a night raid"}
          - {w: "Pílades y Orestes", d: "Pylades and Orestes, the proverbial pair of loyal friends of Greek legend; Pylades stood by Orestes through his revenge and wanderings"}
        diagram:
          - s: "Digo"
            r: "main verb: I say"
            under:
              - s: "que dicen"
                r: "what I say: that people say"
                under:
                  - s: "que dejó el autor escrito"
                    r: "what they say: that the author left in writing"
                    under:
                      - s: "que los había comparado en la amistad"
                        r: "what he wrote: that he had compared them in friendship"
                        under:
                          - {s: "a la que tuvieron Niso y Euríalo, y Pílades y Orestes", r: "to what: to the friendship of Nisus and Euryalus, and of Pylades and Orestes"}
        forms:
          - {w: "Digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "dicen", f: "dic- + -en → decir (to say), present, they (people): 'they say'. Same present: digo, dices, dice, decimos, decís, dicen."}
          - {w: "dejó", f: "dej- + -ó → dejar (to leave), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "escrito", f: "irregular participle of escribir (to write); with dejar (to leave), 'left written', i.e. recorded."}
          - {w: "había comparado", f: "habí- + -a → haber (to have), imperfect, he, + comparado, the participle of comparar (to compare): pluperfect, 'had compared'. haber (to have) in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "la que", f: "'the one that', feminine to match 'amistad', which it stands for."}
          - {w: "tuvieron", f: "tuv- + -ieron → tener (to have), preterite, they. Irregular: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron."}
        note: "The chain 'I say that they say that the author left written' mocks the hearsay on which the whole history claims to rest. Comparing a horse and a donkey to the most famous friends of classical poetry is mock-heroic."
