summary: |
  The night after the meeting with the players' cart, Don Quijote and Sancho camp under tall shady trees and eat from the donkey's saddlebags. Sancho is glad he chose the foals of his master's mares as his reward rather than the spoils of the next adventure, since a bird in the hand is worth a vulture on the wing. Don Quijote replies that the players' crowns and Cupid's wings would have been his, and Sancho answers that stage crowns are only tinsel. Don Quijote praises the theatre as a mirror of human life: on the stage, as in the world, everyone plays a part, and when the play ends death strips off the costumes and all lie equal in the grave. Sancho caps it with the old comparison of the chess pieces, all tossed into one bag at the end of the game, and then thanks his master's conversation for manuring the barren soil of his wit.

  The narrator laughs with Don Quijote at Sancho's fine speech, which usually tumbles from the heights of his simplicity into the depths of his ignorance, though he shines at stringing proverbs. Sancho unbridles Dapple but leaves Rocinante saddled, by the old custom of knights errant. The narrator dwells on the close friendship of horse and donkey, which the author is said to have compared to that of Nisus and Euryalus and of Pylades and Orestes, to the shame of men who keep friendships so badly, and he lists the lessons men have learned from animals.

  Sancho falls asleep under a cork oak and Don Quijote dozes under an evergreen oak, until a noise wakes him: two men on horseback have arrived, and one of them throws himself on the ground with a clatter of armour. Don Quijote wakes Sancho with the news that they have an adventure, and the two listen as the stranger, the Knight of the Grove, tunes a lute and sings a sonnet to his lady, then laments that the most beautiful and ungrateful Casildea de Vandalia lets him waste away in endless travels, though he has made all the knights of Navarre, León, Andalusia, Castile and La Mancha confess her the most beautiful in the world. Don Quijote, a knight of La Mancha who has confessed no such thing, says the man is raving.

  Hearing voices, the Knight of the Grove asks whether they belong to the happy or the afflicted; Don Quijote answers 'the afflicted', and the two knights sit together on the ground in courteous talk, as if they were not going to break each other's heads at daybreak. Both confess they are in love; Sancho cuts in to defend Dulcinea's gentleness, and the Knight of the Grove remarks that his own squire never dares to speak when his master does. Then the other squire takes Sancho by the arm and leads him off so the two squires can talk as freely as they like, leaving their masters to their love stories, and the narrator promises that the squires' talk was as amusing as their masters' was grave.
context: |
  The world as a stage. The supper talk picks up from the players' cart in chapter 11. Don Quijote's defence of the theatre repeats the classical definition of drama, attributed to Cicero, that the canon of Toledo quoted in Part I chapter 48: the play is a mirror of human life. His image of life as a play in which some are given the part of emperors and others of popes, until death takes back the costumes, was one of the great commonplaces of the age; Calderón would later build a whole religious play, 'El gran teatro del mundo', on it. Sancho's answer, the chess pieces that all go back into one bag, was just as familiar, and Ormsby's note sets beside it a quatrain of Omar Khayyám in FitzGerald's English. Sancho's own speech shows the comic side of his 'improvement': he borrows his master's high style and builds a farming allegory (conversation as manure, service as tilling) that ends with fruit slipping off paths. The narrator's verdict, that Sancho tumbles 'from the mountain of his simplicity to the abyss of his ignorance' whenever he talks 'de oposición', as if competing for a university chair, is itself mock-heroic.

  Horse and donkey. The digression on Rocinante and Dapple is one of the narrator's games with his sources: the author is said to have written whole chapters on their friendship and left them out for decorum, though he forgets himself and tells how they scratched each other and stood with Rocinante's neck across Dapple's for three days. He compares them to the famous friends of antiquity: Nisus and Euryalus, the Trojan comrades who die together in Book IX of Virgil's Aeneid, and Pylades and Orestes, the inseparable friends of Greek tragedy. The verses 'No hay amigo para amigo: / las cañas se vuelven lanzas' come, as Ormsby notes, from a ballad in Ginés Pérez de Hita's 'Guerras civiles de Granada' about the feuds of the Moorish families of Granada, where a jousting game with canes turns into a fight with lances; 'De amigo a amigo la chinche' (between friends, the bedbug) is a popular saying about friends who still keep an eye on each other. The list of lessons from animals draws on old natural history and emblem books: the stork was believed to have taught the enema, the dog the use of vomiting (and gratitude), the crane vigilance, the ant foresight, the elephant modesty and the horse loyalty. The rule that a knight may unbridle his horse in the field but never unsaddle it is presented as 'ancient usage' of knights errant, part of Don Quijote's private code.

  The Knight of the Grove. The adventure that ends the chapter is built from the conventions of the books of chivalry and the pastoral romance: a knight who throws himself down sighing, tunes a lute, sings a love sonnet in the open, and complains to the night of an ungrateful lady. His sonnet, with its wax and diamond, imitates the affected love poetry of the day, and Ormsby notes that the verses of Part II are more or less burlesques, unlike the serious poems of Part I. His lady's name, Casildea de Vandalia, sounds like a parody of 'Dulcinea del Toboso'; Vandalia was an old learned name for Andalusia, and the Tartesians he names were the ancient people of Tartessos in the same region. His boast that he has made every knight of La Mancha confess Casildea the most beautiful is the challenge that touches Don Quijote directly, since Don Quijote is a knight of La Mancha and has confessed nothing of the kind. The courteous exchange, 'of the happy or of the afflicted?', and the narrator's remark that the two sit peacefully side by side as if they were not going to break each other's heads at dawn, set up the duel the title has already announced. Sancho, as usual, breaks the solemn register: his lady Dulcinea is 'as gentle as a lamb' and 'softer than butter', and the rival squire's invitation to talk 'escuderilmente' (squire-fashion) prepares a comic counterpart to the masters' grave dialogue.

  Reading Cervantes' Spanish. The old forms are many: rencuentro (reencuentro), sombroso (sombrío), mesmo and mesma (mismo), veen and vees (ven, ves), habemos (hemos), emienda (enmienda), recebido (recibido), cristel (clister, enema), vigüela (vihuela), aflición (aflicción), arreo (in a row), vuesa merced (vuestra merced), and the contractions deste, desta, della, dél and destos. Pronouns hang on a verb that opens a clause (Rióse, parecióle, bástame, quédese), and 'meneallo' is the old assimilated form of 'menearlo'. The -ra form of the subjunctive does the work of a conditional (hubiera andado, se las quitara, te las pusiera), the -se imperfect subjunctive reports an order ('que ... anduviesen en campaña, o no durmiesen debajo de techado, no desaliñase a Rocinante'), the future subjunctive marks an open future ('todo cuanto quisiéremos'), and 'haber de' means 'must, be bound to' (se me ha de pegar, lo que habemos de ser). 'Ha que' stands for 'hace que', 'en' + gerund means 'as soon as' (en llegando, en acabándose), and the knights address each other with the courteous vosotros forms (sentaos, decís, tenéis, nombrastes). Watch the false friends: discreto (shrewd), admirar (to astonish), comedia (any play), república (the commonwealth), aparente (for show), puesto que (although) and todavía (all the same).
