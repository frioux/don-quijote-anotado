  - sentences:
      - es: "Con un ¡ay!, arrancado, al parecer, de lo íntimo de su corazón, dio fin a su canto el Caballero del Bosque, y, de allí a un poco, con voz doliente y lastimada, dijo:"
        literal: "With an alas!, torn-out, to-the seeming, from the inmost of his heart, gave end to his song the Caballero del Bosque, and, from there to a little, with voice grieving and pitiful, he-said:"
        ormsby: "With an “Ah me!” that seemed to be drawn from the inmost recesses of his heart, the Knight of the Grove brought his lay to an end, and shortly afterwards exclaimed in a melancholy and piteous voice,"
        vocab:
          - {w: "¡ay!", d: "ah!, alas!, the cry of pain or grief"}
          - {w: "arrancar", d: "to tear out, wrench out"}
          - {w: "al parecer", d: "apparently, as it seemed"}
          - {w: "lo íntimo", d: "the innermost part, the depths"}
          - {w: "dar fin a", d: "to put an end to, finish"}
          - {w: "de allí a un poco", d: "a little after that, shortly afterwards"}
          - {w: "doliente", d: "sorrowful, grieving"}
          - {w: "lastimado", d: "pained, pitiful"}
        diagram:
          - s: "dio fin a su canto el Caballero del Bosque"
            r: "main verb 1: the Knight of the Wood ended his song"
            under:
              - s: "Con un ¡ay!"
                r: "how: with an 'alas!'"
                under:
                  - {s: "arrancado, al parecer, de lo íntimo de su corazón", r: "describes '¡ay!': torn, it seemed, from the depths of his heart"}
          - s: "dijo:"
            r: "main verb 2 (after 'y'): he said"
            under:
              - {s: "de allí a un poco", r: "when: a little later"}
              - {s: "con voz doliente y lastimada", r: "how: in a sorrowful, pained voice"}
        forms:
          - {w: "arrancado", f: "arranc- + -ado → arrancar (to tear out), participle, masculine to match '¡ay!', treated as a noun."}
          - {w: "lo íntimo", f: "lo + adjective íntimo (innermost) makes an abstract noun: 'the innermost part'."}
          - {w: "dio", f: "d- + -io → dar (to give), preterite, he. Irregular: di, diste, dio, dimos, disteis, dieron. The subject 'el Caballero del Bosque' comes after the verb."}
          - {w: "doliente", f: "dol- + -iente → doler (to hurt): an adjective in -ente, 'grieving'."}
          - {w: "lastimada", f: "lastim- + -ada → lastimar (to hurt), participle used as an adjective, feminine to match 'voz'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— ¡Oh la más hermosa y la más ingrata mujer del orbe!"
        literal: "— Oh the most beautiful and the most ungrateful woman of-the world!"
        ormsby: "“O fairest and most ungrateful woman on earth!"
        vocab:
          - {w: "ingrato", d: "ungrateful; in love poetry the cruel lady who does not return the lover's devotion"}
          - {w: "orbe", d: "the world, the globe (literary)"}
        diagram:
          - s: "la más hermosa y la más ingrata mujer"
            r: "exclamation, no verb: O most beautiful and most ungrateful woman"
            under:
              - {s: "del orbe", r: "where: in the whole world"}
        forms:
          - {w: "la más hermosa, la más ingrata", f: "article + más + adjective = superlative, 'the most beautiful, the most ungrateful'; hermos- + -a and ingrat- + -a, feminine to match 'mujer'."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes; after a superlative, 'de' = 'in': 'in the world'."}
      - es: "¿Cómo que será posible, serenísima Casildea de Vandalia, que has de consentir que se consuma y acabe en continuas peregrinaciones y en ásperos y duros trabajos este tu cautivo caballero?"
        literal: "How that will-it-be possible, most-serene Casildea de Vandalia, that you-have to consent that may-waste-away and may-end in continual wanderings and in harsh and hard toils this your captive knight?"
        ormsby: "What! can it be, most serene Casildea de Vandalia, that thou wilt suffer this thy captive knight to waste away and perish in ceaseless wanderings and rude and arduous toils?"
        vocab:
          - {w: "¿cómo que ...?", d: "how can it be that ...?, an indignant question"}
          - {w: "serenísima", d: "most serene, a title of royalty, here lover's flattery"}
          - {w: "Casildea de Vandalia", d: "the knight's lady; 'Vandalia' is an old learned name for Andalusia, said to come from the Vandals, and the name is built like 'Dulcinea del Toboso'"}
          - {w: "haber de", d: "to have to, be going to; 'has de consentir' = you are to allow, you will allow"}
          - {w: "consentir", d: "to allow, permit, put up with"}
          - {w: "consumirse", d: "to waste away, be consumed"}
          - {w: "peregrinación", d: "wandering, long journey (not only a religious pilgrimage)"}
          - {w: "áspero", d: "harsh, rough"}
          - {w: "trabajos", d: "false friend: hardships, toils, not 'jobs'"}
          - {w: "cautivo", d: "captive, a prisoner (of love)"}
        diagram:
          - s: "¿Cómo que será posible"
            r: "main verb: how can it be possible"
            under:
              - {s: "serenísima Casildea de Vandalia", r: "address: most serene Casildea de Vandalia"}
              - s: "que has de consentir"
                r: "what is possible: that you will allow"
                under:
                  - s: "que se consuma y acabe"
                    r: "what you allow: that ... waste away and perish"
                    under:
                      - {s: "en continuas peregrinaciones y en ásperos y duros trabajos", r: "where, how: in endless wanderings and harsh, hard toils"}
                      - {s: "este tu cautivo caballero", r: "subject: this captive knight of yours"}
        forms:
          - {w: "será", f: "ser- + -á → ser (to be), future, it: 'can it be?'. The future here voices wonder, not time. ser (to be) in the future: seré, serás, será, seremos, seréis, serán."}
          - {w: "serenísima", f: "seren- + -ísima → sereno (serene), superlative 'most serene', feminine to match the lady."}
          - {w: "has de consentir", f: "h- + -as → haber (to have), present, you: he, has, ha, hemos, habéis, han; 'haber de' + infinitive = 'to be going to, have to': 'you are to allow'."}
          - {w: "se consuma", f: "consum- + -a → consumirse (to waste away), present subjunctive, he, with 'se'. The present subjunctive of -er and -ir verbs: -a, -as, -a, -amos, -áis, -an. Subjunctive after 'consentir que' (allow that)."}
          - {w: "acabe", f: "acab- + -e → acabar (to end, perish), present subjunctive, he. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "continuas, ásperos, duros", f: "continu- + -as, feminine plural to match 'peregrinaciones'; áspero and duro + -os, masculine plural to match 'trabajos'."}
          - {w: "este tu", f: "demonstrative and possessive together, 'this your', an old emphatic pattern; modern Spanish says 'este caballero tuyo'."}
        note: "The knight speaks to his absent lady with 'tú', as poets did, while Don Quijote's own laments to Dulcinea mix 'tú' and 'vos'."
      - es: "¿No basta ya que he hecho que te confiesen por la más hermosa del mundo todos los caballeros de Navarra, todos los leoneses, todos los tartesios, todos los castellanos, y, finalmente, todos los caballeros de la Mancha?"
        literal: "Not is-it-enough already that I-have made that you they-may-acknowledge as the most beautiful of-the world all the knights of Navarra, all the Leonese, all the Tartessians, all the Castilians, and, finally, all the knights of la Mancha?"
        ormsby: "It is not enough that I have compelled all the knights of Navarre, all the Leonese, all the Tartesians, all the Castilians, and finally all the knights of La Mancha, to confess thee the most beautiful in the world?”"
        vocab:
          - {w: "bastar", d: "to be enough, suffice"}
          - {w: "confesar por", d: "to acknowledge as, admit to be"}
          - {w: "Navarra", d: "Navarre, the kingdom in the north of Spain, by the Pyrenees"}
          - {w: "leoneses", d: "the men of León, the old kingdom of north-west Spain"}
          - {w: "tartesios", d: "Tartessians, people of Tartessos, the ancient kingdom of south-west Andalusia; a learned word for Andalusians"}
          - {w: "castellanos", d: "Castilians"}
        diagram:
          - s: "¿No basta ya"
            r: "main verb: is it not enough already"
            under:
              - s: "que he hecho"
                r: "subject: that I have made"
                under:
                  - s: "que te confiesen por la más hermosa del mundo"
                    r: "what I have made happen: that they acknowledge you as the most beautiful in the world"
                    under:
                      - {s: "todos los caballeros de Navarra, todos los leoneses, todos los tartesios, todos los castellanos", r: "subject: all the knights of Navarre, of León, of Andalusia, of Castile"}
                      - {s: "y, finalmente, todos los caballeros de la Mancha", r: "subject, last: and finally all the knights of la Mancha"}
        forms:
          - {w: "basta", f: "bast- + -a → bastar (to be enough), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "he hecho", f: "h- + -e → haber (to have), present, I: he, has, ha, hemos, habéis, han; + hecho, the irregular participle of hacer (to make): present perfect, 'I have made'."}
          - {w: "te confiesen", f: "confies- + -en → confesar (to acknowledge), present subjunctive, they, with 'te' (you, the lady). The stem e becomes ie when stressed: confiese, confieses, confiese, confesemos, confeséis, confiesen. Subjunctive after 'hacer que' (to make someone do)."}
          - {w: "la más hermosa", f: "article + más + adjective = superlative; hermos- + -a, feminine to match the lady."}
          - {w: "del", f: "de + el; after a superlative 'de' means 'in': 'in the world'."}
        note: "The list climbs to 'all the knights of la Mancha', which would have to include Don Quijote himself; he objects at once."
  - sentences:
      - es: "— Eso no —dijo a esta sazón don Quijote—, que yo soy de la Mancha y nunca tal he confesado, ni podía ni debía confesar una cosa tan perjudicial a la belleza de mi señora; y este tal caballero ya vees tú, Sancho, que desvaría. Pero, escuchemos: quizá se declarará más."
        literal: "— That not —said at this moment Don Quijote—, for I am of la Mancha and never such I-have confessed, nor I-could nor I-ought to-confess a thing so damaging to the beauty of my lady; and this such knight already see you, Sancho, that he-raves. But, let-us-listen: perhaps himself he-will-reveal more."
        ormsby: "“Not so,” said Don Quixote at this, “for I am of La Mancha, and I have never confessed anything of the sort, nor could I nor should I confess a thing so much to the prejudice of my lady’s beauty; thou seest how this knight is raving, Sancho. But let us listen, perhaps he will tell us more about himself.”"
        vocab:
          - {w: "eso no", d: "not that!, certainly not"}
          - {w: "a esta sazón", d: "at this point, at this moment"}
          - {w: "tal", d: "such a thing"}
          - {w: "perjudicial a", d: "harmful to, damaging to"}
          - {w: "este tal", d: "this fellow, this same (knight), slightly scornful"}
          - {w: "vees", d: "= ves, 'you see' (old form)"}
          - {w: "desvariar", d: "to rave, talk nonsense"}
          - {w: "declararse", d: "to reveal oneself, say more about oneself"}
        diagram:
          - s: "Eso no"
            r: "main statement, no verb: not that!"
            under:
              - {s: "dijo a esta sazón don Quijote", r: "aside: said Don Quijote at this point"}
              - {s: "que yo soy de la Mancha", r: "why, 1: for I am from la Mancha"}
              - {s: "y nunca tal he confesado", r: "why, 2: and I have never admitted any such thing"}
              - {s: "ni podía ni debía confesar una cosa tan perjudicial a la belleza de mi señora", r: "why, 3: nor could or should I admit a thing so damaging to my lady's beauty"}
          - s: "ya vees tú, Sancho"
            r: "main verb 2: you can see, Sancho"
            under:
              - {s: "y este tal caballero", r: "object, put first: and this knight"}
              - {s: "que desvaría", r: "what you see: that he is raving"}
          - {s: "Pero, escuchemos", r: "main verb 3: but let us listen"}
          - {s: "quizá se declarará más", r: "main verb 4: perhaps he will reveal more of himself"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "soy", f: "ser (to be), present, I: soy, eres, es, somos, sois, son."}
          - {w: "he confesado", f: "h- + -e → haber (to have), present, I: he, has, ha, hemos, habéis, han; + confesado, the participle of confesar (to admit): present perfect, 'I have admitted'."}
          - {w: "podía", f: "pod- + -ía → poder (to be able), imperfect, I: 'I could'. The imperfect of -er verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "debía", f: "deb- + -ía → deber (ought, must), imperfect, I: 'I ought'. Same -ía imperfect."}
          - {w: "vees", f: "old form of ves: ver (to see), present, you. ver (to see) in the present: veo, ves (old vees), ve, vemos, veis, ven."}
          - {w: "desvaría", f: "desvarí- + -a → desvariar (to rave), present, he; the accent on í keeps the stress. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "escuchemos", f: "escuch- + -emos → escuchar (to listen), present subjunctive, we: 'let us listen'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "se declarará", f: "declarar- + -á → declararse (to reveal oneself), future, he, with 'se'. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
  - sentences:
      - es: "— Si hará —replicó Sancho—, que término lleva de quejarse un mes arreo."
        literal: "— Indeed he-will-do —replied Sancho—, for look he-carries of complaining-himself a month on-end."
        ormsby: "“That he will,” returned Sancho, “for he seems in a mood to bewail himself for a month at a stretch.”"
        vocab:
