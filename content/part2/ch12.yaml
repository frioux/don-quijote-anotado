          - {w: "delante de", d: "in front of, in the presence of"}
          - {w: "otro tan...", d: "another as ...: Sancho breaks off before saying 'as great as your master'"}
          - {w: "quédese aquí", d: "let it rest there, say no more"}
          - {w: "peor es meneallo", d: "proverb: 'it is worse to stir it', i.e. better leave the matter alone (like a smell that gets worse when stirred)"}
          - {w: "meneallo", d: "= menearlo, to stir it (old assimilated form)"}
        diagram:
          - s: "dijo Sancho"
            r: "main verb: said Sancho"
            under:
              - {s: "Pues a fe", r: "oath: well, by my faith"}
              - {s: "que he hablado yo", r: "what he said, 1: that I have spoken"}
              - {s: "y puedo hablar delante de otro tan", r: "what he said, 2: and I can speak before another as (great) ..."}
              - s: "y aun quédese aquí"
                r: "what he said, 3: and better let it rest here"
                under:
                  - {s: "que es peor meneallo", r: "why: for it is worse to stir it"}
