              - {s: "del brazo", r: "by what: by the arm"}
              - {s: "diciendo:", r: "how: saying"}
        forms:
          - {w: "lamentador", f: "lament- + -ador → from lamentar (to lament) with the suffix -dor, 'one who does it': 'lamenter', used here as an adjective after 'caballero'."}
          - {w: "asió", f: "as- + -ió → asir (to seize), preterite, he. The preterite of -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "a don Quijote", f: "the 'personal a': Spanish puts 'a' before a person who is the direct object; English has no word for it."}
