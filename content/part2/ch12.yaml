          - {w: "entallad, imprimid", f: "entallar (to carve) and imprimir (to stamp), imperative, you (vos/vosotros): the vosotros imperative swaps the final -r of the infinitive for -d."}
          - {w: "os", f: "'to you', the object pronoun that goes with vos/vosotros."}
