          - {w: "destos", d: "= de estos, of these (old contraction)"}
          - {w: "recebir", d: "= recibir, to receive (old spelling)"}
          - {w: "advertimiento", d: "= advertencia, lesson, warning (old form)"}
          - {w: "cigüeña", d: "stork"}
          - {w: "cristel", d: "= clister, clyster, an enema (old form)"}
