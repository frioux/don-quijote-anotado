  - sentences:
      - es: "Y no le parezca a alguno que anduvo el autor algo fuera de camino en haber comparado la amistad destos animales a la de los hombres, que de las bestias han recebido muchos advertimientos los hombres y aprendido muchas cosas de importancia, como son: de las cigüeñas, el cristel;"
        literal: "And not to-him may-it-seem to anyone that went the author somewhat out of road in having compared the friendship of-these animals to that of the men, for from the beasts have received many warnings the men and learned many things of importance, as are: from the storks, the clyster;"
        ormsby: "And let no one fancy that the author was at all astray when he compared the friendship of these animals to that of men; for men have received many lessons from beasts, and learned many important things, as, for example, the clyster from the stork,"
        vocab:
          - {w: "no le parezca a alguno", d: "let no one think"}
