          - {w: "vuesa", f: "worn-down spoken form of vuestra (your), feminine to match 'merced'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "ésta", f: "est- + -a → este (this), feminine to match 'aventura'; written with an accent when it stands alone as a pronoun (the older spelling rule)."}
