          - {w: "llevar término de", d: "to look set to, show every sign of"}
          - {w: "quejarse", d: "to lament, complain"}
          - {w: "arreo", d: "on end, in a row, without a break (old adverb)"}
        diagram:
          - s: "Si hará"
            r: "main verb: indeed he will (reveal more)"
            under:
              - {s: "replicó Sancho", r: "aside: Sancho replied"}
              - s: "que término lleva de quejarse"
                r: "why: for he looks set to lament"
                under:
                  - {s: "un mes arreo", r: "how long: a month on end"}
        forms:
          - {w: "hará", f: "har- + -á → hacer (to do), future, he: 'he will (do so)', standing in for 'se declarará'. Irregular stem har-: haré, harás, hará, haremos, haréis, harán."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "lleva", f: "llev- + -a → llevar (to carry), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. The object 'término' is put before the verb."}
          - {w: "quejarse", f: "quejar (to complain) + se (himself), the pronoun hung on the infinitive after 'de'."}
  - sentences:
