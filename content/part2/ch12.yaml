part: 2
chapter: 12
title_es: "Capítulo XII. De la estraña aventura que le sucedió al valeroso don Quijote con el bravo Caballero de los Espejos"
title_en: "Of the strange adventure which befell the valiant Don Quixote with the bold Knight of the Mirrors"
paragraphs:
  - sentences:
      - es: "La noche que siguió al día del rencuentro de la Muerte la pasaron don Quijote y su escudero debajo de unos altos y sombrosos árboles, habiendo, a persuasión de Sancho, comido don Quijote de lo que venía en el repuesto del rucio, y entre la cena dijo Sancho a su señor:"
        literal: "The night that followed the day of-the encounter with Death it they-spent Don Quijote and his squire beneath some tall and shady trees, having, at [the] persuasion of Sancho, eaten Don Quijote of that which was-coming in the provisions of-the grey-donkey, and during the supper said Sancho to his master:"
        ormsby: "The night succeeding the day of the encounter with Death, Don Quixote and his squire passed under some tall shady trees, and Don Quixote at Sancho’s persuasion ate a little from the store carried by Dapple, and over their supper Sancho said to his master,"
        vocab:
          - {w: "rencuentro", d: "= reencuentro, encounter, clash; here the meeting with the players' cart of Death the day before"}
          - {w: "sombroso", d: "shady, giving shade (old word; modern 'sombrío' or 'umbroso')"}
          - {w: "a persuasión de", d: "at the urging of, persuaded by"}
          - {w: "repuesto", d: "store of provisions, the food supply carried for the journey"}
          - {w: "el rucio", d: "'the grey', Sancho's donkey (Ormsby: Dapple); 'rucio' = silver-grey"}
          - {w: "entre la cena", d: "during supper, over supper"}
        diagram:
          - s: "la pasaron"
            r: "main verb 1: they spent it (the night)"
            under:
              - s: "La noche"
                r: "object, put first and picked up again by 'la': the night"
                under:
                  - {s: "que siguió al día del rencuentro de la Muerte", r: "describes 'noche': that followed the day of the meeting with Death"}
              - {s: "don Quijote y su escudero", r: "subject: Don Quijote and his squire"}
              - {s: "debajo de unos altos y sombrosos árboles", r: "where: under some tall shady trees"}
              - s: "habiendo, a persuasión de Sancho, comido don Quijote"
                r: "how: Don Quijote having eaten, at Sancho's urging"
                under:
                  - {s: "de lo que venía en el repuesto del rucio", r: "what he ate: some of what came in the donkey's food store"}
          - s: "dijo Sancho a su señor:"
            r: "main verb 2 (after 'y'): Sancho said to his master"
            under:
              - {s: "entre la cena", r: "when: over supper"}
        forms:
          - {w: "siguió", f: "sigu- + -ió → seguir (to follow), preterite, it (the night). The e of the stem turns to i in the he/they forms: seguí, seguiste, siguió, seguimos, seguisteis, siguieron."}
          - {w: "al, del", f: "al = a + el, del = de + el, the two contractions modern Spanish still makes."}
          - {w: "la pasaron", f: "pas- + -aron → pasar (to spend, pass), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. 'la' (it, feminine) repeats 'La noche', which was put first for emphasis."}
          - {w: "sombrosos", f: "sombr- + -oso → sombroso (shady), from 'sombra' (shade) with the suffix -oso ('full of'); masculine plural to match 'árboles'."}
          - {w: "habiendo ... comido", f: "habiendo, gerund of haber (to have), + comido, participle of comer (to eat): the perfect gerund, 'having eaten'. The subject 'don Quijote' comes after the participle."}
          - {w: "venía", f: "ven- + -ía → venir (to come), imperfect, it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
        note: "The chapter follows straight on from chapter 11, in which Don Quijote met the cart of strolling players dressed as Death, an emperor, a queen, Cupid and a devil."
  - sentences:
      - es: "— Señor, ¡qué tonto hubiera andado yo si hubiera escogido en albricias los despojos de la primera aventura que vuestra merced acabara, antes que las crías de las tres yeguas!"
        literal: "— Sir, what fool would-have gone-about I if I-had chosen as reward-for-good-news the spoils of the first adventure that your grace should-achieve, rather than the foals of the three mares!"
        ormsby: "“Señor, what a fool I should have looked if I had chosen for my reward the spoils of the first adventure your worship achieved, instead of the foals of the three mares."
        vocab:
          - {w: "andar tonto", d: "to be a fool, behave like a fool; 'andar' + adjective = to be, go about being"}
          - {w: "albricias", d: "reward given to the bringer of good news"}
          - {w: "despojos", d: "spoils, booty taken from a defeated enemy"}
          - {w: "acabar una aventura", d: "to achieve, bring an adventure to an end (chivalric phrase)"}
          - {w: "antes que", d: "rather than, in preference to"}
          - {w: "cría", d: "young of an animal; here foal"}
          - {w: "yegua", d: "mare"}
        diagram:
          - s: "¡qué tonto hubiera andado yo"
            r: "main verb: what a fool I would have been"
            under:
              - {s: "Señor", r: "addressed: sir"}
              - s: "si hubiera escogido en albricias los despojos de la primera aventura"
                r: "condition: if I had chosen as my reward the spoils of the first adventure"
                under:
                  - {s: "que vuestra merced acabara", r: "describes 'aventura': that your worship should achieve"}
                  - {s: "antes que las crías de las tres yeguas", r: "rather than: instead of the foals of the three mares"}
        forms:
          - {w: "hubiera andado", f: "hubier- + -a → haber (to have), imperfect subjunctive (-ra form), I, + andado, participle of andar (to go, be): 'I would have been'. The -ra form here does the work of a conditional ('habría andado'). haber (to have) in the -ra form: hubiera, hubieras, hubiera, hubiéramos, hubierais, hubieran."}
          - {w: "hubiera escogido", f: "hubiera (haber (to have), -ra imperfect subjunctive, I: hubiera, hubieras, hubiera, hubiéramos, hubierais, hubieran) + escogido, participle of escoger (to choose): pluperfect subjunctive after 'si', 'if I had chosen'."}
          - {w: "acabara", f: "acab- + -ara → acabar (to finish, achieve), imperfect subjunctive (-ra form), you (vuestra merced takes the he/she form): 'that you might achieve'. The -ra form of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran."}
          - {w: "crías", f: "cría (young animal) + -s, plural; from criar (to rear, breed)."}
        note: "In chapter 10 Don Quijote, overjoyed at the news that Dulcinea was coming, offered Sancho as his reward either the best spoil of his next adventure or the foals his three mares would bear that year. Sancho took the foals, and after the adventure of the players' cart he is glad he did."
      - es: "En efecto, en efecto, más vale pájaro en mano que buitre volando."
        literal: "In effect, in effect, more is-worth bird in hand than vulture flying."
        ormsby: "After all, ‘a sparrow in the hand is better than a vulture on the wing.’ ”"
        ormsby_note: "Proverb 167."
        vocab:
          - {w: "en efecto", d: "in fact, after all, sure enough (not 'in effect')"}
          - {w: "más vale ... que", d: "it is better ... than; 'valer más' = to be worth more"}
          - {w: "más vale pájaro en mano que buitre volando", d: "proverb: a bird in the hand is worth a vulture flying (English 'a bird in the hand is worth two in the bush')"}
          - {w: "buitre", d: "vulture"}
        diagram:
          - s: "más vale"
            r: "main verb: is worth more"
            under:
              - {s: "En efecto, en efecto", r: "linking: after all, after all"}
              - {s: "pájaro en mano", r: "subject: a bird in the hand"}
              - {s: "que buitre volando", r: "than: a vulture on the wing"}
        forms:
          - {w: "vale", f: "val- + -e → valer (to be worth), present, it. Irregular in the 'I' form: valgo, vales, vale, valemos, valéis, valen."}
          - {w: "volando", f: "vol- + -ando → volar (to fly), gerund, 'flying', describing 'buitre'. -ar verbs make the gerund in -ando."}
        note: "Proverbs drop the article: 'pájaro en mano', 'buitre volando'. Sancho's version has a vulture where the usual Spanish form has 'ciento volando' (a hundred flying)."
  - sentences:
      - es: "— Todavía —respondió don Quijote—, si tú, Sancho, me dejaras acometer, como yo quería, te hubieran cabido en despojos, por lo menos, la corona de oro de la Emperatriz y las pintadas alas de Cupido, que yo se las quitara al redropelo y te las pusiera en las manos."
        literal: "— All-the-same —answered Don Quijote—, if you, Sancho, me had-let attack, as I wanted, to-you would-have fallen as spoils, at the least, the crown of gold of the Empress and the painted wings of Cupid, for I from-them them would-have-taken against-the-grain and to-you them would-have-put in the hands."
        ormsby: "“At the same time, Sancho,” replied Don Quixote, “if thou hadst let me attack them as I wanted, at the very least the emperor’s gold crown and Cupid’s painted wings would have fallen to thee as spoils, for I should have taken them by force and given them into thy hands.”"
        vocab:
          - {w: "todavía", d: "old sense 'all the same, even so', not 'still, yet'"}
          - {w: "acometer", d: "to attack, charge"}
          - {w: "caber", d: "here 'to fall to one's share': 'te hubieran cabido' = would have fallen to you"}
          - {w: "en despojos", d: "as spoils, as booty"}
          - {w: "por lo menos", d: "at least"}
          - {w: "Cupido", d: "Cupid, the Roman god of love, one of the costumed players on the cart"}
          - {w: "al redropelo", d: "against the grain, roughly, by force (from 'redropelo', rubbing hair the wrong way)"}
        diagram:
          - s: "te hubieran cabido en despojos"
            r: "main verb: would have fallen to you as spoils"
            under:
              - {s: "Todavía", r: "linking: all the same"}
              - s: "si tú, Sancho, me dejaras acometer"
                r: "condition: if you, Sancho, had let me attack"
                under:
                  - {s: "como yo quería", r: "how: as I wanted"}
              - {s: "por lo menos", r: "how much: at least"}
              - {s: "la corona de oro de la Emperatriz y las pintadas alas de Cupido", r: "subject: the Empress's gold crown and Cupid's painted wings"}
              - s: "que yo se las quitara al redropelo"
                r: "why (que = for): for I would have pulled them off by force"
                under:
                  - {s: "y te las pusiera en las manos", r: "and: and would have put them in your hands"}
        forms:
          - {w: "dejaras", f: "dej- + -aras → dejar (to let), imperfect subjunctive (-ra form), you: 'if you had let'. The -ra form of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran. In Cervantes the -ra form after 'si' can carry a past ('had let')."}
          - {w: "quería", f: "quer- + -ía → querer (to want), imperfect, I. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "hubieran cabido", f: "hubier- + -an → haber (to have), -ra imperfect subjunctive, they, + cabido, participle of caber (to fall to one's share): 'would have fallen'. The -ra form does the work of a conditional ('habrían cabido'). haber (to have) in the -ra form: hubiera, hubieras, hubiera, hubiéramos, hubierais, hubieran. Plural to match the two subjects 'corona' and 'alas'."}
          - {w: "pintadas", f: "pint- + -adas → pintar (to paint), participle used as an adjective, feminine plural to match 'alas', placed before the noun."}
          - {w: "se las quitara", f: "quit- + -ara → quitar (to take off), -ra imperfect subjunctive, I, used as a conditional: 'I would have taken'. The -ra form of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran. 'se las' = le (from them) + las (them); le becomes se before lo, la, los, las."}
          - {w: "te las pusiera", f: "pus- + -iera → poner (to put), -ra imperfect subjunctive, I, used as a conditional: 'I would have put'. Built on the preterite pusieron: pusiera, pusieras, pusiera, pusiéramos, pusierais, pusieran. 'te' = to you, 'las' = them (the crown and wings)."}
        note: "In chapter 11 Sancho talked his master out of fighting the players, who stood ready with stones. Don Quijote now says 'the Empress', though the player he meant was the emperor with the gold crown; the woman on the cart was dressed as a queen."
  - sentences:
      - es: "— Nunca los cetros y coronas de los emperadores farsantes —respondió Sancho Panza— fueron de oro puro, sino de oropel o hoja de lata."
        literal: "— Never the sceptres and crowns of the emperors play-acting —answered Sancho Panza— were of gold pure, but of tinsel or sheet of tin."
        ormsby: "“The sceptres and crowns of those playactor emperors,” said Sancho, “were never yet pure gold, but only brass foil or tin.”"
        vocab:
          - {w: "cetro", d: "sceptre"}
          - {w: "farsante", d: "actor, player (from 'farsa', a play); today it means 'fraud, humbug'"}
          - {w: "oropel", d: "tinsel, thin brass foil made to look like gold"}
          - {w: "hoja de lata", d: "tinplate, sheet of tin (modern 'hojalata')"}
          - {w: "no ... sino", d: "not ... but rather"}
        diagram:
          - s: "Nunca ... fueron de oro puro"
            r: "main verb: were never of pure gold"
            under:
              - s: "los cetros y coronas"
                r: "subject: the sceptres and crowns"
                under:
                  - {s: "de los emperadores farsantes", r: "whose: of play-actor emperors"}
              - {s: "sino de oropel o hoja de lata", r: "but rather: of tinsel or tin"}
        forms:
          - {w: "fueron", f: "fue- + -ron → ser (to be), preterite, they. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron (the same forms serve for ir (to go))."}
          - {w: "farsantes", f: "farsante (actor) + -s, plural to match 'emperadores', used here like an adjective: 'play-actor emperors'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
  - sentences:
      - es: "— Así es verdad —replicó don Quijote—, porque no fuera acertado que los atavíos de la comedia fueran finos, sino fingidos y aparentes, como lo es la mesma comedia, con la cual quiero, Sancho, que estés bien, teniéndola en tu gracia, y por el mismo consiguiente a los que las representan y a los que las componen, porque todos son instrumentos de hacer un gran bien a la república, poniéndonos un espejo a cada paso delante, donde se veen al vivo las acciones de la vida humana, y ninguna comparación hay que más al vivo nos represente lo que somos y lo que habemos de ser como la comedia y los comediantes."
        literal: "— So it-is true —replied Don Quijote—, because not it-would-be fitting that the trappings of the play should-be fine, but feigned and for-show, as it is the same play, with the which I-want, Sancho, that you-be well, holding-it in your favour, and by the same consequence those who them perform and those who them compose, because all are instruments of doing a great good to the commonwealth, putting-us a mirror at each step before, where themselves are-seen to-the life the actions of the life human, and no comparison there-is that more to-the life to-us may-represent that which we-are and that which we-have to be like the play and the players."
        ormsby: "“That is true,” said Don Quixote, “for it would not be right that the accessories of the drama should be real, instead of being mere fictions and semblances, like the drama itself; towards which, Sancho—and, as a necessary consequence, towards those who represent and produce it—I would that thou wert favourably disposed, for they are all instruments of great good to the State, placing before us at every step a mirror in which we may see vividly displayed what goes on in human life; nor is there any similitude that shows us more faithfully what we are and ought to be than the play and the players."
        ormsby_note: 'In place of comparación, "similitude", some correctors would read comparición, "appearance" in the legal sense, as in the phrase "to put in an appearance;" but I think the original reading makes better sense.'
        vocab:
          - {w: "así es verdad", d: "that is so, quite true"}
          - {w: "acertado", d: "fitting, right, sensible"}
          - {w: "atavíos", d: "trappings, costumes, finery"}
          - {w: "comedia", d: "a play of any kind, not only a comedy; the Spanish stage play of the time"}
          - {w: "fino", d: "fine, genuine, made of real precious material"}
          - {w: "fingido", d: "feigned, sham, imitation"}
          - {w: "aparente", d: "false friend: 'for show, made to look real', not 'apparent'"}
          - {w: "mesmo", d: "= mismo, same, itself (old form)"}
          - {w: "estar bien con", d: "to be on good terms with, think well of"}
          - {w: "tener en su gracia", d: "to hold in one's favour, look kindly on"}
          - {w: "por el mismo consiguiente", d: "by the same token, consequently"}
          - {w: "república", d: "false friend: the commonwealth, the state, society (not necessarily a republic)"}
          - {w: "al vivo", d: "vividly, to the life, as if real"}
          - {w: "veen", d: "= ven, they see (old form of the present of ver)"}
          - {w: "habemos", d: "= hemos, we have (old form of haber)"}
          - {w: "haber de", d: "to have to, be bound to: 'lo que habemos de ser' = what we are to be, what we must become"}
          - {w: "comediante", d: "actor, player"}
        diagram:
          - s: "Así es verdad"
            r: "main verb 1: that is true"
            under:
              - s: "porque no fuera acertado"
                r: "why: because it would not be right"
                under:
                  - {s: "que los atavíos de la comedia fueran finos", r: "what would not be right: that the play's costumes should be genuine"}
                  - {s: "sino fingidos y aparentes", r: "but rather: sham and for show"}
                  - {s: "como lo es la mesma comedia", r: "how: as the play itself is"}
          - s: "con la cual quiero"
            r: "main verb 2: with which (the play) I want"
            under:
              - {s: "Sancho", r: "addressed"}
              - s: "que estés bien"
                r: "what I want: that you be on good terms"
                under:
                  - {s: "teniéndola en tu gracia", r: "how: holding it in your favour"}
                  - {s: "y por el mismo consiguiente a los que las representan y a los que las componen", r: "with whom else: and by the same token with those who act plays and those who write them"}
              - s: "porque todos son instrumentos de hacer un gran bien a la república"
                r: "why: because they are all tools for doing great good to the commonwealth"
                under:
                  - s: "poniéndonos un espejo a cada paso delante"
                    r: "how: putting a mirror before us at every step"
                    under:
                      - {s: "donde se veen al vivo las acciones de la vida humana", r: "describes 'espejo': where the deeds of human life are seen to the life"}
          - s: "y ninguna comparación hay"
            r: "main verb 3: and there is no comparison"
            under:
              - s: "que más al vivo nos represente"
                r: "describes 'comparación': that shows us more vividly"
                under:
                  - {s: "lo que somos y lo que habemos de ser", r: "object: what we are and what we must become"}
              - {s: "como la comedia y los comediantes", r: "compared with: than the play and the players"}
        forms:
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "fuera acertado", f: "fue- + -ra → ser (to be), imperfect subjunctive (-ra form), it, used as a conditional: 'it would be'. ser (to be) in the -ra form: fuera, fueras, fuera, fuéramos, fuerais, fueran."}
          - {w: "fueran", f: "ser (to be), -ra imperfect subjunctive, they (the costumes): 'that they should be'. Subjunctive after 'no fuera acertado que'. Same forms: fuera, fueras, fuera, fuéramos, fuerais, fueran."}
          - {w: "fingidos", f: "fing- + -idos → fingir (to feign), participle used as an adjective, masculine plural to match 'atavíos'."}
          - {w: "lo es", f: "'lo' stands for the adjectives 'fingidos y aparentes': 'as the play itself is [so]'. Spanish needs this neuter 'lo' with ser where English drops it."}
          - {w: "mesma", f: "= misma (same, itself), feminine to match 'comedia'."}
          - {w: "la cual", f: "'which', feminine to match 'comedia'; a heavier relative than 'que', used after a comma."}
          - {w: "quiero", f: "quier- + -o → querer (to want), present, I. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "estés", f: "est- + -és → estar (to be), present subjunctive, you, after 'quiero que'. estar (to be) in the present subjunctive: esté, estés, esté, estemos, estéis, estén."}
          - {w: "teniéndola", f: "teniendo, gerund of tener (to hold), + la (it, the play) stuck on the end; the accent is added to keep the stress on 'ien'."}
          - {w: "las representan, las componen", f: "represent- + -an → representar (to act, perform), present, they: -o, -as, -a, -amos, -áis, -an; compon- + -en → componer (to compose, write), present, they: compongo, compones, compone, componemos, componéis, componen. 'las' (them) is plural: plays in general."}
          - {w: "son", f: "ser (to be), present, they: soy, eres, es, somos, sois, son."}
          - {w: "poniéndonos", f: "poniendo, gerund of poner (to put), + nos (for us) stuck on the end, with an accent added."}
          - {w: "se veen", f: "ve- + -en → ver (to see), present, they, old form of 'ven'; 'se' makes it passive: 'are seen'. Cervantes' ver (to see) in the present: veo, vees, vee, vemos, veis, veen (modern veo, ves, ve, vemos, veis, ven)."}
          - {w: "hay", f: "haber (to have) used impersonally, present: 'there is'. The subject 'ninguna comparación' comes first for emphasis."}
          - {w: "represente", f: "represent- + -e → representar (to represent, show), present subjunctive, it, because the 'que' clause describes something that does not exist ('no comparison that shows'). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "somos", f: "ser (to be), present, we: soy, eres, es, somos, sois, son."}
          - {w: "habemos de ser", f: "habemos, old form of 'hemos', haber (to have), present, we: he, has, ha, habemos, habéis, han; 'haber de' + infinitive = to be bound to: 'what we are to be'."}
        note: "Don Quijote repeats the classical definition of drama, quoted from Cicero by the canon of Toledo in Part I chapter 48: the play should be a mirror of human life. 'What we are to be' looks ahead to death, where the speech is going."
      - es: "Si no, dime: ¿no has visto tú representar alguna comedia adonde se introducen reyes, emperadores y pontífices, caballeros, damas y otros diversos personajes?"
        literal: "If not, tell-me: not have seen you [them] perform some play where themselves are-brought-in kings, emperors and pontiffs, knights, ladies and other various characters?"
        ormsby: "Come, tell me, hast thou not seen a play acted in which kings, emperors, pontiffs, knights, ladies, and divers other personages were introduced?"
        vocab:
          - {w: "si no", d: "otherwise; here 'if you doubt it, just tell me'"}
          - {w: "representar", d: "to act, perform (a play)"}
          - {w: "adonde", d: "= donde, where, in which (old use without any idea of motion)"}
          - {w: "introducir", d: "to bring on stage, put in a play"}
          - {w: "pontífice", d: "pontiff, pope"}
          - {w: "personaje", d: "character in a play, personage"}
        diagram:
          - s: "dime:"
            r: "main verb 1: tell me"
            under:
              - {s: "Si no", r: "linking: otherwise, come"}
          - s: "¿no has visto tú"
            r: "main verb 2: have you not seen"
            under:
