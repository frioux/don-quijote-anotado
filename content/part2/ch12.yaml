                  - {s: "en haber comparado la amistad destos animales a la de los hombres", r: "in what: in comparing these animals' friendship to men's"}
              - s: "que de las bestias han recebido muchos advertimientos los hombres"
                r: "why: for men have received many lessons from beasts"
                under:
                  - {s: "y aprendido muchas cosas de importancia", r: "and have learned many important things"}
