          - {w: "dél", d: "= de él, 'of him' (old contraction)"}
          - {w: "pasar adelante en", d: "to go on with, continue"}
          - {w: "ponerse en pie", d: "to stand up, get to one's feet"}
          - {w: "sonoro", d: "resonant, clear, ringing"}
          - {w: "comedido", d: "courteous, measured, polite"}
