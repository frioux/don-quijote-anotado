        forms:
          - {w: "parezca", f: "parezc- + -a → parecer (to seem), present subjunctive, it: 'let it not seem'. The c becomes zc before a: parezca, parezcas, parezca, parezcamos, parezcáis, parezcan. A negative wish or command takes the subjunctive."}
          - {w: "anduvo", f: "anduv- + -o → andar (to go), preterite, he. Irregular: anduve, anduviste, anduvo, anduvimos, anduvisteis, anduvieron."}
          - {w: "haber comparado", f: "haber (to have), infinitive after 'en', + comparado, the participle of comparar (to compare): 'having compared'."}
          - {w: "destos", f: "de + estos (of these), masculine plural to match 'animales'."}
          - {w: "la de", f: "'that of': 'la' stands for 'la amistad' so the noun is not repeated."}
          - {w: "han recebido", f: "h- + -an → haber (to have), present, they (men), + recebido, the participle of recebir, old spelling of recibir (to receive): present perfect, 'have received'. haber (to have) in the present: he, has, ha, hemos, habéis, han. The subject 'los hombres' comes after the verb."}
          - {w: "aprendido", f: "aprend- + -ido → aprender (to learn), participle, still governed by 'han': 'and [have] learned'."}
          - {w: "son", f: "ser (to be), present, they. Irregular: soy, eres, es, somos, sois, son. 'como son' = 'such as are', introducing a list."}
          - {w: "advertimientos", f: "advert- + -imiento → advertir (to warn), noun in -miento, plural: 'warnings, lessons'."}
        note: "Ancient natural history, Pliny's above all, held that animals had taught men remedies and virtues; Pliny credits the Egyptian ibis with showing the use of the clyster by squirting water into itself with its beak, and later writers gave the lesson to the stork."
