  - sentences:
      - es: "— No quiero yo decir —respondió don Quijote— que ésta sea aventura del todo, sino principio della; que por aquí se comienzan las aventuras."
        literal: "— Not want I to-say —answered Don Quijote— that this may-be adventure of-the whole, but beginning of-it; for by here themselves begin the adventures."
        ormsby: "“I do not mean to say,” returned Don Quixote, “that it is a complete adventure, but that it is the beginning of one, for it is in this way adventures begin."
        vocab:
          - {w: "del todo", d: "entirely, completely"}
          - {w: "della", d: "= de ella, 'of it' (old contraction)"}
          - {w: "por aquí", d: "this way, like this"}
        diagram:
          - s: "No quiero yo decir"
            r: "main verb: I don't mean to say"
            under:
              - {s: "respondió don Quijote", r: "aside: Don Quijote answered"}
              - {s: "que ésta sea aventura del todo", r: "what he does not say: that this is a whole adventure"}
              - {s: "sino principio della", r: "contrast: but the beginning of one"}
              - {s: "que por aquí se comienzan las aventuras", r: "why: for this is how adventures begin"}
        forms:
          - {w: "quiero", f: "quier- + -o → querer (to want), present, I. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren. 'querer decir' = to mean."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "ésta", f: "est- + -a → este (this), feminine to match 'aventura', with the old pronoun accent."}
          - {w: "sea", f: "ser (to be), present subjunctive, it: sea, seas, sea, seamos, seáis, sean. Subjunctive after a denied 'no quiero decir que'."}
          - {w: "della", f: "de + ella (it, the adventure): old contraction, modern 'de ella'."}
          - {w: "se comienzan", f: "comienz- + -an → comenzar (to begin), present, they (the adventures), with 'se' making it passive: 'are begun, begin'. The stem e becomes ie when stressed: comienzo, comienzas, comienza, comenzamos, comenzáis, comienzan."}
      - es: "Pero escucha, que, a lo que parece, templando está un laúd o vigüela, y, según escupe y se desembaraza el pecho, debe de prepararse para cantar algo."
        literal: "But listen, for, to that which it-seems, tuning he-is a lute or vihuela, and, according-as he-spits and himself clears the chest, he-must [be] to-prepare-himself to sing something."
        ormsby: "But listen, for it seems he is tuning a lute or guitar, and from the way he is spitting and clearing his chest he must be getting ready to sing something.”"
        vocab:
          - {w: "a lo que parece", d: "as it seems, apparently"}
          - {w: "templar", d: "to tune (an instrument)"}
          - {w: "laúd", d: "lute"}
          - {w: "vigüela", d: "= vihuela, the guitar-shaped Spanish string instrument of the period (old spelling); Ormsby says 'guitar'"}
          - {w: "según", d: "judging by how, from the way that"}
          - {w: "escupir", d: "to spit"}
          - {w: "desembarazarse el pecho", d: "to clear one's chest, clear the throat"}
        diagram:
          - s: "Pero escucha"
            r: "main verb 1: but listen"
          - s: "templando está un laúd o vigüela"
            r: "main verb 2 (after 'que', for): he is tuning a lute or vihuela"
            under:
              - {s: "a lo que parece", r: "aside: as it seems"}
          - s: "debe de prepararse"
            r: "main verb 3 (after 'y'): he must be getting ready"
            under:
              - {s: "según escupe y se desembaraza el pecho", r: "why I guess so: from the way he spits and clears his chest"}
              - {s: "para cantar algo", r: "purpose: to sing something"}
        forms:
          - {w: "escucha", f: "escuch- + -a → escuchar (to listen), imperative, you (tú). The tú imperative of -ar verbs is the same as the present 'he' form: escucho, escuchas, escucha, escuchamos, escucháis, escuchan."}
          - {w: "parece", f: "parec- + -e → parecer (to seem), present, it. parezco, pareces, parece, parecemos, parecéis, parecen."}
          - {w: "templando está", f: "gerund of templar (to tune) + est- + -á → estar (to be), present, he: estoy, estás, está, estamos, estáis, están. estar (to be) + gerund = 'is tuning'; the gerund is put first for emphasis."}
          - {w: "escupe", f: "escup- + -e → escupir (to spit), present, he. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "se desembaraza", f: "desembaraz- + -a → desembarazarse (to clear), present, he, with 'se' (for himself): 'clears his chest'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "debe de prepararse", f: "deb- + -e → deber (must), present, he: debo, debes, debe, debemos, debéis, deben; 'deber de' + infinitive gives a guess, 'he must be'. prepararse = preparar (to prepare) + se (himself) hung on the infinitive."}
          - {w: "cantar", f: "infinitive of cantar (to sing) after 'para' (in order to)."}
  - sentences:
      - es: "— A buena fe que es así —respondió Sancho—, y que debe de ser caballero enamorado."
        literal: "— By good faith that it-is so —answered Sancho—, and that he-must [be] to-be knight in-love."
        ormsby: "“Faith, you are right,” said Sancho, “and no doubt he is some enamoured knight.”"
        vocab:
          - {w: "a buena fe", d: "in good faith, truly, upon my word"}
          - {w: "que", d: "after an oath or affirmation, a 'que' that just introduces the statement; leave it untranslated"}
          - {w: "enamorado", d: "in love; 'caballero enamorado' = a lover-knight, as all knights errant must be"}
        diagram:
          - s: "A buena fe que es así"
            r: "main verb 1: upon my word, it is so"
            under:
              - {s: "respondió Sancho", r: "aside: Sancho answered"}
          - s: "y que debe de ser caballero enamorado"
            r: "main verb 2: and he must be a knight in love"
        forms:
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "debe de ser", f: "deb- + -e → deber (must), present, he: debo, debes, debe, debemos, debéis, deben; 'deber de' + infinitive gives a guess, 'he must be'; ser (to be) stays in the infinitive."}
          - {w: "enamorado", f: "enamor- + -ado → enamorar (to make fall in love), participle used as an adjective, masculine to match 'caballero'."}
  - sentences:
      - es: "— No hay ninguno de los andantes que no lo sea —dijo don Quijote—."
        literal: "— Not there-is none of the errant-[ones] that not it may-be —said Don Quijote—."
        ormsby: "“There is no knight-errant that is not,” said Don Quixote;"
        vocab:
          - {w: "los andantes", d: "the errant ones, knights errant: the adjective 'andante' (wandering) used as a noun"}
        diagram:
          - s: "No hay ninguno de los andantes"
            r: "main verb: there is not one knight errant"
            under:
              - {s: "que no lo sea", r: "describes 'ninguno': who is not (in love)"}
              - {s: "dijo don Quijote", r: "aside: said Don Quijote"}
        forms:
          - {w: "No hay ninguno", f: "hay = 'there is', from haber (to have); Spanish keeps both negatives: 'no hay ninguno' = there is not none, i.e. there is no one."}
          - {w: "lo", f: "neuter 'lo' standing for the adjective 'enamorado' of the previous sentence: 'that is not so, not in love'."}
          - {w: "sea", f: "ser (to be), present subjunctive, he: sea, seas, sea, seamos, seáis, sean. Subjunctive because it describes someone who does not exist ('ninguno')."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
      - es: "Y escuchémosle, que por el hilo sacaremos el ovillo de sus pensamientos, si es que canta; que de la abundancia del corazón habla la lengua."
        literal: "And let-us-listen-to-him, for by the thread we-shall-pull-out the ball-of-yarn of his thoughts, if it-is that he-sings; for from the abundance of-the heart speaks the tongue."
        ormsby: "“but let us listen to him, for, if he sings, by that thread we shall extract the ball of his thoughts; because out of the abundance of the heart the mouth speaketh.”"
        ormsby_note: "A reference to the often quoted proverb, por el hilo se saca el ovillo."
        vocab:
          - {w: "por el hilo se saca el ovillo", d: "proverb: by the thread you draw out the ball of yarn, i.e. from a small clue you work out the whole"}
          - {w: "ovillo", d: "ball of yarn, ball of thread"}
          - {w: "si es que", d: "if indeed, if it turns out that"}
          - {w: "de la abundancia del corazón habla la lengua", d: "'out of the abundance of the heart the mouth speaks', a saying from the Gospels (Matthew 12:34)"}
        diagram:
          - s: "Y escuchémosle"
            r: "main verb: and let us listen to him"
            under:
              - s: "que por el hilo sacaremos el ovillo de sus pensamientos"
                r: "why: for by the thread we will draw out the ball of his thoughts"
                under:
                  - {s: "si es que canta", r: "condition: if indeed he sings"}
              - {s: "que de la abundancia del corazón habla la lengua", r: "why, 2: for the tongue speaks from the fullness of the heart"}
        forms:
          - {w: "escuchémosle", f: "escuch- + -emos + le → escuchar (to listen), present subjunctive, we, with 'le' (him) stuck on the end: 'let us listen to him'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. An affirmative 'let us' command must hang its pronouns on the end, and an accent is added to keep the stress; 'le' for a male person is leísmo (modern standard 'escuchémoslo')."}
          - {w: "sacaremos", f: "sacar- + -emos → sacar (to draw out), future, we. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "sus", f: "plural to match 'pensamientos', not the owner: 'his thoughts'."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "canta", f: "cant- + -a → cantar (to sing), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "habla", f: "habl- + -a → hablar (to speak), present, it (the tongue). Same -a present; the subject 'la lengua' comes after the verb."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
  - sentences:
      - es: "Replicar quería Sancho a su amo, pero la voz del Caballero del Bosque, que no era muy mala mi muy buena, lo estorbó; y, estando los dos atónitos, oyeron que lo que cantó fue este soneto:"
        literal: "To-reply wanted Sancho to his master, but the voice of-the Caballero del Bosque, which not was very bad nor very good, it prevented; and, being the two astonished, they-heard that that which he-sang was this sonnet:"
        ormsby: "Sancho was about to reply to his master, but the Knight of the Grove’s voice, which was neither very bad nor very good, stopped him, and listening attentively the pair heard him sing this sonnet:"
        vocab:
          - {w: "Caballero del Bosque", d: "'Knight of the Wood' (Ormsby: 'of the Grove'), the name the narrator gives the stranger from where they find him"}
          - {w: "mi muy buena", d: "a misprint in this text for 'ni muy buena', 'nor very good'"}
          - {w: "estorbar", d: "to hinder, prevent, get in the way of"}
          - {w: "atónito", d: "astonished, thunderstruck; here rapt, all ears"}
          - {w: "soneto", d: "sonnet, the fourteen-line Italian form"}
        diagram:
          - s: "Replicar quería Sancho a su amo"
            r: "main verb 1: Sancho wanted to reply to his master"
          - s: "lo estorbó"
            r: "main verb 2 (after 'pero'): prevented it"
            under:
              - s: "la voz del Caballero del Bosque"
                r: "subject: the voice of the Knight of the Wood"
                under:
                  - {s: "que no era muy mala mi muy buena", r: "describes 'voz': which was neither very bad nor very good"}
          - s: "oyeron"
            r: "main verb 3 (after 'y'): they heard"
            under:
              - {s: "estando los dos atónitos", r: "when: the two of them all ears"}
              - {s: "que lo que cantó fue este soneto", r: "what they heard: that what he sang was this sonnet"}
        forms:
          - {w: "Replicar quería", f: "infinitive replicar (to reply) put first for emphasis + quer- + -ía → querer (to want), imperfect, he: 'was about to reply'. The imperfect of -er verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "era", f: "ser (to be), imperfect, it (the voice). Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "mala, buena", f: "mal- + -a → malo (bad) and buen- + -a → bueno (good), feminine to match 'voz'."}
          - {w: "lo estorbó", f: "estorb- + -ó → estorbar (to prevent), preterite, it (the voice); 'lo' = it, Sancho's reply. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "estando", f: "gerund of estar (to be): 'being'; with its own subject 'los dos' it sets the scene ('the two of them being ...')."}
          - {w: "atónitos", f: "atónit- + -os → atónito (astonished), masculine plural to match 'los dos'."}
          - {w: "oyeron", f: "oy- + -eron → oír (to hear), preterite, they. Irregular: oí, oíste, oyó, oímos, oísteis, oyeron (i becomes y between vowels)."}
          - {w: "cantó", f: "cant- + -ó → cantar (to sing), preterite, he. Same -ar preterite."}
          - {w: "fue", f: "ser (to be), preterite, it. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
        note: "Gutenberg prints 'mi muy buena', a misprint for 'ni muy buena' (nor very good); the text is left as printed and the gloss follows the correct reading."
  - sentences:
      - es: "— Dadme, señora, un término que siga, conforme a vuestra voluntad cortado; que será de la mía así estimado, que por jamás un punto dél desdiga."
        literal: "— Give-me, lady, a course that I-may-follow, in-accordance with your will cut; for it-will-be by the mine so esteemed, that for never one point from-it it-may-depart."
        ormsby: "Your pleasure, prithee, lady mine, unfold; / Declare the terms that I am to obey; / My will to yours submissively I mould, / And from your law my feet shall never stray."
        ormsby_note: "The pieces of verse introduced in the Second Part are more or less burlesques, and sometimes, as here and in Chapter XVIII, imitations of the affected poetry of the day. The verses in the First Part (except, of course, the commendatory verses, and those at the end of the last chapter) are serious efforts, and evidently regarded by Cervantes with some complacency. The difference is significant."
        vocab:
          - {w: "término", d: "a set course, a rule or limit to keep to"}
          - {w: "conforme a", d: "in accordance with, to suit"}
          - {w: "cortado", d: "cut (like cloth to a pattern), shaped to fit"}
          - {w: "la mía", d: "mine, i.e. 'my will' ('voluntad' understood)"}
          - {w: "por jamás", d: "never, not ever (emphatic)"}
          - {w: "un punto", d: "one jot, the least bit"}
          - {w: "dél", d: "= de él, 'from it' (old contraction)"}
          - {w: "desdecir de", d: "to depart from, fall short of, be out of keeping with"}
        diagram:
          - s: "Dadme"
            r: "main verb: give me"
            under:
              - {s: "señora", r: "address: lady"}
              - s: "un término"
                r: "object: a course, a rule"
                under:
                  - {s: "que siga", r: "describes 'término': for me to follow"}
                  - {s: "conforme a vuestra voluntad cortado", r: "describes 'término': cut to suit your will"}
              - s: "que será de la mía así estimado"
                r: "why: for it will be so prized by my will"
                under:
                  - {s: "que por jamás un punto dél desdiga", r: "result: that it never strays one jot from it"}
        forms:
          - {w: "Dadme", f: "dad + me → dar (to give), imperative, you (vos/vosotros, the respectful form to a lady): 'give me'. The vosotros imperative swaps the final -r of the infinitive for -d (dar → dad), and an affirmative command hangs its pronoun on the end."}
          - {w: "siga", f: "sig- + -a → seguir (to follow), present subjunctive, I. The stem e becomes i: siga, sigas, siga, sigamos, sigáis, sigan. Subjunctive because the course is not yet given."}
          - {w: "vuestra", f: "vuestr- + -a → vuestro (your, for vos/vosotros), feminine to match 'voluntad'."}
          - {w: "cortado", f: "cort- + -ado → cortar (to cut), participle, masculine to match 'término'."}
          - {w: "será ... estimado", f: "ser- + -á → ser (to be), future, it, + estimado, the participle of estimar (to value): passive, 'it will be valued'. ser (to be) in the future: seré, serás, será, seremos, seréis, serán."}
          - {w: "la mía", f: "mí- + -a → mío (mine), feminine to match the understood 'voluntad'."}
          - {w: "dél", f: "de + él (it, the course): old contraction, modern 'de él'."}
          - {w: "desdiga", f: "desdig- + -a → desdecir (to depart from), present subjunctive, it (my will). Built like decir (to say) → diga: desdiga, desdigas, desdiga, desdigamos, desdigáis, desdigan. Subjunctive in a result clause after 'así' that states an intended effect."}
        note: "The knight's sonnet is a string of courtly-love commonplaces: the lover's will is wholly his lady's, and he asks only for orders. Gutenberg prints the poem as prose, so it is annotated here quatrain by quatrain and tercet by tercet."
      - es: "Si gustáis que callando mi fatiga muera, contadme ya por acabado: si queréis que os la cuente en desusado modo, haré que el mesmo amor la diga."
        literal: "If you-like that silencing my anguish I-may-die, count-me now as finished: if you-want that to-you it I-may-tell in unaccustomed way, I-will-make that the same love it may-tell."
        ormsby: "Would you I die, to silent grief a prey? / Then count me even now as dead and cold; / Would you I tell my woes in some new way? / Then shall my tale by Love itself be told."
        vocab:
          - {w: "gustar", d: "here 'to like, wish', with the person who likes as subject (old use): 'si gustáis' = if you wish"}
          - {w: "callar", d: "to keep silent about, keep quiet"}
          - {w: "fatiga", d: "anguish, suffering, distress (more than tiredness)"}
          - {w: "contar por", d: "to count as, reckon as"}
          - {w: "acabado", d: "finished, done for, dead"}
          - {w: "desusado", d: "unusual, unheard-of, out of the common"}
          - {w: "mesmo", d: "= mismo (old form); 'el mesmo amor' = Love himself"}
        diagram:
          - s: "contadme ya por acabado"
            r: "main verb 1: count me already as dead"
            under:
              - {s: "Si gustáis que callando mi fatiga muera", r: "condition: if you wish me to die keeping my pain silent"}
          - s: "haré"
            r: "main verb 2: I will make"
            under:
              - {s: "si queréis que os la cuente en desusado modo", r: "condition: if you want me to tell it to you in an unheard-of way"}
              - {s: "que el mesmo amor la diga", r: "object: that Love himself tell it"}
        forms:
          - {w: "gustáis", f: "gust- + -áis → gustar (to like), present, you (vos, polite to the lady). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. The old personal use: modern Spanish would say 'si os gusta'."}
          - {w: "callando", f: "call- + -ando → callar (to keep silent), gerund: 'keeping silent about'. -ar verbs make the gerund in -ando."}
          - {w: "muera", f: "muer- + -a → morir (to die), present subjunctive, I. The stem o becomes ue when stressed: muera, mueras, muera, muramos, muráis, mueran. Subjunctive after a wish ('gustáis que')."}
          - {w: "contadme", f: "contad + me → contar (to count), imperative, you (vos/vosotros): 'count me'. The vosotros imperative swaps the final -r for -d, and an affirmative command hangs its pronoun on the end."}
          - {w: "acabado", f: "acab- + -ado → acabar (to finish), participle, masculine to match 'me', the poet."}
          - {w: "queréis", f: "quer- + -éis → querer (to want), present, you (vos). quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "os la cuente", f: "cuent- + -e → contar (to tell), present subjunctive, I, with 'os' (to you) and 'la' (it, my anguish). The stem o becomes ue when stressed: cuente, cuentes, cuente, contemos, contéis, cuenten. Subjunctive after 'queréis que'."}
          - {w: "haré", f: "har- + -é → hacer (to make), future, I. Irregular stem har-: haré, harás, hará, haremos, haréis, harán."}
          - {w: "mesmo", f: "= mismo (same, very), masculine to match 'amor'; 'el mesmo amor' = Love himself."}
          - {w: "diga", f: "dig- + -a → decir (to say), present subjunctive, it (love). diga, digas, diga, digamos, digáis, digan. Subjunctive after 'haré que' (I will make ...)."}
      - es: "A prueba de contrarios estoy hecho, de blanda cera y de diamante duro, y a las leyes de amor el ama ajusto."
        literal: "To proof of opposites I-am made, of soft wax and of diamond hard, and to the laws of love the soul I-fit."
        ormsby: "The unison of opposites to prove, / Of the soft wax and diamond hard am I; / But still, obedient to the laws of love,"
        vocab:
          - {w: "a prueba de", d: "proof against, made to withstand ('a prueba de bomba' = bombproof)"}
          - {w: "contrarios", d: "opposites, contraries: the warring extremes of the lover's state"}
          - {w: "cera", d: "wax"}
          - {w: "ajustar a", d: "to fit to, make conform to"}
          - {w: "el ama", d: "here 'the soul': Gutenberg prints 'ama' where most editions read 'el alma' (the soul), the reading glossed here"}
        diagram:
          - s: "estoy hecho"
            r: "main verb 1: I am made"
            under:
              - {s: "A prueba de contrarios", r: "how: proof against opposites"}
              - {s: "de blanda cera y de diamante duro", r: "of what: of soft wax and hard diamond"}
          - s: "el ama ajusto"
            r: "main verb 2 (after 'y'): I fit my soul"
            under:
              - {s: "a las leyes de amor", r: "to what: to the laws of love"}
        forms:
          - {w: "estoy hecho", f: "est- + -oy → estar (to be), present, I: estoy, estás, está, estamos, estáis, están; + hecho, the irregular participle of hacer (to make), masculine to match the poet: 'I am made'."}
          - {w: "blanda", f: "bland- + -a → blando (soft), feminine to match 'cera'; the adjective comes before the noun for poetic effect, while 'duro' follows 'diamante'."}
          - {w: "ajusto", f: "ajust- + -o → ajustar (to fit), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. The object 'el ama' comes before the verb, as verse allows."}
          - {w: "el ama", f: "'el' before a feminine noun beginning with stressed a (el alma, el agua, el ama), not a masculine."}
        note: "Wax and diamond at once is a Petrarchan conceit: soft enough to take the lady's imprint, hard enough to keep it forever. The last tercet turns the image into a seal stamped on the heart."
      - es: "Blando cual es, o fuerte, ofrezco el pecho: entallad o imprimid lo que os dé gusto, que de guardarlo eternamente juro."
