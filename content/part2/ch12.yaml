  - sentences:
      - es: "— Pues lo mesmo —dijo don Quijote— acontece en la comedia y trato deste mundo, donde unos hacen los emperadores, otros los pontífices, y, finalmente, todas cuantas figuras se pueden introducir en una comedia;"
        literal: "— Well the same —said Don Quijote— happens in the play and dealings of-this world, where some play the emperors, others the pontiffs, and, finally, all as-many characters as themselves can bring-in in a play;"
        ormsby: "“Well then,” said Don Quixote, “the same thing happens in the comedy and life of this world, where some play emperors, others popes, and, in short, all the characters that can be brought into a play;"
        vocab:
          - {w: "lo mesmo", d: "the same thing; 'mesmo' = mismo (old form)"}
          - {w: "acontecer", d: "to happen, take place"}
          - {w: "trato", d: "dealings, intercourse, the business of living together"}
          - {w: "deste", d: "= de este, of this (old contraction)"}
          - {w: "hacer los emperadores", d: "to play the part of emperors"}
          - {w: "todas cuantas", d: "all the ... that, every ... that"}
          - {w: "figura", d: "role, character in a play"}
