  - sentences:
      - es: "— Caballero soy, y de la profesión que decís; y, aunque en mi alma tienen su propio asiento las tristezas, las desgracias y las desventuras, no por eso se ha ahuyentado della la compasión que tengo de las ajenas desdichas."
        literal: "— Knight I-am, and of the profession that you-say; and, although in my soul have their own seat the sorrows, the misfortunes and the mishaps, not for that itself has driven-away from-it the compassion that I-have of the others' misfortunes."
        ormsby: "“A knight I am of the profession you mention, and though sorrows, misfortunes, and calamities have made my heart their abode, the compassion I feel for the misfortunes of others has not been thereby banished from it."
        vocab:
          - {w: "asiento", d: "seat, dwelling place; 'tener su asiento en' = to have taken up residence in"}
          - {w: "desgracia", d: "misfortune, mishap (false friend: not 'disgrace')"}
          - {w: "desventura", d: "ill fortune, mishap"}
          - {w: "no por eso", d: "not for all that, not on that account"}
          - {w: "ahuyentarse", d: "to be driven away, flee"}
          - {w: "della", d: "= de ella, 'from it' (old contraction)"}
          - {w: "ajeno", d: "belonging to others, other people's"}
          - {w: "desdicha", d: "misfortune, unhappiness"}
        diagram:
          - s: "Caballero soy"
            r: "main verb 1: a knight I am"
            under:
              - {s: "y de la profesión que decís", r: "and of the profession you mention"}
          - s: "no por eso se ha ahuyentado della"
            r: "main verb 2 (after 'y'): not for that has it been driven out of it (my soul)"
            under:
              - {s: "aunque en mi alma tienen su propio asiento las tristezas, las desgracias y las desventuras", r: "concession: although sorrows, misfortunes and mishaps have made their home in my soul"}
              - s: "la compasión"
                r: "subject: the compassion"
                under:
                  - {s: "que tengo de las ajenas desdichas", r: "describes 'compasión': that I feel for other people's misfortunes"}
        forms:
          - {w: "soy", f: "ser (to be), present, I. ser (to be) in the present: soy, eres, es, somos, sois, son. 'Caballero' comes first for emphasis."}
          - {w: "decís", f: "dec- + -ís → decir (to say), present, you (vos, the polite address between knights). decir (to say) in the present: digo, dices, dice, decimos, decís, dicen."}
          - {w: "tienen", f: "tien- + -en → tener (to have), present, they (the sorrows, coming after the verb). tener (to have) in the present: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "se ha ahuyentado", f: "ha (haber (to have), present, it) + ahuyentado, participle of ahuyentar (to drive away), with 'se': present perfect, 'has been driven away'. haber (to have) in the present: he, has, ha, hemos, habéis, han."}
          - {w: "della", f: "de + ella, 'from it' (from 'mi alma'); modern Spanish writes 'de ella'."}
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. Same present as 'tienen': tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "ajenas", f: "ajen- + -as → ajeno (other people's), feminine plural to match 'desdichas'."}
      - es: "De lo que contaste poco ha, colegí que las vuestras son enamoradas, quiero decir, del amor que tenéis a aquella hermosa ingrata que en vuestras lamentaciones nombrastes."
        literal: "From that which you-told little ago, I-gathered that the yours are lovelorn, I-want to-say, from-the love that you-have for that beautiful ingrate whom in your lamentations you-named."
        ormsby: "From what you have just now sung I gather that yours spring from love, I mean from the love you bear that fair ingrate you named in your lament.”"
        vocab:
