          - {w: "colegir", d: "to gather, infer, deduce"}
          - {w: "las vuestras", d: "yours, i.e. your misfortunes"}
          - {w: "enamorado", d: "here 'of love, born of love'; usually 'in love'"}
          - {w: "querer decir", d: "to mean ('quiero decir' = I mean)"}
          - {w: "ingrata", d: "ungrateful woman: in love poetry the lady who does not return the lover's devotion"}
          - {w: "lamentación", d: "lament, lamentation"}
          - {w: "nombrastes", d: "= nombrasteis, you named (old ending -astes)"}
        diagram:
          - s: "colegí"
            r: "main verb: I gathered"
            under:
              - {s: "De lo que contaste poco ha", r: "from what: from what you told a little while ago"}
              - s: "que las vuestras son enamoradas"
                r: "what I gathered: that yours (your sorrows) come from love"
                under:
                  - s: "quiero decir, del amor"
                    r: "clarifying: I mean, from the love"
                    under:
                      - s: "que tenéis a aquella hermosa ingrata"
                        r: "describes 'amor': that you bear that beautiful ingrate"
                        under:
                          - {s: "que en vuestras lamentaciones nombrastes", r: "describes 'ingrata': whom you named in your laments"}
        forms:
          - {w: "contaste", f: "cont- + -aste → contar (to tell), preterite, you (tú). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. Don Quijote otherwise addresses the knight as 'vos' ('tenéis', 'nombrastes'), so 'contaste' is probably a slip for the old vos form 'contastes'."}
          - {w: "poco ha", f: "ha = haber (to have), present, it (he, has, ha, hemos, habéis, han), used for time elapsed as modern 'hace': 'poco ha' = a little while ago."}
          - {w: "colegí", f: "coleg- + -í → colegir (to gather, infer), preterite, I. The preterite of -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "las vuestras", f: "vuestr- + -as → vuestro (yours, the possessive of vos/vosotros), feminine plural to match the understood 'desdichas'."}
          - {w: "son", f: "ser (to be), present, they. ser (to be) in the present: soy, eres, es, somos, sois, son."}
          - {w: "quiero decir", f: "quier- + -o → querer (to want), present, I, + decir (to say): 'I mean'. querer (to want) in the present: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "tenéis", f: "ten- + -éis → tener (to have), present, you (vos). tener (to have) in the present: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "aquella", f: "aquell- + -a → aquel (that), feminine to match 'ingrata'."}
          - {w: "nombrastes", f: "nombr- + -astes → nombrar (to name), preterite, you (vos). Cervantes' -ar preterite: nombré, nombraste, nombró, nombramos, nombrastes, nombraron; modern Spanish has -asteis for the 'vosotros' form."}
        note: "Ormsby has 'what you have just now sung'; the Spanish says 'contaste', 'what you told', taking in both the sonnet and the spoken lament."
  - sentences:
      - es: "Ya cuando esto pasaban estaban sentados juntos sobre la dura tierra, en buena paz y compañía, como si al romper del día no se hubieran de romper las cabezas."
        literal: "Already when this they-were-passing they-were seated together upon the hard earth, in good peace and company, as if at-the breaking of-the day not each-other they-were-to break the heads."
        ormsby: "In the meantime, they had seated themselves together on the hard ground peaceably and sociably, just as if, as soon as day broke, they were not going to break one another’s heads."
        vocab:
          - {w: "pasar", d: "here 'to exchange, go through (words)': 'cuando esto pasaban' = while they were saying this"}
          - {w: "en buena paz y compañía", d: "peaceably and sociably, on friendly terms"}
          - {w: "al romper del día", d: "at daybreak (lit. at the breaking of the day)"}
          - {w: "haber de", d: "to be going to, to be bound to"}
          - {w: "romperse las cabezas", d: "to break each other's heads"}
        diagram:
          - s: "estaban sentados juntos"
            r: "main verb: they were seated together"
            under:
              - {s: "Ya cuando esto pasaban", r: "when: by the time they were saying this"}
              - {s: "sobre la dura tierra", r: "where: on the hard ground"}
              - {s: "en buena paz y compañía", r: "how: in peace and good fellowship"}
              - s: "como si"
                r: "comparison: as if"
                under:
                  - {s: "al romper del día", r: "when: at daybreak"}
                  - {s: "no se hubieran de romper las cabezas", r: "they were not going to break each other's heads"}
        forms:
          - {w: "pasaban", f: "pas- + -aban → pasar (to pass, exchange), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "estaban", f: "est- + -aban → estar (to be), imperfect, they. Same -aba imperfect: estaba, estabas, estaba, estábamos, estabais, estaban."}
          - {w: "sentados", f: "participle of sentar (to seat), masculine plural to match the two knights: estar (to be) + participle = the state they were in, 'seated'."}
          - {w: "al romper", f: "al = a + el; 'al' + infinitive means 'at the moment of': 'at the breaking (of day)'."}
          - {w: "del", f: "de + el, 'of the'."}
          - {w: "se hubieran de romper", f: "hubier- + -an → haber (to have), imperfect subjunctive (-ra form), they, + de + romper (to break): 'haber de' = to be going to. The subjunctive is required after 'como si' (as if). haber (to have) in the -ra form: hubiera, hubieras, hubiera, hubiéramos, hubierais, hubieran. 'se' = each other: 'break each other's heads'."}
        note: "A pun Ormsby keeps: the day will 'break' and so will their heads. The narrator lets the reader know that this courteous meeting will end in a fight at dawn."
  - sentences:
      - es: "— Por ventura, señor caballero —preguntó el del Bosque a don Quijote—, ¿sois enamorado?"
        literal: "— By chance, sir knight —asked he of-the Grove to Don Quijote—, are-you in-love?"
        ormsby: "“Are you, sir knight, in love perchance?” asked he of the Grove of Don Quixote."
        vocab:
          - {w: "por ventura", d: "perchance, by any chance (in questions)"}
          - {w: "el del Bosque", d: "'he of the Grove', the Knight of the Grove"}
          - {w: "enamorado", d: "in love; as a noun, a lover"}
        diagram:
          - s: "¿sois enamorado?"
            r: "main verb: are you in love?"
            under:
              - {s: "Por ventura", r: "how: by any chance"}
              - {s: "señor caballero", r: "addressed: sir knight"}
              - {s: "preguntó el del Bosque a don Quijote", r: "aside: who asks whom"}
        forms:
          - {w: "sois", f: "so- + -is → ser (to be), present, you (vos, the polite address between knights). ser (to be) in the present: soy, eres, es, somos, sois, son. Cervantes uses 'ser enamorado' for a lover by calling, where modern Spanish says 'estar enamorado'."}
          - {w: "preguntó", f: "pregunt- + -ó → preguntar (to ask), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "el del Bosque", f: "'el' here is a pronoun, 'the one'; del = de + el: 'the one of the Grove'."}
          - {w: "a don Quijote", f: "'a' marks the person the question is put to: 'asked Don Quijote'."}
  - sentences:
      - es: "— Por desventura lo soy —respondió don Quijote—; aunque los daños que nacen de los bien colocados pensamientos, antes se deben tener por gracias que por desdichas."
        literal: "— By misfortune it I-am —answered Don Quijote—; although the harms that are-born from the well placed thoughts, rather themselves ought to-hold as favours than as misfortunes."
        ormsby: "“By mischance I am,” replied Don Quixote; “though the ills arising from well-bestowed affections should be esteemed favours rather than misfortunes.”"
        vocab:
          - {w: "por desventura", d: "unluckily, by mischance: a play on the question's 'por ventura' (perchance)"}
          - {w: "daño", d: "harm, hurt, ill"}
          - {w: "nacer de", d: "to arise from, spring from"}
          - {w: "bien colocado", d: "well placed, well bestowed: of love fixed on a worthy object"}
          - {w: "pensamientos", d: "thoughts; in love poetry, a lover's affections, his love"}
          - {w: "antes ... que", d: "rather ... than"}
          - {w: "tener por", d: "to regard as, hold to be"}
          - {w: "gracia", d: "favour, grace, a gift"}
        diagram:
          - s: "Por desventura lo soy"
            r: "main verb 1: unluckily I am"
            under:
              - {s: "respondió don Quijote", r: "aside: who is speaking"}
          - s: "antes se deben tener por gracias que por desdichas"
            r: "main verb 2 (after 'aunque', although): should rather be counted favours than misfortunes"
            under:
              - s: "los daños"
                r: "subject: the ills"
                under:
                  - {s: "que nacen de los bien colocados pensamientos", r: "describes 'daños': that spring from well-placed affections"}
        forms:
          - {w: "lo soy", f: "soy = ser (to be), present, I; 'lo' stands for 'enamorado': 'I am [so]'. ser (to be) in the present: soy, eres, es, somos, sois, son."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "nacen", f: "nac- + -en → nacer (to be born, arise), present, they. nacer (to be born) in the present: nazco, naces, nace, nacemos, nacéis, nacen."}
          - {w: "colocados", f: "colocad- + -os → participle of colocar (to place), masculine plural to match 'pensamientos', with 'bien' (well) in front."}
          - {w: "se deben tener", f: "deb- + -en → deber (ought, must), present, they, + tener (to hold); 'se' makes it passive: 'they ought to be held'. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
        note: "Don Quijote states a commonplace of courtly love: suffering for a worthy lady is itself a privilege. The 'ventura' / 'desventura' play turns the other knight's polite 'perchance' into a lover's sigh."
  - sentences:
      - es: "— Así es la verdad —replicó el del Bosque—, si no nos turbasen la razón y el entendimiento los desdenes, que, siendo muchos, parecen venganzas."
        literal: "— So is the truth —replied he of-the Grove—, if not to-us might-disturb the reason and the understanding the disdains, which, being many, seem vengeances."
        ormsby: "“That is true,” returned he of the Grove, “if scorn did not unsettle our reason and understanding, for if it be excessive it looks like revenge.”"
        vocab:
          - {w: "así es la verdad", d: "that is the truth, quite so"}
          - {w: "replicar", d: "to reply, answer back"}
          - {w: "turbar", d: "to disturb, cloud, unsettle"}
          - {w: "entendimiento", d: "understanding, intellect"}
          - {w: "desdén", d: "disdain, scorn; in love poetry the lady's coldness"}
          - {w: "venganza", d: "revenge, vengeance"}
        diagram:
          - s: "Así es la verdad"
            r: "main verb: that is the truth"
            under:
              - {s: "replicó el del Bosque", r: "aside: who is speaking"}
              - s: "si no nos turbasen la razón y el entendimiento los desdenes"
                r: "condition: if disdain did not cloud our reason and understanding"
                under:
                  - {s: "que, siendo muchos, parecen venganzas", r: "describes 'desdenes': which, when there are many, look like revenge"}
        forms:
          - {w: "es", f: "ser (to be), present, it. ser (to be) in the present: soy, eres, es, somos, sois, son."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (repliqué, with qu before e)."}
          - {w: "turbasen", f: "turb- + -asen → turbar (to disturb), imperfect subjunctive (-se form), they (the disdains, which come last). The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. 'si' + imperfect subjunctive = an unreal condition: 'if they did not cloud'."}
          - {w: "nos", f: "'to us', here 'our': 'nos turbasen la razón' = clouded our reason. Spanish marks the owner of a faculty or body part with the indirect pronoun."}
          - {w: "siendo", f: "gerund of ser (to be): 'being (many)', i.e. when they are many."}
          - {w: "parecen", f: "parec- + -en → parecer (to seem), present, they. parecer (to seem) in the present: parezco, pareces, parece, parecemos, parecéis, parecen."}
          - {w: "desdenes", f: "plural of desdén (disdain); the written accent drops because the stress now falls on the next-to-last syllable."}
  - sentences:
      - es: "— Nunca fui desdeñado de mi señora —respondió don Quijote."
        literal: "— Never I-was disdained by my lady —answered Don Quijote."
        ormsby: "“I was never scorned by my lady,” said Don Quixote."
        vocab:
          - {w: "desdeñar", d: "to scorn, disdain, treat coldly"}
          - {w: "de", d: "here 'by', marking who does the action of a passive (modern 'por')"}
        diagram:
          - s: "Nunca fui desdeñado"
            r: "main verb: I was never scorned"
            under:
              - {s: "de mi señora", r: "by whom: by my lady"}
              - {s: "respondió don Quijote", r: "aside: who is speaking"}
        forms:
          - {w: "fui", f: "ser (to be), preterite, I. ser (to be) in the preterite: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "desdeñado", f: "desdeñ- + -ado → desdeñar (to scorn), participle, masculine singular to match the speaker; ser (to be) + participle makes the passive: 'I was scorned'."}
          - {w: "de mi señora", f: "'de' marks the agent of a passive, where modern Spanish uses 'por'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
        note: "True in its way: as Don Quijote admitted in Part I, his love for Dulcinea has been silent and she has hardly seen him, so she has never had the chance to scorn him."
  - sentences:
      - es: "— No, por cierto —dijo Sancho, que allí junto estaba—, porque es mi señora como una borrega mansa: es más blanda que una manteca."
        literal: "— No, for certain —said Sancho, who there beside was—, because is my lady like a ewe-lamb tame: she-is more soft than a butter."
        ormsby: "“Certainly not,” said Sancho, who stood close by, “for my lady is as a lamb, and softer than a roll of butter.”"
        vocab:
          - {w: "por cierto", d: "certainly, indeed"}
          - {w: "allí junto", d: "right there beside (them)"}
          - {w: "borrega", d: "young ewe, yearling lamb"}
          - {w: "manso", d: "tame, meek, gentle"}
          - {w: "blando", d: "soft, gentle, mild"}
          - {w: "manteca", d: "butter in Cervantes' usage ('una manteca' = a pat of butter); in modern Spain usually lard or fat"}
        diagram:
          - s: "dijo Sancho"
            r: "main verb: said Sancho"
            under:
              - {s: "que allí junto estaba", r: "describes 'Sancho': who was standing right there"}
              - {s: "No, por cierto", r: "what he said, 1: certainly not"}
              - {s: "porque es mi señora como una borrega mansa", r: "why: because my lady is like a meek lamb"}
              - {s: "es más blanda que una manteca", r: "why, 2: she is softer than butter"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "es", f: "ser (to be), present, she. ser (to be) in the present: soy, eres, es, somos, sois, son. In 'es mi señora' the subject follows the verb."}
          - {w: "mansa", f: "mans- + -a → manso (meek), feminine to match 'borrega'."}
          - {w: "más blanda que", f: "blanda = blando (soft), feminine to match 'mi señora'; 'más ... que' makes the comparative: 'softer than'."}
        note: "Sancho praises the Dulcinea he has just 'enchanted' into a peasant girl. In Part I he described Aldonza Lorenzo, the real girl behind the name, as a strapping lass who could pitch a bar with the lustiest lad, so 'meek lamb' is a comic stretch."
