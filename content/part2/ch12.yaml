        forms:
          - {w: "fue", f: "ser (to be), preterite, it. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "habiendo entreoído", f: "habiendo, the gerund of haber (to have), + entreoído, the participle of entreoír (to half-hear): 'having half-heard'. Its subject 'el Caballero del Bosque' follows it."}
          - {w: "hablaban", f: "habl- + -aban → hablar (to talk), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "dél", f: "de + él (him): old contraction, modern 'de él'."}
          - {w: "pasar", f: "infinitive of pasar (to pass, go) after 'sin' (without)."}
          - {w: "se puso", f: "pus- + -o → ponerse (to put oneself), preterite, he: 'ponerse en pie' = to stand up. Irregular: puse, pusiste, puso, pusimos, pusisteis, pusieron."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "sonora y comedida", f: "sonor- + -a → sonoro (resonant) and comedid- + -a → comedido (courteous), feminine to match 'voz'."}
  - sentences:
      - es: "— ¿Quién va allá? ¿Qué gente? ¿Es por ventura de la del número de los contentos, o la del de los afligidos?"
        literal: "— Who goes there? What people? Is-it by chance of the [one] of-the number of the contented, or the [one] of-the [number] of the afflicted?"
        ormsby: "“Who goes there? What are you? Do you belong to the number of the happy or of the miserable?”"
        vocab:
          - {w: "¿Quién va allá?", d: "Who goes there?, the sentry's challenge"}
          - {w: "¿Qué gente?", d: "What people (are you)?, who are you?"}
          - {w: "por ventura", d: "perhaps, by any chance"}
          - {w: "los contentos", d: "the happy, the contented"}
          - {w: "los afligidos", d: "the afflicted, the sorrowful"}
        diagram:
          - {s: "¿Quién va allá?", r: "question 1: who goes there?"}
          - {s: "¿Qué gente?", r: "question 2, no verb: what people?"}
          - s: "¿Es por ventura"
            r: "question 3, main verb: is it perhaps"
            under:
              - {s: "de la del número de los contentos", r: "option 1: of those in the number of the happy"}
              - {s: "o la del de los afligidos?", r: "option 2: or those in the number of the afflicted"}
        forms:
          - {w: "va", f: "ir (to go), present, he. Irregular: voy, vas, va, vamos, vais, van."}
          - {w: "Es", f: "ser (to be), present, it (the 'gente'): soy, eres, es, somos, sois, son."}
          - {w: "la del", f: "'la' = the one, feminine to stand for 'gente' (people); 'del' = de + el. In 'la del de los afligidos' the noun 'número' is left out: 'the [people] of the [number] of the afflicted'."}
          - {w: "afligidos", f: "aflig- + -idos → afligir (to afflict), participle used as a noun, masculine plural: 'the afflicted'."}
  - sentences:
      - es: "— De los afligidos —respondió don Quijote."
        literal: "— Of the afflicted —answered Don Quijote."
        ormsby: "“Of the miserable,” answered Don Quixote."
        vocab:
          - {w: "afligido", d: "afflicted, sorrowful, wretched; 'los afligidos' = the afflicted, the miserable"}
          - {w: "de los afligidos", d: "short for 'de la [gente] del número de los afligidos', answering the question 'are you of the contented or of the afflicted?'"}
        diagram:
          - s: "respondió"
            r: "main verb: answered"
            under:
              - {s: "don Quijote", r: "subject"}
              - {s: "De los afligidos", r: "what he answered: [we are] of the afflicted"}
        forms:
          - {w: "afligidos", f: "aflig- + -idos → afligir (to afflict), participle used as a noun, masculine plural: 'the afflicted ones'. After an article a participle or adjective stands for the people it describes."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
        note: "Don Quijote answers the Knight of the Grove's question in the previous paragraph: are the newcomers of the number of the contented or of the afflicted? A lover in the romances always counts himself among the afflicted."
  - sentences:
      - es: "— Pues lléguese a mí —respondió el del Bosque—, y hará cuenta que se llega a la mesma tristeza y a la aflición mesma."
        literal: "— Then let-[your-worship]-draw-near to me —answered he of-the Grove—, and [you]-will-make account that yourself you-draw-near to the same sadness and to the affliction same."
        ormsby: "“Then come to me,” said he of the Grove, “and rest assured that it is to woe itself and affliction itself you come.”"
        vocab:
          - {w: "llegarse a", d: "to come up to, draw near to"}
          - {w: "el del Bosque", d: "'he of the Grove', the Knight of the Grove, named after the wood where he is found"}
          - {w: "hacer cuenta que", d: "to reckon, take it that, suppose that"}
          - {w: "mesmo", d: "= mismo (old form); after a noun it means 'itself': 'la aflición mesma' = affliction itself"}
          - {w: "aflición", d: "= aflicción, affliction, grief (old spelling)"}
        diagram:
          - s: "Pues lléguese a mí"
            r: "main verb 1: then come up to me"
            under:
              - {s: "respondió el del Bosque", r: "aside: who is speaking"}
          - s: "y hará cuenta"
            r: "main verb 2: and you will reckon"
            under:
              - {s: "que se llega a la mesma tristeza y a la aflición mesma", r: "what to reckon: that you are coming to sadness itself and affliction itself"}
        forms:
          - {w: "lléguese", f: "llegu- + -e + se → llegarse (to come near), present subjunctive, he, used for a polite 'you' (vuestra merced understood), with 'se' stuck on the end: 'come near'. g becomes gu before e to keep the hard sound. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. In a positive command the pronoun must hang on the end of the verb."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "el del Bosque", f: "'el' here is a pronoun, 'the one'; del = de + el: 'the one of the Grove'."}
          - {w: "hará", f: "har- + -á → hacer (to make, do), future, he (polite 'you'). Irregular stem har-: haré, harás, hará, haremos, haréis, harán. A future can serve as a gentle command: 'you shall reckon'."}
          - {w: "se llega", f: "lleg- + -a → llegarse (to come near), present, he (polite 'you'). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "mesma", f: "= misma (same), feminine to match 'tristeza' and 'aflición'; placed after 'aflición' it means 'itself'."}
          - {w: "aflición", f: "old spelling of aflicción (affliction), with one c."}
        note: "The Knight of the Grove speaks like a figure in a pastoral romance: whoever joins him joins Sorrow and Affliction in person. He uses the courteous third person ('lléguese', 'hará') to a stranger he cannot yet see."
  - sentences:
      - es: "Don Quijote, que se vio responder tan tierna y comedidamente, se llegó a él, y Sancho ni más ni menos."
        literal: "Don Quijote, who himself saw answer so tenderly and courteously, himself drew-near to him, and Sancho neither more nor less."
        ormsby: "Don Quixote, finding himself answered in such a soft and courteous manner, went over to him, and so did Sancho."
        vocab:
          - {w: "verse responder", d: "to find oneself answered; Spanish uses the active infinitive where English has a passive"}
          - {w: "tierno", d: "tender, gentle, soft"}
          - {w: "comedido", d: "courteous, polite, restrained"}
          - {w: "llegarse a", d: "to come up to, go over to"}
          - {w: "ni más ni menos", d: "just the same, likewise (lit. neither more nor less)"}
        diagram:
          - s: "se llegó a él"
            r: "main verb 1: went over to him"
            under:
              - s: "Don Quijote"
                r: "subject"
                under:
                  - {s: "que se vio responder tan tierna y comedidamente", r: "describes 'Don Quijote': who found himself answered so gently and courteously"}
          - {s: "y Sancho ni más ni menos", r: "main clause 2, verb understood: and Sancho did just the same"}
        forms:
          - {w: "se vio", f: "vi- + -o → verse (to see oneself), preterite, he, with 'se' (himself). ver (to see) in the preterite: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "responder", f: "infinitive of responder (to answer) after 'se vio': 'saw himself [be] answered'. After verbs of seeing and hearing Spanish puts a plain infinitive."}
          - {w: "tierna y comedidamente", f: "when two -mente adverbs are joined by 'y', only the last keeps -mente; the first stays as the feminine adjective: tierna(mente) y comedidamente, 'tenderly and courteously'."}
          - {w: "se llegó", f: "lleg- + -ó → llegarse (to come near), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (llegué, with gu before e)."}
          - {w: "él", f: "'him', the subject pronoun used after a preposition, with an accent to tell it from the article 'el'."}
  - sentences:
      - es: "El caballero lamentador asió a don Quijote del brazo, diciendo:"
        literal: "The knight lamenting seized Don Quijote by-the arm, saying:"
        ormsby: "The doleful knight took Don Quixote by the arm, saying,"
