  - sentences:
      - es: "— Dios nos la dé buena —respondió Sancho—; y ¿adónde está, señor mío, su merced de esa señora aventura?"
        literal: "— God to-us it may-give good —answered Sancho—; and where is, lord mine, her grace of that lady adventure?"
        ormsby: "“God send us a good one,” said Sancho; “and where may her ladyship the adventure be?”"
        vocab:
          - {w: "Dios nos la dé buena", d: "God send us a good one; 'la' = the adventure"}
          - {w: "adónde", d: "where; in Cervantes 'adónde' is used for 'dónde', place without motion"}
          - {w: "su merced", d: "her ladyship, 'her grace'; the polite title used for persons"}
          - {w: "señora aventura", d: "'Lady Adventure': Sancho mockingly treats the adventure as a great lady"}
        diagram:
          - s: "Dios nos la dé buena"
            r: "main verb 1: may God give it to us a good one"
          - {s: "respondió Sancho", r: "speech tag: Sancho answered"}
          - s: "y ¿adónde está"
            r: "main verb 2: and where is"
            under:
              - {s: "señor mío", r: "addressed to: my lord"}
              - {s: "su merced de esa señora aventura", r: "subject: her ladyship, that Lady Adventure"}
        forms:
          - {w: "dé", f: "d- + -é → dar (to give), present subjunctive, he (God), expressing a wish: 'may God give'. Irregular: dé, des, dé, demos, deis, den; the accent tells 'dé' from 'de' (of)."}
          - {w: "nos la", f: "nos (to us) + la (it, feminine for 'aventura'), both placed before the conjugated verb; the indirect object comes first."}
          - {w: "buena", f: "buen- + -a → bueno (good), feminine to match 'la' (the adventure): 'give it [to us] good'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "está", f: "est- + -á → estar (to be), present, she (the adventure). Irregular: estoy, estás, está, estamos, estáis, están."}
          - {w: "señor mío", f: "mío (mine) after the noun, the strong possessive form, used in polite address: 'my lord'."}
          - {w: "esa", f: "es- + -a → ese (that), feminine to match 'señora aventura'."}
        note: "Sancho mocks his master's excitement by giving the adventure the honours due to a lady, 'su merced' and 'señora', as if it were someone who could be met on the road."
