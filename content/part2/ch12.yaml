  - sentences:
      - es: "— Nunca he visto yo escudero —replicó el del Bosque— que se atreva a hablar donde habla su señor; a lo menos, ahí está ese mío, que es tan grande como su padre, y no se probará que haya desplegado el labio donde yo hablo."
        literal: "— Never have seen I squire —replied he of-the Grove— that himself may-dare to speak where speaks his lord; at the least, there is that-one mine, who is as big as his father, and not itself will-prove that he-may-have unfolded the lip where I speak."
        ormsby: "“I never yet saw a squire,” said he of the Grove, “who ventured to speak when his master was speaking; at least, there is mine, who is as big as his father, and it cannot be proved that he has ever opened his lips when I am speaking.”"
        vocab:
          - {w: "atreverse a", d: "to dare to, venture to"}
          - {w: "donde", d: "where; here 'in the presence where, when'"}
          - {w: "a lo menos", d: "at least"}
          - {w: "ese mío", d: "that [squire] of mine; 'ese' points at someone nearby, a little dismissively"}
          - {w: "tan grande como su padre", d: "as big as his father: a jocular way of saying a full-grown man"}
          - {w: "desplegar el labio", d: "to open one's mouth, say a word (lit. to unfold the lip)"}
        diagram:
          - s: "Nunca he visto yo escudero"
            r: "main verb 1: I have never seen a squire"
            under:
              - {s: "replicó el del Bosque", r: "aside: who is speaking"}
              - {s: "que se atreva a hablar donde habla su señor", r: "describes 'escudero': who dares to speak where his master is speaking"}
          - s: "ahí está ese mío"
            r: "main verb 2: there is that one of mine"
            under:
              - {s: "a lo menos", r: "linking: at least"}
              - {s: "que es tan grande como su padre", r: "describes 'ese mío': who is as big as his father"}
          - s: "y no se probará"
            r: "main verb 3: and it will not be proved"
            under:
              - {s: "que haya desplegado el labio donde yo hablo", r: "what will not be proved: that he has opened his mouth where I am speaking"}
        forms:
          - {w: "he visto", f: "he (haber (to have), present, I) + visto, the irregular participle of ver (to see): present perfect, 'I have seen'. haber (to have) in the present: he, has, ha, hemos, habéis, han."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (repliqué, with qu before e)."}
          - {w: "se atreva", f: "atrev- + -a → atreverse (to dare), present subjunctive, he. The present subjunctive of -er and -ir verbs: -a, -as, -a, -amos, -áis, -an. Subjunctive because the squire described is one he has never seen."}
          - {w: "habla, hablo", f: "habl- + -a / -o → hablar (to speak), present, he / I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "está", f: "est- + -á → estar (to be), present, he. estar (to be) in the present: estoy, estás, está, estamos, estáis, están."}
          - {w: "mío", f: "'mine', masculine singular to match the understood 'escudero'."}
          - {w: "es", f: "ser (to be), present, he. ser (to be) in the present: soy, eres, es, somos, sois, son."}
          - {w: "se probará", f: "probar- + -á → probar (to prove), future, it, with 'se' making it passive: 'it will be proved'. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "haya desplegado", f: "hay- + -a → haber (to have), present subjunctive, he, + desplegado, participle of desplegar (to unfold): perfect subjunctive, 'that he has opened'. haber (to have) in the present subjunctive: haya, hayas, haya, hayamos, hayáis, hayan. Subjunctive after the denial 'no se probará que'."}
  - sentences:
      - es: "— Pues a fe —dijo Sancho—, que he hablado yo, y puedo hablar delante de otro tan..., y aun quédese aquí, que es peor meneallo."
