            r: "main verb: the same thing happens"
            under:
              - {s: "Pues", r: "linking: well then"}
              - s: "en la comedia y trato deste mundo"
                r: "where: in the play and business of this world"
                under:
                  - {s: "donde unos hacen los emperadores, otros los pontífices", r: "describes 'mundo': where some play emperors, others popes"}
                  - {s: "y, finalmente, todas cuantas figuras se pueden introducir en una comedia", r: "and the rest: and, in short, every character that can be put into a play"}
        forms:
          - {w: "mesmo", f: "= mismo (same); 'lo mesmo' is neuter, 'the same thing'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "acontece", f: "acontec- + -e → acontecer (to happen), present, it. Verbs in -ecer add z in the 'I' form: acontezco, aconteces, acontece, acontecemos, acontecéis, acontecen."}
          - {w: "deste", f: "= de este (of this), contracted as Cervantes often does."}
          - {w: "hacen", f: "hac- + -en → hacer (to do; here to play a part), present, they. Irregular in the 'I' form: hago, haces, hace, hacemos, hacéis, hacen. Understood again with 'otros'."}
          - {w: "cuantas", f: "cuant- + -as → cuanto (as many as), feminine plural to match 'figuras'."}
          - {w: "se pueden introducir", f: "pued- + -en → poder (to be able), present, they, + introducir (to bring in), with 'se' making it passive: 'can be brought in'. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
      - es: "pero, en llegando al fin, que es cuando se acaba la vida, a todos les quita la muerte las ropas que los diferenciaban, y quedan iguales en la sepultura."
        literal: "but, on arriving at-the end, which is when itself ends the life, from all them takes death the clothes that them distinguished, and they-remain equal in the grave."
        ormsby: "but when it is over, that is to say when life ends, death strips them all of the garments that distinguish one from the other, and all are equal in the grave.”"
        ormsby_note: "Impotent pieces of the game he plays / Upon this chequer-board of nights and days, / Hither and thither moves, and checks, and slays, / And one by one back in the closet lays. (Omar Khayyám.) Don Quixote, it will be seen, held Teufelsdröckh's philosophy of clothes."
        vocab:
          - {w: "en llegando", d: "on arriving, as soon as it comes ('en' + gerund = as soon as)"}
          - {w: "acabarse", d: "to come to an end"}
          - {w: "quitar algo a alguien", d: "to take something off someone, strip someone of something"}
          - {w: "diferenciar", d: "to distinguish, set apart from one another"}
          - {w: "sepultura", d: "grave, tomb"}
        diagram:
          - s: "a todos les quita la muerte las ropas"
            r: "main verb 1 (after 'pero'): death takes the clothes off them all"
            under:
              - s: "en llegando al fin"
                r: "when: as soon as the end comes"
                under:
                  - {s: "que es cuando se acaba la vida", r: "describes 'fin': which is when life ends"}
              - {s: "que los diferenciaban", r: "describes 'ropas': that set them apart"}
          - s: "y quedan iguales en la sepultura"
            r: "main verb 2: and they end up equal in the grave"
        forms:
          - {w: "en llegando", f: "en + llegando, gerund of llegar (to arrive): 'as soon as [one] reaches', an old construction for a moment just reached."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "se acaba", f: "acab- + -a → acabarse (to end), present, it, with 'se'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "a todos les quita", f: "quit- + -a → quitar (to take off), present, it (death); same -a present. 'les' (from them) repeats 'a todos' (from all), the doubling Spanish uses when the indirect object comes first."}
          - {w: "diferenciaban", f: "diferenci- + -aban → diferenciar (to distinguish), imperfect, they (the clothes). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "quedan", f: "qued- + -an → quedar (to remain, end up), present, they. Same -an present."}
        note: "The 'theatre of the world', in which God hands out the parts and death takes back the costumes, was a favourite image of Spanish moralists; Calderón later built a whole religious play on it."
