  - sentences:
      - es: "— Apéate, amigo, y quita los frenos a los caballos, que, a mi parecer, este sitio abunda de yerba para ellos, y del silencio y soledad que han menester mis amorosos pensamientos."
        literal: "— Get-down, friend, and take-off the bridles to the horses, for, to my seeming, this place abounds of grass for them, and of-the silence and solitude that have need my amorous thoughts."
        ormsby: "“Dismount, my friend, and take the bridles off the horses, for, so far as I can see, this place will furnish grass for them, and the solitude and silence my lovesick thoughts need of.”"
        vocab:
          - {w: "apearse", d: "to dismount, get down from a horse"}
          - {w: "freno", d: "bridle, bit"}
          - {w: "a mi parecer", d: "in my opinion, as far as I can see"}
          - {w: "abundar de", d: "to abound in, be full of; modern Spanish says 'abundar en'"}
          - {w: "yerba", d: "= hierba, grass (old spelling, still used)"}
          - {w: "haber menester", d: "to need (old phrase; 'menester' = need)"}
          - {w: "amoroso", d: "of love, lovesick"}
        diagram:
          - {s: "Apéate, amigo", r: "main verb 1: get down, friend"}
          - s: "y quita los frenos a los caballos"
            r: "main verb 2: and take the bridles off the horses"
            under:
              - s: "que, a mi parecer, este sitio abunda de yerba para ellos"
                r: "why: for, as I see it, this place is full of grass for them"
                under:
                  - s: "y del silencio y soledad"
                    r: "what else it is full of: and of the silence and solitude"
                    under:
                      - {s: "que han menester mis amorosos pensamientos", r: "describes 'silencio y soledad': which my lovesick thoughts need"}
        forms:
          - {w: "Apéate", f: "ape- + -a + te → apearse (to dismount), imperative, you (tú), with 'te' stuck on the end; the accent keeps the stress on -pé-. The tú imperative of regular verbs is the same as the he/she form of the present: apea, come, vive."}
          - {w: "quita", f: "quit- + -a → quitar (to take off), imperative, you (tú). Same rule: the tú imperative equals the he/she form of the present."}
          - {w: "este", f: "est- + -e → este (this), masculine to match 'sitio'."}
          - {w: "abunda", f: "abund- + -a → abundar (to abound), present, it (the place). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "del", f: "de + el, 'of the', repeating 'abunda de': the place abounds in grass and in silence."}
          - {w: "han menester", f: "h- + -an → haber (to have), present, they (my thoughts), + menester (need): 'need'. haber (to have) in the present: he, has, ha, hemos, habéis, han. The subject 'mis amorosos pensamientos' follows the verb."}
          - {w: "mis amorosos", f: "mis = plural to match 'pensamientos', not the owner; amoros- + -os → amoroso (lovesick), masculine plural to match too."}
        note: "The newcomer, soon to be called the Knight of the Wood (Caballero del Bosque), speaks in the high style of the lovesick knights of the books: the place suits his horses' hunger and his own melancholy."
