      - es: "vuelve los ojos y mira, y verás allí tendido un andante caballero, que, a lo que a mí se me trasluce, no debe de estar demasiadamente alegre, porque le vi arrojar del caballo y tenderse en el suelo con algunas muestras de despecho, y al caer le crujieron las armas."
        literal: "turn the eyes and look, and you-will-see there stretched-out an errant knight, who, to that which to me itself to-me shows-through, not must [be] to-be excessively cheerful, because him I-saw throw-[himself] from-the horse and stretch-himself on the ground with some signs of despair, and at-the falling on-him creaked the arms."
        ormsby: "turn thine eyes and look, and thou wilt see stretched there a knight-errant, who, it strikes me, is not over and above happy, for I saw him fling himself off his horse and throw himself on the ground with a certain air of dejection, and his armour rattled as he fell.”"
        vocab:
          - {w: "volver los ojos", d: "to turn one's eyes, look round"}
          - {w: "tendido", d: "stretched out, lying at full length"}
          - {w: "andante caballero", d: "knight errant; Cervantes puts 'andante' before or after 'caballero' freely"}
          - {w: "a lo que se me trasluce", d: "as far as I can make out; 'traslucirse' = to show through, be glimpsed"}
          - {w: "demasiadamente", d: "excessively, overly; 'no demasiadamente alegre' = not over-cheerful"}
          - {w: "arrojar(se) de", d: "to throw (oneself) off, fling (oneself) down from"}
          - {w: "muestras", d: "signs, tokens, outward show"}
          - {w: "despecho", d: "false friend: despair, bitter vexation, not 'despite'"}
          - {w: "crujir", d: "to creak, rattle, clank"}
          - {w: "armas", d: "armour as well as weapons: here the pieces of armour he is wearing"}
        diagram:
          - s: "vuelve los ojos y mira"
            r: "main verbs 1: turn your eyes and look"
          - s: "y verás"
            r: "main verb 2: and you will see"
            under:
              - {s: "allí", r: "where: there"}
              - {s: "tendido", r: "how he lies: stretched out"}
              - s: "un andante caballero"
                r: "object: a knight errant"
                under:
                  - s: "que, a lo que a mí se me trasluce, no debe de estar demasiadamente alegre"
                    r: "describes 'caballero': who, as far as I can tell, can't be too happy"
                    under:
                      - s: "porque le vi arrojar del caballo y tenderse en el suelo"
                        r: "why I think so: because I saw him throw himself off his horse and stretch out on the ground"
                        under:
                          - {s: "con algunas muestras de despecho", r: "how: with some signs of despair"}
                      - {s: "y al caer le crujieron las armas", r: "why, 2: and as he fell his armour rattled"}
        forms:
          - {w: "vuelve", f: "vuelv- + -e → volver (to turn), imperative, you (tú): 'turn'. The tú imperative of most verbs is the same as the present 'he' form; the stem o becomes ue when stressed: vuelvo, vuelves, vuelve, volvemos, volvéis, vuelven."}
          - {w: "mira", f: "mir- + -a → mirar (to look), imperative, you (tú): 'look'. The tú imperative of -ar verbs ends in -a, like the present 'he' form: miro, miras, mira, miramos, miráis, miran."}
          - {w: "verás", f: "ver- + -ás → ver (to see), future, you: 'you will see'. The future adds endings to the whole infinitive: veré, verás, verá, veremos, veréis, verán."}
          - {w: "tendido", f: "tend- + -ido → tender (to stretch out), participle used as an adjective, masculine to match 'caballero'."}
          - {w: "se me trasluce", f: "trasluc- + -e → traslucirse (to show through), present, it, with 'se' (itself) and 'me' (to me): 'as far as it shows through to me'. traslucir (to show through) in the present: trasluzco, trasluces, trasluce, traslucimos, traslucís, traslucen."}
          - {w: "debe de estar", f: "deb- + -e → deber (must), present, he: debo, debes, debe, debemos, debéis, deben; 'deber de' + infinitive gives a guess, 'he must be'; estar (to be) stays in the infinitive."}
          - {w: "demasiadamente", f: "demasiada + -mente → adverb from demasiado (excessive): 'excessively'. -mente is added to the feminine form of the adjective."}
          - {w: "vi", f: "v- + -i → ver (to see), preterite, I: 'I saw'. ver (to see) in the preterite: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "le", f: "'him', the knight, as the object of 'vi'. Leísmo: Cervantes uses 'le' (normally 'to him') for a male person as direct object, where modern standard Spanish prefers 'lo'."}
          - {w: "arrojar, tenderse", f: "infinitives after 'vi' (I saw him throw, stretch out): a verb of seeing takes a plain infinitive. 'tenderse' = tender (to stretch out) + se (himself) hung on the end; 'arrojar' (to throw) leaves its 'se' unsaid."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
          - {w: "al caer", f: "al (a + el) + infinitive caer (to fall) = 'on falling, as he fell'."}
          - {w: "crujieron", f: "cruj- + -ieron → crujir (to creak), preterite, they (the arms). The preterite of -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron. 'le' = on him, whose armour it was."}
