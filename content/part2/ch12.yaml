  - sentences:
      - es: "— Sentaos aquí, señor caballero, que para entender que lo sois, y de los que profesan la andante caballería, bástame el haberos hallado en este lugar, donde la soledad y el sereno os hacen compañía, naturales lechos y propias estancias de los caballeros andantes."
        literal: "— Sit-yourself here, sir knight, for to understand that it you-are, and of those who profess the errant chivalry, suffices-me the having-you found in this place, where the solitude and the night-air to-you make company, natural beds and proper dwellings of the knights errant."
        ormsby: "“Sit down here, sir knight; for, that you are one, and of those that profess knight-errantry, it is to me a sufficient proof to have found you in this place, where solitude and night, the natural couch and proper retreat of knights-errant, keep you company.”"
        vocab:
          - {w: "sentarse", d: "to sit down; 'sentaos' = sit down (vos/vosotros command)"}
          - {w: "profesar", d: "to profess, belong to (an order or calling), as a monk professes his vows"}
          - {w: "la andante caballería", d: "knight-errantry, the order of knights errant"}
          - {w: "bastar", d: "to be enough, suffice"}
          - {w: "sereno", d: "the open night air, the night dew; 'dormir al sereno' = to sleep in the open (not 'serene' here)"}
          - {w: "hacer compañía", d: "to keep (someone) company"}
          - {w: "lecho", d: "bed, couch (literary)"}
          - {w: "estancia", d: "dwelling, abode, lodging (not 'stance')"}
          - {w: "propio", d: "proper, fitting; also 'own'"}
        diagram:
          - s: "Sentaos aquí"
            r: "main verb 1: sit down here"
            under:
              - {s: "señor caballero", r: "addressed: sir knight"}
          - s: "bástame"
            r: "main verb 2 (after 'que', for): it is enough for me"
            under:
              - s: "para entender que lo sois"
                r: "purpose: to understand that you are one (a knight)"
                under:
                  - {s: "y de los que profesan la andante caballería", r: "and one of those who profess knight-errantry"}
              - s: "el haberos hallado en este lugar"
                r: "subject: having found you in this place"
                under:
                  - s: "donde la soledad y el sereno os hacen compañía"
                    r: "describes 'lugar': where solitude and the night air keep you company"
                    under:
                      - {s: "naturales lechos y propias estancias de los caballeros andantes", r: "describes 'soledad y sereno': the natural beds and proper homes of knights errant"}
        forms:
          - {w: "Sentaos", f: "sentad + os → sentarse (to sit down), imperative, you (vosotros, used here as a polite plural to one man), with 'os' (yourself) stuck on the end. The -d of 'sentad' drops before 'os': sentad + os → sentaos. In a positive command the pronoun must hang on the end."}
          - {w: "lo sois", f: "so- + -is → ser (to be), present, you (vos, the polite address between knights); 'lo' stands for 'caballero': 'that you are [one]'. ser (to be) in the present: soy, eres, es, somos, sois, son."}
          - {w: "profesan", f: "profes- + -an → profesar (to profess), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "bástame", f: "bast- + -a + me → bastar (to suffice), present, it, with 'me' (to me) stuck on the end; modern 'me basta'. Same -a present as 'profesan'. Cervantes often hangs the pronoun on a verb that opens its clause; modern Spanish puts it in front."}
          - {w: "el haberos hallado", f: "haber (to have) + os (you) + hallado, participle of hallar (to find): a perfect infinitive, 'having found you', made into a noun by 'el' and serving as the subject of 'basta'. The pronoun hangs on the end of the infinitive."}
          - {w: "os hacen", f: "hac- + -en → hacer (to make), present, they (solitude and the night air); 'os' = (to) you, the object pronoun of vos/vosotros. hacer (to make) in the present: hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "naturales, propias", f: "naturales = plural of natural to match 'lechos'; propi- + -as → propio (proper), feminine plural to match 'estancias'."}
