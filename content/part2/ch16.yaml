          - {w: "coronar", d: "to crown"}
          - {w: "el árbol a quien no ofende el rayo", d: "the tree that lightning does not strike: the laurel, which the ancients believed was never struck"}
          - {w: "ofender", d: "to harm, strike, attack (old sense, stronger than 'offend')"}
          - {w: "en señal que", d: "as a sign that"}
          - {w: "sienes", d: "temples (of the head), brows"}
        diagram:
