          - {w: "longura", d: "length (old word; modern 'longitud', 'largura')"}
          - {w: "caballo", d: "horse; many editors read 'cabello' (hair), since the list is about the man's own looks"}
          - {w: "flaqueza", d: "thinness, leanness"}
          - {w: "amarillez", d: "yellowness, sallowness of the skin"}
          - {w: "ademán", d: "gesture, manner, bearing"}
          - {w: "compostura", d: "composure, gravity, dignified manner"}
        diagram:
          - s: "admiróle"
            r: "main verb: it amazed him"
            under:
              - {s: "la longura de su caballo", r: "subject 1: the length of his horse (or hair)"}
              - {s: "la grandeza de su cuerpo", r: "subject 2: his height"}
              - {s: "la flaqueza y amarillez de su rostro", r: "subject 3: his thin yellow face"}
              - {s: "sus armas, su ademán y compostura", r: "subjects 4 to 6: his armour, manner and gravity"}
        forms:
          - {w: "admiróle", f: "admir- + -ó + le → admirar (to amaze), preterite, it, with 'le' (him) stuck on the end; modern 'le admiró'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. Cervantes hangs the pronoun on a verb that opens its clause. The verb is singular though the subjects are many: it agrees with the nearest one."}
          - {w: "sus armas", f: "sus = plural to match 'armas', not the owner: 'his arms'."}
          - {w: "longura, grandeza, flaqueza, amarillez", f: "nouns made from adjectives: luengo/largo (long) + -ura, grande (big) + -eza, flaco (thin) + -eza, amarillo (yellow) + -ez; all feminine."}
