  - sentences:
      - es: "Salí de mi patria, empeñé mi hacienda, dejé mi regalo, y entreguéme en los brazos de la Fortuna, que me llevasen donde más fuese servida."
        literal: "I-went-out from my homeland, I-pledged my estate, I-left my comfort, and I-handed-myself into the arms of the Fortune, that me they-might-carry where most she-might-be served."
        ormsby: "I have left my home, I have mortgaged my estate, I have given up my comforts, and committed myself to the arms of Fortune, to bear me whithersoever she may please."
        vocab:
          - {w: "patria", d: "here one's home village or district, not the nation"}
          - {w: "empeñar", d: "to pawn, pledge, mortgage"}
          - {w: "hacienda", d: "estate, property, wealth (not 'ranch')"}
          - {w: "regalo", d: "comfort, ease, good living (not 'present, gift' here)"}
          - {w: "entregarse", d: "to give oneself up, surrender, commit oneself"}
          - {w: "ser servido", d: "to be pleased to; 'donde más fuese servida' = wherever she pleased"}
        diagram:
          - {s: "Salí de mi patria", r: "main verb 1: I left my home"}
          - {s: "empeñé mi hacienda", r: "main verb 2: I mortgaged my estate"}
          - {s: "dejé mi regalo", r: "main verb 3: I gave up my comforts"}
          - s: "y entreguéme"
            r: "main verb 4: and I committed myself"
            under:
              - {s: "en los brazos de la Fortuna", r: "where: into the arms of Fortune"}
              - s: "que me llevasen"
                r: "purpose: that they (the arms) should carry me"
                under:
                  - {s: "donde más fuese servida", r: "where: wherever she (Fortune) pleased"}
        forms:
          - {w: "Salí, empeñé, dejé", f: "sal- + -í → salir (to go out); empeñ- + -é → empeñar (to pledge); dej- + -é → dejar (to leave): all preterite, I. The preterite of -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "entreguéme", f: "entregu- + -é + me → entregarse (to give oneself up), preterite, I, with 'me' (myself) stuck on the end; modern 'me entregué'. g becomes gu before e. Same -ar preterite: entregué, entregaste, entregó, entregamos, entregasteis, entregaron. Cervantes hangs the pronoun on a verb that opens its clause, here after 'y'."}
          - {w: "llevasen", f: "llev- + -asen → llevar (to carry), imperfect subjunctive (-se form), they (the arms). The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. Subjunctive of purpose: 'that they should carry me'."}
          - {w: "fuese servida", f: "fuese (ser (to be), imperfect subjunctive -se form, she: fuese, fueses, fuese, fuésemos, fueseis, fuesen) + servida, participle of servir (to serve), feminine to match 'Fortuna': 'she should be pleased'."}
        note: "A grand summing-up in four short verbs, like a speech in a romance of chivalry. 'Empeñé mi hacienda' is true: in Part I he sold and pawned property to pay for his second sally."
      - es: "Quise resucitar la ya muerta andante caballería, y ha muchos días que, tropezando aquí, cayendo allí, despeñándome acá y levantándome acullá, he cumplido gran parte de mi deseo, socorriendo viudas, amparando doncellas y favoreciendo casadas, huérfanos y pupilos, propio y natural oficio de caballeros andantes;"
