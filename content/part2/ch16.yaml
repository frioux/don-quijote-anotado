              - s: "como en señal que no han de ser ofendidos de nadie"
                r: "why: as a sign that they must not be harmed by anyone"
                under:
                  - {s: "los que con tales coronas veen honrados y adornadas sus sienes", r: "subject of 'han de ser': those who see their brows honoured and adorned with such crowns"}
        forms:
          - {w: "veen", f: "ve- + -en → ver (to see), present, they; old form of modern 'ven'. Cervantes' present of ver: veo, ves, ve, vemos, veis, veen (modern ven)."}
          - {w: "milagrosa", f: "milagros- + -a → milagroso (miraculous), feminine to match 'ciencia'."}
          - {w: "honran, estiman", f: "honr- + -an → honrar (to honour), estim- + -an → estimar (to esteem), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "enriquecen", f: "enriquec- + -en → enriquecer (to enrich), present, they: enriquezco, enriqueces, enriquece, enriquecemos, enriquecéis, enriquecen."}
          - {w: "coronan", f: "coron- + -an → coronar (to crown), present, they. Same -ar present: -o, -as, -a, -amos, -áis, -an."}
          - {w: "los", f: "'them', the poets, direct object of each verb, repeated before each."}
          - {w: "a quien", f: "'quien' used for a thing (the tree), normal in Cervantes; 'a' because the tree is the object of 'ofende'."}
          - {w: "ofende", f: "ofend- + -e → ofender (to harm), present, it (the lightning). The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
