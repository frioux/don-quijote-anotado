  - sentences:
      - es: "Volvió Sancho a cobrar la albarda, habiendo sacado a plaza la risa de la profunda malencolía de su amo y causado nueva admiración a don Diego."
        literal: "Returned Sancho to recover the packsaddle, having drawn to square the laughter from the deep melancholy of his master and caused new amazement to Don Diego."
        ormsby: "Sancho went back and regained his packsaddle, having extracted a laugh from his master’s profound melancholy, and excited fresh amazement in Don Diego."
        vocab:
          - {w: "volver a", d: "+ infinitive: to go back to doing, or to do again"}
          - {w: "cobrar", d: "to recover, regain (not only 'to charge')"}
          - {w: "albarda", d: "packsaddle, the padded saddle of a donkey"}
          - {w: "sacar a plaza", d: "to bring out into the open, bring to light ('plaza' = public square)"}
          - {w: "malencolía", d: "= melancolía, melancholy (old form)"}
          - {w: "admiración", d: "amazement, wonder (not 'admiration')"}
        diagram:
          - s: "Volvió Sancho a cobrar la albarda"
            r: "main verb and subject: Sancho went back to his packsaddle"
            under:
              - s: "habiendo sacado a plaza la risa"
                r: "how: having drawn out a laugh"
                under:
                  - {s: "de la profunda malencolía de su amo", r: "from where: out of his master's deep melancholy"}
              - {s: "y causado nueva admiración a don Diego", r: "and having caused: fresh amazement in Don Diego"}
        forms:
          - {w: "Volvió", f: "volv- + -ió → volver (to return), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron. Verb before subject, as often in Cervantes."}
          - {w: "cobrar", f: "infinitive of cobrar (to recover), after 'volver a' (to go back to)."}
          - {w: "habiendo sacado", f: "habiendo, gerund of haber (to have), + sacado, participle of sacar (to draw out): 'having drawn out', the perfect gerund."}
          - {w: "causado", f: "caus- + -ado → causar (to cause), participle, still hanging on 'habiendo': 'and [having] caused'."}
