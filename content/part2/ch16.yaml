              - {s: "pareciéndole hombre de chapa", r: "why: because he seemed to him a man of substance"}
        forms:
          - {w: "miraba", f: "mir- + -aba → mirar (to look at), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. 'a don Quijote', 'al de lo verde': 'a' because the person looked at is a person."}
          - {w: "lo verde", f: "lo + adjective makes an abstract noun: 'lo verde' = the green (things), so 'el de lo verde' = the man dressed in green."}
          - {w: "al", f: "a + el, the contraction modern Spanish still makes."}
          - {w: "pareciéndole", f: "gerund of parecer (to seem) + le (to him) hung on the end; accent added to keep the stress: 'seeming to him'."}
      - es: "La edad mostraba ser de cincuenta años; las canas, pocas, y el rostro, aguileño; la vista, entre alegre y grave; finalmente, en el traje y apostura daba a entender ser hombre de buenas prendas."
        literal: "The age he-showed to-be of fifty years; the grey-hairs, few, and the face, aquiline; the gaze, between cheerful and grave; finally, in the dress and bearing he-gave to understand to-be [a] man of good parts."
        ormsby: "In appearance he was about fifty years of age, with but few grey hairs, an aquiline cast of features, and an expression between grave and gay; and his dress and accoutrements showed him to be a man of good condition."
        vocab:
          - {w: "canas", d: "grey hairs, white hairs"}
          - {w: "aguileño", d: "aquiline, hawk-nosed: a long face with a hooked nose, thought a sign of nobility"}
          - {w: "la vista", d: "here the look, the expression of the eyes, not 'sight'"}
          - {w: "apostura", d: "bearing, carriage, the way one sits and holds oneself"}
          - {w: "dar a entender", d: "to give to understand, to make clear, suggest"}
          - {w: "buenas prendas", d: "good qualities, good parts; 'prendas' = gifts of character or rank (also 'garments', 'pledges')"}
        diagram:
          - {s: "La edad mostraba ser de cincuenta años", r: "clause 1: his age seemed to be fifty"}
          - {s: "las canas, pocas", r: "clause 2, verb understood: his grey hairs (were) few"}
          - {s: "y el rostro, aguileño", r: "clause 3, verb understood: his face (was) aquiline"}
          - {s: "la vista, entre alegre y grave", r: "clause 4, verb understood: his look between cheerful and grave"}
          - s: "daba a entender"
            r: "clause 5: he made it clear"
            under:
              - {s: "finalmente", r: "linking: finally"}
              - {s: "en el traje y apostura", r: "by what: by his dress and bearing"}
              - {s: "ser hombre de buenas prendas", r: "what he made clear: that he was a man of good quality"}
        forms:
          - {w: "mostraba", f: "mostr- + -aba → mostrar (to show), imperfect, he (or 'the age' as subject): 'showed, seemed'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. The infinitive 'ser' (to be) hangs on it: 'seemed to be'."}
          - {w: "pocas", f: "poc- + -as → poco (few), feminine plural to match 'canas'. The verb 'eran' (they were) is left out, as in the next two clauses."}
          - {w: "aguileño", f: "águila (eagle) + -eño, an adjective suffix meaning 'like, from': 'eagle-like'; masculine to match 'rostro'."}
          - {w: "daba", f: "d- + -aba → dar (to give), imperfect, he. Same -aba imperfect: daba, dabas, daba, dábamos, dabais, daban."}
          - {w: "ser", f: "infinitive of ser (to be) after 'mostraba' and 'daba a entender', standing for 'that he was'; Spanish can use an infinitive where English needs a clause."}
        note: "A rapid portrait in the style of a police description, with the verbs dropped: age, hair, face, look, dress. The traveller is the first plainly sensible gentleman Don Quijote meets in Part II."
