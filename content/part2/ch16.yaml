              - s: "que ... a buen seguro que el caballo no la arrostre"
                r: "why: for the horse surely would not look at her"
                under:
                  - {s: "aunque se la den entre dos platos", r: "concession: even if she were served to him on a dish"}
        forms:
          - {w: "Digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "puede", f: "pued- + -e → poder (to be able), present, you (vuestra merced takes the 'he' form): puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "detenerse", f: "detener (to stop) + se (yourself), the pronoun hung on the infinitive after 'puede'."}
          - {w: "quisiere", f: "quis- + -iere → querer (to want), future subjunctive, you (vuestra merced): 'if you should wish'. quisiere, quisieres, quisiere, quisiéremos, quisiereis, quisieren. Cervantes uses it after 'si' for an open future; modern Spanish says 'si quiere'."}
          - {w: "se la den", f: "d- + -en → dar (to give), present subjunctive, they (impersonal): den, after 'aunque' (even if): dé, des, dé, demos, deis, den. se = le (to him) before 'la' (her, the mare)."}
