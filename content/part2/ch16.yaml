  - sentences:
      - es: "Detuvo la rienda el caminante, admirándose de la apostura y rostro de don Quijote, el cual iba sin celada, que la llevaba Sancho como maleta en el arzón delantero de la albarda del rucio;"
        literal: "Held-back the rein the traveller, marvelling-himself at the bearing and face of Don Quijote, the which went without helmet, for it was-carrying Sancho like valise on the saddle-bow front of the packsaddle of-the grey;"
        ormsby: "The traveller drew rein, amazed at the trim and features of Don Quixote, who rode without his helmet, which Sancho carried like a valise in front of Dapple’s packsaddle;"
        vocab:
          - {w: "detener la rienda", d: "to rein in, pull up"}
          - {w: "admirarse de", d: "to marvel at, be astonished by (not 'admire')"}
          - {w: "apostura", d: "bearing, figure, the way one carries oneself"}
          - {w: "celada", d: "sallet, a light helmet; here Mambrino's helmet, the barber's basin"}
          - {w: "maleta", d: "bag, valise"}
          - {w: "arzón", d: "saddle-bow, the raised front (or back) of a saddle"}
          - {w: "delantero", d: "front, forward"}
          - {w: "albarda", d: "packsaddle, the padded saddle of a donkey"}
          - {w: "rucio", d: "grey (donkey): 'el rucio' is Sancho's donkey, Ormsby's Dapple"}
        diagram:
          - s: "Detuvo la rienda el caminante"
            r: "main verb, object, subject: the traveller pulled up"
            under:
              - s: "admirándose de la apostura y rostro de don Quijote"
                r: "how: marvelling at Don Quijote's figure and face"
                under:
                  - s: "el cual iba sin celada"
                    r: "describes 'don Quijote': who was riding without a helmet"
                    under:
                      - {s: "que la llevaba Sancho como maleta en el arzón delantero de la albarda del rucio", r: "why: for Sancho was carrying it like a bag on the front of the donkey's packsaddle"}
        forms:
          - {w: "Detuvo", f: "detuv- + -o → detener (to hold back), preterite, he. Like tener (to have): detuve, detuviste, detuvo, detuvimos, detuvisteis, detuvieron."}
          - {w: "admirándose", f: "gerund of admirarse (to marvel) with 'se' hung on the end; an accent is added to keep the stress: admirando → admirándose."}
          - {w: "el cual", f: "'who', masculine to match 'don Quijote'; a heavier relative than 'que', used after a comma."}
          - {w: "iba", f: "ib- + -a → ir (to go), imperfect, he. Irregular: iba, ibas, iba, íbamos, ibais, iban."}
          - {w: "la llevaba", f: "llev- + -aba → llevar (to carry), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. la = it (the helmet, 'celada'); 'que' here means 'for, since'."}
        note: "Don Quijote's 'helmet' is the barber's brass basin he took for Mambrino's helmet in Part I, Chapter XXI; Sancho carries it at the saddle when no fighting is expected."
      - es: "y si mucho miraba el de lo verde a don Quijote, mucho más miraba don Quijote al de lo verde, pareciéndole hombre de chapa."
        literal: "and if much looked the [one] of the green at Don Quijote, much more looked Don Quijote at-the [one] of the green, seeming-to-him man of substance."
