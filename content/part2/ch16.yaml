  - sentences:
      - es: "— Señor galán, si es que vuestra merced lleva el camino que nosotros y no importa el darse priesa, merced recibiría en que nos fuésemos juntos."
        literal: "— Sir gallant, if it-is that your grace takes the road that we and not matters the giving-oneself haste, favour I-would-receive in that ourselves we-might-go together."
        ormsby: "“Gallant sir, if so be your worship is going our road, and has no occasion for speed, it would be a pleasure to me if we were to join company.”"
        vocab:
          - {w: "galán", d: "gallant, fine gentleman: a courteous form of address"}
          - {w: "si es que", d: "if it is the case that, if so be"}
          - {w: "llevar el camino", d: "to be going the same way, take the road"}
          - {w: "darse priesa", d: "= darse prisa, to hurry ('priesa' is the old form)"}
          - {w: "merced", d: "favour, kindness: 'merced recibiría' = I would take it as a favour"}
          - {w: "irse juntos", d: "to go together, keep company"}
        diagram:
          - s: "merced recibiría"
            r: "main verb: I would take it as a favour"
            under:
              - {s: "Señor galán", r: "addressed to"}
              - {s: "si es que vuestra merced lleva el camino que nosotros", r: "condition 1: if your worship is going our way"}
              - {s: "y no importa el darse priesa", r: "condition 2: and there is no need to hurry"}
              - {s: "en que nos fuésemos juntos", r: "in what: in our going on together"}
        forms:
          - {w: "lleva", f: "llev- + -a → llevar (to take, carry), present, you (vuestra merced takes the 'he' form). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an. 'que nosotros' = as we (do), the verb understood."}
          - {w: "importa", f: "import- + -a → importar (to matter), present, it. Same -ar present. Its subject is 'el darse priesa', an infinitive used as a noun with 'el'."}
          - {w: "darse", f: "dar (to give) + se (oneself), infinitive used as a noun: 'the hurrying'."}
          - {w: "recibiría", f: "recibir- + -ía → recibir (to receive), conditional, I. The conditional adds endings to the whole infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "nos fuésemos", f: "fu- + -ésemos → irse (to go off), imperfect subjunctive (-se form), we, with 'nos' (ourselves). ir (to go) has fuese, fueses, fuese, fuésemos, fueseis, fuesen. Subjunctive because the going is only wished for."}
          - {w: "juntos", f: "junt- + -os → junto (together), masculine plural to match 'nos'."}
  - sentences:
      - es: "— En verdad —respondió el de la yegua— que no me pasara tan de largo, si no fuera por temor que con la compañía de mi yegua no se alborotara ese caballo."
        literal: "— In truth —answered the [one] of the mare— that not myself I-would-pass so by long, if not it-were for fear that with the company of my mare not itself might-get-excited that horse."
        ormsby: "“In truth,” replied he on the mare, “I would not pass you so hastily but for fear that horse might turn restive in the company of my mare.”"
        vocab:
          - {w: "en verdad que", d: "truly, in truth ('que' only adds emphasis)"}
          - {w: "el de la yegua", d: "'the one of the mare', the man on the mare"}
          - {w: "pasarse de largo", d: "to pass by without stopping"}
          - {w: "si no fuera por", d: "if it were not for"}
          - {w: "alborotarse", d: "to get excited, become unruly, kick up a fuss"}
        diagram:
          - s: "no me pasara tan de largo"
            r: "main verb: I would not pass by so quickly"
            under:
              - {s: "En verdad", r: "how: in truth"}
              - s: "si no fuera por temor"
                r: "condition: if it were not for fear"
                under:
                  - {s: "que con la compañía de mi yegua no se alborotara ese caballo", r: "what fear: that that horse might get unruly in my mare's company"}
          - {s: "respondió el de la yegua", r: "speech tag: the man on the mare answered"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "me pasara", f: "pas- + -ara → pasarse (to pass by), -ra form used as a conditional, I: 'I would not pass by'. The -ra imperfect subjunctive of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran. Modern 'no me pasaría'."}
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), it, after 'si': fuera, fueras, fuera, fuéramos, fuerais, fueran."}
          - {w: "se alborotara", f: "alborot- + -ara → alborotarse (to get unruly), imperfect subjunctive (-ra form), it (the horse). Same -ara endings. The 'no' is not a real negative: after words of fear Spanish can add 'no', like 'lest'; modern 'por temor de que se alborotara'."}
          - {w: "ese", f: "'that' (near you): ese caballo = that horse of yours."}
        note: "Don Diego fears that Rocinante, a stallion, will be excited by his mare. Sancho's answer recalls the one time it happened, in Part I, Chapter XV."
