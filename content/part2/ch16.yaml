part: 2
chapter: 16
title_es: "Capítulo XVI. De lo que sucedió a don Quijote con un discreto caballero de la Mancha"
title_en: "Of what befell Don Quixote with a discreet gentleman of La Mancha"
paragraphs:
  - sentences:
      - es: "Con la alegría, contento y ufanidad que se ha dicho, seguía don Quijote su jornada, imaginándose por la pasada vitoria ser el caballero andante más valiente que tenía en aquella edad el mundo;"
        literal: "With the joy, contentment and pride that itself has said, followed Don Quijote his journey, imagining-himself because-of the past victory to-be the knight errant most valiant that had in that age the world;"
        ormsby: "Don Quixote pursued his journey in the high spirits, satisfaction, and self-complacency already described, fancying himself the most valorous knight-errant of the age in the world because of his late victory."
        vocab:
          - {w: "ufanidad", d: "pride, self-satisfaction (from 'ufano', proud, elated)"}
          - {w: "que se ha dicho", d: "'that has been said', i.e. already described (at the start of the previous chapter)"}
          - {w: "jornada", d: "journey, a day's travel (not 'working day' here)"}
          - {w: "vitoria", d: "= victoria, victory (old spelling)"}
          - {w: "pasado", d: "past, recent: 'la pasada vitoria' = his recent victory"}
          - {w: "caballero andante", d: "knight-errant, a knight who wanders in search of adventures"}
          - {w: "edad", d: "age, era (not a person's age here)"}
        diagram:
          - s: "seguía don Quijote su jornada"
            r: "main verb, subject and object: Don Quijote went on with his journey"
            under:
              - {s: "Con la alegría, contento y ufanidad que se ha dicho", r: "how: with the joy, contentment and pride already described"}
              - s: "imaginándose"
                r: "how: imagining himself"
                under:
                  - {s: "por la pasada vitoria", r: "why: because of his recent victory"}
                  - s: "ser el caballero andante más valiente"
                    r: "what he imagined: to be the bravest knight-errant"
                    under:
                      - {s: "que tenía en aquella edad el mundo", r: "describes 'caballero': that the world had in that age"}
        forms:
          - {w: "se ha dicho", f: "ha (haber (to have), present, it: he, has, ha, hemos, habéis, han) + dicho, the irregular participle of decir (to say), with 'se' making it impersonal: 'that has been said'."}
          - {w: "seguía", f: "segu- + -ía → seguir (to follow, go on with), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "imaginándose", f: "gerund of imaginar (to imagine) + se (himself), the pronoun hung on the end of the gerund; an accent is added to keep the stress: imaginando → imaginándose."}
          - {w: "ser", f: "infinitive of ser (to be) after 'imaginándose': 'imagining himself to be'. Spanish can put an infinitive after verbs of thinking when the subject is the same person."}
          - {w: "más valiente", f: "más + valiente, 'most valiant': after 'el caballero' the comparative 'más' works as a superlative."}
          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, it (the world). Same -ía imperfect. The subject 'el mundo' comes at the end."}
          - {w: "aquella", f: "aquell- + -a → aquel (that, far off), feminine to match 'edad'."}
        note: "The 'recent victory' is Don Quijote's defeat of the Knight of the Mirrors in Chapter XIV. The reader already knows from Chapter XV that this knight was Sansón Carrasco in disguise, but Don Quijote does not."
      - es: "daba por acabadas y a felice fin conducidas cuantas aventuras pudiesen sucederle de allí adelante;"
        literal: "he-gave as finished and to happy end conducted as-many adventures as might-be-able to-happen-to-him from there forward;"
        ormsby: "All the adventures that could befall him from that time forth he regarded as already done and brought to a happy issue;"
        vocab:
          - {w: "dar por", d: "+ participle: to consider as, take as: 'daba por acabadas' = he considered finished"}
          - {w: "felice", d: "= feliz, happy (old poetic form)"}
          - {w: "conducir a", d: "to bring, lead to"}
          - {w: "cuantos", d: "as many as, all the ... that"}
          - {w: "de allí adelante", d: "from then on, thereafter"}
        diagram:
          - s: "daba"
            r: "main verb: he considered (Don Quijote, carried on from 'seguía' in the previous sentence)"
            under:
              - {s: "por acabadas y a felice fin conducidas", r: "as what: as finished and brought to a happy end"}
              - s: "cuantas aventuras"
                r: "object: all the adventures"
                under:
                  - {s: "pudiesen sucederle de allí adelante", r: "describes 'aventuras': that might happen to him from then on"}
        forms:
          - {w: "daba", f: "d- + -aba → dar (to give; with 'por', to consider), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "acabadas", f: "acab- + -adas → acabar (to finish), participle, feminine plural to match 'aventuras'."}
          - {w: "conducidas", f: "conduc- + -idas → conducir (to lead), participle, feminine plural to match 'aventuras'."}
          - {w: "cuantas", f: "cuant- + -as → cuanto (as many as), feminine plural to match 'aventuras'."}
          - {w: "pudiesen", f: "pud- + -iesen → poder (to be able), imperfect subjunctive (-se form), they: 'might be able'. Built on the preterite pudieron: pudiese, pudieses, pudiese, pudiésemos, pudieseis, pudiesen. Subjunctive because the adventures are still only possible."}
          - {w: "sucederle", f: "suceder (to happen) + le (to him), the pronoun hung on the infinitive after 'pudiesen'."}
      - es: "tenía en poco a los encantos y a los encantadores;"
        literal: "he-held in little the enchantments and the enchanters;"
        ormsby: "he made light of enchantments and enchanters;"
        vocab:
          - {w: "tener en poco", d: "to think little of, make light of, scorn"}
          - {w: "encanto", d: "enchantment, spell (here, not 'charm')"}
          - {w: "encantador", d: "enchanter, wizard (not 'charming' here); Don Quijote blames enchanters for all his misfortunes"}
        diagram:
          - s: "tenía en poco"
            r: "main verb: he thought little of (Don Quijote, carried on from 'seguía' in the first sentence)"
            under:
              - {s: "a los encantos y a los encantadores", r: "object: enchantments and enchanters"}
        forms:
          - {w: "tenía", f: "ten- + -ía → tener (to hold), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "a los encantos", f: "the 'a' before a thing ('encantos') is unusual: Cervantes uses it for balance with 'a los encantadores', where 'a' marks persons as objects."}
          - {w: "encantadores", f: "encant- + -ador + -es → encantar (to enchant) + the suffix -dor (one who does): 'enchanters'; plural adds -es after a consonant."}
      - es: "no se acordaba de los inumerables palos que en el discurso de sus caballerías le habían dado, ni de la pedrada que le derribó la mitad de los dientes, ni del desagradecimiento de los galeotes, ni del atrevimiento y lluvia de estacas de los yangüeses."
        literal: "not himself he-remembered of the innumerable blows-with-sticks that in the course of his knighthoods to-him they-had given, nor of the stone-blow that to-him knocked-down the half of the teeth, nor of-the ingratitude of the galley-slaves, nor of-the boldness and rain of stakes of the Yanguesans."
        ormsby: "he thought no more of the countless drubbings that had been administered to him in the course of his knight-errantry, nor of the volley of stones that had levelled half his teeth, nor of the ingratitude of the galley slaves, nor of the audacity of the Yanguesans and the shower of stakes that fell upon him;"
        vocab:
          - {w: "acordarse de", d: "to remember"}
          - {w: "inumerable", d: "= innumerable, countless (old spelling)"}
          - {w: "palo", d: "stick; 'palos' = blows with a stick, a beating"}
          - {w: "discurso", d: "course, passage (of time), not 'speech' here"}
          - {w: "caballerías", d: "deeds of chivalry, knightly adventures"}
          - {w: "pedrada", d: "blow from a thrown stone; in Part I, Chapter XVIII, the shepherds' slingstones knocked out his teeth"}
          - {w: "derribar", d: "to knock down, knock out"}
          - {w: "desagradecimiento", d: "ingratitude"}
          - {w: "galeote", d: "galley slave: the convicts he freed in Part I, Chapter XXII, who stoned him in return"}
          - {w: "atrevimiento", d: "boldness, insolence"}
          - {w: "estaca", d: "stake, cudgel"}
          - {w: "yangüeses", d: "the carriers from Yanguas (in Soria) who beat Don Quijote and Sancho with their stakes in Part I, Chapter XV"}
        diagram:
          - s: "no se acordaba"
            r: "main verb: he did not remember (Don Quijote, carried on from 'seguía' in the first sentence)"
            under:
              - s: "de los inumerables palos"
                r: "what 1: the countless beatings"
                under:
                  - {s: "que en el discurso de sus caballerías le habían dado", r: "describes 'palos': that they had given him in the course of his chivalry"}
              - s: "ni de la pedrada"
                r: "what 2: nor the stone"
                under:
                  - {s: "que le derribó la mitad de los dientes", r: "describes 'pedrada': that knocked out half his teeth"}
              - {s: "ni del desagradecimiento de los galeotes", r: "what 3: nor the galley slaves' ingratitude"}
              - {s: "ni del atrevimiento y lluvia de estacas de los yangüeses", r: "what 4: nor the Yanguesans' insolence and shower of stakes"}
        forms:
          - {w: "se acordaba", f: "acord- + -aba → acordarse (to remember), imperfect, he, with 'se' (himself). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "habían dado", f: "hab- + -ían → haber (to have), imperfect, they: había, habías, había, habíamos, habíais, habían; + dado, participle of dar (to give): pluperfect, 'they had given'. 'They' is impersonal: people in general."}
          - {w: "derribó", f: "derrib- + -ó → derribar (to knock down), preterite, it (the stone). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "le ... los dientes", f: "'le derribó ... los dientes' = knocked out his teeth: Spanish shows the owner of a body part with an indirect pronoun ('le', to him) and uses 'los', not 'sus'."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
        note: "A list of Don Quijote's worst beatings in Part I. The narrator lists them in order to show how completely one victory has wiped them from his mind."
      - es: "Finalmente, decía entre sí que si él hallara arte, modo o manera como desencantar a su señora Dulcinea, no invidiara a la mayor ventura que alcanzó o pudo alcanzar el más venturoso caballero andante de los pasados siglos."
        literal: "Finally, he-said between himself that if he might-find art, mode or manner how to-disenchant to his lady Dulcinea, not he-would-envy the greatest fortune that reached or could reach the most fortunate knight errant of the past centuries."
        ormsby: "in short, he said to himself that could he discover any means, mode, or way of disenchanting his lady Dulcinea, he would not envy the highest fortune that the most fortunate knight-errant of yore ever reached or could reach."
        vocab:
          - {w: "decir entre sí", d: "to say to oneself"}
          - {w: "hallar", d: "to find"}
          - {w: "arte, modo o manera", d: "art, mode or manner: any means at all (a legal-sounding triple)"}
          - {w: "como", d: "here 'how', introducing a way of doing something"}
          - {w: "desencantar", d: "to disenchant, free from a spell"}
          - {w: "invidiar", d: "= envidiar, to envy (old spelling)"}
          - {w: "ventura", d: "good fortune, luck; also 'adventure'"}
          - {w: "venturoso", d: "fortunate, lucky"}
          - {w: "de los pasados siglos", d: "of past centuries, of old"}
        diagram:
          - s: "decía entre sí"
            r: "main verb: he said to himself"
            under:
              - {s: "Finalmente", r: "linking: finally, in short"}
              - s: "que ... no invidiara a la mayor ventura"
                r: "what he said: that he would not envy the greatest fortune"
                under:
                  - s: "si él hallara arte, modo o manera"
                    r: "condition: if he found any means"
                    under:
                      - {s: "como desencantar a su señora Dulcinea", r: "describes 'arte, modo o manera': how to disenchant his lady Dulcinea"}
                  - {s: "que alcanzó o pudo alcanzar el más venturoso caballero andante de los pasados siglos", r: "describes 'ventura': that the luckiest knight-errant of old reached or could reach"}
        forms:
          - {w: "decía", f: "dec- + -ía → decir (to say), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "hallara", f: "hall- + -ara → hallar (to find), imperfect subjunctive (-ra form), he, after 'si': 'if he found'. The -ra imperfect subjunctive of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran."}
          - {w: "desencantar", f: "infinitive of desencantar (to disenchant) after 'como': 'how to disenchant'. 'a su señora' has 'a' because the object is a person."}
          - {w: "invidiara", f: "invidi- + -ara → invidiar (to envy, old spelling of envidiar), -ra form used as a conditional, he: 'he would not envy'. Same -ara endings. Cervantes often uses the -ra form where modern Spanish says 'envidiaría'."}
          - {w: "alcanzó", f: "alcanz- + -ó → alcanzar (to reach), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (alcancé, with z → c before e)."}
          - {w: "pudo", f: "pud- + -o → poder (to be able), preterite, he. Irregular: pude, pudiste, pudo, pudimos, pudisteis, pudieron."}
          - {w: "mayor, más venturoso", f: "mayor = the irregular comparative of grande (great); with 'la' before it, 'the greatest'. 'el más venturoso' = the most fortunate, a superlative made with 'más'."}
        note: "Dulcinea's 'enchantment' was Sancho's invention in Chapter X: he passed off a coarse village girl as Dulcinea and convinced his master that enchanters had transformed her. Freeing her from that spell is now Don Quijote's great aim."
      - es: "En estas imaginaciones iba todo ocupado, cuando Sancho le dijo:"
        literal: "In these imaginings he-went all occupied, when Sancho to-him said:"
        ormsby: "He was going along entirely absorbed in these fancies, when Sancho said to him,"
        vocab:
          - {w: "imaginaciones", d: "fancies, daydreams, thoughts"}
          - {w: "todo ocupado", d: "entirely absorbed, wholly taken up"}
        diagram:
          - s: "iba todo ocupado"
            r: "main verb: he went along entirely absorbed"
            under:
              - {s: "En estas imaginaciones", r: "in what: in these fancies"}
              - {s: "cuando Sancho le dijo:", r: "when: when Sancho said to him"}
        forms:
          - {w: "iba", f: "ib- + -a → ir (to go), imperfect, he. Irregular: iba, ibas, iba, íbamos, ibais, iban. 'iba ocupado' = he went along absorbed: 'ir' + adjective describes how someone is as he travels."}
          - {w: "estas", f: "est- + -as → este (this), feminine plural to match 'imaginaciones'."}
          - {w: "todo ocupado", f: "todo here is an adverb, 'entirely', but agrees like an adjective with 'he'; ocupado = participle of ocupar (to occupy), masculine to match Don Quijote."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— ¿No es bueno, señor, que aun todavía traigo entre los ojos las desaforadas narices, y mayores de marca, de mi compadre Tomé Cecial?"
        literal: "— Not is-it good, sir, that even still I-carry between the eyes the outrageous nostrils, and bigger than standard, of my crony Tomé Cecial?"
        ormsby: "“Isn’t it odd, señor, that I have still before my eyes that monstrous enormous nose of my gossip, Tom Cecial?”"
        vocab:
          - {w: "¿No es bueno que ...?", d: "isn't it funny that ...? ('bueno' = odd, amusing, not 'good')"}
          - {w: "aun todavía", d: "even still, still now (doubled for emphasis)"}
          - {w: "traer entre los ojos", d: "to have before one's eyes, keep seeing"}
          - {w: "desaforado", d: "huge, outrageous, beyond all measure"}
          - {w: "narices", d: "nose (Spanish often uses the plural 'nostrils' for the whole nose)"}
          - {w: "mayor de marca", d: "outsize, larger than the standard measure ('marca' = the official gauge)"}
          - {w: "compadre", d: "crony, close friend and neighbour; strictly, godfather of one's child"}
          - {w: "Tomé Cecial", d: "Sancho's neighbour, who played the Knight of the Mirrors' squire with a huge false nose"}
        diagram:
          - s: "¿No es bueno"
            r: "main verb: isn't it funny"
            under:
              - {s: "señor", r: "addressed to: sir"}
              - s: "que aun todavía traigo entre los ojos las desaforadas narices"
                r: "subject: that I still see that enormous nose"
                under:
                  - {s: "y mayores de marca", r: "describes 'narices': and outsize"}
                  - {s: "de mi compadre Tomé Cecial", r: "whose: my crony Tomé Cecial's"}
        forms:
          - {w: "es", f: "es → ser (to be), present, it. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "traigo", f: "traig- + -o → traer (to bring, carry), present, I. Irregular in the 'I' form: traigo, traes, trae, traemos, traéis, traen."}
          - {w: "desaforadas", f: "desafor- + -adas → desaforado (huge), feminine plural to match 'narices'."}
          - {w: "mayores", f: "mayor (bigger, the irregular comparative of grande (big)) + -es, plural to match 'narices'."}
        note: "In Chapter XIV the squire of the Knight of the Mirrors wore a monstrous false nose, which terrified Sancho. Once it came off, Sancho recognised his neighbour Tomé Cecial."
  - sentences:
      - es: "— Y ¿crees tú, Sancho, por ventura, que el Caballero de los Espejos era el bachiller Carrasco; y su escudero, Tomé Cecial, tu compadre?"
        literal: "— And do-you-believe you, Sancho, by chance, that the Knight of the Mirrors was the bachelor Carrasco; and his squire, Tomé Cecial, your crony?"
        ormsby: "“And dost thou, then, believe, Sancho,” said Don Quixote, “that the Knight of the Mirrors was the bachelor Carrasco, and his squire Tom Cecial thy gossip?”"
        vocab:
          - {w: "por ventura", d: "perhaps, by any chance (in questions: 'do you really ...?')"}
          - {w: "Caballero de los Espejos", d: "Knight of the Mirrors: the name of the knight Don Quijote defeated in Chapter XIV, from the little mirrors sewn on his surcoat"}
          - {w: "bachiller", d: "bachelor, holder of the lowest university degree; Sansón Carrasco, a young graduate of Salamanca from Don Quijote's village"}
          - {w: "escudero", d: "squire, a knight's attendant"}
        diagram:
          - s: "¿crees tú"
            r: "main verb: do you believe"
            under:
              - {s: "Sancho", r: "addressed to"}
              - {s: "por ventura", r: "how: really, by any chance"}
              - {s: "que el Caballero de los Espejos era el bachiller Carrasco", r: "what you believe 1: that the Knight of the Mirrors was Carrasco"}
              - {s: "y su escudero, Tomé Cecial, tu compadre?", r: "what you believe 2 (verb 'era' understood): and his squire was your crony Tomé Cecial"}
        forms:
          - {w: "crees", f: "cre- + -es → creer (to believe), present, you (tú). The present of -er verbs: -o, -es, -e, -emos, -éis, -en (creo, crees, cree, creemos, creéis, creen)."}
          - {w: "tú", f: "the subject pronoun added after the verb for emphasis: 'do YOU believe'."}
          - {w: "era", f: "era → ser (to be), imperfect, he. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "tu", f: "tu without an accent = your; tú with an accent = you."}
  - sentences:
      - es: "— No sé qué me diga a eso —respondió Sancho—;"
        literal: "— Not I-know what I-may-say to that —answered Sancho—;"
        ormsby: "“I don’t know what to say to that,” replied Sancho;"
        vocab:
          - {w: "no sé qué me diga", d: "I don't know what to say ('me' adds personal involvement, like 'what I'm to say')"}
        diagram:
          - s: "No sé"
            r: "main verb: I don't know"
            under:
              - {s: "qué me diga a eso", r: "what I don't know: what to say to that"}
          - {s: "respondió Sancho", r: "speech tag: Sancho answered"}
        forms:
          - {w: "sé", f: "sé → saber (to know), present, I. Irregular: sé, sabes, sabe, sabemos, sabéis, saben. The accent separates it from 'se' (himself)."}
          - {w: "diga", f: "dig- + -a → decir (to say), present subjunctive, I: 'what I should say'. Irregular: diga, digas, diga, digamos, digáis, digan. The subjunctive after 'qué' in a doubtful question; 'me' is an ethic dative showing the speaker's involvement."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
      - es: "sólo sé que las señas que me dio de mi casa, mujer y hijos no me las podría dar otro que él mesmo;"
        literal: "only I-know that the tokens that to-me he-gave of my house, wife and children not to-me them could give other than he himself;"
        ormsby: "“all I know is that the tokens he gave me about my own house, wife and children, nobody else but himself could have given me;"
        vocab:
          - {w: "señas", d: "signs, tokens, details that identify (here, things only a neighbour would know)"}
          - {w: "otro que", d: "anyone other than"}
          - {w: "mesmo", d: "= mismo, himself, same (old form)"}
        diagram:
          - s: "sólo sé"
            r: "main verb: I only know"
            under:
              - s: "que las señas ... no me las podría dar otro que él mesmo"
                r: "what I know: that no one but he himself could have given me those details"
                under:
                  - {s: "que me dio de mi casa, mujer y hijos", r: "describes 'señas': that he gave me about my house, wife and children"}
        forms:
          - {w: "sé", f: "sé → saber (to know), present, I. Irregular: sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "dio", f: "d- + -io → dar (to give), preterite, he. Irregular: di, diste, dio, dimos, disteis, dieron."}
          - {w: "me las", f: "me (to me) + las (them, feminine to match 'señas'): the object 'las señas' is repeated as 'las' because it was put first in the sentence."}
          - {w: "podría", f: "podr- + -ía → poder (to be able), conditional, he: 'could'. The conditional adds -ía endings to the stem podr-: podría, podrías, podría, podríamos, podríais, podrían."}
          - {w: "mesmo", f: "old form of mismo (himself), masculine to match 'él'."}
      - es: "y la cara, quitadas las narices, era la misma de Tomé Cecial, como yo se la he visto muchas veces en mi pueblo y pared en medio de mi misma casa;"
        literal: "and the face, removed the nostrils, was the same of Tomé Cecial, as I to-him it have seen many times in my village and wall in middle of my same house;"
        ormsby: "and the face, once the nose was off, was the very face of Tom Cecial, as I have seen it many a time in my town and next door to my own house;"
        vocab:
          - {w: "quitadas las narices", d: "once the nose was removed (an absolute participle)"}
          - {w: "pueblo", d: "village, home town"}
          - {w: "pared en medio de", d: "next door to, with only a wall between ('wall in the middle')"}
        diagram:
          - s: "y la cara ... era la misma de Tomé Cecial"
            r: "main verb 2 (after 'y'): and the face was Tomé Cecial's own"
            under:
              - {s: "quitadas las narices", r: "when: once the nose was off"}
              - s: "como yo se la he visto muchas veces"
                r: "how: as I have seen it on him many times"
                under:
