        note: "Don Diego has just described his quiet, pious life as a country gentleman. Sancho, who has spent the whole book among enchanters and beatings, takes this sober portrait as a description of a saint."
      - es: "y, pareciéndole buena y santa y que quien la hacía debía de hacer milagros, se arrojó del rucio, y con gran priesa le fue a asir del estribo derecho, y con devoto corazón y casi lágrimas le besó los pies una y muchas veces."
        literal: "and, seeming-to-him good and holy and that who it led must have-been-able to-do miracles, himself he-threw from-the grey-donkey, and with great haste him he-went to seize by-the stirrup right, and with devout heart and almost tears to-him he-kissed the feet one and many times."
        ormsby: "and thinking it a good and a holy life, and that he who led it ought to work miracles, he threw himself off Dapple, and running in haste seized his right stirrup and kissed his foot again and again with a devout heart and almost with tears."
        vocab:
          - {w: "parecerle a uno", d: "to seem to someone, to strike someone as"}
          - {w: "hacer la vida", d: "to lead a life; 'quien la hacía' = whoever led it"}
          - {w: "deber de", d: "must (probability): 'debía de hacer milagros' = he must surely work miracles"}
          - {w: "arrojarse de", d: "to throw oneself off, jump down from"}
          - {w: "rucio", d: "grey donkey: Sancho's ass, which Ormsby calls Dapple"}
          - {w: "priesa", d: "= prisa, haste (old form)"}
          - {w: "asir de", d: "to seize, grab hold of (something) by"}
          - {w: "estribo", d: "stirrup"}
          - {w: "una y muchas veces", d: "once and many times, again and again"}
        diagram:
          - s: "se arrojó del rucio"
            r: "main verb 1: he threw himself off his donkey"
            under:
              - s: "pareciéndole buena y santa"
                r: "why: as it seemed to him good and holy"
                under:
                  - {s: "y que quien la hacía debía de hacer milagros", r: "also seeming to him: that whoever led it must work miracles"}
          - s: "le fue a asir del estribo derecho"
            r: "main verb 2 (after 'y'): he went and seized his right stirrup"
            under:
              - {s: "con gran priesa", r: "how: in great haste"}
          - s: "le besó los pies"
            r: "main verb 3 (after 'y'): he kissed his feet"
            under:
              - {s: "con devoto corazón y casi lágrimas", r: "how: with a devout heart and almost in tears"}
              - {s: "una y muchas veces", r: "how often: again and again"}
        forms:
          - {w: "pareciéndole", f: "gerund of parecer (to seem) + le (to him) hung on the end, accent added to keep the stress: 'it seeming to him'. Pronouns attach to the end of a gerund."}
          - {w: "buena y santa", f: "buen- + -a, sant- + -a → bueno (good), santo (holy), feminine to match 'la vida' understood."}
          - {w: "hacía", f: "hac- + -ía → hacer (to make, to lead), imperfect, he: 'who led it'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "debía de hacer", f: "deb- + -ía → deber (must), imperfect, he; same -ía imperfect. With 'de' + infinitive it means probability: 'he must surely work'. hacer (to do) is the infinitive after it."}
          - {w: "se arrojó", f: "arroj- + -ó → arrojarse (to throw oneself), preterite, he, with 'se' (himself). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "le fue a asir", f: "fu- + -e → ir (to go), preterite, he: fui, fuiste, fue, fuimos, fuisteis, fueron; + a + asir (to seize): 'he went to seize'. 'le' (him) belongs to asir (to seize) but stands before the whole group."}
          - {w: "besó", f: "bes- + -ó → besar (to kiss), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "le besó los pies", f: "'le' = to him, the owner of the feet: Spanish says 'kissed to him the feet' where English says 'kissed his feet'."}
        note: "Kissing the feet or stirrup was a gesture of reverence before a holy man or a great lord. Sancho, mounted on his donkey, has to jump down to reach the rider's foot."
