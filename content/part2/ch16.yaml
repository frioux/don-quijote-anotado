summary: |
  Riding on in high spirits after defeating the Knight of the Mirrors, Don Quijote forgets all his past beatings and thinks only of how to disenchant Dulcinea. Sancho cannot get his old neighbour Tomé Cecial's huge nose out of his mind, and asks whether the beaten knight really was the bachelor Sansón Carrasco. Don Quijote argues that it cannot have been: the enchanters who persecute him gave the knight Carrasco's face so that friendship would stay his sword, just as they turned Dulcinea into a coarse peasant girl. Sancho, who invented that enchantment himself, keeps quiet.

  A traveller in a green riding coat, on a fine dappled mare, overtakes them, and Don Quijote invites him to ride along. Each studies the other. Seeing the stranger's amazement, Don Quijote introduces himself as a knight-errant whose history has already been printed in thirty thousand copies. The gentleman, more astonished than ever, wonders aloud whether knights-errant can exist today, and begins to suspect Don Quijote is mad.

  He then describes himself: Don Diego de Miranda, a well-off hidalgo who lives quietly with his family and friends, hunts modestly, reads good books but none of chivalry, gives to the poor without show, does not gossip, makes peace between neighbours and hears mass daily. Sancho, overcome, jumps off his donkey and kisses his feet as 'the first saint on horseback' he has ever seen.

  Don Diego complains that his eighteen-year-old son, a student at Salamanca, cares for nothing but poetry. Don Quijote replies with a long speech in praise of poetry, comparing it to a beautiful maiden served by all the other sciences, and advises letting the boy follow his bent, scolding him only for personal satire. Don Diego begins to drop his opinion that Don Quijote is mad; but just then Don Quijote sees a cart with royal flags coming down the road and shouts to Sancho, who has gone off to beg milk from some shepherds, to bring him his helmet.
context: |
  The Gentleman in the Green Coat. Don Diego de Miranda is the first fully drawn portrait in the novel of a sensible country hidalgo, the kind of man Don Quijote might have been without his books. Everything about him is moderate and in good taste: a dappled mare, a green riding coat (gabán) faced with tawny velvet, a velvet montera cap, a saddle 'a la jineta' with short stirrups, a Moorish cutlass, and spurs lacquered green instead of gilt (Ormsby explains the gabán, montera and jineta in his notes). He is 'more than moderately rich', hunts without hawks or greyhounds, the expensive sport of great lords, using only a decoy partridge and a ferret (Ormsby notes that Andalusian sportsmen used tame partridges as decoys), keeps about six dozen books, entertains his neighbours without stinting, and gives alms without display. Readers have argued ever since about whether Cervantes holds him up as a model or gently mocks his comfortable caution; the text lets both readings stand.

  Books and fame. Don Diego owns no romances of chivalry, and reads secular books 'of honest entertainment' that delight by their style and invention, which is very nearly Cervantes' own programme for fiction. Don Quijote, for his part, is now a printed hero: in Part II he knows that Part I has been published, and boasts of thirty thousand copies. Ormsby points out that in Chapter III the figure was 'more than twelve thousand', and that either number is far too high. Don Diego's hope that this true history will drive out the false ones is a joke on Cervantes' stated aim of putting an end to the books of chivalry.

  Poetry and learning. Don Diego's son has spent six years at Salamanca learning Latin and Greek and wants to be a poet rather than study law or theology, the careers that led to posts and benefices. He is working on a 'glosa', a poem that expands a given quatrain, one line ending each stanza, probably for a 'justa literaria', a public poetry contest with judges and prizes, which Ormsby notes were still frequent in Cervantes' time. Don Quijote's answer is a small treatise built from Renaissance commonplaces: poetry as a maiden served by the other sciences; the defence of writing in one's mother tongue, since Homer wrote Greek and Virgil Latin; the old debate on nature and art, settled as Horace settled it, with each needing the other; the warning against personal satire, with Ovid's exile to Tomis on the Black Sea as the example (Ormsby identifies both the Ovid quotation 'Est Deus in nobis' and the exile); and the laurel, which the ancients believed lightning never struck. Cervantes, who wrote verse all his life and never quite won fame by it, gives his madman one of the most sensible speeches on poetry of his age.

  The narrator's games. The chapter plays with madness and sanity from both sides. Don Quijote reasons coolly that Carrasco cannot have been the Knight of the Mirrors, and the reader knows he is wrong; Sancho knows the truth about Dulcinea's enchantment and holds his tongue. Don Diego swings from thinking Don Quijote a madman to admiring his good sense, and the speech on poetry is interrupted by Sancho's search for milk and by a cart with royal flags. Even Sancho's comic praise of Rocinante's chastity recalls an episode of Part I, the Yanguesans' mares (Part I, Chapter XV), for which master and squire 'paid sevenfold'.

  Religion and philosophy. Sancho kneels to kiss the feet of 'the first saint on horseback' ('a la jineta') he has ever seen; Don Diego answers that he is a great sinner. Don Quijote's remark that the ancient philosophers, lacking the true knowledge of God, placed the highest good (the summum bonum) in nature's gifts, fortune, friends and good children is, as Ormsby notes, put carelessly: he means that good children were one of those goods. The list of Don Diego's virtues (daily mass, devotion to Our Lady, almsgiving without vainglory, peacemaking) is a catalogue of the pious layman of the Counter-Reformation.

  Names and words. The narrator rarely calls Don Diego by his name: he is 'el de lo verde', 'el Verde', 'el del Verde Gabán', and 'el Caballero del Verde Gabán' is the name he is still known by. Don Quijote, still the 'Caballero de la Triste Figura', describes himself with two lines that sound like an old ballad ('destos que dicen las gentes / que a sus aventuras van', of those who, people say, go off to their adventures), set as separate lines of verse in the text. Ormsby notes that early editions read 'caballo' (horse) where the sense requires 'cabello' (hair) in the list of things that astonish Don Diego.

  Reading Cervantes' Spanish. The archaisms of this chapter: vitoria (victoria), felice and felicemente (feliz, felizmente), inumerables (innumerables), invidiar and invidia (envidiar, envidia), mesmo (mismo), priesa (prisa), luengo (largo), agora (ahora), malencolía (melancolía), estremo and estranjero (extremo, extranjero), perfeto (perfecto), perficionar (perfeccionar), reprehender (reprender), veen (ven), and the contractions desta, dellos, déstos. Pronouns hang on the end of conjugated verbs that open a clause (Hele, admiróle, leyóle, entreguéme, halléle, doyme, perficiónala). The future subjunctive marks open conditions and futures (fuere, quisiere, hiciere, tratare, se ayudare), the -ra form serves as a conditional (pasara, invidiara, creyera, juzgara), 'haber de' means 'must, be going to', and 'deber de' gives a guess. Vuesa merced and vos alternate as forms of address. Watch the false friends: discreto (sensible), discurso (reasoning), suceder (to happen), romance (Spanish, the vernacular), costumbres (morals), sujeto (person), and puesto que (although).
