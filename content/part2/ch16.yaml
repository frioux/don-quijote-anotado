        ormsby_note: "All editions previous to Hartzenbusch’s read caballo, “horse”, instead of cabello, but we are told, and the whole context shows, that it was Don Quixote’s personal appearance that astonished Don Diego; it is true that Rocinante is described as “long” in Part I Chapter IX."
