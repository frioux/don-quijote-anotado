  - sentences:
      - es: "Y como él sabía que la transformación de Dulcinea había sido traza y embeleco suyo, no le satisfacían las quimeras de su amo; pero no le quiso replicar, por no decir alguna palabra que descubriese su embuste."
        literal: "And as he knew that the transformation of Dulcinea had been scheme and trick of-his, not him satisfied the chimeras of his master; but not to-him he-wanted to-reply, for not to-say some word that might-reveal his deceit."
        ormsby: "and knowing as he did that the transformation of Dulcinea had been a device and imposition of his own, his master’s illusions were not satisfactory to him; but he did not like to reply lest he should say something that might disclose his trickery."
        vocab:
          - {w: "como", d: "here 'as, since' (giving a reason)"}
          - {w: "traza", d: "scheme, plot"}
          - {w: "embeleco", d: "trick, fraud"}
          - {w: "satisfacer", d: "to satisfy, convince"}
          - {w: "quimera", d: "chimera, fantasy, wild idea"}
          - {w: "por no", d: "+ infinitive: so as not to, for fear of"}
          - {w: "descubrir", d: "to reveal, give away (not only 'discover')"}
          - {w: "embuste", d: "lie, deception, trick"}
        diagram:
          - s: "no le satisfacían las quimeras de su amo"
            r: "main verb 1: his master's fantasies did not convince him"
            under:
              - {s: "Y como él sabía que la transformación de Dulcinea había sido traza y embeleco suyo", r: "why: since he knew Dulcinea's transformation had been his own trick"}
          - s: "pero no le quiso replicar"
            r: "main verb 2: but he would not answer him back"
            under:
              - s: "por no decir alguna palabra"
                r: "why: so as not to say some word"
                under:
                  - {s: "que descubriese su embuste", r: "describes 'palabra': that might give away his trick"}
        forms:
          - {w: "sabía", f: "sab- + -ía → saber (to know), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "había sido", f: "había (haber (to have), imperfect, it: same -ía endings) + sido, participle of ser (to be): pluperfect, 'had been'."}
          - {w: "suyo", f: "suy- + -o → suyo (his own), the long possessive placed after the noun: 'a trick of his'."}
          - {w: "satisfacían", f: "satisfac- + -ían → satisfacer (to satisfy), imperfect, they (the fantasies). Same -ía imperfect. satisfacer is built on hacer (to make): satisfago, satisfaces like hago, haces."}
          - {w: "quiso", f: "quis- + -o → querer (to want), preterite, he; 'no quiso' = he would not, he refused. Irregular: quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "replicar", f: "infinitive of replicar (to reply) after 'quiso'; le (to him) placed before the whole group."}
          - {w: "descubriese", f: "descubr- + -iese → descubrir (to reveal), imperfect subjunctive (-se form), it: 'that might reveal'. The -se imperfect subjunctive of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen. Subjunctive because the word is only feared, not said."}
  - sentences:
      - es: "En estas razones estaban cuando los alcanzó un hombre que detrás dellos por el mismo camino venía sobre una muy hermosa yegua tordilla, vestido un gabán de paño fino verde, jironado de terciopelo leonado, con una montera del mismo terciopelo;"
        literal: "In these talks they-were when them overtook a man who behind of-them along the same road was-coming on a very beautiful mare dapple-grey, dressed a greatcoat of cloth fine green, trimmed with velvet tawny, with a hunting-cap of-the same velvet;"
        ormsby: "As they were engaged in this conversation they were overtaken by a man who was following the same road behind them, mounted on a very handsome flea-bitten mare, and dressed in a gabán of fine green cloth, with tawny velvet facings, and a montera of the same velvet."
        ormsby_note: "Gabán, a loose overcoat with a hood, worn when hunting, hawking, or travelling; montera, a cap with falling flaps, a common head gear in Central Spain."
