          - {w: "tenerme", f: "tener (to have) + me (to me), the pronoun hung on the infinitive after 'para': 'to bear me (a grudge)'."}
      - es: "¿Soy yo su rival, o hace él profesión de las armas, para tener invidia a la fama que yo por ellas he ganado?"
        literal: "Am I his rival, or does he profession of the arms, for to-have envy to the fame that I through them have won?"
        ormsby: "Am I his rival, or does he profess arms, that he should envy the fame I have acquired in them?”"
        vocab:
