          - {w: "tierna", f: "tiern- + -a → tierno (tender), feminine to match 'doncella'. Same with 'hermosa'."}
          - {w: "estremo", f: "old spelling of extremo (extreme): Cervantes often writes 'es-' for 'ex-' (estraño, estranjero)."}
