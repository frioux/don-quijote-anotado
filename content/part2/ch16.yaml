          - {w: "que cuántos", f: "'que' before a reported question is an old habit: 'he asked him that how many'; modern Spanish drops it."}
          - {w: "cuántos", f: "cuánt- + -os → cuánto (how much, how many), masculine plural to match 'hijos'; accent because it asks a question."}
          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "díjole", f: "dij- + -o + le → decir (to say), preterite, he, with 'le' (to him) stuck on the end; modern 'le dijo'. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "ponían", f: "pon- + -ían → poner (to put, place), imperfect, they (the philosophers). Same -ía imperfect: ponía, ponías, ponía, poníamos, poníais, ponían."}
          - {w: "carecieron", f: "carec- + -ieron → carecer (to lack), preterite, they. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, it. Irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
