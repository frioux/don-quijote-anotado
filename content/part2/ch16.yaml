          - {w: "alcanzó", f: "alcanz- + -ó → alcanzar (to overtake), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (alcancé, z → c before e). The subject 'un hombre' follows the verb."}
