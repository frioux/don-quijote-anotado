          - {w: "siendo", f: "gerund of ser (to be): 'being', with its own subject 'el estudiante' after it."}
          - {w: "dio", f: "di- + -o → dar (to give), preterite, it (heaven). Irregular: di, diste, dio, dimos, disteis, dieron."}
          - {w: "se lo dejen", f: "dej- + -en → dejar (to leave), present subjunctive, they (the parents): 'may leave it to him'. 'le' (to him) turns into 'se' before 'lo' (it). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "sería", f: "ser- + -ía → ser (to be), conditional, I. The conditional adds -ía endings to the whole infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
