          - {w: "razones", d: "words, talk, conversation (not 'reasons' here)"}
          - {w: "alcanzar", d: "to catch up with, overtake"}
          - {w: "dellos", d: "= de ellos, of them (old contraction)"}
          - {w: "yegua", d: "mare"}
          - {w: "tordillo", d: "dapple-grey, flecked grey and white (Ormsby's 'flea-bitten')"}
          - {w: "gabán", d: "a loose hooded overcoat for travel and hunting"}
          - {w: "paño", d: "woollen cloth"}
          - {w: "jironado", d: "trimmed, faced or pieced with strips ('jirón' = strip, gore of cloth)"}
          - {w: "terciopelo", d: "velvet"}
          - {w: "leonado", d: "tawny, lion-coloured"}
          - {w: "montera", d: "a cloth cap with flaps, worn by country people and hunters"}
