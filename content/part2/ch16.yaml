  - sentences:
      - es: "— Yo, señor don Quijote —respondió el hidalgo—, tengo un hijo, que, a no tenerle, quizá me juzgara por más dichoso de lo que soy; y no porque él sea malo, sino porque no es tan bueno como yo quisiera."
        literal: "— I, sir Don Quijote —answered the gentleman—, have a son, that, at not having-him, perhaps myself I-would-judge as more fortunate than that which I-am; and not because he may-be bad, but because not he-is so good as I would-wish."
