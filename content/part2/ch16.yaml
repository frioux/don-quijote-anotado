  - sentences:
      - es: "— Déjenme besar —respondió Sancho—, porque me parece vuesa merced el primer santo a la jineta que he visto en todos los días de mi vida."
        literal: "— Let-me to-kiss —answered Sancho—, because to-me seems your grace the first saint on the light-saddle that I-have seen in all the days of my life."
        ormsby: "“Let me kiss,” said Sancho, “for I think your worship is the first saint in the saddle I ever saw all the days of my life.”"
        vocab:
          - {w: "vuesa merced", d: "= vuestra merced, 'your grace', the polite 'you' (it later became 'usted'); takes he/she verbs"}
          - {w: "a la jineta", d: "riding with short stirrups in the Moorish style, on a light saddle; 'santo a la jineta' = a saint on horseback"}
        diagram:
          - {s: "Déjenme besar", r: "main verb: let me kiss"}
          - {s: "respondió Sancho", r: "speaker tag: Sancho answered"}
          - s: "porque me parece"
            r: "why: because it seems to me"
            under:
              - s: "vuesa merced el primer santo a la jineta"
                r: "what seems so: your worship is the first saint on horseback"
                under:
                  - {s: "que he visto en todos los días de mi vida", r: "describes 'santo': that I have seen in all my life"}
        forms:
          - {w: "Déjenme", f: "dej- + -en + me → dejar (to let), present subjunctive used as a polite command, they (you all, as vuestras mercedes), with 'me' stuck on the end: 'let me'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. Pronouns hang on the end of a positive command."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "parece", f: "parec- + -e → parecer (to seem), present, it (you, 'vuesa merced' is the subject). parezco, pareces, parece, parecemos, parecéis, parecen."}
          - {w: "primer", f: "primero (first) loses its final -o before a masculine singular noun: 'el primer santo'."}
          - {w: "he visto", f: "he (haber (to have), present, I: he, has, ha, hemos, habéis, han) + visto, the irregular participle of ver (to see): present perfect 'I have seen'."}
        note: "Sancho uses the plural 'Déjenme' (let me, sirs), perhaps speaking to both riders at once. The joke is the picture of a saint riding 'a la jineta', like a fine horseman, rather than on foot or on a mule like a friar."
