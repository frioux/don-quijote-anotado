  - sentences:
      - es: "— Pues, ¿qué diremos, señor —respondió Sancho—, a esto de parecerse tanto aquel caballero, sea el que se fuere, al bachiller Carrasco, y su escudero a Tomé Cecial, mi compadre?"
        literal: "— Well, what shall-we-say, sir —answered Sancho—, to this of resembling-itself so-much that knight, be-he the-one that he-may-be, to-the bachelor Carrasco, and his squire to Tomé Cecial, my crony?"
        ormsby: "“Well, but what are we to say, señor,” returned Sancho, “about that knight, whoever he is, being so like the bachelor Carrasco, and his squire so like my gossip, Tom Cecial?"
        vocab:
          - {w: "esto de", d: "+ infinitive: this business of, this matter of"}
          - {w: "parecerse a", d: "to look like, resemble"}
          - {w: "sea el que se fuere", d: "whoever he may be"}
        diagram:
          - s: "¿qué diremos"
            r: "main verb: what shall we say"
            under:
              - {s: "Pues", r: "linking: well then"}
              - {s: "señor", r: "addressed to"}
              - s: "a esto de parecerse tanto aquel caballero"
                r: "to what: to this matter of that knight looking so much like"
                under:
                  - {s: "sea el que se fuere", r: "aside: whoever he may be"}
                  - {s: "al bachiller Carrasco", r: "like whom: like the bachelor Carrasco"}
                  - {s: "y su escudero a Tomé Cecial, mi compadre?", r: "and the second likeness: and his squire like my crony Tomé Cecial"}
          - {s: "respondió Sancho", r: "speech tag: Sancho answered"}
        forms:
          - {w: "diremos", f: "dir- + -emos → decir (to say), future, we. Irregular stem dir-: diré, dirás, dirá, diremos, diréis, dirán."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "parecerse", f: "parecer (to seem; with 'se', to resemble) + se, infinitive used as a noun after 'esto de'; its subject 'aquel caballero' follows it."}
          - {w: "sea", f: "se- + -a → ser (to be), present subjunctive, he: 'be he'. sea, seas, sea, seamos, seáis, sean."}
          - {w: "fuere", f: "fu- + -ere → ser (to be), future subjunctive, he: 'whoever he may be'. fuere, fueres, fuere, fuéremos, fuereis, fueren. Cervantes uses it for an open future or possibility; modern Spanish says 'sea quien sea'."}
          - {w: "al", f: "a + el, the contraction modern Spanish still makes."}
      - es: "Y si ello es encantamento, como vuestra merced ha dicho, ¿no había en el mundo otros dos a quien se parecieran?"
        literal: "And if it is enchantment, as your grace has said, not there-were in the world other two to whom themselves they-might-resemble?"
        ormsby: "And if that be enchantment, as your worship says, was there no other pair in the world for them to take the likeness of?”"
        vocab:
          - {w: "ello", d: "it, that (neuter, referring to the whole business)"}
          - {w: "encantamento", d: "= encantamiento, enchantment (old form)"}
          - {w: "vuestra merced", d: "your grace, your worship: the polite 'you', origin of modern 'usted'"}
          - {w: "a quien", d: "whom; old Spanish uses 'quien' for plural as well ('a quienes' today)"}
        diagram:
          - s: "¿no había en el mundo otros dos"
            r: "main verb: were there not two others in the world"
            under:
              - s: "Y si ello es encantamento"
                r: "condition: and if it is enchantment"
                under:
                  - {s: "como vuestra merced ha dicho", r: "aside: as your worship has said"}
              - {s: "a quien se parecieran?", r: "describes 'otros dos': whom they might look like"}
        forms:
          - {w: "es", f: "es → ser (to be), present, it. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "ha dicho", f: "ha (haber (to have), present, you (vuestra merced takes the 'he' form): he, has, ha, hemos, habéis, han) + dicho, irregular participle of decir (to say): 'you have said'."}
          - {w: "había", f: "hab- + -ía → haber (there to be), imperfect, impersonal 'there were'. The imperfect of -er verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "parecieran", f: "parec- + -ieran → parecerse (to resemble), imperfect subjunctive (-ra form), they, with 'se'. Built on the preterite parecieron: pareciera, parecieras, pareciera, pareciéramos, parecierais, parecieran. Subjunctive because the 'two others' are hypothetical."}
  - sentences:
      - es: "— Todo es artificio y traza —respondió don Quijote— de los malignos magos que me persiguen, los cuales, anteviendo que yo había de quedar vencedor en la contienda, se previnieron de que el caballero vencido mostrase el rostro de mi amigo el bachiller, porque la amistad que le tengo se pusiese entre los filos de mi espada y el rigor de mi brazo, y templase la justa ira de mi corazón, y desta manera quedase con vida el que con embelecos y falsías procuraba quitarme la mía."
        literal: "— All is artifice and scheme —answered Don Quijote— of the malign magicians who me persecute, the which, foreseeing that I was-to remain victor in the contest, themselves provided that the knight vanquished might-show the face of my friend the bachelor, so-that the friendship that to-him I-have might-put-itself between the edges of my sword and the rigour of my arm, and might-temper the just wrath of my heart, and of-this manner might-remain with life he who with tricks and falsehoods was-trying to-take-from-me the mine."
        ormsby: "“It is all,” said Don Quixote, “a scheme and plot of the malignant magicians that persecute me, who, foreseeing that I was to be victorious in the conflict, arranged that the vanquished knight should display the countenance of my friend the bachelor, in order that the friendship I bear him should interpose to stay the edge of my sword and might of my arm, and temper the just wrath of my heart; so that he who sought to take my life by fraud and falsehood should save his own."
        vocab:
          - {w: "artificio", d: "trick, contrivance (not 'artificial' in the modern sense)"}
          - {w: "traza", d: "scheme, plot, plan"}
          - {w: "mago", d: "magician, wizard"}
          - {w: "anteviendo", d: "foreseeing (from 'antever', to foresee; modern 'previendo')"}
          - {w: "haber de", d: "+ infinitive: to be going to, be bound to"}
          - {w: "quedar vencedor", d: "to come out the winner"}
          - {w: "contienda", d: "contest, fight"}
          - {w: "prevenirse de", d: "to make provision for, arrange beforehand"}
          - {w: "filo", d: "cutting edge of a blade"}
          - {w: "rigor", d: "force, harshness"}
          - {w: "templar", d: "to temper, moderate, soften"}
          - {w: "desta", d: "= de esta, of this (old contraction)"}
          - {w: "embeleco", d: "trick, fraud, deception"}
          - {w: "falsía", d: "falsehood, treachery"}
          - {w: "procurar", d: "to try, strive (not 'procure')"}
        diagram:
          - s: "Todo es artificio y traza"
            r: "main verb: it is all a trick and plot"
            under:
              - s: "de los malignos magos"
                r: "whose: of the malign magicians"
                under:
                  - {s: "que me persiguen", r: "describes 'magos': who persecute me"}
                  - s: "los cuales ... se previnieron"
                    r: "describes 'magos': who arranged beforehand"
                    under:
                      - {s: "anteviendo que yo había de quedar vencedor en la contienda", r: "why: foreseeing that I would win the fight"}
                      - {s: "de que el caballero vencido mostrase el rostro de mi amigo el bachiller", r: "what they arranged: that the defeated knight should show my friend the bachelor's face"}
                      - s: "porque la amistad"
                        r: "purpose: so that the friendship"
                        under:
                          - {s: "que le tengo", r: "describes 'amistad': that I feel for him"}
                          - {s: "se pusiese entre los filos de mi espada y el rigor de mi brazo", r: "purpose 1: should get between my sword's edge and my arm's force"}
                          - {s: "y templase la justa ira de mi corazón", r: "purpose 2: and soften my just anger"}
                      - s: "y desta manera quedase con vida el"
                        r: "result: and in this way he would stay alive"
                        under:
                          - {s: "que con embelecos y falsías procuraba quitarme la mía", r: "describes 'el': who by tricks and lies was trying to take my life"}
          - {s: "respondió don Quijote", r: "speech tag: Don Quijote answered"}
        forms:
          - {w: "persiguen", f: "persigu- + -en → perseguir (to persecute), present, they. The e of the stem becomes i when stressed: persigo, persigues, persigue, perseguimos, perseguís, persiguen."}
          - {w: "anteviendo", f: "gerund of antever (to foresee), built like ver (to see) → viendo."}
          - {w: "había de quedar", f: "hab- + -ía → haber (to have), imperfect, I: había, habías, había, habíamos, habíais, habían; + de + quedar (to remain): 'I was bound to come out'."}
          - {w: "se previnieron", f: "previn- + -ieron → prevenirse (to prepare, arrange beforehand), preterite, they. Like venir (to come): previne, previniste, previno, previnimos, previnisteis, previnieron."}
          - {w: "vencido", f: "venc- + -ido → vencer (to defeat), participle, masculine to match 'caballero': 'defeated'."}
          - {w: "mostrase, pusiese, templase, quedase", f: "imperfect subjunctive (-se form), it/he, after 'de que' and 'porque' (= so that): mostr- + -ase → mostrar (to show); pus- + -iese → ponerse (to put oneself); templ- + -ase → templar (to temper); qued- + -ase → quedar (to remain). The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen; poner (to put) has its own: pusiese, pusieses, pusiese, pusiésemos, pusieseis, pusiesen."}
          - {w: "tengo", f: "teng- + -o → tener (to have), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "desta", f: "de + esta (this), contracted; modern 'de esta'."}
          - {w: "procuraba", f: "procur- + -aba → procurar (to try), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "quitarme la mía", f: "quitar (to take away) + me (from me), the pronoun hung on the infinitive; la mía = mine, feminine to match 'vida'."}
        note: "Don Quijote uses his old explanation: enchanters who envy him change appearances to rob him of glory. In Part I he said the same when the giants turned out to be windmills and the armies flocks of sheep."
      - es: "Para prueba de lo cual ya sabes, ¡oh Sancho!, por experiencia que no te dejará mentir ni engañar, cuán fácil sea a los encantadores mudar unos rostros en otros, haciendo de lo hermoso feo y de lo feo hermoso, pues no ha dos días que viste por tus mismos ojos la hermosura y gallardía de la sin par Dulcinea en toda su entereza y natural conformidad, y yo la vi en la fealdad y bajeza de una zafia labradora, con cataratas en los ojos y con mal olor en la boca;"
        literal: "For proof of which already you-know, oh Sancho!, by experience that not you will-let lie nor deceive, how easy it-may-be for the enchanters to-change some faces into others, making of the beautiful ugly and of the ugly beautiful, since not it-has two days that you-saw with your own eyes the beauty and grace of the without equal Dulcinea in all her entireness and natural harmony, and I her saw in the ugliness and lowness of a coarse peasant-woman, with cataracts in the eyes and with bad smell in the mouth;"
        ormsby: "And to prove it, thou knowest already, Sancho, by experience which cannot lie or deceive, how easy it is for enchanters to change one countenance into another, turning fair into foul, and foul into fair; for it is not two days since thou sawest with thine own eyes the beauty and elegance of the peerless Dulcinea in all its perfection and natural harmony, while I saw her in the repulsive and mean form of a coarse country wench, with cataracts in her eyes and a foul smell in her mouth;"
        vocab:
          - {w: "para prueba de lo cual", d: "as proof of which"}
          - {w: "no te dejará mentir", d: "will not let you lie: experience you cannot deny"}
          - {w: "cuán", d: "how (before an adjective; modern 'qué' or 'lo ... que')"}
          - {w: "mudar", d: "to change, transform"}
          - {w: "no ha dos días", d: "not two days ago ('ha' = hace)"}
          - {w: "gallardía", d: "grace, elegance, fine bearing"}
          - {w: "sin par", d: "peerless, without equal: Dulcinea's stock epithet"}
          - {w: "entereza", d: "wholeness, perfection"}
          - {w: "conformidad", d: "harmony, proportion (of her features)"}
          - {w: "bajeza", d: "lowness, meanness"}
          - {w: "zafio", d: "coarse, crude, uncouth"}
          - {w: "labradora", d: "peasant woman, farm girl"}
          - {w: "cataratas", d: "cataracts (in the eye), clouding of the lens"}
        diagram:
          - s: "ya sabes"
            r: "main verb: you already know"
            under:
              - {s: "Para prueba de lo cual", r: "why: as proof of this"}
              - {s: "¡oh Sancho!", r: "addressed to"}
              - s: "por experiencia"
                r: "how: by experience"
                under:
                  - {s: "que no te dejará mentir ni engañar", r: "describes 'experiencia': that will not let you lie or deceive"}
              - s: "cuán fácil sea a los encantadores mudar unos rostros en otros"
                r: "what you know: how easy it is for enchanters to change faces"
                under:
                  - {s: "haciendo de lo hermoso feo y de lo feo hermoso", r: "how: making the beautiful ugly and the ugly beautiful"}
              - s: "pues no ha dos días"
                r: "why: since not two days ago"
                under:
                  - {s: "que viste por tus mismos ojos la hermosura y gallardía de la sin par Dulcinea", r: "what happened 1: you saw peerless Dulcinea's beauty and grace with your own eyes"}
                  - {s: "en toda su entereza y natural conformidad", r: "how: in all her perfection and natural harmony"}
                  - s: "y yo la vi en la fealdad y bajeza de una zafia labradora"
                    r: "what happened 2: and I saw her as an ugly, coarse peasant girl"
                    under:
                      - {s: "con cataratas en los ojos y con mal olor en la boca", r: "describes 'labradora': with cataracts and bad breath"}
        forms:
          - {w: "sabes", f: "sab- + -es → saber (to know), present, you (tú). sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "dejará", f: "dejar- + -á → dejar (to let), future, it (experience). The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "sea", f: "se- + -a → ser (to be), present subjunctive, it: sea, seas, sea, seamos, seáis, sean. The subjunctive after 'cuán' is old usage; modern Spanish says 'cuán fácil es'."}
