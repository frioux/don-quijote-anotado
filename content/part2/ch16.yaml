          - {w: "a buen seguro", d: "for sure, certainly"}
          - {w: "arrostrar", d: "to face; here 'to take to, fancy, look at' (food or a mate)"}
        diagram:
          - s: "Digo otra vez"
            r: "main verb: I say again"
            under:
              - s: "que puede vuestra merced detenerse"
                r: "what I say: that your worship may stop"
                under:
