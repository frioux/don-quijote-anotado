        note: "In Chapter X Sancho, sent to find Dulcinea in El Toboso, pretended that three peasant girls on donkeys were Dulcinea and her ladies. Don Quijote saw only a snub-nosed farm girl smelling of garlic, and concluded she had been enchanted, while Sancho swore he saw her beauty."
