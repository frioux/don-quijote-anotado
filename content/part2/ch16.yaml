  - sentences:
      - es: "— Esta figura que vuesa merced en mí ha visto, por ser tan nueva y tan fuera de las que comúnmente se usan, no me maravillaría yo de que le hubiese maravillado; pero dejará vuesa merced de estarlo cuando le diga, como le digo, que soy caballero"
        literal: "— This figure that your grace in me has seen, for being so new and so outside of those that commonly themselves-use, not myself would-marvel I that you it-might-have amazed; but will-cease your grace from being-it when I-may-tell-you, as I-tell-you, that I-am [a] knight"
        ormsby: "“The appearance I present to your worship being so strange and so out of the common, I should not be surprised if it filled you with wonder; but you will cease to wonder when I tell you, as I do, that I am one of those knights who,"
        vocab:
          - {w: "vuesa merced", d: "= vuestra merced, 'your grace', polite 'you' (third-person verb); 'vuesa' is a worn-down spoken form"}
          - {w: "nuevo", d: "here 'strange, unheard-of, novel', not only 'new'"}
          - {w: "fuera de", d: "outside of, beyond; 'tan fuera de las que se usan' = so out of the common"}
          - {w: "usarse", d: "to be in use, be the fashion"}
          - {w: "maravillarse de", d: "to be amazed at, wonder at; 'maravillar' (transitive) = to amaze"}
          - {w: "dejar de", d: "to stop, cease (+ infinitive)"}
        diagram:
          - s: "no me maravillaría yo"
            r: "main verb 1: I would not be surprised"
            under:
              - s: "Esta figura"
                r: "topic, picked up later by 'le hubiese maravillado': this figure"
                under:
                  - {s: "que vuesa merced en mí ha visto", r: "describes 'figura': that your grace has seen in me"}
                  - {s: "por ser tan nueva y tan fuera de las que comúnmente se usan", r: "why: because it is so strange and so far from the usual ones"}
              - {s: "de que le hubiese maravillado", r: "at what: that it had amazed you"}
          - s: "pero dejará vuesa merced de estarlo"
            r: "main verb 2: but your grace will stop being so"
            under:
              - s: "cuando le diga"
                r: "when: when I tell you"
                under:
                  - {s: "como le digo", r: "aside: as I am telling you"}
                  - {s: "que soy caballero", r: "what I tell: that I am a knight (continued in the verse lines)"}
        forms:
          - {w: "ha visto", f: "ha (haber (to have), present, you/he: he, has, ha, hemos, habéis, han) + visto, the irregular participle of ver (to see): perfect, 'your grace has seen'. 'vuesa merced' takes the he/she form of the verb."}
          - {w: "se usan", f: "us- + -an → usar (to use), present, they, with 'se' making it passive: 'are in use'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "maravillaría", f: "maravillar- + -ía → maravillar (to amaze), conditional, I: with 'me', 'I would be amazed'. The conditional adds -ía, -ías, -ía, -íamos, -íais, -ían to the whole infinitive."}
          - {w: "hubiese maravillado", f: "hubiese (haber (to have), imperfect subjunctive -se form, it: hubiese, hubieses, hubiese, hubiésemos, hubieseis, hubiesen) + maravillado, participle of maravillar (to amaze): 'that it had amazed you'. Subjunctive after 'maravillarse de que'."}
          - {w: "dejará", f: "dejar- + -á → dejar (to leave, stop), future, you (vuesa merced). The future adds -é, -ás, -á, -emos, -éis, -án to the whole infinitive."}
          - {w: "estarlo", f: "estar (to be) + lo, 'to be so' (amazed); 'lo' stands for the adjective understood, hung on the infinitive."}
          - {w: "diga", f: "dig- + -a → decir (to say), present subjunctive, I. Irregular: diga, digas, diga, digamos, digáis, digan. 'cuando' about the future takes the subjunctive."}
          - {w: "digo", f: "dig- + -o → decir (to say), present, I. Irregular: digo, dices, dice, decimos, decís, dicen."}
          - {w: "soy", f: "ser (to be), present, I. Irregular: soy, eres, es, somos, sois, son."}
        note: "Don Quijote plays on the verb: he would not 'marvel' that his figure had 'marvelled' the traveller. The sentence breaks off at 'caballero' because the next two lines are a quotation in verse."
  - sentences:
