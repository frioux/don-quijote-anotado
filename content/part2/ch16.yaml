  - sentences:
      - es: "— Los hijos, señor, son pedazos de las entrañas de sus padres, y así, se han de querer, o buenos o malos que sean, como se quieren las almas que nos dan vida;"
        literal: "— The children, sir, are pieces of the entrails of their parents, and so, themselves have to love, either good or bad that they-may-be, as themselves love the souls that to-us give life;"
        ormsby: "“Children, señor, are portions of their parents’ bowels, and therefore, be they good or bad, are to be loved as we love the souls that give us life;"
        vocab:
          - {w: "pedazos de las entrañas", d: "pieces of one's very insides, flesh and blood (a common phrase for one's children)"}
          - {w: "entrañas", d: "entrails, bowels; figuratively the heart, the innermost self"}
          - {w: "padres", d: "parents (not only 'fathers')"}
          - {w: "y así", d: "and so, and therefore"}
          - {w: "o buenos o malos que sean", d: "whether they be good or bad"}
        diagram:
          - s: "son pedazos de las entrañas de sus padres"
            r: "main verb 1: are pieces of their parents' insides"
            under:
              - {s: "Los hijos", r: "subject: children"}
              - {s: "señor", r: "addressed: sir"}
          - s: "se han de querer"
            r: "main verb 2 (after 'y así'): they are to be loved"
            under:
              - {s: "o buenos o malos que sean", r: "concession: whether good or bad"}
              - s: "como se quieren las almas"
                r: "how: as souls are loved"
                under:
                  - {s: "que nos dan vida", r: "describes 'almas': that give us life"}
        forms:
          - {w: "son", f: "ser (to be), present, they: soy, eres, es, somos, sois, son."}
          - {w: "sus", f: "sus = plural to match 'padres', not the owner; 'their parents'."}
          - {w: "se han de querer", f: "han (haber (to have), present, they: he, has, ha, hemos, habéis, han) + de + querer (to love), with 'se' making it passive: 'they are to be loved'. 'haber de' (to have to) + infinitive = must."}
          - {w: "sean", f: "se- + -an → ser (to be), present subjunctive, they: sea, seas, sea, seamos, seáis, sean. Subjunctive in 'o ... o ... que sean', 'whether they be'."}
          - {w: "se quieren", f: "quier- + -en → querer (to love), present, they, with 'se' making it passive: 'are loved'. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "dan", f: "d- + -an → dar (to give), present, they: doy, das, da, damos, dais, dan."}
        note: "Don Quijote, never married and childless, now gives a polished set speech on raising children and on poetry, full of the commonplaces of Renaissance moral writing."
      - es: "a los padres toca el encaminarlos desde pequeños por los pasos de la virtud, de la buena crianza y de las buenas y cristianas costumbres, para que cuando grandes sean báculo de la vejez de sus padres y gloria de su posteridad;"
        literal: "to the parents it-falls the guiding-them from small along the steps of the virtue, of the good upbringing and of the good and Christian customs, so that when grown they-may-be staff of the old-age of their parents and glory of their posterity;"
        ormsby: "it is for the parents to guide them from infancy in the ways of virtue, propriety, and worthy Christian conduct, so that when grown up they may be the staff of their parents’ old age, and the glory of their posterity;"
        vocab:
          - {w: "tocar a", d: "to be the duty of, fall to: 'a los padres toca' = it is for the parents"}
          - {w: "encaminar", d: "to guide, set on the right road"}
          - {w: "desde pequeños", d: "from childhood, from when they are small"}
          - {w: "crianza", d: "upbringing, manners ('buena crianza' = good breeding)"}
          - {w: "costumbres", d: "habits, morals, conduct"}
          - {w: "báculo", d: "staff, walking stick; support"}
          - {w: "posteridad", d: "posterity, descendants"}
        diagram:
          - s: "a los padres toca"
            r: "main verb: it falls to the parents"
            under:
              - s: "el encaminarlos"
                r: "subject: guiding them"
                under:
                  - {s: "desde pequeños", r: "when: from childhood"}
                  - {s: "por los pasos de la virtud, de la buena crianza y de las buenas y cristianas costumbres", r: "where: along the paths of virtue, good breeding and Christian conduct"}
                  - s: "para que"
                    r: "purpose: so that"
                    under:
                      - {s: "cuando grandes", r: "when: once grown up"}
                      - {s: "sean báculo de la vejez de sus padres y gloria de su posteridad", r: "they may be their parents' support in old age and the glory of their descendants"}
        forms:
          - {w: "toca", f: "toc- + -a → tocar (to fall to, be the duty of), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "el encaminarlos", f: "encaminar (to guide) + los (them) hung on the infinitive, which 'el' turns into a noun: 'the guiding of them', the subject of 'toca'."}
          - {w: "pequeños", f: "pequeñ- + -os → pequeño (small), masculine plural to match 'hijos' understood."}
          - {w: "buenas y cristianas", f: "feminine plural to match 'costumbres'."}
          - {w: "sean", f: "se- + -an → ser (to be), present subjunctive, they: sea, seas, sea, seamos, seáis, sean. Subjunctive after 'para que' (so that)."}
          - {w: "grandes", f: "grande (big, grown) in the plural; 'cuando grandes' leaves out 'sean': 'when [they are] grown'."}
      - es: "y en lo de forzarles que estudien esta o aquella ciencia no lo tengo por acertado, aunque el persuadirles no será dañoso;"
