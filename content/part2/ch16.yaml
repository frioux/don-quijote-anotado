      - es: "y cuando los reyes y príncipes veen la milagrosa ciencia de la poesía en sujetos prudentes, virtuosos y graves, los honran, los estiman y los enriquecen, y aun los coronan con las hojas del árbol a quien no ofende el rayo, como en señal que no han de ser ofendidos de nadie los que con tales coronas veen honrados y adornadas sus sienes."
        literal: "and when the kings and princes see the miraculous science of the poetry in subjects prudent, virtuous and grave, them they-honour, them they-esteem and them they-enrich, and even them they-crown with the leaves of-the tree to which not offends the lightning-bolt, as in sign that not they-are to be offended by nobody those who with such crowns see honoured and adorned their temples."
        ormsby: "And when kings and princes observe this marvellous science of poetry in wise, virtuous, and thoughtful subjects, they honour, value, exalt them, and even crown them with the leaves of that tree which the thunderbolt strikes not, as if to show that they whose brows are honoured and adorned with such a crown are not to be assailed by anyone.”"
        ormsby_note: "I.e., the laurel."
        vocab:
