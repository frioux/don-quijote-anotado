          - {w: "tengo", f: "teng- + -o → tener (to hold), present, I. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "el persuadirles", f: "persuadir (to persuade) + les (them), the infinitive made a noun by 'el': 'the persuading of them'."}
          - {w: "será", f: "ser- + -á → ser (to be), future, it. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
      - es: "y cuando no se ha de estudiar para pane lucrando, siendo tan venturoso el estudiante que le dio el cielo padres que se lo dejen, sería yo de parecer que le dejen seguir aquella ciencia a que más le vieren inclinado;"
        literal: "and when not oneself has to study for bread earning, being so fortunate the student that to-him gave the heaven parents who to-him it may-leave, I-would-be I of opinion that him they-let follow that science to which most him they-may-see inclined;"
        ormsby: "and when there is no need to study for the sake of pane lucrando, and it is the student’s good fortune that heaven has given him parents who provide him with it, it would be my advice to them to let him pursue whatever science they may see him most inclined to;"
        vocab:
