        note: "Don Quijote is still gloomy over Dulcinea's enchantment, so Sancho's kissing of the gentleman's feet is the first thing that makes him laugh."
      - es: "Preguntóle don Quijote que cuántos hijos tenía, y díjole que una de las cosas en que ponían el sumo bien los antiguos filósofos, que carecieron del verdadero conocimiento de Dios, fue en los bienes de la naturaleza, en los de la fortuna, en tener muchos amigos y en tener muchos y buenos hijos."
        literal: "Asked-him Don Quijote that how-many children he-had, and told-him that one of the things in which placed the highest good the ancient philosophers, who lacked of-the true knowledge of God, was in the goods of the nature, in those of the fortune, in having many friends and in having many and good children."
        ormsby: "Don Quixote then asked him how many children he had, and observed that one of the things wherein the ancient philosophers, who were without the true knowledge of God, placed the summum bonum was in the gifts of nature, in those of fortune, in having many friends, and many and good children."
        ormsby_note: "This is an instance of the heedless way in which Cervantes so often wrote. He meant, of course, that having many and good children was one of those things (such as, for example, the gifts of fortune, etc.) wherein the philosophers placed the summum bonum."
