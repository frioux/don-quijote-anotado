  - sentences:
      - es: "— Estemos a razón, Sancho —replicó don Quijote—."
        literal: "— Let-us-be to reason, Sancho —replied Don Quijote—."
        ormsby: "“Let us reason the matter, Sancho,” said Don Quixote."
        vocab:
          - {w: "estar a razón", d: "to reason it out, look at it reasonably"}
          - {w: "replicar", d: "to reply, answer back"}
        diagram:
          - s: "Estemos a razón"
            r: "main verb: let us reason it out"
            under:
              - {s: "Sancho", r: "addressed to"}
          - {s: "replicó don Quijote", r: "speech tag: Don Quijote replied"}
        forms:
          - {w: "Estemos", f: "est- + -emos → estar (to be), present subjunctive, we: 'let us be', the usual way to say 'let's'. estar (to be) in the present subjunctive: esté, estés, esté, estemos, estéis, estén."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (repliqué, with c → qu before e)."}
      - es: "Ven acá: ¿en qué consideración puede caber que el bachiller Sansón Carrasco viniese como caballero andante, armado de armas ofensivas y defensivas, a pelear conmigo? ¿He sido yo su enemigo por ventura?"
        literal: "Come here: in what consideration can fit that the bachelor Sansón Carrasco might-come as knight errant, armed with arms offensive and defensive, to fight with-me? Have been I his enemy by chance?"
        ormsby: "“Come now, by what process of thinking can it be supposed that the bachelor Samson Carrasco would come as a knight-errant, in arms offensive and defensive, to fight with me? Have I ever been by any chance his enemy?"
        vocab:
          - {w: "ven acá", d: "'come here': an expression meaning 'look here, think about it'"}
          - {w: "caber en", d: "to fit into; '¿en qué consideración puede caber?' = how can anyone think it possible?"}
          - {w: "armas ofensivas y defensivas", d: "weapons and armour (offensive arms: lance, sword; defensive: helmet, shield, mail)"}
          - {w: "pelear", d: "to fight"}
          - {w: "por ventura", d: "perhaps, by any chance"}
        diagram:
          - {s: "Ven acá:", r: "main verb 1: come now, look here"}
          - s: "¿en qué consideración puede caber"
            r: "main verb 2: how can it enter anyone's thinking"
            under:
              - s: "que el bachiller Sansón Carrasco viniese"
                r: "subject: that Sansón Carrasco should come"
                under:
                  - {s: "como caballero andante", r: "how: as a knight-errant"}
                  - {s: "armado de armas ofensivas y defensivas", r: "how: armed with weapons and armour"}
                  - {s: "a pelear conmigo?", r: "why: to fight with me"}
          - s: "¿He sido yo su enemigo"
            r: "main verb 3: have I been his enemy"
            under:
              - {s: "por ventura?", r: "how: by any chance"}
        forms:
          - {w: "Ven", f: "ven → venir (to come), imperative, you (tú). Irregular short form: ven (tú), venid (vosotros)."}
          - {w: "puede", f: "pued- + -e → poder (to be able), present, it. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "viniese", f: "vin- + -iese → venir (to come), imperfect subjunctive (-se form), he. Built on the preterite vinieron: viniese, vinieses, viniese, viniésemos, vinieseis, viniesen. Subjunctive because Don Quijote thinks it unthinkable."}
          - {w: "armado", f: "arm- + -ado → armar (to arm), participle, masculine to match 'Sansón Carrasco'."}
          - {w: "ofensivas y defensivas", f: "feminine plural to match 'armas'."}
          - {w: "conmigo", f: "con + mí becomes the single word conmigo, 'with me'."}
          - {w: "He sido", f: "he (haber (to have), present, I: he, has, ha, hemos, habéis, han) + sido, participle of ser (to be): 'I have been'."}
      - es: "¿Hele dado yo jamás ocasión para tenerme ojeriza?"
