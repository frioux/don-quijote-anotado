      - es: "La poesía, señor hidalgo, a mi parecer, es como una doncella tierna y de poca edad, y en todo estremo hermosa, a quien tienen cuidado de enriquecer, pulir y adornar otras muchas doncellas, que son todas las otras ciencias, y ella se ha de servir de todas, y todas se han de autorizar con ella;"
        literal: "The poetry, sir gentleman, to my opinion, is like a maiden tender and of little age, and in all extreme beautiful, whom have care to enrich, polish and adorn other many maidens, who are all the other sciences, and she herself has to serve of all, and all themselves have to authorize with her;"
        ormsby: "Poetry, gentle sir, is, as I take it, like a tender young maiden of supreme beauty, to array, bedeck, and adorn whom is the task of several other maidens, who are all the rest of the sciences; and she must avail herself of the help of all, and all derive their lustre from her."
