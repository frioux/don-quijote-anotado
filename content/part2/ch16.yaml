        forms:
          - {w: "dudo", f: "dud- + -o → dudar (to doubt), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "quédese", f: "qued- + -e + se → quedarse (to remain), present subjunctive, it, with 'se' stuck on the end: 'let it remain'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. A subjunctive opening a clause gives a command or wish, and the pronoun then hangs on the end."}
