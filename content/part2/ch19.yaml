        forms:
          - {w: "importa", f: "import- + -a → importar (to matter), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "me entiendo", f: "entiend- + -o → entender (to understand), present, I, with 'me' (myself). The stem e becomes ie when stressed: entiendo, entiendes, entiende, entendemos, entendéis, entienden."}
          - {w: "sé", f: "saber (to know), present, I; accent to tell it from the pronoun 'se'. Irregular: sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "he dicho", f: "he → haber (to have), present, I: he, has, ha, hemos, habéis, han; + dicho, the irregular participle of decir (to say): the present perfect, 'I have said'."}
