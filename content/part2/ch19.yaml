  - sentences:
      - es: "— Mía fe, señor bachiller, si vuesa merced toma mi consejo, de aquí adelante no ha de desafiar a nadie a esgrimir, sino a luchar o a tirar la barra, pues tiene edad y fuerzas para ello;"
        literal: "— My faith, sir bachelor, if your grace takes my advice, from here forward not you-have to challenge to nobody to fence, but to wrestle or to throw the bar, since you-have age and strength for it;"
        ormsby: "“By my faith, señor bachelor, if your worship takes my advice, you will never challenge anyone to fence again, only to wrestle and throw the bar, for you have the youth and strength for that;"
        vocab:
          - {w: "mía fe", d: "by my faith, upon my word (a peasant's oath)"}
          - {w: "bachiller", d: "bachelor, holder of the first university degree"}
          - {w: "vuesa merced", d: "your grace, your worship (polite 'you', with a 'he/she' verb); worn-down form of 'vuestra merced', the ancestor of 'usted'"}
          - {w: "de aquí adelante", d: "from now on, henceforth"}
          - {w: "desafiar", d: "to challenge"}
          - {w: "esgrimir", d: "to fence; also to wield (a weapon)"}
          - {w: "luchar", d: "here to wrestle"}
          - {w: "tirar la barra", d: "to throw the bar, a village sport like tossing the caber, a contest of strength"}
        diagram:
          - s: "no ha de desafiar a nadie a esgrimir"
            r: "main verb: you must not challenge anyone to fence"
            under:
              - {s: "Mía fe, señor bachiller", r: "oath and address: by my faith, sir bachelor"}
              - {s: "si vuesa merced toma mi consejo", r: "condition: if your worship takes my advice"}
              - {s: "de aquí adelante", r: "when: from now on"}
              - {s: "sino a luchar o a tirar la barra", r: "contrast: but to wrestle or throw the bar"}
              - {s: "pues tiene edad y fuerzas para ello", r: "why: since you have the youth and strength for it"}
        forms:
          - {w: "toma", f: "tom- + -a → tomar (to take), present, you (vuesa merced takes a 'he/she' verb). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "ha de desafiar", f: "ha → haber (to have), present, you (vuesa merced), + de + desafiar (to challenge): 'haber de' + infinitive = must, are to. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "no ... a nadie", f: "Spanish keeps both negatives: 'no ... nadie' = not ... anyone. 'a' marks 'nadie' as a person object."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, you (vuesa merced). Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "ello", f: "'it', the neuter pronoun after a preposition, standing for the whole idea (wrestling and bar-throwing)."}
      - es: "que destos a quien llaman diestros he oído decir que meten una punta de una espada por el ojo de una aguja."
        literal: "for of-these to whom they-call masters-of-fence I-have heard say that they-put a point of a sword through the eye of a needle."
        ormsby: "but as for these fencers as they call them, I have heard say they can put the point of a sword through the eye of a needle.”"
        vocab:
          - {w: "destos", d: "= de estos, of these (old contraction)"}
          - {w: "diestro", d: "a master of fence, a skilled swordsman (from 'destreza', skill); as an adjective, skilful or right-handed"}
          - {w: "oír decir", d: "to hear (it) said"}
          - {w: "meter", d: "to put in, thrust in"}
          - {w: "ojo de una aguja", d: "eye of a needle"}
        diagram:
          - s: "he oído decir"
            r: "main verb (after 'que', for): I have heard it said"
            under:
              - s: "destos"
                r: "about whom: of these men"
                under:
                  - {s: "a quien llaman diestros", r: "describes 'estos': whom they call masters of fence"}
              - {s: "que meten una punta de una espada por el ojo de una aguja", r: "what he heard: that they put a sword's point through the eye of a needle"}
        forms:
          - {w: "destos", f: "= de + estos, the old contraction of 'de' (of) and 'estos' (these), masculine plural; modern 'de estos'."}
          - {w: "a quien", f: "'whom', singular 'quien' used for a plural (the 'diestros'), common in Cervantes; modern 'a quienes'."}
          - {w: "llaman", f: "llam- + -an → llamar (to call), present, they (people in general). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "he oído", f: "he → haber (to have), present, I, + oído, participle of oír (to hear): the perfect, 'I have heard'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "meten", f: "met- + -en → meter (to put in), present, they. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
  - sentences:
      - es: "— Yo me contento —respondió Corchuelo— de haber caído de mi burra, y de que me haya mostrado la experiencia la verdad, de quien tan lejos estaba."
        literal: "— I myself content —answered Corchuelo— with having fallen from my she-ass, and with that to-me may-have shown the experience the truth, from which so far I-was."
        ormsby: "“I am satisfied with having tumbled off my donkey,” said Corchuelo, “and with having had the truth I was so ignorant of proved to me by experience;”"
        vocab:
          - {w: "contentarse de", d: "to be content with, satisfied with (modern 'contentarse con')"}
          - {w: "caer de su burra", d: "to fall off one's donkey: to admit one was wrong, to come down off one's high horse"}
          - {w: "burra", d: "she-donkey"}
          - {w: "de quien", d: "from which: 'quien' used for a thing (la verdad), normal in Cervantes; modern 'de la que'"}
          - {w: "estar lejos de", d: "to be far from"}
        diagram:
          - s: "Yo me contento"
            r: "main verb: I am content"
            under:
              - {s: "de haber caído de mi burra", r: "with what, 1: with having fallen off my donkey"}
              - s: "y de que me haya mostrado la experiencia la verdad"
                r: "with what, 2: and that experience has shown me the truth"
                under:
                  - {s: "de quien tan lejos estaba", r: "describes 'verdad': from which I was so far"}
          - s: "respondió"
            r: "speech verb: answered"
            under:
              - {s: "Corchuelo", r: "subject: who answered"}
        forms:
          - {w: "me contento", f: "content- + -o → contentarse (to be content), present, I, with 'me' (myself). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "haber caído", f: "haber (to have), infinitive, after 'de', + caído, participle of caer (to fall): 'having fallen'."}
          - {w: "haya mostrado", f: "hay- + -a → haber (to have), present subjunctive, it, + mostrado, participle of mostrar (to show): 'has shown'. haber in the present subjunctive: haya, hayas, haya, hayamos, hayáis, hayan. Subjunctive after 'contentarse de que'. The subject 'la experiencia' comes after the verb."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, I. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
        ormsby_note: "To fall off one's donkey, caer de su borrico or burro, a popular phrase for owning that one has been in the wrong."
  - sentences:
      - es: "Y, levantándose, abrazó al licenciado, y quedaron más amigos que de antes, y no queriendo esperar al escribano, que había ido por la espada, por parecerle que tardaría mucho; y así, determinaron seguir, por llegar temprano a la aldea de Quiteria, de donde todos eran."
        literal: "And, getting-up-himself, he-embraced to-the licentiate, and they-remained more friends than of before, and not wanting to-wait for-the notary, who had gone for the sword, because-of seeming-to-them that he-would-delay much; and so, they-determined to-continue, in-order-to arrive early at the village of Quiteria, from where all were."
        ormsby: "and getting up he embraced the licentiate, and they were better friends than ever; and not caring to wait for the notary who had gone for the sword, as they saw he would be a long time about it, they resolved to push on so as to reach the village of Quiteria, to which they all belonged, in good time."
        vocab:
          - {w: "levantarse", d: "to get up, stand up"}
          - {w: "quedar", d: "to remain, end up; 'quedaron más amigos' = they ended up better friends"}
          - {w: "de antes", d: "than before (the 'de' is old-fashioned padding)"}
          - {w: "ir por", d: "to go for, go and fetch"}
          - {w: "parecerle a uno", d: "to seem to someone, think"}
          - {w: "tardar", d: "to take a long time, be late"}
          - {w: "determinar", d: "to decide, resolve (not 'to determine' in the scientific sense)"}
          - {w: "seguir", d: "here to go on, continue the journey"}
          - {w: "temprano", d: "early, in good time"}
          - {w: "de donde todos eran", d: "where they all came from"}
        diagram:
          - s: "abrazó al licenciado"
            r: "main verb 1: he embraced the licentiate"
            under:
              - {s: "levantándose", r: "when: getting up"}
          - s: "y quedaron más amigos que de antes"
            r: "main verb 2: and they were better friends than before"
          - s: "determinaron seguir"
            r: "main verb 3 (after 'y así'): they decided to go on"
            under:
              - s: "no queriendo esperar al escribano"
                r: "why 1: not wanting to wait for the notary"
                under:
                  - {s: "que había ido por la espada", r: "describes 'escribano': who had gone for the sword"}
                  - {s: "por parecerle que tardaría mucho", r: "why: because they thought he would be a long time"}
              - s: "por llegar temprano a la aldea de Quiteria"
                r: "purpose: to reach Quiteria's village in good time"
                under:
                  - {s: "de donde todos eran", r: "describes 'aldea': where they all came from"}
        forms:
          - {w: "levantándose", f: "gerund of levantarse (to get up), levant- + -ando + se, with 'se' on the end and an accent to keep the stress: 'getting up'."}
          - {w: "abrazó", f: "abraz- + -ó → abrazar (to embrace), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "quedaron", f: "qued- + -aron → quedar (to remain), preterite, they. Same -ar preterite."}
          - {w: "queriendo", f: "gerund of querer (to want), quer- + -iendo: 'wanting'. The -er and -ir gerund ends in -iendo."}
          - {w: "había ido", f: "hab- + -ía → haber (to have), imperfect, he, + ido, participle of ir (to go): the pluperfect, 'had gone'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "parecerle", f: "parecer (to seem) + le (to him), the pronoun on the end of the infinitive after 'por' (because of). 'le' is singular though several decide: the sentence slides from Corchuelo to the whole group."}
          - {w: "tardaría", f: "tardar- + -ía → tardar (to take long), conditional, he: 'would take long'. The conditional adds endings to the whole infinitive: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "determinaron", f: "determin- + -aron → determinar (to decide), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "eran", f: "ser (to be), imperfect, they; 'ser de' = to come from. Irregular: era, eras, era, éramos, erais, eran."}
        note: "The sentence wanders: it starts with Corchuelo alone, slides into 'they', and breaks off with a semicolon before 'y así' picks up the thread. Cervantes' long narrative sentences often run like speech."
  - sentences:
      - es: "En lo que faltaba del camino, les fue contando el licenciado las excelencias de la espada, con tantas razones demostrativas y con tantas figuras y demostraciones matemáticas, que todos quedaron enterados de la bondad de la ciencia, y Corchuelo reducido de su pertinacia."
        literal: "In that which was-lacking of-the road, to-them went telling the licentiate the excellences of the sword, with so-many reasons demonstrative and with so-many figures and demonstrations mathematical, that all remained informed of the goodness of the science, and Corchuelo brought-back from his obstinacy."
        ormsby: "During the remainder of the journey the licentiate held forth to them on the excellences of the sword, with such conclusive arguments, and such figures and mathematical proofs, that all were convinced of the value of the science, and Corchuelo cured of his dogmatism."
        vocab:
          - {w: "en lo que faltaba del camino", d: "for the rest of the way, during what was left of the journey"}
          - {w: "ir contando", d: "to keep telling, tell all the way along"}
          - {w: "excelencias", d: "excellences, merits"}
          - {w: "razones demostrativas", d: "conclusive arguments, proofs ('razón' = argument, reason)"}
          - {w: "figuras", d: "geometric figures, diagrams"}
          - {w: "quedar enterado de", d: "to be fully informed of, convinced of"}
          - {w: "bondad", d: "goodness, worth, value"}
          - {w: "reducir de", d: "to bring back from, win over from (an error); 'reducido' = brought round"}
          - {w: "pertinacia", d: "obstinacy, stubbornness"}
        diagram:
          - s: "les fue contando"
            r: "main verb: went on telling them"
            under:
              - {s: "En lo que faltaba del camino", r: "when: for the rest of the way"}
              - {s: "el licenciado", r: "subject: the licentiate"}
              - {s: "las excelencias de la espada", r: "object: the merits of the sword"}
              - s: "con tantas razones demostrativas y con tantas figuras y demostraciones matemáticas"
                r: "how: with so many proofs and mathematical figures"
                under:
                  - {s: "que todos quedaron enterados de la bondad de la ciencia", r: "result 1: that everyone was convinced of the science's worth"}
                  - {s: "y Corchuelo reducido de su pertinacia", r: "result 2 (verb 'quedó' understood): and Corchuelo cured of his obstinacy"}
        forms:
          - {w: "faltaba", f: "falt- + -aba → faltar (to be lacking, remain), imperfect, it. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
          - {w: "fue contando", f: "fue → ir (to go), preterite, he: fui, fuiste, fue, fuimos, fuisteis, fueron; + contando, gerund of contar (to tell): 'ir' + gerund = to keep doing something step by step, 'went on telling'."}
          - {w: "tantas", f: "tant- + -as → tanto (so much, so many), feminine plural to match 'razones' and 'figuras'; it sets up the result clause 'que ...'."}
          - {w: "demostrativas, matemáticas", f: "feminine plural adjectives after their nouns, matching 'razones' and 'demostraciones'."}
          - {w: "quedaron enterados", f: "qued- + -aron → quedar (to remain), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. + enterados, participle of enterar (to inform), masculine plural to match 'todos'."}
          - {w: "reducido", f: "participle of reducir (to bring back, win over), masculine to match 'Corchuelo'; 'quedó' is understood from 'quedaron'."}
        note: "The Spanish school of fencing, founded by Jerónimo Sánchez de Carranza and carried on by Luis Pacheco de Narváez, presented itself as a mathematical science, with diagrams of circles and angles on the floor; the licentiate's lecture follows that fashion."
  - sentences:
      - es: "Era anochecido, pero antes que llegasen les pareció a todos que estaba delante del pueblo un cielo lleno de inumerables y resplandecientes estrellas."
        literal: "It-was nightfallen, but before that they-arrived to-them it-seemed to all that was in-front of-the town a sky full of innumerable and shining stars."
        ormsby: "It grew dark; but before they reached the town it seemed to them all as if there was a heaven full of countless glittering stars in front of it."
        vocab:
          - {w: "era anochecido", d: "night had fallen, it was already dark ('anochecer' = to grow dark)"}
          - {w: "antes que", d: "before (modern usually 'antes de que'), followed by the subjunctive"}
          - {w: "parecerle a uno", d: "to seem to someone"}
          - {w: "inumerables", d: "= innumerables, countless (old spelling)"}
          - {w: "resplandeciente", d: "shining, glittering, resplendent"}
        diagram:
          - s: "Era anochecido"
            r: "main verb 1: night had fallen"
          - s: "pero ... les pareció a todos"
            r: "main verb 2: but it seemed to them all"
            under:
              - {s: "antes que llegasen", r: "when: before they arrived"}
              - s: "que estaba delante del pueblo un cielo"
                r: "what seemed: that in front of the town there was a sky"
                under:
                  - {s: "lleno de inumerables y resplandecientes estrellas", r: "describes 'cielo': full of countless shining stars"}
        forms:
          - {w: "Era anochecido", f: "era → ser (to be), imperfect, it: era, eras, era, éramos, erais, eran; + anochecido, participle of anochecer (to grow dark): 'it was grown dark'. Old Spanish could build the perfect of some intransitive verbs with ser instead of haber (to have); modern 'había anochecido'."}
          - {w: "llegasen", f: "lleg- + -asen → llegar (to arrive), imperfect subjunctive (-se form), they. The -se imperfect subjunctive of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen. Subjunctive after 'antes que' (before), since the arrival had not yet happened."}
          - {w: "pareció", f: "parec- + -ió → parecer (to seem), preterite, it. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, it (the sky, which comes after the verb). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "inumerables, resplandecientes", f: "plural adjectives placed before 'estrellas'; '-able' and '-ente' adjectives have one form for both genders. inumerables = old spelling of innumerables."}
        note: "The 'sky of stars' is the lamps hung in the trees of the wedding arbour, seen from a distance in the dark; the next sentences explain it."
      - es: "Oyeron, asimismo, confusos y suaves sonidos de diversos instrumentos, como de flautas, tamborinos, salterios, albogues, panderos y sonajas;"
        literal: "They-heard, likewise, mingled and soft sounds of various instruments, as of flutes, small-drums, psalteries, shepherd's-pipes, tambourines and jingles;"
