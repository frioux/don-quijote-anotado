  - sentences:
      - es: "— Por esa sola gracia —dijo a esta sazón don Quijote—, merecía ese mancebo no sólo casarse con la hermosa Quiteria, sino con la mesma reina Ginebra, si fuera hoy viva, a pesar de Lanzarote y de todos aquellos que estorbarlo quisieran."
        literal: "— For that sole grace —said at this moment Don Quijote—, deserved that youth not only to-marry-himself with the beautiful Quiteria, but with the very queen Guinevere, if she-were today alive, in spite of Lancelot and of all those who to-hinder-it might-wish."
        ormsby: "“For that excellence alone,” said Don Quixote at this, “the youth deserves to marry, not merely the fair Quiteria, but Queen Guinevere herself, were she alive now, in spite of Launcelot and all who would try to prevent it.”"
        vocab:
