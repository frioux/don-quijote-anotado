        vocab:
          - {w: "asimismo", d: "likewise, also"}
          - {w: "confuso", d: "mingled, blended together (not 'confused' in the mental sense)"}
          - {w: "suave", d: "soft, gentle, pleasant"}
          - {w: "tamborino", d: "small drum, tabor, played with a pipe at village festivals"}
          - {w: "salterio", d: "psaltery, a stringed instrument plucked or struck"}
          - {w: "albogue", d: "a rustic pipe or double flute played by shepherds (an Arabic word)"}
          - {w: "pandero", d: "large tambourine, a frame drum"}
          - {w: "sonajas", d: "jingles: a wooden frame with small metal discs, shaken in time"}
        diagram:
          - s: "Oyeron"
            r: "main verb: they heard"
            under:
              - {s: "asimismo", r: "linking: also"}
              - s: "confusos y suaves sonidos"
                r: "object: mingled and gentle sounds"
                under:
                  - s: "de diversos instrumentos"
                    r: "describes 'sonidos': of various instruments"
                    under:
                      - {s: "como de flautas, tamborinos, salterios, albogues, panderos y sonajas", r: "examples: such as flutes, drums, psalteries, pipes, tambourines and jingles"}
        forms:
          - {w: "Oyeron", f: "oy- + -eron → oír (to hear), preterite, they. The i turns to y between vowels: oí, oíste, oyó, oímos, oísteis, oyeron."}
          - {w: "confusos y suaves", f: "confus- + -os → confuso (mingled), masculine plural, and suave + -s (soft), both before 'sonidos' and matching it."}
          - {w: "diversos", f: "divers- + -os → diverso (various), masculine plural to match 'instrumentos'; before a noun it means 'several, various'."}
      - es: "y cuando llegaron cerca vieron que los árboles de una enramada, que a mano habían puesto a la entrada del pueblo, estaban todos llenos de luminarias, a quien no ofendía el viento, que entonces no soplaba sino tan manso que no tenía fuerza para mover las hojas de los árboles."
