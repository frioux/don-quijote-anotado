      - es: "Y, apeándose de Rocinante y asiendo de su lanza, se puso en la mitad del camino, a tiempo que ya el licenciado, con gentil donaire de cuerpo y compás de pies, se iba contra Corchuelo, que contra él se vino, lanzando, como decirse suele, fuego por los ojos."
