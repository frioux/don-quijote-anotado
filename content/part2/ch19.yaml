      - es: "Pero no importa: yo me entiendo, y sé que no he dicho muchas necedades en lo que he dicho; sino que vuesa merced, señor mío, siempre es friscal de mis dichos, y aun de mis hechos."
        literal: "But not it-matters: I myself understand, and I-know that not I-have said many foolishnesses in that which I-have said; but that your grace, sir mine, always is prosecutor-[garbled] of my sayings, and even of my deeds."
        ormsby: "but no matter; I understand myself, and I know I have not said anything very foolish in what I have said; only your worship, señor, is always gravelling at everything I say, nay, everything I do.”"
        vocab:
          - {w: "no importa", d: "it doesn't matter, never mind"}
          - {w: "necedad", d: "foolishness, piece of stupidity"}
          - {w: "sino que", d: "but rather, only (it is just that)"}
          - {w: "vuesa merced", d: "your grace, 'your worship' (polite address, a worn-down form of 'vuestra merced'; modern 'usted' comes from it)"}
          - {w: "friscal", d: "Sancho's garbling of 'fiscal' (public prosecutor; figuratively a fault-finder, a critic of every word). Ormsby imitates the slip with 'gravelling' for 'cavilling'"}
          - {w: "dichos y hechos", d: "sayings and doings, words and deeds: a set pair"}
          - {w: "aun", d: "even"}
