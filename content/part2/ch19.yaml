          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "merecía", f: "merec- + -ía → merecer (to deserve), imperfect, he, used here for 'would deserve', a polite softening. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "casarse", f: "casar (to marry) + se: 'casarse con' = to get married to; the pronoun hangs on the infinitive."}
