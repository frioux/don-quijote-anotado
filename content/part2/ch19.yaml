summary: |
  A little way past Don Diego's village, Don Quijote and Sancho fall in with two students (or clerics) and two peasants riding she-asses. One student carries a bundle of linen and stockings, the other a pair of new practice foils. Everyone stares at the knight; he introduces himself as Don Quijote de la Mancha, the Knight of the Lions. The peasants understand nothing, the students see at once that he is mad, and one of them invites him to the next day's wedding, the richest ever seen in La Mancha.

  The student, a licentiate, tells the story. Camacho the rich, the wealthiest farmer of the district, is to marry Quiteria the fair, and he has roofed the whole meadow with branches and hired sword-dancers, bell-dancers and shoe-dancers. But the wedding will be remembered for Basilio, Quiteria's neighbour, who has loved her since childhood like Pyramus and Thisbe through the wall; her father has shut him out and matched her with Camacho, because Basilio, though the best runner, wrestler, singer and swordsman in the village, is poor. Since he heard the news Basilio has stopped speaking sense, eats fruit, sleeps on the ground and stares at the sky, and everyone fears that Quiteria's 'yes' will kill him.

  Don Quijote says Basilio deserves Queen Guinevere herself, then gives a short sermon on marriage: children cannot be left to choose for themselves, a wife is a companion for life's whole journey, and marriage is a Gordian knot only death can cut. Sancho strings together proverbs about Fortune's wheel and a woman's yes and no, is scolded for it, and mangles 'fiscal' into 'friscal'. The licentiate remarks that good Spanish comes from good sense and practice, not from birthplace, and boasts of his own plain speech; the other student, Corchuelo, mocks his skill with the foils.

  The two quarrel over whether the science of fencing is worth anything. Corchuelo, all strength and fury, attacks; the licentiate, with circles and angles, taps him on the mouth with the button of his foil, counts every button on his cassock, slashes his skirts to ribbons, knocks off his hat twice, and tires him out until Corchuelo hurls the sword three-quarters of a league, as a peasant notary later swears. Corchuelo admits he was wrong and embraces the victor. At nightfall they reach Quiteria's village, lit with lamps in the trees and full of music and dancing, where stands are being built for the next day's wedding of Camacho and 'the funeral of Basilio'. Don Quijote, to Sancho's regret, refuses to sleep in the village, since knights-errant sleep in the fields.
context: |
  A rich peasants' wedding. Camacho and Quiteria are 'labradores', farmers, not gentry; the student's 'él, el más rico de toda esta tierra' is about money, and the wealthy labrador was a recognisable figure in the villages of La Mancha. The licentiate admits that genealogy-minded busybodies rate Quiteria's family above Camacho's, 'but nowadays nobody looks at that, for riches can solder many cracks'. Camacho's display is the theme of the next chapters: a meadow roofed over with branches, raised stands for plays and dances, lamps hung in the trees. Ormsby explains the three kinds of dancers: in the sword dances the dancers made cuts and passes at each other, coming as close as they could without doing harm; the bell-dancers wore costumes hung with little bells, like English morris-dancers; and the 'zapateadores' slapped the soles of their shoes with their palms.

  Who chooses the husband. Sancho's wife Teresa argued in Chapter V that their daughter should marry 'her equal', and Sancho now quotes her proverb 'cada oveja con su pareja', each ewe with her mate, then wishes ill (and, he corrects himself, good) to anyone who keeps lovers apart. Don Quijote, surprisingly, takes the parents' side: love blinds the eyes of the understanding, and a daughter left to herself might pick her father's servant or a swaggering bravo she saw in the street. His sermon draws on familiar images: life as a journey with death as the last inn ('paradero'), marriage as an 'inseparable accident' (a term from scholastic philosophy, a quality that cannot be removed from its subject), and the Gordian knot that Alexander the Great cut with his sword because no one could untie it, here cut only by Death's scythe.

  Pyramus and Thisbe again. The licentiate's comparison of Basilio and Quiteria, whose houses shared a wall, to Ovid's Babylonian lovers comes straight after Don Lorenzo's sonnet on the same story in Chapter XVIII. Don Quijote's Guinevere and Lancelot, the queen of King Arthur and her lover, are his idea of the highest match a young man can make. The chapter title promises 'the adventure of the enamoured shepherd', but Basilio, a 'zagal' or village lad, has not yet appeared; his behaviour (no sleep, no sense, fruit for food, eyes on the sky) is the conventional picture of the despairing lover of the pastoral romances.

  Sancho's proverbs and Sancho's Spanish. Sancho's speech is a string of sayings: God who gives the wound gives the cure, the house can fall in an hour, rain and sun at once, nobody has driven a nail into Fortune's wheel to stop it turning, love sees through spectacles that turn copper to gold and bleary eyes to pearls. Ormsby lists two of them by number in his catalogue of the book's proverbs. Don Quijote's complaint that only Judas could follow him repeats a running quarrel between the two over Sancho's proverbs. Sancho's 'friscal' for 'fiscal' (prosecutor, fault-finder) is one of his malapropisms, and he defends himself: he was not brought up at court or educated at Salamanca, and one cannot make a man from Sayago, a rustic district near Zamora, talk like a Toledan. Ormsby notes that from the time of Alfonso X the Castilian of Toledo was taken as the standard. The licentiate refines the point: the tanners' quarter and the Zocodover, Toledo's market square, do not speak like the idlers in the cathedral cloister, and good Spanish belongs to 'discretos cortesanos' even if they were born in Majalahonda, a village near Madrid. His maxim 'la discreción es la gramática del buen lenguaje' puts judgement and usage above birthplace.

  Students and degrees. The narrator calls the first student 'bachiller, o licenciado, como le llamó don Quijote': a bachelor, the lower degree, whom Don Quijote promotes, and the title sticks. He has studied canon law at Salamanca; his companion Corchuelo is also addressed as 'bachiller'. Corchuelo's jibe that his rival came out 'cola', the tail, rather than first in the licentiate examinations, refers to the order of merit in which candidates for the licentiate were ranked, the same ranking Don Quijote compared to poetry prizes in the previous chapter. The two speak to each other as 'vos', the familiar and here quarrelsome form.

  The science of fencing. The 'espadas negras' are blunt practice swords, black iron as opposed to the bright 'blancas' used in earnest, with 'zapatillas', leather buttons on the points. The licentiate's 'compás de pies', circles and angles belong to the Spanish school of fencing called 'la verdadera destreza', which treated swordsmanship as a geometrical science; its founder was Jerónimo Sánchez de Carranza and its best-known teacher in Cervantes' day Luis Pacheco de Narváez. Corchuelo fights in the old way, by strength and courage: 'cuchilladas' (cuts), 'estocadas' (thrusts), 'altibajos' (downward cuts), 'reveses' (backhand cuts) and 'mandobles', which, Ormsby notes, the Academy defined as two-handed strokes, though another authority took them as cuts given with a turn of the wrist. The outcome, sworn to by a peasant who happens to be a notary in a mock-legal 'testimonio', proves that 'la fuerza es vencida del arte', strength is beaten by skill. Corchuelo's 'caer de mi burra' was, as Ormsby explains, a popular phrase for admitting one had been wrong.

  Reading Cervantes' Spanish. Archaisms in this chapter: alongado (alejado), mesmo and asimesmo (mismo, asimismo), estraordinario and estremo (extraordinario, extremo), yerbas (hierbas), encantamento (encantamiento), celebro (cerebro), eleción and juridición (elección, jurisdicción), invidia (envidia), polido (pulido), antojos (anteojos, spectacles), aspetatores (espectadores), inumerables (innumerables), solenizar (solemnizar), and the contractions dellos, desta and destos. Pronouns hang on the end of verbs that open a clause (Saludóles, Díjoles, Preguntóle, Sentóse, derribóle, cansóle, arrojóla, salíale) and even on a compound tense (hásele antojado). 'Haber de' gives obligation or future (se han de celebrar, has de decir, no ha de ser así), and the -ra form serves as a conditional (quisiera, pudiera, estorbara). The quarrelling students use the old vos forms: picáredes (future subjunctive), llevárades (the -ra form as conditional), llevastes (preterite, modern llevasteis), clavásedes and quedásedes (imperfect subjunctive). Watch the false friends and shifted meanings: curiosos (busybodies), liberal (generous), razón (sense, words), discreto (sensible, clever), bizarro (dashing), honestos (modest, chaste), sentencias (sayings), and the idioms 'para en uno' (well matched), 'pared y medio' (next door), 'como el más pintado' (as well as the best) and 'no cortarlas en el aire' (not be quick and sharp).
