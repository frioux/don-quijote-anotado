  - sentences:
      - es: "— De todo no me queda más que decir sino que desde el punto que Basilio supo que la hermosa Quiteria se casaba con Camacho el rico, nunca más le han visto reír ni hablar razón concertada, y siempre anda pensativo y triste, hablando entre sí mismo, con que da ciertas y claras señales de que se le ha vuelto el juicio:"
        literal: "— Of all not to-me remains more to say but that since the point that Basilio learned that the beautiful Quiteria herself was-marrying with Camacho the rich, never more him have-they seen laugh nor speak reason ordered, and always he-goes pensive and sad, talking among himself same, with which he-gives certain and clear signs of that to-him has turned the judgement:"
        ormsby: "“I have nothing whatever to say further, but that from the moment Basilio learned that the fair Quiteria was to be married to Camacho the rich, he has never been seen to smile, or heard to utter rational word, and he always goes about moody and dejected, talking to himself in a way that shows plainly he is out of his senses."
        vocab:
          - {w: "desde el punto que", d: "from the moment that"}
          - {w: "razón concertada", d: "a sensible word, coherent speech ('razón' = words, talk)"}
          - {w: "andar", d: "to go about (in a state): 'anda pensativo' = he goes about brooding"}
          - {w: "pensativo", d: "brooding, lost in thought"}
          - {w: "entre sí mismo", d: "to himself"}
          - {w: "con que", d: "by which, so that"}
          - {w: "volvérsele el juicio a uno", d: "to lose one's wits, have one's mind turned"}
        diagram:
          - s: "De todo no me queda más que decir"
            r: "main verb: of it all I have nothing more to say"
            under:
              - s: "sino que ... nunca más le han visto reír ni hablar razón concertada"
                r: "except that: he has never since been seen to laugh or speak sense"
                under:
                  - {s: "desde el punto que Basilio supo", r: "when: from the moment Basilio learned"}
                  - {s: "que la hermosa Quiteria se casaba con Camacho el rico", r: "what he learned: that Quiteria was marrying Camacho"}
              - s: "y siempre anda pensativo y triste"
                r: "except that, 2: and he always goes about brooding and sad"
                under:
                  - {s: "hablando entre sí mismo", r: "how: talking to himself"}
                  - s: "con que da ciertas y claras señales"
                    r: "result: by which he gives sure, clear signs"
                    under:
                      - {s: "de que se le ha vuelto el juicio", r: "of what: that his mind has been turned"}
        forms:
          - {w: "queda", f: "qued- + -a → quedar (to remain), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "supo", f: "sup- + -o → saber (to know; in the preterite 'to find out'), preterite, he. Irregular: supe, supiste, supo, supimos, supisteis, supieron."}
          - {w: "se casaba", f: "cas- + -aba → casarse (to marry), imperfect, she: 'was going to marry'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "le han visto", f: "han (haber (to have), present, they: he, has, ha, hemos, habéis, han) + visto, irregular participle of ver (to see): 'they have seen'; 'they' is people in general. le = him: leísmo, Cervantes' 'le' for a male person as object where modern standard usage has 'lo'."}
          - {w: "reír, hablar", f: "infinitives of reír (to laugh) and hablar (to speak) after 'han visto': 'seen [him] laugh, speak'."}
          - {w: "concertada", f: "concert- + -ada → concertar (to order, arrange), participle used as an adjective, feminine to match 'razón'."}
          - {w: "anda", f: "and- + -a → andar (to go about), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "hablando", f: "gerund of hablar (to talk): 'talking'."}
          - {w: "da", f: "d- + -a → dar (to give), present, he. Irregular: doy, das, da, damos, dais, dan."}
          - {w: "se le ha vuelto", f: "ha (haber (to have), present, it: he, has, ha, hemos, habéis, han) + vuelto, irregular participle of volver (to turn): perfect, 'has turned'; se = itself, le = on him: 'his mind has turned on him'."}
