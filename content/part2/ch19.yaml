                under:
                  - {s: "que ya me le voy aficionando", r: "aside: for I am already growing fond of him"}
          - s: "que buen siglo hayan y buen poso"
            r: "main verb 2 (a blessing, meant as a curse): may they rest in peace"
            under:
              - {s: "iba a decir al revés", r: "aside: I was going to say the opposite"}
              - s: "los que estorban"
                r: "subject of 'hayan': those who prevent"
                under:
                  - {s: "que se casen los que bien se quieren", r: "what they prevent: that those who love each other marry"}
        forms:
          - {w: "quisiera", f: "quis- + -iera → querer (to want), imperfect subjunctive (-ra form), I, used as a polite conditional: 'I would like'. quisiera, quisieras, quisiera, quisiéramos, quisierais, quisieran."}
          - {w: "buen", f: "bueno (good) clipped before a masculine singular noun ('Basilio', 'siglo', 'poso'), like un, gran, ningún."}
          - {w: "me le voy aficionando", f: "voy (ir (to go), present, I: voy, vas, va, vamos, vais, van) + aficionando, gerund of aficionarse (to grow fond): 'ir (to go)' + gerund = 'I'm gradually growing'. me = myself; le = him, Basilio: leísmo, Cervantes' use of 'le' for a male person as object where modern standard usage has 'lo' (here 'a él')."}
          - {w: "se casara", f: "cas- + -ara → casarse (to marry), imperfect subjunctive (-ra form), he, after 'quisiera que'. The -ra imperfect subjunctive of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran."}
          - {w: "hayan", f: "hay- + -an → haber (to have), present subjunctive, they, as a wish: 'may they have'. Here haber (to have) keeps its old meaning 'to possess'. haya, hayas, haya, hayamos, hayáis, hayan."}
          - {w: "iba a decir", f: "iba (ir (to go), imperfect, I: iba, ibas, iba, íbamos, ibais, iban) + a + decir (to say): 'I was going to say'."}
          - {w: "estorban", f: "estorb- + -an → estorbar (to prevent), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "se casen", f: "cas- + -en → casarse (to marry), present subjunctive, they, after 'estorban que' (prevent that). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "se quieren", f: "quier- + -en → quererse (to love each other), present, they; 'se' is reciprocal, 'each other'. quiero, quieres, quiere, queremos, queréis, quieren."}
        note: "Sancho blurts out a blessing on the people he means to curse, then corrects himself: 'buen siglo hayan' was said of the dead, so the slip is doubly comic."
  - sentences:
      - es: "— Si todos los que bien se quieren se hubiesen de casar —dijo don Quijote—, quitaríase la eleción y juridición a los padres de casar sus hijos con quien y cuando deben;"
        literal: "— If all those who well each-other love themselves had to marry —said Don Quijote—, would-be-taken-away the choice and jurisdiction from the parents of marrying their children with whom and when they-ought;"
