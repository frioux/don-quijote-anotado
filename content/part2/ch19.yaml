        note: "Sancho's 'friscal' is a slip for 'fiscal', the crown prosecutor, and so a fault-finder: Don Quijote is always prosecuting his words. The mistake proves Don Quijote's point and sets up the master's correction in the next line."
  - sentences:
      - es: "— Fiscal has de decir —dijo don Quijote—, que no friscal, prevaricador del buen lenguaje, que Dios te confunda."
        literal: "— Prosecutor you-have to say —said Don Quijote—, and not prosecutor-[garbled], perverter of-the good language, may God you confound."
        ormsby: "“Cavilling, not gravelling,” said Don Quixote, “thou prevaricator of honest language, God confound thee!”"
        vocab:
          - {w: "fiscal", d: "public prosecutor; figuratively a fault-finder"}
          - {w: "haber de", d: "to have to, must: 'has de decir' = you must say"}
          - {w: "que no", d: "here 'and not', 'rather than' (an emphatic 'que' before 'no')"}
          - {w: "prevaricador", d: "one who perverts or betrays a duty; here a corrupter of good speech (a lawyer's word, chosen to cap Sancho's 'fiscal')"}
          - {w: "que Dios te confunda", d: "God confound you!, a curse ('confundir' = to confound, destroy)"}
        diagram:
          - s: "Fiscal has de decir"
            r: "main verb: you must say 'fiscal'"
            under:
              - {s: "dijo don Quijote", r: "speaker: said Don Quijote"}
              - {s: "que no friscal", r: "contrast: not 'friscal'"}
              - {s: "prevaricador del buen lenguaje", r: "addressed: corrupter of good language"}
              - {s: "que Dios te confunda", r: "curse: may God confound you"}
        forms:
          - {w: "has de decir", f: "has → haber (to have), present, you (tú): he, has, ha, hemos, habéis, han; + de + decir (to say): 'haber de' + infinitive = must, ought to. 'You must say'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
          - {w: "buen", f: "bueno (good) clipped before a masculine singular noun ('lenguaje')."}
          - {w: "confunda", f: "confund- + -a → confundir (to confound), present subjunctive, he (God), in a wish after 'que'. The present subjunctive of -er and -ir verbs: -a, -as, -a, -amos, -áis, -an."}
        note: "Don Quijote corrects the malapropism and caps it with a learned legal word, 'prevaricador', so that both of them are now talking courtroom language. Corrections of Sancho's slips are a running joke of Part II."
  - sentences:
      - es: "— No se apunte vuestra merced conmigo —respondió Sancho—, pues sabe que no me he criado en la Corte, ni he estudiado en Salamanca, para saber si añado o quito alguna letra a mis vocablos."
        literal: "— Not yourself take-aim your grace with-me —answered Sancho—, since you-know that not myself I-have brought-up in the Court, nor I-have studied in Salamanca, in-order to-know if I-add or I-remove some letter to my words."
        ormsby: "“Don’t find fault with me, your worship,” returned Sancho, “for you know I have not been bred up at court or trained at Salamanca, to know whether I am adding or dropping a letter or so in my words."
        vocab:
          - {w: "apuntarse con", d: "to pick on, find fault with (Ormsby: 'find fault with'); the exact sense of this phrase is uncertain"}
          - {w: "conmigo", d: "with me"}
          - {w: "criarse", d: "to be brought up, raised"}
          - {w: "la Corte", d: "the royal court, i.e. Madrid (or wherever the king resided), the model of fine speech"}
          - {w: "Salamanca", d: "the oldest and most famous Spanish university"}
          - {w: "vocablo", d: "word, term"}
        diagram:
          - s: "No se apunte"
            r: "main verb: do not pick on [me]"
            under:
              - {s: "vuestra merced", r: "subject: your worship"}
              - {s: "conmigo", r: "with whom: with me"}
              - {s: "respondió Sancho", r: "speaker: answered Sancho"}
              - s: "pues sabe"
                r: "why: since you know"
                under:
                  - s: "que no me he criado en la Corte, ni he estudiado en Salamanca"
                    r: "what you know: that I was not raised at court nor studied at Salamanca"
                    under:
                      - {s: "para saber si añado o quito alguna letra a mis vocablos", r: "purpose: so as to know whether I add or drop a letter in my words"}
        forms:
          - {w: "No se apunte", f: "apunt- + -e → apuntarse (to pick on), present subjunctive, he/she ('vuestra merced' takes the 'he/she' form), with 'se': a negative polite command. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "sabe", f: "sab- + -e → saber (to know), present, you ('vuestra merced', with the 'he/she' form). Irregular in the 'I' form: sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "me he criado", f: "he → haber (to have), present, I: he, has, ha, hemos, habéis, han; + criado, participle of criarse (to be brought up), with 'me': 'I have been brought up'."}
          - {w: "he estudiado", f: "he → haber (to have), present, I (same forms: he, has, ha, hemos, habéis, han) + estudiado, participle of estudiar (to study): 'I have studied'."}
          - {w: "añado, quito", f: "añad- + -o → añadir (to add), present, I: añado, añades, añade, añadimos, añadís, añaden. quit- + -o → quitar (to take away), present, I: quito, quitas, quita, quitamos, quitáis, quitan."}
          - {w: "alguna", f: "algun- + -a → alguno (some, any), feminine to match 'letra'."}
        note: "Sancho's slip did indeed add a letter: 'friscal' for 'fiscal'. His excuse is that he was not raised at court nor educated at Salamanca, the two places where correct Castilian was supposed to be learnt."
      - es: "Sí, que, ¡válgame Dios!, no hay para qué obligar al sayagués a que hable como el toledano, y toledanos puede haber que no las corten en el aire en esto del hablar polido."
        literal: "Yes, for, may-God-help-me God!, not there-is for what to-oblige the Sayago-man to that he-may-speak like the Toledan, and Toledans there-can be who not them may-cut in the air in this of-the speaking polished."
        ormsby: "Why! God bless me, it’s not fair to force a Sayago-man to speak like a Toledan; maybe there are Toledans who do not hit it off when it comes to polished talk.”"
        vocab:
          - {w: "¡válgame Dios!", d: "God help me!, good heavens! ('valer' = to help, protect)"}
          - {w: "no hay para qué", d: "there is no reason to, there's no call to"}
          - {w: "sayagués", d: "a man from Sayago, a rustic district near Zamora whose dialect stood for clumsy peasant speech on the stage"}
          - {w: "toledano", d: "a man from Toledo, whose Castilian was taken as the standard of good speech"}
          - {w: "cortarlas en el aire", d: "to be very sharp and quick, to split hairs in mid-air (as a fine blade cuts something falling); here, to be perfect"}
          - {w: "polido", d: "= pulido, polished, refined (old form)"}
          - {w: "esto del hablar", d: "this business of speaking, the matter of speech"}
        diagram:
          - {s: "¡válgame Dios!", r: "exclamation: God help me"}
          - s: "no hay para qué"
            r: "main verb 1 (after 'Sí, que'): there is no reason"
            under:
              - s: "obligar al sayagués"
                r: "what there is no reason for: to force the Sayago man"
                under:
                  - {s: "a que hable como el toledano", r: "to what: to speak like the Toledan"}
          - s: "toledanos puede haber"
            r: "main verb 2 (after 'y'): there may be Toledans"
            under:
              - s: "que no las corten en el aire"
                r: "describes 'toledanos': who are not so sharp"
                under:
                  - {s: "en esto del hablar polido", r: "in what: in this matter of polished speech"}
        forms:
          - {w: "válgame", f: "valg- + -a + me → valer (to help, protect), present subjunctive, he (God), with 'me' stuck on the end: 'may God help me'. valer in the present subjunctive: valga, valgas, valga, valgamos, valgáis, valgan. A wish opening the clause hangs its pronoun on the end."}
          - {w: "hay", f: "the special 'there is' form of haber (to have): 'no hay para qué' = there is no reason to."}
          - {w: "al", f: "a + el, the contraction modern Spanish still makes; the 'a' marks a person as object."}
          - {w: "hable", f: "habl- + -e → hablar (to speak), present subjunctive, he, after 'obligar a que' (force to). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "puede haber", f: "pued- + -e → poder (to be able), present, it: puedo, puedes, puede, podemos, podéis, pueden; + haber (to have) in its 'there is' sense: 'there can be'. It stays singular even with a plural noun ('toledanos')."}
          - {w: "corten", f: "cort- + -en → cortar (to cut), present subjunctive, they (the Toledans), because the people may not exist ('there may be some who'). Same -e subjunctive: corte, cortes, corte, cortemos, cortéis, corten."}
          - {w: "las", f: "'them', feminine plural with no clear noun: a fixed part of the idiom 'cortarlas en el aire'."}
          - {w: "del hablar", f: "de + el + hablar: an infinitive used as a noun with the article, 'the speaking'."}
        ormsby_note: "Sayago, a district between Zamora and the Portuguese frontier. From the time of Alfonso X the Castilian of Toledo was always regarded as the standard."
  - sentences:
      - es: "— Así es —dijo el licenciado—, porque no pueden hablar tan bien los que se crían en las Tenerías y en Zocodover como los que se pasean casi todo el día por el claustro de la Iglesia Mayor, y todos son toledanos."
        literal: "— So it-is —said the licentiate—, because not can speak so well those who themselves are-raised in the Tanneries and in Zocodover as those who themselves stroll almost all the day through the cloister of the Church Greater, and all are Toledans."
        ormsby: "“That is true,” said the licentiate, “for those who have been bred up in the Tanneries and the Zocodover cannot talk like those who are almost all day pacing the cathedral cloisters, and yet they are all Toledans."
        vocab:
          - {w: "así es", d: "that's so, quite right"}
          - {w: "licenciado", d: "licentiate, holder of a university degree above bachelor; a polite title for a graduate"}
          - {w: "Tenerías", d: "the Tanneries, the tanners' quarter of Toledo, by the river: a rough working district"}
          - {w: "Zocodover", d: "the main square and market place of Toledo, full of traders and low company"}
          - {w: "pasearse", d: "to stroll, walk up and down"}
          - {w: "claustro", d: "cloister"}
          - {w: "Iglesia Mayor", d: "the main church, here Toledo cathedral, where clergy and educated men strolled"}
        diagram:
          - {s: "Así es", r: "main verb 1: so it is"}
          - {s: "dijo el licenciado", r: "speaker: said the licentiate"}
          - s: "porque no pueden hablar tan bien"
            r: "why: because they cannot speak as well"
            under:
              - {s: "los que se crían en las Tenerías y en Zocodover", r: "subject: those raised in the Tanneries and Zocodover"}
              - {s: "como los que se pasean casi todo el día por el claustro de la Iglesia Mayor", r: "compared with: as those who walk all day in the cathedral cloister"}
          - {s: "y todos son toledanos", r: "main verb 2: and all are Toledans"}
        forms:
          - {w: "pueden", f: "pued- + -en → poder (to be able), present, they. The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "se crían", f: "crí- + -an → criarse (to be raised), present, they, with 'se'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an (here crío, crías, cría, criamos, criáis, crían, with an accent on the í)."}
          - {w: "se pasean", f: "pase- + -an → pasearse (to stroll), present, they, with 'se'. Same -ar present: paseo, paseas, pasea, paseamos, paseáis, pasean."}
          - {w: "tan ... como", f: "'as ... as': 'tan bien como' = as well as. The comparison is split by the long subject."}
          - {w: "son", f: "ser (to be), present, they: soy, eres, es, somos, sois, son."}
        ormsby_note: "The Zocodover, the chief plaza of Toledo, and the Sok, or marketplace, in the time of the Moors. The cathedral cloisters are to this day a favourite lounge in that sunbaked city."
      - es: "El lenguaje puro, el propio, el elegante y claro, está en los discretos cortesanos, aunque hayan nacido en Majalahonda: dije discretos porque hay muchos que no lo son, y la discreción es la gramática del buen lenguaje, que se acompaña con el uso."
        literal: "The language pure, the proper, the elegant and clear, is in the discreet courtiers, although they-may-have born in Majalahonda: I-said discreet because there-are many who not it are, and the discretion is the grammar of-the good language, which itself accompanies with the usage."
        ormsby: "Pure, correct, elegant and lucid language will be met with in men of courtly breeding and discrimination, though they may have been born in Majalahonda; I say of discrimination, because there are many who are not so, and discrimination is the grammar of good language, if it be accompanied by practice."
        vocab:
          - {w: "propio", d: "proper, correct (of words: used in their true sense)"}
          - {w: "discreto", d: "false friend: wise, sensible, judicious (not 'discreet')"}
          - {w: "cortesano", d: "courtier, man of the court; also courtly, refined"}
          - {w: "Majalahonda", d: "= Majadahonda, a small village near Madrid"}
          - {w: "discreción", d: "good judgement, discernment (not 'discretion')"}
          - {w: "uso", d: "usage, practice: the way words are actually used"}
        diagram:
          - s: "El lenguaje puro, el propio, el elegante y claro, está"
            r: "main verb 1: pure, proper, elegant and clear language is"
            under:
              - {s: "en los discretos cortesanos", r: "where: in wise courtiers"}
              - {s: "aunque hayan nacido en Majalahonda", r: "concession: even if born in Majalahonda"}
          - s: "dije discretos"
            r: "main verb 2: I said 'wise'"
            under:
              - {s: "porque hay muchos que no lo son", r: "why: because many are not"}
          - s: "y la discreción es la gramática del buen lenguaje"
            r: "main verb 3: and judgement is the grammar of good language"
            under:
              - {s: "que se acompaña con el uso", r: "describes 'discreción': which goes together with usage"}
        forms:
          - {w: "está", f: "est- + -á → estar (to be), present, it (the language): estoy, estás, está, estamos, estáis, están. 'estar en' = to be found in."}
          - {w: "hayan nacido", f: "hay- + -an → haber (to have), present subjunctive, they: haya, hayas, haya, hayamos, hayáis, hayan; + nacido, participle of nacer (to be born): 'may have been born'. Subjunctive after 'aunque' for a supposition."}
          - {w: "dije", f: "dij- + -e → decir (to say), preterite, I. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "lo son", f: "son → ser (to be), present, they: soy, eres, es, somos, sois, son; 'lo' stands for the adjective 'discretos': 'are not [so]'."}
          - {w: "se acompaña", f: "acompañ- + -a → acompañarse (to be accompanied), present, it, with 'se'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "buen", f: "bueno (good) clipped before a masculine singular noun ('lenguaje')."}
        ormsby_note: "Majalahonda (properly Majadahonda), a small village a couple of leagues to the northwest of Madrid."
        note: "The licentiate's point is that good Spanish is a matter of judgement and practice, not birthplace. It echoes Cervantes' own views on language, though putting them in the mouth of a fencing student is part of the comedy."
      - es: "Yo, señores, por mis pecados, he estudiado Cánones en Salamanca, y pícome algún tanto de decir mi razón con palabras claras, llanas y significantes."
