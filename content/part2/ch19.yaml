part: 2
chapter: 19
title_es: "Capítulo XIX. Donde se cuenta la aventura del pastor enamorado, con otros en verdad graciosos sucesos"
title_en: "In which is related the adventure of the enamoured shepherd, together with other truly droll incidents"
paragraphs:
  - sentences:
      - es: "Poco trecho se había alongado don Quijote del lugar de don Diego, cuando encontró con dos como clérigos o como estudiantes y con dos labradores que sobre cuatro bestias asnales venían caballeros."
        literal: "Little distance himself had distanced Don Quijote from-the village of Don Diego, when he-met with two like clerics or like students and with two farm-labourers who upon four beasts asinine came mounted."
        ormsby: "Don Quixote had gone but a short distance beyond Don Diego’s village, when he fell in with a couple of either priests or students, and a couple of peasants, mounted on four beasts of the ass kind."
        vocab:
          - {w: "trecho", d: "stretch, distance; 'poco trecho' = a short way"}
          - {w: "alongarse", d: "= alejarse, to move away, get some distance off (archaic)"}
          - {w: "lugar", d: "village, small town (its usual sense in Cervantes), not just 'place'"}
          - {w: "encontrar con", d: "to come upon, run into (someone)"}
          - {w: "como clérigos o como estudiantes", d: "men who looked like clerics or students: students wore long dark gowns much like a cleric's, so the two were hard to tell apart"}
          - {w: "labrador", d: "farmer, peasant who works the land"}
          - {w: "bestias asnales", d: "beasts of the ass kind, i.e. donkeys; 'asnal' = asinine, of an ass (a mock-formal phrase)"}
          - {w: "venir caballero", d: "to ride, come mounted; 'caballero' here is the adjective 'riding', not 'knight'"}
        diagram:
          - s: "se había alongado"
            r: "main verb: had gone away"
            under:
              - {s: "Poco trecho", r: "how far: a short distance"}
              - {s: "don Quijote", r: "subject: who had gone"}
              - {s: "del lugar de don Diego", r: "from where: from Don Diego's village"}
              - s: "cuando encontró"
                r: "when: when he came upon"
                under:
                  - {s: "con dos como clérigos o como estudiantes", r: "whom he met, 1: two men like clerics or students"}
                  - s: "y con dos labradores"
                    r: "whom he met, 2: and two farmers"
                    under:
                      - {s: "que sobre cuatro bestias asnales venían caballeros", r: "describes all four: who came riding on four donkeys"}
        forms:
          - {w: "se había alongado", f: "hab- + -ía → haber (to have), imperfect, he, + alongado, the participle of alongarse (to move away), with 'se': the pluperfect, 'had moved away'. haber (to have) in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "del", f: "de + el, 'from the', the contraction modern Spanish still makes."}
          - {w: "encontró", f: "encontr- + -ó → encontrar (to meet), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "asnales", f: "asnal (asinine) + -es, plural to match 'bestias'; adjectives ending in a consonant add -es."}
          - {w: "venían", f: "ven- + -ían → venir (to come), imperfect, they: 'were coming'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "caballeros", f: "caballero (riding, mounted) + -s, plural to match 'que' (the four travellers); an adjective describing the subject after 'venían'."}
        note: "The chapter opens just after Don Quijote has left the house of Don Diego de Miranda, the Knight of the Green Coat, at the end of the previous chapter. Riding on donkeys marks the travellers as humble folk: students and peasants could not afford horses."
      - es: "El uno de los estudiantes traía, como en portamanteo, en un lienzo de bocací verde envuelto, al parecer, un poco de grana blanca y dos pares de medias de cordellate; el otro no traía otra cosa que dos espadas negras de esgrima, nuevas, y con sus zapatillas."
        literal: "The one of the students carried, as in portmanteau, in a cloth of buckram green wrapped, to-the seeming, a little of fine-cloth white and two pairs of stockings of ribbed-wool; the other not carried other thing than two swords black of fencing, new, and with their buttons."
        ormsby: "One of the students carried, wrapped up in a piece of green buckram by way of a portmanteau, what seemed to be a little linen and a couple of pairs of ribbed stockings; the other carried nothing but a pair of new fencing-foils with buttons."
        vocab:
          - {w: "portamanteo", d: "portmanteau, travelling bag (from French 'portemanteau')"}
          - {w: "lienzo", d: "piece of cloth, a length of linen"}
          - {w: "bocací", d: "buckram, a coarse stiffened cloth, here dyed green"}
          - {w: "al parecer", d: "apparently, as it seemed"}
          - {w: "grana", d: "fine woollen cloth, usually the costly scarlet kind; 'grana blanca' seems to mean a fine white cloth (Ormsby: 'a little linen')"}
          - {w: "medias", d: "stockings (not 'half')"}
          - {w: "cordellate", d: "a coarse ribbed woollen cloth"}
          - {w: "no ... otra cosa que", d: "nothing but, nothing other than"}
          - {w: "espadas negras", d: "practice swords, fencing foils: 'black' because of plain unpolished iron with blunt edges, as against the bright 'espadas blancas' of real fighting"}
          - {w: "esgrima", d: "fencing, swordsmanship"}
          - {w: "zapatilla", d: "the leather button on the point of a fencing foil (literally 'little shoe, slipper')"}
        diagram:
          - s: "El uno de los estudiantes traía"
            r: "main clause 1: one of the students carried"
            under:
              - {s: "como en portamanteo", r: "how: as if in a travelling bag"}
              - {s: "en un lienzo de bocací verde envuelto", r: "how: wrapped in a piece of green buckram"}
              - {s: "al parecer", r: "aside: as it seemed"}
              - {s: "un poco de grana blanca y dos pares de medias de cordellate", r: "object: some fine white cloth and two pairs of woollen stockings"}
          - s: "el otro no traía"
            r: "main clause 2: the other carried nothing"
            under:
              - s: "otra cosa que dos espadas negras de esgrima"
                r: "object: nothing but two fencing foils"
                under:
                  - {s: "nuevas, y con sus zapatillas", r: "describes 'espadas': new, and with their buttons"}
        forms:
          - {w: "traía", f: "tra- + -ía → traer (to bring, carry), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían (traer adds no extra letters here: traía, traías, traía, traíamos, traíais, traían)."}
          - {w: "envuelto", f: "irregular participle of envolver (to wrap), masculine to match 'un poco de grana' (the thing wrapped); it stands at the end of its phrase, Latin-fashion: 'in a cloth of green buckram wrapped'."}
          - {w: "nuevas", f: "nuev- + -as → nuevo (new), feminine plural to match 'espadas'."}
          - {w: "sus zapatillas", f: "sus = plural to match 'zapatillas', not the owner; 'their buttons', i.e. the swords' buttons."}
        note: "A student going home with a pair of foils was typical: fencing was taught at the universities and the 'destreza' (scientific swordsmanship) was a fashionable study. The foils will be used later in this chapter."
      - es: "Los labradores traían otras cosas, que daban indicio y señal que venían de alguna villa grande, donde las habían comprado, y las llevaban a su aldea;"
        literal: "The farm-labourers carried other things, which gave indication and sign that they-came from some town large, where them they-had bought, and them they-were-taking to their village;"
        ormsby: "The peasants carried divers articles that showed they were on their way from some large town where they had bought them, and were taking them home to their village;"
        vocab:
          - {w: "indicio", d: "indication, sign; 'dar indicio y señal' = to show clearly (a legal-sounding doublet)"}
          - {w: "villa", d: "town (bigger than an 'aldea', often with a charter), not a country house"}
          - {w: "aldea", d: "village, hamlet"}
        diagram:
          - s: "Los labradores traían otras cosas"
            r: "main clause: the farmers carried other things"
            under:
              - s: "que daban indicio y señal"
                r: "describes 'cosas': which showed clearly"
                under:
                  - s: "que venían de alguna villa grande"
                    r: "what they showed: that the farmers were coming from some big town"
                    under:
                      - {s: "donde las habían comprado", r: "describes 'villa': where they had bought them"}
                  - {s: "y las llevaban a su aldea", r: "what they showed, 2: and were taking them to their village"}
        forms:
          - {w: "traían", f: "tra- + -ían → traer (to carry), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "daban", f: "d- + -aban → dar (to give), imperfect, they (the things). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "señal que", f: "'sign that': Cervantes leaves out the 'de' that modern Spanish puts before 'que' after a noun ('señal de que')."}
          - {w: "venían", f: "ven- + -ían → venir (to come), imperfect, they. Same -ía imperfect as 'traían'."}
          - {w: "las habían comprado", f: "hab- + -ían → haber (to have), imperfect, they, + comprado, the participle of comprar (to buy): the pluperfect, 'had bought'. haber (to have) in the imperfect: había, habías, había, habíamos, habíais, habían. 'las' = them, feminine to match 'cosas'."}
          - {w: "llevaban", f: "llev- + -aban → llevar (to take, carry), imperfect, they. Same -aba imperfect as 'daban'."}
          - {w: "alguna", f: "algun- + -a → alguno (some), feminine to match 'villa'."}
      - es: "y así estudiantes como labradores cayeron en la misma admiración en que caían todos aquellos que la vez primera veían a don Quijote, y morían por saber qué hombre fuese aquél tan fuera del uso de los otros hombres."
        literal: "and thus students as farm-labourers fell into the same amazement in which fell all those who the time first saw [to] Don Quijote, and were-dying for to-know what man might-be that-one so outside of-the usage of the other men."
        ormsby: "and both students and peasants were struck with the same amazement that everybody felt who saw Don Quixote for the first time, and were dying to know who this man, so different from ordinary men, could be."
        vocab:
          - {w: "así ... como", d: "both ... and; 'así estudiantes como labradores' = students and peasants alike"}
          - {w: "caer en admiración", d: "to be struck with wonder, astonishment ('admiración' = amazement, not 'admiration', a false friend)"}
          - {w: "la vez primera", d: "the first time (modern 'la primera vez')"}
          - {w: "morir por", d: "to be dying to, long to"}
          - {w: "fuera del uso de", d: "out of the usual run of, unlike"}
        diagram:
          - s: "cayeron"
            r: "main verb 1: fell (into amazement)"
            under:
              - {s: "así estudiantes como labradores", r: "subject: students and peasants alike"}
              - s: "en la misma admiración"
                r: "into what: into the same amazement"
                under:
                  - s: "en que caían todos aquellos"
                    r: "describes 'admiración': into which all those fell"
                    under:
                      - {s: "que la vez primera veían a don Quijote", r: "describes 'aquellos': who saw Don Quijote for the first time"}
          - s: "y morían"
            r: "main verb 2: and they were dying"
            under:
              - s: "por saber"
                r: "for what: to know"
                under:
                  - {s: "qué hombre fuese aquél", r: "what they wanted to know: what man that was"}
                  - {s: "tan fuera del uso de los otros hombres", r: "describes 'aquél': so unlike other men"}
        forms:
          - {w: "cayeron", f: "caye- + -ron → caer (to fall), preterite, they. Irregular, i becomes y between vowels: caí, caíste, cayó, caímos, caísteis, cayeron."}
          - {w: "caían", f: "ca- + -ían → caer (to fall), imperfect, they: 'used to fall', what always happened. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "veían", f: "ve- + -ían → ver (to see), imperfect, they. ver (to see) keeps its e: veía, veías, veía, veíamos, veíais, veían."}
          - {w: "a don Quijote", f: "personal 'a': Spanish puts 'a' before a person who is the object of a verb."}
          - {w: "morían", f: "mor- + -ían → morir (to die), imperfect, they. Same -ía imperfect: moría, morías, moría, moríamos, moríais, morían."}
          - {w: "fuese", f: "fu- + -ese → ser (to be), imperfect subjunctive (-se form), it: 'what man that might be'. ser (to be): fuese, fueses, fuese, fuésemos, fueseis, fuesen. Cervantes often puts an indirect question after a past verb into the subjunctive; modern Spanish says 'qué hombre era'."}
          - {w: "aquél", f: "demonstrative 'that one', masculine to match 'hombre'; the accent marks it as a pronoun standing alone."}
  - sentences:
      - es: "Saludóles don Quijote, y, después de saber el camino que llevaban, que era el mesmo que él hacía, les ofreció su compañía, y les pidió detuviesen el paso, porque caminaban más sus pollinas que su caballo;"
        literal: "Greeted-them Don Quijote, and, after of learning the road that they-were-taking, which was the same that he was-making, to-them he-offered his company, and them he-asked [that] they-might-hold-back the pace, because travelled more their she-asses than his horse;"
        ormsby: "Don Quixote saluted them, and after ascertaining that their road was the same as his, made them an offer of his company, and begged them to slacken their pace, as their young asses travelled faster than his horse;"
        vocab:
          - {w: "saber", d: "here 'to find out, learn', not just 'to know'"}
          - {w: "llevar camino", d: "to be going a certain way, follow a road"}
          - {w: "mesmo", d: "= mismo, same (old form)"}
          - {w: "hacer camino", d: "to travel a road, be on one's way"}
          - {w: "detener el paso", d: "to slow down, check one's pace"}
          - {w: "pollina", d: "young she-ass, female donkey foal"}
        diagram:
          - s: "Saludóles"
            r: "main verb 1: greeted them"
            under:
              - {s: "don Quijote", r: "subject: who greeted"}
          - s: "les ofreció su compañía"
            r: "main verb 2 (after 'y'): offered them his company"
            under:
              - s: "después de saber el camino"
                r: "when: after learning the road"
                under:
                  - {s: "que llevaban", r: "describes 'camino': that they were taking"}
                  - {s: "que era el mesmo que él hacía", r: "describes 'camino': which was the same he was travelling"}
          - s: "y les pidió"
            r: "main verb 3: and asked them"
            under:
              - {s: "detuviesen el paso", r: "what he asked: that they slow down"}
              - {s: "porque caminaban más sus pollinas que su caballo", r: "why: because their donkeys went faster than his horse"}
        forms:
          - {w: "Saludóles", f: "salud- + -ó + les → saludar (to greet), preterite, he, with 'les' (them) stuck on the end; modern 'les saludó'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. Cervantes hangs the pronoun on a verb that opens the sentence."}
          - {w: "llevaban", f: "llev- + -aban → llevar (to take, follow), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "era", f: "ser (to be), imperfect, it. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "hacía", f: "hac- + -ía → hacer (to make, travel), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "ofreció", f: "ofrec- + -ió → ofrecer (to offer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "pidió", f: "pid- + -ió → pedir (to ask for), preterite, he; the e of the stem becomes i in this form: pedí, pediste, pidió, pedimos, pedisteis, pidieron."}
          - {w: "detuviesen", f: "detuv- + -iesen → detener (to hold back), imperfect subjunctive (-se form), they, built on the preterite detuvieron: detuviese, detuvieses, detuviese, detuviésemos, detuvieseis, detuviesen. Subjunctive after 'pidió' (asked); Cervantes drops the 'que' that modern Spanish needs ('les pidió que detuviesen')."}
          - {w: "caminaban", f: "camin- + -aban → caminar (to travel, walk), imperfect, they. Same -aba imperfect as 'llevaban'. The subject 'sus pollinas' follows the verb."}
          - {w: "sus pollinas", f: "sus = plural to match 'pollinas', not the owners; 'their she-asses'. pollin- + -a, feminine of pollino (young ass)."}
        note: "The joke is on Rocinante: the travellers' young donkeys are faster than the knight's famously slow, bony horse."
      - es: "y, para obligarlos, en breves razones les dijo quién era, y su oficio y profesión, que era de caballero andante que iba a buscar las aventuras por todas las partes del mundo."
        literal: "and, to oblige-them, in brief words to-them he-said who he-was, and his occupation and profession, which was of knight errant who was-going to seek the adventures through all the parts of-the world."
        ormsby: "and then, to gratify them, he told them in a few words who he was and the calling and profession he followed, which was that of a knight-errant seeking adventures in all parts of the world."
        vocab:
          - {w: "obligar", d: "to win over, put under an obligation by courtesy (not 'to force' here)"}
          - {w: "razones", d: "words, remarks (a false friend: not 'reasons'); 'en breves razones' = in a few words"}
          - {w: "oficio", d: "calling, occupation, trade"}
          - {w: "caballero andante", d: "knight-errant, a knight who wanders in search of adventures"}
        diagram:
          - s: "les dijo"
            r: "main verb: he told them"
            under:
              - {s: "para obligarlos", r: "why: to win them over"}
              - {s: "en breves razones", r: "how: in a few words"}
              - {s: "quién era", r: "what he told, 1: who he was"}
              - s: "y su oficio y profesión"
                r: "what he told, 2: and his calling and profession"
                under:
                  - s: "que era de caballero andante"
                    r: "describes 'oficio': which was that of a knight-errant"
                    under:
                      - {s: "que iba a buscar las aventuras por todas las partes del mundo", r: "describes 'caballero': who went seeking adventures all over the world"}
        forms:
          - {w: "obligarlos", f: "obligar (to oblige, win over) + los (them), the pronoun hung on the infinitive after 'para'."}
          - {w: "breves", f: "breve (brief) + -s, plural to match 'razones'."}
          - {w: "dijo", f: "dij- + -o → decir (to say, tell), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "quién era", f: "quién (who), with its accent because it asks an indirect question; era → ser (to be), imperfect, he: era, eras, era, éramos, erais, eran."}
          - {w: "iba a buscar", f: "iba → ir (to go), imperfect, he: iba, ibas, iba, íbamos, ibais, iban; + a + buscar (to seek): 'went about seeking'."}
      - es: "Díjoles que se llamaba de nombre propio don Quijote de la Mancha, y por el apelativo, el Caballero de los Leones."
        literal: "He-told-them that himself he-called by name own Don Quijote de la Mancha, and by the byname, the Knight of the Lions."
        ormsby: "He informed them that his own name was Don Quixote of La Mancha, and that he was called, by way of surname, the Knight of the Lions."
        vocab:
          - {w: "de nombre propio", d: "by his own (proper) name, his given name"}
          - {w: "apelativo", d: "byname, title, surname: here his knightly title"}
          - {w: "el Caballero de los Leones", d: "the Knight of the Lions, the title Don Quijote took after facing the lions in Chapter XVII, replacing 'the Knight of the Rueful Countenance'"}
        diagram:
          - s: "Díjoles"
            r: "main verb: he told them"
            under:
              - s: "que se llamaba"
                r: "what he told: that he was called"
                under:
                  - {s: "de nombre propio don Quijote de la Mancha", r: "by his own name: Don Quijote de la Mancha"}
                  - {s: "y por el apelativo, el Caballero de los Leones", r: "by his title: the Knight of the Lions"}
        forms:
          - {w: "Díjoles", f: "dij- + -o + les → decir (to tell), preterite, he, with 'les' (them) stuck on the end; modern 'les dijo'. decir (to say) in the preterite: dije, dijiste, dijo, dijimos, dijisteis, dijeron. Cervantes hangs the pronoun on a verb that opens the sentence; the accent is added to keep the stress."}
          - {w: "se llamaba", f: "llam- + -aba → llamarse (to be called), imperfect, he, with 'se': 'he called himself'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "Leones", f: "león (lion) + -es, plural; the accent drops because the stress now falls on the second-to-last syllable."}
      - es: "Todo esto para los labradores era hablarles en griego o en jerigonza, pero no para los estudiantes, que luego entendieron la flaqueza del celebro de don Quijote; pero, con todo eso, le miraban con admiración y con respecto, y uno dellos le dijo:"
        literal: "All this for the farm-labourers was to-speak-to-them in Greek or in gibberish, but not for the students, who at-once understood the weakness of-the brain of Don Quijote; but, with all that, him they-looked-at with wonder and with respect, and one of-them to-him said:"
        ormsby: "All this was Greek or gibberish to the peasants, but not so to the students, who very soon perceived the crack in Don Quixote’s pate; for all that, however, they regarded him with admiration and respect, and one of them said to him,"
        vocab:
          - {w: "hablar en griego", d: "to talk Greek, be unintelligible (as in English 'it's all Greek to me')"}
          - {w: "jerigonza", d: "gibberish, jargon, thieves' cant"}
          - {w: "luego", d: "at once, straight away (its usual sense then), not 'later'"}
          - {w: "flaqueza", d: "weakness, frailty"}
          - {w: "celebro", d: "= cerebro, brain (old form)"}
          - {w: "con todo eso", d: "for all that, nevertheless"}
          - {w: "admiración", d: "wonder, astonishment (false friend)"}
          - {w: "respecto", d: "= respeto, respect (old spelling)"}
          - {w: "dellos", d: "= de ellos, of them (old contraction)"}
        diagram:
          - s: "Todo esto para los labradores era"
            r: "main clause 1: all this, for the peasants, was"
            under:
              - {s: "hablarles en griego o en jerigonza", r: "what it was: talking Greek or gibberish to them"}
              - s: "pero no para los estudiantes"
                r: "contrast: but not for the students"
                under:
                  - {s: "que luego entendieron la flaqueza del celebro de don Quijote", r: "describes 'estudiantes': who at once saw his brain was weak"}
          - s: "le miraban"
            r: "main clause 2 (after 'pero'): they looked at him"
            under:
              - {s: "con todo eso", r: "concession: for all that"}
              - {s: "con admiración y con respecto", r: "how: with wonder and respect"}
          - s: "y uno dellos le dijo:"
            r: "main clause 3: and one of them said to him"
        forms:
          - {w: "era", f: "ser (to be), imperfect, it. Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "hablarles", f: "hablar (to speak) + les (to them), the pronoun hung on the infinitive; the infinitive is the subject complement of 'era'."}
          - {w: "entendieron", f: "entend- + -ieron → entender (to understand, perceive), preterite, they. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "celebro", f: "old form of cerebro (brain), with l for the first r."}
          - {w: "miraban", f: "mir- + -aban → mirar (to look at), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "dellos", f: "= de + ellos, 'of them', the old contraction."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Si vuestra merced, señor caballero, no lleva camino determinado, como no le suelen llevar los que buscan las aventuras, vuesa merced se venga con nosotros:"
        literal: "— If your grace, sir knight, not takes road fixed, as not it are-wont to-take those who seek the adventures, your grace himself may-come with us:"
        ormsby: "“If you, sir knight, have no fixed road, as it is the way with those who seek adventures not to have any, let your worship come with us;"
        vocab:
          - {w: "vuestra merced / vuesa merced", d: "your grace, your worship: the polite 'you', taking a third-person verb (modern 'usted' comes from it); 'vuesa' is a worn-down form of 'vuestra'"}
          - {w: "llevar camino determinado", d: "to have a fixed route, be bound for a particular place"}
          - {w: "soler", d: "to be in the habit of; 'no le suelen llevar' = they don't usually have one"}
        diagram:
          - s: "vuesa merced se venga con nosotros:"
            r: "main verb: may your worship come with us"
            under:
              - s: "Si vuestra merced, señor caballero, no lleva camino determinado"
                r: "condition: if you have no fixed road"
                under:
                  - s: "como no le suelen llevar"
                    r: "comparison: as they usually don't have one"
                    under:
                      - {s: "los que buscan las aventuras", r: "subject of 'suelen': those who seek adventures"}
        forms:
          - {w: "lleva", f: "llev- + -a → llevar (to take, follow), present, you (vuestra merced takes the 'he/she' form). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "determinado", f: "participle of determinar (to fix, decide), used as an adjective, masculine to match 'camino'."}
          - {w: "le", f: "'it', standing for 'camino': leísmo, the use of 'le' where modern Spanish prefers 'lo' for a masculine thing or person as direct object; common in Cervantes."}
          - {w: "suelen", f: "suel- + -en → soler (to be in the habit of), present, they. The stem o becomes ue when stressed: suelo, sueles, suele, solemos, soléis, suelen. Always followed by an infinitive ('suelen llevar')."}
          - {w: "buscan", f: "busc- + -an → buscar (to seek), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "se venga", f: "veng- + -a → venirse (to come along), present subjunctive, you (vuesa merced, so the 'he' form), with 'se': a polite request, 'do come'. venir (to come) in the present subjunctive: venga, vengas, venga, vengamos, vengáis, vengan."}
      - es: "verá una de las mejores bodas y más ricas que hasta el día de hoy se habrán celebrado en la Mancha, ni en otras muchas leguas a la redonda."
        literal: "you-will-see one of the best weddings and most rich that until the day of today themselves will-have celebrated in La Mancha, nor in other many leagues round about."
        ormsby: "you will see one of the finest and richest weddings that up to this day have ever been celebrated in La Mancha, or for many a league round.”"
        vocab:
          - {w: "bodas", d: "wedding, wedding festivities (often plural for one wedding)"}
          - {w: "hasta el día de hoy", d: "up to this very day"}
          - {w: "legua", d: "league, about five and a half kilometres, roughly an hour's walk"}
          - {w: "a la redonda", d: "round about, in the surrounding area"}
        diagram:
          - s: "verá"
            r: "main verb (continuing 'se venga'): you will see"
            under:
              - s: "una de las mejores bodas y más ricas"
                r: "object: one of the best and richest weddings"
                under:
                  - {s: "que hasta el día de hoy se habrán celebrado en la Mancha", r: "describes 'bodas': that have been held in La Mancha up to this day"}
                  - {s: "ni en otras muchas leguas a la redonda", r: "where, 2: nor for many leagues round about"}
        forms:
          - {w: "verá", f: "ver- + -á → ver (to see), future, you (vuesa merced, so the 'he' form). The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "mejores", f: "mejor (better, best) + -es, plural to match 'bodas'; the irregular comparative of bueno (good)."}
          - {w: "más ricas", f: "rico (rich) made feminine plural to match 'bodas', with 'más' for 'most'; it is split from 'mejores' by the noun, as Cervantes likes."}
          - {w: "se habrán celebrado", f: "habr- + -án → haber (to have), future, they, + celebrado, participle of celebrar (to celebrate), with passive 'se': the future perfect, 'will have been held', used for a guess about the past ('have ever been held'). haber (to have) in the future: habré, habrás, habrá, habremos, habréis, habrán."}
          - {w: "ni", f: "'nor': after a superlative ('the best ... that') Spanish treats the comparison as negative and uses 'ni' where English says 'or'."}
  - sentences:
      - es: "Preguntóle don Quijote si eran de algún príncipe, que así las ponderaba."
        literal: "Asked-him Don Quijote if they-were of some prince, since thus them he-was-extolling."
        ormsby: "Don Quixote asked him if it was some prince’s, that he spoke of it in this way."
        vocab:
          - {w: "ponderar", d: "to extol, praise highly, make much of (also 'to weigh, consider')"}
          - {w: "que", d: "here 'since, seeing that', giving the reason for the question"}
        diagram:
          - s: "Preguntóle"
            r: "main verb: asked him"
            under:
              - {s: "don Quijote", r: "subject: who asked"}
              - s: "si eran de algún príncipe"
                r: "what he asked: whether they (the wedding) belonged to some prince"
                under:
                  - {s: "que así las ponderaba", r: "why he asks: since he praised it so"}
        forms:
          - {w: "Preguntóle", f: "pregunt- + -ó + le → preguntar (to ask), preterite, he, with 'le' (him) stuck on the end; modern 'le preguntó'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. Cervantes hangs the pronoun on a verb that opens the sentence."}
          - {w: "eran", f: "ser (to be), imperfect, they (the 'bodas', plural). Irregular: era, eras, era, éramos, erais, eran."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun ('príncipe'), like un, buen, ningún."}
          - {w: "las ponderaba", f: "ponder- + -aba → ponderar (to extol), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. 'las' = them, the 'bodas'."}
  - sentences:
      - es: "— No son —respondió el estudiante— sino de un labrador y una labradora: él, el más rico de toda esta tierra; y ella, la más hermosa que han visto los hombres."
        literal: "— Not they-are —answered the student— but of a farmer and a farmer-woman: he, the most rich of all this land; and she, the most beautiful that have seen the men."
        ormsby: "“Not at all,” said the student; “it is the wedding of a farmer and a farmer’s daughter, he the richest in all this country, and she the fairest mortal ever set eyes on."
        vocab:
          - {w: "no ... sino", d: "only, nothing but: 'no son sino de' = they are only those of"}
          - {w: "labrador / labradora", d: "farmer, farmer's daughter: well-off peasants who own and work land, not gentry"}
          - {w: "tierra", d: "here 'region, district, country round about'"}
        diagram:
          - s: "No son"
            r: "main verb: they (the wedding) are not"
            under:
              - {s: "respondió el estudiante", r: "speech tag: answered the student"}
              - s: "sino de un labrador y una labradora:"
                r: "whose: only those of a farmer and a farmer's daughter"
                under:
                  - {s: "él, el más rico de toda esta tierra", r: "describes 'labrador': he the richest in all this district"}
                  - {s: "y ella, la más hermosa que han visto los hombres", r: "describes 'labradora': she the most beautiful men have seen"}
        forms:
          - {w: "son", f: "ser (to be), present, they (the wedding). Irregular: soy, eres, es, somos, sois, son."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "labradora", f: "labrador + -a: nouns in -or make the feminine by adding -a."}
          - {w: "esta", f: "est- + -a → este (this), feminine to match 'tierra'."}
          - {w: "han visto", f: "h- + -an → haber (to have), present, they, + visto, the irregular participle of ver (to see): the perfect, 'have seen'. haber (to have) in the present: he, has, ha, hemos, habéis, han. The subject 'los hombres' comes after the verb."}
      - es: "El aparato con que se han de hacer es estraordinario y nuevo, porque se han de celebrar en un prado que está junto al pueblo de la novia, a quien por excelencia llaman Quiteria la hermosa, y el desposado se llama Camacho el rico;"
        literal: "The display with which themselves they-have to make is extraordinary and new, because themselves they-have to celebrate in a meadow that is next to-the town of the bride, to whom by excellence they-call Quiteria the beautiful, and the bridegroom himself calls Camacho the rich;"
        ormsby: "The display with which it is to be attended will be something rare and out of the common, for it will be celebrated in a meadow adjoining the town of the bride, who is called, par excellence, Quiteria the fair, as the bridegroom is called Camacho the rich."
        vocab:
          - {w: "aparato", d: "pomp, display, show (false friend: not 'apparatus')"}
          - {w: "haber de", d: "to be going to, to have to: 'se han de hacer' = they are to be held"}
          - {w: "estraordinario", d: "= extraordinario, out of the ordinary (old spelling without x)"}
          - {w: "nuevo", d: "here 'novel, never seen before'"}
          - {w: "prado", d: "meadow"}
          - {w: "junto a", d: "next to, beside"}
          - {w: "novia", d: "bride (also 'fiancée')"}
          - {w: "por excelencia", d: "par excellence, as the one above all others"}
          - {w: "desposado", d: "bridegroom, the man being married"}
        diagram:
          - s: "El aparato ... es estraordinario y nuevo"
            r: "main clause: the display is extraordinary and new"
            under:
              - {s: "con que se han de hacer", r: "describes 'aparato': with which it (the wedding) is to be held"}
              - s: "porque se han de celebrar en un prado"
                r: "why: because it is to be held in a meadow"
                under:
                  - s: "que está junto al pueblo de la novia"
                    r: "describes 'prado': which is next to the bride's village"
                    under:
                      - {s: "a quien por excelencia llaman Quiteria la hermosa", r: "describes 'novia': whom they call Quiteria the Fair"}
          - {s: "y el desposado se llama Camacho el rico;", r: "main clause 2: and the groom is called Camacho the Rich"}
        forms:
          - {w: "se han de hacer", f: "h- + -an → haber (to have), present, they, + de + hacer (to make, hold), with passive 'se': 'they are to be held'. haber (to have) in the present: he, has, ha, hemos, habéis, han. 'haber de' + infinitive = to be going to, to have to."}
          - {w: "es", f: "ser (to be), present, it. Irregular: soy, eres, es, somos, sois, son."}
          - {w: "estraordinario", f: "old spelling of extraordinario (extraordinary), masculine to match 'aparato'."}
          - {w: "se han de celebrar", f: "han (haber (to have), present, they: he, has, ha, hemos, habéis, han) + de + celebrar (to celebrate), with passive 'se': 'they are to be celebrated'."}
          - {w: "está", f: "est- + -á → estar (to be), present, it (the meadow): estoy, estás, está, estamos, estáis, están. estar (to be) for location."}
          - {w: "al", f: "a + el, 'to the', the contraction modern Spanish still makes."}
          - {w: "a quien", f: "'whom': 'a' marks the person as object of 'llaman'; 'quien' refers to 'la novia'."}
          - {w: "llaman", f: "llam- + -an → llamar (to call), present, they (people in general). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "se llama", f: "llam- + -a → llamarse (to be called), present, he, with 'se'. Same -ar present as 'llaman'."}
        note: "The epithets 'the Fair' and 'the Rich' are village nicknames that sum up what each brings to the match: her beauty, his money. The student's story will turn on this contrast between beauty and money."
