      - es: "pues, ¿por qué no hará lo mesmo el que ha de caminar toda la vida, hasta el paradero de la muerte, y más si la compañía le ha de acompañar en la cama, en la mesa y en todas partes, como es la de la mujer con su marido?"
        literal: "well, why not will-do the same he who has to travel all the life, up-to the stopping-place of the death, and more if the company him has to accompany in the bed, at the table and in all parts, as is the [company] of the wife with her husband?"
        ormsby: "Why, then, should not he do the same who has to make the whole journey of life down to the final halting-place of death, more especially when the companion has to be his companion in bed, at board, and everywhere, as the wife is to her husband?"
