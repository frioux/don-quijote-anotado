  - sentences:
      - es: "— ¿Adónde vas a parar, Sancho, que seas maldito? —dijo don Quijote—; que cuando comienzas a ensartar refranes y cuentos, no te puede esperar sino el mesmo Judas, que te lleve."
        literal: "— Where you-go to stop, Sancho, that you-may-be cursed? —said Don Quijote—; for when you-begin to string proverbs and tales, not you can wait-for but the same Judas, may-he you carry-off."
        ormsby: "“What art thou driving at, Sancho? curses on thee!” said Don Quixote; “for when thou takest to stringing proverbs and sayings together, no one can understand thee but Judas himself, and I wish he had thee."
        vocab:
          - {w: "¿adónde vas a parar?", d: "where are you heading?, what are you driving at? ('parar' = to stop, end up)"}
          - {w: "que seas maldito", d: "curse you!, a curse in the subjunctive ('may you be cursed')"}
          - {w: "ensartar", d: "to string together, thread (like beads on a string)"}
          - {w: "refrán", d: "proverb, saying"}
          - {w: "esperar", d: "here 'to keep up with, wait for (to follow)': no one but Judas could follow your chain of proverbs"}
          - {w: "mesmo", d: "= mismo, here 'himself' (old form)"}
          - {w: "Judas", d: "Judas Iscariot, the betrayer of Christ, here as a stand-in for the devil"}
          - {w: "que te lleve", d: "may he carry you off (to hell): a curse"}
        diagram:
          - s: "¿Adónde vas a parar"
            r: "main verb 1: where are you heading"
            under:
              - {s: "Sancho", r: "addressed"}
              - {s: "que seas maldito?", r: "curse: may you be cursed"}
          - {s: "dijo don Quijote", r: "speaker: said Don Quijote"}
          - s: "no te puede esperar sino el mesmo Judas"
            r: "main verb 2 (after 'que', for): no one but Judas himself can keep up with you"
            under:
              - {s: "cuando comienzas a ensartar refranes y cuentos", r: "when: when you start stringing proverbs and stories"}
              - {s: "que te lleve", r: "curse on 'Judas': may he carry you off"}
        forms:
          - {w: "vas", f: "v- + -as → ir (to go), present, you (tú). Irregular: voy, vas, va, vamos, vais, van. 'ir a' + infinitive = to be heading to, going to."}
          - {w: "seas", f: "se- + -as → ser (to be), present subjunctive, you (tú), in a wish or curse after 'que'. ser in the present subjunctive: sea, seas, sea, seamos, seáis, sean."}
          - {w: "comienzas", f: "comienz- + -as → comenzar (to begin), present, you (tú). The stem e becomes ie when stressed: comienzo, comienzas, comienza, comenzamos, comenzáis, comienzan."}
          - {w: "puede", f: "pued- + -e → poder (to be able), present, he (Judas). The stem o becomes ue when stressed: puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "no ... sino", f: "'not ... except': 'no te puede esperar sino el mesmo Judas' = no one can wait for you except Judas himself."}
          - {w: "lleve", f: "llev- + -e → llevar (to carry off), present subjunctive, he (Judas), in a wish after 'que'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
        note: "Don Quijote speaks to his squire as 'tú', master to servant, and his curses are the mild everyday kind. He is irritated by Sancho's habit, by now well known to the reader, of stringing proverbs one after another."
