      - es: "Arremetía como un león irritado, pero salíale al encuentro un tapaboca de la zapatilla de la espada del licenciado, que en mitad de su furia le detenía, y se la hacía besar como si fuera reliquia, aunque no con tanta devoción como las reliquias deben y suelen besarse."
