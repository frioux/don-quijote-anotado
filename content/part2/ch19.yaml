        ormsby: "“It must not be that way,” said Don Quixote at this point; “I will be the director of this fencing match, and judge of this often disputed question;”"
        vocab:
          - {w: "no ha de ser así", d: "it must not be like this, this is not the way it shall be done"}
          - {w: "a este instante", d: "at this moment, at this point"}
          - {w: "desta", d: "= de esta, of this (old contraction)"}
          - {w: "maestro", d: "here master of the fencing bout, the umpire who presides over it ('maestro de esgrima' is also a fencing master)"}
          - {w: "esgrima", d: "fencing, swordplay; here the fencing match itself"}
          - {w: "averiguado", d: "settled, established, proven; 'no averiguada cuestión' = a question never settled"}
        diagram:
          - s: "No ha de ser así"
            r: "what he said, 1: it must not be like this"
          - s: "dijo"
            r: "speech verb: said"
            under:
              - {s: "a este instante", r: "when: at this point"}
              - {s: "don Quijote", r: "subject: who said it"}
          - s: "que yo quiero ser"
            r: "what he said, 2 (why): for I want to be"
            under:
              - {s: "el maestro desta esgrima", r: "complement 1: the master of this fencing match"}
              - s: "y el juez"
                r: "complement 2: and the judge"
                under:
                  - {s: "desta muchas veces no averiguada cuestión", r: "describes 'juez': of this question so often left unsettled"}
        forms:
          - {w: "ha de ser", f: "ha → haber (to have), present, it, + de + ser (to be): 'haber de' + infinitive means 'must, is to'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "quiero", f: "quier- + -o → querer (to want), present, I. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "desta", f: "= de + esta, the old contraction of 'de' (of) and 'esta' (this), feminine to match 'esgrima' and 'cuestión'; modern 'de esta'."}
          - {w: "averiguada", f: "averigu- + -ada → averiguar (to settle, ascertain), participle used as an adjective, feminine to match 'cuestión'."}
        note: "The 'question so often left unsettled' is a real debate of the day: whether fencing was a science, based on geometry, or whether a strong arm and natural courage were enough. Don Quijote, as a knight, appoints himself umpire."
