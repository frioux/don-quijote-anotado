  - sentences:
      - es: "— ¡A mi mujer con eso! —dijo Sancho Panza, que hasta entonces había ido callando y escuchando—, la cual no quiere sino que cada uno case con su igual, ateniéndose al refrán que dicen \"cada oveja con su pareja\"."
        literal: "— To my wife with that! —said Sancho Panza, who until then had gone keeping-quiet and listening—, the which not wants but that each one may-marry with his equal, holding-herself to-the proverb that they-say \"each ewe with her mate\"."
        ormsby: "“Say that to my wife,” said Sancho, who had until now listened in silence, “for she won’t hear of anything but each one marrying his equal, holding with the proverb ‘each ewe to her like.’"
        vocab:
          - {w: "¡A mi mujer con eso!", d: "'Go tell that to my wife!': she would disagree"}
          - {w: "callar", d: "to keep quiet, be silent"}
          - {w: "casar con", d: "to marry (without 'se', old and popular use)"}
          - {w: "atenerse a", d: "to abide by, stick to, rely on"}
          - {w: "refrán", d: "proverb, saying"}
          - {w: "cada oveja con su pareja", d: "proverb: 'each ewe with her mate', marry your own kind, like with like"}
        diagram:
          - {s: "¡A mi mujer con eso!", r: "exclamation, verb understood: (go) to my wife with that!"}
          - s: "dijo Sancho Panza"
            r: "speech verb: said Sancho Panza"
            under:
              - {s: "que hasta entonces había ido callando y escuchando", r: "describes 'Sancho': who until then had been silent and listening"}
          - s: "la cual no quiere"
            r: "describes 'mi mujer': who wants nothing"
            under:
              - {s: "sino que cada uno case con su igual", r: "what she wants: only that each marry his equal"}
              - s: "ateniéndose al refrán"
                r: "how: sticking to the proverb"
                under:
                  - {s: "que dicen \"cada oveja con su pareja\"", r: "describes 'refrán': that they quote, 'each ewe with her mate'"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "había ido callando", f: "había (haber (to have), imperfect, he: había, habías, había, habíamos, habíais, habían) + ido, participle of ir (to go): pluperfect, 'had gone'; + the gerunds callando (from callar (to keep quiet)) and escuchando (from escuchar (to listen)): 'ir (to go)' + gerund = to keep on doing."}
          - {w: "la cual", f: "'who', feminine to match 'mi mujer'; a heavier relative than 'que', used after a comma."}
          - {w: "quiere", f: "quier- + -e → querer (to want), present, she. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "case", f: "cas- + -e → casar (to marry), present subjunctive, he (each one), after 'no quiere sino que' (wants only that). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "ateniéndose", f: "gerund of atenerse (to abide by) + se (herself), accent added: 'sticking to'. A pronoun is hung on the end of a gerund."}
          - {w: "al", f: "a + el, the contraction modern Spanish still makes."}
          - {w: "dicen", f: "dic- + -en → decir (to say), present, they (people in general). Irregular: digo, dices, dice, decimos, decís, dicen."}
        ormsby_note: "Proverb 162."
        note: "Ormsby's 'Proverb 162' refers to his own numbered list of the proverbs in the book. 'Cada oveja con su pareja' (each ewe with her mate) means that people should marry their equals in rank and fortune, which is just what Teresa told Sancho in Chapter V about their daughter: 'casadla con su igual' (marry her to her equal)."
      - es: "Lo que yo quisiera es que ese buen Basilio, que ya me le voy aficionando, se casara con esa señora Quiteria; que buen siglo hayan y buen poso, iba a decir al revés, los que estorban que se casen los que bien se quieren."
        literal: "That which I would-like is that that good Basilio, for already myself him I-go taking-a-liking, himself might-marry with that lady Quiteria; and good afterlife may-they-have and good rest, I-was-going to say the-other-way-round, those who hinder that themselves may-marry those who well each-other love."
        ormsby: "What I would like is that this good Basilio (for I am beginning to take a fancy to him already) should marry this lady Quiteria; and a blessing and good luck—I meant to say the opposite—on people who would prevent those who love one another from marrying.”"
        vocab:
          - {w: "aficionarse a", d: "to take a liking to, grow fond of"}
          - {w: "buen siglo hayan", d: "'may they have a good afterlife', a blessing on the dead (siglo = the world to come); Sancho means the opposite, a curse"}
          - {w: "buen poso", d: "good rest, peace (poso = repose); paired with 'buen siglo' in blessings"}
          - {w: "al revés", d: "the other way round, the opposite"}
          - {w: "quererse bien", d: "to love each other"}
        diagram:
          - s: "Lo que yo quisiera es"
            r: "main verb 1: what I would like is"
            under:
              - s: "que ese buen Basilio ... se casara con esa señora Quiteria"
