          - {w: "a esta sazón", d: "at this point, at that moment"}
          - {w: "merecer", d: "to deserve"}
          - {w: "la reina Ginebra", d: "Queen Guinevere, wife of King Arthur in the Arthurian romances"}
          - {w: "Lanzarote", d: "Sir Lancelot of the Lake, Arthur's greatest knight and Guinevere's lover"}
          - {w: "a pesar de", d: "in spite of"}
