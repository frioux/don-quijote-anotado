  - sentences:
      - es: "— Si no os picáredes más de saber más menear las negras que lleváis que la lengua —dijo el otro estudiante—, vos llevárades el primero en licencias, como llevastes cola."
        literal: "— If not yourself you-should-pique more of knowing more to-wield the black-[swords] that you-carry than the tongue —said the other student—, you would-have-carried the first in licences, as you-carried tail."
        ormsby: "“If you did not pique yourself more on your dexterity with those foils you carry than on dexterity of tongue,” said the other student, “you would have been head of the degrees, where you are now tail.”"
        vocab:
          - {w: "picarse de", d: "to pride oneself on"}
          - {w: "menear", d: "to move, shake, wield"}
          - {w: "las negras", d: "'the black ones', i.e. 'espadas negras', blunt iron practice swords, fencing foils (as opposed to 'blancas', sharp steel)"}
          - {w: "licencias", d: "licentiate degrees; graduates were ranked in order of merit when the degree was conferred"}
          - {w: "llevar el primero", d: "to take first place"}
          - {w: "cola", d: "tail; here last place in the ranking of graduates (a student joke)"}
          - {w: "vos", d: "you: here a familiar, slightly brusque address between equals"}
        diagram:
          - s: "vos llevárades el primero en licencias"
            r: "main verb: you would have taken first place in the licentiate degrees"
            under:
              - s: "Si no os picáredes más"
                r: "condition: if you did not pride yourself more"
                under:
                  - {s: "de saber más menear las negras que lleváis", r: "on what: on knowing how to wield the foils you carry"}
                  - {s: "que la lengua", r: "compared with: than the tongue"}
              - {s: "dijo el otro estudiante", r: "speaker: said the other student"}
              - {s: "como llevastes cola", r: "contrast: as [instead] you took the tail"}
        forms:
