  - sentences:
      - es: "en esa de Roncesvalles."
        literal: "in that [chase] of Roncesvalles."
        ormsby: "In Roncesvalles chase—"
        vocab:
          - {w: "Roncesvalles", d: "pass in the western Pyrenees where Charlemagne's rearguard under Roland was destroyed in 778, the subject of the Song of Roland and many Spanish ballads"}
          - {w: "esa", d: "that one: 'la caza' (the chase, the rout) is understood"}
        diagram:
          - s: "hubistes"
            r: "carried-over root from the previous line: you came off (badly)"
            under:
              - {s: "en esa de Roncesvalles.", r: "where: in that (chase) of Roncesvalles"}
        forms:
          - {w: "esa", f: "es- + -a → ese (that), feminine to match the understood noun 'caza' (chase). ese, esa, esos, esas."}
        note: "Cervantes quotes the line loosely: the ballad itself has 'la caza de Roncesvalles', 'the hunt of Roncesvalles', as Sancho's reply shows. 'Caza' here is the rout of the French, hunted down in the pass."
        ormsby_note: "\"Mala la hubistes, Franceses, / La caza de Roncesvalles\", the beginning of one of the most popular of the ballads of the Carlovingian cycle. Lockhart has in his own fashion given the substance of it in The Admiral Guarinos. The correct form of the first line is \"Mala la vistes, Franceses.\""
