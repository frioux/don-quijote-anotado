          - {w: "le vea yo", f: "ve- + -a → ver (to see), present subjunctive, I, a wish: 'may I see it'. ver in the present subjunctive: vea, veas, vea, veamos, veáis, vean. 'le' stands for 'alcázar', a thing: using 'le' for 'lo' is leísmo, common in Cervantes."}
