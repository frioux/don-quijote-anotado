  - sentences:
      - es: "— Habla con respeto, Sancho, de las cosas de mi señora —dijo don Quijote—, y tengamos la fiesta en paz, y no arrojemos la soga tras el caldero."
        literal: "— Speak with respect, Sancho, of the things of my lady —said Don Quijote—, and let-us-keep the feast in peace, and not let-us-throw the rope after the bucket."
        ormsby: "“Speak respectfully of what belongs to my lady, Sancho,” said Don Quixote; “let us keep the feast in peace, and not throw the rope after the bucket.”"
        vocab:
          - {w: "tener la fiesta en paz", d: "to keep the peace, not spoil the party (idiom)"}
          - {w: "arrojar la soga tras el caldero", d: "to throw the rope after the bucket: having lost one thing, to throw away the rest in despair or temper"}
          - {w: "soga", d: "rope"}
          - {w: "caldero", d: "pail, bucket (for a well)"}
        diagram:
          - s: "Habla con respeto"
            r: "main verb 1: speak with respect"
            under:
              - {s: "Sancho", r: "who is addressed"}
              - {s: "de las cosas de mi señora", r: "about what: about my lady's affairs"}
              - {s: "dijo don Quijote", r: "speech tag: said Don Quijote"}
          - {s: "y tengamos la fiesta en paz", r: "main verb 2: and let us keep the peace"}
          - {s: "y no arrojemos la soga tras el caldero", r: "main verb 3: and let us not throw the rope after the bucket"}
        forms:
          - {w: "Habla", f: "habl- + -a → hablar (to speak), imperative, you (tú): 'speak!'. The tú imperative of regular verbs is the same as the he-form of the present: habla, come, vive."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "tengamos", f: "teng- + -amos → tener (to have, keep), present subjunctive, we: 'let us keep'. tener in the present subjunctive: tenga, tengas, tenga, tengamos, tengáis, tengan."}
          - {w: "no arrojemos", f: "arroj- + -emos → arrojar (to throw), present subjunctive, we: 'let us not throw'. 'no' + subjunctive makes a negative command. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
        note: "Ormsby's 'Proverb 218' refers to his own numbered list of the proverbs in the book. The bucket has fallen down the well; throwing the rope after it loses everything. Don Quijote means: we have had one setback, let us not ruin the whole venture by quarrelling."
        ormsby_note: "Proverb 218."
  - sentences:
      - es: "— Yo me reportaré —respondió Sancho—; pero, ¿con qué paciencia podré llevar que quiera vuestra merced que de sola una vez que vi la casa de nuestra ama, la haya de saber siempre y hallarla a media noche, no hallándola vuestra merced, que la debe de haber visto millares de veces?"
        literal: "— I myself will-restrain —answered Sancho—; but, with what patience will-I-be-able to-bear that may-want your grace that from only one time that I-saw the house of our mistress, it I-must of know always and to-find-it at mid night, not finding-it your grace, who it must of have seen thousands of times?"
        ormsby: "“I’ll hold my tongue,” said Sancho, “but how am I to take it patiently when your worship wants me, with only once seeing the house of our mistress, to know always, and find it in the middle of the night, when your worship can’t find it, who must have seen it thousands of times?”"
        vocab:
          - {w: "reportarse", d: "to restrain oneself, calm down, hold one's tongue"}
          - {w: "llevar", d: "here 'to bear, put up with'"}
          - {w: "de sola una vez", d: "from just one single time"}
          - {w: "ama", d: "mistress (of a house or of a servant); 'nuestra ama' = our lady and mistress"}
          - {w: "haber de", d: "to have to, must"}
          - {w: "media noche", d: "midnight (modern 'medianoche')"}
          - {w: "millares", d: "thousands"}
        diagram:
          - s: "Yo me reportaré"
            r: "main verb 1: I will restrain myself"
            under:
              - {s: "respondió Sancho", r: "speech tag: answered Sancho"}
          - s: "pero, ¿con qué paciencia podré llevar"
            r: "main verb 2: but with what patience can I bear"
            under:
              - s: "que quiera vuestra merced"
                r: "what I must bear: that your worship wants"
                under:
                  - s: "que de sola una vez que vi la casa de nuestra ama, la haya de saber siempre"
                    r: "what you want, 1: that from one single sight of our mistress's house I should know it forever"
                  - {s: "y hallarla a media noche", r: "what you want, 2: and find it at midnight"}
                  - s: "no hallándola vuestra merced"
                    r: "when you yourself cannot find it"
                    under:
                      - {s: "que la debe de haber visto millares de veces?", r: "describes 'vuestra merced': who must have seen it thousands of times"}
        forms:
          - {w: "me reportaré", f: "reportar- + -é → reportarse (to restrain oneself), future, I, with 'me'. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "podré", f: "podr- + -é → poder (to be able), future, I. Irregular stem podr-: podré, podrás, podrá, podremos, podréis, podrán."}
          - {w: "quiera", f: "quier- + -a → querer (to want), present subjunctive, you (vuestra merced), after 'llevar que' (bear that). querer in the present subjunctive: quiera, quieras, quiera, queramos, queráis, quieran."}
          - {w: "vi", f: "ver (to see), preterite, I: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "la haya de saber", f: "hay- + -a → haber (to have), present subjunctive, I: haya, hayas, haya, hayamos, hayáis, hayan; + de + saber (to know): 'that I must know it'. 'la' = the house."}
          - {w: "hallarla", f: "hallar (to find) + la (it, the house), the pronoun hung on the infinitive."}
          - {w: "no hallándola", f: "hall- + -ando + la → hallar (to find), gerund with 'la' (it) on the end, accent added: 'you not finding it'."}
          - {w: "la debe de haber visto", f: "deb- + -e → deber (must), present, you (vuestra merced): debo, debes, debe, debemos, debéis, deben; + de + haber (to have) + visto, irregular participle of ver (to see): 'must have seen it', a guess."}
          - {w: "veces", f: "plural of vez (time): z becomes c before e."}
        note: "Sancho turns his master's logic against him: if Don Quijote, a lifelong lover, cannot find the house, how should Sancho, who (he says) saw it once? Of course Sancho has never seen it at all."
