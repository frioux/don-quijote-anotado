      - es: "¿Vamos por dicha a llamar a la casa de nuestras mancebas, como hacen los abarraganados, que llegan, y llaman, y entran a cualquier hora, por tarde que sea?"
        literal: "Are-we-going by chance to knock at the house of our mistresses, as do the kept-woman-men, who arrive, and knock, and enter at whatever hour, for late that it-may-be?"
        ormsby: "Are we going, do you fancy, to the house of our wenches, like gallants who come and knock and go in at any hour, however late it may be?”"
