  - sentences:
      - es: "— No se atenga a eso, señor —respondió Sancho—, porque le hago saber que también fue de oídas la vista y la respuesta que le truje; porque, así sé yo quién es la señora Dulcinea como dar un puño en el cielo."
        literal: "— Not yourself hold to that, sir —answered Sancho—, because to-you I-make know that also was by hearings the sight and the answer that to-you I-brought; because, so know I who is the lady Dulcinea as to-give a fist in the sky."
        ormsby: "“Don’t mind that, señor,” said Sancho; “I must tell you that my seeing her and the answer I brought you back were by hearsay too, for I can no more tell who the lady Dulcinea is than I can hit the sky.”"
        vocab:
          - {w: "atenerse a", d: "to rely on, go by"}
          - {w: "hacer saber", d: "to let (someone) know, inform"}
          - {w: "de oídas", d: "by hearsay"}
          - {w: "vista", d: "the sight, the seeing (of her)"}
          - {w: "truje", d: "= traje, I brought (old form)"}
          - {w: "así ... como", d: "as much as: 'así sé yo ... como dar un puño en el cielo' = I know it as much as I can punch the sky, i.e. not at all"}
          - {w: "dar un puño en el cielo", d: "to punch the sky: something impossible"}
        diagram:
          - s: "No se atenga a eso"
            r: "main verb 1: don't go by that"
            under:
              - {s: "señor", r: "who is addressed"}
              - {s: "respondió Sancho", r: "speech tag: answered Sancho"}
              - s: "porque le hago saber"
                r: "why: because I let you know"
                under:
                  - s: "que también fue de oídas la vista y la respuesta"
                    r: "what I let you know: that the sight and the answer were hearsay too"
                    under:
                      - {s: "que le truje", r: "describes 'respuesta': that I brought you"}
          - s: "porque, así sé yo quién es la señora Dulcinea"
            r: "main verb 2: because I know who the lady Dulcinea is as much"
            under:
              - {s: "como dar un puño en el cielo", r: "as much as what: as I can punch the sky"}
        forms:
          - {w: "No se atenga", f: "aten- + -g- + -a → atenerse (to rely on), present subjunctive, you (vuestra merced), used as a polite negative command: 'don't rely'. Like tener: atenga, atengas, atenga, atengamos, atengáis, atengan."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "le hago saber", f: "hag- + -o → hacer (to make), present, I: hago, haces, hace, hacemos, hacéis, hacen; + saber (to know): 'I make you know'. 'le' = to you (vuestra merced)."}
          - {w: "fue", f: "ser (to be), preterite, it: fui, fuiste, fue, fuimos, fuisteis, fueron. Singular, though it has two subjects ('la vista y la respuesta'), as often when the verb comes first."}
          - {w: "truje", f: "truj- + -e → traer (to bring), preterite, I, old form: truje, trujiste, trujo, trujimos, trujisteis, trujeron; modern traje."}
          - {w: "sé", f: "saber (to know), present, I: sé, sabes, sabe, sabemos, sabéis, saben. The accent tells it from 'se'."}
          - {w: "es", f: "ser (to be), present, she: soy, eres, es, somos, sois, son."}
          - {w: "dar", f: "infinitive of dar (to give) used as a noun after 'como': 'as (I can) give a punch'."}
        note: "Sancho has now as good as confessed that his visit to Dulcinea in Part I was made up. Don Quijote, as the next speech shows, refuses to take it as anything but a joke in poor taste."
  - sentences:
