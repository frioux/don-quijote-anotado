                r: "how: as men who keep women do"
                under:
                  - {s: "que llegan, y llaman, y entran a cualquier hora", r: "describes 'abarraganados': who come and knock and go in at any hour"}
                  - {s: "por tarde que sea?", r: "however late it may be"}
        forms:
          - {w: "Vamos", f: "ir (to go), present, we: voy, vas, va, vamos, vais, van; + a + llamar (to knock): 'are we going to knock'."}
          - {w: "nuestras", f: "nuestr- + -as → nuestro (our), feminine plural to match 'mancebas'."}
          - {w: "hacen", f: "hac- + -en → hacer (to do), present, they: hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "abarraganados", f: "a- + barragan- + -ado → abarraganarse (to live with a kept woman), participle used as a noun, masculine plural: 'men in concubinage'."}
          - {w: "llegan, y llaman, y entran", f: "lleg-, llam-, entr- + -an → llegar (to arrive), llamar (to knock), entrar (to go in), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "cualquier", f: "cualquiera (any) clipped before a noun ('hora')."}
          - {w: "sea", f: "ser (to be), present subjunctive, it, in 'por ... que' (however ...). ser in the present subjunctive: sea, seas, sea, seamos, seáis, sean."}
        note: "Sancho's point is social: only a man visiting a mistress knocks at midnight; a respectable household is shut and asleep. Comparing Dulcinea's house to a kept woman's is just what Don Quijote cannot bear to hear."
  - sentences:
      - es: "— Hallemos primero una por una el alcázar —replicó don Quijote—, que entonces yo te diré, Sancho, lo que será bien que hagamos."
        literal: "— Let-us-find first one by one the castle —replied Don Quijote—, for then I to-you will-tell, Sancho, that which will-be well that we-may-do."
        ormsby: "“Let us first of all find out the palace for certain,” replied Don Quixote, “and then I will tell thee, Sancho, what we had best do;"
        vocab:
          - {w: "una por una", d: "for certain, for sure (idiom)"}
          - {w: "replicar", d: "to reply, retort"}
          - {w: "será bien que", d: "it will be right that, it will be best that"}
        diagram:
          - s: "Hallemos primero una por una el alcázar"
            r: "main verb 1: let us first find the castle for certain"
            under:
              - {s: "replicó don Quijote", r: "speech tag: replied Don Quijote"}
          - s: "que entonces yo te diré, Sancho"
            r: "main verb 2: for then I will tell you, Sancho"
            under:
              - s: "lo que será bien"
                r: "what I will tell: what it will be right"
                under:
                  - {s: "que hagamos", r: "for us to do"}
        forms:
          - {w: "Hallemos", f: "hall- + -emos → hallar (to find), present subjunctive, we: 'let us find', the usual way of saying 'let's'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "replicó", f: "replic- + -ó → replicar (to reply), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (repliqué, with c → qu before e)."}
          - {w: "te diré", f: "dir- + -é → decir (to tell), future, I, with 'te' (to you) before it. Irregular stem dir-: diré, dirás, dirá, diremos, diréis, dirán."}
          - {w: "será", f: "ser- + -á → ser (to be), future, it: seré, serás, será, seremos, seréis, serán."}
          - {w: "hagamos", f: "hag- + -amos → hacer (to do), present subjunctive, we, after 'será bien que'. hacer in the present subjunctive: haga, hagas, haga, hagamos, hagáis, hagan."}
      - es: "Y advierte, Sancho, que yo veo poco, o que aquel bulto grande y sombra que desde aquí se descubre la debe de hacer el palacio de Dulcinea."
        literal: "And note, Sancho, that [either] I see little, or that that bulk big and shadow which from here itself-uncovers it must of make the palace of Dulcinea."
        ormsby: "but look, Sancho, for either I see badly, or that dark mass that one sees from here should be Dulcinea’s palace.”"
        vocab:
          - {w: "advertir", d: "to notice, take note of (not 'to advertise'); 'advierte' = look, mark"}
          - {w: "ver poco", d: "to see badly, have poor sight"}
          - {w: "bulto", d: "bulk, dark mass, a shape seen indistinctly"}
          - {w: "descubrirse", d: "to come into view, be seen"}
          - {w: "deber de", d: "must (a guess, probability)"}
        diagram:
          - s: "Y advierte, Sancho"
            r: "main verb: and mark, Sancho"
            under:
              - {s: "que yo veo poco", r: "what to mark, 1: that either I see badly"}
              - s: "o que aquel bulto grande y sombra"
                r: "what to mark, 2: or that that big dark shape and shadow"
                under:
                  - {s: "que desde aquí se descubre", r: "describes 'bulto y sombra': which can be seen from here"}
                  - {s: "la debe de hacer el palacio de Dulcinea", r: "Dulcinea's palace must be casting it"}
        forms:
          - {w: "advierte", f: "adviert- + -e → advertir (to notice), imperative, you (tú): 'take note!'. The tú imperative is the he-form of the present, and the stem e becomes ie when stressed: advierto, adviertes, advierte, advertimos, advertís, advierten."}
          - {w: "veo", f: "ver (to see), present, I: veo, ves, ve, vemos, veis, ven."}
          - {w: "aquel", f: "'that (over there)', masculine singular to match 'bulto': aquel, aquella, aquellos, aquellas."}
          - {w: "se descubre", f: "descubr- + -e → descubrir (to uncover), present, it, with 'se' making it passive: 'is seen'. The present of -ir verbs: -o, -es, -e, -imos, -ís, -en."}
          - {w: "la debe de hacer", f: "deb- + -e → deber (must), present, it: debo, debes, debe, debemos, debéis, deben; + de + hacer (to make): 'must be making'. 'la' is the shadow ('sombra'), put before the verb group: 'the palace must be casting it'."}
        note: "Don Quijote's grammar wobbles: he starts with 'that great bulk and shadow' as if it were the subject, then makes the palace the one that casts it. The dark mass is real, but it will turn out not to be a palace."
  - sentences:
      - es: "— Pues guíe vuestra merced —respondió Sancho—: quizá será así; aunque yo lo veré con los ojos y lo tocaré con las manos, y así lo creeré yo como creer que es ahora de día."
        literal: "— Well let-guide your grace —answered Sancho—: perhaps it-will-be so; although I it will-see with the eyes and it will-touch with the hands, and so it will-believe I as to-believe that it-is now of day."
        ormsby: "“Then let your worship lead the way,” said Sancho, “perhaps it may be so; though I see it with my eyes and touch it with my hands, I’ll believe it as much as I believe it is daylight now.”"
        vocab:
          - {w: "así ... como", d: "as much as: 'así lo creeré como creer que es de día' = I'll believe it as much as that it's day now, i.e. not at all"}
          - {w: "ser de día", d: "to be daytime, daylight"}
        diagram:
          - s: "Pues guíe vuestra merced"
            r: "main verb 1: well, lead on, your worship"
            under:
              - {s: "respondió Sancho", r: "speech tag: answered Sancho"}
          - {s: "quizá será así", r: "main verb 2: perhaps it will be so"}
          - s: "y así lo creeré yo"
            r: "main verb 3: and I will believe it as much"
            under:
              - {s: "aunque yo lo veré con los ojos y lo tocaré con las manos", r: "although: even though I see it with my eyes and touch it with my hands"}
              - {s: "como creer que es ahora de día", r: "as much as what: as believing that it is now day"}
        forms:
          - {w: "guíe", f: "gu- + -íe → guiar (to lead), present subjunctive, you (vuestra merced), used as a polite command: 'lead on'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en (guíe, guíes, guíe, guiemos, guiéis, guíen)."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "será", f: "ser- + -á → ser (to be), future, it: seré, serás, será, seremos, seréis, serán."}
          - {w: "veré, tocaré, creeré", f: "ver- + -é, tocar- + -é, creer- + -é → ver (to see), tocar (to touch), creer (to believe), future, I. The future adds endings to the whole infinitive: -é, -ás, -á, -emos, -éis, -án. 'aunque' with the future: even when I see it."}
          - {w: "creer", f: "infinitive of creer (to believe) used as a noun: 'as (I believe) believing'."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son. 'es de día' = it is daytime."}
        note: "Sancho's irony: even if he sees and touches the palace, he will believe in it about as much as he believes it is daytime at midnight, which is not at all."
  - sentences:
      - es: "Guió don Quijote, y, habiendo andado como docientos pasos, dio con el bulto que hacía la sombra, y vio una gran torre, y luego conoció que el tal edificio no era alcázar, sino la iglesia principal del pueblo. Y dijo:"
        literal: "Led Don Quijote, and, having walked about two-hundred paces, he-hit with the bulk that was-making the shadow, and saw a great tower, and at-once he-knew that the said building not was castle, but the church main of-the town. And he-said:"
        ormsby: "Don Quixote took the lead, and having gone a matter of two hundred paces he came upon the mass that produced the shade, and found it was a great tower, and then he perceived that the building in question was no palace, but the chief church of the town, and said he,"
        vocab:
          - {w: "como", d: "about, roughly (with a number)"}
          - {w: "docientos", d: "= doscientos, two hundred (old spelling)"}
          - {w: "paso", d: "pace, step"}
          - {w: "dar con", d: "to come upon, run into, find"}
          - {w: "luego", d: "at once, straightaway (Cervantes' usual sense, not 'later')"}
          - {w: "conocer", d: "here 'to realize, recognize'"}
          - {w: "el tal", d: "the said, the ... in question"}
          - {w: "iglesia principal", d: "the main church, the parish church of the town"}
        diagram:
          - {s: "Guió don Quijote", r: "main verb 1: Don Quijote led the way"}
          - s: "dio con el bulto"
            r: "main verb 2: he came upon the dark mass"
            under:
              - {s: "habiendo andado como docientos pasos", r: "when: after going about two hundred paces"}
              - {s: "que hacía la sombra", r: "describes 'bulto': which was casting the shadow"}
          - {s: "y vio una gran torre", r: "main verb 3: and saw a great tower"}
          - s: "y luego conoció"
            r: "main verb 4: and at once realized"
            under:
              - {s: "que el tal edificio no era alcázar, sino la iglesia principal del pueblo", r: "what he realized: that the building was no castle but the town's main church"}
          - {s: "Y dijo:", r: "main verb 5: and he said"}
        forms:
          - {w: "Guió", f: "gui- + -ó → guiar (to lead), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. The verb comes before its subject."}
          - {w: "habiendo andado", f: "habiendo, gerund of haber (to have), + andado, participle of andar (to walk, go): 'having gone', the perfect gerund."}
          - {w: "dio", f: "dar (to give), preterite, he: di, diste, dio, dimos, disteis, dieron. 'dar con' = to come upon."}
          - {w: "hacía", f: "hac- + -ía → hacer (to make), imperfect, it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "vio", f: "ver (to see), preterite, he: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "gran", f: "grande (great) clipped before a singular noun ('torre')."}
          - {w: "conoció", f: "conoc- + -ió → conocer (to know, realize), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "era", f: "er- + -a → ser (to be), imperfect, it: era, eras, era, éramos, erais, eran."}
          - {w: "del", f: "de + el = del, 'of the'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
        ormsby_note: "As a matter of fact the church tower of El Toboso is an unusually massive and conspicuous one."
  - sentences:
