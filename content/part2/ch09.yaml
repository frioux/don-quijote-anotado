        ormsby: "“Señor,” replied Sancho, “every country has a way of its own; perhaps here in El Toboso it is the way to build palaces and grand buildings in alleys;"
        vocab:
          - {w: "en cada tierra su uso", d: "proverb: every country has its own customs ('when in Rome')"}
          - {w: "usarse", d: "to be the custom, be usual"}
          - {w: "edificio", d: "building"}
