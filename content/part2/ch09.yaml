          - s: "quizá se usa"
            r: "main verb 2: perhaps it is the custom"
            under:
              - {s: "aquí en el Toboso", r: "where: here in El Toboso"}
              - s: "edificar en callejuelas"
                r: "subject: to build in alleys"
                under:
                  - {s: "los palacios y edificios grandes", r: "object: palaces and big buildings"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "se usa", f: "us- + -a → usar (to use), present, it, with 'se': 'it is customary'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "edificar", f: "infinitive of edificar (to build), the subject of 'se usa': 'building in alleys is the custom'."}
