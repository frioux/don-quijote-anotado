part: 2
chapter: 9
title_es: "Capítulo IX. Donde se cuenta lo que en él se verá"
title_en: "Wherein is related what will be seen there"
paragraphs:
  - sentences:
      - es: "Media noche era por filo, poco más a menos, cuando don Quijote y Sancho dejaron el monte y entraron en el Toboso."
        literal: "Mid night it-was by [the] edge, little more to less, when Don Quijote and Sancho left the wood and entered into El Toboso."
        ormsby: "’Twas at the very midnight hour—more or less—when Don Quixote and Sancho quitted the wood and entered El Toboso."
        vocab:
          - {w: "media noche", d: "midnight; modern Spanish writes it as one word, 'medianoche'"}
          - {w: "por filo", d: "exactly, on the dot: 'filo' is the line on a balance that the pointer must sit on"}
          - {w: "poco más a menos", d: "more or less; modern 'poco más o menos'"}
          - {w: "monte", d: "wood, wooded high ground (not 'mountain'): the oak grove where they waited at the end of the previous chapter"}
          - {w: "el Toboso", d: "El Toboso, the village of La Mancha where Dulcinea is supposed to live; Spanish keeps the article with the name"}
        diagram:
          - s: "Media noche era"
            r: "main verb: it was midnight"
            under:
              - {s: "por filo", r: "how: exactly"}
              - {s: "poco más a menos", r: "how, 2: more or less (undoing 'exactly' at once)"}
              - s: "cuando don Quijote y Sancho dejaron el monte"
                r: "when: when the two left the wood"
                under:
                  - {s: "y entraron en el Toboso", r: "when, 2: and entered El Toboso"}
        forms:
          - {w: "era", f: "er- + -a → ser (to be), imperfect, it: 'it was'. ser is irregular in the imperfect: era, eras, era, éramos, erais, eran. The verb comes before the subject in the ballad line it quotes."}
          - {w: "dejaron", f: "dej- + -aron → dejar (to leave), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "entraron", f: "entr- + -aron → entrar (to enter), preterite, they. Same -aron preterite. Spanish says 'entrar en' (enter into) a place."}
        note: "The chapter opens with the first line of a famous ballad, the romance of Count Claros, and then spoils it with the very unballadlike 'poco más a menos'. The joke is that 'por filo' means 'exactly'."
        ormsby_note: "Media noche era por filo, the beginning of the ancient ballad of Conde Claros. Ticknor, apropos of this ballad, makes a strange mistake, assuming that the words por filo refer to some early contrivance for measuring time, and therefore indicate a date before the invention of clocks. Filo here is the line marked on a balance, by which the deviation of the index to one side or the other is observed; and por filo means nothing more than \"exactly,\" or \"on the very line of midnight.\""
      - es: "Estaba el pueblo en un sosegado silencio, porque todos sus vecinos dormían y reposaban a pierna tendida, como suele decirse."
        literal: "Was the town in a calm silence, because all its residents were-sleeping and were-resting at leg stretched-out, as is-wont to-say-itself."
        ormsby: "The town was in deep silence, for all the inhabitants were asleep, and stretched on the broad of their backs, as the saying is."
        vocab:
          - {w: "sosegado", d: "calm, quiet, peaceful (from 'sosegar', to calm)"}
          - {w: "vecino", d: "inhabitant, householder of a town, not only 'neighbour'"}
          - {w: "reposar", d: "to rest, repose"}
          - {w: "a pierna tendida", d: "sound asleep, 'with legs stretched out': at ease, without a care"}
          - {w: "como suele decirse", d: "as the saying goes, as people say"}
        diagram:
          - s: "Estaba el pueblo"
            r: "main verb: the town was"
            under:
              - {s: "en un sosegado silencio", r: "where/how: in a quiet silence"}
              - s: "porque todos sus vecinos dormían y reposaban"
                r: "why: because all its people were sleeping and resting"
                under:
                  - {s: "a pierna tendida", r: "how: stretched out, sound asleep"}
                  - {s: "como suele decirse", r: "aside: as the saying goes"}
        forms:
          - {w: "Estaba", f: "est- + -aba → estar (to be), imperfect, it (the town). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban. The verb comes before its subject, 'el pueblo'."}
          - {w: "sus vecinos", f: "sus = plural to match 'vecinos', not the owner; 'its inhabitants'."}
          - {w: "dormían", f: "dorm- + -ían → dormir (to sleep), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "reposaban", f: "repos- + -aban → reposar (to rest), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "suele decirse", f: "suel- + -e → soler (to be in the habit of), present, it: suelo, sueles, suele, solemos, soléis, suelen; + decirse, decir (to say) with 'se' on the end, the impersonal 'one says': 'as it is usually said'."}
          - {w: "sosegado", f: "soseg- + -ado → sosegar (to calm), participle used as an adjective, masculine to match 'silencio'; it stands before the noun, a literary order."}
      - es: "Era la noche entreclara, puesto que quisiera Sancho que fuera del todo escura, por hallar en su escuridad disculpa de su sandez."
        literal: "Was the night half-clear, although would-have-wished Sancho that it-were of-the all dark, for to-find in its darkness excuse of his foolishness."
        ormsby: "The night was darkish, though Sancho would have been glad had it been quite dark, so as to find in the darkness an excuse for his blundering."
        vocab:
          - {w: "entreclaro", d: "half-light, dim, neither dark nor clear"}
          - {w: "puesto que", d: "although (Cervantes' usual sense); in modern Spanish it means 'since, because'"}
          - {w: "del todo", d: "completely, altogether"}
          - {w: "escuro", d: "= oscuro, dark (old spelling)"}
          - {w: "escuridad", d: "= oscuridad, darkness (old spelling)"}
          - {w: "disculpa", d: "excuse"}
          - {w: "sandez", d: "foolishness, nonsense: here the lie he told about Dulcinea in Part I"}
        diagram:
          - s: "Era la noche entreclara"
            r: "main verb: the night was half-light"
            under:
              - s: "puesto que quisiera Sancho"
                r: "although: though Sancho would have liked"
                under:
                  - {s: "que fuera del todo escura", r: "what he wanted: for it to be completely dark"}
                  - {s: "por hallar en su escuridad disculpa de su sandez", r: "why: to find in its darkness an excuse for his nonsense"}
        forms:
          - {w: "Era", f: "er- + -a → ser (to be), imperfect, it (the night). ser is irregular in the imperfect: era, eras, era, éramos, erais, eran."}
          - {w: "entreclara", f: "entre- (half, between) + clar- + -a → entreclaro (half-light), feminine to match 'noche'."}
          - {w: "quisiera", f: "quis- + -iera → querer (to want), imperfect subjunctive (-ra form), he, used as a conditional: 'would have liked'. quisiera, quisieras, quisiera, quisiéramos, quisierais, quisieran. Cervantes often uses the -ra form where modern Spanish says 'querría'."}
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), it: 'that it were'. fuera, fueras, fuera, fuéramos, fuerais, fueran. The subjunctive follows a verb of wanting ('quisiera ... que')."}
          - {w: "escura, escuridad", f: "old spellings of oscura (dark, feminine to match 'noche') and oscuridad (darkness): Cervantes writes es- where modern Spanish has os-."}
          - {w: "hallar", f: "infinitive of hallar (to find) after 'por', which here means 'in order to', like 'para'."}
        note: "Sancho needs the dark because in Part I he claimed to have delivered Don Quijote's letter to Dulcinea and seen her sifting wheat, when he never went to El Toboso at all. A visit by daylight would expose him."
      - es: "No se oía en todo el lugar sino ladridos de perros, que atronaban los oídos de don Quijote y turbaban el corazón de Sancho."
        literal: "Not itself was-heard in all the place but barkings of dogs, which were-deafening the ears of Don Quijote and were-troubling the heart of Sancho."
        ormsby: "All over the place nothing was to be heard except the barking of dogs, which deafened the ears of Don Quixote and troubled the heart of Sancho."
        vocab:
          - {w: "lugar", d: "village, town (the usual sense in Cervantes), as well as 'place'"}
          - {w: "no ... sino", d: "nothing but, only"}
          - {w: "ladrido", d: "a bark (of a dog)"}
          - {w: "atronar", d: "to deafen, to thunder in (someone's ears)"}
          - {w: "turbar", d: "to disturb, trouble, upset"}
        diagram:
          - s: "No se oía"
            r: "main verb: there was not heard"
            under:
              - {s: "en todo el lugar", r: "where: in the whole village"}
              - s: "sino ladridos de perros"
                r: "subject: anything but the barking of dogs"
                under:
                  - {s: "que atronaban los oídos de don Quijote", r: "describes 'ladridos': which deafened Don Quijote's ears"}
                  - {s: "y turbaban el corazón de Sancho", r: "describes 'ladridos', 2: and troubled Sancho's heart"}
        forms:
          - {w: "se oía", f: "o- + -ía → oír (to hear), imperfect, it, with 'se' making it passive: 'was heard'. oír in the imperfect: oía, oías, oía, oíamos, oíais, oían. The verb stays singular although 'ladridos' is plural, as often in Cervantes when the verb comes first."}
          - {w: "atronaban", f: "atron- + -aban → atronar (to deafen), imperfect, they (the barks). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "turbaban", f: "turb- + -aban → turbar (to trouble), imperfect, they. Same -aba imperfect."}
      - es: "De cuando en cuando, rebuznaba un jumento, gruñían puercos, mayaban gatos, cuyas voces, de diferentes sonidos, se aumentaban con el silencio de la noche, todo lo cual tuvo el enamorado caballero a mal agüero; pero, con todo esto, dijo a Sancho:"
        literal: "From when to when, was-braying an ass, were-grunting pigs, were-mewing cats, whose voices, of different sounds, themselves-increased with the silence of the night, all which held the enamored knight as bad omen; but, with all this, he-said to Sancho:"
        ormsby: "Now and then an ass brayed, pigs grunted, cats mewed, and the various noises they made seemed louder in the silence of the night; all which the enamoured knight took to be of evil omen; nevertheless he said to Sancho,"
        vocab:
          - {w: "de cuando en cuando", d: "now and then, from time to time"}
          - {w: "rebuznar", d: "to bray (of a donkey)"}
          - {w: "jumento", d: "ass, donkey"}
          - {w: "gruñir", d: "to grunt, growl"}
          - {w: "puerco", d: "pig, hog"}
          - {w: "mayar", d: "= maullar, to mew, miaow (old form)"}
          - {w: "cuyo", d: "whose (agrees with the thing owned)"}
          - {w: "aumentarse", d: "to increase, grow louder"}
          - {w: "tener a mal agüero", d: "to take as a bad omen; 'agüero' = omen, augury"}
          - {w: "con todo esto", d: "nevertheless, for all that"}
        diagram:
          - s: "rebuznaba un jumento, gruñían puercos, mayaban gatos"
            r: "main verbs 1: a donkey brayed, pigs grunted, cats mewed"
            under:
              - {s: "De cuando en cuando", r: "when: now and then"}
              - s: "cuyas voces, de diferentes sonidos, se aumentaban"
                r: "describes the animals: whose voices, all different, grew louder"
                under:
                  - {s: "con el silencio de la noche", r: "why: with the silence of the night"}
          - s: "todo lo cual tuvo el enamorado caballero"
            r: "main verb 2: all of which the lovesick knight took"
            under:
              - {s: "a mal agüero", r: "as what: as a bad omen"}
          - s: "dijo a Sancho:"
            r: "main verb 3 (after 'pero'): he said to Sancho"
            under:
              - {s: "con todo esto", r: "how: nevertheless"}
        forms:
          - {w: "rebuznaba", f: "rebuzn- + -aba → rebuznar (to bray), imperfect, it (a donkey). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "gruñían", f: "gruñ- + -ían → gruñir (to grunt), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "mayaban", f: "may- + -aban → mayar (to mew), imperfect, they. Same -aba imperfect as 'rebuznaba'."}
          - {w: "cuyas", f: "cuy- + -as → cuyo (whose), feminine plural to match 'voces', the thing owned, not the animals that own them."}
          - {w: "se aumentaban", f: "aument- + -aban → aumentarse (to grow), imperfect, they (the voices), with 'se': 'grew louder'. Same -aba imperfect."}
          - {w: "tuvo", f: "tuv- + -o → tener (to hold), preterite, he. Irregular: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron. 'tener a' = to take as, to regard as."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
        note: "Don Quijote is always reading omens: in the previous chapter a neigh and a bray sent them off in good spirits. Here the barking and braying of a sleeping village are the opposite of the music a knight expects outside his lady's palace."
  - sentences:
      - es: "— Sancho, hijo, guía al palacio de Dulcinea: quizá podrá ser que la hallemos despierta."
        literal: "— Sancho, son, guide to-the palace of Dulcinea: perhaps it-will-be-able to-be that her we-may-find awake."
        ormsby: "“Sancho, my son, lead on to the palace of Dulcinea, it may be that we shall find her awake.”"
        vocab:
          - {w: "hijo", d: "son; as a form of address, an affectionate 'my boy, my lad'"}
          - {w: "guiar", d: "to lead the way, guide"}
          - {w: "quizá podrá ser que", d: "perhaps it may be that: two hedges in a row"}
          - {w: "despierto", d: "awake"}
        diagram:
          - s: "guía al palacio de Dulcinea"
            r: "main verb 1: lead the way to Dulcinea's palace"
            under:
              - {s: "Sancho, hijo", r: "who is addressed: Sancho, my boy"}
          - s: "quizá podrá ser"
            r: "main verb 2: perhaps it may be"
            under:
              - {s: "que la hallemos despierta", r: "what may be: that we find her awake"}
        forms:
          - {w: "guía", f: "gui- + -a → guiar (to lead), imperative, you (tú): 'lead!'. The tú imperative of regular verbs is the same as the he-form of the present: guía, come, vive. The accent on í keeps the i stressed."}
          - {w: "al", f: "a + el = al, 'to the'."}
          - {w: "podrá", f: "podr- + -á → poder (to be able), future, it. Irregular stem podr-: podré, podrás, podrá, podremos, podréis, podrán."}
          - {w: "la hallemos", f: "hall- + -emos → hallar (to find), present subjunctive, we, after 'podrá ser que'. The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en. 'la' (her, Dulcinea) is the object, placed before the verb."}
          - {w: "despierta", f: "despiert- + -a → despierto (awake), feminine to match 'la' (Dulcinea)."}
        note: "In the romances the knight arrives at the castle and the lady comes to the window. Don Quijote expects the same at midnight in a farming village, where everyone is in bed."
  - sentences:
      - es: "— ¿A qué palacio tengo de guiar, cuerpo del sol —respondió Sancho—, que en el que yo vi a su grandeza no era sino casa muy pequeña?"
        literal: "— To what palace have-I of to-guide, body of-the sun —answered Sancho—, for [the house] in the [one] that I saw [to] her greatness not was but house very small?"
        ormsby: "“Body of the sun! what palace am I to lead to,” said Sancho, “when what I saw her highness in was only a very little house?”"
        vocab:
          - {w: "tener de", d: "= tener que, to have to, must (old construction)"}
          - {w: "cuerpo del sol", d: "'body of the sun!', a mild oath on the pattern of the many oaths beginning 'cuerpo de ...'"}
          - {w: "su grandeza", d: "'her greatness', 'her highness': Sancho mockingly gives Dulcinea a royal title"}
          - {w: "no ... sino", d: "nothing but, only"}
        diagram:
          - s: "¿A qué palacio tengo de guiar"
            r: "main verb: what palace am I to lead to?"
            under:
              - {s: "cuerpo del sol", r: "oath: body of the sun!"}
              - {s: "respondió Sancho", r: "speech tag: answered Sancho"}
              - s: "que en el que yo vi a su grandeza no era sino casa muy pequeña?"
                r: "why: for the one I saw her in was only a very small house"
                under:
                  - {s: "en el que yo vi a su grandeza", r: "subject: the (palace) in which I saw her highness"}
        forms:
          - {w: "tengo de guiar", f: "teng- + -o → tener (to have), present, I: tengo, tienes, tiene, tenemos, tenéis, tienen; + de + guiar (to lead): 'must I lead', the old form of 'tengo que guiar'."}
          - {w: "del", f: "de + el = del, 'of the'."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "vi", f: "ver (to see), preterite, I. ver in the preterite: vi, viste, vio, vimos, visteis, vieron. 'a su grandeza': the personal 'a' before a person as object."}
          - {w: "era", f: "er- + -a → ser (to be), imperfect, it. ser in the imperfect: era, eras, era, éramos, erais, eran."}
          - {w: "pequeña", f: "pequeñ- + -a → pequeño (small), feminine to match 'casa'."}
        note: "Sancho keeps up his story from Part I, where he claimed to have found Dulcinea at home. In fact he has never seen her house any more than his master has, and is bluffing in the dark."
  - sentences:
      - es: "— Debía de estar retirada, entonces —respondió don Quijote—, en algún pequeño apartamiento de su alcázar, solazándose a solas con sus doncellas, como es uso y costumbre de las altas señoras y princesas."
        literal: "— She-must of to-be withdrawn, then —answered Don Quijote—, in some small apartment of her castle, amusing-herself in private with her maidens, as is use and custom of the high ladies and princesses."
        ormsby: "“Most likely she had then withdrawn into some small apartment of her palace,” said Don Quixote, “to amuse herself with damsels, as great ladies and princesses are accustomed to do.”"
        vocab:
          - {w: "deber de", d: "must (a guess, probability): 'debía de estar' = she must have been"}
          - {w: "retirado", d: "withdrawn, retired (into a private room)"}
          - {w: "apartamiento", d: "private room or set of rooms, an apartment in a palace (not a modern flat)"}
          - {w: "alcázar", d: "castle, fortified royal palace (from Arabic 'al-qasr')"}
          - {w: "solazarse", d: "to amuse oneself, take one's ease"}
          - {w: "a solas", d: "alone, in private"}
          - {w: "doncella", d: "maiden; here a lady-in-waiting"}
          - {w: "uso y costumbre", d: "custom and practice, a fixed legal pair meaning 'the custom'"}
        diagram:
          - s: "Debía de estar retirada"
            r: "main verb: she must have been withdrawn"
            under:
              - {s: "entonces", r: "when: then (when you saw her)"}
              - {s: "respondió don Quijote", r: "speech tag: answered Don Quijote"}
              - {s: "en algún pequeño apartamiento de su alcázar", r: "where: in some small room of her castle"}
              - {s: "solazándose a solas con sus doncellas", r: "how: taking her ease in private with her maidens"}
              - {s: "como es uso y costumbre de las altas señoras y princesas", r: "aside: as is the custom of great ladies and princesses"}
        forms:
          - {w: "Debía de estar", f: "deb- + -ía → deber (must), imperfect, she: debía, debías, debía, debíamos, debíais, debían (the imperfect of -er verbs); + de + estar (to be): 'she must have been', a guess about the past."}
          - {w: "retirada", f: "retir- + -ada → retirar (to withdraw), participle, feminine to match Dulcinea, the understood subject."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "algún", f: "alguno (some) clipped before a masculine singular noun ('apartamiento'), like un, buen, ningún."}
          - {w: "solazándose", f: "solaz- + -ando + se → solazarse (to take one's ease), gerund with 'se' stuck on the end; the accent is added to keep the stress on 'zán'."}
          - {w: "sus doncellas", f: "sus = plural to match 'doncellas', not the owner; 'her maidens'."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "altas", f: "alt- + -as → alto (high), feminine plural to match 'señoras'; 'altas señoras' = great ladies."}
        note: "Don Quijote turns Sancho's 'very small house' into a small room of a great palace, the same trick he used in the previous chapter on the farmyard walls. Whatever Sancho reports, the romance is saved."
  - sentences:
      - es: "— Señor —dijo Sancho—, ya que vuestra merced quiere, a pesar mío, que sea alcázar la casa de mi señora Dulcinea, ¿es hora ésta por ventura de hallar la puerta abierta?"
        literal: "— Sir —said Sancho—, since your grace wants, in spite of-mine, that be castle the house of my lady Dulcinea, is hour this by chance of to-find the door open?"
        ormsby: "“Señor,” said Sancho, “if your worship will have it in spite of me that the house of my lady Dulcinea is a palace, is this an hour, think you, to find the door open;"
        vocab:
          - {w: "ya que", d: "since, seeing that"}
          - {w: "vuestra merced", d: "'your grace', the polite 'you' (ancestor of 'usted'); it takes a he/she verb"}
          - {w: "a pesar mío", d: "in spite of me, against my will"}
          - {w: "por ventura", d: "by any chance; in a question, 'do you suppose?'"}
          - {w: "hora de", d: "the time for, an hour for (doing something)"}
        diagram:
          - s: "¿es hora ésta"
            r: "main verb: is this the time?"
            under:
              - {s: "Señor", r: "who is addressed: sir"}
              - s: "ya que vuestra merced quiere, a pesar mío"
                r: "why: since you want, against my will"
                under:
                  - {s: "que sea alcázar la casa de mi señora Dulcinea", r: "what you want: that my lady Dulcinea's house be a castle"}
              - {s: "por ventura", r: "how: by any chance, do you suppose"}
              - {s: "de hallar la puerta abierta?", r: "the time for what: to find the door open"}
        forms:
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "quiere", f: "quier- + -e → querer (to want), present, you (vuestra merced takes the he-form). The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "sea", f: "ser (to be), present subjunctive, it, after 'quiere que' (wants that). ser in the present subjunctive: sea, seas, sea, seamos, seáis, sean. The subject, 'la casa ...', comes after it."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "ésta", f: "est- + -a → este (this), feminine to match 'hora'; written with an accent when it stands alone as a pronoun."}
          - {w: "abierta", f: "irregular participle of abrir (to open), feminine to match 'puerta'."}
      - es: "Y ¿será bien que demos aldabazos para que nos oyan y nos abran, metiendo en alboroto y rumor toda la gente?"
        literal: "And will-it-be well that we-may-give knocker-blows so-that us they-may-hear and to-us they-may-open, putting into uproar and noise all the people?"
