          - {w: "atravesar", d: "to cross, go through"}
          - {w: "umbral", d: "threshold; the plural is poetic"}
          - {w: "de oídas", d: "by hearsay, from what one has heard"}
          - {w: "fama de", d: "a reputation for being"}
          - {w: "discreto", d: "wise, sensible, witty (not 'discreet' in the modern sense)"}
        diagram:
          - s: "¿no te he dicho mil veces"
            r: "main verb: have I not told you a thousand times"
            under:
              - s: "que en todos los días de mi vida no he visto a la sin par Dulcinea"
                r: "what I told you, 1: that I have never in my life seen the peerless Dulcinea"
              - {s: "ni jamás atravesé los umbrales de su palacio", r: "what I told you, 2: nor ever crossed the threshold of her palace"}
              - s: "y que sólo estoy enamorado"
                r: "what I told you, 3: and that I am in love only"
                under:
                  - {s: "de oídas", r: "how, 1: by hearsay"}
                  - s: "y de la gran fama"
                    r: "how, 2: and by the great fame"
                    under:
                      - {s: "que tiene de hermosa y discreta?", r: "describes 'fama': that she has for beauty and wit"}
        forms:
          - {w: "te he dicho", f: "he → haber (to have), present, I: he, has, ha, hemos, habéis, han; + dicho, irregular participle of decir (to tell): 'I have told you'."}
          - {w: "veces", f: "plural of vez (time): z becomes c before e."}
          - {w: "he visto", f: "he → haber (to have), present, I (same forms: he, has, ha, hemos, habéis, han) + visto, irregular participle of ver (to see)."}
          - {w: "atravesé", f: "atraves- + -é → atravesar (to cross), preterite, I. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "estoy enamorado", f: "estoy → estar (to be), present, I: estoy, estás, está, estamos, estáis, están; + enamorado, participle of enamorar (to make fall in love), masculine to match 'yo'."}
          - {w: "gran", f: "grande (great) clipped before a singular noun ('fama')."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, she. Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "hermosa y discreta", f: "hermos- + -a, discret- + -a → hermoso (beautiful), discreto (wise), feminine to match Dulcinea."}
        note: "This contradicts Part I, where Don Quijote told Sancho that Dulcinea was Aldonza Lorenzo, a farm girl he had seen barely four times in twelve years. Loving by hearsay is a convention of courtly love poetry, but it also gets him out of having to recognize her."
