  - sentences:
      - es: "Mala la hubistes, franceses,"
        literal: "Bad it you-had, Frenchmen,"
        ormsby: "Ill did ye fare, ye men of France,"
        vocab:
          - {w: "haberla mala", d: "to come off badly, have a bad time of it; 'la' is a vague 'it', the affair"}
          - {w: "franceses", d: "Frenchmen: Charlemagne's army in the ballad"}
        diagram:
          - s: "Mala la hubistes"
            r: "main verb: you came off badly"
            under:
              - {s: "franceses", r: "who is addressed: you Frenchmen"}
        forms:
          - {w: "hubistes", f: "hub- + -istes → haber (to have), preterite, you (plural), old form of 'hubisteis'. The preterite of haber: hube, hubiste, hubo, hubimos, hubisteis, hubieron; the ballads often drop the i of -isteis."}
