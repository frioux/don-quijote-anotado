  - sentences:
      - es: "— ¿Sabréisme decir, buen amigo, que buena ventura os dé Dios, dónde son por aquí los palacios de la sin par princesa doña Dulcinea del Toboso?"
        literal: "— Will-you-know-me to-tell, good friend, that good fortune to-you may-give God, where are around here the palaces of the without peer princess Lady Dulcinea of El Toboso?"
        ormsby: "“Can you tell me, worthy friend, and God speed you, whereabouts here is the palace of the peerless princess Doña Dulcinea del Toboso?”"
        vocab:
          - {w: "saber decir", d: "to be able to tell, know how to tell"}
          - {w: "que buena ventura os dé Dios", d: "God give you good fortune: a polite blessing slipped into a request"}
          - {w: "ser (for place)", d: "Cervantes can use 'ser' for where something is: 'dónde son' = where are"}
          - {w: "por aquí", d: "around here, hereabouts"}
          - {w: "sin par", d: "peerless"}
          - {w: "doña", d: "Lady, the title of a noblewoman, used before the first name"}
        diagram:
          - s: "¿Sabréisme decir"
            r: "main verb: can you tell me?"
            under:
              - {s: "buen amigo", r: "who is addressed: good friend"}
              - {s: "que buena ventura os dé Dios", r: "aside, a blessing: may God give you good fortune"}
              - s: "dónde son por aquí los palacios"
                r: "what to tell: where the palaces are around here"
                under:
                  - {s: "de la sin par princesa doña Dulcinea del Toboso?", r: "whose: of the peerless princess Doña Dulcinea del Toboso"}
        forms:
          - {w: "Sabréisme", f: "sabr- + -éis + me → saber (to know), future, you (vos), with 'me' stuck on the end; modern 'me sabréis'. Irregular stem sabr-: sabré, sabrás, sabrá, sabremos, sabréis, sabrán. Cervantes hangs pronouns on a verb that opens the sentence. Don Quijote uses the plural 'vos' form, the courteous way to address a stranger of lower rank."}
          - {w: "buen", f: "bueno (good) clipped before a masculine singular noun ('amigo')."}
          - {w: "dé", f: "dar (to give), present subjunctive, he (God), in a wish. dé, des, dé, demos, deis, den. 'os' = to you, matching 'vos'."}
          - {w: "son", f: "ser (to be), present, they: soy, eres, es, somos, sois, son. Modern Spanish would use estar (to be) for location: 'dónde están'."}
        note: "Don Quijote puts his question in the full style of the romances, palaces, peerless princess and all, to a farmhand on his way to plough. The plural 'palacios' is the grand style too: a royal residence."
  - sentences:
      - es: "— Señor —respondió el mozo—, yo soy forastero y ha pocos días que estoy en este pueblo, sirviendo a un labrador rico en la labranza del campo;"
        literal: "— Sir —answered the lad—, I am outsider and [it] has few days that I-am in this town, serving [to] a farmer rich in the tillage of-the field;"
        ormsby: "“Señor,” replied the lad, “I am a stranger, and I have been only a few days in the town, doing farm work for a rich farmer."
        vocab:
          - {w: "mozo", d: "young man, lad; also a hired hand"}
          - {w: "forastero", d: "stranger, outsider, someone not from the town (not 'forester')"}
          - {w: "ha pocos días que", d: "= hace pocos días que, for only a few days"}
          - {w: "labranza del campo", d: "farm work, work in the fields"}
        diagram:
          - s: "yo soy forastero"
            r: "main verb 1: I am a stranger"
            under:
              - {s: "Señor", r: "who is addressed"}
              - {s: "respondió el mozo", r: "speech tag: answered the lad"}
          - s: "y ha pocos días"
            r: "main verb 2: and it is only a few days"
            under:
              - s: "que estoy en este pueblo"
                r: "what has lasted a few days: that I have been in this town"
                under:
                  - {s: "sirviendo a un labrador rico en la labranza del campo", r: "how: working for a rich farmer in the fields"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "soy", f: "ser (to be), present, I: soy, eres, es, somos, sois, son."}
          - {w: "ha", f: "ha → haber (to have), present, it, used for time where modern Spanish uses hacer (to make): 'ha pocos días' = hace pocos días, a few days ago / for a few days."}
          - {w: "estoy", f: "estar (to be), present, I: estoy, estás, está, estamos, estáis, están. Spanish uses the present for 'I have been here (and still am)'."}
          - {w: "sirviendo", f: "sirv- + -iendo → servir (to serve), gerund: 'serving, working for'. The stem e becomes i in the gerund: servir → sirviendo."}
          - {w: "este", f: "'this', masculine singular to match 'pueblo'."}
          - {w: "del", f: "de + el = del, 'of the'."}
        note: "The narrator called him a 'labrador'; now he is a 'mozo', a hired lad working for a rich farmer. A newcomer is the worst possible guide to El Toboso, which suits Sancho well."
