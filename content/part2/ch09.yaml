        note: "Misquoted as 'Con la Iglesia hemos topado' ('we have run into the Church'), this became a Spanish byword for coming up against the power of the Church. In Cervantes it simply means they have found the parish church instead of a palace."
  - sentences:
      - es: "— Ya lo veo —respondió Sancho—; y plega a Dios que no demos con nuestra sepultura, que no es buena señal andar por los cimenterios a tales horas, y más, habiendo yo dicho a vuestra merced, si mal no me acuerdo, que la casa desta señora ha de estar en una callejuela sin salida."
        literal: "— Already it I-see —answered Sancho—; and may-it-please [to] God that not we-may-hit with our grave, for not is good sign to-walk through the cemeteries at such hours, and more, having I said to your grace, if badly not I-remember, that the house of-this lady has to be in a little-street without exit."
        ormsby: "“So I see,” said Sancho, “and God grant we may not light upon our graves; it is no good sign to find oneself wandering in a graveyard at this time of night; and that, after my telling your worship, if I don’t mistake, that the house of this lady will be in an alley without an outlet.”"
        vocab:
          - {w: "ya lo veo", d: "so I see, I can see that"}
          - {w: "plega a Dios", d: "God grant, please God (old form of 'plegue a Dios')"}
          - {w: "sepultura", d: "grave, burial place"}
          - {w: "señal", d: "sign, omen"}
          - {w: "cimenterio", d: "= cementerio, cemetery, churchyard (old form)"}
          - {w: "a tales horas", d: "at such an hour, at this time of night"}
          - {w: "y más", d: "and all the more so, especially"}
          - {w: "si mal no me acuerdo", d: "if I remember rightly"}
          - {w: "desta", d: "= de esta, of this (old contraction)"}
          - {w: "haber de", d: "to be bound to, must"}
          - {w: "callejuela", d: "alley, narrow lane (diminutive of 'calle')"}
          - {w: "sin salida", d: "with no way out, dead-end"}
        diagram:
          - s: "Ya lo veo"
            r: "main verb 1: I can see that"
            under:
              - {s: "respondió Sancho", r: "speech tag: answered Sancho"}
          - s: "y plega a Dios"
            r: "main verb 2: and God grant"
            under:
              - {s: "que no demos con nuestra sepultura", r: "what God should grant: that we do not run into our grave"}
              - s: "que no es buena señal"
                r: "why: for it is not a good sign"
                under:
                  - {s: "andar por los cimenterios a tales horas", r: "subject: to walk about churchyards at such an hour"}
                  - s: "y más, habiendo yo dicho a vuestra merced"
                    r: "all the more, since I told your worship"
                    under:
                      - {s: "si mal no me acuerdo", r: "aside: if I remember rightly"}
                      - {s: "que la casa desta señora ha de estar en una callejuela sin salida", r: "what I said: that this lady's house must be in a dead-end alley"}
        forms:
          - {w: "veo", f: "ver (to see), present, I: veo, ves, ve, vemos, veis, ven."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "plega", f: "old present subjunctive of placer (to please), it: 'may it please'. It survives almost only in this it-form in wishes; the regular modern subjunctive is plazca, plazcas, plazca, plazcamos, plazcáis, plazcan."}
          - {w: "demos", f: "dar (to give), present subjunctive, we, after 'plega a Dios que'. dar in the present subjunctive: dé, des, dé, demos, deis, den."}
          - {w: "es", f: "ser (to be), present, it: soy, eres, es, somos, sois, son."}
          - {w: "andar", f: "infinitive of andar (to walk, go about) used as the subject: 'walking about ... is not a good sign'."}
          - {w: "habiendo yo dicho", f: "habiendo, gerund of haber (to have), + dicho, irregular participle of decir (to say): 'I having said'; the subject 'yo' comes between them, as Cervantes allows."}
          - {w: "me acuerdo", f: "acuerd- + -o → acordarse (to remember), present, I. The stem o becomes ue when stressed: me acuerdo, te acuerdas, se acuerda, nos acordamos, os acordáis, se acuerdan."}
          - {w: "desta", f: "de + esta = desta, 'of this'; modern Spanish writes 'de esta'."}
          - {w: "ha de estar", f: "ha → haber (to have), present, it: he, has, ha, hemos, habéis, han; + de + estar (to be): 'must be, is bound to be'."}
        note: "Churchyards lay around the parish church, and the dead were buried in and beside it, so finding the church means walking among graves at midnight. Sancho's claim that he once said the house was in a blind alley looks like a new invention, a ready excuse for not finding it."
