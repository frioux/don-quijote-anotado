          - {w: "llamar", d: "to knock at (a door), as well as 'to call'"}
          - {w: "manceba", d: "mistress, concubine"}
          - {w: "abarraganado", d: "a man living with a 'barragana', a kept woman; one in open concubinage"}
          - {w: "por tarde que sea", d: "however late it may be"}
        diagram:
          - s: "¿Vamos"
            r: "main verb: are we going?"
            under:
