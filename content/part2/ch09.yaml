      - es: "No porque yo diga que ni he visto ni hablado a la señora de mi alma has tú de decir también que ni la has hablado ni visto, siendo tan al revés como sabes."
        literal: "Not because I may-say that neither I-have seen nor spoken to the lady of my soul have you of to-say also that neither her you-have spoken nor seen, being so to-the reverse as you-know."
        ormsby: "if I tell thee that I have neither seen nor spoken to the lady of my heart, it is no reason why thou shouldst say thou hast not spoken to her or seen her, when the contrary is the case, as thou well knowest.”"
        vocab:
          - {w: "no porque", d: "not because ..., i.e. just because ... does not mean"}
          - {w: "señora de mi alma", d: "lady of my soul, my heart's lady"}
          - {w: "haber de", d: "to have to, must"}
          - {w: "al revés", d: "the other way round, the opposite"}
        diagram:
          - s: "has tú de decir también"
            r: "main verb: must you say too"
            under:
              - s: "No porque yo diga"
                r: "why (denied): not just because I say"
                under:
                  - {s: "que ni he visto ni hablado a la señora de mi alma", r: "what I say: that I have neither seen nor spoken to my soul's lady"}
              - {s: "que ni la has hablado ni visto", r: "what you say: that you have neither spoken to nor seen her"}
              - {s: "siendo tan al revés como sabes", r: "although: when it is quite the other way, as you know"}
        forms:
          - {w: "diga", f: "dig- + -a → decir (to say), present subjunctive, I, after 'no porque' (not because). decir in the present subjunctive: diga, digas, diga, digamos, digáis, digan."}
          - {w: "he visto, hablado", f: "he → haber (to have), present, I: he, has, ha, hemos, habéis, han; + visto, irregular participle of ver (to see), and hablado, participle of hablar (to speak): one 'he' serves both."}
          - {w: "has tú de decir", f: "has → haber (to have), present, you (tú): same forms, he, has, ha, hemos, habéis, han; + de + decir (to say): 'must you say'."}
          - {w: "la has hablado", f: "has + hablado: haber (to have) + participle of hablar (to speak), 'you have spoken to her'. 'la' for 'le' (to her) is laísmo, using the direct-object 'la' where standard Spanish has 'le'."}
          - {w: "siendo", f: "gerund of ser (to be): 'it being'."}
          - {w: "sabes", f: "sab- + -es → saber (to know), present, you (tú): sé, sabes, sabe, sabemos, sabéis, saben."}
        note: "Don Quijote cannot let Sancho's confession stand: if Sancho never saw Dulcinea, the whole story of her answer collapses. So he treats the truth as a joke."
  - sentences:
      - es: "Estando los dos en estas pláticas, vieron que venía a pasar por donde estaban uno con dos mulas, que, por el ruido que hacía el arado, que arrastraba por el suelo, juzgaron que debía de ser labrador, que habría madrugado antes del día a ir a su labranza; y así fue la verdad."
        literal: "Being the two in these talks, they-saw that was-coming to pass by where they-were one with two mules, who, by the noise that was-making the plough, which was-dragging along the ground, they-judged that he-must of be farmer, who would-have risen-early before of-the day to go to his tillage; and so was the truth."
        ormsby: "While the two were engaged in this conversation, they perceived someone with a pair of mules approaching the spot where they stood, and from the noise the plough made, as it dragged along the ground, they guessed him to be some labourer who had got up before daybreak to go to his work, and so it proved to be."
        vocab:
          - {w: "plática", d: "talk, conversation"}
          - {w: "venir a pasar", d: "to come by, come along past"}
          - {w: "uno", d: "someone, a man"}
          - {w: "arado", d: "plough"}
          - {w: "arrastrar", d: "to drag, trail"}
          - {w: "juzgar", d: "to judge, conclude"}
          - {w: "labrador", d: "farmer, farm labourer, peasant who works the land"}
          - {w: "madrugar", d: "to get up early, before dawn"}
          - {w: "labranza", d: "farm work, ploughing; also the farmland itself"}
          - {w: "así fue la verdad", d: "and so it turned out to be"}
        diagram:
          - s: "vieron"
            r: "main verb 1: they saw"
            under:
              - {s: "Estando los dos en estas pláticas", r: "when: while the two were in this talk"}
              - s: "que venía a pasar"
                r: "what they saw: that there was coming by"
                under:
                  - {s: "por donde estaban", r: "where: past where they were"}
                  - s: "uno con dos mulas"
                    r: "subject: a man with two mules"
                    under:
                      - s: "que, por el ruido"
                        r: "describes 'uno': whom, from the noise"
                        under:
                          - {s: "que hacía el arado", r: "describes 'ruido': that the plough made"}
                          - {s: "que arrastraba por el suelo", r: "describes 'arado': which dragged along the ground"}
                      - s: "juzgaron que debía de ser labrador"
                        r: "they judged he must be a farmer"
                        under:
                          - {s: "que habría madrugado antes del día a ir a su labranza", r: "describes 'labrador': who must have got up before dawn to go to his ploughing"}
          - {s: "y así fue la verdad", r: "main verb 2: and so it was"}
        forms:
          - {w: "Estando", f: "gerund of estar (to be): 'the two being in ...', 'while they were'."}
          - {w: "vieron", f: "ver (to see), preterite, they: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "venía", f: "ven- + -ía → venir (to come), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "estaban", f: "est- + -aban → estar (to be), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "hacía", f: "hac- + -ía → hacer (to make), imperfect, it. Same -ía imperfect as 'venía'."}
          - {w: "arrastraba", f: "arrastr- + -aba → arrastrar (to drag), imperfect, he (the man drags the plough) or it (the plough trails). Same -aba imperfect as 'estaban'."}
          - {w: "juzgaron", f: "juzg- + -aron → juzgar (to judge), preterite, they. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron (juzgué, with g → gu before e)."}
          - {w: "debía de ser", f: "deb- + -ía → deber (must), imperfect, he: debía, debías, debía, debíamos, debíais, debían; + de + ser (to be): 'he must be', a guess."}
          - {w: "habría madrugado", f: "habr- + -ía → haber (to have), conditional, he: habría, habrías, habría, habríamos, habríais, habrían; + madrugado, participle of madrugar (to get up early): 'he would have got up early', a guess about the past ('must have got up')."}
          - {w: "ir", f: "infinitive of ir (to go) after 'a', saying what for."}
          - {w: "fue", f: "ser (to be), preterite, it: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "del", f: "de + el = del: 'antes del día', before daybreak."}
        note: "The 'one with two mules' is introduced like a figure in a romance seen at a distance, and identified by sound alone in the half-dark; the narrator then confirms the guess flatly."
