          - {w: "burla", d: "joke, jest"}
          - {w: "caer mal, parecer mal", d: "to be out of place, look bad, go down badly"}
        diagram:
          - s: "tiempos hay de burlar"
            r: "main verb 1: there are times for jesting"
            under:
              - {s: "Sancho, Sancho", r: "who is addressed"}
              - {s: "respondió don Quijote", r: "speech tag: answered Don Quijote"}
          - s: "y tiempos"
            r: "main verb 1 continued: and (there are) times"
            under:
              - {s: "donde caen y parecen mal las burlas", r: "describes 'tiempos': when jokes fall flat and look bad"}
        forms:
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "hay", f: "the 'there is / there are' form of haber (to have), the same for singular and plural."}
          - {w: "burlar", f: "infinitive of burlar (to jest) after 'de': 'times for jesting'."}
          - {w: "caen", f: "ca- + -en → caer (to fall), present, they (the jokes). Irregular I-form: caigo, caes, cae, caemos, caéis, caen."}
