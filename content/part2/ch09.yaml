          - {w: "cantar", f: "infinitive of cantar (to sing) after 'pudiera'."}
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), it, used as a conditional: 'it would be'. fuera, fueras, fuera, fuéramos, fuerais, fueran."}
          - {w: "sucedernos", f: "suceder (to happen) + nos (to us), the pronoun hung on the infinitive after 'para'."}
        note: "Sancho is the sceptic here: a ballad about a defeat is no more an omen than any other old song. Ormsby notes that both ballads were among the most popular of the Carolingian cycle."
        ormsby_note: "Another even more popular ballad of the same group, beginning, \"Ya cabalga Calaínos.\" Both are in the undated Cancionero of Antwerp, and in Duran's Romancero, numbers 402 and 373."
