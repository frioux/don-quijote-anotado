      - es: "¿no te he dicho mil veces que en todos los días de mi vida no he visto a la sin par Dulcinea, ni jamás atravesé los umbrales de su palacio, y que sólo estoy enamorado de oídas y de la gran fama que tiene de hermosa y discreta?"
        literal: "not to-you have-I said thousand times that in all the days of my life not I-have seen [to] the without peer Dulcinea, nor ever I-crossed the thresholds of her palace, and that only I-am enamored by hearings and by the great fame that she-has of beautiful and wise?"
        ormsby: "have I not told thee a thousand times that I have never once in my life seen the peerless Dulcinea or crossed the threshold of her palace, and that I am enamoured solely by hearsay and by the great reputation she bears for beauty and discretion?”"
        vocab:
