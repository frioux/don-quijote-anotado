          - {w: "trujiste", f: "truj- + -iste → traer (to bring), preterite, you (tú), old form. Cervantes' forms: truje, trujiste, trujo, trujimos, trujisteis, trujeron; modern traje, trajiste, trajo, trajimos, trajisteis, trajeron."}
          - {w: "envié", f: "envi- + -é → enviar (to send), preterite, I. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron. 'le' = to her."}
