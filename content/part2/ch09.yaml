summary: |
  At midnight, more or less, Don Quijote and Sancho ride out of the oak grove into El Toboso. The village is asleep; the night is half-dark, though Sancho would like it pitch black to hide his lie, and only barking dogs, a braying donkey, grunting pigs and mewing cats break the silence. Don Quijote takes all this as a bad omen, but tells Sancho to lead the way to Dulcinea's palace.

  Sancho objects that what he saw was a very small house, and that no respectable household opens its door at midnight to anyone but a man visiting his mistress. Don Quijote leads instead towards a great dark mass, which turns out to be the tower of the parish church. Sancho, uneasy among the graves, now claims he always said the house was in a blind alley, and asks to search the lanes alone. When Don Quijote reminds him that he himself has never seen Dulcinea and loves her only by hearsay, Sancho seizes the moment to say that he has not seen her either, and that his visit and her answer were hearsay too. Don Quijote will not take this as anything but an ill-timed joke.

  A farmhand comes by with two mules and a plough, singing the ballad of the French defeat at Roncesvalles. Don Quijote takes it as another bad omen; Sancho says he might as well be singing the ballad of Calaínos. Asked where the palaces of the peerless princess Doña Dulcinea are, the lad says he is a newcomer, that the priest and the sexton opposite keep a list of everyone in the village, and that he doubts there is any princess there, though there are many ladies of quality, each a princess in her own house. Then he drives on, because day is breaking.

  Sancho, desperate to get his master out of town before he discovers the lie, proposes that Don Quijote hide in a wood outside the village while he comes back by day to search every nook for Dulcinea's house and arrange a meeting. Don Quijote gratefully agrees. Two miles from El Toboso Don Quijote hides in a grove while Sancho returns on his embassy, where things happen to him that call for fresh attention and fresh belief.
context: |
  The narrator's games. The chapter title, 'Where is told what will be seen in it', promises nothing, and the chapter opens with a ballad line, 'Media noche era por filo', the first line of the romance of Count Claros, then deflates it at once with 'poco más a menos'. Ormsby's note explains 'por filo': 'exactly', on the line of the balance. The chapter is a delay: knight and squire arrive at Dulcinea's town and leave it without finding her, and the last line asks the reader for 'nuevo crédito', fresh belief, for what is coming. Ormsby renders this freely as 'a new chapter'.

  Dulcinea and Sancho's lie. In Part I Don Quijote sent Sancho from the Sierra Morena with a letter to Dulcinea; Sancho forgot the letter, never went to El Toboso, and on his return made up a meeting with her sifting wheat in her farmyard. Don Quijote had told him there that Dulcinea was Aldonza Lorenzo, a village girl he had seen only a few times. Now he says he has never seen her at all and loves her by hearsay, as the lovers of courtly poetry loved distant ladies from their fame. Sancho tries to slip out of his own lie through the same gap, saying his visit was hearsay too, and Don Quijote refuses to hear it. The narrator ends by stating plainly what Sancho is afraid of: that his master will find out the answer from Dulcinea was false.

  Ballads. Spanish ballads ('romances') were sung by everyone, and the farmhand's song comes from the Carolingian cycle: the rout of Charlemagne's army at Roncesvalles in the Pyrenees, where Roland and the rearguard died. As Ormsby notes, the ballad usually begins 'Mala la vistes, franceses, la caza de Roncesvalles', and the ballad of Calaínos, the Moor who challenged Charlemagne's peers, was even more popular. Don Quijote hears a song of defeat as an omen; Sancho, for once the sceptic, says any old ballad would do as well.

  Village life. El Toboso is a farming village in La Mancha, and the scene is exact: everyone asleep at midnight, a labourer setting out with his mules before dawn to plough a rich farmer's land, the priest and sexton living opposite the church. Ormsby notes that the church tower of El Toboso really is unusually massive. The dead were buried in and around the parish church, so to stumble on the church is to stumble among graves, which is why Sancho fears they may 'find their own burial'. Parish priests kept registers of their parishioners, which is why the lad sends Don Quijote to them. Sancho's picture of men who knock at any hour on their mistresses' doors, the 'abarraganados' who kept a 'barragana', is the opposite of a respectable house closed at night.

  Names and words. 'Con la iglesia hemos dado, Sancho' became a Spanish byword in the misquoted form 'Con la Iglesia hemos topado', 'we have run into the Church', used of clashes with Church power; Cervantes means only that they have found the church instead of the palace. Ormsby flags two proverbs: 'en cada tierra su uso', every land has its customs, and 'no arrojemos la soga tras el caldero', let us not throw the rope after the bucket. The lad's 'each a princess in her own house' plays on 'cada uno es rey en su casa'. Don Quijote calls Sancho a 'hereje', heretic, for doubting the article of faith that is Dulcinea.

  Reading Cervantes' Spanish. Old spellings and forms in this chapter: escura and escuridad (oscura, oscuridad), docientos (doscientos), cimenterios (cementerios), desta, desa, dellos (de esta, de esa, de ellos), trujiste and truje (trajiste, traje), oyan (oigan), plega (plegue), priesa (prisa), mayar (maullar), entrambos (ambos), asaz, and the rare ostugo, a nook. 'ha pocos días' uses haber where modern Spanish uses hacer. Pronouns hang on a clause-opening verb (Sabréisme), 'le' stands for a thing (le vea, le apetezco, hallándole), and 'la' once for 'to her' (la has hablado). 'tener de' and 'haber de' mean 'must' (tengo de guiar, ha de estar, la haya de saber), 'deber de' makes a guess (debía de estar, la debe de hacer, debe de haber visto), and the -ra form stands for a conditional (quisiera, pudiera, fuera). Watch the false friends: monte (wood), puesto que (although), lugar (village), real (royal), frontero (opposite), forastero (stranger), suspenso (perplexed), discreción (good sense), sentencia (maxim) and crédito (belief).
