          - {w: "los más", d: "most (of them)"}
          - {w: "privado", d: "favorite (of a ruler), a royal minion"}
          - {w: "el Gran Turco", d: "the Grand Turk: the Ottoman Sultan"}
          - {w: "venir a ser", d: "to end up as, become"}
          - {w: "rey de Argel", d: "king of Algiers: the Spanish name for the beylerbey or pasha who governed Algiers for the Sultan"}
          - {w: "general de la mar", d: "admiral of the fleet (the Ottoman Kapudan Pasha)"}
          - {w: "cargo", d: "post, office"}
          - {w: "señorío", d: "dominion, realm"}
