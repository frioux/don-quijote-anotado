  - sentences:
      - es: "»Con esto entretenía la vida, encerrado en una prisión o casa que los turcos llaman baño, donde encierran los cautivos cristianos, así los que son del rey como de algunos particulares;"
        literal: "»With this I-sustained the life, shut-up in a prison or house that the Turks call bath, where they-shut-up the captives Christian, so those that are of-the king as of some private-persons;"
        ormsby: "In this way I lived on immured in a building or prison called by the Turks a baño in which they confine the Christian captives, as well those that are the king’s as those belonging to private individuals,"
        vocab:
          - {w: "entretener la vida", d: "to keep oneself alive, get through life, eke out one's days"}
          - {w: "encerrado", d: "shut up, locked in"}
          - {w: "baño", d: "bagnio: the prison-barracks for slaves in Algiers and Constantinople (literally 'bath')"}
          - {w: "así ... como", d: "both ... and"}
          - {w: "particular", d: "private individual (as a noun)"}
        diagram:
          - s: "Con esto entretenía la vida"
            r: "main verb: in this way I kept myself going"
            under:
              - s: "encerrado en una prisión o casa"
                r: "how: locked in a prison or house"
                under:
                  - {s: "que los turcos llaman baño", r: "describes 'casa': which the Turks call a 'bath'"}
                  - s: "donde encierran los cautivos cristianos"
                    r: "describes 'casa': where they lock up Christian captives"
                    under:
                      - {s: "así los que son del rey como de algunos particulares", r: "which ones: both the king's and some private owners'"}
        forms:
          - {w: "entretenía", f: "entreten- + -ía → entretener (to keep going), imperfect, I. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "encerrado", f: "participle of encerrar (to lock up), masculine to match the speaker."}
          - {w: "llaman", f: "llam- + -an → llamar (to call), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "encierran", f: "encierr- + -an → encerrar (to lock up), present, they. The stem e becomes ie when stressed: encierro, encierras, encierra, encerramos, encerráis, encierran."}
          - {w: "los cautivos", f: "no personal 'a' before this human object, where modern Spanish would write 'a los cautivos'."}
        ormsby_note: "The barrack or building in which slaves were kept. Littré explains it by saying that a \"bath\" (bagne, baño) was on one occasion used as a place of confinement for Christian slaves at Constantinople. Condé, on the other hand, says the word has nothing to do with baño, bath, but is pure Arabic, and means a building coated with plaster or stucco."
      - es: "y los que llaman del almacén, que es como decir cautivos del concejo, que sirven a la ciudad en las obras públicas que hace y en otros oficios, y estos tales cautivos tienen muy dificultosa su libertad, que, como son del común y no tienen amo particular, no hay con quien tratar su rescate, aunque le tengan."
