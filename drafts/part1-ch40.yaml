part: 1
chapter: 40
title_es: "Capítulo XL. Donde se prosigue la historia del cautivo"
title_en: "In which the story of the captive is continued"
paragraphs:
  - sentences:
      - es: "Soneto"
        literal: "Sonnet"
        ormsby: "SONNET"
        vocab:
          - {w: "soneto", d: "sonnet: fourteen lines of eleven syllables, two quatrains and two tercets, rhymed ABBA ABBA and then CDC DCD or similar"}
        diagram:
          - s: "Soneto"
            r: "heading: a sonnet, no verb"
        forms:
          - {w: "Soneto", f: "noun, masculine (el soneto, los sonetos), from Italian 'sonetto', 'little song'."}
        note: "This is the first of the two sonnets by Don Pedro de Aguilar, the captive's comrade, which his brother, one of Don Fernando's companions at the inn, recites from memory: an epitaph for the Spanish soldiers who died at La Goleta in 1574. Ormsby's older text heads it SONNET; the Standard Ebooks text drops the heading."
  - sentences:
      - es: "Almas dichosas que del mortal velo libres y esentas, por el bien que obrastes, desde la baja tierra os levantastes a lo más alto y lo mejor del cielo, y, ardiendo en ira y en honroso celo, de los cuerpos la fuerza ejercitastes, que en propia y sangre ajena colorastes el mar vecino y arenoso suelo;"
        literal: "Souls happy who from-the mortal veil free and exempt, for the good that you-wrought, from the low earth yourselves you-raised to the most high and the best of-the heaven, and, burning in wrath and in honorable zeal, of the bodies the strength you-exercised, which in own and blood foreign you-colored the sea neighboring and sandy ground;"
        ormsby: "“Blest souls, that, from this mortal husk set free, / In guerdon of brave deeds beatified, / Above this lowly orb of ours abide / Made heirs of heaven and immortality, / With noble rage and ardour glowing ye / Your strength, while strength was yours, in battle plied, / And with your own blood and the foeman’s dyed / The sandy soil and the encircling sea."
        ormsby_match: false
        vocab:
          - {w: "dichoso", d: "happy, blessed, fortunate"}
          - {w: "velo", d: "veil; 'mortal velo' = the body, the veil of mortality that hides the soul"}
          - {w: "esento", d: "= exento, exempt, free from; Cervantes writes 'es-' for 'ex-' (esento, estraño, estremo)"}
          - {w: "obrar", d: "to work, do, perform (deeds)"}
          - {w: "obrastes", d: "old form of 'obrasteis' (you did); in Cervantes' day the vosotros preterite was still -astes / -istes"}
          - {w: "celo", d: "zeal, fervor (here not 'jealousy')"}
          - {w: "ejercitar", d: "to exercise, put to use"}
          - {w: "ajeno", d: "another's, other people's; 'sangre ajena' = the enemy's blood"}
          - {w: "colorar", d: "to color, dye, stain"}
          - {w: "arenoso", d: "sandy"}
        diagram:
          - s: "os levantastes"
            r: "main verb 1: you raised yourselves"
            under:
              - s: "Almas dichosas"
                r: "address and subject: happy souls"
                under:
                  - {s: "que del mortal velo libres y esentas", r: "describes 'almas': who, free and exempt from the mortal veil"}
              - {s: "por el bien que obrastes", r: "why: for the good you did"}
              - {s: "desde la baja tierra", r: "from where: from the lowly earth"}
              - {s: "a lo más alto y lo mejor del cielo", r: "to where: to the highest and best of heaven"}
          - s: "de los cuerpos la fuerza ejercitastes"
            r: "main verb 2 (after 'y'): you used the strength of your bodies"
            under:
              - {s: "ardiendo en ira y en honroso celo", r: "how: burning with wrath and honorable zeal"}
              - {s: "que en propia y sangre ajena colorastes el mar vecino y arenoso suelo", r: "describes 'fuerza': with which you dyed the nearby sea and sandy ground in your own and the enemy's blood"}
        forms:
          - {w: "dichosas", f: "dichos- + -as → dichoso (happy), feminine plural to match 'almas'."}
          - {w: "libres y esentas", f: "libre (free) + -s, and esent- + -as → esento (exempt), feminine plural to match 'almas'; there is no verb, 'being' is understood."}
          - {w: "obrastes", f: "obr- + -astes → obrar (to do), preterite, you (vosotros). The preterite of -ar verbs in Cervantes: -é, -aste, -ó, -amos, -astes, -aron; modern Spanish turned 'astes' into '-asteis'."}
          - {w: "os levantastes", f: "levant- + -astes → levantarse (to rise), preterite, you (vosotros), with 'os' (yourselves). Same -ar preterite: -é, -aste, -ó, -amos, -astes, -aron."}
          - {w: "del", f: "de + el, the contraction modern Spanish still makes."}
          - {w: "ardiendo", f: "gerund of arder (to burn): 'burning'."}
          - {w: "honroso", f: "honr- + -oso → honra (honor) + the adjective suffix -oso: 'honorable'."}
          - {w: "ejercitastes, colorastes", f: "ejercit- + -astes → ejercitar (to exercise) and color- + -astes → colorar (to dye), preterite, you (vosotros). Same old -astes preterite (-é, -aste, -ó, -amos, -astes, -aron)."}
          - {w: "propia y sangre ajena", f: "propi- + -a and ajen- + -a, both feminine to match 'sangre'; the poet splits 'propia sangre y ajena' for the meter."}
        ormsby_note: "Clemencín says the merits of this sonnet are slender, and that the next is no better. He particularly objects to the idea of souls dyeing the sea with their blood. But Clemencín has no bowels of compassion for the straits of a sonneteer."
      - es: "primero que el valor faltó la vida en los cansados brazos, que, muriendo, con ser vencidos, llevan la vitoria."
        literal: "first than the valor failed the life in the tired arms, which, dying, with being defeated, carry-off the victory."
        ormsby: "It was the ebbing lifeblood first that failed / The weary arms; the stout hearts never quailed. / Though vanquished, yet ye earned the victor’s crown:"
        ormsby_match: false
        vocab:
          - {w: "primero que", d: "before, sooner than; 'primero que el valor faltó la vida' = life gave out before courage did"}
          - {w: "faltar", d: "to fail, give out, be lacking"}
          - {w: "con ser vencidos", d: "for all that they are defeated, although beaten; 'con' + infinitive = although"}
          - {w: "llevar la victoria", d: "to carry off the victory, win"}
          - {w: "vitoria", d: "= victoria, victory; old spelling without the c"}
        diagram:
          - s: "faltó la vida"
            r: "main verb: life failed"
            under:
              - {s: "primero que el valor", r: "when: before courage did"}
              - s: "en los cansados brazos"
                r: "where: in the tired arms"
                under:
                  - {s: "que, muriendo, con ser vencidos, llevan la vitoria", r: "describes 'brazos': which, dying and though beaten, win the victory"}
        forms:
          - {w: "faltó", f: "falt- + -ó → faltar (to fail), preterite, it (life). The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "cansados", f: "participle of cansar (to tire), masculine plural to match 'brazos', placed before the noun."}
          - {w: "muriendo", f: "gerund of morir (to die): the o of the stem becomes u, 'muriendo'."}
          - {w: "vencidos", f: "participle of vencer (to defeat), masculine plural to match 'brazos'; 'con ser vencidos' = although being beaten."}
          - {w: "llevan", f: "llev- + -an → llevar (to carry off), present, they (the arms). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "vitoria", f: "= victoria; Cervantes' spelling drops the c, as in 'efeto' for 'efecto'."}
      - es: "Y esta vuestra mortal, triste caída entre el muro y el hierro, os va adquiriendo fama que el mundo os da, y el cielo gloria."
        literal: "And this your mortal, sad fall between the wall and the iron, to-you goes acquiring fame which the world to-you gives, and the heaven glory."
        ormsby: "Though mourned, yet still triumphant was your fall / For there ye won, between the sword and wall, / In Heaven glory and on earth renown.”"
        ormsby_match: false
        vocab:
          - {w: "caída", d: "fall; here death in battle"}
          - {w: "entre el muro y el hierro", d: "between the wall and the iron: dying at the walls by the sword"}
          - {w: "ir + gerund", d: "to be gradually doing; 'os va adquiriendo' = keeps winning for you"}
          - {w: "adquirir", d: "to acquire, win"}
        diagram:
          - s: "os va adquiriendo"
            r: "main verb: goes on winning for you"
            under:
              - {s: "esta vuestra mortal, triste caída entre el muro y el hierro", r: "subject: this deadly, sad fall of yours between wall and sword"}
              - s: "fama"
                r: "object: fame"
                under:
                  - {s: "que el mundo os da", r: "describes 'fama': which the world gives you"}
              - {s: "y el cielo gloria", r: "object 2: and (which) heaven (gives you) glory; the verb 'da' is understood"}
        forms:
          - {w: "esta vuestra", f: "esta (this), feminine to match 'caída', + vuestra (your, of vosotros), also feminine; Spanish could put demonstrative and possessive together before the noun."}
          - {w: "os va adquiriendo", f: "v- + -a → ir (to go), present, it, + adquiriendo, gerund of adquirir (to acquire): 'goes on winning'. ir in the present: voy, vas, va, vamos, vais, van. 'os' = for you."}
          - {w: "da", f: "d- + -a → dar (to give), present, it (the world). dar in the present: doy, das, da, damos, dais, dan."}
  - sentences:
      - es: "— Desa mesma manera le sé yo —dijo el cautivo."
        literal: "— Of-that same manner it know I —said the captive."
        ormsby: "“That is it exactly, according to my recollection,” said the captive."
        vocab:
          - {w: "desa", d: "= de esa, 'of that, in that'"}
          - {w: "mesmo", d: "old form of 'mismo', same"}
          - {w: "saber", d: "here 'to know by heart'"}
          - {w: "cautivo", d: "captive, prisoner (here the man telling the story, Ruy Pérez de Viedma)"}
        diagram:
          - s: "le sé yo"
            r: "main verb: I know it"
            under:
              - {s: "Desa mesma manera", r: "how: in that same way"}
          - s: "dijo"
            r: "speech verb: said"
            under:
              - {s: "el cautivo", r: "subject: the captive"}
        forms:
          - {w: "Desa", f: "de + esa (that), fused; feminine to match 'manera'."}
          - {w: "mesma", f: "= misma (same), feminine to match 'manera'."}
          - {w: "le", f: "'it' (the sonnet); 'le' used for a masculine thing as object is old Castilian usage (leísmo); modern 'lo'."}
          - {w: "sé", f: "saber (to know), present, I, with the accent to tell it from 'se'. saber in the present: sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
  - sentences:
      - es: "— Pues el del fuerte, si mal no me acuerdo —dijo el caballero—, dice así:"
        literal: "— Well the [one] of-the fort, if badly not myself I-remember —said the gentleman—, says thus:"
        ormsby: "“Well then, that on the fort,” said the gentleman, “if my memory serves me, goes thus:"
        vocab:
          - {w: "el del fuerte", d: "the one (the sonnet) about the fort"}
          - {w: "fuerte", d: "fort; here the new fort the Spaniards were building near Tunis, lost in 1574"}
          - {w: "si mal no me acuerdo", d: "if I remember rightly"}
          - {w: "acordarse", d: "to remember"}
          - {w: "decir así", d: "to go like this, run thus (of a text)"}
        diagram:
          - s: "dice así:"
            r: "main verb: goes thus"
            under:
              - {s: "Pues el del fuerte", r: "subject: well, the one about the fort"}
              - {s: "si mal no me acuerdo", r: "condition: if I remember rightly"}
          - s: "dijo"
            r: "speech verb: said"
            under:
              - {s: "el caballero", r: "subject: the gentleman (Don Pedro de Aguilar's brother)"}
        forms:
          - {w: "del", f: "de + el: 'of the'; 'el del fuerte' = the one of the fort, 'el' standing for 'soneto'."}
          - {w: "me acuerdo", f: "acuerd- + -o → acordarse (to remember), present, I, with 'me'. The stem o becomes ue when stressed: me acuerdo, te acuerdas, se acuerda, nos acordamos, os acordáis, se acuerdan."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "dice", f: "dic- + -e → decir (to say), present, it. decir in the present: digo, dices, dice, decimos, decís, dicen."}
  - sentences:
      - es: "Soneto"
        literal: "Sonnet"
        ormsby: "SONNET"
        vocab:
          - {w: "soneto", d: "sonnet: fourteen lines of eleven syllables, two quatrains and two tercets"}
        diagram:
          - s: "Soneto"
            r: "heading: a sonnet, no verb"
        forms:
          - {w: "Soneto", f: "noun, masculine (el soneto, los sonetos), from Italian 'sonetto', 'little song'."}
        note: "The second sonnet by Don Pedro de Aguilar, an epitaph for the defenders of the new fort at Tunis, lost in 1574 a few days after La Goleta. Ormsby's older text heads it SONNET; the Standard Ebooks text drops the heading."
  - sentences:
      - es: "De entre esta tierra estéril, derribada, destos terrones por el suelo echados, las almas santas de tres mil soldados subieron vivas a mejor morada, siendo primero, en vano, ejercitada la fuerza de sus brazos esforzados, hasta que, al fin, de pocos y cansados, dieron la vida al filo de la espada."
        literal: "From among this land barren, thrown-down, of-these clods over the ground thrown, the souls holy of three thousand soldiers rose alive to better dwelling, being first, in vain, exercised the strength of their arms valiant, until that, at-the end, from few and tired, they-gave the life to-the edge of the sword."
        ormsby: "“Up from this wasted soil, this shattered shell, / Whose walls and towers here in ruin lie, / Three thousand soldier souls took wing on high, / In the bright mansions of the blest to dwell. / The onslaught of the foeman to repel / By might of arm all vainly did they try, / And when at length ’twas left them but to die, / Wearied and few the last defenders fell."
        ormsby_match: false
        vocab:
          - {w: "estéril", d: "barren, sterile"}
          - {w: "derribado", d: "thrown down, demolished"}
          - {w: "destos", d: "= de estos, 'of these'"}
          - {w: "terrón", d: "clod of earth; here the earthworks of the ruined fort"}
          - {w: "echado", d: "thrown, lying"}
          - {w: "morada", d: "dwelling, abode; 'mejor morada' = heaven"}
          - {w: "esforzado", d: "valiant, strong, brave (not 'forced')"}
          - {w: "de pocos y cansados", d: "being few and tired, through being few and weary"}
          - {w: "al filo de la espada", d: "to the edge of the sword, by the sword"}
        diagram:
          - s: "subieron vivas a mejor morada"
            r: "main verb: rose alive to a better dwelling"
            under:
              - {s: "De entre esta tierra estéril, derribada, destos terrones por el suelo echados", r: "from where: from this barren, shattered land, from these clods strewn on the ground"}
              - {s: "las almas santas de tres mil soldados", r: "subject: the holy souls of three thousand soldiers"}
              - {s: "siendo primero, en vano, ejercitada la fuerza de sus brazos esforzados", r: "when: their brave arms' strength having first been used in vain"}
              - s: "hasta que, al fin, de pocos y cansados, dieron la vida"
                r: "until: until at last, few and weary, they gave their lives"
                under:
                  - {s: "al filo de la espada", r: "to what: to the edge of the sword"}
        forms:
          - {w: "derribada", f: "participle of derribar (to demolish), feminine to match 'tierra'."}
          - {w: "destos", f: "de + estos (these), fused, masculine plural to match 'terrones'."}
          - {w: "echados", f: "participle of echar (to throw), masculine plural to match 'terrones'."}
          - {w: "subieron", f: "sub- + -ieron → subir (to rise), preterite, they (the souls). The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "vivas", f: "viv- + -as → vivo (alive), feminine plural to match 'almas'."}
          - {w: "mejor", f: "comparative of bueno (good): 'better'; one form for both genders."}
          - {w: "siendo ... ejercitada", f: "siendo, the gerund of ser (to be), + ejercitada, the participle of ejercitar (to use), feminine to match 'fuerza': 'the strength being used', a passive gerund phrase."}
          - {w: "esforzados", f: "participle of esforzar (to strengthen), used as an adjective, masculine plural to match 'brazos': 'valiant'."}
          - {w: "dieron", f: "d- + -ieron → dar (to give), preterite, they. dar takes -er endings in the preterite: di, diste, dio, dimos, disteis, dieron."}
          - {w: "al", f: "a + el, the contraction modern Spanish still makes."}
      - es: "Y éste es el suelo que continuo ha sido de mil memorias lamentables lleno en los pasados siglos y presentes."
        literal: "And this is the ground that continually has been of a-thousand memories lamentable full in the past centuries and present."
        ormsby: "And this same arid soil hath ever been / A haunt of countless mournful memories, / As well in our day as in days of yore."
        vocab:
          - {w: "continuo", d: "continually, always (an adjective used as an adverb)"}
          - {w: "memoria", d: "memory; here also 'memorial, monument'"}
          - {w: "lamentable", d: "lamentable, mournful, worth weeping for"}
          - {w: "mil", d: "a thousand, often just 'countless'"}
        diagram:
          - s: "Y éste es el suelo"
            r: "main verb: and this is the ground"
            under:
              - s: "que continuo ha sido de mil memorias lamentables lleno"
                r: "describes 'suelo': that has always been full of countless mournful memories"
                under:
                  - {s: "en los pasados siglos y presentes", r: "when: in past ages and the present"}
        forms:
          - {w: "éste", f: "este (this), masculine, written with an accent when it stands alone as a pronoun ('this one'), the old rule."}
          - {w: "ha sido", f: "h- + -a → haber, present, it, + sido, the participle of ser (to be): present perfect 'has been'. haber in the present: he, has, ha, hemos, habéis, han."}
          - {w: "lleno", f: "lleno (full), masculine to match 'suelo', placed at the end of its phrase for the verse: 'lleno de mil memorias'."}
          - {w: "lamentables", f: "lamentable + -s, plural to match 'memorias'; the suffix -able = '-able, worth'."}
          - {w: "pasados ... presentes", f: "pasados (past), participle of pasar, masculine plural, and presentes, plural, both describing 'siglos'; the verse splits them."}
      - es: "Mas no más justas de su duro seno habrán al claro cielo almas subido, ni aun él sostuvo cuerpos tan valientes."
        literal: "But not more just from its hard bosom will-have to-the clear heaven souls risen, nor even it bore bodies so valiant."
        ormsby: "But never yet to Heaven it sent, I ween, / From its hard bosom purer souls than these, / Or braver bodies on its surface bore.”"
        vocab:
          - {w: "mas", d: "but (without accent; 'más' with the accent is 'more')"}
          - {w: "justo", d: "just, righteous"}
          - {w: "seno", d: "bosom, breast; the inside of the earth"}
          - {w: "sostener", d: "to bear, hold up, support"}
          - {w: "valiente", d: "brave, valiant"}
        diagram:
          - s: "habrán ... subido"
            r: "main verb 1: will have risen (= surely never rose)"
            under:
              - {s: "no más justas", r: "how: no more righteous (souls)"}
              - {s: "de su duro seno", r: "from where: from its hard bosom"}
              - {s: "al claro cielo", r: "to where: to bright heaven"}
              - {s: "almas", r: "subject: souls"}
          - s: "ni aun él sostuvo"
            r: "main verb 2: nor did it even bear"
            under:
              - {s: "cuerpos tan valientes", r: "object: such brave bodies"}
        forms:
          - {w: "Mas", f: "the old 'but' (= pero), no accent; 'más' with the accent means 'more', as in 'no más justas' just after."}
          - {w: "justas", f: "just- + -as → justo (righteous), feminine plural to match 'almas', which comes later in the line."}
          - {w: "habrán ... subido", f: "habr- + -án → haber, future, they, + subido, the participle of subir (to rise): future perfect 'will have risen', here a guess about the past, 'surely never have risen'. haber in the future: habré, habrás, habrá, habremos, habréis, habrán."}
          - {w: "al", f: "a + el: 'to the'."}
          - {w: "sostuvo", f: "sostuv- + -o → sostener (to bear), preterite, it. Irregular like tener: sostuve, sostuviste, sostuvo, sostuvimos, sostuvisteis, sostuvieron."}
          - {w: "valientes", f: "valiente + -s, plural to match 'cuerpos'."}
  - sentences:
      - es: "No parecieron mal los sonetos, y el cautivo se alegró con las nuevas que de su camarada le dieron; y, prosiguiendo su cuento, dijo:"
        literal: "Not seemed bad the sonnets, and the captive himself rejoiced with the news that of his comrade to-him they-gave; and, continuing his tale, he-said:"
        ormsby: "The sonnets were not disliked, and the captive was rejoiced at the tidings they gave him of his comrade, and continuing his tale, he went on to say:"
        vocab:
          - {w: "parecer mal", d: "to make a bad impression, be disliked; 'no parecieron mal' = they were well received"}
          - {w: "alegrarse con", d: "to be glad at"}
          - {w: "nuevas", d: "news, tidings"}
          - {w: "camarada", d: "comrade, companion"}
          - {w: "proseguir", d: "to continue, go on with"}
          - {w: "cuento", d: "tale, story"}
        diagram:
          - s: "No parecieron mal"
            r: "main verb 1: did not seem bad (were liked)"
            under:
              - {s: "los sonetos", r: "subject: the sonnets"}
          - s: "y el cautivo se alegró"
            r: "main verb 2: and the captive was glad"
            under:
              - s: "con las nuevas"
                r: "at what: at the news"
                under:
                  - {s: "que de su camarada le dieron", r: "describes 'nuevas': that they gave him of his comrade"}
          - s: "dijo:"
            r: "main verb 3 (after 'y'): he said"
            under:
              - {s: "prosiguiendo su cuento", r: "how: continuing his tale"}
        forms:
          - {w: "parecieron", f: "parec- + -ieron → parecer (to seem), preterite, they. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "se alegró", f: "alegr- + -ó → alegrarse (to be glad), preterite, he, with 'se'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "le dieron", f: "d- + -ieron → dar (to give), preterite, they, with 'le' (to him). dar in the preterite: di, diste, dio, dimos, disteis, dieron."}
          - {w: "prosiguiendo", f: "gerund of proseguir (to continue): the e of the stem becomes i, and gu keeps the hard g."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
        note: "The gentleman has just told the captive that his brother Don Pedro de Aguilar, the captive's old comrade, got free and is now safe and well at home in Spain; hence his joy."
  - sentences:
      - es: "— «Rendidos, pues, la Goleta y el fuerte, los turcos dieron orden en desmantelar la Goleta, porque el fuerte quedó tal, que no hubo qué poner por tierra, y para hacerlo con más brevedad y menos trabajo, la minaron por tres partes;"
        literal: "— «Surrendered, then, the Goleta and the fort, the Turks gave order in dismantling the Goleta, because the fort remained such, that not there-was what to-put on ground, and to do-it with more brevity and less labor, it they-mined in three places;"
        ormsby: "The Goletta and the fort being thus in their hands, the Turks gave orders to dismantle the Goletta (for the fort was reduced to such a state that there was nothing left to level) and to do the work more quickly and easily they mined it in three places;"
        vocab:
          - {w: "rendido", d: "surrendered, taken"}
          - {w: "la Goleta", d: "La Goletta, the Spanish fortress guarding the harbor of Tunis, held by Spain from 1535 and lost to the Ottomans in 1574"}
          - {w: "dar orden en", d: "to give orders to, arrange to"}
          - {w: "desmantelar", d: "to dismantle, pull down the fortifications of"}
          - {w: "poner por tierra", d: "to level to the ground, demolish"}
          - {w: "brevedad", d: "speed, quickness (not only 'brevity')"}
          - {w: "minar", d: "to mine, dig tunnels with explosives under (a wall)"}
        diagram:
          - s: "los turcos dieron orden en desmantelar la Goleta"
            r: "main verb 1: the Turks gave orders to dismantle La Goleta"
            under:
              - {s: "Rendidos, pues, la Goleta y el fuerte", r: "when: La Goleta and the fort having surrendered"}
              - s: "porque el fuerte quedó tal"
                r: "why: because the fort was left in such a state"
                under:
                  - {s: "que no hubo qué poner por tierra", r: "result: that there was nothing left to knock down"}
          - s: "la minaron por tres partes"
            r: "main verb 2 (after 'y'): they mined it in three places"
            under:
              - {s: "para hacerlo con más brevedad y menos trabajo", r: "purpose: to do it faster and with less labor"}
        forms:
          - {w: "Rendidos", f: "participle of rendir (to surrender), masculine plural to match 'la Goleta y el fuerte': an absolute phrase, 'once La Goleta and the fort had surrendered'."}
          - {w: "dieron", f: "d- + -ieron → dar (to give), preterite, they. dar takes -er endings in the preterite: di, diste, dio, dimos, disteis, dieron."}
          - {w: "desmantelar", f: "infinitive (to dismantle) after 'dar orden en'."}
          - {w: "quedó", f: "qued- + -ó → quedar (to be left), preterite, it. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "hubo", f: "hub- + -o → haber, preterite, used alone as 'there was'. Irregular: hube, hubiste, hubo, hubimos, hubisteis, hubieron."}
          - {w: "qué", f: "'what', with the accent: 'no hubo qué poner' = there was nothing to knock down."}
          - {w: "hacerlo", f: "hacer (to do) + lo (it), the pronoun hung on the infinitive after 'para'."}
          - {w: "la minaron", f: "min- + -aron → minar (to mine), preterite, they, with 'la' (it, La Goleta). Same -ar preterite."}
      - es: "pero con ninguna se pudo volar lo que parecía menos fuerte, que eran las murallas viejas;"
        literal: "but with none itself could blow-up that which seemed less strong, which were the walls old;"
        ormsby: "but nowhere were they able to blow up the part which seemed to be the least strong, that is to say, the old walls,"
        vocab:
          - {w: "volar", d: "here 'to blow up' (with a mine); usually 'to fly'"}
          - {w: "muralla", d: "rampart, city or fortress wall"}
        diagram:
          - s: "pero con ninguna se pudo volar"
            r: "main verb: but with none (of the mines) could one blow up"
            under:
              - s: "lo que parecía menos fuerte"
                r: "object: what seemed weakest"
                under:
                  - {s: "que eran las murallas viejas", r: "describes 'lo': which was the old walls"}
        forms:
          - {w: "ninguna", f: "ningun- + -a → ninguno (none), feminine to match 'mina' understood from 'minaron'."}
          - {w: "se pudo volar", f: "pud- + -o → poder (to be able), preterite, it, with impersonal 'se': 'it could be blown up, one could blow up'. Irregular: pude, pudiste, pudo, pudimos, pudisteis, pudieron. volar (to blow up) is the infinitive after it."}
          - {w: "parecía", f: "parec- + -ía → parecer (to seem), imperfect, it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "eran", f: "ser (to be), imperfect, they, agreeing with 'murallas'. ser's imperfect is irregular: era, eras, era, éramos, erais, eran."}
      - es: "y todo aquello que había quedado en pie de la fortificación nueva que había hecho el Fratín, con mucha facilidad vino a tierra."
        literal: "and all that which had remained on foot of the fortification new that had made the Fratín, with much ease came to ground."
        ormsby: "while all that remained standing of the new fortifications that the Fratin had made came to the ground with the greatest ease."
        vocab:
          - {w: "quedar en pie", d: "to be left standing"}
          - {w: "fortificación", d: "fortification, defensive works"}
          - {w: "el Fratín", d: "nickname ('the little friar') of Giacomo Paleari Fratino, the Italian engineer who built Philip II's new works at La Goleta"}
          - {w: "venir a tierra", d: "to fall down, collapse"}
        diagram:
          - s: "vino a tierra"
            r: "main verb: came down"
            under:
              - s: "todo aquello"
                r: "subject: all that"
                under:
                  - {s: "que había quedado en pie de la fortificación nueva", r: "describes 'aquello': that was still standing of the new fortification"}
                  - {s: "que había hecho el Fratín", r: "describes 'fortificación': that the Fratín had built"}
              - {s: "con mucha facilidad", r: "how: very easily"}
        forms:
          - {w: "aquello", f: "the neuter 'that' (no noun): aquel, aquella, aquello."}
          - {w: "había quedado, había hecho", f: "hab- + -ía → haber, imperfect, it / he, + quedado (participle of quedar, to remain) and hecho (irregular participle of hacer, to make): pluperfect 'had remained', 'had made'. haber in the imperfect: había, habías, había, habíamos, habíais, habían."}
          - {w: "nueva", f: "nuev- + -a → nuevo (new), feminine to match 'fortificación', after the noun."}
          - {w: "vino", f: "vin- + -o → venir (to come), preterite, it. Irregular: vine, viniste, vino, vinimos, vinisteis, vinieron."}
        ormsby_note: "Fratin, \"the little friar,\" the name by which Jacome Palearo went."
      - es: "En resolución, la armada volvió a Constantinopla, triunfante y vencedora:"
        literal: "In resolution, the fleet returned to Constantinople, triumphant and victorious:"
        ormsby: "Finally the fleet returned victorious and triumphant to Constantinople,"
        vocab:
          - {w: "en resolución", d: "in short, finally"}
          - {w: "armada", d: "fleet, navy (not 'army')"}
          - {w: "vencedor", d: "victorious, conqueror"}
        diagram:
          - s: "la armada volvió a Constantinopla"
            r: "main verb: the fleet went back to Constantinople"
            under:
              - {s: "En resolución", r: "linking: in short"}
              - {s: "triunfante y vencedora", r: "how: triumphant and victorious"}
        forms:
          - {w: "volvió", f: "volv- + -ió → volver (to return), preterite, it. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "vencedora", f: "vence- + -dora → vencer (to defeat) + the suffix -dor 'one who', feminine -dora to match 'armada'."}
      - es: "y de allí a pocos meses murió mi amo el Uchalí, al cual llamaban Uchalí Fartax, que quiere decir, en lengua turquesca, el renegado tiñoso, porque lo era;"
        literal: "and from there to few months died my master the Uchalí, whom they-called Uchalí Fartax, which wants to-say, in tongue Turkish, the renegade scabby, because it he-was;"
        ormsby: "and a few months later died my master, El Uchali, otherwise Uchali Fartax, which means in Turkish “the scabby renegade”; for that he was;"
        vocab:
          - {w: "de allí a pocos meses", d: "a few months after that"}
          - {w: "el Uchalí", d: "Uluç Ali (Kılıç Ali Pasha), Calabrian-born admiral of the Ottoman fleet, whose fleet took part in the capture of La Goleta in 1574; the captive's master in this story"}
          - {w: "querer decir", d: "to mean"}
          - {w: "turquesco", d: "Turkish (an old, slightly mocking form of 'turco')"}
          - {w: "renegado", d: "renegade: a Christian who has turned Muslim"}
          - {w: "tiñoso", d: "scabby, mangy, suffering from ringworm of the scalp (tiña)"}
        diagram:
          - s: "murió mi amo el Uchalí"
            r: "main verb: my master Uchalí died"
            under:
              - {s: "de allí a pocos meses", r: "when: a few months later"}
              - s: "al cual llamaban Uchalí Fartax"
                r: "describes 'Uchalí': whom they called Uchalí Fartax"
                under:
                  - {s: "que quiere decir, en lengua turquesca, el renegado tiñoso", r: "describes 'Fartax': which means in Turkish 'the scabby renegade'"}
                  - {s: "porque lo era", r: "why: because he was one"}
        forms:
          - {w: "murió", f: "mur- + -ió → morir (to die), preterite, he. Irregular in the he/they forms: morí, moriste, murió, morimos, moristeis, murieron."}
          - {w: "al cual", f: "a + el cual (whom): the 'a' marks a person as object of 'llamaban'."}
          - {w: "llamaban", f: "llam- + -aban → llamar (to call), imperfect, they (people in general). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "quiere decir", f: "quier- + -e → querer (to want), present, it, + decir: 'means'. The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "lo era", f: "'lo' stands for the adjective 'tiñoso' (he was so); era = ser, imperfect, he: era, eras, era, éramos, erais, eran."}
      - es: "y es costumbre entre los turcos ponerse nombres de alguna falta que tengan, o de alguna virtud que en ellos haya."
        literal: "and it-is custom among the Turks to-put-on-themselves names from some fault that they-may-have, or from some virtue that in them there-may-be."
        ormsby: "it is the practice with the Turks to name people from some defect or virtue they may possess;"
        vocab:
          - {w: "costumbre", d: "custom, habit"}
          - {w: "ponerse nombre", d: "to take a name, be named"}
          - {w: "falta", d: "defect, flaw"}
        diagram:
          - s: "y es costumbre"
            r: "main verb: and it is the custom"
            under:
              - {s: "entre los turcos", r: "among whom: among the Turks"}
              - s: "ponerse nombres"
                r: "subject (what is the custom): to take names"
                under:
                  - {s: "de alguna falta que tengan", r: "from what: from some defect they have"}
                  - {s: "o de alguna virtud que en ellos haya", r: "or from what: or from some virtue in them"}
        forms:
          - {w: "ponerse", f: "poner (to put) + se (on themselves), the pronoun hung on the infinitive."}
          - {w: "alguna", f: "algun- + -a → alguno (some), feminine to match 'falta' and 'virtud'."}
          - {w: "tengan", f: "teng- + -an → tener (to have), present subjunctive, they: 'may have'. Subjunctive because the defect is any one at all. tener in the present subjunctive: tenga, tengas, tenga, tengamos, tengáis, tengan."}
          - {w: "haya", f: "haber, present subjunctive, used alone as 'there may be'. haya, hayas, haya, hayamos, hayáis, hayan."}
      - es: "Y esto es porque no hay entre ellos sino cuatro apellidos de linajes, que decienden de la casa Otomana, y los demás, como tengo dicho, toman nombre y apellido ya de las tachas del cuerpo y ya de las virtudes del ánimo."
        literal: "And this is because not there-are among them but four surnames of lineages, which descend from the house Ottoman, and the rest, as I-have said, take name and surname now from the blemishes of-the body and now from the virtues of-the spirit."
        ormsby: "the reason being that there are among them only four surnames belonging to families tracing their descent from the Ottoman house, and the others, as I have said, take their names and surnames either from bodily blemishes or moral qualities."
        vocab:
          - {w: "no ... sino", d: "only, nothing but"}
          - {w: "apellido", d: "surname, family name"}
          - {w: "linaje", d: "lineage, family"}
          - {w: "decender", d: "= descender, to descend; Cervantes' spelling without the s"}
          - {w: "la casa Otomana", d: "the house of Osman, the Ottoman dynasty of the sultans"}
          - {w: "tengo dicho", d: "I have said; 'tener' + participle is an old way of saying 'haber' + participle"}
          - {w: "ya ... ya", d: "now ... now; either ... or"}
          - {w: "tacha", d: "blemish, defect"}
          - {w: "ánimo", d: "spirit, mind, soul"}
        diagram:
          - s: "Y esto es"
            r: "main verb: and this is"
            under:
              - s: "porque no hay entre ellos sino cuatro apellidos de linajes"
                r: "why: because among them there are only four family surnames"
                under:
                  - {s: "que decienden de la casa Otomana", r: "describes 'linajes': which descend from the Ottoman house"}
              - s: "y los demás"
                r: "second half of the 'because': and the others"
                under:
                  - {s: "como tengo dicho", r: "aside: as I have said"}
                  - {s: "toman nombre y apellido ya de las tachas del cuerpo y ya de las virtudes del ánimo", r: "what they do: take name and surname from either bodily blemishes or virtues of the mind"}
        forms:
          - {w: "hay", f: "the present of haber used alone: 'there are'."}
          - {w: "decienden", f: "deciend- + -en → decender (= descender, to descend), present, they. The stem e becomes ie when stressed: deciendo, deciendes, deciende, decendemos, decendéis, decienden."}
          - {w: "tengo dicho", f: "teng- + -o → tener (to have), present, I, + dicho, the participle of decir (to say): 'I have said'. tener in the present: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "toman", f: "tom- + -an → tomar (to take), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "del", f: "de + el: 'of the'."}
      - es: "Y este Tiñoso bogó el remo, siendo esclavo del Gran Señor, catorce años, y a más de los treinta y cuatro de sus edad renegó, de despecho de que un turco, estando al remo, le dio un bofetón, y por poderse vengar dejó su fe;"
        literal: "And this Scabby-one rowed the oar, being slave of-the Great Lord, fourteen years, and at more than the thirty and four of his age he-reneged, from spite of that a Turk, being at-the oar, to-him gave a slap, and to be-able-himself to-avenge he-left his faith;"
        ormsby: "This “scabby one” rowed at the oar as a slave of the Grand Signor’s for fourteen years, and when over thirty-four years of age, in resentment at having been struck by a Turk while at the oar, turned renegade and renounced his faith in order to be able to revenge himself;"
        vocab:
          - {w: "bogar el remo", d: "to row at the oar, pull an oar (as a galley slave)"}
          - {w: "el Gran Señor", d: "the Grand Signor: the Ottoman Sultan"}
          - {w: "a más de", d: "past, over (an age)"}
          - {w: "renegar", d: "to renounce one's faith; here, a Christian becoming Muslim"}
          - {w: "de despecho de que", d: "out of spite because, in resentment that"}
          - {w: "bofetón", d: "hard slap in the face, a grave insult"}
          - {w: "vengarse", d: "to take revenge"}
        diagram:
          - s: "Y este Tiñoso bogó el remo"
            r: "main verb 1: and this Scabby One pulled an oar"
            under:
              - {s: "siendo esclavo del Gran Señor", r: "how: as a slave of the Sultan"}
              - {s: "catorce años", r: "how long: fourteen years"}
          - s: "renegó"
            r: "main verb 2 (after 'y'): he turned renegade"
            under:
              - {s: "a más de los treinta y cuatro de sus edad", r: "when: past the age of thirty-four"}
              - {s: "de despecho de que un turco, estando al remo, le dio un bofetón", r: "why: out of spite because a Turk slapped him while he was at the oar"}
          - s: "dejó su fe"
            r: "main verb 3 (after 'y'): he gave up his faith"
            under:
              - {s: "por poderse vengar", r: "purpose: to be able to take revenge"}
        forms:
          - {w: "bogó", f: "bog- + -ó → bogar (to row), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "siendo, estando", f: "gerunds of ser and estar (to be): 'being'."}
          - {w: "sus edad", f: "so in the Gutenberg text: 'sus' is plural but 'edad' is singular, a slip for 'su edad' (his age)."}
          - {w: "renegó", f: "reneg- + -ó → renegar (to renounce the faith), preterite, he. Same -ar preterite."}
          - {w: "le dio", f: "d- + -io → dar (to give), preterite, he, with 'le' (to him). dar in the preterite: di, diste, dio, dimos, disteis, dieron."}
          - {w: "poderse vengar", f: "poder (to be able) + se, the 'se' of vengarse (to take revenge) climbing onto the first infinitive; modern 'poder vengarse'."}
          - {w: "dejó", f: "dej- + -ó → dejar (to leave, give up), preterite, he. Same -ar preterite."}
      - es: "y fue tanto su valor que, sin subir por los torpes medios y caminos que los más privados del Gran Turco suben, vino a ser rey de Argel, y después, a ser general de la mar, que es el tercero cargo que hay en aquel señorío."
        literal: "and was so-great his valor that, without rising by the base means and ways that the most favorites of-the Great Turk rise, he-came to be king of Algiers, and afterward, to be general of the sea, which is the third post that there-is in that dominion."
