      - es: "Porque yo tengo para mí, ¡oh amigo!, que no es una mujer más buena de cuanto es o no es solicitada, y que aquella sola es fuerte que no se dobla a las promesas, a las dádivas, a las lágrimas y a las continuas importunidades de los solícitos amantes."
