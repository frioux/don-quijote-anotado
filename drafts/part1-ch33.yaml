        ormsby: "Anselmo remarked the cessation of Lothario’s visits, and complained of it to him, saying that if he had known that marriage was to keep him from enjoying his society as he used, he would have never married; and that, if by the thorough harmony that subsisted between them while he was a bachelor they had earned such a sweet name as that of “The Two Friends,” he should not allow a title so rare and so delightful to be lost through a needless anxiety to act circumspectly;"
