      - es: "Y este mesmo término y modo me convendrá usar contigo, porque el deseo que en ti ha nacido va tan descaminado y tan fuera de todo aquello que tenga sombra de razonable, que me parece que ha de ser tiempo gastado el que ocupare en darte a entender tu simplicidad, que por ahora no le quiero dar otro nombre, y aun estoy por dejarte en tu desatino, en pena de tu mal deseo;"
        literal: "And this same term and mode to-me it-will-suit to-use with-you, because the desire that in you has been-born goes so astray and so outside of all that which may-have shadow of reasonable, that to-me it-seems that it-has to be time wasted that which I-may-occupy in giving-you to understand your simplicity, for for now not to-it I-want to-give other name, and even I-am for leaving-you in your folly, in punishment of your bad desire;"
        ormsby: "This same mode of proceeding I shall have to adopt with thee, for the desire which has sprung up in thee is so absurd and remote from everything that has a semblance of reason, that I feel it would be a waste of time to employ it in reasoning with thy simplicity, for at present I will call it by no other name; and I am even tempted to leave thee in thy folly as a punishment for thy pernicious desire;"
