      - es: "y, cuando esto no entiendan de palabra, como, en efeto, no lo entienden, háseles de mostrar con las manos y ponérselo delante de los ojos, y, aun con todo esto, no basta nadie con ellos a persuadirles las verdades de mi sacra religión."
