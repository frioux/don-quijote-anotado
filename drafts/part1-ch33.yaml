part: 1
chapter: 33
title_es: "Capítulo XXXIII. Donde se cuenta la novela del Curioso impertinente"
title_en: "In which is related the novel of The Ill-Advised Curiosity"
paragraphs:
  - sentences:
      - es: "«En Florencia, ciudad rica y famosa de Italia, en la provincia que llaman Toscana, vivían Anselmo y Lotario, dos caballeros ricos y principales, y tan amigos que, por excelencia y antonomasia, de todos los que los conocían los dos amigos eran llamados."
        literal: "«In Florence, city rich and famous of Italy, in the province that they-call Tuscany, lived Anselmo and Lotario, two gentlemen rich and of-rank, and so-much friends that, by excellence and antonomasia, by all those who them knew 'the two friends' they-were called."
        ormsby: "In Florence, a rich and famous city of Italy in the province called Tuscany, there lived two gentlemen of wealth and quality, Anselmo and Lothario, such great friends that by way of distinction they were called by all that knew them “The Two Friends.”"
        vocab:
          - {w: "Florencia", d: "Florence, capital of Tuscany; Italian cities were the usual setting of the Italian 'novella' that Cervantes imitates here"}
          - {w: "principal", d: "of high rank, distinguished (of people), not just 'main'"}
          - {w: "por excelencia", d: "par excellence, above all others"}
          - {w: "antonomasia", d: "antonomasia: using a description in place of a name ('the Two Friends' for Anselmo and Lotario); 'por antonomasia' = as a byword"}
          - {w: "de todos ... eran llamados", d: "they were called by everyone; old 'de' for the agent of a passive, modern 'por'"}
        diagram:
          - s: "vivían"
            r: "main verb: lived"
            under:
              - s: "En Florencia"
                r: "where"
                under:
                  - {s: "ciudad rica y famosa de Italia", r: "describes 'Florencia'"}
                  - {s: "en la provincia que llaman Toscana", r: "where exactly: in the province called Tuscany"}
              - s: "Anselmo y Lotario"
                r: "subject: who lived"
                under:
                  - {s: "dos caballeros ricos y principales", r: "describes them: two rich gentlemen of rank"}
                  - s: "y tan amigos"
                    r: "describes them: and such friends"
                    under:
                      - s: "que, por excelencia y antonomasia, de todos los que los conocían los dos amigos eran llamados"
                        r: "result: that everyone who knew them called them simply 'the two friends'"
        forms:
          - {w: "llaman", f: "llam- + -an → llamar (to call), present, they: 'that they call', i.e. 'called'. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "vivían", f: "viv- + -ían → vivir (to live), imperfect, they. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían. The verb comes before its subject, as often in storytelling."}
          - {w: "ricos y principales", f: "masculine plural to match 'caballeros'."}
          - {w: "conocían", f: "conoc- + -ían → conocer (to know), imperfect, they. Same -ía imperfect."}
          - {w: "eran llamados", f: "er- + -an → ser (to be), imperfect, they, + llamados, the participle of llamar (to call), masculine plural: the passive 'they were called'. ser's imperfect is irregular: era, eras, era, éramos, erais, eran."}
        note: "The opening « marks the start of the manuscript the priest reads aloud at the inn; every later paragraph of the story opens with » to show the reading is still going on. The tale itself is set in Italy, the home of the 'novella' of intrigue."
      - es: "Eran solteros, mozos de una misma edad y de unas mismas costumbres; todo lo cual era bastante causa a que los dos con recíproca amistad se correspondiesen."
        literal: "They-were bachelors, young-men of one same age and of some same habits; all which was sufficient cause to that the two with reciprocal friendship should-correspond-to-each-other."
        ormsby: "They were unmarried, young, of the same age and of the same tastes, which was enough to account for the reciprocal friendship between them."
        vocab:
          - {w: "soltero", d: "unmarried, bachelor"}
          - {w: "mozo", d: "young man"}
          - {w: "costumbres", d: "habits, ways, tastes"}
          - {w: "bastante", d: "sufficient, enough"}
          - {w: "corresponderse", d: "to return each other's feelings, be on mutual terms"}
        diagram:
          - s: "Eran"
            r: "main verb 1: they were"
            under:
              - {s: "solteros", r: "what they were: unmarried"}
              - {s: "mozos de una misma edad y de unas mismas costumbres", r: "what they were: young men of the same age and habits"}
          - s: "todo lo cual era"
            r: "main verb 2: all of which was"
            under:
              - s: "bastante causa"
                r: "what it was: reason enough"
                under:
                  - {s: "a que los dos con recíproca amistad se correspondiesen", r: "reason for what: for the two to answer each other's friendship"}
        forms:
          - {w: "Eran", f: "er- + -an → ser (to be), imperfect, they. ser's imperfect is irregular: era, eras, era, éramos, erais, eran."}
          - {w: "una misma, unas mismas", f: "misma, mismas = feminine to match 'edad' and 'costumbres'; 'unas' in the plural means 'the very same' here, not 'some'."}
          - {w: "todo lo cual", f: "'all of which', a neuter relative pointing back to everything just said."}
          - {w: "era", f: "ser (to be), imperfect, it. Same irregular era, eras, era, éramos, erais, eran."}
          - {w: "se correspondiesen", f: "correspond- + -iesen → corresponderse (to answer each other), imperfect subjunctive (-se form), they, with 'se' (each other). Subjunctive after 'causa a que' (a reason for). The -se imperfect subjunctive of -er and -ir verbs: -iese, -ieses, -iese, -iésemos, -ieseis, -iesen."}
      - es: "Bien es verdad que el Anselmo era algo más inclinado a los pasatiempos amorosos que el Lotario, al cual llevaban tras sí los de la caza;"
        literal: "Well is true that the Anselmo was somewhat more inclined to the pastimes amorous than the Lotario, to-the whom drew after themselves those of the hunt;"
        ormsby: "Anselmo, it is true, was somewhat more inclined to seek pleasure in love than Lothario, for whom the pleasures of the chase had more attraction;"
        vocab:
          - {w: "bien es verdad que", d: "it is true that, admittedly"}
          - {w: "el Anselmo, el Lotario", d: "the article before a man's name is an Italianism or a colloquial touch: 'this Anselmo', 'our Lotario'"}
          - {w: "pasatiempo", d: "pastime, amusement"}
          - {w: "llevar tras sí", d: "to draw after oneself, attract"}
          - {w: "caza", d: "hunting, the chase"}
        diagram:
          - s: "Bien es verdad"
            r: "main verb: it is true"
            under:
              - s: "que el Anselmo era algo más inclinado a los pasatiempos amorosos que el Lotario"
                r: "what is true: that Anselmo was rather more given to love affairs than Lotario"
                under:
                  - {s: "al cual llevaban tras sí los de la caza", r: "describes 'el Lotario': whom the pleasures of hunting drew after them"}
        forms:
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son."}
          - {w: "era", f: "ser (to be), imperfect, he. era, eras, era, éramos, erais, eran."}
          - {w: "inclinado", f: "participle of inclinar (to incline), masculine singular to match Anselmo, used as an adjective: 'inclined'."}
          - {w: "amorosos", f: "amor + -oso → amoroso (amorous), masculine plural to match 'pasatiempos'."}
          - {w: "al cual", f: "a + el cual: 'whom' as the object (the personal 'a'), pointing back to Lotario."}
          - {w: "llevaban", f: "llev- + -aban → llevar (to carry, draw), imperfect, they (the pastimes of hunting). The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "los de la caza", f: "'los' stands for 'los pasatiempos': 'those of hunting'."}
      - es: "pero, cuando se ofrecía, dejaba Anselmo de acudir a sus gustos por seguir los de Lotario, y Lotario dejaba los suyos por acudir a los de Anselmo;"
        literal: "but, when it offered-itself, left-off Anselmo of attending to his pleasures for to-follow those of Lotario, and Lotario left his-own for to-attend to those of Anselmo;"
        ormsby: "but on occasion Anselmo would forego his own tastes to yield to those of Lothario, and Lothario would surrender his to fall in with those of Anselmo,"
        vocab:
          - {w: "ofrecerse", d: "to come up, present itself (of an occasion)"}
          - {w: "dejar de", d: "to stop, give up (doing something)"}
          - {w: "acudir a", d: "to attend to, devote oneself to"}
          - {w: "gusto", d: "pleasure, taste, liking"}
        diagram:
          - s: "dejaba Anselmo"
            r: "main verb 1 (after 'pero'): Anselmo gave up"
            under:
              - {s: "cuando se ofrecía", r: "when: when the occasion arose"}
              - {s: "de acudir a sus gustos", r: "what he gave up: attending to his own pleasures"}
              - {s: "por seguir los de Lotario", r: "why: to follow Lotario's"}
          - s: "Lotario dejaba los suyos"
            r: "main verb 2 (after 'y'): Lotario gave up his own"
            under:
              - {s: "por acudir a los de Anselmo", r: "why: to attend to Anselmo's"}
        forms:
          - {w: "se ofrecía", f: "ofrec- + -ía → ofrecerse (to present itself), imperfect, it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían. The imperfect here means 'whenever it happened'."}
          - {w: "dejaba", f: "dej- + -aba → dejar (to leave off), imperfect, he: 'would give up'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "acudir, seguir", f: "infinitives after 'de' and 'por' (in order to)."}
          - {w: "sus", f: "'his', plural to match 'gustos', not the owner."}
          - {w: "los suyos", f: "'his own (ones)', masculine plural standing for 'gustos'."}
      - es: "y, desta manera, andaban tan a una sus voluntades, que no había concertado reloj que así lo anduviese."
        literal: "and, of-this manner, went so-much at one their wills, that not there-was well-regulated clock that so it might-go."
        ormsby: "and in this way their inclinations kept pace one with the other with a concord so perfect that the best regulated clock could not surpass it."
        vocab:
          - {w: "desta", d: "= de esta, 'of this'"}
          - {w: "andar a una", d: "to go together, be in step, agree"}
          - {w: "voluntad", d: "will, wish, inclination"}
          - {w: "concertado", d: "well-regulated, in good order"}
          - {w: "reloj", d: "clock"}
        diagram:
          - s: "andaban"
            r: "main verb: went"
            under:
              - {s: "desta manera", r: "how: in this way"}
              - s: "tan a una"
                r: "how: so much in step"
                under:
                  - {s: "que no había concertado reloj que así lo anduviese", r: "result: that no well-kept clock could keep such time"}
              - {s: "sus voluntades", r: "subject: their wills"}
        forms:
          - {w: "desta", f: "de + esta (of this), fused; modern Spanish keeps only 'del'."}
          - {w: "andaban", f: "and- + -aban → andar (to go), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "había", f: "hab- + -ía → haber, imperfect, used alone as 'there was'. había, habías, había, habíamos, habíais, habían."}
          - {w: "concertado", f: "participle of concertar (to put in order), masculine to match 'reloj', used as an adjective and placed before the noun."}
          - {w: "anduviese", f: "anduv- + -iese → andar (to go), imperfect subjunctive (-se form), it: 'that might go'. andar has an irregular past stem anduv-: anduviese, anduvieses, anduviese, anduviésemos, anduvieseis, anduviesen. Subjunctive because the clock does not exist."}
      - es: "»Andaba Anselmo perdido de amores de una doncella principal y hermosa de la misma ciudad, hija de tan buenos padres y tan buena ella por sí, que se determinó, con el parecer de su amigo Lotario, sin el cual ninguna cosa hacía, de pedilla por esposa a sus padres, y así lo puso en ejecución;"
        literal: "»Went Anselmo lost of loves of a maiden of-rank and beautiful of the same city, daughter of such good parents and so good she by herself, that he-determined, with the opinion of his friend Lotario, without the whom no thing he-did, of to-ask-for-her as wife to her parents, and so it he-put into execution;"
        ormsby: "Anselmo was deep in love with a highborn and beautiful maiden of the same city, the daughter of parents so estimable, and so estimable herself, that he resolved, with the approval of his friend Lothario, without whom he did nothing, to ask her of them in marriage, and did so,"
        vocab:
          - {w: "perdido de amores", d: "madly in love, lost in love"}
          - {w: "doncella", d: "maiden, unmarried girl"}
          - {w: "por sí", d: "in herself, on her own account"}
          - {w: "determinarse de", d: "to make up one's mind to"}
          - {w: "parecer", d: "(noun) opinion, advice"}
          - {w: "pedilla", d: "= pedirla, 'to ask for her' (in marriage)"}
          - {w: "poner en ejecución", d: "to carry out, put into effect"}
        diagram:
          - s: "Andaba Anselmo perdido de amores"
            r: "main verb 1: Anselmo was madly in love"
            under:
              - s: "de una doncella principal y hermosa de la misma ciudad"
                r: "with whom"
                under:
                  - {s: "hija de tan buenos padres y tan buena ella por sí", r: "describes 'doncella': daughter of such good parents and so good herself"}
                  - s: "que se determinó"
                    r: "result: that he decided"
                    under:
                      - s: "con el parecer de su amigo Lotario"
                        r: "how: with his friend Lotario's advice"
                        under:
                          - {s: "sin el cual ninguna cosa hacía", r: "describes 'Lotario': without whom he did nothing"}
                      - {s: "de pedilla por esposa a sus padres", r: "what he decided: to ask her parents for her hand"}
          - {s: "y así lo puso en ejecución", r: "main verb 2 (after 'y'): and so he did"}
        forms:
          - {w: "Andaba", f: "and- + -aba → andar (to go, be), imperfect, he. With an adjective, andar means 'to be (going about)': 'he was lost in love'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "perdido", f: "participle of perder (to lose), masculine to match Anselmo."}
          - {w: "buenos, buena", f: "bueno (good): masculine plural to match 'padres', feminine singular to match 'ella'."}
          - {w: "se determinó", f: "determin- + -ó → determinarse (to decide), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "hacía", f: "hac- + -ía → hacer (to do), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "pedilla", f: "pedir (to ask for) + la (her), with -rl- turned into -ll-, an old sound change: pedirla → pedilla."}
          - {w: "puso", f: "pus- + -o → poner (to put), preterite, he. Irregular: puse, pusiste, puso, pusimos, pusisteis, pusieron."}
      - es: "y el que llevó la embajada fue Lotario, y el que concluyó el negocio tan a gusto de su amigo, que en breve tiempo se vio puesto en la posesión que deseaba, y Camila tan contenta de haber alcanzado a Anselmo por esposo, que no cesaba de dar gracias al cielo, y a Lotario, por cuyo medio tanto bien le había venido."
        literal: "and the one who carried the embassy was Lotario, and the one who concluded the business so-much to liking of his friend, that in brief time he-saw-himself put in the possession that he-desired, and Camila so happy of to-have obtained [to] Anselmo as husband, that not she-ceased of giving thanks to-the heaven, and to Lotario, through whose means so-much good to-her had come."
        ormsby: "Lothario being the bearer of the demand, and conducting the negotiation so much to the satisfaction of his friend that in a short time he was in possession of the object of his desires, and Camilla so happy in having won Anselmo for her husband, that she gave thanks unceasingly to heaven and to Lothario, by whose means such good fortune had fallen to her."
        vocab:
          - {w: "embajada", d: "message, errand (here: the marriage proposal)"}
          - {w: "a gusto de", d: "to the satisfaction of"}
          - {w: "negocio", d: "business, affair"}
          - {w: "verse puesto en", d: "to find oneself placed in"}
          - {w: "alcanzar", d: "to obtain, win"}
          - {w: "cesar de", d: "to stop, cease"}
          - {w: "por cuyo medio", d: "by whose means, through whom"}
        diagram:
          - s: "fue Lotario"
            r: "main verb 1: was Lotario"
            under:
              - {s: "el que llevó la embajada", r: "subject: the one who carried the proposal"}
          - s: "y el que concluyó el negocio"
            r: "main verb 2: and (Lotario was) the one who concluded the business"
            under:
              - s: "tan a gusto de su amigo"
                r: "how: so much to his friend's liking"
                under:
                  - {s: "que en breve tiempo se vio puesto en la posesión que deseaba", r: "result: that soon Anselmo found himself in possession of what he wanted"}
          - s: "y Camila tan contenta"
            r: "part 3 (verb 'was' understood): and Camila was so happy"
            under:
              - {s: "de haber alcanzado a Anselmo por esposo", r: "why: at having won Anselmo as husband"}
              - s: "que no cesaba de dar gracias al cielo, y a Lotario"
                r: "result: that she never stopped thanking heaven and Lotario"
                under:
                  - {s: "por cuyo medio tanto bien le había venido", r: "describes 'Lotario': through whom such good had come to her"}
        forms:
          - {w: "llevó, concluyó", f: "llev- + -ó → llevar (to carry), conclu- + -yó → concluir (to conclude), preterite, he. The -ar preterite: -é, -aste, -ó, -amos, -asteis, -aron; concluir puts a y between the stem and -ó (concluyó)."}
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, he. ser's preterite is irregular: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "se vio puesto", f: "vi- + -o → verse (to see oneself), preterite, he, + puesto, the participle of poner (to put): 'he found himself placed'. ver in the preterite: vi, viste, vio, vimos, visteis, vieron."}
          - {w: "deseaba", f: "dese- + -aba → desear (to desire), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "contenta", f: "feminine to match Camila."}
          - {w: "haber alcanzado", f: "haber (to have) + alcanzado, the participle of alcanzar (to win): the perfect infinitive 'to have won', after 'de'."}
          - {w: "cesaba", f: "ces- + -aba → cesar (to cease), imperfect, she. Same -aba imperfect."}
          - {w: "al", f: "a + el, fused: 'to the'."}
          - {w: "cuyo", f: "'whose', agreeing with the thing owned ('medio'), not the owner."}
          - {w: "le había venido", f: "hab- + -ía → haber, imperfect, + venido, the participle of venir (to come): the pluperfect 'had come'. había, habías, había, habíamos, habíais, habían. 'le' = to her."}
  - sentences:
      - es: "»Los primeros días, como todos los de boda suelen ser alegres, continuó Lotario, como solía, la casa de su amigo Anselmo, procurando honralle, festejalle y regocijalle con todo aquello que a él le fue posible;"
        literal: "»The first days, as all those of wedding are-wont to-be merry, frequented Lotario, as he-was-wont, the house of his friend Anselmo, trying to-honor-him, to-fete-him and to-gladden-him with all that which to him to-him was possible;"
        ormsby: "The first few days, those of a wedding being usually days of merrymaking, Lothario frequented his friend Anselmo’s house as he had been wont, striving to do honour to him and to the occasion, and to gratify him in every way he could;"
        vocab:
          - {w: "boda", d: "wedding"}
          - {w: "soler", d: "to be in the habit of, usually (do)"}
          - {w: "continuar la casa", d: "to keep visiting the house, frequent it; a sense of 'continuar' now lost"}
          - {w: "honralle", d: "= honrarle, to honor him"}
          - {w: "festejalle", d: "= festejarle, to entertain him, make much of him"}
          - {w: "regocijalle", d: "= regocijarle, to gladden him"}
        diagram:
          - s: "continuó Lotario"
            r: "main verb: Lotario kept frequenting"
            under:
              - {s: "Los primeros días", r: "when: the first days"}
              - {s: "como todos los de boda suelen ser alegres", r: "why: as all wedding days tend to be merry"}
              - {s: "como solía", r: "how: as he used to"}
              - {s: "la casa de su amigo Anselmo", r: "object: his friend Anselmo's house"}
              - s: "procurando honralle, festejalle y regocijalle"
                r: "how: trying to honor, entertain and cheer him"
                under:
                  - {s: "con todo aquello que a él le fue posible", r: "with what: with everything in his power"}
        forms:
          - {w: "suelen", f: "suel- + -en → soler (to be wont), present, they. The stem o becomes ue when stressed: suelo, sueles, suele, solemos, soléis, suelen."}
          - {w: "continuó", f: "continu- + -ó → continuar (to continue, frequent), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "solía", f: "sol- + -ía → soler (to be wont), imperfect, he: 'as he used to'. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "procurando", f: "gerund of procurar (to try): 'trying'."}
          - {w: "honralle, festejalle y regocijalle", f: "honrar, festejar, regocijar (to honor, entertain, gladden) + le (him), with -rl- turned into -ll-: honrarle → honralle. Cervantes uses this old pronunciation often."}
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, it. fui, fuiste, fue, fuimos, fuisteis, fueron."}
      - es: "pero, acabadas las bodas y sosegada ya la frecuencia de las visitas y parabienes, comenzó Lotario a descuidarse con cuidado de las idas en casa de Anselmo, por parecerle a él —como es razón que parezca a todos los que fueren discretos— que no se han de visitar ni continuar las casas de los amigos casados de la misma manera que cuando eran solteros;"
        literal: "but, finished the weddings and calmed now the frequency of the visits and congratulations, began Lotario to neglect-himself with care of the goings in house of Anselmo, for to-seem-to-him to him (as is reason that it-seem to all those who may-be wise) that not one has to visit nor frequent the houses of the friends married of the same manner as when they-were bachelors;"
        ormsby: "but when the wedding days were over and the succession of visits and congratulations had slackened, he began purposely to leave off going to the house of Anselmo, for it seemed to him, as it naturally would to all men of sense, that friends’ houses ought not to be visited after marriage with the same frequency as in their masters’ bachelor days:"
        vocab:
          - {w: "bodas", d: "wedding festivities (plural for the several days of celebration)"}
          - {w: "sosegar", d: "to calm, quiet down"}
          - {w: "parabién", d: "congratulation"}
          - {w: "descuidarse con cuidado", d: "to grow careless on purpose, a play on 'cuidado' (care): to neglect carefully"}
          - {w: "ida", d: "going, visit"}
          - {w: "es razón que", d: "it is right that, it stands to reason that"}
          - {w: "discreto", d: "false friend: sensible, wise, not 'discreet'"}
          - {w: "haber de", d: "to have to, must"}
        diagram:
          - s: "comenzó Lotario"
            r: "main verb (after 'pero'): Lotario began"
            under:
              - {s: "acabadas las bodas", r: "when: the wedding over"}
              - {s: "y sosegada ya la frecuencia de las visitas y parabienes", r: "when: and the round of visits and congratulations died down"}
              - {s: "a descuidarse con cuidado de las idas en casa de Anselmo", r: "what he began: carefully to neglect visiting Anselmo's house"}
              - s: "por parecerle a él"
                r: "why: because it seemed to him"
                under:
