  - sentences:
      - es: "»Volvimos a Constantinopla, y el año siguiente, que fue el de setenta y tres, se supo en ella cómo el señor don Juan había ganado a Túnez, y quitado aquel reino a los turcos y puesto en posesión dél a Muley Hamet, cortando las esperanzas que de volver a reinar en él tenía Muley Hamida, el moro más cruel y más valiente que tuvo el mundo."
        literal: "»We-returned to Constantinople, and the year following, which was the [one] of seventy and three, itself knew in it how the lord don Juan had won [to] Tunis, and taken that kingdom from the Turks and put in possession of-it [to] Muley Hamet, cutting the hopes that of returning to reign in it had Muley Hamida, the Moor most cruel and most brave that had the world."
        ormsby: "We returned to Constantinople, and the following year, seventy-three, it became known that Don John had seized Tunis and taken the kingdom from the Turks, and placed Muley Hamete in possession, putting an end to the hopes which Muley Hamida, the cruelest and bravest Moor in the world, entertained of returning to reign there."
        vocab:
          - {w: "Túnez", d: "Tunis, taken by Don Juan de Austria in October 1573"}
          - {w: "quitar a", d: "to take away from"}
          - {w: "poner en posesión de", d: "to put in possession of, install as ruler"}
          - {w: "Muley Hamet", d: "Mulay Muhammad, a prince of the Hafsid dynasty of Tunis, set up by Spain as a puppet king"}
          - {w: "Muley Hamida", d: "Mulay Ahmad (Hamida), the deposed Hafsid king of Tunis, notorious for cruelty (he blinded his own father)"}
          - {w: "Muley", d: "Arabic 'mawlay', 'my lord', a royal title"}
        diagram:
          - {s: "»Volvimos a Constantinopla", r: "main verb 1: we went back to Constantinople"}
          - s: "y el año siguiente ... se supo en ella"
            r: "main verb 2: and the next year it became known there"
            under:
              - {s: "que fue el de setenta y tres", r: "describes 'año': which was '73"}
              - {s: "cómo el señor don Juan había ganado a Túnez", r: "what, 1: that Don John had taken Tunis"}
              - {s: "y quitado aquel reino a los turcos", r: "what, 2: and taken that kingdom from the Turks"}
              - s: "y puesto en posesión dél a Muley Hamet"
                r: "what, 3: and put Muley Hamet in possession of it"
                under:
                  - s: "cortando las esperanzas"
                    r: "result: cutting off the hopes"
                    under:
                      - {s: "que de volver a reinar en él tenía Muley Hamida", r: "describes 'esperanzas': that Muley Hamida had of reigning there again"}
                      - {s: "el moro más cruel y más valiente que tuvo el mundo", r: "describes 'Muley Hamida': the cruelest and bravest Moor the world ever had"}
        forms:
          - {w: "Volvimos", f: "volv- + -imos → volver (to return), preterite, we. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "se supo", f: "sup- + -o → saber (to know), preterite, it, with passive 'se': 'it was learned'. supe, supiste, supo, supimos, supisteis, supieron."}
          - {w: "había ganado ... quitado ... puesto", f: "había = haber, imperfect, he (había, habías, había, habíamos, habíais, habían) + three participles: ganado (won), quitado (taken away), puesto (put, irregular from poner). One 'había' serves all three."}
          - {w: "dél", f: "de + él fused: 'of it' (the kingdom)."}
          - {w: "cortando", f: "gerund of cortar (to cut)."}
          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "tuvo", f: "tuv- + -o → tener (to have), preterite, it: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron."}
      - es: "Sintió mucho esta pérdida el Gran Turco, y, usando de la sagacidad que todos los de su casa tienen, hizo paz con venecianos, que mucho más que él la deseaban;"
        literal: "Felt much this loss the Great Turk, and, using of the shrewdness that all those of his house have, made peace with Venetians, who much more than he it desired;"
        ormsby: "The Grand Turk took the loss greatly to heart, and with the cunning which all his race possess, he made peace with the Venetians (who were much more eager for it than he was),"
        vocab:
          - {w: "sentir", d: "to feel; to regret, be grieved by"}
          - {w: "usar de", d: "to make use of"}
          - {w: "sagacidad", d: "shrewdness, cunning"}
          - {w: "los de su casa", d: "those of his house: his dynasty, the Ottomans"}
        diagram:
          - {s: "Sintió mucho esta pérdida el Gran Turco", r: "main verb 1: the Sultan felt this loss deeply"}
          - s: "hizo paz con venecianos"
            r: "main verb 2 (after 'y'): he made peace with the Venetians"
            under:
              - {s: "usando de la sagacidad que todos los de su casa tienen", r: "how: using the cunning all his dynasty have"}
              - {s: "que mucho más que él la deseaban", r: "describes 'venecianos': who wanted it far more than he did"}
        forms:
          - {w: "Sintió", f: "sint- + -ió → sentir (to feel), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron; sentir changes e to i here."}
          - {w: "usando", f: "gerund of usar (to use)."}
          - {w: "tienen", f: "tien- + -en → tener (to have), present, they: tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "hizo", f: "hiz- + -o → hacer (to make), preterite, he: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "deseaban", f: "dese- + -aban → desear (to want), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
        note: "Venice made a separate peace with the Ottomans in March 1573, giving up Cyprus, which effectively ended the Holy League."
      - es: "y el año siguiente de setenta y cuatro acometió a la Goleta y al fuerte que junto a Túnez había dejado medio levantado el señor don Juan."
        literal: "and the year following of seventy and four he-attacked [to] the Goletta and [to-]the fort that next to Tunis had left half raised the lord don Juan."
        ormsby: "and the following year, seventy-four, he attacked the Goletta and the fort which Don John had left half built near Tunis."
        vocab:
          - {w: "acometer", d: "to attack, assault"}
          - {w: "la Goleta", d: "La Goletta (Halq al-Wadi), the fortress guarding the channel into the lake of Tunis, held by Spain since 1535"}
          - {w: "medio levantado", d: "half built"}
        diagram:
          - s: "acometió"
            r: "main verb: he attacked"
            under:
              - {s: "el año siguiente de setenta y cuatro", r: "when: the next year, '74"}
              - {s: "a la Goleta", r: "object 1: the Goletta"}
              - s: "y al fuerte"
                r: "object 2: and the fort"
                under:
                  - {s: "que junto a Túnez había dejado medio levantado el señor don Juan", r: "describes 'fuerte': that Don John had left half built near Tunis"}
        forms:
          - {w: "acometió", f: "acomet- + -ió → acometer (to attack), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "al", f: "a + el fused; 'a' marks the object even for places here."}
          - {w: "había dejado", f: "había = haber, imperfect, he (había, habías, había, habíamos, habíais, habían) + dejado, participle of dejar (to leave)."}
          - {w: "levantado", f: "participle of levantar (to raise, build), masculine to match 'fuerte'."}
        ormsby_note: "The fort commanding the entrance, the \"gullet,\" to the lagoon of Tunis."
      - es: "En todos estos trances andaba yo al remo, sin esperanza de libertad alguna; a lo menos, no esperaba tenerla por rescate, porque tenía determinado de no escribir las nuevas de mi desgracia a mi padre."
        literal: "In all these trials went I at-the oar, without hope of liberty any; at the least, not I-hoped to-have-it by ransom, because I-had determined of not writing the news of my misfortune to my father."
        ormsby: "While all these events were occurring, I was labouring at the oar without any hope of freedom; at least I had no hope of obtaining it by ransom, for I was firmly resolved not to write to my father telling him of my misfortunes."
        vocab:
          - {w: "trance", d: "critical moment, event, trial"}
          - {w: "andar al remo", d: "to be at the oar, serve as a galley slave"}
          - {w: "rescate", d: "ransom"}
          - {w: "tener determinado de", d: "to have resolved to"}
          - {w: "desgracia", d: "misfortune (false friend: not 'disgrace')"}
        diagram:
          - s: "andaba yo al remo"
            r: "main verb 1: I was at the oar"
            under:
              - {s: "En todos estos trances", r: "when: through all these events"}
              - {s: "sin esperanza de libertad alguna", r: "how: with no hope of freedom at all"}
          - s: "a lo menos, no esperaba tenerla por rescate"
            r: "main verb 2: at least I didn't hope to get it by ransom"
            under:
              - {s: "porque tenía determinado de no escribir las nuevas de mi desgracia a mi padre", r: "why: because I had resolved not to write my father of my misfortune"}
        forms:
          - {w: "andaba, esperaba", f: "and- + -aba → andar (to go about), esper- + -aba → esperar (to hope), imperfect, I. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "alguna", f: "algun- + -a → alguno, feminine to match 'libertad'; after the noun with 'sin' it means 'none at all'."}
          - {w: "tenerla", f: "tener (to have) + la (it, freedom)."}
          - {w: "tenía determinado", f: "ten- + -ía → tener, imperfect, I (-ía, -ías, -ía, -íamos, -íais, -ían) + determinado, participle of determinar (to decide): 'I had decided'."}
        note: "Captives of rank were held for ransom, paid by their families or by the friars of the Trinitarian and Mercedarian orders. Cervantes' own family ruined itself to ransom him."
  - sentences:
      - es: "»Perdióse, en fin, la Goleta; perdióse el fuerte, sobre las cuales plazas hubo de soldados turcos, pagados, setenta y cinco mil, y de moros, y alárabes de toda la Africa, más de cuatrocientos mil, acompañado este tan gran número de gente con tantas municiones y pertrechos de guerra, y con tantos gastadores, que con las manos y a puñados de tierra pudieran cubrir la Goleta y el fuerte."
        literal: "»Was-lost-itself, in end, the Goletta; was-lost-itself the fort, upon which strongholds there-were of soldiers Turkish, paid, seventy and five thousand, and of Moors, and Arabs of all the Africa, more than four-hundred thousand, accompanied this so great number of people with so-many munitions and supplies of war, and with so-many sappers, that with the hands and by handfuls of earth they-could-have covered the Goletta and the fort."
        ormsby: "At length the Goletta fell, and the fort fell, before which places there were seventy-five thousand regular Turkish soldiers, and more than four hundred thousand Moors and Arabs from all parts of Africa, and in the train of all this great host such munitions and engines of war, and so many pioneers that with their hands they might have covered the Goletta and the fort with handfuls of earth."
        vocab:
          - {w: "perderse", d: "to be lost, fall (of a fortress)"}
          - {w: "plaza", d: "fortified place, stronghold"}
          - {w: "soldados pagados", d: "paid, regular troops (as opposed to irregular levies)"}
          - {w: "alárabe", d: "old form of 'árabe': Arab, especially a Bedouin"}
          - {w: "pertrechos", d: "military stores, equipment"}
          - {w: "gastador", d: "sapper, pioneer: a labourer who digs trenches for an army (also 'spendthrift')"}
          - {w: "a puñados", d: "by handfuls"}
        diagram:
          - {s: "»Perdióse, en fin, la Goleta", r: "main verb 1: in the end the Goletta fell"}
          - s: "perdióse el fuerte"
            r: "main verb 2: the fort fell"
            under:
              - s: "sobre las cuales plazas hubo de soldados turcos, pagados, setenta y cinco mil"
                r: "describes both places: against which there were 75,000 regular Turkish troops"
                under:
                  - {s: "y de moros, y alárabes de toda la Africa, más de cuatrocientos mil", r: "and: over 400,000 Moors and Arabs from all Africa"}
              - s: "acompañado este tan gran número de gente con tantas municiones y pertrechos de guerra, y con tantos gastadores"
                r: "how: this huge host being supplied with so much munition and so many sappers"
                under:
                  - {s: "que con las manos y a puñados de tierra pudieran cubrir la Goleta y el fuerte", r: "result: that they could have buried the Goletta and the fort with handfuls of earth"}
        forms:
          - {w: "Perdióse, perdióse", f: "perd- + -ió → perderse (to be lost), preterite, it, + se: modern 'se perdió'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron. The repeated verb opening each clause gives a tolling rhythm."}
          - {w: "las cuales", f: "'which', feminine plural to match 'plazas'; here used before the noun as an adjective."}
          - {w: "hubo", f: "hub- + -o → haber, preterite, used alone as 'there were': hube, hubiste, hubo, hubimos, hubisteis, hubieron."}
          - {w: "pagados", f: "participle of pagar (to pay), masculine plural to match 'soldados'."}
          - {w: "acompañado", f: "participle of acompañar (to accompany), masculine to match 'número': an absolute phrase, 'this great number being accompanied'."}
          - {w: "gran", f: "grande clipped before a singular noun ('número')."}
          - {w: "pudieran", f: "pud- + -ieran → poder (can), imperfect subjunctive (-ra form), they, as a conditional: 'could have'. pudiera, pudieras, pudiera, pudiéramos, pudierais, pudieran."}
        note: "The numbers are exaggerated, as soldiers' numbers usually are. Cervantes' own regiment had been in the Tunis garrison, and his brother Rodrigo is thought to have served there."
      - es: "Perdióse primero la Goleta, tenida hasta entonces por inexpugnable;"
        literal: "Was-lost-itself first the Goletta, held until then as impregnable;"
        ormsby: "The first to fall was the Goletta, until then reckoned impregnable,"
        vocab:
          - {w: "tener por", d: "to consider, regard as"}
          - {w: "inexpugnable", d: "impregnable, that cannot be taken by storm"}
        diagram:
          - s: "Perdióse primero la Goleta"
            r: "main verb: the Goletta fell first"
            under:
              - {s: "tenida hasta entonces por inexpugnable", r: "describes 'Goleta': thought impregnable until then"}
        forms:
          - {w: "Perdióse", f: "perd- + -ió → perderse (to be lost), preterite, it, + se: modern 'se perdió'. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "tenida", f: "participle of tener (to hold, regard), feminine to match 'Goleta'."}
