part: 1
chapter: 39
title_es: "Capítulo XXXIX. Donde el cautivo cuenta su vida y sucesos"
title_en: "Wherein the captive relates his life and adventures"
paragraphs:
  - sentences:
      - es: "— «En un lugar de las Montañas de León tuvo principio mi linaje, con quien fue más agradecida y liberal la naturaleza que la fortuna, aunque, en la estrecheza de aquellos pueblos, todavía alcanzaba mi padre fama de rico, y verdaderamente lo fuera si así se diera maña a conservar su hacienda como se la daba en gastalla."
        literal: "— «In a place of the Mountains of León had beginning my lineage, with which was more grateful and generous the nature than the fortune, although, in the narrowness of those villages, still obtained my father fame of rich, and truly it he-would-have-been if so he-gave-himself skill to keep his estate as himself it he-gave in spending-it."
        ormsby: "My family had its origin in a village in the mountains of León, and nature had been kinder and more generous to it than fortune; though in the general poverty of those communities my father passed for being even a rich man; and he would have been so in reality had he been as clever in preserving his property as he was in spending it."
        vocab:
          - {w: "Montañas de León", d: "the mountain country of northern León, cradle of old noble families; to come from 'las Montañas' was a claim to pure, ancient blood"}
          - {w: "tener principio", d: "to have its beginning, originate"}
          - {w: "linaje", d: "lineage, family line"}
          - {w: "agradecido", d: "here 'kind, generous' (of nature to a family), not just 'grateful'"}
          - {w: "liberal", d: "generous, open-handed (false friend: not political)"}
          - {w: "estrecheza", d: "old form of 'estrechez': narrowness, poverty, want"}
          - {w: "alcanzar fama de", d: "to have the reputation of, pass for"}
          - {w: "darse maña a", d: "to be skilful at, manage cleverly"}
          - {w: "hacienda", d: "property, estate, fortune (not 'ranch')"}
          - {w: "gastalla", d: "= gastarla, 'spending it'; old -rl- > -ll- assimilation"}
        diagram:
          - s: "tuvo principio"
            r: "main verb 1: had its beginning"
            under:
              - {s: "En un lugar de las Montañas de León", r: "where"}
              - s: "mi linaje"
                r: "subject: my family"
                under:
                  - {s: "con quien fue más agradecida y liberal la naturaleza que la fortuna", r: "describes 'linaje': to which nature was kinder than fortune"}
          - s: "todavía alcanzaba mi padre fama de rico"
            r: "concession (after 'aunque'): my father still passed for rich"
            under:
              - {s: "en la estrecheza de aquellos pueblos", r: "where: in the poverty of those villages"}
          - s: "y verdaderamente lo fuera"
            r: "main verb 2: and he would truly have been (rich)"
            under:
              - s: "si así se diera maña a conservar su hacienda"
                r: "condition: if he had been as clever at keeping his property"
                under:
                  - {s: "como se la daba en gastalla", r: "comparison: as he was at spending it"}
        forms:
          - {w: "tuvo", f: "tuv- + -o → tener (to have), preterite, it. Irregular: tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron."}
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, she (nature). ser's preterite: fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "agradecida", f: "agradecid- + -a → agradecido (kind, grateful), feminine to match 'naturaleza'."}
          - {w: "alcanzaba", f: "alcanz- + -aba → alcanzar (to obtain), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "fuera", f: "fu- + -era → ser (to be), imperfect subjunctive (-ra form), he, used as a conditional: 'he would have been'. fuera, fueras, fuera, fuéramos, fuerais, fueran."}
          - {w: "se diera", f: "d- + -iera → darse (to give oneself), imperfect subjunctive (-ra form), he, after 'si': 'if he had applied himself'. diera, dieras, diera, diéramos, dierais, dieran."}
          - {w: "se la daba", f: "d- + -aba → dar (to give), imperfect, he. Same -aba imperfect. 'se' = himself, 'la' = it (the 'maña', skill)."}
          - {w: "gastalla", f: "gastar (to spend) + la (it) with -rl- turned into -ll-: modern 'gastarla'."}
        ormsby_note: "\"Montañas de Burgos\" and \"Montañas de León\" were the names given to the southern slopes of the western continuation of the Pyrenees, the cradle of most of the old Gothic families of Spain, that of Cervantes himself among the number."
        note: "The captive's first words echo the novel's own first line, 'En un lugar de la Mancha'. Here the place is named: the mountains of León, which marks his family as old Christian gentry."
      - es: "Y la condición que tenía de ser liberal y gastador le procedió de haber sido soldado los años de su joventud, que es escuela la soldadesca donde el mezquino se hace franco, y el franco, pródigo;"
        literal: "And the disposition that he-had of being generous and spender to-him came from having been soldier the years of his youth, for [it] is school the soldiering where the stingy-man makes-himself open-handed, and the open-handed [man], prodigal;"
        ormsby: "This tendency of his to be liberal and profuse he had acquired from having been a soldier in his youth, for the soldier’s life is a school in which the niggard becomes freehanded and the freehanded prodigal;"
        vocab:
          - {w: "condición", d: "nature, temperament, character (false friend: not 'condition')"}
          - {w: "gastador", d: "spendthrift, big spender"}
          - {w: "proceder de", d: "to come from, arise from"}
          - {w: "joventud", d: "old form of 'juventud': youth"}
          - {w: "soldadesca", d: "soldiering, the soldier's life"}
          - {w: "mezquino", d: "stingy, mean; a miser"}
          - {w: "franco", d: "open-handed, generous (also 'frank')"}
          - {w: "pródigo", d: "prodigal, wasteful"}
        diagram:
          - s: "le procedió"
            r: "main verb: came to him"
            under:
              - s: "la condición"
                r: "subject: the disposition"
                under:
                  - {s: "que tenía de ser liberal y gastador", r: "describes 'condición': that he had, of being generous and lavish"}
              - {s: "de haber sido soldado los años de su joventud", r: "from what: from having been a soldier in his youth"}
              - s: "que es escuela la soldadesca"
                r: "why: for soldiering is a school"
                under:
                  - {s: "donde el mezquino se hace franco, y el franco, pródigo", r: "describes 'escuela': where the miser becomes generous and the generous prodigal"}
        forms:
          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "procedió", f: "proced- + -ió → proceder (to come from), preterite, it. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "haber sido", f: "haber (to have) as infinitive after 'de' + sido, participle of ser (to be): 'having been'."}
          - {w: "se hace", f: "hac- + -e → hacerse (to become), present, he. The present of -er verbs: -o, -es, -e, -emos, -éis, -en (hacer has 'hago' for I)."}
          - {w: "y el franco, pródigo", f: "the verb 'se hace' is left out the second time and replaced by a comma."}
      - es: "y si algunos soldados se hallan miserables, son como monstruos, que se ven raras veces."
        literal: "and if some soldiers find-themselves stingy, they-are like monsters, which are-seen rare times."
        ormsby: "and if any soldiers are to be found who are misers, they are monsters of rare occurrence."
        vocab:
          - {w: "hallarse", d: "to be found, turn out to be"}
          - {w: "miserable", d: "here 'miserly, stingy' (a common Golden Age sense), not 'unhappy'"}
          - {w: "raras veces", d: "seldom, rarely"}
        diagram:
          - s: "son como monstruos"
            r: "main verb: they are like monsters"
            under:
              - {s: "y si algunos soldados se hallan miserables", r: "condition: if some soldiers turn out stingy"}
              - {s: "que se ven raras veces", r: "describes 'monstruos': which are seldom seen"}
        forms:
          - {w: "se hallan", f: "hall- + -an → hallarse (to be found), present, they. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "son", f: "ser (to be), present, they: soy, eres, es, somos, sois, son."}
          - {w: "se ven", f: "ve- + -n → ver (to see), present, they, with 'se' making it passive: 'are seen'. veo, ves, ve, vemos, veis, ven."}
          - {w: "raras", f: "rar- + -as → raro (rare), feminine plural to match 'veces'."}
          - {w: "veces", f: "plural of 'vez' (time, occasion): z becomes c before -es."}
      - es: "Pasaba mi padre los términos de la liberalidad, y rayaba en los de ser pródigo: cosa que no le es de ningún provecho al hombre casado, y que tiene hijos que le han de suceder en el nombre y en el ser."
        literal: "Passed my father the limits of the generosity, and bordered on those of being prodigal: thing that not to-him is of no profit to-the man married, and who has children who him have to succeed in the name and in the being."
        ormsby: "My father went beyond liberality and bordered on prodigality, a disposition by no means advantageous to a married man who has children to succeed to his name and position."
        vocab:
          - {w: "pasar los términos de", d: "to go beyond the bounds of"}
          - {w: "rayar en", d: "to border on, verge on"}
          - {w: "provecho", d: "profit, benefit"}
          - {w: "haber de", d: "to be going to, must"}
          - {w: "suceder", d: "here 'to succeed, inherit from' (also 'to happen')"}
          - {w: "el ser", d: "being, standing, social rank"}
        diagram:
          - s: "Pasaba mi padre"
            r: "main verb 1: my father went beyond"
            under:
              - {s: "los términos de la liberalidad", r: "object: the limits of generosity"}
          - s: "y rayaba"
            r: "main verb 2: and bordered"
            under:
              - {s: "en los de ser pródigo", r: "on what: on those (limits) of being prodigal"}
          - s: "cosa que no le es de ningún provecho al hombre casado"
            r: "comment on the whole: a thing of no use to a married man"
            under:
              - {s: "y que tiene hijos", r: "describes 'hombre', 2: who has children"}
              - {s: "que le han de suceder en el nombre y en el ser", r: "describes 'hijos': who are to inherit his name and rank"}
        forms:
          - {w: "Pasaba, rayaba", f: "pas- + -aba → pasar (to pass), ray- + -aba → rayar (to border), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "los de", f: "'los' stands in for 'los términos': 'those of'."}
          - {w: "ningún", f: "ninguno (no, none) clipped before a masculine singular noun ('provecho'), like un, algún, buen."}
          - {w: "al", f: "a + el fused: 'to the'. The 'le' before the verb points ahead to it."}
          - {w: "tiene", f: "tien- + -e → tener (to have), present, he. tengo, tienes, tiene, tenemos, tenéis, tienen."}
          - {w: "han de suceder", f: "han = haber, present, they (he, has, ha, hemos, habéis, han) + de + infinitive: 'are to succeed'."}
      - es: "Los que mi padre tenía eran tres, todos varones y todos de edad de poder elegir estado."
        literal: "Those that my father had were three, all males and all of age of being-able to choose state."
        ormsby: "My father had three, all sons, and all of sufficient age to make choice of a profession."
        vocab:
          - {w: "varón", d: "male, man; 'todos varones' = all boys"}
          - {w: "elegir estado", d: "to choose a state in life: a career, the Church, or marriage"}
        diagram:
          - s: "eran tres"
            r: "main verb: were three"
            under:
              - s: "Los"
                r: "subject: those (children)"
                under:
                  - {s: "que mi padre tenía", r: "describes 'Los': that my father had"}
              - {s: "todos varones", r: "what kind: all boys"}
              - {s: "y todos de edad de poder elegir estado", r: "what kind, 2: all old enough to choose a calling"}
        forms:
          - {w: "Los que", f: "'those that': 'Los' stands in for 'los hijos' from the previous sentence."}
          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, he. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "eran", f: "er- + -an → ser (to be), imperfect, they. ser is irregular in the imperfect: era, eras, era, éramos, erais, eran."}
          - {w: "poder elegir", f: "two infinitives: poder (to be able) after 'de', then elegir (to choose) after poder."}
      - es: "Viendo, pues, mi padre que, según él decía, no podía irse a la mano contra su condición, quiso privarse del instrumento y causa que le hacía gastador y dadivoso, que fue privarse de la hacienda, sin la cual el mismo Alejandro pareciera estrecho."
        literal: "Seeing, then, my father that, according-to [what] he said, not he-could go-himself to the hand against his disposition, he-wanted to-deprive-himself of-the instrument and cause that him made spender and lavish, which was to-deprive-himself of the property, without which the very Alexander would-have-seemed tight-fisted."
        ormsby: "Finding, then, that he was unable to resist his propensity, he resolved to divest himself of the instrument and cause of his prodigality and lavishness, to divest himself of wealth, without which Alexander himself would have seemed parsimonious;"
        vocab:
          - {w: "irse a la mano", d: "to restrain oneself, hold back (literally 'to go to one's own hand')"}
          - {w: "privarse de", d: "to deprive oneself of, give up"}
          - {w: "dadivoso", d: "lavish with gifts, open-handed (from 'dádiva', gift)"}
          - {w: "Alejandro", d: "Alexander the Great, proverbial for his generosity as well as his conquests"}
          - {w: "estrecho", d: "here 'mean, tight-fisted' (literally 'narrow')"}
        diagram:
          - s: "quiso privarse"
            r: "main verb: he decided to deprive himself"
            under:
              - s: "Viendo, pues, mi padre"
                r: "why: my father, seeing"
                under:
                  - {s: "que, según él decía, no podía irse a la mano contra su condición", r: "what he saw: that, as he said, he could not restrain his nature"}
              - s: "del instrumento y causa"
                r: "of what: of the instrument and cause"
                under:
                  - {s: "que le hacía gastador y dadivoso", r: "describes 'instrumento y causa': that made him lavish"}
              - s: "que fue privarse de la hacienda"
                r: "explains: which meant giving up his property"
                under:
                  - {s: "sin la cual el mismo Alejandro pareciera estrecho", r: "describes 'hacienda': without which even Alexander would have looked stingy"}
        forms:
          - {w: "Viendo", f: "gerund of ver (to see): 'seeing'."}
          - {w: "decía, podía, hacía", f: "dec- + -ía → decir (to say), pod- + -ía → poder (to be able), hac- + -ía → hacer (to make), imperfect, he / it. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "irse", f: "ir (to go) + se (oneself), infinitive after 'podía'."}
          - {w: "quiso", f: "quis- + -o → querer (to want), preterite, he: here 'decided'. Irregular: quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "privarse", f: "privar (to deprive) + se (himself), infinitive after 'quiso'."}
          - {w: "del", f: "de + el fused: 'of the'."}
          - {w: "fue", f: "fu- + -e → ser (to be), preterite, it. fui, fuiste, fue, fuimos, fuisteis, fueron."}
          - {w: "pareciera", f: "parec- + -iera → parecer (to seem), imperfect subjunctive (-ra form), he, used as a conditional: 'would have seemed'. The -ra form of -er verbs: -iera, -ieras, -iera, -iéramos, -ierais, -ieran."}
  - sentences:
      - es: "»Y así, llamándonos un día a todos tres a solas en un aposento, nos dijo unas razones semejantes a las que ahora diré:"
        literal: "»And so, calling-us one day [to] all three alone in a room, to-us he-said some words similar to those that now I-will-say:"
        ormsby: "and so calling us all three aside one day into a room, he addressed us in words somewhat to the following effect:"
        vocab:
          - {w: "a solas", d: "alone, in private"}
          - {w: "aposento", d: "room, chamber"}
          - {w: "razones", d: "words, remarks (not 'reasons')"}
          - {w: "semejante", d: "similar, like"}
        diagram:
          - s: "nos dijo"
            r: "main verb: he said to us"
            under:
              - {s: "llamándonos un día a todos tres a solas en un aposento", r: "when / how: calling all three of us aside into a room one day"}
              - s: "unas razones semejantes"
                r: "object: words like"
                under:
                  - {s: "a las que ahora diré", r: "like what: those I will now repeat"}
        forms:
          - {w: "llamándonos", f: "llamando, gerund of llamar (to call), + nos (us), with an accent added to keep the stress."}
          - {w: "todos tres", f: "'all three', where modern Spanish says 'los tres'."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "semejantes", f: "semejante (similar) + -s, plural to match 'razones'."}
          - {w: "diré", f: "dir- + -é → decir (to say), future, I. decir has the short stem dir-: diré, dirás, dirá, diremos, diréis, dirán."}
        note: "The captive is telling his story aloud to the company at the inn; the » at the start of the paragraph marks that his speech continues."
      - es: "“Hijos, para deciros que os quiero bien, basta saber y decir que sois mis hijos;"
        literal: "“Sons, for to-tell-you that you I-love well, suffices to-know and to-say that you-are my sons;"
        ormsby: "“My sons, to assure you that I love you, no more need be known or said than that you are my sons;"
        vocab:
          - {w: "querer bien", d: "to love, wish well to (opposite 'querer mal', to dislike)"}
          - {w: "bastar", d: "to be enough, suffice"}
        diagram:
          - s: "basta"
            r: "main verb: it is enough"
            under:
              - {s: "Hijos", r: "who is addressed: sons"}
              - s: "para deciros"
                r: "purpose: to tell you"
                under:
                  - {s: "que os quiero bien", r: "what: that I love you"}
              - s: "saber y decir"
                r: "subject: knowing and saying"
                under:
                  - {s: "que sois mis hijos", r: "what: that you are my sons"}
        forms:
          - {w: "deciros", f: "decir (to say) + os (to you, plural), infinitive after 'para'."}
          - {w: "os quiero", f: "quier- + -o → querer (to love), present, I; 'os' = you (plural). The stem e becomes ie when stressed: quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "basta", f: "bast- + -a → bastar (to be enough), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "sois", f: "ser (to be), present, you (plural, vosotros): soy, eres, es, somos, sois, son."}
        note: "The father addresses his sons as 'vosotros', the familiar plural. The quotation marks open his speech inside the captive's story."
      - es: "y, para entender que os quiero mal, basta saber que no me voy a la mano en lo que toca a conservar vuestra hacienda."
        literal: "and, for to-understand that you I-love badly, suffices to-know that not myself I-go to the hand in that which touches to keeping your estate."
        ormsby: "and to encourage a suspicion that I do not love you, no more is needed than the knowledge that I have no self-control as far as preservation of your patrimony is concerned;"
        vocab:
          - {w: "querer mal", d: "to wish ill to, not to love"}
          - {w: "irse a la mano", d: "to restrain oneself, hold back"}
          - {w: "en lo que toca a", d: "as regards, in the matter of"}
          - {w: "hacienda", d: "property, estate, inheritance"}
        diagram:
          - s: "basta saber"
            r: "main verb: it is enough to know"
            under:
              - s: "para entender"
                r: "purpose: to understand"
                under:
                  - {s: "que os quiero mal", r: "what: that I do not love you"}
              - s: "que no me voy a la mano"
                r: "what to know: that I don't restrain myself"
                under:
                  - {s: "en lo que toca a conservar vuestra hacienda", r: "in what: in keeping your inheritance"}
        forms:
          - {w: "quiero", f: "quier- + -o → querer (to love), present, I. quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "basta", f: "bast- + -a → bastar (to be enough), present, it. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "me voy", f: "voy → irse (to go), present, I: voy, vas, va, vamos, vais, van; 'me' because the verb is 'irse'."}
          - {w: "toca", f: "toc- + -a → tocar (to touch, concern), present, it. Same -ar present."}
          - {w: "vuestra", f: "vuestr- + -a → vuestro (your, for vosotros), feminine to match 'hacienda'."}
      - es: "Pues, para que entendáis desde aquí adelante que os quiero como padre, y que no os quiero destruir como padrastro, quiero hacer una cosa con vosotros que ha muchos días que la tengo pensada y con madura consideración dispuesta."
        literal: "Then, so that you-understand from here forward that you I-love as father, and that not you I-want to-destroy as stepfather, I-want to-do a thing with you that [it] has many days that it I-have thought-out and with ripe consideration arranged."
        ormsby: "therefore, that you may for the future feel sure that I love you like a father, and have no wish to ruin you like a stepfather, I propose to do with you what I have for some time back meditated, and after mature deliberation decided upon."
        vocab:
          - {w: "desde aquí adelante", d: "from now on, henceforth"}
          - {w: "padrastro", d: "stepfather; proverbially the cruel one who wastes the children's inheritance"}
          - {w: "ha muchos días", d: "'ha' = hace: for a long time now"}
          - {w: "madura consideración", d: "mature reflection"}
          - {w: "dispuesto", d: "arranged, settled, planned"}
        diagram:
          - s: "quiero hacer una cosa con vosotros"
            r: "main verb: I want to do something with you"
            under:
              - s: "para que entendáis desde aquí adelante"
                r: "purpose: so that you understand from now on"
                under:
                  - {s: "que os quiero como padre", r: "what, 1: that I love you as a father"}
                  - {s: "y que no os quiero destruir como padrastro", r: "what, 2: and don't want to ruin you as a stepfather"}
              - {s: "que ha muchos días que la tengo pensada y con madura consideración dispuesta", r: "describes 'cosa': that I have long had thought out and carefully planned"}
        forms:
          - {w: "entendáis", f: "entend- + -áis → entender (to understand), present subjunctive, you (plural), after 'para que'. The present subjunctive of -er verbs: -a, -as, -a, -amos, -áis, -an (the stem e becomes ie when stressed: entienda)."}
          - {w: "quiero", f: "quier- + -o → querer (to love, to want), present, I. quiero, quieres, quiere, queremos, queréis, quieren."}
          - {w: "ha", f: "haber (to have), present, it, meaning 'ago / for' like modern 'hace': he, has, ha, hemos, habéis, han."}
          - {w: "la tengo pensada", f: "teng- + -o → tener (to have), present, I (tengo, tienes, tiene, tenemos, tenéis, tienen) + pensada, participle of pensar (to think), feminine to match 'la' (the 'cosa'): 'I have it thought out'."}
          - {w: "dispuesta", f: "participle of disponer (to arrange), irregular (dispuesto), feminine to match 'cosa'."}
          - {w: "madura", f: "madur- + -a → maduro (ripe, mature), feminine to match 'consideración'."}
