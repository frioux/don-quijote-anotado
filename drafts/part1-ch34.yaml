      - es: "Creí, ansimismo, que ella, si fuera la que debía y la que entrambos pensábamos, ya te hubiera dado cuenta de mi solicitud, pero, habiendo visto que se tarda, conozco que son verdaderas las promesas que me ha dado de que, cuando otra vez hagas ausencia de tu casa, me hablará en la recámara, donde está el repuesto de tus alhajas —y era la verdad, que allí le solía hablar Camila—;"
        literal: "I-believed, likewise, that she, if she-were the [one] that she-ought and the [one] that both we-thought, already to-you would-have given account of my solicitation, but, having seen that she-delays, I-know that are true the promises that to-me she-has given of that, when another time you-make absence from your house, to-me she-will-speak in the closet, where is the store of your valuables (and it-was the truth, that there to-him used to-speak Camila);"
        ormsby: "I thought, too, that she, if she were what she ought to be, and what we both believed her, would have ere this given thee information of my addresses; but seeing that she delays, I believe the truth of the promise she has given me that the next time thou art absent from the house she will grant me an interview in the closet where thy jewels are kept (and it was true that Camilla used to meet him there);"
