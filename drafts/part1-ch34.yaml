  - sentences:
      - es: "»También alabó este segundo soneto Anselmo, como había hecho el primero, y desta manera iba añadiendo eslabón a eslabón a la cadena con que se enlazaba y trababa su deshonra, pues cuando más Lotario le deshonraba, entonces le decía que estaba más honrado;"
        literal: "Also praised this second sonnet Anselmo, as he-had done the first, and in-this manner he-went adding link to link to the chain with which himself he-bound and fastened his dishonor, since when more Lotario him dishonored, then him he-told that he-was more honored;"
        ormsby: "Anselmo praised this second sonnet too, as he had praised the first; and so he went on adding link after link to the chain with which he was binding himself and making his dishonour secure; for when Lothario was doing most to dishonour him he told him he was most honoured;"
        vocab:
          - {w: "eslabón", d: "link (of a chain)"}
          - {w: "enlazar", d: "to tie, bind"}
          - {w: "trabar", d: "to fasten, join, shackle"}
          - {w: "deshonra", d: "dishonor, disgrace"}
          - {w: "deshonrar", d: "to dishonor"}
        diagram:
          - s: "También alabó este segundo soneto Anselmo"
            r: "main verb 1: Anselmo praised this second sonnet too"
            under:
              - {s: "como había hecho el primero", r: "as he had done the first"}
          - s: "y desta manera iba añadiendo eslabón a eslabón a la cadena"
            r: "main verb 2: and so he kept adding link after link to the chain"
            under:
              - {s: "con que se enlazaba y trababa su deshonra", r: "describes 'cadena': with which his dishonor was bound and fastened"}
              - s: "pues cuando más Lotario le deshonraba, entonces le decía que estaba más honrado"
                r: "why: for the more Lotario dishonored him, the more he told him he was honored"
        forms:
          - {w: "alabó", f: "alab- + -ó → alabar (to praise), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "había hecho", f: "había (imperfect of haber) + hecho, the irregular participle of hacer: 'had done'."}
          - {w: "desta", f: "= de + esta (of this)."}
          - {w: "iba añadiendo", f: "iba (imperfect of ir) + añadiendo (gerund of añadir, to add): 'kept adding'. ir in the imperfect: iba, ibas, iba, íbamos, ibais, iban."}
          - {w: "se enlazaba y trababa", f: "enlaz- + -aba, trab- + -aba → enlazar (to bind), trabar (to fasten), imperfect, with passive 'se'. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
