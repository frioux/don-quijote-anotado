          - {w: "se está", f: "está (present of estar) with 'se': 'stays'. estoy, estás, está, estamos, estáis, están."}
          - {w: "quedará", f: "quedar- + -á → quedar (to remain), future, it. Future endings: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "viere", f: "vi- + -ere → ver (to see), future subjunctive, he: 'whoever may see'. viere, vieres, viere, viéremos, viereis, vieren. Modern 'vea'."}
