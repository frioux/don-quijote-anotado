        note: "The paradox 'what he valued least and prized most' sums up Anselmo: he treasured Camila's honor yet put it at risk for an experiment."
      - es: "Fuese luego a ver a Lotario, y hallóle en su casa; abrazáronse los dos, y el uno preguntó por las nuevas de su vida o de su muerte."
        literal: "Went-off-himself at-once to see [to] Lotario, and found-him in his house; embraced-each-other the two, and the one asked for the news of his life or of his death."
        ormsby: "He went at once to see Lothario, and found him at home; they embraced each other, and Anselmo asked for the tidings of his life or his death."
