      - es: "y si he tardado en descubrirte esta verdad, ha sido por ver si era algún liviano antojo suyo, o si lo hacía por probarme y ver si eran con propósito firme tratados los amores que, con tu licencia, con ella he comenzado."
        literal: "and if I-have delayed in revealing-to-you this truth, it-has been for to-see if it-was some light whim hers, or if it she-did for to-test-me and see if were with purpose firm treated the loves that, with your license, with her I-have begun."
        ormsby: "and if I have been slow to reveal this fact to thee, it was in order to see if it were some light caprice of hers, or if she sought to try me and ascertain if the love I began to make to her with thy permission was made with a serious intention."
