  - sentences:
      - es: "»Y así, con el gusto que de sus cosas tenía, y más, teniendo por entendido que sus deseos y escritos a ella se encaminaban, y que ella era la verdadera Clori, le rogó que si otro soneto o otros versos sabía, los dijese:"
        literal: "And so, with the pleasure that from his things she-had, and more, holding as understood that his desires and writings to her were-directed, and that she was the true Clori, him she-begged that if another sonnet or other verses he-knew, them he-should-say:"
        ormsby: "and so taking delight in anything that was his, and knowing that his thoughts and writings had her for their object, and that she herself was the real Chloris, she asked him to repeat some other sonnet or verses if he recollected any."
        vocab:
          - {w: "gusto", d: "pleasure, delight"}
          - {w: "sus cosas", d: "his things, whatever was his (here Lotario's)"}
          - {w: "tener por entendido", d: "to take as understood, know"}
          - {w: "encaminarse a", d: "to be directed toward, aimed at"}
        diagram:
          - s: "le rogó"
            r: "main verb: she (Camila) asked him (Lotario)"
            under:
              - {s: "Y así, con el gusto que de sus cosas tenía", r: "why: and so, with the pleasure she took in his things"}
              - s: "y más, teniendo por entendido"
                r: "why, 2: and more, knowing"
                under:
                  - {s: "que sus deseos y escritos a ella se encaminaban", r: "what she knew, 1: that his desires and writings were aimed at her"}
                  - {s: "y que ella era la verdadera Clori", r: "what she knew, 2: and that she was the real Clori"}
              - s: "que si otro soneto o otros versos sabía, los dijese"
                r: "what she asked: that if he knew another sonnet or other verses, he should recite them"
        forms:
          - {w: "tenía", f: "ten- + -ía → tener (to have), imperfect, she. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "teniendo", f: "gerund of tener (to hold): 'holding, knowing'."}
          - {w: "se encaminaban", f: "encamin- + -aban → encaminarse (to be directed), imperfect, they. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "rogó", f: "rog- + -ó → rogar (to ask), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "sabía", f: "sab- + -ía → saber (to know), imperfect, he. Same -ía imperfect."}
          - {w: "dijese", f: "dij- + -ese → decir (to say), imperfect subjunctive (-se form), he, after 'rogó que'. dijese, dijeses, dijese, dijésemos, dijeseis, dijesen."}
        note: "The subject switches without warning from Anselmo to Camila: it is Camila, knowing she is the real Clori, who asks for another poem."
  - sentences:
      - es: "»—Sí sé —respondió Lotario—, pero no creo que es tan bueno como el primero, o, por mejor decir, menos malo. Y podréislo bien juzgar, pues es éste:"
        literal: "Yes I-know, answered Lotario, but not I-believe that it-is as good as the first, or, for better to-say, less bad. And you-will-be-able-it well to-judge, since it-is this:"
        ormsby: "“I do,” replied Lothario, “but I do not think it as good as the first one, or, more correctly speaking, less bad; but you can easily judge, for it is this."
        vocab:
          - {w: "por mejor decir", d: "or rather, to put it better"}
          - {w: "juzgar", d: "to judge"}
        diagram:
          - s: "Sí sé"
            r: "main verb 1: yes, I know (one)"
            under:
              - {s: "—respondió Lotario—", r: "speech tag: answered Lotario"}
          - s: "pero no creo"
            r: "main verb 2: but I do not think"
            under:
              - {s: "que es tan bueno como el primero, o, por mejor decir, menos malo", r: "what I do not think: that it is as good as the first, or rather, less bad"}
          - s: "Y podréislo bien juzgar"
            r: "main verb 3: and you will be able to judge it well"
            under:
              - {s: "pues es éste", r: "why: since this is it"}
        forms:
          - {w: "sé", f: "saber (to know), present, I, with an accent to tell it from 'se'. sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "creo", f: "cre- + -o → creer (to believe), present, I. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
          - {w: "es", f: "ser (to be), present, it. soy, eres, es, somos, sois, son. Indicative after 'no creo que', where modern Spanish prefers the subjunctive 'sea'."}
          - {w: "podréislo", f: "podr- + -éis → poder (to be able), future, you (plural: Anselmo and Camila), + lo (it); modern 'lo podréis'. Future endings -é, -ás, -á, -emos, -éis, -án on the shortened stem podr-."}
          - {w: "éste", f: "'this one', with the old accent that marks the pronoun use."}
