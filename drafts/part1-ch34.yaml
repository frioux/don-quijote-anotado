          - {w: "viene", f: "vien- + -e → venir (to come), present, he. vengo, vienes, viene, venimos, venís, vienen."}
          - {w: "pongas", f: "pong- + -as → poner (to put), present subjunctive, you, after 'antes que'. ponga, pongas, ponga, pongamos, pongáis, pongan."}
          - {w: "el tuyo", f: "'yours', masculine to match 'propósito'."}
          - {w: "hará", f: "har- + -á → hacer (to do), future, he. haré, harás, hará, haremos, haréis, harán."}
