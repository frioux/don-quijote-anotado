          - {w: "echó", f: "ech- + -ó → echar (to throw), preterite, he; 'echar de ver' = to notice. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "faltaba, estimaba", f: "falt- + -aba → faltar (to be missing), estim- + -aba → estimar (to prize), imperfect, it / he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
