      - es: "Lloró, rogó, ofreció, aduló, porfió, y fingió Lotario con tantos sentimientos, con muestras de tantas veras, que dio al través con el recato de Camila y vino a triunfar de lo que menos se pensaba y más deseaba. »Rindióse Camila, Camila se rindió;"
