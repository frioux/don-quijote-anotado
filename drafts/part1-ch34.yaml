          - {w: "dijese", f: "dij- + -ese → decir (to say), imperfect subjunctive (-se form), he, after 'rogó' with 'que' dropped. dijese, dijeses, dijese, dijésemos, dijeseis, dijesen."}
          - {w: "había compuesto", f: "había (imperfect of haber) + compuesto, the irregular participle of componer (to compose)."}
