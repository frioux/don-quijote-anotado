  - sentences:
      - es: "»—En cuanto poetas, no la dicen —respondió Lotario—; mas, en cuanto enamorados, siempre quedan tan cortos como verdaderos."
        literal: "In as-much [as] poets, not it they-tell, answered Lotario; but, in as-much [as] lovers, always they-remain as short as truthful."
        ormsby: "“As poets they do not tell the truth,” replied Lothario; “but as lovers they are not more defective in expression than they are truthful.”"
        vocab:
          - {w: "en cuanto", d: "as, in so far as (being)"}
          - {w: "quedar corto", d: "to fall short, say too little"}
        diagram:
          - s: "no la dicen"
            r: "main verb 1: they do not tell it (the truth)"
            under:
              - {s: "En cuanto poetas", r: "as what: as poets"}
              - {s: "—respondió Lotario—", r: "speech tag: answered Lotario"}
          - s: "siempre quedan tan cortos como verdaderos"
