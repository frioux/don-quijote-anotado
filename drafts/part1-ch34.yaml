          - {w: "quisiese", f: "quis- + -iese → querer (to want), imperfect subjunctive (-se form), he. quisiese, quisieses, quisiese, quisiésemos, quisieseis, quisiesen."}
  - sentences:
      - es: "»—Aunque la conociera —respondió Lotario—, no encubriera yo nada, porque cuando algún amante loa a su dama de hermosa y la nota de cruel, ningún oprobrio hace a su buen crédito."
        literal: "Even-if her she-knew, answered Lotario, not would-hide I nothing, because when some lover praises [to] his lady as beautiful and her notes as cruel, no shame does to her good repute."
        ormsby: "“Even did she know her,” returned Lothario, “I would hide nothing, for when a lover praises his lady’s beauty, and charges her with cruelty, he casts no imputation upon her fair name;"
        vocab:
          - {w: "encubrir", d: "to hide, conceal"}
          - {w: "loar", d: "to praise (literary)"}
          - {w: "loar de hermosa", d: "to praise as beautiful"}
          - {w: "notar de", d: "to brand as, charge with"}
          - {w: "oprobrio", d: "= oprobio (shame, disgrace), old spelling"}
          - {w: "crédito", d: "reputation, good name"}
        diagram:
          - s: "no encubriera yo nada"
            r: "main verb: I would hide nothing"
            under:
              - {s: "Aunque la conociera", r: "concession: even if she knew her"}
              - {s: "—respondió Lotario—", r: "speech tag: answered Lotario"}
              - s: "porque ... ningún oprobrio hace a su buen crédito"
                r: "why: because he does no harm to her good name"
                under:
                  - {s: "cuando algún amante loa a su dama de hermosa y la nota de cruel", r: "when: when a lover praises his lady as beautiful and calls her cruel"}
        forms:
          - {w: "conociera", f: "conoc- + -iera → conocer (to know), imperfect subjunctive (-ra form), she, after 'aunque' for something untrue. The -ra form of -er and -ir verbs: -iera, -ieras, -iera, -iéramos, -ierais, -ieran."}
          - {w: "respondió", f: "respond- + -ió → responder (to answer), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "encubriera", f: "encubr- + -iera → encubrir (to hide), imperfect subjunctive (-ra form), I, used as a conditional: 'I would hide'. Same -iera endings."}
          - {w: "loa, nota", f: "lo- + -a → loar (to praise), not- + -a → notar (to brand), present, he. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "hace", f: "hac- + -e → hacer (to do), present, he. hago, haces, hace, hacemos, hacéis, hacen."}
          - {w: "ningún, algún, buen", f: "ninguno, alguno, bueno clipped before a masculine singular noun."}
      - es: "Pero, sea lo que fuere, lo que sé decir, que ayer hice un soneto a la ingratitud desta Clori, que dice ansí: Soneto"
        literal: "But, be-it that which it-may-be, that which I-know to-say, that yesterday I-made a sonnet to the ingratitude of-this Clori, which says thus: Sonnet"
        ormsby: "at any rate, all I can say is that yesterday I made a sonnet on the ingratitude of this Chloris, which goes thus:"
        vocab:
          - {w: "sea lo que fuere", d: "be that as it may, whatever the case"}
          - {w: "lo que sé decir", d: "what I can tell you"}
          - {w: "ingratitud", d: "ingratitude; in love poetry, the lady's coldness to her lover"}
          - {w: "desta", d: "= de esta (of this)"}
          - {w: "ansí", d: "= así (thus), old form"}
          - {w: "soneto", d: "sonnet, fourteen eleven-syllable lines in two quatrains and two tercets"}
