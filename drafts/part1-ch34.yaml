        note: "Leonela means rape, which in the honor code of the time was thought worse for a woman than death; hence Lucrecia, mentioned below."
      - es: "¡Mal haya mi señor Anselmo, que tanto mal ha querido dar a este desuellacaras en su casa!"
        literal: "Ill may-have my lord Anselmo, who so-much bad has wanted to-give to this flay-faces in his house!"
        ormsby: "Ill betide my master, Anselmo, for giving such authority in his house to this shameless fellow!"
        vocab:
          - {w: "¡mal haya!", d: "curse on, ill betide"}
          - {w: "desuellacaras", d: "shameless rogue, scoundrel (literally 'face-flayer', a barber who cuts his customers)"}
        diagram:
          - s: "¡Mal haya mi señor Anselmo"
            r: "main verb: a curse on my master Anselmo"
            under:
              - {s: "que tanto mal ha querido dar a este desuellacaras en su casa!", r: "describes Anselmo: who has chosen to give this scoundrel so much harmful freedom in his house"}
        forms:
          - {w: "haya", f: "hay- + -a → haber (to have), present subjunctive, as a wish: 'may (he) have ill'. haya, hayas, haya, hayamos, hayáis, hayan."}
          - {w: "ha querido", f: "ha (present of haber) + querido (participle of querer, to want): 'has wanted'."}
          - {w: "desuellacaras", f: "desuella (from desollar, to flay; o → ue) + caras (faces): a compound noun like 'sacacorchos'."}
        note: "Leonela's 'tanto mal' plays on Anselmo's 'mal': he gave Lotario the run of the house, with harm as the result."
      - es: "Y ya, señora, que le mates, como yo pienso que quieres hacer, ¿qué hemos de hacer dél después de muerto?"
        literal: "And granted, lady, that him you-kill, as I think that you-want to-do, what have-we to do with-him after of dead?"
        ormsby: "And supposing you kill him, señora, as I suspect you mean to do, what shall we do with him when he is dead?”"
        vocab:
