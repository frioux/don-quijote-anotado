      - es: "Vuelve la noche, y vuelvo al triste cuento, y siempre hallo, en mi mortal porfía, al cielo, sordo; a Clori, sin oídos."
        literal: "Returns the night, and I-return to-the sad tale, and always I-find, in my mortal persistence, [to] the heaven, deaf; [to] Clori, without ears."
