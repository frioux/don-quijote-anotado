            r: "main phrase: what I can say (is)"
            under:
              - {s: "sea lo que fuere", r: "aside: be that as it may"}
              - s: "que ayer hice un soneto a la ingratitud desta Clori"
                r: "what I can say: that yesterday I wrote a sonnet on this Clori's ingratitude"
                under:
                  - {s: "que dice ansí", r: "describes 'soneto': which goes thus"}
          - {s: "Soneto", r: "heading of the poem that follows"}
        forms:
          - {w: "sea", f: "ser (to be), present subjunctive, it: 'be it'. sea, seas, sea, seamos, seáis, sean."}
          - {w: "fuere", f: "fu- + -ere → ser (to be), future subjunctive, it: 'whatever it may be'. fuere, fueres, fuere, fuéremos, fuereis, fueren. Modern Spanish says 'sea lo que sea'."}
          - {w: "sé", f: "saber (to know), present, I, with an accent to tell it from 'se'. sé, sabes, sabe, sabemos, sabéis, saben. 'saber decir' = to be able to say."}
          - {w: "hice", f: "hic- + -e → hacer (to make), preterite, I. Irregular: hice, hiciste, hizo, hicimos, hicisteis, hicieron."}
          - {w: "desta, ansí", f: "desta = de + esta (of this); ansí = así (thus)."}
        ormsby_note: "This sonnet, like that in Chapter XXIII, was repeated by Cervantes in the play of the Casa de los Zelos, Jornada 2."
  - sentences:
      - es: "En el silencio de la noche, cuando ocupa el dulce sueño a los mortales, la pobre cuenta de mis ricos males estoy al cielo y a mi Clori dando."
        literal: "In the silence of the night, when occupies the sweet sleep [to] the mortals, the poor account of my rich woes I-am to-the heaven and to my Clori giving."
        ormsby: "“At midnight, in the silence, when the eyes / Of happier mortals balmy slumbers close, / The weary tale of my unnumbered woes / To Chloris and to Heaven is wont to rise."
        ormsby_match: false
        vocab:
          - {w: "ocupar", d: "to occupy, take hold of"}
          - {w: "sueño", d: "sleep (also 'dream')"}
          - {w: "mortales", d: "mortals, human beings"}
          - {w: "cuenta", d: "account, tally, tale"}
          - {w: "males", d: "woes, sufferings"}
        diagram:
          - s: "la pobre cuenta de mis ricos males estoy al cielo y a mi Clori dando"
            r: "main verb: I am giving the poor account of my rich woes to heaven and my Clori"
            under:
              - {s: "En el silencio de la noche", r: "when: in the silence of the night"}
              - {s: "cuando ocupa el dulce sueño a los mortales", r: "when: when sweet sleep holds mortals"}
        forms:
          - {w: "ocupa", f: "ocup- + -a → ocupar (to occupy), present, it (sleep). The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "estoy ... dando", f: "estoy (present of estar, I) + dando (gerund of dar, to give): 'I am giving'. estar: estoy, estás, está, estamos, estáis, están. The verse splits the two parts and puts the object first."}
          - {w: "pobre ... ricos", f: "a play of opposites: a poor account of rich (abundant) woes; adjectives agree with 'cuenta' (feminine) and 'males' (masculine plural)."}
        note: "First quatrain of the sonnet: night. The four stanzas follow the lover's grief through night, dawn, noon and night again."
      - es: "Y, al tiempo cuando el sol se va mostrando por las rosadas puertas orientales, con suspiros y acentos desiguales, voy la antigua querella renovando."
