      - es: "y, con esto, todos los escalones que Camila bajaba hacia el centro de su menosprecio, los subía, en la opinión de su marido, hacia la cumbre de la virtud y de su buena fama. »Sucedió en esto que, hallándose una vez, entre otras, sola Camila con su doncella, le dijo:"
