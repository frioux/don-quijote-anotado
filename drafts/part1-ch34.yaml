      - es: "y no quiero que precipitosamente corras a hacer alguna venganza, pues no está aún cometido el pecado sino con pensamiento, y podría ser que, desde éste hasta el tiempo de ponerle por obra, se mudase el de Camila y naciese en su lugar el arrepentimiento."
