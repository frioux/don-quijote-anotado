  - sentences:
      - es: "Yo sé que muero; y si no soy creído, es más cierto el morir, como es más cierto verme a tus pies, ¡oh bella ingrata!, muerto, antes que de adorarte arrepentido."
        literal: "I know that I-die; and if not I-am believed, is more certain the dying, as is more certain to-see-me at your feet, oh beautiful ungrateful-one!, dead, before than of adoring-you repentant."
        ormsby: "“I know that I am doomed; death is to me / As certain as that thou, ungrateful fair, / Dead at thy feet shouldst see me lying, ere / My heart repented of its love for thee."
        ormsby_match: false
        vocab:
          - {w: "creído", d: "believed"}
          - {w: "ingrata", d: "ungrateful woman; in love poetry, the lady who does not return love"}
          - {w: "arrepentido de", d: "repentant of, sorry for"}
          - {w: "adorar", d: "to adore, worship"}
        diagram:
          - s: "Yo sé"
            r: "main verb 1: I know"
            under:
              - {s: "que muero", r: "what I know: that I am dying"}
          - s: "es más cierto el morir"
            r: "main verb 2: dying is all the more certain"
            under:
              - {s: "y si no soy creído", r: "condition: and if I am not believed"}
              - s: "como es más cierto verme a tus pies"
                r: "comparison: as it is more certain to see me at your feet"
                under:
                  - {s: "¡oh bella ingrata!", r: "address: O fair ungrateful one"}
                  - {s: "muerto, antes que de adorarte arrepentido", r: "how: dead, rather than repentant of adoring you"}
        forms:
          - {w: "sé", f: "saber (to know), present, I. sé, sabes, sabe, sabemos, sabéis, saben."}
          - {w: "muero", f: "muer- + -o → morir (to die), present, I. The o of the stem becomes ue when stressed: muero, mueres, muere, morimos, morís, mueren."}
          - {w: "soy creído", f: "soy (present of ser, I) + creído (participle of creer, to believe): passive 'I am believed'."}
          - {w: "el morir", f: "infinitive used as a noun with 'el': 'dying'."}
          - {w: "verme, adorarte", f: "infinitives ver (to see) + me, adorar (to adore) + te."}
          - {w: "muerto, arrepentido", f: "participles of morir (irregular: muerto) and arrepentirse (to repent), masculine to match the speaker."}
      - es: "Podré yo verme en la región de olvido, de vida y gloria y de favor desierto, y allí verse podrá en mi pecho abierto cómo tu hermoso rostro está esculpido."
        literal: "I-will-be-able I to-see-myself in the region of oblivion, of life and glory and of favor deserted, and there be-seen will-be-able in my breast open how your beautiful face is sculpted."
        ormsby: "If buried in oblivion I should be, / Bereft of life, fame, favour, even there / It would be found that I thy image bear / Deep graven in my breast for all to see."
        ormsby_match: false
        vocab:
          - {w: "región de olvido", d: "the land of oblivion, i.e. death"}
          - {w: "desierto de", d: "deprived of, bereft of"}
          - {w: "favor", d: "favor, the lady's kindness"}
          - {w: "rostro", d: "face"}
          - {w: "esculpido", d: "sculpted, engraved"}
        diagram:
          - s: "Podré yo verme en la región de olvido"
            r: "main verb 1: I may find myself in the land of oblivion"
            under:
              - {s: "de vida y gloria y de favor desierto", r: "describes 'yo': bereft of life, glory and favor"}
          - s: "y allí verse podrá"
            r: "main verb 2: and there it can be seen"
            under:
              - {s: "en mi pecho abierto", r: "where: in my opened breast"}
