        forms:
          - {w: "dé", f: "d- + -é → dar (to give), present subjunctive, it, as a negative command: 'let it not give'. dé, des, dé, demos, deis, den; the accent tells 'dé' from 'de' (of)."}
          - {w: "mía", f: "'my', feminine to match 'señora', placed after the noun."}
