          - {w: "desmentir", d: "to give the lie to; here: to mislead, throw off the scent"}
          - {w: "afligirse", d: "to grieve, be distressed"}
          - {w: "venir a + infinitive", d: "to come to, end up"}
          - {w: "en + gerund", d: "as soon as"}
          - {w: "acabar de", d: "here: to be completely, finish being"}
          - {w: "del todo", d: "entirely"}
