        ormsby: "Had not Camilla, however, been informed beforehand by Lothario that this love for Chloris was a pretence, and that he himself had told Anselmo of it in order to be able sometimes to give utterance to the praises of Camilla herself, no doubt she would have fallen into the despairing toils of jealousy;"
