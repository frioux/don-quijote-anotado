  - sentences:
      - es: "»Volvió de allí a pocos días Anselmo a su casa, y no echó de ver lo que faltaba en ella, que era lo que en menos tenía y más estimaba."
        literal: "Returned from there at few days Anselmo to his house, and not he-noticed that which was-missing in it, which was that which in less he-held and more he-esteemed."
        ormsby: "A few days later Anselmo returned to his house and did not perceive what it had lost, that which he so lightly treated and so highly prized."
