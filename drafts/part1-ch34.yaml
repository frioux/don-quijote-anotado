  - sentences:
      - es: "»Bien le pareció el soneto a Camila, pero mejor a Anselmo, pues le alabó, y dijo que era demasiadamente cruel la dama que a tan claras verdades no correspondía. A lo que dijo Camila:"
        literal: "Well to-her seemed the sonnet to Camila, but better to Anselmo, since it he-praised, and said that was excessively cruel the lady who to such clear truths not responded. To which said Camila:"
        ormsby: "The sonnet pleased Camilla, and still more Anselmo, for he praised it and said the lady was excessively cruel who made no return for sincerity so manifest. On which Camilla said,"
        vocab:
          - {w: "parecer bien", d: "to seem good, please"}
          - {w: "alabar", d: "to praise"}
          - {w: "demasiadamente", d: "excessively, too (old form; modern 'demasiado')"}
          - {w: "corresponder a", d: "to return, repay (love, affection)"}
        diagram:
          - s: "Bien le pareció el soneto a Camila"
            r: "main verb 1: the sonnet pleased Camila"
            under:
              - {s: "pero mejor a Anselmo", r: "but (pleased) Anselmo more"}
              - s: "pues le alabó, y dijo"
                r: "why: since he praised it and said"
                under:
                  - s: "que era demasiadamente cruel la dama"
                    r: "what he said: that the lady was too cruel"
                    under:
                      - {s: "que a tan claras verdades no correspondía", r: "describes 'dama': who did not respond to such plain truths"}
          - {s: "A lo que dijo Camila", r: "main verb 2: to which Camila said"}
        forms:
          - {w: "pareció", f: "parec- + -ió → parecer (to seem), preterite, it. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "alabó", f: "alab- + -ó → alabar (to praise), preterite, he. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, he / she. Irregular: dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
          - {w: "demasiadamente", f: "demasiada (excessive) + -mente → adverb."}
          - {w: "correspondía", f: "correspond- + -ía → corresponder (to respond), imperfect, she. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
        note: "Anselmo's praise is ironic: he is praising a poem addressed, unknown to him, to his own wife, and calling her cruel for not returning love."
