        forms:
          - {w: "Podré, podrá", f: "podr- + -é / -á → poder (to be able), future, I / it. Future endings -é, -ás, -á, -emos, -éis, -án on the shortened stem podr-."}
          - {w: "verse podrá", f: "verse (to be seen, passive 'se') before 'podrá' for the rhyme and metre; prose order 'podrá verse'."}
          - {w: "desierto", f: "masculine to match the speaker: 'bereft'."}
          - {w: "abierto, esculpido", f: "participles of abrir (irregular: abierto) and esculpir (to carve), masculine to match 'pecho' and 'rostro'."}
          - {w: "cómo", f: "with an accent because it introduces an indirect question: 'how'."}
        note: "An old conceit: the beloved's image is engraved in the lover's heart and would be found there if his breast were opened after death."
      - es: "Que esta reliquia guardo para el duro trance que me amenaza mi porfía, que en tu mismo rigor se fortalece."
