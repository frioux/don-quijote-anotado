            r: "main verb: what are we to do with him once he is dead"
            under:
              - {s: "Y ya, señora, que le mates", r: "condition: and supposing, my lady, you kill him"}
              - {s: "como yo pienso que quieres hacer", r: "as I think you mean to do"}
        forms:
          - {w: "mates", f: "mat- + -es → matar (to kill), present subjunctive, you, after 'ya que' (supposing). The present subjunctive of -ar verbs: -e, -es, -e, -emos, -éis, -en."}
          - {w: "pienso", f: "piens- + -o → pensar (to think), present, I. pienso, piensas, piensa, pensamos, pensáis, piensan."}
          - {w: "hemos de hacer", f: "hemos (present of haber, we) + de + hacer: 'are we to do'. he, has, ha, hemos, habéis, han."}
          - {w: "dél", f: "= de + él."}
          - {w: "muerto", f: "irregular participle of morir (to die): 'dead'."}
  - sentences:
      - es: "»—¿Qué, amiga? —respondió Camila—: dejarémosle para que Anselmo le entierre, pues será justo que tenga por descanso el trabajo que tomare en poner debajo de la tierra su misma infamia."
        literal: "What, friend? answered Camila: we-will-leave-him so-that Anselmo him may-bury, since it-will-be just that he-may-hold as rest the labor that he-may-take in putting under the earth his own infamy."
        ormsby: "“What, my friend?” replied Camilla, “we shall leave him for Anselmo to bury him; for in reason it will be to him a light labour to hide his own infamy under ground."
        vocab:
          - {w: "enterrar", d: "to bury"}
          - {w: "tener por descanso", d: "to count as a relief, find restful"}
          - {w: "infamia", d: "infamy, disgrace"}
        diagram:
          - {s: "¿Qué, amiga?", r: "question: what (shall we do), my friend"}
          - {s: "—respondió Camila—", r: "speech tag: answered Camila"}
          - s: "dejarémosle"
            r: "main verb: we will leave him"
            under:
              - {s: "para que Anselmo le entierre", r: "purpose: for Anselmo to bury"}
              - s: "pues será justo"
                r: "why: since it will be fitting"
                under:
                  - s: "que tenga por descanso el trabajo"
                    r: "what: that he count as a rest the labor"
                    under:
                      - {s: "que tomare en poner debajo de la tierra su misma infamia", r: "describes 'trabajo': which he may take in putting his own disgrace underground"}
        forms:
          - {w: "dejarémosle", f: "dejar- + -emos → dejar (to leave), future, we, + le (him); modern 'le dejaremos'. Future endings: -é, -ás, -á, -emos, -éis, -án."}
          - {w: "entierre", f: "entierr- + -e → enterrar (to bury), present subjunctive, he, after 'para que'. The e becomes ie when stressed: entierre, entierres, entierre, enterremos, enterréis, entierren."}
          - {w: "será", f: "ser- + -á → ser (to be), future, it."}
          - {w: "tenga", f: "teng- + -a → tener (to hold), present subjunctive, he. tenga, tengas, tenga, tengamos, tengáis, tengan."}
          - {w: "tomare", f: "tom- + -are → tomar (to take), future subjunctive, he. The future subjunctive of -ar verbs: -are, -ares, -are, -áremos, -areis, -aren. Modern 'tome'."}
        note: "Camila's line is a double game: Anselmo, listening, hears that burying Lotario would bury his own disgrace."
      - es: "Llámale, acaba, que todo el tiempo que tardo en tomar la debida venganza de mi agravio parece que ofendo a la lealtad que a mi esposo debo."
        literal: "Call-him, finish, for all the time that I-delay in taking the due vengeance of my wrong it-seems that I-offend [to] the loyalty that to my husband I-owe."
        ormsby: "Summon him, make haste, for all the time I delay in taking vengeance for my wrong seems to me an offence against the loyalty I owe my husband.”"
        vocab:
          - {w: "¡acaba!", d: "hurry up! get on with it!"}
          - {w: "tardar en", d: "to take time to, delay in"}
          - {w: "debido", d: "due, rightful"}
          - {w: "lealtad", d: "loyalty"}
        diagram:
          - {s: "Llámale, acaba", r: "main verbs: call him, hurry"}
          - s: "que ... parece que ofendo a la lealtad"
            r: "why: for it seems I offend the loyalty"
            under:
              - {s: "todo el tiempo que tardo en tomar la debida venganza de mi agravio", r: "when: all the time I delay taking due revenge for my wrong"}
              - {s: "que a mi esposo debo", r: "describes 'lealtad': that I owe my husband"}
        forms:
          - {w: "Llámale", f: "llama, the tú command of llamar (to call), + le (him), accent added."}
          - {w: "acaba", f: "acabar (to finish), command, you (tú)."}
          - {w: "tardo, ofendo", f: "tard- + -o → tardar (to delay), ofend- + -o → ofender (to offend), present, I. The present of -ar verbs: -o, -as, -a, -amos, -áis, -an."}
          - {w: "debida", f: "participle of deber (to owe), feminine to match 'venganza'."}
          - {w: "debo", f: "deb- + -o → deber (to owe), present, I. The present of -er verbs: -o, -es, -e, -emos, -éis, -en."}
  - sentences:
      - es: "»Todo esto escuchaba Anselmo, y, a cada palabra que Camila decía, se le mudaban los pensamientos;"
        literal: "All this listened-to Anselmo, and, at each word that Camila said, to-him changed the thoughts;"
        ormsby: "Anselmo was listening to all this, and every word that Camilla uttered made him change his mind;"
        vocab:
          - {w: "mudarse", d: "to change"}
        diagram:
          - {s: "Todo esto escuchaba Anselmo", r: "main verb 1: Anselmo listened to all this"}
          - s: "se le mudaban los pensamientos"
            r: "main verb 2 (after 'y'): his thoughts changed"
            under:
              - {s: "a cada palabra que Camila decía", r: "when: at every word Camila said"}
        forms:
          - {w: "escuchaba", f: "escuch- + -aba → escuchar (to listen to), imperfect, he. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "decía", f: "dec- + -ía → decir, imperfect, she. The imperfect of -er and -ir verbs: -ía, -ías, -ía, -íamos, -íais, -ían."}
          - {w: "se le mudaban", f: "mud- + -aban → mudarse (to change), imperfect, they, + le (his): 'his thoughts changed'. Same -aba imperfect."}
      - es: "mas, cuando entendió que estaba resuelta en matar a Lotario, quiso salir y descubrirse, porque tal cosa no se hiciese;"
        literal: "but, when he-understood that she-was resolved on killing [to] Lotario, he-wanted to-go-out and reveal-himself, so-that such thing not might-be-done;"
        ormsby: "but when he heard that it was resolved to kill Lothario his first impulse was to come out and show himself to avert such a disaster;"
        vocab:
          - {w: "resuelto en", d: "resolved on, determined to"}
          - {w: "descubrirse", d: "to show oneself, reveal oneself"}
        diagram:
          - s: "quiso salir y descubrirse"
            r: "main verb (after 'mas'): he wanted to come out and show himself"
            under:
              - {s: "cuando entendió que estaba resuelta en matar a Lotario", r: "when: when he understood she was resolved to kill Lotario"}
              - {s: "porque tal cosa no se hiciese", r: "purpose: so that such a thing would not be done"}
        forms:
          - {w: "entendió", f: "entend- + -ió → entender (to understand), preterite, he. The preterite of -er and -ir verbs: -í, -iste, -ió, -imos, -isteis, -ieron."}
          - {w: "resuelta", f: "irregular participle of resolver (to resolve), feminine for Camila."}
          - {w: "quiso", f: "quis- + -o → querer (to want), preterite, he. quise, quisiste, quiso, quisimos, quisisteis, quisieron."}
          - {w: "se hiciese", f: "hic- + -iese → hacer (to do), imperfect subjunctive (-se form), with passive 'se'. hiciese, hicieses, hiciese, hiciésemos, hicieseis, hiciesen."}
      - es: "pero detúvole el deseo de ver en qué paraba tanta gallardía y honesta resolución, con propósito de salir a tiempo que la estorbase."
        literal: "but held-him-back the desire of seeing in what ended so-much gallantry and chaste resolution, with purpose of going-out at time that it he-might-hinder."
        ormsby: "but in his anxiety to see the issue of a resolution so bold and virtuous he restrained himself, intending to come forth in time to prevent the deed."
        vocab:
          - {w: "detener", d: "to hold back, stop"}
          - {w: "parar en", d: "to end in, come to"}
          - {w: "gallardía", d: "boldness, spirit, gallantry"}
          - {w: "estorbar", d: "to prevent, hinder"}
        diagram:
          - s: "pero detúvole el deseo"
            r: "main verb: but the desire held him back"
            under:
              - {s: "de ver en qué paraba tanta gallardía y honesta resolución", r: "desire of what: to see what such spirit and chaste resolve would come to"}
              - {s: "con propósito de salir a tiempo que la estorbase", r: "intending: to come out in time to stop it"}
        forms:
          - {w: "detúvole", f: "detuv- + -o → detener (to hold back), preterite, it, + le (him); modern 'le detuvo'. detener goes like tener: detuve, detuviste, detuvo, detuvimos, detuvisteis, detuvieron."}
          - {w: "paraba", f: "par- + -aba → parar (to end up), imperfect, it. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "estorbase", f: "estorb- + -ase → estorbar (to prevent), imperfect subjunctive (-se form), he. The -se form of -ar verbs: -ase, -ases, -ase, -ásemos, -aseis, -asen."}
  - sentences:
      - es: "»Tomóle en esto a Camila un fuerte desmayo, y, arrojándose encima de una cama que allí estaba, comenzó Leonela a llorar muy amargamente y a decir:"
        literal: "Took-her at this [to] Camila a strong faint, and, throwing-herself on-top of a bed that there was, began Leonela to weep very bitterly and to say:"
        ormsby: "At this moment Camilla, throwing herself upon a bed that was close by, swooned away, and Leonela began to weep bitterly, exclaiming,"
        vocab:
          - {w: "desmayo", d: "faint, swoon"}
          - {w: "tomarle a uno", d: "to come over someone (of a fit, a faint)"}
          - {w: "arrojarse", d: "to throw oneself"}
          - {w: "amargamente", d: "bitterly"}
        diagram:
          - s: "Tomóle en esto a Camila un fuerte desmayo"
            r: "main verb 1: at this a strong faint came over Camila"
            under:
              - {s: "arrojándose encima de una cama que allí estaba", r: "how: throwing herself on a bed that was there"}
          - {s: "comenzó Leonela a llorar muy amargamente y a decir", r: "main verb 2 (after 'y'): Leonela began to weep very bitterly and to say"}
        forms:
          - {w: "Tomóle", f: "tom- + -ó → tomar (to take), preterite, it, + le (her), doubled by 'a Camila'; modern 'le tomó'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "arrojándose", f: "gerund of arrojarse (to throw oneself), accent added. It describes Camila, though it sits next to Leonela's clause."}
          - {w: "estaba", f: "est- + -aba → estar (to be), imperfect, it. The imperfect of -ar verbs: -aba, -abas, -aba, -ábamos, -abais, -aban."}
          - {w: "comenzó", f: "comenz- + -ó → comenzar (to begin), preterite, she. Same -ar preterite."}
          - {w: "amargamente", f: "amarga (bitter) + -mente → adverb."}
  - sentences:
      - es: "»—¡Ay, desdichada de mí si fuese tan sin ventura que se me muriese aquí entre mis brazos la flor de la honestidad del mundo, la corona de las buenas mujeres, el ejemplo de la castidad...!"
        literal: "Ah, unhappy of me if I-were so without fortune that on-me might-die here between my arms the flower of the chastity of-the world, the crown of the good women, the example of the chastity...!"
        ormsby: "“Woe is me! that I should be fated to have dying here in my arms the flower of virtue upon earth, the crown of true wives, the pattern of chastity!”"
        vocab:
          - {w: "¡desdichada de mí!", d: "woe is me! (said by a woman)"}
          - {w: "sin ventura", d: "unfortunate, unlucky"}
          - {w: "honestidad", d: "chastity, virtue"}
          - {w: "castidad", d: "chastity"}
        diagram:
          - s: "¡Ay, desdichada de mí"
            r: "main exclamation, no verb: ah, woe is me"
            under:
              - s: "si fuese tan sin ventura"
                r: "condition: if I were so unlucky"
                under:
                  - {s: "que se me muriese aquí entre mis brazos la flor de la honestidad del mundo, la corona de las buenas mujeres, el ejemplo de la castidad...!", r: "result: that the flower of chastity, the crown of good women, the model of purity should die here in my arms"}
        forms:
          - {w: "desdichada", f: "desdichado (unhappy), feminine for Leonela."}
          - {w: "fuese", f: "fu- + -ese → ser (to be), imperfect subjunctive (-se form), I. fuese, fueses, fuese, fuésemos, fueseis, fuesen."}
          - {w: "se me muriese", f: "mur- + -iese → morirse (to die), imperfect subjunctive (-se form), she, + me (on me, to my grief). The o of the stem becomes u: muriese, murieses, muriese, muriésemos, murieseis, muriesen."}
        note: "Leonela's lament uses the same praise Lotario gave Camila earlier ('corona de todas las mujeres buenas'), now as a performance for the hidden husband."
  - sentences:
      - es: "»Con otras cosas a éstas semejantes, que ninguno la escuchara que no la tuviera por la más lastimada y leal doncella del mundo, y a su señora por otra nueva y perseguida Penélope."
        literal: "With other things to these similar, so-that nobody her would-hear who not her would-hold for the most grieved and loyal maid of-the world, and [to] her lady for another new and persecuted Penelope."
        ormsby: "with more to the same effect, so that anyone who heard her would have taken her for the most tenderhearted and faithful handmaid in the world, and her mistress for another persecuted Penelope."
        vocab:
          - {w: "semejante a", d: "similar to"}
          - {w: "lastimado", d: "grieved, distressed"}
          - {w: "doncella", d: "maid, lady's maid"}
          - {w: "Penélope", d: "Penelope, the faithful wife of Ulysses in the Odyssey, who resisted her suitors for twenty years; the model of a chaste wife"}
        diagram:
          - s: "Con otras cosas a éstas semejantes"
            r: "main phrase, verb carried over ('decir'): (she went on) with other things like these"
            under:
              - s: "que ninguno la escuchara"
                r: "result: so that no one would have heard her"
                under:
                  - {s: "que no la tuviera por la más lastimada y leal doncella del mundo", r: "who would not take her for the most grieving and loyal maid in the world"}
                  - {s: "y a su señora por otra nueva y perseguida Penélope", r: "and her mistress for a second, persecuted Penelope"}
        forms:
          - {w: "éstas", f: "'these', feminine plural for 'cosas', with the old accent for the pronoun."}
          - {w: "escuchara, tuviera", f: "escuch- + -ara → escuchar (to hear), tuv- + -iera → tener (to hold), imperfect subjunctive (-ra form), he, used as conditionals: 'would hear', 'would take'. The -ra form of -ar verbs: -ara, -aras, -ara, -áramos, -arais, -aran."}
          - {w: "lastimada", f: "participle of lastimar (to hurt), feminine for Leonela."}
          - {w: "perseguida", f: "participle of perseguir (to persecute), feminine for Penélope."}
      - es: "Poco tardó en volver de su desmayo Camila; y, al volver en sí, dijo:"
        literal: "Little delayed in returning from her faint Camila; and, at-the returning in herself, she-said:"
        ormsby: "Camilla was not long in recovering from her fainting fit and on coming to herself she said,"
        vocab:
          - {w: "volver en sí", d: "to come to, regain consciousness"}
        diagram:
          - s: "Poco tardó en volver de su desmayo Camila"
            r: "main verb 1: Camila was not long in coming out of her faint"
          - s: "dijo"
            r: "main verb 2 (after 'y'): she said"
            under:
              - {s: "al volver en sí", r: "when: on coming to"}
        forms:
          - {w: "tardó", f: "tard- + -ó → tardar (to take time), preterite, she. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "al volver", f: "al + infinitive = 'on (doing)': 'on coming to'."}
          - {w: "sí", f: "'herself' after a preposition; the accent tells it from 'si' (if)."}
          - {w: "dijo", f: "dij- + -o → decir (to say), preterite, she. dije, dijiste, dijo, dijimos, dijisteis, dijeron."}
