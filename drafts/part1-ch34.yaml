  - sentences:
      - es: "»Otro día, estando los tres sobre mesa, rogó Anselmo a Lotario dijese alguna cosa de las que había compuesto a su amada Clori; que, pues Camila no la conocía, seguramente podía decir lo que quisiese."
        literal: "Next day, being the three over table, begged Anselmo [to] Lotario [that] he-should-say some thing of those that he-had composed to his beloved Clori; for, since Camila not her knew, safely he-could say that which he-might-wish."
        ormsby: "The next day as the three were at table Anselmo asked Lothario to recite something of what he had composed for his mistress Chloris; for as Camilla did not know her, he might safely say what he liked."
        vocab:
          - {w: "otro día", d: "the next day"}
          - {w: "sobre mesa", d: "at table, after the meal (cf. 'sobremesa', the talk after dinner)"}
          - {w: "componer", d: "to compose (verses)"}
          - {w: "seguramente", d: "safely, without risk (old sense; modern 'surely')"}
        diagram:
          - s: "rogó Anselmo a Lotario"
            r: "main verb: Anselmo asked Lotario"
            under:
              - {s: "Otro día, estando los tres sobre mesa", r: "when: the next day, the three being at table"}
