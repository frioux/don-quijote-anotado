  - sentences:
      - es: "»—Sábete, Anselmo, que ha muchos días que he andado peleando conmigo mesmo, haciéndome fuerza a no decirte lo que ya no es posible ni justo que más te encubra."
        literal: "Know-yourself, Anselmo, that [it] has many days that I-have gone fighting with-myself same, making-myself force to not tell-you that which already not is possible nor just that more from-you I-may-hide."
        ormsby: "“Know, Anselmo, that for several days past I have been struggling with myself, striving to withhold from thee what it is no longer possible or right that I should conceal from thee."
        vocab:
          - {w: "sábete", d: "know (this), be it known to you (an emphatic 'know')"}
          - {w: "ha muchos días que", d: "for many days now ('ha' = hace)"}
          - {w: "pelear", d: "to fight, struggle"}
          - {w: "hacerse fuerza", d: "to force oneself, restrain oneself"}
          - {w: "encubrir", d: "to hide, conceal"}
        diagram:
          - s: "Sábete"
            r: "main verb: know"
            under:
              - {s: "Anselmo", r: "address"}
              - s: "que ha muchos días que he andado peleando conmigo mesmo"
                r: "what to know: that for many days I have been fighting with myself"
                under:
                  - s: "haciéndome fuerza a no decirte lo"
                    r: "how: forcing myself not to tell you what"
                    under:
                      - {s: "que ya no es posible ni justo que más te encubra", r: "describes 'lo': which it is no longer possible or right that I hide from you"}
        forms:
          - {w: "Sábete", f: "sabe, the tú command of saber (to know), + te (yourself, for emphasis), accent added."}
          - {w: "ha", f: "present of haber, used like 'hace' for time: 'ha muchos días' = many days ago, for many days."}
          - {w: "he andado peleando", f: "he (present of haber, I) + andado (participle of andar) + peleando (gerund of pelear, to fight): 'I have been fighting'. haber: he, has, ha, hemos, habéis, han."}
          - {w: "conmigo mesmo", f: "con + mí fused into 'conmigo' (with me); mesmo = mismo: 'with myself'."}
          - {w: "haciéndome", f: "gerund of hacer (to make) + me, accent added."}
          - {w: "encubra", f: "encubr- + -a → encubrir (to hide), present subjunctive, I, after 'no es posible ni justo que'. The present subjunctive of -er and -ir verbs: -a, -as, -a, -amos, -áis, -an."}
        note: "Lotario now betrays Camila to her husband, believing she has taken another lover; the reader knows the man was Leonela's."
