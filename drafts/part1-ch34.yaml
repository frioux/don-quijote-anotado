          - {w: "se puede temer", f: "pued- + -e → poder (can), present, it, with passive 'se': 'can be feared'. puedo, puedes, puede, podemos, podéis, pueden."}
          - {w: "podrás", f: "podr- + -ás → poder (can), future, you. Future endings -é, -ás, -á, -emos, -éis, -án on the stem podr-."}
        note: "In the honor code of the Spanish stage, a husband who discovered his wife's adultery was expected to take revenge in secret, 'with silence', so as not to publish his shame."
  - sentences:
      - es: "»Absorto, suspenso y admirado quedó Anselmo con las razones de Lotario, porque le cogieron en tiempo donde menos las esperaba oír, porque ya tenía a Camila por vencedora de los fingidos asaltos de Lotario y comenzaba a gozar la gloria del vencimiento."
