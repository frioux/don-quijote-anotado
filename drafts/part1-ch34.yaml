          - {w: "luego", d: "at once, immediately (old sense; modern 'later')"}
          - {w: "abrazarse", d: "to embrace each other"}
          - {w: "preguntar por", d: "to ask about"}
          - {w: "nuevas", d: "news, tidings"}
        diagram:
          - s: "Fuese luego a ver a Lotario"
            r: "main verb 1: he went off at once to see Lotario"
          - {s: "y hallóle en su casa", r: "main verb 2: and found him at home"}
          - {s: "abrazáronse los dos", r: "main verb 3: the two embraced"}
          - s: "y el uno preguntó"
            r: "main verb 4: and the one (Anselmo) asked"
            under:
              - {s: "por las nuevas de su vida o de su muerte", r: "about what: for the news of his life or death"}
        forms:
          - {w: "Fuese", f: "fu- + -e → irse (to go off), preterite, he, with 'se' stuck on the end; modern 'se fue'. ir borrows ser's preterite: fui, fuiste, fue, fuimos, fuisteis, fueron. Cervantes hangs pronouns on a verb that opens its clause."}
          - {w: "hallóle", f: "hall- + -ó → hallar (to find), preterite, he, + le (him); modern 'le halló'. The preterite of -ar verbs: -é, -aste, -ó, -amos, -asteis, -aron."}
          - {w: "abrazáronse", f: "abraz- + -aron → abrazarse (to embrace each other), preterite, they, with 'se' on the end; modern 'se abrazaron'. Same -ar preterite."}
          - {w: "preguntó", f: "pregunt- + -ó → preguntar (to ask), preterite, he. Same -ar preterite."}
        note: "'The news of his life or his death' is Anselmo's way of asking for the verdict: whether Camila has passed the test (life) or failed it (death)."
  - sentences:
      - es: "»—Las nuevas que te podré dar, ¡oh amigo Anselmo! —dijo Lotario—, son de que tienes una mujer que dignamente puede ser ejemplo y corona de todas las mujeres buenas."
